name: UAC Bypass Using Windows Media Player - Process
id: 1d741bc6-bf65-4bf0-bd04-be62a8c543b0
description: |
  Detects a User Account Control (UAC) bypass that abuses an auto-elevated Windows
  binary to run code at high integrity. The rule fires when a High- or System-integrity
  process is EITHER osk.exe executing from the Windows Media Player directory (a
  DLL-hijack of osksupport.dll, the UACMe method-32 pattern) OR cmd.exe launched by the
  Event Viewer MMC snap-in (the eventvwr.msc registry-handler bypass). Both branches let
  a split-token administrator escalate from Medium to High integrity silently. The
  investigation should confirm which branch fired, identify the elevated action that
  followed, and determine whether a registry-handler write or DLL plant set up the bypass.
type: detection
detection_id: 0058b9e5-bcd7-40d4-9205-95ca5a16d7b2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the alert match the rule — either osk.exe running from the Windows Media Player directory, or cmd.exe spawned by the Event Viewer console — at High or System integrity?
  context: The rule fires on one of two distinct branches, and which one fired changes the
    rest of the investigation. Confirm the integrity level is High or System, then note
    which branch fired. An Image of osk.exe under the Windows Media Player program-files
    directory points to the osksupport.dll hijack; an Image of cmd.exe whose ParentCommandLine invokes
    mmc.exe with eventvwr.msc points to the Event Viewer registry-handler bypass. The
    binary, parent, and integrity level together establish the true/false positive call.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
      - IntegrityLevel
- source: template:universal.host_user_context
  question: Is this user and host expected to perform local privilege elevation?
  context: A UAC bypass running under an administrator who routinely elevates on their own
    workstation is far less concerning than the same pattern under a standard user or on a
    server. Knowing whether the account is a local admin and whether the host's function
    involves administrative tooling is often the fastest way to separate a true positive
    from sanctioned activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did the elevated process do? Decode its command line and working directory.
  context: For the cmd.exe branch, the command line and any children reveal what the
    attacker ran with elevated rights — the bypass itself is only the means. For the
    osk.exe branch, osk.exe is the on-screen keyboard hijacked by a planted DLL, so its
    own command line is unremarkable; the meaningful evidence is the loaded DLL and any
    elevated process that follows. Decode whatever the elevated process executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: Is this parent expected to spawn this child, and what started the parent itself?
  context: The parent-child relationship is the core signal. For the Event Viewer branch
    the parent chain is mmc.exe running eventvwr.msc; tracing what spawned mmc.exe shows
    whether a user opened Event Viewer interactively or a script/loader launched it to
    trigger the bypass. For the osk.exe branch, the parent that launched the elevated
    osk.exe reveals how the auto-elevation was invoked.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: If the elevating parent launched the detected process, it likely launched
    others. Multiple elevated children from the same parent instance points to deliberate
    orchestration — recon, credential access, or persistence staged through one bypass —
    rather than an isolated event.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Operators frequently disable or weaken protection before or right after gaining
    elevation. This surfaces direct attempts to stop AV/EDR services, flip Defender flags,
    add exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks
    healthy" signal; populated rows shift the disposition toward deliberate operator
    preparation — review the writer's parent process and signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:uac_bypass.elevated_action_after_bypass
  question: What action was performed with elevated privileges after the bypass?
  context: UAC bypass is a means to an end — operators elevate to install persistence, dump
    credentials, tamper with security tools, or reach protected resources. Examine
    processes spawned at High or System integrity shortly after the bypass; the detection
    analytics call for correlating the elevation with follow-on activity within a tight
    window (roughly 30 seconds is a common tuning) to separate the operator's objective
    from unrelated admin work.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- source: template:uac_bypass.bypass_technique_registry_artifacts
  question: Were registry modifications made to set up this UAC bypass?
  context: Many UAC bypasses write a command into a registry key that an auto-elevated
    process reads and executes. The Event Viewer branch keys on
    HKCU\Software\Classes\mscfile\shell\open\command; sibling techniques use
    ms-settings\Shell\Open\command or a DelegateExecute value. Finding the write in the
    minutes before the elevation confirms the mechanism and reveals the exact payload run
    with high integrity. This query catches writes performed through reg.exe, cmd, or
    PowerShell.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- source: attack:T1548.002.registry_set
  question: Did a registry-set event write a shell-handler or DelegateExecute key used by UAC bypasses on this host?
  context: When the bypass key is written programmatically (PowerShell .NET calls,
    IFileOperation COM) rather than through reg.exe, the process-creation view misses it.
    A registry-set event records the write directly. Look for handler keys the
    auto-elevated binary reads — mscfile and ms-settings shell\open\command, other
    Classes shell handlers, and DelegateExecute values — written shortly before the
    elevation fired.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\mscfile\shell\open\command'
          - '\ms-settings\shell\open\command'
          - '\ms-settings\Shell\Open\command'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - TargetObject
      - Image
- source: attack:T1548.002.image_load
  question: What DLLs did the elevated binary load, and were any unsigned or loaded from a non-standard path?
  context: The osk.exe branch is a search-order DLL hijack — the auto-elevated osk.exe
    loads a planted osksupport.dll, which runs the operator's code at high integrity.
    Reviewing the modules the elevated binary loaded distinguishes a clean system binary
    from one that side-loaded an attacker DLL. A module under the Windows Media Player
    directory or any user-writable path, or an unsigned module, is the artifact of the
    hijack.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
- source: template:uac_bypass.other_escalation_attempts
  question: Were other privilege-escalation or UAC-bypass detections raised on this host around the same time?
  context: Operators who try one UAC bypass often try several until one works, especially
    when the OS version blocks a given technique. Multiple bypass or escalation alerts in
    rapid succession from the same host or user confirms deliberate privilege-escalation
    activity rather than a one-off false positive.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:cue_parent_process.baseline
  question: Does this parent normally spawn this child on this host?
  context: Some parent-child pairs are routine and some are inherently unusual. mmc.exe
    spawning cmd.exe, or whatever parent launched the elevated osk.exe, is the
    discriminator here. A pairing with zero or very low history on this host indicates a
    novel spawning relationship worth chasing; thousands of prior events point to
    established behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run this binary?
  context: A binary that has never executed on a host is more suspicious than one that runs
    regularly. osk.exe legitimately running from System32 as an accessibility tool is
    common, but osk.exe from the Windows Media Player directory, or an elevated cmd.exe
    under Event Viewer, should be rare. Zero or very low historical counts indicate
    first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_1:
        Image: C:\Program Files\Windows Media Player\osk.exe
      selection_img_2:
        Image: C:\Windows\System32\cmd.exe
        ParentCommandLine: '"C:\Windows\system32\mmc.exe" "C:\Windows\system32\eventvwr.msc" /s'
      selection_integrity:
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_img_* and selection_integrity) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_1:
        Image: C:\Program Files\Windows Media Player\osk.exe
      selection_img_2:
        Image: C:\Windows\System32\cmd.exe
        ParentCommandLine: '"C:\Windows\system32\mmc.exe" "C:\Windows\system32\eventvwr.msc" /s'
      selection_integrity:
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_img_* and selection_integrity) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window
    reveals lateral movement or coordinated activity on multiple endpoints. If the same
    user triggered similar elevation activity elsewhere, the scope is larger than this one
    host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_1:
        Image: C:\Program Files\Windows Media Player\osk.exe
      selection_img_2:
        Image: C:\Windows\System32\cmd.exe
        ParentCommandLine: '"C:\Windows\system32\mmc.exe" "C:\Windows\system32\eventvwr.msc" /s'
      selection_integrity:
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_img_* and selection_integrity) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals
    what led to the elevation and what followed — reconnaissance, persistence, or further
    escalation. Aggregating by process and parent collapses repetitive agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
