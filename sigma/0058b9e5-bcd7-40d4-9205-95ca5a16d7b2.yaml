      disposition: declined
      reason: >-
        Both branches of this rule are auto-elevation bypasses — a DLL search-order
        hijack (osk.exe / osksupport.dll) and a registry shell-handler hijack
        (eventvwr.msc / mscfile). Neither obtains its token by opening a handle into an
        already-elevated process, which is the cross-process token-theft pattern
        process_access (Sysmon EID10) surfaces. The elevation here is the auto-elevated
        signed binary running the planted payload, so a handle-open query would add
        volume without discriminating this rule's mechanism. Covered conceptually by the
        image_load (Q10) and registry_set (Q9) questions that target the actual planting
        mechanisms.
