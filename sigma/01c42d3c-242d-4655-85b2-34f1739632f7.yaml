name: Potentially Over Permissive Permissions Granted Using Dsacls.EXE
id: ac3f3d98-432b-4dc3-a983-c3895220e831
description: |
  Detects dsacls.exe granting over-permissive Active Directory permissions, where the command line carries the /G grant verb together with one or more high-impact permission codes (GR, GE, GW, GA, WP, WD). dsacls is a Microsoft-signed RSAT / AD DS tool that edits Access Control Entries on directory objects; administrators use it for legitimate delegation, but it is also the canonical primitive for weakening AdminSDHolder or object ACLs to persist domain privileges (Write-DACL/Write-Owner grants, servicePrincipalName property writes, self-add to groups, or control-access rights that enable replication). Because dsacls.exe is a trusted signed binary, this falls under proxy execution; the investigation should establish what object and principal were targeted, what rights were granted, who and what launched it, and whether the grant fits a routine delegation pattern or a privilege-persistence attempt.
type: detection
detection_id: 01c42d3c-242d-4655-85b2-34f1739632f7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show dsacls granting permissions with /G and a high-impact right (GR, GE, GW, GA, WP, or WD)?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line against the rule's criteria, which fire only when all three conditions hold: the binary is dsacls.exe (by Image name or OriginalFileName), the /G grant verb is present, and at least one of the permission codes GR, GE, GW, GA, WP, or WD appears. Read the full statement to identify the target object DN, the principal being granted, and the specific rights — WD (Write-DACL), GA (Generic All), and WP;servicePrincipalName are the highest-impact grants.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to delegate or modify Active Directory object permissions?
  context: >-
    dsacls modification requires an elevated prompt and write access to the target directory object, so legitimate use comes from directory administrators or delegated-OU operators on management hosts. A grant issued by an account with no AD administration role, or run from a workstation that is not an admin jump box, is the deviation worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did this dsacls invocation actually grant? Decode the target object, principal, and permission codes.
  context: >-
    The full command line reveals which directory object was modified and what rights were conferred. Parse the target object DN (AdminSDHolder, a domain-NC root, an OU, or a group), the principal being granted, the permission codes, and any property or inheritance qualifiers. WD or WO yields control of the object's ACL, GA grants everything, WP;member self-adds to a group, WP;servicePrincipalName enables a Kerberoast setup, and CA on a domain root with no object type confers the replication extended rights that enable directory replication abuse. The /I:T, /N, and /P flags change inheritance and whether existing ACEs are replaced.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned dsacls, and is that parent chain expected for an AD permission change?
  context: >-
    The parent process reveals how the tool was invoked. Routine delegation is typically launched from an interactive administrative shell (cmd.exe or powershell.exe under explorer.exe) on a management host. Parents such as script hosts, remote-execution services, Office applications, or unexpected automation suggest the grant was issued as part of a scripted or hands-on-keyboard operation rather than a sanctioned change.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.network_connection
  question: Which remote host did this dsacls execution connect to, and is it an expected domain controller?
  context: >-
    dsacls applies ACL changes against a directory object over LDAP/RPC, so the process opens a connection to the domain controller hosting the target naming context (or to a remote computer named with the \\Computer\ object-DN prefix). Confirm the destination is a sanctioned DC for the targeted domain. A connection to an unexpected host, or to a DC the operator has no business administering, broadens the scope. If network telemetry for this process is not collected in this environment, treat zero results as a visibility gap rather than evidence no connection occurred and pivot to directory-side object-access auditing on the target object.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.baseline
  question: Does this host normally run dsacls?
  context: >-
    dsacls ships with the AD DS role and RSAT tools; its presence on a host that is neither a domain controller nor a designated administration station is itself worth noting. Zero or very low historical counts indicate first-time or rare execution, which raises the bar for treating this as routine delegation. Tune expectations by which management hosts in this environment are sanctioned to make directory ACL changes.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: >-
    Even sanctioned delegation tooling can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific grant pattern has historically run here, not generic dsacls usage. A new parent process, an unexpected user account, or an unusual command-line structure against the prior distribution is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dsacls.exe
      - OriginalFileName: DSACLS.EXE
      selection_flag:
        CommandLine|contains: ' /G '
      selection_permissions:
        CommandLine|contains:
        - GR
        - GE
        - GW
        - GA
        - WP
        - WD
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did dsacls spawn afterward?
  context: >-
    dsacls itself does not normally spawn children; follow-on processes from the same binary on this host can reveal whether the ACL change was one step in a larger operation. Subsequent cmd.exe, powershell.exe, or other directory tooling may indicate the operator chained the grant into further changes, verification, or use of the new rights.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dsacls.exe
      - OriginalFileName: DSACLS.EXE
      selection_flag:
        CommandLine|contains: ' /G '
      selection_permissions:
        CommandLine|contains:
        - GR
        - GE
        - GW
        - GA
        - WP
        - WD
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dsacls.exe
      - OriginalFileName: DSACLS.EXE
      selection_flag:
        CommandLine|contains: ' /G '
      selection_permissions:
        CommandLine|contains:
        - GR
        - GE
        - GW
        - GA
        - WP
        - WD
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether this ACL change is isolated or part of broader movement. If the same user triggered related directory or administrative activity on multiple endpoints in the same window, the scope of the operation may be larger than a single grant.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dsacls.exe
      - OriginalFileName: DSACLS.EXE
      selection_flag:
        CommandLine|contains: ' /G '
      selection_permissions:
        CommandLine|contains:
        - GR
        - GE
        - GW
        - GA
        - WP
        - WD
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this event and what happened after. Look for reconnaissance against the directory, credential access, or additional administrative tooling that frames the ACL change within a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded an AD permission grant and help reconstruct the timeline. The sequence of alerts often tells whether this grant is opportunistic or the planned step of a multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific grant pattern rather than generic dsacls usage. Many hosts firing the same pattern points to scripted delegation or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dsacls.exe
      - OriginalFileName: DSACLS.EXE
      selection_flag:
        CommandLine|contains: ' /G '
      selection_permissions:
        CommandLine|contains:
        - GR
        - GE
        - GW
        - GA
        - WP
        - WD
      condition: all of selection_*
    fields:
    - host.name
