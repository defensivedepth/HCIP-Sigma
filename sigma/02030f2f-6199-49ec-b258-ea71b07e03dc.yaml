name: Malicious PowerShell Commandlets - ProcessCreation
id: 225af875-b691-47aa-b03f-26582b9c4435
description: |
  Detects command lines that contain the names of cmdlets from well-known offensive
  PowerShell frameworks (PowerSploit, PowerView, PowerUp, Nishang, Empire, and similar
  toolkits) covering credential access, account and group enumeration, domain-trust and
  ADIDNS manipulation, privilege escalation, and in-memory execution. The rule fires when
  a process command line contains any one of these framework cmdlet names. These names
  legitimately appear only during sanctioned red-team or pentest engagements; outside that
  context their presence points to hands-on-keyboard tooling. The investigation should
  confirm which cmdlet ran, decode the full command, identify the process that carried it,
  and determine whether the activity is an authorized assessment or live operator use.
type: detection
detection_id: 02030f2f-6199-49ec-b258-ea71b07e03dc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain one of the offensive-framework cmdlet names this rule detects, and which cmdlet is it?
  context: Before investing investigation time, confirm the alert is a true positive by
    reading the exact command line and identifying which framework cmdlet matched. The
    name reveals the intended action and toolkit family — credential dumping
    (Invoke-Mimikatz, Out-Minidump), account or group enumeration (Get-NetUser,
    Invoke-UserHunter), domain-trust manipulation (the ADIDNS cmdlets), or privilege
    escalation (PowerUp, Invoke-BypassUAC). A pasted help string, a security tool's own
    signature file, or a defender testing detections can also surface these names, so read
    the full line rather than treating the match alone as confirmation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run offensive PowerShell tooling?
  context: These cmdlet names belong to penetration-testing and red-team frameworks. On a
    host owned by a security tester or during a scheduled assessment window, their presence
    may be sanctioned; under a standard user, a service account, or on a server with no
    assessment scheduled, the same activity is anomalous. Knowing the account role and the
    host function is often the fastest path to separating an authorized engagement from an
    intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this command do? Decode the full command line around the matched cmdlet.
  context: The matched cmdlet name is only the entry point. Read the full command line to
    recover the cmdlet's arguments — target accounts, groups, domains, hosts, output file
    paths, remote URLs, or embedded payloads — which reveal the concrete operation. Many of
    these cmdlets accept parameters that name the credential store, machine account, or
    trust being acted on. Decode any base64, string concatenation, or backtick escaping
    that wraps the call. Scoping is the triggering event itself, because the carrying binary
    is too common for host-wide binary scoping and the rule matches on the command-line
    string rather than on an executable name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does it decode to?
  context: Operators frequently wrap framework cmdlets in PowerShell's -EncodedCommand (-enc)
    parameter, string concatenation, backtick escaping, or variable substitution to hide the
    cmdlet name from plain-text inspection. Base64-encoded commands are the most common form.
    Decoding reveals the actual payload — download cradles that fetch the framework from a
    remote URL, reverse shells, or reflective loading of a .NET assembly into memory. When a
    download cradle is present, note the source URL and what gets executed, as that is the
    network indicator for this activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the framework cmdlet was launched. A command
    interpreter opened interactively by a user (cmd.exe or powershell.exe under explorer.exe)
    looks different from one spawned by an Office application, a script host
    (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe (WMI remote execution), or
    wsmprovhost.exe (WinRM remote execution). An unusual parent points to automated
    post-exploitation or remote hands-on-keyboard activity rather than a local administrator
    running a tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script content behind this command?
  context: Script block logging records the deobfuscated script content that PowerShell
    actually executes, even when the command line is encoded or obfuscated. This provides
    ground truth about what ran and frequently exposes the full framework function bodies
    (not just the invoked cmdlet name), confirming which capability was used. If PowerShell
    operational logs are not ingested in this environment, treat zero results as a visibility
    gap rather than evidence that nothing ran, and decode the command line directly instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: These frameworks routinely disable or evade PowerShell defenses before running.
    Common precursors include AMSI bypass (patching amsi.dll in memory), execution-policy
    changes (Set-ExecutionPolicy or the -ep bypass flag), constrained language mode escapes,
    and downgrade attacks that launch PowerShell v2 to avoid script block logging. Finding
    these precursor events in the hour before the alert strengthens the case that the cmdlet
    execution was deliberate and operator-driven.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. This surfaces direct attempts to
    disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch
    AMSI/ETW. Zero rows is a useful indication that protection looks healthy, though
    kernel-level driver tampering and in-memory patches will not appear here. Populated rows
    shift the disposition toward operator preparation; review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single framework cmdlet may be an isolated test, but several enumeration actions
    in rapid succession is a signature of post-compromise reconnaissance. Many of these
    cmdlets perform account, group, and domain-trust discovery, and operators commonly chain
    them with native recon binaries (whoami, net, nltest, dsquery) to map the environment
    before moving laterally. Three or more distinct recon binaries within fifteen minutes
    typically indicates automated enumeration rather than ad-hoc troubleshooting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: attack:T1059.001.image_load
  question: Did a process on this host load the PowerShell automation assemblies without launching powershell.exe?
  context: These frameworks can run inside a custom executable that references
    System.Management.Automation.dll and creates a runspace directly, executing PowerShell
    without spawning powershell.exe. Reviewing module loads for the automation assembly and
    related runtime DLLs surfaces this fileless invocation path, which a command-line-only
    view of powershell.exe would miss. A process other than powershell.exe or pwsh.exe
    loading these assemblies, especially from a user-writable path, is the artifact of
    .NET-hosted PowerShell execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - '\System.Management.Automation'
          - '\Microsoft.PowerShell'
          - '\System.Management.Automation.ni.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
- source: attack:T1482.process_access
  question: Did any process open a handle into LSASS or another protected process on this host around the alert?
  context: Several of the matched cmdlets read secrets out of process memory — credential
    dumping (Invoke-Mimikatz, Out-Minidump, Invoke-NinjaCopy) and token theft
    (Invoke-TokenManipulation) open a handle into lsass.exe with read or duplicate access.
    A cross-process handle-open into lsass.exe granting access such as 0x1010 or 0x1fffff,
    from a process that is not a known security or backup product, corroborates that the
    enumeration cmdlet was part of a credential-access operation rather than benign discovery.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\lsass.exe'
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: attack:T1482.security
  question: Did directory service object access tied to trust or account enumeration appear in the security log around the alert?
  context: Domain trust and ADIDNS cmdlets (Get-ADIDNS, the ADIDNSNode cmdlets,
    Invoke-ADRecon, Find-GPOLocation) query Active Directory through LDAP and directory
    service calls. Directory service access auditing records these reads against the
    accessed objects, providing a server-side view of trust, GPO, or account enumeration
    independent of the endpoint command line. Correlate any such access from the alerting
    user or host with the cmdlet seen in the process command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4662
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SubjectUserName
      - ObjectName
      - AccessMask
- source: attack:T1087.002.process_identification
  question: What is the actual executable that carried this command line, and is it a genuine PowerShell host?
  context: Because the rule matches on the command-line string and not on an executable name,
    the process carrying the cmdlet could be powershell.exe, pwsh.exe, a renamed copy of a
    PowerShell host, or a custom binary that bundles an offensive toolkit. Identify the real
    image path, the original file name from the binary's version resource, and the signing
    status to confirm whether a legitimate signed PowerShell host ran the cmdlet or a
    relocated or unsigned binary masqueraded as one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Company
      - Signed
- source: template:cue_user_actor.baseline
  question: Has this user run any of the rule's framework cmdlets before, and how often?
  context: Compare the account's current action against its history. A user who has never run
    these offensive cmdlets is more suspicious than a tester or administrator who does so as
    part of their role. The query counts prior matches of the rule's cmdlet pattern under
    this user across all hosts, so the result reflects this specific firing pattern rather
    than generic interpreter usage. Align low or zero counts with what is known about the
    account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains:
          - Invoke-Mimikatz
          - Invoke-DCSync
          - Get-GPPPassword
          - Get-PassHashes
          - Out-Minidump
          - Invoke-NinjaCopy
          - Invoke-TokenManipulation
          - Invoke-ADRecon
          - Invoke-UserHunter
          - PowerView
          - PowerUp
          - Invoke-Zerologon
          - Invoke-Rubeus
          - Invoke-Kerberoast
          - New-MachineAccount
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-host-process combination historically routine on this host or across the environment, or is the parent unusual for it?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK
    SERVICE, or a computer account), user identity does not attribute the behavior. The
    meaningful pivot is the launch mechanism — which parent process spawned the PowerShell
    host and whether that pair is historically common. A new or rare parent for this host
    process is the deviation worth chasing; a pair that already accounts for thousands of
    events is OS or vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user ran
    framework cmdlets or other hands-on-keyboard tooling on more than one host, the scope is
    larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-host-process combination fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise because every host runs SYSTEM-owned agents constantly. The
    meaningful question is whether the same launch mechanism — parent process plus spawned
    host process — fired on other hosts in the alert window. Multiple hosts point to scheduled
    or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
