  mutable_dispositions:
    - element: HighRiskChildren
      dimension: tuning_parameter
      specific_values: 'powershell.exe, cmd.exe, wscript.exe, mshta.exe, rundll32.exe, regsvr32.exe, msiexec.exe, curl.exe'
      disposition: context
      target_question: Q9
      notes: The rule already fixes the child as gbb.exe, so the high-risk-children list is
        not injected as a query selection. It informs the sibling-process question, which
        looks for interpreters/script hosts spawned by the same Hwp.exe instance alongside
        the renderer.
    - element: UserPaths
      dimension: file_path_analysis
      specific_values: 'Downloads, %TEMP%, %APPDATA%, Users\Public, document staging folders'
      disposition: query_injection
      target_question: Q7
      notes: Injected as file.path|contains filter_paths (\Temp\, \AppData\, \Downloads\, \Users\Public\)
        on the file_event query.
    - element: TimeWindow
      dimension: time_correlation
      specific_values: 'short correlation window (~15m) between crash/render/file/child/network'
      disposition: context
      target_question: Q14
      notes: Encoded as the +/-15m range on the host-context, application, file_event, and
        network questions; not a queryable field value.
    - element: EgressAllowlist
      dimension: tuning_parameter
      specific_values: 'known update/CDN domains and proxy egress CIDRs (rationale only)'
      disposition: context
      target_question: Q8
      notes: No concrete environment values in the brief; the network question uses a
        NOT filter on common system processes instead of an org-specific allowlist.
    - element: AllowedPlugins
      dimension: tuning_parameter
      specific_values: 'rationale only'
      disposition: context
      target_question: Q5
      notes: Tuning rationale without concrete values; informs the image-load question that
        looks for modules outside the normal rendering path.
    - element: AttachmentExtensions
      dimension: tuning_parameter
      specific_values: '.exe, .js, .vbs, .docm, .xlsm (and .hwp for this rule)'
      disposition: context
      target_question: Q16
      notes: Email-side extension list; surfaced in the delivery-vector question context as
        the document type to trace. Not queryable from process_creation telemetry.
    - element: SuspiciousParentChildPairs
      dimension: tuning_parameter
      specific_values: 'document-app -> interpreter lineage (Hwp.exe -> gbb.exe for this rule)'
      disposition: context
      target_question: Q1
      notes: The rule's own selection is exactly this pair; verify_trigger_match enforces it
        via ProcessGuid scope.
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: 'rationale only (uncommon parents for the child)'
      disposition: context
      target_question: Q3
      notes: Parent is fixed to Hwp.exe by the rule; parent_process_legitimacy traces the
        grandparent and what opened the word processor.
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: 'rationale only (encoded/uncommon args)'
      disposition: context
      target_question: Q4
      notes: gbb.exe is driven by the embedded stream on disk rather than a rich command
        line; mechanism_decode directs the analyst to the loaded file and working directory.
    - element: ScriptStoragePath
      dimension: tuning_parameter
      specific_values: '%TEMP%, C:\Users\Public, external drives'
      disposition: query_injection
      target_question: Q7
      notes: Overlaps UserPaths; same file.path|contains filter on the file_event query.
    - element: UserContext
      dimension: user_context
      specific_values: 'rationale only (admin users outside baseline)'
      disposition: context
      target_question: Q2
      notes: Covered by host_user_context and the user-pivot baseline.
  dedup_decisions:
    - dropped: cue_parent_process.mechanism_decode
      reason: parent_child technique set active — parent_child.parent_process_legitimacy is
