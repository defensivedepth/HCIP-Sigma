        is opened in the host application.
      mapped_to: Q16
      source: template:initial_access.delivery_vector
    - stage: 2
      label: client_app_abnormal
      description: The client application loads/renders the embedded stream and may crash or
        exit abnormally during the memory-corruption attempt.
      mapped_to: Q6
      source: attack:T1203.application
    - stage: 3
      label: renderer_exploitation
      description: The bundled renderer loads its PostScript engine and parses the embedded
        EPS stream; shellcode executes inside the renderer child process.
      mapped_to: Q5
      source: attack:T1059.003.image_load
    - stage: 4
      label: file_drop
