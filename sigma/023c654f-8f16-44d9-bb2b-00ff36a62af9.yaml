name: Python Function Execution Security Warning Disabled In Excel
id: d107f749-1340-4f70-980c-805d6cc776ed
description: |
  Detects a command line that writes the Excel PythonFunctionWarnings policy value under the
  Office Excel Security registry path and sets it to 0, which silences the prompt Excel would
  otherwise show before running Python (=PY()) formulas in a workbook. The rule fires when a
  process command line contains the Office path fragment, the Excel Security fragment, and the
  PythonFunctionWarnings value name together with a trailing ' 0' data argument. Setting this
  value to 0 lets a phishing-delivered workbook execute Python in the isolated cloud container
  without any user warning on endpoints licensed for Python in Excel; the investigation should
  determine which process and user made the change, whether it was an authorized policy
  deployment, and what activity followed the change.
type: detection
detection_id: 023c654f-8f16-44d9-bb2b-00ff36a62af9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line write the Excel PythonFunctionWarnings value and set it to 0?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    only when one command line contains all of the Office path fragment, the Excel Security fragment,
    and the PythonFunctionWarnings value name together with a trailing ' 0' data argument. Confirm the
    full command line carries all of those parts and that the data written is 0 (silent execution),
    not 1 (warning prompt) or 2 (block Python).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to change Office or Excel security policy from the command line?
  context: Legitimate policy deployment is normally pushed by management tooling or performed by IT
    under a known change. An interactive user, a developer workstation, or a non-IT account flipping the
    Excel Python warning to 0 by hand is the pattern worth scrutinizing, because the change weakens a
    security prompt rather than enabling a feature the user needs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: What is the full command line, and exactly which Office build and value data were written?
  context: The command line reveals the specific change. Read the Office version segment in the path
    (for example 16.0), confirm the value name is PythonFunctionWarnings, and confirm the data is 0.
    A 0 silences the prompt so Python formulas auto-run; a 1 restores the business-bar warning; a 2
    blocks Python entirely. Note whether the writer was reg.exe, powershell.exe, or another interpreter,
    since that shapes how the change was delivered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:registry.registry_key_context
  question: What registry key and value data did this write land on, and does it match the Excel Python security policy location?
  context: The command line states the intended target, but the registry event shows what was actually
    written. The expected location is the Office Excel Security policy path with value name
    PythonFunctionWarnings and DWORD data 0. Confirm the key path and value data so a malformed or
    decoy command line is not mistaken for the real change, and so the actual Office version hive is known.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:cue_process_tool.process_chain
  question: What process spawned the writer of this registry change, and is that parent chain expected?
  context: The parent process reveals how the policy change was invoked. A change driven by a management
    agent or an administrative console under a maintenance window reads differently from one spawned by
    an Office application, a script host, or a mail or browser child, which would point to user-opened
    content driving the change rather than IT deployment.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1562.001.user_context
  question: Has this user written the Excel PythonFunctionWarnings policy before, and on which hosts?
  context: A user who routinely deploys Office policy is a different signal from one who has never touched
    this value. This pivots on the acting user across the environment and keeps the same value-write
    pattern the rule fires on, so the count reflects this specific change rather than unrelated activity
    by the same account. Zero prior writes points to a first-time change worth correlating with a change
    ticket or the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|all:
        - \Microsoft\Office\
        - \Excel\Security
        - PythonFunctionWarnings
        CommandLine|contains: ' 0'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously wrote the Excel Python warning value, what parents and users drove it, and does this alert fit that pattern?
  context: Even routine policy changes leave a baseline. The query mirrors the rule's selection scoped to
    this host, so the resulting parent and user distribution reflects how this specific value write has
    historically happened here, not generic registry activity. A new parent process, an unexpected user
    account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Microsoft\Office\
        - \Excel\Security
        - PythonFunctionWarnings
        CommandLine|contains: ' 0'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts written the Excel Python warning value to 0 in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    specific value write. Many hosts writing the same value in a tight window points to a scripted policy
    rollout or management push; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Microsoft\Office\
        - \Excel\Security
        - PythonFunctionWarnings
        CommandLine|contains: ' 0'
      condition: selection
    fields:
    - host.name
- source: attack:T1562.001.tuning_parameter
  question: Was the value moved to 0 from a stronger setting, and have writes that set it to 1 or 2 also occurred on this host?
  context: Data 0 silences the prompt, 1 restores the warning, and 2 blocks Python entirely. A 0 written
    where the policy was previously 1 or 2, or with no compensating re-enable, is a deliberate downgrade
    of the protection. Surfacing writes to the same value with any data on this host shows whether the
    setting was toggled, flipped once, or repeatedly downgraded after being restored.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Microsoft\Office\
        - \Excel\Security
        - PythonFunctionWarnings
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: selection and _pb_scope
    fields:
      - CommandLine
      - User
- source: template:defense_tampering.protection_status
  question: Is the Excel Python warning currently set to 0, or has it been restored to 1 or 2?
  context: The change may be momentary or persistent. Checking the current value of PythonFunctionWarnings
    on the host shows whether silent Python execution is still enabled. If the value is still 0, restoring
    it to 1 (warning prompt) or 2 (block) closes the exposure before a workbook can exploit it; verify the
    live value directly on the host rather than assuming the alert reflects the present state.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the Excel Python warning was set to 0?
  context: A warning is silenced ahead of the thing it would have warned about. Activity right after the
    write may show Excel opening a delivered workbook, Python in Excel running, or a helper extracting and
    forwarding results, since the isolated container itself has no network and cannot be a direct transport.
    A burst of Office, script-host, or data-handling activity in this window points to what the silenced
    prompt was meant to enable.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host around the same time?
  context: An operator who weakens one control often weakens several. Disabling antivirus, clearing logs,
    or adding exclusions alongside the Excel Python warning downgrade points to deliberate staging rather
    than a one-off policy edit. Finding multiple tampering events from the same user or parent process in
    a tight window reframes this from an isolated change to a broader evasion effort.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: Operators who change one registry value often change several. Other Office security policy
    edits, Run key writes, or Defender policy changes in the same window from the same user reveal whether
    this Excel warning downgrade was a single edit or part of a sequence of configuration changes pursuing
    several objectives at once.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity shows what led to
    the policy change and what followed it, and whether the change sits inside a larger sequence such as
    delivery of content, reconnaissance, or staging. Novel parent and child pairs stand out against the
    repetitive system noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes the activity it protects. The query surfaces direct attempts to
    disable antivirus or endpoint protection services, flip Defender flags, add broad exclusions, clear
    logs, or patch in-memory scanning interfaces. Zero rows is a useful signal that protection looks
    healthy, though kernel-level driver tampering and in-memory patches will not appear here. Populated
    rows shift the read toward operator preparation; review the parent process and signing chain to
    identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as delivery of
    content, reconnaissance, or other defense tampering, may reveal the stages that preceded this policy
    change and help reconstruct the timeline. The order in which detections fired often tells the story
    of how the host reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
