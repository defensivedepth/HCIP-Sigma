name: Potential Mpclient.DLL Sideloading Via OfflineScannerShell.EXE Execution
id: 9d438ecb-ed4c-451b-9704-bc428bc8904f
description: |
  Detects OfflineScannerShell.exe running from a directory other than its installed location under Windows Defender Offline. This Microsoft-signed binary loads any DLL named mpclient.dll from its current working directory, so running it from an attacker-controlled directory lets a planted mpclient.dll execute under the trust of a signed process. The rule fires when the process is identified by image name or original filename AND its current directory is not the legitimate Defender Offline path, empty, or null; determine where the binary and its loaded DLL came from, what the DLL did once loaded, and whether the run fits routine activity for this user and host.
type: detection
detection_id: 02b18447-ea83-4b1b-8805-714a8a34546a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did OfflineScannerShell.exe run from a directory other than its installed Defender Offline location?
  context: Confirm the alert by reviewing the triggering event. The rule identifies the process by image name ending in OfflineScannerShell.exe or by original filename, then fires only when the current directory is not the legitimate Windows Defender Offline path, not empty, and not null. Verify the binary identity here; the working directory it ran from is the field that determines which mpclient.dll gets loaded and is examined in the command-line decode.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run the Windows Defender offline scanner shell?
  context: OfflineScannerShell.exe is part of the Windows Defender Offline scan workflow and is not normally launched interactively on a workstation. Knowing whether the user role and host function explain a manual or scripted run of this binary is often the fastest way to separate a true positive from rare-but-legitimate maintenance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What was the full command line and working directory of this OfflineScannerShell.exe execution?
  context: The working directory determines which mpclient.dll the binary loads, so it is the load-bearing field for this rule. Decode the full command line and identify the directory the process ran from; a user-writable or staging location (a profile folder, temp, a download path, a removable or network share) points to sideloading rather than a relocated install. Command-line arguments that reference scripts, URLs, or DLL paths are worth recording even though this binary is normally launched without arguments.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.dll_sideload
  question: What DLLs did this OfflineScannerShell.exe process load, and was mpclient.dll loaded from the working directory rather than a system path?
  context: The abuse hinges on OfflineScannerShell.exe loading a DLL named mpclient.dll from its current working directory. A legitimate run resolves mpclient.dll from the Defender install tree or System32; a planted DLL resolves from the same non-standard directory the process ran out of. Review the loaded module list for mpclient.dll and any other unsigned or unusually located modules, and compare the load path against the process working directory. If image-load events are not collected in this environment, treat the absence of results as a visibility gap and inspect the directory on the host directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- source: template:cue_process_tool.process_chain
  question: What process spawned OfflineScannerShell.exe, and is that parent expected for this binary?
  context: The parent process reveals how the binary was invoked. A signed-binary proxy run launched from explorer.exe or a service host differs sharply from one launched by a script host, an Office application, or a freshly dropped binary, which point to operator or macro-driven execution. Note the parent and what else it spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did OfflineScannerShell.exe spawn afterward?
  context: A sideloaded DLL running under a trusted process often spawns follow-on tooling for post-exploitation. Children such as cmd.exe, powershell.exe, certutil.exe, or rundll32.exe spawned from this binary indicate the loaded code is doing more than a Defender scan and should be triaged as hands-on activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.network_retrieval
  question: Did OfflineScannerShell.exe make any outbound network connections after launching?
  context: A sideloaded DLL executing under a signed binary commonly retrieves a second-stage payload or beacons to a controller. Outbound connections from OfflineScannerShell.exe are not part of an offline scan workflow, so any external destination is worth resolving against known-good infrastructure. If network events are not collected for this host, treat the absence of results as a visibility gap rather than confirmation of no activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.baseline
  question: Does this host normally run OfflineScannerShell.exe?
  context: A binary that has never executed on this host is more suspicious than one that runs on a schedule. Zero or very low historical counts over the past 90 days indicate first-time or rare execution and raise the weight of the working-directory and DLL-load findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: The query mirrors the rule's selection and filters scoped to this host, so the parent and user distribution reflects how this specific firing pattern has run here, not generic use of the binary. A new parent process or an unexpected user account against this pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \OfflineScannerShell.exe
      - OriginalFileName: OfflineScannerShell.exe
      filter_main_legit_dir:
        CurrentDirectory: C:\Program Files\Windows Defender\Offline\
      filter_main_empty:
        CurrentDirectory: ''
      filter_main_null:
        CurrentDirectory: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity around the alert reveals what led to this execution and what followed it, and whether the run is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or staging of the directory the binary ran from.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \OfflineScannerShell.exe
      - OriginalFileName: OfflineScannerShell.exe
      filter_main_legit_dir:
        CurrentDirectory: C:\Program Files\Windows Defender\Offline\
      filter_main_empty:
        CurrentDirectory: ''
      filter_main_null:
        CurrentDirectory: null
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \OfflineScannerShell.exe
      - OriginalFileName: OfflineScannerShell.exe
      filter_main_legit_dir:
        CurrentDirectory: C:\Program Files\Windows Defender\Offline\
      filter_main_empty:
        CurrentDirectory: ''
      filter_main_null:
        CurrentDirectory: null
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \OfflineScannerShell.exe
      - OriginalFileName: OfflineScannerShell.exe
      filter_main_legit_dir:
        CurrentDirectory: C:\Program Files\Windows Defender\Offline\
      filter_main_empty:
        CurrentDirectory: ''
      filter_main_null:
        CurrentDirectory: null
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or staging of files in a working directory — may reveal the attack stages that preceded this execution and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection and filters with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic use of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \OfflineScannerShell.exe
      - OriginalFileName: OfflineScannerShell.exe
      filter_main_legit_dir:
        CurrentDirectory: C:\Program Files\Windows Defender\Offline\
      filter_main_empty:
        CurrentDirectory: ''
      filter_main_null:
        CurrentDirectory: null
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Operators frequently weaken protection before running a payload. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful protection-looks-healthy signal; kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation — review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
