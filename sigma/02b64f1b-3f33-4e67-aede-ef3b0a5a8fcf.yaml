name: Potential COM Objects Download Cradles Usage - Process Creation
id: 132bf3b9-f1ba-470d-8db1-f3a249e56cf2
description: |
  Detects command lines that resolve a COM object by CLSID via [Type]::GetTypeFromCLSID( and reference one of several CLSIDs
  for COM objects commonly abused as download cradles (InternetExplorer.Application, Msxml2.XMLHTTP family, WinHttp.WinHttpRequest,
  Word.Application, Excel.Application). Resolving a COM object by its raw CLSID rather than its ProgID is a deliberate way to
  bypass string-based detections, and these particular objects expose HTTP(S) request methods that PowerShell can drive to
  pull a remote payload into the host. The rule fires when both the GetTypeFromCLSID call and a known abuse CLSID appear in
  the same command line; legitimate automation occasionally instantiates these objects, so the investigation should confirm
  what the command actually did, where any retrieved file landed, and whether the surrounding activity matches normal use on
  this host and user.
type: detection
detection_id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line both call [Type]::GetTypeFromCLSID( and reference one of the known download-cradle CLSIDs?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when the GetTypeFromCLSID
    call AND one of the listed abuse CLSIDs are both present, so verify both elements appear and note which CLSID was used --
    it identifies the specific COM object being instantiated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to instantiate COM objects by CLSID from a command line?
  context: Legitimate administrative scripting and some application installers do use COM automation, but resolving objects by
    raw CLSID from an interactive or ad-hoc command line is uncommon outside development and specialized automation. Knowing
    whether the user role and host function involve this kind of scripting is often the fastest way to separate routine activity
    from operator behavior.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did this command actually do -- which COM object was resolved and what method and URL did it drive?
  context: Decode the full command line. Map the CLSID to its COM object (for example 0002DF01-... is InternetExplorer.Application,
    the Msxml2 GUIDs are XMLHTTP request objects, 2087c2f4-... is WinHttp.WinHttpRequest, the 000209FF-... and 00024500-... GUIDs
    are Word and Excel). Look for the Activator::CreateInstance call that follows GetTypeFromCLSID and for downloader method
    names such as open, navigate, send, or Documents.Open, plus any remote URL or host the object was pointed at. A second
    string argument naming a remote machine turns the call into a DCOM activation rather than a local download.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '[Type]::GetTypeFromCLSID('
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this command, and is that parent chain expected for COM-based scripting?
  context: The parent process reveals how the command was launched. A CLSID download cradle launched by explorer.exe during
    interactive use differs sharply from one launched by mshta.exe, wscript.exe, regsvr32.exe, rundll32.exe, or an Office
    application, which are common precursors to scripted execution. Tune expectations for known-good automation parents such
    as software-update or management agents before treating an unusual parent as the anomaly.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this CLSID download-cradle pattern, what parents and users normally drove it,
    and does the current alert fit that pattern?
  context: Even objects with legitimate uses can be abused. This query mirrors the rule's own selection scoped to this host,
    so the resulting parent and user distribution reflects how this specific firing pattern has run here historically rather
    than generic command activity. A new parent process, an unexpected user account, or an unusual command-line shape relative
    to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains: '[Type]::GetTypeFromCLSID('
      selection_2:
        CommandLine|contains:
        - 0002DF01-0000-0000-C000-000000000046
        - F6D90F16-9C73-11D3-B32E-00C04F990BB4
        - F5078F35-C551-11D3-89B9-0000F81FE221
        - 88d96a0a-f192-11d4-a65f-0040963251e5
        - AFBA6B42-5692-48EA-8141-DC517DCF0EF1
        - AFB40FFD-B609-40A3-9828-F88BBE11E4E3
        - 88d96a0b-f192-11d4-a65f-0040963251e5
        - 2087c2f4-2cef-4953-a8ab-66779b670495
        - 000209FF-0000-0000-C000-000000000046
        - 00024500-0000-0000-C000-000000000046
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this CLSID download-cradle pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, returning a fleet-wide count of the firing pattern rather
    than generic command activity. Many hosts firing the same pattern points to scripted deployment or vendor automation that
    happens to use COM by CLSID; one host or a small unrelated set points to manual operator activity. Use the host distribution
    and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains: '[Type]::GetTypeFromCLSID('
      selection_2:
        CommandLine|contains:
        - 0002DF01-0000-0000-C000-000000000046
        - F6D90F16-9C73-11D3-B32E-00C04F990BB4
        - F5078F35-C551-11D3-89B9-0000F81FE221
        - 88d96a0a-f192-11d4-a65f-0040963251e5
        - AFBA6B42-5692-48EA-8141-DC517DCF0EF1
        - AFB40FFD-B609-40A3-9828-F88BBE11E4E3
        - 88d96a0b-f192-11d4-a65f-0040963251e5
        - 2087c2f4-2cef-4953-a8ab-66779b670495
        - 000209FF-0000-0000-C000-000000000046
        - 00024500-0000-0000-C000-000000000046
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_process_tool.follow_on
  question: What child processes did the PowerShell host spawn after this command?
  context: A COM download cradle that retrieves a payload usually leads to something running it. Children such as cmd.exe,
    another powershell.exe, rundll32.exe, regsvr32.exe, or an unexpected freshly written executable indicate the operation
    progressed past download into execution. Scope to the same host and the alerting process to see what followed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1105.network_connection
  question: Did the PowerShell host make an outbound connection to an external destination around the time of the alert?
  context: The COM objects this rule keys on (InternetExplorer.Application, the Msxml2 XMLHTTP family, WinHttp.WinHttpRequest,
    Word and Excel automation) expose HTTP(S) request methods, so a successful download cradle produces an outbound connection
    from the PowerShell process. Review the destination address, port, and hostname and tune by network block -- a connection
    to an external or otherwise uncommon destination is the transfer worth confirming, while connections to internal update
    or proxy infrastructure are expected. The NOT filter excludes loopback and link-local noise.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
        Initiated: 'true'
      filter_local:
        DestinationIp|cidr:
          - '127.0.0.0/8'
          - '169.254.0.0/16'
      condition: selection and not filter_local
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Image
- source: template:download_tool.download_success_verification
  question: Was a file written to disk after the command, and where did it land?
  context: A download cradle command does not guarantee the transfer completed -- network errors, blocked URLs, or controls
    may have stopped it. Confirming a file was created establishes whether the operation moved past delivery. Pay attention to
    user-writable staging locations such as C:\Users\Public, the user profile Temp and Downloads folders, and ProgramData,
    which are common drop paths for retrieved payloads.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: Can you retrieve and analyze any downloaded payload from a safe environment?
  context: If a file the cradle retrieved is still on disk, submitting its hash to threat intelligence or detonating it in a
    sandbox reveals whether it is a known malicious payload, a legitimate tool, or something novel needing deeper analysis.
    The query surfaces the file path and hash for lookup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the directory where the payload landed?
  context: Retrieved files often arrive in a shared staging directory alongside other downloads, or trigger further writes such
    as extraction, decompression, or additional pulls. Examining directory-level file activity around uncommon drop paths
    (for example C:\Users\Public or a profile Temp folder) reveals the broader scope of the delivery operation. The query
    excludes the already-identified file to surface only the surrounding writes.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      filter_self:
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection and not filter_self
    fields:
      - TargetFilename
      - Image
- source: template:cue_user_actor.baseline
  question: Does this user normally run command-line COM automation or scripting of this kind?
  context: Compare this user's current action against their historical behavior. A user who has never driven COM objects from
    a command line is more notable than one who does so regularly as part of a known scripting or development workload. User
    role and typical toolset should align with what fired.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains: '[Type]::GetTypeFromCLSID('
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent process that launched this command historically routine on this host or across the environment, or
    is it an unusual launcher for this kind of activity?
  context: When the alert fires under a service principal, user identity does not attribute the behavior, so the meaningful pivot
    is the launch mechanism -- which parent process drove the GetTypeFromCLSID command, and whether that parent is historically
    common for this pattern. A new or rare parent on this host or across the environment is the deviation worth chasing; a
    parent that already accounts for many prior events is more likely automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith|expand: '%ParentImage%'
        CommandLine|contains: '[Type]::GetTypeFromCLSID('
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user drove similar activity on more than one host in this window, the scope of the operation may be larger than
    a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent and PowerShell host combination fire on other hosts in the same window -- a coordinated
    automation rollout, or activity isolated to this host?
  context: Under a service principal, asking what the user did across the network returns agent-telemetry noise, because every
    host runs service-owned processes constantly. The meaningful question is whether the same launch mechanism -- the parent
    process spawning the PowerShell host -- fired on other hosts in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith|expand: '%ParentImage%'
        CommandLine|contains: '[Type]::GetTypeFromCLSID('
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event, what happened
    after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence, or data
    staging that surrounds the download cradle.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the stages
    that preceded this event and help reconstruct the timeline. A download cradle that follows earlier suspicious activity
    reads very differently from one that appears in isolation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip
    Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful signal that protection looks
    healthy -- kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition
    toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
