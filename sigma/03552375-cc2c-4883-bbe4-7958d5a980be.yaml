      reason: "Phase 2 (analysis) covered by the technique-set equivalent hacking_tool.tool_capability_used,
        which is more specific for an offensive-tool detection and entity-scoped to the alerting event;
        keeping both would duplicate the decode-the-command step."
      kept: hacking_tool.tool_capability_used
    - dropped: cue_process_tool.clustering
      reason: "Within-phase overlap with cue_host_context.clustering — both ask what else ran on the host
        in the surrounding window over the same host-scoped process_creation aggregation."
      kept: cue_host_context.clustering
    - dropped: null
      reason: "user_actor pair — non-deduplicable: cue_user_actor.baseline (Q11) and its
        service_principal_substitute cue_user_actor.baseline_svc (Q12) emitted as separate questions;
        likewise cue_user_actor.clustering (Q13) and cue_user_actor.clustering_svc (Q14)."
      kept: cue_user_actor.baseline + cue_user_actor.baseline_svc + cue_user_actor.clustering + cue_user_actor.clustering_svc
