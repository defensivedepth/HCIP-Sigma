name: HackTool - SILENTTRINITY Stager Execution
id: bd2a319e-ad07-41ea-b822-cafe32c0ccdc
description: |
  Detects execution of a process whose PE Description metadata field contains the
  string "st2stager", a fingerprint of the SILENTTRINITY post-exploitation and
  command-and-control framework. SILENTTRINITY stagers embed a .NET scripting
  runtime that compiles and evaluates post-exploitation modules in memory and beacons
  to a teamserver over HTTP/HTTPS, so a true positive marks an active implant rather
  than a one-off tool run. The investigation should confirm the metadata match,
  identify the launching parent and user, decode what the stager did, and trace the
  outbound C2 channel and any follow-on execution on this host and across the fleet.
type: detection
detection_id: 03552375-cc2c-4883-bbe4-7958d5a980be
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process carry the st2stager PE Description that this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the triggering event and verifying the process executable's Description metadata field contains
    st2stager. This string is the embedded stager fingerprint, so a match points to the SILENTTRINITY
    framework rather than incidental software.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run a process carrying this stager fingerprint?
  context: Legitimate software does not ship with a SILENTTRINITY stager Description, so the
    relevant judgment is whether an authorized security assessment or known tooling explains why
    this user and host would run it. A developer host or sanctioned test range may explain it;
    a production workstation or server generally does not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this stager execution part of an authorized penetration test or red team engagement?
  context: Offensive frameworks like SILENTTRINITY are used in authorized security assessments.
    Before investing investigation time, check whether a pentest or red team exercise is currently
    active on this host or network segment. An authorized engagement with matching tool usage and
    timing resolves the alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: What did the stager actually do when launched? Decode its full command line and working directory.
  context: SILENTTRINITY stagers can be delivered as standalone executables, DLLs loaded by signed
    proxy binaries, or PowerShell one-liners, and the command line reveals which delivery path was
    used and what listener or module it reached for. Parse every argument, decode any encoded content,
    and record the binary path and parent so the in-memory .NET execution model can be characterized.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this stager and is that parent chain expected?
  context: The parent process reveals how the stager was delivered. A stager launched from a browser,
    mail client, Office application, or script host points to phishing or exploitation; a launch from
    a signed proxy binary points to proxy execution. Walk up the tree to see what spawned the parent
    and what else the parent launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: What files did the stager process write to disk on this host?
  context: SILENTTRINITY compiles modules in memory, so on-disk artifacts are sparse, but the stager
    process may still drop helper binaries, configuration, staged output, or the runtime DLLs it loads.
    File creation events from the stager process confirm execution and reveal staged data even after
    the original process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1071.network_connection
  question: What outbound network connections did the stager process make, and where did they go?
  context: SILENTTRINITY beacons to a teamserver over HTTP/HTTPS with an encrypted, asymmetric key
    exchange, so the stager process generates outbound connections to operator infrastructure.
    Identifying the destination addresses and ports separates a contained, non-callback stager
    from an active C2 channel and yields infrastructure to pivot on and block.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Image
- source: template:cue_process_tool.follow_on
  question: What child processes did the stager spawn afterward?
  context: The processes spawned by a stager reveal its post-exploitation activity. SILENTTRINITY
    modules can run reconnaissance, credential access, or lateral movement, which often surface as
    spawned command interpreters, script hosts, or system utilities shortly after the stager runs.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this stager binary run on this host before?
  context: A process executable that has never been seen on a host is more suspicious than one that
    runs regularly. Zero or very low historical counts for this binary indicate first-time execution,
    which is the expected profile for a freshly delivered stager.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the st2stager pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific stager-fingerprint pattern has historically
    run here rather than generic binary usage. A new parent process, an unexpected user account, or a
    first-ever appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description|contains: st2stager
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description|contains: st2stager
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description|contains: st2stager
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across
    multiple endpoints. If the same user drove similar activity on multiple hosts, the scope of the
    intrusion may be larger than this single stager execution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description|contains: st2stager
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the st2stager pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the stager-fingerprint pattern rather than generic binary usage. Many hosts
    firing the same pattern points to a scripted deployment or widely staged implant; one host or a
    small unrelated set points to manual operator activity. Use the host distribution to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description|contains: st2stager
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the stager execution reveals
    the immediate context — what led to it, what happened after, and whether it is part of a larger
    sequence. Look for reconnaissance, privilege escalation, or persistence around the event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, exploitation, or
    credential access — may reveal the attack stages that preceded stager delivery and help reconstruct
    the full timeline leading to command-and-control.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
