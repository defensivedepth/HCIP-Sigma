  mutable_dispositions:
    - element: ProtocolList
      dimension: tuning_parameter
      specific_values: "HTTP, DNS, SSL, SMB, RDP"
      disposition: context
      target_question: Q7
      notes: "T1071 analytic names application-layer protocols of interest. The network_connection
        question surfaces destination ip/port/hostname for the stager process so the analyst sees which
        protocol/port the C2 used; protocol names recorded in context (HTTP/HTTPS per the framework's
        teamserver listeners). Not injected as a port allowlist because the rule itself is metadata-based,
        not protocol-scoped, and over-filtering would hide non-standard C2 ports."
    - element: DataVolumeThreshold
      dimension: tuning_parameter
      specific_values: ">90% outbound"
      disposition: context
      target_question: Q7
      notes: "Asymmetric outbound volume is a tuning rationale without a queryable per-event value in
        process/network_connection logs; recorded as the analyst's read on the connection results rather
        than a query threshold."
    - element: UnusualProcessList
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q7
      notes: "Tracks processes not normally associated with network activity. The network_connection
        question is already scoped to the stager Image, so the 'unusual process making network
        connections' angle is the question's premise; baseline questions Q9/Q10 establish whether this
        process is novel on the host/for the user."
  dedup_decisions:
