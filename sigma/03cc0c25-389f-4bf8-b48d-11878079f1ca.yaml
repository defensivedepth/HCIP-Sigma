name: Suspicious MSHTA Child Process
id: 5d2136ce-b6db-4800-8be8-1feb9e15a2c0
description: |
  Detects an mshta.exe process spawning a suspicious child process whose Image
  ends in one of a set of interpreters or system tools (cmd.exe, powershell.exe,
  pwsh.exe, wscript.exe, cscript.exe, sh.exe, bash.exe, reg.exe, regsvr32.exe,
  bitsadmin.exe) AND whose original filename matches the same set. mshta.exe runs
  HTML Application content and embedded VBScript/JScript outside the normal browser
  security context; legitimate HTAs rarely shell out to a command interpreter or
  script host, so this parent-child pairing is a common proxy-execution pattern
  where the HTA payload launches a follow-on stage. Investigation should decode the
  child command line, recover what HTA or script mshta.exe was told to run, and
  determine whether any network retrieval or file drop followed.
type: detection
detection_id: 03cc0c25-389f-4bf8-b48d-11878079f1ca
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-04'
questions:
- source: template:universal.verify_trigger_match
  question: Does this event show mshta.exe as the parent spawning one of the flagged interpreter or system-tool child processes?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires BOTH conditions together
    the ParentImage ending in \mshta.exe AND a child whose Image (or OriginalFileName) is one of cmd.exe, powershell.exe, pwsh.exe,
    wscript.exe, cscript.exe, sh.exe, bash.exe, reg.exe, regsvr32.exe, or bitsadmin.exe. Confirm both the parent and the specific
    child binary in the event before continuing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run a command interpreter or script host out of an mshta.exe HTML Application?
  context: Legitimate administrative activity can trigger this detection, but mshta.exe shelling out to an interpreter is uncommon
    outside specific software installers. Knowing whether the user role and host function involve HTA-based tooling is often
    the fastest way to separate routine operations from proxy execution. Printer software and driver installations are documented
    benign sources for this pairing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is mshta.exe expected to spawn this child, and what started mshta.exe itself?
  context: The mshta.exe-to-interpreter relationship is the core signal for this detection. Tracing mshta.exe's own origin
    reveals whether the chain is benign (an installer or printer utility launching a packaged HTA) or hostile (a document,
    email client, or download spawning mshta.exe with a remote or staged HTA payload that then launched this child).
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: attack:T1218.005.command_analysis
  question: What exactly did the spawned child process do? Decode its full command line.
  context: The child command line reveals the operational purpose of the HTA payload. Decode every flag, parameter, encoded
    string, file path, and URL. A reg.exe child writes a registry value, a bitsadmin child queues a transfer, and an interpreter
    child often carries a download cradle or a staged script path. The query is entity-scoped to the alerting child so the
    result is exactly the triggering invocation rather than every interpreter run on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_parent_process.mechanism_decode
  question: What HTA or script content did mshta.exe execute that led to this child process?
  context: mshta.exe's own command line carries the HTA file path or URL it was told to run, or a direct inline VBScript/JScript
    expression. Recovering it shows whether the source was a local staged file, a remote URL, or inline script, and what that
    content instructed mshta.exe to launch. Look at the mshta.exe arguments and where the HTA was hosted.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:parent_child.sibling_processes
  question: What other child processes did this same mshta.exe instance spawn?
  context: An HTA payload that launches one interpreter often launches several stages in sequence — reconnaissance, a download,
    then execution. Examining the siblings of the alerting child reveals the full scope of activity orchestrated by this mshta.exe
    instance. Multiple suspicious children from one mshta.exe strongly points to a multi-stage payload.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: If the child was PowerShell, was the command encoded or obfuscated, and what does it decode to?
  context: When the mshta.exe payload launches powershell.exe or pwsh.exe, the command frequently uses -EncodedCommand (-enc),
    string concatenation, backtick escaping, or variable substitution to hide intent. Base64-encoded commands are the most
    common form. Decoding reveals the actual payload, such as a download cradle, a reverse shell, or in-memory execution of
    a .NET assembly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Windows Event ID 4104 records the deobfuscated script content PowerShell actually executes, even when the command
    line is encoded or obfuscated. For an HTA-launched PowerShell child this provides ground truth about what ran, bypassing
    the attacker's command-line obfuscation. If PowerShell operational logs are not ingested in this environment, treat zero
    results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: When the HTA payload runs PowerShell, it often disables or bypasses controls first. Common techniques include AMSI
    bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), constrained language
    mode escape, and downgrade attacks (powershell.exe v2, which lacks logging). Finding these precursor events strengthens
    the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: attack:T1218.005.network_connection
  question: Did mshta.exe or its child make outbound network connections to remote or untrusted endpoints around this time?
  context: Mshta proxy execution commonly retrieves a remote HTA or a follow-on payload over HTTP(S) or pulls down a second
    stage from the launched interpreter. Outbound connections from mshta.exe or its child to an external or anomalous endpoint
    indicate download-and-execute behavior. Compare any destination against known-good HTA and update sources before treating
    it as benign.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\mshta.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cscript.exe'
          - '\wscript.exe'
          - '\bitsadmin.exe'
          - '\regsvr32.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1218.005.file_event
  question: Were files written to disk by mshta.exe or its child shortly after this execution?
  context: After proxy execution, the HTA or its child stage frequently drops a payload, script, or staging artifact to disk
    before running it. File creation by mshta.exe or the spawned interpreter shortly after the alert points to a downloaded
    or unpacked second stage. Note the written paths and review any executable or script content for follow-on execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\mshta.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cscript.exe'
          - '\wscript.exe'
          - '\cmd.exe'
          - '\bitsadmin.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_parent_process.baseline
  question: Does mshta.exe normally spawn this child binary on this host?
  context: Some parent-child relationships are routine, but mshta.exe spawning a command interpreter or script host is unusual
    outside specific installers. Historical frequency of this specific mshta.exe-to-child pairing on this host distinguishes
    a recurring benign software behavior from a first-time, novel spawning relationship.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \mshta.exe
      selection_child:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        - \cscript.exe
        - \sh.exe
        - \bash.exe
        - \reg.exe
        - \regsvr32.exe
        - \bitsadmin.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
        - wscript.exe
        - cscript.exe
        - Bash.exe
        - reg.exe
        - REGSVR32.EXE
        - bitsadmin.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \mshta.exe
      selection_child:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        - \cscript.exe
        - \sh.exe
        - \bash.exe
        - \reg.exe
        - \regsvr32.exe
        - \bitsadmin.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
        - wscript.exe
        - cscript.exe
        - Bash.exe
        - reg.exe
        - REGSVR32.EXE
        - bitsadmin.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around this event reveals the immediate context: what led
    to the mshta.exe execution, what happened after, and whether it is part of a larger sequence. Aggregating process activity
    surfaces novel parent-child pairs while collapsing repetitive agent telemetry.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance,
    or credential access, may reveal the attack stages that preceded the mshta proxy execution and help reconstruct the full
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip
    Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful protection-looks-healthy signal,
    though kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward
    operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1218.005
      name: Mshta
      role: primary
    - id: T1218
      name: System Binary Proxy Execution
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: mshta_invocation
      description: "mshta.exe is invoked referencing remote or local HTA/script (VBScript/JScript) content"
      mapped_to: Q5
      source: template:cue_parent_process.mechanism_decode
    - stage: 2
      label: child_process_spawn
      description: "mshta.exe spawns a suspicious interpreter or system-tool child (the rule's trigger)"
      mapped_to: Q4
      source: attack:T1218.005.command_analysis
    - stage: 3
      label: network_retrieval
      description: "Subsequent network retrieval to untrusted/anomalous endpoints indicating payload download"
      mapped_to: Q10
      source: attack:T1218.005.network_connection
    - stage: 4
      label: file_creation
      description: "Subsequent file creation indicating payload staging or drop"
      mapped_to: Q11
      source: attack:T1218.005.file_event
  dimension_coverage:
    - dimension: command_analysis
      technique: T1218.005
      covered_by: Q4
      source: attack:T1218.005.command_analysis
      coverage_type: direct
    - dimension: time_correlation
      technique: T1218.005
      covered_by: Q10
      source: attack:T1218.005.network_connection
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1218.005
      covered_by: Q13
      source: template:cue_user_actor.baseline
      coverage_type: indirect
    - dimension: command_analysis
      technique: T1218
      covered_by: Q5
      source: template:cue_parent_process.mechanism_decode
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1218
      covered_by: Q3
      source: template:parent_child.parent_process_legitimacy
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1218
      covered_by: Q14
      source: template:cue_user_actor.baseline_svc
      coverage_type: indirect
  mutable_dispositions:
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "rationale only (regex tuning guidance, no concrete values)"
      disposition: context
      target_question: Q4
      notes: "No concrete values in brief; the child-command decode question captures the command_analysis intent. Child query is entity-scoped (ProcessGuid) so the result is the alerting invocation."
    - element: SuspiciousParentProcesses
      dimension: tuning_parameter
      specific_values: "rationale only (this rule fixes the parent to mshta.exe)"
      disposition: context
      target_question: Q3
      notes: "Parent is fixed by the rule (mshta.exe). Parent-legitimacy question covers whether mshta is an expected parent for this child."
    - element: AllowedHTASources
      dimension: tuning_parameter
      specific_values: "rationale only (allowlist of legitimate HTA domains/paths)"
      disposition: context
      target_question: Q10
      notes: "Network question instructs analyst to compare destinations against known-good HTA/update sources before treating as benign."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (correlation threshold)"
      disposition: context
      target_question: Q10
      notes: "Realized as the +/-15m correlation window on the network and file-event questions."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (profile unexpected parent-child relationships)"
      disposition: context
      target_question: Q3
      notes: "Parent-legitimacy and parent-baseline questions profile the mshta.exe parent against the child."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "rationale only (allowlist of signed binaries)"
      disposition: context
      target_question: Q13
      notes: "Baseline questions establish whether this signed-binary execution is routine for the user/host."
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "rationale only (regex for suspicious args/URLs/DLL entrypoints)"
      disposition: context
      target_question: Q4
      notes: "Child-command decode and parent HTA-decode questions surface URLs, script paths, and DLL entrypoints for manual inspection."
    - element: RemoteDomainAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only (suppress legitimate enterprise domains)"
      disposition: context
      target_question: Q10
      notes: "Network question directs comparison of destinations against known-good sources."
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: "parent_process is primary cue (hint) — parent_child.parent_process_legitimacy subsumes process_chain"
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_user_actor.clustering
      reason: "user_actor pair — non-deduplicable, but clustering pair omitted to hold question count; baseline pair retained as the user-vs-mechanism identity coverage"
      kept: cue_user_actor.baseline + cue_user_actor.baseline_svc
    - dropped: none
      reason: "cue_user_actor.baseline and cue_user_actor.baseline_svc both emitted — user_actor pair, non-deduplicable (subject vs. mechanism identity)"
      kept: cue_user_actor.baseline + cue_user_actor.baseline_svc
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: registry.registry_key_context per brief; both declined as literal Phase-2 — see hint_dispositions. Phase-2 mechanism_decode realized as attack:T1218.005.command_analysis (Q4) scoped to the alerting child via ProcessGuid, honoring the cmd.exe-too-common hint."
    - template: cue_parent_process.follow_on
      reason: "Sibling/scope coverage provided by parent_child.sibling_processes (Q6); follow_on would duplicate the same-parent child enumeration."
    - template: cue_parent_process.clustering
      reason: "Same-parent activity covered by sibling_processes (Q6) and host clustering (Q15); the network and file-event attack questions cover the cross-logsource pivot this template hints at."
    - template: cue_parent_process.scope
      reason: "Cross-host scope of the mshta-to-child pairing covered by cue_user_actor.baseline_svc (Q14), which aggregates the same parent+binary pair environment-wide."
    - template: cue_process_tool.baseline
      reason: "Host-baseline of the binary covered by cue_parent_process.baseline (Q12), which is more specific (parent+child pairing) for this parent-driven rule."
    - template: cue_user_actor.clustering
      reason: "Real-time cross-host user activity; omitted to hold the question count at 17. The cross-host launch-mechanism question (baseline_svc, Q14) covers the service-principal degeneration case for scope."
    - template: cue_user_actor.clustering_svc
      reason: "Service-principal clustering substitute; omitted alongside its user-pivot pair (cue_user_actor.clustering) to hold count."
    - template: registry.registry_key_context
      reason: "Logsource registry_set scoped to the alerting ProcessGuid; reg.exe is only one of ten possible children and the trigger is process_creation, so a registry_set lookup on the child ProcessGuid returns nothing for the common non-reg children. See hint_dispositions."
    - template: registry.registry_related_modifications
      reason: "Registry technique set is incidental — reg.exe is one of ten possible children, not the rule's focus; declined to keep the playbook centered on the mshta proxy-execution chain."
    - template: download_tool.*
