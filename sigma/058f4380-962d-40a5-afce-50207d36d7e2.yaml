    - hint: "logsource 'image_load' (recommended by techniques: T1059.003,T1059.001) is not covered — pull in cue_image_load.* or author a custom question with category: image_load"
      disposition: declined
      reason: >-
        The rule's detection is purely process command-line shapes for cmd.exe and
        powershell.exe; it does not constrain on a hosting binary whose loaded
        modules would discriminate abuse. image_load on cmd/powershell returns
        volume without precision for these specific invocations. Script-block
        logging (Q8) and the encoded-command decode (Q5) cover the .NET/in-memory
        execution angle via process_creation and 4104 evidence sufficiently for
        triage. No compensating attack:T1059.001.image_load question authored.
    - hint: "logsource 'security' (recommended by techniques: T1053) is not covered and no template family exists — author a custom question with category: security"
      disposition: declined
      reason: >-
        T1053 security logsource targets Event 4698 (scheduled-task registration),
        but this rule's detection contains no scheduled-task creation — the command
        shapes are cmd.exe redirects and powershell.exe invocations. A 4698 question
        would investigate an artifact this rule never fires on. T1053 is an
        incidental tag, not the behavior the rule detects.
    - hint: "logsource 'wmi' (recommended by techniques: T1047) is not covered and no template family exists — author a custom question with category: wmi"
