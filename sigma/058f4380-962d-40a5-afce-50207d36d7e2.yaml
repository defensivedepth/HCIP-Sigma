        Invoke-WmiMethod, no namespace references). T1047 is tagged because
        CrackMapExec can use WMI as an execution transport, but the patterns this
        rule fires on are cmd/powershell command shapes. The remote-execution
        transport question is covered platform-appropriately by the SMB
        network_connection question (Q7); a wmi-operation query would have nothing
        in this rule's scope to bind to.
