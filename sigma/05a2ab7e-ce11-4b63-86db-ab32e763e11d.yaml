      dimension: tuning_parameter
      specific_values: "known set of systems that should or should not invoke DCOM activity"
      disposition: new_question
      target_question: Q16
      notes: "Q16 (cue_parent_process.scope) surfaces which hosts see mmc.exe-to-shell pairings env-wide; context frames the analyst's allow/deny set of expected DCOM sources."
    - element: LogonUser
      dimension: tuning_parameter
