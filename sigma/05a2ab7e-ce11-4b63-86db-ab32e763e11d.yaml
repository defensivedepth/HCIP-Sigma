    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc
      reason: "user-wide and parent+binary clustering at +/-1h overlaps lateral_movement.lateral_movement_scope (cross-host user pivot) and cue_parent_process.scope (cross-host pairing); kept the lateral-movement-specific versions to avoid three near-identical cross-host aggregations"
      kept: template:lateral_movement.lateral_movement_scope
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: registry.registry_key_context per brief; neither used as Phase 2 — see registry.registry_key_context disposition below. Phase 2 served by attack:T1021.003.command_analysis."
    - template: registry.registry_key_context
      reason: "This registry_set-scoped decode only fits when the child is reg.exe, but reg.exe is one of ten possible children. Using it as the universal Phase 2 mechanism would return nothing for the cmd/powershell/script-host fires. A process_creation command-line decode (attack:T1021.003.command_analysis) covers all child binaries."
    - template: registry.registry_related_modifications
      reason: "Tangential to a DCOM lateral-movement detection — the rule keys on the parent/child pairing, not on registry persistence. Registry set is incidental to the binary list (reg.exe). No registry-cluster question authored."
    - template: powershell.script_block_logging
      reason: "PowerShell is only one of ten possible children; script-block coverage is conditional and the encoded_command_decode question already redirects the analyst to deobfuscated content when the child is PowerShell. Slot reserved for DCOM-core chain questions (security, image_load)."
    - template: powershell.powershell_security_bypass
      reason: "Bypass-precursor scanning is PowerShell-specific and tangential to the DCOM parent/child signal; the rule does not detect a bypass. Slot reserved for chain-stage coverage."
    - template: lateral_movement.authentication_method
      reason: "ProcessGuid-scoped boilerplate showing User/CommandLine — duplicates context already on Q1/Q2; the authentication angle is covered concretely by Q7 (4624/4648 type-3 logon)."
    - template: lateral_movement.target_activity_after_access
      reason: "Forward-looking host-wide process aggregation overlaps sibling_processes (Q4, same-parent children) and host precursor scope; the same-parent pivot is more precise for DCOM-driven sequential commands."
    - template: network_scope.same_action_other_hosts
      reason: "Cross-host same-binary aggregation duplicates cue_parent_process.scope (Q16), which is more specific by also matching the mmc.exe parent."
    - template: network_scope.actor_activity_network_wide
      reason: "User-wide cross-host aggregation duplicates lateral_movement.lateral_movement_scope (Q14, kept) which adds lateral-movement tool scoping."
    - template: network_scope.actor_authentication_trail
      reason: "User 4624/4625 authentication trail overlaps Q7's logon evidence; kept Q7 scoped to the alerting host's inbound DCOM logon to keep the chain-stage focus tight."
    - template: persistence_scope.process_based_persistence
      reason: "Persistence-tool sweep is tangential to a lateral-movement RCE detection; the rule fires on remote execution, not persistence installation. persistence_scope was confirmed only via the reg.exe keyword in the binary list."
    - template: persistence_scope.file_based_persistence
      reason: "File-event persistence-drop sweep is tangential to the DCOM parent/child signal; no file_event in the rule's logsource and persistence is not the detected behavior."
    - template: cue_parent_process.follow_on
      reason: "Same-parent-binary children at +4h duplicates sibling_processes (Q4) which scopes to the exact parent instance — more precise for DCOM command sequencing."
    - template: cue_parent_process.clustering
      reason: "Parent-binary activity at +/-15m overlaps sibling_processes (Q4) and host_context scope; the exact-instance sibling query is the higher-signal version."
    - template: cue_process_tool.baseline
