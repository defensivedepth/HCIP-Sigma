name: Service Registry Key Deleted Via Reg.EXE
id: 8f87a773-e2c0-42de-b7e0-dba26fde9e4e
description: |
  Detects reg.exe invoked with the delete flag against a key under
  HKLM\SYSTEM\CurrentControlSet\services\, which removes a registered service.
  The rule fires when all of the following match the same process: the image
  ends in reg.exe (or carries the reg.exe original filename), the command line
  contains ' delete ', and the command line references the services registry
  path. Deleting service keys is a common way to disable antivirus and EDR
  agents, since a security product whose service key is gone no longer starts.
  Legitimate uninstalls and configuration cleanup also touch these keys, so the
  investigation should determine which service was targeted, whether the actor
  deleted one key or bulk-deleted many security service keys in quick
  succession, and what else ran on the host around the same time.
type: detection
detection_id: 05b2aa93-1210-42c8-8d9a-2fcc13b284f5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the reg.exe command line delete a key under the services registry
    path, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule requires all three conditions on the same process - the image is reg.exe
    (or its original filename is reg.exe), the command line contains the delete flag,
    and the command line references HKLM\SYSTEM\CurrentControlSet\services\. Read the
    exact command line and confirm which service key was named in the delete operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to delete service registry keys?
  context: Deleting a service key is a destructive administrative action. Software
    uninstallers, imaging tools, and a small number of IT operators perform it
    legitimately; most users and most endpoints never do. Knowing whether the
    acting account and the host function are consistent with service removal is
    often the fastest path to separating a routine uninstall from defense tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:registry.registry_key_context
  question: Which service registry key and value were modified, and does the key
    belong to a security product?
  context: The deleted key path names the service that was removed. Keys under
    HKLM\SYSTEM\CurrentControlSet\services\ map one-to-one to installed services;
    names such as WinDefend, Sense, MsMpEng, CSFalconService, SentinelAgent, AVP,
    ekrn, or McShield identify antivirus and EDR agents. Removing such a key
    prevents the corresponding protection service from starting. Read the actual
    registry path and value to confirm which service was targeted rather than
    parsing it from the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:defense_tampering.what_was_disabled
  question: What specific service was targeted for deletion, and was it a single
    key or a bulk removal of several security services?
  context: Different targets carry different impact. A single key deletion may be a
    cleanup of one stale service, while many delete operations against AV and EDR
    service names within seconds is the signature of a kill-AV routine that strips
    multiple security products at once. Read the full command line to identify the
    exact service name and to see whether the same process issued repeated deletes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was reg.exe executed from its expected System32 path, or from an unusual
    location?
  context: reg.exe normally runs from System32 or SysWOW64. A reg.exe (or a binary
    carrying the reg.exe original filename) running from a user-writable directory
    such as a temp or profile folder suggests the binary was copied or renamed to
    evade path-based allowlists, which raises the suspicion level of the service
    deletion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.process_chain
  question: What process spawned this reg.exe, and is that parent chain expected?
  context: The parent process reveals how reg.exe was invoked. Interactive
    administration usually shows explorer.exe or a console shell launched by a
    user; bulk service deletion driven by malware often shows a batch script or
    cmd.exe running an unattended .bat dropped to a temp location. An unexpected
    parent such as a script host or an Office application points to automated or
    malicious invocation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were other tamper attempts against endpoint protection seen on this host
    in the hour before the alert?
  context: This rule already detects one form of defense tampering, so the relevant
    question is whether the operator attempted others around it. The query surfaces
    attempts to disable AV/EDR services, flip Defender flags, add broad exclusions,
    clear logs, or patch AMSI/ETW. Zero rows means no command-line tampering of these
    other kinds was visible; populated rows show a broader effort to blind the host.
    Review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:defense_tampering.protection_status
  question: Is the deleted service currently restored, or does the host remain
    without that protection?
  context: A deleted service key may have been re-created by a reinstall, or the
    protection may still be missing. Checking the current state of the targeted
    service shows whether the host is still unprotected. If an AV or EDR service is
    still absent, it should be restored before further investigation so the host
    regains coverage.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the service key was deleted?
  context: Removing a security service is usually a preparatory step. Examining what
    ran in the window immediately after the deletion reveals what the actor intended
    the missing protection to allow - payload execution, credential access, or
    further configuration changes. A burst of process creation right after the
    deletion points to the activity the tampering enabled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: An actor who deletes one security service key often deletes several and
    pairs the deletions with other evasion steps - stopping services, clearing logs,
    deleting shadow copies, or weakening firewall rules. Finding multiple tampering
    events from the same user or parent process within a short window indicates a
    coordinated effort to strip protection rather than an isolated administrative
    delete.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made with reg.exe on this host in the
    same window?
  context: Kill-AV routines that delete service keys frequently follow up with other
    registry edits in the same run - removing AV autostart entries under the Run key,
    or weakening attachment-handling controls so dropped files are not flagged.
    Finding a cluster of reg.exe add and delete operations from the same user within
    a short window reveals the full scope of the configuration changes.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run reg.exe to delete service keys?
  context: Compare the acting account against its own history. A user who routinely
    administers services may run reg.exe delete as part of maintenance; an account
    that has never done so is more suspicious. The user role and typical toolset
    should align with destructive service operations.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and reg.exe combination historically routine on this host
    or across the environment, or is the parent unusual for reg.exe?
  context: When the alert fires under a service principal, user identity does not
    attribute the behavior; the meaningful pivot is which parent process spawned
    reg.exe and whether that pairing is historically common. A new or rare parent
    for reg.exe on this host or environment-wide is the deviation worth chasing,
    while a pair that already accounts for many prior events is more likely
    automation or imaging.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the service deletion was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar destructive operations on other
    hosts, the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and reg.exe combination fire on other hosts in the
    same window, indicating a coordinated rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network
    returns agent-telemetry noise, since every host runs system-owned agents
    constantly. The meaningful question is whether the same launch mechanism - the
    parent process spawning reg.exe - fired on other hosts in the alert window.
    Multiple hosts in the same window points to scheduled or pushed automation; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    service deletion reveals what led to it and what followed - reconnaissance, the
    parent dropper that staged a batch script, or follow-on execution that the
    removed protection was meant to allow. Novel parent-child pairs at low counts
    are what to scan for against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's service-key deletion
    pattern, what parents and users normally drive it, and does the current alert
    fit?
  context: Even legitimate maintenance can delete service keys. This query mirrors
    the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how this specific firing pattern - reg.exe deleting a
    services key - has historically run here, not generic reg.exe usage. A new parent
    process, an unexpected account, or a first-ever occurrence is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: reg.exe
      - OriginalFileName: reg.exe
      selection_delete:
        CommandLine|contains: ' delete '
      selection_key:
        CommandLine|contains: \SYSTEM\CurrentControlSet\services\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's reg.exe service-key deletion
    pattern over the past 90 days, and what command-line shapes are typical?
  context: A service-key deletion pattern with no prior history on a host is more
    suspicious than one seen regularly under stable parents. This query mirrors the
    rule's selection structure scoped to this host, so the count reflects the rule's
    specific firing pattern rather than generic reg.exe usage. The command-line
    projection lets the analyst compare typical invocation shapes - which services
    are normally removed here - against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: reg.exe
      - OriginalFileName: reg.exe
      selection_delete:
        CommandLine|contains: ' delete '
      selection_key:
        CommandLine|contains: \SYSTEM\CurrentControlSet\services\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
