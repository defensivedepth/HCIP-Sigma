  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific wmic.exe -format XSL pattern rather than generic WMIC usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      - Hashes|contains:
        - IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E
        - IMPHASH=37777A96245A3C74EB217308F3546F4C
        - IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206
        - IMPHASH=B12619881D79C3ACADF45E752A58554A
        - IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00
      selection_cmd:
        CommandLine|contains|windash: '-format:'
      filter_main_known_format:
        CommandLine|contains:
        - Format:List
        - Format:htable
        - Format:hform
        - Format:table
        - Format:mof
        - Format:value
        - Format:rawxml
        - Format:xml
        - Format:csv
      filter_main_remote_operation:
        CommandLine|contains:
        - ://
        - \\\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
