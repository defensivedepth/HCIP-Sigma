    - hint: "logsource 'network_connection' (recommended by techniques: T1047) is not covered — pull in cue_network_endpoint.* or author a custom question with `category: network_connection`"
      disposition: declined
      reason: >-
        The rule's filter_main_remote_operation block explicitly excludes any
        command line containing :// or a UNC path (\\), so this detection fires
        only on LOCAL XSL execution. Remote WMI / outbound connection analysis
        does not apply to the events this rule produces. The remote-WMI angle of
        T1047 is structurally out of scope for this local-XSL rule.
    - hint: "logsource 'wmi' (recommended by techniques: T1047) is not covered and no template family exists — author a custom question with `category: wmi`"
      disposition: declined
      reason: >-
        WMI provider/consumer events (EventCode 5857-5861) are generated by WMI
        namespace operations and permanent event subscriptions, not by wmic.exe
        loading a local XSL stylesheet via -format:. This rule fires entirely in
        process_creation on the wmic.exe invocation; the script execution path is
        covered by the image_load question (jscript.dll/vbscript.dll load, Q6) and
        the child-process question (Q7), which are the load-bearing evidence for
        local XSL proxy execution. A wmi-category question would return unrelated
        WMI activity, not this rule's mechanism.
