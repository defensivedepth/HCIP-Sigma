name: Add New Download Source To Winget
id: b3317b75-e39a-4c6f-8783-816c6257cd2b
description: |
  Detects winget.exe invoked with both 'source ' and 'add ' on the command line, which
  registers a new package repository for the Windows Package Manager. The rule fires when the
  image ends in winget.exe (or OriginalFileName is winget.exe) AND the command line contains
  both 'source ' and 'add '. Adding a source is a legitimate administrative action for staging
  internal repositories, but an actor with local admin can register an attacker-controlled
  URL or UNC path and then install arbitrary signed packages through a now-trusted-on-this-host
  channel; a trust-level of trusted further suppresses prompts. The investigation should
  determine which source name and URL/UNC were added, whether that endpoint is the official
  Microsoft winget repository or an unrecognized location, and whether any package install
  followed from the new source.
type: detection
detection_id: 05ebafc8-7aa2-4bcd-a269-2aec93f9e842
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show winget registering a new source, with both 'source ' and 'add ' present?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact command line and process details. The rule fires only when the image is winget.exe
    AND the command line contains both 'source ' and 'add ', so confirm both tokens are present
    and read the source name and the URL or UNC supplied to -a/--arg.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to register new winget package sources?
  context: Registering a winget source requires administrator privileges and changes user-affecting
    trust state on the box. Knowing whether the user role and host function are consistent with
    package-manager administration is often the fastest path to distinguishing routine internal
    repository staging from unexpected source registration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What source name and URL or UNC path did this winget invocation register, and was a trust level set?
  context: Decode the full command line to read the -n/--name identifier and the -a/--arg value
    (a URL or UNC path). Note any --trust-level (none or trusted), --type (Microsoft.PreIndexed.Package
    or Microsoft.Rest), --header, or --accept-source-agreements, since trusted trust-level and
    silent agreement acceptance suppress prompts an analyst would otherwise see.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - 'source '
          - 'add '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1059.command_analysis
  question: Is the registered source URL or UNC path the official Microsoft winget repository, or an unrecognized endpoint?
  context: The default sources shipped with winget are msstore and winget; any other endpoint is
    operator-introduced. A source pointing at an unrecognized external URL or an internal UNC share
    is the load-bearing artifact here, because a controlled source lets an actor deliver arbitrary
    signed packages through a channel the host now trusts. Compare the -a/--arg value against known
    internal repository URLs and the official Microsoft winget repository.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - 'source '
          - 'add '
      condition: selection
    fields:
      - CommandLine
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this winget invocation, and is that parent chain expected for package-manager administration?
  context: The parent process reveals how winget was invoked. Interactive administration usually
    descends from explorer.exe or a console shell, while automation descends from a scheduler or
    service host. Unusual parents such as mshta.exe, wscript.exe, or an Office application point
    toward scripted or macro-driven invocation rather than an administrator at a console.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run winget?
  context: A package-manager binary that has never been seen on a host is more notable than one
    that runs regularly. Zero or very low historical counts of winget.exe on this host indicate
    first-time or rare execution, which raises the priority of confirming who introduced the new source.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously registered a winget source, what parents and users drove that activity, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how winget source registration has historically run here,
    not generic winget usage. A new parent process, an unexpected user account, or an unusual
    command-line shape compared with that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_cli:
        CommandLine|contains|all:
        - 'source '
        - 'add '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: Did a winget package install run from this host after the source was added?
  context: Adding a source is only the setup step; the payoff is installing a package from it.
    A winget install referencing the newly registered source name (or -s/--source) shortly after
    the source add is the action that actually delivers code to the host. Look for subsequent
    winget invocations and what they installed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host within minutes of the source registration?
  context: Source registration that is part of an intrusion is usually surrounded by other activity
    in a tight window. Restricting to the minutes around this event surfaces reconnaissance,
    privilege checks, or staging that provides broader context. Note the time of the registration
    relative to expected administrative or maintenance windows.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts registered a winget source with this pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of winget source registrations matching the rule, not generic winget usage.
    Many hosts firing the same pattern points to scripted deployment or vendor automation that
    legitimately stages an internal repository; one host or a small unrelated set points to manual
    operator activity worth closer review.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_cli:
        CommandLine|contains|all:
        - 'source '
        - 'add '
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run winget?
  context: Compare this user's current action against their historical use of winget across the
    environment. A user who has never run winget is more notable than an administrator who manages
    package sources regularly. User role and typical toolset should align with package-manager
    administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and winget combination historically routine on this host or across the environment, or is the parent unusual for winget?
  context: When the alert fires under a service principal, user identity does not attribute the
    behavior. The meaningful pivot is which parent process spawned winget and whether that pair is
    historically common. A new or rare parent for winget on this host or environment-wide is the
    deviation worth chasing; a pair already accounting for many prior events is vendor or operating-system
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated
    activity across multiple endpoints. If the same user registered sources or ran related tooling
    on several hosts in the same window, the scope of the operation may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and winget combination fire on other hosts in the same window, indicating an automation rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism, parent
    process plus winget, fired on other hosts in the alert window. Multiple hosts in the same window
    points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context: what led to this event, what happened after, and whether it is part of a
    larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms in
    the surrounding process activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense
    tampering, reconnaissance, or credential access, may reveal the stages that preceded this event
    and help reconstruct the full timeline leading up to the source registration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to
    disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW.
    Zero rows is a useful protection-looks-healthy signal; kernel-level driver tampering and in-memory
    patches will not appear here. Populated rows shift the disposition toward operator preparation;
    review the parent process and signing chain to identify the writer. On non-Windows alerts this
    query returns 0 by construction.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
