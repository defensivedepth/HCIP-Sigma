name: Suspicious SYSVOL Domain Group Policy Access
id: cb0b2759-1cfa-4950-8dc4-f9b813891088
description: |
  Detects a process whose command line references both a SYSVOL path and a Group Policy
  policies path, which is the access pattern tools use to read Group Policy Preference (GPP)
  files from the domain-wide SYSVOL share. GPP XML files can carry an AES-encrypted cpassword
  attribute that any authenticated domain user can decrypt with a publicly known key, so this
  access is a recognized path to harvesting cleartext credentials. Legitimate Group Policy
  administration and replication can also touch these paths, so the investigation determines
  whether the access reflects credential harvesting tooling or routine administration, what
  parent launched it, and whether any decrypted credentials enable follow-on access.
type: detection
detection_id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line reference both a SYSVOL path and a Group Policy policies path?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact command line. The rule fires only when the command line contains both the
    \SYSVOL\ token AND the \policies\ token, which is the combined access pattern for reading
    Group Policy Preference files from the domain share.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to access Group Policy files in SYSVOL?
  context: Legitimate Group Policy administration and domain controller replication can touch
    SYSVOL policies paths. Knowing whether the user role (domain admin, GP operator) and host
    function (workstation versus domain controller or management server) are consistent with
    reading Group Policy Preference files is often the fastest path to distinguishing routine
    administration from credential harvesting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: What exactly did this command do with the SYSVOL Group Policy files it referenced?
  context: Decode the full command line to determine the operational intent. Group Policy
    Preference harvesting reads XML files (Groups.xml, Services.xml, ScheduledTasks.xml,
    DataSources.xml, Printers.xml, Drives.xml) under the SYSVOL Policies tree and then
    base64-decodes and AES-decrypts the cpassword attribute to recover cleartext passwords.
    Look for the targeted XML file names, recursion or enumeration flags, and any decryption
    or cpassword references that distinguish credential extraction from a simple file listing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts could be exposed by the targeted Group Policy Preferences, and do any have elevated privileges?
  context: The severity depends on the privilege of accounts whose passwords are stored in the
    Group Policy Preference files. Scheduled-task and service GPPs frequently store credentials
    for privileged service or local administrator accounts, and a single decrypted local admin
    password can grant access on every machine the policy targeted. Cross-reference the
    accounts referenced in the targeted XML files with directory group memberships to gauge
    blast radius.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated on this host after the alert?
  context: Credential harvesting from Group Policy Preferences is typically followed by use of
    the recovered passwords to access other systems. Follow-on alerts indicating remote logons,
    SMB connections, remote command execution, or new authentication shortly after this access
    point to active use of the decrypted credentials rather than a benign read.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:cue_process_tool.process_chain
  question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the SYSVOL access was invoked. Interactive
    administration usually launches from explorer.exe or a console shell run by an admin, while
    invocation from a script host, an Office application, or a remote-execution service can
    indicate scripted credential harvesting. Walk up to the parent to see what drove the access.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously matched the rule's SYSVOL access pattern, what parents and users normally drive it, and does this alert fit?
  context: Even routine Group Policy administration can match this pattern. The query mirrors
    the rule's selection scoped to this host, so the resulting parent and user distribution
    reflects how the SYSVOL-and-policies access pattern has historically run here. A new parent
    process, an unexpected user account, or an unusual command-line shape is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \SYSVOL\
        - \policies\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this command spawn afterward?
  context: The processes spawned after the SYSVOL access reveal its actual impact. Decryption
    and credential staging may spawn helper interpreters or copy tools, and use of recovered
    credentials may spawn remote-execution or network utilities. Unexpected children point to
    post-access activity beyond a simple file read.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally access Group Policy files in SYSVOL?
  context: Compare this user's current action against their historical behavior. A user who has
    never matched this SYSVOL-and-policies access pattern is more suspicious than one who does
    so regularly as part of Group Policy administration. The user's role and typical toolset
    should align with reading policy files from the domain share.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|all:
        - \SYSVOL\
        - \policies\
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-SYSVOL-access combination historically routine on this host or across the environment, or is the parent unusual?
  context: When the alert fires under a service or machine principal, user identity does not
    attribute behavior, so the meaningful pivot is the launch mechanism. The query measures how
    often this parent process has driven the SYSVOL-and-policies access pattern. A new or rare
    parent for this access is the deviation worth chasing, while a parent that already accounts
    for many prior events is automation or replication tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|all:
        - \SYSVOL\
        - \policies\
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the SYSVOL access is an
    isolated action or part of broader activity. If the same user touched multiple endpoints in
    the same window, the scope of credential collection or subsequent use may be larger than a
    single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-SYSVOL-access pattern fire on other hosts in the same window?
  context: Under a service or machine principal, tracking the user across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism, the
    parent process driving the SYSVOL-and-policies access, fired on other hosts in the alert
    window. Multiple hosts in the same window point to scheduled or pushed automation, while a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|all:
        - \SYSVOL\
        - \policies\
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what
    led to the SYSVOL access and what happened after, and whether it is part of a larger
    sequence such as reconnaissance of the domain share, privilege escalation, or credential
    staging. Novel parent-child pairs stand out against repetitive host telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, share enumeration, or
    other reconnaissance, may reveal the attack stages that preceded the SYSVOL access and help
    reconstruct the full timeline leading to credential harvesting.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts matched the rule's SYSVOL access pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count
    of the SYSVOL-and-policies access pattern. Many hosts matching the same pattern points to
    scripted deployment or replication tooling, while one host or a small unrelated set points
    to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \SYSVOL\
        - \policies\
      condition: selection
    fields:
    - host.name
- source: attack:T1552.006.security
  question: Do Windows security share-access events show this host reading Group Policy files under the SYSVOL share?
  context: Reading Group Policy Preference XML files traverses the domain SYSVOL network share,
    which the Windows security log records as detailed file-share access events when share
    auditing is enabled. These events corroborate the process-level alert with share-side
    visibility of which policy files were opened and by which account. If detailed file-share
    auditing is not enabled in this environment, treat zero results as a visibility gap rather
    than evidence nothing was accessed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 5145
        host.name|expand: '%hostname%'
        ShareName|contains: SYSVOL
      filter:
        RelativeTargetName|contains: Policies
      condition: selection and filter
    fields:
      - SubjectUserName
      - ShareName
      - RelativeTargetName
      - AccessMask
- source: template:universal.evidence_preservation
  question: Are the referenced Group Policy Preference files or any decrypted output still on disk for analysis?
  context: If the command referenced or copied Group Policy Preference XML files locally, or
    wrote decrypted credential output, checking whether those files still exist enables deeper
    analysis such as confirming which cpassword-bearing files were read and recovering the
    affected account names.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering often precedes credential collection. The query surfaces direct attempts to
    disable protection services, add broad exclusions, clear logs, or patch script-scanning and
    tracing. Zero rows is a useful signal that protection looks healthy, while populated rows
    shift the disposition toward operator preparation; review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
