      reason: >-
        persistence_scope questions (process_based_persistence, file_based_persistence) were not included.
        This rule detects anti-forensic IIS log deletion (T1070, defense-evasion), not persistence
        installation — applicability.is_persistence_rule is false and the detection has no persistence
        tooling or autostart-path indicators. The defense_tampering set (what_was_disabled,
        activity_after_tampering, other_tampering_activity) is the directly applicable cascade member and
        is fully applied; the persistence-scoping branch investigates a behavior absent from this alert.
    - hint: "File paths derived from CommandLine — use %file_paths% placeholder"
      disposition: declined
      reason: >-
        The two file_event queries (artifact_verification recovery, evidence_preservation) use %file_dirs%
        with TargetFilename|contains|expand instead of %file_paths%. The rule's selection_cli_iis_dir matches
        the IIS log DIRECTORY (\inetpub\logs\), not a specific filename, so a |contains match on the derived
        directory is the correct scope; %file_paths% with |endswith would miss the per-file log names under
        that directory. The %file_dirs% directory placeholder is the right derivation here.
    - hint: "powershell.encoded_command_decode replaces obfuscation.encoded_payload_decode"
      disposition: declined
      reason: >-
        Both powershell encoding/obfuscation questions are out of scope for this rule. The rule fires on a
        plaintext deletion command (del/erase/rm/remove-item/rmdir against \inetpub\logs\), not on
        -EncodedCommand or obfuscated payload execution. There is no encoded payload to decode; the full
        command is already human-readable in verify_trigger_match and what_was_disabled.
    - hint: "logsource 'file_delete' (recommended by techniques: T1070) is not covered — pull in cue_artifact.* or author a custom question with `category: file_delete`"
      disposition: declined
      reason: >-
        The deleted-artifact investigation is covered via file_event queries on the \inetpub\logs\ directory
        (artifact_verification reframed to recoverability, and evidence_preservation) using %file_dirs%.
        file_delete (Sysmon EID 23) would add the precise deletion record, but file_event already surfaces
        the create/delete activity for that path and the analyst pivot is recovery, not detecting the delete
        a second time after process_creation already fired the rule. No file_delete template family is wired
        for process_creation-derived rules, so a custom question would duplicate the recovery angle.
    - hint: "logsource 'registry_set' (recommended by techniques: T1070) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        This rule detects file deletion of IIS logs only — there is no registry indicator in its detection
        logic. registry_set covers the registry-key-removal flavor of T1070, which is a different artifact
        class the rule does not target. Adding a registry_set question would investigate an indicator type
        absent from this alert.
    - hint: "logsource 'security' (recommended by techniques: T1070) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        Security-channel coverage of indicator removal (e.g., 1102 log-clear) is addressed at the analyst
