name: HackTool - Quarks PwDump Execution
id: b51cc2b7-2b86-427c-ac7b-686137388748
description: |
  Fires when a process matches either the QuarksPwDump binary name OR one of its credential-dumping
  command-line flags (local hash dump, domain-cached hash dump, BitLocker dump, domain hash dump, or
  --ntds-file). QuarksPwDump extracts Windows credentials from the SAM database, cached domain
  credentials, and NTDS without injecting into LSASS, so a true positive means local or domain hashes
  may already be staged for offline cracking. The same flags occasionally appear in authorized
  penetration tests; the investigation should confirm which credential store was targeted, whether the
  activity was sanctioned, and whether stolen hashes were used for follow-on lateral movement.
type: detection
detection_id: 0685b176-c816-4837-8e7b-1216f346636b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Did this process match QuarksPwDump either by binary name or by one of its credential-dump flags?
  context: >-
    The rule fires on either branch independently, so confirm which one matched before going further.
    The process Image may end in QuarksPwDump.exe, or the command line may carry a dump flag such as
    -dhl, --dump-hash-local, -dhdc, --dump-hash-domain-cached, --dump-bitlocker, -dhd,
    --dump-hash-domain, or --ntds-file. Note which branch fired: a name-only match means the binary was
    renamed-or-default but the requested operation is in the arguments, while a flag-only match means a
    renamed or repackaged build was used and the binary name alone will not identify it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a credential-dumping tool?
  context: >-
    Credential extraction from SAM, cached domain credentials, or NTDS is almost never part of routine
    operation outside security testing. Knowing whether the account is an administrator or service
    identity, and whether the host is a workstation, server, or domain controller, is often the fastest
    way to separate a sanctioned assessment from genuine credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this QuarksPwDump execution part of an authorized penetration test or red team engagement?
  context: >-
    Credential-dumping tools are routinely used in sanctioned security assessments. Before investing
    further analysis time, check whether a penetration test or red team exercise is active on this host
    or network segment. An authorized engagement with matching tool usage and timing resolves the alert
    without deeper work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which QuarksPwDump capability was invoked from the command-line flags?
  context: >-
    The flags determine the scope of credential theft. -dhl / --dump-hash-local extracts local SAM
    hashes; -dhdc / --dump-hash-domain-cached pulls cached domain credentials; -dhd / --dump-hash-domain
    targets domain hashes; --dump-bitlocker retrieves BitLocker recovery material; --ntds-file reads a
    supplied NTDS.dit. Identifying the exact flag tells you which accounts are at risk and how broad the
    exposure is.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: Which credential store was targeted - local SAM, cached domain credentials, domain hashes, BitLocker, or NTDS?
  context: >-
    Different flags reach different stores, and the target dictates remediation. A local SAM dump exposes
    only this host's local accounts; cached domain or domain-hash dumps expose domain credentials; an
    --ntds-file read implies access to a full directory database. Decode the command line to confirm the
    store, then scope which accounts must be considered compromised and rotated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.002.command_analysis
  question: Were reg save or registry-export commands for the SAM or SYSTEM hive run on this host around the same time?
  context: >-
    Hash extraction often pairs the dumping tool with a direct hive dump. Detectable variations include
    reg save, reg.exe save, or PowerShell equivalents writing HKLM\SAM and HKLM\SYSTEM to files such as
    sam.save or system.save, frequently under user-writable or public directories. Presence of these
    commands confirms hands-on credential staging beyond the tool execution itself.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_cmd:
        CommandLine|contains:
          - 'reg save'
          - 'reg.exe save'
          - 'save hklm\sam'
          - 'save hklm\system'
      condition: selection_host and selection_cmd
    fields:
      - Image
      - CommandLine
      - User
- source: attack:T1003.002.tuning_parameter
  question: Were SAM or SYSTEM registry hives accessed or modified on this host in the surrounding window?
  context: >-
    Credential dumping that reads the SAM database leaves registry activity against HKLM\SAM and
    HKLM\SYSTEM, sometimes via direct \Device\Harddisk paths rather than the live hive. Surfacing
    registry events on these keys provides an independent confirmation of SAM access that does not depend
    on the dumping process still being resident.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\SAM\SAM'
          - '\System\CurrentControlSet'
          - 'HKLM\SAM'
          - 'HKLM\SYSTEM'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- source: attack:T1003.002.tuning_parameter
  question: Were hive dump or hash output files written to public or temp directories after the tool ran?
  context: >-
    Offline cracking requires the extracted material to land on disk. Defenders can watch for dump file
    patterns such as sam.save, system.save, or .dmp files under paths like the public profile, user temp,
    or other world-writable directories. A new file of this kind shortly after the tool execution
    confirms credentials were exported and identifies what to collect for response.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:hacking_tool.tool_specific_artifacts
  question: Are output files or hash dumps created by this tool's process present on the host?
  context: >-
    The dumping process writes its results to disk - hash listings, exported hives, or NTDS-derived
    output. Checking for files created by this process confirms the operation completed and reveals the
    scope of stolen material even if the original process has already exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this tool and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. Legitimate or sanctioned use often has a
    predictable parent such as an interactive shell started by explorer.exe or a known orchestration
    process. Unusual parents like mshta.exe, wscript.exe, rundll32.exe, or an Office application point to
    a delivered payload rather than an operator at the keyboard.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    Severity tracks the privilege of the exposed accounts. Local SAM hashes on a workstation may only
    need monitoring and rotation; cached domain or domain hashes covering administrators, service
    accounts, or domain controllers require incident escalation. Cross-reference the affected accounts
    against directory group memberships to set the response level.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how this specific dumping pattern has run here before, not generic binary
    usage. A new parent process, an unexpected account, or a first-ever appearance is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \QuarksPwDump.exe
      selection_cli:
        CommandLine:
        - ' -dhl'
        - ' --dump-hash-local'
        - ' -dhdc'
        - ' --dump-hash-domain-cached'
        - ' --dump-bitlocker'
        - ' -dhd '
        - ' --dump-hash-domain '
        - --ntds-file
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts reveals whether the same identity touched multiple
    endpoints. If the account that ran the dumping tool was also active on other systems in the same
    window, the scope of compromise may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \QuarksPwDump.exe
      selection_cli:
        CommandLine:
        - ' -dhl'
        - ' --dump-hash-local'
        - ' -dhdc'
        - ' --dump-hash-domain-cached'
        - ' --dump-bitlocker'
        - ' -dhd '
        - ' --dump-hash-domain '
        - --ntds-file
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the
    dumping pattern rather than generic use of the binary. Many hosts firing the same pattern suggests
    scripted deployment or an automated sweep; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \QuarksPwDump.exe
      selection_cli:
        CommandLine:
        - ' -dhl'
        - ' --dump-hash-local'
        - ' -dhdc'
        - ' --dump-hash-domain-cached'
        - ' --dump-bitlocker'
        - ' -dhd '
        - ' --dump-hash-domain '
        - --ntds-file
      condition: 1 of selection_*
    fields:
    - host.name
