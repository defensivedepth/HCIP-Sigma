name: Potential Arbitrary Command Execution Via FTP.EXE
id: 86f9f6c2-659f-441f-8624-1de318c96858
description: |
  Detects ftp.exe being used as an indirect command-execution launcher. The rule fires when EITHER ftp.exe is the parent
  of another process, OR a process named (or originally named) ftp.exe runs with a `-s:` script flag. ftp.exe will read a text script and run an embedded `cmd /c` command, letting an operator execute
  arbitrary commands and stage downloads while the spawning chain appears to be a built-in file-transfer utility.
  Legitimate use exists (scripted FTP transfers), so the investigation should determine which branch fired, what the `-s:`
  script contained, what child processes or outbound connections ftp.exe produced, and whether this user, host, and parent
  chain routinely run ftp.exe this way.
type: detection
detection_id: 06b401f4-107c-4ff9-947f-9ec1e7649f1e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alert match one of the ftp.exe abuse branches — ftp.exe as the parent of a child, or a process named ftp.exe running with the `-s:` script flag?
  context: This rule fires on EITHER of two branches, so confirm which one matched before investing time. Note whether ftp.exe is the parent of the alerting process, or whether the alerting process is ftp.exe (by Image or OriginalFileName) running with a `-s:` script-file flag. The branch that fired tells you whether the script content, the child process, or both carry the investigative weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run ftp.exe for scripted file transfers?
  context: Scripted FTP transfers are routine on some servers and file-staging hosts but unusual on a standard workstation. Knowing whether this user role and host function legitimately use ftp.exe with script files is often the fastest way to separate a benign automation from an operator abusing the binary to run commands.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is the parent expected to spawn this process, and what started the parent itself?
  context: The parent-child relationship is the core signal. When ftp.exe is the parent, the child (often cmd.exe) is what ftp.exe was directed to run via its script; when ftp.exe is the child, the parent reveals who invoked it. Tracing the parent's own origin shows whether the chain is a legitimate scripted transfer or a launcher driven by a macro, a downloaded script, or an interactive operator.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: If ftp.exe (or its parent) launched the alerting process, it may have launched others. ftp.exe scripts can chain multiple `cmd /c` invocations, and a suspicious parent often spawns reconnaissance or download helpers alongside the alerting child. Multiple children from the same parent point to orchestrated activity rather than a one-off transfer.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did ftp.exe run? Decode the `-s:` script path and the full command line.
  context: The full command line names the script file passed to `-s:` and any embedded operations. ftp.exe reads that script and executes an embedded `cmd /c` command, so the script content is where the real action lives. Identify the script path so it can be retrieved, and read the command line for the FTP server, transfer direction, and any chained command. This query scopes to all ftp.exe executions on the host within the window so sequential script invocations that form one operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1202.script_file
  question: What file did ftp.exe read or write — the `-s:` script and any transferred payload?
  context: ftp.exe with `-s:` reads a text script that often contains the FTP commands plus an embedded shell command, and a download branch writes the transferred file to disk. Look for the script file (frequently a .txt in a user-writable directory) and any executable or archive ftp.exe pulled down. The script content and the staged payload are the artifacts that reveal intent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \ftp.exe
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1202.network_connection
  question: What outbound connections did ftp.exe make, and where did they go?
  context: An FTP transfer opens an outbound connection to the configured server (control on 21, data on a negotiated port). Review the destination addresses and ports to determine whether ftp.exe reached an expected internal file server or an external host, and whether the destination is a known-good egress target. An unexpected external destination paired with a download is consistent with payload staging.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \ftp.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: template:cue_parent_process.follow_on
  question: What other processes did ftp.exe spawn on this host?
  context: When ftp.exe is the launcher, its script can direct multiple `cmd /c` commands, each producing a child process. Listing every child of ftp.exe on the host reveals the full scope of what was executed through the file-transfer utility — reconnaissance, additional downloads, or persistence commands beyond the one that triggered the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Does this parent process normally spawn this child on this host?
  context: Some parent-child pairings are routine and others are inherently unusual. ftp.exe spawning cmd.exe is rarely part of normal operations, and a parent that has never before spawned this child on the host is a stronger signal. Zero or very low historical counts indicate a novel spawning relationship worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run ftp.exe?
  context: ftp.exe that has never run on a host is more suspicious than one that runs regularly as part of a known transfer job. Zero or very low historical counts over the baseline window indicate first-time or rare execution; a steady prior history points to an established automation rather than an introduced launcher.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \ftp.exe
      selection_child_img:
      - Image|endswith: \ftp.exe
      - OriginalFileName: ftp.exe
      selection_child_cli:
        CommandLine|contains|windash: '-s:'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent or all of selection_child_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \ftp.exe
      selection_child_img:
      - Image|endswith: \ftp.exe
      - OriginalFileName: ftp.exe
      selection_child_cli:
        CommandLine|contains|windash: '-s:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent or all of selection_child_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar ftp.exe or command-execution activity on other hosts in the same window, the scope is larger than a single transfer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \ftp.exe
      selection_child_img:
      - Image|endswith: \ftp.exe
      - OriginalFileName: ftp.exe
      selection_child_cli:
        CommandLine|contains|windash: '-s:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent or all of selection_child_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what happened after — reconnaissance, privilege escalation, or persistence mechanisms. Aggregating by Image and ParentImage collapses repetitive agent noise into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct the timeline. Execution via a trusted utility is frequently a mid-chain action rather than the first step.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
