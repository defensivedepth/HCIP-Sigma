  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1216) is not covered — pull in cue_image_load.* or author a
        custom question with `category: image_load`"
      disposition: declined
      reason: >-
        This rule's mechanism is command-line script proxy execution: a signed winrm.vbs reads an attacker-controlled XSL and
        runs embedded JScript via the msxml/WSH transform engine. There is no malicious PE/DLL image_load to observe — the
        unsigned code runs in-script inside the already-loaded, catalog-signed script-host modules, so an image_load query on
        cscript.exe/wscript.exe would return only their normal signed module set with no separation between benign and abuse
        firings. The load-bearing artifact is the on-disk XSL/host file, which Q10 (attack:T1216.file_event) covers directly,
        and the in-script payload surfaces as a spawned child in Q7 (follow_on). No compensating attack:T1216.image_load
        question authored.
    - hint: "logsource 'process_access' (recommended by techniques: T1216) is not covered and no template family exists —
        author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        The bypass does not involve cross-process handle access or memory manipulation of another process — the signed script
        host executes attacker JScript within its own process via the XSL transform, then spawns ordinary children. There is no
        target process being opened (no GrantedAccess mask to key on), so a process_access query would have no selective
        signal distinguishing this rule's firing from background telemetry. The relevant evidence (host relocation + XSL drop,
        and any spawned payload) is covered by Q3, Q7, and Q10. No compensating attack:T1216.process_access question authored.
