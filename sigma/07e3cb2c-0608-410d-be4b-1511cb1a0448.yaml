name: Tamper Windows Defender Remove-MpPreference
id: c8f728fc-48b9-4095-9403-73ebb46c36a8
description: |
  Detects a command line that runs the PowerShell Remove-MpPreference cmdlet together with one of
  several Windows Defender hardening parameters, removing Controlled Folder Access protected folders,
  Attack Surface Reduction rule IDs or actions, or the check-for-signatures-before-scan setting. The
  rule fires only when both the Remove-MpPreference token and one of the targeted Defender parameters
  are present, so it reflects deliberate weakening of a specific protection rather than routine
  Defender administration. Stripping these settings reduces ransomware and exploit protection on the
  host; the investigation should establish exactly which protection was removed, who removed it,
  whether the change is still in effect, and what activity followed once the control was weakened.
type: detection
detection_id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain Remove-MpPreference together with one of the targeted Defender hardening parameters?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line against the detection
    criteria. The rule fires only when Remove-MpPreference appears alongside one of the protected-folder,
    Attack Surface Reduction rule, or signature-check parameters. Verify both halves are present and
    that the cmdlet is actually removing a Defender setting rather than reading or listing one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to remove Windows Defender protection settings?
  context: >-
    Legitimate Defender administration occasionally removes a protected folder or an Attack Surface
    Reduction rule, but it is usually performed by a known administrator or a management tool on a
    managed endpoint. A standard user or a host with no administrative remit stripping Defender
    hardening is far less expected than an IT-managed change, and the user/host context is often the
    fastest path to distinguishing routine tuning from deliberate weakening.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which specific Windows Defender protection did this command remove?
  context: >-
    Different parameters strip different protections, and the impact varies. Removing a
    ControlledFolderAccessProtectedFolders entry exposes that folder set to ransomware-style writes;
    removing AttackSurfaceReductionRules_Ids or AttackSurfaceReductionRules_Actions disables an exploit
    or script-abuse mitigation; removing CheckForSignaturesBeforeRunningScan lets scans run on stale
    definitions. Read the full command line to identify which parameter and which value was removed, as
    this determines the remediation step of re-adding the protection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is the removed Defender protection currently restored, or is the host still running without it?
  context: >-
    The removal may be temporary or persistent. Checking the current Defender configuration for the
    affected setting reveals whether the protected folder, Attack Surface Reduction rule, or
    signature-check option is back in place or still missing. If the protection is still removed, it
    should be restored before further investigation unless the change is an approved configuration for
    this host. Current Defender preference state is confirmed from the endpoint or its management
    console rather than from the command-line event alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1562.001.registry_set
  question: Were Windows Defender policy values modified directly in the registry on this host around the time of the alert?
  context: >-
    Defender hardening removed through Remove-MpPreference is reflected in the Defender registry policy
    tree, and the same effect can be written directly to the registry without a cmdlet, which the
    command-line view does not capture. Registry writes under the Windows Defender policy keys that
    clear protected-folder, Attack Surface Reduction, or scan settings confirm the protection change and
    may reveal tampering that bypassed PowerShell entirely. Correlate any such writes with the alerting
    process and user.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows Defender'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell execution, and is that parent chain expected for Defender administration?
  context: >-
    The parent process reveals how the cmdlet was invoked. Legitimate Defender tuning usually descends
    from an interactive administrative shell or a management agent. A parent such as a script host, an
    Office application, a remote-execution service, or an unfamiliar binary points toward automated or
    operator-driven tampering rather than hands-on administration. Note what spawned the parent and what
    else the parent launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the Defender protection was removed?
  context: >-
    Defenses are weakened for a reason, usually to allow execution or file writes that the removed
    control would otherwise block or flag. Examining process activity immediately after the removal can
    reveal payload execution, file staging into a previously protected folder, or other actions the
    change was meant to enable. Correlate this window with file events in the affected folder set and
    with network connections to confirm what followed.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host beyond the Defender setting removal?
  context: >-
    Operators who weaken one control often weaken several. Stopping AV/EDR services, clearing logs, or
    deleting shadow copies alongside the Defender change indicates a coordinated effort to reduce
    visibility and recovery options. Finding multiple tampering events from the same user or parent
    process in the same window points to a single operation rather than an isolated administrative
    action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this Remove-MpPreference pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even routine Defender tuning can be abused. The query mirrors the rule's selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this specific
    Remove-MpPreference pattern has historically run here rather than generic PowerShell usage. A new
    parent process, an unexpected user account, or an unusual command-line structure is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_remove:
        CommandLine|contains: Remove-MpPreference
      selection_tamper:
        CommandLine|contains:
        - '-ControlledFolderAccessProtectedFolders '
        - '-AttackSurfaceReductionRules_Ids '
        - '-AttackSurfaceReductionRules_Actions '
        - '-CheckForSignaturesBeforeRunningScan '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_remove:
        CommandLine|contains: Remove-MpPreference
      selection_tamper:
        CommandLine|contains:
        - '-ControlledFolderAccessProtectedFolders '
        - '-AttackSurfaceReductionRules_Ids '
        - '-AttackSurfaceReductionRules_Actions '
        - '-CheckForSignaturesBeforeRunningScan '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_remove:
        CommandLine|contains: Remove-MpPreference
      selection_tamper:
        CommandLine|contains:
        - '-ControlledFolderAccessProtectedFolders '
        - '-AttackSurfaceReductionRules_Ids '
        - '-AttackSurfaceReductionRules_Actions '
        - '-CheckForSignaturesBeforeRunningScan '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated changes across
    multiple endpoints. If the same user removed Defender protections or ran other tampering on more
    than one host, the scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_remove:
        CommandLine|contains: Remove-MpPreference
      selection_tamper:
        CommandLine|contains:
        - '-ControlledFolderAccessProtectedFolders '
        - '-AttackSurfaceReductionRules_Ids '
        - '-AttackSurfaceReductionRules_Actions '
        - '-CheckForSignaturesBeforeRunningScan '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining what else ran on the host in the surrounding window
    reveals what led to the Defender change and what happened after, and whether it is part of a larger
    sequence. Novel parent-child pairs stand out at low counts against the high-count rows of routine
    agent and system telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this Remove-MpPreference pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this Defender-removal pattern rather than generic PowerShell usage. Many hosts firing the
    same pattern points to scripted deployment or a management policy rollout; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_remove:
        CommandLine|contains: Remove-MpPreference
      selection_tamper:
        CommandLine|contains:
        - '-ControlledFolderAccessProtectedFolders '
        - '-AttackSurfaceReductionRules_Ids '
        - '-AttackSurfaceReductionRules_Actions '
        - '-CheckForSignaturesBeforeRunningScan '
      condition: all of selection_*
    fields:
    - host.name
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around the time of the alert?
  context: >-
    Weakening Defender is often a preparatory step rather than the objective. After reducing protection,
    operators commonly install persistence using scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions so the foothold survives. Multiple persistence-tool executions in the same
    timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:persistence_scope.file_based_persistence
  question: Were files dropped to persistence locations such as the Startup folder or Run key paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script
    into the Startup folder or a path referenced by a registry Run key achieves persistence without
    running schtasks, sc, or reg, and a Defender protection that was just removed may have been blocking
    exactly such a write. File event monitoring captures these drops even when standard persistence tools
    are avoided.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
