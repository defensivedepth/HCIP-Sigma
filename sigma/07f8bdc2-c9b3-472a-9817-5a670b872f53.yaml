name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
id: 53c60eca-6c3c-44e1-ac52-e5b51f408d02
description: |
  Detects cmdkey.exe run with the list flag (-l / /list), which enumerates the stored user names and
  credentials in Windows Credential Manager. The rule fires when the process is cmdkey.exe (by image name
  or original file name) AND the command line contains the list flag. Listing cached credentials is a
  reconnaissance step that lets an operator discover which remote systems a foothold can authenticate to
  transparently, often as a precursor to lateral movement using those cached credentials. Legitimate
  administrative use exists, so the investigation should determine who ran it, whether that user and host
  routinely manage stored credentials, and what activity followed.
type: detection
detection_id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did cmdkey.exe run with the list flag (-l or /list) as the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line and process identity. The rule requires both that the process is cmdkey.exe (by image name
    or original file name) and that the command line contains the list flag, so confirm the flag is present
    and not a substring of an unrelated argument.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enumerate stored Windows credentials?
  context: Listing cached credentials is a routine step for some administrators managing saved RDP or network
    credentials, but unusual for general users. Knowing whether the user role and host function are consistent
    with credential management is often the fastest path to distinguishing routine work from reconnaissance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: What credentials did the list operation enumerate, and was a specific target named?
  context: cmdkey targets Windows Credential Manager. A bare list flag returns every stored user name and
    credential on the system; a target-qualified form narrows to one host or domain. Identifying which stored
    credentials were exposed determines which remote systems the foothold could reach with transparently cached
    authentication, and therefore which accounts may need rotation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts are reachable via the cached credentials, and do any have elevated privileges?
  context: The severity of cached-credential reconnaissance depends on what the stored credentials grant. Cached
    domain-admin or service-account credentials enable transparent authentication to high-value systems and
    require escalation; a standard user account may only need monitoring. Cross-reference the listed targets
    and the running user with directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned cmdkey.exe and is that parent chain expected?
  context: The parent process reveals how the enumeration was invoked. Interactive use under explorer.exe or a
    console shell driven by an administrator looks different from cmdkey spawned by a script host, a remote
    execution tool, or a process call create from a management utility, which points to scripted or remote
    reconnaissance.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Cached-credential reconnaissance is typically followed by lateral movement that uses those credentials
    to authenticate to other systems transparently. Follow-on alerts for remote execution, new authentication
    events, or outbound remote-service connections shortly after the enumeration indicate active exploitation
    of the cached credentials rather than benign administration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:cue_process_tool.follow_on
  question: What child processes did cmdkey.exe spawn afterward?
  context: cmdkey is an information utility and does not normally spawn child processes. Children such as
    cmd.exe, powershell.exe, wmic.exe, or other remote-execution tooling launched from the same binary would be
    unexpected and suggest the enumeration was one step in a scripted sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1003.005.command_analysis
  question: Were credential-store files or registry hive exports written on this host shortly after the alert?
  context: Cached-credential reconnaissance often precedes an attempt to extract the credentials themselves
    through registry hive exports or copies of credential and vault files. File-creation artifacts under user
    or vault credential directories, or hive copies near the alert time, escalate this from listing to
    collection. If file events are not collected in this environment, treat zero results as a visibility gap.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_cred:
        TargetFilename|contains:
          - '\Microsoft\Credentials\'
          - '\Microsoft\Vault\'
          - '\Microsoft\Protect\'
          - '.hive'
          - 'sam.save'
          - 'security.save'
          - 'system.save'
      condition: selection and filter_cred
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline
  question: Does this host normally run cmdkey.exe?
  context: A binary that has never been seen on a host is more notable than one that runs regularly. Zero or
    very low historical counts over the past 90 days indicate first-time or rare execution of cmdkey on this
    endpoint, which raises the weight of a credential-reconnaissance interpretation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this cmdkey list pattern, what parents and users drove it, and
    does the current alert fit?
  context: Even legitimate tools get abused. The query mirrors the rule's selection scoped to this host, so the
    resulting parent and user distribution reflects how this specific cmdkey list pattern has historically run
    here rather than generic cmdkey usage. A new parent process, an unexpected user account, or an unusual
    command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdkey.exe
      - OriginalFileName: cmdkey.exe
      selection_cli:
        CommandLine|contains|windash: ' -l'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this cmdkey list pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    cmdkey list pattern rather than generic cmdkey usage. Many hosts firing the same pattern points to scripted
    deployment or management automation; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdkey.exe
      - OriginalFileName: cmdkey.exe
      selection_cli:
        CommandLine|contains|windash: ' -l'
      condition: all of selection*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run cmdkey.exe?
  context: Compare this user's current action against their historical behavior across all hosts over 90 days. A
    user who has never enumerated stored credentials is more notable than one who does so as part of a known
    administrative role. User role and typical toolset should align.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and cmdkey.exe combination historically routine on this host or across the environment,
    or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism, which parent process spawned cmdkey, and whether that pair is
    historically common. A new or rare parent for cmdkey on this host or environment-wide is the deviation worth
    chasing; a pair that already accounts for many prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar reconnaissance or remote-execution activity on multiple hosts,
    the scope may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and cmdkey.exe combination fire on other hosts in the same window, indicating a
    coordinated rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did returns agent-telemetry noise because every
    host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism, the
    parent process and spawned binary, fired on other hosts in the alert window. Multiple hosts in the same
    window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the
    credential enumeration and what followed it. Look for reconnaissance, remote-execution tooling, or
    persistence mechanisms appearing as novel parent-child pairs at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host such as defense tampering, reconnaissance, or execution may reveal
    the attack stages that preceded the credential enumeration and help reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes hands-on-keyboard credential work. The query surfaces direct attempts to
    disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows
    is a useful protection-looks-healthy signal; kernel-level driver tampering and in-memory patches will not
    appear here. Populated rows shift the disposition toward operator preparation, so review the parent process
    and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
