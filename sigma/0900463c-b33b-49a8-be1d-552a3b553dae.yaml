name: Potential Hidden Directory Creation Via NTFS INDEX_ALLOCATION Stream - CLI
id: 4d69468f-061b-47fa-bc7b-27e98acd1f4d
description: |
  Detects a command line that references the NTFS "::$index_allocation" stream
  specifier. On an NTFS volume a directory is a stream of type $INDEX_ALLOCATION,
  and appending "::$index_allocation" to a name when creating a directory (for
  example mkdir foo::$index_allocation, or the equivalent Win32 CreateDirectory
  call) produces a directory that is hidden from Explorer and from a plain "dir"
  listing yet remains accessible when referenced by its full stream-suffixed path.
  Operators use this to stage payloads or persistence in a location that ordinary
  file browsing will not reveal. The technique can also bypass certain
  permission checks that only trigger on conventional directory-creation calls.
  Legitimate use of this literal syntax on a command line is rare, so the
  investigation should confirm the exact command, identify what spawned it, decode
  the target path, and check the file-system and process activity around it for a
  drop-and-execute or persistence step.
type: detection
detection_id: 0900463c-b33b-49a8-be1d-552a3b553dae
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain the "::$index_allocation" NTFS stream specifier this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive
    by reading the exact command line. The rule fires on any command line containing
    the literal "::$index_allocation" string. Confirm the specifier is present and
    note the name it is attached to, since that name is the directory being created
    or referenced as a hidden NTFS index-allocation stream.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to manipulate NTFS streams from the command line?
  context: Referencing the "::$index_allocation" stream syntax directly on a command
    line is not part of routine administration; ordinary directory creation never
    needs the explicit stream suffix. Knowing whether the user role and host function
    plausibly involve low-level file-system or storage tooling is often the fastest
    way to separate a deliberate hide-artifact action from a rare but benign one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What directory name and path does the "::$index_allocation" specifier target, and what else does the full command do?
  context: The full command line reveals the specific action. Decode the name the
    stream suffix is attached to (that is the directory being hidden), the path it
    sits under, and any other operators chained on the same line such as a copy,
    move, or follow-on launch into that hidden location. The host-scoped pattern
    query surfaces every command on this host carrying the stream specifier within
    the window, which captures multi-step sequences that create the directory and
    then write into it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '::$index_allocation'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- source: template:cue_process_tool.process_chain
  question: What process created the one that ran the stream command, and is that parent chain expected?
  context: The parent process reveals how the command was invoked. A directory-hiding
    command launched from an interactive shell a user opened reads differently from
    one spawned by a script host, an Office application, or a remote-execution tool.
    Restricting attention to suspicious launch parents such as powershell.exe,
    cmd.exe, or wscript.exe helps separate a deliberate staging action from an
    incidental one.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Hiding a directory to stage a payload is often paired with attempts to
    weaken protection so the payload runs unobserved. This surfaces direct attempts
    to disable AV/EDR services, flip Defender flags, add exclusions, clear logs, or
    patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal; populated
    rows shift the disposition toward deliberate operator preparation, so review the
    writer's parent process and signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: attack:T1564.004.create_stream_hash
  question: Did the host record a named-stream creation event for an alternate or index-allocation stream around this time?
  context: A directory or file created with an explicit NTFS stream suffix can surface
    as a named-stream creation event separate from the process command line. Correlating
    a stream-creation record with the alerting command confirms that a non-default
    stream was actually written rather than merely referenced, and the recorded stream
    name and target path show exactly what was hidden. Legitimate alternate-data-stream
    usage by system or security tooling is the main benign source here, so weigh the
    writing process and target path against known-good tooling.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: create_stream_hash
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - Contents
- source: attack:T1564.004.file_event
  question: What files or directories were written on this host in the surrounding window, and do any sit in unusual or user-writable locations?
  context: The hidden directory exists on disk even though plain listings will not
    show it, and the operator's intent is usually to drop a payload or persistence
    artifact inside it. File-system activity in the same window shows what was written
    near the hidden directory and where. Pay attention to executable or script files,
    and to writes under user-writable locations such as the public profile, TEMP,
    APPDATA, or ProgramData; routine alternate-data-stream usage by trusted tooling
    can be allow-listed, but a fresh executable landing in a directory created with
    the stream specifier is the artifact worth chasing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.follow_on
  question: What did the process that ran the stream command do next, and was the hidden directory used immediately afterward?
  context: The value of hiding a directory is realized when something is written into
    it or executed from it. Tracking the child processes of the command that created
    the stream, and activity in the minutes after, shows whether the hidden location
    was immediately populated or launched from. A tight gap between the directory
    creation and a follow-on write or execution strengthens the staging interpretation;
    a long-dormant hidden directory with no follow-on is weaker but still notable.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host produced the "::$index_allocation" stream pattern before, or is this the first time?
  context: A host that has never recorded this stream specifier on a command line is
    more suspicious than one where storage or forensic tooling exercises the syntax
    routinely. Zero or very low historical counts indicate first-time or rare use of
    the hide-artifact technique on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '::$index_allocation'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously produced the stream pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even rare syntax can have an established local source. The query mirrors the
    rule's selection scoped to this host, so the resulting parent and user distribution
    reflects how this specific stream pattern has historically run here rather than
    generic file activity. A new parent process, an unexpected user account, or an
    unusual command structure relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains: ::$index_allocation
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts produced the "::$index_allocation" stream pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is
    a fleet-wide count of this stream pattern rather than generic file activity. Many
    hosts producing the same pattern points to scripted deployment or a shared tool;
    a single host or a small unrelated set points to manual operator activity. Use the
    host distribution to calibrate how isolated this event is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains: ::$index_allocation
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains: ::$index_allocation
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window
    reveals lateral movement or coordinated activity on multiple endpoints. If the same
    user staged hidden directories or ran related tooling elsewhere, the scope is larger
    than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding activity reveals
    what led to this event and what followed, and whether the directory hiding is one
    step in a larger sequence. Look for reconnaissance, the tool that performed the
    stream operation, privilege escalation, or persistence installation in the same
    window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host such
    as defense tampering, reconnaissance, or credential access may reveal the stages
    that preceded this event and help reconstruct the timeline. Hiding a directory is
    typically a staging step that follows initial access rather than the start of an
    intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
