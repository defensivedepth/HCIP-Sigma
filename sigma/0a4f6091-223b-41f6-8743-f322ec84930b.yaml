name: Suspicious GUP Usage
id: fef8b13b-995b-4e66-9565-574871c4c473
description: |
  Detects execution of the Notepad++ updater binary GUP.exe from a directory other than
  its expected install or per-user update locations. The rule fires when an Image ending in
  GUP.exe runs AND that Image is not one of the known-good Program Files updater paths and not
  one of the per-user AppData updater paths. GUP.exe is a legitimate, signed open-source
  updater that is a known DLL side-loading host: dropping a malicious library (commonly named
  libcurl.dll) next to a relocated copy of GUP.exe causes the trusted binary to load and run
  attacker code. The investigation should confirm the actual path GUP.exe ran from, identify
  which libraries it loaded and from where, look for a co-located payload drop, and determine
  whether the launch fits any legitimate Notepad++ update activity on this host.
type: detection
detection_id: 0a4f6091-223b-41f6-8743-f322ec84930b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Did GUP.exe run from a directory other than the legitimate Notepad++ updater locations?
  context: Confirm the alert before investing time. The rule fires when an Image ending in
    GUP.exe runs AND the full path is neither the Program Files updater location nor a per-user
    AppData Notepad++ updater location. Read the exact Image path from the triggering event and
    confirm it sits outside those known-good directories. A GUP.exe under a temporary, profile,
    or staging directory is the suspicious case; a path under the standard Notepad++ updater
    folder would not have fired and points to a tuning gap or a near miss.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run the Notepad++ updater?
  context: Notepad++ is a developer and power-user editor; the updater runs as part of a normal
    Notepad++ update check. A host where Notepad++ is installed and a user who runs it interactively
    is a routine context for GUP.exe. A server, a kiosk, or an account that has no reason to run
    Notepad++ is a much weaker fit and pushes the disposition toward a relocated, side-loading copy
    of the binary rather than a genuine update.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this GUP.exe instance do? Decode its command line and working directory.
  context: The full command line and working directory reveal what this updater invocation was
    actually doing and where it was anchored. For a legitimate update the working directory is the
    Notepad++ updater folder and arguments reference the update feed. A working directory in a
    temporary, profile, or staging path, or unusual arguments, indicate the binary was relocated to
    host a side-loaded library rather than to perform a real update.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this GUP.exe and is that parent chain expected?
  context: A genuine update check is normally launched by notepad++.exe or by the user shell when
    they trigger an update. A GUP.exe spawned by an Office application, a script host, a mail client,
    or a decode-and-rename chain points to the binary being staged and run by another component
    rather than by Notepad++ itself. The parent process and its own command line establish how this
    invocation was initiated.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1574.001.image_load
  question: Which libraries did this GUP.exe process load, and were any loaded from a non-standard directory?
  context: DLL side-loading works by placing a malicious library where the trusted binary will find
    it ahead of the legitimate one. GUP.exe loading a library such as libcurl.dll from its own
    relocated directory, a temporary path, or a profile path rather than from the system or the
    standard Notepad++ install is the core mechanism this rule is meant to surface. Review each
    loaded module path and signature, and treat any library loaded from the same non-standard
    directory the binary ran from as the suspected side-load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1574.001.create_stream_hash
  question: Were a library or payload files written into the same directory GUP.exe ran from around this time?
  context: Side-loading requires the loader library and any staged payload to be present next to the
    relocated binary. File write and stream-hash events in the directory GUP.exe ran from often show
    the dropped library and any encrypted blob arriving shortly before execution, including files
    decoded or renamed from an innocuous extension into a DLL. A library or opaque blob written into
    the same staging directory just before the binary ran supports the side-load reading.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1574.dll_search_order
  question: Were registry values that influence DLL search order or known-DLL resolution modified on this host around this time?
  context: Beyond co-locating a library, an actor can redirect which library a process resolves by
    editing registry values that govern DLL search behavior or known-DLL mappings. Modifications to
    these values near the alert can explain how a trusted binary was steered to load an attacker
    library and represent a more durable redirection than a one-time file drop. Review the changed
    value, the writing process, and whether the change aligns with any documented configuration work.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Session Manager\ExcludeFromKnownDlls'
          - '\Image File Execution Options\'
          - '\CWDIllegalInDllSearch'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering with protection frequently precedes payload execution. The query surfaces direct
    attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or
    patch AMSI/ETW. Zero rows is a useful signal that protection looks healthy, though kernel-level
    driver tampering and in-memory patches will not appear here. Populated rows shift the disposition
    toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline
  question: Does this host normally run GUP.exe?
  context: A binary that has rarely or never run on a host is more suspicious than one that runs on
    a regular update cadence. On a host with Notepad++ installed, GUP.exe appears periodically as the
    editor checks for updates. Zero or very low historical counts indicate a first-time or rare
    execution, which fits a relocated copy staged for side-loading rather than the installed updater.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a known binary can be abused. The query mirrors the rule's selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this rule's specific
    firing pattern has run here, not generic GUP.exe usage. A new parent process, an unexpected user
    account, or an unusual launch pattern relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GUP.exe
      filter_programfiles:
        Image|endswith:
        - \Program Files\Notepad++\updater\GUP.exe
        - \Program Files (x86)\Notepad++\updater\GUP.exe
      filter_user:
        Image|contains: \Users\
        Image|endswith:
        - \AppData\Local\Notepad++\updater\GUP.exe
        - \AppData\Roaming\Notepad++\updater\GUP.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this GUP.exe spawn afterward?
  context: A real update process has predictable, limited children. A side-loaded library running
    inside GUP.exe commonly leads to additional execution such as command shells, script hosts, or
    decode utilities used for post-exploitation. Unexpected child processes following this GUP.exe are
    a strong sign the invocation was a loader rather than an updater.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GUP.exe
      filter_programfiles:
        Image|endswith:
        - \Program Files\Notepad++\updater\GUP.exe
        - \Program Files (x86)\Notepad++\updater\GUP.exe
      filter_user:
        Image|contains: \Users\
        Image|endswith:
        - \AppData\Local\Notepad++\updater\GUP.exe
        - \AppData\Roaming\Notepad++\updater\GUP.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GUP.exe
      filter_programfiles:
        Image|endswith:
        - \Program Files\Notepad++\updater\GUP.exe
        - \Program Files (x86)\Notepad++\updater\GUP.exe
      filter_user:
        Image|contains: \Users\
        Image|endswith:
        - \AppData\Local\Notepad++\updater\GUP.exe
        - \AppData\Roaming\Notepad++\updater\GUP.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same account triggered similar relocated-binary or side-loading activity
    on more than one host, the scope of the compromise may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GUP.exe
      filter_programfiles:
        Image|endswith:
        - \Program Files\Notepad++\updater\GUP.exe
        - \Program Files (x86)\Notepad++\updater\GUP.exe
      filter_user:
        Image|contains: \Users\
        Image|endswith:
        - \AppData\Local\Notepad++\updater\GUP.exe
        - \AppData\Roaming\Notepad++\updater\GUP.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led up to this event, what happened after, and whether it is part of a larger
    sequence. Look for the decode-and-rename utilities, file drops, or follow-on execution that often
    accompany staging a binary for side-loading.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    a malicious document opening, a decode-and-rename chain, or reconnaissance — may reveal the stages
    that preceded this event and help reconstruct how a relocated GUP.exe came to run here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this rule's firing pattern rather than generic GUP.exe usage. Many hosts firing
    the same pattern points to a packaging quirk or a deployment that relocates the updater; one host or
    a small unrelated set points to targeted, manual staging. Use the host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GUP.exe
      filter_programfiles:
        Image|endswith:
        - \Program Files\Notepad++\updater\GUP.exe
        - \Program Files (x86)\Notepad++\updater\GUP.exe
      filter_user:
        Image|contains: \Users\
        Image|endswith:
        - \AppData\Local\Notepad++\updater\GUP.exe
        - \AppData\Roaming\Notepad++\updater\GUP.exe
      condition: selection and not 1 of filter_*
    fields:
    - host.name
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1574.001
      name: DLL Side-Loading
      role: primary
    - id: T1574
      name: Hijack Execution Flow
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: relocated_binary_execution
      description: A trusted updater binary (GUP.exe) runs from a non-standard directory, staged to host a side-load.
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: malicious_dll_load
      description: GUP.exe loads a malicious library (e.g. libcurl.dll) from the relocated/non-standard directory ahead of the legitimate one.
      mapped_to: Q5
      source: attack:T1574.001.image_load
    - stage: 3
      label: payload_staging
      description: The loader library and any encrypted payload are written/decoded into the same directory before execution.
      mapped_to: Q6
      source: attack:T1574.001.create_stream_hash
    - stage: 4
      label: load_redirection
      description: Registry values governing DLL search order or known-DLL resolution are modified to redirect library loading.
      mapped_to: Q7
      source: attack:T1574.dll_search_order
    - stage: 5
      label: follow_on_execution
      description: The side-loaded code spawns shells, script hosts, or decode utilities for post-exploitation.
      mapped_to: Q11
      source: template:cue_process_tool.follow_on
  dimension_coverage:
    - dimension: time_correlation
      technique: T1574.001
      covered_by: Q6
      source: attack:T1574.001.create_stream_hash
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1574.001
      covered_by: Q5
      source: attack:T1574.001.image_load
      coverage_type: direct
    - dimension: file_path_analysis
      technique: T1574
      covered_by: Q5
      source: attack:T1574.001.image_load
      coverage_type: direct
    - dimension: time_correlation
      technique: T1574
      covered_by: Q16
      source: template:cue_host_context.clustering
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1574
      covered_by: Q9
      source: template:cue_process_tool.baseline
      coverage_type: direct
  mutable_dispositions:
    - element: AllowedDllPaths
      dimension: tuning_parameter
      specific_values: "rationale only (e.g. C:\\Windows\\System32)"
      disposition: context
      target_question: Q5
      notes: "image_load question asks the analyst to flag libraries loaded from non-standard directories vs. the system/install paths — the allow-path concept is the analytical frame."
    - element: ProcessAllowList
      dimension: tuning_parameter
      specific_values: "rationale only (apps expected to load DLLs from non-standard locations)"
      disposition: context
      target_question: Q10
      notes: "baseline question surfaces whether this binary/parent is an expected loader on this host."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (correlation interval between file create, registry change, module load)"
      disposition: context
      target_question: Q6
      notes: "payload-staging and registry questions use +/-4h windows to correlate file/registry changes with execution."
    - element: HashBaseline
      dimension: tuning_parameter
      specific_values: "rationale only (baseline hashes of legitimate DLLs to detect substitution)"
      disposition: context
      target_question: Q5
      notes: "image_load question directs review of loaded-module signature/signing to detect substituted libraries; no concrete hash values in brief."
    - element: ServiceBaseline
      dimension: tuning_parameter
      specific_values: "rationale only (expected registry keys/service paths)"
      disposition: context
      target_question: Q7
      notes: "registry question reviews DLL-search/known-DLL value changes against expected configuration."
  dedup_decisions:
    - dropped: cue_process_tool.clustering
      reason: "host_context.clustering covers the same +/-15m host-wide activity sweep with the richer Image+ParentImage projection; cue_process_tool.clustering would be a near-identical aggregation."
      kept: cue_host_context.clustering
    - dropped: null
      reason: "user_actor pair — non-deduplicable: cue_user_actor.baseline + baseline_svc and cue_user_actor.clustering + clustering_svc both emitted as paired-and-distinct (subject vs. launch-mechanism pivots)."
      kept: cue_user_actor.baseline / baseline_svc / clustering / clustering_svc
  skipped_templates:
    - template: organizational_context.change_ticket
      reason: "Budget (18-question cap reached). DLL side-loading via a relocated trusted binary is not a change-ticketed administrative action; the org-context set adds less investigative value here than the side-load mechanism questions (image_load/file_event/registry)."
    - template: organizational_context.human_recall
      reason: "Budget cap; human-recall of running an updater rarely disambiguates a side-load (the user may legitimately run Notepad++ while a relocated copy runs separately). host_user_context (Q2) covers the role-expectation angle."
    - template: organizational_context.timing_alignment
      reason: "Budget cap; timing-vs-work-hours is weak signal for an automated update binary. timing context is carried by the +/-15m and -6h host/precursor questions."
    - template: organizational_context.procedural_consistency
      reason: "Budget cap; there is no standard org tooling for 'running GUP.exe', so the procedural-consistency frame does not apply cleanly."
    - template: persistence_scope.process_based_persistence
