      name: Logon Script (Windows)
      role: primary
    - id: T1037
      name: Boot or Logon Initialization Scripts
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: logon_script_configuration
      description: Adversary configures a logon-script value (e.g., per-user logon-script registry value or GPO) so a program runs at sign-in.
      mapped_to: Q3
      source: template:parent_child.parent_process_legitimacy
    - stage: 2
      label: post_auth_execution
      description: After interactive authentication, userinit.exe launches the configured program as a child process.
      mapped_to: Q5
      source: attack:T1037.001.security
    - stage: 3
      label: child_operation
      description: The launched child process performs its operation; decoding its command line reveals what it does.
      mapped_to: Q4
      source: template:cue_process_tool.mechanism_decode
  dimension_coverage:
    - dimension: tuning_parameter
      technique: T1037.001
