      coverage_type: direct
    - dimension: command_analysis
      technique: T1037
      covered_by: Q4
      source: template:cue_process_tool.mechanism_decode
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1037
      covered_by: Q3
      source: template:parent_child.parent_process_legitimacy
      coverage_type: direct
    - dimension: time_correlation
      technique: T1037
      covered_by: Q5
      source: attack:T1037.001.security
      coverage_type: direct
    - dimension: user_context
      technique: T1037
      covered_by: Q8
      source: template:cue_user_actor.baseline
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1037
      covered_by: Q7
      source: template:cue_parent_process.baseline
      coverage_type: direct
  mutable_dispositions:
    - element: script_path_keywords
      dimension: tuning_parameter
      specific_values: "NETLOGON, SYSVOL, \\domain\\sysvol\\*.bat/.ps1"
      disposition: context
      target_question: Q4
      notes: "Rule scopes only on ParentImage=userinit.exe; script path is variable per environment, so named in mechanism-decode context (look for a child resolving to a script under NETLOGON/SYSVOL or a user-writable path) rather than hardcoded into a query selection."
    - element: execution_time_window
      dimension: tuning_parameter
      specific_values: "user logon hours / first X minutes post-authentication"
      disposition: query_injection
      target_question: Q5
      notes: "Security-logsource logon-correlation question ties the child to the nearest 4624/4648 within +/-15m, realizing the post-authentication window."
    - element: user_context
      dimension: tuning_parameter
      specific_values: "rationale only (high-privilege / remote-access users)"
      disposition: context
      target_question: Q8
      notes: "Covered by user baseline and host_user_context framing; no fixed value to inject."
    - element: TargetObject
      dimension: tuning_parameter
      specific_values: "registry path varies by user/policy (e.g., HKCU\\Environment\\UserInitMprLogonScript)"
      disposition: context
      target_question: Q3
      notes: "Rule is process_creation only; the configuring registry path is named in description/context as the upstream cause rather than queried (no registry_set logsource in this rule's detection)."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "userinit.exe (the rule's fixed parent)"
      disposition: query_injection
      target_question: Q3
      notes: "Parent is fixed by the rule; parent_process_legitimacy and parent-child baseline both pivot on it."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (logon clustering during user shifts)"
      disposition: context
      target_question: Q5
