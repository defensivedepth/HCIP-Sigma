name: Renamed NetSupport RAT Execution
id: 92ab57f3-d291-40d8-aa2d-de9017f87496
description: |
  Detects a NetSupport remote-control binary (canonical name client32.exe) that has been renamed
  on disk, identified by its embedded PE metadata (Product NetSupport Remote Control, OriginalFileName
  client32.exe) or its known import hash, while the on-disk filename is no longer client32.exe.
  NetSupport is a legitimate remote-administration tool, so authorized IT support is the benign
  explanation; renaming the executable to evade name-based detection is a common deployment pattern
  for unauthorized or attacker-controlled remote access. Investigation should establish the binary's
  true identity, how it arrived, whether the tool is sanctioned here, where it connects, and what it
  did after launch.
type: detection
detection_id: 0afbd410-de03-4078-8491-f132303cb67d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does this process carry NetSupport metadata while running under a non-client32 filename?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    when a process exposes one of the NetSupport markers — Product NetSupport Remote Control, OriginalFileName
    client32.exe, or the known import hash IMPHASH=A9D50692E95B79723F3E76FCF70D023E — while its on-disk
    Image does not end in client32.exe. Review the alerting event and confirm at least one marker is
    present and the filename has in fact been changed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Hashes
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run NetSupport remote-control software?
  context: Legitimate remote-administration activity can trigger this detection. Knowing whether the
    user role and host function are consistent with sanctioned remote support is often the fastest path
    to distinguishing approved IT use from an unauthorized or attacker-deployed remote access tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: When a binary is renamed, the PE metadata (OriginalFileName) and import hash still reflect
    the original tool. Comparing the Image path (the name on disk) against OriginalFileName and the
    Product string reveals the true identity — here, a NetSupport client even when the filename has
    been changed. The file hash enables threat-intelligence lookups to determine whether this is a
    known-legitimate build of the tool, a known-malicious sample, or a novel binary requiring deeper
    analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: What did this NetSupport binary do? Decode the full command line and working directory.
  context: The full command line reveals the specific action taken at launch — configuration files
    loaded, connection parameters, or session options. Decode any flags, file paths, or arguments to
    understand what behavior they represent. This scopes to every execution of this binary on the host
    in the surrounding window, which surfaces the operation as a whole rather than only the triggering
    event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this binary and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Sanctioned remote-administration tools
    typically launch from an installer, a service, or explorer.exe for an interactive run. Unusual
    parents such as script hosts, Office applications, or archive utilities point to delivery via a
    macro, a downloaded loader, or extraction from an archive rather than a managed deployment.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.binary_origin
  question: How did this renamed binary arrive on the host?
  context: 'Renamed binaries do not appear spontaneously — they were copied, downloaded, or dropped
    by a parent process. Tracing the file-creation event for this binary by basename over a long window
    reveals the delivery mechanism: a download tool, a malware dropper, manual copy via explorer or a
    remote access session, or transfer from another host. A user-writable landing location (Downloads,
    Temp, AppData, ProgramData) points to download or extraction; a system directory may indicate an
    installer or a more privileged writer.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: The purpose of renaming a remote-control binary is to evade name-based detection while
    performing its intended function. Examining the child processes, file operations, and connections
    originating from it reveals whether it is doing routine remote-support work or being used for
    follow-on actions such as reconnaissance, credential access, or staging. The same renamed binary
    appearing on multiple hosts points to deliberate distribution rather than an isolated install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:remote_access_tool.tool_authorization
  question: Is NetSupport on the organization's approved remote access software list?
  context: Organizations typically maintain a list of sanctioned remote-administration tools for IT
    support. A remote access tool that is not on that list — even well-known commercial software —
    may represent shadow IT or attacker-deployed persistence, and a renamed instance is more likely
    unauthorized still. Unapproved tools should be checked regardless of the tool's reputation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a current helpdesk ticket or support session explaining this remote access?
  context: Legitimate remote access usage typically correlates with an active support ticket, a
    scheduled maintenance window, or a user request. If no support context exists for this session,
    the tool may have been installed by an attacker for persistent access or by a user circumventing
    security controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint is this tool connecting to?
  context: Remote access tools establish outbound connections to relay servers, vendor cloud
    infrastructure, or operator-controlled endpoints. The destination reveals whether the tool is
    reaching the vendor's legitimate gateway/geolocation infrastructure or a custom and unusual
    endpoint. A renamed instance connecting to non-vendor infrastructure is a strong pivot toward an
    unauthorized deployment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.baseline
  question: Does this host normally run this binary?
  context: A process that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts over the baseline window indicate first-time or
    rare execution of this binary on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally
    drive it, and does the current alert fit that pattern?
  context: Even sanctioned tools can be abused. This query mirrors the rule's selection structure
    scoped to this host, so the resulting parent/user distribution reflects how the rule's specific
    firing pattern — not generic NetSupport usage — has historically run here. A new parent process,
    an unexpected user account, or an unusual launch shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product|contains: NetSupport Remote Control
      - OriginalFileName|contains: client32.exe
      - Hashes|contains: IMPHASH=A9D50692E95B79723F3E76FCF70D023E
      filter:
        Image|endswith: \client32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run NetSupport remote-control software?
  context: Compare this user's current action against their historical behavior. A user who has never
    run this tool is more suspicious than one who does so regularly, and user role should align with
    remote-administration responsibilities. Low or zero counts across the baseline window indicate
    this is not part of the user's routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the
    environment, or is the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: which parent process spawned this binary, and whether
    that pair is historically common. A new or rare parent for this binary — on this host or env-wide —
    is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor
    or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user drove similar activity on several hosts, the scope of the
    operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window, or is
    the activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise, since every host runs service-owned processes constantly. The meaningful
    question is whether the same launch mechanism — parent process plus spawned binary — fired on other
    hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context — what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, or persistence mechanisms near the alert time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before
    the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to
    disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW.
    Zero rows is a useful signal that protection looks healthy, though kernel-level driver tampering and
    in-memory patches will not appear here. Populated rows shift the disposition toward operator
    preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
