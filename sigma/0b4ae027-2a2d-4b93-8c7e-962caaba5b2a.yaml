  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1218) is not covered — pull in cue_image_load.* or author a custom question with category: image_load"
      disposition: declined
      reason: >-
        This rule's detection is a parent-child process_creation relationship (ParentImage ends in tttracer.exe), not module loading. The image_load analytic for T1218 targets DLL-side-loading style proxy execution (rundll32/regsvr32 loading attacker modules), which is a different abuse path than tttracer.exe spawning a child or dumping memory. The proxy-execution and credential-dump chain is fully covered by the process_creation, process_access (Q6), and file_event (Q7) questions; an image_load sweep of tttracer.exe modules would return load volume without precision for this rule's parent-spawn behavior.
    - hint: "logsource 'network_connection' (recommended by techniques: T1218) is not covered — pull in cue_network_endpoint.* or author a custom question with category: network_connection"
      disposition: declined
      reason: >-
        The network_connection analytic for T1218 targets trusted binaries retrieving remotely hosted payloads. tttracer.exe abuse in this rule is local — proxy-executing an on-disk child or dumping lsass.exe to a local file — and the binary has no documented network-retrieval mode. No remote-fetch step exists to query; post_access_lateral_movement (Q14) already covers outbound follow-on connections via alert correlation.
    - hint: "logsource 'registry_set' (recommended by techniques: T1003.001) is not covered — pull in cue_registry_key.* or author a custom question with category: registry_set"
      disposition: declined
      reason: >-
        tttracer.exe credential theft is memory-based (full-access handle to lsass.exe followed by a memory dump file), not registry-hive based. The registry_set dimension of T1003.001 applies to SAM/SECURITY hive credential operations, which this LOLBIN does not perform. The access and dump artifacts are covered by the process_access (Q6) and file_event (Q7) questions.
    - hint: "logsource 'security' (recommended by techniques: T1003.001) is not covered and no template family exists — author a custom question with category: security"
      disposition: declined
      reason: >-
        The Security-log analytic for T1003.001 (4673 sensitive-privilege use, 4663/4656 object access on lsass) measures the same LSASS-access event surfaced by the Sysmon process_access question (Q6, GrantedAccess 0x1F0FFF to lsass.exe). Authoring a parallel Security-channel question would duplicate the access_verification coverage on a log source that is less reliably enabled; Q6 covers the dimension.
