name: Time Travel Debugging Utility Usage
id: 8b53b550-335a-4e67-ae07-d4f087c06a5e
description: |
  Detects any process whose parent is tttracer.exe, the Windows Time Travel Debugging utility. tttracer.exe is a signed, system-resident binary that can proxy-execute an arbitrary executable as a child process or dump the memory of a target process (for example lsass.exe via the -dumpFull -attach syntax). Legitimate use comes from software developers and testers recording execution traces; malicious use abuses the trusted binary to run payloads or scrape credentials from LSASS. Investigation should establish what child tttracer.exe launched, whether the launch resembles credential dumping, and whether the launch is consistent with developer activity on this host.
type: detection
detection_id: 0b4ae027-2a2d-4b93-8c7e-962caaba5b2a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did this process get spawned by tttracer.exe?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires whenever a process has a parent whose image path ends in tttracer.exe. Verify the ParentImage value and note the child Image and its command line, since the child identity drives the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- source: template:universal.host_user_context
  question: Is this user and host expected to run the Time Travel Debugging utility?
  context: tttracer.exe is a developer and tester tool for recording execution traces. On a developer workstation it can be routine; on a server, a domain controller, or a general-purpose endpoint it is unexpected and weighs toward abuse of a trusted binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes credential access. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation for an LSASS dump; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:credential_access.credential_target_identification
  question: Did this tttracer.exe invocation proxy-execute a payload or dump process memory, and was LSASS the target?
  context: tttracer.exe supports two abuse modes — spawning an arbitrary executable as a child, and dumping a target process by PID with the -dumpFull -attach syntax. Inspect the triggering command line and the child image to determine which mode this is. An LSASS PID as the dump target, or a credential-tool child, points to credential scraping; an unrelated executable points to proxy execution of a payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_parent_process.mechanism_decode
  question: What command line did tttracer.exe itself run with, and what launched tttracer.exe?
  context: The parent's own process_creation event carries the tttracer.exe command line, where the operational intent lives — a target path for proxy execution or -dumpFull -attach with a PID for memory dumping. The grandparent (what spawned tttracer.exe) shows whether this came from an interactive developer shell or from an unexpected launcher such as a script host or remote-execution tool.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: attack:T1003.001.access_verification
  question: Did any process open a full-access handle to lsass.exe on this host around the time of the alert?
  context: Credential scraping from LSASS opens a handle with full access rights (0x1F0FFF) before reading or dumping memory. A handle to lsass.exe at that access mask from a process other than a known security tool corroborates that the tttracer.exe activity is a memory dump rather than benign tracing. Allowlist legitimate AV/EDR processes when reviewing results.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess: '0x1F0FFF'
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: attack:T1003.001.dump_artifact
  question: Were any process memory dump files written on this host around the time of the alert?
  context: A successful LSASS dump leaves a file on disk, commonly under %TEMP%, C:\Windows\Temp, or another user-writable location. Correlating a new dump-style file written shortly after the tttracer.exe execution confirms the credential-theft chain and identifies where the captured memory image was staged for exfiltration or offline parsing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\Temp\'
          - '\Users\Public\'
          - '\AppData\'
      filter_ext:
        TargetFilename|endswith:
          - '.dmp'
          - '.dump'
          - '.bin'
      condition: selection and filter_ext
    fields:
      - Image
      - TargetFilename
- source: template:cue_parent_process.follow_on
  question: What other child processes did tttracer.exe spawn on this host?
  context: tttracer.exe used for proxy execution may launch more than the one child that triggered the alert. Enumerating every child of tttracer.exe on this host reveals the full set of binaries it ran in sequence — reconnaissance, credential tools, or additional payloads — and the scope of activity initiated through the trusted binary.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\tttracer.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Has tttracer.exe historically spawned this child binary on this host?
  context: A parent-child pairing that has never been seen before is more suspicious than one that recurs. Zero or very low historical counts for tttracer.exe launching this specific child indicate a novel spawning relationship; a long-standing pairing is more consistent with routine developer tracing on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\tttracer.exe'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run the Time Travel Debugging utility?
  context: Compare this user's current action against their historical behavior. A user who has never launched tttracer.exe is more suspicious than one who does so regularly as part of development or testing work. User role and typical toolset should align with debugging activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith: '\tttracer.exe'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the tttracer.exe launch mechanism — its parent process spawning this child binary — historically routine on this host or across the environment?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is the launch mechanism. A new or rare parent spawning this child binary on this host or environment-wide is the deviation worth chasing, while a pairing that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: '\tttracer.exe'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on other hosts, the scope of compromise may be larger than this single detection.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and child binary combination fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The meaningful question is whether the same launch mechanism — parent process plus spawned binary — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: '\tttracer.exe'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Credential theft is typically followed by lateral movement, where the actor uses stolen credentials to access other systems. New logon events or outbound remote connections shortly after an LSASS dump indicate active exploitation of the compromised credentials. Look for RDP, SMB, WinRM, or remote-execution alerts on this host after the event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: If LSASS memory was dumped, every credential cached in that process is potentially exposed. The severity depends on what was logged on to the host — domain admin or service-account credentials require incident escalation, while a standard user account may only need monitoring. Cross-reference the accounts active on this host with directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or privilege escalation — may reveal the attack stages that preceded the use of tttracer.exe and help reconstruct the full timeline leading to credential access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
