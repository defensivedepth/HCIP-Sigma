name: Service Started/Stopped Via Wmic.EXE
id: d2f89f0f-e76e-4aa4-8542-8d29a817465d
description: |
  Detects wmic.exe being used to start or stop a Windows service via a
  command line that combines ' service ' and ' call ' with a startservice or
  stopservice method invocation. Manipulating services through WMI is a way to
  stop security tooling, halt monitored applications, or activate a service that
  delivers code execution, and it works both locally and against remote hosts.
  Administrators and management tooling also drive services this way, so the
  investigation should establish whether the command targeted a local or remote
  host, which service was acted on, and whether the actor, parent chain, and
  surrounding activity match expected operations.
type: detection
detection_id: 0b7163dc-7eee-4960-af17-c0cd517f92da
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line invoke wmic with service, call, and a start or stop method?
  context: Confirm the alert is a true positive by reviewing the exact command line against the
    rule's criteria. The rule fires when wmic.exe (by OriginalFileName or an Image ending in
    \WMIC.exe) is run with a command line that contains ' service ' AND ' call ' AND one of
    stopservice or startservice. Verify all three conditions are present in the same command,
    and note which method (startservice or stopservice) and which service name were specified.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to start or stop services through wmic?
  context: Legitimate service management is usually done with sc.exe, services.msc, or
    configuration management agents rather than wmic call service. Knowing whether the user role
    and host function include WMI-driven service control is often the fastest way to separate
    routine administration from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What service did this wmic command act on, and was it a start or a stop?
  context: The full command line reveals the specific service and method. Decode the WMI path or
    name filter to identify the target service, confirm whether startservice or stopservice was
    called, and check for a remote host or IP in a /node argument that indicates the command
    targeted another machine rather than the local host. A stop of a security or logging service
    points toward defense evasion; a start can activate a newly installed or dormant service.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - ' service '
          - ' call '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1047.network_connection
  question: Did wmic open a remote connection to another host around the time of this command?
  context: WMI service control can run against a remote target. When wmic is pointed at another
    host, it opens an outbound DCOM/RPC connection from this machine rather than acting locally.
    A connection from wmic.exe to a remote endpoint in the alert window indicates the start or
    stop was aimed at another host, widening the scope; correlate the destination against the
    target named in the command line and watch for the same wmic process reaching several
    distinct remote hosts, which points to scripted lateral service manipulation.
  range: +/-5m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1047.wmi
  question: Did the WMI provider record service control method calls on this host in the alert window?
  context: WMI activity logs record the method invocations that back a wmic call, independent of
    the process command line. Operational WMI events around the alert confirm the service start
    or stop was actually carried out through the WMI provider and can show calls that originated
    remotely, which a local process_creation event alone does not reveal. If WMI activity logs
    are not collected in this environment, treat zero results as a visibility gap rather than
    evidence nothing ran, and rely on the process and network evidence instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Operation
      - PossibleCause
- source: template:cue_process_tool.process_chain
  question: What process spawned this wmic instance and is that parent chain expected?
  context: The parent process reveals how wmic was invoked. Service control driven by an
    interactive shell, a scripting host such as wscript.exe or mshta.exe, or an Office
    application is more concerning than a launch from a management agent or a scheduled task.
    Walk the chain back from the immediate parent to understand who initiated the action.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this wmic instance spawn afterward?
  context: A start that activates a service can lead to follow-on execution, and an operator
    stopping protection often runs additional tooling immediately after. Children such as
    cmd.exe, powershell.exe, or certutil.exe spawned by this wmic process point to
    post-action activity rather than a single isolated service command.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity surrounding the
    wmic service command reveals what led to it and what followed, and whether it is one step
    in a larger sequence of reconnaissance, privilege escalation, or defense tampering. Novel
    parent-child pairs at low counts stand out against the repetitive agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.baseline
  question: Does this host normally run wmic?
  context: A binary that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts of wmic on this host indicate first-time or
    rare use and raise the weight of the detected service command.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this wmic service-control pattern, what parents
    and users normally drive it, and does the current alert fit?
  context: Even routine tooling can be abused. The query mirrors the rule's selection scoped to
    this host, so the parent and user distribution reflects how this specific service-control
    pattern has historically run here rather than generic wmic usage. A new parent process, an
    unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service '
        - ' call '
        CommandLine|contains:
        - stopservice
        - startservice
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service '
        - ' call '
        CommandLine|contains:
        - stopservice
        - startservice
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service '
        - ' call '
        CommandLine|contains:
        - stopservice
        - startservice
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or actions on
    multiple endpoints. If the same user drove similar service control or other tooling on
    several machines, the scope of the activity is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service '
        - ' call '
        CommandLine|contains:
        - stopservice
        - startservice
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary often use several. wmic is a
    proxy-execution LOLBin, so check whether rundll32, regsvr32, mshta, msbuild, or similar
    binaries were also used on the host to run code or manipulate the system. Finding multiple
    LOLBins working toward the same objective strengthens the case for operator activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was wmic executed from its expected System32 or SysWOW64 path?
  context: A LOLBin executed from a non-standard path may have been copied or renamed to evade
    path-based allowlists. wmic.exe running from a user's temp or AppData directory, rather than
    System32 or SysWOW64, is more suspicious than one in its normal location. Compare Image to
    OriginalFileName to confirm the on-disk name and path match the genuine binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this wmic service-control pattern over the past 90
    days, and what command-line structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one used regularly
    under stable parents. The query mirrors the rule's selection scoped to this host, so the
    count reflects this specific service-control pattern rather than generic wmic usage. The
    command-line projection lets the analyst compare typical invocation patterns against the
    alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service '
        - ' call '
        CommandLine|contains:
        - stopservice
        - startservice
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
