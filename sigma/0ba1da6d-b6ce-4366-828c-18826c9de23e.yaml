name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
id: a07f6fea-2254-4e4e-8aab-455132fc863e
description: |
  Detects execution of a process whose embedded PE metadata identifies it as a commonly abused system or
  administrative utility, while the on-disk filename does not match that metadata. The rule fires when the
  OriginalFileName, Product, or Description metadata points to a high-relevance binary (certutil, mshta,
  rundll32, regsvr32, wmic, powershell, PsExec, and similar) AND the process is not running under its expected
  filename, which is the hallmark of renaming a known tool to defeat name-based and path-based detections.
  Renaming abused binaries is observed across the full attack lifecycle, from early living-off-the-land staging
  to interactive late-stage operations and automated lateral movement. Investigation should establish the true
  identity of the binary from its metadata and hash, how the renamed file arrived on the host, what it did after
  execution, and whether the same renamed binary appears elsewhere in the environment.
type: detection
detection_id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the executed binary's PE metadata identify it as a highly relevant utility while its on-disk filename differs?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the
    OriginalFileName, Product, or Description metadata names a commonly abused tool yet the process is not running
    under its expected filename. Review the metadata fields against the Image path to confirm the mismatch is real
    and not a benign custom build that happens to carry a known OriginalFileName.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Description
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run a renamed system or administrative utility?
  context: Legitimate administrative activity rarely runs a known tool under a non-standard filename. A small number
    of custom applications ship renamed binaries that retain the original PE metadata, and those are usually easy to
    confirm against the host's role. Knowing whether the user role and host function fit the detected behavior is
    often the fastest path to separating a benign packaged tool from a deliberately renamed utility.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this renamed binary do? Decode its full command line and arguments.
  context: The on-disk name is disguised, but the command line reveals the operation the tool actually performed.
    Decode any flags, encoded content, file paths, or URLs. The metadata identity (certutil, rundll32, mshta,
    powershell, and similar) tells you which capabilities to expect, so compare the observed arguments against the
    normal usage of that tool to judge whether this is a download cradle, a script-host invocation, or a
    proxied-execution attempt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: When a binary is renamed, the PE metadata (OriginalFileName) and code-signing details still reflect the
    original tool. Comparing the Image path (the name on disk) against OriginalFileName (embedded metadata) reveals
    the true identity. The signing party and signature status indicate whether this is a Microsoft-signed system
    binary, a third-party signed tool such as PsExec, or unsigned/tampered. The file hash enables threat
    intelligence lookups to determine whether this is a known legitimate tool, a known malware sample, or a novel
    binary requiring deeper analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did this renamed binary arrive on the host?
  context: 'Renamed binaries do not appear spontaneously -- they were either copied from another location,
    downloaded, or dropped by a parent process. Tracing the file creation event for the binary by its on-disk name
    reveals the delivery mechanism: a download tool, a malware dropper, manual copy via a remote-admin session, or
    lateral movement from another host. A binary placed in a user-writable directory such as Temp, Downloads, or
    AppData was most likely downloaded or extracted; one written into a system directory may indicate a privileged
    process was abused.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1036.003.tuning_parameter
  question: From what directory did the renamed binary execute, and is that path consistent with a legitimate install of the underlying tool?
  context: The underlying utilities identified by the metadata each have well-known install locations under the
    Windows or Program Files directories. A renamed copy commonly runs from a staging path such as a user profile,
    Temp, AppData, ProgramData, or a public directory. Comparing the execution directory against the canonical
    location for the metadata-identified tool separates a relocated-and-renamed copy from a benignly packaged build,
    and a non-standard path materially raises suspicion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CurrentDirectory
      - OriginalFileName
- source: template:cue_process_tool.process_chain
  question: What process spawned this renamed binary and is that parent chain expected?
  context: The parent process reveals how the renamed tool was invoked. Legitimate usage often has predictable parent
    chains such as explorer.exe for user actions or services.exe for services. Unusual parents like mshta.exe,
    wscript.exe, a Microsoft Office application, or a renamed loader dropped into a staging directory point toward
    macro-driven or scripted invocation rather than routine administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: The purpose of renaming a binary is to evade detection while performing its intended function. Examining
    the child processes, file operations, and network connections from the renamed binary reveals its actual
    objective. Additionally, the same renamed binary appearing on multiple hosts suggests deliberate distribution
    rather than an isolated incident.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run this binary?
  context: A process that has never been seen on a host is more suspicious than one that runs regularly. Zero or very
    low historical counts for this Image path indicate first-time or rare execution, which fits a freshly dropped
    renamed copy rather than an installed-and-routine tool.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even commonly abused tools have a legitimate footprint. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing
    pattern has historically run here, not generic binary usage. A new parent process, an unexpected user account,
    or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Execute processes remotely
      - Product: Sysinternals PsExec
      - Description|startswith:
        - Windows PowerShell
        - pwsh
      - OriginalFileName:
        - certutil.exe
        - cmstp.exe
        - cscript.exe
        - IE4UINIT.EXE
        - finger.exe
        - mshta.exe
        - msiexec.exe
        - msxsl.exe
        - powershell_ise.exe
        - powershell.exe
        - psexec.c
        - psexec.exe
        - psexesvc.exe
        - pwsh.dll
        - reg.exe
        - regsvr32.exe
        - rundll32.exe
        - WerMgr
        - wmic.exe
        - wscript.exe
      filter:
        Image|endswith:
        - \certutil.exe
        - \cmstp.exe
        - \cscript.exe
        - \ie4uinit.exe
        - \finger.exe
        - \mshta.exe
        - \msiexec.exe
        - \msxsl.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \psexec.exe
        - \psexec64.exe
        - \PSEXESVC.exe
        - \pwsh.exe
        - \reg.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wermgr.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
