- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context:
    what led to this event, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, service or security-tool tampering, or staging that surrounds the renamed-binary execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct
    the timeline that led to a renamed tool being staged and run.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
