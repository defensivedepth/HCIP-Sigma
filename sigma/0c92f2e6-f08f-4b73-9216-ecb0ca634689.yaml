  mutable_dispositions:
    - element: PEInternalNameMismatch
      dimension: tuning_parameter
      specific_values: "rationale only (compare disk filename vs OriginalFilename/InternalName)"
      disposition: context
      target_question: Q5
      notes: "true_identity projects Image + OriginalFileName + Hashes so the analyst can read the mismatch directly; no fixed threshold to inject."
    - element: OriginalFilenameMismatch
      dimension: tuning_parameter
      specific_values: "rationale only (compare executable file name with PE metadata OriginalFilename)"
      disposition: context
      target_question: Q5
      notes: "Same mismatch read; the rule's selection_attributes already enumerates the property names (OriginalFileName, CompanyName, etc.) surfaced in verify_trigger_match and mechanism_decode."
    - element: ImagePath / KnownSystemUtilityPaths
      dimension: tuning_parameter
      specific_values: "rationale only (suspicious/non-standard directory paths; expected install dirs for signed binaries)"
      disposition: context
      target_question: Q6
      notes: "binary_origin traces where the target file landed (user-writable vs system path); path-anomaly judgment is in its context, no specific path list given by the analytic."
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "rationale only (rare argument combinations for LOLBAS-like tools)"
      disposition: context
      target_question: Q4
      notes: "mechanism_decode decodes the --set- flags and property/value pairs; the rule's own selection_flags (--set-) and selection_attributes are the concrete pattern."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (correlation window between file creation and execution; e.g., 5-30 min for AV-evasion modification)"
      disposition: context
      target_question: Q6
      notes: "binary_origin (-30d) brackets delivery, renamed_binary_activity (+4h) brackets disguised execution, and precursor (-6h) brackets prior stages; no single threshold to query."
    - element: PayloadEntropyThreshold
      dimension: obfuscation_check
      specific_values: "rationale only (entropy threshold to distinguish obfuscation from compression)"
      disposition: context
      target_question: Q4
      notes: "Not applicable to a plaintext metadata-edit command line; the obfuscation here is metadata spoofing, decoded in mechanism_decode, not an encoded payload to score for entropy."
  dedup_decisions:
    - dropped: cue_process_tool.baseline
      reason: "generic host+binary 90d baseline subsumed by the host_pattern reflected baseline_deviation, which scopes to the rule's actual metadata-edit pattern rather than all rcedit usage"
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.follow_on
      reason: "host+binary forward child-process query overlaps masquerading.renamed_binary_activity; rcedit itself spawns nothing meaningful, the load-bearing follow-on is the disguised target binary's execution, which renamed_binary_activity covers via ParentImage = target"
      kept: masquerading.renamed_binary_activity
    - dropped: cue_host_context.clustering
      reason: "host-scoped +/-15m process clustering duplicates cue_process_tool.clustering, which already provides the around-the-time tool view"
      kept: cue_process_tool.clustering
    - dropped: cue_user_actor.baseline
      reason: "user_actor pair — non-deduplicable; emitted alongside baseline_svc substitute"
      kept: cue_user_actor.baseline
    - dropped: cue_user_actor.clustering
      reason: "user_actor pair — non-deduplicable; emitted alongside clustering_svc substitute"
      kept: cue_user_actor.clustering
  skipped_templates:
    - template: remote_access_tool.active_session_context
      reason: "rcedit is not a remote-access tool — there is no remote session, helpdesk ticket, or connection to correlate. The remote_access_tool set was confirmed via filename_prefix=pua, not because rcedit provides remote access; only tool_authorization adapts cleanly (PUA approval check) and was kept."
    - template: remote_access_tool.connection_destination
      reason: "rcedit edits a local file's PE resources and makes no outbound connections; a network_connection query scoped to rcedit returns nothing. Inapplicable for the same reason as active_session_context."
    - template: universal.evidence_preservation
      reason: "The rule has no file-path detection field — the target executable is a CommandLine positional argument, not a captured TargetFilename. The on-disk artifact is covered by masquerading.binary_origin (file_event for the target via %file_paths%) and its true identity by masquerading.true_identity; a separate %file_paths% evidence-preservation query would duplicate binary_origin."
    - template: obfuscation.encoded_payload_decode
      reason: "The rule fires on a plaintext rcedit command line (--set- flags plus property names like OriginalFileName), not on base64/hex/encoded payload execution. There is nothing to decode in the encoding sense; the obfuscation here is metadata spoofing, which is decoded operationally by mechanism_decode and read as a mismatch by true_identity."
    - template: universal.endpoint_protection_health
      reason: "RECOMMENDED, not must_include. This rule fires on defense-evasion preparation (metadata tampering), not on payload execution, credential access, or impact where a prior AV/EDR-disable sweep is the disposition driver. Prior host tamper/evasion context is carried by the cue_host_context.precursor sigma-alert sweep; the generic host-tamper command sweep would add volume without changing the disposition for a metadata-edit alert."
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'application' (recommended by techniques: T1027.005) is not covered and no template family exists — author a custom question with `category: application`"
