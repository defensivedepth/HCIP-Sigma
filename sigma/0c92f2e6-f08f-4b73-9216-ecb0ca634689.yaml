name: PUA - Potential PE Metadata Tamper Using Rcedit
id: f6ca76e9-0761-4f04-bcfc-d94b4e003424
description: |
  Detects rcedit (rcedit-x64.exe / rcedit-x86.exe, or any binary carrying rcedit's PE
  metadata) running with a --set- flag together with a version-string property name such as
  OriginalFileName, CompanyName, FileDescription, ProductName, ProductVersion, or LegalCopyright.
  rcedit is a legitimate command-line tool for editing the resource section of a Windows
  executable, and developers and packagers use it routinely to stamp build metadata onto their
  own binaries. The same capability is abused to rewrite the embedded metadata of a renamed
  system utility or malicious binary so its OriginalFileName and signing-related strings appear
  legitimate, defeating application-control and origin checks that key off PE metadata. The
  investigation should establish which executable rcedit was pointed at, what metadata values it
  wrote, whether the target binary is a renamed or relocated system tool, and what that target
  did before and after the metadata edit.
type: detection
detection_id: 0c92f2e6-f08f-4b73-9216-ecb0ca634689
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — rcedit invoked with a --set- flag and a PE metadata property name?
  context: Confirm the alert is a true positive before investing time. The rule fires only when all three conditions hold
    together — the process is rcedit (rcedit-x64.exe / rcedit-x86.exe, or a binary whose Description is "Edit resources of
    exe" or Product is rcedit); the command line contains a --set- flag; and the command line names at least one PE version
    string such as OriginalFileName, CompanyName, FileDescription, ProductName, ProductVersion, or LegalCopyright. Read the
    full command line and confirm all three are present and identify which executable rcedit was told to modify.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to edit executable metadata with rcedit?
  context: rcedit is a developer and packaging tool, so on a build server, a developer workstation, or a CI agent a metadata
    edit may be entirely routine. On a general-purpose endpoint, a server, or an account with no software-build function,
    rewriting PE metadata is out of character. Knowing the host function and whether the user account performs build or
    packaging work is often the fastest way to separate legitimate stamping from masquerading preparation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is rcedit an approved tool on this host, and does its presence here have a documented purpose?
  context: rcedit is flagged as a potentially unwanted application — it is not a default Windows component and arrives bundled
    with build toolchains or is dropped deliberately. Many organizations restrict resource-editing utilities to build and
    packaging systems. If this host is not a sanctioned build or developer machine, or rcedit is not on the approved software
    list, its presence should be treated as shadow tooling or operator-staged regardless of the tool's benign reputation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: Which executable did rcedit modify, and what metadata values did it write to each property?
  context: The full command line names the target executable (the first positional argument) and pairs each --set-version-string
    or --set-product-version flag with a property and a value. Parse them out — for example, an OriginalFileName value of
    svchost.exe while the file on disk is named otherwise is a direct masquerade. Read every value rcedit wrote — a target
    pointed at a renamed system-utility name, a forged CompanyName or LegalCopyright matching Microsoft, or a FileDescription
    cloned from a signed binary all indicate the metadata is being formatted to pass origin or application-control checks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:masquerading.true_identity
  question: What is the real identity of the executable rcedit modified, based on its current metadata and hash?
  context: After rcedit writes new version strings, the file on disk carries metadata that may no longer reflect what the
    binary actually is. Compare the target file's path and name against its OriginalFileName and signing status — a mismatch,
    or a freshly written OriginalFileName that mimics a trusted system binary, is the masquerade. The signing chain shows
    whether the edit invalidated a previous signature (PE resource edits break Authenticode) and the hash enables threat-intel
    lookups to determine whether the target is a known tool, a known malicious sample, or a novel binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did the executable that rcedit modified arrive on this host?
  context: 'The binary being re-stamped did not appear spontaneously — it was downloaded, copied, extracted from an archive, or
    dropped by a parent process before rcedit touched it. Tracing the file-creation event for the target file reveals the
    delivery mechanism: a download tool, a malware dropper, manual copy via explorer or remote access, or lateral movement
    from another host. A target dropped into a user-writable location (Desktop, Downloads, Temp, AppData) shortly before the
    metadata edit points toward operator staging rather than a legitimate build artifact.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did the metadata-edited executable do after the edit, and is the same binary present on other hosts?
  context: The purpose of rewriting metadata is to let a binary run while appearing legitimate. Examining the processes,
    file operations, and network activity attributed to the target executable after rcedit modified it reveals its actual
    objective — credential access, reconnaissance, lateral movement, or persistence. The same target binary appearing on
    multiple hosts suggests deliberate distribution of a disguised tool rather than an isolated edit on one endpoint.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned rcedit, and is that parent chain expected?
  context: The parent process reveals how rcedit was invoked. A build or packaging context typically descends from a script
    host, a CI agent, an installer, or an interactive developer shell. An unusual parent — a browser, an Office application,
    mshta.exe, wscript.exe, a remote-shell tool, or another binary that was itself recently dropped — points toward rcedit
    being run as part of an intrusion rather than a software build.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rcedit metadata-edit pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even on a host where rcedit runs as part of routine builds, the activity tends to have a stable signature — the same
    CI or build-script parent and the same build account. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how this specific metadata-edit pattern has historically run
    here rather than generic rcedit usage. A new parent process, an unexpected account, or an unusual command-line structure is
    the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \rcedit-x64.exe
        - \rcedit-x86.exe
      - Description: Edit resources of exe
      - Product: rcedit
      selection_flags:
        CommandLine|contains: --set-
      selection_attributes:
        CommandLine|contains:
        - OriginalFileName
        - CompanyName
        - FileDescription
        - ProductName
        - ProductVersion
        - LegalCopyright
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rcedit metadata-edit pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, returning a fleet-wide count of this specific
    metadata-edit pattern rather than generic rcedit usage. Many hosts running the same pattern points to a build pipeline or
    packaging automation deployed across developer or CI systems; a single host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \rcedit-x64.exe
        - \rcedit-x86.exe
      - Description: Edit resources of exe
      - Product: rcedit
      selection_flags:
        CommandLine|contains: --set-
      selection_attributes:
        CommandLine|contains:
        - OriginalFileName
        - CompanyName
        - FileDescription
        - ProductName
        - ProductVersion
        - LegalCopyright
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the metadata edit?
  context: Metadata tampering is preparation, not an end in itself. Activity surrounding the rcedit invocation may reveal the
    binary being prepared, the download or extraction that delivered it, reconnaissance, or staging for later execution. A
    cluster of unfamiliar tools in the same window broadens the investigation beyond the single edit event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \rcedit-x64.exe
        - \rcedit-x86.exe
      - Description: Edit resources of exe
      - Product: rcedit
      selection_flags:
        CommandLine|contains: --set-
      selection_attributes:
        CommandLine|contains:
        - OriginalFileName
        - CompanyName
        - FileDescription
        - ProductName
        - ProductVersion
        - LegalCopyright
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \rcedit-x64.exe
        - \rcedit-x86.exe
      - Description: Edit resources of exe
      - Product: rcedit
      selection_flags:
        CommandLine|contains: --set-
      selection_attributes:
        CommandLine|contains:
        - OriginalFileName
        - CompanyName
        - FileDescription
        - ProductName
        - ProductVersion
        - LegalCopyright
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints.
    If the same account ran rcedit or staged binaries on other hosts in the same window, the scope of the activity may be
    larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \rcedit-x64.exe
        - \rcedit-x86.exe
      - Description: Edit resources of exe
      - Product: rcedit
      selection_flags:
        CommandLine|contains: --set-
      selection_attributes:
        CommandLine|contains:
        - OriginalFileName
        - CompanyName
        - FileDescription
        - ProductName
        - ProductVersion
        - LegalCopyright
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Metadata tampering often sits in the middle of an intrusion — after a payload is delivered but before it is run
    under its disguised identity. Earlier detections on the same host — download or dropper activity, defense tampering,
    reconnaissance, or credential access — may reveal the stages that preceded the edit and help reconstruct the timeline,
    including the original delivery of the binary rcedit was pointed at.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
