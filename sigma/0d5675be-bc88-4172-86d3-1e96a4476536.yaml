  mutable_dispositions:
    - element: RegistryKeyPathPatterns
      dimension: tuning_parameter
      specific_values: "CurrentControlSet\\Control\\Terminal Server values: fDenyTSConnections, AllowTSConnections, fEnableWinStation, fSingleSessionPerUser, EnableConcurrentSessions, SecurityLayer, WinStations\\RDP-Tcp"
      disposition: context
      target_question: Q3
      notes: "registry_key_context is KEEP_EXACT and ProcessGuid-scoped; the specific Terminal Server values are named in Q1/Q3 context. The rule's own selection embeds these values into the REFLECTED baseline_deviation/scope queries (Q14/Q15)."
    - element: ParentProcessAllowList
      dimension: parent_process_analysis
      specific_values: "rationale only (regedit.exe, msiexec.exe as legitimate registry tools)"
      disposition: context
      target_question: Q4
      notes: "Allowlist concept surfaced in Q4 context (legitimate vs unusual parent); no concrete query injection because the rule does not constrain parent."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (~5m correlation between change and nearby activity)"
      disposition: context
      target_question: Q7
      notes: "Q7 uses +/-30m; Q8 uses +4h; Q9 uses +30m to correlate the change with post-change registry edits, logons, and execution."
    - element: SignatureCheck
      dimension: tuning_parameter
      specific_values: "rationale only (unsigned executable / abnormal lineage performing registry mod)"
      disposition: context
      target_question: Q6
      notes: "Q6 (renamed_binary_check) verifies reg.exe path/OriginalFileName; Q4 reviews lineage for the writer's signing chain."
    - element: UserContext
      dimension: user_context
      specific_values: "rationale only (non-admin / service-account RDP expectation)"
      disposition: context
      target_question: Q2
      notes: "Q2 (host_user_context) and Q10 (user baseline) cover whether the account is expected to reconfigure RDP."
    - element: ProcessList
      dimension: tuning_parameter
      specific_values: "cmd.exe, powershell.exe, certutil.exe (suspicious post-login processes)"
      disposition: context
      target_question: Q9
      notes: "Q9 (target_activity_after_access) surfaces post-change execution; the specific suspicious-process list is named in its context as what to scan the result for."
    - element: HostAccessPatterns
      dimension: tuning_parameter
      specific_values: "rationale only (uncommon/first-time source-to-destination access)"
      disposition: context
      target_question: Q8
      notes: "Q8 RDP-logon query projects source IP and logon type so the analyst can spot uncommon source-to-destination access after the change."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (T1021 / T1021.001 login-to-activity window)"
      disposition: context
      target_question: Q8
      notes: "Covered by the +4h post-change RDP-logon window in Q8 and +30m post-access execution in Q9."
    - element: LogonUser
