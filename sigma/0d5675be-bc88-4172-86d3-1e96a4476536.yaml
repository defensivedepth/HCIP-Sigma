- source: template:cue_process_tool.scope
  question: Have other hosts fired this Terminal Server tampering pattern in the past week, and does the spread look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of this specific firing pattern rather than
    generic reg.exe usage. Many hosts editing the same Terminal Server values
    points to scripted deployment or imaging; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_main_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_main_cli:
        CommandLine|contains|all:
        - ' add '
        - \CurrentControlSet\Control\Terminal Server
        - REG_DWORD
        - ' /f'
      selection_values_1:
        CommandLine|contains|all:
        - Licensing Core
        - EnableConcurrentSessions
      selection_values_2:
        CommandLine|contains:
        - AllowTSConnections
        - fDenyTSConnections
        - fEnableWinStation
        - fSingleSessionPerUser
        - IdleWinStationPoolCount
        - MaxInstanceCount
        - SecurityLayer
        - TSAdvertise
        - TSAppCompat
        - TSEnabled
        - TSUserEnabled
        - WinStations\RDP-Tcp
      filter_main_values_tls:
        CommandLine|contains|all:
        - SecurityLayer
        - '02'
      condition: all of selection_main_* and 1 of selection_values_* and not 1 of filter_main_*
    fields:
    - host.name
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for enabling or reconfiguring Remote Desktop on this host?
  context: >-
    Remote Desktop configuration on managed systems is usually planned work. A
    corresponding ticket or maintenance window suggests authorized activity;
    the absence of one when policy requires it suggests the change was
    unauthorized. This check can quickly close false positives or escalate true
    positives.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host, such
    as defense tampering, reconnaissance, or credential access, may reveal the
    stages that preceded the RDP configuration change and help reconstruct the
    timeline. Defense tampering and credential access commonly precede activity
    that prepares a host for remote access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
