        - fEnableWinStation
        - fSingleSessionPerUser
        - IdleWinStationPoolCount
        - MaxInstanceCount
        - SecurityLayer
        - TSAdvertise
        - TSAppCompat
        - TSEnabled
        - TSUserEnabled
        - WinStations\RDP-Tcp
      filter_main_values_tls:
        CommandLine|contains|all:
        - SecurityLayer
        - '02'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_main_* and 1 of selection_values_* and not 1 of filter_main_*) and _pb_scope
