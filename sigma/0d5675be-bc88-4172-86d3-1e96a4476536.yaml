      label: registry_modification
      description: "reg.exe writes a REG_DWORD value under CurrentControlSet\\Control\\Terminal Server to enable/relax RDP"
      mapped_to: Q3
      source: template:registry.registry_key_context
    - stage: 2
      label: registry_change_attribution
      description: "Abnormal parent/lineage performing the registry modification (CLI tool vs allowlisted registry tool)"
      mapped_to: Q4
      source: template:parent_child.parent_process_legitimacy
    - stage: 3
      label: post_change_remote_logon
      description: "RDP/interactive logon following the configuration change (T1021.001 login-then-activity chain)"
      mapped_to: Q8
