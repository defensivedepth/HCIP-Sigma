name: Script Interpreter Spawning Credential Scanner - Windows
id: b13bf878-877b-49f1-9206-61321f0b275a
description: |
  Detects a JavaScript runtime (node.exe or bun.exe) spawning a known secret-scanning
  tool (trufflehog or gitleaks), identified either by the child image name or by the
  scanner name appearing in the command line. The rule fires only when the parent is one
  of those runtimes AND the child matches a scanner. Secret scanners are legitimate in
  CI/CD pipelines and pre-commit hooks, but a Node/Bun process invoking one on a
  developer workstation matches the credential-harvesting stage of npm supply-chain worms
  that run trufflehog over the local repo and environment to collect cloud, GitHub, and
  npm tokens. Investigation should confirm the scanner ran against local credential
  material rather than a sanctioned source repository, identify what the JS runtime
  executed, and check whether harvested secrets were staged or exfiltrated.
type: detection
detection_id: 0f60b28c-64dd-4e2c-9a63-5334d3e3a6e6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did a node.exe or bun.exe process spawn trufflehog or gitleaks, by image name or command line?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when
    the parent image ends in node.exe or bun.exe AND the child is trufflehog/gitleaks (by Image name or by
    the scanner name appearing in CommandLine). Check the ParentImage, Image, and CommandLine fields against
    these criteria before investing further investigation time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run secret-scanning tools from a JavaScript runtime?
  context: Developer and CI/CD hosts may legitimately run trufflehog or gitleaks as part of a security
    check, often invoked by a build script. A general-purpose workstation or server with no development
    workflow running these tools under a Node/Bun parent is harder to explain and aligns with the
    credential-harvesting stage of an npm supply-chain compromise.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is node.exe or bun.exe expected to spawn a secret scanner here, and what started the runtime?
  context: The parent-child relationship is the core signal. Trace the JS runtime's own origin (grandparent)
    to see whether it was launched by a legitimate developer action or by an npm/package install hook. Supply-chain
    worms run a malicious preinstall script ("node setup_bun.js") that then executes a large obfuscated payload;
    a runtime started by a package manager install rather than an interactive developer session is the deviation worth chasing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: attack:T1552.process_identification
  question: Is the spawned binary genuinely trufflehog/gitleaks, or a renamed binary matched only on the command line?
  context: The rule matches either the child Image name or the scanner name in the command line. A command-line-only
    match can mean a renamed or repackaged binary, and the scanner could itself be bundled inside the obfuscated
    payload rather than a standalone executable. Compare the Image path, the on-disk file, and its signature to confirm
    the running binary is the real scanner and not a wrapper carrying the scanner name as an argument.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: What did the scanner scan, and what credential material was in its target path?
  context: Secret scanners walk a directory tree looking for tokens and keys. Decode the command-line arguments to
    identify the scanned path and any filters. A scan limited to a source repository under review is consistent with a
    security check; a scan of the user profile, environment, cloud credential files (AWS/GCP/Azure config), .netrc, or
    .npmrc points to credential harvesting. Identifying the target determines which secrets and accounts may be exposed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:obfuscation.encoded_payload_decode
  question: Is the scanner invocation or the script that drove it encoded or obfuscated, and what does it decode to?
  context: The triggering command line shows how the scanner was invoked; the JavaScript runtime that launched it commonly
    executes a heavily obfuscated payload (hundreds of thousands of lines, double-Base64 encoding for staged data).
    Reconstruct any encoded arguments on the scanner command and inspect the script the runtime ran to determine
    whether this is secret discovery and staging rather than a benign build task.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same node.exe or bun.exe instance spawn?
  context: A runtime executing a malicious payload typically spawns more than one child — additional secret
    collectors, a downloader for a self-hosted runner, or follow-on tooling. Examining siblings of the same parent
    instance reveals the full scope of activity orchestrated through this runtime, not just the scanner that triggered the alert.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.follow_on
  question: What other processes did node.exe or bun.exe spawn on this host after the alert?
  context: Beyond the immediate siblings, the JS runtime may launch later stages — installing a Bun runtime to evade
    Node-focused monitoring, downloading a self-hosted CI runner, or invoking PowerShell to fetch additional tooling.
    Tracking subsequent children of the same parent binary on the host reconstructs the execution chain following the scan.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:data_staging_exfil.data_scope
  question: What files did the scanner touch on this host?
  context: Secret scanners walk a directory tree reading credential files and writing findings. Look for reads of cloud
    credential files, .netrc, and .npmrc, and for writes of JSON staging files (for example secrets.json,
    environment.json, cloud.json, trufflehog-findings.json). The set of files the scanner touched determines which
    credentials were collected and the severity of potential loss.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:universal.evidence_preservation
  question: Are the scanner output or staging files still on disk for analysis?
  context: If harvested secrets were written to staging files, checking whether they still exist enables content review
    and lets the team scope exactly which tokens and keys were exposed. JSON blobs named for collected data
    (system, environment, secrets, cloud, npm) and scanner findings files are the artifacts to look for.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:data_staging_exfil.archive_destination
  question: Were harvested secrets exfiltrated over the network after the scan?
  context: Supply-chain worms upload collected credentials to an attacker-controlled destination — commonly a newly
    created public code-hosting repository, with secrets double-Base64 encoded. Check for outbound connections from the
    runtime or scanner shortly after the scan, and for file writes that match the staging pattern, to determine whether
    data left the host.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts and credential types may be compromised, and do any have elevated privileges?
  context: The severity depends on what the scan reached. Cloud provider keys, GitHub or npm publish tokens, and domain
    or service-account credentials each require different containment. Tokens with publish or workflow scope are
    especially serious because supply-chain worms reuse them to republish compromised packages and register backdoor runners.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Did any follow-on detections or remote connections fire on this host after the scan?
  context: Credential harvesting is typically followed by use of the stolen secrets — registering a self-hosted CI
    runner for a persistent backdoor, authenticating to cloud or code-hosting services, or moving to other systems.
    Follow-on alerts on the same host in the hours after the scan indicate active exploitation of the collected credentials.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:cue_user_actor.baseline
  question: Does this user normally run trufflehog or gitleaks?
  context: Compare this user's current action against their history. A developer who routinely runs secret scanners
    as part of their workflow is a weaker signal than an account that has never invoked these tools. User role and
    typical toolset should align with running a credential scanner from a JS runtime.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-runtime and scanner pairing historically routine on this host or across the environment?
  context: When the alert fires under a service or build account, user identity does not attribute behavior; the
    meaningful pivot is the launch mechanism. A node.exe or bun.exe parent spawning trufflehog/gitleaks that already
    accounts for many prior events is likely an established CI/CD or pre-commit workflow. A new or rare pairing on this
    host or environment-wide is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_parent_process.scope
  question: Is this runtime-spawning-scanner pattern occurring on other hosts?
  context: The same JS runtime spawning a secret scanner across multiple hosts points to a worming supply-chain
    compromise propagating through shared packages or a build pipeline, rather than an isolated developer action.
    An environment-wide comparison calibrates scope and identifies which other hosts ran the scanner.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: A credential scan launched by a JS runtime is often one stage of a longer chain. Earlier detections on the
    same host — a package install hook, a script download, or runtime installation — may reveal how the malicious code
    reached the host and help reconstruct the timeline leading to the scan.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
