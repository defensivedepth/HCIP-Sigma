name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols Via CLI
id: d5d050b5-fee7-46eb-b66c-bd06c64ed367
description: |
  Detects a command line that writes the Internet Explorer ZoneMap ProtocolDefaults
  configuration for the http or https protocol to the MyComputer zone (value 0) under
  Internet Settings. The rule fires when a single command contains the ProtocolDefaults
  registry path together with the http protocol token and a zero value, which downgrades
  the default trust level for web protocols to the same level granted to local files.
  The effect removes Mark-of-the-Web tagging and Zone.Identifier handling for downloaded
  content, so files fetched from the internet are treated as local and trusted. This
  is performed via reg.exe or PowerShell registry cmdlets and can be a legitimate (but
  unusual) administrative or testing action, so the investigation should establish who
  ran it, what was changed, and whether other registry or defense changes accompanied it.
type: detection
detection_id: 10344bb3-7f65-46c2-b915-2d00d47be5b0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line write the IE ZoneMap ProtocolDefaults http value to the MyComputer zone?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule
    fires only when the command contains the ProtocolDefaults registry path AND the http
    protocol token AND a zero value together, so verify all three are present and that the
    value 0 is the data being written to the http or https protocol.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to modify Internet Explorer security zone settings from the command line?
  context: Legitimate zone configuration is normally pushed through Group Policy or imaging,
    not typed at an interactive command line. Knowing whether the user role and host function
    involve hands-on registry changes to browser trust settings is often the fastest way to
    separate a routine build step from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:registry.registry_key_context
  question: What specific registry key and value were written, and which protocol and zone do they map to?
  context: The registry path determines intent. ProtocolDefaults sets the default zone applied
    when no per-domain rule matches, so a value of 0 written to the http or https value name
    demotes every unmapped web URL to the MyComputer zone. Confirm the exact protocol name
    affected and whether the change was made under HKCU (per user) or HKLM (machine wide), and
    check for related value names such as https being set in the same operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: Operators who downgrade browser zone trust often make several related registry
    changes in the same window, such as mapping a specific domain into a trusted zone,
    disabling SmartScreen, or adjusting defender settings. Finding a cluster of registry
    writes from the same host within a short window reveals the full scope of configuration
    changes and whether multiple objectives were pursued alongside the zone downgrade.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - 'Set-ItemProperty'
          - 'New-ItemProperty'
          - 'Remove-ItemProperty'
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned the tool that made this change, and is that parent chain expected?
  context: The parent process reveals how the registry write was invoked. Interactive zone
    changes typically descend from explorer.exe or a console the user opened, while parents
    such as a script host, an Office application, or an extracted archive's launcher point to
    downloaded or macro-driven execution rather than deliberate administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host written the IE ZoneMap ProtocolDefaults pattern before, or is this the first time?
  context: A zone-downgrade command that has never been seen on a host is more suspicious than
    one that recurs as part of a known build or configuration routine. Zero or very low
    historical counts for this specific registry-write pattern indicate first-time or rare
    activity on the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
          - http
          - ' 0'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even an occasionally legitimate configuration step has a normal shape. The query
    mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific zone-downgrade pattern has historically run here.
    A new parent process, an unexpected user account, or an unusual command shape is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
        - http
        - ' 0'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did the alerting process spawn afterward?
  context: The processes spawned by the alerting command reveal its actual impact. A registry
    write followed by a download utility, a script host, or another payload launcher points to
    the zone downgrade being a preparatory step ahead of fetching content that the relaxed
    trust level is meant to wave through.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Configuration tampering rarely occurs alone. Activity surrounding the zone-downgrade
    command may reveal a delivered file being run, reconnaissance, or additional persistence and
    defense changes that provide broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of this specific zone-downgrade pattern rather than generic registry usage.
    Many hosts writing the same value points to scripted deployment or a configuration tool;
    one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
        - http
        - ' 0'
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user written this zone-downgrade pattern before across the environment?
  context: Compare this user's current action against their historical behavior. A user who has
    never written the IE ZoneMap ProtocolDefaults pattern is more notable than one who does so
    as part of a known routine. The user's role should align with making hands-on browser trust
    changes.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|all:
          - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
          - http
          - ' 0'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and command pattern historically routine on this host or environment, or is the launch mechanism unusual?
  context: When the alert fires under a service or computer account, user identity does not
    attribute the behavior, so the meaningful pivot is the launch mechanism. Which parent process
    drove this zone-downgrade command, and is that pairing historically common. A new or rare
    parent for this pattern is the deviation worth chasing, while a pair that already accounts for
    many prior events is configuration automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|all:
          - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
          - http
          - ' 0'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or repeated
    configuration changes on multiple endpoints. If the same user triggered similar activity on
    several hosts, the scope of the change campaign may be wider than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and command pattern fire on other hosts in the same window?
  context: Under a service or computer account, asking what else the user did returns agent
    telemetry noise. The meaningful question is whether the same launch mechanism wrote the same
    zone-downgrade pattern on other hosts in the alert window. Multiple hosts in the same window
    points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|all:
          - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
          - http
          - ' 0'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led
    to this event and what happened after, and whether the zone downgrade is part of a larger
    sequence such as a delivered file being executed, defense changes, or persistence being set.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or
    delivery of a downloaded file, may reveal the stages that preceded the zone downgrade and help
    reconstruct the timeline. The order of alerts often tells the story of how the host reached
    this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Downgrading browser zone trust removes one layer of download protection, and operators
    frequently pair it with disabling other defenses before fetching a payload. The query surfaces
    direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear
    logs, or patch AMSI/ETW. Zero rows is a useful signal that protection looks healthy; populated
    rows shift the disposition toward operator preparation, so review the parent process and
    signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
