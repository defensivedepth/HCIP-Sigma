name: Persistence Via Sticky Key Backdoor
id: 3b5f425a-b758-4b01-b48d-0bf1d580e5c9
description: |
  Detects a command line that copies cmd.exe over the Windows accessibility binary
  sethc.exe (copy /y C:\windows\system32\cmd.exe C:\windows\system32\sethc.exe). Because the
  accessibility suite runs before authentication, replacing sethc.exe lets anyone at the logon or
  lock screen press Shift five times to launch a SYSTEM-level command shell without credentials.
  This is post-compromise persistence and privilege escalation; the operator already has the
  administrative or physical access needed to overwrite a protected system binary. Investigation
  should confirm the replacement actually occurred, identify who and what drove it, and check for
  the parallel registry (IFEO Debugger) variant and other accessibility-binary targets.
type: detection
detection_id: 1070db9a-3e5d-412e-8e7b-7183b616e1b3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line copy cmd.exe over sethc.exe as this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reading the
    full command line and verifying it copies C:\windows\system32\cmd.exe to
    C:\windows\system32\sethc.exe with the /y overwrite flag, not an unrelated copy operation that
    incidentally names these paths.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to replace system accessibility binaries?
  context: Replacing a protected System32 binary requires administrative rights and is not part of
    normal user or routine maintenance activity. Knowing whether this account and host function
    legitimately overwrite accessibility binaries is often the fastest way to separate a true
    positive from an unusual but sanctioned administrative action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full copy command, and does it target sethc.exe or another accessibility binary?
  context: Decode every argument of the copy command to confirm the source is a shell binary
    (cmd.exe) and the destination is an accessibility binary. The same technique targets
    utilman.exe, osk.exe, magnify.exe, narrator.exe, and displayswitch.exe, and may substitute
    another shell such as powershell.exe for the source. The query scopes to this host's executions
    carrying the sethc replacement pattern rather than all cmd.exe activity, since cmd.exe is too
    common for binary-name scoping.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - 'copy '
        - '\system32\sethc.exe'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: What spawned the process that issued this copy, and is that chain expected?
  context: The parent process reveals how the replacement was driven. An interactive admin shell
    launched from explorer.exe looks different from cmd.exe spawned by a remote-access tool, a
    script host, or a service. Tracing the parent's own origin shows whether this was a hands-on
    operator action or an automated step in a larger sequence.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn around this time?
  context: If the parent that issued the copy is operator-controlled, it likely spawned other
    actions too. Sibling processes can reveal credential access, reconnaissance, account creation,
    or additional persistence installed in the same session, showing the full scope of activity
    from that parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1546.008.registry_set
  question: Was an Image File Execution Options Debugger set on any accessibility binary on this host?
  context: The registry variant of this technique achieves the same pre-login shell without
    replacing any file. Setting a Debugger value under the IFEO key for sethc.exe or utilman.exe
    points the accessibility binary at cmd.exe, so the hotkey launches a SYSTEM shell at the logon
    screen. A host showing the binary-replacement variant should be checked for this parallel
    registry mechanism, which file-replacement detection does not see.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Image File Execution Options\'
      selection_targets:
        TargetObject|contains:
        - '\sethc.exe\Debugger'
        - '\utilman.exe\Debugger'
        - '\osk.exe\Debugger'
        - '\magnify.exe\Debugger'
        - '\narrator.exe\Debugger'
        - '\displayswitch.exe\Debugger'
      condition: selection and selection_targets
    fields:
      - TargetObject
      - Details
      - Image
- source: attack:T1546.008.create_stream_hash
  question: Do alternate-data-stream or file-hash events confirm sethc.exe now carries the cmd.exe content?
  context: A successful replacement leaves the accessibility binary on disk with content identical to
    cmd.exe. Stream-hash and file-creation events for the destination path let the analyst confirm
    the overwrite landed and capture the resulting hash for comparison against the known cmd.exe
    hash, distinguishing an actual swap from a copy command that errored or was blocked.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: create_stream_hash
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
        - '\sethc.exe'
        - '\utilman.exe'
        - '\osk.exe'
      condition: selection
    fields:
      - TargetFilename
      - Hash
      - Image
- source: template:cue_artifact.artifact_verification
  question: Did the replaced sethc.exe execute, and does its hash match cmd.exe rather than the genuine accessibility binary?
  context: A file's hash is recorded when it runs, not when it is written. This looks on the alerting
    host for sethc.exe executing and reads its hash. The genuine Windows sticky-keys binary has a
    known Microsoft-signed hash; after this backdoor, sethc.exe is a copy of cmd.exe, so an
    execution carrying cmd.exe's hash confirms the backdoor was triggered (typically by pressing
    Shift five times at the logon screen) and a privileged console was opened. Compare the hash to a
    known-good sethc.exe and to cmd.exe. No execution here does not clear the host — the binary may
    be staged but not yet used; confirm the on-disk file's hash directly via the evidence-preservation step.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\sethc.exe'
      condition: selection
    fields:
      - Image
      - Hashes
- source: template:universal.evidence_preservation
  question: Is the replaced sethc.exe still on disk for analysis?
  context: If the destination accessibility binary still exists on disk, it can be hashed, submitted
    for analysis, and compared against the legitimate accessibility binary and against cmd.exe.
    Preserving it before remediation or a defender overwrite keeps the option for deeper review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this sethc-replacement pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and
    user distribution reflects how this specific replacement pattern has run here historically. For
    most hosts the expected answer is zero prior matches, since legitimate operations do not copy a
    shell over an accessibility binary. Any prior occurrences, and the accounts behind them, are
    worth reviewing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - 'copy '
        - '/y '
        - C:\windows\system32\cmd.exe C:\windows\system32\sethc.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this sethc-replacement pattern in the past week, and is the distribution consistent or isolated?
  context: The query mirrors the rule's selection with no host scope, returning a fleet-wide count
    of this replacement pattern rather than generic cmd.exe usage. Multiple hosts firing the same
    pattern points to a scripted rollout of the backdoor across systems; a single host or a small
    unrelated set points to a hands-on operator action. Use the spread to calibrate scope and
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - 'copy '
        - '/y '
        - C:\windows\system32\cmd.exe C:\windows\system32\sethc.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - 'copy '
        - '/y '
        - C:\windows\system32\cmd.exe C:\windows\system32\sethc.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - 'copy '
        - '/y '
        - C:\windows\system32\cmd.exe C:\windows\system32\sethc.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Replacing an accessibility binary rarely occurs in isolation. Activity surrounding the
    copy can reveal how the operator gained access, what they ran before, and what they did after,
    including reconnaissance, credential access, or additional persistence that frames the larger
    sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host such as credential access, defense tampering, or
    remote-access activity may reveal the stages that preceded the backdoor installation and help
    reconstruct how the operator reached the point of overwriting a system binary.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host?
  context: Operators rarely rely on a single persistence method. After establishing the
    accessibility-binary backdoor, they commonly add backup mechanisms using different techniques
    such as scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence
    installations in the same timeframe indicate intentional stacking rather than isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
