name: User Discovery And Export Via Get-ADUser Cmdlet
id: 591ae6bd-de75-42fe-a2ec-957556ffebb4
description: |
  Detects PowerShell or pwsh running the Get-ADUser cmdlet with a -Filter argument and piping or redirecting the
  results to a file via an output operator (redirection, Select, Out-File, Set-Content, or Add-Content). Enumerating
  and exporting the full set of domain user accounts is a routine task for directory administrators and audit
  scripts, but it is also a common post-compromise discovery step used to map the environment before lateral
  movement, credential access, or account creation. The investigation should determine whether the user, host, and
  parent process are consistent with sanctioned administration, what the full command did with the exported data,
  and whether other reconnaissance or defense-tampering activity surrounds the event.
type: detection
detection_id: 1114e048-b69c-4f41-bc20-657245ae6e3f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show Get-ADUser with a -Filter argument writing results to a file?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command
    line. The rule fires when PowerShell or pwsh runs Get-ADUser with a -Filter argument AND an output operator
    (redirection, Select, Out-File, Set-Content, or Add-Content). Verify all parts are present rather than a partial
    or benign match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enumerate and export the full domain user list?
  context: Directory administrators, identity-governance tooling, and audit scripts legitimately export user
    accounts. A standard user account, a server with no administrative role, or an account that has never run AD
    cmdlets performing this export is a stronger indicator of post-compromise discovery. Compare the user role and
    host function against the detected behavior.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did the full Get-ADUser command do? Decode the filter, properties, and output destination.
  context: The full command line reveals what was collected and where it was written. Decode the -Filter expression
    (a bare wildcard returns every account), any -Properties requested (which attributes were harvested), and the
    output target (the file path or pipeline destination receiving the export). The destination path indicates where
    the staged user list now lives for later use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: 'Get-ADUser '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does the readable form do?
  context: The detected Get-ADUser invocation is plain text, but the surrounding script or session may use encoded
    or obfuscated wrappers to stage and run the enumeration. Check for -EncodedCommand or -enc base64 payloads,
    backtick escaping, string concatenation, or variable substitution around the cmdlet, and decode them to confirm
    what was actually executed and whether additional discovery or follow-on actions were bundled in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script that ran the enumeration?
  context: Script block logging records the deobfuscated script content PowerShell actually executed, providing
    ground truth even when the command line is wrapped or built dynamically. This surfaces the complete enumeration
    logic, any additional cmdlets run in the same session, and the true output destination. If PowerShell
    operational logs are not ingested in this environment, treat zero results as a visibility gap rather than
    evidence nothing else ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell protections before running enumeration or payloads. Common
    techniques include AMSI bypass, execution-policy changes (Set-ExecutionPolicy or -ep bypass), and downgrade to
    PowerShell v2 to evade logging. Finding these precursor events in the hour before the export strengthens the
    case that the enumeration is part of hands-on-keyboard activity rather than a sanctioned script.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single user export may be legitimate troubleshooting or audit work, but multiple discovery commands
    in rapid succession is a signature of post-compromise enumeration. Look for native recon binaries and other AD
    enumeration alongside the Get-ADUser export. Three or more distinct discovery tools within a short window points
    to scripted reconnaissance preceding the next attack stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this PowerShell enumeration, and is that parent chain expected?
  context: Legitimate AD exports are typically launched from an interactive administrator shell or a known
    automation engine. Discovery commands spawned by unusual parents such as Office applications, script
    interpreters, wmiprvse.exe, or wsmprovhost.exe indicate macro execution or remote command execution rather than
    a console operator. The parent process and its command line show how the enumeration was initiated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering with protection often precedes hands-on enumeration and payload execution. This surfaces direct
    attempts to disable AV/EDR services, flip Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW.
    Zero rows is a useful health signal, though kernel-level driver tampering and in-memory patches will not appear
    here. Populated rows shift the disposition toward operator preparation; review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell?
  context: Compare this user's current action against their historical behavior. A user who has never launched
    PowerShell or pwsh is more suspicious than one who runs it regularly. Aggregating by host over 90 days shows
    whether the actor routinely uses this interpreter; very low or zero counts indicate first-time use that should
    be aligned with the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-PowerShell combination historically routine on this host or environment-wide?
  context: When the alert fires under a service principal, user identity does not attribute the behavior. The
    meaningful pivot is the launch mechanism, which parent process spawned PowerShell, and whether that pairing is
    historically common. A new or rare parent for this interpreter on this host or across the environment is the
    deviation worth chasing; a pairing that already accounts for thousands of prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar enumeration or other actions on multiple hosts, the scope of
    compromise may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-PowerShell combination fire on other hosts in the same window?
  context: Under a service principal, asking what else this user did returns agent-telemetry noise because
    system-owned agents run on every host constantly. The meaningful question is whether the same launch
    mechanism, parent process plus spawned interpreter, fired on other hosts in the alert window. Multiple hosts in
    the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.follow_on
  question: What did this user do next on this host?
  context: Follow-on activity reveals the next steps after the detected enumeration. Look for credential access,
    account creation, privilege escalation, persistence installation, or lateral movement by the same user, which
    would indicate the exported user list is being acted upon rather than collected for benign administration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.follow_on_svc
  question: What other PowerShell launches on this host followed in the next four hours, and does the parent or
    command-line shape change?
  context: Under a service principal, asking what the user did next is unbounded. A more focused follow-on for
    automation-driven alerts tracks repeat invocations of the same interpreter on the same host. Routine scheduled
    tasks repeat with stable parents and command-line shapes; a deviation in parent or command-line in the
    follow-on window is the signal worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
- source: template:cue_user_actor.scope
  question: Are there alerts for this user on other hosts?
  context: If the same user triggered alerts on multiple hosts, the compromise may extend beyond a single endpoint.
    Check for lateral movement patterns or credential abuse across the environment associated with this account.
  range: -24h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- source: template:cue_user_actor.scope_svc
  question: Did this same rule fire on other hosts in the past 24 hours?
  context: Under a service principal, alerts for an omnipresent user are meaningless. The triage-useful question is
    whether this rule fires on multiple hosts. A rule firing across many hosts on the same day is probably tracking
    scheduled or pushed automation; a rule firing on one host alone is the deviation worth chasing.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.name|expand: '%rule.name%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host such as defense tampering,
    reconnaissance, or credential access may reveal the attack stages that preceded this enumeration and help
    reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
