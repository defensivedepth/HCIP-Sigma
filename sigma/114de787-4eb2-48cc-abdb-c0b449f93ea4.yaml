name: Suspicious X509Enrollment - Process Creation
id: 615823cd-5886-4808-9b98-b396e8e901ad
description: |
  Detects a process command line that references the X509Enrollment.CBinaryConverter COM object, by its ProgID (X509Enrollment.CBinaryConverter) or its CLSID (884e2002-217d-11da-b2a4-000e7bbb2b09). The rule fires when the command line contains either marker. Attackers call this object's StringToVariantByteArray method from PowerShell to convert a base64 string into an in-memory byte array, an alternative to FromBase64String that is used to stage and decode obfuscated payloads without writing the conversion as obvious base64 handling. Legitimate certificate-enrollment and HPC scheduler tooling can reference the same object, so the investigation should decode what the surrounding command actually does with the converted bytes, confirm the parent chain and the user and host context, and determine whether this is routine certificate or scheduler automation or a deobfuscation step in a larger operation.
type: detection
detection_id: 114de787-4eb2-48cc-abdb-c0b449f93ea4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line reference X509Enrollment.CBinaryConverter, either by its ProgID or by its CLSID?
  context: Confirm the alert before investing time. The rule fires when the command line contains either the ProgID X509Enrollment.CBinaryConverter or the CLSID 884e2002-217d-11da-b2a4-000e7bbb2b09 — either marker alone satisfies the rule. Read the full command line and note which marker appears, whether it is paired with StringToVariantByteArray, and what base64 or string content is being converted, since that surrounding content is the real subject of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run certificate-enrollment or byte-array conversion code from a command line?
  context: Certificate-enrollment tooling and some HPC scheduler components legitimately reference the X509Enrollment COM objects. Knowing whether this account and host have a reason to do so — a certificate-management server or an admin running enrollment scripts versus a standard user workstation — is often the fastest way to separate routine certificate work from a hands-on deobfuscation step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the surrounding command do with the converted bytes — decode the full command line.
  context: The CBinaryConverter reference is rarely the whole command. Recover what accompanies it — the base64 or string passed to StringToVariantByteArray, where the resulting byte array is sent (reflective .NET assembly load, IEX, a dropped file), and any download or execution that follows. A conversion paired with an in-memory assembly load, a download cradle, or a hidden window is the pattern that matters; a conversion inside a signed enrollment or scheduler script is far more likely routine. Scoping to the X509Enrollment invocations on this host in the window captures a multi-step sequence where one call decodes content and a later one runs it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - X509Enrollment.CBinaryConverter
          - 884e2002-217d-11da-b2a4-000e7bbb2b09
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this command, and is that parent chain expected?
  context: A byte-array conversion launched from an interactive admin session or a certificate-management service is routine; the same invocation spawned by winword.exe or excel.exe, mshta.exe, wscript.exe, regsvr32.exe, or another script host points to a delivery chain that handed off to PowerShell. The parent's own command line shows whether a loader or document drove the activity, and walking up from there reconstructs how it started.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What did this process spawn afterward?
  context: The point of decoding content in memory is usually to run it. Children of this process reveal what the converted bytes became — a new cmd.exe or powershell.exe, csc.exe compiling code in memory, rundll32 or regsvr32 running a payload, or a dropped executable. A quiet conversion that spawns nothing reads very differently from one that immediately launches tooling.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run the X509Enrollment.CBinaryConverter pattern, what parents and users drove it, and does the current alert fit?
  context: Even a byte-array conversion has a normal shape on a given host. This mirrors the rule's pattern scoped to this host, so the parent and user distribution reflects how the X509Enrollment.CBinaryConverter invocation has historically run here — a certificate-management service under a known account, an admin in an interactive session. A new parent process, an unexpected user, or an unusual command shape against that baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - X509Enrollment.CBinaryConverter
        - 884e2002-217d-11da-b2a4-000e7bbb2b09
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run the X509Enrollment.CBinaryConverter pattern across the environment?
  context: Compare this user's current action against their historical pattern. A user who has never run an X509Enrollment.CBinaryConverter conversion is more suspicious than a certificate-management or admin account that does so routinely. This pivot is meaningful only when a real user account fired the alert; the launch-mechanism baseline alongside it carries the answer when the actor is a service or computer account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains:
        - X509Enrollment.CBinaryConverter
        - 884e2002-217d-11da-b2a4-000e7bbb2b09
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-binary combination historically routine on this host or across the environment?
  context: When the alert fires under a service or computer account, user identity does not attribute behavior, so the meaningful baseline is the launch mechanism — which parent process spawned this binary, and whether that pairing is historically common. A new or rare parent (an Office application or a script host where none was seen before) is the deviation worth chasing; a pairing that already accounts for thousands of prior events is certificate, scheduler, or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user ran this conversion or other tooling on other hosts in the same window, the scope is larger than a single machine. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-binary combination fire on other hosts in the same window?
  context: Under a service or computer account, asking what else the user did returns agent-telemetry noise. The meaningful question is whether the same launch mechanism — this parent spawning this binary — fired on other hosts in the alert window. Multiple hosts at once points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts run the X509Enrollment.CBinaryConverter pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where the X509Enrollment.CBinaryConverter invocation fired. Many hosts at once points to a pushed deployment, certificate rollout, or scheduler routine; one host or a small unrelated set points to manual operator activity. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - X509Enrollment.CBinaryConverter
        - 884e2002-217d-11da-b2a4-000e7bbb2b09
      condition: selection
    fields:
    - host.name
- source: attack:T1553.004.cert_store
  question: Did the Windows root or trusted-publisher certificate store change on this host around this time?
  context: If the converted bytes are being used to install or modify a trust anchor, the activity lands in the certificate-store registry keys (SystemCertificates and the root or AuthRoot CertificateStore paths). A registry write to a root or trusted-publisher store that is not in the baseline of approved authorities, correlated with this process activity, points to trust subversion rather than a benign byte-array conversion. Zero rows here, with a clean command-line decode, makes routine certificate or scheduler automation the more likely reading.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_store:
        TargetObject|contains:
          - \SystemCertificates\Root\Certificates\
          - \SystemCertificates\AuthRoot\Certificates\
          - \SystemCertificates\TrustedPublisher\Certificates\
          - \Microsoft\SystemCertificates\Root\Certificates\
      condition: selection_host and selection_store
    fields:
      - TargetObject
      - Image
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Deobfuscation of an in-memory payload is often one step in a broader preparation that also disables protection before the payload runs. This surfaces direct attempts to disable AV/EDR services, flip Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the writing process and its signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a macro-spawned shell, a download cradle, defense tampering, or reconnaissance — may reveal the stages that preceded this conversion and help reconstruct the timeline. In-memory deobfuscation is frequently a mid-chain step, so what came just before and just after is what tells the story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
