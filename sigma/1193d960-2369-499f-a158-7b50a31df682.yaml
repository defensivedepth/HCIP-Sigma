name: Potential Suspicious Browser Launch From Document Reader Process
id: 7cb5474c-424b-492f-ab32-671f910b21d0
description: |
  Detects a browser process (chrome, msedge, firefox, brave, opera, vivaldi, maxthon, seamonkey) spawned by a document-reader application whose ParentImage path contains "Acrobat Reader", "Microsoft Office", or "PDF Reader", where the browser command line carries an http or https URL. The rule fires when the selection matches and none of the known-benign URL filters (Microsoft fwlink help, Foxit ad/redirect endpoints) match. Opening a document and following an embedded link is routine, but a reader handing off to a browser with an attacker-controlled URL is a common phishing redirect or second-stage delivery step, so the investigation should establish what document was opened, what URL the browser was sent to, and whether the same hand-off appears on other hosts.
type: detection
detection_id: 1193d960-2369-499f-a158-7b50a31df682
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did a document-reader parent (Acrobat Reader, Microsoft Office, or PDF Reader) spawn this browser with an http or https URL on the command line?
  context: Confirm the alert is a true positive before investing time. Verify the ParentImage path contains a document-reader product string, the Image is one of the browser binaries the rule lists, and the browser command line carries an http(s) URL that is not one of the benign Microsoft help or Foxit endpoints the rule excludes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to open documents that hand off to a browser for external links?
  context: Routine document workflows do open browsers for embedded links, so the user role and host function matter. A user who regularly works with PDFs and Office documents that link out is a different disposition than an unattended server or a user whose role does not involve document handling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:initial_access.delivery_vector
  question: What document was open in the reader, and how was it delivered to this host?
  context: The hand-off begins with a document opened in Acrobat Reader, a PDF reader, or an Office application. Identifying the specific file and how it arrived — email attachment, web download, or shared drive — enables blocking the source and finding other recipients. The reader's own command line and parent context point at the file path.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What is the full URL the browser was launched with, and where does it lead?
  context: The command line carries the URL the reader handed to the browser. Decode it fully — note the domain, any URL-encoded or redirector parameters, IP-literal hosts, and whether it points at a login page, a file download, or a redirect chain. The benign Microsoft fwlink and Foxit endpoints are already excluded by the rule, so a URL reaching this alert is neither of those.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: http
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: What started the document-reader parent, and is a browser launch an expected child for it?
  context: The reader-to-browser hand-off is the core signal. Tracing what spawned the reader itself — a mail client opening an attachment, explorer.exe from a double-click, or an unexpected scripted parent — distinguishes a user opening a delivered document from an automated or scripted chain.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did this same reader instance spawn?
  context: If the reader spawned the browser as part of a malicious hand-off, it may have spawned other processes too. Examining the exact parent instance's other children reveals whether the document also launched script interpreters or other living-off-the-land binaries alongside the browser.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Does this document reader normally spawn this browser on this host?
  context: Some reader-to-browser pairings are routine where users frequently follow document links; others are novel. Historical frequency of this specific parent product spawning this browser binary on this host distinguishes a habitual workflow from a first-time hand-off worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_parent_process.clustering
  question: What files did the reader open or write on this host around the time of the alert?
  context: The document that triggered the hand-off, and any payload it dropped, appear as file events from the reader process around the alert time. File activity scoped to the reader can reveal the source document path and any staged second-stage file in a user-writable location.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%ParentName%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:initial_access.campaign_scope
  question: Did the same detection fire on other hosts or for other users recently?
  context: A document-to-browser phishing hand-off rarely targets a single user. Correlating the same rule across hosts and users reveals the breadth of the delivery and identifies additional systems where the same document was opened and the same URL followed.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:initial_access.application_patch_status
  question: Is the document-reader application up to date with security patches?
  context: A reader handing off to a browser can be a benign link click, but it can also follow exploitation of the reader itself. Confirming the Acrobat, PDF reader, or Office version is fully patched helps distinguish a user-driven link follow from exploitation of a known reader vulnerability and flags other unpatched hosts at risk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- source: template:universal.evidence_preservation
  question: Are any files dropped by the reader or downloaded by the browser still on disk for analysis?
  context: If the hand-off staged a file — a downloaded payload, a saved document, or output written to a user-writable path — checking whether it still exists enables hash lookups, sandbox submission, or content review. Files derived from the activity show up under the host's user-writable paths.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|contains:
        - Acrobat Reader
        - Microsoft Office
        - PDF Reader
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \firefox.exe
        - \msedge.exe
        - \opera.exe
        - \maxthon.exe
        - \seamonkey.exe
        - \vivaldi.exe
        CommandLine|contains: http
      filter_main_microsoft_help:
        CommandLine|contains: https://go.microsoft.com/fwlink/
      filter_optional_foxit:
        CommandLine|contains:
        - http://ad.foxitsoftware.com/adlog.php?
        - https://globe-map.foxitservice.com/go.php?do=redirect
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|contains:
        - Acrobat Reader
        - Microsoft Office
        - PDF Reader
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \firefox.exe
        - \msedge.exe
        - \opera.exe
        - \maxthon.exe
        - \seamonkey.exe
        - \vivaldi.exe
        CommandLine|contains: http
      filter_main_microsoft_help:
        CommandLine|contains: https://go.microsoft.com/fwlink/
      filter_optional_foxit:
        CommandLine|contains:
        - http://ad.foxitsoftware.com/adlog.php?
        - https://globe-map.foxitservice.com/go.php?do=redirect
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the document hand-off was isolated or part of broader activity on multiple endpoints. The same user producing similar activity across hosts widens the scope of investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|contains:
        - Acrobat Reader
        - Microsoft Office
        - PDF Reader
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \firefox.exe
        - \msedge.exe
        - \opera.exe
        - \maxthon.exe
        - \seamonkey.exe
        - \vivaldi.exe
        CommandLine|contains: http
      filter_main_microsoft_help:
        CommandLine|contains: https://go.microsoft.com/fwlink/
      filter_optional_foxit:
        CommandLine|contains:
        - http://ad.foxitsoftware.com/adlog.php?
        - https://globe-map.foxitservice.com/go.php?do=redirect
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host may reveal the stages that preceded the document hand-off and help reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: attack:T1204.002.create_stream_hash
  question: Does the source document carry a mark-of-the-web zone identifier indicating it came from email or a download?
  context: Files saved from email, web, or untrusted shares carry a Zone.Identifier alternate data stream recording the origin zone. A mark-of-the-web on the opened document confirms external delivery and corroborates a phishing hand-off; its absence points toward a locally-created or trusted-source file. The stream is recorded when the file is written to disk.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: create_stream_hash
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Contents
      - Image
