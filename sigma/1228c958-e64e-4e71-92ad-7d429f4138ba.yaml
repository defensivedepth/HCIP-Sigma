name: Script Interpreter Execution From Suspicious Folder
id: f607fc8b-8339-4220-90fd-302f51a35908
description: |
  Detects a Windows script interpreter (cscript.exe, mshta.exe, wscript.exe) whose execution
  references a suspicious or user-writable directory. The rule fires when EITHER the process is one
  of those interpreters by Image name or by embedded OriginalFileName OR the command line carries an
  evasion flag (an ExecutionPolicy bypass, a hidden window, or a /e:javascript|Jscript|vbscript
  engine selector) AND the command line ALSO references a low-trust folder such as a Temp, Public,
  Perflogs, Startup, or per-user profile directory (Documents, Pictures, Contacts, Favorites, and
  similar), while excluding a known Chocolatey installer pattern. Legitimate installers and update
  routines occasionally stage scripts in these locations, so benign software is the routine
  explanation; copying or renaming a system script host into a user-writable folder and invoking it
  with engine or bypass flags is a common way to run a dropped script while evading name- and
  path-based detection. Investigation should confirm which branch fired, decode the full command and
  the referenced script path, establish how the interpreter and any script reached that folder, and
  determine whether the user, host, and parent chain are consistent with sanctioned activity.
type: detection
detection_id: 1228c958-e64e-4e71-92ad-7d429f4138ba
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does this match the rule's pattern — a script interpreter, by name or by engine/bypass
    flag, referencing a suspicious folder?
  context: 'Before investing investigation time, confirm the alert is a true positive and note which
    branch fired. The rule fires when EITHER the Image or OriginalFileName is cscript.exe, mshta.exe,
    or wscript.exe, OR the command line carries an evasion flag (-ep bypass, -ExecutionPolicy bypass,
    -w hidden, or /e:javascript|Jscript|vbscript) — AND the command line ALSO references a low-trust
    folder (Temp, Public, Perflogs, Startup, or a per-user profile folder such as Documents, Pictures,
    Contacts, or Favorites). Read the full command line and record which interpreter branch and which
    folder branch matched: the engine/bypass-flag branch points to script execution intent, while a
    plain interpreter name plus a user-writable script path points to a dropped or relocated script.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run script interpreters against scripts in user-writable
    folders?
  context: Legitimate installers, update routines, and login scripts can drive script-host execution
    from Temp or per-user folders. Knowing whether the user role and host function are consistent with
    that activity is often the fastest path to distinguishing a routine software action from a dropped
    script. An interactive user account on a workstation running a script from their own Documents or
    Downloads is different in weight from a server service account invoking an interpreter against a
    Public-folder path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did this interpreter actually run? Decode the command line, the engine selector, and
    the referenced script path.
  context: The full command line reveals the specific action taken. Decode the engine selector
    (/e:javascript, /e:Jscript, /e:vbscript) to see which script language is being run, resolve any
    environment-variable folder reference (%TEMP%, %Public%, %LocalAppData%) to its real path, and
    identify the script file the interpreter is pointed at. This scopes to every execution of this
    interpreter on the host in the surrounding window, so multi-step sequences (a copy or rename
    followed by execution) appear together rather than as the triggering event alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:masquerading.true_identity
  question: Is this the genuine system script host, or a copy relocated into a user-writable folder?
  context: System script hosts normally live in System32 or SysWOW64. Comparing the Image path on disk
    against the embedded OriginalFileName shows whether the running file is the real cscript.exe,
    mshta.exe, or wscript.exe carrying genuine Microsoft metadata, or a copy that was staged into a
    user-writable folder under the same or a different name. Relocating a system script host into
    Public, Temp, or a profile folder is a way to run it past path-based controls. The file hash
    enables a reputation lookup to confirm whether the binary on disk matches the known-good system
    build or is a tampered or unexpected copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.process_chain
  question: What process spawned this interpreter and is that parent chain expected?
  context: The parent process reveals how the interpreter was invoked. Login scripts and managed
    installers typically launch script hosts from services.exe, an installer process, or explorer.exe
    for an interactive run. Unusual parents such as a command shell with an obfuscated copy command,
    an Office application, an archive utility, or another script host point to delivery via a macro, a
    downloaded loader, or extraction from an archive rather than a managed deployment.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.binary_origin
  question: How did this interpreter — or the script it ran — arrive in that folder?
  context: 'A script host running from a user-writable folder, and the script it executes, do not
    appear spontaneously — they were copied, downloaded, or dropped by a parent process. Tracing the
    file-creation event for the interpreter basename over a long window reveals the delivery mechanism:
    a manual copy via a command shell, extraction from an archive, a download tool, or a malware
    dropper. A user-writable landing location (Public, Temp, AppData, Downloads) points to a copy or
    extraction; the writer process identifies who placed it there.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did this interpreter do after execution, and did the same activity occur on other
    hosts?
  context: The purpose of running a script host from a low-trust folder with engine or bypass flags is
    to execute a dropped script while evading name- and path-based detection. Examining the child
    processes, file operations, and connections originating from the interpreter reveals its actual
    objective — fetching a remote payload, spawning a secondary interpreter, or writing further files.
    The same pattern appearing on multiple hosts points to deliberate distribution rather than an
    isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was this interpreter executed from its expected System32 or SysWOW64 path?
  context: Script hosts shipped with Windows normally run from System32 or SysWOW64. An interpreter
    executing from a user's Temp, the Public folder, or a profile directory may have been copied or
    renamed to evade path-based allowlists, and is more suspicious than the same interpreter running
    from its canonical location. Confirm the Image path against the expected system path and note any
    mismatch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution or script LOLBins used on this host recently?
  context: Operators who use one script-host or proxy-execution LOLBin often use several. If a script
    interpreter was used to run a dropped script, check whether rundll32, regsvr32, mshta, or other
    proxy-execution binaries were also invoked nearby. Finding several LOLBins driving the same
    objective in a short window strengthens the case for deliberate activity rather than an isolated
    legitimate task.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's interpreter-from-suspicious-folder pattern over
    the past 90 days, and what command-line shapes are typical?
  context: A pattern with no prior history on a host is more suspicious than one seen routinely under
    stable parents. This query mirrors the rule's selection structure scoped to this host, so the count
    reflects the rule's specific firing pattern — a script host plus a suspicious-folder or engine/bypass
    flag — not generic interpreter usage. The command-line projection lets the analyst compare typical
    historical invocations against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_proc_image:
        Image|endswith:
        - \cscript.exe
        - \mshta.exe
        - \wscript.exe
      selection_proc_flags:
        CommandLine|contains:
        - ' -ep bypass '
        - ' -ExecutionPolicy bypass '
        - ' -w hidden '
        - '/e:javascript '
        - '/e:Jscript '
        - '/e:vbscript '
      selection_proc_original:
        OriginalFileName:
        - cscript.exe
        - mshta.exe
        - wscript.exe
      selection_folders_1:
        CommandLine|contains:
        - :\Perflogs\
        - :\Users\Public\
        - \%Public%
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - \Temporary Internet
        - \Windows\Temp
        - \Start Menu\Programs\Startup\
        - '%TEMP%'
        - '%TMP%'
        - '%LocalAppData%\Temp'
      selection_folders_2:
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      - CommandLine|contains|all:
        - :\Users\
        - \Documents\
      - CommandLine|contains|all:
        - :\Users\
        - \Music\
      - CommandLine|contains|all:
        - :\Users\
        - \Pictures\
      - CommandLine|contains|all:
        - :\Users\
        - \Videos\
      filter_optional_chocolatey_installer:
        ParentImage:
        - C:\Windows\System32\Msiexec.exe
        - C:\Windows\SysWOW64\Msiexec.exe
        Image|endswith: \powershell.exe
        CommandLine|contains|all:
        - -NoProfile -ExecutionPolicy Bypass -Command
        - AppData\Local\Temp\
        - Install-Chocolatey.ps1
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_proc_* and 1 of selection_folders_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
