name: Windows Firewall Disabled via PowerShell
id: 3ac6ae6f-10c7-40ac-bf81-7dfb1d071682
description: |
  Detects PowerShell (powershell.exe, pwsh.exe, or powershell_ise.exe, identified by image
  name or original file name) running Set-NetFirewallProfile with -Enabled False against the
  -All, Public, Domain, or Private profile to turn off the Windows Firewall. Set-NetFirewallProfile
  is a legitimate NetSecurity cmdlet used by administrators during troubleshooting and host
  configuration, so the activity is not inherently malicious. Adversaries disable the firewall
  to remove constraints on inbound lateral movement and outbound command-and-control; determine
  which profiles were turned off, whether the actor and host are expected to perform this change,
  and what activity preceded or followed the firewall change.
type: detection
detection_id: 12f6b752-042d-483e-bf9c-915a6d06ad75
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match a Set-NetFirewallProfile call that disables a firewall profile?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact command line and process details. The rule fires when PowerShell runs Set-NetFirewallProfile
    together with -Enabled and False and at least one of -All, Public, Domain, or Private. Confirm
    all three parts are present and note which profile or profiles were targeted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to change Windows Firewall configuration?
  context: Legitimate firewall changes are usually made by administrators on servers or workstations
    during troubleshooting or deployment. Knowing whether the user role and host function are
    consistent with disabling the firewall is often the fastest path to distinguishing routine
    administration from an actor clearing the way for lateral movement or outbound traffic.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which firewall profiles were disabled, and was the omnibus -All form used?
  context: Different profiles carry different exposure. Disabling the Domain profile removes
    protection on the corporate network; Public removes it on untrusted networks; the -All form
    clears every profile at once for maximum exposure. Read the command line to identify exactly
    which of -All, Public, Domain, or Private were passed, since the scope of the change determines
    investigation priority and what must be restored.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1562.process_identification
  question: Is the process a genuine PowerShell binary, or a renamed copy invoking the cmdlet?
  context: The rule matches on image name as well as on the embedded original file name (PowerShell.EXE,
    pwsh.dll), so it fires even when the executable on disk has been renamed. Compare the on-disk
    image path and name against the original file name and confirm the binary runs from a standard
    system path. A PowerShell original file name running from a renamed executable or a user-writable
    directory points to an actor staging the cmdlet to evade name-based controls rather than routine
    administration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated? What does it decode to?
  context: Attackers frequently use PowerShell's -EncodedCommand (-enc) parameter or string concatenation,
    backtick escaping, and variable substitution to hide the cmdlet and its arguments. Decode any
    encoded or obfuscated content to confirm whether Set-NetFirewallProfile is the full operation
    or only one step in a larger script that also disables other controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script content that PowerShell
    actually executed, even when the command line is encoded or obfuscated. This provides ground truth
    about what ran around the firewall change. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing else ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Attackers often disable or bypass PowerShell security controls before running their payload.
    Common techniques include AMSI bypass, execution policy changes (Set-ExecutionPolicy or -ep bypass),
    constrained language mode escape, and PowerShell v2 downgrade. Finding these precursor events on
    this host strengthens the case that the firewall change is part of malicious preparation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. Legitimate firewall administration
    is usually launched interactively (explorer.exe) or by a management agent. Unusual parents such
    as mshta.exe, wscript.exe, or an Office application suggest the firewall change followed exploitation
    or a malicious script rather than an administrator at a console.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the firewall was disabled?
  context: Adversaries disable the firewall for a reason -- to permit inbound connections for lateral
    movement or outbound connections for command-and-control. Examining process activity immediately
    after the change reveals what the firewall change was meant to enable, such as remote-access tools,
    network utilities, or new listeners.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: Actors who disable one control often disable several -- turning off the firewall alongside
    stopping the antivirus service, clearing event logs, or deleting shadow copies to maximize coverage.
    Finding multiple tampering events from the same user or parent process indicates several controls
    were targeted in the same operation rather than an isolated firewall change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:defense_tampering.protection_status
  question: Is the Windows Firewall currently re-enabled, or are profiles still turned off?
  context: The change may be temporary (for a specific action) or persistent. Checking the current
    firewall profile state reveals whether the host remains exposed. If profiles are still disabled,
    the firewall should be restored to its intended configuration before further investigation continues.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users drove it, and does this alert fit?
  context: Even routine maintenance can disable the firewall. The query mirrors the rule's selection
    structure scoped to this host, so the resulting parent and user distribution reflects how this
    specific firewall-disable pattern has historically run here. A new parent process, an unexpected
    user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_args:
        CommandLine|contains|all:
        - 'Set-NetFirewallProfile '
        - ' -Enabled '
        - ' False'
      selection_opt:
        CommandLine|contains:
        - ' -All '
        - Public
        - Domain
        - Private
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell on the network?
  context: Compare this user's current action against their historical behavior. A user who has never
    run PowerShell, or never on this host, is more suspicious than one who does so regularly as part
    of an administrative role. User role and typical toolset should align with disabling a firewall.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and PowerShell combination historically routine on this host or environment, or is the parent unusual?
  context: When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism -- which parent process spawned PowerShell, and whether
    that pair is historically common. A new or rare parent for PowerShell on this host or across the
    environment is the deviation worth chasing; a pair that already accounts for thousands of prior
    events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated
    changes on multiple endpoints. If the same user disabled the firewall or ran related tooling on
    several hosts in this window, the scope of the operation may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and PowerShell combination fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry
    noise. The meaningful question is whether the same launch mechanism -- parent process plus spawned
    PowerShell -- fired on other hosts in the alert window. Multiple hosts in the same window points to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance,
    credential access, or other defense tampering -- may reveal the attack stages that preceded the
    firewall change and help reconstruct the timeline that led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firewall-disable pattern. Many hosts firing the same pattern points to
    scripted deployment or vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_args:
        CommandLine|contains|all:
        - 'Set-NetFirewallProfile '
        - ' -Enabled '
        - ' False'
      selection_opt:
        CommandLine|contains:
        - ' -All '
        - Public
        - Domain
        - Private
      condition: all of selection_*
    fields:
    - host.name
