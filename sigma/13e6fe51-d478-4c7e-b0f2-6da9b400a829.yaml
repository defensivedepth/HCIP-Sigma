name: Suspicious File Downloaded From Direct IP Via Certutil.EXE
id: c133b7ed-1aeb-48b3-a725-df428940ba63
description: |
  Detects certutil.exe (by image name or original file name) invoked with a download verb (urlcache,
  verifyctl, or URL) against a URL whose host is a raw IPv4 address rather than a domain name, while
  excluding the 7-Zip self-extraction string. certutil is a Microsoft-signed certificate utility, but
  its urlcache and verifyctl verbs fetch an arbitrary HTTP/HTTPS URL to disk, making it a common
  living-off-the-land download primitive that pulls second-stage payloads into staging directories.
  Downloading directly from an IP avoids name resolution and reputation checks, a pattern more typical
  of malware delivery than routine administration. The investigation should establish exactly what URL
  and output file the command referenced, whether the file landed on disk, whether the payload is
  encoded or known-malicious, what spawned certutil, and whether the activity is routine for this user
  and host.
type: detection
detection_id: 13e6fe51-d478-4c7e-b0f2-6da9b400a829
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match this rule's certutil download verb against a direct IP address?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line and process details against
    the detection criteria. The rule fires when certutil.exe (by image name or original file name) runs
    with a download verb (urlcache, verifyctl, or URL) and a URL whose host is a raw IPv4 address rather
    than a domain name, and it excludes only the 7-Zip self-extraction string. Verify the download verb,
    confirm the target is a bare IP, and read the output file path the command writes to.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to download files from a raw IP address using command-line tools?
  context: >-
    Legitimate administrative activity can trigger this detection, though pulling a file directly from an
    IP via certutil is uncommon outside scripted deployment or troubleshooting. Knowing whether the user
    role and host function are consistent with command-line downloads from external addresses is often
    the fastest path to distinguishing routine work from payload delivery. A general workstation user
    fetching an executable from a bare IP is far less expected than a build or admin host with a known
    automation that does so.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR
    services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a
    useful protection-looks-healthy signal; kernel-level driver tampering and in-memory patches will not
    appear here. Populated rows shift the disposition toward operator preparation, so review the parent
    process and signing chain to identify the writer. Operators sometimes add an exclusion path for the
    download destination before fetching the payload, so watch for exclusions naming the staging
    directory.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this certutil command do? Decode the download verb, the target URL, and the output file path.
  context: >-
    The full command line reveals the specific download action. Identify which verb was used (urlcache,
    verifyctl, or URL), whether -split and -f were present, the exact IP-based URL fetched, and the
    output file path certutil wrote to. When no output path is supplied with verifyctl or URL, the file
    lands in the local CryptnetUrlCache content directory under the user profile. The destination path
    and file name from this command line drive the file-creation and payload-analysis checks downstream.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:obfuscation.encoded_payload_decode
  question: Is the URL or output target in this certutil command line encoded or obfuscated, and what does the decoded form resolve to?
  context: >-
    certutil download verbs are commonly paired with obfuscation that hides the real target or output. Read
    the alerting command line for an encoded or percent-encoded URL, a hex or decimal IP that masks the
    direct address, an output file disguised with a non-executable extension, or a doubled extension. The
    same verbs also enable a follow-on -decode or -decodehex step that turns a benign-looking staged file
    into an executable, so note any input and output file names that would feed such a decode. Resolving the
    obfuscated form reveals the actual destination and intent: an executable payload, a script cradle, or
    additional download stages.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this certutil execution, and is that parent chain expected for a download?
  context: >-
    The parent process reveals how certutil was invoked. A download driven by an interactive
    administrative shell differs sharply from one spawned by a script host, an Office application, a mail
    client, or an unfamiliar binary, which points toward a malicious macro or an exploitation chain
    handing off to a download cradle. Note what spawned the parent and what else the parent launched, so
    the certutil download can be placed within the broader sequence.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1105.network_connection
  question: Did certutil on this host make an outbound network connection to the alerting IP, and what destination and port did it use?
  context: >-
    The command line names the target IP, but the network telemetry confirms whether the transfer
    actually left the host and on which port. Correlate outbound connections initiated by certutil around
    the alert time with the IP from the command line to verify the egress and capture the destination port
    (commonly 80 or 443, but operators stage on high or non-standard ports). A connection to an external
    address with no matching domain resolution is consistent with the direct-IP delivery this rule fires
    on; absence of any connection suggests the fetch was blocked or never executed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \certutil.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: template:download_tool.download_success_verification
  question: Was the download successful? Check for file creation at the destination path certutil wrote to.
  context: >-
    A download command does not guarantee the file was retrieved. Network errors, blocked IPs, or security
    controls may have prevented the transfer. Confirming a file-creation event at the output path from the
    command line establishes whether the attack progressed past delivery. When no path was supplied, look
    for writes by certutil into the CryptnetUrlCache content directory under the user profile.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: Can you retrieve and analyze the downloaded payload from a safe environment?
  context: >-
    If the downloaded file is still on disk, submitting its hash to threat intelligence services or
    detonating it in a sandbox reveals whether it is a known malicious payload, a legitimate tool, or
    something novel that requires deeper analysis. Pair the hash with the IP and output file name from the
    certutil command line so the file, the source address, and any reputation hits can be correlated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the target directory around the download?
  context: >-
    Operators often stage multiple files in the same directory, or the downloaded file triggers further
    writes through extraction, decoding, or additional fetches. Examining directory-level file activity
    reveals the broader scope of the delivery, such as a decoded executable written next to a base64
    source file or a second payload pulled in the same window.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      filter_self:
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection and not filter_self
    fields:
      - TargetFilename
      - Image
- source: template:lolbin.technique_class_lateral
  question: Were any other download LOLBins used on this host recently?
  context: >-
    Operators who use one download LOLBin often reach for several. If certutil pulled a file from an IP,
    check whether bitsadmin, curl, esentutl, expand, extrac32, makecab, replace, or hh.exe were also used
    to transfer files in the same period. Finding multiple download primitives moving payloads strengthens
    the case for deliberate tool transfer rather than an isolated administrative action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was certutil.exe executed from its expected System32 path?
  context: >-
    certutil executed from a non-standard path outside System32 or SysWOW64 may indicate the binary was
    copied or renamed to evade path-based allowlists. A certutil.exe running from a user temp, profile, or
    download directory is more suspicious than one in System32, where certificate administration normally
    runs from. The original file name field confirms the binary is genuinely certutil even when the image
    name has been changed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_user_actor.baseline
  question: Does this user normally run certutil to download files across the network?
  context: >-
    Compare this user's current action against their historical behavior. A user who has never run
    certutil, or never used it to fetch files, is more suspicious than one who does so as part of a known
    administrative or build role. The user's typical toolset and remit should align with command-line
    downloads from external addresses.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and certutil combination historically routine on this host or environment-wide, or is the parent unusual for certutil?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the
    meaningful pivot is the launch mechanism. Which parent process spawned certutil, and is that pair
    historically common here or across the environment. A new or rare parent for certutil is the deviation
    worth chasing, while a pair that already accounts for many prior events is vendor or OS automation such
    as a deployment agent that legitimately stages files.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated staging across
    multiple endpoints. If the same user fetched files via certutil or other tools on more than one host,
    the scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and certutil combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did network-wide returns agent-telemetry noise
    because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same
    launch mechanism — parent process plus certutil — fired on other hosts in the alert window. Multiple
    hosts in the same window points to scheduled or pushed automation; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this certutil direct-IP download pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even a signed system utility gets abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific direct-IP download
    pattern has historically run here rather than generic certutil usage. A new parent process, an
    unexpected user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_flags:
        CommandLine|contains:
        - 'urlcache '
        - 'verifyctl '
        - 'URL '
      selection_http:
        CommandLine|contains:
        - ://1
        - ://2
        - ://3
        - ://4
        - ://5
        - ://6
        - ://7
        - ://8
        - ://9
      filter_main_seven_zip:
        CommandLine|contains: ://7-
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this certutil direct-IP download pattern over the past 90 days, and what command-line shapes are typical?
  context: >-
    A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the count
    reflects this specific direct-IP download pattern rather than generic certutil usage. The command-line
    projection lets the analyst compare typical invocation shapes, such as a recurring automation that
    always targets the same IP, against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_flags:
        CommandLine|contains:
        - 'urlcache '
        - 'verifyctl '
        - 'URL '
      selection_http:
        CommandLine|contains:
        - ://1
        - ://2
        - ://3
        - ://4
        - ://5
        - ://6
        - ://7
        - ://8
        - ://9
      filter_main_seven_zip:
        CommandLine|contains: ://7-
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
