  mutable_dispositions:
    - element: PayloadEntropyThreshold
      dimension: obfuscation_check
      specific_values: "rationale only"
      disposition: context
      target_question: Q5
      notes: "Entropy threshold for distinguishing obfuscation from legitimate compression is not directly queryable in process_creation telemetry; the decode/unpack question surfaces the encoded source and decoded output for the analyst to judge."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only"
      disposition: context
      target_question: Q10
      notes: "Correlation window between download and encoded-file creation is expressed as the +1h directory-activity range; no fixed threshold value to inject."
    - element: SuspiciousParentProcessList
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q6
      notes: "Environment-specific list of suspicious parents (LOLBins / admin tools); the parent-chain question surfaces the actual launch mechanism for comparison."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only"
      disposition: context
      target_question: Q6
      notes: "Known-good updater allowlist (e.g., ChromeUpdate, OneDrive) is environment-specific; parent-chain and baseline_svc questions surface the parent for the analyst to compare."
    - element: DestinationIPCategory
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q7
      notes: "Internal-vs-external IP block filtering is environment-specific; the network_connection question projects DestinationIp/Port so the analyst can classify the address."
    - element: FilePathRegex
      dimension: file_path_analysis
      specific_values: "C:\\Users\\Public, %TEMP%"
      disposition: context
      target_question: Q8
      notes: "Uncommon drop-path patterns are surfaced by the file-creation and directory-activity questions, which scope to the actual %file_paths%/%file_dirs% from the command line rather than a fixed regex; example staging paths noted for analyst orientation."
  dedup_decisions:
    - dropped: cue_user_actor.baseline / cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; emit BOTH (subject vs. mechanism identity pivots)"
      kept: both
    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; emit BOTH (user-pivot degenerates under service principals)"
      kept: both
    - dropped: cue_process_tool.baseline
      reason: "host historical frequency covered by reflected lolbin.historical_lolbin_baseline, which enforces the rule's direct-IP download pattern rather than generic certutil usage"
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.clustering / cue_host_context.clustering
      reason: "around-the-time host activity is better served on this download rule by directory_activity (file scope) and the network_connection egress check; generic host-wide process clustering would add noise without new signal"
      kept: template:download_tool.directory_activity
    - dropped: cue_process_tool.follow_on
      reason: "certutil applies the download in-process; payload execution typically chains via a sibling (cmd && payload) rather than a certutil child, so child-of-certutil has little investigative payload. The decode/unpack and directory_activity questions capture the relevant follow-on file and process artifacts"
      kept: template:obfuscation.encoded_payload_decode
    - dropped: cue_process_tool.scope
      reason: "fleet-wide reflected pattern count dropped to stay within the 18-question ceiling; host-scoped reflected baseline_deviation and historical_lolbin_baseline already give rule-pattern history, and cross-host distribution is lower priority than the download-chain coverage on this rule"
      kept: template:cue_process_tool.baseline_deviation
    - dropped: cue_host_context.precursor
