name: Potentially Suspicious WebDAV LNK Execution
id: d19b49a3-3567-4c22-ae53-f6c2be5012da
description: |
  Detects explorer.exe spawning a script host or command interpreter (cmd.exe,
  cscript.exe, mshta.exe, powershell.exe, pwsh.exe, or wscript.exe) with a command
  line containing the '\DavWWWRoot\' marker, which indicates the executed file was
  accessed from a remote WebDAV share mounted through the WebDAV redirector. This
  pattern is characteristic of an initial-access chain where a user is steered to a
  remote share and double-clicks a shortcut that runs a hidden script directly from
  the WebDAV mount. Investigation should confirm what file was launched from the
  share, decode what the interpreter executed, and determine whether the activity led
  to follow-on payload staging, in-memory loading, or outbound connections.
type: detection
detection_id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Did explorer.exe spawn a script host or command interpreter whose command line contains the '\DavWWWRoot\' WebDAV marker?
  context: Confirm the alert is a true positive by reviewing the exact command line and process lineage. The rule fires when the parent is explorer.exe AND the child binary is one of cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe, or wscript.exe AND the command line contains '\DavWWWRoot\'. The '\DavWWWRoot\' segment means the referenced file was reached over the WebDAV redirector, so the target lives on a remote share rather than local disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to open files from a remote WebDAV share?
  context: User-driven WebDAV mounts are uncommon in most managed environments. Knowing whether this user routinely accesses remote shares this way, and whether the host's role involves it, is often the fastest way to separate a benign access from a lured double-click on an attacker-controlled share.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the interpreter execute from the WebDAV path? Decode the full command line.
  context: The full command line reveals the file launched from the share and any arguments. Decode the referenced path under '\DavWWWRoot\', identify the script or payload name and extension, and note any flags that hide the window or change execution behavior. Script hosts launched this way commonly run a hidden script that stages a follow-on payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '\DavWWWRoot\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the executed command encoded or obfuscated? What does it decode to?
  context: Scripts launched from a WebDAV share frequently chain into an obfuscated stage that strips placeholder fragments from strings, base64-decodes a blob, decrypts it, and loads code in memory. Decode any '-EncodedCommand'/'-enc' payloads, string-concatenation, or fragment-replacement obfuscation to recover the actual operation -- a download cradle, a decryption routine, or an in-memory assembly load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:parent_child.parent_process_legitimacy
  question: What spawned explorer.exe and how was this script host launched as its child?
  context: explorer.exe spawning a script host is the core signal. Because the shortcut is double-clicked inside an Explorer file listing of the remote share, the immediate parent is explorer.exe; tracing the chain confirms whether this is ordinary user shell activity or an interpreter started directly from a mounted WebDAV view. Note whether a WebDAV mount process appears nearby in the lineage.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:universal.evidence_preservation
  question: Is the file launched from the WebDAV share still present on disk for analysis?
  context: When a file is opened over the WebDAV redirector, a local mirror of the remote artifact is written under a temporary staging path before execution. If a copy of the shortcut, script, or downloaded payload remains on disk, it enables hashing, sandbox submission, and content review. Scope the search to the file referenced in the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1204.file_event
  question: What files were created in the WebDAV redirector staging path around the time of this execution?
  context: Files opened over WebDAV are mirrored locally under the redirector's temporary store before they run. Listing files written to that staging path reveals the shortcut, script, icon, and any secondary payloads pulled from the same remote share, even when the original command line names only one file. Shortcut, script, and archive extensions appearing together point to a staged delivery package.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Temp\TfsStore\Tfs_DAV\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1059.001.image_load
  question: Did the script host load .NET runtime or scripting assemblies consistent with in-memory code execution?
  context: WebDAV-delivered scripts often pivot into a script host that reflectively loads .NET assemblies in memory rather than dropping an executable. A script interpreter loading the CLR and reflection-related modules shortly after launch is a signal that code was loaded into the process rather than run from a file on disk. Correlate the loading process to the same lineage as the alert.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      filter_main:
        ImageLoaded|contains:
          - '\clr.dll'
          - '\clrjit.dll'
          - '\mscoree.dll'
          - '\System.Management.Automation'
      condition: selection and filter_main
    fields:
      - ImageLoaded
      - CommandLine
- source: attack:T1204.network_connection
  question: Did this execution lineage make outbound connections after running the WebDAV-launched file?
  context: The user-execution chain typically ends with the launched script reaching out to retrieve or decrypt a payload, or establishing command-and-control. Outbound HTTP(S), DNS, or SMB from the same script host or its children shortly after launch indicates the activity progressed beyond initial execution. Connections to a WebDAV-style host or an unfamiliar external endpoint are worth pivoting on.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1204.application
  question: Did the user-facing application log an event indicating how the remote share was opened?
  context: User execution begins with a user-facing action -- opening a search result, a link, or a file listing that resolves to a remote share. Application event-log entries from Explorer or the shell around the alert time can show how the remote location was reached, complementing the process lineage with the user-facing step that preceded it.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Provider_Name
      - EventID
      - Data
- source: template:cue_parent_process.follow_on
  question: What other child processes did explorer.exe spawn on this host around this time?
  context: An initial-access chain often launches multiple stages in sequence from the same shell. Seeing the other children explorer.exe started in the same window reveals whether the WebDAV-launched interpreter was a one-off or part of a broader sequence of helper, unpacker, and follow-on processes.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run this script host or interpreter?
  context: Compare this user's current action against their historical behavior. A user who has never launched this interpreter is more suspicious than one who runs it routinely. User role and typical toolset should align with running script hosts.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this explorer.exe-to-interpreter launch combination historically routine on this host or across the environment?
  context: When user identity does not attribute behavior, the meaningful pivot is the launch mechanism -- which parent spawned this interpreter, and whether that pair is historically common. A new or rare parent-child pair for this binary on this host or environment-wide is the deviation worth chasing; a pair already accounting for many prior events is routine shell or automation activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same actor triggered similar activity on multiple endpoints. If the same user opened remote shares or ran script hosts on more than one host, the scope may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same explorer.exe-to-interpreter launch fire on other hosts in the same window?
  context: When user identity is not a useful pivot, the meaningful question is whether the same launch mechanism -- parent process plus spawned interpreter -- fired on other hosts in the alert window. Multiple hosts in the same window points to a wider delivery wave; a single host points to an isolated, host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:initial_access.campaign_scope
  question: Did this same detection fire for other users or hosts, suggesting a delivery wave?
  context: Lures that steer users to a remote WebDAV share rarely target a single person. Correlating this detection across hosts reveals how many systems reached the same kind of share and identifies additional users who may have double-clicked a similar shortcut and need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, defense tampering, or other execution events -- may reveal the stages that preceded this one and help reconstruct the timeline from initial access to this execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
