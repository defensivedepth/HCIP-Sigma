name: Boot Configuration Tampering Via Bcdedit.EXE
id: 4b7f6fa0-7153-4007-955b-3ff195ea3119
description: |
  Detects bcdedit.exe being used to modify boot configuration data in a way that suppresses
  Windows automatic recovery — fires when the command line contains 'set' AND either
  'bootstatuspolicy ignoreallfailures' or 'recoveryenabled no'. These flags stop Windows
  from offering the recovery environment or repair prompts after repeated boot failures.
  Legitimate use is rare (some imaging or kiosk-build scripts), but the same change is a
  common pre-encryption step for ransomware to keep a victim from booting into recovery.
  Determine who ran it, what spawned bcdedit, whether other recovery-inhibiting or destructive
  actions accompanied it, and whether the same pattern is firing on other hosts.
type: detection
detection_id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the bcdedit command line match what this rule detects — 'set' plus 'bootstatuspolicy ignoreallfailures' or 'recoveryenabled no'?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when bcdedit.exe (by image name or original filename) is invoked with 'set' AND one of the two recovery-suppressing argument pairs. Read the full command line and confirm both halves are present rather than an unrelated bcdedit query or enumeration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to modify boot configuration data with bcdedit?
  context: Boot configuration changes are normally made during OS imaging, repair, or by a small set of administrators. A workstation or server outside a build/imaging context, or a user with no administrative role, running bcdedit to disable recovery is unusual and shifts the disposition toward malicious or scripted impact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which recovery setting did bcdedit change — was automatic recovery (recoveryenabled No) or the boot status policy (bootstatuspolicy ignoreallfailures) the target?
  context: The two argument pairs have distinct effects. 'recoveryenabled No' disables the Windows Recovery Environment so the machine will not boot into repair. 'bootstatuspolicy ignoreallfailures' tells Windows to ignore boot failures and skip the recovery prompt. Read the exact flags to determine which protection was removed and how completely recovery was suppressed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:ransomware_impact.recovery_options_assessment
  question: What recovery-inhibiting commands were executed on this host?
  context: 'Operators preparing for encryption typically chain several recovery-inhibiting commands: deleting shadow copies (vssadmin, wmic), disabling boot recovery (bcdedit), deleting backups (wbadmin), and disabling the Recovery Environment (reagentc). This query surfaces all such commands on the host so the full scope of recovery destruction is visible. Verify whether each action succeeded by checking system state (vssadmin list shadows, bcdedit /enum, reagentc /info).'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned bcdedit.exe, and is that parent chain expected?
  context: The parent process reveals how bcdedit was invoked. Administrative or imaging use generally launches it from an interactive shell or a known deployment agent. A parent such as a scripting host, an Office application, or an unknown binary dropped from a user-writable path points to scripted impact rather than maintenance. Walk up the tree to see what spawned the parent and what else the parent launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this bcdedit recovery-tampering pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate imaging hosts may run bcdedit recovery changes on a schedule. The query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects how this specific recovery-suppression pattern has run here before. A new parent process, an unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcdedit.exe
      - OriginalFileName: bcdedit.exe
      selection_set:
        CommandLine|contains: set
      selection_cli:
      - CommandLine|contains|all:
        - bootstatuspolicy
        - ignoreallfailures
      - CommandLine|contains|all:
        - recoveryenabled
        - 'no'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did bcdedit.exe spawn afterward?
  context: bcdedit itself does not normally launch other processes, so any children are notable. Children such as cmd.exe, powershell.exe, or an unknown executable suggest the bcdedit call was one step in a scripted sequence rather than a standalone administrative action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is automatic recovery currently restored, or is the host still configured to skip recovery?
  context: The bcdedit change persists until explicitly reverted. Checking the current boot configuration state shows whether the host remains unable to enter recovery. If recoveryenabled is still No or the boot status policy still ignores all failures, the setting should be restored before the host is returned to service.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the boot recovery setting was disabled?
  context: Disabling recovery is typically a precursor to a destructive action it is meant to make irreversible. Examining process creation in the window immediately after the bcdedit change reveals what the tampering was meant to enable — encryption, mass file operations, or further recovery destruction. A burst of unfamiliar processes shortly after points to the payload phase.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:ransomware_impact.encryption_or_ransom_indicators
  question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the bcdedit change?
  context: Recovery-inhibiting actions usually precede file encryption by minutes. This query surfaces processes running from outside standard system locations after the bcdedit call — the kind of unknown binary an encryption stage uses. Also check for ransom notes (README.txt, HOW_TO_DECRYPT) and mass file renames via file event monitoring to determine whether encryption has started.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: template:ransomware_impact.network_wide_impact
  question: Is this same boot-tampering alert firing on other hosts in the environment?
  context: Impact operations often run the same recovery-suppression command across many hosts in rapid succession. Correlating this rule's firings across the fleet shows whether the activity is isolated or network-wide, which determines containment scope. Multiple hosts firing the same pattern in a short window points to scripted or pushed execution.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- source: template:cue_process_tool.scope
  question: Have other hosts fired this bcdedit recovery-tampering pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific recovery-suppression pattern rather than generic bcdedit usage. Many hosts firing the identical pattern points to scripted deployment or imaging automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcdedit.exe
      - OriginalFileName: bcdedit.exe
      selection_set:
        CommandLine|contains: set
      selection_cli:
      - CommandLine|contains|all:
        - bootstatuspolicy
        - ignoreallfailures
      - CommandLine|contains|all:
        - recoveryenabled
        - 'no'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcdedit.exe
      - OriginalFileName: bcdedit.exe
      selection_set:
        CommandLine|contains: set
      selection_cli:
      - CommandLine|contains|all:
        - bootstatuspolicy
        - ignoreallfailures
      - CommandLine|contains|all:
        - recoveryenabled
        - 'no'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcdedit.exe
      - OriginalFileName: bcdedit.exe
      selection_set:
        CommandLine|contains: set
      selection_cli:
      - CommandLine|contains|all:
        - bootstatuspolicy
        - ignoreallfailures
      - CommandLine|contains|all:
        - recoveryenabled
        - 'no'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether this is isolated or part of a wider push. The same user driving recovery-tampering or other destructive commands on multiple endpoints in the same window enlarges the scope of the incident.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcdedit.exe
      - OriginalFileName: bcdedit.exe
      selection_set:
        CommandLine|contains: set
      selection_cli:
      - CommandLine|contains|all:
        - bootstatuspolicy
        - ignoreallfailures
      - CommandLine|contains|all:
        - recoveryenabled
        - 'no'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host?
  context: Defense and recovery tampering frequently accompanies persistence stacking. After suppressing recovery, operators commonly install backup footholds using scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated boot-configuration maintenance.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
