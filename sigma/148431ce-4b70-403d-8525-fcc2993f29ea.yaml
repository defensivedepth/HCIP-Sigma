name: Potential DLL Injection Or Execution Using Tracker.exe
id: d3c73059-c451-4b16-bfaf-1f973705d2ce
description: |
  Detects tracker.exe (a signed Microsoft .NET Framework binary) running with the ' /d ' and ' /c ' switches,
  excluding the legitimate MSBuild invocation pattern. The rule fires when the Image ends in tracker.exe (or its
  description is "Tracker") AND the command line contains both ' /d ' and ' /c ', AND neither the MSBuild parent nor
  the ' /ERRORREPORT:PROMPT ' MSBuild marker is present. In this form, tracker.exe proxies execution of an arbitrary
  DLL ('/d {dll}') into a target process ('/c {target}'), which both injects attacker-controlled code and bypasses
  application allow-listing because the loading binary is Microsoft-signed. Legitimate non-MSBuild use of this pattern
  is rare; investigation should establish what DLL was loaded, what process it was injected into, and whether the
  parent and user account fit normal activity on this host.
type: detection
detection_id: 148431ce-4b70-403d-8525-fcc2993f29ea
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show tracker.exe running with both the ' /d ' and ' /c ' switches?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line
    and process details. The rule fires when tracker.exe (or a process whose description is "Tracker") runs with both
    ' /d ' and ' /c ' present, and neither the MSBuild parent nor the ' /ERRORREPORT:PROMPT ' marker appears. Confirm the
    '/d' argument points at a DLL and the '/c' argument points at the target process to be injected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run tracker.exe to load a DLL into another process?
  context: Legitimate administrative or build activity can trigger detections, but non-MSBuild use of tracker.exe to proxy
    a DLL into a target process is uncommon outside of developer or build-tooling contexts. Knowing whether the user role
    and host function involve .NET build tooling is often the fastest path to distinguishing a true positive from routine
    operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What DLL was loaded and what process was it injected into? Decode the '/d' and '/c' arguments.
  context: The full command line reveals the action taken. The '/d' argument names the DLL that tracker.exe loads, and
    the '/c' argument names the target process the DLL is injected into. Resolve the DLL path (local, user-writable,
    temp, or network), note whether it is signed, and identify the target process to understand what was injected and
    where.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1055.001.injected_dll_load
  question: Did the DLL named in the '/d' argument load on this host around the time of the alert, and is it signed?
  context: DLL injection through tracker.exe results in the named DLL being loaded into a process. Correlating the image
    load confirms the injection actually occurred and surfaces the signature status — an unsigned or untrusted DLL, or one
    loaded from a user-writable or temp path, is the higher-concern outcome. If image-load events are not collected in this
    environment, treat zero results as a visibility gap rather than evidence the DLL never loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1055.001.target_process_access
  question: Did another process open a handle to the target process named in the '/c' argument with write or thread-creation
    rights around the time of the alert?
  context: Injection requires acquiring a handle to the target process with rights such as PROCESS_VM_WRITE and
    PROCESS_CREATE_THREAD before memory is written and a remote thread is created. Reviewing process-access events against
    the target identifies the granting process and the requested access mask. Access masks that include write or
    thread-creation rights (for example 0x1F0FFF or 0x0820) into a sensitive process such as explorer.exe or winlogon.exe
    raise concern. If process-access events are not collected in this environment, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SourceImage
      - TargetImage
      - GrantedAccess
- source: template:cue_process_tool.process_chain
  question: What process spawned tracker.exe and is that parent chain expected?
  context: The parent process reveals how tracker.exe was invoked. Since the MSBuild parent is filtered out by the rule,
    the parent here is something other than a normal build invocation. Unusual parents such as mshta.exe, wscript.exe,
    cmd.exe, powershell.exe, or an Office application may indicate scripted or hands-on-keyboard delivery rather than a
    developer build.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did tracker.exe spawn afterward?
  context: The processes spawned after the injection reveal its actual impact. The '/c' target (commonly a benign-looking
    host process) may go on to spawn cmd.exe, powershell.exe, certutil.exe, or other tooling for post-exploitation.
    Unexpected children point to follow-on activity driven by the injected code.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run tracker.exe?
  context: tracker.exe ships with the .NET Framework but is rarely executed directly outside of MSBuild-driven builds. A
    host that has never or rarely run it is more suspicious than a build server where it appears routinely. Zero or very
    low historical counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this tracker.exe pattern, what parents and users normally drive it, and does
    the current alert fit that pattern?
  context: Even tooling that ships with the OS can be abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically
    run here — not generic tracker.exe usage. A new parent process, an unexpected user account, or an unusual command-line
    pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \tracker.exe
      - Description: Tracker
      selection_cli:
        CommandLine|contains:
        - ' /d '
        - ' /c '
      filter_msbuild1:
        CommandLine|contains: ' /ERRORREPORT:PROMPT '
      filter_msbuild2:
        ParentImage|endswith:
        - \Msbuild\Current\Bin\MSBuild.exe
        - \Msbuild\Current\Bin\amd64\MSBuild.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \tracker.exe
      - Description: Tracker
      selection_cli:
        CommandLine|contains:
        - ' /d '
        - ' /c '
      filter_msbuild1:
        CommandLine|contains: ' /ERRORREPORT:PROMPT '
      filter_msbuild2:
        ParentImage|endswith:
        - \Msbuild\Current\Bin\MSBuild.exe
        - \Msbuild\Current\Bin\amd64\MSBuild.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \tracker.exe
      - Description: Tracker
      selection_cli:
        CommandLine|contains:
        - ' /d '
        - ' /c '
      filter_msbuild1:
        CommandLine|contains: ' /ERRORREPORT:PROMPT '
      filter_msbuild2:
        ParentImage|endswith:
        - \Msbuild\Current\Bin\MSBuild.exe
        - \Msbuild\Current\Bin\amd64\MSBuild.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than the single
    alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \tracker.exe
      - Description: Tracker
      selection_cli:
        CommandLine|contains:
        - ' /d '
        - ' /c '
      filter_msbuild1:
        CommandLine|contains: ' /ERRORREPORT:PROMPT '
      filter_msbuild2:
        ParentImage|endswith:
        - \Msbuild\Current\Bin\MSBuild.exe
        - \Msbuild\Current\Bin\amd64\MSBuild.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led
    to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms alongside the injection.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the
    stages that preceded this event and help reconstruct the timeline. Injection that bypasses application allow-listing
    is often a mid-chain step; prior alerts can show what set it up.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
