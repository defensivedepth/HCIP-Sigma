name: Rundll32 InstallScreenSaver Execution
id: 1ee08194-cbc7-4f9c-9841-99d339f6eb64
description: |
  Detects rundll32.exe (by image name or original filename) invoked with a command line
  containing InstallScreenSaver, the desk.cpl export that registers and launches a .scr file
  as a process. Because Windows treats .scr files as executables and the export does not
  validate that the target is a real screensaver, this lets an operator run arbitrary code
  through a trusted, signed control-panel applet. Legitimate use is rare and usually driven by
  the Desktop Settings UI rather than a direct rundll32 command line. Determine what .scr file
  was launched, where it came from (local path or remote SMB share), what parent invoked
  rundll32, and whether the activity is isolated or part of broader execution on the host.
type: detection
detection_id: 15bd98ea-55f4-4d37-b09a-e7caa0fa2221
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — rundll32.exe invoked with InstallScreenSaver?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact command line and process details. Verify the process is rundll32.exe (by image name
    or original filename) and that the command line contains the desk.cpl InstallScreenSaver export
    along with the path to the .scr file being launched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user/host expected to install or launch a screensaver via a command-line tool?
  context: Legitimate screensaver installation is normally driven by the Desktop Settings UI, not a
    direct rundll32 command line. Knowing whether the user role and host function are consistent with
    direct command-line invocation of this export is often the fastest path to distinguishing a true
    positive from routine activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What .scr file did rundll32 launch, and is the path local or a remote SMB share?
  context: The full command line reveals the specific .scr file passed to InstallScreenSaver. Decode
    the file path to determine whether it points at a local directory (such as a temp, AppData, or
    ProgramData location) or a remote share in UNC form, which indicates the payload was staged
    elsewhere. The path and its location are the central artifact of this technique.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: InstallScreenSaver
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.011.image_load
  question: Did rundll32 load desk.cpl, and were any other unexpected modules mapped into the process?
  context: This technique works by loading desk.cpl into rundll32 and calling its InstallScreenSaver
    export. Confirming the desk.cpl load corroborates the command-line pattern, and any additional
    non-standard modules mapped into the same rundll32 instance can indicate further code being
    pulled in beyond the applet itself. If module-load events are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.011.file_event
  question: Was a .scr file recently created on this host in a user-writable path?
  context: The launched screensaver is an executable with a .scr extension, and operators commonly
    stage it in a temp, AppData, or ProgramData directory before invoking rundll32. A .scr file
    written shortly before the alert, especially in a user-writable location, identifies the payload
    on disk and gives a starting point for hashing and reputation review.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: .scr
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1218.011.network_connection
  question: Did rundll32 make any outbound network connections around the time of the alert?
  context: The remote variant of this technique points InstallScreenSaver at a .scr file on an SMB
    share, and proxy execution through rundll32 can also reach external hosts to retrieve a payload.
    Outbound connections from rundll32 — particularly to SMB ports or external addresses — indicate
    the .scr file was fetched remotely rather than staged locally.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.process_chain
  question: What process spawned rundll32, and is that parent chain expected?
  context: The parent process reveals how rundll32 was invoked. Direct command-line use of this export
    is unusual, so an interactive shell, a script host such as wscript.exe or mshta.exe, or an Office
    application as the parent points toward operator or macro-driven execution rather than a
    UI-initiated screensaver install.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did rundll32 spawn afterward?
  context: Launching the .scr file runs arbitrary code, so the processes that follow reveal the actual
    impact. Unexpected children such as cmd.exe, powershell.exe, or other download or execution tools
    point to post-exploitation activity rather than a benign screensaver registration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains: InstallScreenSaver
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains: InstallScreenSaver
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on more than one host, the scope
    of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains: InstallScreenSaver
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, privilege escalation, or persistence mechanisms near the alert time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the stages that preceded this event and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If rundll32 was used to run
    a .scr payload, check whether regsvr32, mshta, msbuild, installutil, or similar binaries were also
    used to execute code. Finding multiple proxy-execution LOLBins performing the same kind of action
    strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was rundll32.exe executed from its expected System32 or SysWOW64 path?
  context: rundll32 executed from a non-standard path (outside System32 or SysWOW64) may indicate the
    binary was copied or renamed to evade path-based allowlists. A rundll32.exe running from a user's
    temp or profile directory is more notable than one in its expected system location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this rundll32 InstallScreenSaver pattern over the past 90
    days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more notable than one used regularly
    under stable parents. The query mirrors the rule's selection structure scoped to this host, so the
    count reflects this specific firing pattern rather than generic rundll32 usage. The command-line
    projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains: InstallScreenSaver
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
