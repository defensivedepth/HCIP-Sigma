name: Malicious PE Execution by Microsoft Visual Studio Debugger
id: aedb8a48-9cb7-41dc-bccd-33dd77f55b34
description: |
  Detects the Microsoft-signed Just-In-Time debugger vsjitdebugger.exe spawning a child
  process that is not one of its known internal binaries (vsimmersiveactivatehelper or
  devenv.exe). The debugger can be directed to launch and attach to an arbitrary executable,
  so an actor can run a payload as a child of a trusted signed binary to blend with legitimate
  debugging activity. Legitimately, this parent-child relationship appears on developer
  workstations when an application crashes and JIT debugging is engaged. Investigation should
  identify the spawned child binary, confirm what started the debugger, and determine whether
  the host and user are expected to be debugging applications at all.
type: detection
detection_id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the alert show vsjitdebugger.exe as the parent that spawned this child process, and is the child neither vsimmersiveactivatehelper nor devenv.exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the parent process ends in vsjitdebugger.exe and the spawned child is anything other than the debugger's known internal binaries. Review the parent and child image paths on the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to be debugging applications?
  context: JIT debugging legitimately engages on developer workstations when an application crashes. A host with no development tooling and a user with no development role spawning a debugger-launched child is harder to explain as routine and should raise the priority.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: What started vsjitdebugger.exe, and was that an application crash or something else?
  context: The debugger is normally launched by Windows Error Reporting or the Visual Studio installer when a desktop application throws an unhandled exception. Tracing the debugger's own parent reveals whether it was engaged by a genuine crash or driven by a process that has no business invoking JIT debugging.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What is the child binary that vsjitdebugger.exe launched, and what does its command line and working directory reveal about its purpose?
  context: The child process is the payload proxied through the trusted debugger. Decode its full command line, identify the executable path, and note the working directory. A child running from a user-writable or temporary path, or carrying arguments that fetch or execute further content, is the core signal that the debugger was used to run attacker-supplied code rather than a crashing application's own debugger.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.sibling_processes
  question: What other child processes did this same vsjitdebugger.exe instance spawn?
  context: If the debugger instance was used to run a payload, it may have launched more than one child. Examining siblings of the alerting child from the exact parent instance reveals the full scope of what was executed through the debugger in this session.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Has vsjitdebugger.exe spawned this child binary on this host before?
  context: A debugger that has never launched this particular child on this host points to a novel spawning relationship. On a genuine developer workstation, JIT debugging tends to attach to the same locally built applications repeatedly; a brand-new child binary is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run the child binary at all?
  context: A child executable that has never been seen on this host outside the debugger launch is more suspicious than one that runs regularly through other means. Zero or very low historical counts indicate first-time or rare execution of the proxied binary.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: attack:T1218.image_load
  question: What modules did the debugger-launched child load, and were any unsigned or loaded from a user-writable path?
  context: Proxy execution through a trusted binary often continues with the child loading additional libraries to carry out its real work. Unsigned modules, or DLLs loaded from temporary or user-writable directories, indicate the child is staging code rather than running as a normal application. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - CommandLine
- source: attack:T1218.network_connection
  question: Did the debugger-launched child make any outbound network connections?
  context: System binary proxy execution is frequently used to run a payload that retrieves further content or beacons to a remote host. Outbound connections from the child, especially to external addresses, shift the disposition toward the debugger having been used to launch attacker-supplied code. If network telemetry is not collected for this host, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_parent_process.clustering
  question: What other activity occurred around the time vsjitdebugger.exe ran on this host?
  context: Beyond the spawned child, the debugger and its child may have coincided with other process activity that frames the event. Surrounding activity in a tight window helps determine whether this was an isolated crash-and-debug or part of a sequence of hands-on-keyboard actions.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.scope
  question: Is vsjitdebugger.exe spawning non-standard children on other hosts in the environment?
  context: The same debugger-spawns-payload pattern appearing on multiple hosts points to a deliberate technique being applied at scale rather than a one-off crash. A single occurrence is more likely targeted or incidental; a cluster across hosts helps calibrate severity and scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \vsjitdebugger.exe
      reduction1:
        Image|endswith: \vsimmersiveactivatehelper*.exe
      reduction2:
        Image|endswith: \devenv.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not (reduction1 or reduction2)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \vsjitdebugger.exe
      reduction1:
        Image|endswith: \vsimmersiveactivatehelper*.exe
      reduction2:
        Image|endswith: \devenv.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not (reduction1 or reduction2)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar debugger-launched execution on multiple hosts, the scope of the activity may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \vsjitdebugger.exe
      reduction1:
        Image|endswith: \vsimmersiveactivatehelper*.exe
      reduction2:
        Image|endswith: \devenv.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not (reduction1 or reduction2)) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence around the debugger launch.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the full timeline leading up to the debugger-launched execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
