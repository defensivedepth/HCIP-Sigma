name: Start of NT Virtual DOS Machine
id: a8b82904-8ad1-4750-8c9e-fb958446cb81
description: |
  Fires when a process whose image name ends in ntvdm.exe or csrstub.exe starts. The NT Virtual DOS Machine hosts 16-bit
  MS-DOS and Win16 applications and is invoked automatically when a 16-bit binary executes on 32-bit Windows; it is not
  present on 64-bit Windows. Execution of 16-bit code is extremely rare in modern enterprise environments, so almost any
  ntvdm.exe activity is anomalous. Legitimate triggers include a user double-clicking an old .com or 16-bit .exe, or an
  installer extracting legacy setup tooling. The investigation should determine what 16-bit binary caused the host to spin
  up ntvdm, what spawned it, and whether the host runs legacy applications that explain it.
type: detection
detection_id: 16905e21-66ee-42fe-b256-1318ada2d770
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the process image match what this rule detects (ntvdm.exe or csrstub.exe)?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the alerting process image
    and the launching context. The rule fires on the bare presence of the NT Virtual DOS Machine host process, so the image
    name ending in ntvdm.exe or csrstub.exe is the whole match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run 16-bit DOS or Win16 applications?
  context: Legacy 16-bit applications survive in a small number of niche environments (old line-of-business tooling on 32-bit
    endpoints). Knowing whether this host is one of those, and whether the user has a reason to launch such software, is often
    the fastest path to separating a legacy workload from anomalous execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What 16-bit program did ntvdm load, and what command line was passed to it?
  context: The NT Virtual DOS Machine is a host for legacy code; the interesting artifact is the 16-bit binary it was asked
    to run and the working directory it ran from. Review the full command line and current directory to identify which .com
    or 16-bit .exe triggered the subsystem and where that file lives on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned ntvdm and is that parent chain expected?
  context: The parent process reveals how the 16-bit code was invoked. A user double-clicking a legacy file shows explorer.exe;
    an installer shows the setup executable. Parents such as script hosts, Office applications, or command interpreters
    point to programmatic invocation of legacy code that may be an evasion attempt rather than a user action.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did ntvdm spawn afterward?
  context: The processes spawned under the subsystem reveal its actual impact. Canonical NTVDM children are legacy companion
    processes such as command.com. Children outside that legacy set, or general-purpose interpreters and download tools,
    indicate the 16-bit execution was a stepping stone to further activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even a legacy-application host has a normal shape for 16-bit execution. The query mirrors the rule's selection
    scoped to this host, so the resulting parent and user distribution reflects how the NT Virtual DOS Machine has
    historically started here. A new parent process, an unexpected user account, or a first-time appearance is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ntvdm.exe
        - \csrstub.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.baseline
  question: Does this host normally run the NT Virtual DOS Machine?
  context: A process that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts over the trailing period indicate first-time or rare 16-bit execution, which on a modern endpoint is
    itself the signal.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the NT Virtual
    DOS Machine starting. Many hosts firing the same pattern points to a shared legacy application deployed broadly; one host
    or a small unrelated set points to a localized trigger. Use the host distribution to calibrate how unusual this is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ntvdm.exe
        - \csrstub.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run 16-bit or legacy applications?
  context: Compare this user's current action against their historical behavior. A user who has never invoked the NT Virtual
    DOS Machine is more suspicious than one who does so regularly as part of a legacy workflow. User role and typical toolset
    should align with running decades-old software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent
    unusual for ntvdm?
  context: 'When the alert fires under a service principal, user identity does not attribute the behavior. The meaningful pivot
    is the launch mechanism: which parent process spawned ntvdm, and whether that pair is historically common. A new or rare
    parent for the subsystem on this host or environment-wide is the deviation worth chasing; a pair that already accounts
    for many prior events is a recurring legacy workload.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar legacy execution or follow-on tooling on other hosts, the scope of the activity may
    be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window, or is the activity isolated
    to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — the parent process spawning ntvdm — fired on other hosts in
    the alert window. Multiple hosts in the same window points to pushed or scheduled automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms accompanying the legacy execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance,
    credential access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services,
    flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful signal that protection
    looks healthy; kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the
    disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
