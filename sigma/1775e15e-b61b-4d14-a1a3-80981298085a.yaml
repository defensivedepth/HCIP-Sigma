name: Rundll32 Execution Without CommandLine Parameters
id: 40de473b-dd66-4009-a594-c9efcec92fb5
description: |
  Detects rundll32.exe started with no module or export arguments on its command line, where the parent process is not under a per-user AppData\Local path or a Microsoft Edge path. A bare rundll32.exe with no DLL and no exported function does nothing useful on its own, so this shape is unusual for legitimate use. It matches the default fork-and-run spawn target that some post-exploitation frameworks launch as a host for injected code: a clean rundll32.exe is started and then code is written into it in memory, so the process exists without ever being given the arguments it would normally need. Determine whether the bare rundll32.exe was launched by an expected parent, whether anything was injected or spawned from it, and whether it made outbound connections.
type: detection
detection_id: 1775e15e-b61b-4d14-a1a3-80981298085a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show rundll32.exe launched with no module or export arguments?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when the command line ends with rundll32.exe (with or without a trailing quote) or bare rundll32 AND the parent process is not running from a per-user AppData\Local path or a Microsoft Edge path. Check that the full command line carries no DLL path and no exported function name after the executable, because a legitimate rundll32 invocation almost always names both.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run rundll32.exe with no arguments?
  context: Legitimate administrative or application activity can trigger this detection, but a bare rundll32.exe with no module is rarely something a person or a normal application produces on purpose. Knowing whether the user role and host function fit this behavior is often the fastest way to separate a true positive from a routine operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: Confirm from the full command line that rundll32.exe was given no DLL and no exported function.
  context: The investigative value here is the absence of arguments. Read the complete command line for the alerting process and verify there is no module path and no export name following rundll32.exe. A bare host process is consistent with code being injected into it after launch rather than rundll32 being asked to run a specific library, which is the behavior this rule targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this rundll32.exe and is that parent chain expected?
  context: The parent process reveals how the bare rundll32.exe was created. When a tool launches rundll32 only to inject code into it, the parent is the more meaningful artifact than the rundll32 itself. Walk up from the parent to see what spawned it; an unexpected parent such as a script host, an Office application, or an unsigned binary points to abuse rather than legitimate use.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host previously launched rundll32.exe with no arguments?
  context: A no-argument rundll32 launch that has never been seen on a host is more suspicious than one that recurs. This query counts prior firings of the same no-argument pattern on this host rather than all rundll32 usage, so a zero or very low count indicates a first-time or rare occurrence of exactly the behavior the rule detects.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|endswith:
        - \rundll32.exe
        - \rundll32.exe"
        - \rundll32
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even an unusual pattern can have a benign recurring cause on a given host. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific no-argument rundll32 firing has historically run here. A new parent process, an unexpected user account, or a first-time appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|endswith:
        - \rundll32.exe
        - \rundll32.exe"
        - \rundll32
      filter:
        ParentImage|contains:
        - \AppData\Local\
        - \Microsoft\Edge\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this rundll32.exe spawn afterward?
  context: A rundll32 host process used for injected code often runs without spawning visible children, but post-exploitation jobs sometimes launch follow-on processes such as cmd.exe, powershell.exe, or other tooling. Any children spawned by this rundll32 reveal what the injected code actually did and whether the operation moved on to discovery, credential access, or lateral movement.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1202.network_connection
  question: Did this rundll32.exe open any outbound network connections?
  context: A bare rundll32 launched as a host for injected code frequently makes outbound connections that the injected code uses to reach external infrastructure. Outbound connections from a rundll32 process that was started with no module are notable, since legitimate rundll32 work is typically local. Review destination addresses and ports and whether the connection is to internal or external infrastructure.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1202.file_event
  question: What files did this rundll32.exe write to disk around the time of the alert?
  context: Injected code running inside a rundll32 host may drop tooling, stage collected data, or write payloads to disk. Files created by this process help characterize the operation and may yield additional indicators to pivot on. Review write locations such as user-writable, temporary, or public directories.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the no-argument rundll32 pattern rather than generic rundll32 usage. Many hosts firing the same pattern can point to scripted deployment or an environment-specific automation; one host or a small unrelated set points to manual operator activity. Use the host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|endswith:
        - \rundll32.exe
        - \rundll32.exe"
        - \rundll32
      filter:
        ParentImage|contains:
        - \AppData\Local\
        - \Microsoft\Edge\
      condition: selection and not filter
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally launch rundll32.exe across the environment?
  context: Compare this user's current action against their historical behavior. A user who has never produced this kind of rundll32 execution is more suspicious than one who does so regularly. Combine the count with what you know about the user's role; a no-argument rundll32 is not part of routine end-user or most administrative workflows.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-rundll32 combination historically routine on this host or across the environment, or is the parent unusual?
  context: When the alert fires under a service or computer account, user identity does not attribute the behavior, so the meaningful pivot is the launch mechanism. Look at which parent process spawned rundll32 and whether that pair is historically common. A new or rare parent for rundll32 on this host or environment-wide is the deviation worth chasing; a pair that already accounts for thousands of prior events is more likely automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered related activity on several hosts in this window, the scope of the operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-rundll32 combination fire on other hosts in the same window?
  context: Under a service or computer account, asking what else the user did returns agent-telemetry noise, because every host runs system-owned processes constantly. The meaningful question is whether the same launch mechanism, the parent process and spawned rundll32, fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the surrounding process activity reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence around the time the bare rundll32 launched.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the full timeline. The alert sequence often tells the story of how the operation reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. This query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful sign that protection looks healthy, though kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
