    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "rationale only"
      disposition: context
      target_question: Q4
      notes: "Tuning rationale (match encoded/uncommon patterns) with no concrete values; rule has empty commandline_values. Covered by the decode question's context plus the encoded_command_decode question; no query injection possible without inventing values."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only"
