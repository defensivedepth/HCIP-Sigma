      kept: cue_user_actor.clustering
    - dropped: cue_host_context.clustering
      reason: "Overlaps host_context.precursor (alert timeline) and user_actor.clustering (around-time activity); dropped to stay within 14-18 and avoid a third near-identical around-the-alert-window question."
      kept: cue_host_context.precursor
    - dropped: cue_process_tool.baseline
      reason: "host+binary 90d frequency of the raw interpreter is dominated by routine cmd/powershell usage and would not isolate the rule's SYSTEM-from-unusual-parent pattern; the reflected baseline_deviation gives the filter-correct host baseline instead."
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_user_actor.baseline (paired with substitute)
      reason: "user_actor pair — non-deduplicable; both user-pivot and parent+binary substitute emitted as Q12 and Q13."
      kept: cue_user_actor.baseline + cue_user_actor.baseline_svc
    - dropped: cue_user_actor.clustering (paired with substitute)
      reason: "user_actor pair — non-deduplicable; both user-pivot and parent+binary substitute emitted as Q14 and Q15."
      kept: cue_user_actor.clustering + cue_user_actor.clustering_svc
  skipped_templates:
    - template: masquerading.binary_origin
      reason: "file_event basename-arrival question targets dropped/renamed binaries. This rule's binaries are genuine OS interpreters confirmed by OriginalFileName; tracing the arrival of cmd.exe/powershell.exe by basename over 30d returns the OS install/servicing events, not a delivery mechanism. The masquerading angle here is the parent location, not a planted file — covered by the parent-chain and identity questions."
    - template: masquerading.renamed_binary_activity
      reason: "Two threads (child-process activity + cross-host scope) are already covered: child activity by cue_process_tool.follow_on (ParentProcessGuid-scoped, more precise than ParentImage match), and cross-host scope by the reflected cue_process_tool.scope which counts the rule's exact pattern fleet-wide. Keeping it would duplicate both without adding signal."
