name: Suspicious File Download From IP Via Wget.EXE
id: 0166d996-e1eb-4fa1-b405-03a383151b5c
description: |
  Detects wget.exe invoked to download a file directly from a numeric IP address over HTTP(S), where the command line also carries an output-file flag (-O or --output-document) and the saved file ends in an executable or script extension (.exe, .dll, .ps1, .bat, .vbs, .hta, .msi, .dat, .vbe, .psm1). Fetching code from a bare IP rather than a hostname bypasses name-based reputation and is a common payload-delivery step; legitimate use of wget on Windows endpoints is uncommon and usually points at packaged tooling or developer activity. Confirm the URL and destination, determine whether the file landed and was executed, and establish whether wget and this download pattern are routine for this user and host.
type: detection
detection_id: 17f0c0a8-8bd5-4ee0-8c5f-a342c0199f35
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the rule's pattern — wget.exe downloading from a numeric IP over HTTP(S) to an executable or script file?
  context: Confirm the alert is a true positive before investing time. The rule fires only when all conditions hold together — the binary is wget.exe (by name or OriginalFileName), the command line contains an http reference to a bare IPv4 address, an output flag (-O or --output-document) is present, and the saved filename ends in an executable or script extension. Read the full command line and verify each of these is genuinely present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to download files from IP addresses using command-line tools?
  context: Legitimate administration or software builds can invoke wget, but downloading executable content directly from a numeric IP is unusual on most endpoints. Knowing whether the user role and host function involve command-line downloads is often the fastest way to separate routine operations from a delivery attempt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did wget download? Decode the full command line — the source IP, the protocol, and the destination path.
  context: The full command line reveals the operation. Identify the IP address and URL being fetched, the file written by the -O or --output-document flag, and the extension of that file. The destination path tells you where to look for the payload on disk, and the extension indicates what kind of code was retrieved.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned wget.exe, and is that parent chain expected?
  context: The parent process reveals how wget was invoked. A download driven by explorer.exe or an interactive shell looks different from one launched by a script host (wscript.exe, mshta.exe), an Office application, or another command interpreter, which more often indicates scripted delivery or exploitation. Walk up the tree to see what spawned the parent and what else it launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did wget.exe spawn afterward?
  context: A downloader that immediately launches the file it retrieved — or hands off to cmd.exe, powershell.exe, or a script host — has progressed past delivery into execution. Children of wget on this host indicate whether the downloaded payload was run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:download_tool.download_success_verification
  question: Did the download actually succeed — was a file created on disk by wget.exe?
  context: A download command does not guarantee the file was retrieved; network errors, blocked addresses, or security controls may have stopped the transfer. File-creation events written by wget.exe on this host establish whether the attack progressed past delivery. Match the resulting filename against the destination named by the -O or --output-document flag in the command line.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: Can you retrieve and analyze the downloaded payload from a safe environment?
  context: If the downloaded file is still on disk, submitting its hash to threat intelligence or detonating it in a sandbox reveals whether it is a known malicious payload, a legitimate tool, or something novel. The file-event record provides the path and hash for lookup; pair the hash with the destination path identified in the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: template:cue_process_tool.baseline
  question: Does this host normally run wget.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the lookback window indicate first-time or rare execution of wget here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even uncommon tools have a usage pattern. This query mirrors the rule's full selection — wget downloading from an IP over HTTP(S) to an executable file — scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_ext:
        CommandLine|endswith:
        - .ps1
        - .ps1'
        - .ps1"
        - .dat
        - .dat'
        - .dat"
        - .msi
        - .msi'
        - .msi"
        - .bat
        - .bat'
        - .bat"
        - .exe
        - .exe'
        - .exe"
        - .vbs
        - .vbs'
        - .vbs"
        - .vbe
        - .vbe'
        - .vbe"
        - .hta
        - .hta'
        - .hta"
        - .dll
        - .dll'
        - .dll"
        - .psm1
        - .psm1'
        - .psm1"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_ext:
        CommandLine|endswith:
        - .ps1
        - .ps1'
        - .ps1"
        - .dat
        - .dat'
        - .dat"
        - .msi
        - .msi'
        - .msi"
        - .bat
        - .bat'
        - .bat"
        - .exe
        - .exe'
        - .exe"
        - .vbs
        - .vbs'
        - .vbs"
        - .vbe
        - .vbe'
        - .vbe"
        - .hta
        - .hta'
        - .hta"
        - .dll
        - .dll'
        - .dll"
        - .psm1
        - .psm1'
        - .psm1"
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_ext:
        CommandLine|endswith:
        - .ps1
        - .ps1'
        - .ps1"
        - .dat
        - .dat'
        - .dat"
        - .msi
        - .msi'
        - .msi"
        - .bat
        - .bat'
        - .bat"
        - .exe
        - .exe'
        - .exe"
        - .vbs
        - .vbs'
        - .vbs"
        - .vbe
        - .vbe'
        - .vbe"
        - .hta
        - .hta'
        - .hta"
        - .dll
        - .dll'
        - .dll"
        - .psm1
        - .psm1'
        - .psm1"
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar download activity on more than one host, the scope of the operation may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_ext:
        CommandLine|endswith:
        - .ps1
        - .ps1'
        - .ps1"
        - .dat
        - .dat'
        - .dat"
        - .msi
        - .msi'
        - .msi"
        - .bat
        - .bat'
        - .bat"
        - .exe
        - .exe'
        - .exe"
        - .vbs
        - .vbs'
        - .vbs"
        - .vbe
        - .vbe'
        - .vbe"
        - .hta
        - .hta'
        - .hta"
        - .dll
        - .dll'
        - .dll"
        - .psm1
        - .psm1'
        - .psm1"
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this download, what happened after, and whether it is part of a larger sequence. Watch for reconnaissance, privilege escalation, or persistence among the surrounding process activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's full selection with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic wget usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_ext:
        CommandLine|endswith:
        - .ps1
        - .ps1'
        - .ps1"
        - .dat
        - .dat'
        - .dat"
        - .msi
        - .msi'
        - .msi"
        - .bat
        - .bat'
        - .bat"
        - .exe
        - .exe'
        - .exe"
        - .vbs
        - .vbs'
        - .vbs"
        - .vbe
        - .vbe'
        - .vbe"
        - .hta
        - .hta'
        - .hta"
        - .dll
        - .dll'
        - .dll"
        - .psm1
        - .psm1'
        - .psm1"
      condition: all of selection_*
    fields:
