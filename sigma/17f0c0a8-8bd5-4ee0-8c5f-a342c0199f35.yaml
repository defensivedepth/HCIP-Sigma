- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded this download and help reconstruct the timeline. A download that follows prior reconnaissance or tampering reads very differently from one that fires alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
