name: Execute Code with Pester.bat as Parent
id: 2e88e189-36b5-4019-af9a-3a637dfa3bbf
description: |
  Detects a child process spawned by powershell.exe or pwsh.exe whose parent command line both references the Pester module path (\WindowsPowerShell\Modules\Pester\) AND invokes Pester in one of two ways — either the test-runner entry ({ Invoke-Pester -EnableExit ;) or a Get-Help invocation ({ Get-Help "). Pester ships a signed helper batch script (pester.bat) that can be coerced into proxying arbitrary command execution, so a Microsoft-trusted PowerShell context launches an attacker-chosen child. Legitimately this fires when developers run PowerShell module tests; maliciously it is a signed-script proxy-execution path that hides the real payload behind a trusted invocation. Determine what child process was launched, what the parent PowerShell actually executed, and whether this user and host normally run Pester.
type: detection
detection_id: 18988e1b-9087-4f8a-82fe-0414dce49878
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did powershell.exe or pwsh.exe spawn this child while invoking the Pester module, either via Invoke-Pester -EnableExit or via Get-Help?
  context: Confirm the alert is a true match before investing time. The rule fires only when the parent is powershell.exe or pwsh.exe, the parent command line references the Pester module path (\WindowsPowerShell\Modules\Pester\), AND the parent command line contains one of two invocation patterns — { Invoke-Pester -EnableExit ; or { Get-Help ". Note which of the two branches fired, since the Get-Help branch is the variant abused to proxy execution while the Invoke-Pester branch overlaps with routine test runs. Read ParentImage and ParentCommandLine on the triggering event to verify.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run PowerShell module tests with Pester?
  context: Pester is a legitimate PowerShell testing framework used by developers and build automation. A developer workstation or CI/build host running Pester is routine; a server or end-user host with no development role running it is harder to explain and shifts the disposition toward proxy-execution abuse. Knowing the host function and user role is often the fastest triage step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_parent_process.mechanism_decode
  question: What did the parent PowerShell process run, and what launched PowerShell itself?
  context: The parent's own process_creation event shows the full PowerShell command line that referenced the Pester module, and reveals what spawned PowerShell. A PowerShell instance launched interactively by a developer differs from one launched by an Office application, a script interpreter, or a remote-execution service. The -7d range is intentional — long-running shells and sessions can start hours or days before the child fires.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What command did the spawned child process run? Decode its full command line.
  context: The child process is what Pester proxied into execution and is the payload the trusted PowerShell context concealed. Decode every flag, parameter, encoded segment, file path, or URL on the child command line to identify the operational purpose. The query returns all executions of this child binary on the host within the window so that multi-step operations split across sequential invocations are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the parent PowerShell command encoded or obfuscated, and what does it decode to?
  context: The parent PowerShell command line is the line that invoked Pester. Attackers frequently use -EncodedCommand (-enc), string concatenation, backtick escaping, or variable substitution to hide what the script actually does. Base64-encoded commands are the most common form. Decoding reveals the real payload — download cradles, reverse shells, or in-memory execution of .NET assemblies — behind the trusted invocation. This query targets the parent's command line via the parent process identifier.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1216.parent_process_analysis
  question: What is the child binary that was launched, and is it signed and from a trusted path?
  context: Signed-script proxy execution works by having a Microsoft-trusted parent (PowerShell with the Pester helper) launch an untrusted or attacker-supplied child. A child binary that is unsigned, signed by an unexpected publisher, or running from a user-writable or temporary directory is the signed-to-unsigned transition that distinguishes abuse from a legitimate test run. Examine the child Image path and its signing status from the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated content of what ran?
  context: Event ID 4104 (script block logging) records the deobfuscated script content PowerShell actually executed, even when the command line is encoded or obfuscated. This is ground truth for what the Pester invocation ran. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Attackers often disable or bypass PowerShell security controls before running a payload — AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), constrained language mode escape, or a downgrade to PowerShell v2 which lacks logging. Finding these precursor events on the host strengthens the case that the Pester invocation was abuse rather than a test run.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Does PowerShell normally spawn this child binary on this host?
  context: Some parent-child relationships are routine while others are inherently unusual. A PowerShell-to-child pairing that has occurred many times before on this host points to established automation or developer workflow; a pairing with zero or very low historical count indicates a novel spawning relationship worth chasing. The child binary is the discriminator here, since PowerShell is a common parent.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_parent_process.follow_on
  question: What other child processes did this PowerShell parent spawn?
  context: A proxy-execution chain may launch several tools in sequence — reconnaissance, credential access, download cradles, lateral movement. Listing every child of the PowerShell parent on this host reveals the full scope of activity initiated through this invocation, beyond the single child that triggered the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.scope
  question: Is this PowerShell-to-child spawning pattern occurring on other hosts?
  context: The same parent-child relationship appearing on multiple hosts may indicate a pushed or scripted rollout, or a shared tooling pattern; a single occurrence is more likely targeted or host-local. Comparing across hosts helps calibrate scope and distinguish a developer's local test run from coordinated activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell module tests or spawn this child binary?
  context: Compare this user's current action against their historical behavior. A user who has never run Pester or never launched this child binary is more suspicious than one who does so regularly. User role should align — a developer running module tests is expected; a user with no development function is not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this PowerShell-parent and child-binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service or computer account, user identity does not attribute behavior. The meaningful pivot is the launch mechanism — which parent spawned this binary and whether that pair is historically common. A new or rare PowerShell-to-child pairing is the deviation worth chasing; a pair already accounting for thousands of prior events is vendor or build automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the operation may be larger than this single execution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same PowerShell-parent and child-binary combination fire on other hosts in the same window?
  context: Under a service or computer account, asking what else the user did returns agent-telemetry noise. The meaningful question is whether the same launch mechanism — PowerShell parent plus spawned binary — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event, what happened after, and whether it is part of a larger sequence. Aggregating by Image and ParentImage collapses repetitive agent noise into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct the timeline. A proxy-execution invocation arriving after other suspicious activity reads very differently from an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. This surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
