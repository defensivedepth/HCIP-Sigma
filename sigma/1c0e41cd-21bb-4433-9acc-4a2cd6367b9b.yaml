name: Suspicious Modification Of Scheduled Tasks
id: af04236f-96ec-4948-94bf-0bf684c4e37b
description: |
  Detects schtasks.exe modifying an already-registered scheduled task (the /Change and
  /TN flags together) where the command line also references a user-writable or staging
  location AND a script interpreter or proxy-execution binary. Modifying an existing task
  after creation lets an operator slip a malicious payload into a task that was created
  to look benign, evading detection that focuses on task creation. The rule fires only
  when all three conditions match together; the investigation should decode the full
  /Change command line to identify the new program (/TR) and run-as account (/RU), confirm
  the targeted task name, and determine whether the modification was an authorized change
  or a persistence/escalation pivot.
type: detection
detection_id: 1c0e41cd-21bb-4433-9acc-4a2cd6367b9b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the rule — schtasks with /Change and /TN, referencing a staging location AND a script interpreter or proxy-execution binary?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires only when all three conditions are present together — the /Change and /TN
    flags (a modification to an existing task), a user-writable or staging path (such as
    AppData, Public, ProgramData, or a Temp directory), and a script interpreter or
    proxy-execution binary (cmd, powershell, mshta, wscript, certutil, rundll32, regsvr32,
    and similar). Read the full command line and verify all three are present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to modify scheduled tasks from the command line?
  context: Legitimate administrative activity can trigger this detection — patch tooling,
    deployment scripts, and IT helpers sometimes adjust existing tasks. Knowing whether the
    account routinely manages scheduled tasks and whether the host's function involves that
    kind of administration is often the fastest path to separating a true positive from a
    sanctioned change. Direct schtasks /change from an ordinary user account on a workstation
    is harder to explain than the same action from a known automation account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:scheduled_task.task_configuration
  question: Which task was modified, and what new program and run-as account does the /Change set?
  context: The schtasks /Change command line carries the targeted task name (/TN), the new
    program or command (/TR), the run-as account (/RU), and any schedule change. Decode each
    argument from the alerting command line. A /TR pointing at a staging path under AppData,
    Public, or ProgramData, or a /RU that moves the task to SYSTEM, reveals the persistence or
    escalation payload that was swapped into the existing task. Note whether the targeted task
    name resembles a Windows-component task, which would indicate an attempt to hijack a
    trusted task.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:obfuscation.encoded_payload_decode
  question: Is the modified task's command line encoded or obfuscated, and what does the decoded payload do?
  context: The interpreter referenced in the /TR program is often handed an encoded or
    obfuscated payload to hide its intent. Common encodings include base64 (powershell
    -EncodedCommand, certutil -decode), hex, character-concatenation chains in VBScript or
    JScript, and environment-variable substitution. Decode the payload from the alerting
    command line to reveal the actual operation — a download cradle, a reverse shell, an
    in-memory loader, or credential theft. For multi-layer encoding, iterate decoding until
    the content is readable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned schtasks.exe, and is that parent chain expected for task administration?
  context: The parent process reveals how schtasks was invoked. Legitimate task changes often
    come from interactive admin shells, deployment agents, or management consoles with
    predictable parent chains. A parent such as mshta.exe, wscript.exe, an Office application,
    or a freshly written binary in a user-writable directory points toward exploitation or a
    malicious script driving the modification. Examine what spawned the parent and what else
    the parent launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:scheduled_task.task_trigger_and_timing
  question: When is the modified task set to run, and has it already executed?
  context: The trigger schedule determines when the swapped-in payload activates. A task set
    to run at boot or logon fires on the next restart or sign-in; a recurring task (every few
    minutes, daily) may have already executed multiple times since the modification. Scheduled
    tasks run as children of the Task Scheduler service, so process creation under svchost
    hosting the Schedule service reveals whether the modified payload has run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:scheduled_task.task_still_present
  question: Is the modified task still registered, and does its current program match the alert?
  context: Persistence is only effective if the task still exists with the modified program in
    place. Some operators revert or delete a task after it runs to reduce forensic artifacts.
    Confirming the task is still present and that its /TR still points at the suspicious
    program (via schtasks /query /tn <taskname> /v or the Task Scheduler view on the host)
    determines whether the persistence mechanism is active and needs remediation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was schtasks.exe executed from its expected System32 path?
  context: schtasks.exe normally runs from C:\Windows\System32 (or SysWOW64). A schtasks
    binary executing from a user temp directory or other non-standard path may have been
    copied or renamed to evade path-based allowlisting, which is more suspicious than the
    in-box binary. Compare the Image path and OriginalFileName against the expected location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's schtasks modification pattern over the past 90 days, and what command-line structures are typical?
  context: A task-modification pattern with no prior history on a host is more suspicious than
    one that recurs under stable, well-understood command lines. The query mirrors the rule's
    selection structure scoped to this host, so the count reflects the rule's specific firing
    pattern rather than generic schtasks usage. The command-line projection lets the analyst
    compare typical invocation patterns against the alerting one — a one-off, never-before-seen
    pattern is the anomaly worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_schtasks:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /Change '
        - ' /TN '
      selection_susp_locations:
        CommandLine|contains:
        - \AppData\Local\Temp
        - \AppData\Roaming\
        - \Users\Public\
        - \WINDOWS\Temp\
        - \Desktop\
        - \Downloads\
        - \Temporary Internet
        - C:\ProgramData\
        - C:\Perflogs\
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      selection_susp_images:
        CommandLine|contains:
        - regsvr32
        - rundll32
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - powershell
        - mshta
        - wscript
        - cscript
        - certutil
        - bitsadmin
        - bash.exe
        - 'bash '
        - scrcons
        - 'wmic '
        - wmic.exe
        - forfiles
        - scriptrunner
        - hh.exe
        - 'hh '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result
    is a fleet-wide count of the rule's firing pattern rather than generic schtasks usage.
    Many hosts firing the same modification pattern points to scripted deployment or vendor
    automation that legitimately rewrites tasks; one host or a small unrelated set points to
    manual operator activity. Use the host distribution and command-line consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_schtasks:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /Change '
        - ' /TN '
      selection_susp_locations:
        CommandLine|contains:
        - \AppData\Local\Temp
        - \AppData\Roaming\
        - \Users\Public\
        - \WINDOWS\Temp\
        - \Desktop\
        - \Downloads\
        - \Temporary Internet
        - C:\ProgramData\
        - C:\Perflogs\
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      selection_susp_images:
        CommandLine|contains:
        - regsvr32
        - rundll32
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - powershell
        - mshta
        - wscript
        - cscript
        - certutil
        - bitsadmin
        - bash.exe
        - 'bash '
        - scrcons
        - 'wmic '
        - wmic.exe
        - forfiles
        - scriptrunner
        - hh.exe
        - 'hh '
      condition: all of selection_*
    fields:
    - host.name
- source: template:lolbin.technique_class_lateral
  question: Were other proxy-execution or download LOLBins used on this host recently?
  context: Operators who pivot through one living-off-the-land binary frequently chain several
    for the same objective. The interpreters this rule flags inside the modified task (cmd,
    powershell, mshta, rundll32, regsvr32, certutil, bitsadmin, wscript, cscript, wmic) are the
    same class of proxy-execution and download binaries an operator uses elsewhere in the
    intrusion. Finding several of them performing related actions on the host strengthens the
    case that the task modification is part of malicious activity rather than an isolated admin
    change.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\scriptrunner.exe'
          - '\hh.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\installutil.exe'
          - '\mavinject.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
