- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity
    spanning multiple endpoints. If the same account modified tasks or ran administrative
    tooling on several hosts in the same window, the scope of the activity is wider than a
    single endpoint and may indicate broader operator access.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
