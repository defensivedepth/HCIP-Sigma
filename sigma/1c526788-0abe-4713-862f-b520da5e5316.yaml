name: Chromium Browser Headless Execution To Mockbin Like Site
id: f0643bd3-3fc3-41f7-a1f5-371e371a6b22
description: |
  Detects a Chromium based browser (brave, chrome, msedge, opera, or vivaldi) launched
  with the --headless flag and a command line containing a URL that points to a
  request-mocking service (run.mocky or mockbin). The rule fires only when the browser
  image, the headless flag, AND the mocking-service URL are all present together. Mocking
  services return arbitrary attacker-controlled content from a trusted-looking endpoint and
  can receive posted data, so headless browser requests to them are used to fetch staged
  payloads or to exfiltrate command output without a visible browser window. Legitimate use
  is rare: developers occasionally test against these services, and some automation drives
  headless browsers, so the investigation should confirm the command line, identify what
  launched the browser, and determine whether the activity fits known automation on this
  host and user.
type: detection
detection_id: 1c526788-0abe-4713-862f-b520da5e5316
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show a headless Chromium browser launched with a run.mocky or mockbin URL?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule requires
    all three conditions together — the image is one of brave, chrome, msedge, opera, or vivaldi; the
    command line contains --headless; and the command line contains a ://run.mocky or ://mockbin URL.
    Read the full URL and note any path or query parameters, which often carry the staging or exfil target.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a headless browser against a request-mocking service?
  context: Headless browser execution against run.mocky or mockbin is uncommon outside of developer testing
    or specific automation. Knowing whether the user role and host function involve web development, API
    testing, or scripted browser automation is often the fastest way to separate routine activity from
    operator-driven staging or exfiltration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full headless browser command line, and what URL and parameters does it request?
  context: Decode every argument on the browser command line. Identify the complete run.mocky or mockbin URL,
    any path and query parameters, the profile or user-data directory, and any flags that disable the GUI,
    sandbox, or first-run prompts. The URL path frequently encodes the specific staged payload to fetch or
    the endpoint that receives posted output, which determines whether this request is a download or an exfil POST.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this browser, and is that parent chain expected?
  context: The parent reveals how the headless browser was invoked. A user double-clicking a shortcut shows
    explorer.exe, while invocation from a script host, command shell, or a shortcut launcher such as a LNK
    handler points to scripted or lure-driven execution. Walk up the tree to see what spawned the parent and
    what else it started.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this browser spawn afterward?
  context: A headless browser fetching attacker-controlled content can lead to follow-on execution such as a
    command shell, script host, or a download-and-decode tool fetching a next stage. Unexpected children such
    as cmd.exe, powershell.exe, or certutil.exe spawned by the browser indicate that fetched content was acted on.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run this browser in headless mode?
  context: A browser that runs interactively every day may never run headless on this host. Zero or very low
    historical counts of this binary on this host indicate first-time or rare execution and raise the priority
    of the alert; a steady history suggests established automation or developer use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that
    activity, and does the current alert fit that pattern?
  context: This query mirrors the rule's full selection structure — browser image, --headless flag, and the
    run.mocky or mockbin URL — scoped to this host, so the resulting parent and user distribution reflects how
    this specific firing pattern has run here before, not generic browser usage. A new parent process, an
    unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
      selection_headless:
        CommandLine|contains: --headless
      selection_url:
        CommandLine|contains:
        - ://run.mocky
        - ://mockbin
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: This query mirrors the rule's full selection structure with no host scope, so the result is a
    fleet-wide count of headless browser requests to run.mocky or mockbin. Many hosts firing the same pattern
    points to scripted deployment or sanctioned automation; one host or a small unrelated set points to
    targeted, operator-driven activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
      selection_headless:
        CommandLine|contains: --headless
      selection_url:
        CommandLine|contains:
        - ://run.mocky
        - ://mockbin
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run this browser from the command line?
  context: Compare this user's current action against their historical behavior. A user who has never driven
    this browser from the command line is more suspicious than one who does so routinely. The user's role and
    typical toolset should align with headless browser automation if this is to be considered routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-browser combination historically routine on this host or across the environment,
    or is the parent unusual for this browser?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the
    meaningful pivot is the launch mechanism. Which parent process spawned this browser, and is that pair
    historically common here or across the environment. A new or rare parent for this browser is the deviation
    worth chasing; a pair that already accounts for many prior events is established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging spread across
    multiple endpoints. If the same user drove similar headless browser activity on more than one host, the
    scope of the activity may be larger than the single alerting endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-browser combination fire on other hosts in the same window, indicating a
    coordinated rollout rather than isolated activity?
  context: Under a service principal, pivoting on the user returns agent-telemetry noise from every host. The
    meaningful question is whether the same launch mechanism — parent process plus spawned browser — fired on
    other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation;
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context:
    what led to this browser execution, what happened after, and whether it is part of a larger sequence. Look
    for download tooling, script hosts, and persistence mechanisms appearing as novel parent-child pairs.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — a malicious shortcut launch, a download tool fetching content,
    or script-host execution — may reveal the stages that preceded this browser request and help reconstruct the
    timeline. Staging requests to mocking services usually sit in the middle of a chain, after initial access and
    before exfiltration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. This query surfaces direct attempts to disable AV/EDR
    services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful
    "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here.
    Populated rows shift the disposition toward operator preparation; review the parent process and signing chain
    to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
