name: REGISTER_APP.VBS Proxy Execution
id: 3803a320-16c2-49b6-b58b-992beb5a831f
description: |
  Detects use of the Microsoft-signed script register_app.vbs with the -register switch, which registers a DLL as a COM+ application via a VSS/VDS provider. Because register_app.vbs is signed and ships with the Windows SDK, it can proxy execution of an arbitrary DLL while inheriting the trust of a signed Microsoft binary. Legitimate use is rare and tied to provider development or SDK tooling; malicious use loads an attacker-supplied DLL under a trusted launcher. Investigation should identify which DLL and provider were registered, the parent that invoked the script, and whether the host or user normally performs this action.
type: detection
detection_id: 1c8774a0-44d4-4db0-91f8-e792359c70bd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain register_app.vbs together with the -register switch?
  context: Confirm the alert is a true positive by reviewing the full command line of the triggering event. The rule fires when both the register_app.vbs script path and the -register argument are present, indicating a DLL is being registered as a COM+ application. Note the DLL path, provider name, and provider description passed as the remaining arguments.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to register COM+ applications or VSS/VDS providers?
  context: Registering a provider DLL via register_app.vbs is a developer or SDK-tooling action, not routine administration. If the host is not a developer workstation or build system and the user does not own provider development, the activity is harder to explain as benign.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What DLL, provider name, and provider description were passed to register_app.vbs? Decode the full argument list.
  context: The arguments after -register name the provider, the DLL to register, and a description. The DLL path is the payload — read it to determine whether it points to a legitimate system provider or to an attacker-controlled file in a user-writable or temporary location. The script runs under cscript.exe or wscript.exe, so also note the interpreter.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - \register_app.vbs
        - -register
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned the script interpreter, and is that parent chain expected?
  context: The parent reveals how the script was launched. A user shell, a build tool, or an administrative console is consistent with intentional provider registration; an Office application, a script host launched from a download folder, or a remote-access tool points to proxy execution of an unsanctioned DLL.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.image_load
  question: What DLL did the registering process load on this host around the time of the alert, and is it signed?
  context: Registering a DLL as a COM+ application causes that DLL to be loaded into the registration process. Identifying the loaded module and its signing status distinguishes a benign Microsoft provider from an attacker-supplied payload. An unsigned or oddly-signed DLL loaded from a user-writable path is the proxy-execution payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_system:
        ImageLoaded|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
      condition: selection and not filter_system
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_process_tool.follow_on
  question: What child processes did the script interpreter spawn after it ran?
  context: A provider DLL that does more than register may spawn follow-on processes. Unexpected children such as cmd.exe, powershell.exe, or network utilities point to post-registration execution rather than a clean provider install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host run the register_app.vbs -register pattern before, and how often?
  context: Provider registration via this script is a rare, deliberate action. Zero or very low historical counts on this host indicate first-time or unusual execution; a steady history suggests an established developer or build workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - \register_app.vbs
        - -register
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the parent/user distribution reflects how the register_app.vbs -register pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \register_app.vbs
        - -register
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user run the register_app.vbs -register pattern before, on any host?
  context: Compare the user's current action against their history. A user who has never registered a provider DLL via this script is more suspicious than one who does so as part of a known development or build role. User role and typical toolset should align.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|all:
        - \register_app.vbs
        - -register
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent-plus-interpreter launch mechanism for this script historically routine on this host or across the environment, or is the parent unusual?
  context: When the alert fires under a service or computer account, user identity does not attribute behavior. The meaningful pivot is which parent process launched the script interpreter and whether that pair is historically common. A new or rare parent for this activity is the deviation; a pair that already accounts for many prior events is automation or tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|all:
        - \register_app.vbs
        - -register
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on multiple endpoints. If the same user triggered similar provider-registration or other suspicious activity elsewhere, the scope of the activity may be larger than one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent-plus-interpreter launch mechanism fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service or computer account, user-pivoted activity returns agent-telemetry noise. The meaningful question is whether the same launch mechanism fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|all:
        - \register_app.vbs
        - -register
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Proxy execution rarely stands alone. Activity surrounding the script run may reveal reconnaissance, credential access, persistence installation, or staging that gives broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the register_app.vbs -register pattern. Many hosts firing the same pattern points to scripted deployment or tooling; one host or a small unrelated set points to manual operator activity. Use the distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \register_app.vbs
        - -register
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
