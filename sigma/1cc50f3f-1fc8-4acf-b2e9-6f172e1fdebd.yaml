name: Suspicious Rundll32 Invoking Inline VBScript
id: 014749ea-bc30-47c0-a725-598d207beae6
description: |
  Detects rundll32.exe invoked with an inline VBScript command line that calls
  Execute, reads a value from the registry via RegRead, and terminates itself
  with window.close. rundll32.exe legitimately loads DLL exports, but it does
  not normally carry inline scripting on its command line, so this combination
  is a strong fit for a script-based loader that pulls a staged payload out of
  the registry, deobfuscates it in memory, and hands execution back to native
  code. The rule fires only when the command line contains all four tokens
  (rundll32.exe, Execute, RegRead, window.close) together. Investigation should
  decode the inline script to recover the registry path and payload it reads,
  identify the parent that launched it, and determine whether the loaded code
  went on to inject into or load a DLL inside another process.
type: detection
detection_id: 1cc50f3f-1fc8-4acf-b2e9-6f172e1fdebd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line carry inline VBScript that calls Execute, RegRead, and window.close through rundll32.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reading the full command line. All four
    tokens must be present together — rundll32.exe, Execute, RegRead, and window.close. RegRead pulls a value out of the registry,
    Execute runs it as script, and window.close terminates the host window once the payload is delivered. Confirm the inline
    script is genuinely present and not a benign string that happens to contain these words.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run rundll32.exe with an inline scripting payload?
  context: Legitimate administrative activity can trigger many detections. rundll32.exe is a normal Windows utility, but it
    is invoked here with an embedded VBScript payload, which is not a routine administrative pattern. Knowing whether the user
    role and host function involve any tooling that would legitimately call rundll32 with inline script helps separate a true
    positive from an unusual but sanctioned workflow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the inline VBScript actually do? Decode the registry path it reads and the payload it executes.
  context: The full command line reveals the specific action taken. Recover the registry value RegRead targets, since that is
    where the staged payload lives, and decode anything passed to Execute. Inline loaders of this pattern typically read an obfuscated
    blob from a registry sub-key, decode it in memory, and run it without ever touching disk, so the registry path is the pivot
    to the next stage. The scope is every matching invocation on this host within a few minutes, in case the loader runs in
    more than one step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - rundll32.exe
          - Execute
          - RegRead
          - window.close
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this rundll32 invocation, and is that parent chain expected?
  context: The parent process reveals how the inline script was launched. A loader of this kind is often started by a scripting
    host or a scheduled-task launcher rather than by direct user action, so an unusual parent such as mshta.exe, wscript.exe,
    a task host, or an Office application points toward automated or staged execution. Walk up the chain to see what spawned
    the parent and what else that parent launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host run rundll32 with this inline VBScript pattern before?
  context: A command-line pattern that has never been seen on a host is more suspicious than one that recurs. Because rundll32.exe
    runs constantly for legitimate DLL loads, the baseline is scoped to the rule's specific token combination rather than to
    rundll32 generally — zero or very low counts indicate first-time or rare execution of this loader pattern here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - rundll32.exe
          - Execute
          - RegRead
          - window.close
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this host — the resulting
    parent/user distribution reflects how the rule's specific firing pattern (not generic rundll32 usage) has historically
    run here. Deviations — a new parent process, an unexpected user account, an unusual command-line structure — are the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - rundll32.exe
        - Execute
        - RegRead
        - window.close
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this rundll32 invocation spawn afterward?
  context: The processes spawned after the loader runs reveal its actual impact. Script-based loaders commonly hand off to
    cmd.exe, powershell.exe, or another rundll32 to run the deobfuscated payload, or write and execute a second-stage file.
    Unexpected children in the minutes after the alert are the operational next stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1055.access_verification
  question: Did the rundll32 process open a handle into another process with memory-write or thread-creation rights shortly after firing?
  context: Process injection is verified by the access rights requested when one process opens another. Handle opens that carry
    write-to-memory or create-thread rights (for example PROCESS_VM_WRITE, PROCESS_VM_OPERATION, or PROCESS_CREATE_THREAD,
    masks such as 0x1F0FFF or 0x143A) are the signature of code being staged into a foreign process. If process-access telemetry
    is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing happened, and
    fall back to the child-process and image-load evidence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        SourceProcessGUID|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetImage
      - GrantedAccess
      - CallTrace
- source: attack:T1055.tuning_parameter
  question: Did any process on this host open or load code into a high-value target such as lsass.exe or explorer.exe around the alert time?
  context: Injection campaigns favor a small set of long-lived, high-privilege, or user-facing hosts to blend in — lsass.exe,
    explorer.exe, svchost.exe, and similar are the usual targets. A handle into one of these processes opened in the same window
    as the inline-VBScript loader connects the loader to a concrete injection target. Cross-reference the source process against
    the rundll32 invocation and its children.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith:
          - \lsass.exe
          - \explorer.exe
          - \svchost.exe
          - \winlogon.exe
      condition: selection
    fields:
      - SourceImage
      - TargetImage
      - GrantedAccess
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the loader?
  context: Attacks typically involve multiple tools in sequence. Activity surrounding the loader may reveal the scheduled task
    or scripting host that launched it, reconnaissance, persistence installation, or staging of the second-stage payload, all
    of which provide broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - rundll32.exe
        - Execute
        - RegRead
        - window.close
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - rundll32.exe
        - Execute
        - RegRead
        - window.close
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope of compromise may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - rundll32.exe
        - Execute
        - RegRead
        - window.close
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential
    access — may reveal the attack stages that preceded the loader and help reconstruct the full timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip
    Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal
    — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward
    operator preparation; review the parent process and signing chain to identify the writer. On non-Windows alerts this query
    returns 0 by construction.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
