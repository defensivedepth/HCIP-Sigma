    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mofcomp.exe
      - OriginalFileName: mofcomp.exe
      selection_case:
      - ParentImage|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wsl.exe
        - \wscript.exe
        - \cscript.exe
      - CommandLine|contains:
        - \AppData\Local\Temp
        - \Users\Public\
        - \WINDOWS\Temp\
        - '%temp%'
        - '%tmp%'
        - '%appdata%'
      filter_main_wmiprvse:
        ParentImage: C:\Windows\System32\wbem\WmiPrvSE.exe
        CommandLine|contains: C:\Windows\TEMP\
        CommandLine|endswith: .mof
      filter_optional_null_parent:
        CommandLine|contains: C:\Windows\TEMP\
        CommandLine|endswith: .mof
      _pb_scope:
