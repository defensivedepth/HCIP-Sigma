name: Potential Suspicious Mofcomp Execution
id: 4de50ba5-1be4-4260-aa0f-6de624385048
description: |
  Detects mofcomp.exe running in a suspicious context: spawned by a command shell or script interpreter (cmd.exe, powershell.exe, pwsh.exe, wsl.exe, wscript.exe, cscript.exe) AND a child of one of those shells, OR invoked with a user-writable path in its command line (\AppData\Local\Temp, \Users\Public\, \WINDOWS\Temp\, %temp%, %tmp%, %appdata%). Routine WMI-from-an-installer compilation under WmiPrvSE with a .mof file under C:\Windows\TEMP\ is filtered out. mofcomp is the Microsoft-signed WMI MOF compiler that parses a .mof file and writes its class and instance definitions into the WMI repository; it is the canonical primitive for installing WMI permanent event subscriptions (an __EventFilter, an ActiveScriptEventConsumer, and a __FilterToConsumerBinding) that re-execute a script on a recurring trigger and survive reboots. Because mofcomp is a trusted signed binary, this is proxy execution; the investigation should establish which .mof file was compiled, what subscription it installs, what script or shell launched it, and whether this fits a sanctioned WMI administration task or fileless persistence.
type: detection
detection_id: 1dd05363-104e-4b4a-b963-196a534b03a1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this alert show mofcomp.exe launched from a suspicious shell or with a user-writable path in its command line?
  context: >-
    Confirm the alert is a true positive by reviewing the exact process and command line against the rule's criteria. The binary is identified as mofcomp.exe by Image name or OriginalFileName, and at least one of two suspicious-context branches must hold: the parent is a command shell or script interpreter (cmd.exe, powershell.exe, pwsh.exe, wsl.exe, wscript.exe, cscript.exe), or the command line references a user-writable directory (\AppData\Local\Temp, \Users\Public\, \WINDOWS\Temp\, %temp%, %tmp%, %appdata%). Note which branch fired — a suspicious-shell parent points the investigation at the launching script, while a user-writable .mof path points it at the dropped file — because both downstream lines of inquiry hinge on it. Routine installer-driven compilation under WmiPrvSE with a .mof under C:\Windows\TEMP\ is filtered out and will not reach this alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to compile MOF files or perform WMI administration?
  context: >-
    Legitimate mofcomp use comes from software installers, management tooling, or administrators registering WMI classes, typically on servers or management stations. A compile run by a standard user account, from an interactive shell on an ordinary workstation, or by an account with no WMI-administration role is the deviation worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    WMI-based persistence is often staged alongside defense tampering. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: Which MOF file did mofcomp compile, and what switches were passed? Decode the full command line.
  context: >-
    The full command line names the .mof file written into the WMI repository and any switches that change its effect. Identify the .mof path — a file under a user-writable directory (\Users\Public\, %temp%, %appdata%) is a strong signal of an operator-dropped script rather than a vendor install. Note -autorecover (adds the MOF to the auto-rebuild list so it survives a WMI repository rebuild), -N:root\subscription or a #pragma namespace targeting root\subscription (the namespace where permanent event subscriptions live), and -class:/-instance: mode switches. The compiled MOF typically defines an __EventFilter, an ActiveScriptEventConsumer, and a __FilterToConsumerBinding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: llm_generated
  question: Does the compiled MOF install a WMI permanent event subscription, and does an unfamiliar subscription now exist in root\subscription?
  context: >-
    The investigation-relevant payload of a suspicious mofcomp run is what it wrote into the WMI repository. Retrieve and read the .mof file at the path identified from the command line; the persistence pattern is an __EventFilter (a WQL query that fires the trigger, often Win32_LocalTime polling or a logon/process-start event), an ActiveScriptEventConsumer carrying JScript or VBScript, and a __FilterToConsumerBinding linking them. The payload lives as a binary blob in the WMI repository rather than as a file on disk, so confirm by enumerating root\subscription for __EventFilter, __EventConsumer, and __FilterToConsumerBinding instances and comparing against a known-good baseline. An unfamiliar consumer whose script runs on a recurring trigger is fileless persistence. If WMI subscription enumeration is not available, treat the .mof contents from disk as the primary evidence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: Is this parent expected to spawn mofcomp, and what started the parent itself?
  context: >-
    The parent-child relationship is the core signal for this detection. A shell or script interpreter spawning mofcomp is unusual for routine WMI administration, which is normally driven by installers or management agents. Trace the parent's own origin — what spawned the cmd.exe, powershell.exe, wscript.exe, or wsl.exe that launched mofcomp — to tell a sanctioned administrative session from a scripted or hands-on-keyboard operation, such as a database service or remote-execution context dropping and compiling a MOF.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: >-
    If a shell or script interpreter dropped and compiled a MOF, it likely ran other commands too. Examining the exact parent instance's other children reveals the full scope of that session — reconnaissance, payload download, scheduled-task creation, or additional WMI tooling launched alongside the mofcomp call points to a multi-step operation rather than an isolated compile.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Does this parent process normally spawn mofcomp on this host?
  context: >-
    Some parent-child pairings are routine while others are inherently unusual. A command shell or script interpreter spawning mofcomp is rarely a recurring legitimate pattern on a workstation; installers and management agents are the usual parents for WMI compilation. Zero or very low historical counts for this specific parent-and-mofcomp pairing indicate a novel spawning relationship worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run mofcomp at all?
  context: >-
    Beyond the parent pairing, the frequency of mofcomp itself on this host calibrates the finding. WMI class registration recurs on some servers and management stations but is rare on ordinary endpoints. Zero or very low historical counts indicate first-time or rare execution, which raises the bar for treating this as sanctioned administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mofcomp.exe
      - OriginalFileName: mofcomp.exe
      selection_case:
      - ParentImage|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wsl.exe
        - \wscript.exe
        - \cscript.exe
      - CommandLine|contains:
        - \AppData\Local\Temp
        - \Users\Public\
        - \WINDOWS\Temp\
        - '%temp%'
        - '%tmp%'
        - '%appdata%'
      filter_main_wmiprvse:
        ParentImage: C:\Windows\System32\wbem\WmiPrvSE.exe
        CommandLine|contains: C:\Windows\TEMP\
        CommandLine|endswith: .mof
      filter_optional_null_parent:
        CommandLine|contains: C:\Windows\TEMP\
        CommandLine|endswith: .mof
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mofcomp.exe
      - OriginalFileName: mofcomp.exe
      selection_case:
      - ParentImage|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wsl.exe
        - \wscript.exe
        - \cscript.exe
      - CommandLine|contains:
        - \AppData\Local\Temp
        - \Users\Public\
        - \WINDOWS\Temp\
        - '%temp%'
        - '%tmp%'
        - '%appdata%'
      filter_main_wmiprvse:
        ParentImage: C:\Windows\System32\wbem\WmiPrvSE.exe
        CommandLine|contains: C:\Windows\TEMP\
        CommandLine|endswith: .mof
      filter_optional_null_parent:
        CommandLine|contains: C:\Windows\TEMP\
        CommandLine|endswith: .mof
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether this MOF compilation is isolated or part of broader movement. If the same user triggered related shell, scripting, or persistence activity on multiple endpoints in the same window, the scope of the operation may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
