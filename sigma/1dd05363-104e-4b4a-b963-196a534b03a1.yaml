      reason: >-
        The generic T1218 network analytic covers signed binaries that retrieve an externally-hosted
        payload over the network (e.g., regsvr32 /i:http scriptlets). mofcomp's proxy payload is a
        LOCAL .mof file compiled into the WMI repository; the binary itself makes no outbound
        retrieval as part of this rule's behavior. The investigation-relevant "payload" is the
        locally-installed WMI permanent event subscription, which Q5 covers directly. Authoring a
        network_connection question scoped to mofcomp's ProcessGuid would return 0 by construction
        and mislead the analyst. No compensating attack:T1218.network_connection question authored.
