        that side-load an attacker-controlled DLL. mofcomp.exe does not proxy execution through a
        loaded module — it parses a text .mof file and writes class/instance definitions into the
        WMI repository via the local WMI service. There is no attacker-supplied DLL entrypoint for
        this rule's behavior, so DLL-load telemetry on mofcomp.exe returns only its standard WMI
        module set and adds no triage precision. The command-line decode (Q4) and the resulting WMI
        subscription (Q5) carry the operational evidence. No compensating attack:T1218.image_load
        question authored.
