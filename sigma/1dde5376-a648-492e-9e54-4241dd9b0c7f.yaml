name: Diskshadow Script Mode - Uncommon Script Extension Execution
id: 1a0141f4-8471-483d-965f-5eb1a663f911
description: |
  Detects diskshadow.exe running in script mode (the windash -s flag) with a script file whose
  extension is not .txt. diskshadow.exe is a Microsoft-signed System32 binary that exposes Volume
  Shadow Copy Service functions through a scriptable interpreter; its exec sub-command launches an
  arbitrary local executable as a child of diskshadow.exe, and its expose sub-command mounts a shadow
  snapshot for raw reads of otherwise locked files. Script mode driven from an unusual extension is a
  known proxy-execution and recovery-inhibition pattern (script-driven exec of a payload, mounting a
  snapshot to copy NTDS.dit or registry hives, or delete shadows to block recovery). The rule fires
  when diskshadow.exe runs with -s AND the command line does not reference a .txt file; the
  investigation should confirm the script extension and command, read the script contents, and follow
  the process tree and any data movement the script drove.
type: detection
detection_id: 1dde5376-a648-492e-9e54-4241dd9b0c7f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did diskshadow.exe run in script mode with a non-.txt script file?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires
    when the process is diskshadow.exe (by Image or OriginalFileName), the command line carries the
    -s script-mode flag (windash-normalized, so -s, /s, and dash variants all match), and the command
    line does NOT reference a .txt file. Read which script file and extension were passed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run diskshadow.exe and manage Volume Shadow Copies?
  context: diskshadow.exe is a Windows Server administration tool that requires local Administrators
    membership for most operations. Routine usage is normally tied to backup software, a backup
    operator, or a known maintenance window. Its presence on a client workstation or under an
    unexpected account is a meaningful deviation. Confirm whether the user role and host function fit
    shadow-copy administration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the full diskshadow command line specify, and what script file and extension does
    it point to?
  context: The full command line names the script file passed to -s. Note the extension (anything other
    than .txt fired this rule) and the path. Script mode drives diskshadow sub-commands such as add /
    create (build a snapshot), expose (mount a snapshot as a drive letter for raw reads of NTDS.dit or
    registry hives), exec (launch an arbitrary local executable as a child of diskshadow.exe), and
    delete shadows (inhibit recovery). Retrieving and reading the script file itself is the decisive
    step — the command line shows only the launcher, not the actions inside the script.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:lolbin.renamed_binary_check
  question: Was diskshadow.exe executed from its expected System32 path?
  context: diskshadow.exe normally lives at %SystemRoot%\System32\diskshadow.exe. Execution from a
    user-writable or otherwise non-standard directory, or an Image/OriginalFileName mismatch, suggests
    the binary was copied or renamed to evade path-based allowlists. Compare the Image path against
    System32 and confirm OriginalFileName is diskshadow.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.process_chain
  question: What process spawned diskshadow.exe, and is that parent chain expected?
  context: The parent process reveals how diskshadow was invoked. Backup and maintenance usage usually
    has a predictable parent (a scheduled task host, a backup service, or an interactive admin shell).
    A parent such as cmd.exe or powershell.exe writing a script then launching diskshadow, or an Office
    application, browser, or scripting host, points to operator-driven or scripted abuse. Profile the
    parent-child relationship and walk further up the tree if the immediate parent is itself a shell.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did diskshadow.exe spawn afterward?
  context: The diskshadow exec sub-command launches an arbitrary local executable as a child of
    diskshadow.exe, and the parent stays alive until the child exits, so abuse shows up as
    diskshadow.exe spawning cmd.exe, powershell.exe, a copy of a hive or NTDS.dit, or an unfamiliar
    binary. Children that copy files out of a freshly exposed drive letter, or that perform staging or
    exfiltration, indicate the script did more than create a snapshot.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.network_retrieval
  question: Did diskshadow.exe or its child processes make outbound network connections around the
    alert?
  context: Proxy-execution through a signed binary sometimes pairs with retrieving a payload or staging
    data off-host, and a diskshadow script that exposes a shadow snapshot can feed a child process that
    copies hives or NTDS.dit to a remote share or external endpoint. Outbound connections from the
    diskshadow process tree to an unexpected destination shift the disposition toward data theft or
    payload retrieval; connections to known internal backup or enterprise destinations are routine.
    Compare any destination against the environment's allowed backup and management endpoints.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \diskshadow.exe
          - \cmd.exe
          - \powershell.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before
    the alert?
  context: Tampering and recovery inhibition often run together with shadow-copy abuse. The query
    surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions,
    clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel
    driver tampering and in-memory patches will not appear here. Populated rows shift the disposition
    toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this diskshadow script-mode pattern, what parents and
    users normally drive it, and does the current alert fit?
  context: Even legitimate backup tooling uses diskshadow scripts. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user distribution reflects how
    this specific firing pattern has historically run here — not generic diskshadow usage. A new parent
    process, an unexpected account, or an unfamiliar command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_flag:
        CommandLine|contains|windash: '-s '
      filter_main_ext:
        CommandLine|contains: .txt
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Shadow-copy abuse rarely happens alone. Activity surrounding the diskshadow execution may
    reveal reconnaissance, credential access, registry hive reads, staging, or recovery-inhibition
    commands that frame the diskshadow run as one stage of a broader operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_flag:
        CommandLine|contains|windash: '-s '
      filter_main_ext:
        CommandLine|contains: .txt
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_flag:
        CommandLine|contains|windash: '-s '
      filter_main_ext:
        CommandLine|contains: .txt
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar diskshadow or shadow-copy activity on more
    than one host, the scope may be larger than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_flag:
        CommandLine|contains|windash: '-s '
      filter_main_ext:
        CommandLine|contains: .txt
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the attack stages that preceded the diskshadow
    execution and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution or recovery-inhibition LOLBins used on this host recently?
  context: Operators who use one signed binary for proxy execution or shadow-copy tampering often use
    several. If diskshadow was used to expose a snapshot or delete shadows, check whether vssadmin,
    wmic, bcdedit, mshta, rundll32, or other signed binaries were also used for proxy execution or
    recovery inhibition in the same window. Multiple LOLBins performing the same objective strengthens
    the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\installutil.exe'
          - '\mavinject.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\wbadmin.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this diskshadow script-mode pattern over the past 90 days,
    and what command-line structures are typical?
  context: A diskshadow script-mode pattern with no prior history on a host is more suspicious than one
    that runs daily under a stable backup parent. The query mirrors the rule's selection structure
    scoped to this host, so the count reflects the rule's specific firing pattern, not generic
    diskshadow usage. The CommandLine projection lets the analyst compare typical script paths and
    extensions against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_flag:
        CommandLine|contains|windash: '-s '
      filter_main_ext:
        CommandLine|contains: .txt
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this diskshadow script-mode pattern in the past week, and does the
    cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firing pattern rather than generic diskshadow usage. Many hosts firing the
    same pattern points to scripted backup deployment or vendor automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent consistency
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_flag:
        CommandLine|contains|windash: '-s '
      filter_main_ext:
        CommandLine|contains: .txt
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1218
      name: System Binary Proxy Execution
      role: primary
  attack_chain_coverage:
    - stage: 1
      label: signed_binary_invocation
      description: "Trusted Microsoft-signed binary (diskshadow.exe) invoked in script mode with suspicious command-line parameters"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: command_parameter_decode
      description: "Decode the command-line parameters / script reference to understand what the proxied execution does"
      mapped_to: Q3
      source: template:cue_process_tool.mechanism_decode
    - stage: 3
      label: parent_child_profiling
      description: "Profile the unexpected parent-child relationship that launched the signed binary"
      mapped_to: Q5
      source: template:cue_process_tool.process_chain
    - stage: 4
      label: proxied_payload_execution
      description: "Signed binary executes payload via exec sub-command (child process) — proxied execution effect"
      mapped_to: Q6
      source: template:cue_process_tool.follow_on
    - stage: 5
      label: network_retrieval
      description: "Externally hosted payload retrieval or data staging via network from the signed-binary process tree"
      mapped_to: Q7
      source: attack:T1218.network_retrieval
  dimension_coverage:
    - dimension: command_analysis
      technique: T1218
      covered_by: Q3
      source: template:cue_process_tool.mechanism_decode
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1218
      covered_by: Q5
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1218
      covered_by: Q7
      source: attack:T1218.network_retrieval
      coverage_type: partial
  mutable_dispositions:
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (profiles unexpected parent-child relationships)"
      disposition: context
      target_question: Q5
      notes: "Drives the process_chain question (Q5) and the baseline_deviation/baseline_svc parent pivots (Q9, Q12, Q14)."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "rationale only — diskshadow.exe is itself the signed System32 LOLBin in scope"
      disposition: context
      target_question: Q4
      notes: "diskshadow.exe is the signed binary; renamed_binary_check (Q4) confirms it ran from the expected System32 path. The cross-LOLBin question (Q16) extends the signed-binary list to related proxy-execution/recovery-inhibition binaries."
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "rationale only (regex to match suspicious arguments / script paths)"
      disposition: context
      target_question: Q3
      notes: "Realized as the -s script-mode flag plus non-.txt extension already enforced by the reflected queries; mechanism_decode (Q3) reads the full command line and script path."
    - element: RemoteDomainAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only (suppress legitimate enterprise domains)"
      disposition: context
      target_question: Q7
      notes: "network_retrieval question (Q7) directs the analyst to compare outbound destinations against the environment's allowed backup/management endpoints."
  dedup_decisions:
    - dropped: cue_process_tool.baseline
      reason: "host-scoped generic-binary baseline subsumed by reflected baseline_deviation (rule-pattern scoped) and historical_lolbin_baseline (rule-pattern scoped, CommandLine projection)"
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_host_context.clustering
      reason: "host-around-alert clustering overlaps cue_process_tool.clustering (same host.name scope, +/-15m); process_tool.clustering kept"
      kept: cue_process_tool.clustering
    - dropped: ''
      reason: "user_actor pair — non-deduplicable (baseline + baseline_svc both emitted; clustering + clustering_svc both emitted)"
      kept: cue_user_actor.baseline / cue_user_actor.baseline_svc / cue_user_actor.clustering / cue_user_actor.clustering_svc
  skipped_templates: []
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1218) is not covered — pull in cue_image_load.* or author a custom question with category: image_load"
      disposition: declined
      reason: >-
        diskshadow's proxy-execution primitive is the script-driven exec
        sub-command, which spawns a child PROCESS (captured by the follow_on
        question, Q6, via process_creation) and the expose sub-command, which
        mounts a snapshot for file reads — neither is a DLL/module load event.
        diskshadow.exe is not a host for in-process .NET or reflective DLL
        execution the way rundll32/regsvr32 are, so image_load on diskshadow.exe
        returns its normal VSS provider DLLs without precision for this abuse
        pattern. No compensating attack:T1218.image_load question authored;
        process-tree and network coverage (Q6, Q7) answer the proxy-execution
        chain for this binary.
  contextual_sets:
    included: []
    excluded:
      - id: ransomware_impact
        confidence: low
        reason: >-
          References mention ransomware using diskshadow to delete shadows, but
          this rule fires on script-mode execution from an uncommon extension —
          a generic proxy-execution signal, not an impact/encryption signal. The
          recovery-inhibition angle is covered behaviorally by mechanism_decode
          (Q3, reads delete-shadows from the script) and the LOLBin objective
          question (Q16, vssadmin/bcdedit/wbadmin), without importing the full
          ransomware_impact set whose encryption/ransom-note questions do not
          fit what this rule detects.
      - id: network_scope
        confidence: low
        reason: >-
          Network relevance is real (T1218 network-retrieval hint) but is
          covered by a single targeted attack:T1218.network_retrieval question
          (Q7) scoped to the diskshadow process tree, rather than the broader
          network_scope set whose DNS/beaconing questions assume a
          network-centric rule. Importing the full set would add low-signal
