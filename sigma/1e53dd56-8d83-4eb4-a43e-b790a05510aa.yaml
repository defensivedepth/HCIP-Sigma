      coverage_type: direct
  mutable_dispositions:
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "~tens of seconds between policy/elevation and follow-on activity"
      disposition: context
      target_question: Q10
      notes: "Folded the tight-window correlation guidance into elevated_action_after_bypass context (KEEP_EXACT query unchanged). The registry_set (Q8) and process_creation policy-write (Q9) queries bracket the bypass setup in the -7d / -15m windows."
    - element: ElevatedProcessNameList
      dimension: tuning_parameter
      specific_values: "rationale only for this rule — the auto-elevate proxy this rule keys on is the MSIxxxx.tmp installer temp binary, not the eventvwr/sdclt/computerdefaults proxy list"
      disposition: context
      target_question: Q1
      notes: "The generic auto-elevate-proxy list does not apply: AlwaysInstallElevated elevates via the installer policy, not an auto-elevated COM/shell proxy. verify_trigger_match (Q1) and parent_process_legitimacy (Q3) name the installer-temp-binary proxy this rule actually fires on."
    - element: ParentProcessAnomalyThreshold
      dimension: parent_process_analysis
      specific_values: "rationale only (non-elevated context spawning an elevated process via the installer)"
      disposition: context
      target_question: Q3
      notes: "parent_process_legitimacy (Q3) traces what started the installer temp binary and whether a real install was underway — the parent-anomaly logic this element describes; cue_parent_process.baseline (Q13) quantifies how rare the installer-spawns-shell pair is on the host."
    - element: ElevatedProcessPath
      dimension: tuning_parameter
      specific_values: "rationale only (paths for unsigned/unexpected elevated binaries) — T1548 secondary element"
      disposition: context
      target_question: Q5
      notes: "mechanism_decode (Q5) records the spawned shell's Image and working directory; elevated_action_after_bypass (Q10) enumerates the High/System integrity processes and their paths that follow."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (suspicious parent-child chains) — T1548 secondary element"
      disposition: context
      target_question: Q3
      notes: "Same coverage as ParentProcessAnomalyThreshold — parent_process_legitimacy (Q3) and cue_parent_process.baseline (Q13) characterize the installer-temp-binary -> interpreter chain."
  dedup_decisions:
    - dropped: cue_parent_process.mechanism_decode
      reason: "parent_child technique set active — parent_process_legitimacy is the more specific parent lookup (per AGENTS.md dedup rule)"
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.follow_on
      reason: "near-duplicate of parent_child.sibling_processes (children of the same parent); sibling_processes scopes by exact ParentProcessGuid instance"
      kept: parent_child.sibling_processes
    - dropped: cue_parent_process.clustering
      reason: "near-duplicate of cue_host_context.clustering and parent_child.sibling_processes — host-scoped parent activity is already covered by sibling_processes (exact instance) and host clustering"
      kept: cue_host_context.clustering
    - dropped: cue_parent_process.scope
      reason: "near-identical query to cue_user_actor.clustering_svc (process.parent.name + Image|endswith, cross-host aggregation by host.name); clustering_svc is a mandatory service-principal pair"
      kept: cue_user_actor.clustering_svc
    - dropped: cue_process_tool.baseline
      reason: "cmd/powershell/pwsh run constantly on most hosts, so a binary-only host baseline does not discriminate; the discriminating baseline is the installer-spawns-interpreter pair"
      kept: cue_parent_process.baseline
    - dropped: cue_host_context.precursor
      reason: "near-duplicate of uac_bypass.other_escalation_attempts (both query event.module:sigma host-scoped); other_escalation_attempts is must_include and escalation-framed"
      kept: uac_bypass.other_escalation_attempts
    - dropped: powershell.powershell_security_bypass
      reason: "its indicators (Set-MpPreference, AMSI bypass, -ExecutionPolicy Bypass, downgrade) are a strict subset of universal.endpoint_protection_health (Q12), which scans the same host over a comparable window for the same tamper/bypass commands plus more; dropped to land at 18 questions without losing the bypass-precursor signal"
      kept: universal.endpoint_protection_health
    - dropped: cue_user_actor.baseline / cue_user_actor.baseline_svc / cue_user_actor.clustering / cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both user-pivot and service-principal-substitute variants emitted per AGENTS.md"
      kept: all four (Q14-Q17)
  skipped_templates:
    - template: cue_process_tool.process_chain
      reason: "hint: parent_process is primary — drop cue_process_tool:process_chain; the parent lookup is covered by parent_child.parent_process_legitimacy (Q3)"
  reflection_overrides: []
  hint_dispositions:
    - hint: "cmd.exe: too common for Image-based scoping — use CommandLine patterns for mechanism_decode"
      disposition: acted_on
      reason: >-
        commandline_values is empty for this rule (no rule-specific CommandLine pattern to
        filter on), so mechanism_decode (Q5) is scoped to the exact triggering ProcessGuid
        rather than host+Image|endswith — avoiding the cmd/powershell host-volume noise the
        hint warns about, per the template's fallback instruction.
    - hint: "powershell.encoded_command_decode replaces obfuscation.encoded_payload_decode"
      disposition: acted_on
      reason: >-
        powershell.encoded_command_decode (Q6) is included as the encoding/obfuscation
        decode question; no obfuscation.encoded_payload_decode template was emitted.
    - hint: "parent_process is primary — drop cue_process_tool:process_chain"
      disposition: acted_on
      reason: >-
        cue_process_tool.process_chain dropped; parent_child.parent_process_legitimacy (Q3)
        is the more specific parent lookup. Recorded in skipped_templates.
    - hint: "logsource 'registry_set' (recommended by techniques: T1548.002) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: acted_on
      reason: >-
        Authored attack:T1548.002.registry_set (Q8), a category: registry_set question that
        confirms whether the AlwaysInstallElevated policy keys under the Windows Installer
        policy path are set — the registry condition this entire bypass depends on, including
        programmatic writes a process_creation view misses.
    - hint: "logsource 'image_load' (recommended by techniques: T1548.002) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        This rule's bypass is policy-driven (AlwaysInstallElevated lets msiexec run package
        custom actions as SYSTEM, which then spawns a shell). It is not a DLL search-order
        hijack, so there is no planted-module artifact for an image_load question to surface.
        image_load on cmd/powershell/pwsh returns the normal interpreter module set as volume
        without discriminating this mechanism; the bypass setup is covered by the
        registry_set (Q8) and process_creation policy-write (Q9) questions.
    - hint: "logsource 'process_access' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        This bypass does not obtain its token by opening a handle into an already-elevated
        process. msiexec is granted SYSTEM by the AlwaysInstallElevated policy directly, so
        there is no cross-process handle-open (Sysmon EID10) artifact that process_access
        surfaces. A handle-open query would add volume without discriminating this rule's
        mechanism; the actual setup is covered by the registry_set question (Q8).
    - hint: "logsource 'security' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The 'security' analytic keys on EID 4672 (special privileges assigned to a new logon),
        which marks the elevation event itself. That elevation IS the rule's effect — the
        High/System integrity shell the rule fires on corresponds to the same token assignment,
        and IntegrityLevel is already projected in verify_trigger_match (Q1) and
        elevated_action_after_bypass (Q10). A separate 4672 query would re-surface the
        elevation without adding investigative discrimination.
  contextual_sets:
    included: []
    excluded: []
  technique_sets_applied:
