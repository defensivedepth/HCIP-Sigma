      coverage_type: direct
    - dimension: time_correlation
      technique: T1548.002
      covered_by: Q10
      source: template:uac_bypass.elevated_action_after_bypass
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1548.002
      covered_by: Q8
      source: attack:T1548.002.registry_set
      coverage_type: direct
    - dimension: user_context
      technique: T1548
      covered_by: Q14
