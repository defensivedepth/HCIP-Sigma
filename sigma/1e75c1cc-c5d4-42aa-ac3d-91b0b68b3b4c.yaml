        T1218's image_load analytic targets the DLL-load proxy variants of the
        technique (rundll32/regsvr32 loading an attacker DLL). This rule fires
        specifically on squirrel.exe/update.exe with --download/--update/--updateRollback=
        and an http URL — a download/ingress and child-process proxy primitive,
        not a DLL-load proxy. Squirrel proxies execution by fetching a NuGet
        package and spawning a child process (becoming its parent), never by
        loading a DLL into itself, so image_load events on this binary return
        normal updater module-load volume without precision for the abuse. The
        proxied-execution angle is instead covered by the follow_on child-process
