name: PowerShell Defender Threat Severity Default Action Set to 'Allow' or 'NoAction'
id: 38fbd34a-8be0-4dea-8778-557cb768b3f0
description: |
  Detects a PowerShell command line that runs Set-MpPreference to set a Microsoft Defender per-severity threat default action
  to 'Allow' (value 6) or 'NoAction' (value 9). The rule fires only when all three conditions match: the Set-MpPreference
  cmdlet is present, a threat-action switch (-LowThreatDefaultAction, -ModerateThreatDefaultAction, -HighThreatDefaultAction,
  -SevereThreatDefaultAction, or their short -ltdefac/-mtdefac/-htdefac/-stdefac aliases) is supplied, and the action value
  is Allow/6 or NoAction/9. This change tells Defender to stop automatically mitigating threats of a given severity without
  flipping the louder "real-time protection disabled" state, so detections still register but nothing is acted on. Legitimate
  hardening or AV-replacement deployments occasionally set these values, so the investigation should confirm who made the
  change, which severity tier was downgraded, whether the control is still weakened, and what ran on the host afterward.
type: detection
detection_id: 1e8a9b4d-3c2a-4f9b-8d1e-7c6a5b4f3d2e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain Set-MpPreference, a threat-action switch, and an Allow or NoAction value together?
  context: Confirm the alert is a true positive before investing time. The rule fires only when all three are present together —
    the Set-MpPreference cmdlet, a severity switch (-LowThreatDefaultAction / -ModerateThreatDefaultAction / -HighThreatDefaultAction
    / -SevereThreatDefaultAction or the -ltdefac / -mtdefac / -htdefac / -stdefac aliases), and an action value of Allow, 6,
    NoAction, or 9. Read the full command line and verify all three elements line up; a partial match suggests a malformed
    alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to reconfigure Microsoft Defender threat-action settings?
  context: Changing per-severity default actions is an administrative operation normally limited to endpoint security tooling
    or a small set of operators. If the account is a standard user, a service principal, or an interactive session that does
    not own Defender policy, the change is far more likely to be operator preparation than sanctioned hardening. Confirm the
    role of the user and the function of the host against the change observed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which severity tier was downgraded, and to Allow or NoAction?
  context: The specific switch and value determine the impact. -SevereThreatDefaultAction or -HighThreatDefaultAction set to
    Allow (6) or NoAction (9) tells Defender to stop mitigating the most dangerous detections while leaving the service visibly
    running, so payloads execute without the louder protection-disabled signal. Parse the alerting command line to identify
    exactly which tier was changed and whether further switches (exclusions, real-time monitoring, MAPS reporting) appear in
    the same invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: Was the Set-MpPreference call encoded, obfuscated, or chained with other commands, and what does it decode to?
  context: The same cmdlet is often delivered inside an encoded or concatenated PowerShell one-liner so the threat-action change
    is not visible in plain text. Check the alerting command line for -EncodedCommand / -enc base64, backtick or caret escaping,
    string concatenation, or semicolon-chained statements, and decode them. The decoded content may reveal additional tampering
    switches, a download cradle, or in-memory execution staged alongside the Defender change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.powershell_security_bypass
  question: Were other PowerShell or Defender controls weakened on this host in the hour before the alert?
  context: Operators commonly stack defense changes — disabling real-time monitoring, adding scan exclusions, or bypassing
    AMSI and execution policy — in the same session that downgrades threat actions. Finding these precursor events on the host
    strengthens the case that the threat-action change was deliberate operator preparation rather than an isolated hardening
    step.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - 'Add-MpPreference -Exclusion'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full content of the Set-MpPreference invocation?
  context: Script block logging records the deobfuscated script content PowerShell actually executed, even when the command
    line was encoded or built at runtime. It provides ground truth for the threat-action change and any additional statements
    in the same script. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility
    gap rather than evidence nothing ran, and fall back to decoding the alerting command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:defense_tampering.protection_status
  question: Is the threat-action setting still downgraded, or has it been restored to a mitigating value?
  context: The change may be temporary cover for a specific action or a persistent weakening. Check the current per-severity
    default action on the host — through endpoint management, the Defender configuration, or direct inspection of the policy
    value. If the tier is still set to Allow or NoAction, the host remains unable to auto-mitigate threats at that severity
    and the setting should be restored before further investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What ran on this host after the threat-action default was downgraded?
  context: Defenses are weakened to enable something — payload execution, credential access, or staging that would otherwise
    be auto-mitigated. Examine process activity in the window immediately after the change to find what the downgrade was meant
    to let run. Correlate any new or unusual processes with network connections and file writes in the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host around the same time?
  context: An operator who downgrades threat actions often disables several controls together — clearing logs, deleting shadow
    copies, disabling recovery, or stopping security services — to maximize coverage. Multiple tampering events from the same
    user or parent process in the same window indicate a deliberate, multi-control operation rather than a single hardening
    change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: attack:T1562.001.registry_persist
  question: Did a corresponding write to the Defender ThreatSeverityDefaultAction registry key land on this host?
  context: Set-MpPreference persists the per-severity default action to the registry under the Windows Defender Threats key.
    A registry-set event confirms the change actually took effect rather than failing on a permissions or tamper-protection
    boundary, and it captures the same downgrade even when it is applied through a tool other than the alerting command line.
    The value data records which action (Allow/6 or NoAction/9) was written.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Windows Defender\Threats\ThreatSeverityDefaultAction'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - ProcessGuid
- source: template:cue_process_tool.process_chain
  question: What process spawned the PowerShell that made this change, and is that parent chain expected?
  context: The parent reveals how the change was invoked. An interactive shell launched by explorer.exe under an administrator
    fits routine hardening; powershell.exe spawned by mshta.exe, wscript.exe, an Office application, or an unexpected service
    points to scripted or exploited execution. Walk up the chain to see what launched the parent and what else it spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this Set-MpPreference threat-action pattern, what parents and users drove it,
    and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects
    how this specific threat-action-downgrade pattern has run here historically — not generic PowerShell usage. A new parent
    process, an unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmdlet:
        CommandLine|contains: Set-MpPreference
      selection_action:
        CommandLine|contains:
        - -LowThreatDefaultAction
        - -ModerateThreatDefaultAction
        - -HighThreatDefaultAction
        - -SevereThreatDefaultAction
        - '-ltdefac '
        - '-mtdefac '
        - '-htdefac '
        - '-stdefac '
      selection_value:
        CommandLine|contains:
        - Allow
        - '6'
        - NoAction
        - '9'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this Set-MpPreference threat-action pattern in the past week, and does the spread look like
    automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this exact threat-action-downgrade
    pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to a scripted hardening or AV-replacement
    rollout; one host or a small unrelated set points to manual operator activity. Use the host spread and parent consistency
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmdlet:
        CommandLine|contains: Set-MpPreference
      selection_action:
        CommandLine|contains:
        - -LowThreatDefaultAction
        - -ModerateThreatDefaultAction
        - -HighThreatDefaultAction
        - -SevereThreatDefaultAction
        - '-ltdefac '
        - '-mtdefac '
        - '-htdefac '
        - '-stdefac '
      selection_value:
        CommandLine|contains:
        - Allow
        - '6'
        - NoAction
        - '9'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmdlet:
        CommandLine|contains: Set-MpPreference
      selection_action:
        CommandLine|contains:
        - -LowThreatDefaultAction
        - -ModerateThreatDefaultAction
        - -HighThreatDefaultAction
        - -SevereThreatDefaultAction
        - '-ltdefac '
        - '-mtdefac '
        - '-htdefac '
        - '-stdefac '
      selection_value:
        CommandLine|contains:
        - Allow
        - '6'
        - NoAction
        - '9'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmdlet:
        CommandLine|contains: Set-MpPreference
      selection_action:
        CommandLine|contains:
        - -LowThreatDefaultAction
        - -ModerateThreatDefaultAction
        - -HighThreatDefaultAction
        - -SevereThreatDefaultAction
        - '-ltdefac '
        - '-mtdefac '
        - '-htdefac '
        - '-stdefac '
      selection_value:
        CommandLine|contains:
        - Allow
        - '6'
        - NoAction
        - '9'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the account's activity across all hosts in the alert window reveals whether the Defender change is isolated
    or part of broader hands-on-keyboard activity spanning multiple endpoints. The same user weakening protection on several
    hosts widens the likely scope of the operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmdlet:
        CommandLine|contains: Set-MpPreference
      selection_action:
        CommandLine|contains:
        - -LowThreatDefaultAction
        - -ModerateThreatDefaultAction
        - -HighThreatDefaultAction
        - -SevereThreatDefaultAction
        - '-ltdefac '
        - '-mtdefac '
        - '-htdefac '
        - '-stdefac '
      selection_value:
        CommandLine|contains:
        - Allow
        - '6'
        - NoAction
        - '9'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or other
    defense tampering — may reveal the stages that preceded the threat-action change and help reconstruct the timeline that
    led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
