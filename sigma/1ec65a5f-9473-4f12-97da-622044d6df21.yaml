- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of this alert?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or coordinated action on multiple endpoints. If the same user disabled Defender or ran other tooling on several hosts close together, the scope of the operation may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
