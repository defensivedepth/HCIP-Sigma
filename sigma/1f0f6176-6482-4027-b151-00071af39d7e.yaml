name: Arbitrary File Download Via ConfigSecurityPolicy.EXE
id: 2a10c39a-12d5-4ab3-9bbe-8e553467b28c
description: |
  Detects ConfigSecurityPolicy.exe, a Microsoft-signed Windows Defender management binary, running with a
  ftp, http, or https URL on its command line. The rule fires only when both conditions hold: the
  process is ConfigSecurityPolicy.exe (by Image path, CommandLine reference, or OriginalFileName) AND a URL
  appears in the command line. The binary exposes two abusable primitives: invoked with a local file path plus
  a URL it uploads that file's contents to the URL (exfiltration), and invoked with just a URL it fetches a
  remote payload into the user's INetCache directory (ingress download). Legitimate Defender management runs in
  a service context and does not reach arbitrary internet hosts, so investigate the user context, the
  destination, the file involved, and what ran before and after.
type: detection
detection_id: 1f0f6176-6482-4027-b151-00071af39d7e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show ConfigSecurityPolicy.exe running with a ftp/http/https URL?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    the process is ConfigSecurityPolicy.exe (by Image path, command-line reference, or OriginalFileName) and a
    ftp, http, or https URL is present on the command line. Confirm both halves are present and read
    the URL and any local file path, which together distinguish an upload invocation from a download invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a Defender management binary against an internet URL?
  context: Legitimate ConfigSecurityPolicy.exe invocation runs in a service context and manages local Defender
    or co-management settings, not arbitrary internet hosts. A normal interactive user account launching it with
    a URL is the deviation worth confirming. Knowing whether this account and host function are consistent with
    Defender administration is often the fastest path to separating a true positive from routine operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did ConfigSecurityPolicy.exe do? Decode the full command line and determine upload
    versus download.
  context: The full command line reveals the operation. A local file path followed by a URL means the file's
    contents were uploaded to that URL; a URL with no preceding local file path means a remote payload was
    fetched into the user's INetCache directory. Identify the exact URL, any local file path, and the working
    directory so you know whether data left the host or arrived on it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_network_endpoint.mechanism_decode
  question: What is the destination URL on the command line, and what do DNS, WHOIS, and threat intel reveal
    about it?
  context: Investigate the host extracted from the command-line URL through DNS resolution history,
    registration age, TLS certificate details, and known threat intelligence. Recently registered domains,
    self-signed certificates, raw IP destinations, or known infrastructure point to attacker-controlled
    endpoints. Defender management traffic does not legitimately reach arbitrary external hosts, so any
    non-corporate destination is significant. Outbound egress to non-RFC1918 addresses from this binary is a
    documented detection signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.process_chain
  question: What process spawned ConfigSecurityPolicy.exe, and is that parent chain expected?
  context: Legitimate Defender management is launched in a service context by Windows components. An interactive
    parent such as a shell, script host, Office application, or remote-access tool indicates the binary was
    driven by an operator rather than the platform. Identify the immediate parent and what spawned it to
    reconstruct how the invocation originated.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:data_staging_exfil.data_scope
  question: What local file was selected for upload, and how sensitive is it?
  context: For the upload primitive, the local file path on the command line is the data that left the host.
    Identify the specific file or directory targeted (credentials, documents, source code, configuration) to
    determine the severity of potential data loss and which business units need to be notified. If only a URL is
    present with no local file path, this was a download rather than an upload and no local file was staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:data_staging_exfil.encryption_password
  question: Does the command line or its artifacts show obfuscation, such as writing to an alternate data
    stream?
  context: This binary is documented as capable of storing data into alternate data streams, which hides
    content from tools inspecting normal file paths. Re-read the triggering command line for a stream-qualified
    path (a colon-suffixed target) or other indirection that conceals what was transferred. Concealment around an
    exfiltration primitive is a stronger indicator of deliberate misuse than a plain transfer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:data_staging_exfil.archive_destination
  question: What file did the binary write afterward, and where did it land?
  context: For the download primitive, the fetched payload is dropped under the current user's INetCache
    directory. Check for files written by this binary to locate the downloaded payload, then determine whether
    it was subsequently moved, copied, or executed. For the upload primitive, pivot to outbound network
    connections from the same host in the same window to confirm the data transfer path.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_network_endpoint.baseline
  question: Does this host normally communicate with this destination?
  context: First-time connections to a destination are more suspicious than routine communication. A baseline
    over the historical aggregation window distinguishes new infrastructure from regular business traffic; zero
    or very low prior counts to this destination indicate a new or unusual endpoint for this host. Calibrate the
    aggregation period and any baselined web-service allowlist (cloud storage providers such as common file-share
    services) to this environment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- source: template:cue_process_tool.baseline
  question: Does this host normally run ConfigSecurityPolicy.exe?
  context: ConfigSecurityPolicy.exe is a platform binary, so it may appear in service-context maintenance, but
    invocation with an internet URL should be rare or unseen. A 90-day frequency for this binary on the host
    establishes whether any execution is routine; pair that count with the user and parent context, since the
    URL-bearing invocation is the part that matters, not the binary alone.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that
    activity, and does the current alert fit that pattern?
  context: Even a platform binary can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how the rule's specific firing pattern (the
    binary running with a URL), not generic Defender maintenance, has historically run here. A new parent
    process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - CommandLine|contains: ConfigSecurityPolicy.exe
      - Image|endswith: \ConfigSecurityPolicy.exe
      - OriginalFileName: ConfigSecurityPolicy.exe
      selection_url:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - CommandLine|contains: ConfigSecurityPolicy.exe
      - Image|endswith: \ConfigSecurityPolicy.exe
      - OriginalFileName: ConfigSecurityPolicy.exe
      selection_url:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - CommandLine|contains: ConfigSecurityPolicy.exe
      - Image|endswith: \ConfigSecurityPolicy.exe
      - OriginalFileName: ConfigSecurityPolicy.exe
      selection_url:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user drove similar activity on several hosts in the window, the scope of potential
    data movement is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - CommandLine|contains: ConfigSecurityPolicy.exe
      - Image|endswith: \ConfigSecurityPolicy.exe
      - OriginalFileName: ConfigSecurityPolicy.exe
      selection_url:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.follow_on
  question: What child processes did ConfigSecurityPolicy.exe spawn afterward?
  context: A download into INetCache is only the staging step; the impact comes from what runs the fetched
    payload. Children such as cmd.exe, powershell.exe, wscript.exe, or a freshly dropped binary indicate
    post-download execution. Legitimate Defender management has predictable, narrow children, so unexpected
    spawns reframe the alert from a transfer to active execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the rule's firing pattern (the binary running with a URL), not generic usage of the binary. Many
    hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - CommandLine|contains: ConfigSecurityPolicy.exe
      - Image|endswith: \ConfigSecurityPolicy.exe
      - OriginalFileName: ConfigSecurityPolicy.exe
      selection_url:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering,
    reconnaissance, or credential access, may reveal the stages that preceded a transfer and help reconstruct the
    timeline. Exfiltration and ingress transfers commonly follow earlier hands-on activity, so a prior-alert
    sweep can place this event in a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
