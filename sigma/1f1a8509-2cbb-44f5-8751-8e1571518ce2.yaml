name: Suspicious Splwow64 Without Params
id: 486bc86c-2f89-4e76-be03-862d5fa54307
description: |
  Detects splwow64.exe launched with no command-line parameters (the command line ends in the bare image name).
  Legitimately, splwow64.exe is spawned by 32-bit Microsoft Office or printer-driver processes and carries arguments
  describing the print/driver bridge it brokers; an invocation with zero arguments is anomalous and is consistent with a
  masquerading or process-injection target standing in for indirect command execution. Investigation should confirm the
  parent is an expected Office/print host, examine what the process did afterward (child processes, outbound connections,
  file activity), and determine whether the user, host, and parent chain match historical baselines.
type: detection
detection_id: 1f1a8509-2cbb-44f5-8751-8e1571518ce2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did splwow64.exe run with no command-line parameters, as this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line.
    The rule fires when the Image ends in splwow64.exe and the CommandLine ends in the bare splwow64.exe with no trailing
    arguments. A legitimate invocation normally carries arguments describing the print/driver bridge being brokered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to be running 32-bit print or Office workloads that spawn splwow64.exe?
  context: splwow64.exe is the WOW64 print/driver host invoked by 32-bit Office and printing components. A user or host with
    no 32-bit Office footprint or no printing role producing this process is a stronger signal than a workstation where Office
    printing is routine. Knowing the host function is often the fastest path to distinguishing routine activity from abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this splwow64.exe, and is that parent an expected Office or print host?
  context: splwow64.exe is an expected child of 32-bit Microsoft Office processes and printing components. A parent such as
    winword.exe, excel.exe, or a spooler component fits the normal pattern; parents like cmd.exe, powershell.exe, wscript.exe,
    mshta.exe, or an unsigned binary suggest the process was launched as a masquerading or injection target rather than to
    broker a print job.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1202.network_execution
  question: Did this splwow64.exe instance open any outbound network connections?
  context: Indirect command execution often uses a benign-looking host process to reach the network. splwow64.exe brokering
    a print job has no reason to initiate outbound connections; connections attributed to this instance — especially to
    external addresses outside known-good egress networks — point to the process being used as a network conduit rather than
    for printing.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- source: template:cue_process_tool.follow_on
  question: What child processes did this splwow64.exe spawn afterward?
  context: A no-parameter splwow64.exe used for indirect execution typically launches a secondary program. Child images such
    as powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe, curl.exe, or bitsadmin.exe are high-risk
    follow-on indicators; a genuine print-bridge invocation spawns no such children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1202.file_access
  question: What files did this splwow64.exe instance write or touch around the time of the alert?
  context: Indirect execution chains often stage a payload, script, or configuration file on disk. File activity attributed
    to this process — dropped executables, scripts, or modifications under user-writable directories — shows whether the
    process acted as a stager. A legitimate print bridge does not write payload files.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline
  question: Does this host normally run splwow64.exe with no parameters?
  context: A process invocation never seen on a host is more suspicious than one that recurs. splwow64.exe firing this rule's
    pattern with zero historical occurrences indicates first-time or rare behavior; a steady prior count suggests an existing
    workflow worth confirming.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the
    current alert fit?
  context: Even an expected binary can be abused. The query mirrors the rule's selection scoped to this host, so the resulting
    parent/user distribution reflects how this specific no-parameter firing pattern has historically run here. A new parent
    process, an unexpected user account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \splwow64.exe
        CommandLine|endswith: splwow64.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Indirect execution rarely happens in isolation. Activity surrounding the alerting process may reveal reconnaissance,
    privilege escalation, persistence installation, or data staging that provides broader context for whether this splwow64.exe
    invocation was part of a sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation
    or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this no-parameter
    splwow64.exe pattern rather than generic usage of the binary. Many hosts firing the same pattern points to a common driver
    or deployment artifact; one host or a small unrelated set points to manual operator activity. Use the distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \splwow64.exe
        CommandLine|endswith: splwow64.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \splwow64.exe
        CommandLine|endswith: splwow64.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \splwow64.exe
        CommandLine|endswith: splwow64.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \splwow64.exe
        CommandLine|endswith: splwow64.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation,
    or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
