name: Greedy File Deletion Using Del
id: 78c86010-975b-40ab-93d6-e16e64af6226
description: |
  Detects cmd.exe running the built-in del or erase command with wildcard expressions that target multiple file types
  (script, library, executable, and AutoIt extensions) in one sweep. Bulk wildcard deletion is a routine part of installer
  cleanup and build scripts, but it is also how malware removes its own dropped payloads and staging artifacts to destroy
  evidence after execution. The rule fires only when all three conditions hold together: the process is cmd.exe, the command
  line contains del or erase, AND it references wildcard patterns for one of the watched extensions. Investigation should
  determine which files were targeted, what process drove the deletion, and what activity preceded it that the cleanup may
  have been meant to hide.
type: detection
detection_id: 204b17ae-4007-471b-917b-b917b315c5db
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-05'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show cmd.exe running del or erase against wildcard file patterns?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process
    is cmd.exe AND the command line contains 'del ' or 'erase ' AND it references a wildcard pattern for one of the watched
    extensions (.au3, .dll, .exe, .js). Review the exact command line to confirm all three conditions are present and note
    which extensions and directory the deletion targeted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to bulk-delete files via the command line?
  context: Legitimate installers, uninstallers, and build or maintenance scripts routinely sweep directories with del or erase.
    Knowing whether the user role and host function (developer workstation, build agent, file server) are consistent with
    scripted cleanup is often the fastest path to distinguishing routine operations from evidence destruction.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which files and directories did the deletion command target?
  context: The full command line reveals what the cleanup was meant to remove. Identify the directory path and the specific
    wildcard extensions deleted (.au3, .dll, .exe, .js). Deletion confined to a temp, download, or user-writable staging
    directory points to payload cleanup; deletion across a build or application output directory is more consistent with
    routine compilation cleanup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this cmd.exe, and is that parent chain expected?
  context: The parent process reveals how the deletion was invoked. Interactive cleanup typically descends from explorer.exe
    or an installer; deletion driven by a script host (wscript.exe, mshta.exe), an Office application, or a freshly dropped
    executable is more consistent with an actor removing the artifacts it just used. Walk up the chain to see what spawned
    the parent and what else that parent launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_artifact.mechanism_decode
  question: What were the files marked for deletion, and what did they contain?
  context: The deleted files are the artifacts the cleanup was meant to erase. Retrieve any matching .au3, .dll, .exe, or
    .js files still on disk and examine their content for obfuscation, encoded strings, embedded URLs or IP addresses, and
    known malware string patterns. AutoIt scripts (.au3) and loose executables in a user-writable directory are a common
    payload-staging pattern; their content tells you what the deletion was hiding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%file_paths%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1070.004.file_delete
  question: What file-deletion events were recorded on this host in the same window, and which paths did they remove?
  context: Process-creation evidence shows the command was issued; the file-deletion event log confirms which files were
    actually removed and from where. Correlate deletion events in the alert window against temp directories, download folders,
    and user-writable staging paths. A burst of deletions immediately after a binary executed is the indicator-removal pattern
    this technique describes. If file-deletion events are not collected in this environment, treat the absence as a visibility
    gap rather than evidence nothing was removed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_artifact.artifact_verification
  question: Can the deleted files be recovered, and did any of them — or the tools run alongside the deletion — leave a recorded hash?
  context: A delete event records no hash, and the wildcard pattern hides the individual names, so the deleted files cannot be
    hashed or pinned to a path from this alert. Recover the names from the file-deletion question, then pursue the files
    themselves through Volume Shadow Copies, backups, or the recycle bin. For a hash, the only telemetry source is a prior
    execution — if a deleted executable ran earlier, its hash was captured then; check process history for those paths once you
    have them. This query shows what the deletion command's own process tree spawned, surfacing any tooling run in the same
    session with its hash for a reputation lookup.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- source: template:universal.evidence_preservation
  question: Are any of the targeted files still on disk despite the deletion command?
  context: Wildcard deletion can fail or partially complete -- files held open by another process, protected by attributes,
    or in subdirectories the command did not reach may survive. Files matching the targeted paths that still exist enable
    hash lookups, sandbox submission, and content review before they are removed on a retry.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before the deletion?
  context: File deletion is usually a cleanup step at the end of an operation, not its start. Earlier detections on the same
    host -- execution of a dropped payload, reconnaissance, credential access, or defense tampering -- may reveal the activity
    the deletion was meant to erase. The alert timeline reconstructs what ran before the artifacts were removed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host immediately after the deletion command ran?
  context: Cleanup can mark either the end of an operation or a pause before the next stage. Examining process activity in
    the window after the deletion reveals whether the actor continued -- launching additional payloads, staging new files,
    or moving laterally -- or stopped once the artifacts were removed. Correlate with file and network activity in the same
    window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other indicator-removal or defense-tampering actions performed on this host?
  context: An actor cleaning up dropped payloads often also clears logs, deletes shadow copies, or disables monitoring to
    cover the same operation. Finding additional removal or tampering events from the same user or parent process indicates
    a deliberate evidence-destruction effort rather than an isolated cleanup command.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\fsutil.exe'
          - '\sdelete.exe'
          - '\sdelete64.exe'
          - '\cipher.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'deletevalue'
          - 'usn deletejournal'
          - '/w'
          - '-p '
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:defense_tampering.protection_status
  question: Is logging and recovery on this host intact, or did the cleanup remove evidence that is now unavailable?
  context: Deletion of evidence may be temporary or leave a lasting visibility gap. Confirm whether the targeted files, the
    file-deletion event stream, and any shadow copies or backups that would have captured the removed artifacts are still
    available. If recovery sources were also destroyed, the artifacts must be reconstructed from surviving process and
    network telemetry before further investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_del:
        CommandLine|contains:
        - 'del '
        - 'erase '
      selection_extensions:
        CommandLine|contains:
        - \\\*.au3
        - \\\*.dll
        - \\\*.exe
        - \\\*.js
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_del:
        CommandLine|contains:
        - 'del '
        - 'erase '
      selection_extensions:
        CommandLine|contains:
        - \\\*.au3
        - \\\*.dll
        - \\\*.exe
        - \\\*.js
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the deletion was an isolated action or part of broader
    movement. If the same user triggered similar cleanup or execution activity on multiple endpoints, the scope of the
    operation may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_del:
        CommandLine|contains:
        - 'del '
        - 'erase '
      selection_extensions:
        CommandLine|contains:
        - \\\*.au3
        - \\\*.dll
        - \\\*.exe
        - \\\*.js
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to the deletion and
    what happened after -- the dropped payload that ran, reconnaissance, or staging that the cleanup was meant to conclude.
    Novel parent-child pairs at low counts stand out against the repetitive system telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
