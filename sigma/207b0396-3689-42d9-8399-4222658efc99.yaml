name: Potential Privilege Escalation To LOCAL SYSTEM
id: 73ab6b5b-08a9-4985-b9cc-d5c0a445cfa8
description: |
  Detects a command line that combines a SYSTEM-account flag (-s) with an
  interpreter target (cmd, powershell, or pwsh) in the pattern used by PsExec,
  PAExec, and their clones to launch a shell running as LOCAL SYSTEM. The rule
  matches the flag combination regardless of the launching binary's name and
  deliberately excludes command lines that mention paexec, PsExec, or accepteula,
  so it is tuned to catch renamed or repackaged copies of these tools rather than
  the original signed utilities. Spawning a SYSTEM shell is a routine
  administrative and lateral-movement step, so the investigation should establish
  which interpreter was launched as SYSTEM, what binary issued the command, the
  parent chain and user behind it, and whether the activity is isolated or spread
  across hosts.
type: detection
detection_id: 207b0396-3689-42d9-8399-4222658efc99
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line combine the SYSTEM flag with a cmd, powershell, or pwsh target?
  context: Confirm the alert is a true positive by reviewing the exact command line against the
    rule's criteria. The rule fires when the command line contains the -s SYSTEM flag together
    with a cmd, powershell, or pwsh target (for example ' -s cmd', ' -s -i powershell', or the
    reversed ' -i -s pwsh' form), and it does not fire when the line also contains paexec,
    PsExec, or accepteula. Confirm the flag-and-interpreter pair is present, note which
    interpreter was launched and whether the interactive -i flag was set, and check that none of
    the excluded strings appear.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to launch a SYSTEM-level shell with these tools?
  context: Launching cmd or PowerShell as LOCAL SYSTEM with PsExec-style flags is something only
    administrators and a few management tools do, and usually with the original signed utility
    rather than a renamed copy. Knowing whether the user role and host function include this kind
    of SYSTEM-shell activity is often the fastest way to separate sanctioned administration from
    operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did the full command line launch as SYSTEM, and was the session interactive?
  context: The full command line reveals exactly what was run as LOCAL SYSTEM. Identify which
    interpreter was targeted (cmd, powershell, or pwsh), whether the interactive -i flag was set
    so the shell attached to a logged-on desktop, and whether any target host, credential, or
    copy flags accompany the SYSTEM flag. An interactive SYSTEM shell points toward hands-on
    operator access; a detached or scripted invocation points toward automated execution or
    payload launch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: llm_generated
  question: Is the binary that issued this command a renamed or repackaged copy of a PsExec-style tool?
  context: The rule is tuned to fire on the SYSTEM-shell flag pattern while excluding command
    lines that contain paexec, PsExec, or accepteula, so a match often means the launching binary
    has been renamed to avoid those strings. Examine the alerting process Image name, on-disk
    path, and signing details. A binary running from a temp, AppData, or other user-writable
    directory, an unsigned binary, or one whose internal original filename differs from its
    on-disk name is consistent with a relocated or renamed admin tool; a binary in a normal
    software install path under a known vendor signature is more consistent with a bundled
    redistribution of the tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned the binary that issued this SYSTEM-shell command, and is that parent chain expected?
  context: The parent process reveals how the SYSTEM-shell command was invoked. A launch from an
    interactive shell, a scripting host such as wscript.exe or mshta.exe, a service control
    manager, or an Office application is more concerning than one from a recognized management
    agent or remote-administration framework. Walk the chain back from the immediate parent to
    understand who or what initiated the privilege escalation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What did the SYSTEM-level shell go on to execute?
  context: A shell running as LOCAL SYSTEM is the staging point for whatever the operator does
    next. Children spawned by the alerting process, or by the cmd or PowerShell session it
    launched, reveal the actual impact, such as credential dumping, reconnaissance, service
    installation, or payload execution. A SYSTEM shell that immediately spawns further tooling is
    materially different from one that exits without doing anything.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this SYSTEM-shell pattern, what parents and users drive it, and does the current alert fit?
  context: Even legitimate administration uses these flags, so the question is whether this
    firing fits the host's own history. The query mirrors the rule's command-line selection
    scoped to this host, so the parent and user distribution reflects how this specific
    SYSTEM-shell pattern has run here rather than generic interpreter usage. A new parent
    process, an unexpected user account, or a previously unseen command-line shape is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|windash:
        - ' -s cmd'
        - ' -s -i cmd'
        - ' -i -s cmd'
        - ' -s pwsh'
        - ' -s -i pwsh'
        - ' -i -s pwsh'
        - ' -s powershell'
        - ' -s -i powershell'
        - ' -i -s powershell'
      filter_main_exclude_coverage:
        CommandLine|contains:
        - paexec
        - PsExec
        - accepteula
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this SYSTEM-shell pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's command-line selection with no host scope, so the result
    is a fleet-wide count of this SYSTEM-shell firing pattern rather than generic interpreter
    usage. Many hosts firing the same pattern points to scripted deployment or remote
    administration tooling running broadly; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and the parent and binary consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|windash:
        - ' -s cmd'
        - ' -s -i cmd'
        - ' -i -s cmd'
        - ' -s pwsh'
        - ' -s -i pwsh'
        - ' -i -s pwsh'
        - ' -s powershell'
        - ' -s -i powershell'
        - ' -i -s powershell'
      filter_main_exclude_coverage:
        CommandLine|contains:
        - paexec
        - PsExec
        - accepteula
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally launch SYSTEM-level shells with these tools?
  context: Compare this user's current action against their historical behavior. A user who has
    never escalated to a SYSTEM shell with PsExec-style flags is more notable than one who does
    so regularly as part of their role, and the result should be weighed against the user's
    expected duties and toolset. The query counts how often this user has run the same SYSTEM-shell
    command pattern across all hosts.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|windash:
        - ' -s cmd'
        - ' -s -i cmd'
        - ' -i -s cmd'
        - ' -s pwsh'
        - ' -s -i pwsh'
        - ' -i -s pwsh'
        - ' -s powershell'
        - ' -s -i powershell'
        - ' -i -s powershell'
      filter_main_exclude_coverage:
        CommandLine|contains:
        - paexec
        - PsExec
        - accepteula
      condition: selection and not 1 of filter_main_*
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent and launching-binary combination behind this command historically routine on this host or across the environment?
  context: When the alert fires under a service principal, user identity does not attribute the
    behavior. The meaningful pivot is the launch mechanism, which parent process spawned the
    binary that issued the SYSTEM-shell command, and whether that pair is historically common. A
    new or rare parent for this binary on this host or environment-wide is the deviation worth
    chasing; a pair that already accounts for many prior events is more consistent with vendor or
    operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or actions on
    multiple endpoints. PsExec-style SYSTEM-shell flags are commonly used to execute on remote
    machines, so if the same user drove similar activity or other tooling on several hosts in
    this window, the scope is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent and launching-binary combination fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise because every host runs SYSTEM-owned agents constantly. The meaningful
    question is whether the same launch mechanism, the parent process spawning this binary, fired
    on other hosts in the alert window. Multiple hosts in the same window points to scheduled or
    pushed automation or a scripted rollout; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity surrounding the
    SYSTEM-shell command reveals what led to it and what followed, and whether it is one step in
    a larger sequence of reconnaissance, credential access, or lateral movement. Novel
    parent-child pairs at low counts stand out against the repetitive agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as
    reconnaissance, credential access, or defense tampering, may reveal the stages that preceded
    a SYSTEM-level escalation and help reconstruct the full timeline. A privilege escalation that
    follows discovery or credential theft tells a different story than one that appears on its
    own.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Escalation to LOCAL SYSTEM gives an operator the rights to disable security tooling,
    and tampering often precedes the hands-on activity a SYSTEM shell enables. The query surfaces
    direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear
    logs, or patch AMSI/ETW. Zero rows is a useful signal that protection looks healthy, though
    kernel-level driver tampering and in-memory patches will not appear here. Populated rows
    shift the disposition toward operator preparation; review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: llm_generated
  question: Was a new Windows service installed on this host around the time of the alert?
  context: PsExec, PAExec, and their clones run a remote payload as LOCAL SYSTEM by installing and
    starting a temporary Windows service, frequently under a host-specific or randomized name to
    evade static signatures. A service install on this host close to the alert, especially one
    with a transient or unusual service or binary name, corroborates that the SYSTEM-shell
    command came from this class of tool and may show whether the source was local or remote. If
    service install events are not collected in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - ServiceType
      - StartType
