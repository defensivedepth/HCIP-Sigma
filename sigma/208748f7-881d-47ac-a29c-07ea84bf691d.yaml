name: Suspicious Outlook Child Process
id: 97933afe-29b5-41e2-bbf0-9a37bd11afac
description: |
  Detects a mail client process (OUTLOOK.EXE) spawning a child process whose image
  is one of a list of interpreters, script hosts, and living-off-the-land utilities
  (cmd.exe, powershell.exe, pwsh.exe, wscript.exe, cscript.exe, mshta.exe,
  regsvr32.exe, msiexec.exe, msbuild.exe, schtasks.exe, wmic.exe, svchost.exe, and
  others). The rule fires when the parent image ends in \OUTLOOK.EXE AND the child
  image ends in one of those binaries. A mail client launching a command interpreter
  or script host is a classic attachment-execution pattern: a user opens a weaponized
  document or link from an email and the handler spawns a downloader or loader. It
  can also be benign — an add-in, a managed automation, or a user-launched helper.
  The investigation should confirm the parent-child pair, decode what the child
  actually did, identify the delivering email or attachment, and determine whether
  the same vector reached other users.
type: detection
detection_id: 208748f7-881d-47ac-a29c-07ea84bf691d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alert match the rule — a process whose parent image ends in \OUTLOOK.EXE spawning a child whose image ends in one of the listed interpreters or utilities?
  context: Before investing investigation time, confirm the parent-child pair is real.
    The rule fires when the parent image ends in OUTLOOK.EXE AND the child image ends
    in one of a fixed list of binaries (cmd.exe, powershell.exe, pwsh.exe, wscript.exe,
    cscript.exe, mshta.exe, regsvr32.exe, msiexec.exe, msbuild.exe, schtasks.exe,
    wmic.exe, svchost.exe, and others). Read the alert's Image and ParentImage and
    note which child binary fired — it determines which decode and baseline steps
    below carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to launch interpreters or utilities directly from the mail client?
  context: Some environments run mail add-ins, managed automations, or helper tools
    that legitimately spawn child processes from the mail client. Knowing whether this
    user's role and the host's function make that plausible is often the fastest path
    to separating a routine add-in from attachment-driven execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is the mail client expected to spawn this child, and what started the mail client itself?
  context: The parent-child relationship is the core signal here. A mail client spawning
    a command interpreter or script host is rarely a direct user action — it usually
    follows an opened attachment or embedded object. Tracing the parent's own origin
    (what launched OUTLOOK.EXE) and reading its command line shows whether the chain
    is an ordinary interactive session or something that handed off execution to a
    LOLBIN.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:initial_access.delivery_vector
  question: What email or attachment triggered this execution?
  context: Attachment-driven execution begins with a delivered file or link — a
    weaponized document, archive, or shortcut opened from a message. Identifying the
    delivering message and the opened file name enables blocking at the mail gateway
    and searching for other recipients. The parent command line frequently carries the
    document or attachment path that was opened.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: attack:T1204.002.child_command_decode
  question: What did the spawned child actually do? Decode its full command line, including any encoding or obfuscation.
  context: The child's command line reveals the operational intent of the execution.
    Decode any flags, URLs, file paths, encoded or obfuscated content. When the child
    is powershell.exe or pwsh.exe, look for -EncodedCommand/-enc base64, caret or
    backtick escaping, and download-cradle patterns (Net.WebClient.DownloadFile,
    IEX(IWR(...)), Start-BitsTransfer); when it is regsvr32.exe, mshta.exe, or
    msiexec.exe, look for a remote scriptlet or installer URL; when it is wscript.exe
    or cscript.exe, identify the script path. The decoded payload distinguishes a
    benign helper from a downloader or loader.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:scheduled_task.task_configuration
  question: If the child is schtasks.exe, what task was created and what command does it execute?
  context: When the spawned child is schtasks.exe, the command line carries the task
    name (/TN), the command to run (/TR), the schedule type (/SC), and the run-as
    account (/RU, with SYSTEM being high-risk). A mail client spawning schtasks.exe
    is a persistence-installation pattern — the configured command is the persistence
    payload, often a script, binary, or download cradle. Read these arguments from
    the triggering event to identify what would run and when.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: If the child is powershell.exe or pwsh.exe, did script block logging capture the full deobfuscated script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script content
    PowerShell actually executes, even when the command line is encoded or obfuscated.
    For a powershell.exe or pwsh.exe child this provides ground truth about what ran,
    bypassing attacker obfuscation. If PowerShell operational logs are not ingested in
    this environment, treat zero results as a visibility gap rather than evidence
    nothing ran, and decode the alerting command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: attack:T1204.002.create_stream_hash
  question: Does the file the mail client opened carry a mark-of-the-web or download stream marking it as externally delivered?
  context: Files saved from email, web, chat, or shares carry an alternate data stream
    (Zone.Identifier) recording the origin zone, and stream-hash events capture this
    on files written to user-controlled paths such as Downloads, Temp, Desktop, and
    profile AppData staging. A stream marking the opened document or attachment as
    externally delivered — especially with a risky extension (exe, scr, lnk, pif, cpl,
    js, vbs, bat, cmd, ps1, hta, iso, docm, xlsm) or a double extension — supports the
    attachment-execution reading and corroborates the delivering message.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: create_stream_hash
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:universal.evidence_preservation
  question: Is the file the child referenced or dropped still on disk for analysis?
  context: If the child's command line references a file — a downloaded payload, decoded
    output, opened document, or staged script in a user-controlled path (Downloads,
    Temp, Desktop, AppData) — checking whether it still exists on disk enables hash
    lookups, sandbox submission, or content review. Attachment-execution chains often
    drop files with risky extensions (exe, scr, hta, ps1, js, vbs) that are worth
    preserving before they are cleaned up.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:parent_child.sibling_processes
  question: What other child processes did this same mail client instance spawn around the same time?
  context: If the mail client spawned the detected child, it may have spawned others —
    a macro or loader commonly launches several stages in sequence (a downloader, then
    a script host, then a persistence tool). Examining the siblings of the exact parent
    instance reveals the full scope of activity launched through this chain. Multiple
    interpreter or utility children from the same parent strongly suggests orchestrated
    execution rather than an isolated helper.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Has the mail client spawned this child binary on this host before?
  context: A parent-child pairing that has never occurred on this host is more suspicious
    than one that runs regularly. Some environments have add-ins or managed automation
    that routinely spawn a specific helper from the mail client; a child binary the
    mail client has never launched here points to attachment-driven execution. Zero or
    very low historical counts indicate a novel spawning relationship.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert
    reveals what led to this event and what followed — reconnaissance, credential access,
    or persistence launched in the same window. Novel parent-child pairs stand out at
    low counts against the repetitive agent and OS telemetry the aggregation collapses.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, defense tampering,
    credential access — may reveal the attack stages that preceded this execution and
    help reconstruct the timeline. Attachment-driven execution is frequently the
    opening move, so prior alerts can also point to a separate, earlier foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \OUTLOOK.EXE
        Image|endswith:
        - \AppVLP.exe
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \forfiles.exe
        - \hh.exe
        - \mftrace.exe
        - \msbuild.exe
        - \msdt.exe
        - \mshta.exe
        - \msiexec.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \schtasks.exe
        - \scrcons.exe
        - \scriptrunner.exe
        - \sh.exe
        - \svchost.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \OUTLOOK.EXE
        Image|endswith:
        - \AppVLP.exe
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \forfiles.exe
        - \hh.exe
        - \mftrace.exe
        - \msbuild.exe
        - \msdt.exe
        - \mshta.exe
        - \msiexec.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \schtasks.exe
        - \scrcons.exe
        - \scriptrunner.exe
        - \sh.exe
        - \svchost.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user triggered similar execution
    on more than one host, the scope of the compromise may be larger than the single
    alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \OUTLOOK.EXE
        Image|endswith:
        - \AppVLP.exe
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \forfiles.exe
        - \hh.exe
        - \mftrace.exe
        - \msbuild.exe
        - \msdt.exe
        - \mshta.exe
        - \msiexec.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \schtasks.exe
        - \scrcons.exe
        - \scriptrunner.exe
        - \sh.exe
        - \svchost.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:initial_access.campaign_scope
  question: Were other users or systems hit by the same delivery vector?
  context: Phishing campaigns rarely target a single user. If one mailbox received a
    weaponized attachment, others likely did too. Correlating the same detection across
    all hosts reveals campaign breadth and identifies additional systems that opened
    the same content and need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - User
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1204.002
      name: Malicious File
      role: primary
    - id: T1204
      name: User Execution
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: file_delivery_and_open
      description: "User opens a file delivered by email, web, chat, or share; the handler application (here the mail client) is the launching parent."
      mapped_to: Q4
      source: template:initial_access.delivery_vector
    - stage: 2
      label: file_created_in_user_path
      description: "A downloaded or attached file is created in a user-controlled path (Downloads, Temp, Desktop, AppData staging), optionally with a mark-of-the-web stream."
      mapped_to: Q8
      source: attack:T1204.002.create_stream_hash
    - stage: 3
      label: child_spawn
      description: "The handler application spawns a new or unusual child process (powershell, wscript, cmd, regsvr32, msiexec, etc.) — the event the rule fires on."
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 4
      label: child_operation_decode
      description: "The spawned LOLBIN performs its operation (downloader/loader/installer/persistence); decode the command line to read it."
      mapped_to: Q5
      source: attack:T1204.002.child_command_decode
    - stage: 5
      label: egress_or_followon
      description: "T1204 parent chain: immediate outbound transfer or additional LOLBIN/installer stages from the same lineage."
      mapped_to: Q11
      source: template:parent_child.sibling_processes
  dimension_coverage:
    - dimension: file_path_analysis
      technique: T1204.002
      covered_by: Q8
      source: attack:T1204.002.create_stream_hash
      coverage_type: direct
    - dimension: time_correlation
      technique: T1204.002
      covered_by: Q11
      source: template:parent_child.sibling_processes
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1204.002
      covered_by: Q5
      source: attack:T1204.002.child_command_decode
      coverage_type: direct
    - dimension: user_context
      technique: T1204
      covered_by: Q15
      source: template:cue_user_actor.baseline
      coverage_type: direct
  mutable_dispositions:
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "0-5m / +/-15m correlation window from file write to child spawn"
      disposition: context
      target_question: Q8
      notes: "create_stream_hash and sibling_processes use +/-15m windows to correlate the externally-delivered file write to the child spawn."
    - element: SuspiciousExtensions
      dimension: tuning_parameter
      specific_values: "exe, scr, lnk, pif, cpl, js, vbs, bat, cmd, ps1, hta, iso, docm, xlsm; double extensions"
      disposition: context
      target_question: Q8
      notes: "Risky/double extension list named in the create_stream_hash and evidence_preservation context to flag the delivered file."
    - element: UserPaths
      dimension: file_path_analysis
      specific_values: "Downloads, Temp, Desktop, profile AppData staging"
      disposition: context
      target_question: Q9
      notes: "User-controlled path list named in create_stream_hash and evidence_preservation context; query scopes via %file_dirs%/%file_paths%."
    - element: ParentApps / HighRiskParents
      dimension: tuning_parameter
      specific_values: "user-facing apps that open attachments (here OUTLOOK.EXE)"
      disposition: query_injection
      target_question: Q12
      notes: "Parent app is the rule's fixed parent (OUTLOOK.EXE); baseline/baseline_svc queries pivot on process.parent.name to weigh the parent-child pair."
    - element: HighRiskChildren
      dimension: tuning_parameter
      specific_values: "powershell, cmd, wscript, cscript, mshta, rundll32, regsvr32, msiexec, curl, bitsadmin, expand, tar (rule list: 21 binaries)"
      disposition: query_injection
      target_question: Q1
      notes: "The rule's child-image list IS this mutable element; verify_trigger_match enumerates it and the child_command_decode question tailors decode by which child fired."
    - element: SignerAllowList
      dimension: tuning_parameter
      specific_values: "rationale only — trusted signers to suppress benign tools"
      disposition: context
      target_question: Q3
      notes: "No specific signer values; parent_process_legitimacy and host_user_context let the analyst weigh whether the pair is sanctioned automation."
    - element: EgressAllowList
      dimension: tuning_parameter
      specific_values: "rationale only — corporate update/CDN/proxy egress to suppress benign updater traffic"
      disposition: context
      target_question: Q5
      notes: "No specific egress values in the brief; the child_command_decode question surfaces any URL in the child command line for reputation review."
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: "parent_process is primary cue and parent_child technique set active — process_chain subsumed (also brief hint 3)."
      kept: template:parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.mechanism_decode
      reason: "parent_child technique set active — parent_process_legitimacy is the more specific parent question and also walks the grandparent."
      kept: template:parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.follow_on
      reason: "Duplicate of parent_child.sibling_processes (other children of the parent); sibling_processes scopes by exact ParentProcessGuid instance, more precise."
      kept: template:parent_child.sibling_processes
    - dropped: cue_parent_process.clustering
      reason: "Other-activity-from-parent overlaps cue_host_context.clustering (host-wide around-time activity); host clustering kept as the broader view."
      kept: template:cue_host_context.clustering
    - dropped: cue_parent_process.scope
      reason: "Cross-host parent-child pair occurrence overlaps initial_access.campaign_scope and cue_user_actor.clustering_svc, both of which carry the cross-host scope."
      kept: template:initial_access.campaign_scope
    - dropped: cue_process_tool.baseline
      reason: "host-runs-this-tool baseline overlaps cue_parent_process.baseline (host runs this PARENT->CHILD pair), which is more specific for a parent-child rule."
      kept: template:cue_parent_process.baseline
    - dropped: powershell.encoded_command_decode
      reason: "Folded into attack:T1204.002.child_command_decode — same ProcessGuid->CommandLine decode; the child-decode question covers -enc/base64/obfuscation for the powershell/pwsh child and also the non-powershell children."
      kept: attack:T1204.002.child_command_decode
    - dropped: cue_user_actor.baseline / cue_user_actor.baseline_svc pair
      reason: "user_actor pair — non-deduplicable; both emitted (Q15 user-pivot, Q16 parent+binary substitute)."
      kept: both
    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc pair
      reason: "user_actor pair — non-deduplicable; both emitted (Q17 user-pivot, Q18 parent+binary substitute)."
      kept: both
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: scheduled_task.task_configuration (brief hint 1). The general child-decode role is filled by attack:T1204.002.child_command_decode; task_configuration is included for the schtasks-child case."
    - template: universal.endpoint_protection_health
      reason: >-
        Recommended-tier, not must_include. Dropped under the 18-question cap.
        The rule is a parent-child execution-initiation detection, not a payload/
        credential-access action where AV/EDR tamper-as-precursor is the load-bearing
        disposition question; the rule's child can be any of 21 binaries, most not
        tamper tools. Prior-host context is already carried by cue_host_context.precursor
        (Q14, prior sigma alerts incl. defense tampering) and cue_host_context.clustering
        (Q13). No defense_tampering set is confirmed, so no more-specific tamper question
        displaced it — it was dropped for cap room, not superseded.
    - template: powershell.powershell_security_bypass
      reason: >-
        must_include of the powershell set, dropped under the cap. The powershell set is
        confirmed only because powershell.exe is one of 21 children in the rule list, not
        because the rule constrains the child to powershell; the -1h bypass-precursor sweep
        is powershell-specific and only fires for that subset. The decode of the child
        command (Q5) already surfaces -ExecutionPolicy Bypass/-ep bypass/AMSI strings when
        the child IS powershell, and cue_host_context.precursor (Q14) carries prior tamper alerts.
    - template: scheduled_task.task_trigger_and_timing
      reason: >-
        must_include of the scheduled_task set, dropped under the cap. The scheduled_task set
        is confirmed only because schtasks.exe is one of 21 children; task timing matters only
        for the schtasks-child subset. scheduled_task.task_configuration (Q6) represents the set
        and reads the schedule (/SC) from the same event; whether the task already ran is
        secondary to confirming the parent-child execution chain that is the rule's core.
    - template: scheduled_task.task_still_present
      reason: >-
        must_include of the scheduled_task set, dropped under the cap. Same rationale — schtasks
