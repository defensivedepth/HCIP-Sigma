name: Screen Capture Activity Via Psr.EXE
id: 5e11263e-e8e4-4619-ad9f-753894748282
description: |
  Detects execution of the Windows Problem Steps Recorder (psr.exe) with a /start or -start argument,
  which begins recording the user's screen and mouse clicks to an output file. Psr.exe is a built-in
  utility intended for documenting troubleshooting steps, but the same capability lets an operator
  capture the screen of a logged-in user without installing additional tooling. Investigation should
  confirm what was recorded, where the output was written, which parent process launched the recorder,
  and whether the user, host, and timing are consistent with legitimate support activity rather than
  hands-on collection.
type: detection
detection_id: 2158f96f-43c2-43cb-952a-ab4580f32382
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did psr.exe run with a /start or -start argument that begins screen recording?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    full command line and process details. The rule fires when the process image ends in \Psr.exe and
    the command line contains /start or -start, so verify the recorder was actually launched into a
    recording state rather than queried for help or version.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run the Problem Steps Recorder?
  context: Legitimate use of psr.exe is usually interactive — a user or support technician documenting
    a repro for a helpdesk ticket. A service account, an unattended server, or a user with no support
    role running the recorder is harder to explain and shifts the disposition toward operator-driven
    collection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What was the full psr.exe command line, including the output path and capture options?
  context: The full command line reveals how the recorder was configured. Decode the /output path (where
    the recording is written, typically a .zip), the /sc capture interval, and the /gui flag — /gui 0
    suppresses the user-visible window so recording runs silently. An absolute or hidden output path
    combined with /gui 0 points to covert collection rather than user-initiated troubleshooting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned psr.exe, and is that parent chain expected?
  context: The parent process reveals how the recorder was invoked. User-initiated use is normally
    spawned from explorer.exe or a console the user opened. A scripting host (wscript.exe, cscript.exe,
    powershell.exe), mshta.exe, an Office application, or a remote-execution service spawning psr.exe
    indicates the recording was automated rather than driven by a person at the keyboard.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:data_staging_exfil.data_scope
  question: What output file did psr.exe write, and where was it placed?
  context: 'The recorder writes its capture to the path given by /output (a .zip containing an MHTML
    report with embedded screenshots). The location determines exposure: a user Documents folder is
    consistent with self-documentation, while a temp, public, or staging directory points to collection
    intended for later retrieval. Identify the output file so its contents and movement can be assessed.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:data_staging_exfil.archive_destination
  question: Was the recording output moved, copied, or transmitted off the host after creation?
  context: Captured screen recordings have value only once they leave the host. After the output file
    is written, look for a subsequent move or copy to a staging location and for outbound network
    activity from the same host in the following hour. Movement to removable media, a network share,
    or an external destination distinguishes active collection-and-exfiltration from a benign local
    recording.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1113.image_load
  question: Did the alerting process or a related process load screen-capture or imaging modules around the alert time?
  context: Screen capture can be performed by command-line tools like psr.exe or directly through
    graphics APIs (CopyFromScreen, GDI BitBlt). Image-load events for imaging and screen-grab modules
    on this host near the alert time show whether other processes were also exercising screen-capture
    capability, which can reveal a scripted or in-memory capture path alongside the recorder. If
    image-load telemetry is not collected in this environment, treat zero results as a visibility gap
    rather than evidence nothing loaded these modules.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_modules:
        ImageLoaded|contains:
          - '\gdi32'
          - '\gdiplus'
          - '\System.Drawing'
          - '\dxgi'
          - '\d3d11'
      condition: selection_host and selection_modules
    fields:
      - Image
      - ImageLoaded
- source: template:cue_process_tool.follow_on
  question: What child processes did psr.exe spawn afterward?
  context: The recorder itself does not normally launch other programs. Child processes such as cmd.exe,
    powershell.exe, or an archiving or transfer utility spawned by psr.exe would be unexpected and may
    indicate the recorder was part of a larger scripted sequence handling the captured output.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run psr.exe?
  context: The Problem Steps Recorder runs rarely on most endpoints — typically only during an active
    support interaction. Zero or very low historical counts over the last 90 days indicate first-time
    or rare use, which raises the bar for a benign explanation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously launched psr.exe into a recording state, what parents and users drove it, and does this alert fit that pattern?
  context: Even a built-in tool can be abused. The query mirrors the rule's selection scoped to this
    host, so the resulting parent and user distribution reflects how this specific recording pattern
    has historically run here. A new parent process, an unexpected user account, or an unusual command
    pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Psr.exe
        CommandLine|contains:
        - /start
        - -start
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Psr.exe
        CommandLine|contains:
        - /start
        - -start
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Psr.exe
        CommandLine|contains:
        - /start
        - -start
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the screen recording was an
    isolated action or part of broader activity on multiple endpoints. The same user driving similar
    activity elsewhere widens the scope of what needs to be reviewed.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Psr.exe
        CommandLine|contains:
        - /start
        - -start
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the recording?
  context: Collection rarely happens in isolation. Activity surrounding the screen recording may reveal
    reconnaissance, credential access, archiving, or transfer tooling that provides broader context and
    helps establish whether the capture was one step in a larger operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts launched psr.exe into a recording state in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    specific recording pattern rather than generic psr.exe usage. Many hosts firing the same pattern
    points to scripted deployment or a management tool; one host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Psr.exe
        CommandLine|contains:
        - /start
        - -start
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance,
    credential access, or defense tampering — may reveal the attack stages that preceded the screen
    capture and help reconstruct the full timeline leading to collection.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
