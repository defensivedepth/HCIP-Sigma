      reason: >-
        The rule's detection deletes scheduled tasks (schtasks /delete /tn * /f),
        not Windows services — no service is stopped or reconfigured by the rule's
        behavior, so a service_persistence.service_configuration / current_status
        question would describe activity the rule does not detect. Service-stop
        activity that may co-occur in a broader impact sequence is surfaced by the
        ransomware_impact.destruction_scope_on_host question (sc.exe / net stop /
        taskkill on the host), recorded as partial coverage of this dimension.
    - hint: "logsource 'security' (recommended by techniques: T1489) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The 'security' recommendation maps to EventCode 4672 (elevated-privilege
        logon), part of the generic Service Stop chain's "elevated execution
        context" stage. This rule's behavior is a single process_creation event
        (schtasks task deletion); the elevated-context dimension is covered by the
        process_chain parent lineage question rather than a Security-log privilege
        sweep, which would return broad unrelated privileged-logon volume without
        tying to the task deletion.
    - hint: "logsource 'sysmon_status' (recommended by techniques: T1489) is not covered and no template family exists — author a custom question with `category: sysmon_status`"
