- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A covert tunnel is often a mid-stage step rather than the first action. Earlier detections on the same host
    — reconnaissance, credential access, defense tampering, or remote-execution activity — may reveal the stages
    that preceded the tunnel and help reconstruct the timeline. Reviewing the alert sequence on the host situates
    this event in the larger operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1090.001
      name: Internal Proxy
      role: primary
    - id: T1090
      name: Proxy
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: tool_invocation
      description: "Anomalous/operator process invokes cloudflared with tunnel + -url arguments to stand up an outbound proxy"
      mapped_to: Q3
      source: template:cue_process_tool.mechanism_decode
    - stage: 2
      label: parent_spawn
      description: "Suspicious process spawning precedes the proxy — which parent launched the network-capable tunnel binary"
      mapped_to: Q8
      source: template:cue_process_tool.process_chain
    - stage: 3
      label: network_bridge
      description: "Process initiates connections to internal peers / uncommon high or non-standard ports to proxy or relay traffic"
      mapped_to: Q7
      source: attack:T1090.001.network_destination
  dimension_coverage:
    - dimension: time_correlation
