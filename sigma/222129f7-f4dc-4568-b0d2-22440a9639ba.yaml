      coverage_type: direct
  mutable_dispositions:
    - element: DestinationPort
      dimension: tuning_parameter
      specific_values: "1080, 8080, 4444; smb over non-standard ports"
      disposition: context
      target_question: Q7
      notes: >-
        Specific proxy-port values named in Q7 context and Q6 context. Not injected as a query
        DestinationPort selection because the rule fires on process_creation; the network-side
        Q7 query scopes to internal CIDR ranges to surface the proxy/relay pattern, and the analyst
        reads the ports off the returned rows rather than pre-filtering to a fixed port list that
        would miss the default Cloudflare QUIC 7844 and any operator-chosen port.
    - element: InternalConnectionPattern
      dimension: tuning_parameter
      specific_values: "rationale only (workstation-to-workstation rare peer comms)"
      disposition: query_injection
      target_question: Q7
      notes: "Q7 query filters DestinationIp to RFC1918 internal CIDR ranges to surface internal peer/relay connections."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (correlate connection bursts with new process execution)"
      disposition: context
      target_question: Q7
      notes: "Q7 ranges +/-15m around the tunnel launch; context directs the analyst to look for connection bursts in the same window as the cloudflared process start."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (rarely-network-active system parents spawning network-capable children)"
      disposition: context
      target_question: Q8
      notes: "Q8 process_chain examines the parent that spawned cloudflared; context notes network-capable children from rarely-network parents."
  dedup_decisions:
    - dropped: cue_process_tool.clustering
      reason: "near-identical to cue_host_context.clustering (both 'what else ran on this host', host-scoped aggregation); cue_host_context aggregates by Image+ParentImage which is strictly more informative"
      kept: cue_host_context.clustering
    - dropped: cue_process_tool.baseline
      reason: "host-level 'does this host run this binary' is subsumed by the rule-pattern-scoped baseline_deviation (host_pattern reflection), which is filter-correct to this firing pattern rather than generic binary usage"
      kept: cue_process_tool.baseline_deviation
    - dropped: null
      reason: "user_actor pair — non-deduplicable: cue_user_actor.baseline + baseline_svc and clustering + clustering_svc both emitted as paired-and-distinct (subject vs. launch-mechanism identity dimensions)"
      kept: cue_user_actor.baseline/baseline_svc, cue_user_actor.clustering/clustering_svc
  skipped_templates:
    - template: universal.endpoint_protection_health
      reason: >-
        Recommended-tier (not must_include). Drop condition (b) from its notes_to_llm applies: the
        cue_host_context.precursor question is present AND this rule is command-and-control / tunneling,
        not an execution or credential-access rule whose disposition turns on whether protection was
        weakened first. Prior-alert context (precursor, host-scoped sigma alerts -6h) already surfaces
        any tamper-as-precursor signal on this host. defense_tampering technique set is NOT confirmed for
        this rule, so condition (a) does not apply; condition (b) carries the drop.
  reflection_overrides: []
  hint_dispositions:
    - hint: "Condition has nested structure that the topology decomposer could not fully flatten. Read rule.detection.condition by hand and verify Q1 framing reflects the actual logical shape — see rule.condition_topology.raw."
      disposition: acted-on
      reason: >-
        Read raw condition '(selection_img and selection_param) or selection_other' by hand. Q1
        (verify_trigger_match) and the description use disjunctive framing across the two top-level
        OR branches: branch A = cloudflared binary by name/hash AND a tunnel+-url command line;
        branch B = any command line containing both -url and -no-autoupdate (the renamed-binary catch).
        Q1 context directs the analyst to note which branch fired because a -no-autoupdate-only match
        implies a renamed copy worth path/signature scrutiny.
  contextual_sets:
