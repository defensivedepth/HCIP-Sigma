        confidence: medium
        reason: >-
          Keyword match on 'ransomware' in the references is incidental to what THIS rule detects. The rule
          fires on tunnel-creation (a C2 primitive), not on encryption, shadow-copy deletion, ransom notes,
          or mass file modification. Importing ransomware-impact questions would investigate a stage this
          rule does not observe; the follow_on and host clustering questions already capture any post-tunnel
          hands-on-keyboard activity generically.
      - id: network_scope
        confidence: medium
        reason: >-
          The remote_access_tool technique set (confirmed) plus the attack:T1090.001.network_destination
          question already cover the network-side proxy/relay and internal-peer scoping. A separate
          network_scope set would duplicate the connection_destination and internal-connection questions
          without adding a distinct dimension.
