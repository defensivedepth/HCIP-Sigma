name: PowerShell MSI Install via WindowsInstaller COM From Remote Location
id: 25badfc3-94f9-4064-8755-8d7ff4b64fb4
description: |
  Detects PowerShell (powershell.exe, powershell_ise.exe, or pwsh.exe) invoking the WindowsInstaller.Installer COM object
  with an InstallProduct call that points at a remote location (an http URL or a UNC \\ path) rather than a local file or
  localhost. Using the COM object instead of msiexec.exe lets an operator fetch and install an MSI in-process, which can
  evade detections that watch msiexec command lines and keep the install off-disk during retrieval. Legitimately this is
  rare; the same pattern appears in paste-and-run social-engineering lures where a user is tricked into pasting an obfuscated
  command into the Run dialog. The rule fires only when the PowerShell binary, the -ComObject/InstallProduct command shape,
  and a remote (non-localhost) http or UNC reference are all present together. Investigation should confirm the command,
  decode any obfuscation, identify the remote source, and determine whether an MSI or follow-on payload actually landed.
type: detection
detection_id: 222720a7-047f-4054-baa5-bab9be757db0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-05'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show PowerShell calling WindowsInstaller.Installer with InstallProduct against a remote http
    or UNC location?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only
    when all three conditions hold together - a PowerShell binary (powershell.exe, powershell_ise.exe, or pwsh.exe), the
    -ComObject and InstallProduct( tokens, and a remote reference (http or a \\ UNC path) that is not 127.0.0.1 or localhost.
    Verify each piece is present rather than a benign local install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to install MSI packages via PowerShell COM automation from a remote source?
  context: Legitimate software deployment is normally driven by managed tooling and service accounts, not an interactive user
    pasting a PowerShell COM install command. Knowing whether this user role and host function involve scripted MSI installs
    is often the fastest way to separate a routine deployment from a paste-and-run lure or operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.evidence_preservation
  question: Did the MSI or any payload referenced by the command land on disk for analysis?
  context: If the InstallProduct call succeeded, the fetched MSI - and any follow-on files it drops - may still be on disk.
    Confirming the file exists enables hash lookups, sandbox submission, or content review. Common staging directories for
    this pattern include user-writable paths such as the public profile and AppData.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: What exactly does the PowerShell COM install command do? Decode the full command line, including the COM object
    name and the InstallProduct argument.
  context: The full command line reveals the remote source and install behavior. Decode the -ComObject value (it is often
    rebuilt at runtime from a misspelling such as 'indowsInstaller.Installer' via .Insert() to defeat signature matching),
    the InstallProduct( target, and any UILevel setting (UILevel=2 means a silent install). Resolve any obfuscated http
    string (for example 'htps://' rebuilt to 'https') to recover the true remote location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - -ComObject
          - InstallProduct(
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated? What does it decode to?
  context: This pattern commonly hides the COM object name and remote URL with runtime string rebuilding (.Insert(), concatenation),
    deliberate misspellings ('indowsInstaller', 'htps://'), and a -WindowStyle Hidden / -W Hidden flag that suppresses any
    visible window. Decode these to recover the real installer source and target. Trailing benign-looking text (a fake
    "Service connection checkup" or "Browser check" diagnostic ID) is often appended to push the malicious portion off-screen.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging records the deobfuscated script PowerShell actually executed, even when the command line is
    obfuscated with runtime string rebuilding. This is ground truth for the recovered COM object name, the InstallProduct
    target URL, and the UILevel setting. If PowerShell operational logs are not ingested in this environment, treat zero
    results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell security controls before running a payload. Common techniques include
    AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), and PowerShell
    downgrade attacks (using version 2, which lacks logging). Finding these precursor events on the host strengthens the
    case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: attack:T1105.network_connection
  question: Did the PowerShell process make an outbound connection to the remote location, and where did it resolve to?
  context: The InstallProduct call against an http URL or UNC path implies an outbound fetch of the MSI. Pivoting from the
    triggering process to its network connections confirms whether the remote retrieval actually occurred and surfaces the
    destination address and port. A connection to an external, recently registered, or low-reputation host indicates the
    delivery stage completed; no connection suggests the fetch was blocked or failed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
      - Initiated
- source: attack:T1218.image_load
  question: After the install call, did msiexec.exe or the MSI-handling components load modules consistent with an in-process
    install or side-loaded DLL?
  context: Even though the COM object performs the install in-process under PowerShell, completing an MSI install typically
    engages msiexec.exe and Windows Installer components, and follow-on payloads commonly side-load a DLL from a user-writable
    path. Reviewing module loads tied to the install on this host helps confirm the install ran and surfaces unsigned or
    relocated DLLs loaded from unusual directories.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \msiexec.exe
          - \powershell.exe
          - \powershell_ise.exe
          - \pwsh.exe
      filter_signed:
        Signed: 'true'
      condition: selection and not filter_signed
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent reveals how the install command was launched. A paste-and-run lure typically shows explorer.exe or a
    cmd.exe started from the Run dialog or a downloaded script; office applications, mshta.exe, wscript.exe, or a browser
    helper as the parent point toward exploitation or social engineering rather than managed deployment.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the staging directory around the install?
  context: This delivery pattern often drops multiple files into the same user-writable staging directory (for example the
    public profile or AppData), or the MSI triggers further writes during extraction. Directory-level file activity reveals
    the broader scope of the delivery beyond the single referenced file.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      filter_self:
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection and not filter_self
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: Can you retrieve and analyze the downloaded MSI or payload from a safe environment?
  context: If the fetched MSI or a follow-on file is still on disk, submitting its hash to threat intelligence services or
    detonating it in a sandbox reveals whether it is a known malicious payload, a legitimately wrapped application, or
    something novel requiring deeper analysis. Wrapped installers in this pattern frequently bundle a legitimate-looking
    application alongside a malicious DLL.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell COM-based installs from a remote source?
  context: Compare this user's current action against their historical behavior. A user who has never driven a scripted MSI
    install via PowerShell is more suspicious than one who does so as part of a known role. User role and typical toolset
    should align with command-line software deployment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and PowerShell-binary combination historically routine on this host or across the environment?
  context: When the alert fires under a service principal, user identity does not attribute behavior, so the meaningful pivot
    is the launch mechanism. A new or rare parent for this PowerShell binary on this host (or environment-wide) is the
    deviation worth chasing; a pair that already accounts for many prior events is more likely vendor or operating-system
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar install activity on more than one host, the scope may be larger than a single
    paste-and-run on one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and PowerShell-binary combination fire on other hosts in the same window - a coordinated
    rollout, or isolated to this host?
  context: Under a service principal, a user-wide pivot returns agent-telemetry noise. The meaningful question is whether the
    same launch mechanism - parent process plus spawned PowerShell binary - fired on other hosts in the alert window. Multiple
    hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger such as
    a paste-and-run lure.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current
    alert fit?
  context: The query mirrors the rule's full selection (PowerShell binary, the -ComObject/InstallProduct command shape, and
    a remote non-localhost reference) scoped to this host, so the resulting parent and user distribution reflects how this
    specific firing pattern has historically run here. A new parent, an unexpected user, or an unusual command shape is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell_ISE.EXE
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - -ComObject
        - InstallProduct(
      selection_remote:
        CommandLine|contains:
        - http
        - \\\\
      filter_main_localhost:
        CommandLine|contains:
        - ://127.0.0.1
        - ://localhost
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's full selection with no host scope, so the result is a fleet-wide count of this firing
    pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity or a targeted lure.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell_ISE.EXE
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - -ComObject
        - InstallProduct(
      selection_remote:
        CommandLine|contains:
        - http
        - \\\\
      filter_main_localhost:
        CommandLine|contains:
        - ://127.0.0.1
        - ://localhost
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
