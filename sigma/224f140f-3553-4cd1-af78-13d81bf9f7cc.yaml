name: Potential RDP Session Hijacking Activity
id: f6a78490-8012-45ea-85d1-dd83444e8532
description: |
  Detects tscon.exe running at SYSTEM integrity level, identified either by the
  image name ending in tscon.exe or by an OriginalFileName of tscon.exe. tscon.exe
  attaches the current console to another Terminal Services session; when invoked
  as SYSTEM it can reconnect to a disconnected or active RDP session belonging to
  another user without that user's credentials, transferring control of their
  desktop. Legitimate SYSTEM-context use is rare and usually tied to service or
  administrative tooling, so the investigation should determine who launched it,
  which session was targeted, and what ran afterward inside the hijacked session.
type: detection
detection_id: 224f140f-3553-4cd1-af78-13d81bf9f7cc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did tscon.exe run at SYSTEM integrity level on this host?
  context: Confirm the alert is a true positive by reviewing the triggering event.
    The rule fires when the image ends in tscon.exe or its OriginalFileName is
    tscon.exe AND the integrity level is System (or S-1-16-16384). Verify both the
    binary identity and the SYSTEM integrity level before investing further effort.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - IntegrityLevel
- source: template:universal.host_user_context
  question: Is this user/host expected to attach to another RDP session via tscon.exe?
  context: SYSTEM-context use of tscon.exe to connect to another Terminal Services
    session is uncommon on most hosts. Knowing whether this host is a Remote Desktop
    Session Host or jump server, and whether the launching account routinely manages
    sessions, is often the fastest way to separate routine administration from a
    session takeover.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What session did tscon.exe attach to? Decode its full command line and arguments.
  context: The full command line reveals the target session. tscon.exe takes a
    session ID or name plus an optional /dest parameter naming the session to
    connect to; decode these to identify whose session was targeted and where
    control was redirected. Review all tscon.exe executions on this host in the
    window, since a hijack may involve more than one invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned tscon.exe and is that parent chain expected?
  context: The parent process reveals how tscon.exe was invoked. A SYSTEM-context
    launch from services.exe or a scheduled task differs from one launched by an
    interactive shell, cmd.exe, or a remote-management tool. An unusual parent for
    a SYSTEM-integrity tscon.exe points toward deliberate session takeover rather
    than routine service activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run tscon.exe?
  context: A binary that has never been seen on a host is more suspicious than one
    that runs regularly. Zero or very low historical counts for tscon.exe indicate
    first-time or rare execution; consistent prior use suggests an established
    session-management workflow on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even tools that appear occasionally can be abused. This query mirrors the
    rule's selection — tscon.exe at SYSTEM integrity — scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern
    has historically run here. A new parent process, an unexpected account, or a
    first-time appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \tscon.exe
      - OriginalFileName: tscon.exe
      selection_integrity:
        IntegrityLevel:
        - System
        - S-1-16-16384
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did tscon.exe spawn afterward?
  context: The processes spawned after a session attach reveal the actual impact of
    the activity. A hijacked session is often used to launch interactive shells,
    reconnaissance commands, or credential-access tooling under the victim's
    desktop. Unexpected children such as cmd.exe, powershell.exe, or certutil.exe
    point toward hands-on activity inside the connected session.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection — tscon.exe at SYSTEM integrity —
    with no host scope, giving a fleet-wide count of the firing pattern rather than
    generic tscon.exe usage. Many hosts firing the same pattern points to scripted
    or vendor automation; a single host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \tscon.exe
      - OriginalFileName: tscon.exe
      selection_integrity:
        IntegrityLevel:
        - System
        - S-1-16-16384
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \tscon.exe
      - OriginalFileName: tscon.exe
      selection_integrity:
        IntegrityLevel:
        - System
        - S-1-16-16384
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \tscon.exe
      - OriginalFileName: tscon.exe
      selection_integrity:
        IntegrityLevel:
        - System
        - S-1-16-16384
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the launching account's activity across all hosts reveals
    lateral movement or coordinated action across multiple endpoints. If the same
    account triggered similar session activity on other hosts in the same window,
    the scope of the activity may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \tscon.exe
      - OriginalFileName: tscon.exe
      selection_integrity:
        IntegrityLevel:
        - System
        - S-1-16-16384
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert
    reveals the immediate context: what preceded the session attach, what happened
    after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, or persistence around the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host —
    defense tampering, reconnaissance, credential access, or privilege escalation —
    may reveal the stages that preceded a session takeover and help reconstruct the
    timeline leading up to the SYSTEM-context tscon.exe execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
