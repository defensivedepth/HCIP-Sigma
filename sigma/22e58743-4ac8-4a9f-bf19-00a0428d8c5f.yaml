  dedup_decisions:
    - dropped: cue_process_tool.baseline
      reason: >-
        Host-level "does this host normally run this tool" baseline pivots on Image|endswith %Image%, but this is
        a CommandLine-only rule with no binary in the detection (primary_binary null, all_binaries empty) — an
        Image-scoped baseline is not meaningful. The rule-pattern-scoped baseline_deviation (host_pattern
        reflection) is filter-correct to this firing pattern on this host and subsumes the generic host baseline.
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.clustering
      reason: >-
        Near-identical to cue_host_context.clustering — both ask "what else ran on this host" with a host-scoped
        process_creation aggregation. cue_host_context.clustering aggregates by Image+ParentImage which is
        strictly more informative for spotting novel parent-child pairs.
      kept: cue_host_context.clustering
    - dropped: null
      reason: >-
        user_actor pair — non-deduplicable: cue_user_actor.baseline + baseline_svc and
        cue_user_actor.clustering + clustering_svc both emitted as paired-and-distinct (subject identity vs.
        launch-mechanism identity dimensions).
      kept: cue_user_actor.baseline/baseline_svc, cue_user_actor.clustering/clustering_svc
  skipped_templates: []
  reflection_overrides: []
  mutable_dispositions_note: "attack_brief empty — no ATT&CK mutable elements to disposition."
  hint_dispositions:
    - hint: "CommandLine-only detection — no Image field in rule. Use CommandLine pattern matching for scoping, not Image-based queries"
      disposition: acted-on
      reason: >-
        The rule has no binary (primary_binary null, all_binaries empty); the detection is purely
        CommandLine|contains on five base64 MZ-header prefixes. Every template that defaulted to Image|endswith
        '%Image%' scoping was rewritten to scope on the rule's base64 CommandLine|contains values instead:
        cue_user_actor.baseline (User + base64 patterns), cue_user_actor.baseline_svc (parent name + base64
        patterns), and cue_user_actor.clustering_svc (parent name + base64 patterns). mechanism_decode and the
        obfuscation decode were ProcessGuid-scoped to the alerting event (the operation lives entirely in the
        alerting command line). follow_on was switched from ParentImage|endswith '%Image%' to
        ParentProcessGuid|expand '%ProcessGuid%' (children of the exact alerting process). The REFLECTED
        templates (baseline_deviation, scope) already embed the base64 patterns by construction. The
        Image-scoped cue_process_tool.baseline was dropped (see dedup_decisions) because an Image baseline is
        not meaningful without a binary.
