name: Renamed PingCastle Binary Execution
id: f1c73782-1810-4946-8282-f6ab50645526
description: |
  Detects execution of the Active Directory assessment tool PingCastle running under a renamed
  executable, identified by PE metadata (OriginalFileName of PingCastleReporting.exe,
  PingCastleCloud.exe, or PingCastle.exe) or by PingCastle-specific command-line flags such as the
  scanner modules, --no-enum-limit, or --healthcheck combined with --level Full or --server, while
  the on-disk Image is NOT one of the original PingCastle names. PingCastle is a legitimate AD
  security-audit tool, so it can appear during sanctioned assessments; running it under a renamed
  binary is a deliberate step to evade name-based detection and is commonly seen during domain
  reconnaissance that precedes credential access and lateral movement. The investigation should
  determine the binary's true identity, how it arrived, who ran it, what AD enumeration it performed,
  and whether the same activity touched other hosts.
type: detection
detection_id: 2433a154-bb3d-42e4-86c3-a26bdac91c45
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match a renamed PingCastle binary by metadata or scanner flags?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    when a process carries an OriginalFileName of PingCastle (PingCastleReporting.exe,
    PingCastleCloud.exe, or PingCastle.exe) OR runs with PingCastle-specific command-line flags
    (a --scanner module, --no-enum-limit, or --healthcheck with --level Full or --server), AND the
    on-disk Image is NOT one of the original PingCastle filenames. Read the OriginalFileName and the
    full CommandLine from the triggering event to verify which of those criteria fired.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run an Active Directory assessment tool?
  context: Legitimate AD audits and security assessments do run PingCastle, and an authorized auditor
    or domain administrator performing a scheduled review is a routine explanation. Knowing whether
    this user role and host function are consistent with running an AD enumeration tool is often the
    fastest path to distinguishing a sanctioned assessment from reconnaissance by an intruder.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: When a binary is renamed, the PE metadata (OriginalFileName) and code-signing details still
    reflect the original tool. Comparing the Image path (the name on disk) against OriginalFileName
    (here, a PingCastle name) reveals the masquerade. The signing party and signature status indicate
    whether this is the genuine PingCastle build, a re-signed or unsigned copy, or a tampered binary.
    The file hash enables reputation lookups to confirm whether it matches a known PingCastle release
    or an unknown sample requiring deeper analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did this renamed PingCastle binary arrive on the host?
  context: 'Renamed binaries do not appear spontaneously -- they were copied from another location,
    downloaded, or dropped by a parent process. Tracing the file-creation event for this binary by its
    on-disk name reveals the delivery mechanism: a download tool, an archive extraction, a manual copy
    via remote access, or lateral movement from another host. A binary that landed in a user-writable
    location (Public, Temp, AppData, ProgramData) shortly before execution points to operator staging
    rather than an installed audit tool.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: Which PingCastle scanner or healthcheck modules were run, and what AD data did they target?
  context: The full command line reveals exactly what enumeration was performed. Decode the
    PingCastle flags - --scanner modules such as localadmin, share, smb, nullsession, spooler,
    zerologon, or laps_bitlocker each query a specific weakness across the domain, while --healthcheck
    --level Full or --healthcheck --server runs a full domain health assessment, and --no-enum-limit
    removes the cap on enumerated objects. Note the --server value to see which domain was targeted.
    This scopes to all executions of this binary on the host within the window, so multiple sequential
    invocations that form one assessment run are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this binary and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. An AD audit launched interactively by
    an administrator typically descends from explorer.exe or a console, while invocation from a script
    host (wscript.exe, cscript.exe), a remote-execution service, a batch wrapper, or an unexpected
    shell points to scripted or operator-driven reconnaissance. The immediate parent is visible in the
    alert; this retrieves the parent's own details so the chain above it can be examined.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: The purpose of renaming a binary is to evade detection while performing its function.
    Examining the child processes, file writes, and follow-on activity from this binary reveals its
    actual objective - PingCastle commonly writes HTML/XML report files and may be followed by further
    enumeration or credential-access tooling. Additionally, the same renamed binary appearing on
    multiple hosts suggests deliberate distribution rather than an isolated assessment.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this binary spawn afterward?
  context: The processes spawned by the tool reveal its immediate impact. PingCastle scanning is
    largely self-contained, so spawned interpreters or utilities (cmd.exe, powershell.exe,
    certutil.exe, archive tools, or other reconnaissance binaries) in the minutes after execution
    point to a broader hands-on-keyboard sequence rather than a standalone audit run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1202.network_connection
  question: Did this binary or its children open outbound network connections, and to which destinations?
  context: PingCastle scanner and healthcheck modules query domain controllers and member systems over
    SMB, LDAP, and RPC, so connections to internal AD infrastructure are expected for a genuine
    assessment. Outbound connections to external addresses, or to hosts outside the assessed domain,
    suggest data exfiltration of the report or operator command-and-control rather than an internal
    audit. Review the destinations against known AD infrastructure and egress baselines.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: template:cue_process_tool.baseline
  question: Does this host normally run a PingCastle binary?
  context: A tool that has never been seen on a host is more suspicious than one that runs regularly. A
    zero or very low historical count over the past 90 days indicates first-time or rare execution of
    PingCastle on this endpoint, which weighs against a routine scheduled audit.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: Even sanctioned tools can be abused. The query mirrors the rule's selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this specific PingCastle
    firing pattern has historically run here - not generic binary usage. A new parent process, an
    unexpected user account, or an unusual command-line shape relative to that history is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName:
        - PingCastleReporting.exe
        - PingCastleCloud.exe
        - PingCastle.exe
      - CommandLine|contains:
        - --scanner aclcheck
        - --scanner antivirus
        - --scanner computerversion
        - --scanner foreignusers
        - --scanner laps_bitlocker
        - --scanner localadmin
        - --scanner nullsession
        - --scanner nullsession-trust
        - --scanner oxidbindings
        - --scanner remote
        - --scanner share
        - --scanner smb
        - --scanner smb3querynetwork
        - --scanner spooler
        - --scanner startup
        - --scanner zerologon
      - CommandLine|contains: --no-enum-limit
      - CommandLine|contains|all:
        - --healthcheck
        - --level Full
      - CommandLine|contains|all:
        - --healthcheck
        - '--server '
      filter_main_img:
        Image|endswith:
        - \PingCastleReporting.exe
        - \PingCastleCloud.exe
        - \PingCastle.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this PingCastle firing pattern - not generic usage of the binary. Many hosts
    firing the same pattern points to scripted deployment or a vendor assessment automation; one host
    or a small unrelated set points to manual operator activity. Use the host distribution and
    parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName:
        - PingCastleReporting.exe
        - PingCastleCloud.exe
        - PingCastle.exe
      - CommandLine|contains:
        - --scanner aclcheck
        - --scanner antivirus
        - --scanner computerversion
        - --scanner foreignusers
        - --scanner laps_bitlocker
        - --scanner localadmin
        - --scanner nullsession
        - --scanner nullsession-trust
        - --scanner oxidbindings
        - --scanner remote
        - --scanner share
        - --scanner smb
        - --scanner smb3querynetwork
        - --scanner spooler
        - --scanner startup
        - --scanner zerologon
      - CommandLine|contains: --no-enum-limit
      - CommandLine|contains|all:
        - --healthcheck
        - --level Full
      - CommandLine|contains|all:
        - --healthcheck
        - '--server '
      filter_main_img:
        Image|endswith:
        - \PingCastleReporting.exe
        - \PingCastleCloud.exe
        - \PingCastle.exe
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run an Active Directory assessment tool?
  context: Compare this user's current action against their historical behavior. A user who has never
    run PingCastle is more suspicious than one who does so regularly; the user's role and typical
    toolset should align with running a domain-wide AD enumeration tool. A non-administrative or
    service account running this tool is a notable deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or environment-wide?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: which parent process spawned this binary, and
    whether that pair is historically common. A new or rare parent for this binary on this host or
    environment-wide is the deviation worth chasing; a pair that already accounts for thousands of
    prior events is an assessment automation or scheduled task.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity on
    multiple endpoints. If the same user triggered AD enumeration or other tooling on several hosts in
    the alert window, the scope of the operation may extend beyond this endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the alert window?
  context: 'Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise, since every host runs system-owned agents constantly. The meaningful
    question is whether the same launch mechanism - parent process plus spawned binary - fired on
    other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this enumeration, what happened after, and whether it is part of a larger
    sequence. Look for reconnaissance, credential access, archive staging, or lateral-movement tooling
    in the surrounding window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering,
    reconnaissance, or credential access - may reveal the attack stages that preceded this AD
    enumeration and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
