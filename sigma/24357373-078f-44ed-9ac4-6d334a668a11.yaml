name: Direct Autorun Keys Modification
id: 483e4c1e-0221-4762-a536-cb3aeecfc258
description: |
  Detects reg.exe being used to add a value under an autostart extensibility point (ASEP) registry key — the Run/RunOnce keys, Winlogon Userinit/Shell, the Windows NT load value, or the SafeBoot AlternateShell. The rule fires when reg.exe (or a binary whose OriginalFileName is reg.exe) runs with "add" AND a command line that references one of these known persistence locations. Legitimate installers and administrators register autoruns this way, so the investigation determines who modified the key, what executable or script the value points to, and whether the change is part of an authorized deployment or an attempt to survive logon/reboot.
type: detection
detection_id: 24357373-078f-44ed-9ac4-6d334a668a11
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did reg.exe run with "add" against a known autostart registry key (Run, Winlogon, or SafeBoot)?
  context: Before investing investigation time, confirm the alert is a true positive. Review the exact command line and confirm it is reg.exe (or a binary whose OriginalFileName is reg.exe) performing an "add" that names one of the autostart keys — Run/RunOnce, Winlogon Userinit/Shell, the Windows NT load value, or the SafeBoot AlternateShell. All three conditions must hold for this rule to fire.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:parent_child.parent_process_legitimacy
  question: What process spawned reg.exe, and what started that parent?
  context: The parent-child relationship is the core signal for distinguishing legitimate from malicious autorun registration. An installer or admin script spawning reg.exe (msiexec.exe, an interactive cmd.exe, a deployment agent) reads differently from a browser, Office application, mshta.exe, or wscript.exe spawning it. Tracing the parent's own origin reveals whether the chain began with a user action or with exploitation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to register autostart entries via reg.exe?
  context: Legitimate administrative activity and software installation can trigger this detection. Knowing whether the user role and host function are consistent with editing autostart registry keys is often the fastest path to distinguishing a routine install from an unauthorized persistence change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for this autostart change?
  context: Many organizations require change tickets for persistence-relevant modifications such as autostart registry edits. A corresponding ticket or an active deployment window suggests authorized activity; absence of one when policy requires it suggests the change was unauthorized. This check can quickly close false positives or escalate true positives.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:registry.registry_key_context
  question: Which exact autostart key and value were written, and what executable or script does the value point to?
  context: The registry_set event linked to this process gives the actual key path and value data as structured fields. Identify the precise location (a per-user HKCU\...\Run key, machine-wide HKLM Run, Winlogon Userinit/Shell, or the SafeBoot AlternateShell) and read the value data — it names the executable or script that will run at logon or boot. That path and its location (System32 vs. a user-writable directory) are the heart of the disposition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: Attackers who set one autostart key often modify several — adding a Run value while also disabling Defender or changing firewall rules. Finding a cluster of reg.exe write operations (add/delete/import) from this host within a short window reveals the full scope of configuration changes and whether multiple objectives were pursued alongside the persistence entry.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:registry.registry_value_persistence_check
  question: Does the referenced executable or script exist on disk, and what is it?
  context: An autostart entry is only effective if the payload it references actually exists at that path. If the Run value points to something like C:\Users\Public\update.exe, confirming the file is present and analyzing its hash determines whether the persistence mechanism is live and what it would execute on the next logon or boot. The %file_paths% placeholder should resolve to the executable path extracted from the registry value data; if it is not available, read the path from the command line and check it manually.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: If a suspicious parent spawned reg.exe, it likely spawned other processes too. Examining siblings reveals the full scope of activity from that parent — multiple suspicious children launched alongside the autostart edit points to malicious orchestration rather than an isolated install step.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_add:
        CommandLine|contains: add
      selection_cli_keys:
        CommandLine|contains:
        - \software\Microsoft\Windows\CurrentVersion\Run
        - \software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell
        - \software\Microsoft\Windows NT\CurrentVersion\Windows
        - \system\CurrentControlSet\Control\SafeBoot\AlternateShell
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_add:
        CommandLine|contains: add
      selection_cli_keys:
        CommandLine|contains:
        - \software\Microsoft\Windows\CurrentVersion\Run
        - \software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell
        - \software\Microsoft\Windows NT\CurrentVersion\Windows
        - \system\CurrentControlSet\Control\SafeBoot\AlternateShell
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple endpoints. If the same user triggered similar autostart changes or other tooling on several hosts in this window, the scope of the activity may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_add:
        CommandLine|contains: add
      selection_cli_keys:
        CommandLine|contains:
        - \software\Microsoft\Windows\CurrentVersion\Run
        - \software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell
        - \software\Microsoft\Windows NT\CurrentVersion\Windows
        - \system\CurrentControlSet\Control\SafeBoot\AlternateShell
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even routine tools get abused. This query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects how this specific autostart-modification pattern (not generic reg.exe usage) has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_add:
        CommandLine|contains: add
      selection_cli_keys:
        CommandLine|contains:
        - \software\Microsoft\Windows\CurrentVersion\Run
        - \software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell
        - \software\Microsoft\Windows NT\CurrentVersion\Windows
        - \system\CurrentControlSet\Control\SafeBoot\AlternateShell
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the autostart change reveals the immediate context: what led to it, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, payload drops, or additional persistence mechanisms in the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:lolbin.renamed_binary_check
  question: Was reg.exe executed from its expected System32 or SysWOW64 path?
  context: reg.exe run from a non-standard location (outside System32 or SysWOW64) may indicate the binary was copied or renamed to evade path-based allowlists. Compare the Image path against OriginalFileName — a reg.exe running from a user temp or download directory is more suspicious than one in System32.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this rule's reg.exe autostart pattern over the past 90 days, and what command-line structures are typical?
  context: An autostart-modification pattern with no prior history on a host is more suspicious than one used regularly under stable parents. This query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern (not generic reg.exe usage). The CommandLine projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_add:
        CommandLine|contains: add
      selection_cli_keys:
        CommandLine|contains:
        - \software\Microsoft\Windows\CurrentVersion\Run
        - \software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell
        - \software\Microsoft\Windows NT\CurrentVersion\Windows
        - \system\CurrentControlSet\Control\SafeBoot\AlternateShell
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After establishing one foothold (the autostart entry), they commonly add backups using different techniques — scheduled tasks, services, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's autostart pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the autostart-modification pattern (not generic reg.exe usage). Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_add:
        CommandLine|contains: add
      selection_cli_keys:
        CommandLine|contains:
        - \software\Microsoft\Windows\CurrentVersion\Run
        - \software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit
        - \software\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell
        - \software\Microsoft\Windows NT\CurrentVersion\Windows
        - \system\CurrentControlSet\Control\SafeBoot\AlternateShell
      condition: all of selection_*
    fields:
    - host.name
