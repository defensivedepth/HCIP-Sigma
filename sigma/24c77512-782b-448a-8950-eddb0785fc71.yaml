name: SQLite Chromium Profile Data DB Access
id: 3492eb36-a2ed-4ab3-a0c1-ce9c307b9405
description: |
  Detects a standalone SQLite command-line binary (sqlite.exe or sqlite3.exe, or a process with Product
  "SQLite") opening Chromium-based browser profile databases. The rule fires only when all three conditions
  hold together: the SQLite binary identity, a Chromium profile path in the command line (\User Data\,
  \Opera Software\, or \ChromiumViewer\), and a sensitive data store name (Login Data, Cookies, Web Data,
  History, or Bookmarks). Browsers read these SQLite stores through their own process; a separate sqlite
  tool reading them is a hallmark of credential and session-cookie theft staged for collection or
  exfiltration. The investigation should confirm which stores were targeted, whether the user and host
  normally run database tooling against browser profiles, and whether the access was followed by archiving,
  outbound transfer, or use of the stolen sessions.
type: detection
detection_id: 24c77512-782b-448a-8950-eddb0785fc71
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show a SQLite binary opening a Chromium profile path AND a sensitive store name (Login Data, Cookies, Web Data, History, or Bookmarks)?
  context: >-
    The rule fires only when all three conditions match together: the process is a SQLite binary
    (Product SQLite, or Image ending in \sqlite.exe / \sqlite3.exe), the command line contains a Chromium
    profile path (\User Data\, \Opera Software\, or \ChromiumViewer\), and the command line names a
    sensitive store (Login Data, Cookies, Web Data, History, or Bookmarks). Confirm all three are present
    in the alerting command line before investing further; a partial match is not what this rule detects.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run a standalone SQLite tool against browser profile databases?
  context: >-
    Legitimate browser-data access happens inside the browser process itself. A developer, forensics
    workflow, or backup utility may occasionally run a standalone SQLite tool against a profile database,
    but for most users and hosts this is unusual. Knowing whether the user role and host function involve
    database tooling against browser stores is often the fastest way to separate a routine operation from
    credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Which browser credential and session stores were targeted, and what exact query or arguments were passed?
  context: >-
    The command line names which store was opened — Login Data holds saved passwords, Cookies and Web Data
    hold session tokens and autofill, History and Bookmarks expose browsing context. Decode the full
    argument list to determine whether the access was a single store read or a sweep across multiple stores,
    and whether a SQL statement or .dump/.read command was used to extract rows. The specific store
    targeted determines which accounts and sessions may be compromised and what remediation is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1539.process_access
  question: Did any tool open a memory handle into a running browser process around this event?
  context: >-
    Session cookies and credential material can be stolen two ways: by reading the on-disk SQLite stores
    (what this rule detects) or by reading the memory of a live browser process. A process opening a handle
    into chrome.exe, msedge.exe, brave.exe, or opera.exe — especially with read or full-control access
    rights — points to in-memory extraction running alongside the on-disk access. The source process and
    granted-access mask distinguish memory inspection from ordinary inter-process activity. If
    process-access telemetry is not collected in this environment, treat zero results as a visibility gap
    rather than evidence nothing occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith:
          - \chrome.exe
          - \msedge.exe
          - \brave.exe
          - \opera.exe
          - \vivaldi.exe
      condition: selection
    fields:
      - SourceImage
      - TargetImage
      - GrantedAccess
      - CallTrace
- source: template:cue_process_tool.process_chain
  question: What process spawned this SQLite tool, and is that parent chain expected?
  context: >-
    The parent process reveals how the SQLite tool was invoked. Interactive use launched from explorer.exe
    or a console session differs sharply from invocation by a script host, an Office application, or an
    unfamiliar downloader. An unexpected parent — wscript.exe, mshta.exe, a freshly written binary in a
    user-writable directory — points to scripted credential collection rather than a deliberate
    administrative or developer action.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which user and accounts own the targeted browser profile, and do any have elevated privileges?
  context: >-
    The severity of browser credential and session theft depends on whose profile was read and what those
    saved credentials unlock. A profile belonging to a domain administrator, a user with access to privileged
    web consoles, or a shared service workstation requires escalation; a standard user's personal browsing
    profile may need only password resets and session invalidation. Cross-reference the profile owner with
    directory group memberships to scope the exposure.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:data_staging_exfil.data_scope
  question: What browser profile database files did the SQLite tool actually touch on this host?
  context: >-
    The command line shows the requested store name, but file telemetry shows which profile database files
    the tool actually opened or wrote — including any copies, temporary exports, or dumped output. Look for
    reads against Login Data, Cookies, Web Data, History, and Bookmarks under user profile directories, and
    for any new files the tool produced that could hold extracted rows. The set of files touched determines
    the true scope of what data was collected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:data_staging_exfil.archive_destination
  question: Where was the extracted browser data written or moved after the SQLite access?
  context: >-
    Collected credential and session data is usually written to a local file, then staged or moved before
    exfiltration. File events produced by the SQLite tool, and any subsequent copies or archives created from
    its output, reveal the staging location — a temporary directory, a user-writable folder, or removable
    media. Pivoting from the output file to outbound network activity from the same host shows whether the
    data left the endpoint.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:data_staging_exfil.encryption_password
  question: Did the command line apply any SQL filtering, output redirection, or encoding that determines what was extracted?
  context: >-
    A bare store read returns everything; a targeted SQL statement, a .dump/.read command, or output piped
    through encoding or compression indicates a deliberate extraction with a specific goal. Review the
    command line for SELECT statements, table names, output file flags, or any wrapping that would obfuscate
    or package the extracted rows. Deliberate filtering and packaging point to operator-driven theft rather
    than incidental tool use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run a SQLite command-line binary?
  context: >-
    A SQLite tool that has never run on this host, or runs only rarely, is more suspicious than one that
    appears regularly as part of an installed application or developer workflow. Zero or very low historical
    counts indicate first-time or rare execution and raise the priority of the browser-store access.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this SQLite-against-browser-store pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even a tool that runs occasionally can be abused. This query mirrors the rule's full selection structure
    scoped to this host, so the resulting parent and user distribution reflects how this specific firing
    pattern — SQLite reading Chromium profile stores — has historically run here, not generic SQLite usage.
    A new parent process, an unexpected account, or a first-time appearance of this pattern is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sql:
      - Product: SQLite
      - Image|endswith:
        - \sqlite.exe
        - \sqlite3.exe
      selection_chromium:
        CommandLine|contains:
        - \User Data\
        - \Opera Software\
        - \ChromiumViewer\
      selection_data:
        CommandLine|contains:
        - Login Data
        - Cookies
        - Web Data
        - History
        - Bookmarks
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sql:
      - Product: SQLite
      - Image|endswith:
        - \sqlite.exe
        - \sqlite3.exe
      selection_chromium:
        CommandLine|contains:
        - \User Data\
        - \Opera Software\
        - \ChromiumViewer\
      selection_data:
        CommandLine|contains:
        - Login Data
        - Cookies
        - Web Data
        - History
        - Bookmarks
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sql:
      - Product: SQLite
      - Image|endswith:
        - \sqlite.exe
        - \sqlite3.exe
      selection_chromium:
        CommandLine|contains:
        - \User Data\
        - \Opera Software\
        - \ChromiumViewer\
      selection_data:
        CommandLine|contains:
        - Login Data
        - Cookies
        - Web Data
        - History
        - Bookmarks
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether this browser-store access is isolated or
    part of a wider sweep. If the same user ran SQLite tooling against profile stores on multiple endpoints,
    or performed other collection activity elsewhere in the same window, the scope of compromise is larger
    than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sql:
      - Product: SQLite
      - Image|endswith:
        - \sqlite.exe
        - \sqlite3.exe
      selection_chromium:
        CommandLine|contains:
        - \User Data\
        - \Opera Software\
        - \ChromiumViewer\
      selection_data:
        CommandLine|contains:
        - Login Data
        - Cookies
        - Web Data
        - History
        - Bookmarks
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this SQLite-against-browser-store pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's full selection structure with no host scope, so the result is a fleet-wide
    count of this specific firing pattern rather than generic SQLite usage. Many hosts firing the same
    pattern points to scripted deployment or a bundled application that reads browser stores; one host or a
    small unrelated set points to manual operator activity. Use the host distribution and parent/binary
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sql:
      - Product: SQLite
      - Image|endswith:
        - \sqlite.exe
        - \sqlite3.exe
      selection_chromium:
        CommandLine|contains:
        - \User Data\
        - \Opera Software\
        - \ChromiumViewer\
      selection_data:
        CommandLine|contains:
        - Login Data
        - Cookies
        - Web Data
        - History
        - Bookmarks
      condition: all of selection_*
    fields:
    - host.name
