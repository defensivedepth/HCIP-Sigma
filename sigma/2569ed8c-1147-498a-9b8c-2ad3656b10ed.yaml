name: Potential Renamed Rundll32 Execution
id: ff62b479-b919-43d1-993c-6bbcc3535c81
description: |
  Detects a process invoked with 'DllRegisterServer' on its command line when the
  executable is not named rundll32.exe. The rule fires when the DllRegisterServer
  command-line pattern is present AND the Image does not end in \rundll32.exe.
  DllRegisterServer is the entry point rundll32.exe uses to register a DLL's COM
  server, so seeing that argument on a differently named binary suggests rundll32
  has been copied and renamed to blend in or to evade name-based detection.
  Legitimate installers occasionally ship a renamed loader, so investigation should
  establish the binary's true identity, how it arrived, and what it did after launch.
type: detection
detection_id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process carry 'DllRegisterServer' on its command line while running as something other than rundll32.exe?
  context: Confirm the alert is a true positive before investing time. The rule fires when the command line contains DllRegisterServer AND the Image does not end in \rundll32.exe. Read the exact command line and the on-disk binary name to verify both conditions hold.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to register DLLs from a non-rundll32 binary?
  context: Legitimate administrative activity and some installers can invoke DllRegisterServer through a vendor loader. Knowing whether the user role and host function involve DLL or COM-server registration is often the fastest way to separate routine operations from masquerading.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: The on-disk name is not rundll32.exe, but the PE metadata and signing details still reflect the original tool. Compare the Image path against OriginalFileName — an OriginalFileName of RUNDLL32.EXE on a differently named file confirms a renamed copy. The signing party and signature status indicate whether this is a Microsoft-signed system binary, a third-party signed tool, or unsigned/tampered. The hash enables reputation lookups to determine whether this is a known legitimate tool, a known malicious sample, or a novel binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did this renamed binary arrive on the host?
  context: 'A renamed rundll32 copy does not appear spontaneously — it was copied, downloaded, or dropped by a parent process. Tracing the file creation event by basename over a long window reveals the delivery mechanism: a download tool, a malware dropper, manual copy, or lateral movement. The Image field on the file_event shows which process wrote the file.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this renamed binary do? Decode the full command line and any DLL or exported function it targeted.
  context: The full command line reveals what was actually registered. Identify the DLL path passed alongside DllRegisterServer, any additional exported function names, and the working directory. Because DllRegisterServer runs an arbitrary exported entry point in the named DLL, the DLL path is the operative artifact — establish what it is and where it lives.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this renamed binary and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. A renamed rundll32 launched from explorer.exe, services.exe, or a known installer differs from one launched by mshta.exe, wscript.exe, an Office application, or a script interpreter, which point to macro or script-driven execution. Walk up the tree to see what spawned the parent and what else it spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did this renamed binary do after execution, and is the same binary present on other hosts?
  context: Renaming hides the tool while it performs its intended function. The child processes and follow-on activity from the renamed binary reveal its actual objective — DllRegisterServer is frequently used to side-load a malicious DLL whose registration routine launches further payloads. The same renamed binary appearing on multiple hosts suggests deliberate distribution rather than an isolated event; pivot on OriginalFileName or Hashes to confirm.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: How often has the DllRegisterServer pattern fired on this host before, and who ran it?
  context: A never-before-seen invocation is more suspicious than a recurring one. Because the renamed binary's name is arbitrary, this baseline counts the rule's command-line pattern (DllRegisterServer on a non-rundll32 image) rather than a specific file name, so a one-off result points to first-time activity worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: DllRegisterServer
      filter:
        Image|endswith: \rundll32.exe
      condition: selection and not filter
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even recurring patterns have a normal shape. The query mirrors the rule's selection scoped to this host, so the parent/user distribution reflects how this specific DllRegisterServer-on-non-rundll32 pattern has historically run here. A new parent process, an unexpected user, or an unusual command-line shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: DllRegisterServer
      filter:
        Image|endswith: \rundll32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the DllRegisterServer-on-non-rundll32 pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: DllRegisterServer
      filter:
        Image|endswith: \rundll32.exe
      condition: selection and not filter
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run DLL-registration activity of this kind?
  context: Compare this user's current action against their historical behavior. A user who has never invoked DllRegisterServer through a renamed binary is more suspicious than one who does so as part of a known role. User role and typical toolset should align with the detected behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains: DllRegisterServer
      filter:
        Image|endswith: \rundll32.exe
      condition: selection and not filter
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+binary launch combination historically routine on this host or across the environment?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent spawned this binary, and whether that pair is historically common. A new or rare parent for this binary is the deviation worth chasing; a pair accounting for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the event may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+binary combination fire on other hosts in the same window — is this a coordinated rollout or isolated to this host?
  context: Under a service principal, a user-wide pivot returns agent-telemetry noise because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus spawned binary — fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms appearing as novel parent-child pairs.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
