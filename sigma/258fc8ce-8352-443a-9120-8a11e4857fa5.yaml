name: Potential Arbitrary Command Execution Using Msdt.EXE
id: 38dbee9a-bf48-4d24-8a6c-07832aaf149a
description: |
  Detects msdt.exe (or a binary whose OriginalFileName is msdt.exe) running with command lines associated with
  the ms-msdt diagnostic handler abuse pattern. The rule fires when the msdt binary is present AND the command line
  matches EITHER the inline IT_BrowseForFile= form OR the answer-file form (a PCWDiagnostic token together with an
  -af answer-file parameter). Msdt is a Windows indirection utility that can be coerced into running arbitrary code
  supplied through a diagnostic package or answer file, so it executes payloads without the parent appearing to launch
  them directly. Legitimate msdt usage is driven by user-invoked troubleshooters from explorer or the control panel;
  malicious usage is typically launched from Office applications or scripting hosts and is followed by a secondary
  payload process or outbound connection. Determine which branch fired, what the command line actually does, what child
  process or network activity followed, and whether this user and host normally run diagnostic troubleshooters.
type: detection
detection_id: 258fc8ce-8352-443a-9120-8a11e4857fa5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event show msdt.exe running with EITHER the inline IT_BrowseForFile= command OR the PCWDiagnostic answer-file form?
  context: Confirm the alert is a true positive before investing time. The rule fires when the msdt binary (Image ending in msdt.exe or OriginalFileName msdt.exe) is present AND the command line matches one of two branches. Note which branch fired. The inline branch carries IT_BrowseForFile=, while the answer-file branch carries a PCWDiagnostic token together with an -af answer-file path. The answer-file branch is the more evasive form and means the payload is staged in a separate answer file rather than inline, so read the -af path and pull that file for review.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run Windows diagnostic troubleshooters?
  context: Legitimate msdt activity is usually a user manually launching a troubleshooter from the control panel or a help link. A server, a service account, or a user with no support role invoking msdt with these specific arguments is harder to explain as routine troubleshooting and shifts the disposition toward indirect execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the full msdt command line do? Decode the IT_BrowseForFile value or the answer-file path.
  context: The full command line reveals the action taken. For the inline branch, the IT_BrowseForFile= value points at the file or payload msdt was directed to open. For the answer-file branch, the -af parameter names an answer file (often staged locally or on a network share) that drives the diagnostic package. Read the referenced file or path to understand what code the diagnostic was set up to execute.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned msdt.exe and is that parent chain expected?
  context: The parent reveals how msdt was invoked. User-driven troubleshooting comes from explorer or control-panel hosts. A document application or a scripting host as the parent is consistent with an external link or macro coercing the diagnostic handler, which is the indirect-execution path of concern.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1202.follow_on
  question: What child processes did msdt.exe spawn afterward?
  context: Indirect execution through msdt shows its real impact in the child processes it launches. A secondary program such as powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe, curl.exe, or bitsadmin.exe spawning from msdt is the payload stage and is the strongest evidence that the diagnostic handler was used to run code rather than to troubleshoot.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1202.file_event
  question: What files did msdt.exe or its child processes write on this host around the alert?
  context: The diagnostic-handler abuse path frequently drops a staged answer file, a script, or a downloaded payload before or during execution. Files written by msdt or its spawned children in the alert window — particularly under user-writable locations such as the user profile, public, or temp directories — point to where the payload was staged and what was created on disk.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1202.network_connection
  question: Did msdt.exe or its child processes make outbound network connections around the alert?
  context: Indirect execution often pulls a payload from or beacons to an external host. Outbound connections initiated by msdt or its spawned children in the alert window — especially to addresses outside known-good administrative egress — indicate the diagnostic was used to reach a remote resource rather than to run a local troubleshooter. An answer file loaded from a network share is one such pattern.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- source: template:cue_process_tool.baseline
  question: Does this host normally run msdt.exe?
  context: A diagnostic binary that has never or rarely run on a host is more suspicious than one seen regularly. Zero or very low historical counts indicate first-time or rare execution and raise the weight of the current alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's msdt pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate diagnostic activity can be coerced. The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how the rule's specific firing pattern has historically run here, not generic msdt usage. A new parent, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      selection_cmd_inline:
        CommandLine|contains: IT_BrowseForFile=
      selection_cmd_answerfile_flag:
        CommandLine|contains: ' PCWDiagnostic'
      selection_cmd_answerfile_param:
        CommandLine|contains|windash: ' -af '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and (selection_cmd_inline or all of selection_cmd_answerfile_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      selection_cmd_inline:
        CommandLine|contains: IT_BrowseForFile=
      selection_cmd_answerfile_flag:
        CommandLine|contains: ' PCWDiagnostic'
      selection_cmd_answerfile_param:
        CommandLine|contains|windash: ' -af '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img and (selection_cmd_inline or all of selection_cmd_answerfile_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      selection_cmd_inline:
        CommandLine|contains: IT_BrowseForFile=
      selection_cmd_answerfile_flag:
        CommandLine|contains: ' PCWDiagnostic'
      selection_cmd_answerfile_param:
        CommandLine|contains|windash: ' -af '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_img and (selection_cmd_inline or all of selection_cmd_answerfile_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity on multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the incident may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      selection_cmd_inline:
        CommandLine|contains: IT_BrowseForFile=
      selection_cmd_answerfile_flag:
        CommandLine|contains: ' PCWDiagnostic'
      selection_cmd_answerfile_param:
        CommandLine|contains|windash: ' -af '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_img and (selection_cmd_inline or all of selection_cmd_answerfile_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one indirect-execution LOLBin often use several. If msdt was coerced into running code, check whether other proxy-execution binaries such as rundll32, regsvr32, mshta, msbuild, or installutil were also used on this host. Finding multiple proxy-execution LOLBins performing the same objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was msdt.exe executed from its expected System32 path?
  context: A binary whose OriginalFileName is msdt.exe but whose Image path is outside System32 or SysWOW64 may have been copied or renamed to evade path-based allowlists. Msdt running from a user profile, temp, or other user-writable directory is more suspicious than one in System32.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's msdt pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern, not generic msdt usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      selection_cmd_inline:
        CommandLine|contains: IT_BrowseForFile=
      selection_cmd_answerfile_flag:
        CommandLine|contains: ' PCWDiagnostic'
      selection_cmd_answerfile_param:
        CommandLine|contains|windash: ' -af '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and (selection_cmd_inline or all of selection_cmd_answerfile_*)) and _pb_scope
    fields:
    - CommandLine
