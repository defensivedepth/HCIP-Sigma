- source: template:cue_user_actor.follow_on_svc
  question: What other launches of this binary on this host followed in the next four hours, and does the parent or command-line structure change?
  context: 'Under a SYSTEM-context account, "what did this user do next" is unbounded. A more focused follow-on for automation-driven alerts is to track repeat invocations of the same binary on the same host: routine scheduled tasks repeat with stable parents and command-line structures; a deviation in parent or command-line in the follow-on window is the signal worth chasing.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
- source: template:cue_user_actor.scope_svc
  question: Did this same rule fire on other hosts in the past 24 hours, and does the cross-host pattern look like automation or an isolated detection?
  context: 'Under a SYSTEM-context account, "alerts for this user across hosts" is meaningless because the account is omnipresent. The triage-useful question is whether this rule fires on multiple hosts: a rule firing across many hosts on the same day is probably tracking scheduled or pushed automation; a rule firing on one host alone is the deviation worth chasing.'
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.name|expand: '%rule.name%'
      condition: selection
    fields:
      - host.name
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of credential theft depends on the privilege level of the accounts exposed. Domain-admin credentials require incident escalation; a standard user account may only need monitoring. Service accounts with broad access are also frequent targets. Cross-reference the accounts implicated by the targeted credential store against directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
