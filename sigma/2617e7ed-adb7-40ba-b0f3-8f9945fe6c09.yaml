  context: Tracking the account's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. Because the alert fires under a SYSTEM-context account, this user-identity view can return broad agent-telemetry volume; the launch-mechanism view scoped to the parent+binary is the complementary signal that filters that noise.
  range: +/-1h
  query: |
