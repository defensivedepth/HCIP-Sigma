name: Renamed FTP.EXE Execution
id: 948d0357-9946-4669-a280-002a8b2bde28
description: |
  Detects a process whose PE metadata OriginalFileName is ftp.exe but whose on-disk Image path does not end in \ftp.exe, indicating the FTP client has been copied or renamed away from its canonical System32/SysWOW64 location. ftp.exe is a living-off-the-land binary that can run a scripted command file and spawn cmd /c, making a renamed copy a way to evade name-based detection while performing file transfer or indirect command execution. Investigation should establish the binary's true identity and hash, how the renamed copy arrived, what it spawned, and any outbound connections it opened.
type: detection
detection_id: 277a4393-446c-449a-b0ed-7fdc7795244c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process carry OriginalFileName ftp.exe while running from an Image path that does not end in \ftp.exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the embedded PE OriginalFileName is ftp.exe AND the process Image does not end in \ftp.exe. Review the Image path and OriginalFileName on the triggering event to verify both conditions hold and the binary really is a relocated or renamed FTP client.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run the FTP client from a non-standard path?
  context: Legitimate administrative activity can trigger this detection. The canonical ftp.exe lives in System32 and SysWOW64; a copy under another path is unusual outside packaging, software bundles, or developer workflows. Knowing whether the user role and host function involve command-line file transfer is often the fastest way to separate routine operations from a renamed-binary masquerade.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: When a binary is renamed or relocated, the PE metadata OriginalFileName and the code-signing details still reflect the original tool. Here OriginalFileName says ftp.exe while the Image name on disk is something else. Compare the two, then use the signing party and signature status to tell whether this is the genuine Microsoft-signed FTP client copied elsewhere, a third-party signed tool, or an unsigned or tampered file. The hash enables a reputation lookup to confirm whether it matches the known legitimate ftp.exe or a modified binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: What were the full command-line arguments to the renamed FTP client, and do they reference a script file or remote host?
  context: The full command line reveals the action taken. ftp.exe accepts a -s:filename switch that runs a text file of FTP commands non-interactively, which is the common abuse path for unattended download or upload. Decode any -s:filename script-file argument, remote host, or inline command so you understand what transfer or indirect command the renamed client was driving.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:masquerading.binary_origin
  question: How did this renamed or relocated FTP client arrive on the host?
  context: 'A relocated ftp.exe did not appear spontaneously; it was copied from System32, downloaded, extracted from an archive, or dropped by a parent process. Tracing the file creation event for the binary by basename over a long window reveals the delivery mechanism and the process that wrote it. A user-writable landing directory such as Desktop, Downloads, Temp, or AppData points toward download or extraction; a system directory may indicate compromise of a privileged process or routine packaging.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this renamed FTP client, and is that parent chain expected?
  context: The parent process reveals how the renamed client was invoked. Interactive use launched from explorer.exe or a shell differs from invocation by a script host, an Office application, or a remote-execution tool. An unusual parent such as wscript.exe, mshta.exe, or a macro-enabled document points toward scripted or operator-driven abuse rather than routine file transfer.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did the renamed FTP client spawn after execution, and is the same renamed binary present on other hosts?
  context: The point of renaming a binary is to evade detection while it still performs its function. ftp.exe can run cmd /c as a child, so examine the child processes for command interpreters or secondary tools that indicate indirect command execution rather than a plain transfer. The same renamed binary appearing on multiple hosts suggests deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1202.network_connection
  question: Did the renamed FTP client or its children open outbound network connections, and to where?
  context: ftp.exe exists to move files over the network, so an outbound connection from the renamed client or a child it spawned is the effect this technique chain produces. Review the destination address and port to tell whether the egress matches an expected internal file server or reaches an external host, and whether the destination is a known-good transfer endpoint.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.follow_on
  question: What other child processes did this binary spawn on this host afterward?
  context: The processes spawned by a tool reveal its actual impact. A renamed FTP client that spawns command interpreters, script hosts, or download utilities is being used for indirect command execution or staging rather than file transfer alone. Unexpected children are the signal that the binary did more than its name implies.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run a copy of the FTP client from this path?
  context: A process that has never been seen on a host is more suspicious than one that runs regularly. A relocated ftp.exe with zero or very low historical counts indicates a first-time or rare placement, which weighs toward deliberate staging; a steady count may reflect a bundled or packaged copy that is routine here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this renamed-FTP pattern, what parents and users drove it, and does the current alert fit?
  context: Even relocated binaries can be routine in some environments. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_original:
        OriginalFileName: ftp.exe
      filter_img:
        Image|endswith: \ftp.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_original and not filter_img) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_original:
        OriginalFileName: ftp.exe
      filter_img:
        Image|endswith: \ftp.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_original and not filter_img) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_original:
        OriginalFileName: ftp.exe
      filter_img:
        Image|endswith: \ftp.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_original and not filter_img) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar activity on several hosts, the scope may be larger than a single endpoint and the renamed binary may be part of a coordinated operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_original:
        OriginalFileName: ftp.exe
      filter_img:
        Image|endswith: \ftp.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_original and not filter_img) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this renamed-FTP pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific firing pattern rather than generic FTP client usage. Many hosts firing the same pattern points to scripted deployment or packaging that relocated the binary; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_original:
        OriginalFileName: ftp.exe
      filter_img:
        Image|endswith: \ftp.exe
      condition: selection_original and not filter_img
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host such as reconnaissance, defense tampering, or credential access may reveal the stages that preceded a renamed binary being staged and run, and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
