name: Suspicious Usage of For Loop with Recursive Directory Search in CMD
id: e1f80391-78ad-4f54-b507-93e7caaf1e06
description: |
  Detects a cmd.exe 'for /f' loop combined with a 'tokens=' field selector and a recursive directory listing ('dir ... /s /b'). The pattern is fired by EITHER the alerting process's own command line OR its parent command line, so the alert may be the cmd.exe running the loop itself, or a child process the loop dynamically located and invoked (for example a powershell.exe found by enumerating for *shell.exe and then called with an execution-policy bypass). The construct is used to discover the full path of a system interpreter at runtime rather than referencing it directly, which evades static name-based detection. Investigation should determine which branch fired, decode the full loop and any binary it called, and trace the parent chain that produced the loop.
type: detection
detection_id: 2782fbd8-b662-4eb5-9962-5bfbfb671e7b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did the alerting command line, or its parent command line, contain a 'for /f' loop with a 'tokens=' selector and a recursive 'dir' search?
  context: |
    Confirm which branch of the detection fired before investing further time. The rule matches when the token set ('for /f', 'tokens=', 'in (', 'dir') appears EITHER in the alerting process's own CommandLine OR in its ParentCommandLine. If the loop is in the alerting process's CommandLine, the alert IS the cmd.exe running the FOR loop. If the loop is in the ParentCommandLine, the alert is a child the loop located and invoked (commonly the interpreter the 'dir ...*shell.exe' search resolved). Note which branch fired -- it determines whether the binary-origin and decode questions below apply to this process or to the parent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run cmd.exe FOR-loop directory searches that locate and launch interpreters at runtime?
  context: Runtime path discovery of an interpreter via a recursive 'dir' loop is uncommon in interactive administration; it is more typical of packaged loaders and scripted installers. If the user is a developer or the host runs a known software-distribution job that resolves binaries dynamically, this can be routine. If neither is true, the indirection itself is the signal worth pursuing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: What process started the FOR loop, and is that parent chain expected?
  context: The parent-child relationship is the core signal. Tracing the loop's own origin (its grandparent) reveals whether the chain is benign (a user double-clicked a shortcut, an installer ran) or suspicious (a document, archive, or shortcut file spawned cmd.exe which then ran the discovery loop). A loop launched from an Office application, a script host, or a recently opened shortcut is the higher-concern path.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn around the alert?
  context: If the FOR loop or its parent orchestrated multiple stages, the sibling processes reveal the full scope. The documented pattern of this construct continues past the loop into a located interpreter that reads bytes from a file and drops further payloads, so siblings may include the interpreter, a dropped script, or a hidden batch process.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.mechanism_decode
  question: Decode the full FOR-loop command. What directory was searched, what binary did it resolve, and what arguments did the loop pass to it?
  context: |
    The full loop reveals the operation. Read the 'dir' target (which directory tree and filename mask were enumerated, for example a recursive *shell.exe search under the WindowsPowerShell path), the 'tokens=' selector, and the 'do call'/'do' clause that invokes the resolved path. Capture any arguments handed to the located binary -- an execution-policy bypass or an encoded command passed to a discovered powershell.exe is the operative payload, not the loop itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - for /f
          - tokens=
          - in (
          - dir
      condition: selection
    fields:
      - CommandLine
      - ParentCommandLine
      - CurrentDirectory
- source: attack:T1027.010.obfuscation_check
  question: Does the command line resolved by the loop carry encoded or concatenated content, and what does it decode to?
  context: |
    Resolving an interpreter at runtime is frequently paired with an obfuscated argument so the payload is not visible in static rules. Look at the command the loop hands to the located binary for base64, hex, string concatenation, backtick or caret escaping, and environment-variable substitution. Decode it to recover the actual operation -- a download cradle, an in-memory loader, or a routine that reads bytes from a file and drops a further payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - ParentCommandLine
- source: attack:T1059.003.image_load
  question: After the loop resolved an interpreter, what modules did that interpreter load on this host around the alert?
  context: |
    When the loop locates and launches an interpreter (commonly powershell.exe), the modules it loads can distinguish a routine script host from a hosting cradle. Reflectively loaded or unusual managed-runtime modules around the alert time point to in-memory execution rather than a plain script run. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded, and rely on the command-line decode instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \powershell.exe
          - \pwsh.exe
          - \cmd.exe
      condition: selection
    fields:
      - Image
      - ImageLoaded
- source: template:universal.evidence_preservation
  question: Are the files referenced or dropped by the resolved command still on disk for analysis?
  context: This construct commonly enumerates files (including the launching shortcut), reads bytes from one of them, and writes a decoy document and a hidden batch payload to a temporary directory. Checking whether those artifacts still exist enables hashing, content review, or sandbox submission. Pull the dropped paths from the decoded command and confirm presence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_parent_process.follow_on
  question: What did the parent of the loop do in the hours after the alert?
  context: A loader that resolves an interpreter at runtime usually continues into later stages -- reconnaissance, a dropped payload, or persistence. Listing what the same parent spawned after the alert helps reconstruct the operation and shows whether the loop was a single step or one stage in a chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other process activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining surrounding activity reveals the immediate context: what led to the loop, what ran after, and whether a dropped script or batch payload executed. Novel parent-child pairs at low counts are what to scan for against the high-count routine telemetry.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.baseline
  question: Has this host run cmd.exe FOR-loop directory searches of this kind before?
  context: A discovery loop that resolves a binary path at runtime is rare on most endpoints. Zero or very low historical counts for this command pattern indicate first-time or anomalous use; a steady prior count points to a packaged installer or automation that already behaves this way on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - for /f
          - tokens=
          - in (
          - dir
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user run cmd.exe FOR-loop directory searches of this kind across the environment before?
  context: Compare this user's current action against their historical behavior. A user who has never produced a runtime path-discovery loop is more notable than one who does so as part of a known workflow. User role and typical toolset should align with running dynamic interpreter-resolution commands.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|all:
          - for /f
          - tokens=
          - in (
          - dir
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this FOR-loop directory-search pattern historically routine on this host or across the environment, regardless of which account ran it?
  context: |
    When the alert fires under a service or computer account, user identity does not attribute behavior; the meaningful pivot is whether this command pattern is itself routine here. A pattern that already accounts for many prior events on this host or env-wide is likely a packaged installer or vendor automation; a first-time appearance is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
          - for /f
          - tokens=
          - in (
          - dir
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on other endpoints. If the same user produced similar discovery-and-launch activity on multiple hosts in the window, the scope is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same FOR-loop directory-search pattern fire on other hosts in the same window, indicating a coordinated rollout rather than isolated activity?
  context: Under a service or computer account, network-wide user activity is mostly agent-telemetry noise. The meaningful question is whether the same command pattern fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger such as an opened shortcut.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
          - for /f
          - tokens=
          - in (
          - dir
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: 'Earlier detections on the same host -- shortcut or document execution, reconnaissance, defense tampering -- may reveal the stages that preceded the loop and help reconstruct the timeline. Look for an opened shortcut or script host immediately upstream of the discovery loop.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
