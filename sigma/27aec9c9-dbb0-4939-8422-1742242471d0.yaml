name: Invoke-Obfuscation VAR+ Launcher
id: 246eef23-9861-4d25-ae28-7eb09875cba8
description: |
  Detects a cmd.exe command line that builds and launches an obfuscated PowerShell payload using environment-variable
  assignment (set VAR=...) combined with the PowerShell format operator (-f) and numeric format placeholders such as {0}{1}.
  This is a hallmark of the VAR+ transform family of a public PowerShell-obfuscation framework: the command stores reordered
  fragments in a variable and reassembles a cmdlet at runtime to defeat signature matching. The pattern is almost never
  produced by legitimate administration; when it fires, the obfuscation itself is the indicator. Investigation should confirm
  the command, reconstruct what the format-operator expression decodes to, identify the PowerShell payload it launches, and
  determine whether a follow-on download, in-memory load, or child process resulted.
type: detection
detection_id: 27aec9c9-dbb0-4939-8422-1742242471d0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-05'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show a cmd.exe set-variable obfuscation that reassembles a PowerShell command with the -f
    format operator?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when a single cmd.exe
    command stores fragments in an environment variable (set XXX=...), then uses numeric format placeholders such as {0}{1}
    and the -f format operator to rebuild a cmdlet at runtime. Verify that the set-assignment, the {n} placeholders, and the
    -f operator are all present together rather than a benign batch script that happens to use set.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run cmd.exe one-liners that build PowerShell commands through variable substitution?
  context: Legitimate administration rarely reassembles PowerShell cmdlets from reordered fragments at runtime; that pattern is
    characteristic of obfuscation tooling. Knowing whether this user role and host function involve any scripted or hands-on
    PowerShell work at all is often the fastest way to separate a developer or red-team test from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this obfuscated PowerShell launcher part of an authorized penetration test or red team engagement?
  context: The VAR+ obfuscation transform is produced by a publicly available offensive PowerShell framework that is also used
    in authorized security assessments. Before investing investigation time, check whether a pentest or red team exercise is
    currently active on this host or network segment. An authorized engagement with matching tooling and timing resolves the
    alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What does the obfuscated command actually do once the format-operator expression is resolved?
  context: The full command line reveals the operation behind the obfuscation. Reconstruct the -f format expression by
    substituting each {n} placeholder with its corresponding argument from the trailing list, then reassemble the
    environment-variable contents to recover the cmdlet that runs. The decoded result typically resolves to a download cradle,
    an Invoke-Expression call, or an in-memory loader. The query returns matching obfuscation events on this host so a
    multi-stage operation built from several invocations can be read together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|re: cmd.{0,5}(?:/c|/r)(?:\s|)\"set\s[a-zA-Z]{3,6}.*(?:\{\d\}){1,}\\\"\s+?\-f(?:.*\)){1,}.*\"
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: How is the payload obfuscated, and what does it decode to?
  context: This transform hides intent by storing reordered string fragments in a variable and reassembling them at runtime
    with the -f format operator and {n} placeholders, often combined with backtick escaping, type-cast concatenation, and
    random casing. Reconstruct the format expression and the variable contents to recover the real cmdlet -- common results
    are a download cradle (Net.WebClient.DownloadString, IEX(IWR(...))), an ASCII-integer array joined into a command, or a
    reflective assembly load indicating fileless execution. Decoding reveals the payload source and what gets executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: What operation does the reconstructed PowerShell command perform?
  context: The obfuscation framework is multi-purpose -- the reassembled command may download and execute a remote payload,
    load a .NET assembly into memory, establish a reverse shell, or stage data. Identifying which cmdlet and arguments the
    format expression resolves to determines the scope of potential compromise and the required response. Focus on the verb
    (download, invoke, load) and the target (URL, file path, assembly) recovered from the decoded string.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging records the deobfuscated script that PowerShell actually executed, even when the launcher
    command line is obfuscated with variable substitution and the format operator. This is ground truth for what ran,
    bypassing the runtime string rebuilding -- the recovered cmdlet, any download URL, and any in-memory load. If PowerShell
    operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence
    nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators commonly disable or bypass PowerShell security controls before running an obfuscated payload. Common
    techniques include AMSI bypass (patching amsi.dll in memory), execution-policy changes (Set-ExecutionPolicy or an -ep
    bypass flag), and PowerShell downgrade attacks (running version 2, which lacks logging). Finding these precursor events
    on the host in the hour before the launcher strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this cmd.exe launcher spawn afterward?
  context: The launcher's purpose is to start an obfuscated PowerShell payload, so the child it spawns reveals its actual
    impact. Expect powershell.exe or pwsh.exe; unexpected children such as additional script hosts, certutil.exe, or a
    network utility point to post-exploitation. Reviewing the direct children of the alerting process confirms whether the
    rebuilt command actually executed and what it launched.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1059.001.image_load
  question: After the launcher ran, did PowerShell on this host load .NET or scripting assemblies consistent with in-memory
    execution?
  context: Obfuscated launchers frequently end in a reflective assembly load or an Invoke-Expression cradle that hosts .NET
    automation in memory rather than writing a file. Reviewing module loads tied to PowerShell on this host around the alert
    surfaces the automation and management assemblies (System.Management.Automation, amsi.dll, clr.dll) and any unsigned or
    relocated DLL loaded from a user-writable path, which indicates fileless execution following the obfuscated command.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \powershell.exe
          - \powershell_ise.exe
          - \pwsh.exe
      filter_signed:
        Signed: 'true'
      condition: selection and not filter_signed
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- source: template:hacking_tool.tool_specific_artifacts
  question: Were files written to disk by the PowerShell payload this launcher started?
  context: Even obfuscated, in-memory-leaning payloads often drop staging files -- a downloaded second stage, a decoded script,
    or a dumped artifact -- into user-writable directories. Checking for file-creation events by the spawned PowerShell process
    confirms execution and reveals the scope of activity even if the original process has exited. Pair any file found with a
    hash lookup or sandbox submission.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \powershell.exe
          - \powershell_ise.exe
          - \pwsh.exe
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:universal.evidence_preservation
  question: Are the files referenced or dropped by the decoded command still on disk for analysis?
  context: If the reconstructed command downloaded or wrote a payload -- a second-stage script, a decoded executable, or a
    staged output file -- checking whether it still exists enables hash lookups, sandbox submission, or content review. The
    file paths are derived from the decoded command line rather than from the launcher itself, since the obfuscated command
    references them indirectly.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: cmd.{0,5}(?:/c|/r)(?:\s|)\"set\s[a-zA-Z]{3,6}.*(?:\{\d\}){1,}\\\"\s+?\-f(?:.*\)){1,}.*\"
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: cmd.{0,5}(?:/c|/r)(?:\s|)\"set\s[a-zA-Z]{3,6}.*(?:\{\d\}){1,}\\\"\s+?\-f(?:.*\)){1,}.*\"
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar obfuscated execution on more than one host, the scope may be larger than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: cmd.{0,5}(?:/c|/r)(?:\s|)\"set\s[a-zA-Z]{3,6}.*(?:\{\d\}){1,}\\\"\s+?\-f(?:.*\)){1,}.*\"
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current
    alert fit?
  context: The query mirrors the rule's selection (the cmd.exe set-variable plus format-operator obfuscation) scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here.
    A new parent, an unexpected user, or an unusual command structure is the anomaly worth chasing. Zero prior firings makes this
    a first-of-kind event on the host.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: cmd.{0,5}(?:/c|/r)(?:\s|)\"set\s[a-zA-Z]{3,6}.*(?:\{\d\}){1,}\\\"\s+?\-f(?:.*\)){1,}.*\"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this obfuscation
    firing pattern rather than generic cmd.exe usage. Many hosts firing the same pattern points to scripted deployment or
    sanctioned tooling rollout; one host or a small unrelated set points to manual operator activity or a targeted intrusion.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: cmd.{0,5}(?:/c|/r)(?:\s|)\"set\s[a-zA-Z]{3,6}.*(?:\{\d\}){1,}\\\"\s+?\-f(?:.*\)){1,}.*\"
      condition: selection
    fields:
    - host.name
