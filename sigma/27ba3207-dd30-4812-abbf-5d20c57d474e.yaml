name: Suspicious Chromium Browser Instance Executed With Custom Extension
id: 3edc9416-814c-4ca9-b9e6-ca2e6a44f273
description: |
  Detects a script-host or proxy-execution parent (cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe,
  regsvr32.exe, rundll32.exe, wscript.exe) spawning a Chromium-based browser (brave.exe, chrome.exe, msedge.exe,
  opera.exe, vivaldi.exe) with the --load-extension= flag, which forces the browser to side-load an unpacked
  extension from a local directory. Legitimately, --load-extension is used by developers testing in-progress
  extensions, but a browser launched this way by a scripting interpreter is a known persistence primitive: an
  unpacked extension loaded from a user-writable path can monitor browsing, inject JavaScript into banking or
  webmail pages, and steal session cookies. The investigation should confirm the flag and extension path,
  identify what the parent interpreter executed, locate the extension directory on disk, and look for the
  follow-on file writes and outbound connections that an active malicious extension generates.
type: detection
detection_id: 27ba3207-dd30-4812-abbf-5d20c57d474e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show a Chromium browser launched with --load-extension= by a script-host parent?
  context: Confirm the alert is a true positive by reviewing the exact event. The rule fires only when all three
    conditions hold together — the parent ends in one of the script-host or proxy binaries (cmd, cscript, mshta,
    powershell, pwsh, regsvr32, rundll32, wscript), the child is a Chromium browser (brave, chrome, msedge, opera,
    vivaldi), and the command line contains --load-extension=. Read the value after --load-extension= to capture the
    extension directory path it points at.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to launch browsers with a custom extension from a scripting interpreter?
  context: Browser developers and a few automation workflows legitimately use --load-extension to load an in-progress
    extension, but they normally launch the browser from a shell or an IDE, not from cscript, mshta, regsvr32, or
    rundll32. Knowing whether this user develops extensions and whether this host is a developer workstation is often
    the fastest way to separate routine testing from a side-loaded persistence implant.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is this script-host parent expected to spawn a browser, and what started the parent itself?
  context: The parent-child relationship is the core signal here. A scripting interpreter launching a browser with
    --load-extension is unusual outside development workflows; tracing the parent's own origin (its grandparent and
    its command line) reveals whether the chain is a user double-clicking a script versus a delivered dropper that
    invoked the interpreter. Note what the parent's command line was — for script hosts it names the script that ran.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What is the full extension directory path passed to --load-extension=, and where does it live on disk?
  context: Decode the value after --load-extension= to find the unpacked extension directory. Extensions side-loaded
    for persistence are commonly dropped under user-writable locations such as AppData\Local or a temp directory; a
    path under a per-user profile, a recently created folder, or a randomly named directory is more suspicious than a
    well-known developer project path. Capture the directory so it can be inspected for the extension's manifest and
    background scripts.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '--load-extension='
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_parent_process.mechanism_decode
  question: What script or command did the parent interpreter execute that led it to launch the browser?
  context: The parent's own process_creation event shows what the interpreter was running — the script path for
    cscript or wscript, the inline command for cmd or powershell, the DLL and entry point for rundll32 or regsvr32.
    That command line reveals how the extension directory was staged and whether the same script also fetched a
    remote archive or unpacked an extension before launching the browser.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent instance spawn around this time?
  context: If the interpreter that launched the browser also spawned other processes, those siblings reveal the full
    scope of activity from this chain — an archive utility unpacking the extension, a download tool fetching it, or a
    command that deletes the staging artifacts afterward. Multiple suspicious children from the same parent instance
    points to scripted orchestration rather than a one-off launch.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1176.001.file_write
  question: What files did the browser process write or were dropped to the extension directory around the launch?
  context: A side-loaded extension exists as files on disk — a manifest, background and content scripts, and any
    data the extension persists. File writes by the browser process or into the extension directory shortly before or
    after the launch show what was staged and whether the extension is actively writing local state. Scope file
    events to the directory the launch command pointed at rather than the whole host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: attack:T1176.001.outbound_connection
  question: Did the browser process make outbound network connections to untrusted or unfamiliar domains after the extension loaded?
  context: A malicious extension typically calls home — registering the machine, fetching a list of monitored sites,
    and pulling per-site injection scripts on an interval. Outbound connections from the browser process to newly
    registered or unfamiliar domains shortly after the extension loaded are the follow-on signal that distinguishes an
    active credential-stealing extension from benign developer testing. Exclude the browser's normal update and
    telemetry endpoints when reviewing the destinations.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      filter_known:
        DestinationHostname|contains:
          - 'google.com'
          - 'gstatic.com'
          - 'microsoft.com'
          - 'mozilla.org'
          - 'brave.com'
          - 'opera.com'
          - 'vivaldi.com'
      condition: selection and not filter_known
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1176.001.registry_extension
  question: Were registry values written that register a browser extension or force-install one under HKCU or HKLM?
  context: Beyond a command-line --load-extension launch, extensions can be pinned through registry policy keys such
    as ExtensionInstallForcelist or the per-extension settings under the browser's policy hive, which survive reboots
    without re-running the script. Registry writes to these browser extension or policy paths on this host indicate a
    second, more durable persistence mechanism was layered on top of the observed launch.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ext_paths:
        TargetObject|contains:
          - '\Chrome\Extensions\'
          - '\Edge\Extensions\'
          - '\ExtensionInstallForcelist'
          - '\ExtensionSettings'
          - '\BraveSoftware\'
      condition: selection and selection_ext_paths
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_parent_process.baseline
  question: Has this script-host parent spawned this browser on this host before?
  context: A scripting interpreter spawning a Chromium browser is an unusual pairing. Zero or very low historical
    counts for this specific parent-child combination on this host indicate a novel spawning relationship rather than
    a recurring developer or automation workflow; a high count suggests an established, likely benign pattern worth
    confirming with the owner.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains: --load-extension=
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains: --load-extension=
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether this browser launch was an isolated action
    or part of broader activity spanning multiple endpoints. The same user staging extensions or running interpreters
    on several hosts in the same window widens the apparent scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains: --load-extension=
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: A browser-extension foothold is one persistence mechanism; attackers commonly stack backups using other
    techniques. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions installed in the same
    timeframe indicate intentional stacking rather than isolated activity.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — delivery, reconnaissance, or the script execution that staged the
    extension — may reveal the stages that preceded this launch and help reconstruct the timeline. The alert sequence
    on the host often tells the broader story leading to the extension side-load.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
