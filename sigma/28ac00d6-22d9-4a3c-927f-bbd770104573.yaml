name: RestrictedAdminMode Registry Value Tampering - ProcCreation
id: 7d2c9f3a-4e6b-4c1a-9f8d-2a1b3c4d5e6f
description: |
  Detects a command line that references both the LSA registry path
  \System\CurrentControlSet\Control\Lsa AND the DisableRestrictedAdmin value,
  the registry write that turns Remote Desktop RestrictedAdmin mode on or off.
  The rule fires only when both tokens appear on the same command line.
  Setting DisableRestrictedAdmin to 0 enables RestrictedAdmin mode, which lets
  an RDP connection authenticate without sending reusable credentials to the
  destination - useful for hardening, but also the precondition for
  Pass-the-Hash over RDP once an actor holds an administrator's hash. The change
  takes effect immediately with no reboot. Legitimate hardening and Group Policy
  rollouts also touch this value, so the investigation should determine which
  way the value was flipped, who and what process performed the write, and
  whether the change lines up with a documented change window or with nearby
  credential-access and lateral-movement activity.
type: detection
detection_id: 28ac00d6-22d9-4a3c-927f-bbd770104573
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line reference both the LSA control path and the DisableRestrictedAdmin
    value, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when one command line contains both \System\CurrentControlSet\Control\Lsa
    and DisableRestrictedAdmin. Read the exact command line and note which way the
    value was set - REG_DWORD 0 enables RestrictedAdmin mode (the Pass-the-Hash-enabling
    direction), while 1 disables it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to change RestrictedAdmin mode on this machine?
  context: Flipping the DisableRestrictedAdmin value is an uncommon administrative
    action. Hardening teams and a small number of IT operators set it deliberately;
    most users and most endpoints never touch it. Knowing whether the acting account
    and the host function are consistent with credential-delegation configuration is
    often the fastest path to separating a sanctioned hardening change from an actor
    preparing RDP-based credential reuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:registry.registry_key_context
  question: What value was written to DisableRestrictedAdmin, and was RestrictedAdmin
    mode enabled or disabled?
  context: The data written determines intent. DisableRestrictedAdmin under
    HKLM\System\CurrentControlSet\Control\Lsa set to REG_DWORD 0 enables RestrictedAdmin
    mode, which removes reusable credentials from the RDP session and is the value an
    actor flips to enable Pass-the-Hash over RDP; set to 1 it disables the mode. The
    change applies immediately with no reboot. Read the actual registry path and value
    data as structured fields rather than parsing them from the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:parent_child.parent_process_legitimacy
  question: What process performed this registry write, and what started that parent?
  context: The registry value can be set by reg.exe, by PowerShell, or via a remote
    mechanism such as WMI. Tracing the writing process and its own origin shows whether
    the change came from interactive administration (a user-launched console) or from
    an automated or remote execution chain. A script host, a remotely spawned process,
    or an unsigned binary in the lineage points to operator-driven tampering rather
    than routine maintenance.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: If the process that wrote the registry value was launched by a suspicious
    parent, that parent likely spawned other processes too. Examining siblings reveals
    the full scope of activity from that parent - for example a credential-dumping
    tool, an RDP client invocation, or other registry edits launched alongside the
    DisableRestrictedAdmin change strongly suggests an orchestrated sequence rather
    than a one-off configuration tweak.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same window?
  context: An actor enabling RestrictedAdmin mode for Pass-the-Hash often makes other
    registry edits around it - weakening other LSA or credential-delegation settings,
    or adding persistence. Finding a cluster of reg.exe add, delete, or import
    operations from the same user within a short window reveals the full scope of the
    configuration changes and whether multiple objectives were pursued alongside the
    DisableRestrictedAdmin write.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in
    the hour before the alert?
  context: Enabling RestrictedAdmin mode is a defense-evasion and credential-reuse
    enabler, and operators often weaken endpoint protection on the same host first.
    The query surfaces direct attempts to disable AV/EDR services, flip Defender flags,
    add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful signal
    that protection looks healthy; populated rows shift the disposition toward operator
    preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control\Lsa
        - DisableRestrictedAdmin
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control\Lsa
        - DisableRestrictedAdmin
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    RestrictedAdmin change was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar registry or RDP-related operations
    on other hosts, the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control\Lsa
        - DisableRestrictedAdmin
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    registry change reveals what led to it and what followed - credential access, an
    RDP client launch, or reconnaissance that the RestrictedAdmin tweak was meant to
    support. Novel parent-child pairs at low counts are what to scan for against the
    high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's DisableRestrictedAdmin
    pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate hardening can set this value. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern - a command line touching
    the LSA path and DisableRestrictedAdmin - has historically run here, not generic
    registry usage. A new parent process, an unexpected account, or a first-ever
    occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control\Lsa
        - DisableRestrictedAdmin
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's DisableRestrictedAdmin pattern in the
    past week, and does the cross-host distribution look like automation or one-off
    activity?
  context: The query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of this firing pattern rather than generic registry
    usage. Many hosts touching DisableRestrictedAdmin in the same period points to a
    scripted hardening deployment or vendor automation; one host or a small unrelated
    set points to manual operator activity. Use the host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control\Lsa
        - DisableRestrictedAdmin
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -
    credential access, reconnaissance, or defense tampering - may reveal the stages
    that preceded the RestrictedAdmin change. Enabling RestrictedAdmin mode for
    Pass-the-Hash typically follows credential harvesting, so a prior credential-access
    alert reframes this event as a lateral-movement preparation step.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for
    this RestrictedAdmin change?
  context: Credential-delegation settings are often governed by hardening policy, so a
    deliberate change to DisableRestrictedAdmin may map to an approved request or a
    Group Policy rollout. A corresponding ticket suggests authorized activity; absence
    of one when policy requires it suggests the change was unauthorized. This check can
    quickly close a hardening false positive or escalate a true positive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
