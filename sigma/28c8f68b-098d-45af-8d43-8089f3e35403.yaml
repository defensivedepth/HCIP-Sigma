name: Potential Register_App.Vbs LOLScript Abuse
id: 93694215-2321-4acf-a8df-a4185e1d188a
description: |
  Detects cscript.exe or wscript.exe (by image name or original file name) executing a
  command line that contains '.vbs -register ', the invocation pattern used by the Windows SDK
  register_app.vbs helper. That script registers a VSS/VDS provider DLL as a COM+ application,
  so a script host running it can load an arbitrary DLL under a trusted, signed interpreter as
  proxy execution. The rule fires only when both the script-host binary match and the
  '.vbs -register ' command-line fragment are present. Legitimate use is rare outside developer
  or imaging workflows; determine which VBS script and which DLL were registered, whether that
  DLL is signed and from an expected path, and whether the activity fits this host's history.
type: detection
detection_id: 28c8f68b-098d-45af-8d43-8089f3e35403
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the script-host plus '.vbs -register ' pattern this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact command line and binary
    against the rule's criteria, which require both a cscript.exe or wscript.exe execution and a
    command line containing the '.vbs -register ' fragment. Note which .vbs script was named and
    which provider DLL and description followed it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to register COM+ providers via a VBS script host?
  context: Registering a VSS/VDS provider DLL as a COM+ application is a developer or imaging
    workflow, not routine end-user activity. Knowing whether the user role and host function
    match this operation is often the fastest way to separate a true positive from sanctioned use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: Which VBS script and which provider DLL did the script host register, and from what paths?
  context: The full command line names the .vbs script, the provider name, the provider DLL, and a
    description. Decode each argument to identify the exact DLL being registered as a COM+
    application and where it lives on disk. A DLL in a user-writable or temporary directory, or a
    .vbs script that is not the legitimate SDK register_app.vbs, points away from sanctioned use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '.vbs -register '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this script host, and is that parent chain expected?
  context: The parent process reveals how the script host was launched. A developer or imaging
    workflow typically descends from explorer.exe or a known build or deployment tool. Script
    hosts spawned by Office applications, mshta.exe, browsers, or compression utilities suggest
    the registration command arrived through a delivery chain rather than an operator.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this script host spawn afterward?
  context: After a provider DLL is registered, follow-on execution can occur through the COM+
    application or directly from the script. Legitimate registration tends to terminate quietly;
    spawned cmd.exe, powershell.exe, rundll32.exe, or network tools indicate post-registration
    activity worth tracing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate tooling leaves a stable footprint. This query mirrors the rule's
    selection structure scoped to this host, so the parent and user distribution reflects how the
    '.vbs -register ' firing pattern has historically run here. A new parent, an unexpected user
    account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: '.vbs -register '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, giving a
    fleet-wide count of the '.vbs -register ' firing pattern rather than generic script-host
    usage. Many hosts firing the same pattern points to scripted deployment or imaging automation;
    a single host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: '.vbs -register '
      condition: all of selection*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: '.vbs -register '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: '.vbs -register '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or work spanning
    multiple endpoints. If the same user drove similar activity on several hosts, the scope of the
    activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: '.vbs -register '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context: what led to this event, what happened after, and whether it is part of a
    larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense
    tampering, reconnaissance, or credential access, may reveal the stages that preceded this
    registration and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one signed binary to proxy execution often reach for several. If a
    script host registered a DLL as a COM+ application, check whether rundll32.exe, regsvr32.exe,
    mshta.exe, or other signed binaries were also used to load or run code. Multiple signed
    binaries performing the same kind of proxy execution strengthens the case for malicious use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was the script host executed from an expected System32 or SysWOW64 path?
  context: A script host executed from a path outside System32 or SysWOW64 may indicate the binary
    was copied or renamed to evade path-based allowlists. A cscript.exe or wscript.exe running
    from a user's temp or download directory is more suspicious than one in its standard location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this script-host registration pattern over the past 90 days, and what command-line structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one used regularly
    under stable parents. This query mirrors the rule's selection structure scoped to this host,
    so the count reflects the '.vbs -register ' firing pattern rather than generic script-host
    usage. The command-line projection lets you compare typical invocation patterns against the
    alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: '.vbs -register '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - CommandLine
- source: attack:T1218.image_load
  question: After the registration, did the provider DLL load into a process on this host?
  context: Registering a provider DLL as a COM+ application is preparatory; the impact lands when
    that DLL is loaded into a host process such as dllhost.exe, svchost.exe, or the VSS or VDS
    service. Unsigned or unusually located DLLs loading shortly after the registration are the
    evidence that the proxy execution achieved code execution. If image-load events are not
    ingested in this environment, treat zero results as a visibility gap rather than proof nothing
    loaded.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_signed:
        Signed: 'true'
      condition: selection and not filter_signed
    fields:
      - Image
      - ImageLoaded
      - Signed
- source: attack:T1218.network_connection
  question: Did the script host or a freshly registered provider make outbound network connections in the alert window?
  context: Proxy execution through a signed binary is often used to retrieve or stage a remote
    payload, or to give a registered provider DLL command-and-control reach. Outbound connections
    from the script host, or from a process that loaded the new provider DLL, to an unfamiliar
    external address point toward retrieval or beaconing rather than a self-contained local
    registration. Connections to known enterprise destinations are expected and can be set aside.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
