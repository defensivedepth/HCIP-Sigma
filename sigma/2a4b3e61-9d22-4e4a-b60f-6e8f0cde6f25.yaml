name: Potential Provisioning Registry Key Abuse For Binary Proxy Execution
id: 5fdfb5d0-1c9e-4875-bb2f-252a8a5c3e98
description: |
  Detects a command line that writes to the provisioning command registry path
  SOFTWARE\Microsoft\Provisioning\Commands\, the staging step for indirect command
  execution through the signed system binary provlaunch.exe. An operator populates a
  multi-level subkey structure containing a Commandline value, then invokes
  provlaunch.exe to read and execute that command under a trusted, Microsoft-signed
  process; the keys are typically deleted after execution. Legitimate provisioning
  workflows touch this path rarely and from known management tooling, so the
  investigation should determine what command was staged, what process wrote it,
  and whether provlaunch.exe subsequently executed and loaded or reached out to
  anything unexpected.
type: detection
detection_id: 2a4b3e61-9d22-4e4a-b60f-6e8f0cde6f25
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line write to the provisioning command registry path this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact command line against the detection
    criterion -- a reference to SOFTWARE\Microsoft\Provisioning\Commands\. Note whether the command is
    creating the subkey structure (an add/set operation) and what command string it stages under the
    Commandline value, since that staged string is what provlaunch.exe will later execute.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to write provisioning command registry keys?
  context: Writing to the provisioning command path is uncommon outside of imaging and provisioning
    workflows. Knowing whether the user role and host function involve device provisioning is often the
    fastest way to separate legitimate setup activity from an operator staging proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:registry.registry_key_context
  question: What specific provisioning subkey and command value were written, and what command will provlaunch.exe execute?
  context: The provisioning command path requires a multi-level subkey structure ending in a Commandline
    value that holds the string to run. Retrieving the registry key path and the value written shows the
    staged command directly as structured fields rather than parsing it from the writing process's command
    line. The staged command string determines what executes under the signed provlaunch.exe process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:cue_process_tool.process_chain
  question: What process wrote these provisioning keys and is that parent chain expected?
  context: The parent process reveals how the registry write was invoked. A provisioning workflow driven
    by management tooling has a predictable chain; an interactive shell, a script host such as wscript.exe
    or mshta.exe, or an Office application as the parent points toward hands-on operator activity rather
    than routine provisioning.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host written to the provisioning command registry path before?
  context: A provisioning command write that has never been seen on a host is more suspicious than one that
    recurs as part of imaging or management automation. Zero or very low historical counts indicate
    first-time or rare use of this path on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: SOFTWARE\Microsoft\Provisioning\Commands\
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously written the provisioning command path, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even legitimate provisioning leaves a recurring signature. The query mirrors the rule's selection
    scoped to this host, so the resulting parent and user distribution reflects how this specific
    registry-write pattern has historically run here. A new parent process, an unexpected user account, or
    an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: SOFTWARE\Microsoft\Provisioning\Commands\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did the writing process spawn after staging the provisioning keys?
  context: The processes spawned by the writing process reveal whether key staging was immediately followed
    by execution. A provlaunch.exe invocation, a command interpreter, or a download utility launched by the
    same process points to an end-to-end proxy-execution sequence rather than an isolated configuration
    change.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Proxy-execution staging rarely stands alone. Activity surrounding the registry write may reveal
    reconnaissance, privilege escalation, persistence installation, or payload retrieval that provides
    broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts written the provisioning command path in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    this registry-write pattern rather than generic activity. Many hosts writing the same path points to
    scripted provisioning or management automation; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: SOFTWARE\Microsoft\Provisioning\Commands\
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally write provisioning command registry keys?
  context: Compare this user's current action against their historical behavior. A user who has never
    staged provisioning commands is more suspicious than one who does so as part of a provisioning role.
    User role and typical toolset should align with device provisioning.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains: SOFTWARE\Microsoft\Provisioning\Commands\
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent process that wrote this provisioning path historically routine on this host or across the environment, or is it unusual?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism: which parent process drove the provisioning write, and whether
    that parent is historically common for this pattern. A new or rare parent is the deviation worth
    chasing; a parent that already accounts for many prior provisioning writes is management automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: SOFTWARE\Microsoft\Provisioning\Commands\
      condition: selection
    fields:
      - ParentImage
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user staged similar provisioning writes or executed tools on multiple
    hosts, the scope of the activity may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same provisioning-write pattern fire on other hosts in the same window -- a coordinated rollout, or isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise. The meaningful question is whether the same provisioning-write pattern appeared
    on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: SOFTWARE\Microsoft\Provisioning\Commands\
      condition: selection
    fields:
      - host.name
      - ParentImage
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence. Look
    for reconnaissance, privilege escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, credential access -- may reveal the stages that preceded this event and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: An operator who stages one registry key often modifies several. Finding additional reg.exe
    write operations from the same host within a short window reveals whether the provisioning write was an
    isolated change or part of a broader configuration-tampering effort such as persistence keys or
    security-tool settings.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: attack:T1218.image_load
  question: After the keys were staged, did provlaunch.exe execute and what modules did it load?
  context: The signed system binary provlaunch.exe reads the staged provisioning command and runs it,
    loading the modules needed for whatever was staged. Reviewing what provlaunch.exe loaded on this host
    surfaces side-loaded or unsigned DLLs that would not appear in the registry-write event alone. If image
    load events are not collected in this environment, treat zero results as a visibility gap rather than
    evidence nothing executed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\provlaunch.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.network_connection
  question: Did provlaunch.exe or a process it launched make outbound network connections after the keys were staged?
  context: The command staged in the provisioning path can retrieve or execute remote payloads. Network
    connections originating from provlaunch.exe on this host indicate the staged command reached out rather
    than performing a purely local action. Compare any destinations against known enterprise endpoints; a
    connection to an unrecognized external host raises the priority of the investigation.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\provlaunch.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
