name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
id: 5ee42862-6246-4fb2-9e42-c5afe7913766
description: |
  Fires when a process whose image ends in ntdsutil.exe executes. ntdsutil is the built-in
  maintenance tool for the Active Directory database (NTDS.dit) and is legitimately used by
  domain administrators for offline defragmentation, snapshot/mount operations, and authoritative
  restores. The same tool can stage offline credential extraction: it can create a volume shadow
  copy of the system volume and copy NTDS.dit (which holds every domain account hash) to a path
  the operator can exfiltrate. Investigation should determine whether the invocation was scheduled
  AD maintenance by an expected administrator, or an interactive credential-access step — confirm
  the subcommand, check for an accompanying shadow-copy creation and NTDS.dit file access, and
  establish whether the host is a domain controller and the user is an expected AD operator.
type: detection
detection_id: 2afafd61-6aae-4df4-baed-139fa1f4c345
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this process invocation match the rule — an image ending in ntdsutil.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact image path and command line of the triggering event. Note the full subcommand string,
    since ntdsutil's behavior ranges from benign maintenance to NTDS.dit snapshot/copy depending
    entirely on the arguments supplied.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run ntdsutil against the directory database?
  context: ntdsutil is an administrative tool whose legitimate use is concentrated on domain
    controllers and on the accounts of AD operators performing maintenance. An invocation on a
    non-domain-controller, or under a user with no AD administration role, is far more likely to
    be a credential-access attempt than routine maintenance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Was NTDS.dit copied or accessed, and what subcommand did ntdsutil run?
  context: ntdsutil targets the NTDS.dit database, which holds every domain account credential.
    Decode the full command line to identify the subcommand — `ifm` / `create full` stages an
    install-from-media copy of NTDS.dit, `snapshot` plus `mount` exposes the volume so the database
    can be copied, and `activate instance ntds` precedes either. The subcommand distinguishes a
    benign defrag or restore from an offline credential-dumping step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned ntdsutil and is that parent chain expected?
  context: The parent process reveals how ntdsutil was invoked. Scheduled AD maintenance and backup
    jobs have predictable parents (services.exe, a backup agent, a maintenance script host).
    Interactive launch from cmd.exe, powershell.exe, or a remote-execution parent points to
    hands-on-keyboard activity. Backup-related parents are a documented benign source and can be
    expected on domain controllers.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1003.003.ntds_file_access
  question: Was NTDS.dit or a copy of it accessed or written under the NTDS directory or a staging path?
  context: An ntdsutil credential-extraction step leaves a file artifact — the database is copied
    out of `%SystemRoot%\NTDS\ntds.dit` into an install-from-media output directory or a staging
    path the operator can exfiltrate. File activity touching ntds.dit, or creation of an ntds.dit
    copy outside the live NTDS directory, is the concrete evidence that the database was actually
    captured rather than the tool merely being launched. Custom domain-controller storage layouts
    may place the database on a non-default volume, so confirm the directory in use for this host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: 'ntds.dit'
      condition: selection
    fields:
      - host.name
      - Image
      - TargetFilename
      - User
- source: attack:T1003.003.shadow_copy
  question: Was a volume shadow copy created on this host close in time to the ntdsutil invocation?
  context: Copying a live NTDS.dit requires bypassing the file lock, which ntdsutil does by creating
    a volume shadow copy of the system volume and mounting it. A shadow-copy creation within a few
    minutes of the ntdsutil invocation strongly corroborates an AD-database snapshot rather than an
    in-place maintenance operation. Correlate the shadow-copy timestamp against the alert time; a
    tight window (roughly five minutes) is the meaningful signal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_shadow:
        CommandLine|contains:
          - 'shadowcopy'
          - 'vssadmin'
          - 'create shadow'
          - 'Win32_ShadowCopy'
          - 'snapshot'
          - 'mount'
      condition: selection_host and selection_shadow
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
- source: template:cue_process_tool.baseline
  question: Does this host normally run ntdsutil?
  context: A domain controller under regular AD maintenance will show recurring ntdsutil executions;
    a host that has never run it before, or a member server with no AD role, showing a first-time
    invocation is the anomaly worth chasing. Zero or very low historical counts indicate first-time
    or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run ntdsutil, what parents and users normally drove it,
    and does the current alert fit that pattern?
  context: Even on a domain controller where ntdsutil is routine, the parent process and user that
    drive it are usually stable — a scheduled backup service or a specific AD operator. The query
    mirrors the rule's selection scoped to this host, so the resulting parent/user distribution
    reflects how ntdsutil has historically fired here. A new parent process, an unexpected user
    account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ntdsutil.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ntdsutil.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ntdsutil.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether credential access was one
    step in a broader operation. If the same user triggered related activity on multiple hosts —
    reconnaissance, lateral movement, or additional credential access — the scope of compromise may
    be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ntdsutil.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.follow_on
  question: What child processes did ntdsutil spawn afterward?
  context: The processes spawned by ntdsutil reveal its actual impact. A maintenance run has
    predictable, minimal children; a credential-dumping run may spawn cmd.exe, powershell.exe, or
    file-copy and compression utilities to stage and package the extracted database. Unexpected
    children point to post-extraction handling of the captured NTDS.dit.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context — what led to the ntdsutil run and what followed. Look for reconnaissance,
    privilege escalation, or staging that surrounds an attempt to capture the directory database.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: A captured NTDS.dit exposes every domain account hash, including Domain Admin, Enterprise
    Admin, krbtgt, and service accounts. If the database was actually copied, treat the exposure as
    domain-wide and escalate — replication or offline cracking of krbtgt enables forged Kerberos
    tickets. Cross-reference the operating user and the host's domain role to scope the blast radius.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, or privilege escalation — may reveal the stages that preceded the
    ntdsutil run and help reconstruct how the operator reached a position to target the directory
    database.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
