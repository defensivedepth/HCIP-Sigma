name: Wscript Shell Run In CommandLine
id: 4b9fc899-f023-4d72-866b-9816d0672366
description: |
  Detects a command line that contains the inline keywords "Wscript.", ".Shell" and ".Run" together, which corresponds to a
  process invoking CreateObject("WScript.Shell").Run to launch a child command. This pattern is common in script droppers
  embedded in HTA files and Office macros, where an inline VBScript shells out to a downloader or loader; it can also appear
  in legitimate inline scripting used by a small number of third-party applications or administrators. Investigation should
  determine what the .Run call actually launched, what spawned the scripting host, and whether the user and host are expected
  to run inline script automation.
type: detection
detection_id: 2c28c248-7f50-417a-9186-a85b223010ee
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain the inline Wscript.Shell.Run pattern this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The
    rule fires only when all three keywords "Wscript.", ".Shell" and ".Run" appear together in one command, the signature of
    a CreateObject("WScript.Shell").Run inline invocation. Read the full command to see what the .Run call was set to launch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run inline script automation?
  context: Legitimate administrative activity can trigger this detection. Inline WScript.Shell.Run calls appear in some
    third-party installers and admin scripts, so knowing whether the user role and host function involve inline scripting is
    often the fastest path to distinguishing routine operations from a script-borne dropper.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did the .Run call actually launch? Decode the full command line.
  context: The full command line reveals what the inline script shelled out to. Decode any encoded content, flags, file paths,
    or URLs passed to the .Run call. Inline WScript.Shell.Run droppers typically launch mshta, powershell, or cmd with a
    download-and-execute one-liner, so identify the launched binary and its arguments.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - Wscript.
          - .Shell
          - .Run
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned the host that ran this inline script, and is that parent chain expected?
  context: The parent process reveals how the inline script was invoked. Inline WScript.Shell.Run patterns are typically
    carried by HTA files run through mshta.exe or by Office documents, so parents such as mshta.exe, wscript.exe, cscript.exe,
    or an Office application point toward a macro or HTA-borne dropper rather than benign administrative scripting.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this command spawn afterward?
  context: The processes spawned by the inline .Run call reveal its actual impact. A benign script may spawn nothing unusual;
    a dropper typically spawns mshta.exe, powershell.exe, cmd.exe, or certutil.exe to fetch and execute a next-stage payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally produce the inline Wscript.Shell.Run pattern?
  context: A command pattern that has never been seen on a host is more suspicious than one that runs regularly. Zero or very
    low historical counts for the inline WScript.Shell.Run signature indicate first-time or rare execution; a steady count
    points to an installed application or admin script that uses inline scripting routinely.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - Wscript.
          - .Shell
          - .Run
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even routine inline scripting can be abused. The query mirrors the rule's selection structure scoped to this host,
    so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here.
    Deviations such as a new parent process, an unexpected user account, or an unusual command-line structure are the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Wscript.
        - .Shell
        - .Run
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Attacks typically involve multiple tools in sequence. Activity surrounding the detected inline script may reveal
    reconnaissance, downloaders, privilege escalation, or persistence installation that provides broader context for the
    investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern rather than generic scripting usage. Many hosts firing the same inline pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Wscript.
        - .Shell
        - .Run
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Wscript.
        - .Shell
        - .Run
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Wscript.
        - .Shell
        - .Run
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope of compromise may be larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Wscript.
        - .Shell
        - .Run
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, downloaders,
    privilege escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance,
    or credential access, may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
