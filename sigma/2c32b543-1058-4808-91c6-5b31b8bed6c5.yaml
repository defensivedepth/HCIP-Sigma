        Detection block is byte-identical to the brief (Image|endswith \Crassus.exe
        OR OriginalFileName Crassus.exe OR Description|contains Crassus, ANDed with
        host.name scope). The linter flags reflected_regression because the query
        has no CommandLine constraint — but this rule's own detection has no
        CommandLine selection (it matches on PE-metadata identity fields), so there
        is nothing to constrain on. The embedded selection already enforces the
        rule's exact firing pattern. No modification made; query left as composed.
    - template: cue_process_tool.scope
      reason: >-
        Detection block is byte-identical to the brief (same three PE-metadata
        identity alternatives, fleet-wide, no scope addition). Same reason as
        above: the rule has no CommandLine field, so the reflected_regression
        signal is a false positive. The embedded selection enforces the rule's
