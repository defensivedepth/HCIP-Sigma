      reason: "must_include in the remote_access_tool set, but the set was confirmed only by filename_prefix 'pua' — Crassus
        is not a remote access tool. It is an offline tool that parses local Process Monitor boot logs and generates source
        files; it performs no outbound network activity, so the template's network_connection query would return nothing
        meaningful (no relay/C2/tunnel destination exists by construction). Declined as not-applicable rather than authoring
        an empty network query; mechanism_decode and follow_on cover what the tool actually did."
