      reason: "RECOMMENDED tier, not must_include. Per its notes_to_llm, safe to drop when the cue_host_context.precursor
        question is present AND the rule is not execution/credential-centric. This rule fires on a privilege-escalation
        DISCOVERY tool (offline PML parsing), not payload execution or credential access; the precursor question (retained)
        already surfaces prior tamper alerts on the host. Generic host-tamper sweep does not earn a slot under the 18-question
        cap for a discovery rule."
