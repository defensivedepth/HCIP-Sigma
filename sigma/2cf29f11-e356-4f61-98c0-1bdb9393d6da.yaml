name: Renamed Visual Studio Code Tunnel Execution
id: 0e5952da-f940-42e7-88f8-9c7784f8d1c2
description: |
  Detects the Visual Studio Code command-line tool launching a remote tunnel, including cases where the binary has been
  renamed to evade name-based controls. The rule fires either when a process command line carries the tunnel invocation
  pattern (the `tunnel` subcommand, the server-license acceptance flag, or the internal tunnel-service markers) while the
  Image is not the genuine code.exe / code-tunnel.exe, OR when cmd.exe runs the staged tunnel-service launcher
  (`/d /c ... \servers\Stable-... code-server.cmd`) under a parent whose command line ends in ` tunnel`. The VS Code tunnel
  feature establishes an authenticated, outbound-only reverse channel through a Microsoft-hosted relay, giving an operator
  an interactive terminal and file browser over the target — a signed-binary remote access capability. Legitimate use exists
  (developers using remote development tunnels); the investigation should determine whether this tunnel was operator-initiated
  for command and control or is sanctioned development activity.
type: detection
detection_id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the Visual Studio Code tunnel pattern this rule detects, and which branch fired?
  context: >-
    Confirm the alert is a true positive before investing time. This rule fires on either of two distinct branches: the
    image branch matches a process whose command line carries a tunnel marker (`.exe tunnel`, `--accept-server-license-terms`,
    or the `tunnel service ... internal-run ... tunnel-service.log` set) while the Image is not the genuine code.exe or
    code-tunnel.exe; the parent branch matches cmd.exe running `/d /c ...\servers\Stable-... code-server.cmd` under a parent
    whose command line ends in ` tunnel`. Note which branch fired — the image branch points at a renamed or relocated tunnel
    binary, while the parent branch points at the staged tunnel-service launcher and makes the parent command line the
    load-bearing artifact for the masquerade and parent-origin questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a Visual Studio Code remote tunnel?
  context: >-
    Legitimate remote-development tunnels are run by developers and engineers; a tunnel launched on a server, a non-developer
    workstation, or under a service account is far harder to explain. Knowing whether the user role and host function line up
    with remote-development work is often the fastest way to separate sanctioned use from operator-established command and
    control.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: >-
    The genuine VS Code CLI is Microsoft-signed, but the portable tunnel build ships with an empty embedded ProductName,
    and the rule's image branch fires precisely when the Image on disk is not code.exe / code-tunnel.exe. Compare the Image
    path against OriginalFileName to see whether the binary was renamed away from its genuine name, and check the signature
    and hash: a Microsoft signature with a tunnel command line still indicates a legitimate tool being abused, while an
    unsigned or unexpected signer indicates a substituted binary. Submit the hash for reputation lookup to distinguish a
    known-good VS Code CLI from a novel or tampered binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: Decode the full tunnel command line — what tunnel name, data directory, and service flags were set?
  context: >-
    The full command line reveals how the tunnel was configured. Look for `--name` (a persistent operator-chosen tunnel
    identifier), `--cli-data-dir` / the VSCODE_CLI_DATA_DIR override (which relocates the tunnel state away from the default
    user profile, often into a known control-bypass path), `--accept-server-license-terms` or `--no-sleep` (unattended,
    long-lived operation), and `tunnel service install` (run-as-a-service persistence). The query scopes to tunnel command
    lines on this host within a tight window rather than to cmd.exe by name, because cmd.exe is too common to scope by Image
    alone; the `tunnel` filter keeps the result to the operation of interest even when it spans several sequential invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'tunnel'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- source: template:parent_child.parent_process_legitimacy
  question: What started the process that launched this tunnel, and is that chain expected?
  context: >-
    The parent-child relationship is the core signal for the parent branch of this detection, where cmd.exe runs the staged
    code-server.cmd launcher under a tunnel-bearing parent. Tracing the parent's own origin reveals whether the chain is
    routine (a developer's editor or shell starting a tunnel) or operator-driven (a download or extraction tool, a script
    interpreter, or a remote-execution mechanism dropping and starting the tunnel binary). If the parent identifier resolves
    to no data, fall back to the host plus parent-binary view over a short window.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: >-
    A tunnel is rarely the only thing an operator does from a foothold. If the parent that launched this tunnel also spawned
    reconnaissance, credential-access, or download tooling around the same time, that points to hands-on activity rather than
    a developer starting a single remote-development session. Multiple suspicious children from one parent strengthens the
    finding.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:masquerading.binary_origin
  question: How did this tunnel binary arrive on the host?
  context: >-
    The portable VS Code CLI does not appear spontaneously — it is typically downloaded as a zip and extracted, or copied in
    from another location. Tracing the file-creation event for this binary by name reveals the delivery mechanism: a download
    utility, an archive extractor, a manual copy, or a dropper. A binary written into a user-writable or temp directory shortly
    before execution points to deliberate staging; one installed long ago by an editor installer points to sanctioned use.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution, and is the same binary present on other hosts?
  context: >-
    A live tunnel gives the operator an interactive terminal; the children it spawns reveal what was actually done — shell
    processes, node helpers, or follow-on tooling driven through the relay. Examining the binary's child processes shows the
    objective, and the same binary appearing on multiple hosts points to deliberate distribution rather than an isolated
    developer session.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1219.persistence
  question: Was the tunnel registered to run as a service or autorun on this host?
  context: >-
    The tunnel CLI can install itself as a Windows service (`tunnel service install`) so the reverse channel survives reboots
    and logoffs, which is the persistence stage of remote-access-tool abuse. Service and autorun registry writes referencing
    the tunnel binary or a code-server launcher indicate the operator made the access durable rather than running a one-off
    interactive session. Populated rows raise the disposition toward established command and control; if registry events are
    not ingested in this environment, treat zero results as a visibility gap and confirm service installation from the host
    directly.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Services\'
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      filter:
        Details|contains:
          - 'tunnel'
          - 'code-server'
          - 'code-tunnel'
      condition: selection and filter
    fields:
      - TargetObject
      - Details
      - Image
- source: template:remote_access_tool.tool_authorization
  question: Is the Visual Studio Code remote tunnel an approved remote access mechanism on this host?
  context: >-
    Organizations typically sanction a specific, narrow set of remote access and tunneling mechanisms. A signed Microsoft
    tool does not make a tunnel authorized — the relevant question is whether remote-development tunnels are permitted on this
    host for this user's role and what business purpose this one serves. An unsanctioned tunnel, even from a trusted binary,
    may represent shadow IT or operator-established access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a current ticket, change record, or development use case explaining this tunnel?
  context: >-
    Legitimate tunnel usage usually correlates with a documented development task, a scheduled maintenance window, or a user
    request. If no support or change context exists for this session, the tunnel may have been started by an operator for
    persistent interactive access or by a user circumventing controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoints did this host connect to that are consistent with a tunnel relay?
  context: >-
    The tunnel rides outbound HTTPS / WebSocket traffic to a Microsoft-hosted relay; once registered, the host pulls
    regional cluster domains and reuses them, so blocking a single control domain is insufficient. Review the outbound
    connections from this host for the tunnel-relay domain family and devtunnels endpoints, and watch for sustained,
    long-lived sessions with outbound volume exceeding inbound — the asymmetric, persistent egress profile of an interactive
    control channel rather than ordinary browsing. If network telemetry is not available for this host, analyze the
    tunnel command line for the configured name and data directory instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_user_actor.baseline
  question: Does this user normally run Visual Studio Code tunnel or remote-development tooling?
  context: >-
    Compare this user's current action against their historical behavior. A user who has never started a remote tunnel is
    more suspicious than one who runs them regularly as part of development work. User role and typical toolset should align;
    zero or very low historical counts indicate first-time or out-of-role use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is the
    launch mechanism — which parent process spawned this binary, and whether that pair is historically common. A new or rare
    parent for this binary, on this host or environment-wide, is the deviation worth chasing; a pair that already accounts
    for thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the
    same user triggered similar tunnel or remote-access activity on more than one host, the scope of the access may be larger
    than the single alert suggests.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window — a coordinated rollout, or isolated to this host?
  context: >-
    Under a service principal, asking what else the user did network-wide returns agent-telemetry noise, since every host runs
    service-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus spawned
    binary — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the
    tunnel being started, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, download
    or staging activity, privilege escalation, or persistence around the same time, which would distinguish operator activity
    from a developer starting a single session.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access, or initial execution — may
    reveal the attack stages that preceded the tunnel being established and help reconstruct the timeline. The sequence of
    alerts often tells the story: an initial foothold followed by a remote-access channel being set up for sustained control.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
