name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
id: 2dc68eff-2fdb-4c1e-8973-82163b4c5607
description: |
  Detects schtasks.exe creating a scheduled task whose command references OpenSSH client or server binaries in a
  reverse-tunnel form. The rule fires when a schtasks process matches its image AND its command line matches EITHER
  the sshd server pattern (' /create ', sshd.exe, -f) OR the ssh client pattern (' /create ', ssh.exe, -i). Legitimate
  use is possible where administrators run OpenSSH as a service via a task, but the combination of schtasks-based
  persistence with ssh -i key auth or sshd -f config most often represents an operator installing a recurring reverse
  SSH tunnel that survives reboot and provides command-and-control. Investigation should decode the task command,
  determine the schedule and run-as account, confirm whether the task is still registered, and establish whether the
  user, host, and parent chain make this expected.
type: detection
detection_id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the schtasks command create a task that calls OpenSSH in either the sshd server form or the ssh client form?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires on schtasks.exe (by
    image or original file name) when the command line matches EITHER the server branch (' /create ' with sshd.exe and -f)
    OR the client branch (' /create ' with ssh.exe and -i). Read the full command line and note which branch fired -- the
    sshd -f branch points to a local SSH listener, while the ssh -i branch (typically with -N -R) points to an outbound
    reverse tunnel. The branch determines which downstream questions carry the most weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to create scheduled tasks that run OpenSSH?
  context: Legitimate administrative activity can trigger this detection -- a sysadmin may register OpenSSH as a recurring
    task. Knowing whether the user role and host function are consistent with installing SSH-based persistence is often the
    fastest path to distinguishing routine operations from operator activity. A reverse-tunnel task created by a non-admin
    account or on a host with no SSH role is a strong escalation signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:scheduled_task.task_configuration
  question: What scheduled task was created -- what is the task name (/TN), the command it runs (/TR), the schedule (/SC), and the run-as account (/RU)?
  context: The schtasks command line carries the full persistence configuration. Identify the task name, the schedule type
    (a /sc minute /mo 1 recurring trigger keeps a tunnel alive; ONLOGON or ONSTART fires at boot), and the /TR command --
    a /TR pointing at sshd.exe -f <config> stands up a listener, while ssh.exe -i <key> -N -R <remote>:127.0.0.1:<local>
    is a reverse tunnel to an external host. A /RU of SYSTEM or highest run level is higher risk. Record the remote host
    and ports if the reverse-tunnel form is present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:obfuscation.encoded_payload_decode
  question: Is the task command line encoded or obfuscated, and if so what does it decode to?
  context: Operators sometimes hide the task payload behind encoding so the /TR value does not read as ssh or sshd on casual
    inspection. Look for base64 in the command, certutil -decode chains, hex strings, character concatenation, environment-variable
    substitution, or a /TR that launches a script which in turn invokes OpenSSH. Decode any encoded content to confirm the
    actual operation -- a reverse tunnel, a download cradle, or a credential operation -- rather than assuming the literal
    command is the whole story.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:scheduled_task.task_trigger_and_timing
  question: When is the task scheduled to run, and has the OpenSSH payload already executed?
  context: The trigger schedule determines when the persistence activates. A recurring trigger (every minute, daily) may
    have already launched ssh or sshd multiple times; a boot or logon trigger fires on next restart. Scheduled tasks run
    as children of the Task Scheduler service, so processes spawned by svchost running the Schedule service after task
    creation reveal whether the SSH payload ran and connected.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:scheduled_task.task_still_present
  question: Is the SSH scheduled task still registered on the host?
  context: Persistence is only effective if the task still exists. Some operators delete the task after the tunnel is
    established to reduce forensic artifacts. Confirming the task is still present (via schtasks /query /tn <taskname> /v
    or the Task Scheduler view) determines whether the persistence is active and requires removal. Use the task name from
    the creation command to query for it directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1053.005.security_task_creation
  question: Does a task-creation security event corroborate this scheduled task, and what task name and content does it record?
  context: Task creation and modification are logged independently of process creation as security events (4698 for creation,
    4702 for update). These events record the task name and the task definition the scheduler stored, which corroborates the
    command-line evidence and catches task creation paths that do not go through a visible schtasks.exe process (API, COM,
    or PowerShell ScheduledTasks). If security task-creation events are not collected in this environment, treat zero results
    as a visibility gap rather than evidence the task does not exist.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
      condition: selection
    fields:
      - TaskName
      - TaskContent
      - SubjectUserName
- source: attack:T1053.005.registry_task_artifact
  question: Were the registry artifacts that back this scheduled task written on the host?
  context: Every scheduled task is materialized under the Task Scheduler registry tree, so a task registration leaves writes
    under the TaskCache Tree and Tasks keys in addition to the XML definition on disk. These registry artifacts confirm the
    task was actually registered (not just attempted) and can surface tasks that were created and then deleted from the
    visible task list. If registry-set events are not ingested here, this returns nothing by construction.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\'
          - '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tasks\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned schtasks.exe, and is that parent chain expected for task creation?
  context: The parent process reveals how the task was created. Interactive admin work typically descends from explorer.exe
    or a console shell; deployment tooling has its own predictable parents. A schtasks invocation launched from a script
    interpreter, an Office application, a download cradle, or an unexpected installer (for example install.bat-style
    automation) points to operator activity rather than routine administration. Walk up to the parent's own parent if the
    immediate parent is itself a generic shell.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's SSH-task pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate OpenSSH task installs leave a baseline. This query mirrors the rule's selection structure scoped
    to this host, so the parent and user distribution it returns reflects how this specific firing pattern has run here
    historically -- not generic schtasks usage. A new parent process, an unexpected user account, or a first-ever occurrence
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_sshd:
        CommandLine|contains|all:
        - ' /create '
        - sshd.exe
        - -f
      selection_cli_ssh:
        CommandLine|contains|all:
        - ' /create '
        - ssh.exe
        - -i
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_sshd:
        CommandLine|contains|all:
        - ' /create '
        - sshd.exe
        - -f
      selection_cli_ssh:
        CommandLine|contains|all:
        - ' /create '
        - ssh.exe
        - -i
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_sshd:
        CommandLine|contains|all:
        - ' /create '
        - sshd.exe
        - -f
      selection_cli_ssh:
        CommandLine|contains|all:
        - ' /create '
        - ssh.exe
        - -i
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    SSH-tunnel persistence is frequently installed as part of a broader hands-on operation; if the same user triggered
    similar task creation or tool execution on multiple hosts, the scope of compromise may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_sshd:
        CommandLine|contains|all:
        - ' /create '
        - sshd.exe
        - -f
      selection_cli_ssh:
        CommandLine|contains|all:
        - ' /create '
        - ssh.exe
        - -i
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- source: template:lolbin.technique_class_lateral
  question: Were other tunneling or remote-access tools used on this host recently to achieve the same objective?
  context: Operators who establish one covert channel often deploy several. Alongside an SSH reverse tunnel, check for other
    proxy and tunneling utilities that provide the same outbound command-and-control or pivot capability. Finding multiple
    tools building tunnels or SOCKS proxies in the same timeframe strengthens the case that this is deliberate
    command-and-control infrastructure rather than an isolated admin task.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\plink.exe'
          - '\chisel.exe'
          - '\ngrok.exe'
          - '\frpc.exe'
          - '\frps.exe'
          - '\socat.exe'
          - '\stunnel.exe'
          - '\netsh.exe'
          - '\rclone.exe'
          - '\wmic.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was schtasks.exe executed from its expected System32 path, or from an unusual location?
  context: schtasks.exe run from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade
    path-based allowlists. Confirm the alerting image path and original file name -- a schtasks executing from a user temp
    directory or a dropped-tooling folder is more suspicious than one in System32, and a mismatch between image name and
    original file name points to a renamed binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this rule's SSH-task pattern over the past 90 days, and what command-line structures are typical?
  context: An SSH-task pattern with no prior history on a host is more suspicious than one used routinely under stable
    parents. This query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's
    specific firing pattern -- not generic schtasks usage. The command-line projection lets you compare typical invocation
    patterns against the alerting one to spot a one-off install.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_sshd:
        CommandLine|contains|all:
        - ' /create '
        - sshd.exe
        - -f
      selection_cli_ssh:
        CommandLine|contains|all:
        - ' /create '
        - ssh.exe
        - -i
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. After establishing one foothold, they commonly install
    backups using different techniques -- additional scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than an
    isolated administrative action. Pair this with the SSH-task finding to map the full set of footholds requiring removal.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
