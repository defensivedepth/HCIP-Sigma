name: Remote Access Tool - TacticalRMM Agent Registration to Potentially Attacker-Controlled Server
id: f938f4b0-1bb2-4a28-a631-1260fd84b096
description: |
  Detects execution of the TacticalRMM agent (tacticalrmm.exe under a \TacticalAgent\ path) with the full set of
  registration flags --api, --auth, --client-id, --site-id, and --agent-type present together on the command line.
  These flags bind the agent to a specific RMM server, authentication token, client, and site, completing a silent
  enrollment. Legitimate IT teams deploy TacticalRMM this way during managed-endpoint onboarding, so the investigation
  turns on whether the destination server in --api is organization-controlled infrastructure and whether the
  enrollment was authorized, versus an operator registering the host to attacker-controlled RMM infrastructure for
  persistent remote control.
type: detection
detection_id: 2db93a3f-3249-4f73-9e68-0e77a0f8ae7e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show tacticalrmm.exe run with the --api, --auth, --client-id, --site-id, and --agent-type registration flags together?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when the TacticalAgent binary runs with all five enrollment flags present at once. Read the value passed to --api -- that hostname or IP is the RMM server the agent is being bound to and is the central pivot for the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to onboard an RMM agent?
  context: Legitimate TacticalRMM enrollment is normally performed by IT staff or an automated deployment account against managed endpoints. A registration running under a standard end-user account, on a host outside the managed fleet, or off the normal onboarding schedule is the faster path to distinguishing sanctioned deployment from unauthorized enrollment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is TacticalRMM on the organization's approved remote access and management software list?
  context: Organizations typically sanction one RMM platform for IT support. If TacticalRMM is not the approved tool -- or is approved but only when pointed at organization-owned servers -- this enrollment may represent shadow IT or attacker-deployed persistence. An unapproved RMM agent should be reviewed regardless of the software's general reputation, since the same legitimate binary can be bound to any server.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a helpdesk ticket, onboarding task, or change record explaining this agent enrollment?
  context: Sanctioned RMM deployment correlates with an onboarding task, an imaging or provisioning workflow, or a documented change. If no support or deployment record covers this host at this time, the agent may have been installed by an operator to establish persistent remote access or by a user circumventing controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1219.process_identification
  question: Is the binary at \TacticalAgent\tacticalrmm.exe the genuine signed TacticalRMM agent, and does its install path match the sanctioned deployment location?
  context: A renamed or relocated binary can carry the expected command-line structure while not being the real agent, and a genuine agent dropped into a user-writable or temporary directory rather than the standard Program Files install location points to ad-hoc operator deployment rather than a managed rollout. Check the full Image path, the on-disk file, and its code-signing chain against the vendor's signed releases.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: What full enrollment configuration did this agent register with -- read out the --api server, --client-id, --site-id, --agent-type, and auth token from the command line?
  context: The command line carries the complete registration target. The value of --api is the RMM server the host now reports to; --client-id and --site-id place the host into a specific tenant and site within that server; --auth is the enrollment token. Decode each so you can compare the destination server against known organization-owned RMM infrastructure -- a public or unfamiliar host in --api is the strongest signal of unauthorized enrollment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
        - --api
        - --auth
        - --client-id
        - --site-id
        - --agent-type
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned the TacticalRMM agent, and is that parent chain consistent with a deployment script or installer?
  context: The parent reveals how the enrollment was driven. A managed rollout typically traces to an installer, a deployment service, or an administrative script. A parent such as powershell.exe running a downloaded script, mshta.exe, wscript.exe, or an Office application points to scripted attacker deployment rather than sanctioned onboarding.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did the TacticalRMM agent spawn after registration?
  context: An RMM agent's reach comes from the processes it launches. Once enrolled, the agent can run remote shells, script interpreters, and downloaders on command from its server. Child processes such as cmd.exe, powershell.exe, or file-transfer utilities spawned by the agent indicate the remote operator has begun issuing commands rather than the agent merely sitting idle after install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoints did the TacticalRMM agent connect to after enrollment?
  context: A registered agent opens a long-lived outbound channel to its RMM server. Compare the destinations against the --api value from the command line and against known organization-owned RMM infrastructure. Connections to an unfamiliar host, a public cloud IP, or a domain that does not match the sanctioned server confirm the host is reporting to a server outside organizational control.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1219.registry_set
  question: Did the agent install create a service or autorun entry to make the remote access survive reboot?
  context: RMM agents persist by registering a Windows service or writing run keys so the connection re-establishes on every boot. A service registration or autorun write that appears alongside this enrollment confirms the access was made durable rather than one-off. Review the parent that performed the write and whether the service or run-key target points at the TacticalAgent directory.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        TargetObject|contains:
        - \Services\
        - \CurrentVersion\Run
        - \CurrentVersion\RunOnce
      condition: selection and selection_persist
    fields:
      - TargetObject
      - Details
      - Image
- source: template:download_tool.download_success_verification
  question: Did the agent or its installer write files into the TacticalAgent directory, confirming the install completed?
  context: A registration command does not by itself prove the agent was fully installed and operational. File writes into the agent's install directory establish that the deployment progressed past the command stage to a working on-disk agent. Absence of those writes may mean the enrollment failed or was blocked.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the agent's install directory around the enrollment?
  context: Operators frequently stage additional tooling alongside an RMM agent -- a paired remote-control component, helper scripts, or exclusion-setting payloads dropped into the same directory tree. Examining directory-level file writes reveals whether the enrollment was a self-contained agent install or part of a broader staging operation.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: Can you retrieve the agent binary and any co-staged files for hash and reputation analysis from a safe environment?
  context: If the agent binary and any files dropped beside it are still on disk, submitting their hashes to threat intelligence or detonating unfamiliar co-staged files reveals whether the deployment matches the vendor's signed releases or includes a modified or trojanized component. This separates a clean-but-unauthorized agent from one bundled with additional payloads.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Hashes
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run the TacticalRMM registration pattern, what parents and users drove it, and does this alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific enrollment pattern has historically run here, not generic agent usage. A new parent process, an unexpected account, or a first-ever appearance of the registration pattern on this host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains: \TacticalAgent\tacticalrmm.exe
        CommandLine|contains|all:
        - --api
        - --auth
        - --client-id
        - --site-id
        - --agent-type
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts run the TacticalRMM registration pattern in the past week, and does the cross-host distribution look like a managed rollout or isolated activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the registration pattern rather than generic binary usage. Many hosts enrolling with the same pattern and consistent parents points to a scripted, managed deployment; one host or a small unrelated set points to manual operator activity. Cross-reference the --api server across hosts -- a shared unauthorized destination across multiple endpoints widens the scope of compromise.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains: \TacticalAgent\tacticalrmm.exe
        CommandLine|contains|all:
        - --api
        - --auth
        - --client-id
        - --site-id
        - --agent-type
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains: \TacticalAgent\tacticalrmm.exe
        CommandLine|contains|all:
        - --api
        - --auth
        - --client-id
        - --site-id
        - --agent-type
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains: \TacticalAgent\tacticalrmm.exe
        CommandLine|contains|all:
        - --api
        - --auth
        - --client-id
        - --site-id
        - --agent-type
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this enrollment?
  context: Enrollment to an unauthorized RMM server is often a mid-chain action. Earlier detections on the same host -- defense tampering, credential access, or reconnaissance -- may reveal how the operator gained the access needed to deploy the agent and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
