name: Potentially Suspicious Regsvr32 HTTP IP Pattern
id: 1bc8c8fc-587d-4dfe-afa0-a440927d1277
description: |
  Detects regsvr32.exe invoked with an install argument (/i: or -i:) pointing at an http or https URL whose host begins
  with a numeric octet, i.e. a raw IP address. regsvr32.exe is a signed Microsoft DLL/COM registration utility, and passing
  it a remote URL via /i drives it to fetch and execute a remote scriptlet or DLL in its own process context, proxying
  unsigned code past application allowlists. Legitimate COM registration is local and rarely references a bare IP over the
  network, so this pattern usually means a download-and-execute stage. The rule fires when ALL of the binary identity
  (Image ends in regsvr32.exe or OriginalFileName REGSVR32.EXE) AND the IP-URL install argument are present; investigate
  what the fetched payload is, where it came from, and what regsvr32.exe did next.
type: detection
detection_id: 2dd2c217-bf68-437a-b57c-fe9fd01d5de8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show regsvr32 with an install flag (/i or -i) pointing at an http or https IP address?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires BOTH that the process
    is regsvr32 (Image ends in regsvr32.exe, or OriginalFileName is REGSVR32.EXE even if renamed) AND that the command line
    carries an install argument referencing a raw-IP http or https URL. Read the full command line and the binary identity
    from the triggering event and confirm both halves are present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- source: template:universal.host_user_context
  question: Is this user and host expected to register DLLs or COM objects from a remote IP via regsvr32?
  context: Legitimate COM/DLL registration is almost always local (System32 or SysWOW64) and tied to software installation.
    A user or host fetching an install argument from a bare IP address over the network is well outside routine administrative
    activity. Knowing whether this user role and host function ever do remote registration is often the fastest path to
    distinguishing a true positive from a rare-but-legitimate operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this regsvr32 invocation do? Decode every flag and the full install URL.
  context: The full command line reveals the operation. Decode the flag combination — /s (silent), /n (skip DllRegisterServer),
    /u (unregister/run DllUnRegisterServer entry point), /i:<url> (pass install argument) — and read the complete URL,
    including the IP, port, path, and any scriptlet (.sct, .ocx) or DLL extension. The classic remote-proxy form pairs /i:<url>
    with scrobj.dll to host a scriptlet, but a bare DLL URL runs the DLL's register/unregister export in regsvr32 context.
    This scopes to all regsvr32 executions on the host within a few minutes, since a single logical operation can span
    sequential invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- source: template:cue_network_endpoint.mechanism_decode
  question: What is the remote IP and URL in the install argument, and what do reputation, WHOIS, and threat intel reveal?
  context: 'The install argument names attacker-controlled infrastructure: a raw IP host, a port, and a path to the fetched
    scriptlet or DLL. Extract the IP and URL from the alerting command line and investigate it — registration age and owner
    (WHOIS), passive DNS history, hosting reputation, and known threat-intel hits. A bare IP with no DNS name, a high or
    non-standard port, or a recently flagged host points to attacker-controlled retrieval rather than a software vendor
    endpoint. The destination here lives in the command line, not in a separate network record, so read it from the process
    event.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
  answer_sources:
  - external_threat_intel
  - manual_review
- source: template:cue_process_tool.process_chain
  question: What process spawned this regsvr32 instance, and is that parent chain expected?
  context: The parent process reveals how regsvr32 was invoked. Legitimate registration is usually launched by an installer,
    explorer.exe for a user action, or services.exe. Unusual parents — mshta.exe, wscript.exe, cscript.exe, an Office
    application, or a shell spawned from a document — point to macro or script-driven execution rather than software
    installation. The immediate parent is in the alert; walk up to see what spawned the parent and what else it spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this regsvr32 IP-URL pattern, what parents and users normally drive it, and
    does the current alert fit?
  context: Even a signed utility can be abused. This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern — regsvr32 with an IP-URL install
    argument — has historically run here, not generic regsvr32 usage. A new parent process, an unexpected user account, or an
    unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_ip:
        CommandLine|contains:
        - ' /i:http://1'
        - ' /i:http://2'
        - ' /i:http://3'
        - ' /i:http://4'
        - ' /i:http://5'
        - ' /i:http://6'
        - ' /i:http://7'
        - ' /i:http://8'
        - ' /i:http://9'
        - ' /i:https://1'
        - ' /i:https://2'
        - ' /i:https://3'
        - ' /i:https://4'
        - ' /i:https://5'
        - ' /i:https://6'
        - ' /i:https://7'
        - ' /i:https://8'
        - ' /i:https://9'
        - ' -i:http://1'
        - ' -i:http://2'
        - ' -i:http://3'
        - ' -i:http://4'
        - ' -i:http://5'
        - ' -i:http://6'
        - ' -i:http://7'
        - ' -i:http://8'
        - ' -i:http://9'
        - ' -i:https://1'
        - ' -i:https://2'
        - ' -i:https://3'
        - ' -i:https://4'
        - ' -i:https://5'
        - ' -i:https://6'
        - ' -i:https://7'
        - ' -i:https://8'
        - ' -i:https://9'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- source: template:cue_process_tool.follow_on
  question: What child processes did this regsvr32 instance spawn afterward?
  context: The processes spawned by regsvr32 reveal the payload's actual impact. A remote scriptlet or DLL executed in
    regsvr32 context frequently launches follow-on stages — cmd.exe, powershell.exe, certutil.exe, or other download or
    discovery tools. Unexpected children shortly after the alert indicate the fetched code ran and moved to post-exploitation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: attack:T1218.010.image_load
  question: What DLLs or scriptlet-runtime modules did regsvr32 load shortly after launch, and were any unsigned or loaded
    from an unusual path?
  context: After fetching the remote install argument, regsvr32 loads the code into its own process. Look for scrobj.dll (the
    Script Component Runtime that executes .sct scriptlets), a .NET CLR loaded into regsvr32 (anomalous — regsvr32 does not
    normally host managed code), or any unsigned DLL loaded from a temp or user-writable directory shortly after the process
    started. Correlate the module-load timing with the process creation; a load within seconds of launch, from outside
    System32 or SysWOW64, is the proxy-execution payload. If image-load events are not collected in this environment, treat
    zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
  answer_sources:
  - process_creation
  - manual_review
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services,
    flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy"
    signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition
    toward operator preparation; review the parent process and signing chain to identify the writer. On non-Windows alerts
    this query returns 0 by construction.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
  answer_sources:
  - process_creation
  - edr_console
  - manual_review
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    the regsvr32 invocation, what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, persistence installation, or additional download or proxy-execution tools running in the same
    window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- source: template:cue_user_actor.baseline
  question: Does this user normally run regsvr32, or remote-registration tooling, across the environment?
  context: Compare this user's current action against their historical pattern. A user who has never run regsvr32 with a
    remote install argument is more suspicious than one who does so as part of a known role. Pair the count with the user's
    role — developers and packaging engineers may register components routinely, while a standard end user fetching code from
    an IP is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+regsvr32 combination historically routine on this host or across the environment, or is the parent
    unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is
    the launch mechanism: which parent process spawned regsvr32, and whether that pair is historically common. A new or rare
    parent for regsvr32 on this host or environment-wide is the deviation worth chasing; a pair that already accounts for
    thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar regsvr32 or download activity on multiple hosts, the scope of the operation may be larger
    than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+regsvr32 combination fire on other hosts in the same window — a coordinated automation
    rollout, or activity isolated to this host?
  context: Under a service principal, "what else did this user do across the network" returns agent-telemetry noise (every
    host runs SYSTEM-owned agents constantly). The meaningful question is whether the same launch mechanism — parent process
    plus regsvr32 — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, a
    macro-spawned shell, or credential access — may reveal the attack stages that preceded the regsvr32 download-and-execute
    and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who use one proxy-execution LOLBin often use several. If regsvr32 was used to run remote code, check
    whether rundll32, mshta, msbuild, installutil, msiexec, or similar signed binaries were also used to proxy execution in
    the same timeframe. Multiple proxy-execution LOLBins performing the same objective strengthens the case for hands-on
    malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: template:lolbin.renamed_binary_check
  question: Was regsvr32 executed from an expected path under System32 or SysWOW64?
  context: regsvr32 executed from a non-standard path — outside C:\Windows\System32 or C:\Windows\SysWOW64 — may indicate the
    binary was copied or renamed to evade path-based allowlists. Compare the Image path against OriginalFileName — a process
    whose OriginalFileName is REGSVR32.EXE but whose Image path is a temp or user-writable directory, or a different file
    name, is more suspicious than one running from the canonical system location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
  answer_sources:
  - process_creation
- source: template:lolbin.historical_lolbin_baseline
