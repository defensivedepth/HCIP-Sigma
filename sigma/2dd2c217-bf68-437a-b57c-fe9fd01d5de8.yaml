    typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under stable parents.
    This query mirrors the rule's selection structure scoped to this host, so the resulting count reflects this specific
    firing pattern — regsvr32 with an IP-URL install argument — not generic regsvr32 usage. The CommandLine projection lets
    the analyst compare typical invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_ip:
        CommandLine|contains:
        - ' /i:http://1'
        - ' /i:http://2'
        - ' /i:http://3'
        - ' /i:http://4'
        - ' /i:http://5'
        - ' /i:http://6'
        - ' /i:http://7'
        - ' /i:http://8'
        - ' /i:http://9'
        - ' /i:https://1'
        - ' /i:https://2'
        - ' /i:https://3'
        - ' /i:https://4'
        - ' /i:https://5'
        - ' /i:https://6'
        - ' /i:https://7'
        - ' /i:https://8'
        - ' /i:https://9'
        - ' -i:http://1'
        - ' -i:http://2'
        - ' -i:http://3'
        - ' -i:http://4'
        - ' -i:http://5'
        - ' -i:http://6'
        - ' -i:http://7'
        - ' -i:http://8'
        - ' -i:http://9'
        - ' -i:https://1'
