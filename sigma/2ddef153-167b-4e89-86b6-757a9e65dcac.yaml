  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair - non-deduplicable; emitted BOTH (Q11 user-pivot, Q12 parent+binary substitute) per service-principal default"
      kept: both
    - dropped: masquerading.binary_origin
      reason: "Rule fires on the legitimate signed bitsadmin.exe performing a suspicious download (OR-matched by image name OR OriginalFileName), not on a renamed dropped binary. The 30-day basename file_event trace is built for true masquerading where an arbitrarily-named dropper was placed on disk; for bitsadmin (a default OS binary present since Vista) it returns OS-install noise. masquerading.true_identity (Q3) and lolbin.renamed_binary_check (Q14) cover the metadata-mismatch and non-standard-path angle that is actually load-bearing here."
      kept: template:masquerading.true_identity
    - dropped: masquerading.renamed_binary_activity
      reason: "Its child-process / cross-host-binary scope overlaps cue_process_tool.follow_on (Q10, child processes) and cue_process_tool.scope is itself superseded by lolbin.technique_class_lateral. The renamed-binary cross-host angle does not apply - bitsadmin is a stock OS binary present on every host, so an OriginalFileName fleet match returns every Windows endpoint. Child activity is covered by follow_on (Q10)."
      kept: template:cue_process_tool.follow_on
    - dropped: cue_process_tool.scope
      reason: "Fleet-wide rule-pattern count overlaps lolbin.historical_lolbin_baseline (Q16, host-scoped 90d rule-pattern count) and cross-host distribution is partially served by cue_user_actor.clustering_svc intent; dropped to stay within the 18-question cap while keeping the host-scoped reflected baselines (Q15, Q16) which carry the rule-pattern framing."
      kept: template:lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.clustering + cue_host_context.clustering
      reason: "Generic same-host activity sweeps; persistence_scope (Q17), lolbin.technique_class_lateral (Q13), and precursor (Q18) already surface the surrounding-activity and prior-alert dimensions with more specificity. Dropped to stay within the 18-question cap."
      kept: template:cue_host_context.precursor
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "Network-wide user-activity pair; for a download/LOLBin rule the load-bearing scope question is cross-host firing of the same pattern, covered by the reflected baselines (Q15 host-pattern, Q16 90d host-pattern). Dropped the clustering pair to stay within the 18-question cap."
      kept: template:cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.baseline
      reason: "Generic 90d binary-frequency count is superseded by the reflected lolbin.historical_lolbin_baseline (Q16) which counts the rule's specific firing pattern rather than all bitsadmin executions."
