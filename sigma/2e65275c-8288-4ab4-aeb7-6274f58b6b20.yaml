name: Procdump Execution
id: 7d3f0a1c-9b62-4e8a-bf21-2c5d4e6f8a90
description: |
  Detects execution of the SysInternals ProcDump utility (procdump.exe or procdump64.exe), a signed
  command-line process-dump tool used legitimately for diagnostic captures and widely abused to dump
  LSASS memory to disk for offline credential extraction. The rule fires on the binary name alone, so
  the investigation must distinguish a developer or administrator capturing a crash dump from an
  operator dumping a sensitive process: read the full command line for the target process and dump
  mode, confirm the on-disk name and metadata identify the genuine tool, and check whether a handle
  to LSASS memory and a resulting dump file followed. ProcDump can also register itself as the AeDebug
  postmortem debugger, so an install-mode invocation has a registry side effect distinct from a
  one-shot dump.
type: detection
detection_id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Is the alerting process really procdump.exe or procdump64.exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    when the Image path ends in procdump.exe or procdump64.exe. Review the full event, including the
    command line, in the alert detail — a developer capturing a crash dump of their own application
    looks very different from a dump of lsass.exe with a full-memory flag.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run a process-dump utility?
  context: Legitimate diagnostic dumping is common on developer workstations and on servers running
    crash-analysis or performance tooling, and is rare on general user endpoints. Knowing whether the
    user role and host function involve memory-dump capture is often the fastest way to separate a
    routine diagnostic from credential-access activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: ProcDump is Microsoft-signed and ships with an OriginalFileName of procdump.exe. Compare the
    on-disk Image name against the embedded OriginalFileName and the signing chain — a file named
    procdump.exe whose metadata or signature does not match the genuine tool is a renamed binary, while
    a metadata match confirms the real utility. Submit the hash for reputation lookup to distinguish a
    known-good release from a tampered or trojanized copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did this procdump binary arrive on the host, and into what directory?
  context: ProcDump is not installed by default — it was downloaded, extracted from an archive, copied
    from a share, or dropped by another process. Tracing the file-creation event for the binary basename
    reveals the delivery mechanism and the writing process. A copy into a user-writable directory such
    as a Temp, Downloads, AppData, or Public path points to ad-hoc operator staging; placement under a
    managed tooling directory points to sanctioned diagnostic use.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did procdump spawn or write after execution, and does the same binary appear on other hosts?
  context: The purpose of dumping a process is what happens to the dump afterward. Examine child
    processes and follow-on activity from this binary to see whether a dump file was compressed, moved,
    or shipped offhost. The same binary appearing across multiple endpoints in a short window suggests a
    deliberate rollout or operator sweep rather than an isolated diagnostic capture.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Credential dumping is frequently preceded by weakening of endpoint protection so the dump
    tool and its output are not blocked or quarantined. The query surfaces direct attempts to disable
    AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW in the
    hour before the alert. Zero rows is a useful "protection looks healthy" signal — kernel-level driver
    tampering and in-memory patches will not appear here. Populated rows shift the disposition toward
    operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:credential_access.credential_target_identification
  question: What process did procdump target, and in what dump mode?
  context: ProcDump can target a process by name, service name, or PID and write a dump in several
    modes — mini, full (-ma, every page of memory), triage, or a custom mask. The canonical credential
    abuse is a full dump of lsass.exe, but other sensitive targets and the registry-backed SAM, SECURITY,
    and SYSTEM material can also be staged. Decode the command line to identify the exact target process,
    the dump mode, and the output path so you know which credential store was at risk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.001.access_verification
  question: Did a handle open against lsass.exe memory with full access on this host around the alert?
  context: A memory dump of LSASS requires a process to open a handle with full access (mask 0x1F0FFF)
    to lsass.exe before reading or writing its memory. This query looks for that handle-open event on
    the host in the surrounding window. A handle from procdump correlated in time with the alert
    confirms the dump targeted credential material; a handle from an allowlisted AV/EDR process is
    expected background activity. If process-access telemetry is not collected in this environment,
    treat zero results as a visibility gap rather than evidence no access occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess: '0x1F0FFF'
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be exposed by the targeted process, and do any have elevated privileges?
  context: The severity of a memory dump depends on which credentials lived in the targeted process.
    A dump of LSASS on a server where domain administrators or service accounts have logged on exposes
    those credentials for offline extraction; a dump on an isolated workstation with only a standard
    user exposes far less. Cross-reference the logged-on accounts with directory group memberships to
    decide whether escalation and credential resets are warranted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned procdump, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked and is the basis for allowlisting known
    legitimate callers. Diagnostic use is usually launched interactively from a shell or a management
    console; invocation from a script host, an Office application, a web server worker, or a remote-access
    tool points to operator-driven credential access. Walk up to the parent's own parent if the immediate
    caller does not explain the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1003.001.tuning_parameter
  question: Was the AeDebug postmortem-debugger registry key written on this host around the alert?
  context: ProcDump run with its install switch registers itself as the AeDebug postmortem debugger,
    writing the Debugger value under the AeDebug key so it launches against future crashing processes.
    This is a distinct, more persistent behavior than a one-shot dump and overlaps the image-file-execution
    abuse surface. A write to this key correlated with the alert means the tool was installed rather
    than run once; absence of the write is consistent with a single ad-hoc dump.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentVersion\AeDebug\Debugger'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does this alert fit?
  context: Even a legitimately used tool has a normal footprint. The query mirrors the rule's selection
    scoped to this host, so the resulting parent and user distribution reflects how procdump execution
    has historically run here rather than generic tool usage. A new parent process, an unexpected user
    account, or a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \procdump.exe
        - \procdump64.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of
    procdump execution rather than generic binary usage. Many hosts firing the same pattern points to
    scripted deployment or vendor diagnostic automation; a single host or a small unrelated set points
    to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \procdump.exe
        - \procdump64.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \procdump.exe
        - \procdump64.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \procdump.exe
        - \procdump64.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether credential dumping was paired
    with reconnaissance, lateral movement, or staging on other endpoints. If the same user triggered
    related activity on multiple hosts, the scope of the compromise may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \procdump.exe
        - \procdump64.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
