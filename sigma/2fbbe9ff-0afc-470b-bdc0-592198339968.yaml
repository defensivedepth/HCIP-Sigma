name: Remote Access Tool - Potential MeshAgent Execution - Windows
id: 71fecc7a-77b4-4e00-afd0-b2b92fd8022f
description: |
  Detects a process_creation event whose command line contains the '--meshServiceName' argument, the flag MeshAgent uses to register
  itself as a Windows service for unattended remote access. MeshAgent is a dual-use remote management agent: legitimate IT teams deploy
  it for support, but it is also dropped by operators as a backdoor because it runs unattended, can execute shell commands and transfer
  files without user consent, and generates a unique binary hash per deployment that defeats hash-based detection. The binary is frequently
  renamed and installed from user-writable or temp paths to masquerade as a system component, so the investigation should establish whether
  this remote access tool is organizationally approved, what external endpoint it reaches, how it was launched, whether it installed a
  persistent service, and whether the surrounding activity on the host looks like sanctioned support or operator-driven deployment.
type: detection
detection_id: 2fbbe9ff-0afc-470b-bdc0-592198339968
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain the '--meshServiceName' service-registration argument this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line against the
    rule's detection criteria. The rule fires when a process command line contains '--meshServiceName', the flag MeshAgent uses to register
    a service name for unattended remote access. Read the value passed to the flag — operators often set it to a plausible-looking system
    name to blend in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to install or run a remote access agent?
  context: Legitimate administrative activity can trigger this detection — IT support deploying a sanctioned agent looks identical at the
    command-line level. Knowing whether the account is an admin or service-desk role and whether the host is one where remote support is
    routinely installed is often the fastest path to distinguishing sanctioned deployment from operator-installed persistence. Remote
    access agents frequently run under NT AUTHORITY\SYSTEM, so the executing user may not attribute the human who initiated it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is MeshAgent on the organization's approved remote access software list?
  context: Organizations typically maintain a list of approved remote access and RMM tools for IT support. Any remote access tool not on
    that list — even well-known commercial software — may represent shadow IT or attacker-deployed persistence. MeshAgent is the endpoint
    client for the MeshCentral management platform; if it is not the sanctioned support tool here, its presence should be checked regardless
    of the binary's reputation, because operators commonly rename it to disguise the install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a current helpdesk ticket or support session explaining this remote access install?
  context: Legitimate remote access tool usage typically correlates with an active support ticket, a scheduled maintenance window, or a
    user request. If no support context exists for this host at this time, the agent may have been installed by an operator for persistent
    access or by a user circumventing controls. Match the host, user, and timestamp against support records and change tickets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What service name and configuration did this command register? Decode the full command line.
  context: The full command line reveals how the agent was configured. Decode the value passed to '--meshServiceName' and any accompanying
    flags such as a full-install switch, an install path, or a MeshCentral server URL. A service name chosen to imitate a legitimate
    Windows component (for example a network-adapter or update service name) is a masquerading signal. This query scopes to all
    '--meshServiceName' invocations on this host within the window so multi-step installs appear together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '--meshServiceName'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this agent, and is that parent chain expected for a remote access install?
  context: The parent process reveals how the agent was invoked. A sanctioned deployment usually has a predictable parent — a software
    distribution agent, an installer, or an interactive admin shell. Unusual parents such as a remote-execution utility, a script host,
    an Office application, or a batch file launched across hosts may indicate the agent was pushed during hands-on-keyboard activity rather
    than installed through routine support. Walk up the tree to see what launched the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint and port is this remote access tool connecting to?
  context: Remote access agents establish a long-lived outbound channel to relay servers or management infrastructure. The destination
    reveals whether the agent reaches a sanctioned management platform or a custom endpoint. MeshAgent typically egresses over 80 and 443
    to blend with web traffic, but RMM agents may also use configurable high ports such as 7070 or 5650; a connection to an unfamiliar
    IP, especially one reached over an encrypted WebSocket, is the egress worth chasing. Compare the destination against any approved
    vendor support clouds or CDNs for this environment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1219.interactive_control
  question: What child processes did this agent spawn after it started?
  context: Interactive control through a remote access tool surfaces as child processes spawned by the agent — command shells, script
    hosts, or file-manager helpers launched on the operator's behalf. A remote access agent that spawns cmd.exe, powershell.exe, or
    other interactive interpreters is being used for command execution rather than passive support. Predictable, signed helper children
    are routine; an interactive shell child shifts the disposition toward operator-driven activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- source: attack:T1219.002.install_artifact
  question: Was a new executable written to a user-writable or temp location on this host around the alert?
  context: Remote access agents are often dropped and run from user-writable or temporary directories rather than a standard install
    location, and the binary is frequently renamed to a plausible system name to masquerade. A newly written executable under a user
    profile, temp, public, or program-data path near the alert time is a candidate for the agent binary or a paired helper. Review the
    writing process and the signing chain of the dropped file to identify who placed it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_path:
        TargetFilename|contains:
          - '\Users\'
          - '\Temp\'
          - '\AppData\'
          - '\ProgramData\'
          - '\Public\'
      selection_exe:
        TargetFilename|endswith: '.exe'
      condition: selection_host and selection_path and selection_exe
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1219.persistence_service
  question: Did the agent install a persistent service or autostart registry entry on this host?
  context: Remote access agents persist by registering a Windows service and supporting registry keys so they survive reboot and reconnect
    without user interaction. Service-configuration writes, a service key under the system services hive, a SafeBoot network entry that
    keeps the agent reachable in Safe Mode, or a firewall-rule registry entry allowing the agent's traffic are the persistence artifacts
    to confirm. Their presence converts a one-off execution into established unattended access.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentControlSet\Services\'
          - '\SafeBoot\Network\'
          - '\FirewallPolicy\FirewallRules'
      condition: selection_host and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired the '--meshServiceName' pattern, what parents and users drove it, and does this alert fit?
  context: Even sanctioned tools can be abused. The query mirrors the rule's selection scoped to this host, so the resulting parent and
    user distribution reflects how this specific firing pattern has historically run here — not generic process activity. A new parent
    process, an unexpected account, or a first-ever appearance of the pattern on this host is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: --meshServiceName
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the '--meshServiceName' pattern in the past week, and does the spread look like automated deployment or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this firing pattern rather than
    generic binary usage. Many hosts firing the same pattern in a short window points to scripted or pushed deployment — sanctioned RMM
    rollout or operator lateral movement; a single host or a small unrelated set points to manual activity. Use the host spread and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: --meshServiceName
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally install or run remote access agents?
  context: Compare this user's current action against their historical behavior. A user who has never deployed a remote access agent is
    more suspicious than an IT support account that does so routinely. The user's role and typical toolset should align with installing
    an unattended remote management agent.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains: --meshServiceName
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent unusual?
  context: When the alert fires under a service principal such as SYSTEM or LOCAL SERVICE, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism — which parent process spawned this binary, and whether that pair is historically common. A
    new or rare parent for this binary is the deviation worth chasing; a pair that already accounts for many prior events is vendor or OS
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same
    account installed or ran remote access tooling on several hosts in the same window, the scope of the activity may be larger than this
    single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window — a coordinated rollout, or isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since every host runs
    SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus spawned binary —
    fired on other hosts in the alert window. Multiple hosts points to scheduled or pushed automation; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context — what led to the install,
    what followed it, and whether it is part of a larger sequence. Look for reconnaissance, credential access, defense tampering, or
    additional tooling staged alongside the remote access agent.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or brute-force authentication —
    may reveal the stages that preceded the remote access install and help reconstruct the timeline. A remote access agent deployed after
    prior tamper or credential activity reads very differently from one that appears on an otherwise quiet host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
