name: Sensitive File Dump Via Print.EXE
id: e4f87b9b-8474-4af3-8308-a63210e83cad
description: |
  Detects abuse of the signed Windows utility print.exe to copy sensitive credential
  stores -- the SAM, SECURITY, or SYSTEM registry hives from the config directory, or
  the domain controller's ntds.dit -- to an attacker-chosen destination for offline
  hash extraction. The rule fires when print.exe (by image name or original filename)
  runs with the /D switch and a command line referencing one of those sensitive paths.
  Legitimate use of print.exe to send these specific files to a printer is implausible,
  so a true positive points at hands-on credential theft; the investigation should
  determine which store was targeted, where the copy landed, which accounts are exposed,
  and whether lateral movement followed.
type: detection
detection_id: 2fcda7e2-8c57-4904-86ac-37fc3157e09d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show print.exe copying a sensitive credential store with the /D switch?
  context: Confirm the alert is a true positive by reviewing the exact command line and process
    details. The rule fires only when print.exe (or a binary whose original filename is Print.EXE)
    runs with /D and a path referencing \config\SAM, \config\SECURITY, \config\SYSTEM, or
    \windows\ntds\ntds.dit. Note which target appears -- a registry hive points at local SAM-based
    theft, ntds.dit points at domain-wide credential extraction.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to copy registry hives or ntds.dit?
  context: Copying the SAM/SYSTEM/SECURITY hives or ntds.dit is not a routine task for ordinary
    users or workstations. On a domain controller a backup process may touch ntds.dit, but never
    through print.exe. Knowing whether the account and host function fit any legitimate workflow
    is the fastest way to separate a true positive from an anomaly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Which credential store was targeted, and was the copy operation completed?
  context: The path in the command line identifies the store -- the SAM hive alone yields local
    account hashes, but SAM plus SYSTEM (and ideally SECURITY) is what enables offline hash
    extraction, while ntds.dit yields every domain account. Read the full command to confirm the
    source path and capture the destination the copy was written to.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.002.tuning_parameter
  question: Where did the copied credential store land on disk?
  context: The /D destination in the command line names where the hive or ntds.dit copy was
    written. Pull file-creation events on this host for that destination path to confirm the file
    landed and to see whether it was subsequently staged, archived, or moved. Dump files commonly
    appear under user-writable locations such as the public profile or a temp directory.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        file.path|contains|expand: '%file_dirs%'
      condition: selection
    fields:
      - file.path
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned print.exe and is that parent chain expected?
  context: The parent reveals how print.exe was invoked. A console shell, a script host (wscript,
    cscript, mshta), a remote-execution service, or an exploited application server spawning
    print.exe with these arguments points at hands-on operator activity rather than any legitimate
    workflow. Walk the parent's own parent if the immediate parent is itself a shell or service host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1003.002.command_analysis
  question: What other credential-dumping commands ran on this host around the same time?
  context: A print.exe hive copy is rarely a standalone action. Operators commonly pair it with
    reg save of the SAM and SYSTEM hives, shadow-copy creation for ntds.dit access, ntdsutil,
    reconnaissance commands, or archiving of the dumped files. Surfacing nearby command lines that
    reference credential stores or staging shows whether this is one step in a broader collection.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_cred:
        CommandLine|contains:
          - 'reg save'
          - 'reg.exe save'
          - '\config\SAM'
          - '\config\SECURITY'
          - '\config\SYSTEM'
          - 'ntds.dit'
          - 'ntdsutil'
          - 'vssadmin'
          - 'shadowcopy'
          - 'HarddiskVolumeShadowCopy'
      condition: selection_host and selection_cred
    fields:
      - CommandLine
      - Image
      - User
- source: template:cue_process_tool.follow_on
  question: What child processes did print.exe spawn afterward?
  context: print.exe performing a file copy should not spawn children. Any subsequent process under
    it -- a compressor, an exfiltration tool, a shell, or a hash-extraction utility -- indicates the
    copy was part of a larger operation and identifies the next stage to investigate.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity depends on what the targeted store holds. A SAM copy exposes local accounts
    on this host; a SECURITY hive copy can expose cached domain credentials and LSA secrets; ntds.dit
    exposes every domain account including domain admins and the krbtgt account. Cross-reference the
    exposed accounts against directory group memberships to scope escalation and remediation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Credential theft is typically followed by use of the stolen material -- remote logons,
    SMB or WinRM connections, or remote-execution tooling against other systems. Follow-on alerts on
    this host shortly after the copy indicate the credentials may already be in active use. A SAM
    copy requires offline cracking first, but ntds.dit or cached-credential theft can enable near
    immediate lateral movement.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Hands-on credential theft is frequently preceded by attempts to weaken protection. The
    query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad
    exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful protection-looks-healthy signal;
    populated rows shift the disposition toward operator preparation, so review the parent process and
    signing chain of any writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously matched this print.exe credential-dump pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent/user
    distribution reflects how this specific firing pattern has run here before -- which for a
    credential-dump rule is almost always zero. A new parent, an unexpected account, or any prior
    history at all is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \print.exe
      - OriginalFileName: Print.EXE
      selection_cli:
        CommandLine|contains|windash: /D
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \windows\ntds\ntds.dit
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run print.exe at all?
  context: Compare this user's current action against their historical use of print.exe. Most users
    never invoke print.exe from the command line, let alone against credential stores, so a zero or
    near-zero history makes this invocation stand out. The user's role and typical toolset should
    align with any non-zero result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and print.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior;
    the meaningful pivot is the launch mechanism -- which parent process spawned print.exe, and
    whether that pair is historically common. A new or rare parent for print.exe is the deviation
    worth chasing; a pair already accounting for many prior events is more likely automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging on
    multiple endpoints. If the same account performed credential access or copied files on more than
    one host in this window, the scope of compromise is larger than the alerting host alone.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and print.exe combination fire on other hosts in the same window, indicating a coordinated rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism -- the parent
    process spawning print.exe -- fired on other hosts in the alert window. Multiple hosts point to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Credential dumping rarely happens in isolation. Earlier detections on the same host --
    exploitation of an application server, defense tampering, reconnaissance, or privilege escalation
    -- may reveal the stages that preceded the copy and help reconstruct how the operator reached the
    point of harvesting credential stores.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
