name: Sticky Key Like Backdoor Execution
id: 98e6638a-00cc-4bda-8cf7-6a2ff74190ee
description: |
  Detects winlogon.exe spawning a command interpreter or script host (cmd, cscript, mshta, powershell, pwsh, regsvr32, rundll32, wscript, wt) whose command line references a Windows accessibility binary name (sethc.exe, utilman.exe, osk.exe, Magnify.exe, Narrator.exe, DisplaySwitch.exe). The rule fires when ALL of these match together. This pattern is the runtime signature of an accessibility-feature backdoor: an attacker either replaces an accessibility binary or, more commonly, registers a debugger for it under Image File Execution Options, so that pressing an accessibility hotkey at the pre-authentication login screen launches a SYSTEM-level shell. Because the accessibility suite runs pre-logon, this yields an unauthenticated SYSTEM shell and survives reboots. Both variants are post-compromise persistence and privilege escalation — the operator already had admin or physical access. The investigation should confirm the spawn really came from winlogon at the logon screen, identify whether a registry IFEO Debugger value or a replaced binary is the underlying mechanism, and determine the scope and timeline of the persistence.
type: detection
detection_id: 2fdefcb3-dbda-401e-ae23-f0db027628bc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did winlogon.exe spawn a shell or script host whose command line references an accessibility binary name?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires all three conditions
    together — the parent process is winlogon.exe, the child is one of cmd, cscript, mshta, powershell, pwsh, regsvr32, rundll32,
    wscript, or wt, and the command line contains one of sethc.exe, utilman.exe, osk.exe, Magnify.exe, Narrator.exe, or
    DisplaySwitch.exe. Read the exact ParentImage, Image, and CommandLine and confirm all three are present. Note which
    accessibility binary name appears, since that names the hijacked hotkey target.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this host expected to launch a shell from the logon screen, and under what account did it run?
  context: A child of winlogon.exe referencing an accessibility binary at the login screen is essentially never legitimate
    on a normal endpoint. Confirm the account context — pre-authentication execution of this kind runs as SYSTEM, which is
    the whole point of the technique. Knowing whether this host has any sanctioned kiosk, imaging, or accessibility-automation
    workflow that touches these binaries is the fastest way to separate a rare benign case from a backdoor trigger.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is winlogon.exe expected to spawn this child, and what started winlogon itself?
  context: The winlogon-to-shell relationship is the core signal here. winlogon.exe legitimately spawns a small, fixed set
    of children (LogonUI.exe, userinit.exe, dwm.exe). A command interpreter or script host as a direct child is the anomaly
    that distinguishes an accessibility-feature backdoor from normal logon flow. Trace winlogon's own origin and command line
    to confirm this is a real interactive-logon-surface event and not a spoofed parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: attack:T1546.008.registry_ifeo_debugger
  question: Was an Image File Execution Options Debugger value set on an accessibility binary on this host?
  context: The most common variant of this backdoor sets a Debugger value under the IFEO key for an accessibility binary
    (for example HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe with Debugger
    pointing at cmd.exe), so the accessibility hotkey launches a shell with no file replacement. This registry write is the
    underlying mechanism behind the runtime execution that fired this alert. A populated result identifies the persistence
    artifact directly; review the parent process and timing of the write to identify who installed it.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Image File Execution Options\'
      selection_targets:
        TargetObject|contains:
          - '\sethc.exe\'
          - '\utilman.exe\'
          - '\osk.exe\'
          - '\Magnify.exe\'
          - '\Narrator.exe\'
          - '\DisplaySwitch.exe\'
          - '\Debugger'
      condition: selection and selection_targets
    fields:
      - TargetObject
      - Details
      - Image
- source: attack:T1546.008.binary_replacement_stream
  question: Was any accessibility binary in System32 created, overwritten, or given an alternate data stream on this host?
  context: The second variant overwrites an accessibility binary in C:\Windows\System32 (for example replacing sethc.exe or
    utilman.exe with a copy of cmd.exe) so the hotkey runs the planted shell. File creation, modification, or alternate-data-stream
    hashing of these specific paths is the artifact of the replacement variant. A write to one of these System32 paths outside
    of a patch or imaging window points to tampering; correlate the writing process and its timing with the alerting execution.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\System32\sethc.exe'
          - '\System32\utilman.exe'
          - '\System32\osk.exe'
          - '\System32\Magnify.exe'
          - '\System32\Narrator.exe'
          - '\System32\DisplaySwitch.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the spawned shell or script host do? Decode the full command line.
  context: The triggering command line shows which accessibility binary name was referenced, but the operative payload is
    whatever the shell or script host then ran. Decode every flag, path, and any encoded or obfuscated content to determine
    whether this is the bare hotkey-shell launch or a fuller command sequence. Because the alerting child can be a noisy
    interpreter, this is scoped to the exact alerting process rather than all executions of that binary on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: If the alerting child was powershell or pwsh, was the command encoded or obfuscated, and what does it decode to?
  context: When the spawned child is powershell.exe or pwsh.exe, the command line may use -EncodedCommand (-enc), string
    concatenation, backtick escaping, or variable substitution to hide intent. Base64-encoded commands are the most common
    form. Decoding reveals the actual payload — a download cradle, a reverse shell, or in-memory .NET execution. If the
    alerting child was a non-PowerShell interpreter, this question does not apply.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: If the alerting child was PowerShell, did script block logging capture the full deobfuscated script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually executes, even
    when the command line is encoded or obfuscated, providing ground truth about what ran. This applies only when the spawned
    child was powershell or pwsh. If PowerShell operational logs are not ingested in this environment, treat zero results as
    a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Operators often disable or bypass PowerShell security controls before running a payload — AMSI bypass (patching
    amsi.dll in memory), execution policy changes, constrained language mode escape, or a downgrade to PowerShell v2 which
    lacks logging. Finding these precursor events on the host strengthens the case that the accessibility-feature shell was
    used for hands-on-keyboard activity rather than a benign anomaly.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_parent_process.follow_on
  question: What other child processes did winlogon.exe spawn on this host around this time?
  context: An accessibility-feature shell is typically the entry point an operator uses to run further commands. Seeing every
    process spawned by winlogon.exe in the surrounding window reveals whether the hotkey shell launched additional tools —
    reconnaissance, credential access, or account changes — initiated through this pre-authentication execution chain.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \winlogon.exe
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
        - \wt.exe
        CommandLine|contains:
        - sethc.exe
        - utilman.exe
        - osk.exe
        - Magnify.exe
        - Narrator.exe
        - DisplaySwitch.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \winlogon.exe
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
        - \wt.exe
        CommandLine|contains:
        - sethc.exe
        - utilman.exe
        - osk.exe
        - Magnify.exe
        - Narrator.exe
        - DisplaySwitch.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this account do across the network around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals lateral movement or activity
    spanning multiple endpoints. If the same account triggered similar activity elsewhere, the scope of compromise may be
    larger. When the alert fires as SYSTEM or a service account this returns broad agent-telemetry noise — the launch-mechanism
    variant is the meaningful answer in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \winlogon.exe
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
        - \wt.exe
        CommandLine|contains:
        - sethc.exe
        - utilman.exe
        - osk.exe
        - Magnify.exe
        - Narrator.exe
        - DisplaySwitch.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_parent_process.scope
  question: Is this winlogon-spawned interpreter pattern occurring on other hosts in the environment?
  context: The same parent-child relationship appearing on multiple hosts may indicate the backdoor was deployed broadly
    rather than to a single machine. A single occurrence is more likely a targeted or opportunistic install. An environment-wide
    comparison helps calibrate severity and identify the full scope of the persistence.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host?
  context: Operators rarely rely on a single persistence mechanism. After establishing an accessibility-feature foothold,
    they commonly install backup mechanisms with different techniques — scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather
    than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — credential access, reconnaissance, or
    defense tampering — may reveal the stages that preceded the backdoor trigger and help reconstruct the timeline of how the
    operator reached pre-authentication SYSTEM access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
