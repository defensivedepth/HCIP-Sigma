name: Renamed BOINC Client Execution
id: b4cbd615-54de-4d5b-91ef-b22967d823e7
description: |
  Detects a process whose embedded PE metadata identifies it as the BOINC volunteer-computing
  client (OriginalFileName BOINC.exe) while running on disk under a different filename. The rule
  fires when the OriginalFileName is BOINC.exe AND the on-disk Image does not end in \BOINC.exe,
  so a genuine BOINC install under its real name is excluded. Renaming a signed open-source
  binary lets it run from an unexpected location under an innocuous name; the same client can be
  pointed at a non-default server and used for remote task delivery and file transfer, turning a
  legitimate compute platform into a covert control channel. The investigation should confirm the
  metadata-versus-filename mismatch, establish the binary's true identity and origin, determine
  what the process did and where it connected, and check whether the same renamed client or
  related infection markers appear elsewhere.
type: detection
detection_id: 30d07da2-83ab-45d8-ae75-ec7c0edcaffc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process carry BOINC.exe as its OriginalFileName while running under a different on-disk filename?
  context: Before investing investigation time, confirm the alert is a true positive. The rule
    fires when the embedded PE metadata reports OriginalFileName BOINC.exe but the Image path does
    not end in \BOINC.exe, meaning the BOINC client is running renamed. Confirm the OriginalFileName
    reports BOINC.exe and that the on-disk filename shown in the alert is something else; a genuine
    BOINC install running as BOINC.exe would have been filtered out.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run the BOINC compute client under a non-standard filename?
  context: Legitimate volunteer-computing or research usage normally installs BOINC under its real
    name in a standard program directory. A renamed BOINC client running under a user or host that
    has no research-computing role is harder to explain as routine. Knowing whether the user role
    and host function fit volunteer-computing activity is often the fastest way to separate a true
    positive from a sanctioned but unusual install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: The file is named something other than BOINC.exe on disk, but the embedded
    OriginalFileName reports BOINC.exe. Comparing the Image path against OriginalFileName confirms
    the mismatch, and the signing details tell you whether this is the genuine signed BOINC client
    simply renamed, an unsigned copy, or a tampered build. The file hash enables a reputation
    lookup to determine whether this matches the known BOINC client, a flagged sample, or a novel
    binary needing deeper analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did this renamed BOINC binary arrive on the host?
  context: 'A renamed client does not appear on its own — it was downloaded, extracted from an
    archive, copied, or written by a parent process. Tracing the file-creation event for the
    binary by its on-disk basename reveals the delivery mechanism. A binary written into a
    user-writable location such as a roaming profile or temp directory points to download or
    extraction; the writing process identifies the dropper, installer, or copy operation.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did this renamed binary do after execution, and does the same renamed client appear on other hosts?
  context: The point of renaming the client is to run it while evading name-based detection.
    Examining the child processes and downstream activity from the renamed binary reveals what it
    actually did on this host. The same renamed client present on multiple hosts points to
    deliberate distribution rather than a one-off install, which raises the scope of the
    investigation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What did this renamed client do? Decode its full command line, including any directory and server arguments.
  context: The full command line reveals how the client was driven. Decode the arguments to
    identify the working directory it was pointed at and any server, attach, or detach flags that
    indicate it was configured to talk to a specific compute server rather than a default project.
    The BOINC client accepts directory and console-control switches that determine where it runs
    and what it connects to.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this renamed client and is that parent chain expected?
  context: The parent process reveals how the client was launched. Volunteer-computing software is
    normally started by an installer, a service, or the user shell. A parent such as a scheduled
    task host, a script interpreter, or a browser-update process points to automated or scripted
    deployment rather than a deliberate user install. Walk up the chain to see what spawned the
    parent and what else it launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run the BOINC client?
  context: A client that has never been seen on a host is more suspicious than one that runs
    regularly as part of a sanctioned research deployment. Zero or very low historical counts of
    this binary on the host indicate first-time or rare execution and weigh toward a real finding.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific renamed-BOINC pattern has historically
    run here rather than generic binary usage. A new parent process, an unexpected user account,
    or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: BOINC.exe
      filter_main_legit_name:
        Image|endswith: \BOINC.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide
    count of the renamed-BOINC pattern rather than generic usage of the binary. Many hosts firing
    the same pattern points to scripted or pushed deployment; one host or a small unrelated set
    points to a host-local install. Use the host distribution and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: BOINC.exe
      filter_main_legit_name:
        Image|endswith: \BOINC.exe
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run the BOINC client across the environment?
  context: Compare this user's current action against their historical pattern. A user who has
    never run this binary is more suspicious than one who runs it regularly as part of a known
    research or volunteer-computing role. User role and typical toolset should align with running
    compute-client software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-binary combination historically routine on this host or across the environment, or is the parent unusual for this client?
  context: 'When the alert fires under a service principal, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. Which parent process spawned this
    renamed client, and is that pair historically common here or environment-wide. A new or rare
    parent for this binary is the deviation worth chasing; a pair that already accounts for many
    prior events is automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity
    spanning multiple endpoints. If the same user triggered similar activity on several hosts, the
    scope of the install or compromise may be larger than this one event.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-binary combination fire on other hosts in the same window, indicating a coordinated rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise because every host runs service-owned processes constantly. The
    meaningful question is whether the same launch mechanism — parent process plus spawned binary
    — fired on other hosts in the alert window. Multiple hosts in the same window point to
    scheduled or pushed deployment; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context: what led to this event, what happened after, and whether it is part of a
    larger sequence. Look for download or extraction tooling, scheduled-task creation, or
    persistence setup near the time the renamed client ran.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — script execution, obfuscated PowerShell loaders,
    or persistence creation — may reveal the stages that preceded a renamed client landing on the
    host. The sequence of prior alerts helps reconstruct how the binary arrived and was set to run.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: attack:T1553.registry_trust_artifact
  question: Were registry values written under the user's software hive around the time the renamed client appeared?
  context: Renamed compute-client deployments commonly write a small registry mark under the
    current user's software hive to flag an infected host and to support a logon-triggered
    autostart, and the same staging often modifies trust-related or run keys nearby. Registry
    writes to the user software hive close to the time the renamed binary first ran tie the
    execution to a persistence or marking step rather than a one-off launch. If registry-set
    events are not collected in this environment, treat zero results as a visibility gap rather
    than evidence nothing was written.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Software\Microsoft\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
