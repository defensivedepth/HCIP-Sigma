  dimension_coverage: []
  mutable_dispositions: []
  dedup_decisions:
    - dropped: cue_process_tool.baseline
      reason: >-
        cue_process_tool.baseline_deviation (REFLECTED, host-scoped) is more specific —
        it baselines the rule's exact Get-Recipient enumeration pattern on this host
        rather than generic powershell.exe usage, which for a noisy binary like
        powershell is the only meaningful baseline. Generic-binary baseline would return
        host-wide PowerShell volume and obscure the signal.
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.follow_on
      reason: >-
        The rule's command is a read/enumeration cmdlet, not a launcher; child-process
        spawning is not the load-bearing follow-on here. The staging/exfil follow-on
        (where the harvested list went) is covered by data_staging_exfil.archive_destination,
        and broader host activity is covered by cue_host_context.precursor. Dropped to
        stay within the 18-question cap.
    - dropped: cue_process_tool.clustering
      reason: >-
        Overlaps cue_host_context.precursor (prior-alert timeline) and the user_actor
        clustering pair (what else the actor did) for the same "surrounding activity"
        intent. Dropped to stay within the 18-question cap; precursor gives the higher-signal
        prior-detection view for this exfil-staging rule.
      kept: cue_host_context.precursor
    - dropped: cue_host_context.clustering
      reason: >-
        Near-duplicate of cue_user_actor.clustering ("what else happened around this time")
        but host-scoped rather than actor-scoped. The user_actor clustering pair already
        covers same-window activity, and precursor covers the prior-alert timeline. Dropped
        to stay within the 18-question cap.
      kept: cue_user_actor.clustering
    - dropped: null
