        The rule fires on a self-contained PowerShell launcher that reads a payload
        from the registry; the T1548.002 image_load analytic targets DLL side-loading
        into auto-elevated COM hosts, which is a different bypass family than the
        registry-staged one this rule matches. The registry write that actually sets
        up this bypass is covered directly by Q7 (attack:T1548.002.registry_set) and
        the elevated outcome by Q9, so an image_load question on eventvwr/fodhelper
        would return module-load volume without precision for the mechanism in scope.
    - hint: "logsource 'security' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: security`"
