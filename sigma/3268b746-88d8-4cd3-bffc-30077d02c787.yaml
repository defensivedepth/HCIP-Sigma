      reason: >-
        The security-channel analytic keys on 4672 (special privileges assigned),
        which marks that elevation occurred but not what the operator did with it.
        Q9 (elevated_action_after_bypass) already enumerates the High/System
        integrity processes spawned after the bypass via process_creation, which is
        the actionable view of the same elevation event. A 4672 question would
