      kept: template:cue_process_tool.scope
    - dropped: network_scope.actor_activity_network_wide
      reason: "Generic 'user activity across all hosts' duplicates the user baseline (Q12) and lateral_movement_scope (Q14); both already pivot on this user across the fleet without adding a redundant broad sweep."
