name: Port Forwarding Activity Via SSH.EXE
id: acced3eb-e5e8-4594-a38e-26039eacbbb1
description: |
  Detects the built-in OpenSSH client (ssh.exe) invoked with a remote port-forward flag (-R), which exposes a service on the victim back to a remote SSH endpoint over an encrypted channel. This is a protocol-tunneling pattern: legitimate administrators use SSH forwarding for remote management, but the same -R form is commonly used to relay internal services to an external command-and-control host once initial access is gained, and to maintain a persistent reverse tunnel. The investigation should determine the tunnel direction and target, whether the SSH usage is authorized and documented, what process launched it, and whether the same tunneling pattern appears under other users or on other hosts.
type: detection
detection_id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show ssh.exe invoked with a remote port-forward (-R) flag?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process image. The rule fires when the image ends in ssh.exe AND the command line contains a remote-forward switch (-R, in any dash variant). Read the full argument string to confirm both conditions are present and to capture the forward specification that follows -R.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run SSH port forwarding?
  context: Legitimate administrative activity can trigger this detection. Knowing whether the user's role and the host's function include SSH tunneling or remote management is often the fastest path to distinguishing routine operations from operator activity. Developers, network engineers, and IT admins may run SSH forwards routinely; general user workstations and servers without an SSH-administration role rarely should.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the full ssh.exe command line specify -- the forward direction, the bind/target ports, and the remote endpoint?
  context: The full command line reveals the tunnel's purpose. Decode the -R specification (remoteport:host:localport) to see which victim-side service is being exposed and where it is relayed. Note any additional forwards (-L local forward, -D dynamic SOCKS proxy) and the destination user@host. This query returns every ssh.exe execution on this host within the window, so sequential or repeated tunnel setups appear together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:remote_access_tool.tool_authorization
  question: Is SSH port forwarding authorized for use on this host, and what business purpose does it serve?
  context: Organizations typically sanction a specific set of remote-access and tunneling methods. SSH reverse forwarding that is not part of a documented administrative procedure may represent shadow IT or operator-deployed persistence, regardless of the fact that ssh.exe ships with Windows. Confirm whether this host has an approved use case for outbound SSH tunnels.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is this SSH session part of a documented administrative procedure or an active support ticket?
  context: Legitimate tunnel usage typically correlates with an active maintenance window, a change ticket, or a documented remote-management procedure. If no support or change context explains this session, the tunnel may have been established for persistent external access or to circumvent network controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint is ssh.exe connecting to, and is it internal infrastructure or an arbitrary external address?
  context: A reverse SSH tunnel relays a victim-side service to the remote SSH server named on the command line. The destination reveals whether the tunnel terminates on managed internal infrastructure or on an arbitrary external host. Outbound port 22 (or a non-standard port set with -p) to an unfamiliar address is consistent with relaying an internal service to a remote operator endpoint.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1572.obfuscation_check
  question: Does the ssh.exe command line carry unattended-automation flags such as -N, -f, -i, or -o StrictHostKeyChecking=no?
  context: A tunnel built for hands-off operation usually disables the interactive shell and suppresses prompts. -N runs a pure tunnel with no remote command, -f backgrounds it, -i supplies a key file for non-interactive auth, and -o StrictHostKeyChecking=no skips the host-key prompt. These flags accompanying -R point to a scripted or persistent reverse tunnel rather than an analyst typing an interactive session. Decode any -o ServerAliveInterval / ServerAliveCountMax values, which keep the tunnel alive across idle periods.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ssh.exe
        CommandLine|contains:
          - ' -N'
          - ' -f'
          - ' -i '
          - 'StrictHostKeyChecking=no'
          - 'ServerAliveInterval'
          - 'ServerAliveCountMax'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: selection and _pb_scope
    fields:
      - CommandLine
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned ssh.exe, and is that parent chain expected for SSH usage?
  context: The parent process reveals how the tunnel was launched. Interactive SSH usage typically descends from a shell or terminal started by explorer.exe. Parents such as script hosts, Office applications, web servers, or a service binary that has no business running SSH suggest the forward was launched by automation or by an implant rather than by an administrator at the keyboard.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did ssh.exe spawn afterward on this host?
  context: A pure forwarder normally spawns nothing. Children of ssh.exe -- a shell, an interpreter, or post-exploitation utilities -- indicate the session ran remote commands in addition to (or instead of) tunneling, which broadens the scope of what the access was used for.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run ssh.exe?
  context: A binary that has never been seen on a host is more notable than one that runs regularly. Zero or very low counts over the baseline window indicate first-time or rare SSH usage on this endpoint, which raises the priority of the other tunnel-direction and authorization questions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run ssh.exe with a remote-forward flag, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even legitimate tooling can be abused. This query mirrors the rule's selection -- ssh.exe with a -R remote-forward switch -- scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern has historically run here, not generic SSH usage. A new parent process, an unexpected user account, or a first-time appearance of this pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ssh.exe
        CommandLine|contains|windash: ' -R '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ssh.exe
        CommandLine|contains|windash: ' -R '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ssh.exe
        CommandLine|contains|windash: ' -R '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:lateral_movement.lateral_movement_scope
  question: Has this user account run SSH or other tunneling tools against other hosts in the environment?
  context: A reverse tunnel is often one leg of broader movement. If the same user account is running SSH or other tunneling utilities across multiple systems in a short window, the scope of activity is larger than a single host. A spread across many hosts from one account points to active pivoting rather than an isolated admin task.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- source: template:network_scope.actor_authentication_trail
  question: Where has this user authenticated recently?
  context: Authentication events show which systems the user accessed before and after the tunnel was established. A user authenticating to many systems in a short period, especially network (type 3) or remote-interactive (type 10) logons, suggests movement in progress that the tunnel may be supporting. If Security logon events are not collected in this environment, treat empty results as a visibility gap rather than evidence of no activity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4625
        TargetUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - IpAddress
      - EventID
      - LogonType
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the tunnel setup reveals the immediate context: what led to it, what followed, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, credential access, or staging that surrounds the SSH invocation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the stages that preceded the tunnel and help reconstruct the timeline. Reverse tunnels are frequently established after initial access and enumeration, so prior alerts often mark how the operator reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts run ssh.exe with a remote-forward flag in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection -- ssh.exe with a -R remote-forward switch -- with no host scope, so the result is a fleet-wide count of the firing pattern rather than generic SSH usage. Many hosts running the same pattern points to scripted deployment or sanctioned management tooling; a single host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ssh.exe
        CommandLine|contains|windash: ' -R '
      condition: selection
    fields:
    - host.name
