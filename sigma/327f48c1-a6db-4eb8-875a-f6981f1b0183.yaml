      kept: template:remote_access_tool.connection_destination
    - dropped: lateral_movement.authentication_method
      reason: "Pass-the-hash / Kerberos-ticket authentication analysis applies to an inbound interactive/network logon. The rule detects an outbound SSH tunneling process, not an authentication event on this host, so the auth-method framing is not load-bearing. User authentication trail (Q15) covers the relevant logon context."
