name: Shell32 DLL Execution in Suspicious Directory
id: 583dcd1c-92ce-474c-848e-d8631253b3ff
description: |
  Detects rundll32.exe (or a binary whose OriginalFileName is RUNDLL32.EXE) invoking shell32.dll
  with Control_RunDLL while the command line also references a user-writable directory such as AppData,
  Temp, or Users\Public. Control_RunDLL is a legitimate shell entry point, but pointing it at content
  that lives in a roaming or temporary directory is a common proxy-execution pattern that runs attacker
  payloads under a trusted, signed system binary. The investigation should confirm what shell32 was
  pointed at, which parent launched rundll32, whether a payload DLL or file was written to or loaded
  from the suspicious directory, and whether rundll32 then reached out over the network.
type: detection
detection_id: 32b96012-7892-429e-b26c-ac2bf46066ff
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show rundll32 running shell32.dll Control_RunDLL with a user-writable directory reference?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when rundll32.exe
    (or a binary reporting OriginalFileName RUNDLL32.EXE) runs shell32.dll with Control_RunDLL AND the command line also
    references a roaming or temporary directory such as %AppData%, %LocalAppData%, %Temp%, %tmp%, \AppData\, \Temp\, or
    \Users\Public\. Read the exact command line and confirm both the shell32/Control_RunDLL pattern and the directory token are present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to launch shell applets or control-panel items through rundll32 from a temporary directory?
  context: Legitimate Control_RunDLL usage normally references built-in .cpl items or signed components under System32,
    not content staged in AppData, Temp, or Users\Public. Knowing whether this user role and host function routinely run
    such applets from user-writable paths is often the fastest way to separate a true positive from routine activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did rundll32 pass to shell32.dll Control_RunDLL, and what directory or payload does it point at?
  context: The full command line reveals what shell32 was actually asked to load. Decode the argument after Control_RunDLL,
    resolve any environment-variable directory token to its real path, and identify the file or applet the command targets.
    A reference to a DLL, .cpl, script, or arbitrary file under a roaming or temporary directory is the operational payload
    this proxy-execution pattern is hiding behind a signed binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - shell32.dll
          - Control_RunDLL
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this rundll32 instance and is that parent chain expected?
  context: The parent process reveals how rundll32 was invoked. Operator-driven proxy execution is often launched from
    explorer.exe via a double-click, from Office applications, or from script hosts such as wscript.exe, mshta.exe, or a
    command shell. A parent that is itself a suspicious or short-lived process strengthens the case that this is staged execution rather than a user opening a control-panel item.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.011.image_load
  question: What modules did this rundll32 instance load, and was a DLL loaded from the suspicious directory rather than System32?
  context: rundll32 maps the target module into memory. shell32.dll itself is a normal System32 module, but Control_RunDLL
    can chain into a second DLL that lives in the user-writable directory referenced on the command line. Correlate the
    module loads from this rundll32 process within seconds of its start and flag any image loaded from AppData, Temp, or
    Users\Public, or any module that is not on the host's baseline of DLLs normally executed by rundll32.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
- source: attack:T1218.011.network_connection
  question: Did this rundll32 instance make any outbound network connections after it started?
  context: Proxy execution through rundll32 frequently retrieves a follow-on payload or beacons to an external host. A
    signed system binary contacting an external address that falls outside the environment's normal egress ranges is the
    anomaly worth chasing here. Connections to internal update or management infrastructure are expected; connections to
    arbitrary external addresses, especially shortly after the suspicious command ran, point toward retrieval or command-and-control.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1218.011.file_event
  question: Was a DLL or other file written into the suspicious directory shortly before rundll32 ran?
  context: The payload that Control_RunDLL points at usually has to land on disk first. Look for file writes into the same
    roaming or temporary directory referenced on the command line in the minutes before the alert, and identify which
    process wrote them. A file dropped by a browser, an archive utility, a script host, or an email client immediately
    before rundll32 executed ties the proxy execution to its delivery stage.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \AppData\
          - \Temp\
          - \Users\Public\
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services,
    flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy"
    signal; kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition
    toward operator preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led
    to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, persistence installation, or data staging that frames the rundll32 execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Does this user normally run rundll32 to launch shell applets or control-panel items?
  context: Compare this user's current action against their historical behavior. A user who has never driven Control_RunDLL
    through rundll32 is more suspicious than one who does so regularly. User role and typical toolset should align with
    running shell components from the command line.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-rundll32 launch combination historically routine on this host or across the environment, or is the parent unusual for rundll32?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot
    is the launch mechanism: which parent process spawned rundll32, and is that pair historically common. A new or rare
    parent for rundll32 on this host or environment-wide is the deviation worth chasing; a pair that already accounts for
    thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints.
    If the same user triggered similar activity on multiple hosts, the scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-rundll32 combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since
    every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism, the parent
    process plus the spawned rundll32, fired on other hosts in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this shell32 Control_RunDLL pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how the rule's specific firing pattern (not generic rundll32 usage)
    has historically run here. A new parent process, an unexpected user account, or an unusual command-line shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - shell32.dll
        - Control_RunDLL
        CommandLine|contains:
        - '%AppData%'
        - '%LocalAppData%'
        - '%Temp%'
        - '%tmp%'
        - \AppData\
        - \Temp\
        - \Users\Public\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this shell32 Control_RunDLL pattern over the past 90 days, and what command-line shapes are typical?
  context: A proxy-execution pattern with no prior history on a host is more suspicious than one used regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the resulting count reflects the rule's
    specific firing pattern, not generic rundll32 usage. The command-line projection lets the analyst compare typical
    invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - shell32.dll
        - Control_RunDLL
        CommandLine|contains:
        - '%AppData%'
        - '%LocalAppData%'
        - '%Temp%'
        - '%tmp%'
        - \AppData\
        - \Temp\
        - \Users\Public\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who use one proxy-execution binary often use several. If rundll32 ran a payload here, check whether
    regsvr32, mshta, msbuild, installutil, msiexec, or similar signed binaries were also used to run arbitrary code on
    this host. Finding multiple proxy-execution LOLBins performing the same kind of action strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was rundll32 executed from its expected System32 or SysWOW64 path?
  context: rundll32 executed from a path outside System32 or SysWOW64 may indicate the binary was copied or renamed to
    evade path-based allowlists. The rule keys partly on OriginalFileName RUNDLL32.EXE, so a process reporting that original
    name while running from a user-writable directory is an additional sign of relocation or renaming.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance,
    or credential access, may reveal the stages that preceded this proxy execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
