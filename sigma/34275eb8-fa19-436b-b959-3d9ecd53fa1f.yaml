name: Loaded Module Enumeration Via Tasklist.EXE
id: bd5ab494-2e96-49ce-9145-58cd145176b3
description: |
  Detects tasklist.exe enumerating which processes have loaded a specific module
  (rdpcorets.dll) via the -m flag. This is the reconnaissance step used to locate the
  svchost.exe instance hosting the Terminal Services / RDP connection so its process
  memory can be dumped to recover plaintext RDP credentials directly from that process
  — a path that bypasses LSASS-focused credential-theft detections. The rule fires when
  the image resolves to tasklist.exe AND the command line carries the -m (module) flag
  AND the command line references rdpcorets.dll, so confirm all three before treating it
  as a true positive. Determine whether the located process was subsequently opened or
  dumped, which account ran the enumeration, and whether credential reuse or lateral
  movement followed.
type: detection
detection_id: 34275eb8-fa19-436b-b959-3d9ecd53fa1f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-05'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show tasklist.exe run with the -m module flag against rdpcorets.dll?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires only when all three criteria match together — the image resolves to
    tasklist.exe, the command line includes the -m (loaded-module) flag, and the command
    line references rdpcorets.dll. Review the exact command line and image against these
    criteria; a tasklist run without -m or against a different module is a different action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enumerate which processes have loaded an RDP-core module?
  context: Querying for the process that loaded the Terminal Services RDP-core module is a
    narrow, targeted action — it is not part of routine troubleshooting. Knowing whether
    this user role and host function plausibly involve RDP diagnostics or remote-session
    administration is often the fastest way to separate a true positive from a rare but
    legitimate operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Credential-access reconnaissance is frequently preceded by an operator weakening
    protection so the subsequent memory dump runs unimpeded. The query surfaces direct
    attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear
    logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal —
    kernel-level driver tampering and in-memory patches will not appear here. Populated
    rows shift the disposition toward operator preparation; review the parent process and
    signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:credential_access.credential_target_identification
  question: What was the full enumeration command, and does it confirm the operator was locating the RDP-hosting process?
  context: This enumeration locates the svchost.exe instance hosting the Terminal Services
    / RDP connection — the process whose memory holds the connecting user's plaintext
    password, distinct from LSASS. Decode the full command line to confirm the target
    module and flag, and determine whether the same actor went on to open or dump the
    located process. The method used to dump it (procdump, a comsvcs.dll MiniDump call via
    rundll32, or direct memory access) reveals operator sophistication.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.access_verification
  question: Was a high-rights handle opened to an svchost.exe process on this host shortly after the enumeration?
  context: The enumeration only finds the process identifier; the credential theft happens
    when something opens that svchost.exe with full process-access rights (0x1F0FFF) and
    reads or dumps its memory. Look for process-access events targeting svchost.exe from a
    source process that is not a recognized security tool, especially with a granted-access
    mask granting full read. If process-access telemetry is not collected in this
    environment, treat the absence of rows as a visibility gap, not as evidence no dump
    occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\svchost.exe'
      filter_known:
        GrantedAccess:
          - '0x1000'
          - '0x1400'
      condition: selection and not filter_known
    fields:
      - SourceImage
      - TargetImage
      - GrantedAccess
- source: attack:T1003.dump_artifact
  question: Was a process-memory dump file written on this host in the hours after the enumeration?
  context: Recovering the RDP password requires dumping the located process to disk and
    searching it for strings, so a dump artifact written close in time to the enumeration
    is a strong corroborating signal. Look for newly created .dmp files or large files in
    user-writable or temp locations. Pair the writer process with the account that ran the
    enumeration to see whether the same actor staged a dump.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.dmp'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be exposed through the RDP-host process, and do any have elevated privileges?
  context: The memory of the svchost.exe hosting Terminal Services can contain the plaintext
    credentials of whichever user is or was connected over RDP to this host. Identify which
    accounts have active or recent RDP sessions to this host; if any are domain admins or
    privileged service accounts, the exposure warrants escalation and credential rotation
    rather than monitoring alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated from this host after the enumeration?
  context: Recovered RDP credentials are typically reused to move to other systems. Look on
    this host's alert timeline for follow-on signals of lateral movement — new outbound
    RDP, SMB, or WinRM sessions, or remote-execution tooling — in the hours after the
    enumeration. Their presence indicates the recovered credentials may already be in
    active use.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this tasklist enumeration, and is that parent chain normal?
  context: A module enumeration run from cmd.exe spawned by explorer.exe reflects interactive
    use; the same command spawned by a script interpreter, wmiprvse.exe, wsmprovhost.exe,
    or an unexpected remote-execution parent points to automated post-compromise activity.
    The remote credential-theft pattern this rule targets is often driven over a remote
    shell, so an unusual parent here raises the weight of the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single module enumeration may be isolated, but several reconnaissance binaries
    in rapid succession — whoami, net, ipconfig, netstat, query — is a signature of
    hands-on post-compromise enumeration. Reconnaissance clustered with this RDP-host lookup
    suggests an operator orienting before staging the memory dump. Three or more distinct
    recon binaries within fifteen minutes typically indicates automated reconnaissance.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously ran tasklist against rdpcorets.dll, what parents and users drove it, and does this alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure
    scoped to this host — the resulting parent/user distribution reflects how this specific
    firing pattern (not generic tasklist usage) has historically run here. A new parent
    process, an unexpected user account, or a first-ever appearance of this exact module
    lookup is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \tasklist.exe
      - OriginalFileName: tasklist.exe
      selection_flags:
        CommandLine|contains|windash: -m
      selection_module:
        CommandLine|contains: rdpcorets.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts run tasklist against rdpcorets.dll in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result
    is a fleet-wide count of this exact RDP-host lookup (not generic tasklist usage). Many
    hosts firing the same pattern can point to a scripted survey or vendor tooling; one host
    or a small unrelated set points to manual operator activity. Because this module lookup
    is rarely a legitimate diagnostic, even a low cross-host count deserves scrutiny.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \tasklist.exe
      - OriginalFileName: tasklist.exe
      selection_flags:
        CommandLine|contains|windash: -m
      selection_module:
        CommandLine|contains: rdpcorets.dll
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run tasklist for process enumeration?
  context: Compare this user's current action against their historical behavior. A user who
    has never run tasklist for module enumeration is more notable than one who does so
    regularly as part of an administrative role. The user's typical toolset and function
    should align with targeted RDP-host process lookups.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-tasklist combination historically routine on this host or environment, or is the parent unusual for it?
  context: When the alert fires under a service principal, user identity does not attribute
    behavior. The meaningful pivot is the launch mechanism — which parent process spawned
    tasklist.exe, and whether that pair is historically common. A new or rare parent for
    this binary on this host or across the environment is the deviation worth chasing; a
    pair that already accounts for many prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    parallel activity on multiple endpoints. If the same user ran this RDP-host lookup or
    related credential-access actions on several hosts in this window, the scope of
    compromise may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent-and-tasklist combination fire on other hosts in this window — a coordinated rollout or isolated activity?
  context: Under a service principal, "what else did this user do" returns agent-telemetry
    noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is
    whether the same launch mechanism — parent process plus spawned binary — fired on other
    hosts in the alert window. Multiple hosts in the same window points to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context: what led to this enumeration, what happened after, and whether it is
    part of a larger sequence. Look for reconnaissance, process-dumping tooling, or
    credential-staging steps surrounding the event.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, remote access, or other credential-access activity — may
    reveal the attack stages that preceded this enumeration and help reconstruct the full
    timeline leading up to a planned memory dump.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
