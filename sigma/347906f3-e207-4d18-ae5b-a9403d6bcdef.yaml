name: Netsh Allow Group Policy on Microsoft Defender Firewall
id: ba6b7049-af08-4181-8572-a7d479e89420
description: |
  Detects netsh.exe enabling a built-in Microsoft Defender Firewall rule group, where the command line contains
  the advfirewall firewall context together with set rule, group=, new, and enable=Yes (all conditions must match).
  This is the canonical legitimate path for opening predefined rule groups such as "remote desktop" or "File and
  Printer Sharing" — and the same syntax is what an operator reuses to open inbound RDP or SMB on a host while
  preparing for follow-on access. Determine which rule group was enabled, whether the user and host are expected
  to administer the firewall this way, and whether the change is isolated or part of broader defense-modification
  and lateral-movement preparation.
type: detection
detection_id: 347906f3-e207-4d18-ae5b-a9403d6bcdef
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the netsh command line match what this rule detects — the advfirewall firewall context with set rule, group=, new, and enable=Yes?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when all of these
    appear together on a netsh.exe (or a binary whose OriginalFileName is netsh.exe) command line. Read the full command line
    and confirm the advfirewall firewall set rule group= ... new enable=Yes pattern is present, and note which rule group was
    named.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enable Microsoft Defender Firewall rule groups via netsh?
  context: Legitimate firewall administration triggers this detection routinely. Knowing whether the user's role (desktop
    support, server administration, deployment automation) and the host's function are consistent with reconfiguring the
    firewall is often the fastest way to separate routine operations from operator preparation for inbound access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which firewall rule group was enabled, and what inbound access does it open?
  context: The command line reveals the specific control changed. The group= value identifies which built-in rule group was
    turned on — "remote desktop" opens inbound RDP, "File and Printer Sharing" opens inbound SMB/NetBIOS, and others map to
    distinct services. Note any profile= scoping (domain, private, public) as well, since it determines on which networks the
    opening takes effect. Identifying the exact group sets the investigation priority.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is the firewall rule group still enabled, or has the change been reverted on this host?
  context: The opening may be temporary (for a specific maintenance action) or persistent. Check the current firewall
    configuration on the host to confirm whether the rule group is still active and which profiles it applies to. If an
    inbound RDP or SMB opening is still in place and was not expected, it should be closed before further investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the firewall rule group was enabled?
  context: An inbound opening is usually a means to an end. Examining process activity in the window after the firewall change
    reveals what the opening enabled — inbound remote sessions, file transfers over the newly allowed service, or follow-on
    tooling. Correlating the firewall change with what runs next is the core of the time-correlation question.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense-modification actions performed on this host?
  context: Operators who modify one control often modify several — opening a firewall rule group alongside stopping a security
    service, clearing logs, or disabling Defender creates maximum coverage. The query surfaces other firewall, service-stop,
    log-clearing, and recovery-tampering tool executions in the surrounding window. Tune the monitored-command and
    service-name lists to your environment's authorized admin tooling so routine maintenance does not dominate the result.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: attack:T1562.004.registry_set
  question: Were the firewall policy registry keys modified on this host around the time of the alert?
  context: Firewall changes can be made through the registry as well as through netsh, and the same logical modification
    lands under HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy. Surfacing registry writes to
    these keys in the same window confirms whether the netsh invocation was the only firewall change or one of several, and
    catches policy edits that bypass command-line detection. If registry_set events are not collected in this environment,
    treat zero results as a visibility gap rather than evidence nothing changed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\SharedAccess\Parameters\FirewallPolicy'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned netsh, and is that parent chain expected for firewall administration?
  context: The parent process reveals how netsh was invoked. Legitimate firewall administration usually has predictable
    parents — an interactive console (cmd.exe, powershell.exe under explorer.exe), a management agent, or a deployment script.
    Unusual parents such as mshta.exe, wscript.exe, or an Office application point to scripted or exploited execution rather
    than hands-on administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - advfirewall
        - firewall
        - set
        - rule
        - group=
        - new
        - enable=Yes
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - advfirewall
        - firewall
        - set
        - rule
        - group=
        - new
        - enable=Yes
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the firewall change is isolated or part of broader
    movement. If the same user enabled firewall rule groups or ran other administrative tooling on multiple hosts in this
    window, the scope of the activity is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - advfirewall
        - firewall
        - set
        - rule
        - group=
        - new
        - enable=Yes
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this firewall rule-group pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    specific firewall-enable pattern rather than generic netsh usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation that legitimately opens rule groups; one host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - advfirewall
        - firewall
        - set
        - rule
        - group=
        - new
        - enable=Yes
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the firewall change reveals the immediate
    context — what led to it and what happened after. Novel parent-child pairs stand out at low counts against the high-count
    rows of routine agent and system telemetry; look for reconnaissance, privilege escalation, or persistence that brackets
    the firewall modification.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense modification, reconnaissance, credential access — may reveal the
    stages that preceded the firewall change and help reconstruct the timeline. Opening an inbound rule group is often a
    preparatory step, so prior alerts can indicate what the access is being readied for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were other built-in tools used to prepare inbound access or modify defenses on this host recently?
  context: An operator who opens a firewall rule group often uses additional native tools toward the same objective — toggling
    Remote Desktop through reg or sc, adjusting services with sc, or scripting further firewall changes through PowerShell.
    Finding multiple native tools touching network exposure and defenses in the same window strengthens the case that this is
    deliberate access preparation rather than a one-off administrative change.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
          - '\wmic.exe'
          - '\schtasks.exe'
          - '\bitsadmin.exe'
          - '\certutil.exe'
          - '\curl.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was netsh executed from its expected System32 or SysWOW64 path?
  context: A native tool executed from a non-standard path (outside System32 or SysWOW64) may indicate the binary was copied
    or renamed to evade path-based allowlists. A netsh.exe running from a user's temp or download directory is more suspicious
    than one in System32; the OriginalFileName field confirms identity even if the on-disk name was changed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this netsh firewall rule-group pattern over the past 90 days, and what command-line structures are typical?
  context: A firewall-enable pattern with no prior history on a host is more suspicious than one used regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing
    pattern rather than generic netsh usage. The command-line projection lets you compare typical invocation patterns — which
    rule groups are normally enabled here — against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - advfirewall
        - firewall
        - set
        - rule
        - group=
        - new
        - enable=Yes
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
