name: Potential Defense Evasion Via Binary Rename
id: e3089e16-bc4f-4e31-8f3c-a9d6c0d9dc32
description: |
  Detects execution of a process whose embedded PE metadata (OriginalFileName) identifies it as a
  common system or LOLBAS utility (cmd, conhost, 7z/7za, WinRAR, wevtutil, net/net1, netsh, InstallUtil)
  while the on-disk Image name does not match that utility's expected executable name. The mismatch is
  the signal: an attacker renames a known tool so the process name looks benign while the metadata still
  reveals the true utility. Legitimate causes exist — custom applications occasionally ship slightly
  renamed copies of bundled tools — and these are usually easy to identify and whitelist. The
  investigation should confirm the metadata-versus-name mismatch, recover the binary's true identity and
  origin, and determine what the renamed tool actually did once it ran.
type: detection
detection_id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process show a renamed-utility mismatch — OriginalFileName naming a known
    tool while the on-disk Image name differs?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when
    OriginalFileName matches one of the watched utilities (cmd, conhost, 7z, 7za, WinRAR, wevtutil, net,
    net1, netsh, InstallUtil) AND the Image path does NOT end with that utility's expected name — both
    conditions must hold. Read the OriginalFileName and the Image path from the triggering event and
    verify they genuinely disagree; a matching pair is a false trigger.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run a renamed copy of a system or archive utility?
  context: Legitimate administrative activity and custom applications can trigger this detection. Knowing
    whether the user role and host function are consistent with running a renamed build of cmd, net,
    netsh, WinRAR, 7-Zip, or InstallUtil is often the fastest path to separating a packaged third-party
    application from operator activity. A developer workstation or an IT-deployed tool that bundles a
    renamed utility is a different disposition than a server with no such software.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: When a binary is renamed, the PE metadata (OriginalFileName) and code-signing details still
    reflect the original tool — here one of cmd, conhost, 7z, 7za, WinRAR, wevtutil, net, net1, netsh, or
    InstallUtil. Comparing the Image path (the name on disk) against OriginalFileName confirms the true
    identity. The signing party and signature status indicate whether this is a Microsoft-signed system
    binary, a third-party signed tool, or unsigned/tampered. The file hash enables reputation lookups to
    determine whether this is a known legitimate copy, a known-bad sample, or a novel binary needing
    deeper analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: What did the renamed utility actually do? Decode its full command line and arguments.
  context: The full command line reveals the operation the renamed tool performed. Decode every flag,
    parameter, path, and any encoded content. Unusual or rare argument combinations for the underlying
    utility are the command-analysis signal — for example net/net1 enumerating accounts or shares, netsh
    altering firewall or proxy settings, wevtutil clearing logs, or 7z/WinRAR staging an archive for
    exfiltration. This query scopes to all executions of this Image on this host within the window, so a
    multi-step operation spread across several invocations is captured together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:masquerading.binary_origin
  question: How did this renamed binary arrive on the host, and how long before execution was it created?
  context: Renamed binaries do not appear spontaneously — they were copied, downloaded, extracted from an
    archive, or dropped by a parent process. Tracing the file-creation event for this filename reveals the
    delivery mechanism and, by comparing the creation time against the execution time, the correlation
    window. A file created and run within seconds points to hands-on operator activity; a file installed
    long ago and only now executed points to a packaged application. A user-writable landing path (Desktop,
    Downloads, Temp, AppData, Public) suggests download or extraction, while a non-standard system path on
    a binary that claims to be a signed utility is itself the path-tuning anomaly worth chasing.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this renamed binary, and is that parent chain expected?
  context: The parent process reveals how the renamed tool was invoked and is the execution-context
    signal. Legitimate usage has predictable parents — explorer.exe for interactive launches, an
    installer or services.exe for deployed software. Unusual parents such as mshta.exe, wscript.exe,
    cscript.exe, or an Office application point to script-driven or macro-driven execution. Trace upward
    from the immediate parent to understand what launched the chain.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did the renamed binary do after execution, including any child processes or service
    registration?
  context: The point of renaming a utility is to perform its function while evading name-based detection.
    Examining the child processes, follow-on commands, and any service registration the renamed binary
    drove reveals its actual objective — credential access, reconnaissance, log clearing, archive
    staging, or lateral movement. File creation followed by execution and then service or process
    activity inconsistent with the utility's normal use is the behavioral chain that distinguishes abuse
    from a benignly renamed copy.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run a binary with this on-disk name?
  context: A process name that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts over the past quarter indicate first-time or rare
    execution of this renamed binary, which raises the priority of recovering its origin and purpose.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously matched this rule's renamed-utility pattern, what parents and
    users normally drove it, and does the current alert fit?
  context: Even routine renamed copies recur with a stable signature. This query mirrors the rule's
    selection (OriginalFileName mismatch) scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here — not generic binary
    usage. A new parent process, an unexpected user account, or an unusual command structure against that
    established baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - Cmd.Exe
        - CONHOST.EXE
        - 7z.exe
        - 7za.exe
        - WinRAR.exe
        - wevtutil.exe
        - net.exe
        - net1.exe
        - netsh.exe
        - InstallUtil.exe
      filter:
        Image|endswith:
        - \cmd.exe
        - \conhost.exe
        - \7z.exe
        - \7za.exe
        - \WinRAR.exe
        - \wevtutil.exe
        - \net.exe
        - \net1.exe
        - \netsh.exe
        - \InstallUtil.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - Cmd.Exe
        - CONHOST.EXE
        - 7z.exe
        - 7za.exe
        - WinRAR.exe
        - wevtutil.exe
        - net.exe
        - net1.exe
        - netsh.exe
        - InstallUtil.exe
      filter:
        Image|endswith:
        - \cmd.exe
        - \conhost.exe
        - \7z.exe
        - \7za.exe
        - \WinRAR.exe
        - \wevtutil.exe
        - \net.exe
        - \net1.exe
        - \netsh.exe
        - \InstallUtil.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - Cmd.Exe
        - CONHOST.EXE
        - 7z.exe
        - 7za.exe
        - WinRAR.exe
        - wevtutil.exe
        - net.exe
        - net1.exe
        - netsh.exe
        - InstallUtil.exe
      filter:
        Image|endswith:
        - \cmd.exe
        - \conhost.exe
        - \7z.exe
        - \7za.exe
        - \WinRAR.exe
        - \wevtutil.exe
        - \net.exe
        - \net1.exe
        - \netsh.exe
        - \InstallUtil.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity
    on multiple endpoints. If the same account triggered similar renamed-tool execution elsewhere in the
    same window, the scope of the activity is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - Cmd.Exe
        - CONHOST.EXE
        - 7z.exe
        - 7za.exe
        - WinRAR.exe
        - wevtutil.exe
        - net.exe
        - net1.exe
        - netsh.exe
        - InstallUtil.exe
      filter:
        Image|endswith:
        - \cmd.exe
        - \conhost.exe
        - \7z.exe
        - \7za.exe
        - \WinRAR.exe
        - \wevtutil.exe
        - \net.exe
        - \net1.exe
        - \netsh.exe
        - \InstallUtil.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the surrounding process activity reveals the
    immediate context: what led to this event, what happened after, and whether the renamed-tool execution
    is one step in a larger sequence. Look for reconnaissance, privilege escalation, persistence, or
    staging. Aggregating by Image and ParentImage collapses repetitive agent telemetry into high-count
    rows while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the attack stages that preceded the renamed-tool
    execution and help reconstruct the full timeline. Binary renaming is a defense-evasion step that
    frequently sits alongside other preparatory activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts matched this rule's renamed-utility pattern in the past week, and does the
    cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the firing pattern itself — not generic usage of these utilities. Many hosts
    matching the same pattern points to scripted deployment or vendor automation that ships a renamed
    binary; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - Cmd.Exe
        - CONHOST.EXE
        - 7z.exe
        - 7za.exe
        - WinRAR.exe
        - wevtutil.exe
        - net.exe
        - net1.exe
        - netsh.exe
        - InstallUtil.exe
      filter:
        Image|endswith:
        - \cmd.exe
        - \conhost.exe
        - \7z.exe
        - \7za.exe
        - \WinRAR.exe
        - \wevtutil.exe
        - \net.exe
        - \net1.exe
        - \netsh.exe
        - \InstallUtil.exe
      condition: selection and not filter
    fields:
    - host.name
