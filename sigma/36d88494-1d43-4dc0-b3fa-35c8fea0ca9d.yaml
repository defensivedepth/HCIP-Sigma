name: HackTool - CreateMiniDump Execution
id: 6d672c2f-b49b-44a7-a50a-07830b2d6098
description: |
  Detects execution of the CreateMiniDump hacking tool, identified either by its image name (CreateMiniDump.exe)
  or by a known import hash, used to dump the lsass.exe process memory for offline credential extraction. The tool
  opens a full-access handle to LSASS and writes a minidump (to disk or held in memory) that yields plaintext
  passwords, hashes, and Kerberos tickets when parsed offline; legitimate process-memory captures normally come
  from signed AV/EDR or diagnostic tooling, not a renamed custom dumper. Investigation should confirm the tool
  identity, determine whether an authorized assessment is in flight, find the dump artifact, and scope which
  accounts and downstream activity may be exposed.
type: detection
detection_id: 36d88494-1d43-4dc0-b3fa-35c8fea0ca9d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match CreateMiniDump either by image name or by its known import hash?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a process image
    ends in CreateMiniDump.exe or when its import hash matches the known CreateMiniDump build. Review the Image path
    and the Hashes value of the triggering event to confirm which branch matched, since a renamed binary can match
    on the import hash alone even when the filename looks innocuous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- source: template:universal.host_user_context
  question: Is this user and host expected to capture or dump process memory from LSASS?
  context: >-
    Legitimate LSASS memory access is normally performed by signed AV/EDR agents or sanctioned diagnostic tools, not
    by a custom dumper run interactively by a user. Knowing whether the user role and host function involve credential
    or memory diagnostics is often the fastest path to distinguishing a true positive from sanctioned activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this CreateMiniDump execution part of an authorized penetration test or red team engagement?
  context: >-
    Offensive credential-dumping tools are routinely used in authorized security assessments. Before deeper analysis,
    check whether a pentest or red team exercise is active on this host or network segment. An authorized engagement
    with matching tool usage and timing resolves the alert without further investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: What dumping method and target did the command line invoke?
  context: >-
    CreateMiniDump implements several LSASS-dump paths — a direct MiniDumpWriteDump to disk, an in-memory dump via
    callbacks that never touches disk, and a snapshot-based read using PssCaptureSnapshot. The command-line arguments
    and any specified output path reveal which method was used and where the dump landed, which determines how
    detectable the artifact is and how the dump may be exfiltrated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: Did this tool's process write any dump files or other artifacts to disk?
  context: >-
    This dumper's default behavior writes a minidump such as lsass.dmp to the working directory or a temp path. Files
    created by the tool's process confirm execution and capture the dump location even after the process exits. An
    in-memory-only run leaves no file here, so absence of a dump artifact does not rule out a successful capture.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:credential_access.credential_target_identification
  question: Was LSASS memory the target, and which dump method accessed it?
  context: >-
    This tool targets LSASS memory specifically, where logon credentials, hashes, and Kerberos tickets reside. Confirm
    from the triggering command and surrounding activity whether LSASS was opened and dumped, and by which method —
    direct MiniDumpWriteDump to disk, callback-based in-memory capture, or a PssCaptureSnapshot snapshot read. The
    method reveals attacker sophistication and how detectable the resulting dump is.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.001.access_verification
  question: Did any process open a full-access handle into lsass.exe around this event?
  context: >-
    Memory dumping requires a process to open a handle into lsass.exe, typically with full access rights (mask
    0x1F0FFF). Process-access telemetry showing a non-AV/EDR source process opening lsass.exe with that mask confirms
    the credential-scraping step independently of the dumper's filename or import hash. The source image and granted
    access distinguish a memory-read attempt from ordinary inter-process activity. If process-access telemetry is not
    collected in this environment, treat zero results as a visibility gap rather than evidence nothing occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: \lsass.exe
        GrantedAccess: '0x1F0FFF'
      condition: selection
    fields:
      - SourceImage
      - TargetImage
      - GrantedAccess
      - CallTrace
- source: attack:T1003.001.tuning_parameter
  question: Were minidump files created in temp or staging directories on this host around the alert?
  context: >-
    LSASS dumps are commonly written to user-writable staging paths such as %TEMP%, C:\Windows\Temp, the tool's
    working directory, or C:\temp, often with names like lsass.dmp. A dump file appearing in these locations close to
    the alert pinpoints the artifact for collection and confirms credentials were staged for offline extraction.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \Temp\
          - \temp\
          - .dmp
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this dumper, and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. Interactive use from explorer.exe or a command shell points
    to hands-on-keyboard operation, while parents like wscript.exe, mshta.exe, a service, or an Office application
    suggest scripted or exploitation-driven launch. Allowlisting known legitimate parents helps separate sanctioned
    diagnostics from operator activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    A full LSASS dump exposes every credential cached in memory on this host, including any privileged or service
    accounts that authenticated since last boot. The severity depends on those accounts' privilege levels — domain
    admin or broad service-account exposure requires escalation and credential rotation, while a single standard user
    may only need monitoring. Cross-reference the accounts active on this host with directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run this dumper?
  context: >-
    A custom credential-dumping binary that has never been seen on a host is far more suspicious than one that recurs
    as part of sanctioned tooling. Zero or very low historical counts over 90 days indicate first-time or rare
    execution, which raises the priority of the investigation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \CreateMiniDump.exe
      - Hashes|contains: IMPHASH=4a07f944a83e8a7c2525efa35dd30e2f
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \CreateMiniDump.exe
      - Hashes|contains: IMPHASH=4a07f944a83e8a7c2525efa35dd30e2f
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the credential access is isolated or part of broader
    movement. If the same user triggered related activity on multiple endpoints in this window, the scope of potential
    compromise is larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \CreateMiniDump.exe
      - Hashes|contains: IMPHASH=4a07f944a83e8a7c2525efa35dd30e2f
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Credential dumping rarely happens in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or privilege escalation — may reveal the attack stages that set up this memory capture and help
    reconstruct the full timeline leading to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
