name: Hacktool Execution - PE Metadata
id: d9eda45a-ca63-45ca-9181-ae34cb1940fd
description: |
  Detects execution of a Windows hacktool identified by its PE metadata Company
  value (Cube0x0), which survives renaming of the file on disk. The author's tooling
  spans credential-dumping and lateral-movement utilities, so a match means a known
  offensive binary ran even though the filename may be disguised. Investigation should
  confirm the metadata match, identify which credential store or capability the tool
  targeted, and determine whether the activity belongs to an authorized engagement or
  an intrusion.
type: detection
detection_id: 37c1333a-a0db-48be-b64b-7393b2386e3b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process carry the PE metadata that this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive
    by reviewing the process Company metadata value against the rule's detection
    criteria. The rule matches on the PE Company field rather than the filename, so
    a renamed or copied binary still matches; verify the metadata value is present
    on the alerting event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Company
- source: template:hacking_tool.authorized_engagement
  question: Is this tool execution part of an authorized penetration test or red team engagement?
  context: Offensive utilities are routinely run during authorized security assessments.
    Before deeper analysis, check whether a penetration test or red team exercise is
    active on this host or network segment. An authorized engagement with matching
    tool usage and timing resolves the alert without further work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run offensive security tooling?
  context: Legitimate administrative or security-testing activity can trigger this
    detection. Knowing whether the user role and host function are consistent with
    running offensive tooling is often the fastest path to distinguishing a true
    positive from sanctioned testing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.tool_capability_used
  question: What specific capability of this tool was invoked?
  context: This author's tooling is multi-purpose, covering credential dumping, ticket
    manipulation, and remote execution. The command-line arguments, module names, or
    subcommands reveal which capability was used, which determines the scope of
    potential compromise and the required response. Read these from the alerting
    event itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: What credential stores were targeted?
  context: Different credential access methods target different stores (LSASS memory,
    SAM database, NTDS.dit, cached credentials, browser password stores). Identifying
    the specific target from the command line determines which accounts may be
    compromised and what remediation is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.process_access
  question: Did this process open a handle to LSASS or another sensitive process around the alert time?
  context: Credential-dumping tools read memory from a target process, most often
    LSASS, by opening a handle with high access rights. A process-access event from
    the alerting binary to LSASS, especially with full rights such as 0x1F0FFF, is
    direct evidence of memory-based credential theft rather than benign tool presence.
    If process-access telemetry is not collected in this environment, treat zero
    results as a visibility gap rather than evidence nothing happened.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        SourceImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetImage
      - GrantedAccess
      - CallTrace
- source: attack:T1003.security
  question: Were the SAM, SECURITY, or SYSTEM registry hives accessed around the alert time?
  context: SAM-based credential theft reads or exports the SAM, SECURITY, and SYSTEM
    registry hives; all three are needed to extract and crack local credentials
    offline. Object-access auditing on these hives (event 4662/4663/4656) shows
    handle requests to the credential stores. If object-access auditing is not
    enabled, absence of results does not rule the activity out.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ObjectName|contains:
          - '\SAM'
          - '\SECURITY'
          - '\SYSTEM'
      condition: selection
    fields:
      - ObjectName
      - ProcessName
      - AccessMask
      - SubjectUserName
- source: template:cue_process_tool.process_chain
  question: What process spawned this tool and is that parent chain expected?
  context: The parent process reveals how the tool was launched. The parent allowlisting
    dimension matters here; a known security tool or system process spawning the
    binary differs from an interactive shell, a scripting host such as wscript.exe or
    mshta.exe, or an Office application, which point toward operator activity or
    exploitation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of credential theft depends on the privilege level of the
    accounts exposed on this host. Domain admin or service-account credentials
    require incident escalation; a standard user account may only need monitoring.
    Cross-reference the alerting user and any accounts active on the host with
    directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: Are known artifacts of this tool present on the host?
  context: Offensive tools leave characteristic files behind, such as LSASS dump
    files, exported registry hives, ticket files, or collection output. Checking for
    files written by the tool's process confirms execution and reveals the scope of
    activity even after the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's metadata pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimately present tools recur. The query mirrors the rule's PE
    metadata selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has run here. A new parent
    process, an unexpected user account, or an unusual launch pattern is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Company: Cube0x0
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Company: Cube0x0
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Company: Cube0x0
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user triggered similar activity
    on several hosts, the scope of compromise may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Company: Cube0x0
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's metadata pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's PE metadata selection with no host scope, so
    the result is a fleet-wide count of this firing pattern. Many hosts firing the
    same pattern points to scripted deployment or a shared image carrying the binary;
    one host or a small unrelated set points to manual operator activity. Use the
    host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Company: Cube0x0
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host,
    such as defense tampering, reconnaissance, or initial access, may reveal the
    attack stages that preceded credential theft and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
