      reason: >-
        RECOMMENDED tier, not must_include. Dropped per the template's own drop
        condition (b): the cue_host_context.precursor question is present AND this rule
        is not execution- or credential-centric. The rule fires on masquerading /
        defense-evasion placement of a remote access client outside Program Files, not
        on payload execution or credential access, so the disposition does not turn on
        whether endpoint protection was weakened first. Prior-alert precursor context
        already surfaces any tamper detections that fired on the host before this event.
        Recorded here per the universal-question no-silent-drop rule.
  reflection_overrides:
    # No detection block was modified — both reflected queries are BYTE-IDENTICAL
