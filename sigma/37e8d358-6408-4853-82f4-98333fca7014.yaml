        +/-15m sweeps of the same data. Retained the prior-alert precursor pivot for
        unique cross-detection context instead to stay within the 18-question cap.
      kept: cue_host_context.precursor
    - dropped: cue_host_context.clustering
      reason: >-
        Host-wide process activity sweep overlaps cue_process_tool.clustering; only one
