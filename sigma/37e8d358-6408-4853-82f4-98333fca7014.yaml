    - dropped: cue_user_actor.clustering
      reason: "user_actor pair — non-deduplicable; emitted ALONGSIDE clustering_svc, recorded for audit trail only (not actually dropped)"
      kept: cue_user_actor.clustering AND cue_user_actor.clustering_svc (both emitted)
  skipped_templates:
