        identity and path, not command-line content — so the query correctly
        cannot contain a CommandLine constraint. Adding one would diverge from the
        brief and break the byte-identity guarantee. Warning is a known false
        positive for non-CommandLine reflected rules; block left unmodified.
    - template: cue_process_tool.scope
