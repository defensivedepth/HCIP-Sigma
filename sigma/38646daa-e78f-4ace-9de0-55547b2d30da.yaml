name: PUA - Seatbelt Execution
id: 409a6df9-a1d7-47cc-9cab-8d96ddcae9b5
description: |
  Detects execution of the Seatbelt host-enumeration tool, identified either by binary metadata
  (Image name, OriginalFileName, or Description) OR by command-line references to known enumeration
  modules (DpapiMasterKeys, CredEnum, ChromiumHistory, InterestingProcesses, and similar) OR by the
  combination of a -group= bundle flag with -outputfile=. The rule fires when any one of these three
  selection groups matches, so an alert may be driven by the binary signature alone, by module names
  in the arguments, or by the group/output flag pair. Seatbelt consolidates dozens of host-survey
  modules (defensive-tool inventory, credential stores, browser data, cloud configuration, persistence
  points) into a single binary, and is commonly run after a foothold to fingerprint the host before
  the next stage. Legitimate use is limited to authorized security assessments; the investigation
  should determine which branch fired, what was enumerated, who ran it, and whether an engagement
  explains it.
type: detection
detection_id: 38646daa-e78f-4ace-9de0-55547b2d30da
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did this execution match the rule's pattern by binary identity, by enumeration-module
    arguments, or by the group/output flag pair?
  context: The rule fires when EITHER the binary identity matches (Image ending in Seatbelt.exe,
    OriginalFileName Seatbelt.exe, or Description Seatbelt) OR the command line references a known
    enumeration module (DpapiMasterKeys, CredEnum, ChromiumHistory, InterestingProcesses, and
    similar) OR the command line combines a -group= bundle flag with -outputfile=. Review the full
    event and note which branch fired -- the binary-identity branch points at a renamed or relocated
    Seatbelt build, while the argument branches confirm which modules were requested regardless of the
    binary name. That branch shapes which downstream questions carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run a consolidated host-enumeration tool?
  context: Authorized administrative or security-testing activity can trigger this detection.
    Seatbelt is not a routine administrative utility -- it sweeps credential stores, browser data, and
    defensive-tool state in one pass. Knowing whether this user role and host function are consistent
    with running such a tool is often the fastest way to separate sanctioned testing from
    post-compromise enumeration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this Seatbelt execution part of an authorized penetration test or red team engagement?
  context: Host-enumeration tools like Seatbelt are routinely used in authorized security
    assessments. Before investing investigation time, check whether a pentest or red team exercise is
    currently active on this host or network segment. An authorized engagement with matching tool
    usage and timing resolves the alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which enumeration modules or group bundle did this run request?
  context: Seatbelt is multi-purpose -- individual modules target credential stores (DpapiMasterKeys,
    CredEnum, CredGuard, CloudCredentials), browser data (ChromiumHistory, ChromiumBookmarks,
    FirefoxHistory), defensive products (InterestingProcesses), and more, while -group=all or
    -group=user runs whole bundles at once. The specific modules or group flag invoked determine what
    data was harvested and therefore the scope of potential exposure and required response.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What did this Seatbelt run actually do -- decode the full command line and any -outputfile
    destination.
  context: The full command line reveals the exact modules requested, the -group= bundle if present,
    and the -outputfile= path where results were written. Resolve the output path so the collected
    survey file can be located and reviewed; a -group=all sweep writes every module result to one
    file. Host-scoped within a tight window so sequential invocations that together form one survey
    are captured, not just the single triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned Seatbelt, and is that parent chain expected?
  context: Legitimate testing typically launches the tool from an interactive shell (cmd.exe or
    powershell.exe spawned by explorer.exe) or from an operator's deployment script. Seatbelt spawned
    by unusual parents -- Office applications, script interpreters (wscript.exe, cscript.exe,
    mshta.exe), wmiprvse.exe, or wsmprovhost.exe -- indicates automated or remote post-exploitation
    rather than a hands-on test.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: Did Seatbelt write a survey output file or other artifacts on this host?
  context: Seatbelt's -outputfile= flag writes a multi-section text or JSON survey (often under a
    user-writable path such as C:\Users\Public) that persists after the process exits. Locating that
    file confirms what was collected even if the original process is gone, and reveals whether the
    output was staged for exfiltration. Browser and credential modules also read profile files under
    user AppData in rapid succession.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery action may be benign, but multiple reconnaissance commands in rapid
    succession -- whoami, ipconfig, net user, systeminfo, nltest -- is a signature of post-compromise
    enumeration. A host-survey tool firing alongside several native recon binaries points to a
    coordinated enumeration stage rather than isolated troubleshooting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline
  question: Does this host normally run Seatbelt?
  context: A binary that has never run on a host is more notable than one that appears regularly.
    Zero or very low historical counts over the trailing window indicate a first-time or rare
    execution, which weighs toward operator activity rather than established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally
    drive that activity, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host -- the resulting
    parent/user distribution reflects how the rule's specific firing pattern (not generic binary
    usage) has historically run here. Deviations -- a new parent process, an unexpected user account,
    an unusual command-line shape -- are the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Seatbelt.exe
      - OriginalFileName: Seatbelt.exe
      - Description: Seatbelt
      - CommandLine|contains:
        - ' DpapiMasterKeys'
        - ' InterestingProcesses'
        - ' InterestingFiles'
        - ' CertificateThumbprints'
        - ' ChromiumBookmarks'
        - ' ChromiumHistory'
        - ' ChromiumPresence'
        - ' CloudCredentials'
        - ' CredEnum'
        - ' CredGuard'
        - ' FirefoxHistory'
        - ' ProcessCreationEvents'
      selection_group_list:
        CommandLine|contains:
        - ' -group=misc'
        - ' -group=remote'
        - ' -group=chromium'
        - ' -group=slack'
        - ' -group=system'
        - ' -group=user'
        - ' -group=all'
      selection_group_output:
        CommandLine|contains: ' -outputfile='
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img or all of selection_group_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did Seatbelt spawn afterward?
  context: A pure enumeration run typically spawns nothing; child processes spawned by the tool can
    reveal follow-on actions such as staging, archiving, or launching additional tooling for the next
    stage. Unexpected children (cmd.exe, powershell.exe, archiving utilities) suggest the survey fed
    directly into operator activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run host-enumeration tooling like Seatbelt?
  context: Compare this user's current action against their historical behavior across the
    environment. A user who has never run this tool is more notable than one who does so regularly,
    and the user's role should align with security-testing duties. Zero or very low counts indicate
    the tool is outside their normal pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+binary combination historically routine on this host or across the
    environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism -- which parent process spawned Seatbelt, and whether
    that pair is historically common. A new or rare parent for this binary is the deviation worth
    chasing; a pair that already accounts for many prior events is more likely automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration
    spanning multiple endpoints. If the same user triggered similar activity on several hosts, the
    scope of the operation may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+binary combination fire on other hosts in the same window -- is this
    a coordinated automation rollout or isolated to this host?
  context: Under a service principal, asking what else the user did network-wide returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism -- parent
    process plus spawned binary -- fired on other hosts in the alert window. Multiple hosts in the
    same window points to scheduled or pushed automation; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context: what led to this event, what happened after, and whether it is part of a larger
    sequence. Look for credential access, privilege escalation, or persistence mechanisms surrounding
    the enumeration.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern (not generic usage of the binary). Many hosts firing
    the same pattern points to scripted deployment or vendor automation; one host or a small unrelated
    set points to manual operator activity. Use the host distribution and parent/binary consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Seatbelt.exe
      - OriginalFileName: Seatbelt.exe
      - Description: Seatbelt
      - CommandLine|contains:
        - ' DpapiMasterKeys'
        - ' InterestingProcesses'
        - ' InterestingFiles'
        - ' CertificateThumbprints'
        - ' ChromiumBookmarks'
        - ' ChromiumHistory'
        - ' ChromiumPresence'
        - ' CloudCredentials'
        - ' CredEnum'
        - ' CredGuard'
        - ' FirefoxHistory'
        - ' ProcessCreationEvents'
      selection_group_list:
        CommandLine|contains:
        - ' -group=misc'
        - ' -group=remote'
        - ' -group=chromium'
        - ' -group=slack'
        - ' -group=system'
        - ' -group=user'
        - ' -group=all'
      selection_group_output:
        CommandLine|contains: ' -outputfile='
      condition: selection_img or all of selection_group_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense
    tampering, exploitation, or initial access -- may reveal the attack stages that preceded this
    enumeration and help reconstruct the full timeline. Host enumeration usually follows an initial
    foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
