name: Suspicious Scheduled Task Creation Involving Temp Folder
id: e1d3ee7b-31b1-43c2-a985-682f86589806
description: |
  Detects creation of a scheduled task via schtasks.exe whose command line combines the /create and
  /sc once flags with a path under a Temp folder. A run-once task that launches content from a
  temporary directory is a common post-exploitation persistence and execution pattern: an operator
  drops a script or binary into Temp and registers a single-fire task to execute it, often under a
  task name chosen to blend in. Legitimate causes exist (software installers, administrative one-off
  jobs), so the investigation should establish what command the task runs, when it fires, whether it
  is still registered, and whether the user, host, and surrounding activity are consistent with
  sanctioned administration.
type: detection
detection_id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the schtasks command line contain /create, /sc once, and a Temp folder path together?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact command line. The rule fires only when all three elements are present in one schtasks.exe
    invocation - the /create action, the /sc once run-once schedule, and a path referencing a Temp
    folder. Verify each element is present and read the full command before proceeding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to create run-once scheduled tasks that execute content from a Temp folder?
  context: Legitimate administrative activity and software installers can register scheduled tasks. Knowing
    whether the user role and host function are consistent with task creation that points at a temporary
    directory is often the fastest path to distinguishing routine operations from operator persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:scheduled_task.task_configuration
  question: What scheduled task was created, and what command does it execute?
  context: The schtasks command line contains the task name (/TN), the command or program to execute
    (/TR), the schedule type (/SC), and optionally the run-as account (/RU). Identify the task name,
    the executed command, and whether it runs as SYSTEM. The /TR value reveals the persistence payload -
    here it points into a Temp folder, so determine exactly which script or binary the task launches.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1053.005.obfuscation_check
  question: Is the task's command or payload encoded or obfuscated, and what does the decoded content do?
  context: 'The /TR value may carry encoded or obfuscated content rather than a plain executable path.
    Common encodings: base64 (certutil -decode, PowerShell -EncodedCommand), hex, character concatenation,
    and environment-variable substitution. Decoding reveals the actual operation - a download cradle,
    reverse shell, in-memory loader, or credential theft. Reconstruct the command the task runs from
    the alerting command line and identify what it does.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:scheduled_task.task_trigger_and_timing
  question: When is the task scheduled to run, and has it already executed?
  context: A /sc once task fires a single time at the start time given by /ST (or immediately, depending
    on configuration). Scheduled tasks execute as children of the Task Scheduler service. This query
    looks for processes the scheduler spawned on this host after task creation, which reveals whether
    the run-once payload has already run and what it launched.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:scheduled_task.task_still_present
  question: Is the scheduled task still registered on the system?
  context: Persistence is only effective if the task still exists, and some operators delete run-once
    tasks after execution to reduce forensic artifacts. Confirming whether the task is still present
    (via schtasks /query for the task name or the Task Scheduler interface) determines whether the
    mechanism is active and requires remediation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1053.005.security
  question: Does the Security log show a scheduled-task registration event for this task on this host?
  context: Task creation is recorded independently of process creation as a task-registered event in
    the Security channel. Correlating that event confirms the task was actually registered (not merely
    a failed or denied schtasks invocation) and surfaces the registering account and task name from a
    second evidence source. If Security task-audit events are not collected in this environment, treat
    zero results as a visibility gap rather than evidence nothing registered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4698
        Computer|expand: '%hostname%'
      condition: selection
    fields:
      - TaskName
      - SubjectUserName
- source: attack:T1053.005.registry_set
  question: Was a Task Scheduler registry entry written under the TaskCache tree on this host around the alert time?
  context: Registering a scheduled task writes the task definition into the registry under the Task
    Scheduler TaskCache tree. A registry-set event for that path provides independent confirmation of
    the task and its identifier, and can expose tasks created through interfaces other than schtasks.exe.
    If registry-set telemetry is not collected in this environment, treat zero results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned schtasks.exe, and is that parent chain expected?
  context: The parent process reveals how the task was registered. Interactive administration typically
    shows explorer.exe or a console shell as the parent; automation shows a service or deployment agent.
    Parents such as mshta.exe, wscript.exe, a Web server worker process, or an Office application point
    toward exploitation or a malicious script driving the task creation. Identify the parent and what
    else it spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was schtasks.exe executed from its expected System32 path?
  context: schtasks.exe normally runs from System32 (or SysWOW64). Execution from a non-standard path -
    a user temp directory, a profile folder, or alongside the dropped payload - can indicate the binary
    was copied or renamed to evade path-based controls. Compare the Image path and OriginalFileName
    against the expected system location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this run-once-task-from-Temp pattern over the past 90 days, and what command-line structures are typical?
  context: A scheduled-task pattern with no prior history on a host is more suspicious than one used
    regularly under stable parents. The query mirrors the rule's selection structure scoped to this
    host, so the count reflects this specific firing pattern rather than generic schtasks.exe usage.
    The command-line projection lets you compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /create '
        - ' /sc once '
        - \Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were any other persist-or-tamper LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary for persistence often use several. After
    registering a scheduled task, the same actor may also manipulate services, registry keys, or boot
    configuration with reg.exe, sc.exe, at.exe, or similar tools. Finding multiple such binaries running
    in the same window strengthens the case that this is intentional persistence stacking rather than
    an isolated administrative action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\reg.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\netsh.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /create '
        - ' /sc once '
        - \Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /create '
        - ' /sc once '
        - \Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the task creation reveals the
    immediate context: what led to it, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, credential access, data staging, or additional persistence around the same
    window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, credential access,
    or exploitation of a public-facing service - may reveal the attack stages that preceded the task
    creation and help reconstruct the timeline. Persistence is often registered after an initial foothold
    is established, so prior alerts can place this event in sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host?
  context: Operators rarely rely on a single persistence mechanism. After establishing one foothold via
    a scheduled task, they commonly add backups using different techniques - services, registry Run keys,
    BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate
    intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
