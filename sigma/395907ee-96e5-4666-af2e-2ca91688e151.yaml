name: Wab Execution From Non Default Location
id: 30b3c2fc-4a91-4fb0-8b37-1b08ad2c2226
description: |
  Detects wab.exe (Windows Contacts) or wabmig.exe (Microsoft Address Book Import
  Tool) running from a path that is NOT one of the known-good install directories
  (the WinSxS store or the Windows Mail program folders). These binary names are
  reused by loaders that drop a renamed payload into a user-writable directory so
  the process name looks benign while the on-disk file is attacker-controlled.
  Legitimately, these binaries only run from their installed locations, so a copy
  executing from AppData, ProgramData, Temp, or any other directory is the signal
  worth investigating. Determine where the file actually lives, who signed it, what
  launched it, and what it did after launch.
type: detection
detection_id: 395907ee-96e5-4666-af2e-2ca91688e151
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match the rule — wab.exe or wabmig.exe running from outside the default install directories?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the Image ends in wab.exe or wabmig.exe AND the file does NOT start with the WinSxS store or either Windows Mail program folder. Read the full Image path from the alert and confirm it sits outside those locations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run the Windows Contacts or Address Book Import binaries at all?
  context: These binaries are rarely launched interactively on modern systems and almost never from a non-standard path. Knowing whether this user role and host function ever touch contacts or address-book import is often the fastest way to separate a benign relocation from a masqueraded payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: llm_generated
  question: Where does the alerting file actually live on disk, who signed it, and does its hash match the genuine Microsoft binary?
  context: The core of this detection is a name/location mismatch. A genuine wab.exe or wabmig.exe only ships in the WinSxS store or the Windows Mail folders and is Microsoft-signed; a copy in a user-writable directory that is unsigned, signed by an unexpected party, or whose hash does not match the shipped binary is a renamed payload using a trusted-looking process name. Pull the file path, signature status, and hash and compare against the known-good binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
      - CurrentDirectory
- source: template:cue_process_tool.mechanism_decode
  question: What did this wab.exe/wabmig.exe instance actually do — decode its full command line and working directory.
  context: The command line and working directory reveal whether this behaves like the inert address-book utility or like a launched payload. Decode any flags, file paths, or URLs. The query returns all executions of this binary name on this host within the window, which catches multi-step operation rather than only the triggering invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this binary, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Legitimate launches come from interactive shells or installer flows; loaders frequently spawn the renamed binary from script hosts or from a service-host process to defeat parent/child heuristics, so a parent such as wmiprvse.exe, rundll32.exe, wscript.exe, or an Office application is worth chasing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host ever run wab.exe or wabmig.exe before?
  context: A binary name that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the trailing window indicate first-time or rare execution, which fits a one-off dropped payload rather than installed software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: The query mirrors the rule's selection and filter scoped to this host, so the resulting parent/user distribution reflects how this specific non-default-location firing has historically run here — not generic address-book usage. A new parent process, an unexpected user account, or an unusual launch shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \wab.exe
        - \wabmig.exe
      filter:
        Image|startswith:
        - C:\Windows\WinSxS\
        - C:\Program Files\Windows Mail\
        - C:\Program Files (x86)\Windows Mail\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this binary spawn afterward?
  context: The processes spawned by this binary reveal its actual impact. The genuine utility spawns nothing of interest; a loader hosted in this process often spawns cmd.exe, powershell.exe, rundll32.exe, or reconnaissance utilities for post-exploitation. Unexpected children shift the disposition toward a payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Loader activity rarely occurs alone. Process activity surrounding this execution may reveal ingress tooling, reconnaissance utilities, credential-access tools, or persistence installation that provides broader context for whether this is an isolated event or one stage of a multi-step operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection and filter with no host scope, so the result is a fleet-wide count of this non-default-location firing — not generic usage of the binary names. Many hosts firing the same pattern points to a software-deployment quirk or relocated install; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \wab.exe
        - \wabmig.exe
      filter:
        Image|startswith:
        - C:\Windows\WinSxS\
        - C:\Program Files\Windows Mail\
        - C:\Program Files (x86)\Windows Mail\
      condition: selection and not filter
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run these address-book binaries anywhere in the environment?
  context: Compare this user's current action against their historical behavior. A user who has never launched wab.exe or wabmig.exe is more suspicious than one who does so regularly. User role and typical toolset should align; an account that has no business touching contacts utilities running one from a non-default path is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned this binary, and is that pair historically common. A new or rare parent for these binaries is the deviation worth chasing; a pair that already accounts for many prior events is OS or vendor automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+binary combination fire on other hosts in the same window — a coordinated rollout, or activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The meaningful question is whether the same launch mechanism — parent process plus spawned binary — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for ingress tooling, reconnaissance, privilege escalation, or persistence mechanisms surfacing as novel parent-child pairs.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, ingress tool transfer — may reveal the stages that preceded this execution and help reconstruct the full timeline. The alert sequence often tells the operation's story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
