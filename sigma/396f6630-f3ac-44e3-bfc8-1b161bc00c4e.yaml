name: Suspicious Child Process Of Wermgr.EXE
id: 52b94dde-812c-4928-86ef-353f5769d2e0
description: |
  Detects the Windows Error Reporting manager (wermgr.exe) spawning a child process whose Image ends in one of a set of command interpreters, script hosts, or discovery binaries (cmd.exe, powershell.exe, pwsh.exe, powershell_ise.exe, cscript.exe, wscript.exe, mshta.exe, regsvr32.exe, rundll32.exe, net.exe, net1.exe, ipconfig.exe, netstat.exe, nslookup.exe, systeminfo.exe, whoami.exe), excluding the one benign rundll32 case where WerConCpl.dll LaunchErcApp is invoked for the Error Reporting control panel. wermgr.exe is a legitimate signed system binary that normally runs to report application faults and does not spawn interactive shells, script engines, or reconnaissance utilities, so a child of this kind points to code injected into wermgr using it as a host process. The investigation should determine which child ran and what it did, whether wermgr's memory or loaded modules show signs of injection, what spawned wermgr itself, and whether a burst of reconnaissance or a second-stage loader followed — the typical sequence when an injected host process begins hands-on enumeration before pivoting.
type: detection
detection_id: 396f6630-f3ac-44e3-bfc8-1b161bc00c4e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alert show wermgr.exe spawning one of the flagged child binaries, and is it not the benign WerConCpl LaunchErcApp rundll32 case?
  context: >-
    Confirm the alert is a true positive by reviewing the exact parent and child against the rule's criteria. The rule fires when ParentImage ends in wermgr.exe AND the child Image ends in one of cmd.exe, powershell.exe, pwsh.exe, powershell_ise.exe, cscript.exe, wscript.exe, mshta.exe, regsvr32.exe, rundll32.exe, net.exe, net1.exe, ipconfig.exe, netstat.exe, nslookup.exe, systeminfo.exe, or whoami.exe, AND the child is not rundll32.exe running WerConCpl.dll LaunchErcApp with the -queuereporting or -responsepester switch (the one excluded Error Reporting control-panel case). Note which child binary fired from the Image field, because the downstream questions differ for a script host versus a recon utility versus a rundll32 loader.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run command interpreters, script hosts, or discovery tools as children of the Error Reporting manager?
  context: >-
    wermgr.exe normally launches only to report application faults and is not a parent of interactive shells, script engines, or reconnaissance utilities under any routine workflow, so there is no legitimate user role for which this parent-child pattern is expected. The user and host identity matter mainly to gauge what an injected process would have access to: a privileged account or a server with broad reach raises the stakes of confirmed injection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of the spawned child binary based on its metadata and hash?
  context: >-
    The flagged children are normally signed Microsoft system binaries, so confirm the file on disk really is what its name claims. Compare the Image path against the embedded OriginalFileName and check the signing status — a name/metadata mismatch, an unsigned binary, or a copy running from a non-system directory means the LOLBIN name is a disguise rather than the genuine utility. Submit the hash for reputation lookup to separate the stock system binary from a known-bad or novel sample.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:parent_child.parent_process_legitimacy
  question: What started wermgr.exe, and is that origin consistent with a real application-fault report?
  context: >-
    wermgr.exe is legitimately launched by svchost.exe (the WER service) or directly by a faulting application to report a crash. Tracing wermgr's own parent reveals whether this instance arose from a genuine fault or was started or re-used as an injection host. A wermgr started by an unexpected grandparent, or one that has been running far longer than a crash report would, is the deviation worth chasing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the spawned child do? Decode its full command line.
  context: >-
    The child's full command line reveals the operation the injected parent initiated. Decode any flags, encoded content, file paths, or URLs. For a rundll32 child, identify the DLL and export being invoked, since an injected host commonly uses rundll32 to load a second-stage module. For net/net1, nslookup, ipconfig, netstat, whoami, or systeminfo, read the exact arguments — domain-controller lookups, domain-group enumeration, and share or trust queries point to staged reconnaissance rather than a one-off command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1055.access_verification
  question: Did any process open a handle to wermgr.exe with memory-write or thread-creation access rights around the alert time?
  context: >-
    Process injection requires the injector to acquire a handle to the target with rights such as PROCESS_VM_WRITE, PROCESS_VM_OPERATION, or PROCESS_CREATE_THREAD before writing a payload and starting execution. A process_access event targeting wermgr.exe with these masks, especially from a non-system parent, is direct evidence that wermgr was injected rather than merely faulting. If process_access events are not collected in this environment, treat the absence as a visibility gap and rely on the spawned-child and module-load evidence instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: \wermgr.exe
      selection_mask:
        GrantedAccess|contains:
          - '0x1F0FFF'
          - '0x1FFFFF'
          - '0x143A'
          - '0x1438'
          - '0x0820'
          - '0x0002'
          - '0x0008'
      condition: selection and selection_mask
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: attack:T1055.image_load
  question: Did wermgr.exe load any unusual or unsigned modules around the time it spawned the child?
  context: >-
    Injection and DLL side-loading leave a module-load trail: an injected wermgr may map an unsigned or unbacked module, or load a DLL from a writable or non-system path. One documented privilege-escalation path also abuses wermgr loading comctl32.dll from a planted wermgr.exe.local directory under system32. Review modules loaded by wermgr that are unsigned, signed by an unexpected party, or located outside the normal system directories. If image_load events are not ingested here, treat zero results as a visibility gap rather than evidence the load did not occur.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \wermgr.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:powershell.encoded_command_decode
  question: If the child was a PowerShell host, was its command encoded or obfuscated, and what does it decode to?
  context: >-
    When the spawned child is powershell.exe, pwsh.exe, or powershell_ise.exe, the -EncodedCommand (-enc) parameter, string concatenation, backtick escaping, and variable substitution are common ways to hide intent. Base64-encoded commands are the most frequent form. Decoding reveals the actual payload — download cradles, reverse shells, or in-memory loading of .NET assemblies, which an injected host process often uses to pull its next stage.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: >-
    Script block logging records the deobfuscated script content PowerShell actually executes, even when the command line is encoded or obfuscated, giving ground truth about what ran. This is most valuable when the spawned child was a PowerShell host. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell or endpoint security controls bypassed or weakened on this host before the alert?
  context: >-
    Injected host processes frequently disable or bypass controls before running their payload — AMSI patching, execution-policy bypass, real-time monitoring disable, or a downgrade to PowerShell v2 which lacks logging. Finding these precursor events on the host strengthens the case that the wermgr child is part of hands-on activity rather than a benign anomaly.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did a burst of reconnaissance commands run on this host around the same time?
  context: >-
    A single discovery command may be routine troubleshooting, but several reconnaissance utilities in rapid succession — whoami, ipconfig, net view, net group, nslookup of domain-controller records, net share, netstat, systeminfo — is a signature of post-injection enumeration. An injected host process commonly runs a fixed sequence of built-in recon tools to map the host and domain before pivoting. Three or more distinct recon binaries inside a tight window points to automated reconnaissance.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\route.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:parent_child.sibling_processes
  question: What other child processes did this same wermgr.exe instance spawn?
  context: >-
    If wermgr was injected, it likely spawned more than the one child that triggered the alert. Examining all children of the exact parent instance reveals the full scope of activity — a recon utility followed by a rundll32 loader, or several recon tools in sequence, strongly suggests orchestrated post-injection activity rather than an isolated fluke.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \wermgr.exe
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \ipconfig.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \netstat.exe
        - \nslookup.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \systeminfo.exe
        - \whoami.exe
        - \wscript.exe
      filter_main_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|contains|all:
        - C:\Windows\system32\WerConCpl.dll
        - 'LaunchErcApp '
        CommandLine|contains:
        - -queuereporting
        - -responsepester
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \wermgr.exe
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \ipconfig.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \netstat.exe
        - \nslookup.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \systeminfo.exe
        - \whoami.exe
        - \wscript.exe
      filter_main_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|contains|all:
        - C:\Windows\system32\WerConCpl.dll
        - 'LaunchErcApp '
        CommandLine|contains:
        - -queuereporting
        - -responsepester
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity elsewhere, the scope may be larger than this host. Pair this with the launch-mechanism clustering view, which stays meaningful when the alert fires under a service or machine account.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \wermgr.exe
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \ipconfig.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \netstat.exe
        - \nslookup.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \systeminfo.exe
        - \whoami.exe
        - \wscript.exe
      filter_main_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|contains|all:
        - C:\Windows\system32\WerConCpl.dll
        - 'LaunchErcApp '
        CommandLine|contains:
        - -queuereporting
        - -responsepester
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded the injected wermgr child and help reconstruct the timeline. Injection of a host process is usually a mid-chain step, so prior alerts often mark how the host was first compromised.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1055
      name: Process Injection
      role: primary
    - id: T1036
      name: Masquerading
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: injection_into_host
      description: "Adversary acquires a handle to wermgr.exe and writes/executes a payload (memory-write API + remote thread), using the legitimate WER manager as an injection host"
      mapped_to: Q6
      source: attack:T1055.access_verification
    - stage: 2
      label: unusual_module_load
      description: "Injected wermgr maps an unsigned/unbacked module or side-loads a DLL from a writable path (e.g., comctl32.dll via wermgr.exe.local)"
      mapped_to: Q7
      source: attack:T1055.image_load
    - stage: 3
      label: injected_host_spawns_child
      description: "Injected wermgr spawns a command interpreter, script host, recon utility, or rundll32 loader — the rule's trigger"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 4
      label: post_injection_recon_and_followon
      description: "Injected host runs a burst of built-in recon tools and/or invokes a second-stage loader (rundll32 export); operation may span sibling children"
      mapped_to: Q12
      source: template:discovery_recon.discovery_burst_detection
    - stage: 5
      label: masquerade_as_legitimate_binary
      description: "T1036: wermgr (and any child LOLBIN) presents as a legitimate signed system binary; metadata/path discrepancy distinguishes genuine utility from disguise"
      mapped_to: Q3
      source: template:masquerading.true_identity
  dimension_coverage:
    - dimension: access_verification
      technique: T1055
      covered_by: Q6
