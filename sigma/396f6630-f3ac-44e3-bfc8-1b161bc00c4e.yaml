      reason: "Targets delivery of a renamed/dropped file (basename match in file_event over 30d). The flagged children are stock signed system LOLBINs spawned by an injected parent, not dropped renamed files, so the masquerade here is the host process (wermgr), not a delivered binary. true_identity (Q3) covers the name-vs-metadata check; the injection origin is covered by access_verification and image_load."
