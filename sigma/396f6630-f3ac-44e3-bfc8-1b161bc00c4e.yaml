      kept: parent_child.parent_process_legitimacy
    - dropped: discovery_recon.discovery_user_context
      reason: "Per its notes_to_llm, overlaps universal.host_user_context; kept the universal must_include version and dropped the discovery duplicate to stay within the 18-question cap."
      kept: universal.host_user_context
    - dropped: cue_user_actor pair (baseline + baseline_svc, clustering + clustering_svc)
      reason: "user_actor pair — non-deduplicable; both user-pivot and service-principal-substitute variants emitted as separate questions (Q13/Q14 and Q15/Q16) because the firing identity is unknown at generation time."
      kept: both variants
  skipped_templates:
    - template: cue_parent_process.baseline
      reason: "parent-child historical-frequency baseline is covered by the emitted cue_user_actor.baseline_svc, which aggregates the same wermgr-parent + child-binary pair across hosts; dropping avoids a near-identical aggregation and stays within the cap."
    - template: cue_parent_process.scope
      reason: "enterprise-wide parent-child spread is covered by cue_user_actor.clustering_svc (same parent+binary across hosts in the alert window); dropping the -24h scope variant avoids a redundant cross-host aggregation under the cap."
    - template: cue_parent_process.clustering
      reason: "host-local parent activity is covered by parent_child.sibling_processes (exact-instance children) and the recon-burst question; dropped to stay within the 18-question cap."
    - template: cue_process_tool.baseline
      reason: "host-level 'does this host run this tool' frequency is subsumed by the two cue_user_actor baselines (user-pivot and parent+binary launch-mechanism), which carry the more decisive deviation signal for an injected-host alert; dropped under the cap."
