      reason: "Hint: parent_process is primary — drop cue_process_tool:process_chain. Parent lookup is covered by parent_child.parent_process_legitimacy (grandparent of wermgr)."
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.mechanism_decode
      reason: "parent_child technique set active — parent_child.parent_process_legitimacy is more specific (names the wermgr parent and walks the grandparent) and subsumes the generic parent's-own-event lookup."
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.follow_on
      reason: "Overlaps parent_child.sibling_processes; the sibling query is ParentProcessGuid-scoped (exact parent instance) and more precise than the host+parent-name follow_on."
