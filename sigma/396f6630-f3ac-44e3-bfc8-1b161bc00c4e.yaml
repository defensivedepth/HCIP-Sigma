      specific_values: "0x1F0FFF (PROCESS_ALL_ACCESS), 0x1FFFFF, 0x143A, 0x1438, 0x0820, 0x0002 (PROCESS_VM_WRITE), 0x0008 (PROCESS_VM_OPERATION)"
      disposition: query_injection
      target_question: Q6
      notes: "Injected into attack:T1055.access_verification GrantedAccess|contains so the process_access query narrows to handle opens carrying memory-write / thread-creation rights against wermgr.exe."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (correlation window between API calls / thread creation / child spawn)"
      disposition: context
      target_question: Q6
