name: HackTool - Hashcat Password Cracker Execution
id: ec7dda6a-4905-4de4-a260-7aa47e65bcad
description: |
  Detects execution of the Hashcat offline password cracker. The rule fires when EITHER the process
  image ends in \hashcat.exe OR the command line contains all of the attack-mode flag -a, the NTLM
  hash-type flag -m 1000, and the rules-file flag -r together. Either branch is sufficient on its own.
  Hashcat is a dual-use GPU/CPU credential-recovery tool: it is run legitimately during authorized
  security assessments and password-policy audits, but offline cracking of dumped hashes (NTLM from SAM
  or NTDS.dit, NetNTLM captures, Kerberos TGS-REP/AS-REP tickets) is also a standard post-credential-dump
  step. The investigation should determine which hashes were fed to the tool, whether hash-bearing files
  were accessed on or copied to this host, whether the user and host normally run cracking tooling, and
  whether the activity is part of an authorized engagement.
type: detection
detection_id: 39b31e81-5f5f-4898-9c0e-2160cfc0f9bf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alert match EITHER a process named hashcat.exe OR a command line containing all of -a, -m 1000, and -r?
  context: >-
    The rule fires on either of two independent branches: the process Image ends in \hashcat.exe, or the
    command line contains all three of the attack-mode flag -a, the NTLM hash-type flag -m 1000, and the
    rules-file flag -r. Note which branch fired. If only the binary name matched, the specific attack and
    hash modes still need to be read from the command line; if only the flag combination matched, the
    binary may have been renamed and its identity is worth confirming. A renamed binary firing on the flag
    branch is more notable than the well-known tool name firing on its own.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run an offline password-cracking tool?
  context: >-
    Password cracking is a normal task for penetration testers, red teams, and password-policy auditors,
    but for most users and host functions it is unusual. Knowing whether the user role and host purpose
    involve credential-recovery tooling is often the fastest way to separate a sanctioned audit from
    credential theft. A cracking tool running on a general-purpose workstation or server under a routine
    user account warrants closer review than the same tool on a known assessment host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this hashcat execution part of an authorized penetration test, red team engagement, or password-policy audit?
  context: >-
    Hashcat is routinely used in authorized security assessments and credential-hygiene audits. Before
    investing investigation time, check whether a pentest, red team exercise, or password-audit project is
    currently active on this host or network segment. An authorized engagement whose scope, host, and
    timing match the alert resolves it without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which attack mode and hash type did hashcat target, and were rule files or masks used?
  context: >-
    Hashcat's command line names the operation. The -a flag selects the attack mode (0 dictionary, 1
    combinator, 3 mask/brute-force, 6/7 hybrid), and -m selects the hash type. The detected -m 1000 is
    NTLM, recovered from SAM or NTDS.dit dumps; other values seen in cracking activity include -m 5600
    (NetNTLMv2), -m 13100 (Kerberos TGS-REP / Kerberoasting), and -m 18200 (AS-REP roasting). The -r
    rules-file flag and any wordlist or mask arguments indicate a serious, tuned cracking run rather than a
    benchmark. Read these from the alerting command line to scope which credentials are at risk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: Which hash store and hash files were fed to hashcat?
  context: >-
    The hash type and input files determine which accounts are at risk. NTLM (-m 1000) comes from the SAM
    hive on a workstation or from NTDS.dit on a domain controller; NetNTLMv1/v2 (-m 5500/5600) comes from
    network capture; Kerberos modes (-m 13100/18200) come from requested service or AS-REP tickets. Read
    the input filename argument and any output, potfile, or session paths from the command line to identify
    the source dump and the population of accounts whose hashes were loaded for cracking.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1110.002.execution_context
  question: Were hash-bearing credential files accessed or written on this host around the alert?
  context: >-
    Offline cracking needs a hash source. Around the alert window, look for handle opens against the SAM,
    SYSTEM, SECURITY, or NTDS.dit stores, or for files matching those names being copied onto the host. The
    presence of a fresh SAM/SYSTEM export or an NTDS.dit copy on the same host as the cracking tool ties the
    execution to a specific dump and confirms credential-theft intent rather than a benchmark or training
    run. If process_access events are not collected in this environment, treat zero results as a visibility
    gap rather than evidence no hash file was touched.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\SAM'
          - '\SYSTEM'
          - '\SECURITY'
          - '\ntds.dit'
      condition: selection
    fields:
      - SourceImage
      - TargetFilename
      - GrantedAccess
- source: template:cue_process_tool.process_chain
  question: What process spawned hashcat, and is that parent chain expected?
  context: >-
    The parent process shows how the cracker was launched. An interactive shell (explorer.exe, cmd.exe, or
    a terminal) under an analyst or administrator account fits authorized use; a service host, a scripting
    engine (wscript.exe, mshta.exe), a remote-execution parent, or an Office application points to scripted
    or operator-driven invocation worth tracing further up the tree.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be exposed by the cracked hashes, and do any have elevated privileges?
  context: >-
    The severity of an offline cracking run depends on the privilege level of the accounts whose hashes
    were loaded. Domain admin, enterprise admin, krbtgt, or service-account hashes require incident
    escalation and credential rotation; a handful of standard user hashes may only need monitoring.
    Cross-reference the accounts represented in the source dump against directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: Are hashcat on-disk artifacts present on the host?
  context: >-
    Hashcat leaves characteristic files: a potfile of cracked results (hashcat.potfile), a session restore
    file, output files specified with -o, markov stats (hashcat.hcstat2), induction and outfile
    directories, and a log (hashcat.log). Files written by the cracking process around the alert confirm an
    actual cracking run and reveal whether results were recovered, even if the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this hashcat pattern, what parents and users normally drove it, and does the current alert fit?
  context: >-
    Even sanctioned cracking tends to run from a consistent parent and user. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent/user distribution reflects how this
    specific firing pattern has historically run here — not generic binary usage. A new parent process, an
    unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \hashcat.exe
      selection_cli:
        CommandLine|contains|all:
        - '-a '
        - '-m 1000 '
        - '-r '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \hashcat.exe
      selection_cli:
        CommandLine|contains|all:
        - '-a '
        - '-m 1000 '
        - '-r '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \hashcat.exe
      selection_cli:
        CommandLine|contains|all:
        - '-a '
        - '-m 1000 '
        - '-r '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or staging of credential data on
    multiple endpoints. If the same user triggered related credential-access or remote-execution activity on
    other hosts, the scope of the operation is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \hashcat.exe
      selection_cli:
        CommandLine|contains|all:
        - '-a '
        - '-m 1000 '
        - '-r '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Cracking is usually a late step that follows hash collection. Earlier detections on the same host —
    credential dumping, LSASS access, defense tampering, or reconnaissance — may reveal the stages that
    produced the hashes now being cracked and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this hashcat pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of this firing pattern, not generic usage of the binary. Many hosts firing the same pattern points to a
    scripted audit deployment or a sanctioned assessment sweep; one host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \hashcat.exe
      selection_cli:
        CommandLine|contains|all:
        - '-a '
        - '-m 1000 '
        - '-r '
      condition: 1 of selection_*
    fields:
    - host.name
