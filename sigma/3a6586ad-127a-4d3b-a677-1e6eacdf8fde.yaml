name: Windows Shell/Scripting Processes Spawning Suspicious Programs
id: 751fdc6d-aef2-422b-8731-57ade56ee987
description: |
  Detects a Windows shell or scripting host (mshta, powershell, pwsh, rundll32, cscript, wscript, wmiprvse, regsvr32) spawning
  a suspicious child binary (schtasks, nslookup, certutil, bitsadmin, mshta). This parent-child shape is the canonical maldoc
  and download-cradle indicator: an interpreter launched from a document or exploit drops a one-line download-and-execute or
  installs persistence through a trusted system binary. Legitimate matches exist (administrative scripts, software-deployment
  tooling), so the investigation should decode the child command, confirm the parent's own origin, and determine whether the
  chain represents proxy execution, ingress tool transfer, or scheduled-task persistence.
type: detection
detection_id: 3a6586ad-127a-4d3b-a677-1e6eacdf8fde
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this event match the rule — a shell or scripting host spawning schtasks, nslookup, certutil, bitsadmin, or mshta?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact parent and child
    against the rule's criteria. The parent must be one of the interpreter binaries (mshta, powershell, pwsh, rundll32, cscript,
    wscript, wmiprvse, regsvr32) AND the child one of the suspicious set (schtasks, nslookup, certutil, bitsadmin, mshta).
    Confirm the event is not one of the excluded cases (ccmcache directory, the named software-deployment scripts, or nessus
    scans).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run command interpreters that spawn scheduling, name-resolution, or download tools?
  context: Legitimate administrative activity can trigger this detection — deployment scripts, helpdesk automation, and
    monitoring agents routinely chain interpreters into schtasks or certutil. Knowing whether the user role and host function
    are consistent with the detected behavior is often the fastest path to distinguishing true positives from routine operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is this interpreter expected to spawn this child, and what started the interpreter itself?
  context: The parent-child relationship is the core signal for this detection. Tracing the parent interpreter's own origin
    (the grandparent) reveals whether the chain is legitimate — a user double-clicked a shortcut, a service ran a maintenance
    script — or suspicious, such as an Office application or HTML container spawning the interpreter, which is the classic
    maldoc pattern.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same interpreter instance spawn?
  context: If a suspicious interpreter spawned the detected child, it likely spawned other processes too. Examining siblings
    of the same parent instance reveals the full scope of activity from that interpreter — reconnaissance, credential access,
    or additional download tools spawned in sequence strongly suggests orchestrated activity rather than a single benign call.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:scheduled_task.task_configuration
  question: If the child is schtasks, what task was created — name, trigger, run-as account, and the command it runs?
  context: When the spawned child is schtasks.exe, the command line carries the task name (/TN), the command or program to
    run (/TR), the schedule type (/SC, such as ONLOGON or MINUTE), and the run-as account (/RU, where SYSTEM is high-risk).
    The executed command reveals the persistence payload — often a script, binary, or download cradle. Decode these arguments
    from the triggering event to understand what persistence was configured.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: If the parent is PowerShell, was its command encoded or obfuscated, and what does it decode to?
  context: When the interpreter parent is powershell.exe or pwsh.exe, its command line frequently carries the actual payload.
    Attackers use the -EncodedCommand (-enc) parameter, string concatenation, backtick escaping, and variable substitution
    to hide intent; base64-encoded commands are the most common form. Decoding reveals download cradles, reverse shells, or
    in-memory execution of .NET assemblies that drove the child process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Script block logging records the deobfuscated script content PowerShell actually executes, even when the command
    line is encoded or obfuscated, providing ground truth about what ran. If PowerShell operational logs are not ingested in
    this environment, treat zero results as a visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Attackers often disable or bypass PowerShell security controls before running a payload. Common techniques include
    AMSI bypass (patching amsi.dll in memory), execution-policy changes (Set-ExecutionPolicy or -ep bypass), constrained
    language mode escape, and downgrade attacks (powershell.exe v2, which lacks logging). Finding these precursor events
    strengthens the case that the spawned download or scheduling tool is malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: attack:T1059.001.tuning_parameter
  question: What network and scripting-engine modules did the interpreter load around the time of the alert?
  context: Module loads disclose interpreter behavior the command line can hide. PowerShell network methods pull in rasman.dll,
    rasapi32.dll, dnsapi.dll, winhttp.dll, and wininet.dll; COM-based cradles load ieproxy.dll and msxml3.dll; BITS pulls in
    qmgrprxy.dll; the regsvr32 scriptlet (Squiblydoo) technique loads scrobj.dll; and VBScript or JScript hosts load
    vbscript.dll or scrrun.dll. Seeing these loaded by the alerting interpreter corroborates download-cradle or proxy-execution
    behavior even when arguments are obfuscated. If image-load events are not ingested in this environment, treat zero results
    as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      selection_modules:
        ImageLoaded|endswith:
          - '\rasman.dll'
          - '\rasapi32.dll'
          - '\ieproxy.dll'
          - '\dnsapi.dll'
          - '\winhttp.dll'
          - '\wininet.dll'
          - '\msxml3.dll'
          - '\qmgrprxy.dll'
          - '\scrobj.dll'
          - '\vbscript.dll'
          - '\scrrun.dll'
      condition: selection and selection_modules
    fields:
      - ImageLoaded
      - Image
- source: attack:T1218.command_analysis
  question: Did the spawned download or proxy-execution tool make outbound network connections, and to where?
  context: certutil, bitsadmin, and nslookup are commonly abused to retrieve externally hosted payloads, and proxy-execution
    via the interpreter parent can reach the internet directly. Outbound connections from these binaries to non-enterprise
    destinations point to ingress tool transfer or command-and-control. Resolve each destination and compare it against known
    internal infrastructure. If network connection events are not ingested in this environment, treat zero results as a
    visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_proc:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\nslookup.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\mshta.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
      condition: selection and selection_proc
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:scheduled_task.task_trigger_and_timing
  question: If a task was scheduled, when does it run, and did the scheduler already launch the payload?
  context: The trigger schedule determines when persistence activates. Tasks set to run at boot or logon fire on the next
    restart; recurring tasks may have already executed multiple times. Scheduled tasks execute as children of the Task
    Scheduler service, so processes spawned by the scheduler after task creation reveal whether the payload has run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run interpreters that spawn scheduling, name-resolution, or download tools?
  context: Compare this user's current action against their historical behavior. A user who has never driven this interpreter
    into schtasks, certutil, bitsadmin, or nslookup is more suspicious than one who does so routinely. User role and typical
    toolset should align with the detected activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-interpreter and child-binary combination historically routine on this host or across the environment?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is
    the launch mechanism — which interpreter spawned this binary, and whether that pair is historically common. A new or rare
    parent for this binary on this host (or environment-wide) is the deviation worth chasing; a pair that already accounts
    for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar interpreter-to-tool chains on other hosts in the same window, the scope of the activity
    may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-interpreter and child-binary combination fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since
    every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — interpreter
    parent plus spawned binary — fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:lolbin.technique_class_lateral
  question: Were any other download or proxy-execution LOLBins used on this host recently?
  context: Attackers who use one living-off-the-land binary often use several. If certutil or bitsadmin retrieved a file,
    check whether curl, expand, esentutl, or proxy-execution binaries such as rundll32, regsvr32, mshta, or msiexec were also
    used. Finding multiple LOLBins performing download or proxy execution in the same window strengthens the case for
    malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was the spawned binary executed from its expected system path?
  context: A living-off-the-land binary executed from a non-standard path (outside System32 or SysWOW64) may have been copied
    or renamed to evade path-based allowlists. A certutil.exe or schtasks.exe running from a user temp directory, for example,
    is more suspicious than one in System32. Compare the Image path and OriginalFileName against the expected location for
    the binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this shell-spawns-suspicious-child pattern over the past 90 days, and what command shapes are typical?
  context: A spawning pattern with no prior history on a host is more suspicious than one seen daily under stable parents. This
    query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern
    rather than generic use of these binaries. The command-line projection lets the analyst compare typical invocation shapes
    against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \rundll32.exe
        - \cscript.exe
        - \wscript.exe
        - \wmiprvse.exe
        - \regsvr32.exe
        Image|endswith:
        - \schtasks.exe
        - \nslookup.exe
        - \certutil.exe
        - \bitsadmin.exe
        - \mshta.exe
      filter_ccmcache:
        CurrentDirectory|contains: \ccmcache\
      filter_amazon:
        ParentCommandLine|contains:
        - \Program Files\Amazon\WorkSpacesConfig\Scripts\setup-scheduledtask.ps1
        - \Program Files\Amazon\WorkSpacesConfig\Scripts\set-selfhealing.ps1
        - \Program Files\Amazon\WorkSpacesConfig\Scripts\check-workspacehealth.ps1
        - \nessus_
      filter_nessus:
        CommandLine|contains: \nessus_
      filter_sccm_install:
        ParentImage|endswith: \mshta.exe
        Image|endswith: \mshta.exe
        ParentCommandLine|contains|all:
        - C:\MEM_Configmgr_
        - \splash.hta
        - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
        CommandLine|contains|all:
        - C:\MEM_Configmgr_
        - \SMSSETUP\BIN\
        - \autorun.hta
        - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - CommandLine
