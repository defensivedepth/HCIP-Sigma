name: Windows Admin Share Mount Via Net.EXE
id: 51b7400c-2340-4b77-b25b-02b2c85c6c08
description: |
  Detects net.exe or net1.exe mounting a remote administrative share (a UNC path
  ending in a dollar-sign share such as C$, ADMIN$, or IPC$) via the "use" subcommand.
  Mapping an admin share is a routine step for IT administration and software
  deployment, but it is also a common precursor to hands-on lateral movement, where
  an operator stages tools onto a remote host or copies files ahead of remote
  execution. The investigation determines whether the mount came from an expected
  administrative source and account, which remote host and share were targeted, and
  whether remote execution or further movement followed the connection.
type: detection
detection_id: 3abd6094-7027-475f-9630-8ab9be7b9725
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show net.exe mounting a dollar-sign admin share with the "use" subcommand?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when net.exe or net1.exe runs with both the "use" subcommand and a UNC path ending in a dollar-sign share. Review the exact command line and confirm which remote host and share were targeted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to map remote administrative shares?
  context: Legitimate administrative activity can trigger this detection. Administrators, deployment service accounts, and management hosts routinely mount admin shares; standard users and ordinary workstations rarely do. Knowing whether the account and host function fit the behavior is often the fastest path to a disposition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: Which remote host and which admin share did this net.exe invocation map, and under what drive or credentials?
  context: The full command line reveals the target of the mount. Decode the UNC path to identify the destination host and the specific share (C$, ADMIN$, IPC$, or a named dollar-sign share), and note whether a drive letter, an explicit credential, or a password switch was supplied. IPC$ mounts often precede remote service or task creation; C$ and ADMIN$ mounts typically precede file staging.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - ' use '
          - ' \\\\*\\*$'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned net.exe, and is that parent chain expected for share mapping?
  context: The parent process reveals how the mount was invoked. A logon script, deployment agent, or an interactive cmd.exe under explorer.exe is consistent with routine administration. An unusual parent such as a script host, an Office application, or a remote-execution service worker points toward automated or operator-driven activity rather than a person at a console.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:lateral_movement.source_host_identification
  question: What inbound remote-access connections reached this host around the mount, and are those sources expected administrative origins?
  context: Lateral movement requires a source and a destination. If this host is the target of the share mount, inbound connections on SMB and remote-management ports reveal whether the originating system is a known admin jump box or an unexpected source. An attacker who has compromised one host uses it as a pivot to reach others.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- source: attack:T1021.002.security
  question: Which account authenticated to the targeted host for this share mount, and was it a network logon from an expected source?
  context: Mapping an admin share generates a logon on the destination host. Correlating the mount with security logon events shows the account used and the logon type — network logons (type 3) and explicit-credential logons identify who reached the share. A first-time or off-hours account, or a logon from an unexpected source address, raises the priority of the mount.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        LogonType: 3
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
      - EventID
- source: template:lateral_movement.authentication_method
  question: What account performed the mount, and does the credential use point to legitimate access, pass-the-hash, or a reused service account?
  context: The authentication behind a share mount reveals how access was obtained. Pass-the-hash (NTLM network logons with no preceding interactive logon) and credential reuse bypass normal password prompts. Legitimate credential use suggests the account was supplied deliberately, while harvested or reused credentials suggest prior compromise.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- source: template:lateral_movement.target_activity_after_access
  question: What processes ran on the targeted host shortly after the share was mounted?
  context: Mapping an admin share is a means to an end. Operators mount C$ or ADMIN$ to stage tools and then execute them, or mount IPC$ to create a remote service or scheduled task. Examining processes that started shortly after the mount — especially command interpreters, script hosts, or runonce.exe — reveals what the access was used for.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time as the share mount?
  context: A single net.exe invocation may be routine, but admin-share mapping bracketed by other enumeration — net view, net user, nltest, ipconfig, whoami — is a signature of post-compromise discovery. Operators map the environment before selecting their next target, so a burst of recon binaries around the mount shifts the disposition toward hands-on activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:lateral_movement.lateral_movement_scope
  question: Has this account used remote-access tooling to reach other hosts in the environment?
  context: Operators rarely stop at one target. If the same account is mounting shares or running remote-execution tools against multiple systems in a short window, the scope of compromise is broader than the single alert. A spread of destinations from one account points to active movement across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously mounted admin shares via net.exe, what parents and users normally drive it, and does the current alert fit?
  context: Even routine tooling can be abused. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific mount pattern has historically run here, not generic net.exe usage. A new parent process, an unexpected account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - ' use '
        - ' \\\\*\\*$'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - ' use '
        - ' \\\\*\\*$'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - ' use '
        - ' \\\\*\\*$'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the mount?
  context: Tracking the account's activity across all hosts reveals lateral movement or staging on multiple endpoints. If the same account triggered similar activity elsewhere in a short window, the scope of the operation is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - ' use '
        - ' \\\\*\\*$'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — credential access, defense tampering, or reconnaissance — may reveal the attack stages that preceded the share mount and help reconstruct the full timeline leading into lateral movement.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.renamed_binary_check
  question: Was net.exe executed from its expected system path, or from an unexpected location?
  context: A net.exe or net1.exe running from outside System32 or SysWOW64 may have been copied or renamed to evade path-based allowlists. Confirm the image path and the original filename align with the legitimate Windows binary; a relocated copy with the net.exe original filename is more suspicious than one in the standard system directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host mounted admin shares via net.exe over the past 90 days, and what command-line structures are typical?
  context: A mount pattern with no prior history on a host is more suspicious than one used daily under stable parents. The query mirrors the rule's selection scoped to this host, so the count reflects this specific firing pattern rather than generic net.exe usage. The command-line projection lets the analyst compare the targeted hosts and shares in prior mounts against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - ' use '
        - ' \\\\*\\*$'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
