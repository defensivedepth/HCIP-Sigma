    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (e.g. regsvr32.exe not launched by explorer.exe)"
      disposition: context
      target_question: Q8
      notes: "process_chain question frames the parent-child legitimacy check; the rule has no parent in detection, so the analyst profiles the actual parent rather than filtering on a fixed list. The clean-vs-abuse parent examples (cmd/powershell/Office vs interactive UI launch) are surfaced in Q8 context."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "rationale only (allow-list of signed binaries: msiexec.exe, regsvr32.exe, etc.)"
      disposition: context
      target_question: Q1
      notes: "MSPUB.exe is itself the signed-binary instance of this list; the verify/decode questions establish the signed-Office-binary trust angle in prose. No queryable value to inject."
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "ftp://, http://, https:// (the rule's own CommandLine|contains URL pattern)"
      disposition: query_injection
      target_question: Q10
      notes: "The rule's URL pattern is embedded verbatim in the REFLECTED baseline_deviation (Q10) and scope (Q12) detection blocks. Q3 decodes the actual URL from the alerting command line."
    - element: RemoteDomainAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only (suppress legitimate enterprise domains)"
      disposition: context
      target_question: Q5
      notes: "Destination baseline (Q5) and destination decode (Q4) let the analyst judge whether the contacted domain is a known-good enterprise endpoint vs attacker infrastructure — the allowlist concept applied at investigation time. No fixed value to inject."
  dedup_decisions:
    - dropped: cue_process_tool.clustering
      reason: "Around-the-same-time process clustering on the host overlaps cue_host_context.clustering scope; with the user_actor clustering pair already covering cross-host concurrent activity and host_context.precursor covering prior-alert context, the generic same-time process listing was dropped to stay at the 18-question cap. Parent/child and download-chain questions carry the immediate-context signal."
  skipped_templates:
    - template: cue_host_context.clustering
      reason: "Dropped at the 18-question cap. cue_user_actor.clustering / clustering_svc already provide concurrent cross-host activity, and cue_host_context.precursor provides prior-alert context on this host; a third broad same-host activity sweep added volume without a distinct investigative angle for this download-proxy rule."
  reflection_overrides: []
  hint_dispositions:
    - hint: "cue_network_endpoint: derived: https?:// in CommandLine"
      disposition: acted-on
      reason: >-
        Acted on. The derived network-endpoint cue drove two questions:
        Q4 (destination decode via network_connection scoped to host +
        MSPUB) and Q5 (destination baseline). The URL pattern itself is
        decoded from the alerting command line in Q3 and embedded verbatim
        in the REFLECTED detection blocks of Q10 and Q12.
    - hint: >-
        logsource 'image_load' (recommended by techniques: T1218) is not covered — pull in
        cue_image_load.* or author a custom question with `category: image_load`
      disposition: declined
      reason: >-
        The T1218 image_load analytic targets DLL/COM-loading proxy LOLBins
        (rundll32.exe, regsvr32.exe, msiexec.exe) where the loaded module is
        the payload. This rule fires on a URL-download proxy: MSPUB.exe fetches
        a remote object over the network and writes it to INetCache. The
        load-bearing cross-logsource investigation for that pattern is the
        outbound network connection and the downloaded file, both covered —
        network_connection in Q4 (destination decode) and Q5 (destination
        baseline), file_event in Q6 (download success) and Q7 (payload
        analysis). MSPUB's own module loads are not the proxy mechanism here,
        so an image_load sweep of the MSPUB process would return module-load
        volume without precision for what this rule detects. The rule's
        detection (URL on the command line of a download LOLBin) genuinely
        constrains the analyst-side pivot to network and file evidence, not
        module loading. No compensating attack:T1218.image_load question
        authored.
