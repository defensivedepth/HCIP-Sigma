name: Suspicious Workstation Locking via Rundll32
id: b389ad63-37fc-4385-aa0d-4d988d37ee12
description: |
  Detects rundll32.exe invoking the user32.dll LockWorkStation function with cmd.exe as
  the parent process, which locks the interactive session. Locking the workstation this way
  can be benign (a desktop shortcut or script a user runs instead of Windows+L), but it is
  also used to hide active operator activity, force re-authentication for credential capture,
  or as a deliberate distraction step. The rule fires only when all four conditions match:
  the image resolves to rundll32.exe, the parent is cmd.exe, the command line contains
  'user32.dll,', and the command line contains LockWorkStation. Investigation should
  establish what drove cmd.exe to issue the lock and whether it fits the user's normal pattern.
type: detection
detection_id: 3b5b0213-0460-4e3f-8937-3abf98ff7dcc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show rundll32 calling user32.dll,LockWorkStation under a cmd.exe parent?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact command line and process lineage. All four conditions must hold together for this
    rule to fire - the image is rundll32.exe, the parent is cmd.exe, and the command line carries
    both 'user32.dll,' and LockWorkStation. Confirm the rundll32 invocation actually targets the
    LockWorkStation export rather than an unrelated user32.dll function.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to lock the workstation by scripting rundll32 rather than the keyboard shortcut?
  context: Locking the screen is routine, but doing it through a scripted cmd.exe to rundll32
    invocation is unusual for an interactive user, who would normally press Windows+L or use the
    Start menu. Knowing whether this user or host runs login scripts, kiosk software, or automation
    that locks the session is often the fastest way to separate routine operation from suspicious activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is cmd.exe expected to spawn rundll32 here, and what started cmd.exe?
  context: The cmd.exe to rundll32 relationship is the core signal for this detection. Tracing
    the parent's own origin reveals whether the chain is legitimate - a user double-clicked a
    desktop shortcut or login script ran cmd.exe - or suspicious - a remote-access tool, scheduled
    task, or another process drove the shell to issue the lock. Inspect what spawned cmd.exe and
    its command line to see whether the lock was the shell's only purpose or one step in a sequence.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same cmd.exe spawn?
  context: If the shell that issued the lock also launched other processes, the lock may be one
    step in a larger sequence rather than a standalone action. Examining sibling processes of the
    same cmd.exe instance reveals the full scope of what that shell did - reconnaissance, credential
    access, or staging that the lock may have been meant to mask.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.mechanism_decode
  question: What did the cmd.exe parent run, and was the lock its only command?
  context: The parent shell's own command line shows what it was asked to do. A cmd.exe that only
    runs the rundll32 lock points to a deliberate single-purpose lock, while a parent carrying a
    /c chain of commands shows the lock was bundled with other actions. Read the parent command line
    to understand how the lock was driven and what else it carried.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:cue_parent_process.baseline
  question: Has cmd.exe spawned rundll32 on this host before, or is this a novel parent-child pairing?
  context: A cmd.exe to rundll32 spawning that has occurred routinely on this host is more likely
    to be a known script or automation, while zero or very low historical counts indicate a novel
    relationship worth chasing. Historical frequency of this specific pairing distinguishes routine
    from anomalous use of the lock invocation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_parent_process.follow_on
  question: What else did this cmd.exe parent do on the host after the lock fired?
  context: An operator may use the lock to obscure activity that continues after the screen is
    secured. Seeing the full set of processes the same parent drove after the lock reveals whether
    the lock was a terminal action or a precursor to further operations on the host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.clustering
  question: What other activity is associated with this cmd.exe parent around the same time?
  context: Beyond child processes, the parent shell may have generated file events or network
    connections in the same window. Activity clustered around the lock helps establish whether
    this was an isolated user action or part of a broader operation on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally lock the workstation through scripted rundll32 calls?
  context: Compare this user's current action against their historical behavior. A user who has
    never driven a rundll32 LockWorkStation call from a shell is more suspicious than one who does
    so regularly through known automation. User role and typical toolset should align with scripted
    session locking.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the cmd.exe and rundll32 launch pair historically routine on this host or environment-wide, or is the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute the
    behavior. The meaningful pivot is the launch mechanism: which parent spawned rundll32, and is
    that pair historically common. A new or rare cmd.exe parent for rundll32 on this host or
    environment-wide is the deviation worth chasing, while a pair that already accounts for many
    prior events is more likely automation or imaging activity.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the lock was an isolated
    action or part of activity spanning multiple endpoints. If the same user drove similar activity
    on other hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same cmd.exe and rundll32 pair fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, asking what else this user did across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism - cmd.exe
    spawning rundll32 to lock the session - fired on other hosts in the alert window. Multiple hosts
    in the same window points to scheduled or pushed automation, while a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the lock reveals the
    immediate context: what led to it, what happened after, and whether it is part of a larger
    sequence. Look for reconnaissance, credential access, or staging that the lock may accompany.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, or credential
    access - may reveal the stages that preceded the lock and help reconstruct the timeline. A lock
    that follows hands-on-keyboard activity reads very differently from one that stands alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.renamed_binary_check
  question: Was rundll32 executed from its expected System32 or SysWOW64 path?
  context: rundll32.exe executed from outside System32 or SysWOW64 may indicate the binary was
    copied or renamed to evade path-based allowlists. The rule also matches on OriginalFileName,
    so a renamed copy can still trigger it - compare the on-disk path against the original file
    name to confirm whether this ran from the expected location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: An operator who uses rundll32 to reach a user32.dll export may also reach other native
    code paths through related proxy-execution binaries. Finding regsvr32, mshta, msbuild, or similar
    binaries running on the same host in the same window strengthens the case that this is hands-on
    activity rather than a one-off session lock.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rundll32 LockWorkStation pattern over the past 90 days, and what command-line shapes are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used
    routinely under a stable parent. This query mirrors the rule's selection structure scoped to
    this host, so the count reflects the rule's specific firing pattern rather than generic rundll32
    usage. The command-line projection lets the analyst compare typical invocation shapes against the
    alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_call_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_call_parent:
        ParentImage|endswith: \cmd.exe
      selection_call_cli:
        CommandLine|contains: user32.dll,
      selection_function:
        CommandLine|contains: LockWorkStation
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
