- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints.
    WMI execution is frequently used to run commands against remote nodes, so if the same user triggered similar activity
    on multiple hosts, the scope may extend beyond the alerting endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: attack:T1047.network_connection
  question: Did this host make outbound or remote-host network connections from WMI processes close in time to the alert?
  context: Remote WMI execution (a /node argument, or Invoke-WmiMethod against another host) produces a network connection
    correlated in time with the process creation, and download-style child commands reach external infrastructure. Look for
    connections from wmic.exe or WmiPrvSE.exe within a few minutes of the alert, and note how many distinct remote hosts were
    contacted — a single host suggests targeted lateral movement while several distinct destinations in a short window suggest
    fan-out. The time window between the process creation and any connection is the correlation signal for whether the command
    executed remotely.
  range: +/-10m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\wmic.exe'
          - '\WmiPrvSE.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1047.wmi
  question: Do the WMI-Activity operational events on this host show process-create or subscription activity matching the alert
    window?
  context: WMI operational logging records the provider operations behind "process call create" and any event-subscription
    setup (consumers/filters in namespaces such as root\cimv2 and root\subscription). Correlating these events with the
    alerting command confirms whether WMI actually executed a command versus a benign query, and whether a persistent
    subscription was also registered. If WMI operational logs are not collected in this environment, treat zero results as
    a visibility gap rather than evidence nothing ran, and rely on the process-creation evidence instead.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - EventID
      - Operation
      - User
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution or download LOLBins used on this host recently?
  context: Operators who use one LOLBin often use several. WMI process-create is frequently paired with proxy-execution
    binaries (rundll32, regsvr32, mshta) or download tools (certutil, bitsadmin, curl) to stage and run a payload. Finding
    multiple LOLBins performing complementary steps on the same host strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was wmic.exe executed from its expected System32 or SysWOW64 path?
  context: A LOLBin executed from a non-standard path (outside System32 or SysWOW64) may have been copied or renamed to evade
    path-based allowlists. wmic.exe running from a user's temp directory or another user-writable location is more suspicious
    than the same binary in System32. Compare Image against OriginalFileName to confirm the on-disk name and path are
    consistent with the genuine WMI client.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
