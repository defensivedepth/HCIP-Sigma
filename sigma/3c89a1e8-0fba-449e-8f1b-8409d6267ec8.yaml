name: Suspicious Process Created Via Wmic.EXE
id: 5e8c14ac-f9b2-405d-89ac-d8e5223a3e58
description: |
  Detects wmic.exe invoking "process call create" with a command line that also references a suspicious child program or
  user-writable path (rundll32, regsvr32, bitsadmin, certutil, mshta, cscript, wscript, powershell/pwsh, a cmd.exe one-shot,
  or a directory such as Users\Public, Windows\Temp, AppData\Local, %temp%, %ProgramData%). The rule fires when all of these
  conditions are present together in the command line, so the alerting event combines the WMI process-create verb with a
  proxy-execution or download payload. Legitimate administration occasionally uses "wmic process call create" for software
  deployment, but the specific combination with these LOLBins and temp paths is characteristic of WMI-based local or remote
  command execution. Determine what the child command actually does, whether the parent and user are expected to drive WMI
  execution, and whether the activity is isolated or part of a broader sequence on the host or across the fleet.
type: detection
detection_id: 3c89a1e8-0fba-449e-8f1b-8409d6267ec8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the wmic.exe command line contain "process call create" together with a suspicious child program or temp path?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The
    rule requires the WMI process-create verb ("process", "call", "create" all present) AND at least one suspicious token
    such as rundll32, regsvr32, bitsadmin, certutil, mshta, cscript, wscript, powershell/pwsh, a cmd.exe one-shot, or a
    user-writable path. Read the full command and confirm both halves are present, not an incidental substring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run WMI process-creation commands?
  context: Legitimate administrative deployment occasionally uses "wmic process call create", but it is normally driven by
    a known management account or a software-distribution host. Knowing whether the user role and host function fit WMI-based
    execution is often the fastest path to separating a real positive from routine operations. WMI execution running as SYSTEM
    or a low-privileged interactive user changes the interpretation of the same command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the wmic command instruct the target to run? Decode the full command line.
  context: The portion after "process call create" is the program WMI was told to launch. Decode it fully — identify the child
    binary (rundll32, regsvr32, bitsadmin, certutil, mshta, a script host, powershell), any DLL export or URL it references,
    and whether it carries a /node argument indicating remote execution against another host. Suspicious command structures for
    this technique include "wmic process call create" wrapping a download cradle or a proxy-execution DLL. This query returns
    all wmic.exe executions on the host within the window, so a multi-step operation is visible as a single sequence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned wmic.exe and is that parent chain expected?
  context: The parent reveals how WMI execution was invoked. Legitimate usage has predictable parents (explorer.exe for an
    interactive admin, a deployment agent, services.exe). Parents such as cmd.exe spawned by a script host, mshta.exe, an
    Office application, or an unknown binary in a user-writable directory point to WMI being driven as part of an exploitation
    or post-exploitation chain rather than routine administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did wmic.exe spawn afterward on this host?
  context: The child the WMI command launches is the actual payload of this technique. Locally invoked "process call create"
    spawns the named program as a child of WmiPrvSE.exe or wmic.exe; observed children such as rundll32.exe loading a DLL,
    a download cradle, or a script host reveal what the operation accomplished. Unexpected children for routine administration
    are the lead to follow.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this WMI process-create pattern, what parents and users normally drive it, and
    does the current alert fit?
  context: Even routine tooling can be abused. This query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how the rule's specific firing pattern (not generic wmic usage) has historically
    run here. A new parent process, an unexpected user account, or an unusual command structure relative to that history is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining process activity in the surrounding window reveals the immediate
    context: what led to the WMI execution, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, credential access, persistence installation, or additional execution tooling near the alert.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this WMI process-create pattern in the past week, and does the cross-host distribution look
    like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern (not generic wmic usage). Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and the
    parent/command consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
