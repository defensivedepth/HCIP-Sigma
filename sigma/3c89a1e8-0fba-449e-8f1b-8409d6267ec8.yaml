    are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents. This
    query mirrors the rule's selection scoped to this host, so the count reflects the rule's specific firing pattern (not
    generic wmic usage). The command-line projection lets the analyst compare typical invocation patterns against the alerting
    one to judge whether this command fits an established routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
