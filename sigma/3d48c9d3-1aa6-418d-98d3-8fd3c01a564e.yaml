  - stage: 4
    label: outbound_network
    description: Child immediately makes outbound network connections
    mapped_to: Q8
    source: attack:T1127.network_connection
  dimension_coverage:
  - dimension: parent_process_analysis
    technique: T1127
    covered_by: Q4
    source: template:cue_parent_process.process_chain
    coverage_type: direct
  - dimension: time_correlation
    technique: T1127
    covered_by: Q6
    source: attack:T1127.file_event
    coverage_type: direct
  - dimension: tuning_parameter
    technique: T1127
    covered_by: Q2
    source: template:universal.host_user_context
    coverage_type: indirect
  mutable_dispositions:
  - element: TimeWindow
    dimension: time_correlation
    specific_values: 0-30 minutes between utility execution, payload write, and network egress
    disposition: query_injection
    target_question: Q6
    notes: File-write, image-load, and network questions all use +/-15m to correlate
      child activity to the parent launch within the chain window.
  - element: SuspiciousChildList
    dimension: tuning_parameter
    specific_values: powershell.exe, rundll32.exe, regsvr32.exe, cmd.exe, wscript.exe, mshta.exe
    disposition: context
    target_question: Q3
    notes: Rule has no CommandLine constraint and no child allowlist; named in context
      as higher-concern children rather than as a query filter, which would narrow
      the child-decode away from the actual alerting child.
  - element: RarePathRegex
    dimension: tuning_parameter
    specific_values: '%TEMP%, %APPDATA%, recycle bin, public profile'
    disposition: context
    target_question: Q6
    notes: User-writable drop locations named in context; query filters on executable/script
      extensions written by the child rather than hardcoding org-specific path regexes.
  - element: UnsignedOrInvalidSignatureOnly
    dimension: tuning_parameter
    specific_values: rationale only
    disposition: context
    target_question: Q7
    notes: Image-load question projects Signed/Signature so the analyst can judge unsigned
      or invalid modules directly.
  - element: AllowedUtilitiesList
    dimension: tuning_parameter
    specific_values: rationale only
    disposition: context
    target_question: Q2
    notes: Org allowlist of expected dev utilities is a judgment input for the host/user
      expectation question.
  - element: DeveloperHosts
    dimension: tuning_parameter
    specific_values: rationale only
    disposition: context
    target_question: Q2
    notes: Whether this is a known developer/build host is the core expectation judgment.
  - element: ParentProcessAllowList
    dimension: parent_process_analysis
    specific_values: rationale only
    disposition: context
    target_question: Q4
    notes: Known orchestrators that launch mftrace.exe legitimately are evaluated when
      checking what spawned mftrace.exe.
  - element: NetworkReputationThreshold
    dimension: tuning_parameter
    specific_values: rationale only
    disposition: context
    target_question: Q8
    notes: Rare/unknown destination heuristic named in context; query surfaces destination
      fields for the analyst to apply reputation judgment.
  dedup_decisions:
