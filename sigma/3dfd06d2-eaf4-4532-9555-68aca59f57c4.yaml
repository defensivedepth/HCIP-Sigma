name: Process Execution From A Potentially Suspicious Folder
id: 9d2b7c4a-1f6e-4a83-bf0c-5e1d8a3c9b27
description: |
  Detects a process whose image path lives under an uncommon or rarely-used system folder
  (for example Perflogs, Windows\Fonts, Windows\Help, Windows\Tasks, the recycle bin, or a
  machine-key store), excluding two known-good vendor install locations. Legitimate executables
  almost never run from these directories, so the pattern commonly reflects masquerading: a
  binary placed in a low-scrutiny location and given a benign-looking name or relocated to evade
  path-based allowlists. Investigation should establish the binary's true identity (image name
  versus PE metadata, signature, and hash), how it arrived in that folder, what it did after
  execution, and whether the same binary or pattern appears elsewhere in the environment.
type: detection
detection_id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process image actually run from one of the suspicious folders this rule flags?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    when the process image path contains one of a fixed list of uncommon folders (such as Perflogs,
    Windows\Fonts, Windows\Help, Windows\Tasks, the recycle bin, config\systemprofile, Intel\Logs,
    or RSA\MachineKeys) and does not match the IBM ClientSolutions or Citrix updater exclusions.
    Confirm the image path and confirm it is not one of those two excluded vendor locations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run an executable from this folder?
  context: Legitimate administrative or vendor activity occasionally drops and runs binaries from
    non-standard directories. Knowing whether the user role and host function are consistent with an
    executable living in this location is often the fastest way to separate a true positive from a
    sanctioned install or maintenance task.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: The image name on disk can be set to anything, but the embedded PE metadata
    (OriginalFileName) and code-signing details still reflect the original tool. Compare the Image
    path against OriginalFileName, and check whether the file is Microsoft-signed, third-party
    signed, or unsigned. A file running from a low-scrutiny folder with a benign name but mismatched
    or absent metadata is the core masquerading signal. The hash enables a reputation lookup to
    decide whether this is a known-good tool, a known malicious sample, or a novel binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How and when did this binary arrive in that folder?
  context: Executables do not appear in these directories on their own; the file was copied,
    downloaded, extracted, or dropped by a parent process. Matching the file-creation event by
    basename over a long window reveals the delivery mechanism and the writing process, and the
    timestamp establishes how close the file creation was to execution. A short gap between creation
    and run is consistent with hands-on deployment; a file placed long ago may reflect an older
    install or staged tooling.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution, and does the same binary appear on other hosts?
  context: The point of placing a renamed or relocated binary in a low-scrutiny folder is to run its
    intended function while evading path-based detection. The child processes, command lines, and
    follow-on activity reveal the actual objective, and the same binary or identical path pattern
    appearing on multiple hosts points to deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this process do? Decode its full command line.
  context: The full command line reveals the specific action taken from this folder. Decode any
    flags, parameters, encoded content, file paths, or URLs. Scoping to all executions of this image
    on this host within a few minutes catches multi-step operations that span sequential invocations
    rather than only the single triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this binary and is that parent chain expected?
  context: The parent process reveals how the binary was launched. Legitimate execution often has
    predictable parents (explorer.exe for user actions, services.exe for services). Script hosts,
    Office applications, or remote-execution utilities as the parent point toward macro abuse,
    exploitation, or operator-driven deployment into the suspicious folder.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run an executable from this path?
  context: A process image path never seen before on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts indicate first-time or rare execution from this
    location, which strengthens the case that the placement is deliberate rather than routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this folder pattern, what parents and users normally
    drive it, and does the current alert fit that pattern?
  context: Even routine processes occasionally run from these folders. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user distribution reflects
    how this rule's specific firing pattern has historically run here. A new parent process, an
    unexpected user account, or an unusual pattern relative to that history is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Perflogs\
        - :\Users\All Users\
        - :\Users\Default\
        - :\Users\NetworkService\
        - :\Windows\addins\
        - :\Windows\debug\
        - :\Windows\Fonts\
        - :\Windows\Help\
        - :\Windows\IME\
        - :\Windows\Media\
        - :\Windows\repair\
        - :\Windows\security\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - $Recycle.bin
        - \config\systemprofile\
        - \Intel\Logs\
        - \RSA\MachineKeys\
      filter_optional_ibm:
        Image|startswith: C:\Users\Public\IBM\ClientSolutions\Start_Programs\
      filter_optional_citrix:
        Image|startswith: C:\Windows\SysWOW64\config\systemprofile\Citrix\UpdaterBinaries\
        Image|endswith: \CitrixReceiverUpdater.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Attacks typically involve multiple tools in sequence. Activity surrounding the detected
    execution may reveal reconnaissance, privilege escalation, persistence installation, or data
    staging that provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this folder pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firing pattern rather than generic usage of any single binary. Many
    hosts firing the same pattern points to scripted deployment or vendor automation; one host or a
    small unrelated set points to manual operator activity. Use the host distribution and
    parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Perflogs\
        - :\Users\All Users\
        - :\Users\Default\
        - :\Users\NetworkService\
        - :\Windows\addins\
        - :\Windows\debug\
        - :\Windows\Fonts\
        - :\Windows\Help\
        - :\Windows\IME\
        - :\Windows\Media\
        - :\Windows\repair\
        - :\Windows\security\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - $Recycle.bin
        - \config\systemprofile\
        - \Intel\Logs\
        - \RSA\MachineKeys\
      filter_optional_ibm:
        Image|startswith: C:\Users\Public\IBM\ClientSolutions\Start_Programs\
      filter_optional_citrix:
        Image|startswith: C:\Windows\SysWOW64\config\systemprofile\Citrix\UpdaterBinaries\
        Image|endswith: \CitrixReceiverUpdater.exe
      condition: selection and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Perflogs\
        - :\Users\All Users\
        - :\Users\Default\
        - :\Users\NetworkService\
        - :\Windows\addins\
        - :\Windows\debug\
        - :\Windows\Fonts\
        - :\Windows\Help\
        - :\Windows\IME\
        - :\Windows\Media\
        - :\Windows\repair\
        - :\Windows\security\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - $Recycle.bin
        - \config\systemprofile\
        - \Intel\Logs\
        - \RSA\MachineKeys\
      filter_optional_ibm:
        Image|startswith: C:\Users\Public\IBM\ClientSolutions\Start_Programs\
      filter_optional_citrix:
        Image|startswith: C:\Windows\SysWOW64\config\systemprofile\Citrix\UpdaterBinaries\
        Image|endswith: \CitrixReceiverUpdater.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Perflogs\
        - :\Users\All Users\
        - :\Users\Default\
        - :\Users\NetworkService\
        - :\Windows\addins\
        - :\Windows\debug\
        - :\Windows\Fonts\
        - :\Windows\Help\
        - :\Windows\IME\
        - :\Windows\Media\
        - :\Windows\repair\
        - :\Windows\security\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - $Recycle.bin
        - \config\systemprofile\
        - \Intel\Logs\
        - \RSA\MachineKeys\
      filter_optional_ibm:
        Image|startswith: C:\Users\Public\IBM\ClientSolutions\Start_Programs\
      filter_optional_citrix:
        Image|startswith: C:\Windows\SysWOW64\config\systemprofile\Citrix\UpdaterBinaries\
        Image|endswith: \CitrixReceiverUpdater.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across
    multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of
    the event may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Perflogs\
        - :\Users\All Users\
        - :\Users\Default\
        - :\Users\NetworkService\
        - :\Windows\addins\
        - :\Windows\debug\
        - :\Windows\Fonts\
        - :\Windows\Help\
        - :\Windows\IME\
        - :\Windows\Media\
        - :\Windows\repair\
        - :\Windows\security\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - $Recycle.bin
        - \config\systemprofile\
        - \Intel\Logs\
        - \RSA\MachineKeys\
      filter_optional_ibm:
        Image|startswith: C:\Users\Public\IBM\ClientSolutions\Start_Programs\
      filter_optional_citrix:
        Image|startswith: C:\Windows\SysWOW64\config\systemprofile\Citrix\UpdaterBinaries\
        Image|endswith: \CitrixReceiverUpdater.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context: what led to this event, what happened after, and whether it is part of a
    larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, credential access — may reveal the stages that preceded this event
    and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
