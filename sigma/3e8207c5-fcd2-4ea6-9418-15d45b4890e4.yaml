    - template: data_staging_exfil.archive_destination
      reason: "must_include archive-destination template assumes an archiving/export tool (rar/7z/rclone) writing a file artifact; this rule has no archiving — collection is in-memory cookie/session theft over CDP. The exfil-path angle is instead covered by the debug_port_network and intranet_pivot questions (where the session data goes), so the archive-file framing was dropped rather than authored against a non-existent artifact."
    - template: data_staging_exfil.encryption_password
      reason: "must_include archive-password template (-p/-hp/--passphrase) assumes archive creation; this rule performs no archiving and applies no archive password, so the question has no answerable artifact. Collection here is plaintext cookie extraction via DevTools, so the encryption-password angle does not apply."
