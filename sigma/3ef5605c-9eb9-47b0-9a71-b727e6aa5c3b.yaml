name: Use NTFS Short Name in Image
id: 39b17426-8588-414c-b161-b125cf4ab894
description: |
  Detects a process whose executable path (Image) contains an NTFS 8.3 short-name
  marker (a tilde followed by a sequence digit, such as ~1.exe or ~2.dll). Windows
  auto-generates these DOS-compatible 8.3 names for long file names; referencing a
  binary by its short name resolves to the same file while sidestepping detection
  and allowlisting logic that matches on the long path. The rule fires when an Image
  contains one of these short-name patterns AND none of the known-benign parents or
  installer paths match. Investigation should resolve the short name to its real
  long-form path, confirm what the binary actually is, and determine whether the
  short-name reference was an installer artifact or a deliberate evasion of path-based
  controls.
type: detection
detection_id: 3ef5605c-9eb9-47b0-9a71-b727e6aa5c3b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the executable path contain an 8.3 short-name marker, and which long-form
    file does it resolve to?
  context: Before investing investigation time, confirm the alert is a true positive
    by reviewing the exact Image path. The rule fires only when the Image contains a
    tilde-plus-digit short-name marker (such as ~1.exe or ~2.dll) AND the parent is
    not one of the excluded installers or shells. Note the full path and resolve it
    to the long-form file name so the rest of the investigation references the real
    binary, not the short alias.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to launch binaries by their NTFS short-name
    path?
  context: Legitimate software installers and a small set of vendor tools occasionally
    invoke binaries by their 8.3 short name. Knowing whether the user role and host
    function are consistent with that behavior is often the fastest path to separating
    an installer artifact from a deliberate attempt to evade path-based controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full Image path and command line of this process, and what does
    the short-name path resolve to?
  context: The full path and arguments reveal what the binary actually is and what it
    was asked to do. Decode any flags, encoded content, file paths, or URLs in the
    command line, and resolve the short-name segments of the path to their long form.
    A short-name reference to a binary in a user-writable or temporary directory is a
    stronger evasion signal than one resolving to a normal Program Files install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1564.004.short_name_resolution
  question: Were files with NTFS short-name patterns created on this host, and where
    do they live?
  context: 8.3 short names are auto-generated for long file names, so a short-name
    Image often points to a file dropped with a long or random name that the operator
    then references by its predictable short alias to bypass path matching. Surfacing
    file-creation events whose target path carries a tilde-plus-digit marker helps
    locate the real file and the directory it was written to. If file creation events
    are not ingested in this environment, resolve the path manually with a directory
    listing that shows short names.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_shortname:
        TargetFilename|contains:
          - '~1.'
          - '~2.'
      condition: selection_host and selection_shortname
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1564.004.ads_check
  question: Were Alternate Data Streams created on this host around the time of the
    alert?
  context: Hiding artifacts via NTFS also takes the form of Alternate Data Streams,
    where content is written to a file:stream path that does not appear in a normal
    directory listing. Stream-creation events around the alert window indicate data
    or code being concealed alongside a host file. If stream-hash events are not
    ingested in this environment, treat zero results as a visibility gap and inspect
    the resolved file for streams directly.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: create_stream_hash
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this binary, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Installers and
    archive utilities legitimately launch helpers by short-name paths, and several
    such parents are explicitly excluded by the rule. A short-name execution under an
    interactive shell, a script host (wscript.exe, cscript.exe), or an Office
    application is more consistent with deliberate evasion than with an installer.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this binary run on this host before?
  context: A binary that has never been seen on a host is more suspicious than one
    that runs regularly. Zero or very low historical counts for this Image path
    indicate first-time or rare execution and shift the disposition toward operator
    activity rather than routine software behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's short-name pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate installers occasionally execute by short-name path. The
    query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern has run
    here historically. A new parent process, an unexpected user account, or an
    unusual short-name path is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - ~1.bat
        - ~1.dll
        - ~1.exe
        - ~1.hta
        - ~1.js
        - ~1.msi
        - ~1.ps1
        - ~1.tmp
        - ~1.vbe
        - ~1.vbs
        - ~2.bat
        - ~2.dll
        - ~2.exe
        - ~2.hta
        - ~2.js
        - ~2.msi
        - ~2.ps1
        - ~2.tmp
        - ~2.vbe
        - ~2.vbs
      filter_main_generic_parent:
        ParentImage: C:\Windows\explorer.exe
      filter_optional_webex:
        ParentImage|endswith: \WebEx\WebexHost.exe
      filter_optional_thor:
        ParentImage|endswith: \thor\thor64.exe
      filter_optional_winzip:
        Image: C:\PROGRA~1\WinZip\WZPREL~1.EXE
      filter_optional_vcred:
        Image|endswith: \VCREDI~1.EXE
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this binary spawn afterward?
  context: The processes spawned by a binary reveal its actual impact. An installer
    referenced by short name typically spawns predictable setup helpers; a short-name
    binary that spawns cmd.exe, powershell.exe, or certutil.exe is more consistent
    with post-exploitation activity than with software installation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Activity surrounding the detected execution may reveal reconnaissance,
    privilege escalation, persistence installation, or data staging that provides
    broader context. Evasion via short-name paths is rarely an end in itself; the
    surrounding process activity tells you what the evasion was protecting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's short-name pattern in the past week, and
    does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of this firing pattern rather than generic binary
    usage. Many hosts firing the same short-name pattern points to scripted deployment
    or vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - ~1.bat
        - ~1.dll
        - ~1.exe
        - ~1.hta
        - ~1.js
        - ~1.msi
        - ~1.ps1
        - ~1.tmp
        - ~1.vbe
        - ~1.vbs
        - ~2.bat
        - ~2.dll
        - ~2.exe
        - ~2.hta
        - ~2.js
        - ~2.msi
        - ~2.ps1
        - ~2.tmp
        - ~2.vbe
        - ~2.vbs
      filter_main_generic_parent:
        ParentImage: C:\Windows\explorer.exe
      filter_optional_webex:
        ParentImage|endswith: \WebEx\WebexHost.exe
      filter_optional_thor:
        ParentImage|endswith: \thor\thor64.exe
      filter_optional_winzip:
        Image: C:\PROGRA~1\WinZip\WZPREL~1.EXE
      filter_optional_vcred:
        Image|endswith: \VCREDI~1.EXE
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run this binary?
  context: Compare this user's current action against their historical pattern. A
    user who has never run this binary is more suspicious than one who does so
    regularly, and the user's role should align with launching software by short-name
    paths.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host
    or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not
    attribute behavior. The meaningful pivot is the launch mechanism, which parent
    process spawned this binary and whether that pair is historically common. A new or
    rare parent for this binary is the deviation worth chasing; a pair that already
    accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user triggered similar activity
    on multiple hosts, the scope of the operation may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the
    same window, or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network
    returns agent-telemetry noise. The meaningful question is whether the same launch
    mechanism, parent process plus spawned binary, fired on other hosts in the alert
    window. Multiple hosts in the same window points to scheduled or pushed automation;
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert
    reveals the immediate context: what led to this event, what happened after, and
    whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host,
    such as defense tampering, reconnaissance, or credential access, may reveal the
    stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: attack:T1564.004.time_correlation
  question: Did the short-name execution line up in time with a preceding file write
    or interactive command on this host?
  context: Correlating the short-name execution with a recent file creation or a
    hands-on command strengthens malicious context, because deliberate evasion usually
    follows a drop or a manual setup step rather than appearing on its own. A tight
    sequence of file write then short-name execution is a stronger signal than an
    isolated installer invocation.
  range: -30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - CommandLine
      - User
