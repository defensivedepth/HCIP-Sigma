name: VolumeShadowCopy Symlink Creation Via Mklink
id: 51b8c873-3a7e-458e-b479-2b8dc1ebf5d2
description: |
  Detects a command line that combines mklink with a reference to HarddiskVolumeShadowCopy, which creates a symbolic link into a volume shadow copy device path. Walking a shadow copy through such a symlink lets an operator read locked credential stores (SAM, SYSTEM, SECURITY hives, or NTDS.dit on a domain controller) without invoking vssadmin or ntdsutil, and without opening the live, locked files directly. Legitimate backup and recovery work occasionally touches shadow copies, so the investigation should determine which user and host ran the command, what the symlink targeted, and whether hive or NTDS.dit access, registry hive export, or lateral movement followed.
type: detection
detection_id: 40b19fa6-d835-400c-b301-41f3a2baacaf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain both mklink and a HarddiskVolumeShadowCopy reference?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The rule fires only when both mklink and HarddiskVolumeShadowCopy appear in the same command line, so confirm both strings are present and read what shadow copy index and target path the symlink points at.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to create symbolic links into volume shadow copies?
  context: Legitimate backup, recovery, and forensic work occasionally creates shadow copy symlinks, but it is uncommon and usually tied to specific accounts and maintenance hosts. Knowing whether this user role and host function are consistent with shadow copy handling is often the fastest path to distinguishing routine administration from credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: What did the symlink target inside the shadow copy, and which credential store was the goal?
  context: A symlink into HarddiskVolumeShadowCopy is a path into a frozen copy of the volume. Read the full command line to see what the link pointed at — the config directory holding SAM, SYSTEM, and SECURITY, or the NTDS directory holding ntds.dit on a domain controller. SAM plus SYSTEM together enable offline local-hash extraction; ntds.dit plus SYSTEM enables domain-wide hash extraction. The target determines which accounts may be compromised and the scope of remediation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned the shell that ran the mklink command, and is that parent chain expected?
  context: mklink is a command shell builtin, so the alerting command ran inside a cmd.exe (or a shell invoked by another process). The parent reveals how the command was driven. An interactive administrator shell launched from explorer.exe differs from a shell spawned by a script host, remote-execution service, or office application, which points toward automated or remote operator activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run the mklink-to-shadow-copy pattern, what parents and users drove it, and does the current alert fit?
  context: Even legitimate shadow copy handling leaves a historical pattern. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has run here before. A new parent process, an unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - mklink
        - HarddiskVolumeShadowCopy
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What did the shell do after creating the shadow copy symlink, and did anything copy or read hive files through it?
  context: The symlink itself is only setup; the credential theft is the subsequent read or copy of hive files through the linked path. Look for copy, robocopy, esentutl, reg, or PowerShell file operations referencing the symlink path, the config directory, or ntds.dit shortly after the link was created.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Credential access rarely happens in isolation. Activity surrounding the symlink creation may reveal reconnaissance, privilege escalation, shadow copy creation via vssadmin or wmic, hive export, or staging of dumped files that provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts run the mklink-to-shadow-copy pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific firing pattern rather than generic command shell usage. Many hosts firing the same pattern points to a backup or imaging job; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - mklink
        - HarddiskVolumeShadowCopy
      condition: selection
    fields:
    - host.name
- source: attack:T1003.002.file_event
  question: Were SAM, SYSTEM, SECURITY, or ntds.dit files created or copied on this host around the alert?
  context: Reading credential stores through a shadow copy symlink leaves file artifacts when the hives are copied out — files named sam, system, security, or ntds.dit, or .save and .dmp copies in temporary and public directories. File creation events naming these stores within minutes of the symlink confirm the credential theft moved from setup to extraction.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - '\config\SAM'
        - '\config\SYSTEM'
        - '\config\SECURITY'
        - 'ntds.dit'
        - 'sam.save'
        - 'system.save'
      filter_scope:
        host.name|expand: '%hostname%'
      condition: selection and filter_scope
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1003.002.registry_set
  question: Did any process export the SAM or SYSTEM registry hives around the alert?
  context: The shadow copy symlink is one route to the hives; an operator may also export them live with reg save. Look for command lines saving HKLM\SAM, HKLM\SYSTEM, or HKLM\SECURITY to a file, which produces the same offline-crackable hive set as the shadow copy path. Either route present alongside the symlink strengthens the credential-dumping disposition.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_save:
        CommandLine|contains|all:
        - 'save'
        - 'hklm\'
      selection_hive:
        CommandLine|contains:
        - 'hklm\sam'
        - 'hklm\system'
        - 'hklm\security'
      filter_scope:
        host.name|expand: '%hostname%'
      condition: (selection_save or selection_hive) and filter_scope
    fields:
      - CommandLine
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - mklink
        - HarddiskVolumeShadowCopy
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - mklink
        - HarddiskVolumeShadowCopy
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or credential reuse across multiple endpoints. If the same user triggered similar shadow copy or hive activity on more than one host, the scope of compromise may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - mklink
        - HarddiskVolumeShadowCopy
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Credential access rarely happens in isolation. Earlier detections on the same host — defense tampering, reconnaissance, shadow copy creation, or privilege escalation — may reveal the attack stages that preceded the symlink and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of credential theft depends on which accounts the targeted store holds. Local SAM hives expose local accounts; ntds.dit on a domain controller exposes every domain account including domain admins and krbtgt, which require incident escalation. Cross-reference the host role and the accounts present in the targeted store against directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
