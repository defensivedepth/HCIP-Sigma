name: Suspicious Csi.exe Usage
id: 79c432b5-48a4-4c92-8d23-ec5e3a78cfa8
description: |
  Detects execution of csi.exe or rcsi.exe, the Microsoft-signed Roslyn C# interactive and
  script-runner binaries that ship with Visual Studio. The rule fires when the Image ends in
  \csi.exe or \rcsi.exe (or the OriginalFileName is csi.exe/rcsi.exe) AND the Company is
  Microsoft Corporation. Legitimate use is local C# development by software engineers. Because
  these binaries are Microsoft-signed and compile-and-run arbitrary C# from a .csx/.cs file at
  runtime, they are abused as a living-off-the-land path to execute unsigned code and bypass
  application allowlisting and code-integrity controls. Investigation should determine what
  source file or C# was run, what parent invoked the binary, whether the user and host are
  expected to perform C# development, and what executed before and after.
type: detection
detection_id: 40b95d31-1afc-469e-8d34-9a3a667d058e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the process match this rule — a Microsoft-signed csi.exe or rcsi.exe execution?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the Image, OriginalFileName, and Company against the rule's criteria. The rule fires only
    when the binary resolves to csi.exe/rcsi.exe AND the Company is Microsoft Corporation, so a
    non-Microsoft signer or a renamed binary would not match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Company
- source: template:universal.host_user_context
  question: Is this user and host expected to run C# interactive or script-runner tooling?
  context: Legitimate csi.exe/rcsi.exe use is software development work. Knowing whether the user
    role is a developer and whether the host is a development workstation is often the fastest path
    to distinguishing routine activity from a living-off-the-land bypass on a machine that has no
    business compiling C# at runtime.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What source file or C# did this binary run? Decode the full command line.
  context: The full command line reveals what was executed. csi.exe runs C# interactively or from
    a file argument; rcsi.exe runs a .csx script file. Decode the file path passed as an argument,
    any inline C#, and any URLs or script paths — these indicate whether arbitrary unsigned code
    was compiled and run, and where the source came from. A .csx or .cs path in a user-writable
    or temporary directory is a stronger signal than a project file under a developer's workspace.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.assembly_load
  question: What modules and assemblies did this binary load, and were any from user-writable or unsigned locations?
  context: csi.exe and rcsi.exe compile and run C# in-process, loading the Roslyn compiler and any
    assemblies the script references. A documented abuse pattern transports the Roslyn runner plus
    its dependency DLLs to a protected host (bring-your-own-LOLBin), so modules loaded from
    user-writable, temporary, or otherwise non-standard directories — rather than the Visual Studio
    install path — point to relocated or attacker-supplied components rather than a normal install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1072.deployment_tool_context
  question: Do the deployment or management logs show a software-deployment job that pushed or launched this binary?
  context: Software deployment and remote-management tooling can legitimately push and run binaries
    from system context, and the same channel is abused to fan execution out across hosts. Checking
    application-channel deployment logs around the alert time shows whether a deployment job,
    scheduled push, or management console initiated this csi.exe/rcsi.exe execution, or whether it
    ran interactively without any deployment record behind it.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Provider
      - EventID
      - Message
- source: template:cue_process_tool.process_chain
  question: What process spawned this binary and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. A developer-driven run usually
    descends from a shell, IDE, or build process under explorer.exe. Unusual parents such as
    mshta.exe, wscript.exe, Office applications, or a remote-management or deployment service
    suggest the signed binary is being used as a proxy-execution stage rather than for development.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this binary spawn afterward?
  context: The processes spawned by the C# runner reveal its actual impact. Development use rarely
    spawns interactive children; a run that launches cmd.exe, powershell.exe, certutil.exe, or
    other tooling indicates the compiled C# is being used as a launcher for post-exploitation
    rather than for legitimate compilation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run csi.exe or rcsi.exe?
  context: A binary that has never been seen on a host is more notable than one that runs regularly.
    Zero or very low historical counts over the past 90 days indicate first-time or rare execution
    of the C# runner on this host, which is harder to explain as routine development.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate developer tooling has a stable pattern on a given host. The query mirrors
    the rule's selection scoped to this host, so the resulting parent and user distribution reflects
    how the rule's firing pattern — Microsoft-signed csi.exe/rcsi.exe — has historically run here. A
    new parent process, an unexpected user account, or an unusual command-line structure is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \csi.exe
        - \rcsi.exe
      - OriginalFileName:
        - csi.exe
        - rcsi.exe
      selection_cli:
        Company: Microsoft Corporation
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of
    the rule's firing pattern rather than generic binary usage. Many hosts firing the same pattern
    points to scripted deployment or vendor automation; one host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \csi.exe
        - \rcsi.exe
      - OriginalFileName:
        - csi.exe
        - rcsi.exe
      selection_cli:
        Company: Microsoft Corporation
      condition: all of selection*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \csi.exe
        - \rcsi.exe
      - OriginalFileName:
        - csi.exe
        - rcsi.exe
      selection_cli:
        Company: Microsoft Corporation
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \csi.exe
        - \rcsi.exe
      - OriginalFileName:
        - csi.exe
        - rcsi.exe
      selection_cli:
        Company: Microsoft Corporation
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals movement or activity across
    multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of
    the activity may be larger than a single workstation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \csi.exe
        - \rcsi.exe
      - OriginalFileName:
        - csi.exe
        - rcsi.exe
      selection_cli:
        Company: Microsoft Corporation
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity in the window around the alert
    reveals the immediate context — what led to this execution and what happened after — and whether
    it is part of a larger sequence. Unusual timing, such as a deployment outside standard
    maintenance hours, is itself a signal worth noting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, or credential access — may reveal the attack stages that preceded
    this execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lateral_movement.target_activity_after_access
  question: What processes were spawned on this host shortly after the binary executed?
  context: T1072 abuse moves execution onto a target host as a means to an end — to run commands,
    deploy tools, or access data. Examining processes spawned shortly after the C# runner executed
    reveals what the activity was actually for on this host, independent of whether the launch came
    from a deployment channel or an interactive session.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
