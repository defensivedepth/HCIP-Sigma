      reason: "Rule has no remote-connection detection — it fires on local process_creation of a signed C# runner. A source-host / inbound-port question on SMB/RDP/WinRM ports queries a network_connection signal this rule does not produce; the relevant scope is covered topically by cue_user_actor.clustering (user network-wide) and cue_user_actor.clustering_svc (parent+binary across hosts)."
      kept: cue_user_actor.clustering_svc
    - dropped: lateral_movement.authentication_method
      reason: "Authentication-method analysis (pass-the-hash / Kerberos) presumes a remote logon event tied to the execution. This rule detects local LOLBin execution with no associated authentication artifact in scope; no 4624/4648 signal is implied by the detection. Host/user expectation is covered by host_user_context and the user_actor baseline pair."
      kept: cue_user_actor.baseline
    - dropped: lateral_movement.lateral_movement_scope
      reason: "Filters to psexec/mstsc/ssh/plink/wmic lateral tools, none of which is this rule's binary; the rule fires on csi.exe/rcsi.exe. User-wide and parent+binary fleet scope are covered by cue_user_actor.clustering and cue_user_actor.clustering_svc, and fleet pattern distribution by cue_process_tool.scope."
      kept: cue_process_tool.scope
    - dropped: network_scope.same_action_other_hosts
      reason: "Cross-host count of the same action is provided by cue_process_tool.scope (REFLECTED fleet_pattern), which enforces the rule's full selection (Image/OriginalFileName + Company) rather than Image-only — strictly more precise than this Image|endswith template for this rule."
      kept: cue_process_tool.scope
    - dropped: network_scope.actor_activity_network_wide
      reason: "User network-wide activity is covered by cue_user_actor.clustering (always_include, same +/-1h window, same User pivot); this network_scope template is a near-duplicate of it."
      kept: cue_user_actor.clustering
    - dropped: network_scope.actor_authentication_trail
      reason: "Queries Security-log 4624/4625 logon trail; this rule detects local LOLBin execution with no associated authentication event in scope. Same out-of-scope rationale as lateral_movement.authentication_method — no logon artifact is implied by the detection."
      kept: cue_user_actor.clustering
