  mutable_dispositions:
    - element: SuspiciousCommandPatterns / CommandLinePattern
      dimension: command_analysis
      specific_values: "rule CommandLine|contains: '-M pe_inject', '--local-auth', '-u', '-x', '-p', \"-H 'NTHASH'\", 'mssql', 'smb', '-M', '-d', '-o', '10.', '192.168.', '/24'"
      disposition: query_injection
      target_question: Q17
      notes: "The rule's full multi-branch CommandLine selection is reflected verbatim into the baseline_deviation (host, Q17) and scope (fleet, Q18) REFLECTED queries, and into the cue_user_actor baseline/baseline_svc/clustering_svc queries (ANDed with the actor pivot). The decode questions (Q4 capability, Q5 credentials/targets, Q6 payload) surface these values from the alerting CommandLine via ProcessGuid scope."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (analytic suggests 5-10 min for auth correlation)"
      disposition: context
      target_question: Q9
      notes: "No fixed value queryable; the +1h authentication-follow window and +/-15m recon-burst window operationalize the correlation timing."
    - element: UserContext
      dimension: user_context
      specific_values: "rationale only (service accounts vs interactive vs SYSTEM)"
      disposition: context
      target_question: Q3
      notes: "Realized as host_user_context plus the cue_user_actor baseline/clustering pair (subject-pivot) and their service-principal substitutes (mechanism-pivot)."
    - element: RemoteDestinationThreshold
      dimension: tuning_parameter
      specific_values: "rationale only (count of unique remote hosts in a window)"
      disposition: context
      target_question: Q8
      notes: "The outbound-connection aggregation question surfaces the distinct remote destinations contacted so the analyst can judge subnet-sweep breadth; no fixed threshold is hard-coded."
    - element: WMIQueryScope
      dimension: tuning_parameter
      specific_values: "rationale only (\\root\\cimv2, \\root\\subscription)"
      disposition: context
      target_question: Q8
      notes: "Rule does not detect WMI namespace access; CME's remote execution surfaces as outbound network connections, covered by the T1047 remote-connections question. No wmi-logsource namespace value is queryable from the rule's evidence."
  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot and launch-mechanism-pivot). Image-pivot adapted to carry the rule's full multi-branch CommandLine/binary pattern so the count reflects the rule's firing pattern, not generic binary usage."
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot and launch-mechanism-pivot). clustering subject-pivot intentionally left broad (what else did the user do); clustering_svc carries the rule pattern."
      kept: both
    - dropped: cue_process_tool.baseline
      reason: "generic Image|endswith \\crackmapexec.exe host baseline is subsumed by the REFLECTED host-pattern question (baseline_deviation), which scopes to the rule's full firing pattern including the renamed-binary flag branches the simple image baseline would miss."
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.clustering
      reason: "Image-only host aggregation subsumed by cue_host_context.clustering, which projects Image+ParentImage and surfaces novel parent-child pairs."
      kept: cue_host_context.clustering
    - dropped: cue_process_tool.follow_on
      reason: "follow_on scopes children by ParentImage|endswith %Image%, which depends on a constraining rule Image; several rule branches fire on a renamed binary (CommandLine-only), so %Image% is unreliable. Post-launch host activity is covered by cue_host_context.clustering and the T1047 outbound-connection question."
      kept: cue_host_context.clustering
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: scheduled_task.task_configuration (brief hint). Phase 2 decode of the actual tool capability is provided by hacking_tool.tool_capability_used and the credential/target and pe_inject payload attack questions, which are far more specific to CrackMapExec than the generic schtasks-oriented task_configuration template (the rule does not invoke schtasks)."
    - template: scheduled_task.task_configuration
      reason: "must_include in scheduled_task set, but the rule detects CrackMapExec flag combinations, not schtasks.exe. There is no scheduled-task command line to decode. T1053 is an incidental technique tag (CME can be run from a scheduled task, but the rule does not detect task creation). Phase 2 mechanism decode is fulfilled by hacking_tool.tool_capability_used (Q4)."
    - template: scheduled_task.task_trigger_and_timing
      reason: "No schtasks invocation is detected; the svchost/Schedule parent query would return unrelated scheduler children. Out of scope for a CME flag-pattern rule."
    - template: scheduled_task.task_still_present
      reason: "No scheduled task is created by the detected activity; nothing to confirm still-registered."
    - template: powershell.encoded_command_decode
      reason: "must_include in powershell set, but the rule detects CrackMapExec command lines, not powershell.exe with -enc. The pe_inject reflective loader runs PowerShell on the REMOTE target, not on this host's command line, so there is no local encoded PowerShell payload to decode here. The -x command (which may carry a remote PowerShell cradle) is decoded by attack:T1059.001.pe_inject_payload (Q6)."
    - template: powershell.script_block_logging
      reason: "PowerShell script-block (4104) events would be generated on the REMOTE target executing the reflective loader, not on the host that launched CrackMapExec. A host.name-scoped 4104 query against the launching host would not capture the remote in-memory execution and would mislead. Out of scope for the local process_creation evidence this alert carries."
    - template: powershell.powershell_security_bypass
      reason: "Looks for AMSI/execution-policy bypass in PowerShell command lines on this host; the rule fires on CrackMapExec flags, not local PowerShell, so this sweep is orthogonal. Generic tamper-before-execution coverage is not load-bearing for a remote credential-validation tool."
    - template: credential_access.credential_target_identification
      reason: "must_include, but its generic 'which credential store' framing (LSASS/SAM/NTDS) does not match CME, which validates and sprays credentials over the network rather than dumping a local store. Replaced by attack:T1110.credential_target_and_auth_material (Q5), which is specific to the -u/-p/-H/--local-auth/target material CME actually supplies. Brief hint credential_access.credential_target_identification replaces cue_process_tool.mechanism_decode is honored by Q5 covering the credential-target decode role."
    - template: discovery_recon.discovery_parent_chain
      reason: "Overlaps cue_process_tool.process_chain (Q7), which already retrieves the parent of the alerting process via ProcessGuid. discovery_parent_chain re-displays the same ProcessGuid parent for a discovery-specific framing the CME rule does not need."
    - template: discovery_recon.discovery_user_context
      reason: "Per its own notes_to_llm, overlaps universal.host_user_context (Q3); kept host_user_context which is already adapted to remote-administration tooling context."
    - template: discovery_recon.discovery_burst_detection
      reason: "must_include in discovery_recon set, but T1201 password-policy discovery is an incidental tag and the rule does not detect native recon binaries. The recon-burst sweep on the launching host is secondary to the credential-access and remote-execution spine; cue_host_context.clustering (Q15) already surfaces novel parent-child pairs (including recon binaries) on the host. Trimmed to stay within the 14-18 target."
    - template: credential_access.post_access_lateral_movement
      reason: "must_include, but its sigma-alert follow-on correlation overlaps both attack:T1110.successful_authentication (Q9, security-log auth outcomes) and cue_host_context.precursor (Q16, host alert timeline). The lateral-movement chain stage is covered by attack:T1047.remote_connections_after_execution (Q8) and Q9. Trimmed to stay within the 14-18 target."
    - template: credential_access.credential_exposure_assessment
      reason: "must_include, but the AD privilege cross-reference it prompts is folded into attack:T1110.credential_target_and_auth_material (Q5), whose context now directs the analyst to cross-reference the command-line usernames against directory group memberships. Trimmed to stay within the 14-18 target."
    - template: universal.endpoint_protection_health
      reason: "recommended, not must_include. cue_host_context.precursor (Q16) already surfaces prior tamper/recon alerts on the host, and the rule is not a defense-tampering detection. The generic host-tamper sweep is not load-bearing for a remote credential-validation tool; trimmed to stay within the 14-18 target."
    - template: organizational_context.change_ticket
      reason: "Per its own notes_to_llm, skip for hktl-prefixed detections where change tickets are irrelevant. Authorization is covered by hacking_tool.authorized_engagement (Q2), which is the correct framing for an offensive tool."
    - template: organizational_context.human_recall
      reason: "recommended. Authorization/legitimacy for an offensive tool is better framed by hacking_tool.authorized_engagement (Q2). Trimmed to stay within the 14-18 target."
    - template: organizational_context.timing_alignment
      reason: "recommended. Timing-vs-work-hours judgment is subsumed by the authorized-engagement check (Q2) and the user baseline; trimmed to stay within target."
    - template: organizational_context.procedural_consistency
      reason: "recommended. Aimed at admin-tool shortcuts (schtasks/net/reg); not meaningful for a dedicated offensive toolkit where any use is notable. Trimmed to stay within target."
    - template: persistence_scope.process_based_persistence
      reason: "recommended; cascaded from T1053. The rule detects remote credential validation, not persistence installation. is_persistence_rule is set from the incidental T1053 tag, but no persistence mechanism is installed by the detected CME activity. Trimmed to stay within target."
    - template: persistence_scope.file_based_persistence
      reason: "recommended; cascaded from T1053. File-drop persistence is orthogonal to remote credential validation. Trimmed to stay within target."
  reflection_overrides: []
  hint_dispositions:
    - hint: "credential_access.credential_target_identification replaces cue_process_tool.mechanism_decode"
      disposition: declined
      reason: >-
        Acted on in spirit but the named replacement template is itself unsuitable
        (its LSASS/SAM/NTDS store framing does not fit a network credential-spray
        tool). The mechanism-decode role is filled by attack:T1110.credential_target_and_auth_material
        (Q5) and hacking_tool.tool_capability_used (Q4), which decode the actual CME
        capability, credentials, hashes, and targets. cue_process_tool.mechanism_decode
        is recorded as skipped; credential_target_identification is recorded as
        skipped with the same rationale.
    - hint: "scheduled_task.task_configuration replaces cue_process_tool.mechanism_decode"
      disposition: declined
      reason: >-
        The rule does not detect schtasks.exe; there is no scheduled-task command line
        to decode. The mechanism-decode role is filled by hacking_tool.tool_capability_used
        (Q4). scheduled_task.task_configuration and cue_process_tool.mechanism_decode
        are both recorded as skipped with specific reasons.
    - hint: "powershell.encoded_command_decode replaces obfuscation.encoded_payload_decode"
      disposition: declined
      reason: >-
        obfuscation.encoded_payload_decode was never in the template set, and
        powershell.encoded_command_decode itself is skipped because the rule detects
        CrackMapExec flags rather than a local -enc PowerShell command line. The
        pe_inject reflective loader runs PowerShell on the remote target; the local
        -x command payload is decoded by attack:T1059.001.pe_inject_payload (Q6).
    - hint: "logsource 'image_load' (recommended by techniques: T1059.003,T1059.001) is not covered"
      disposition: declined
      reason: >-
        The rule detects CrackMapExec on this host; pe_inject's reflective .NET/PE
        loading happens in a PowerShell process on the REMOTE target, not on the
        launching host. An image_load query on the launching host would not observe
        the remote in-memory load and would add volume without precision. The payload
        delivery is covered from the launching side by attack:T1059.001.pe_inject_payload
        (Q6, the -o PATH and -x command) and from the network side by
        attack:T1047.remote_connections_after_execution (Q8). No compensating
        image_load question authored.
    - hint: "logsource 'network_connection' (recommended by techniques: T1047) is not covered"
      disposition: acted_on
      reason: >-
        Acted on - attack:T1047.remote_connections_after_execution (Q8) is authored
        with category: network_connection, surfacing outbound SMB/MSSQL/WinRM
        connections from the host after the alert to show which remote targets CME
        actually contacted.
    - hint: "logsource 'security' (recommended by techniques: T1053,T1110,T1201) is not covered and no template family exists"
      disposition: acted_on
      reason: >-
        Acted on - attack:T1110.successful_authentication (Q9) is authored with
        service: security (EventID 4624/4625/4776) to determine whether the local-auth
        spray or pass-the-hash attempts succeeded. This is the load-bearing security
        logsource question for a credential-access tool.
    - hint: "logsource 'wmi' (recommended by techniques: T1047) is not covered and no template family exists"
      disposition: declined
      reason: >-
        The rule detects CrackMapExec command-line flags, not WMI provider events.
        CME's smb/mssql modules execute over those protocols, not via local WMI; the
        remote-execution evidence on this host is the outbound network connection,
        covered by attack:T1047.remote_connections_after_execution (Q8). A wmi-logsource
        query on the launching host would return unrelated local WMI activity. No
        compensating wmi question authored.
    - hint: "Condition uses OR among selection groups - frame Q1 and description as EITHER ... OR"
      disposition: acted_on
      reason: >-
        Acted on - condition_topology.shape is OR_of_selections. Q1 and the playbook
        description use disjunctive 'EITHER ... OR ...' framing enumerating the nine
        branches, and Q1's context instructs the analyst to note which branch fired
        because the branch drives downstream weighting (pe_inject vs -H pass-the-hash
        vs /24 sweep).
