name: HackTool - CrackMapExec Execution
id: 99309d10-f81c-4c72-950e-6badf07ae731
description: |
  Detects command-line flag combinations characteristic of CrackMapExec (CME), a
  post-exploitation toolkit used for credential validation, password spraying, and
  remote module execution against SMB and MSSQL. The rule fires when a process
  matches any ONE of several independent patterns: the crackmapexec.exe binary name,
  a pe_inject module invocation, a local-auth command-execution combination
  (--local-auth with -u and -x), a pass-the-hash combination (--local-auth with -u,
  -p, and -H 'NTHASH'), an mssql or smb module invocation, or a local-auth sweep
  across an RFC1918 range (10. / 192.168. / /24). Because the binary can be renamed,
  several branches key on flag patterns rather than the image, so the same operator
  workflow can trigger the rule even when crackmapexec.exe is absent. Legitimate red
  team or penetration-test activity uses the same tool, so the investigation should
  confirm which branch fired, identify the credentials and targets supplied,
  determine which module or command was run, and establish whether the activity is
  an authorized engagement or unsanctioned operator action.
type: detection
detection_id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match one of the CrackMapExec patterns this rule
    detects, and which branch fired?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when a process matches EITHER the crackmapexec.exe image name, OR
    a ' -M pe_inject ' module call, OR a local-auth command-execution combination
    (' --local-auth' with ' -u ' and ' -x '), OR a pass-the-hash combination
    (' --local-auth' with ' -u ', ' -p ', and " -H 'NTHASH'"), OR an mssql/smb
    module call, OR a local-auth sweep across an RFC1918 range. Read the exact command
    line and note which branch matched, because the branch determines what the
    activity was attempting - a pe_inject branch points to in-memory payload delivery,
    a -H branch points to pass-the-hash, and a /24 sweep points to credential spraying
    across a subnet. The branch that fired drives which downstream questions carry
    the most weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:hacking_tool.authorized_engagement
  question: Is this CrackMapExec activity part of an authorized penetration test or
    red team engagement?
  context: CrackMapExec is a standard offensive toolkit used in authorized security
    assessments. Before investing investigation time, check whether a penetration
    test or red team exercise is currently scheduled against this host or network
    segment. An authorized engagement whose scope, source host, and timing match this
    activity resolves the alert without further analysis; the absence of any
    sanctioned engagement shifts the disposition toward unauthorized operator use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run remote credential-validation or
    lateral-movement tooling?
  context: CrackMapExec authenticates to remote hosts and runs modules across them,
    so it is normally seen only from administrator workstations, jump hosts, or
    sanctioned testing systems. A standard user endpoint or a server with no
    administrative role running this pattern is more notable than the same activity
    from a known pentest box. Knowing whether the acting account and host function
    involve remote administration is often the fastest path to separating sanctioned
    use from an operator on a compromised host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.tool_capability_used
  question: Which CrackMapExec protocol, module, or command was invoked?
  context: CrackMapExec is multi-purpose - it can validate credentials, spray
    passwords, run remote modules such as mimikatz or pe_inject, and execute arbitrary
    commands via -x. The protocol (smb or mssql), the module after -M, and any command
    after -x determine the scope of potential compromise. A bare authentication check
    is a different finding than a pe_inject reflective-loader call or an -x command
    that fetches and runs a payload. Read the full command line and identify the
    specific capability invoked.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1110.credential_target_and_auth_material
  question: What credentials, targets, and authentication material were supplied on
    the command line?
  context: The CrackMapExec command line names the targets (a single IP, an IP range,
    a /24 CIDR, or a target-list file) and the authentication material - a username
    after -u, a password after -p, or an NT hash after -H for pass-the-hash. The
    --local-auth flag forces local-account authentication rather than domain
    authentication, which is the spraying pattern against a subnet. Identify which
    accounts and hashes were used and how broad the target set is, then cross-reference
    those usernames against directory group memberships - local administrator
    credentials reused across many hosts enable broad lateral movement, while domain
    administrator or service-account credentials require incident escalation. This
    determines which credentials may be compromised and how many hosts were in scope.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1059.001.pe_inject_payload
  question: If the pe_inject or an -x command branch fired, what payload or command
    was delivered?
  context: The pe_inject module reflectively loads a DLL or EXE into a remote
    PowerShell process in memory, with the local payload path supplied after
    -o PATH=. The -x branch passes an arbitrary command to run on the target, often a
    PowerShell or certutil download cradle that fetches and executes a second-stage
    payload. Read the command line to recover the PATH value, any -o options, and the
    full -x command string, since these name the file or URL that was actually
    executed and the in-memory loader leaves little else on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned the CrackMapExec activity, and is that parent chain
    expected?
  context: The parent process reveals how the tool was launched. Interactive operator
    use typically shows a console shell or a remote-administration session as the
    parent; an unexpected parent such as a script host, mshta.exe, an Office
    application, or a service points to automated or remotely driven invocation. The
    parent is where the credential-validation or module command originated, so it
    anchors who or what initiated the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1047.remote_connections_after_execution
  question: What outbound connections to remote hosts occurred from this host right
    after the alert?
  context: CrackMapExec authenticates and runs modules over the network, so a true
    positive is usually accompanied by outbound SMB (445), MSSQL (1433), or WinRM
    connections to the targets named on the command line. Correlating outbound
    connections from this host immediately after the launch shows which remote systems
    were actually contacted and whether the target set matches the command-line scope
    or extends beyond it. A burst of connections to many hosts is consistent with a
    subnet sweep.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_local:
        DestinationIp|cidr:
          - '127.0.0.0/8'
          - '::1/128'
      condition: selection and not filter_local
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- source: attack:T1110.successful_authentication
  question: Did any successful or failed logons follow this activity that match the
    accounts CrackMapExec attempted?
  context: A --local-auth sweep across a /24 range generates authentication attempts
    against many hosts; the meaningful question for credential-access triage is
    whether any of those attempts succeeded. Reviewing authentication events that
    reference the accounts and source host from the command line shows whether the
    sprayed or pass-the-hash credentials were valid. A run of failures followed by a
    success on a remote host indicates the operator found a working credential and
    may already be moving laterally.
  range: +1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4625
          - 4776
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
- source: template:hacking_tool.tool_specific_artifacts
  question: Were CrackMapExec or post-exploitation artifacts written on this host
    after the activity?
  context: CrackMapExec and the modules it runs leave characteristic artifacts -
    a cme.db database and logs in a .cme directory, dumped credential or ticket files
    from credential modules, and payload files staged for pe_inject. Checking for file
    writes from the launching process confirms execution and reveals the scope of
    activity even after the original process exits. Files dropped to user-writable or
    public paths around the alert time are worth pulling for analysis.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_user_actor.baseline
  question: Does this user normally run CrackMapExec or similar remote
    credential-validation tooling?
  context: Compare the acting account against its own history. A penetration tester or
    administrator may run this pattern routinely; an account that has never done so
    launching CrackMapExec is more notable. The query scopes to this user running the
    rule's CrackMapExec patterns across all hosts over 90 days, so a zero or very low
    count points to first-time or rare use that does not fit an established workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_pattern:
        Image|endswith: \crackmapexec.exe
      selection_special:
        CommandLine|contains: ' -M pe_inject '
      selection_execute:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -x '
      selection_hash:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
        - ' -H ''NTHASH'''
      selection_module_mssql:
        CommandLine|contains|all:
        - ' mssql '
        - ' -u '
        - ' -p '
        - ' -M '
        - ' -d '
      selection_module_smb1:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -H '
        - ' -M '
        - ' -o '
      selection_module_smb2:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -p '
        - ' --local-auth'
      part_localauth_1:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
      part_localauth_2:
        CommandLine|contains|all:
        - ' 10.'
        - ' 192.168.'
        - '/24 '
      condition: selection and (selection_pattern or selection_special or selection_execute or selection_hash or selection_module_mssql or selection_module_smb1 or selection_module_smb2 or part_localauth_1 or part_localauth_2)
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent process and CrackMapExec pattern historically routine on
    this host or environment, or is the parent unusual for it?
  context: When the alert fires under a service principal, user identity does not
    attribute the behavior; the meaningful pivot is which parent process launched a
    child carrying the rule's CrackMapExec pattern and whether that pairing is
    historically common. A new or rare parent for this pattern on this host or
    environment-wide is the deviation worth chasing, while a parent that already
    accounts for many prior events is more likely a known testing harness or
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
      selection_pattern:
        Image|endswith: \crackmapexec.exe
      selection_special:
        CommandLine|contains: ' -M pe_inject '
      selection_execute:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -x '
      selection_hash:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
        - ' -H ''NTHASH'''
      selection_module_mssql:
        CommandLine|contains|all:
        - ' mssql '
        - ' -u '
        - ' -p '
        - ' -M '
        - ' -d '
      selection_module_smb1:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -H '
        - ' -M '
        - ' -o '
      selection_module_smb2:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -p '
        - ' --local-auth'
      part_localauth_1:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
      part_localauth_2:
        CommandLine|contains|all:
        - ' 10.'
        - ' 192.168.'
        - '/24 '
      condition: selection and (selection_pattern or selection_special or selection_execute or selection_hash or selection_module_mssql or selection_module_smb1 or selection_module_smb2 or part_localauth_1 or part_localauth_2)
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    CrackMapExec activity was a single event or part of activity spanning multiple
    endpoints. If the same user triggered related execution on other hosts in the same
    window, the operation reaches further than one machine and the response scope grows
    accordingly.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent process and CrackMapExec pattern fire on other hosts
    in the same window, indicating a coordinated rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network
    returns agent-telemetry noise, since every host runs system-owned agents
    constantly. The meaningful question is whether the same launch mechanism - a parent
    process spawning a child that carries the CrackMapExec pattern - fired on other
    hosts in the alert window. Multiple hosts in the same window points to scripted or
    pushed automation, such as a testing harness; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
      selection_pattern:
        Image|endswith: \crackmapexec.exe
      selection_special:
        CommandLine|contains: ' -M pe_inject '
      selection_execute:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -x '
      selection_hash:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
        - ' -H ''NTHASH'''
      selection_module_mssql:
        CommandLine|contains|all:
        - ' mssql '
        - ' -u '
        - ' -p '
        - ' -M '
        - ' -d '
      selection_module_smb1:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -H '
        - ' -M '
        - ' -o '
      selection_module_smb2:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -p '
        - ' --local-auth'
      part_localauth_1:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
      part_localauth_2:
        CommandLine|contains|all:
        - ' 10.'
        - ' 192.168.'
        - '/24 '
      condition: selection and (selection_pattern or selection_special or selection_execute or selection_hash or selection_module_mssql or selection_module_smb1 or selection_module_smb2 or part_localauth_1 or part_localauth_2)
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    CrackMapExec launch reveals what led to it and what followed - the parent that
    staged the tool, reconnaissance, credential staging, or follow-on execution. Novel
    parent-child pairs at low counts are what to scan for against the high-count noise
    of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    initial-access activity - may reveal the attack stages that preceded the
    CrackMapExec activity and help reconstruct the full timeline. Remote credential
    validation is usually one step in a sequence, so prior alerts give context for how
    the operator reached this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's CrackMapExec pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned testing can match these CrackMapExec patterns. This query
    mirrors the rule's selection structure scoped to this host, so the resulting parent
    and user distribution reflects how this specific firing pattern has historically
    run here, not generic process activity. A new parent process, an unexpected
    account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_binary:
        Image|endswith: \crackmapexec.exe
      selection_special:
        CommandLine|contains: ' -M pe_inject '
      selection_execute:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -x '
      selection_hash:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
        - ' -H ''NTHASH'''
      selection_module_mssql:
        CommandLine|contains|all:
        - ' mssql '
        - ' -u '
        - ' -p '
        - ' -M '
        - ' -d '
      selection_module_smb1:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -H '
        - ' -M '
        - ' -o '
      selection_module_smb2:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -p '
        - ' --local-auth'
      part_localauth_1:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
      part_localauth_2:
        CommandLine|contains|all:
        - ' 10.'
        - ' 192.168.'
        - '/24 '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_* or all of part_localauth*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's CrackMapExec pattern in the past week,
    and does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the CrackMapExec firing pattern rather than generic
    process activity. Many hosts firing the same pattern points to a sanctioned testing
    program or scripted deployment; one host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_binary:
        Image|endswith: \crackmapexec.exe
      selection_special:
        CommandLine|contains: ' -M pe_inject '
      selection_execute:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -x '
      selection_hash:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
        - ' -H ''NTHASH'''
      selection_module_mssql:
        CommandLine|contains|all:
        - ' mssql '
        - ' -u '
        - ' -p '
        - ' -M '
        - ' -d '
      selection_module_smb1:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -H '
        - ' -M '
        - ' -o '
      selection_module_smb2:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -p '
        - ' --local-auth'
      part_localauth_1:
