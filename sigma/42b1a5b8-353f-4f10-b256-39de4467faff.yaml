name: Harvesting Of Wifi Credentials Via Netsh.EXE
id: 11b54ef3-fbc1-431f-adb7-22877c8cb33d
description: |
  Detects netsh.exe (by Image name or OriginalFileName) invoked with a command
  line that contains all of wlan, the show-profile switches, and =clear - the
  pattern produced by "netsh wlan show profile NAME key=clear", which prints the
  stored wireless network key in plaintext. The rule fires only when every one of
  these tokens is present together, so it targets the credential-disclosure form
  of the command rather than a benign profile listing. Reading stored WiFi keys is
  occasionally done by IT staff recovering a network password, but it is also a
  routine credential-harvest step in commodity infostealers, which enumerate every
  saved profile and dump each plaintext key. The investigation should determine
  which binary ran the command, which profiles and keys were exposed, what parent
  launched it, whether the same account or host shows other discovery or
  credential-access activity, and whether the pattern recurs across the fleet.
type: detection
detection_id: 42b1a5b8-353f-4f10-b256-39de4467faff
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line run netsh with wlan show profile and key=clear,
    matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when the process is netsh (by Image or OriginalFileName) and
    its command line contains all of wlan, the show-profile switches, and =clear
    together - the form that prints a stored wireless key in plaintext. Read the exact
    command line and confirm the =clear token is present, since that is what turns a
    benign profile listing into a credential disclosure.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user and host expected to read stored wireless network keys?
  context: IT and help-desk staff occasionally recover a saved WiFi password for a
    user, so the command is not unique to attackers. Standard users and most endpoints
    never run netsh wlan show profile key=clear. Whether the acting account and the
    host function involve network support or laptop provisioning is often the fastest
    way to separate routine recovery from automated credential harvesting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:credential_access.credential_target_identification
  question: Which wireless profiles and keys were exposed by this command?
  context: The credential disclosure depends on what was enumerated. The plaintext form
    of the command targets a named wireless profile and prints its stored key, so read
    the full command line to identify which profile or profiles were named and whether
    a preceding listing enumerated every saved profile first. Each exposed key is a
    network credential that may need to be rotated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which wireless networks may now be compromised, and does any provide access
    to sensitive segments?
  context: The severity of a stored-key disclosure depends on what the network reaches.
    A guest or home SSID is lower impact than a corporate wireless network that bridges
    to internal infrastructure. Cross-reference the exposed profile names against the
    environment's network inventory to decide which keys must be rotated and whether
    the disclosure warrants escalation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this netsh command, and is that parent expected for
    wireless key retrieval?
  context: The parent reveals how the key-retrieval command was initiated. Interactive
    recovery usually shows cmd.exe or powershell.exe under explorer.exe. A parent such
    as a script host, an Office application, or an unknown binary points to automated
    harvesting, where an infostealer spawns netsh to enumerate saved keys before
    exfiltration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:lolbin.renamed_binary_check
  question: Was netsh.exe executed from its expected System32 path?
  context: netsh.exe normally runs from System32 or SysWOW64. The rule also matches on
    OriginalFileName, so a copied or renamed netsh running from a user-writable
    directory still fires. A netsh executing from a temp or profile directory is more
    consistent with a relocated binary used to evade path-based allowlists than with a
    routine support action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance or system-information commands run on this host
    around the same time?
  context: A single key-retrieval command may be benign support, but multiple discovery
    commands in rapid succession - whoami, ipconfig, systeminfo, net user, nslookup -
    is a signature of post-compromise enumeration. Commodity stealers commonly collect
    host and user information alongside saved credentials before assembling them for
    exfiltration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\cmdkey.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:lolbin.technique_class_lateral
  question: Were other built-in credential or download utilities used on this host
    recently?
  context: An actor harvesting saved credentials often pairs native tools - vaultcmd
    for the Credential Manager, cmdkey for stored logons, or certutil and bitsadmin to
    stage and move the collected data. Finding several of these running close together
    strengthens the case that the wireless key read is part of a credential-collection
    sweep rather than isolated support.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\cmdkey.exe'
          - '\vaultcmd.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\reg.exe'
          - '\esentutl.exe'
          - '\makecab.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - wlan
        - ' s'
        - ' p'
        - ' k'
        - =clear
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - wlan
        - ' s'
        - ' p'
        - ' k'
        - =clear
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    wireless key read was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar credential or discovery activity on
    other hosts, the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - wlan
        - ' s'
        - ' p'
        - ' k'
        - =clear
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    wireless key read reveals what led to it and what followed - the parent that staged
    the process, reconnaissance, or follow-on collection. Novel parent-child pairs at
    low counts are what to scan for against the high-count noise of routine system
    processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, defense tampering, or
    other credential access - may reveal the attack stages that preceded the wireless
    key read and help reconstruct the timeline. Credential harvesting is often one step
    in a sequence, so prior alerts give context for why the key was dumped.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's wireless-key-read pattern,
    what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate support can read a stored wireless key. This query mirrors
    the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how this specific firing pattern has historically run
    here, not generic netsh activity. A new parent process, an unexpected account, or a
    first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - wlan
        - ' s'
        - ' p'
        - ' k'
        - =clear
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's wireless-key-read pattern in the past
    week, and does the cross-host distribution look like consistent automation or
    one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the wireless-key-read pattern rather than generic
    netsh activity. Many hosts firing the same pattern points to a provisioning script
    or management tool that reads keys by design; one host or a small unrelated set
    points to manual or malicious activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - wlan
        - ' s'
        - ' p'
        - ' k'
        - =clear
      condition: all of selection_*
    fields:
    - host.name
