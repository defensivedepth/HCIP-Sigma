name: Suspicious Vsls-Agent Command With AgentExtensionPath Load
id: cc6c8e2e-2fe1-4106-a6fd-49e881bae221
description: |
  Detects the Visual Studio Live Share agent (vsls-agent.exe) running with the
  --agentExtensionPath parameter pointing at a path other than the legitimate
  Microsoft.VisualStudio.LiveShare.Agent. extension. The agent is a Microsoft-signed
  binary, so an attacker can use it to proxy-load an arbitrary DLL from the command
  line and have that code run under a trusted, signed process. Legitimate Live Share
  use always resolves to the Microsoft extension path, so a load that points elsewhere
  should be confirmed against the actual DLL referenced, the parent that launched the
  agent, and whether the host normally runs Live Share at all.
type: detection
detection_id: 43103702-5886-11ed-9b6a-0242ac120002
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show vsls-agent.exe loading a DLL with --agentExtensionPath that is not the Microsoft Live Share extension path?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when vsls-agent.exe runs with --agentExtensionPath AND the path is not the legitimate Microsoft.VisualStudio.LiveShare.Agent. extension. Read the full command line and note the exact path the parameter points at.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run the Visual Studio Live Share agent?
  context: Live Share is a developer collaboration feature. A workstation belonging to a developer who uses Visual Studio may legitimately run vsls-agent.exe, while a server or a non-developer endpoint running it is a stronger signal. Knowing whether the user role and host function fit Live Share use is often the fastest path to disposition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What DLL path does --agentExtensionPath reference, and where does that file live?
  context: The full command line reveals which library the trusted agent was told to load. Decode the path after --agentExtensionPath - a user-writable location (a profile directory, a temp folder, a download path) or a non-Microsoft directory is the proxy-execution payload, whereas the legitimate value resolves under the Visual Studio Live Share install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: --agentExtensionPath
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.image_load
  question: What modules did vsls-agent.exe actually load, and were any unsigned or loaded from a user-writable path?
  context: Process-creation evidence shows the command line; the image-load record shows what the agent loaded as a result. A DLL loaded from a non-Microsoft or user-writable directory, or one with an absent or untrusted signature, confirms that the trusted binary proxied execution of attacker-supplied code rather than its own extension. If image-load events are not ingested in this environment, fall back to decoding the --agentExtensionPath value from the command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.network_connection
  question: Did vsls-agent.exe make any network connections, and were any to external or unexpected destinations?
  context: A proxy-loaded DLL may retrieve a second-stage payload or beacon out under the cover of the signed agent. Legitimate Live Share traffic resolves to Microsoft collaboration endpoints; connections to unfamiliar external addresses point at remote payload retrieval or command-and-control through the trusted process.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.process_chain
  question: What process spawned vsls-agent.exe and is that parent chain expected?
  context: The parent process reveals how the agent was invoked. Legitimate Live Share launches come from Visual Studio or its installer/updater. A parent such as a script host, an Office application, a command shell, or an unfamiliar binary suggests the agent was repurposed to load a DLL rather than started by the IDE.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did vsls-agent.exe spawn afterward?
  context: The processes spawned after the load reveal the payload's actual impact. A proxy-loaded DLL frequently leads to command shells, script hosts, or download utilities running as children of the agent, which would indicate post-exploitation rather than benign collaboration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run vsls-agent.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution and raise the likelihood that this is an introduced LOLBIN rather than routine developer activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run vsls-agent.exe with --agentExtensionPath outside the Microsoft path, what parents and users drove it, and does the current alert fit?
  context: Even a legitimate developer tool can be abused. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent, an unexpected account, or an unusual command-line shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \vsls-agent.exe
        CommandLine|contains: --agentExtensionPath
      filter:
        CommandLine|contains: Microsoft.VisualStudio.LiveShare.Agent.
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run the Live Share agent across the environment?
  context: Compare this user's current action against their historical behavior. A user who has never run vsls-agent.exe is more suspicious than a developer who runs it routinely. User role and typical toolset should align with running a Visual Studio collaboration component.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and vsls-agent.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned the agent, and whether that pair is historically common. A new or rare parent for vsls-agent.exe is the deviation worth chasing; a pair that already accounts for many prior events is routine developer-tool or update automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar agent activity on several hosts, the scope of the concern may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and vsls-agent.exe combination fire on other hosts in the same window - is this a coordinated rollout or isolated to this host?
  context: 'Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The meaningful question is whether the same launch mechanism - parent process plus spawned binary - fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts run vsls-agent.exe with this non-Microsoft --agentExtensionPath pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic agent usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \vsls-agent.exe
        CommandLine|contains: --agentExtensionPath
      filter:
        CommandLine|contains: Microsoft.VisualStudio.LiveShare.Agent.
      condition: selection and not filter
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering, reconnaissance, credential access - may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
