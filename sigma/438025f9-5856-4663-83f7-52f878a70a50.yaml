      disposition: query_injection
      target_question: Q13
      notes: "Office parent list is the rule's selection_parent. The %ParentName% expand in baseline_svc / clustering_svc resolves to the alerting Office parent, scoping the launch-mechanism baseline to the rule's parent set."
    - element: UserPaths
