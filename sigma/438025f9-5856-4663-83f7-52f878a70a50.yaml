        process_creation evidence (wmic process call create, Invoke-WmiMethod,
        root\\cimv2, root\\subscription) — the same surface the rule actually
        observes. A separate category: wmi question would return nothing on the
        common deployment and duplicates the process_creation WMI coverage already
        present.
