name: Suspicious Microsoft Office Child Process
id: 8df58e5b-0821-48f4-a433-2d50c40175d2
description: |
  Detects a Microsoft Office suite product (Word, Excel, PowerPoint, Publisher,
  Visio, OneNote, Access, WordPad, or the legacy Equation Editor) spawning a
  suspicious child process. The rule fires when an Office binary is the parent AND
  EITHER the child is a known living-off-the-land binary by name (cmd.exe,
  powershell.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe,
  wmic.exe, certutil.exe, bitsadmin.exe, msiexec.exe, schtasks.exe, and similar)
  OR the child image runs from a user-writable staging directory (AppData,
  Users\Public, ProgramData, Windows\Temp, or a Tasks folder). Office applications
  do not normally launch interpreters or system utilities; this pattern is the
  classic macro/exploit hand-off where a document opened by a user drives execution
  of a downloader or loader. Determine which branch fired, what the child did, what
  document drove it, and whether the same delivery reached other users.
type: detection
detection_id: 438025f9-5856-4663-83f7-52f878a70a50
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did a Microsoft Office product spawn a child that is either a known
    living-off-the-land binary or runs from a user-writable staging directory?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the parent is an Office binary AND either branch matches the
    child - the child is one of the named interpreters/system utilities (regardless
    of where it lives), or the child image runs from a user-writable path such as
    AppData, Users\Public, ProgramData, Windows\Temp, or a Tasks folder. Read the
    ParentImage, Image, and OriginalFileName and note which branch fired. If the
    name branch fired, the child binary identity is the signal. If the path branch
    fired, the child running from a staging directory is the signal even when the
    binary name is unremarkable, so the binary's origin and signature carry more
    weight downstream.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to open Office documents that launch
    interpreters or system utilities?
  context: Most users open Office documents that never spawn a child process. A
    narrow set of workflows - developers, macro-heavy finance templates, or
    line-of-business automation - may legitimately drive Office to launch a helper.
    Knowing whether the acting account and host function involve that kind of
    document automation is often the fastest path to separating a benign macro from
    a malicious document hand-off.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Which Office application is the parent, and what document or macro drove
    it to spawn this child?
  context: The parent-child relationship is the core signal. The Office parent does
    not spawn interpreters on its own - a macro, an embedded object, or an exploit
    in the opened document drives the spawn. Read the parent's command line for the
    document filename and trace the parent's own origin to see whether a user opened
    the file interactively or another process launched the Office application
    headless. The legacy Equation Editor parent (EQNEDT32.EXE) almost always means
    an exploit rather than a macro.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: attack:T1204.002.delivery_vector
  question: What document or email attachment triggered this execution, and where did
    it come from?
  context: User execution of a malicious file typically begins with a phishing email
    attachment or a downloaded document. The Office parent's command line usually
    carries the document path; from there, identify whether the file arrived by
    email, web download, or a network share, and which user opened it. Identifying
    the delivery vector enables blocking it at the perimeter and searching for other
    recipients who received the same file.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentCommandLine
- source: attack:T1204.002.child_identity
  question: Which child binary ran, where does its image live, and is it signed?
  context: The rule matches the child either by name or by path. Identify the exact
    image, its full path, and its signing status. A signed Microsoft utility running
    from System32 launched by a macro is a proxy-execution concern about what it was
    told to do, while an unsigned or unexpected binary running from AppData,
    Users\Public, ProgramData, Windows\Temp, or a Tasks folder is itself the dropped
    payload. When the path branch fired, the user-writable origin is the load-bearing
    detail even if the binary name looks ordinary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: attack:T1218.command_analysis
  question: What is the full command line of the child, and does it carry a remote
    URL, a script or DLL reference, or a proxy-execution flag?
  context: System binaries like regsvr32.exe, rundll32.exe, mshta.exe, msiexec.exe,
    certutil.exe, and bitsadmin.exe are abused to proxy-execute remote or local
    payloads. Decode the child's arguments for an http/https/UNC source, a scriptlet
    or DLL reference, regsvr32 /i or /u with a remote .sct or .ocx, certutil -decode
    or -urlcache, bitsadmin /transfer, or a wmic process call create. The presence of
    a download or scriptlet reference in the arguments is what distinguishes proxy
    execution from a benign invocation. This query re-displays the alerting event so
    the analyst can read the command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- source: attack:T1047.wmi_execution
  question: Did the same lineage use WMI to launch or to reach remote systems around
    this time?
  context: When the child is wmic.exe (or the chain pivots into WMI), command
    execution and any remote reach happen across separate events. This query surfaces
    wmic process call create and Invoke-WmiMethod usage on the host in the alert
    window so the analyst can see whether the Office hand-off used WMI to spawn local
    work or to execute against another host. Remote WMI execution turns a single-host
    document detonation into potential lateral movement.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_wmi:
        CommandLine|contains:
          - 'process call create'
          - 'Invoke-WmiMethod'
          - 'Invoke-CimMethod'
          - 'root\cimv2'
          - 'root\subscription'
      condition: selection and selection_wmi
    fields:
      - Image
      - CommandLine
      - User
- source: attack:T1218.010.module_load
  question: Did the child binary load a scriptlet or an unsigned DLL from an unusual
    path shortly after it started?
  context: Proxy-execution binaries such as regsvr32.exe and rundll32.exe register or
    invoke a scriptlet (.sct) or DLL as their actual payload. The module-load event
    shows what was loaded and from where - a scriptlet or DLL from a temporary or
    user-writable directory, or an unsigned module, is the executed payload that the
    command line only references. If image-load telemetry is not collected in this
    environment, treat an empty result as a visibility gap and fall back to the
    child's command-line arguments for the referenced module.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.network_egress
  question: Did the child process make an outbound network connection, and to what
    destination?
  context: A document hand-off that proxy-executes a downloader will reach out to
    fetch the next stage. Outbound connections from the spawned child - especially
    from interpreters or system binaries that rarely talk to the internet on a user
    endpoint - point to a download cradle or command-and-control channel. Identify
    the destination address and port so it can be checked against threat
    intelligence and blocked. If network telemetry is not collected, an empty result
    is a visibility gap rather than evidence nothing connected.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1204.002.payload_on_disk
  question: Was a file written to a user-writable staging path around the time of the
    spawn, and is it still on disk?
  context: The macro or child commonly drops the next stage into a user-controlled
    directory - Downloads, Temp, AppData, Users\Public, or ProgramData - before or
    just after the spawn. A created stream hash or file-write in those paths is the
    dropped payload. Confirming the file is still present enables hash lookup, sandbox
    submission, and content review. The path branch of this rule fires precisely
    because the child runs from one of these directories, so a matching file write is
    strong corroboration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\AppData\'
          - '\Users\Public\'
          - '\ProgramData\'
          - '\Windows\Temp\'
          - '\Downloads\'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - Hashes
- source: template:parent_child.sibling_processes
  question: What other child processes did the same Office parent spawn?
  context: A malicious document often drives several actions in sequence - a
    downloader, then a loader, then a persistence step. Examining every child of the
    same Office parent instance reveals the full scope of activity the document
    initiated rather than just the one process that tripped the alert. Multiple
    suspicious children from one Office parent points to scripted orchestration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \EQNEDT32.EXE
        - \EXCEL.EXE
        - \MSACCESS.EXE
        - \MSPUB.exe
        - \ONENOTE.EXE
        - \POWERPNT.exe
        - \VISIO.exe
        - \WINWORD.EXE
        - \wordpad.exe
        - \wordview.exe
      selection_child_processes:
      - OriginalFileName:
        - bitsadmin.exe
        - CertOC.exe
        - CertUtil.exe
        - Cmd.Exe
        - CMSTP.EXE
        - cscript.exe
        - curl.exe
        - HH.exe
        - IEExec.exe
        - InstallUtil.exe
        - javaw.exe
        - Microsoft.Workflow.Compiler.exe
        - msdt.exe
        - MSHTA.EXE
        - msiexec.exe
        - Msxsl.exe
        - odbcconf.exe
        - pcalua.exe
        - PowerShell.EXE
        - RegAsm.exe
        - RegSvcs.exe
        - REGSVR32.exe
        - RUNDLL32.exe
        - schtasks.exe
        - ScriptRunner.exe
        - wmic.exe
        - WorkFolders.exe
        - wscript.exe
      - Image|endswith:
        - \AppVLP.exe
        - \bash.exe
        - \bitsadmin.exe
        - \certoc.exe
        - \certutil.exe
        - \cmd.exe
        - \cmstp.exe
        - \control.exe
        - \cscript.exe
        - \curl.exe
        - \forfiles.exe
        - \hh.exe
        - \ieexec.exe
        - \installutil.exe
        - \javaw.exe
        - \mftrace.exe
        - \Microsoft.Workflow.Compiler.exe
        - \msbuild.exe
        - \msdt.exe
        - \mshta.exe
        - \msidb.exe
        - \msiexec.exe
        - \msxsl.exe
        - \odbcconf.exe
        - \pcalua.exe
        - \powershell.exe
        - \pwsh.exe
        - \regasm.exe
        - \regsvcs.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \scrcons.exe
        - \scriptrunner.exe
        - \sh.exe
        - \svchost.exe
        - \verclsid.exe
        - \wmic.exe
        - \workfolders.exe
        - \wscript.exe
      selection_child_susp_paths:
        Image|contains:
        - \AppData\
        - \Users\Public\
        - \ProgramData\
        - \Windows\Tasks\
        - \Windows\Temp\
        - \Windows\System32\Tasks\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
