  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot and launch-mechanism-pivot). baseline adapted with the rule's LOLBIN+staging-path child filter; baseline_svc pivots on the Office parent."
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot and launch-mechanism-pivot)."
      kept: both
    - dropped: cue_process_tool.process_chain
      reason: "parent_process is the primary cue (hint 3) — its parent_child.parent_process_legitimacy + cue_parent_process coverage subsumes the child-side process_chain question."
      kept: template:parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.mechanism_decode
      reason: "Office parent is not a tool whose own command line decodes to an operation; the meaningful parent question is what document/macro drove the spawn. Covered by parent_child.parent_process_legitimacy and attack:T1204.002.delivery_vector, which read the parent's command line for the document path."
      kept: template:parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.follow_on + cue_parent_process.clustering
      reason: "Children-of-this-parent and parent-associated activity are covered by parent_child.sibling_processes (ParentProcessGuid-scoped, exact parent instance). The cue versions scope by ParentName on the host and would re-derive the same Office-parent children less precisely."
      kept: template:parent_child.sibling_processes
    - dropped: cue_process_tool.baseline + cue_parent_process.baseline + cue_parent_process.scope + cue_process_tool.mechanism_decode
      reason: "Image/parent-name host baselines and the per-binary mechanism_decode depend on a single constraining child binary; this rule matches ~40 child binaries OR an arbitrary staging-path image, so a %Image%-keyed baseline is not meaningful per-binary. Host/fleet pairing baselines are covered by the user_actor baseline_svc/clustering_svc pair and initial_access.campaign_scope."
      kept: template:cue_user_actor.baseline_svc, template:cue_user_actor.clustering_svc, template:initial_access.campaign_scope
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: scheduled_task.task_configuration (hint 1). This is not a schtasks-specific rule (schtasks is one of ~40 possible children), so neither the schtasks task_configuration nor the generic process_tool mechanism_decode is load-bearing. The child's operation is decoded by attack:T1218.command_analysis, which reads the full child command line for URLs, scriptlet/DLL references, and proxy-execution flags across all possible child binaries."
    - template: obfuscation.encoded_payload_decode
      reason: "replaced_by: powershell.encoded_command_decode (hint 2). Both are skipped: the rule matches ~40 child binaries, so neither a powershell-specific nor a certutil-specific decode question fits the general case. attack:T1218.command_analysis covers decoding the child's arguments regardless of which interpreter or LOLBIN fired."
    - template: powershell.encoded_command_decode
      reason: "Confirmed set powershell (binary powershell.exe is one child option). The rule is not powershell-specific - powershell is one of ~40 possible children and the path branch needs no interpreter at all. A powershell-only encoded-command question would be empty for the wmic/regsvr32/rundll32/path-branch fires. Command decoding is handled generically by attack:T1218.command_analysis."
    - template: powershell.script_block_logging
      reason: "Confirmed set powershell. Same rationale: powershell is one of many possible children; 4104 script-block logging applies only to powershell fires, not the regsvr32/mshta/wmic/path-branch cases that dominate this rule's match space."
    - template: powershell.powershell_security_bypass
      reason: "Confirmed set powershell. Powershell-specific bypass flags do not apply to the non-powershell child binaries this rule predominantly matches."
    - template: scheduled_task.task_configuration
      reason: "Confirmed set scheduled_task (binary schtasks.exe is one child option). schtasks is one of ~40 possible children; a task_name/trigger question is empty unless the specific child happens to be schtasks. Persistence follow-up after a document hand-off, when schtasks is the child, is reachable from the generic child command_analysis question."
    - template: scheduled_task.task_trigger_and_timing
      reason: "Confirmed set scheduled_task. Same rationale as task_configuration - schtasks-specific timing question does not generalize across the rule's child set."
    - template: scheduled_task.task_still_present
      reason: "Confirmed set scheduled_task. schtasks-specific; does not generalize across the rule's child set."
    - template: download_tool.download_success_verification
      reason: "Confirmed set download_tool (binary bitsadmin.exe is one child option). bitsadmin is one of ~40 possible children. Download-destination verification is covered generically by attack:T1204.002.payload_on_disk (file_event to user-writable staging paths) without assuming the child is bitsadmin."
    - template: download_tool.payload_analysis
      reason: "Confirmed set download_tool. Payload retrieval/hash lookup is covered by attack:T1204.002.payload_on_disk, which projects Hashes from file_event writes to staging paths. The bitsadmin-specific framing is not load-bearing across the child set."
    - template: download_tool.directory_activity
      reason: "Confirmed set download_tool. Directory-level file activity around the spawn is covered by attack:T1204.002.payload_on_disk's user-writable-path file_event query. A bitsadmin-specific directory question does not generalize."
    - template: initial_access.delivery_vector
      reason: "Realized as attack:T1204.002.delivery_vector with the same intent (identify the document/email that drove the Office parent). Authored as an attack-sourced question to read the parent command line for the document path."
    - template: initial_access.application_patch_status
      reason: "Recommended-tier. Office patch status matters mainly for the exploit (EQNEDT32/Follina) branch; for the macro branch it is not load-bearing. Trimmed to stay within the 14-18 target; the EQNEDT32 exploit angle is flagged in parent_process_legitimacy context instead."
    - template: persistence_scope.process_based_persistence
      reason: "Confirmed set persistence_scope (binary bitsadmin.exe). This rule detects an Office-to-child execution hand-off (initial access / execution), not persistence installation. Whether persistence followed is reachable from sibling_processes and the host precursor question. Trimmed to stay within the 14-18 target."
    - template: persistence_scope.file_based_persistence
      reason: "Confirmed set persistence_scope. File-drop persistence to Startup/Run paths is orthogonal to the document-detonation hand-off this rule detects; the payload_on_disk question already covers user-writable file writes. Trimmed to stay within the 14-18 target."
    - template: universal.evidence_preservation
      reason: "Realized as attack:T1204.002.payload_on_disk (hint 4), which uses file_event scoped to the rule's user-writable staging paths (%file_paths% derived from CommandLine) and projects Hashes for preservation/lookup. The attack-sourced version also carries the path-branch corroboration the generic template lacks."
