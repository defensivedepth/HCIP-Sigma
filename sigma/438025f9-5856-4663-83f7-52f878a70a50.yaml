      notes: "Named in the command_analysis context (regsvr32 /i with remote .sct/.ocx) and in the module_load question context. The image_load query keys on ProcessGuid + signing status rather than literal extensions, since the scriptlet may be referenced by URL."
    - element: CommandLineRegex
