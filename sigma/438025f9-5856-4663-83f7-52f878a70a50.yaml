- source: template:initial_access.campaign_scope
  question: Did this same detection fire on other hosts or for other users, indicating
    a wider delivery campaign?
  context: Phishing campaigns rarely target a single user. If one employee opened a
    document that spawned a suspicious child, others likely received the same file.
    Correlating this detection across hosts and users shows campaign breadth and
    identifies additional systems that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, defense tampering, or
    other execution - may reveal the stages that preceded the document detonation and
    help reconstruct the timeline. A document hand-off is often one step in a
    sequence, so prior alerts give context for what followed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
