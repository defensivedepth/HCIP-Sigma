      disposition: query_injection
      target_question: Q12
      notes: "The rule's own selection_child_processes carries this list. Injected the representative subset into the cue_user_actor.baseline child filter so the user-history baseline is scoped to the rule's LOLBIN/staging-path pattern rather than all process activity."
    - element: HighRiskParents
      dimension: tuning_parameter
