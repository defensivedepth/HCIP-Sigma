  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1059.001) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The rule fires purely on DSInternals cmdlet names appearing in the command line, and DSInternals is a
        managed PowerShell module whose abuse is fully described by which cmdlet ran and against what target —
        evidence carried by process_creation command lines and 4104 script-block content. An image_load sweep of
        amsi.dll / .NET assemblies on the launching process returns volume without isolating the cmdlet-level
        action this rule detects, and the LoadedModuleList tuning angle is already addressed by the script-block
        logging question (Q15) which surfaces the deobfuscated assembly/cmdlet content directly. No compensating
        attack:T1059.001.image_load question authored.
