  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: defense_tampering.what_was_disabled (hint 1). Phase 2 mechanism decode is provided by what_was_disabled, which directs the analyst to identify which Windows feature was disabled and whether it is security/recovery-relevant."
    - template: persistence_scope.process_based_persistence
      reason: "recommended priority; cascaded from defense_tampering (hint 2). This rule detects a feature-disable defense-evasion primitive, not persistence installation. Disabling a Windows feature does not establish a foothold. Trimmed to stay within the 14-18 target."
    - template: persistence_scope.file_based_persistence
      reason: "recommended priority; cascaded from defense_tampering (hint 2). File-drop persistence is orthogonal to disabling a Windows feature via DISM. Trimmed to stay within the 14-18 target."
    - template: universal.endpoint_protection_health
      reason: "recommended priority. The defense_tampering set is confirmed for this rule (T1562.001), and its other_tampering_activity question is the more specific superseding host-tamper sweep; the generic endpoint_protection_health sweep would duplicate that coverage. Per the template's own notes_to_llm, it is safe to drop when defense_tampering is confirmed. Trimmed to stay within the 14-18 target."
  reflection_overrides: []
  hint_dispositions:
    - hint: "defense_tampering → persistence_scope cascade activated"
      disposition: declined
      reason: >-
        The cascade made the two persistence_scope templates available, but both are
        recommended-tier and not load-bearing for this rule. DISM /Online
        /Disable-Feature suppresses or removes a Windows feature (defense evasion /
        inhibit recovery); it does not install persistence. process_based_persistence
        and file_based_persistence are recorded as skipped_templates with specific
        reasons. The defense_tampering set (what_was_disabled, protection_status,
        activity_after_tampering, other_tampering_activity) is the load-bearing
        context here and is fully included.
    - hint: "logsource 'registry_set' (recommended by techniques: T1562.001) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        The registry_set analytic for T1562.001 targets direct edits to Sysmon /
        Defender registry keys (Sysmon EID 13/14) as a distinct disable mechanism.
        This rule's detection is strictly process_creation and fires only on DISM
        /Online /Disable-Feature, which operates on Windows optional features in the
        running image, not on those registry keys — DISM feature-disable does not
        write the Sysmon/Defender registry values the registry_set analytic hunts.
        The investigation is therefore genuinely constrained to process_creation
        evidence (which feature, which parent, follow-on activity). other_tampering
        _activity (Q8) already surfaces reg.exe-driven tampering on the host if a
        separate registry edit accompanied the disable. No compensating
        attack:T1562.001.registry_set question authored.
