name: Suspicious CertReq Command to Download
id: d732c9ba-2d90-4b0a-af1d-da03f8f65a01
description: |
  Detects certreq.exe invoked with -Post, -config, and an http argument together, the
  command structure that sends a local file to a remote URL over HTTP POST and saves the
  response to disk. certreq is a built-in certificate-request utility, so this is a
  living-off-the-land download or upload path that does not require dropping a new
  binary. The rule fires only when the certreq image (or original filename), the -Post
  flag, the -config flag, and an http string are all present, so investigation should
  confirm the full command, determine the remote URL and saved file, and establish
  whether the user, host, and parent process make this a legitimate certificate
  operation or an ingress tool transfer.
type: detection
detection_id: 4480827a-9799-4232-b2c4-ccc6c4e9e12b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show certreq using -Post and -config together with an http URL?
  context: Confirm the alert is a true positive by reviewing the exact command against the rule's
    criteria, which require the certreq image or original filename plus the -Post flag, the -config
    flag, and an http string all present in the same command. Read the full command and note the
    remote URL and the local file path being sent or saved.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to request or retrieve certificates via command-line tooling?
  context: Legitimate certificate enrollment from certreq is normally driven by IT or PKI operators,
    enrollment scripts, or specific application servers. A user or host with no certificate-management
    role running certreq with a POST to a remote URL is the case worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this certreq command do? Decode the URL, the file sent, and the response file.
  context: The -Post -config form sends the file named as the penultimate argument to the URL given to
    -config over HTTP POST and writes the response to the final argument. Decode the full command to
    extract the destination URL, the local file being uploaded, and the txt or other file the response
    is written to, since that file is the downloaded payload or exfiltration receipt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|windash:
          - '-Post'
          - '-config'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned certreq and is that parent chain expected?
  context: The parent process reveals how certreq was invoked. Enrollment automation, management consoles,
    or login scripts are predictable parents; a script host, Office application, or a shell launched from
    a download or staging directory points toward abuse rather than routine certificate work.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1105.network_connection
  question: What external destination did certreq connect to, and is that address internal or external infrastructure?
  context: The transfer stage of an ingress tool transfer is the outbound connection certreq opens to the
    URL passed to -config. Resolve the destination address and judge whether it is an internal certificate
    authority, an allowed external service, or an unknown external host. External or unfamiliar infrastructure
    on a certificate-utility connection is the strongest signal that this is a download or upload rather than
    enrollment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
      - Initiated
- source: template:universal.evidence_preservation
  question: Is the response file certreq saved still on disk for analysis?
  context: The final argument of the -Post command is the file the HTTP response is written to. If the
    download succeeded, that file holds the retrieved content. Confirming it still exists on disk enables
    a hash lookup, content review, or sandbox submission.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.download_success_verification
  question: Did the file write actually occur at the saved-response path?
  context: A certreq POST command does not guarantee a successful transfer. Network errors, blocked URLs,
    or security controls may have prevented it. A file-creation event at the response path by certreq
    establishes that the operation progressed past the request stage.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: Can you retrieve and analyze the saved file from a safe environment?
  context: If the response or downloaded file is still on disk, submitting its hash to threat intelligence
    or detonating it in a sandbox reveals whether it is a known malicious payload, a legitimate certificate
    response, or something novel that needs deeper review.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the directory where certreq wrote its output?
  context: Operators often stage multiple files in one directory, and a downloaded payload may trigger
    further writes such as extraction or follow-on downloads. Examining directory-level file activity
    reveals the broader scope of the transfer.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      filter_self:
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection and not filter_self
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.follow_on
  question: What child processes did certreq spawn afterward?
  context: A retrieved payload is often executed shortly after download. Processes spawned by certreq, or a
    shell or script host launched right after the transfer, reveal whether the operation moved from delivery
    into execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run certreq?
  context: certreq is uncommon on most endpoints outside PKI and IT-managed systems. Zero or very low
    historical counts on this host indicate first-time or rare execution and raise the weight of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this certreq pattern, what parents and users normally drive
    it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the parent and user distribution
    reflects how this specific POST-to-URL certreq pattern has run here before. A new parent process, an
    unexpected account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certreq.exe
      - OriginalFileName: CertReq.exe
      selection_cli_flag_post:
        CommandLine|contains|windash: -Post
      selection_cli_flag_config:
        CommandLine|contains|windash: -config
      selection_cli_http:
        CommandLine|contains: http
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this certreq pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    specific certreq POST pattern. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certreq.exe
      - OriginalFileName: CertReq.exe
      selection_cli_flag_post:
        CommandLine|contains|windash: -Post
      selection_cli_flag_config:
        CommandLine|contains|windash: -config
      selection_cli_http:
        CommandLine|contains: http
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certreq.exe
      - OriginalFileName: CertReq.exe
      selection_cli_flag_post:
        CommandLine|contains|windash: -Post
      selection_cli_flag_config:
        CommandLine|contains|windash: -config
      selection_cli_http:
        CommandLine|contains: http
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certreq.exe
      - OriginalFileName: CertReq.exe
      selection_cli_flag_post:
        CommandLine|contains|windash: -Post
      selection_cli_flag_config:
        CommandLine|contains|windash: -config
      selection_cli_http:
        CommandLine|contains: http
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity on multiple
    endpoints. If the same user triggered similar activity elsewhere, the scope of the operation may be larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certreq.exe
      - OriginalFileName: CertReq.exe
      selection_cli_flag_post:
        CommandLine|contains|windash: -Post
      selection_cli_flag_config:
        CommandLine|contains|windash: -config
      selection_cli_http:
        CommandLine|contains: http
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Activity around this event reveals what led to it and what
    followed, and whether it is part of a larger sequence such as reconnaissance, staging, or follow-on
    execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
