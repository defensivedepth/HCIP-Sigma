  mutable_dispositions:
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "http://127.0.0.1, %{(IRM $_)}, Invoke (rule's |contains|all tokens)"
      disposition: query_injection
      target_question: Q11
      notes: "The rule's three CommandLine tokens are injected as CommandLine|contains|all into the user_actor baseline/baseline_svc/clustering_svc queries (Q11, Q12, Q14) and embedded verbatim in the REFLECTED baseline_deviation/scope queries (Q17, Q18). The decode question (Q4) directs the analyst to the loopback URL and reflective Invoke."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "abnormal parents (Office, mshta, script hosts) - rationale, no fixed list in analytic"
      disposition: new_question
      target_question: Q3
      notes: "Realized as cue_process_tool.process_chain (Q3), which retrieves the parent and asks whether the chain is expected; context names the abnormal-parent classes (mshta.exe, wscript/cscript, Office)."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "off-hours / non-maintenance window - rationale only"
      disposition: context
      target_question: Q10
      notes: "No fixed threshold in the analytic. Realized as the +1h post-launch activity window in activity_after_tampering (Q10) and the +/-15m host-clustering window (Q15)."
    - element: LoadedModuleList
      dimension: tuning_parameter
      specific_values: ".NET/CLR assemblies (rare/never-before-seen) - rationale; concrete CLR module list authored from the reflective-load behavior"
      disposition: query_injection
      target_question: Q6
      notes: "Realized as the attack:T1059.001.image_load question (Q6) with a concrete ImageLoaded|endswith list of the CLR + PowerShell automation assemblies a reflective in-memory load pulls in."
    - element: ScriptBlockLengthThreshold
      dimension: tuning_parameter
      specific_values: "Event 4104 script-block length - rationale only"
      disposition: context
      target_question: Q7
      notes: "No concrete threshold. Realized as the script_block_logging question (Q7), which retrieves 4104 ScriptBlockText as the deobfuscated ground truth."
    - element: ProcessWhitelist
      dimension: process_identification
      specific_values: "authorized admin tools - rationale only"
      disposition: context
      target_question: Q9
      notes: "T1562 tuning rationale; realized as the tamper-class binary/command list in defense_tampering.other_tampering_activity (Q9), which surfaces stop/disable actions against security controls while excluding the cradle event itself."
    - element: ServiceNamePatterns
      dimension: tuning_parameter
      specific_values: "security-critical service names - rationale only"
      disposition: context
      target_question: Q9
      notes: "T1562.001 tuning rationale; the tamper sweep (Q9) and the bypass sweep (Q8) carry the Defender/AV control names and Set-MpPreference patterns that constitute the security-critical-service dimension."
  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (Q11 subject-pivot, Q12 launch-mechanism-pivot). Image-pivot adapted to the rule's CommandLine|contains|all loopback IRM tokens per the powershell.exe-too-common hint."
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (Q13 subject-pivot, Q14 launch-mechanism-pivot). clustering_svc adapted to the rule's CommandLine|contains|all loopback IRM tokens per the powershell.exe-too-common hint."
      kept: both
    - dropped: cue_process_tool.baseline
      reason: "generic Image|endswith host baseline keyed on powershell.exe is too common for Image-based scoping (hint 1) and is subsumed by the REFLECTED host-pattern question (baseline_deviation, Q17) which scopes to the rule's actual loopback IRM firing pattern."
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.clustering
      reason: "Image-only host aggregation subsumed by cue_host_context.clustering (Q15), which projects Image+ParentImage and surfaces novel parent-child pairs."
      kept: cue_host_context.clustering
    - dropped: cue_process_tool.follow_on
      reason: "follow_on scopes children by ParentImage|endswith %Image% = powershell.exe, which is too common for Image-based scoping (hint 1). Post-launch host activity is covered more directly by defense_tampering.activity_after_tampering (Q10, +1h host scope)."
      kept: defense_tampering.activity_after_tampering
    - dropped: cue_network_endpoint.mechanism_decode + cue_network_endpoint.baseline
      reason: "the rule's destination is http://127.0.0.1 (loopback), so a generic external-destination reputation/baseline query does not fit. The derived network cue (hint 2) is realized as attack:T1059.001.loopback_fetch (Q5), which pivots from the loopback listener port to the upstream destination."
      kept: attack:T1059.001.loopback_fetch
    - dropped: universal.endpoint_protection_health
      reason: "defense_tampering technique set is confirmed for this rule; its other_tampering_activity sweep (Q9) is the more specific tamper-precursor question and supersedes the generic universal endpoint-protection sweep per that template's own drop guidance."
      kept: defense_tampering.other_tampering_activity
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: defense_tampering.what_was_disabled (hint 3). For a PowerShell execution rule the more specific Phase 2 decode is powershell.encoded_command_decode (Q4), which directs the analyst to the loopback URL and reflective Invoke. The defense_tampering decode (what_was_disabled) is not applicable — see below."
    - template: defense_tampering.what_was_disabled
      reason: "KEEP_EXACT redisplay of the triggering ProcessGuid asking which security control was disabled. The alert's CommandLine is the download cradle, not a Set-MpPreference / wevtutil tamper command, so there is no control-disable in the trigger event to decode. Phase 2 decode is the PowerShell cradle decode (Q4). The tamper-as-companion angle is covered by other_tampering_activity (Q9), which sweeps OTHER host events."
    - template: defense_tampering.protection_status
      reason: "Checks the current status of the specific control disabled by the alert. The alert disables no control directly (it is an execution cradle), so there is no targeted control whose restore-status to verify. Covered indirectly by the tamper sweep (Q9) if a companion disable is found."
    - template: obfuscation.encoded_payload_decode
      reason: "replaced_by: powershell.encoded_command_decode (hint 4). The PowerShell-specific decode (Q4) is more specific for a powershell.exe cradle."
    - template: persistence_scope.process_based_persistence
      reason: "recommended priority; cascaded from defense_tampering (hint 5). The rule detects an in-memory execution cradle (execution + defense evasion), not persistence installation. No process-based persistence is implied by the loopback IRM one-liner. Trimmed to stay within the 14-18 target."
    - template: persistence_scope.file_based_persistence
      reason: "recommended priority; cascaded from defense_tampering (hint 5). File-drop persistence is orthogonal to a fileless in-memory PowerShell cradle. Trimmed to stay within the 14-18 target."
