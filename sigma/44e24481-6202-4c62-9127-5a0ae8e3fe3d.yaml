  hint_dispositions:
    - hint: "defense_tampering → persistence_scope cascade activated"
      disposition: declined
      reason: >-
        The cascade made the two persistence_scope templates available, but both are
        recommended-tier and not load-bearing for this rule. The loopback IRM cradle
        fetches and reflectively executes a module in memory; it does not install
        persistence. process_based_persistence and file_based_persistence are recorded
        as skipped_templates with specific reasons. The execution-focused context
        (encoded_command_decode, loopback_fetch, image_load, script_block_logging,
        bypass and tamper sweeps, post-launch activity) is the load-bearing set here
        and is fully included.
    - hint: >-
        logsource 'registry_set' (recommended by techniques: T1562.001) is not covered
        — pull in cue_registry_key.* or author a custom question with `category: registry_set`
      disposition: declined
      reason: >-
        The rule's detection is constrained to process_creation: powershell.exe with a
        loopback IRM cradle command line. It fires on execution, not on a registry
        modification, and contains no registry field. T1562.001 registry_set analytics
        target Sysmon-key / security-tool registry tampering, which this rule does not
        detect. The defense-evasion companion behavior actually associated with this
        cradle pattern (disabling Defender, clearing logs) is surfaced via
        process_creation in the bypass sweep (Q8) and the tamper sweep (Q9). This is
        the AGENTS.md justified-decline case: the rule's detection logic genuinely
        constrains analysis to a different logsource.
