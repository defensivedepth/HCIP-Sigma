    - stage: 2
      label: cradle_decode
      description: "Decode the cradle: which loopback URL is fetched via Invoke-RestMethod and what the piped content reflectively executes in memory"
      mapped_to: Q4
      source: template:powershell.encoded_command_decode
    - stage: 3
      label: remote_fetch
      description: "The cradle relays a module through a loopback listener; identify the listening process and upstream destination"
      mapped_to: Q5
