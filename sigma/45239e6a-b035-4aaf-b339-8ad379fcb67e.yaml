name: Process Proxy Execution Via Squirrel.EXE
id: 04170b46-1d5d-4409-9433-bf747336e1ac
description: |
  Detects squirrel.exe or update.exe - the per-user updater shipped with many
  Electron-based applications such as Slack, Teams, Discord, and GitHub Desktop -
  invoked with a process-proxy command-line flag (--processStart,
  --processStartAndWait, or --createShortcut). The rule fires when the image ends
  in \squirrel.exe or \update.exe AND the command line contains one of those flags,
  while excluding the known-benign self-update invocations of a few specific apps.
  Because the updater is a signed, allowlisted binary, an actor can use it to launch
  an attacker-supplied executable staged in the app's per-user folder (--processStart),
  drop a shortcut pointing at an arbitrary target (--createShortcut), or fetch and
  run a remote payload, with the updater becoming the parent process and breaking
  parent/child expectations. Many of these invocations are legitimate updater
  activity, so the investigation should confirm which flag fired, identify what the
  proxy launched, check the parent chain and the launched child, and determine
  whether the same pattern appears elsewhere on the host or fleet.
type: detection
detection_id: 45239e6a-b035-4aaf-b339-8ad379fcb67e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did squirrel.exe or update.exe run with a process-proxy flag
    (--processStart, --processStartAndWait, or --createShortcut), matching what this
    rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the image ends in \squirrel.exe or \update.exe AND the command
    line contains --processStart, --processStartAndWait, or --createShortcut. Read the
    exact command line and note which flag is present and what target follows it, since
    the flag determines whether this proxied a process launch or wrote a shortcut.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run an Electron application updater with
    a process-proxy flag?
  context: Genuine updater self-maintenance and shortcut creation are routine on
    workstations that have Slack, Teams, Discord, or similar apps installed, and are
    usually triggered by the app itself or by an interactive user. An account or host
    with no such application, or a server with no interactive desktop use, running the
    updater with a proxy flag is more notable than a developer workstation doing it
    during normal app updates.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1218.command_analysis
  question: Which proxy flag was used and what target executable, shortcut, or URL
    follows it on the command line?
  context: The flag and its argument define the abuse. --processStart and
    --processStartAndWait launch an executable staged in the app's per-user
    app-<version> folder, with the updater becoming the parent process.
    --createShortcut writes a .lnk to an attacker-chosen location pointing at an
    attacker-chosen target. Some builds also accept --download / --update to fetch and
    run a remote package. Read the full command line to identify exactly what was
    launched, written, or retrieved, and whether the target path or URL is expected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.process_identification
  question: Which exact image and path carried the proxy flag, and is that updater in
    an expected per-user application install location?
  context: The rule constrains the image to \squirrel.exe or \update.exe but not its
    directory. Legitimate updaters live under a per-user app folder such as
    %USERPROFILE%\AppData\Local\<app>\. An updater binary running from a temp
    directory, a download folder, or a location with no matching installed application
    is a different finding than the same binary running from its normal install path,
    because the signed name can be relocated to inherit a trusted-parent context.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CurrentDirectory
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned the updater, and is that parent chain expected for an
    application update?
  context: The parent process reveals how the updater was invoked. A genuine update is
    usually launched by the application itself, by explorer.exe for a user action, or
    by a scheduled updater task. An unexpected parent such as a script host, mshta.exe,
    cmd.exe, or an Office application points to the updater being driven as a proxy
    rather than performing its own maintenance.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.proxied_child
  question: What child processes did the updater spawn after the proxy flag fired, and
    are those children expected updater activity?
  context: With --processStart the updater becomes the parent of whatever executable it
    launches, which is the core of the abuse - the real payload runs under the trusted
    updater rather than under the app or a shell. Examine the processes parented by the
    updater on this host after the launch. A staged executable from an app-<version>
    folder, cmd.exe, powershell.exe, or any unexpected child indicates proxied
    execution; normal updater children are limited and predictable.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- source: attack:T1218.network_retrieval
  question: Did the host make outbound network connections from the updater or its
    children around the time of the alert that could indicate a remote payload fetch?
  context: Some updater builds accept flags that retrieve and run a remote package
    (--download / --update pulling a RELEASES manifest and .nupkg from a supplied URL),
    turning the signed binary into an ingress-and-execute primitive. Outbound
    connections from the updater or a child it spawned, especially to a non-vendor or
    unfamiliar destination, point to remote retrieval rather than a local app update.
    If network telemetry is not collected for this host, treat zero results as a
    visibility gap rather than evidence nothing was fetched.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1218.module_load
  question: What modules did the updater load after the proxy flag fired, and do any
    come from a user-writable or unexpected directory?
  context: System binary proxy execution often pairs the trusted launcher with a payload
    loaded from a non-standard location. Image-load events for the updater process show
    which DLLs and assemblies it pulled in. Modules loaded from a per-user app-<version>
    folder, a temp directory, or any user-writable path, rather than the normal app and
    system directories, indicate the signed binary was used to host attacker-supplied
    code. If image-load telemetry is not collected in this environment, treat zero
    results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      condition: selection
    fields:
      - dll.path
      - dll.name
      - dll.code_signature.subject_name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      selection_exec:
        CommandLine|contains:
        - --processStart
        - --processStartAndWait
        - --createShortcut
      filter_optional_discord:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Discord\Update.exe
        - Discord.exe
        CommandLine|contains:
        - --createShortcut
        - --processStart
      filter_optional_github_desktop:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\GitHubDesktop\Update.exe
        - GitHubDesktop.exe
        CommandLine|contains:
        - --createShortcut
        - --processStartAndWait
      filter_optional_teams:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Microsoft\Teams\Update.exe
        - Teams.exe
        CommandLine|contains:
        - --processStart
        - --createShortcut
      filter_optional_yammer:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\yammerdesktop\Update.exe
        - Yammer.exe
        CommandLine|contains:
        - --processStart
        - --createShortcut
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      selection_exec:
        CommandLine|contains:
        - --processStart
        - --processStartAndWait
        - --createShortcut
      filter_optional_discord:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Discord\Update.exe
        - Discord.exe
        CommandLine|contains:
        - --createShortcut
        - --processStart
      filter_optional_github_desktop:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\GitHubDesktop\Update.exe
        - GitHubDesktop.exe
        CommandLine|contains:
        - --createShortcut
        - --processStartAndWait
      filter_optional_teams:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Microsoft\Teams\Update.exe
        - Teams.exe
        CommandLine|contains:
        - --processStart
        - --createShortcut
      filter_optional_yammer:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\yammerdesktop\Update.exe
        - Yammer.exe
        CommandLine|contains:
        - --processStart
        - --createShortcut
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the acting account's activity across all hosts reveals whether the
    proxied execution was a single event or part of activity spanning multiple
    endpoints. If the same user produced similar activity on other hosts in the same
    window, the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      selection_exec:
        CommandLine|contains:
        - --processStart
        - --processStartAndWait
        - --createShortcut
      filter_optional_discord:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Discord\Update.exe
        - Discord.exe
        CommandLine|contains:
        - --createShortcut
        - --processStart
      filter_optional_github_desktop:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\GitHubDesktop\Update.exe
        - GitHubDesktop.exe
        CommandLine|contains:
        - --createShortcut
        - --processStartAndWait
      filter_optional_teams:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Microsoft\Teams\Update.exe
        - Teams.exe
        CommandLine|contains:
        - --processStart
        - --createShortcut
      filter_optional_yammer:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\yammerdesktop\Update.exe
        - Yammer.exe
        CommandLine|contains:
        - --processStart
        - --createShortcut
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    proxied launch reveals what led to it and what followed - the parent that staged the
    updater, reconnaissance, or follow-on execution the proxy was meant to carry. Novel
    parent-child pairs at low counts are what to scan for against the high-count noise of
    routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, payload staging, or
    other defense-evasion activity - may reveal the attack stages that preceded the
    proxied execution and help reconstruct the full timeline. Proxy execution through a
    trusted binary is often one step in a sequence, so prior alerts give the context for
    why the updater was driven this way.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline_deviation
