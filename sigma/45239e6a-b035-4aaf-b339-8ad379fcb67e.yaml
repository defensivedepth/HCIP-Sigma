        - :\Users\
        - \AppData\Local\Discord\Update.exe
        - Discord.exe
        CommandLine|contains:
        - --createShortcut
        - --processStart
      filter_optional_github_desktop:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\GitHubDesktop\Update.exe
        - GitHubDesktop.exe
        CommandLine|contains:
        - --createShortcut
        - --processStartAndWait
      filter_optional_teams:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Microsoft\Teams\Update.exe
        - Teams.exe
        CommandLine|contains:
        - --processStart
        - --createShortcut
      filter_optional_yammer:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\yammerdesktop\Update.exe
        - Yammer.exe
        CommandLine|contains:
        - --processStart
        - --createShortcut
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's Squirrel proxy pattern in the past week,
    and does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the Squirrel proxy firing pattern rather than generic
    updater activity. Many hosts firing the same pattern points to an application update
    wave or a scripted deployment that uses the flag by design; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      selection_exec:
        CommandLine|contains:
        - --processStart
        - --processStartAndWait
        - --createShortcut
      filter_optional_discord:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Discord\Update.exe
        - Discord.exe
        CommandLine|contains:
        - --createShortcut
        - --processStart
      filter_optional_github_desktop:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\GitHubDesktop\Update.exe
        - GitHubDesktop.exe
        CommandLine|contains:
        - --createShortcut
        - --processStartAndWait
      filter_optional_teams:
        CommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Microsoft\Teams\Update.exe
        - Teams.exe
        CommandLine|contains:
        - --processStart
        - --createShortcut
      filter_optional_yammer:
