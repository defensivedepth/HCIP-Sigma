    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate updater activity can match the rule's flags. This query
    mirrors the rule's selection structure scoped to this host, so the resulting parent
    and user distribution reflects how this specific firing pattern has historically run
    here, not generic updater usage. A new parent process, an unexpected account, or a
    first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      selection_exec:
        CommandLine|contains:
        - --processStart
        - --processStartAndWait
        - --createShortcut
      filter_optional_discord:
