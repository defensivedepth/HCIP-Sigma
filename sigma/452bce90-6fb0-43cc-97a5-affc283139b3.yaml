_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1562.001
      name: Disable or Modify Tools
      role: primary
    - id: T1562
      name: Impair Defenses
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: registry_disable_invocation
      description: "reg.exe writes a Windows Defender policy registry value that either sets a protection feature to 0 or sets a disable flag to 1 — the act the rule detects"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: control_identified
      description: "The specific Defender control and the written value/data are identified, confirming which protection was weakened"
      mapped_to: Q3
      source: template:defense_tampering.what_was_disabled
    - stage: 3
      label: followon_enabled
      description: "Correlate process creation after the registry write with the activity the disabled Defender control was meant to permit"
      mapped_to: Q8
      source: template:defense_tampering.activity_after_tampering
  dimension_coverage:
    - dimension: process_identification
      technique: T1562
      covered_by: Q5
      source: template:lolbin.renamed_binary_check
      coverage_type: direct
    - dimension: time_correlation
      technique: T1562.001
      covered_by: Q8
      source: template:defense_tampering.activity_after_tampering
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1562.001
      covered_by: Q9
      source: template:defense_tampering.other_tampering_activity
      coverage_type: direct
    - dimension: user_context
      technique: T1562.001
      covered_by: Q2
      source: template:universal.host_user_context
      coverage_type: direct
  mutable_dispositions:
    - element: ProcessWhitelist
      dimension: process_identification
      specific_values: "rationale only"
      disposition: context
      target_question: Q5
      notes: "Tuning rationale for excluding authorized admin tools; no concrete values in the analytic. Realized as the reg.exe path/identity judgment in lolbin.renamed_binary_check, which asks whether the executed reg.exe is the genuine system binary from an expected path."
    - element: ProcessNameExclusions
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q2
      notes: "Rationale for excluding expected administrative tools/processes; no concrete values in the analytic. Realized as the user/host expectation judgment in universal.host_user_context (is this account expected to change Defender settings)."
    - element: ServiceNames
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q9
      notes: "Customizable security-service name list; no concrete values in the analytic. Realized as the tamper-class binary and command list in defense_tampering.other_tampering_activity, which surfaces stop/disable actions against security services and other controls."
    - element: ServiceNamePatterns
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
