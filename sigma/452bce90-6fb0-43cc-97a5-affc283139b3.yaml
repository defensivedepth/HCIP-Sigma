    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_root_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_root_path:
        CommandLine|contains:
        - SOFTWARE\Microsoft\Windows Defender\
        - SOFTWARE\Policies\Microsoft\Windows Defender Security Center
        - SOFTWARE\Policies\Microsoft\Windows Defender\
      selection_dword_0:
        CommandLine|contains|all:
        - ' add '
        - d 0
        CommandLine|contains:
        - DisallowExploitProtectionOverride
        - EnableControlledFolderAccess
        - MpEnablePus
        - PUAProtection
        - SpynetReporting
        - SubmitSamplesConsent
        - TamperProtection
      selection_dword_1:
        CommandLine|contains|all:
        - ' add '
        - d 1
        CommandLine|contains:
        - DisableAccess
        - DisableAntiSpyware
        - DisableAntiSpywareRealtimeProtection
        - DisableAntiVirus
        - DisableAntiVirusSignatures
        - DisableArchiveScanning
        - DisableBehaviorMonitoring
        - DisableBlockAtFirstSeen
        - DisableCloudProtection
        - DisableConfig
        - DisableEnhancedNotifications
        - DisableIntrusionPreventionSystem
        - DisableIOAVProtection
        - DisableNetworkProtection
        - DisableOnAccessProtection
        - DisablePrivacyMode
        - DisableRealtimeMonitoring
        - DisableRoutinelyTakingAction
        - DisableScanOnRealtimeEnable
        - DisableScriptScanning
        - DisableSecurityCenter
        - Notification_Suppress
        - SignatureDisableUpdateOnStartupWithoutEngine
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_root_* and 1 of selection_dword_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    Defender registry write reveals what led to it and what followed, such as the parent
    that staged the process, reconnaissance, or follow-on execution the disabled control
    was meant to cover. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as reconnaissance, credential
    access, or other defense tampering, may reveal the attack stages that preceded the
    Defender registry change and help reconstruct the full timeline. Disabling
    protection is often one step in a sequence, so prior alerts give the context for why
    Defender was weakened.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
