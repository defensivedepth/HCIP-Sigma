name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
id: 3250e48a-1b19-4852-b640-3d7051e4151b
description: |
  Detects Active Directory enumeration performed with the AdFind command-line
  tool's high-signal flag patterns. The rule fires when a process command line
  contains EITHER a set of password-policy attribute names (lockoutduration,
  lockoutthreshold, lockoutobservationwindow, maxpwdage, minpwdage, minpwdlength,
  pwdhistorylength, pwdproperties), OR the privileged-object shortcut
  -sc admincountdmp, OR the Exchange address shortcut -sc exchaddresses - any one
  branch is enough. AdFind is a signed legitimate AD query tool that IT staff use
  for administration, but the same flag patterns are a recurring step in
  ransomware-affiliate reconnaissance to map password policy, locate privileged
  (adminCount=1) accounts, and dump Exchange addressing before lateral movement.
  Because the rule constrains only the command line, the binary may be renamed.
  The investigation should determine which branch fired, what AD objects were
  queried, which executable carried the flags, whether the acting account and host
  are expected to run AD tooling, and whether the enumeration was a one-off or part
  of a wider recon burst.
type: detection
detection_id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain AdFind password-policy attributes, -sc admincountdmp,
    or -sc exchaddresses - matching one of the branches this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when a command line matches any one of three independent branches -
    a group of password-policy attribute names (lockoutduration, lockoutthreshold,
    lockoutobservationwindow, maxpwdage, minpwdage, minpwdlength, pwdhistorylength,
    pwdproperties), the -sc admincountdmp shortcut, or the -sc exchaddresses shortcut.
    Read the exact command line and note which branch matched, because the branch
    determines what the operator was after - password policy reconnaissance, hunting
    privileged adminCount=1 accounts, or dumping Exchange addressing - and which
    downstream questions carry the most weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.tool_authorization
  question: Is the executable that ran these AdFind queries an approved administrative
    tool on this host?
  context: AdFind is a free third-party AD query utility, widely flagged as a PUA
    because it is signed and legitimate yet heavily used by intruders for AD
    reconnaissance. Some organizations sanction it for directory administration and
    others ban it outright. Determine whether this binary - by whatever name it ran
    under - is on the approved software list for this host, independent of its
    reputation. An unsanctioned AD enumeration tool on an endpoint that has no
    administrative role is the finding to escalate.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this AdFind invocation query? Decode the flags, LDAP
    filters, and -sc shortcuts in the command line.
  context: The full command line reveals the scope of the enumeration. Decode the
    base flags (-default, -gc, -b), any LDAP filter strings (objectcategory=person /
    computer / group, adminCount=1, userAccountControl bitwise matches), the requested
    attributes, and the -sc shortcuts. Password-policy attribute reads map lockout and
    complexity settings; -sc admincountdmp enumerates AdminSDHolder-protected
    privileged accounts; -sc exchaddresses dumps Exchange addressing. The combination
    of attributes and filters shows precisely which directory objects the operator
    pulled. The query scopes to executions carrying these enumeration tokens on this
    host so multi-command sweeps are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - lockoutduration
          - lockoutthreshold
          - lockoutobservationwindow
          - maxpwdage
          - minpwdage
          - minpwdlength
          - pwdhistorylength
          - pwdproperties
          - -sc admincountdmp
          - -sc exchaddresses
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1087.002.process_identification
  question: Which executable carried the AdFind flags, and is that binary name, path,
    and signature consistent with a legitimate AD query tool?
  context: The rule constrains only the command line, not the image, so the binary
    can be renamed - AdFind's own arguments are the signature, not its filename.
    Operators frequently rename the binary (af.exe, a.exe) or run it from a
    user-writable directory to defeat name-based detection. Identify the executable
    that carried the enumeration flags, where it lives, and whether it is signed. A
    signed adfind.exe in an admin tooling path run by IT is a different finding than
    an unsigned or renamed binary executing the same flags from a temp or profile
    directory on a host with no administrative role.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run Active Directory enumeration tooling?
  context: Network administrators and IT staff legitimately query AD for
    troubleshooting and audits. Standard users, service accounts, and developer
    workstations rarely have any reason to dump password policy, enumerate privileged
    adminCount=1 accounts, or list Exchange addresses. The acting account's role and
    typical toolset determine whether this AD reconnaissance is routine administration
    or post-compromise enumeration by an operator using a stolen or low-privilege
    account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this AD enumeration, and is that parent chain normal
    for administrative tooling?
  context: Legitimate AD queries are typically launched from an interactive shell
    (cmd.exe or powershell.exe under explorer.exe) or a known automation account.
    Enumeration spawned by an unusual parent - an Office application, a script host
    such as wscript.exe or mshta.exe, wmiprvse.exe (WMI remote execution), or
    wsmprovhost.exe (WinRM remote execution) - points to automated post-exploitation
    rather than an administrator at a console. The parent identifies how the
    enumeration was initiated and whether a remote operator drove it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single AD query may be legitimate troubleshooting, but multiple
    reconnaissance commands in rapid succession - whoami, nltest, net group /domain,
    dsquery, additional AdFind sweeps - is a signature pattern of post-compromise
    enumeration. Operators run these in a tight window to map accounts, groups, trusts,
    and hosts before selecting the next target. Three or more distinct recon binaries
    within fifteen minutes typically indicates scripted enumeration rather than ad-hoc
    administration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: attack:T1087.002.network_indicators
  question: Did this host open LDAP or directory-service connections to a domain
    controller around the time of the enumeration?
  context: AD enumeration tooling reads the directory over LDAP (TCP 389/636) or the
    global catalog (3268/3269) against a domain controller. A workstation that is not
    a DC and does not normally bind to one over these ports, suddenly doing so in the
    enumeration window, corroborates that directory data was actually pulled rather
    than the command merely launching. Correlate the connection destination with the
    domain controllers in this environment; a non-admin endpoint querying the global
    catalog is unexpected. If network telemetry for these ports is not collected,
    treat the absence of results as a visibility gap rather than evidence nothing
    happened.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 389
          - 636
          - 3268
          - 3269
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_password:
        CommandLine|contains:
        - lockoutduration
        - lockoutthreshold
        - lockoutobservationwindow
        - maxpwdage
        - minpwdage
        - minpwdlength
        - pwdhistorylength
        - pwdproperties
      selection_enum_ad:
        CommandLine|contains: -sc admincountdmp
      selection_enum_exchange:
        CommandLine|contains: -sc exchaddresses
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_password:
        CommandLine|contains:
        - lockoutduration
        - lockoutthreshold
        - lockoutobservationwindow
        - maxpwdage
        - minpwdage
        - minpwdlength
        - pwdhistorylength
        - pwdproperties
      selection_enum_ad:
        CommandLine|contains: -sc admincountdmp
      selection_enum_exchange:
        CommandLine|contains: -sc exchaddresses
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the AD enumeration was a single event or part of activity spanning multiple
    endpoints. If the same user triggered enumeration, credential access, or lateral
    movement on other hosts in the same window, the scope of the incident is larger
    than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_password:
        CommandLine|contains:
        - lockoutduration
        - lockoutthreshold
        - lockoutobservationwindow
        - maxpwdage
        - minpwdage
        - minpwdlength
        - pwdhistorylength
        - pwdproperties
      selection_enum_ad:
        CommandLine|contains: -sc admincountdmp
      selection_enum_exchange:
        CommandLine|contains: -sc exchaddresses
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the AD
    enumeration reveals what led to it and what followed - the parent that staged the
    process, credential access, or lateral movement the reconnaissance was meant to
    inform. Novel parent-child pairs at low counts are what to scan for against the
    high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - credential access, defense tampering,
    or other reconnaissance - may reveal the attack stages that preceded the AD
    enumeration and help reconstruct the timeline. Directory reconnaissance is usually
    a mid-stage step that follows initial access and precedes lateral movement, so
    prior alerts give the context for why the directory was being mapped.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's AdFind enumeration pattern,
    what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate directory administration can match these flag patterns.
    This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern
    has historically run here, not generic process activity. A new parent process, an
    unexpected account, or a first-ever occurrence on this host is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_password:
        CommandLine|contains:
        - lockoutduration
        - lockoutthreshold
        - lockoutobservationwindow
        - maxpwdage
        - minpwdage
        - minpwdlength
        - pwdhistorylength
        - pwdproperties
      selection_enum_ad:
        CommandLine|contains: -sc admincountdmp
      selection_enum_exchange:
        CommandLine|contains: -sc exchaddresses
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's AdFind enumeration pattern in the past
    week, and does the cross-host distribution look like consistent automation or
    one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the AdFind enumeration firing pattern rather
    than generic process activity. Many hosts firing the same pattern points to a
    scheduled audit or scripted deployment that runs these queries by design; one host
    or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity - directory reconnaissance is expected from a
    handful of admin jump boxes, not from arbitrary workstations.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_password:
        CommandLine|contains:
        - lockoutduration
        - lockoutthreshold
        - lockoutobservationwindow
        - maxpwdage
        - minpwdage
        - minpwdlength
        - pwdhistorylength
        - pwdproperties
      selection_enum_ad:
        CommandLine|contains: -sc admincountdmp
      selection_enum_exchange:
        CommandLine|contains: -sc exchaddresses
      condition: 1 of selection_*
    fields:
    - host.name
