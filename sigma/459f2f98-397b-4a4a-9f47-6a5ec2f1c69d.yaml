      name: System Binary Proxy Execution
      role: primary
  attack_chain_coverage:
    - stage: 1
      label: signed_binary_url_invocation
      description: "MSOHTMED.exe, a trusted Microsoft-signed Office binary, is launched with a URL argument on its command line - the act the rule detects"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: network_retrieval
      description: "The signed binary performs an outbound connection to the URL destination to fetch the externally hosted payload"
      mapped_to: Q5
