  dimension_coverage:
    - dimension: command_analysis
      technique: T1218
      covered_by: Q3
      source: template:cue_process_tool.mechanism_decode
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1218
      covered_by: Q4
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1218
      covered_by: Q6
      source: template:cue_network_endpoint.mechanism_decode
      coverage_type: direct
  mutable_dispositions:
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "ftp://, http://, https:// (the rule's selection_cli URL tokens)"
      disposition: query_injection
      target_question: Q11
      notes: "The URL tokens are present in the rule's selection_cli and are carried verbatim into the REFLECTED baseline_deviation (Q11) and scope (Q12) detection blocks. Q3 (mechanism_decode) reads the full URL out of the alerting command line for the analyst."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "non-Office parents (cmd.exe, powershell.exe, wscript.exe, mshta.exe) vs Office-app/explorer.exe UI launch"
      disposition: context
      target_question: Q4
      notes: "Analytic gives a profiling rationale, not a fixed list, and the rule does not constrain ParentImage. Realized as the parent-chain judgment in process_chain (Q4): an Office-app/explorer parent reads as a UI action, a script-host/shell parent as proxied invocation. baseline_svc/clustering_svc (Q14/Q16) pivot on the parent+binary pairing."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q1
      notes: "List of signed binaries allowed for proxy execution; this rule already fixes the binary to MSOHTMED.exe, so the list collapses to a single binary identity confirmed in verify_trigger_match (Q1)."
    - element: RemoteDomainAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q6
      notes: "Filter to suppress legitimate enterprise destinations; no concrete domains in the analytic. Realized as the destination-reputation judgment in cue_network_endpoint.mechanism_decode (Q6) and the host-to-destination baseline (Q7), which separate sanctioned content domains from attacker infrastructure."
  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot Q13 and launch-mechanism-pivot Q14)"
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot Q15 and launch-mechanism-pivot Q16)"
      kept: both
    - dropped: cue_process_tool.baseline
      reason: "generic Image|endswith host baseline is subsumed by the REFLECTED host-pattern question (baseline_deviation, Q11), which scopes to the rule's actual MSOHTMED-with-URL firing pattern rather than all MSOHTMED launches"
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.clustering
      reason: "Image-only host aggregation subsumed by cue_host_context.clustering (Q17), which projects Image+ParentImage and surfaces novel parent-child pairs"
      kept: cue_host_context.clustering
  skipped_templates:
    - template: download_tool.directory_activity
      reason: "Targets TargetFilename|contains %file_dirs%; the rule references no download destination path on the command line (has_file_reference: false) and MSOHTMED writes to the shared INetCache directory that browsers/Office also write to, so a directory sweep there returns unrelated cache writes. download_success_verification (Q8) and payload_analysis (Q9), scoped to MSOHTMED's own file-creation events, cover the on-disk landing more precisely. Also keeps the download_tool set within its max_questions: 3."
    - template: universal.endpoint_protection_health
      reason: "recommended priority, not must_include. This rule fires on signed-binary proxy download (delivery), not hands-on execution or credential access where tamper-as-precursor is the live disposition question. cue_host_context.precursor (Q18) already surfaces prior tamper/recon alerts on the host, and its notes_to_llm explicitly allows dropping when precursor is present and the rule is not execution/credential-centric. Trimmed to stay within the 14-18 target (playbook is at 18)."
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1218) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        T1218's image_load analytic targets proxy-execution binaries that load a
        payload as a module (regsvr32/rundll32 loading an unsigned DLL). MSOHTMED's
        behavior here is to download a URL-referenced file into the Internet cache and
        write it to disk - it does not load the fetched payload as a module itself, so
        an image_load query on MSOHTMED returns its normal Office DLL dependencies and
        adds no precision for this download pattern. The load-bearing cross-logsource
        pivot for this rule is the network_connection retrieval, which IS acted on:
        Q5 (attack:T1218.network_retrieval) and Q6/Q7 (cue_network_endpoint) cover the
        outbound fetch and destination reputation. No compensating
        attack:T1218.image_load question authored.
