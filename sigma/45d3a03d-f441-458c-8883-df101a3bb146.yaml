name: Launch-VsDevShell.PS1 Proxy Execution
id: 78f969e4-6f58-41e7-8555-2fe8263e7004
description: |
  Detects use of the Microsoft-signed 'Launch-VsDevShell.ps1' script with the 'VsWherePath' or
  'VsInstallationPath' arguments. The rule fires when a command line contains the Launch-VsDevShell.ps1
  reference AND at least one of those flags, which route an attacker-controlled path into an internal IEX
  call so a signed script proxies execution of arbitrary commands or binaries. Legitimate use is a
  developer launching the Visual Studio developer shell; malicious use abuses the signed script to bypass
  application-control and signature checks. Investigation should confirm the exact arguments, identify what
  the proxied execution did, and determine whether the path argument pointed at an unexpected binary, script,
  or remote location.
type: detection
detection_id: 45d3a03d-f441-458c-8883-df101a3bb146
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain Launch-VsDevShell.ps1 together with a VsWherePath or VsInstallationPath argument?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line. The rule fires only when the Launch-VsDevShell.ps1 reference appears alongside a VsWherePath
    or VsInstallationPath flag; read the full argument string and note which flag is present and what path
    value it carries.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run Visual Studio developer tooling?
  context: Legitimate use of this script is a developer launching the Visual Studio developer shell on a
    development workstation. On a server, a service account, or a user with no development role, signed-script
    proxy execution is far less likely to be routine and the path argument deserves close review.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did the VsWherePath or VsInstallationPath argument point at, and what command did the proxied execution run?
  context: The full command line reveals what the signed script was made to execute. Decode the path value
    passed to VsWherePath or VsInstallationPath and any trailing arguments; a path to an unexpected binary,
    a script, or a remote location indicates the IEX call was used to proxy attacker-controlled execution
    rather than start a developer shell.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: Launch-VsDevShell.ps1
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this execution and is that parent chain expected for developer tooling?
  context: The parent process reveals how the script was invoked. A developer-driven launch typically descends
    from explorer.exe or a console shell started interactively. Parents such as Office applications, wscript.exe,
    mshta.exe, or a remote-management service point to automated or scripted invocation rather than interactive
    developer use.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1216.001.image_load
  question: Did the proxying process load unsigned or unusual assemblies or scriptlet modules around the time of the alert?
  context: Signed-script proxy execution routes attacker-controlled code through a trusted host, which often
    surfaces as loads of unsigned .NET assemblies, scriptlet components, or modules from user-writable paths.
    Correlate image-load events on this host in the alert window with the alerting process to see whether the
    proxied execution pulled in code beyond the expected Visual Studio modules. If image-load events are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
- source: attack:T1216.001.network_connection
  question: Did this host make outbound network connections around the time of the alert that could indicate a remote payload fetch?
  context: A signed script proxying execution can be pointed at a remote location to retrieve and run an
    attacker-hosted payload. Review outbound connections from this host in the alert window, excluding common
    system processes, to see whether the proxied execution reached an external endpoint. If network connection
    events are not ingested in this environment, treat zero results as a visibility gap rather than evidence
    no connection occurred.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_system:
        Image|endswith:
          - '\svchost.exe'
          - '\System'
      condition: selection and not filter_system
    fields:
      - Image
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.follow_on
  question: What child processes did this execution spawn afterward?
  context: The processes spawned after the proxied execution reveal its actual impact. A developer shell
    launch has predictable children; unexpected children such as cmd.exe, powershell.exe, certutil.exe, or
    rundll32.exe point to the signed script being used as a launcher for further activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentCommandLine|contains: Launch-VsDevShell.ps1
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even signed developer scripts can be abused. The query mirrors the rule's selection scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern has run here
    historically. A new parent process, an unexpected user account, or an unusual command-line structure is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_script:
        CommandLine|contains: Launch-VsDevShell.ps1
      selection_flags:
        CommandLine|contains:
        - 'VsWherePath '
        - 'VsInstallationPath '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_script:
        CommandLine|contains: Launch-VsDevShell.ps1
      selection_flags:
        CommandLine|contains:
        - 'VsWherePath '
        - 'VsInstallationPath '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_script:
        CommandLine|contains: Launch-VsDevShell.ps1
      selection_flags:
        CommandLine|contains:
        - 'VsWherePath '
        - 'VsInstallationPath '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope may be larger than a single
    workstation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_script:
        CommandLine|contains: Launch-VsDevShell.ps1
      selection_flags:
        CommandLine|contains:
        - 'VsWherePath '
        - 'VsInstallationPath '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    this firing pattern. Many hosts firing the same pattern points to scripted build deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution
    and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_script:
        CommandLine|contains: Launch-VsDevShell.ps1
      selection_flags:
        CommandLine|contains:
        - 'VsWherePath '
        - 'VsInstallationPath '
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context:
    what led to this event, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, privilege escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host such as defense tampering,
    reconnaissance, or credential access may reveal the attack stages that preceded this event and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
