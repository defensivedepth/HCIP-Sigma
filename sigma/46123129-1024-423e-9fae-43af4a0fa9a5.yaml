  has_attack_brief: true
  techniques:
    - id: T1105
      name: Ingress Tool Transfer
      role: primary
    - id: T1218
      name: System Binary Proxy Execution
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: signed_binary_invocation
      description: "MpCmdRun.exe is launched with a DownloadFile and url argument, the proxied-download act the rule detects"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: command_decode
      description: "The remote URL and local destination path (including ADS variants) carried by the download command are decoded"
      mapped_to: Q3
      source: template:cue_process_tool.mechanism_decode
    - stage: 3
      label: network_retrieval
      description: "MpCmdRun.exe opens an outbound HTTP/HTTPS connection to the supplied URL to fetch the file"
      mapped_to: Q6
      source: attack:T1105.network_retrieval
    - stage: 4
      label: file_landing
      description: "The fetched content is written to disk at the destination path (download success)"
      mapped_to: Q7
      source: template:download_tool.download_success_verification
    - stage: 5
      label: payload_execution
      description: "The downloaded payload is executed on the host after the transfer"
      mapped_to: Q10
      source: template:cue_process_tool.follow_on
  dimension_coverage:
    - dimension: command_analysis
      technique: T1218
      covered_by: Q3
      source: template:cue_process_tool.mechanism_decode
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1218
      covered_by: Q4
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1218
      covered_by: Q6
      source: attack:T1105.network_retrieval
      coverage_type: direct
    - dimension: file_path_analysis
      technique: T1105
      covered_by: Q9
      source: template:download_tool.directory_activity
      coverage_type: direct
  mutable_dispositions:
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "URLs, script paths, DLL entrypoints; rule enforces CommandLine|contains|all [DownloadFile, url]"
      disposition: query_injection
      target_question: Q3
      notes: "mechanism_decode query tightened with CommandLine|contains|all [DownloadFile, url] from rule.commandline_values so the host-scoped decode returns only MpCmdRun download invocations, aligning the URL/path-decode question with what it measures."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (profile unexpected parent-child relationships)"
      disposition: new_question
      target_question: Q4
      notes: "No concrete values in the analytic. Realized as the process_chain parent-lineage question; the parent is not a detection field so cue_process_tool.process_chain is retained (no parent cue to subsume it). Also feeds the baseline_svc / clustering_svc service-principal pivots which key on process.parent.name."
    - element: DestinationIPCategory
      dimension: tuning_parameter
      specific_values: "internal vs external IP blocks; RemoteDomainAllowlist (legitimate enterprise domains)"
      disposition: context
      target_question: Q6
      notes: "No literal values in the analytic. Realized as the network_retrieval question, which surfaces DestinationIp/DestinationHostname/DestinationPort and directs the analyst to weigh enterprise vs unfamiliar external endpoints."
    - element: FilePathRegex
      dimension: file_path_analysis
      specific_values: "C:\\Users\\Public (uncommon drop paths)"
      disposition: context
      target_question: Q9
      notes: "directory_activity scopes to the download destination directory (%file_dirs%) and the context names C:\\Users\\Public, Downloads, and %TEMP% as common writable staging paths."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "rationale only (known signed binaries allowed for execution)"
      disposition: context
      target_question: Q2
      notes: "Tuning rationale, no values to inject. The rule already constrains the signed binary to MpCmdRun.exe; host_user_context frames whether SYSTEM/LOCAL SERVICE vs interactive/service-account invocation of this signed download primitive is expected."
  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject pivot and launch-mechanism pivot). Image-pivot adapted to the CommandLine DownloadFile+url pattern per the CommandLine-derived file-path hint and Q-vs-query alignment."
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject pivot and launch-mechanism pivot)."
      kept: both
    - dropped: cue_process_tool.baseline
      reason: "generic Image|endswith host baseline of MpCmdRun.exe counts all Defender CLI activity (SYSTEM scans/updates dominate) without enforcing the download pattern; subsumed by the REFLECTED host-pattern question (baseline_deviation) which scopes to the rule's actual DownloadFile firing pattern."
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.clustering
      reason: "Image-only host aggregation subsumed by cue_host_context.clustering, which projects Image+ParentImage and surfaces novel parent-child pairs."
      kept: cue_host_context.clustering
  skipped_templates:
    - template: cue_artifact.mechanism_decode
      reason: "Content analysis of the downloaded file. Folded into download_tool.payload_analysis (Q8), which retrieves the destination path + Hashes for sandbox/threat-intel review of the fetched payload. The file is fetched from an operator-supplied URL via a separate write, so process_creation has no file content to surface; the file_event payload question is the correct artifact angle. Trimmed to stay within the 14-18 target."
    - template: cue_artifact.artifact_verification
      reason: "Hash/reputation lookup of the downloaded file is provided by download_tool.payload_analysis (Q8), which projects Hashes for the destination path. No separate verification question needed."
    - template: cue_artifact.baseline
      reason: "First-seen baseline of the downloaded file. The download destination is operator-chosen and varies per invocation, so a -90d %file_paths% baseline returns near-zero by construction and adds little; payload novelty is assessed via the hash/sandbox path in payload_analysis (Q8). Trimmed to stay within the 14-18 target."
    - template: universal.endpoint_protection_health
      reason: "recommended, not must_include. This is a download/proxy-execution rule, not a credential-access or hands-on-keyboard execution rule whose disposition turns on prior tamper. Prior-host tamper-as-precursor is already carried by cue_host_context.precursor (Q16, sigma alerts -6h) and cue_host_context.clustering (Q15). Trimmed to stay within the 14-18 target."
  reflection_overrides: []
  hint_dispositions:
    - hint: "cue_artifact: derived: \\bDownloadFile\\b in CommandLine"
      disposition: declined
      reason: >-
        The derived artifact cue is the downloaded file. Its angles are covered by the
        download_tool technique set: download_success_verification (Q7) confirms the file
        landed, payload_analysis (Q8) does hash + sandbox review, and directory_activity
        (Q9) surfaces sibling drops. The cue_artifact mechanism_decode / artifact_verification
        / baseline templates are recorded as skipped_templates because they duplicate that
        coverage on the same %file_paths% artifact.
    - hint: "logsource 'image_load' (recommended by techniques: T1218) is not covered — pull in cue_image_load.* or author a custom question with category: image_load"
      disposition: declined
      reason: >-
        The rule's detection logic constrains MpCmdRun.exe to the DownloadFile/url
        argument signature — a network-and-file behavior, not a DLL-hosting behavior.
        image_load on MpCmdRun.exe returns the binary's normal Defender DLL set
        (mpclient.dll, etc.) and adds no precision for the file-download primitive this
        rule fires on. The T1218 proxy-execution angle here is the signed binary fetching
        a remote payload, which is answered by the network_retrieval (Q6), file-landing
        (Q7), and follow-on execution (Q10) questions. No compensating
        attack:T1218.image_load question authored.
