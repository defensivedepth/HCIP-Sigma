    - template: cue_process_tool.baseline
      reason: "subsumed by cue_process_tool.baseline_deviation (reflected, rule-pattern-scoped) and cue_user_actor.baseline -- generic host frequency adds no coverage over the rule-pattern host baseline"
    - template: cue_process_tool.follow_on
      reason: "child-process follow-on overlaps post_access_lateral_movement (alert-correlation follow-on) and tool_specific_artifacts; the lateral-movement framing is more specific for this credential-access/relay tooling"
    - template: cue_process_tool.clustering
      reason: "host-wide tool clustering overlaps cue_host_context clustering and precursor; precursor (alert-correlation) is the more specific surrounding-context question kept"
    - template: cue_host_context.clustering
      reason: "host-wide activity overlaps cue_host_context.precursor (alert-correlation) which is more specific for reconstructing surrounding attack stages; kept precursor"
    - template: universal.endpoint_protection_health
      reason: "recommended-only generic tamper sweep; defense_tampering set not confirmed and cue_host_context.precursor already surfaces prior tamper-as-precursor alerts on the host -- AGENTS.md drop condition (b)"
    - template: data_staging_exfil.archive_destination
      reason: "no archiving step in name-based Impacket detection; data_scope file-event question already covers files the tool touched, archive-move framing adds no coverage"
    - template: data_staging_exfil.encryption_password
      reason: "Impacket scripts are not archivers; archive password flags do not apply to this credential-access/relay tooling"
