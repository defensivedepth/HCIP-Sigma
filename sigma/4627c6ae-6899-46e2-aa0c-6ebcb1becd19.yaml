      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1557.001
      covered_by: Q12
      source: template:cue_process_tool.baseline_deviation
      coverage_type: partial
    - dimension: time_correlation
      technique: T1557
      covered_by: Q8
      source: template:credential_access.post_access_lateral_movement
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1557
      covered_by: Q17
      source: template:cue_process_tool.scope
      coverage_type: partial
  mutable_dispositions:
    - element: TrustedResponderList
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q10
      notes: "Expected LLMNR/NBT-NS responders are an environment-specific tuning list with no concrete values in the brief; framed as configuration context in the security-channel question."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only"
      disposition: context
      target_question: Q10
      notes: "Correlation period between poisoned name resolution and SMB relay -- expressed as the +/-1h window of the service/registry question and the +4h post-access window."
    - element: SMBServiceBaseline
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q12
      notes: "Normal SMB-relay service patterns are baselined via the host-scoped reflected baseline_deviation question."
    - element: MonitoredRegistryPaths
      dimension: tuning_parameter
      specific_values: "HKLM\\Software\\Policies\\Microsoft\\Windows NT\\DNSClient\\EnableMulticast (rationale only)"
      disposition: context
      target_question: Q10
      notes: "DNSClient EnableMulticast policy key named in the security-channel question context; exact monitored set is environment-specific."
    - element: DowngradeCipherList
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q4
      notes: "TLS downgrade cipher list does not apply to this name-based process_creation rule; no concrete values to inject. Capability identification covers what the matched tool actually does."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only"
      disposition: context
      target_question: Q8
      notes: "T1557 config-change-to-network-flow correlation period realized as the +4h post-access window."
