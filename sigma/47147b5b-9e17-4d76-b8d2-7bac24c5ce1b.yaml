_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1555.003
      name: Credentials from Web Browsers
      role: primary
    - id: T1555
      name: Credentials from Password Stores
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: store_access_copy
      description: "A non-browser process copies a browser credential database out of the User Data directory, the act the rule detects"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: store_identification_decode
      description: "Identify which browser credential store and file were targeted and confirm the copied artifact is a credential database"
      mapped_to: Q3
      source: template:credential_access.credential_target_identification
    - stage: 3
      label: memory_or_api_access
      description: "Correlate the file copy with direct process access to the browser process or credential file (CryptUnprotectData / memory read path) in the same window"
      mapped_to: Q5
      source: attack:T1555.003.process_access
    - stage: 4
      label: credential_reuse
      description: "Correlate post-copy logons / remote connections with reuse of the harvested browser credentials"
      mapped_to: Q9
      source: template:credential_access.post_access_lateral_movement
  dimension_coverage:
    - dimension: file_path_analysis
      technique: T1555.003
      covered_by: Q3
      source: template:credential_access.credential_target_identification
      coverage_type: direct
    - dimension: time_correlation
      technique: T1555.003
      covered_by: Q5
      source: attack:T1555.003.process_access
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1555.003
      covered_by: Q4
      source: template:cue_artifact.mechanism_decode
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1555
      covered_by: Q3
      source: template:credential_access.credential_target_identification
      coverage_type: indirect
    - dimension: user_context
      technique: T1555
      covered_by: Q2
      source: template:universal.host_user_context
      coverage_type: direct
  mutable_dispositions:
    - element: MonitoredPaths
      dimension: file_path_analysis
      specific_values: "Chrome Login Data, Edge Credential Locker, Firefox key4.db/logins.json under browser User Data / Profiles paths"
      disposition: query_injection
      target_question: Q5
      notes: >-
        Browser profile paths are already enforced by the rule's selection_path block.
        The credential-store file names (Login Data, key4.db, logins.json) are injected
        into Q3 and Q4 context for the analyst to confirm against the command line.
        The browser-process image list is injected into the Q5 process_access query
        (filter_browser) and the Q10-Q13 user_actor pattern selections use the browser
        User Data paths directly.
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (correlation window between file read and process memory/API access)"
      disposition: context
      target_question: Q5
      notes: >-
        No concrete window value in the analytic. Realized as the +/-10m range on the
        Q5 process_access correlation question, which pairs the copy with handle-open
        access to the browser process.
    - element: TargetProcesses
      dimension: tuning_parameter
      specific_values: "rationale only (e.g., lsass.exe, svchost.exe)"
      disposition: context
      target_question: Q5
      notes: >-
        T1555 target-process list is browser-specific here (the rule targets browser
        stores, not LSASS). Realized as the browser-process filter list in the Q5
        process_access query rather than the generic LSASS list.
    - element: KeywordPatterns
      dimension: tuning_parameter
      specific_values: "rationale only (dpapi, credman, mimikatz regex)"
      disposition: context
      target_question: Q4
      notes: >-
