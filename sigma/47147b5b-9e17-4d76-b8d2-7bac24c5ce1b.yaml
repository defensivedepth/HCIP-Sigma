name: Potential Browser Data Stealing
id: af7da3c7-58ae-4247-842c-7745149255eb
description: |
  Detects a copy or move operation that targets a web browser's User Data
  directory, where browsers store saved credentials in an encrypted credential
  store. The rule fires only when a single process matches all of two
  conditions: the command line contains a copy or move verb (copy-item, copy,
  cpi, cp, move, move-item, mi, mv) OR the image is esentutl.exe, xcopy.exe, or
  robocopy.exe by name or OriginalFileName, AND the command line references a
  known browser profile path such as Google\Chrome\User Data,
  Microsoft\Edge\User Data, or Mozilla\Firefox\Profiles. Copying the locked
  credential SQLite database (often via esentutl /y to bypass the file lock) is
  a common precursor to offline credential extraction. Some backup, migration,
  and profile-sync workflows legitimately copy these files, so the investigation
  should confirm which browser store was targeted, which tool performed the
  copy and from where, what happened to the copied database, and whether the
  same pattern appears on the host or across the fleet.
type: detection
detection_id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain both a copy or move verb and a browser
    User Data path, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when both conditions hold together - the command line carries
    a copy or move verb (copy-item, copy, cpi, cp, move, move-item, mi, mv) or runs
    esentutl.exe, xcopy.exe, or robocopy.exe, AND the command line references a known
    browser profile directory such as Google\Chrome\User Data, Microsoft\Edge\User
    Data, or Mozilla\Firefox\Profiles. Read the exact command line and confirm both
    halves are present, and note which browser store and which destination path were
    specified.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to copy browser profile databases?
  context: Copying a browser User Data directory is normal for a narrow set of backup,
    profile-migration, and IT-imaging workflows. Most users and most endpoints never
    copy another process's credential store. Knowing whether the acting account and
    the host function involve profile management or endpoint provisioning is often
    the fastest path to separating a benign migration from credential theft staging.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Which browser credential store was targeted, and which profile and file
    were copied?
  context: Different browsers store credentials in different files - Chromium-family
    browsers (Chrome, Edge, Brave, Opera, Vivaldi) keep saved logins in the Login
    Data SQLite database under User Data, while Firefox uses key4.db and logins.json
    under its Profiles directory. Read the full command line to identify which browser
    profile path was referenced and which specific file was copied. The targeted store
    determines which saved website credentials may now be exposed and whose accounts
    should be reset.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_artifact.mechanism_decode
  question: Confirm the copied file is a browser credential database - decode the source
    and destination paths in the command line.
  context: The command line references both the browser store being read and the
    destination the copy is written to. Decode both paths to confirm the source is a
    credential file (Login Data, key4.db, logins.json) rather than an unrelated profile
    artifact, and note where the copy landed - a staging directory such as a temp
    folder, a user profile, or a removable drive. esentutl /y is frequently used here
    because it copies files that are locked by a running browser, so its presence
    indicates an attempt to read a credential store while the browser is open.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1555.003.process_access
  question: Did any non-browser process open a handle to a browser process or its
    credential files around the time of the alert?
  context: Some credential-theft tooling reads the browser credential store directly
    from memory or via a handle to the browser process rather than copying the file
    on disk, then calls CryptUnprotectData to decrypt the stored secrets. Process-access
    events show one process opening another with read access. A non-browser process
    opening a Chromium or Firefox process, or touching the credential file, in the
    same window as the copy operation indicates the copy was part of an active
    credential-extraction effort rather than an isolated file operation.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_browser:
        SourceImage|endswith:
          - '\chrome.exe'
          - '\msedge.exe'
          - '\firefox.exe'
          - '\brave.exe'
          - '\opera.exe'
      condition: selection and not filter_browser
    fields:
      - SourceImage
      - TargetImage
      - GrantedAccess
- source: template:universal.evidence_preservation
  question: Is the copied browser credential database still on disk for analysis?
  context: The copy operation writes the browser credential store to a destination
    path. If that copied file still exists, it can be hashed, its contents reviewed,
    and the scope of exposed credentials assessed. If it has already been deleted or
    moved off the host, that itself indicates staging for exfiltration and narrows the
    window for recovery from backups or shadow copies.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this copy operation, and is that parent chain expected?
  context: The parent process reveals how the copy was invoked. A user-driven backup
    usually shows explorer.exe or an interactive shell launched by the user; an
    unexpected parent such as a script host, a remote-administration tool, or a process
    running under an automation account points to scripted credential collection rather
    than a manual file copy. The parent is where the decision to read the browser store
    was made.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be exposed, and do any browser profiles belong to
    privileged or shared users?
  context: The severity of browser credential theft depends on what was saved in the
    targeted profile. A standard user's personal browser logins differ sharply from a
    profile belonging to an administrator, a shared kiosk account, or a workstation
    used for privileged management, where saved credentials may include access to
    internal consoles, cloud portals, or VPNs. Identify whose profile was copied and
    cross-reference the account against directory group memberships to decide whether
    a credential reset and escalation are warranted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
      - CommandLine|contains:
        - copy-item
        - 'copy '
        - 'cpi '
        - ' cp '
        - 'move '
        - move-item
        - ' mi '
        - ' mv '
      - Image|endswith:
        - \esentutl.exe
        - \xcopy.exe
        - \robocopy.exe
      - OriginalFileName:
        - esentutl.exe
        - XCOPY.EXE
        - robocopy.exe
      selection_path:
        CommandLine|contains:
        - \Amigo\User Data
        - \BraveSoftware\Brave-Browser\User Data
        - \CentBrowser\User Data
        - \Chromium\User Data
        - \CocCoc\Browser\User Data
        - \Comodo\Dragon\User Data
        - \Elements Browser\User Data
        - \Epic Privacy Browser\User Data
        - \Google\Chrome Beta\User Data
        - \Google\Chrome SxS\User Data
        - \Google\Chrome\User Data\
        - \Kometa\User Data
        - \Maxthon5\Users
        - \Microsoft\Edge\User Data
        - \Mozilla\Firefox\Profiles
        - \Nichrome\User Data
        - \Opera Software\Opera GX Stable\
        - \Opera Software\Opera Neon\User Data
        - \Opera Software\Opera Stable\
        - \Orbitum\User Data
        - \QIP Surf\User Data
        - \Sputnik\User Data
        - \Torch\User Data
        - \uCozMedia\Uran\User Data
        - \Vivaldi\User Data
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
