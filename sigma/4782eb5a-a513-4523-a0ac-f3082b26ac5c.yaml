name: Mshtml.DLL RunHTMLApplication Suspicious Usage
id: d9ebaff8-e1a5-4e06-b053-991a9555bfb8
description: |
  Detects a process whose command line abuses the mshtml.dll RunHTMLApplication
  export to run arbitrary code through a protocol handler (javascript, vbscript,
  file, http). The rule fires when a single command line contains a path-traversal
  sequence (\..\) together with mshtml AND either the RunHTMLApplication export name
  or its ordinal #135. This pattern is the rundll32 LOLBIN primitive that loads
  inline or remote script - including JavaScript fetched over http:// or file:// -
  and is used to bypass detection that pattern-matches the exact two-levels-up
  traversal, since extra \..\ segments do not change the runtime behavior. Almost
  no legitimate workflow calls RunHTMLApplication this way, so the investigation
  should determine which binary carried the command line, what protocol handler and
  payload it invoked, what the process did next, and whether the same pattern
  appears elsewhere on the host or fleet.
type: detection
detection_id: 4782eb5a-a513-4523-a0ac-f3082b26ac5c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: 'Does the command line contain a \..\ traversal with mshtml and either
    RunHTMLApplication or the ordinal #135, matching what this rule detects?'
  context: 'Before investing investigation time, confirm the alert is a true positive.
    The rule fires when one command line contains a path-traversal sequence (\..\) and
    mshtml AND either the RunHTMLApplication export name or its ordinal #135. Read the
    exact command line and note the protocol handler that precedes it (javascript,
    vbscript, file, or http) and any inline script or URL that follows, since those
    determine what code the export was asked to run.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run rundll32 with the mshtml
    RunHTMLApplication export?
  context: Calling mshtml,RunHTMLApplication through rundll32 has effectively no routine
    administrative use. Most users and most endpoints never invoke it. Knowing whether
    the acting account and the host function involve any workflow that could plausibly
    produce this call is often the fastest path to separating a rare benign case from
    deliberate LOLBIN abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: Which protocol handler and payload did the RunHTMLApplication call invoke,
    and is the script inline or fetched from a remote location?
  context: The full command line reveals what the export was asked to run. Identify the
    protocol handler before the traversal (javascript, vbscript, file, or http) and
    decode whatever follows it. Inline script that pops a shell, a GetObject("script:...")
    call that pulls a remote SCT, or a file:// or http:// reference each point to a
    different stage; a URL or remote host in the command line is a download-and-run
    cradle, while a self-contained inline payload runs entirely in memory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned the rundll32 RunHTMLApplication invocation, and is
    that parent chain expected?
  context: The parent process reveals how the command line was launched. A console shell
    started by a user looks different from a script host, mshta.exe, an Office
    application, or a browser child spawning rundll32 with this export. An unexpected
    parent points to automated or malicious invocation - a macro, a phishing payload,
    or a downloaded script - rather than hands-on administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: llm_generated
  question: What child processes did the RunHTMLApplication invocation spawn, and do
    any of them indicate payload execution?
  context: RunHTMLApplication exists to execute script, and that script commonly spawns
    follow-on processes - a shell, a script host, a download utility, or the final
    payload. Children scoped to this exact invocation show what the loaded code actually
    did. Unexpected descendants such as cmd.exe, powershell.exe, wscript.exe, or
    certutil.exe are the post-exploitation step the export enabled, while no children
    may mean the script ran in-process or failed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- source: llm_generated
  question: Did this process make any outbound network connections, and to what
    destinations?
  context: A protocol handler such as http:// in a RunHTMLApplication call fetches and
    runs remote script, so the same process or its children may reach out to download a
    second-stage payload. Reviewing outbound connections tied to this activity shows
    whether the loaded code pulled remote content and to which host. An external
    destination not associated with normal browsing or update traffic is the egress the
    cradle used and a candidate indicator to pivot on across the environment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Initiated
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_user_actor.baseline
  question: Does this user normally run rundll32 with the mshtml RunHTMLApplication
    pattern?
  context: Compare the acting account against its own history. This export pattern has
    no common benign use, so an account that has never produced it launching it now is
    notable, and even a recurring history warrants confirming it maps to a known tool
    or workflow rather than repeated abuse. The user role and typical toolset should
    align with anything that could legitimately call this export.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|all:
          - \..\
          - mshtml
        CommandLine|contains:
          - '#135'
          - RunHTMLApplication
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent process and mshtml RunHTMLApplication command-line pattern
    historically routine on this host or across the environment, or is the parent
    unusual for it?
  context: When the alert fires under a service principal, user identity does not
    attribute the behavior; the meaningful pivot is which parent process launched a
    child carrying the mshtml RunHTMLApplication pattern and whether that pairing is
    historically common. A new or rare parent for this pattern on this host or
    environment-wide is the deviation worth chasing, while a parent that already
    accounts for many prior events is more likely an existing script or automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|all:
          - \..\
          - mshtml
        CommandLine|contains:
          - '#135'
          - RunHTMLApplication
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    RunHTMLApplication invocation was a single event or part of activity spanning
    multiple endpoints. If the same user triggered similar execution on other hosts,
    the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent process and mshtml RunHTMLApplication command-line
    pattern fire on other hosts in the same window, indicating a coordinated rollout
    rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network
    returns agent-telemetry noise, since every host runs system-owned agents constantly.
    The meaningful question is whether the same launch mechanism - a parent process
    spawning a child that carries the mshtml RunHTMLApplication pattern - fired on other
    hosts in the alert window. Multiple hosts in the same window points to scripted or
    pushed activity; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|all:
          - \..\
          - mshtml
        CommandLine|contains:
          - '#135'
          - RunHTMLApplication
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    RunHTMLApplication invocation reveals what led to it and what followed - the parent
    that staged the process, reconnaissance, or follow-on execution the loaded script
    carried out. Novel parent-child pairs at low counts are what to scan for against the
    high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in
    the hour before the alert?
  context: This export pattern is documented specifically as a way to slip past
    signature-based detection, so the relevant question is whether the operator also
    weakened protection around it. The query surfaces attempts to disable AV/EDR
    services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI and
    ETW from the command line. Zero rows means no command-line tampering of these kinds
    was visible; populated rows show a broader effort to blind the host. Review the
    parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - phishing-stage execution,
    reconnaissance, or other defense evasion - may reveal the stages that preceded the
    RunHTMLApplication invocation and help reconstruct the full timeline. LOLBIN script
    execution is often one step in a sequence, so prior alerts give the context for why
    this export was called.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline_deviation
  question: 'When this host has previously fired the rule''s mshtml RunHTMLApplication
    pattern, what parents and users normally drive it, and does the current alert fit?'
  context: This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has
    historically run here, not generic rundll32 activity. Given how rarely this export
    pattern appears legitimately, a first-ever occurrence on the host is itself
    notable; a new parent process or an unexpected account against a small prior history
    is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \..\
        - mshtml
        CommandLine|contains:
        - '#135'
        - RunHTMLApplication
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's mshtml RunHTMLApplication pattern in the
    past week, and does the cross-host distribution look like automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the mshtml RunHTMLApplication firing pattern rather
    than generic rundll32 activity. Many hosts firing the same pattern would be unusual
    for an export with no common benign use and points to a scripted deployment or a
    spreading operation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \..\
        - mshtml
        CommandLine|contains:
        - '#135'
        - RunHTMLApplication
      condition: selection
    fields:
    - host.name
