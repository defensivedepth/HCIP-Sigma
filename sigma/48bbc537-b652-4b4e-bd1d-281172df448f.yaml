name: Sysinternals PsSuspend Execution
id: 2c19d8f3-71d0-48fe-815a-d050a493db0b
description: |
  Detects execution of the Sysinternals PsSuspend utility (pssuspend.exe or pssuspend64.exe), identified
  by OriginalFileName or by the image name ending in those binaries. PsSuspend pauses and resumes processes
  on the local or a remote system and is a legitimate administration tool, but the same capability is abused
  to suspend security processes (for example MsMpEng.exe) so malware can run while real-time protection is
  effectively frozen rather than killed. The investigation should determine which process PsSuspend targeted,
  whether the resume (-r) flag or a remote computer argument was used, who ran it, and whether the execution
  fits routine administration or sits in a chain of evasion and follow-on activity.
type: detection
detection_id: 48bbc537-b652-4b4e-bd1d-281172df448f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Is the alerting binary actually PsSuspend by image name or original file name?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the
    process original file name is pssuspend.exe or the image path ends in pssuspend.exe or pssuspend64.exe.
    Confirm the original file name has not been spoofed by a rename and that the image is the genuine
    Sysinternals utility.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to suspend or resume processes with PsSuspend?
  context: Legitimate administrative activity can trigger this detection. PsSuspend is normally run by IT or
    server administrators managing resource contention. Knowing whether this user role and host function are
    consistent with process-suspension activity is often the fastest path to distinguishing routine operations
    from abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did this PsSuspend invocation target? Decode the command line to identify the process, the
    resume flag, and any remote computer or credentials.
  context: The full command line reveals the specific action. PsSuspend takes a process name or process ID to
    suspend; the -r switch resumes a previously suspended process; a leading double-backslash computer argument
    with optional -u username and -p password directs the operation at a remote host. A target that names a
    security process or a remote computer is a different disposition than a developer pausing a runaway local
    process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned PsSuspend and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Legitimate usage often has predictable parents
    such as explorer.exe for an interactive admin or a management agent for automation. Unusual parents like
    mshta.exe, wscript.exe, powershell.exe download cradles, or Office applications point toward automated
    post-exploitation rather than hands-on administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did PsSuspend spawn afterward?
  context: The processes that run after a suspension reveal its purpose. When PsSuspend is used to freeze
    security tooling, the analyst expects payload execution to follow in the same window. Unexpected children
    such as cmd.exe, powershell.exe, or a dropped binary indicate the suspension cleared the way for further
    activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run PsSuspend?
  context: A process that has never been seen on a host is more notable than one that runs regularly. Zero or
    very low historical counts indicate first-time or rare execution, which raises the weight of the other
    answers. On servers where PsSuspend is part of routine maintenance, a steady non-zero baseline points
    toward expected activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the PsSuspend pattern, what parents and users normally drive it,
    and does the current alert fit that pattern?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern has
    historically run here, not generic binary usage. A new parent process, an unexpected user account, or an
    unusual image path that does not match the established baseline is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: pssuspend.exe
      - Image|endswith:
        - \pssuspend.exe
        - \pssuspend64.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the PsSuspend pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this firing pattern rather than generic usage of the binary. Many hosts firing the same pattern
    points to scripted deployment or vendor automation; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: pssuspend.exe
      - Image|endswith:
        - \pssuspend.exe
        - \pssuspend64.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: pssuspend.exe
      - Image|endswith:
        - \pssuspend.exe
        - \pssuspend64.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: pssuspend.exe
      - Image|endswith:
        - \pssuspend.exe
        - \pssuspend64.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spread across
    multiple endpoints. If the same user triggered similar process-control or evasion activity on multiple
    hosts, the scope of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: pssuspend.exe
      - Image|endswith:
        - \pssuspend.exe
        - \pssuspend64.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event,
    what happened after, and whether it is part of a larger sequence. Look for reconnaissance, defense tampering,
    privilege escalation, or persistence installation near the suspension event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access,
    may reveal the attack stages that preceded the suspension and help reconstruct the timeline. Suspending a
    security process is frequently a setup step rather than the goal, so what came before is informative.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:organizational_context.human_recall
  question: Does the user or administrator recall running PsSuspend against this process?
  context: Direct confirmation from the human behind the account is often the fastest path to determining
    legitimacy. If the user does not recall the action, the credentials may be compromised or the activity may
    be automated. If they do recall it, capture why a process needed to be suspended and which one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for this process-suspension
    action?
  context: Many organizations require change tickets or maintenance windows for hands-on server administration.
    A corresponding ticket suggests authorized activity; absence of one when policy requires it suggests the
    action was unauthorized. This check can quickly close false positives or escalate true positives.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Suspending a security process is often paired with establishing a foothold. Attackers commonly install
    backup persistence using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions.
    Multiple persistence installations from the same timeframe indicate intentional stacking rather than an
    isolated maintenance action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
