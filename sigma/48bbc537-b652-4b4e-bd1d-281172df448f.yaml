  reflection_overrides: []
  hint_dispositions:
    - hint: "service_persistence.service_configuration replaces cue_process_tool.mechanism_decode"
      disposition: declined
      reason: >-
        PsSuspend suspends and resumes processes and installs no Windows service, so the replacement's
        EventID 7045 service-install query reveals nothing about what this tool did. The genuine Phase-2
        mechanism for this rule is decoding the PsSuspend command line — the target process name or PID,
        the -r resume flag, and any remote double-backslash computer with -u/-p credentials — so
        cue_process_tool.mechanism_decode is retained as Phase 2 instead of the service-creation template.
    - hint: "logsource 'registry_set' (recommended by techniques: T1543.003) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        The registry_set analytic monitors HKLM\System\CurrentControlSet\Services key changes that accompany
        service creation or modification. This rule detects the PsSuspend binary, which suspends a running
        process and writes no Services registry key, so a registry_set question would query a behavior the
        rule does not exercise. No compensating attack:T1543.003.registry_set question authored.
    - hint: "logsource 'security' (recommended by techniques: T1543.003) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The security analytic keys on EventID 4697 (service installation). PsSuspend installs no service, so
        a 4697 query would return service-creation events unrelated to this suspension event. The T1543.003
        tag is a loose mapping for the abuse case (suspending a security service rather than creating one);
        analysis here genuinely lives in process_creation, not the Security service-install channel. No
        compensating attack:T1543.003.security question authored.
