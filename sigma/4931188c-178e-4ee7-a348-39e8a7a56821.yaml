name: Filter Driver Unloaded Via Fltmc.EXE
id: e5da0495-80b0-411f-b218-079d8edc36b8
description: |
  Detects fltmc.exe being run with an unload argument, which detaches a loaded
  minifilter driver from the filesystem filter stack. The rule fires when a
  process whose image ends in fltMC.exe (or whose original filename is fltMC.exe)
  runs a command line containing 'unload', excluding two known endpoint-protection
  installer and agent self-management patterns. Unloading a minifilter is a
  built-in administrative capability, but it is also the standard primitive for
  blinding host telemetry: detaching a monitoring driver such as the Sysmon
  minifilter (or an AV/EDR filesystem filter) immediately stops that driver's
  event capture without stopping the associated service. Some endpoint-protection
  install and upgrade flows unload their own filters, so the investigation should
  determine which driver was unloaded, what launched fltmc.exe, whether the
  removal was a one-off or part of broader tamper activity, and what ran on the
  host once the driver's visibility was gone.
type: detection
detection_id: 4931188c-178e-4ee7-a348-39e8a7a56821
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Was fltmc.exe run with an unload argument, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when a process whose image ends in fltMC.exe (or whose original
    filename is fltMC.exe) runs a command line containing 'unload', and the launch
    does not match the excluded endpoint-protection installer or agent patterns.
    Read the exact command line and note which driver name follows unload, since
    that name identifies the monitoring or protection driver being detached.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to unload filesystem minifilter drivers?
  context: Unloading a minifilter driver with fltmc.exe is normal for a narrow set
    of administrators and endpoint-protection maintenance flows that manage their
    own filters. Most users and most endpoints never run fltmc unload. Knowing
    whether the acting account and the host function involve filter-driver or
    endpoint-protection administration is often the fastest path to separating a
    maintenance action from deliberate telemetry removal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1562.process_identification
  question: Which driver was unloaded, and what process launched fltmc.exe to do it?
  context: The driver name following unload identifies what telemetry or protection
    was removed - a monitoring minifilter (such as the Sysmon driver) or an AV/EDR
    filesystem filter detaches that driver's event capture without stopping its
    service. The parent process reveals how fltmc.exe was invoked. An interactive
    administrator shell or a recognized endpoint-protection agent is a different
    finding than an unexpected parent such as a script host or an Office
    application. The driver name and the launching parent together establish
    whether this is maintenance or an evasion step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - CommandLine
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which minifilter driver was targeted, and is it a security or monitoring
    filter?
  context: Different unload targets have different impact. Detaching a monitoring
    driver such as the Sysmon minifilter stops process, file, network, and driver
    telemetry from that source while the service still appears to run. Detaching an
    AV or EDR filesystem filter weakens on-access protection. Read the full command
    line to identify the exact driver name passed to unload, then determine whether
    that driver belongs to a security or monitoring product rather than an
    application filter, since that determines investigation priority.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Has the unloaded driver been reloaded, or is the host still missing that
    filter's coverage?
  context: An fltmc unload detaches the driver until it is reloaded, the service is
    restarted, or the host reboots. If a monitoring or protection minifilter was
    removed and not restored, the host continues to run without that driver's
    visibility or enforcement. Confirm the driver's current load state on the host
    so the telemetry or protection gap is understood as momentary or ongoing; if it
    remains unloaded the filter should be restored before further investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the minifilter driver was
    unloaded?
  context: Removing a monitoring or protection filter is usually a preparatory step
    that lets follow-on activity run without that driver's capture or enforcement.
    Examining what ran in the window immediately after the unload reveals what the
    removal was meant to enable - payload execution, credential access, or further
    configuration changes. If the unloaded driver was a telemetry source, expect a
    gap in that source's events during this window, so correlate with whatever
    process, file, and network evidence remains.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: An operator who unloads a monitoring driver often pairs it with other
    evasion steps - stopping security services, clearing event logs, deleting
    shadow copies, or weakening firewall rules. Finding multiple tampering events
    from the same user or parent process within a short window points to a
    coordinated effort to blind the host rather than an isolated maintenance
    action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: attack:T1562.002.registry_tampering
  question: Were EventLog, Autologger, or minifilter registry keys modified on this
    host around the time of the unload?
  context: Detaching a driver at runtime is often paired with registry changes that
    make the loss persistent or disable the associated logging service - editing the
    EventLog or Autologger configuration, disabling a monitoring service's start
    type, or removing a minifilter's instance/altitude registration so it does not
    reload. Registry writes to these keys near the unload time indicate the
    operator intended the visibility loss to survive a service restart or reboot
    rather than just the current session.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Services\EventLog'
          - '\WMI\Autologger'
          - '\Control\Minifilter'
          - '\Services\SysmonDrv'
      condition: selection_host and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- source: attack:T1070.log_clearing
  question: Were Windows event logs cleared on this host around the time of the
    unload?
  context: Unloading a monitoring driver removes forward telemetry; clearing the
    event log destroys what was already recorded. The two are commonly performed
    together to remove both future and historical evidence. A log-clear or
    audit-policy-reset event on this host near the unload time indicates the
    operator was removing existing records, not just disabling collection, and the
    pre-clear contents may need to be recovered from forwarded copies if any exist.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      category: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 1102
          - 1100
          - 4719
      condition: selection
    fields:
      - EventID
      - SubjectUserName
- source: template:cue_process_tool.process_chain
  question: What process spawned fltmc.exe, and is that parent chain expected?
  context: The parent process reveals how the unload was invoked. fltmc.exe is a
    built-in driver-management utility, so the decision to unload a filter was made
    by whatever launched it. Interactive administration usually shows a console
    shell or a recognized management agent; an unexpected parent such as a script
    host, mshta.exe, or an Office application points to automated or hands-on-keyboard
    invocation that detached the filter to evade monitoring.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's fltmc unload pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate endpoint-protection maintenance can unload filters. This
    query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern
    has historically run here, not generic fltmc.exe activity. A new parent process,
    an unexpected account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \fltMC.exe
      - OriginalFileName: fltMC.exe
      selection_cli:
        CommandLine|contains: unload
      filter_optional_avira:
        ParentImage|contains:
        - \AppData\Local\Temp\
        - :\Windows\Temp\
        ParentImage|endswith: \endpoint-protection-installer-x64.tmp
        CommandLine|endswith:
        - unload rtp_filesystem_filter
        - unload rtp_filter
      filter_optional_manageengine:
        ParentImage: C:\Program Files (x86)\ManageEngine\uems_agent\bin\dcfaservice64.exe
        CommandLine|endswith: unload DFMFilter
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's fltmc unload pattern in the past week,
    and does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the fltmc unload firing pattern rather than
    generic fltmc.exe activity. Many hosts firing the same pattern points to a
    management agent or scripted maintenance that unloads filters by design; one
    host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \fltMC.exe
      - OriginalFileName: fltMC.exe
      selection_cli:
        CommandLine|contains: unload
      filter_optional_avira:
        ParentImage|contains:
        - \AppData\Local\Temp\
        - :\Windows\Temp\
        ParentImage|endswith: \endpoint-protection-installer-x64.tmp
        CommandLine|endswith:
        - unload rtp_filesystem_filter
        - unload rtp_filter
      filter_optional_manageengine:
        ParentImage: C:\Program Files (x86)\ManageEngine\uems_agent\bin\dcfaservice64.exe
        CommandLine|endswith: unload DFMFilter
      condition: all of selection_* and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run fltmc.exe to unload filter drivers?
  context: Compare the acting account against its own history. An administrator or
    endpoint-protection engineer may run fltmc unload as part of routine filter
    maintenance; an account that has never done so launching an unload is more
    notable. The user role and typical toolset should align with driver-filter
    administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith: \fltMC.exe
        CommandLine|contains: unload
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent process and fltmc unload pattern historically routine on
    this host or across the environment, or is the parent unusual for it?
  context: When the alert fires under a service principal, user identity does not
    attribute the behavior; the meaningful pivot is which parent process launched
    fltmc.exe with an unload argument and whether that pairing is historically
    common. A new or rare parent for this pattern on this host or environment-wide
    is the deviation worth chasing, while a parent that already accounts for many
    prior events is more likely a management agent or maintenance flow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith: \fltMC.exe
        CommandLine|contains: unload
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the filter unload was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the
    scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent process and fltmc unload pattern fire on other hosts
    in the same window, indicating a coordinated rollout rather than isolated
    activity?
  context: Under a service principal, asking what else the user did across the
    network returns agent-telemetry noise, since every host runs system-owned agents
    constantly. The meaningful question is whether the same launch mechanism - a
    parent process spawning fltmc.exe with an unload argument - fired on other hosts
    in the alert window. Multiple hosts in the same window points to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith: \fltMC.exe
        CommandLine|contains: unload
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    filter unload reveals what led to it and what followed - the parent that staged
    the action, reconnaissance, or follow-on execution the removed monitoring was
    meant to cover. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    or other defense tampering - may reveal the attack stages that preceded the
    filter unload and help reconstruct the full timeline. Telemetry removal is often
    one step in a sequence, so prior alerts give the context for why monitoring was
    detached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
