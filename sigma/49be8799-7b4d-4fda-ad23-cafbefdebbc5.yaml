name: Use of Wfc.exe
id: 6111da4f-04cd-4b27-9788-f6d0ef862042
description: |
  Detects execution of wfc.exe, the Workflow Command-line Compiler shipped with
  the Windows SDK. The rule fires when a process whose Image ends in \wfc.exe runs,
  or when a process reports an OriginalFileName of wfc.exe (catching the binary
  even if it was renamed). wfc.exe compiles arbitrary C# embedded in a XOML file
  and is a Microsoft-signed binary on Microsoft's recommended WDAC block list, so
  it can be used to proxy-execute attacker code past application-control policies.
  Legitimate use is confined to a narrow set of .NET workflow developers and build
  systems; off those hosts it is an application-allowlisting bypass. The
  investigation should confirm the binary and its origin path, decode what it was
  asked to compile and run, identify the parent that invoked it, and look for the
  follow-on DLL loads, payload drops, child processes, and network egress that the
  proxy execution was meant to enable.
type: detection
detection_id: 49be8799-7b4d-4fda-ad23-cafbefdebbc5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did wfc.exe run, either by Image ending in \wfc.exe or by reporting an
    OriginalFileName of wfc.exe?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule matches on either the Image path ending in \wfc.exe or an OriginalFileName
    of wfc.exe, so it catches the Workflow Command-line Compiler even when the file
    has been renamed. Read the Image and OriginalFileName from the event and note
    whether the binary is at the expected SDK path or somewhere else, since a renamed
    or relocated wfc.exe is more notable than one launched from its install directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to compile and run .NET workflows with
    the Windows SDK Workflow Command-line Compiler?
  context: wfc.exe is a developer build tool from the Windows SDK. Most users and
    most endpoints never run it; legitimate use is limited to .NET workflow
    developers and build or CI systems. Knowing whether the acting account and the
    host function involve .NET development is often the fastest path to separating a
    benign developer invocation from an application-control bypass on a machine that
    should never compile workflows.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1127.binary_origin
  question: Where does the wfc.exe that ran live, and is that path the expected
    Windows SDK install location?
  context: The Workflow Command-line Compiler normally lives under a Windows SDK
    path such as Program Files (x86)\Microsoft SDKs\Windows\...\bin. A copy running
    from a user-writable directory, a temp or download folder, or a renamed file
    reporting OriginalFileName wfc.exe is a stronger signal of deliberate
    proxy-execution than the in-place SDK binary. Compare the Image path against the
    known SDK location and check whether the file is the signed Microsoft binary or
    an unsigned or relocated copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CurrentDirectory
- source: template:cue_process_tool.mechanism_decode
  question: What did wfc.exe compile and run? Decode its full command line and
    identify the XOML or source file it was given.
  context: The full command line reveals what wfc.exe was asked to do. The abuse
    path passes a .xoml file containing arbitrary C# that the compiler executes
    under a Microsoft-signed binary, bypassing application-control policies. Read the
    command line to identify the input file path and any options, then locate and
    inspect that file to determine whether it carries embedded code rather than a
    legitimate workflow definition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned wfc.exe, and is that parent chain expected for a
    workflow compile?
  context: The parent process reveals how wfc.exe was invoked and where the
    proxy-execution decision was made. Interactive development or a build pipeline
    usually shows a console shell, an IDE, or a CI agent as the parent. An unexpected
    parent such as a script host, mshta.exe, an Office application, or an unknown
    binary points to automated or malicious invocation using the signed compiler to
    run code past allowlisting.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1127.suspicious_children
  question: Did wfc.exe spawn a script host or proxy-execution binary such as
    powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, wscript.exe, or mshta.exe?
  context: A workflow compiler has no legitimate reason to launch command
    interpreters or proxy-execution binaries. When a trusted developer utility is
    abused, the compiled code commonly hands off to one of these children to carry
    out the next stage. The query lists children of wfc.exe on this host that fall
    into the high-risk set; any hit reframes the alert from a compile to a launcher
    for follow-on execution. Inspect the child command line for the action it
    performed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      selection_children:
        Image|endswith:
          - '\powershell.exe'
          - '\powershell_ise.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
      condition: selection and selection_children
    fields:
      - Image
      - CommandLine
- source: attack:T1127.payload_drop
  question: Did files appear in user-writable or atypical paths around the time
    wfc.exe ran, consistent with a compiled payload being written to disk?
  context: The proxy-execution chain often writes a new executable or DLL to a
    user-writable location and then runs it. Watch for files created in temp,
    AppData, the public profile, or other atypical paths in the window around the
    compile. A newly written PE or DLL in one of these directories is the artifact
    the compiler produced; correlate its path with any child process that executed
    it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        file.path|contains:
          - '\Temp\'
          - '\AppData\'
          - '\Users\Public\'
          - '\$Recycle.Bin\'
          - '\ProgramData\'
      condition: selection
    fields:
      - file.path
      - Image
      - User
- source: attack:T1127.dll_sideload
  question: Did wfc.exe load any unsigned or user-writable DLLs?
  context: Trusted developer utilities can be abused by sideloading a malicious DLL
    from a user-writable directory so attacker code runs inside the signed process.
    Examine the modules wfc.exe loaded and flag any that resolve to temp, AppData,
    the public profile, or other non-system paths, or that are unsigned. A DLL
    loaded from outside the normal SDK and system directories indicates code
    execution inside the trusted binary rather than a plain workflow compile.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
- source: attack:T1127.network_egress
  question: Did wfc.exe or its child processes make outbound network connections
    shortly after the compile?
  context: Proxy-execution chains frequently reach out to download a further stage
    or contact command-and-control immediately after running. An outbound connection
    from wfc.exe itself, or from a child it spawned, in the minutes after the alert
    is a strong indication the compile was a delivery step rather than a build task.
    Review the destination and whether it resolves to a known or reputable host;
    rare or newly seen destinations warrant closer inspection.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- source: template:cue_user_actor.baseline
  question: Does this user normally run wfc.exe?
  context: Compare the acting account against its own history. A .NET workflow
    developer may run wfc.exe routinely as part of build work; an account that has
    never run it is more notable. The user role and typical toolset should align
    with .NET development for this to be expected activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent that launched wfc.exe historically routine on this host or
    across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not
    attribute the behavior; the meaningful pivot is which parent process launched
    wfc.exe and whether that pairing is historically common. A new or rare parent
    for wfc.exe on this host or environment-wide is the deviation worth chasing,
    while a parent that already accounts for many prior events is more likely a build
    pipeline or other automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the wfc.exe execution was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope
    of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent and wfc.exe combination fire on other hosts in the
    same window, indicating a coordinated rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the
    network returns agent-telemetry noise, since every host runs system-owned agents
    constantly. The meaningful question is whether the same launch mechanism, a
    parent process spawning wfc.exe, fired on other hosts in the alert window.
    Multiple hosts in the same window points to scheduled or pushed automation; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    wfc.exe execution reveals what led to it and what followed - the parent that
    staged the process, reconnaissance, or follow-on execution the proxy run was
    meant to enable. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    or defense tampering - may reveal the attack stages that preceded the wfc.exe
    execution and help reconstruct the full timeline. Application-control bypass is
    often one step in a sequence, so prior alerts give context for why a signed
    developer tool was used to run code.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's wfc.exe pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate development can run wfc.exe. This query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run
    here, not generic process activity. A new parent process, an unexpected account,
    or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \wfc.exe
      - OriginalFileName: wfc.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's wfc.exe pattern in the past week, and
    does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the wfc.exe firing pattern rather than
    generic process activity. Many hosts firing the same pattern points to a build
    pipeline or scripted deployment that runs the compiler by design; one host or a
    small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \wfc.exe
      - OriginalFileName: wfc.exe
      condition: selection
    fields:
    - host.name
