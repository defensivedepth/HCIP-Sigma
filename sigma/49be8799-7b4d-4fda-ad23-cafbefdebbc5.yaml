    - element: TimeWindow
      dimension: time_correlation
      specific_values: "0-30 minutes (correlation window)"
      disposition: context
      target_question: Q9
      notes: "Correlation window between utility execution, payload write, and egress. Realized as the +30m range on the network_egress question and the +/-15m windows on payload_drop/dll_sideload; no single queryable field."
    - element: ParentProcessAllowList
      dimension: parent_process_analysis
      specific_values: "rationale only"
      disposition: context
      target_question: Q5
      notes: "Known orchestrators (CI/CD agents) that run the utility legitimately. No concrete values in the analytic; realized as the parent-legitimacy judgment in the process_chain and baseline_svc questions."
    - element: AllowedUtilitiesList
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q2
      notes: "Org-specific allow-list of dev utilities on build hosts. No concrete values; realized as the host/user-expectation judgment in host_user_context and the baseline questions."
    - element: DeveloperHosts
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q2
      notes: "List of known dev/build systems where the tool is expected; raise severity off-host. No concrete values; realized as the host-function judgment in host_user_context."
    - element: RarePathRegex
      dimension: tuning_parameter
      specific_values: "binary origin path"
      disposition: context
      target_question: Q3
      notes: "Same path-rarity rationale applied to wfc.exe's own Image path - the binary_origin question asks whether the binary ran from the expected SDK path versus a user-writable location."
    - element: UnsignedOrInvalidSignatureOnly
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q8
      notes: "Toggle to alert only when child/payload is unsigned. No concrete values; realized as the unsigned/user-writable DLL judgment in dll_sideload and the signed-binary check in binary_origin."
    - element: NetworkReputationThreshold
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q9
      notes: "Heuristic for rare/unknown destination. No concrete threshold values; realized as the destination-reputation judgment in network_egress."
