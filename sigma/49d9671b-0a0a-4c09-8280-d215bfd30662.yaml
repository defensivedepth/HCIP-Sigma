    - dropped: cue_process_tool.follow_on
      reason: "follow_on scopes children by ParentImage|endswith %Image% (wmic spawning children), but call terminate does not spawn the impact processes — it kills targets so other processes can act. Post-termination host activity is covered more directly by attack:T1047.time_correlation (+1h host scope) and cue_host_context.clustering."
      kept: attack:T1047.time_correlation
  skipped_templates:
    - template: universal.endpoint_protection_health
      reason: "recommended priority. The defense_tampering technique set is NOT confirmed for this rule, so the generic host-tamper sweep is not superseded; however cue_host_context.precursor already surfaces prior tamper/credential/recon alerts on the host, and the rule's load-bearing context is the termination-effect and impact-staging chain (mechanism_decode, targeted_application, time_correlation, technique_class_lateral). Trimmed to stay within the 14-18 target; tamper-as-precursor is carried by precursor."
  reflection_overrides: []
  hint_dispositions:
    - hint: "LOLBin rule — check for renamed binary and other LOLBins achieving same objective"
      disposition: acted_on
      reason: >-
        Acted on. lolbin.renamed_binary_check (Q15) checks wmic.exe path/original-file-name
        for relocation or renaming, and lolbin.technique_class_lateral (Q18) sweeps for other
        proxy-execution and impact-staging LOLBins (rundll32, regsvr32, mshta, vssadmin,
        diskshadow, etc.), with wmic.exe excluded from the list as the rule's own binary.
    - hint: "logsource 'network_connection' (recommended by techniques: T1047) is not covered — pull in cue_network_endpoint.* or author a custom question with category: network_connection"
      disposition: declined
      reason: >-
        The network_connection logsource in the T1047 analytic exists to correlate the
        remote-execution branch of WMI (wmic /node:<target> process call create, which opens a
        DCOM/WinRM connection to the target). This rule's selection is local process call
        terminate — there is no /node clause, no remote destination, and terminating a local
        process generates no outbound connection. A network_connection query would return
        unrelated host traffic with no tie to the detected behavior. Cross-host scope, the
        genuinely relevant dimension here, is covered by cue_user_actor.clustering_svc (Q12)
        and cue_process_tool.scope (Q14), which count hosts firing the same pattern.
    - hint: "logsource 'wmi' (recommended by techniques: T1047) is not covered and no template family exists — author a custom question with category: wmi"
      disposition: declined
      reason: >-
        The WMI activity channel (Microsoft-Windows-WMI-Activity/Operational, EID 5857-5861)
        records provider and consumer/subscription operations — the persistence and event-driven
        branch of T1047 (__EventFilter / __FilterToConsumerBinding). This rule fires on the
        process_creation event for wmic.exe running call terminate, a one-shot method invocation
        that is fully visible in process_creation (Image, OriginalFileName, CommandLine). The wmi
        channel adds no detail the process_creation evidence lacks for this specific primitive,
        and querying it would surface unrelated WMI provider activity. No __EventFilter /
        subscription behavior is implied by call terminate, so no wmi question was authored.
