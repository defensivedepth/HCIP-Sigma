    - element: RemoteDestinationThreshold
      dimension: tuning_parameter
      specific_values: "rationale only (unique remote hosts via WMI)"
      disposition: context
      target_question: Q12
      notes: "Remote-host counting applies to the remote-execution branch of T1047 (wmic /node lateral). This rule's selection has no /node clause and fires on local process call terminate; the cross-host dimension is addressed by clustering_svc / scope, which count hosts firing the same pattern rather than remote destinations contacted. No DestinationPort/network_connection query authored — see hint_dispositions."
