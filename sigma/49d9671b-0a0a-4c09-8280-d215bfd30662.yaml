name: Application Terminated Via Wmic.EXE
id: c449824d-d497-478e-9c24-6596a1aae48b
description: |
  Detects WMIC invoked to terminate a process via its "call terminate" method.
  The rule fires when a process image ends in WMIC.exe (or carries the original
  file name wmic.exe) AND its command line contains both "call" and "terminate".
  Administrators occasionally use wmic to kill a stuck process, but the same
  primitive is used to mass-terminate database, backup, and virtualization
  processes so their files can be locked or encrypted, and to stop security
  tooling before further action. Determine which process or processes were
  targeted, what launched wmic, whether the acting account and host routinely
  perform this operation, and what ran on the host immediately afterward.
type: detection
detection_id: 49d9671b-0a0a-4c09-8280-d215bfd30662
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did wmic.exe run with a command line containing both "call" and "terminate",
    matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the image ends in WMIC.exe (or the original file name is
    wmic.exe) AND the command line contains both call and terminate. Read the exact
    command line and note the full "process where ... call terminate" clause, since
    the WHERE filter names the targeted process and is the load-bearing detail for
    the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to terminate processes with wmic?
  context: Killing a process through wmic call terminate is a niche administrative
    action; most accounts and most endpoints never do it, preferring taskkill, the
    Task Manager, or service controls. Knowing whether the acting account and the
    host function involve this kind of process management is often the fastest path
    to separating a routine admin cleanup from a deliberate mass-termination.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: Decode the full wmic command line - which process did the call terminate
    target, and was it a single name or a wildcard filter?
  context: The full command line reveals exactly what was killed. Read the WHERE
    clause of the call terminate invocation - a precise "name='target.exe'" names one
    process, while a wildcard such as "name like '%sql%'" or repeated terminate calls
    sweep a class of processes. Database, backup, and virtualization process names
    (sqlservr, mysqld, oracle, vmwp, vbox) being swept points to staging for file
    locking rather than a one-off cleanup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - call
        - terminate
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1047.targeted_application
  question: Which process was terminated, and is that application expected to be
    stopped this way on this host?
  context: The terminate call ends a running process; identify the target from the
    command line WHERE clause and confirm whether that process actually stopped near
    the alert time. A user-facing application or a stuck service being cleared is a
    different finding than a database, backup agent, virtualization process, or
    security tool being killed. Targets that protect or hold open data files are the
    ones that matter, because stopping them frees those files for modification.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - call
        - terminate
      condition: selection
    fields:
      - CommandLine
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this wmic invocation, and is that parent chain
    expected?
  context: The parent process reveals how wmic was invoked. Interactive administration
    usually shows a console shell launched by explorer.exe or a remote-management
    tool; an unexpected parent such as cmd.exe spawned by an Office application, a
    script host, or an unknown binary points to automated or scripted termination.
    Whatever launched wmic is where the decision to kill the target was made.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1047.user_context
  question: Did this wmic termination run under an interactive user or under a service
    or system account?
  context: The privilege and interactivity of the acting context changes the meaning
    of the event. An interactive administrator clearing a hung process is routine;
    the same call terminate running under SYSTEM, a service account, or a remotely
    authenticated session - especially with no logged-on user present - is more
    consistent with scripted or pushed activity. Note the account and whether a person
    was at the keyboard when the kill ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - IntegrityLevel
      - LogonId
- source: attack:T1047.time_correlation
  question: What ran on this host in the window immediately after the wmic
    termination?
  context: Terminating processes is frequently a preparatory step, clearing locks
    held by databases, backup agents, or virtualization so files can be encrypted,
    deleted, or exfiltrated. Examining process creation in the short window after the
    kill reveals what the termination enabled - mass file modification, shadow-copy
    deletion, or further tooling. A burst of activity right after the terminate points
    to the action the kill was meant to clear the way for.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    wmic termination reveals what led to it and what followed - the parent that staged
    it, reconnaissance, or follow-on impact actions. Novel parent-child pairs at low
    counts are what to scan for against the high-count noise of routine system
    processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Does this user normally terminate processes with wmic?
  context: Compare the acting account against its own history. An administrator who
    routinely clears stuck processes may run wmic call terminate as part of normal
    work; an account that has never done so is more notable. The user role and typical
    toolset should align with this kind of process management.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|all:
        - call
        - terminate
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent process and wmic call terminate pattern historically routine
    on this host or across the environment, or is the parent unusual for it?
  context: When the alert fires under a service or system account, user identity does
    not attribute the behavior; the meaningful pivot is which parent process launched
    a wmic call terminate and whether that pairing is historically common. A new or
    rare parent for this pattern on this host or environment-wide is the deviation
    worth chasing, while a parent that already accounts for many prior events is more
    likely a management agent or scripted maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|all:
        - call
        - terminate
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    termination was a single event or part of activity spanning multiple endpoints. If
    the same user triggered similar activity on other hosts, the scope of the incident
    is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent process and wmic call terminate pattern fire on other
    hosts in the same window, indicating a coordinated rollout rather than isolated
    activity?
  context: Under a service or system account, asking what else the user did across the
    network returns agent-telemetry noise, since every host runs system-owned agents
    constantly. The meaningful question is whether the same launch mechanism - a parent
    process spawning a wmic call terminate - fired on other hosts in the alert window.
    Multiple hosts in the same window points to scripted or pushed mass termination; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|all:
        - call
        - terminate
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's wmic call terminate pattern,
    what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate administration can run wmic call terminate. This query
    mirrors the rule's selection structure scoped to this host, so the resulting parent
    and user distribution reflects how this specific firing pattern has historically run
    here, not generic wmic activity. A new parent process, an unexpected account, or a
    first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - terminate
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's wmic call terminate pattern in the past
    week, and does the cross-host distribution look like consistent automation or
    one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the wmic call terminate firing pattern rather than
    generic wmic activity. Many hosts firing the same pattern points to a management
    tool or scripted maintenance that terminates processes by design; one host or a
    small unrelated set points to manual operator activity. Use the host distribution
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - terminate
      condition: all of selection_*
    fields:
    - host.name
- source: template:lolbin.renamed_binary_check
  question: Was wmic.exe executed from its expected System32 path, or from an unusual
    location?
  context: wmic.exe normally runs from C:\Windows\System32\wbem (or the SysWOW64
    equivalent). A wmic.exe running from a user-writable directory such as a temp or
    download folder, or an image whose original file name is wmic.exe under a different
    file name, suggests the binary was copied or renamed to evade path-based allowlists.
    Compare the image path and original file name from the alert event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's wmic call terminate pattern over
    the past 90 days, and what command-line shapes are typical?
  context: A wmic call terminate pattern with no prior history on a host is more notable
    than one used regularly under stable parents. This query mirrors the rule's selection
    structure scoped to this host, so the count reflects the rule's specific firing
    pattern rather than generic wmic usage. The command-line projection lets the analyst
    compare typical termination targets and invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - terminate
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    defense tampering, or lateral movement - may reveal the attack stages that preceded
    the wmic termination and help reconstruct the timeline. Mass process termination is
    often a late, pre-impact step, so prior alerts give the context for why processes
    were being killed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were other proxy-execution or impact-staging LOLBins used on this host
    recently?
  context: Operators who terminate processes through wmic often pair it with other
    living-off-the-land binaries - wmic itself for remote execution, shadow-copy
    deletion through vssadmin or diskshadow, or proxy execution through rundll32,
    regsvr32, or mshta. Finding several such binaries running in the same window
    strengthens the case that the termination was part of a hands-on operation rather
    than an isolated cleanup.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\diskshadow.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\bitsadmin.exe'
          - '\certutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
