name: UEFI Persistence Via Wpbbin - ProcessCreation
id: 184319f2-6d2d-4837-9f31-8f4d431cc85d
description: |
  Detects execution of C:\Windows\System32\wpbbin.exe, a binary written and run by smss.exe very early in boot when
  a Windows Platform Binary Table (WPBT) structure is present in UEFI firmware memory. smss.exe writes the firmware-supplied
  blob to disk, reads its command line from the same UEFI block, verifies a force-integrity signature, and executes it before
  user logon. This is firmware-resident persistence: it requires write access to UEFI tables and a force-integrity-signed PE,
  so it can originate from a legitimate OEM that ships WPBT or from an attacker with firmware-level write access (malicious
  OEM update, UEFI exploit, or physical access). On most enterprise endpoints wpbbin.exe should not exist at all; the
  investigation determines whether this host's hardware vendor legitimately ships WPBT, what the firmware-supplied binary did
  after launch, and whether its appearance correlates with an approved firmware/BIOS update window.
type: detection
detection_id: 4abc0ec4-db5a-412f-9632-26659cddf145
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the triggering process match the rule's pattern — wpbbin.exe running from C:\Windows\System32?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the Image is
    C:\Windows\System32\wpbbin.exe. Confirm the Image path and that the binary actually executed, since wpbbin.exe is written
    and launched by smss.exe from a UEFI-supplied blob rather than by an interactive user or scheduled job.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this host's hardware vendor expected to ship a WPBT firmware binary?
  context: wpbbin.exe should not exist on most enterprise endpoints. It is present only on systems whose OEM ships a Windows
    Platform Binary Table entry in UEFI firmware. Determine whether this host's make/model is a known WPBT-shipping platform
    (some hardware manufacturers use it for legitimate driver or management installers) or whether its presence is unexpected
    for this hardware.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented firmware/BIOS update for this host?
  context: WPBT content is delivered through UEFI firmware, so a legitimate appearance of wpbbin.exe should line up with an
    approved firmware or BIOS update, an OEM management-agent deployment, or a hardware refresh. A corresponding ticket
    suggests authorized activity; absence of one when policy requires change control suggests the firmware was modified outside
    sanctioned channels.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:organizational_context.timing_alignment
  question: Did this activity occur within an approved firmware-update or patch window?
  context: Legitimate firmware delivery is tied to vendor update cycles and maintenance windows. wpbbin.exe appearing for the
    first time outside any approved firmware/BIOS update window — particularly off-hours or following an unscheduled reboot —
    is harder to explain as routine vendor activity and raises the likelihood of firmware tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:organizational_context.human_recall
  question: Does anyone responsible for this host recall a firmware update, BIOS flash, or vendor maintenance action?
  context: Because wpbbin.exe runs before user logon under smss.exe, no interactive user initiated it directly. The relevant
    recall is whether IT, desktop support, or the hardware vendor performed a firmware/BIOS action that would explain a new
    WPBT entry. If no one recalls such an action, the firmware may have been altered through a malicious OEM update, a UEFI
    exploit, or physical access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:organizational_context.procedural_consistency
  question: Is firmware on this host normally delivered through a managed, vendor-controlled process rather than ad hoc?
  context: Organizations typically push firmware and BIOS updates through managed tooling or vendor update services on a known
    cadence. A WPBT-delivered binary appearing outside that managed process may indicate an attacker bypassing normal firmware
    governance, or it may reflect a vendor mechanism the organization has not catalogued. Understanding the normal firmware
    pipeline helps distinguish the two.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What command line did wpbbin.exe run with, and what does the firmware-supplied argument set do?
  context: The command line for wpbbin.exe is read by smss.exe from the same UEFI block that supplied the binary, so it is
    attacker- or vendor-controlled rather than typed by a user. Decode every flag, path, and parameter to understand what the
    firmware-resident binary was instructed to do — file drops, registry writes, network callbacks, or launching further
    tooling. An empty or vendor-style installer command line points toward a legitimate OEM helper; an obfuscated or
    operationally rich command line points toward implant activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - User
- source: template:cue_process_tool.process_chain
  question: What is the parent of wpbbin.exe, and is it the expected smss.exe early-boot launcher?
  context: In the documented WPBT flow, smss.exe writes wpbbin.exe to disk and executes it during early session-manager
    initialization, before the Win32 subsystem is fully up. A parent that is smss.exe near boot is consistent with the
    legitimate mechanism. A different parent, or an smss.exe invocation that does not line up with a boot sequence, suggests
    something other than the genuine firmware-launch path spawned the binary.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did wpbbin.exe spawn after launch?
  context: A force-integrity-signed PROM binary that runs this early can only call ntdll exports, but once execution proceeds
    it may write files, modify the registry, or launch additional tooling. Children such as cmd.exe, powershell.exe,
    certutil.exe, or reg.exe spawned by wpbbin.exe reveal its actual impact and distinguish a benign vendor installer from
    post-boot implant staging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1542.001.firmware_artifact_write
  question: Were files written to firmware-adjacent or system paths around the time wpbbin.exe ran?
  context: The WPBT flow itself writes the firmware blob to C:\Windows\System32\wpbbin.exe, and an implant launched this way
    commonly drops further artifacts. File writes to System32, EFI/boot-related paths, or staging directories correlated with
    the launch window help characterize what the firmware-supplied binary persisted to disk and whether it reached beyond the
    single wpbbin.exe write.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - '\System32\wpbbin.exe'
          - '\Boot\'
          - '\EFI\'
          - '\System Volume Information\'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run wpbbin.exe, what parents and users drove it, and does the current alert fit
    that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects how
    wpbbin.exe has historically executed here rather than generic binary usage. A consistent smss.exe / SYSTEM pattern across
    prior boots is the expected firmware behavior; a new parent, an unexpected account, or an out-of-boot invocation is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image: C:\Windows\System32\wpbbin.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts run wpbbin.exe in the past week, and does the cross-host distribution look like vendor automation
    or isolated activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of wpbbin.exe
    execution. Many hosts of the same hardware make/model running it points to a shared OEM WPBT entry (vendor automation);
    a single host or a small unrelated set points to host-specific firmware that changed independently, which is harder to
    explain benignly. Use the host distribution and hardware consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image: C:\Windows\System32\wpbbin.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does the account under which wpbbin.exe ran normally drive this kind of early-boot activity?
  context: Compare the running account against its historical behavior. Because wpbbin.exe launches under smss.exe before user
    logon, it typically runs as SYSTEM; an unexpected non-system account would itself be anomalous. Zero or very low counts
    for this account running this binary indicate it is not a routine actor for this activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the smss.exe-to-wpbbin.exe parent/binary combination historically routine on this host or environment-wide?
  context: When the alert fires under a service principal such as SYSTEM, the account does not attribute behavior; the
    meaningful pivot is the launch mechanism. Whether the parent-to-binary pair is historically common shows if this is the
    expected firmware-launch path. A pair that already accounts for many prior boots is consistent with vendor or OS
    automation; a new or rare parent for wpbbin.exe is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this account do across the network around the time of this alert?
  context: Tracking the account's activity across all hosts reveals whether the firmware-resident binary's execution coincides
    with broader activity under the same identity. If the same account drove related actions on multiple endpoints, the scope
    of the event may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same smss.exe-to-wpbbin.exe launch fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, account-pivot activity returns broad agent-telemetry noise. The meaningful question is
    whether the same parent-and-binary launch fired on other hosts in the alert window. Multiple hosts firing the same WPBT
    launch in one window points to a shared firmware change or pushed automation; a single host points to a host-local
    firmware trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, credential access, or
    tooling that could enable firmware write access — may reveal the stages that preceded the firmware change and help
    reconstruct the timeline leading to a WPBT entry being planted.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. Alongside a firmware-resident foothold, they commonly
    install backup mechanisms using more conventional techniques — scheduled tasks, services, registry Run keys, BITS jobs, or
    WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than
    isolated vendor activity.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
