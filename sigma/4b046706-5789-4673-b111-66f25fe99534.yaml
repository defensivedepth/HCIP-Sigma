name: Deleted Data Overwritten Via Cipher.EXE
id: 6ef1a59f-c128-4264-8f15-8f49616f6c52
description: |
  Detects cipher.exe invoked with the /w: switch, which overwrites the free space of a drive so that previously
  deleted file content cannot be recovered by forensic tooling. The rule fires when the process is cipher.exe
  (by Image name or original filename) AND the command line contains the /w: wipe flag. Legitimate use exists
  (an administrator securely wiping freed space before decommissioning a host or disk), but in an intrusion this
  is anti-forensic data destruction that often runs alongside shadow-copy deletion, log clearing, and other
  recovery-inhibiting actions. Investigation should confirm the exact wipe target, identify what spawned cipher.exe,
  and determine whether the wipe is part of a broader destruction or anti-forensic sequence on this host or fleet.
type: detection
detection_id: 4b046706-5789-4673-b111-66f25fe99534
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show cipher.exe running with the /w free-space wipe switch?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line and process identity against the rule's criteria - the process must be cipher.exe and the
    command line must carry the /w wipe switch, which targets a path whose volume's free space is overwritten.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to securely wipe free disk space with cipher.exe?
  context: Secure free-space wiping is occasionally a deliberate administrative action - decommissioning a
    host, sanitizing a disk before reassignment, or a compliance-driven wipe. Knowing whether this user role
    and host function routinely perform disk sanitization is often the fastest way to separate sanctioned
    maintenance from anti-forensic destruction.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which drive or path did the /w wipe switch target, and what data lived there?
  context: The /w:<path> argument names the volume whose free space cipher overwrites - the wipe affects the
    entire volume that contains that path, not just the path itself. Decode the full argument to identify the
    targeted drive, then determine what deleted data on that volume the wipe was meant to render unrecoverable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned cipher.exe and is that parent chain expected?
  context: The parent process reveals how the wipe was invoked. An interactive administrator action typically
    traces back to explorer.exe or a console shell; cipher.exe spawned by a script host, an Office application,
    or an unfamiliar dropped binary points to scripted or automated destruction rather than deliberate
    maintenance.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run cipher.exe with a wipe switch?
  context: A host that has never run cipher.exe with the /w wipe switch is more suspicious than one that wipes free space on a
    schedule. Zero or very low historical counts over the window indicate first-time or rare use of the secure
    wipe, which raises the priority of confirming who initiated it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that
    activity, and does the current alert fit that pattern?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how the cipher /w wipe pattern (not generic
    cipher.exe usage) has historically run here. A new parent process, an unexpected account, or an unusual
    command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: CIPHER.EXE
      - Image|endswith: \cipher.exe
      selection_cli:
        CommandLine|contains: ' /w:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: attack:T1485.file_delete
  question: Was there a burst of file deletion or overwrite activity on this host around the wipe?
  context: Free-space overwriting is most damaging when it follows deletion - files are deleted, then the wipe
    renders their residual content unrecoverable. A cluster of file-delete events in the same window from the
    same process or user points to a deliberate delete-then-wipe sequence rather than a standalone sanitization.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - User
- source: attack:T1485.command_analysis
  question: What other recovery-inhibiting or destruction tools ran on this host in the surrounding window?
  context: Anti-forensic free-space wiping commonly runs alongside other destruction - shadow-copy deletion,
    backup removal, log clearing, or recovery disabling. Finding these commands sharing a parent or user with
    the cipher wipe confirms a coordinated destruction sequence and widens the scope of what must be recovered
    or contained.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\fsutil.exe'
          - '\sdelete.exe'
          - '\sdelete64.exe'
          - '\wevtutil.exe'
          - '\reagentc.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - CommandLine
      - User
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the free-space wipe completed?
  context: A free-space wipe is often the closing act of an intrusion, run to destroy evidence after the
    operator finishes. Reviewing process activity immediately after the wipe shows whether the host went quiet,
    whether further destruction followed, or whether cleanup gave way to a fresh stage of activity.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run cipher.exe with a wipe switch?
  context: Compare this user's current action against their historical behavior. A user who has never run a
    secure free-space wipe is more suspicious than one whose role routinely involves disk sanitization. The
    user's typical toolset and responsibilities should align with running a destructive wipe.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and cipher.exe combination historically routine on this host or environment, or is
    the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism: which parent process spawned cipher.exe, and whether that pair is
    historically common. A new or rare parent for cipher.exe is the deviation worth chasing; a pair already
    accounting for many prior events is scheduled maintenance or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the wipe is an isolated action or one
    step in broader hands-on activity. If the same user drove destruction or recovery-inhibiting commands on
    multiple endpoints, the scope of the incident is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and cipher.exe combination fire on other hosts in the same window - is this a
    coordinated rollout or isolated to this host?
  context: 'Under a service principal, the user-pivot returns agent-telemetry noise. The meaningful question is
    whether the same launch mechanism - parent process plus cipher.exe - fired on other hosts in the alert
    window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to
    a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:ransomware_impact.network_wide_impact
  question: Is this same wipe activity firing on other hosts in the environment?
  context: Destruction and anti-forensic wiping are often executed across many hosts in rapid succession.
    Finding the same alert firing on multiple endpoints indicates network-wide destruction and determines the
    scope for containment and incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- source: attack:T1485.network_indicators
  question: Did outbound network activity from this user precede the wipe, suggesting exfiltration before
    destruction?
  context: Operators frequently stage and exfiltrate data before wiping it, so the wipe destroys the local copy
    after the data has already left. Reviewing the user's network-touching tool activity in the hours before the
    wipe helps distinguish pure destruction from an exfiltration-then-destroy sequence.
  range: -6h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_net:
        Image|endswith:
          - '\curl.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\powershell.exe'
          - '\rclone.exe'
          - '\ftp.exe'
          - '\scp.exe'
      condition: selection and selection_net
    fields:
      - host.name
      - Image
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: A free-space wipe rarely happens in isolation. Earlier detections on the same host - credential
    access, recovery inhibition, log clearing, or other destruction - may reveal the attack stages that preceded
    the wipe and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around the wipe?
  context: Destruction is sometimes paired with persistence - an operator wipes evidence while keeping a
    foothold. Scheduled tasks, services, registry Run-key writes, or BITS jobs created in the same timeframe as
    the wipe indicate intentional persistence stacking rather than an isolated sanitization action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts run cipher.exe with the wipe switch in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the cipher /w wipe pattern rather than generic cipher.exe usage. Many hosts firing the same pattern
    points to scripted deployment or vendor automation; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: CIPHER.EXE
      - Image|endswith: \cipher.exe
      selection_cli:
        CommandLine|contains: ' /w:'
      condition: all of selection_*
    fields:
    - host.name
