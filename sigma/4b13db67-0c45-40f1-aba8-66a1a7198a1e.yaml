name: Suspicious Extrac32 Alternate Data Stream Execution
id: 61defc1e-9a2f-4d87-a40b-01ec9d3feba3
description: |
  Detects extrac32.exe invoked with a .cab source and a destination that places a colon between two file paths,
  which designates an NTFS Alternate Data Stream (ADS). This is the Microsoft-signed CAB-extraction utility being
  used to write extracted content into a hidden ADS of an unrelated host file, concealing a payload from directory
  listings and many scanners. Legitimate CAB extraction targets a normal file or directory, not an ADS, and modern
  administration uses expand.exe or package managers instead, so an extrac32 ADS write is investigation-worthy.
  Determine what CAB was extracted, what stream name was written, what process launched extrac32, and whether the
  hidden content was subsequently executed.
type: detection
detection_id: 4b13db67-0c45-40f1-aba8-66a1a7198a1e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line invoke extrac32.exe against a .cab source with a colon-delimited Alternate Data Stream destination?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the
    command line contains both extrac32.exe and .cab AND the destination path uses a colon that is not followed by a
    backslash, which is the NTFS ADS designator (host-file:stream-name). All three must be present together. Confirm
    the colon designates a stream name rather than a drive letter.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to extract CAB archives with extrac32.exe?
  context: Legitimate CAB handling on modern systems is rare and usually tied to printer-driver installers or Windows
    Update, not interactive use. Knowing whether the user role and host function involve packaging or driver work is
    often the fastest path to distinguishing routine activity from abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What CAB source and ADS destination did this extrac32 command operate on? Decode the full command line.
  context: The full command line reveals the source CAB path (local or UNC) and the host-file:stream-name destination
    that received the extracted content. Identify the stream name, the carrier file the stream is attached to, and
    whether the source CAB came from a remote share. The query returns all extrac32 invocations on this host in the
    window so sequential extract-then-execute steps are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'extrac32.exe'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned extrac32.exe and is that parent chain expected?
  context: The parent process reveals how the utility was invoked. CAB extraction driven by a printer-driver installer
    or an update process has a predictable lineage; a parent such as cmd.exe, powershell.exe, wscript.exe, mshta.exe,
    or an Office application points to script-driven or hands-on-keyboard use of the signed binary as a LOLBin.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host run the extrac32 ADS command pattern before?
  context: A command pattern never seen on a host is more suspicious than one that recurs. This counts prior executions
    matching the rule's command-line structure on this host rather than generic extrac32 usage, so zero or very low counts
    indicate a first-time or rare occurrence of the ADS-write behavior here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - extrac32.exe
        - .cab
        CommandLine|re: ':[^\\]'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the extrac32 ADS pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even signed utilities can be abused. The query mirrors the rule's selection scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has historically run here.
    A new parent process, an unexpected user account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - extrac32.exe
        - .cab
        CommandLine|re: :[^\\]
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did extrac32.exe spawn afterward?
  context: extrac32.exe itself does not normally spawn children. Any child process is unexpected and may indicate the
    extracted payload was launched, or that the same parent continued into a post-extraction stage. Look for cmd.exe,
    powershell.exe, rundll32.exe, or other execution proxies started immediately after.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: ADS smuggling is a staging step, not an end state. Activity surrounding the extraction may reveal the
    delivery of the CAB, reconnaissance, persistence installation, or the execution that consumes the hidden stream,
    providing broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired the extrac32 ADS pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic extrac32 usage. Many hosts firing the same pattern points to scripted or vendor
    deployment; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - extrac32.exe
        - .cab
        CommandLine|re: :[^\\]
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - extrac32.exe
        - .cab
        CommandLine|re: :[^\\]
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - extrac32.exe
        - .cab
        CommandLine|re: :[^\\]
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging spread across multiple
    endpoints. If the same user triggered similar activity elsewhere, the scope of the operation may be larger than a
    single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - extrac32.exe
        - .cab
        CommandLine|re: :[^\\]
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: attack:T1564.004.ads_artifact_creation
  question: Was an Alternate Data Stream created on this host around the time of the alert?
  context: The defining artifact of this technique is the ADS write itself. Stream-creation events expose the carrier
    file the stream was attached to and the hash of the hidden content, which confirms whether the colon in the command
    line actually produced a stream and identifies the file now concealing the payload. If stream-creation events are
    not collected in this environment, treat absent results as a visibility gap rather than evidence nothing was written.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: create_stream_hash
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - Hash
- source: attack:T1564.004.ads_payload_execution
  question: Were the files written by extrac32 subsequently opened or executed on this host?
  context: ADS smuggling is a staging step; the hidden content is dangerous only once it is read or run. Correlate file
    activity following the extraction with later process execution to determine whether the carrier file or its stream
    was accessed, copied, or launched. A subsequent execution referencing the carrier file or stream name strongly
    shifts the disposition toward an active payload-delivery chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: how
    the CAB arrived, what happened after the extraction, and whether this is part of a larger sequence. Aggregating by
    image and parent collapses repetitive agent telemetry while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - delivery, reconnaissance, or defense tampering - may reveal the attack
    stages that preceded the ADS write and help reconstruct the full timeline. The alert sequence often tells the story
    of how the staged payload arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
