name: RDP Enable or Disable via Win32_TerminalServiceSetting WMI Class
id: 6a3e88fe-01c2-484d-a92d-26c9ea69c1aa
description: |
  Detects RDP being enabled or disabled through the Win32_TerminalServiceSetting WMI class, invoked from wmic.exe (rdtoggle alias) or PowerShell. The rule fires only when the command line carries both the Win32_TerminalServiceSetting / rdtoggle reference AND the SetAllowTSConnections method on a wmic, powershell, or pwsh process. Toggling RDP this way is a legitimate administrative action during deployment or remote support, but it is also used to open or close the remote-access surface around hands-on-keyboard activity. Determine who ran the command, what value SetAllowTSConnections was set to, what the parent chain and surrounding activity look like, and whether RDP logons or further lateral movement followed.
type: detection
detection_id: 4b8f6d3a-9c5e-4f2a-a7d8-6b9c3e5f2a8d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the WMI RDP-toggle pattern this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact command line and binary against the rule's criteria. The rule fires only when wmic.exe, powershell.exe, or pwsh.exe carries both a Win32_TerminalServiceSetting or rdtoggle reference and the SetAllowTSConnections method. Note the value passed to SetAllowTSConnections — 1 enables RDP, 0 disables it — because that determines whether the action opened or closed the remote-access surface.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enable or disable RDP via WMI?
  context: Legitimate administrators and deployment scripts toggle RDP this way, so knowing whether the user role and host function fit the action is often the fastest triage path. A configuration management or remote-support account on a managed server is routine; the same command from a standard user or a workstation that is not normally administered remotely is not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this WMI command do — which RDP setting was changed and to what value?
  context: The full command line reveals whether RDP was enabled (SetAllowTSConnections 1) or disabled (0), whether a remote node was targeted with a /node argument, and whether the call was wrapped in a larger script. The host-scoped window captures any additional wmic or PowerShell invocations that together form one logical configuration change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - rdtoggle
          - Win32_TerminalServiceSetting
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does it decode to?
  context: When the toggle runs through PowerShell, the SetAllowTSConnections call may be hidden behind base64 -EncodedCommand, string concatenation, or backtick escaping. Decode the command line to confirm the actual method invoked and to surface any download cradle or in-memory execution wrapped around the RDP change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1047.wmi
  question: Do the WMI activity logs show this Win32_TerminalServiceSetting operation, and was it local or remote?
  context: WMI operational events record provider activity independent of the launching process and reveal whether the Win32_TerminalServiceSetting call targeted the local machine or a remote node. A remote-targeted WMI configuration change is a stronger lateral-movement signal than a local one. If WMI operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence the operation did not occur.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - User
      - EventID
      - Operation
- source: attack:T1021.001.security
  question: Were RDP logon events recorded on this host around the time the setting was changed?
  context: Enabling RDP opens the remote-access surface, so a SetAllowTSConnections 1 immediately followed by interactive RDP logons points to access being prepared and then used. Correlate the toggle time with logon events of interest — network and remote-interactive logon types and remote-connection-manager session events. If Security logs are not ingested in this environment, treat zero results as a visibility gap.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4778
          - 4779
      condition: selection
    fields:
      - User
      - LogonType
      - IpAddress
      - EventID
- source: template:cue_process_tool.process_chain
  question: What process spawned this wmic or PowerShell instance, and is that parent chain expected?
  context: The parent reveals how the toggle was invoked. A configuration-management agent, deployment script, or an administrator's interactive shell is expected; an Office application, a database service such as a SQL server process, a script host, or a renamed download tool as parent points to the command running inside an exploitation chain rather than a routine administrative task.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this RDP-toggle pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine configuration tools can be abused. The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how this specific RDP-toggle pattern has historically run here rather than generic wmic or PowerShell usage. A new parent process, an unexpected account, or a first-time appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \wmic.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - wmic.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_method:
        CommandLine|contains:
        - rdtoggle
        - Win32_TerminalServiceSetting
      selection_cli_property:
        CommandLine|contains: SetAllowTSConnections
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \wmic.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - wmic.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_method:
        CommandLine|contains:
        - rdtoggle
        - Win32_TerminalServiceSetting
      selection_cli_property:
        CommandLine|contains: SetAllowTSConnections
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \wmic.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - wmic.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_method:
        CommandLine|contains:
        - rdtoggle
        - Win32_TerminalServiceSetting
      selection_cli_property:
        CommandLine|contains: SetAllowTSConnections
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the RDP toggle is isolated or part of broader movement. If the same account triggered configuration changes or tool execution on multiple endpoints in the same window, the scope of activity is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \wmic.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - wmic.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_method:
        CommandLine|contains:
        - rdtoggle
        - Win32_TerminalServiceSetting
      selection_cli_property:
        CommandLine|contains: SetAllowTSConnections
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: RDP toggling rarely happens in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded opening the remote-access surface and help reconstruct the timeline. Reconnaissance or hotfix-state checks immediately before an RDP enable are a recurring pattern.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.renamed_binary_check
  question: Was wmic.exe or the PowerShell binary executed from an expected system path?
  context: Toggling RDP through a copy of wmic.exe or a standalone PowerShell binary dropped outside System32 or SysWOW64 indicates the binary was relocated or renamed to evade path-based allowlists. A renamed PowerShell binary running from a public or temp directory is more suspicious than the in-box binary in its standard path. Compare the Image path against OriginalFileName.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the RDP-toggle pattern over the past 90 days, and what command-line structures are typical?
  context: A configuration-change pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection scoped to this host, so the count reflects this specific RDP-toggle pattern rather than generic wmic or PowerShell usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \wmic.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - wmic.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_method:
        CommandLine|contains:
        - rdtoggle
        - Win32_TerminalServiceSetting
      selection_cli_property:
        CommandLine|contains: SetAllowTSConnections
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this RDP-toggle pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific RDP-toggle pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \wmic.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - wmic.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_method:
        CommandLine|contains:
        - rdtoggle
        - Win32_TerminalServiceSetting
      selection_cli_property:
        CommandLine|contains: SetAllowTSConnections
      condition: all of selection_*
    fields:
    - host.name
- source: template:lateral_movement.target_activity_after_access
  question: What processes were spawned on this host shortly after the RDP setting was changed?
  context: Enabling RDP is a means to an end. Examining processes spawned in the window after the toggle reveals whether remote access was used to run commands, deploy tools, or stage data. A burst of new process activity following a SetAllowTSConnections 1 indicates the opened surface was exercised.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- source: template:lolbin.technique_class_lateral
  question: Were other remote-access or proxy-execution LOLBins used on this host recently?
  context: An operator who toggles RDP through one living-off-the-land binary often uses several. Check whether other built-in tools commonly abused for remote execution or code proxying ran on this host in the same window. Multiple such binaries performing related actions strengthens the case for hands-on-keyboard activity rather than a single administrative change.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msiexec.exe'
          - '\schtasks.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\netsh.exe'
          - '\at.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
