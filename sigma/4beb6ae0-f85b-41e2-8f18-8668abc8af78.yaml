name: Sysinternals PsSuspend Suspicious Execution
id: 6d8fcc22-7aab-4b38-8274-b91b38bb4994
description: |
  Detects Sysinternals PsSuspend (pssuspend.exe or pssuspend64.exe, identified by Image name or OriginalFileName) being run
  with a command line that references msmpeng.exe, the Windows Defender antimalware service process. Suspending that process
  freezes real-time protection without stopping or uninstalling a service, leaving little trace while malware runs, and can
  be a legitimate administrative or troubleshooting action in rare cases. Determine who ran the tool, whether protection was
  actually frozen, and what executed on the host while the antimalware process was suspended.
type: detection
detection_id: 4beb6ae0-f85b-41e2-8f18-8668abc8af78
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-08'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show pssuspend targeting msmpeng.exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the image or
    original file name is pssuspend.exe or pssuspend64.exe AND the command line references msmpeng.exe. Review the exact
    command line and confirm both halves are present and that the binary is the genuine Sysinternals utility.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to suspend the antimalware process with pssuspend?
  context: Legitimate administrative activity can trigger this detection. Suspending the Defender service process is rarely
    routine outside of specific troubleshooting. Knowing whether the user role and host function are consistent with running
    Sysinternals process-control tools is often the fastest path to distinguishing a true positive from a sanctioned action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned pssuspend and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. An interactive administrator action typically descends from
    explorer.exe or a console shell, while invocation from a script host, an Office application, or an unfamiliar binary
    points to scripted or malicious use. Identifying the immediate parent and what spawned it scopes the operation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.what_was_disabled
  question: Which antimalware process did pssuspend target, and was a process id or name argument used?
  context: The command line reveals exactly what was targeted. PsSuspend accepts either a process name or a numeric process
    id, and a remote-computer argument can direct it at another host. Confirm the target is the Defender antimalware
    process and note whether the suspend ran locally or against a remote machine, since that changes the affected host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is real-time protection currently active, or is the antimalware process still suspended?
  context: Suspending a process is not persistent the way disabling a service is, but a suspended antimalware process stays
    frozen until it is resumed or the host reboots. Checking the current state determines whether the host is still
    unprotected and must be remediated before further investigation. The -r switch resumes a previously suspended target.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the antimalware process was suspended?
  context: Defenses are frozen for a reason, usually to run something that real-time protection would otherwise block or
    quarantine. Examining process activity in the window after the suspend reveals what the tampering was meant to enable.
    A burst of execution while protection was down points to the payload the operator was protecting.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: An operator who suspends antimalware often layers additional tampering, such as stopping services, clearing event
    logs, deleting shadow copies, or adding exclusions, to maximize coverage. Finding several tampering events from the same
    user or parent process in the same window indicates multiple controls were targeted in one operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: attack:T1562.001.registry_set
  question: Were Defender or telemetry registry keys modified on this host around the time of the suspend?
  context: Process suspension freezes protection without leaving a service or registry change, but operators frequently pair
    it with registry edits that disable Defender real-time monitoring, set DisableAntiSpyware, or alter Sysmon configuration.
    Registry modifications around the suspend window indicate a more durable tampering effort beyond the momentary freeze.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetObject|contains:
          - '\Windows Defender\'
          - '\Windows Advanced Threat Protection\'
          - '\Microsoft\Windows Defender\Real-Time Protection'
          - '\Microsoft\Windows Defender\Exclusions'
          - '\SYSTEM\CurrentControlSet\Services\WinDefend'
          - '\SYSTEM\CurrentControlSet\Services\Sense'
          - '\Microsoft\Windows\Windows Error Reporting\'
          - 'SysmonDrv'
      condition: selection_host and selection_paths
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.baseline
  question: Does this host normally run pssuspend?
  context: A process-control utility that has never been seen on a host is more suspicious than one that runs regularly as
    part of an administrative routine. Zero or very low historical counts over the baseline window indicate first-time or
    rare execution of pssuspend here, which raises the weight of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this pattern, what parents and users normally drive it, and does the current
    alert fit?
  context: Even legitimate tools get abused. The query mirrors the rule's selection, scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern (pssuspend targeting the antimalware process), not
    generic pssuspend usage, has historically run here. A new parent, an unexpected account, or an unusual command structure is
    the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: pssuspend.exe
      - Image|endswith:
        - \pssuspend.exe
        - \pssuspend64.exe
      selection_cli:
        CommandLine|contains: msmpeng.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did pssuspend spawn afterward?
  context: The processes a tool spawns reveal its actual impact. PsSuspend itself does little beyond freezing the target, so
    children descending from it are unexpected and may indicate scripted chaining of the suspend with follow-on actions such
    as payload launch or additional tampering.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Defense tampering rarely stands alone. Activity surrounding the suspend may reveal reconnaissance, privilege
    escalation, persistence installation, or data staging that provides broader context for the investigation and helps
    place the suspend within a larger sequence of operator actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this pattern in the past week, and does the cross-host distribution look like automation or
    one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific
    firing pattern rather than generic pssuspend usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; a single host or a small unrelated set points to manual operator activity. Use the distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: pssuspend.exe
      - Image|endswith:
        - \pssuspend.exe
        - \pssuspend64.exe
      selection_cli:
        CommandLine|contains: msmpeng.exe
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: pssuspend.exe
      - Image|endswith:
        - \pssuspend.exe
        - \pssuspend64.exe
      selection_cli:
        CommandLine|contains: msmpeng.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: pssuspend.exe
      - Image|endswith:
        - \pssuspend.exe
        - \pssuspend64.exe
      selection_cli:
        CommandLine|contains: msmpeng.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user suspended antimalware or ran related tampering on several hosts, the scope of the operation may be larger
    than the single alerting machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: pssuspend.exe
      - Image|endswith:
        - \pssuspend.exe
        - \pssuspend64.exe
      selection_cli:
        CommandLine|contains: msmpeng.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as reconnaissance, credential access,
    or other defense tampering, may reveal the stages that preceded the suspend and help reconstruct the full timeline of
    operator activity leading to the antimalware process being frozen.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
