name: Invoke-Obfuscation Obfuscated IEX Invocation
id: 776326fd-a737-42cc-9699-72d5e1397640
description: |
  Detects PowerShell command lines carrying obfuscated IEX (Invoke-Expression) invocation
  patterns generated by the Invoke-Obfuscation framework. The rule fires when the command
  line matches any of several character-indexing and reflection signatures (PSHome/ShellId/
  env-variable index concatenation, ComSpec character slicing, *mdr* member-name lookups, or
  VerbosePreference string coercion) that reconstruct the Invoke-Expression call at runtime
  to evade plain-text command-line inspection. Legitimate administration almost never builds
  IEX this way, so the investigation should reconstruct what the deobfuscated command actually
  executes, confirm the launch context and operator, and determine whether the activity is an
  authorized assessment or hands-on-keyboard intrusion.
type: detection
detection_id: 4bf943c6-5146-4273-98dd-e958fd1e3abf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain one of the obfuscated IEX construction patterns this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line against the rule's signatures -- character-indexing concatenation of PSHome, ShellId, or
    env-variable strings, ComSpec character slicing, a *mdr* member-name lookup, or VerbosePreference string
    coercion. These constructs reassemble the Invoke-Expression call at runtime; confirm one is literally present
    in the alerting command line rather than a coincidental substring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run obfuscated PowerShell command construction?
  context: Legitimate administration and tooling almost never builds Invoke-Expression through character indexing
    or reflection. Knowing whether the user role and host function involve scripted PowerShell automation is often
    the fastest path to separating a sanctioned build pipeline or assessment from a genuine intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this obfuscated PowerShell execution part of an authorized penetration test or red team engagement?
  context: Offensive frameworks routinely emit Invoke-Obfuscation-style command lines during authorized security
    assessments. Before investing investigation time, check whether a pentest or red team exercise is currently
    active on this host or network segment. An authorized engagement with matching tooling and timing resolves the
    alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: What does the obfuscated command deobfuscate to, and what operation does the reconstructed script perform?
  context: The detected signatures hide an Invoke-Expression call behind character indexing, string concatenation,
    and reflection so the intent is not readable at a glance. Reconstruct the indexed and concatenated strings to
    recover the underlying command -- common payloads are download cradles, reverse shells, or in-memory loading
    of .NET assemblies. The reconstructed content determines the scope of the response.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which obfuscation construction did the framework emit, and what does that imply about the launcher?
  context: The Invoke-Obfuscation framework supports multiple string-reconstruction styles, and the specific
    signature that fired -- PSHome or ShellId indexing, env-variable indexing, ComSpec slicing, the *mdr* member
    lookup, or VerbosePreference coercion -- indicates how the operator chose to hide the IEX call. Identifying the
    construction helps match the activity to a known toolchain and gauge operator sophistication.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1059.001.parent_process_analysis
  question: What process spawned the obfuscated PowerShell, and is that parent chain expected?
  context: The parent process reveals how the obfuscated invocation was launched. Office applications, mshta.exe,
    wscript.exe, or an unexpected service parent point toward macro-driven or staged execution, whereas explorer.exe
    or a known automation parent is more consistent with sanctioned activity. Walk up to what spawned the parent if
    the immediate parent is itself a shell or interpreter.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging records the deobfuscated script content that PowerShell actually executes, even when
    the command line is built through character indexing and concatenation. This provides ground truth about what ran,
    bypassing the obfuscation. If PowerShell operational logs are not ingested in this environment, treat zero results
    as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: attack:T1059.001.image_load
  question: Did the PowerShell process load the .NET and automation assemblies associated with reflective in-memory execution?
  context: Reconstructed IEX payloads frequently load .NET assemblies in memory rather than dropping files to disk.
    Image-load events for the PowerShell runtime and automation libraries on this host confirm that the engine
    initialized and can surface rare or unexpected modules tied to reflective loading. If image-load telemetry is
    not collected in this environment, treat the absence of results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_modules:
        ImageLoaded|endswith:
          - '\System.Management.Automation.dll'
          - '\System.Management.Automation.ni.dll'
          - '\amsi.dll'
          - '\clr.dll'
          - '\clrjit.dll'
      condition: selection and selection_modules
    fields:
      - ImageLoaded
      - Image
      - ProcessGuid
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell defenses before running an obfuscated payload. Common
    precursors include AMSI bypass by patching amsi.dll in memory, execution-policy changes, constrained language
    mode escapes, and downgrade to PowerShell v2 to evade logging. Finding these precursor events on the host
    strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:universal.evidence_preservation
  question: Did the obfuscated command reference a file that is still on disk for analysis?
  context: If the reconstructed command writes or references a file -- a downloaded payload, decoded output, or
    staged script -- checking whether it still exists on disk enables deeper analysis such as hash lookups, sandbox
    submission, or content review. File paths for this rule are derived from the command line rather than an Image
    field, so scope the search to paths recovered during deobfuscation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1059.001.follow_on
  question: What child processes did the PowerShell instance spawn afterward?
  context: The processes a deobfuscated payload spawns reveal its actual impact. Reconstructed IEX cradles commonly
    launch cmd.exe, additional PowerShell instances, certutil.exe, rundll32.exe, or downloaded binaries for
    post-exploitation. Unexpected children point to staged execution rather than a self-contained script.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this obfuscation pattern, what parents and users normally drive it,
    and does the current alert fit that pattern?
  context: Even on hosts with prior matches, the launch context tells the story. The query mirrors the rule's
    obfuscation signatures scoped to this host, so the resulting parent and user distribution reflects how this
    specific pattern has historically run here. A new parent process, an unexpected account, or a first-time match
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: \$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\[
      - CommandLine|re: \$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\[
      - CommandLine|re: \$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\[
      - CommandLine|re: \$env:ComSpec\[(?:\s*\d{1,3}\s*,){2}
      - CommandLine|re: \*mdr\*\W\s*\)\.Name
      - CommandLine|re: \$VerbosePreference\.ToString\(
      - CommandLine|re: \[String\]\s*\$VerbosePreference
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell that matches this obfuscation pattern?
  context: Compare this user's current action against their historical behavior. A user who has never produced
    obfuscated PowerShell of this kind is more suspicious than one who does so as part of a known build or testing
    workflow. The query mirrors the rule's signatures scoped to the user so the count reflects this specific pattern,
    not generic PowerShell use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: \$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\[
      - CommandLine|re: \$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\[
      - CommandLine|re: \$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\[
      - CommandLine|re: \$env:ComSpec\[(?:\s*\d{1,3}\s*,){2}
      - CommandLine|re: \*mdr\*\W\s*\)\.Name
      - CommandLine|re: \$VerbosePreference\.ToString\(
      - CommandLine|re: \[String\]\s*\$VerbosePreference
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and PowerShell launch combination historically routine on this host or across the environment?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful
    pivot is the launch mechanism. Which parent process spawned PowerShell, and is that pair historically common. A
    new or rare parent for PowerShell on this host or environment-wide is the deviation worth chasing; a pair that
    already accounts for thousands of prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith: '\powershell.exe'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or repeated execution across
    multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the operation may
    be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and PowerShell combination fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise
    because every host runs system-owned agents constantly. The meaningful question is whether the same launch
    mechanism -- parent process plus spawned PowerShell -- fired on other hosts in the alert window. Multiple hosts
    in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith: '\powershell.exe'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, or credential access -- may reveal the attack stages that preceded the obfuscated execution and
    help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this obfuscation pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's obfuscation signatures with no host scope, so the result is a fleet-wide
    count of this specific firing pattern rather than generic PowerShell usage. Many hosts firing the same pattern
    points to scripted deployment or a shared toolchain; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: \$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\[
      - CommandLine|re: \$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\[
      - CommandLine|re: \$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\[
      - CommandLine|re: \$env:ComSpec\[(?:\s*\d{1,3}\s*,){2}
      - CommandLine|re: \*mdr\*\W\s*\)\.Name
      - CommandLine|re: \$VerbosePreference\.ToString\(
      - CommandLine|re: \[String\]\s*\$VerbosePreference
      condition: selection
    fields:
    - host.name
