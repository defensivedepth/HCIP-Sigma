      reason: >-
        The registry_set channel in the T1003.001 analytic covers the SAM/SECURITY hive-access and
        RunAsPPL-style variants of credential dumping. This rule's selection is specific to LSASS
        memory dumping via the TrolleyExpress command line, with no registry-hive component; the dump
        artifact lands on disk (covered by the file_event question), not in a registry value.
    - hint: 'logsource ''security'' (recommended by techniques: T1003.001) is not covered and no template family exists — author a custom question with `category: security`'
      disposition: declined
      reason: >-
        The security channel (4673 sensitive-privilege use / 4663 object access on lsass) is the
        Windows Security-log equivalent of the Sysmon process_access handle-open evidence. That exact
        access-verification signal is already authored as a process_access question (Sysmon EventCode
        10, GrantedAccess 0x1F0FFF). Adding a parallel security-channel question would duplicate the
        handle-open coverage rather than add a distinct stage.
