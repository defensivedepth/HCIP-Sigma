      reason: >-
        The image_load analytic belongs to the T1218.011 rundll32 chain (a DLL mapped into rundll32
        memory). This rule fires on a renamed/allow-listed Citrix executable invoking a memory dump,
        not on rundll32 loading an atypical DLL; there is no DLL-load stage in the TrolleyExpress
        dump pattern. The load-bearing cross-logsource pivot for this rule is the LSASS handle open,
        covered by the process_access question, not a module load on the dumper.
    - hint: 'logsource ''network_connection'' (recommended by techniques: T1218.011) is not covered — pull in cue_network_endpoint.* or author a custom question with `category: network_connection`'
      disposition: declined
      reason: >-
        Network connection coverage in the brief derives from the T1218.011/T1218 proxy-execution
        analytic where rundll32 fetches a remote .sct/.hta payload. The TrolleyExpress pattern is a
        local LSASS memory dump with no remote-retrieval stage. Post-dump network follow-on (the only
        network angle that applies) is covered by the post-access lateral-movement alert correlation
        rather than a raw network_connection query that would return host-wide egress noise.
    - hint: 'logsource ''registry_set'' (recommended by techniques: T1003.001) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`'
