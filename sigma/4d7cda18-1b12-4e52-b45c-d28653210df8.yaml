      target_question: Q9
      notes: "No fixed value queryable. Operationalized by the +1h blind-window question (activity_after_tampering, Q9), the +/-1h registry/log/file/other-tampering correlation windows (Q6, Q7, Q8, Q10), and the +/-1h actor clustering (Q16, Q17)."
    - element: TargetFilePathPattern
      dimension: tuning_parameter
      specific_values: "rationale only (log file paths or registry hives to monitor)"
      disposition: context
      target_question: Q8
      notes: "Realized as concrete path/key filters in the file_delete question (SysmonDrv, \\Sysmon, \\drivers\\ - Q8) and the registry_set question (SysmonDrv parameters, WINEVT Sysmon channel, EventLog, Autologger - Q6), derived from the rule's Sysmon-driver target."
