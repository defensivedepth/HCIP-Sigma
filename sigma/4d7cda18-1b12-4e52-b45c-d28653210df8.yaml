  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot Q14 and launch-mechanism-pivot Q15)."
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot Q16 and launch-mechanism-pivot Q17)."
      kept: both
    - dropped: cue_process_tool.mechanism_decode
      reason: "replaced_by: defense_tampering.what_was_disabled (brief hint). Phase 2 decode of the unloaded driver is provided by what_was_disabled (Q4), which is specific to identifying the tampering target."
      kept: defense_tampering.what_was_disabled
    - dropped: cue_process_tool.baseline
      reason: "generic Image|endswith \\fltMC.exe host baseline is subsumed by the REFLECTED host-pattern question (baseline_deviation, Q12), which scopes to the rule's full firing pattern (unload + sysmon) rather than all fltMC.exe usage."
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.follow_on
      reason: "follow_on (children of fltMC.exe) is low-yield - fltMC.exe is a control utility that does not spawn payload children; the unload's effect is on the driver, not on child processes. Post-unload host activity is covered by defense_tampering.activity_after_tampering (Q9)."
      kept: defense_tampering.activity_after_tampering
    - dropped: cue_process_tool.clustering
      reason: "Image-only host aggregation overlaps the post-unload host activity view in defense_tampering.activity_after_tampering (Q9) and the actor clustering (Q16); trimmed to stay within the 18-question target."
      kept: defense_tampering.activity_after_tampering
    - dropped: cue_host_context.clustering
      reason: "+/-15m host activity view overlaps defense_tampering.activity_after_tampering (Q9, post-unload window) and other_tampering_activity (Q10). For a blinding rule, the precursor alert timeline (Q18) and the post-tamper activity window carry more weight; trimmed to stay within target."
      kept: defense_tampering.activity_after_tampering
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: defense_tampering.what_was_disabled (brief hint). See dedup_decisions."
    - template: universal.endpoint_protection_health
      reason: "recommended, not must_include. Per its own notes_to_llm, safe to drop when the defense_tampering technique set is confirmed (it is) - its what_was_disabled/other_tampering_activity questions (Q4, Q10) are more specific and supersede this generic host-tamper sweep. This rule IS itself a defense-tampering detection, so the sweep adds no distinct angle."
