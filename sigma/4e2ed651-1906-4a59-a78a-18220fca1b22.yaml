      kept: cue_host_context.clustering
    - dropped: cue_process_tool.baseline
      reason: "host-scoped Image|endswith count is subsumed by cue_process_tool.baseline_deviation, which scopes the rule's full firing pattern to the host over -14d and projects parent/user distribution"
      kept: cue_process_tool.baseline_deviation
  skipped_templates: []
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'security' (recommended by techniques: T1569.002) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The 'security' analytic for T1569.002 keys on EID 4697 (a service installed
        through the Service Control Manager). NirCmd does not create services via the
        SCM — its service subcommands (service stop/start/restart) control existing
        services through the service-control API, and the rule fires on process_creation
        of nircmd.exe with execution verbs, not on service installation. A 4697 query
        would return SCM service installs unrelated to this rule's mechanism. The
        service-effect angle that IS relevant (NirCmd touching service keys/run handlers)
        is covered by the registry_set question (attack:T1569.002.registry_set), which
