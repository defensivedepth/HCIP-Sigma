name: Webshell Hacking Activity Patterns
id: 5d355b77-aa8c-46dd-b216-fdb720426b9e
description: |
  Fires when a web server process spawns a child process that runs a recognized post-exploitation command. The rule matches when EITHER the parent is a known web server binary (caddy.exe, httpd.exe, nginx.exe, php-cgi.exe, w3wp.exe, ws_tomcatservice.exe) OR a Java/Tomcat process identified by its path or catalina arguments; AND EITHER the child runs one of the recognized post-exploitation patterns -- credential dumping via rundll32+comsvcs or procdump/nanodump/ntdsutil/vssadmin, password-protected archiving, net user/localgroup account manipulation, AD enumeration via ldifde/adfind, or encoded download and reconnaissance command lines.
  A web server spawning command shells, enumeration tools, or credential-access utilities is the canonical web-shell execution chain: a planted server-side script translates an HTTP request into local command execution. Note which webserver branch and which child branch fired, because the child branch determines whether the investigation centers on credential access, account manipulation, discovery, or staged download. Legitimate web applications occasionally shell out, so confirm the specific command and the requesting context before escalating.
type: detection
detection_id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did a web server process spawn a child that ran one of the recognized post-exploitation command patterns?
  context: >-
    Confirm the alert is a true positive before investing time. The rule requires
    EITHER a known web server parent (caddy, httpd, nginx, php-cgi, w3wp, a Tomcat
    service, or a Java process identified by a tomcat path or catalina argument) OR a
    Tomcat-characteristic Java parent; AND EITHER a child whose command line matches a
    post-exploitation pattern (rundll32+comsvcs credential dump, password-protected
    archiving, net user/localgroup account changes, AD enumeration, encoded download,
    or recon) OR a child binary in the credential/exfil tool list (ntdsutil, ldifde,
    adfind, procdump, nanodump, vssadmin, fsutil). Read the parent, image, and full
    command line in the event and note which webserver branch and which child branch
    matched -- the child branch sets the investigation focus.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this host expected to run a public-facing web server, and is this user expected to perform this operation?
  context: >-
    A web server spawning command-line tools is expected on some application or build
    servers and never on a workstation. Confirm whether this host legitimately runs the
    web server in the parent field, and whether the account that executed the child is
    consistent with the operation detected. Server worker processes normally run under a
    service account; an interactive or unexpected user running these commands shifts the
    disposition toward compromise.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the spawned child command do? Decode every flag, argument, encoded string, and file path.
  context: >-
    The child command line is the operational payload of the web-shell request. Parse it
    fully -- a rundll32 comsvcs MiniDump call names the target process and dump path; a
    net user /add or net localgroup administrators /add names the account being created or
    elevated; an archiver with -hp or -p header-encrypts staged data; ntdsutil, ldifde, or
    adfind enumerate or extract directory data; FromBase64String, DownloadFile, or
    DownloadString carry an encoded or remote payload. Decode any base64 or concatenated
    string and state the concrete action and its target.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_parent_process.mechanism_decode
  question: What is the web server parent process, and what request or worker context spawned this child?
  context: >-
    Retrieving the parent's own process event shows the web server worker that translated
    an inbound request into local execution. The parent command line and working directory
    can reveal the site root, the application pool or virtual host, and whether the worker
    was a long-running service. For a w3wp or php-cgi parent, correlate the spawn time with
    web access logs to find the request that drove it.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:parent_child.parent_process_legitimacy
  question: Is this web server expected to spawn this child, and what started the web server itself?
  context: >-
    A web server process directly spawning command interpreters, enumeration tools, or
    credential-access utilities is the core signal here -- properly configured web
    applications rarely shell out to these binaries. Tracing the parent's own origin
    (what launched the web server or Java host) confirms whether this is the normal
    service startup chain or an injected execution path. A worker spawning these children
    under a non-interactive context is consistent with web-shell command execution.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did this same web server worker spawn?
  context: >-
    If the web server worker spawned the detected child through a planted server-side
    script, it likely spawned others in the same session -- reconnaissance, credential
    access, archiving, and download steps frequently chain from a single web-shell request.
    Listing the siblings of the same parent instance reveals the full scope of commands
    driven through that worker and distinguishes a single shell-out from an active
    hands-on-keyboard session.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Does this web server normally spawn this type of child process on this host?
  context: >-
    Some web servers legitimately invoke helper binaries during deployment or scheduled
    maintenance, so historical frequency of this specific parent-and-child pairing
    distinguishes routine automation from a novel spawning relationship. Zero or very low
    counts for a web server parent launching a credential-access or enumeration tool point
    to a first-time, anomalous execution worth treating as compromise until explained.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:obfuscation.encoded_payload_decode
  question: Is the child command line encoded or obfuscated, and what does the decoded content do?
  context: >-
    Web-shell operators commonly pass encoded payloads to evade casual inspection. Look for
    base64 markers (FromBase64String, -decode, /decode), PowerShell flags (-NoP, -W Hidden),
    download cradles (DownloadFile, DownloadString), and WMI process-call-create invocations
    in the alerting command line. Decode each layer and state the resulting operation --
    download-and-execute cradle, in-memory loader, credential theft, or remote command
    execution. Multi-layer encoding may require iterating until the payload is readable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_artifact.mechanism_decode
  question: If the child command referenced or downloaded a file, what is that file's content?
  context: >-
    When the child command line contains a DownloadFile, DownloadString, decode, or archive
    path, the referenced file is the staged artifact -- a dropped script, an encoded payload,
    a collected archive, or a credential dump. Retrieve it from the endpoint and read its
    content: check for base64 or otherwise obfuscated strings, embedded URLs or addresses,
    and known malicious string patterns. For binaries, inspect imports, embedded strings, and
    signing status. This content analysis answers what is in the file, distinct from a
    reputation lookup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_artifact.artifact_verification
  question: What is the hash of the referenced or dropped file, and does it have known threat intel detections?
  context: >-
    A file hash is a unique identifier for reputation lookup. Submit the hash of any file
    the child command downloaded, decoded, or wrote to threat intelligence sources to
    determine whether it is known malicious, known benign, or previously unseen. This
    reputation check answers whether the file is known, which is distinct from reading what
    the file contains.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Hashes
- source: template:cue_user_target.artifact_verification
  question: If the child created or modified an account, did the change succeed in the Security event log?
  context: >-
    The net user /add and net localgroup administrators /add branches of this rule fire on
    the command, but the Windows Security log confirms whether the change completed. Event
    4720 (account created), 4732 or 4756 (member added to an administrative group), and 4724
    (password reset) confirm the result. A successful local administrator addition originating
    from a web server worker is a direct privilege-establishment step.
  range: +15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4720
          - 4722
          - 4724
          - 4728
          - 4732
          - 4756
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - SubjectUserName
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance or enumeration commands run on this host around the same time?
  context: >-
    A single enumeration command may be troubleshooting, but several reconnaissance commands
    in rapid succession -- whoami, net user, nltest, adfind, ldifde, ipconfig -- is the
    signature of post-compromise enumeration driven through a web shell. Attackers map the
    host, domain accounts, and trust relationships before moving to credential access or
    lateral movement. Three or more distinct recon binaries in a tight window typically
    indicates automated discovery.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: attack:T1018.network_indicators
  question: Did the web server host make outbound network connections to internal systems or external addresses right after the child ran?
  context: >-
    Remote system discovery and the staged-download branches of this rule pivot from local
    command execution to the network -- enumeration tools probe other hosts, and download
    cradles reach out to retrieve a payload. Outbound connections from the web server host in
    the minutes after the child executed reveal whether the activity progressed to lateral
    movement or to retrieving a second stage. Exclude known service and update endpoints when
    triaging the destinations.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- source: template:initial_access.delivery_vector
  question: What web request drove this execution?
  context: >-
    Web-shell command execution begins with an inbound HTTP request that the planted
    server-side script translates into a local command. Correlate the spawn time of the
    web server worker with web server access logs to find the originating request, the
    requested URL or script path, the source address, and the user agent. Identifying the
    request and the web-shell file enables removing the shell, blocking the source, and
    searching for other hosts hit by the same request pattern.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_webserver_image:
        ParentImage|endswith:
        - \caddy.exe
        - \httpd.exe
        - \nginx.exe
        - \php-cgi.exe
        - \w3wp.exe
        - \ws_tomcatservice.exe
      selection_webserver_characteristics_tomcat1:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        ParentImage|contains:
        - -tomcat-
        - \tomcat
      selection_webserver_characteristics_tomcat2:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        CommandLine|contains:
        - catalina.jar
        - CATALINA_HOME
      selection_child_1:
        CommandLine|contains|all:
        - rundll32
        - comsvcs
      selection_child_2:
        CommandLine|contains|all:
        - ' -hp'
        - ' a '
        - ' -m'
      selection_child_3:
        CommandLine|contains|all:
        - net
        - ' user '
        - ' /add'
      selection_child_4:
        CommandLine|contains|all:
        - net
        - ' localgroup '
        - ' administrators '
        - /add
      selection_child_5:
        Image|endswith:
        - \ntdsutil.exe
        - \ldifde.exe
        - \adfind.exe
        - \procdump.exe
        - \Nanodump.exe
        - \vssadmin.exe
        - \fsutil.exe
      selection_child_6:
        CommandLine|contains:
        - ' -decode '
        - ' -NoP '
        - ' -W Hidden '
        - ' /decode '
        - ' /ticket:'
        - ' sekurlsa'
        - .dmp full
        - .downloadfile(
        - .downloadstring(
        - FromBase64String
        - process call create
        - 'reg save '
        - whoami /priv
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_webserver_* and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_webserver_image:
        ParentImage|endswith:
        - \caddy.exe
        - \httpd.exe
        - \nginx.exe
        - \php-cgi.exe
        - \w3wp.exe
        - \ws_tomcatservice.exe
      selection_webserver_characteristics_tomcat1:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        ParentImage|contains:
        - -tomcat-
        - \tomcat
      selection_webserver_characteristics_tomcat2:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        CommandLine|contains:
        - catalina.jar
        - CATALINA_HOME
      selection_child_1:
        CommandLine|contains|all:
        - rundll32
        - comsvcs
      selection_child_2:
        CommandLine|contains|all:
        - ' -hp'
        - ' a '
        - ' -m'
      selection_child_3:
        CommandLine|contains|all:
        - net
        - ' user '
        - ' /add'
      selection_child_4:
        CommandLine|contains|all:
        - net
        - ' localgroup '
        - ' administrators '
        - /add
      selection_child_5:
        Image|endswith:
        - \ntdsutil.exe
        - \ldifde.exe
        - \adfind.exe
        - \procdump.exe
        - \Nanodump.exe
        - \vssadmin.exe
        - \fsutil.exe
      selection_child_6:
        CommandLine|contains:
        - ' -decode '
        - ' -NoP '
        - ' -W Hidden '
        - ' /decode '
        - ' /ticket:'
        - ' sekurlsa'
        - .dmp full
        - .downloadfile(
        - .downloadstring(
        - FromBase64String
        - process call create
        - 'reg save '
        - whoami /priv
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_webserver_* and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Web-shell command execution rarely happens in isolation. Earlier detections on the same
    host -- the initial exploitation of the web application, prior reconnaissance, or defense
    tampering -- may reveal the attack stages that preceded this child execution and help
    reconstruct the timeline from initial access to hands-on-keyboard activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
