name: Operator Bloopers Cobalt Strike Modules
id: 803be431-74c5-4c5a-a2e6-fb3fce38e20d
description: |
  Detects Cobalt Strike Beacon module and command names typed directly into a Windows command shell (cmd.exe). The rule fires when the process is cmd.exe (by Image or OriginalFileName) AND the command line contains one of several Cobalt Strike aggressor-script or module tokens (Invoke-UserHunter, Invoke-ShareFinder, Invoke-Kerberoast, Invoke-SMBAutoBrute, Invoke-Nightmare, zerologon, av_query). These tokens are Beacon-console syntax, not native Windows commands; their appearance in cmd.exe usually means an operator fat-fingered a command into the host shell instead of the Beacon console ("operator blooper"). Legitimate causes are rare. Investigation should confirm the exact token, decode the surrounding command line, establish how cmd.exe was launched and by whom, and pull the host and fleet context that distinguishes a hands-on-keyboard intrusion from an authorized red-team exercise.
type: detection
detection_id: 4f154fb6-27d1-4813-a759-78b93e0b9c48
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain a Cobalt Strike module/command token, and is the process cmd.exe?
  context: Confirm the alert is a true positive by reviewing the exact command line and process identity against the rule's criteria. The rule requires both that the process is cmd.exe (by Image or OriginalFileName) AND that the command line contains one of the Cobalt Strike tokens (Invoke-UserHunter, Invoke-ShareFinder, Invoke-Kerberoast, Invoke-SMBAutoBrute, Invoke-Nightmare, zerologon, av_query). Note which token fired - it identifies the intended capability (discovery, Kerberoasting, the ZeroLogon exploit, an AV survey).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run Cobalt Strike-style commands at the shell?
  context: Legitimate use of these specific tokens at a Windows shell is rare. Knowing whether the user role and host function plausibly involve security tooling - a penetration tester's workstation, a sanctioned tooling host - is often the fastest path to separating an authorized exercise from a live intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this command part of an authorized penetration test or red team engagement?
  context: Cobalt Strike is a commercial offensive platform used in sanctioned security assessments, and the detected tokens map to its discovery and credential-access modules. Before investing further analysis, check whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement with matching tooling and timing resolves the alert without deeper investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which Cobalt Strike capability does the detected token represent?
  context: The tokens map to distinct capabilities - Invoke-UserHunter and Invoke-ShareFinder are PowerView discovery, Invoke-Kerberoast and Invoke-SMBAutoBrute are credential access, Invoke-Nightmare and zerologon are privilege-escalation exploits (PrintNightmare, ZeroLogon), and av_query is an aggressor AV survey. The token that fired determines the scope of potential compromise and which follow-on activity to look for.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What exactly does the full command line do? Decode the arguments around the Cobalt Strike token.
  context: The full command line reveals the action attempted. Because these are Beacon-console tokens rather than native Windows commands, the shell likely could not execute them - but the surrounding text (targets, output paths, switches, additional chained commands) still shows operator intent. Decode any flags, target hosts, output file paths, and command chaining. The query scopes to cmd.exe executions on this host within the window and filters to the rule's tokens so the result stays on the operation rather than all shell activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - Invoke-UserHunter
          - Invoke-ShareFinder
          - Invoke-Kerberoast
          - Invoke-SMBAutoBrute
          - Invoke-Nightmare
          - zerologon
          - av_query
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1059.003.command_analysis
  question: Did other cmd.exe invocations on this host carry suspicious switches or command chaining around the alert?
  context: Beyond the flagged token, operators leave a trail of shell activity - reconnaissance switches (/c ping, /k whoami), output redirection to files, and command chaining (&&, ^, |). Reviewing the surrounding cmd.exe command lines on this host shows whether the blooper sits inside a broader hands-on-keyboard session.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \cmd.exe
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned cmd.exe, and is that parent chain expected?
  context: The parent process shows how the shell was launched. Interactive operator use typically descends from explorer.exe or a terminal; cmd.exe spawned from an unusual parent such as a Beacon host process, a script host (wscript.exe, mshta.exe), an Office application, or rundll32.exe points to malicious automation or injected execution rather than a user typing at a console.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did cmd.exe spawn afterward?
  context: The processes spawned by the shell reveal whether the operator moved past the failed token into real execution - rundll32.exe or regsvr32.exe loading a payload, powershell.exe for in-memory tooling, net.exe or nltest.exe for discovery, or remote-execution helpers for lateral movement. Predictable, benign children argue for a one-off; a chain of post-exploitation tools argues for an active intrusion.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here - not generic cmd.exe usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing. For most hosts this pattern has no history at all, which itself is meaningful.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: Cmd.Exe
      - Image|endswith: \cmd.exe
      selection_cli:
        CommandLine|contains:
        - Invoke-UserHunter
        - Invoke-ShareFinder
        - Invoke-Kerberoast
        - Invoke-SMBAutoBrute
        - Invoke-Nightmare
        - zerologon
        - av_query
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: Cmd.Exe
      - Image|endswith: \cmd.exe
      selection_cli:
        CommandLine|contains:
        - Invoke-UserHunter
        - Invoke-ShareFinder
        - Invoke-Kerberoast
        - Invoke-SMBAutoBrute
        - Invoke-Nightmare
        - zerologon
        - av_query
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: Cmd.Exe
      - Image|endswith: \cmd.exe
      selection_cli:
        CommandLine|contains:
        - Invoke-UserHunter
        - Invoke-ShareFinder
        - Invoke-Kerberoast
        - Invoke-SMBAutoBrute
        - Invoke-Nightmare
        - zerologon
        - av_query
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar shell activity on other hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: Cmd.Exe
      - Image|endswith: \cmd.exe
      selection_cli:
        CommandLine|contains:
        - Invoke-UserHunter
        - Invoke-ShareFinder
        - Invoke-Kerberoast
        - Invoke-SMBAutoBrute
        - Invoke-Nightmare
        - zerologon
        - av_query
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this firing pattern rather than generic cmd.exe usage. Many hosts firing the same tokens points to a sanctioned, scripted assessment; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: Cmd.Exe
      - Image|endswith: \cmd.exe
      selection_cli:
        CommandLine|contains:
        - Invoke-UserHunter
        - Invoke-ShareFinder
        - Invoke-Kerberoast
        - Invoke-SMBAutoBrute
        - Invoke-Nightmare
        - zerologon
        - av_query
      condition: all of selection_*
    fields:
    - host.name
- source: attack:T1059.003.tuning_parameter
  question: Did cmd.exe or its children read from or write to staging directories such as %TEMP% or C:\Users\Public around the alert?
  context: Operator shell activity frequently stages helpers and output in user-writable directories - %TEMP%, C:\Users\Public, ProgramData - and pulls payloads from the same locations. File creation tied to this host's shell activity in those paths helps distinguish a stray typed command from a session that was already moving files. Batch files or output dropped into these directories are a tuning signal for genuine operator activity.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \Temp\
          - \Users\Public\
          - \ProgramData\
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Hands-on-keyboard operators frequently weaken AV/EDR before running tooling. This query surfaces direct attempts to disable protection services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal - kernel-level or in-memory tampering will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - reconnaissance, defense tampering, credential access - may reveal the attack stages that preceded the typed Cobalt Strike token and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: attack:T1059.003.time_correlation
  question: Did this activity occur outside this host's normal working hours?
  context: Shell execution of operator tooling during non-working hours - nights, weekends, maintenance windows when no interactive user should be present - is more consistent with automation or hands-on-keyboard intrusion than with routine administration. Compare the alert timestamp against expected working hours and known maintenance windows for this host and user.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - User
