    - hint: "logsource 'registry_set' (recommended by techniques: T1548.002) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: acted_on
      reason: >-
        Authored Q7 (attack:T1548.002.registry_set) with category: registry_set,
        querying the HKCU shell-handler hijack paths
        (launcher.Systemsettings\Shell, exefile\shell, Folder\shell\open\command,
        DelegateExecute) on this host. This is the precise cross-logsource pivot
        for this bypass — the registry write that redirects auto-elevated slui.exe
        is the smoking gun and is invisible to the process_creation rule.
    - hint: "logsource 'image_load' (recommended by techniques: T1548.002) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The image_load analytic for T1548.002 targets DLL-side-load / COM-surrogate
        bypass families (e.g., dllhost.exe loading cmstplua.dll). This rule's bypass
        is registry-handler based: slui.exe follows an HKCU key and spawns
        changepk.exe — no anomalous module load is part of the mechanism. image_load
        on slui/changepk would return baseline OS module noise with no precision for
        this chain. The mechanism is covered at registry granularity by Q7
        (attack:T1548.002.registry_set) and at process granularity by Q1/Q2. No
        compensating attack:T1548.002.image_load question authored.
    - hint: "logsource 'process_access' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        The process_access analytic (Sysmon EID 10) targets handle-injection /
