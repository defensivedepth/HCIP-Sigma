name: Suspicious RunAs-Like Flag Combination
id: 483a9b94-341e-42da-8cdd-2b49a8541856
description: |
  Detects a command line that combines a user-targeting flag (such as -u system, --system, -u administrator,
  or -u NT...) with a command-execution flag (such as -c cmd, -c powershell, --command, -c whoami, -c wscript,
  or -c cscript). This switch combination is characteristic of PsExec-like tools and custom hacking utilities
  that run an arbitrary command as a chosen privileged identity. Legitimate administrative tooling can use these
  flags, so the investigation should confirm the exact identity and command requested, identify what launched the
  tool, and determine whether the activity fits this user/host and the environment's automation.
type: detection
detection_id: 50d66fb0-03f8-4da0-8add-84e77d12a020
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line both target a privileged identity and request a command to run?
  context: The rule fires only when a single command line contains both a user-targeting flag (such as -u system,
    --system, -u administrator, or -u NT...) and a command-execution flag (such as -c cmd, -c powershell, --command,
    -c whoami, -c wscript, or -c cscript). Confirm both halves are present in the exact command line before investing
    further time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a tool that executes commands as another privileged identity?
  context: Legitimate administration and deployment tooling can run commands as SYSTEM or an administrator account.
    Knowing whether this user role and host function normally perform privileged remote-style execution is often the
    fastest way to separate routine operations from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly was requested — which target identity and which command did the flags specify?
  context: Decode the full command line of the alerting process. Identify the privileged identity selected by the
    user flag (SYSTEM, a built-in NT account, or an administrator) and the exact command passed to the execution
    flag, including any nested cmd or powershell arguments, encoded content, or downstream tool names. The combination
    reveals what the operator intended the elevated context to do.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this tool and is that parent chain expected?
  context: The parent process reveals how the tool was launched. Interactive administration usually descends from
    explorer.exe or a console session, while invocation from script hosts (wscript.exe, cscript.exe), Office
    applications, or remote-execution services points toward scripted or operator-driven activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this flag combination, what parents and users normally drive it, and
    does the current alert fit that pattern?
  context: The query mirrors the rule's user-flag and command-flag selections scoped to this host, so the resulting
    parent and user distribution reflects how this specific runas-style firing pattern has historically run here. A
    new parent process, an unexpected account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_user:
        CommandLine|contains:
        - ' -u system '
        - ' --user system '
        - ' -u NT'
        - ' -u "NT'
        - ' -u ''NT'
        - ' --system '
        - ' -u administrator '
      selection_command:
        CommandLine|contains:
        - ' -c cmd'
        - ' -c "cmd'
        - ' -c powershell'
        - ' -c "powershell'
        - ' --command cmd'
        - ' --command powershell'
        - ' -c whoami'
        - ' -c wscript'
        - ' -c cscript'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did the elevated command spawn afterward?
  context: The processes spawned by the requested command reveal its actual impact. A runas-style invocation that
    spawns cmd.exe, powershell.exe, reconnaissance binaries, or download utilities under the chosen identity points
    toward hands-on-keyboard activity rather than a benign administrative one-off.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this flag combination in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's user-flag and command-flag selections with no host scope, so the result is a
    fleet-wide count of this runas-style firing pattern. Many hosts firing the same pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the
    host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_user:
        CommandLine|contains:
        - ' -u system '
        - ' --user system '
        - ' -u NT'
        - ' -u "NT'
        - ' -u ''NT'
        - ' --system '
        - ' -u administrator '
      selection_command:
        CommandLine|contains:
        - ' -c cmd'
        - ' -c "cmd'
        - ' -c powershell'
        - ' -c "powershell'
        - ' --command cmd'
        - ' --command powershell'
        - ' -c whoami'
        - ' -c wscript'
        - ' -c cscript'
      condition: all of selection*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_user:
        CommandLine|contains:
        - ' -u system '
        - ' --user system '
        - ' -u NT'
        - ' -u "NT'
        - ' -u ''NT'
        - ' --system '
        - ' -u administrator '
      selection_command:
        CommandLine|contains:
        - ' -c cmd'
        - ' -c "cmd'
        - ' -c powershell'
        - ' -c "powershell'
        - ' --command cmd'
        - ' --command powershell'
        - ' -c whoami'
        - ' -c wscript'
        - ' -c cscript'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_user:
        CommandLine|contains:
        - ' -u system '
        - ' --user system '
        - ' -u NT'
        - ' -u "NT'
        - ' -u ''NT'
        - ' --system '
        - ' -u administrator '
      selection_command:
        CommandLine|contains:
        - ' -c cmd'
        - ' -c "cmd'
        - ' -c powershell'
        - ' -c "powershell'
        - ' --command cmd'
        - ' --command powershell'
        - ' -c whoami'
        - ' -c wscript'
        - ' -c cscript'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar privileged execution on multiple hosts, the scope of the activity
    may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_user:
        CommandLine|contains:
        - ' -u system '
        - ' --user system '
        - ' -u NT'
        - ' -u "NT'
        - ' -u ''NT'
        - ' --system '
        - ' -u administrator '
      selection_command:
        CommandLine|contains:
        - ' -c cmd'
        - ' -c "cmd'
        - ' -c powershell'
        - ' -c "powershell'
        - ' --command cmd'
        - ' --command powershell'
        - ' -c whoami'
        - ' -c wscript'
        - ' -c cscript'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what
    led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, or persistence mechanisms surrounding the runas-style execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal
    the stages that preceded this event and help reconstruct the timeline. Privileged command execution is often a
    later stage that follows initial access and tooling deployment.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR
    services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful
    "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here.
    Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to
    identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: attack:T1021.lateral_execution
  question: Did this host establish remote-administration connections around the time the elevated command ran?
  context: Tools that run commands as SYSTEM or an administrator are commonly used for remote execution against other
    hosts. Outbound connections on remote-administration ports (SMB, RPC endpoint mapper, RDP, WinRM, SSH) close to
    the alert window indicate the elevated command may be reaching other systems rather than acting locally.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
