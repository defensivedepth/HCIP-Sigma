name: Potential Shim Database Persistence via Sdbinst.EXE
id: 6707b7a4-ea2e-40ff-a6bd-d4052594c750
description: |
  Detects installation of an application compatibility shim database via sdbinst.exe with a .sdb file on
  the command line, while excluding the known IIS Express msiexec-installed shim. Application shims are a
  legitimate Windows compatibility mechanism, but a shim database can carry RedirectShim or InjectDll
  behavior that loads attacker-controlled code into a target process at startup, giving persistence and
  potential privilege escalation that survives reboots. Installing a shim registers entries under
  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\{InstalledSDB,Custom} and writes the
  .sdb to %WINDIR%\AppPatch\Custom\; the investigation should determine who installed the shim, what
  target application and DLL it affects, and whether the install was authorized.
type: detection
detection_id: 517490a7-115a-48c6-8862-1a481504d5a8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-05'
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event show sdbinst.exe (or a binary with that original filename) running with a .sdb file on the command line?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when the image is sdbinst.exe (or its OriginalFileName is sdbinst.exe) AND the command line contains '.sdb', and the IIS Express shim installed by msiexec.exe is excluded. Verify both conditions are present and read the full .sdb path the install pointed at.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to install application compatibility shims?
  context: Shim installation requires administrative rights (HKLM write) and is uncommon outside of specific software deployments. A developer machine or a host running legacy applications may legitimately install shims; a typical workstation or server installing one ad hoc under an interactive or unexpected account is more notable. Knowing whether this user role and host function fit shim installation is often the fastest triage step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full sdbinst.exe command line, and what .sdb file and path did it install?
  context: The command line reveals the exact shim database being installed. Read the full .sdb path and any switches (for example /q for silent install). Note whether the .sdb sits in the default %WINDIR%\AppPatch\Custom location or in a user-writable folder such as a profile, Temp, or Public directory, which is more consistent with an operator staging a malicious shim before installing it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: What process spawned sdbinst.exe, and what started that parent?
  context: Shim installation driven by a software installer or a deployment tool is routine; sdbinst.exe spawned from an interactive shell, a script host, an Office application, or a freshly written binary is the suspicious path. Tracing the parent's own origin shows whether the chain came from a legitimate install or from hands-on-keyboard activity. The IIS Express shim installed via msiexec.exe is already excluded by the rule, so an msiexec parent here would carry a different .sdb.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn around this time?
  context: If the parent that launched sdbinst.exe also spawned other processes, those siblings reveal the broader scope of the activity. A parent that staged a file, installed the shim, and then launched a target application or a shell points to an orchestrated persistence setup rather than an isolated install.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1546.011.registry_persistence
  question: Were AppCompatFlags shim registry keys created or modified on this host around the install time?
  context: Installing a shim registers it under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\<GUID> and, for application-targeted shims, under AppCompatFlags\Custom\<target.exe>\<GUID>. Correlating a registry write to these keys with the sdbinst.exe execution confirms the shim was actually registered and names the target application that will load the shim. Tune out known-good shim GUIDs and paths already present from approved software.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\AppCompatFlags\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: attack:T1546.011.sdb_file_drop
  question: Where on disk was the .sdb file written, and was it staged in a user-writable folder before the install?
  context: A shim database written into %WINDIR%\AppPatch\Custom is the normal install destination, but a .sdb that first appears in a profile, Temp, Public, or other user-writable directory is consistent with an operator staging a malicious shim before running sdbinst.exe. The file event also shows which process wrote the .sdb, which may differ from sdbinst.exe itself.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.sdb'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1546.011.dll_injection
  question: Did any process load a DLL from %WINDIR%\AppPatch on this host after the shim was installed?
  context: The InjectDll shim type causes a specified DLL to load into a target application every time it starts, which is how an application shim turns into persistent code execution. A module loaded from %WINDIR%\AppPatch (especially the Custom subfolders) into a normal application, or a load of an unexpected DLL into the shim's target binary, indicates the shim is delivering an injected payload rather than a compatibility fix.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains: '\AppPatch\'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously installed shims matching this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the parent/user distribution reflects how shim installation specifically has run here, not generic sdbinst.exe usage. A new parent process, an unexpected user account, or a first-ever firing is the deviation worth chasing; a host that regularly installs shims via the same deployment parent is likely routine.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sdbinst.exe
      - OriginalFileName: sdbinst.exe
      selection_cli:
        CommandLine|contains: .sdb
      filter_optional_iis:
        ParentImage|endswith: \msiexec.exe
        CommandLine|contains:
        - :\Program Files (x86)\IIS Express\iisexpressshim.sdb
        - :\Program Files\IIS Express\iisexpressshim.sdb
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts installed shims matching this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of shim installs matching this pattern rather than generic sdbinst.exe usage. Many hosts firing the same pattern points to scripted deployment or vendor software rollout; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sdbinst.exe
      - OriginalFileName: sdbinst.exe
      selection_cli:
        CommandLine|contains: .sdb
      filter_optional_iis:
        ParentImage|endswith: \msiexec.exe
        CommandLine|contains:
        - :\Program Files (x86)\IIS Express\iisexpressshim.sdb
        - :\Program Files\IIS Express\iisexpressshim.sdb
      condition: all of selection_* and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sdbinst.exe
      - OriginalFileName: sdbinst.exe
      selection_cli:
        CommandLine|contains: .sdb
      filter_optional_iis:
        ParentImage|endswith: \msiexec.exe
        CommandLine|contains:
        - :\Program Files (x86)\IIS Express\iisexpressshim.sdb
        - :\Program Files\IIS Express\iisexpressshim.sdb
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sdbinst.exe
      - OriginalFileName: sdbinst.exe
      selection_cli:
        CommandLine|contains: .sdb
      filter_optional_iis:
        ParentImage|endswith: \msiexec.exe
        CommandLine|contains:
        - :\Program Files (x86)\IIS Express\iisexpressshim.sdb
        - :\Program Files\IIS Express\iisexpressshim.sdb
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of this alert?
  context: Tracking the user's activity across all hosts reveals whether the shim install is isolated or part of broader activity such as lateral movement or persistence stacking on multiple endpoints. The same user installing shims or running admin tooling on several hosts in the window widens the likely scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sdbinst.exe
      - OriginalFileName: sdbinst.exe
      selection_cli:
        CommandLine|contains: .sdb
      filter_optional_iis:
        ParentImage|endswith: \msiexec.exe
        CommandLine|contains:
        - :\Program Files (x86)\IIS Express\iisexpressshim.sdb
        - :\Program Files\IIS Express\iisexpressshim.sdb
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Persistence installation is rarely the first stage. Earlier detections on the same host — reconnaissance, credential access, defense tampering, or initial execution — may reveal how the operator gained the admin rights needed to install a shim and help reconstruct the timeline leading to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. After installing a shim, an operator commonly stacks backup mechanisms using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:persistence_scope.file_based_persistence
  question: Were files dropped to Startup folders or Run key paths on this host around the same time?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup folder or a path referenced by a registry Run key achieves persistence without running standard persistence tools. File event monitoring captures these drops even when the operator avoids them, and a drop alongside a shim install points to layered persistence.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
