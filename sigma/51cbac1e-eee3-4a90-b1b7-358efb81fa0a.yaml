name: Potential Windows Defender Tampering Via Wmic.EXE
id: bf323173-3a08-40b9-b56d-8812bdc05a2a
description: |
  Detects wmic.exe (matched by image name or PE OriginalFileName, so a renamed copy still triggers) invoked with
  a command line that targets the Defender WMI namespace - /Namespace:\\root\Microsoft\Windows\Defender. Both
  conditions must be present together: the wmic binary AND the Defender-namespace reference. The MSFT_MpPreference
  class under that namespace lets a caller add scan exclusions (ExclusionPath, ExclusionProcess, ExclusionExtension),
  disable real-time monitoring, or change reporting settings without the Defender UI. Legitimate administration and
  some endpoint-management tooling occasionally touch this namespace, but it is also a common way to blind Defender
  before dropping or running a payload, and on hosts without Tamper Protection the change succeeds silently. The
  investigation should determine which setting was changed, whether the control is still weakened, what ran after,
  and whether the change is attributable to a known administrative action.
type: detection
detection_id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show wmic targeting the Defender WMI namespace (/Namespace:\\root\Microsoft\Windows\Defender)?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both
    conditions hold together - the binary is wmic (by image name or PE OriginalFileName) AND the command line references
    the Defender WMI namespace /Namespace:\\root\Microsoft\Windows\Defender. Read the full command line and confirm both
    are present, then note what the WMIC verb is doing (a Get is a read/query; a call Add or set is a modification).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to change Defender settings from the command line via WMIC?
  context: Legitimate administration, security tooling, and some endpoint-management agents can touch the Defender WMI
    namespace. Knowing whether the user role and host function are consistent with command-line Defender configuration is
    often the fastest path to separating a true positive from routine operations. A security administrator on a managed
    workstation is a different disposition than an ordinary user account, or a service principal, suddenly modifying
    Defender preferences.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which Defender setting did this WMIC command change - an exclusion, real-time monitoring, or reporting?
  context: The full command line reveals the specific Defender preference targeted under MSFT_MpPreference. Parse the WMIC
    verb and arguments - call Add ExclusionPath, ExclusionProcess, or ExclusionExtension carves a hole in scanning;
    DisableRealtimeMonitoring turns off active protection; MAPSReporting or SubmitSamplesConsent changes cloud telemetry.
    The exact value being excluded (a directory, a process name, or a file extension) tells you what the operator wants
    Defender to ignore, which points at where a payload will land or run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_artifact.mechanism_decode
  question: For any path or process named in the exclusion, what is at that location and is it legitimate?
  context: When the WMIC command adds an ExclusionPath or ExclusionProcess, the value is the location the operator wants
    Defender to stop scanning. Resolve the excluded path or process name on the host and inspect what is there - a script,
    an executable, a staging directory under a user profile, Temp, ProgramData, or Public. Check for obfuscation, encoded
    strings, embedded URLs, or known-bad indicators. An exclusion that points at an empty or not-yet-populated path is a
    pre-staging signal that a payload is about to be dropped there.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:universal.evidence_preservation
  question: Is a file present at the excluded path or process location for analysis?
  context: If the WMIC command excluded a path or process, checking whether a file already exists at that location enables
    deeper analysis - hash lookups, sandbox submission, or content review. Exclusions are frequently added before the
    payload is dropped, so absence does not clear the alert; it suggests the staging location to watch. Presence of an
    executable or script at an excluded path is a high-value artifact for confirming intent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:defense_tampering.protection_status
  question: Is the Defender exclusion or setting still in effect, or has it been reverted?
  context: The change may be temporary (added for a single action and removed) or persistent. Checking the current Defender
    configuration reveals whether the host remains weakened. If an exclusion is still present or real-time monitoring is
    still off, the control should be restored before further investigation. A get against MSFT_MpPreference, or the
    Defender UI/management console, shows the live exclusion and protection state to compare against the alerting command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What ran on this host after the Defender setting was changed?
  context: Operators weaken Defender for a reason - to drop or run a payload, dump credentials, or perform actions that
    would otherwise be blocked or flagged. Examining process creation in the window immediately after the exclusion was
    added reveals what the change was meant to enable. Activity originating from a newly excluded path, or execution that
    coincides with the exclusion, is the behavior the tampering was setting up.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned wmic and is that parent chain expected?
  context: The parent process reveals how WMIC was invoked. Direct interactive use comes from an admin shell; scripted use
    comes from cmd.exe or a script host. An auto-elevating system binary or an unexpected parent - for example a process
    that consumes a registry shell hijack to run an elevated command without a consent prompt - points at a UAC-bypass
    primitive being used to apply the Defender change with an elevated token. Walk up the tree to see what launched the
    parent and what else it spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host around the same time?
  context: Operators who weaken one control often weaken several - adding a Defender exclusion AND clearing logs AND
    deleting shadow copies AND stopping security services creates maximum coverage. Multiple tampering events from the same
    user or parent process indicate several controls were targeted in one operation rather than an isolated administrative
    tweak. Look for clustered tampering tooling beyond the single WMIC command that fired this alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run WMIC or change Defender settings?
  context: Compare this user's current action against their historical behavior. A user who has never run WMIC, or never
    touched Defender configuration, is more suspicious than one who does so as part of a known administrative workflow.
    The user role and typical toolset should align - security and IT administrators may use it; ordinary user accounts
    rarely do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+wmic combination historically routine on this host or across the environment, or is the parent unusual for wmic?
  context: When the alert fires under a service principal, user identity does not attribute the behavior. The meaningful
    pivot is the launch mechanism - which parent process spawned WMIC, and whether that pair is historically common. A new
    or rare parent for WMIC on this host or environment-wide is the deviation worth chasing; a pair that already accounts
    for thousands of prior events is vendor or OS automation such as a management agent.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: attack:T1047.remote_wmi
  question: Did wmic make any outbound network connections around the time of the alert?
  context: WMIC can execute against a remote host (for example via a /Node argument), in which case the local process opens
    a network connection to the target over the WMI/DCOM port range. Outbound connections from wmic to another host
    indicate the Defender change may have been pushed remotely or that the same operator is reaching other endpoints. No
    connection is consistent with a purely local Defender modification on this host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \WMIC.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1047.wmi_provider
  question: Did WMI operational events record provider activity correlated with this command?
  context: WMIC running a class method leaves a trail in the WMI-Activity operational channel - provider load, query, and
    method-execution events that record the namespace and operation independently of the process_creation event. These
    events confirm the MSFT_MpPreference operation actually executed against the Defender namespace and can surface
    WMI activity that did not come through a visible wmic.exe process. If WMI operational logging is not collected in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Operation
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution or persistence LOLBins used on this host recently?
  context: Operators who use one LOLBin often use several - if WMIC was used to weaken Defender, check whether other
    living-off-the-land binaries were used to execute code or establish a foothold in the same timeframe. Finding multiple
    LOLBins in sequence strengthens the case for hands-on-keyboard activity rather than a one-off administrative command.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\mavinject.exe'
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\certutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was wmic executed from its expected System32 or SysWOW64 path?
  context: WMIC executed from a non-standard path (outside System32 or SysWOW64) may indicate the binary was copied or
    renamed to evade path-based allowlists. The genuine utility lives at C:\Windows\System32\wbem\WMIC.exe or the
    SysWOW64 equivalent; a copy running from a user's temp directory, Downloads, or AppData is more suspicious than one in
    the standard location. Compare the Image path against the embedded OriginalFileName, since the rule matches a renamed
    copy on either field.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's WMIC-Defender pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine administration can touch the Defender namespace. The query mirrors the rule's selection structure
    scoped to this host - the resulting parent and user distribution reflects how the rule's specific firing pattern (not
    generic WMIC usage) has historically run here. Deviations - a new parent process, an unexpected user account, an
    unusual command-line shape - are the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains: /Namespace:\\\\root\\Microsoft\\Windows\\Defender
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's WMIC-Defender pattern over the past 90 days, and what command-line shapes are typical?
  context: A WMIC-Defender pattern with no prior history on a host is more suspicious than one used regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the resulting count reflects the
    rule's specific firing pattern (not generic WMIC usage). The CommandLine projection lets the analyst compare typical
    invocation shapes against the alerting one - a recurring management Get reads very differently from a first-ever call
    Add ExclusionPath.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains: /Namespace:\\\\root\\Microsoft\\Windows\\Defender
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - reconnaissance, privilege escalation,
    an initial-access exploit, or other defense tampering - may reveal the attack stages that preceded this Defender
    change and help reconstruct the timeline. A Defender exclusion following an exploitation or elevation alert reads very
    differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1562
      name: Impair Defenses
      role: primary
    - id: T1047
      name: Windows Management Instrumentation
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: tamper_command_execution
      description: "Actor runs wmic against the Defender WMI namespace (MSFT_MpPreference) to add an exclusion or change a protection setting"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 1
      label: tamper_target_decode
      description: "Decode which Defender preference was changed - ExclusionPath/Process/Extension, DisableRealtimeMonitoring, reporting settings"
      mapped_to: Q3
      source: template:defense_tampering.what_was_disabled
    - stage: 2
      label: control_state
      description: "Determine whether the control is still weakened or was reverted (registry/service edits disabling security tools - the persisting effect)"
      mapped_to: Q6
      source: template:defense_tampering.protection_status
    - stage: 3
      label: enabled_activity
      description: "Correlate process creation after the tampering with the activity it was meant to enable"
      mapped_to: Q7
      source: template:defense_tampering.activity_after_tampering
    - stage: 1
      label: wmi_mechanism
      description: "T1047 WMI execution chain - process creation, command execution, WMI provider operation, and any remote connection"
      mapped_to: Q13
      source: attack:T1047.wmi_provider
  dimension_coverage:
    - dimension: process_identification
      technique: T1562
      covered_by: Q8
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: time_correlation
      technique: T1562
      covered_by: Q7
      source: template:defense_tampering.activity_after_tampering
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1562
      covered_by: Q3
      source: template:defense_tampering.what_was_disabled
      coverage_type: direct
    - dimension: time_correlation
      technique: T1047
      covered_by: Q12
      source: attack:T1047.remote_wmi
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1047
      covered_by: Q13
      source: attack:T1047.wmi_provider
      coverage_type: direct
    - dimension: user_context
      technique: T1047
      covered_by: Q10
      source: template:cue_user_actor.baseline
      coverage_type: direct
  mutable_dispositions:
    - element: SuspiciousCommandPatterns
      dimension: tuning_parameter
      specific_values: "wmic process call, powershell Invoke-WmiMethod, MSFT_MpPreference call Add/set"
      disposition: context
      target_question: Q3
      notes: "what_was_disabled (Q3) is KEEP_EXACT and ProcessGuid-scoped; the rule already enforces the /Namespace:\\root\\Microsoft\\Windows\\Defender pattern, and Q3 directs the analyst to decode the MSFT_MpPreference verb/arguments. The rule's own Defender-namespace selection is reflected verbatim into Q16/Q17, so the suspicious-pattern filter is enforced there."
    - element: WMIQueryScope
      dimension: tuning_parameter
      specific_values: "\\root\\cimv2, \\root\\subscription, \\root\\Microsoft\\Windows\\Defender"
      disposition: query_injection
      target_question: Q16
      notes: "The rule's selection_cli already restricts to the \\root\\Microsoft\\Windows\\Defender namespace; this exact namespace constraint is reflected verbatim into the baseline_deviation (Q16) and historical_lolbin_baseline (Q17) queries."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only - correlation window for WMI process creation and remote connection"
      disposition: context
      target_question: Q12
      notes: "remote_wmi (Q12) uses a +/-15m correlation window to link the WMIC process to any outbound connection; threshold is a tuning rationale, not a queryable value."
    - element: UserContext
      dimension: user_context
      specific_values: "interactive vs SYSTEM vs low-privileged users"
      disposition: context
      target_question: Q10
      notes: "user-actor baseline (Q10) pivots on user identity; the parent+binary substitute (Q11) carries the service-principal/SYSTEM case where user.name does not attribute behavior."
    - element: RemoteDestinationThreshold
      dimension: tuning_parameter
      specific_values: "rationale only - number of unique remote hosts contacted via WMI in a window"
      disposition: context
      target_question: Q12
      notes: "remote_wmi (Q12) projects DestinationIp/Port/Hostname so the analyst can count distinct remote targets; no fixed threshold to inject."
    - element: ProcessWhitelist
      dimension: process_identification
      specific_values: "rationale only - authorized admin tools that change settings during maintenance"
      disposition: context
      target_question: Q11
      notes: "Allow-list is environment-specific; baseline_svc (Q11) and baseline_deviation (Q16) let the analyst distinguish recurring management automation from one-off activity."
    - element: ServiceNamePatterns
      dimension: tuning_parameter
      specific_values: "security-critical services - AV, EDR, firewall"
      disposition: query_injection
      target_question: Q9
      notes: "other_tampering_activity (Q9) keys on tampering tool images plus CommandLine filters covering service stop/disable and Defender/firewall changes; the security-service-name angle is surfaced there for clustered tampering."
  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair - non-deduplicable; emitted BOTH (Q10 user-pivot, Q11 parent+binary substitute) per service-principal default"
      kept: both
    - dropped: cue_artifact.artifact_verification
      reason: "Distinct from mechanism_decode in principle, but the rule fires on a Defender exclusion ADD, where the excluded path is frequently empty or not-yet-populated at alert time - a basename hash/reputation lookup returns nothing until the payload lands. cue_artifact.mechanism_decode (Q4) covers identifying and inspecting whatever IS at the excluded location, and evidence_preservation (Q5) surfaces a file at that path with Hashes available for reputation via file_event projection. Dropped to stay within the 18-question cap; the file-content and file-presence angles are both covered."
      kept: template:cue_artifact.mechanism_decode
    - dropped: cue_process_tool.scope
      reason: "Fleet-wide rule-pattern count overlaps lolbin.historical_lolbin_baseline (Q17, host-scoped 90d rule-pattern count) and the host-scoped reflected baseline_deviation (Q16). Dropped to stay within the 18-question cap while keeping the host-scoped reflected baselines which carry the rule-pattern framing."
      kept: template:lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.baseline
      reason: "Generic 90d binary-frequency count is superseded by the reflected lolbin.historical_lolbin_baseline (Q17) which counts the rule's specific Defender-namespace firing pattern rather than all wmic executions."
      kept: template:lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.follow_on
      reason: "Child-process-of-wmic scope overlaps defense_tampering.activity_after_tampering (Q7), which surfaces post-tampering host activity more broadly than only direct children of WMIC (the enabled payload is usually launched by a separate parent, not by wmic itself). Kept the activity_after_tampering framing."
      kept: template:defense_tampering.activity_after_tampering
    - dropped: cue_process_tool.clustering + cue_host_context.clustering
      reason: "Generic same-host activity sweeps; defense_tampering.activity_after_tampering (Q7), other_tampering_activity (Q9), lolbin.technique_class_lateral (Q14), and precursor (Q18) already surface the surrounding-activity dimensions with more specificity. Dropped to stay within the 18-question cap."
      kept: template:defense_tampering.activity_after_tampering
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "Network-wide user-activity pair; for this tampering rule the load-bearing scope questions are cross-host firing of the same pattern (reflected baselines Q16/Q17) and remote WMI (Q12). Dropped the clustering pair to stay within the 18-question cap."
      kept: template:cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.mechanism_decode
      reason: "replaced_by defense_tampering.what_was_disabled (Q3) per hint and template replaced_by field."
      kept: template:defense_tampering.what_was_disabled
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: defense_tampering.what_was_disabled (Q3) - acted on per hint; mechanism_decode skipped, what_was_disabled serves Phase 2 decode of the targeted Defender setting."
    - template: universal.endpoint_protection_health
      reason: "RECOMMENDED tier. Dropped per its own notes_to_llm drop-condition (a): the defense_tampering technique set is confirmed for this rule and its what_was_disabled (Q3), protection_status (Q6), activity_after_tampering (Q7), and other_tampering_activity (Q9) are more specific than the generic host-tamper sweep. The rule itself detects defense tampering, so the generic sweep would largely re-report the alerting event plus other tamper actions already covered by other_tampering_activity (Q9). cue_host_context.precursor (Q18) additionally surfaces prior tamper alerts on the host."
    - template: persistence_scope.process_based_persistence
      reason: "RECOMMENDED tier; persistence_scope was pulled in by the wmic.exe binary match, but a Defender exclusion add (MSFT_MpPreference call) is a defense-evasion action, not a persistence-installation action (applicability is_persistence_rule is false). The post-change foothold dimension is covered by activity_after_tampering (Q7) and lolbin.technique_class_lateral (Q14), whose Image list includes the persistence tools (schtasks, at, sc, reg, bitsadmin). Dropped to stay within the 18-question cap."
    - template: persistence_scope.file_based_persistence
      reason: "RECOMMENDED tier. Startup-folder / Run-key file drops are a parallel persistence mechanism, but this rule detects a Defender-setting change, not persistence; evidence_preservation (Q5) covers file-event drops at the excluded path, which is the load-bearing file angle for this rule. Dropped to stay within the 18-question cap."
  reflection_overrides: []
  hint_dispositions:
    - hint: "cue_artifact: derived: [A-Za-z]:\\ in CommandLine"
      disposition: acted_on
      reason: >-
