    - element: RemoteDestinationThreshold
      dimension: tuning_parameter
      specific_values: "rationale only (count of unique remote hosts in a window)"
      disposition: query_injection
      target_question: Q5
      notes: "No numeric threshold supplied; the aggregated network-connection question surfaces the distinct remote destinations contacted in the window for the analyst to gauge fan-out."
    - element: SuspiciousCommandPatterns
      dimension: tuning_parameter
      specific_values: "wmic process call create (matched by the rule)"
      disposition: query_injection
      target_question: Q3
      notes: "mechanism_decode (ADAPT_STRUCTURALLY) tightened with the rule's CommandLine|contains|all process/call/create for Q-vs-query alignment; the created-process question (Q4) reads the resulting child."
