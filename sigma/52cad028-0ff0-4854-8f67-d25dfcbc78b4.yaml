  mutable_dispositions:
    - element: ChildProcessList
      dimension: tuning_parameter
      specific_values: "powershell.exe, cmd.exe, mshta.exe, wscript.exe (and the rest of the rule's 15-binary child list)"
      disposition: context
      target_question: Q1
      notes: >-
        The full child list is the rule's own selection block and is enumerated in Q1's question/context. The detection
        is Image-only (no CommandLine), so the child set is enforced by the rule itself and surfaced for triage rather
        than re-injected.
    - element: CHMPathRegex
      dimension: tuning_parameter
      specific_values: "rationale only (no fixed paths in brief)"
      disposition: context
      target_question: Q3
      notes: >-
        The CHM path is read from hh.exe's ParentCommandLine in the delivery-vector question; no fixed path values
        exist to inject.
    - element: NetworkDestinationAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q9
      notes: "Destination triage handled by the child network_connection question; no allowlist values to inject."
    - element: ChildProcessList
      dimension: tuning_parameter
      specific_values: "regsvr32.exe, rundll32.exe, installutil.exe, msbuild.exe (proxy-execution children that load modules)"
      disposition: new_question
      target_question: Q8
      notes: "Module-loading children drove the authored image_load question."
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "-enc, -EncodedCommand, -nop (PowerShell)"
      disposition: context
      target_question: Q7
      notes: >-
        Rule has no CommandLine selection (Image-only). Encoded-command decode is entity-scoped (ProcessGuid), which
        auto-satisfies alignment; specific flags named in Q7 context, not injected, to avoid a parameter-filter claim
        with no host-scoped CommandLine constraint.
    - element: SuspiciousCommandPatterns
      dimension: tuning_parameter
      specific_values: "wmic process call, powershell Invoke-WmiMethod"
      disposition: context
      target_question: Q10
      notes: "WMI command patterns named in Q10 context; the wmi-logsource question pivots on operational events, not CommandLine."
    - element: WMIQueryScope
      dimension: tuning_parameter
      specific_values: "root\\cimv2, root\\subscription"
      disposition: context
      target_question: Q10
      notes: "WMI namespaces named in Q10 context."
    - element: ScriptStoragePath
      dimension: tuning_parameter
      specific_values: "%TEMP%, C:\\Users\\Public, external drives"
      disposition: context
      target_question: Q6
      notes: "Script/payload paths surfaced by decoding the child's full command line (the decode-command-line question) and named in context."
