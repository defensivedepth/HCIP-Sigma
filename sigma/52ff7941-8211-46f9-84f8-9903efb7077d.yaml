name: HackTool - PPID Spoofing SelectMyParent Tool Execution
id: b1d8bcce-7a1d-41ce-8650-fd7c3c423994
description: |
  Detects execution of a parent-process-ID spoofing tool, identified by the
  SelectMyParent.exe binary name, characteristic command-line tokens
  (PPID-spoof, -spawnto, and related variants), an OriginalFileName or
  Description naming the tool, or a known import hash. The tool spawns a child
  process while forging its parent via PROC_THREAD_ATTRIBUTE_PARENT_PROCESS, so
  the child's recorded parent becomes an operator-chosen process rather than the
  real creator. The technique both evades parent-image-based detections and, when
  the chosen parent runs as SYSTEM, lets the child inherit a SYSTEM token for
  privilege escalation. Because the falsepositive rate is very low, the
  investigation should confirm the signature, decode which parent PID and child
  binary were chosen, locate the spawned child and whether it inherited an
  elevated token, and establish whether the activity belongs to an authorized
  engagement.
type: detection
detection_id: 52ff7941-8211-46f9-84f8-9903efb7077d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this process match the PPID-spoofing tool signature by binary name,
    command-line tokens, original filename, description, or known import hash?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when any one of several identifiers is present - an image ending
    in SelectMyParent.exe, a command line containing a spoof token (PPID-spoof,
    ppid_spoof, spoof-ppid, ppidspoof, spoofedppid, or -spawnto), an OriginalFileName
    or Description naming the tool, or one of the tool's known import hashes. Read the
    exact event and note which identifier matched and what the full command line shows,
    since a rename that only matches on import hash or original filename is a stronger
    evasion signal than a tool run under its own name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
      - Hashes
- source: template:universal.host_user_context
  question: Is this user and host expected to run process-parent-spoofing tooling?
  context: Parent-PID spoofing tools have effectively no legitimate administrative
    use outside security testing. A small set of system binaries assign an explicit
    parent during normal operation (for example consent.exe or svchost.exe during a
    UAC prompt), but a standalone spoofing utility is not one of them. Knowing whether
    the acting account and host belong to a tester or a security team is often the
    fastest path to separating a sanctioned test from hands-on-keyboard intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this tool execution part of an authorized penetration test or red team
    engagement?
  context: Parent-PID spoofing tools are used in authorized offensive security
    assessments. Before investing investigation time, check whether a penetration test
    or red team exercise is currently active on this host or network segment. An
    authorized engagement with matching tooling and timing resolves the alert without
    further analysis; the absence of one on a high-confidence hacktool signature
    raises the priority sharply.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which parent PID and child binary did the operator choose for the spoof?
  context: The tool takes a target parent and a binary to launch under it - in its
    canonical form a child executable followed by a parent PID, or a -spawnto path
    naming the binary to run. Read the full command line to identify the chosen parent
    and the spawned binary. A child such as cmd.exe or powershell.exe launched under a
    SYSTEM parent (lsass.exe, services.exe, winlogon.exe, wininit.exe) indicates a
    token-inheritance attempt for privilege escalation, while a routine binary under a
    user-level parent points to evasion of parent-image-based detection alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1134.004.spoofed_child
  question: Was a child process created under a SYSTEM or otherwise sensitive parent
    in the spoof window, and does its real lineage look forged?
  context: The spoof makes the spawned child report an operator-chosen parent instead
    of the tool, so the child does not appear as a child of the tool in process
    telemetry. Look instead for processes created on this host around the alert whose
    recorded parent is a high-value SYSTEM process - lsass.exe, services.exe,
    winlogon.exe, or wininit.exe - which are the parents chosen to inherit a SYSTEM
    token. A normal user binary suddenly parented by one of these, with no matching
    service or logon activity, is the forged child. Confirming the true creator
    requires kernel process-start telemetry that records the real creating process ID
    alongside the reported parent; if that telemetry is not collected, treat the
    recorded parent as unreliable for these events.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_parent:
        ParentImage|endswith:
          - '\lsass.exe'
          - '\services.exe'
          - '\winlogon.exe'
          - '\wininit.exe'
      condition: selection_host and selection_parent
    fields:
      - Image
      - ParentImage
      - CommandLine
      - User
      - IntegrityLevel
- source: template:cue_process_tool.process_chain
  question: What process actually launched the spoofing tool, and is that parent chain
    expected?
  context: The tool's own parent is recorded truthfully - only the parent of the child
    it spawns is forged. The real launching process reveals how the tool reached the
    host and who ran it. An interactive shell, a script host such as powershell.exe or
    wscript.exe, or a recently dropped binary as the parent points to hands-on-keyboard
    operation or a delivery chain worth tracing upward.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the PPID-spoofing tool pattern, what
    parents and users drove it, and does the current alert fit?
  context: This query mirrors the rule's selection structure scoped to this host, so
    the resulting parent and user distribution reflects how this specific tool
    signature has historically run here, not generic process activity. For a
    high-confidence hacktool signature the expected baseline is usually zero - any
    prior hits are themselves worth reviewing, and a first-ever occurrence on this host
    is the common case and raises severity.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SelectMyParent.exe
      - CommandLine|contains:
        - PPID-spoof
        - ppid_spoof
        - spoof-ppid
        - spoof_ppid
        - ppidspoof
        - spoofppid
        - spoofedppid
        - ' -spawnto '
      - OriginalFileName|contains:
        - PPID-spoof
        - ppid_spoof
        - spoof-ppid
        - spoof_ppid
        - ppidspoof
        - spoofppid
        - spoofedppid
      - Description: SelectMyParent
      - Hashes|contains:
        - IMPHASH=04D974875BD225F00902B4CAD9AF3FBC
        - IMPHASH=A782AF154C9E743DDF3F3EB2B8F3D16E
        - IMPHASH=89059503D7FBF470E68F7E63313DA3AD
        - IMPHASH=CA28337632625C8281AB8A130B3D6BAD
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the PPID-spoofing tool pattern in the past week, and
    does the cross-host distribution look like a coordinated test or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the tool signature rather than generic process
    activity. Several hosts firing the same signature in a short span points to a
    sanctioned red team sweep or a spreading operation; a single host or a small
    unrelated set points to isolated operator activity. Use the host distribution to
    calibrate severity alongside the authorized-engagement check.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SelectMyParent.exe
      - CommandLine|contains:
        - PPID-spoof
        - ppid_spoof
        - spoof-ppid
        - spoof_ppid
        - ppidspoof
        - spoofppid
        - spoofedppid
        - ' -spawnto '
      - OriginalFileName|contains:
        - PPID-spoof
        - ppid_spoof
        - spoof-ppid
        - spoof_ppid
        - ppidspoof
        - spoofppid
        - spoofedppid
      - Description: SelectMyParent
      - Hashes|contains:
        - IMPHASH=04D974875BD225F00902B4CAD9AF3FBC
        - IMPHASH=A782AF154C9E743DDF3F3EB2B8F3D16E
        - IMPHASH=89059503D7FBF470E68F7E63313DA3AD
        - IMPHASH=CA28337632625C8281AB8A130B3D6BAD
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SelectMyParent.exe
      - CommandLine|contains:
        - PPID-spoof
        - ppid_spoof
        - spoof-ppid
        - spoof_ppid
        - ppidspoof
        - spoofppid
        - spoofedppid
        - ' -spawnto '
      - OriginalFileName|contains:
        - PPID-spoof
        - ppid_spoof
        - spoof-ppid
        - spoof_ppid
        - ppidspoof
        - spoofppid
        - spoofedppid
      - Description: SelectMyParent
      - Hashes|contains:
        - IMPHASH=04D974875BD225F00902B4CAD9AF3FBC
        - IMPHASH=A782AF154C9E743DDF3F3EB2B8F3D16E
        - IMPHASH=89059503D7FBF470E68F7E63313DA3AD
        - IMPHASH=CA28337632625C8281AB8A130B3D6BAD
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SelectMyParent.exe
      - CommandLine|contains:
        - PPID-spoof
        - ppid_spoof
        - spoof-ppid
        - spoof_ppid
        - ppidspoof
        - spoofppid
        - spoofedppid
        - ' -spawnto '
      - OriginalFileName|contains:
        - PPID-spoof
        - ppid_spoof
        - spoof-ppid
        - spoof_ppid
        - ppidspoof
        - spoofppid
        - spoofedppid
      - Description: SelectMyParent
      - Hashes|contains:
        - IMPHASH=04D974875BD225F00902B4CAD9AF3FBC
        - IMPHASH=A782AF154C9E743DDF3F3EB2B8F3D16E
        - IMPHASH=89059503D7FBF470E68F7E63313DA3AD
        - IMPHASH=CA28337632625C8281AB8A130B3D6BAD
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    spoofing-tool execution was a single event or part of activity spanning multiple
    endpoints. If the same user ran offensive tooling or spawned processes under forged
    parents on other hosts, the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SelectMyParent.exe
      - CommandLine|contains:
        - PPID-spoof
        - ppid_spoof
        - spoof-ppid
        - spoof_ppid
        - ppidspoof
        - spoofppid
        - spoofedppid
        - ' -spawnto '
      - OriginalFileName|contains:
        - PPID-spoof
        - ppid_spoof
        - spoof-ppid
        - spoof_ppid
        - ppidspoof
        - spoofppid
        - spoofedppid
      - Description: SelectMyParent
      - Hashes|contains:
        - IMPHASH=04D974875BD225F00902B4CAD9AF3FBC
        - IMPHASH=A782AF154C9E743DDF3F3EB2B8F3D16E
        - IMPHASH=89059503D7FBF470E68F7E63313DA3AD
        - IMPHASH=CA28337632625C8281AB8A130B3D6BAD
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    spoofing-tool execution reveals what led to it and what followed - the process that
    delivered the tool, reconnaissance, credential access, or the elevated child the
    spoof produced. Novel parent-child pairs at low counts are what to scan for against
    the high-count noise of routine system processes, and an unusual child under a
    SYSTEM parent here corroborates the spoof.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - credential access, defense tampering,
    or reconnaissance - may reveal the attack stages that preceded the spoofing-tool
    execution and help reconstruct the full timeline. Parent-PID spoofing is typically
    a mid-chain step used to launch a payload under a chosen identity, so prior alerts
    give the context for what the operator was setting up.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:hacking_tool.tool_specific_artifacts
  question: Are files written by the spoofing tool's process present on the host?
  context: The tool and the payloads it stages can leave files on disk - a dropped
    child binary named on the command line, or a DLL passed to the spoofed process.
    Files created by the tool's process confirm execution and reveal the scope of
    activity even after the original process has exited. Pair the file paths with the
    chosen child binary from the decoded command line.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\SelectMyParent.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in
    the hour before the alert?
  context: Operators frequently weaken host protection before running token-manipulation
    and privilege-escalation tooling. The query surfaces attempts to disable AV/EDR
    services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI and
    ETW from the command line. Zero rows is a useful protection-looks-healthy signal;
    populated rows shift the disposition toward deliberate operator preparation. Review
    the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
