      disposition: context
      target_question: Q3
      notes: "Rule's queryable CLI value is 'collect' (already enforced by the rule selection and reproduced verbatim in the REFLECTED baseline_deviation/scope queries). The remaining flags are dotnet-dump collect options pulled from db_refs; they are tool-argument variations the analyst decodes from the alerting CommandLine, not additional rule filters. mechanism_decode and credential_target_identification are ProcessGuid-scoped (entity-scoped), so the parameter-decode claim is auto-satisfied without query-side CommandLine|contains. Concrete flags listed in Q3/Q4 context."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only"
      disposition: context
      target_question: Q5
      notes: "T1218 analytic profiles unexpected parent-child relationships; no concrete parent list in the analytic. Realized as the parent-chain judgment in cue_process_tool.process_chain (Q5) and the parent-pivot baseline/clustering_svc questions (Q13, Q15)."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q11
      notes: "Allowlist of signed binaries permitted to proxy-execute; no concrete values in the analytic beyond the rule's own binary. dotnet-dump.exe IS the signed binary here, fixed by the rule's selection_img. The fleet-wide scope question (Q11) calibrates how widely this signed-binary pattern runs across hosts."
    - element: RemoteDomainAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q7
      notes: "Filter to suppress contact with legitimate enterprise domains; no concrete domains in the analytic (environment-specific). Realized as the local/enterprise filter framing in the dump_exfiltration network question (Q7), which excludes RFC1918 ranges and directs the analyst to discount known-good enterprise destinations."
  dedup_decisions:
