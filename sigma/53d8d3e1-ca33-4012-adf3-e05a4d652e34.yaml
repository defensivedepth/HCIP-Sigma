      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot Q12 and launch-mechanism-pivot Q13)"
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot Q14 and launch-mechanism-pivot Q15)"
      kept: both
    - dropped: cue_process_tool.baseline
      reason: "generic Image|endswith \\dotnet-dump.exe host-frequency baseline (-90d) is subsumed by the REFLECTED baseline_deviation (Q10), which scopes to the rule's actual collect firing pattern (Image AND CommandLine contains collect) on this host and projects the parent/user distribution. baseline_deviation is more specific and filter-correct"
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.clustering
      reason: "Image-only host aggregation subsumed by cue_host_context.clustering (Q16), which projects Image+ParentImage and surfaces novel parent-child pairs"
      kept: cue_host_context.clustering
    - dropped: cue_process_tool.follow_on
      reason: "dotnet-dump collect does not spawn meaningful child processes (it captures memory and writes a dump file, then exits); the real follow-on artifact is the dump file and its egress, covered by attack:T1218.dump_artifact (Q6, file_event) and attack:T1218.dump_exfiltration (Q7, network_connection). Trimmed to stay within the 14-18 target"
      kept: attack:T1218.dump_artifact + attack:T1218.dump_exfiltration
  skipped_templates:
    - template: cue_process_tool.mechanism_decode (host+Image ADAPT_STRUCTURALLY query form)
      reason: "Used the mechanism_decode template but scoped to ProcessGuid (entity) rather than the template's host+Image|endswith default. dotnet-dump is single-command per invocation (collect captures one dump and exits — not a multi-invocation tool like bitsadmin/schtasks), so host+binary scope returns no extra logical operation; ProcessGuid scope is sufficient and keeps the decode aligned to the alerting event."
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1218) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The T1218 image_load analytic targets trusted binaries that proxy-LOAD an
        externally hosted or suspicious DLL (regsvr32/rundll32 loading a payload via
        a DLL entrypoint in CommandLineRegex). dotnet-dump collect has no proxy-DLL
        load behavior — it attaches to a target .NET process and writes a memory
        dump, then exits. The rule constrains Image to dotnet-dump.exe and CommandLine
        to the collect verb; image_load on that binary returns its own normal runtime
        DLL set (clrjit, hostpolicy, the diagnostics IPC libraries) with no payload
        signal. The load-bearing cross-logsource pivot for this rule is the dump-file
        artifact and its egress, covered by attack:T1218.dump_artifact (file_event)
        and attack:T1218.dump_exfiltration (network_connection). No compensating
        attack:T1218.image_load question authored.
    - hint: "logsource 'network_connection' (recommended by techniques: T1218) is not covered — pull in cue_network_endpoint.* or author a custom question with `category: network_connection`"
      disposition: acted_on
      reason: >-
        Authored attack:T1218.dump_exfiltration (Q7) with category: network_connection,
        scoped to the host with RFC1918/local filtering, to surface outbound transfer
        of the captured dump file after collection. dotnet-dump itself makes no
        outbound connections; the meaningful network angle is exfiltration of the
        resulting dump, which this question covers. Recorded here as acted-on per the
        hint-disposition audit requirement.
