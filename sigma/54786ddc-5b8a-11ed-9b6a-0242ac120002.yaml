name: Suspicious Ping/Del Command Combination
id: 2bb92188-eb17-447a-b33f-0c6d0b86e380
description: |
  Detects a single command line that combines ping with del - a self-cleanup
  idiom in which ping is used as a built-in delay (ping <host> -n N > Nul) so
  that a file can be deleted (del /f /q <path>) once a preceding step finishes.
  The rule fires only when all of the following appear in one command line: the
  ping count switch (-n), a redirect to Nul, the del force/quiet switches (-f
  and -q), and both the literal strings ping and del. Malware uses this pattern
  to remove the dropper, decoded payload, or renamed system utility that carried
  the initial infection, so the artifact responsible is gone by the time logs are
  reviewed. The same idiom appears in legitimate batch scripts and installers, so
  the investigation should determine which file was deleted, whether it can still
  be recovered, what process issued the command, what ran on the host just before
  the deletion, and whether the same pattern appears elsewhere on the host or
  fleet.
type: detection
detection_id: 54786ddc-5b8a-11ed-9b6a-0242ac120002
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line combine ping (with -n and a redirect to Nul) and
    del (with -f and -q), matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when a single command line contains all of these together -
    the ping count switch -n, a redirect to Nul, the del force and quiet switches -f
    and -q, and both the literal strings ping and del. Read the exact command line and
    confirm every element is present, then note which file path the del targets, since
    that is the artifact the idiom is removing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run scripted ping-then-delete cleanup
    commands?
  context: The ping/del idiom appears in some legitimate installers, uninstallers, and
    batch automation that remove a temporary file after a timed wait. Knowing whether
    the acting account and the host function involve scripted software installation or
    maintenance is often the fastest path to separating a benign cleanup step from a
    malware self-delete. An interactive user account or a server with no install
    activity running this pattern is more notable than a build or deployment host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: What did the full chained command do, and which file did the del remove?
  context: The ping/del pattern is almost always one segment of a longer chained command
    joined by & operators. Read the entire command line to reconstruct the sequence -
    what executed before the timed ping, what the del removed, and whether other cleanup
    steps (fsutil zeroing, additional deletes, log clearing) ride along in the same line.
    The del argument is the path of the artifact being destroyed; record it so the file
    can be recovered or hunted for before it is gone for good.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1070.004.file_path_analysis
  question: Which file path did the del target, and where does that path sit - a
    user-writable staging directory or a system location?
  context: The del argument identifies the artifact the idiom is removing. A path under
    a user profile, temp, public, or a freshly created working directory points to a
    dropped payload, a decoded file, or a renamed system utility being cleaned up after
    use. A path inside a normal application install directory is more consistent with a
    routine uninstall or update step. The location of the deleted file is the single
    strongest signal for whether this is malware self-cleanup or maintenance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:universal.evidence_preservation
  question: Is the file the del targeted still on disk, or was it already removed?
  context: If the deleted artifact still exists - because the del has not yet run, failed,
    or targeted a copy - it can be hashed, submitted for analysis, and reviewed for
    content. Check the file-write events for the targeted path to confirm whether the
    artifact was created and whether it is still present. If it is gone, the surrounding
    file events still record when it was written and by which process, anchoring the
    timeline even after the file itself is destroyed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: attack:T1070.004.file_deletion_recovery
  question: Was a file-deletion event recorded for the targeted path, and can the file
    be recovered from shadow copies, backups, or the recycle bin?
  context: File-deletion telemetry captures the removal directly and records the deleting
    process and the file path, which is the evidence that survives the self-delete. If a
    deletion event exists for the targeted path, the file content itself is gone from its
    original location, but recovery from volume shadow copies, backups, or the recycle bin
    may still allow the dropped artifact to be analyzed. If file-deletion events are not
    collected in this environment, treat the absence as a visibility gap rather than proof
    no deletion occurred, and pivot to the process command line for the path.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned the command that ran the ping/del cleanup, and is that
    parent chain expected?
  context: The parent process reveals how the cleanup command was invoked. Self-deleting
    malware issues the ping/del line from the same process chain that ran the payload, so
    the parent is often the dropper or loader itself. An interactive shell or an installer
    parent is consistent with legitimate scripted cleanup; an unexpected parent such as a
    service agent, a script host, mshta.exe, or an Office application points to automated
    or malicious invocation. Walk up from the parent to see what staged the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What executed on this host in the hour around the deletion, and what ran just
    before it?
  context: The ping/del idiom is a terminal cleanup step, so the activity worth recovering
    is what ran immediately before the deletion - the dropped or decoded artifact the del
    is now erasing - and any follow-on execution in the same window. A burst of process
    creation leading up to the timed ping points to the payload chain the deletion is meant
    to hide. Correlate this with file writes and network connections in the same window to
    reconstruct what happened before the evidence was removed.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other indicator-removal or recovery-inhibition actions performed on this
    host?
  context: A self-delete is one form of indicator removal, and malware that cleans up its
    dropper frequently pairs it with other evasion and impact steps - clearing event logs,
    deleting shadow copies, disabling recovery, or zeroing files before deletion. Finding
    several of these events from the same user or parent process within a short window
    points to a coordinated effort to destroy evidence and inhibit recovery rather than an
    isolated batch-script cleanup.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\fsutil.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'delete catalog'
          - 'setZeroData'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_count:
        CommandLine|contains|windash: ' -n '
      selection_nul:
        CommandLine|contains: Nul
      selection_del_param:
        CommandLine|contains|windash:
        - ' -f '
        - ' -q '
      selection_all:
        CommandLine|contains|all:
        - ping
        - 'del '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_count:
        CommandLine|contains|windash: ' -n '
      selection_nul:
        CommandLine|contains: Nul
      selection_del_param:
        CommandLine|contains|windash:
        - ' -f '
        - ' -q '
      selection_all:
        CommandLine|contains|all:
        - ping
        - 'del '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    self-delete was a single event or part of activity spanning multiple endpoints. If the
    same user triggered similar deletion or payload activity on other hosts, the scope of
    the incident is larger than one machine and points to lateral movement or a pushed
    rollout.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_count:
        CommandLine|contains|windash: ' -n '
      selection_nul:
        CommandLine|contains: Nul
      selection_del_param:
        CommandLine|contains|windash:
        - ' -f '
        - ' -q '
      selection_all:
        CommandLine|contains|all:
        - ping
        - 'del '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the self-
    delete reveals what led to it and what followed - the dropper that staged the payload,
    reconnaissance, encryption, or follow-on execution the deletion was meant to cover.
    Novel parent-child pairs at low counts are what to scan for against the high-count noise
    of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, defense
    tampering, or recovery inhibition - may reveal the attack stages that preceded the
    self-delete and help reconstruct the full timeline. The ping/del idiom is usually one of
    the last steps in an intrusion, so prior alerts give the context for what the deleted
    artifact was doing before it was removed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's ping/del pattern, what parents
    and users normally drive it, and does the current alert fit?
  context: Even legitimate installers and batch scripts can produce a ping/del cleanup line.
    This query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern has historically
    run here, not generic process activity. A new parent process, an unexpected account, or
    a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_count:
        CommandLine|contains|windash: ' -n '
      selection_nul:
        CommandLine|contains: Nul
      selection_del_param:
        CommandLine|contains|windash:
        - ' -f '
        - ' -q '
      selection_all:
        CommandLine|contains|all:
        - ping
        - 'del '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's ping/del pattern in the past week, and does
    the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the ping/del firing pattern rather than generic process
    activity. Many hosts firing the same pattern points to an installer or scripted
    deployment that uses the idiom by design; one host or a small unrelated set points to
    manual operator activity or a targeted deployment. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_count:
        CommandLine|contains|windash: ' -n '
      selection_nul:
        CommandLine|contains: Nul
      selection_del_param:
        CommandLine|contains|windash:
        - ' -f '
        - ' -q '
      selection_all:
        CommandLine|contains|all:
        - ping
        - 'del '
      condition: all of selection_*
    fields:
    - host.name
