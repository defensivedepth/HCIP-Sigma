name: File Encryption Using Gpg4win
id: 8b2af535-4974-4911-bcb3-3af07b751f95
description: |
  Detects a process whose image ends in gpg.exe or gpg2.exe (or carries the
  GnuPG OpenPGP tool description) and whose command line contains both ' -c '
  and the word passphrase, the symmetric-encryption invocation pattern of the
  Gpg4win command-line tool. The rule fires only when both the binary/metadata
  match and the command line carries the symmetric-cipher flag together with a
  passphrase, so all conditions must hold. gpg is a legitimate file-encryption
  utility used by privacy-conscious users and some backup workflows, but the
  same symmetric-encryption pattern is also used to decrypt staged payloads
  during malware delivery and to encrypt collected data before exfiltration. The
  investigation should determine what files were targeted, what the full command
  did, where the output went, who and what launched it, and whether the same
  pattern appears elsewhere on the host or fleet.
type: detection
detection_id: 550bbb84-ce5d-4e61-84ad-e590f0024dcd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line invoke gpg with the symmetric-cipher flag and a
    passphrase, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when the image is gpg.exe or gpg2.exe (or carries the GnuPG
    OpenPGP tool description) AND the command line contains both ' -c ' and
    passphrase together. Read the exact command line and confirm both elements are
    present - the symmetric-cipher flag and an explicit passphrase argument identify
    a symmetric encrypt or decrypt operation rather than a key listing or
    configuration call.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run gpg symmetric file encryption?
  context: Command-line gpg symmetric encryption is normal for a narrow set of users
    and workflows - privacy-conscious individuals encrypting documents, or backup and
    transfer jobs that protect data at rest. Most users and most endpoints never run
    it. Knowing whether the acting account and the host function involve file
    encryption is often the fastest path to separating a routine encryption task from
    payload decryption or pre-exfiltration packaging.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this gpg invocation do? Decode the full command line and
    identify the input file, output destination, and operation.
  context: The full command line reveals the specific action taken. Read the arguments
    to determine whether this was an encrypt or a decrypt operation, which file was
    the input, where the output was written, and whether the passphrase appears inline
    or was supplied via stdin or a config file. The same symmetric-cipher pattern
    encrypts collected data before exfiltration and decrypts staged payloads during
    malware delivery, so the input and output paths distinguish the two. The host plus
    binary scope captures any companion gpg calls in the same short window that
    together form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - ' -c '
          - passphrase
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:data_staging_exfil.encryption_password
  question: How was the passphrase supplied, and does the command line reveal it
    inline or pull it from elsewhere?
  context: gpg symmetric encryption requires a passphrase, which can be passed inline
    via --passphrase, read from stdin, or pulled from a passphrase file. An inline
    passphrase visible in the command line is recoverable and may itself be an
    indicator if it matches a known malware string; a passphrase supplied via stdin or
    a file will not appear here and must be retrieved from the launching script. The
    --batch and --yes flags alongside the cipher flag indicate an unattended,
    non-interactive invocation typical of scripted decryption or bulk encryption.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:data_staging_exfil.data_scope
  question: What files did this gpg process read or write on the host?
  context: The file events around the gpg invocation reveal what data was actually
    targeted. An encrypt operation produces a new .gpg output from a plaintext input;
    a decrypt operation reads a .gpg input and writes plaintext, often an executable or
    archive. The file types and directories touched - office documents and shares
    point toward data collection, while executables and DLLs in user-writable
    directories point toward payload staging - determine the severity and which path
    the investigation should follow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:data_staging_exfil.archive_destination
  question: Where was the gpg output written, and was it subsequently moved, executed,
    or sent over the network?
  context: Symmetric encryption is rarely the final step. After gpg writes its output,
    the next action reveals intent - an encrypted archive moved to a staging location
    or uploaded points toward exfiltration, while a decrypted executable or DLL that is
    then launched points toward payload delivery. Examine files the binary created and
    correlate with outbound connections from the same host in the same window to
    reconstruct where the data or payload went.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned gpg, and is that parent chain expected for file
    encryption?
  context: The parent process reveals how gpg was invoked. Interactive encryption
    usually shows a console shell, a file manager, or the Kleopatra front end as the
    parent. An unexpected parent such as a script host, mshta.exe, a batch chain, or an
    Office application points to automated or scripted invocation - the pattern seen
    when gpg is dropped alongside a loader to decrypt staged payloads.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were tamper attempts against endpoint protection seen on this host in the
    hour before the alert?
  context: When gpg decryption is part of a malware delivery chain, operators commonly
    weaken endpoint protection before staging the payload - disabling AV/EDR services,
    adding broad Defender exclusions for the staging directory, or clearing logs. The
    query surfaces those command-line attempts on this host. Zero rows means no
    command-line tampering of these kinds was visible and the encryption is more likely
    routine; populated rows shift the disposition toward operator preparation, so
    review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Does this user normally run gpg symmetric encryption?
  context: Compare the acting account against its own history. A user whose role
    involves protecting files or running backup workflows may run gpg symmetric
    encryption routinely; an account that has never done so launching the cipher
    pattern is more notable. The user role and typical toolset should align with file
    encryption work.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - ' -c '
          - passphrase
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and gpg symmetric-encryption pattern historically routine
    on this host or across the environment, or is the parent unusual for it?
  context: When the alert fires under a service principal, user identity does not
    attribute the behavior; the meaningful pivot is which parent process launched a gpg
    child carrying the symmetric-cipher and passphrase pattern, and whether that
    pairing is historically common. A new or rare parent for this pattern on this host
    or environment-wide is the deviation worth chasing, while a parent that already
    accounts for many prior events is more likely a backup job or other automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - ' -c '
          - passphrase
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    gpg encryption was a single event or part of activity spanning multiple endpoints.
    If the same user triggered similar activity on other hosts, the scope of the
    incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and gpg symmetric-encryption pattern fire on other
    hosts in the same window, indicating a coordinated rollout rather than isolated
    activity?
  context: Under a service principal, asking what else the user did across the network
    returns agent-telemetry noise, since every host runs system-owned agents
    constantly. The meaningful question is whether the same launch mechanism - a parent
    process spawning a gpg child that carries the symmetric-cipher and passphrase
    pattern - fired on other hosts in the alert window. Multiple hosts in the same
    window points to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - ' -c '
          - passphrase
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the gpg
    invocation reveals what led to it and what followed - the parent that staged the
    process, a loader that dropped the encrypted payload, or follow-on execution of a
    decrypted binary. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    defense tampering, or download activity - may reveal the attack stages that
    preceded the gpg encryption and help reconstruct the full timeline. Payload
    decryption and pre-exfiltration encryption are usually mid-chain steps, so prior
    alerts give the context for why files were being encrypted.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's gpg symmetric-encryption
    pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate workflows can run gpg symmetric encryption. This query
    mirrors the rule's selection structure scoped to this host, so the resulting parent
    and user distribution reflects how this specific firing pattern has historically
    run here, not generic gpg activity. A new parent process, an unexpected account, or
    a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG’s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -c '
        - passphrase
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's gpg symmetric-encryption pattern in the
    past week, and does the cross-host distribution look like consistent automation or
    one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the gpg symmetric-encryption firing pattern rather
    than generic gpg activity. Many hosts firing the same pattern points to a backup or
    deployment workflow that uses gpg by design; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG’s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -c '
        - passphrase
      condition: all of selection_*
    fields:
    - host.name
