name: Obfuscated IP Via CLI
id: 4248057f-c18d-4c53-9f2a-da49b6e5c5b7
description: |
  Detects ping.exe or arp.exe invoked with a command line that carries an IP address in an encoded or
  obfuscated form. The rule fires when the alerting process is one of those binaries AND the command line
  matches at least one obfuscation branch -- either a hex/octal octet marker (' 0x', '//0x', '.0x', '.00x'),
  or a URL-encoded host built from 'http://%' together with '%2e', or one of several regex shapes for
  dotted-octal, dword-octal, or raw octal hosts -- AND the command line does not contain a normal dotted-decimal
  IP. Encoding an IP this way is a known evasion to slip a destination past string-matching controls and casual
  review; legitimate troubleshooting almost always uses plain dotted-decimal addresses. The investigation should
  decode the obfuscated value to its real IP, establish what that destination is, and confirm whether the user,
  host, and parent chain explain a benign reason for hiding an address on the command line.
type: detection
detection_id: 56d19cb4-6414-4769-9644-1ed35ffbb148
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects -- ping.exe or arp.exe carrying an obfuscated IP, and which obfuscation branch fired?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process. The rule fires when the binary is ping.exe or arp.exe AND the command line matches at least one obfuscation branch -- either a hex or octal octet marker, or a URL-encoded host ('http://' with percent-encoded dots), or one of the octal-host regex shapes -- AND no plain dotted-decimal IP is present. Note which branch matched, because it shapes what to decode. A hex or octal-octet hit points at a numeric host, while the URL-encoded branch points at a percent-encoded hostname.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user and host expected to run ping or arp with an encoded address on the command line?
  context: Network administrators and IT staff legitimately run ping and arp for troubleshooting, but they almost always type a normal dotted-decimal address. An encoded or octal-form IP is rarely something a human types by hand, so the combination of an ordinary diagnostic binary and an obfuscated target is the part to scrutinize against the user's role and the host's function.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.mechanism_decode
  question: Decode the obfuscated address on this ping or arp command line. What real IP or hostname does it resolve to?
  context: The obfuscated value is the operator's destination hidden from string-matching review. Convert the encoding back to a dotted-decimal IP -- hex octets ('0x25.0x1b.0x29.0xc3'), dword or octal forms ('0x251b29c3', '04506624703', '622537155'), or percent-encoded URL hosts ('%33%37%2e...') all collapse to a single address. The decoded IP is the pivot for every downstream question. This query returns ping and arp executions on this host in a tight window so multi-step invocations that together form one operation are visible alongside the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ' 0x'
          - //0x
          - .0x
          - .00x
          - 'http://%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:obfuscation.encoded_payload_decode
  question: Beyond the address itself, does the command line carry additional encoding or layered obfuscation, and what does the fully decoded content perform?
  context: Encoded content hides the operator's intent from casual inspection. Beyond the numeric IP encoding the rule matched, the command line may chain further obfuscation -- percent-encoding stacked on hex octets, mixed dotted and octal segments, or full-width unicode digits. Decode every layer until the destination and any flags are human-readable, then identify what the invocation is actually doing -- reaching a numeric host, staging a follow-on connection, or probing a target whose address was deliberately disguised.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_network_endpoint.mechanism_decode
  question: Once the address is decoded, what is this destination? What do DNS, WHOIS, and threat intel reveal about it?
  context: 'Investigate the decoded destination as you would any external endpoint: passive DNS and resolution history, WHOIS and registration age, hosting provider, and known threat-intelligence hits. A recently registered domain, bulletproof or residential hosting, or a known command-and-control address points to attacker infrastructure and explains why the address was disguised on the command line. The triggering event carries the encoded value; reputation lookup of the decoded IP is manual.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this ping or arp, and is that parent chain normal?
  context: Legitimate diagnostics are typically run from cmd.exe or a shell descended from explorer.exe, or from a known automation script. Ping or arp with an obfuscated address spawned by an unusual parent -- an Office application, a script interpreter (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe, or a download cradle -- indicates automated post-exploitation rather than an administrator typing at a prompt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single ping or arp may be routine troubleshooting, but multiple reconnaissance commands in rapid succession -- ipconfig, net, nltest, nslookup, netstat, whoami -- is a signature of post-compromise enumeration. An operator who disguised a destination address often pairs it with host and network discovery to map the environment before the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline
  question: Does this host normally run ping or arp?
  context: A diagnostic binary that runs regularly on a host is less notable than one that fires rarely. Low historical counts of ping or arp on this host raise the priority of the decoded destination, since routine troubleshooting hosts will show a steady background of these binaries while a quiet endpoint suddenly running an obfuscated lookup is the anomaly.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even common diagnostic tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific obfuscated-IP firing pattern has run here historically, not generic ping or arp usage. A new parent process, an unexpected user account, or an unusual command shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \ping.exe
        - \arp.exe
      selection_ip_1:
        CommandLine|contains:
        - ' 0x'
        - //0x
        - .0x
        - .00x
      selection_ip_2:
        CommandLine|contains|all:
        - http://%
        - '%2e'
      selection_ip_3:
      - CommandLine|re: https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}
      - CommandLine|re: https?://[0-9]{1,3}\.0[0-9]{3,7}
      - CommandLine|re: https?://0[0-9]{3,11}
      - CommandLine|re: https?://(?:0[0-9]{1,11}\.){3}0[0-9]{1,11}
      - CommandLine|re: https?://0[0-9]{1,11}
      - CommandLine|re: ' [0-7]{7,13}'
      filter_main_valid_ip:
        CommandLine|re: https?://(?:(?:25[0-5]|(?:2[0-4]|1\d|[1-9])?\d)(?:\.|\b)){4}
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_ip_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_network_endpoint.baseline
  question: Does this host normally communicate with the decoded destination?
  context: First-time connections to a destination are more notable than routine communication. After decoding the obfuscated address to a real IP, check whether this host has any history of talking to it. Zero or very low historical counts mark new infrastructure rather than a familiar internal or business endpoint; established traffic suggests the obfuscation may be cosmetic over an already-known destination.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- source: template:cue_user_actor.baseline
  question: Does this user normally run ping or arp across the environment?
  context: Compare this user's current action against their historical behavior. A user who routinely runs network diagnostics as part of an admin or help-desk role is a different proposition from one who has never touched ping or arp. The user's role and typical toolset should align with running these binaries at all, let alone against an encoded address.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent unusual for ping or arp?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned ping or arp, and whether that pair is historically common. A new or rare parent for these binaries on this host or environment-wide is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or scheduled automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar diagnostic or reconnaissance activity on other hosts in the same window, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window, indicating a coordinated automation rollout rather than isolated activity?
  context: Under a service principal, asking what else this user did across the network returns agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism -- parent process plus ping or arp -- fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging that brackets the obfuscated lookup.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this obfuscated-IP firing pattern, not generic ping or arp usage. Many hosts firing the same pattern points to scripted deployment or vendor automation that happens to encode addresses; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \ping.exe
        - \arp.exe
      selection_ip_1:
        CommandLine|contains:
        - ' 0x'
        - //0x
        - .0x
        - .00x
      selection_ip_2:
        CommandLine|contains|all:
        - http://%
        - '%2e'
      selection_ip_3:
      - CommandLine|re: https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}
      - CommandLine|re: https?://[0-9]{1,3}\.0[0-9]{3,7}
      - CommandLine|re: https?://0[0-9]{3,11}
      - CommandLine|re: https?://(?:0[0-9]{1,11}\.){3}0[0-9]{1,11}
      - CommandLine|re: https?://0[0-9]{1,11}
      - CommandLine|re: ' [0-7]{7,13}'
      filter_main_valid_ip:
        CommandLine|re: https?://(?:(?:25[0-5]|(?:2[0-4]|1\d|[1-9])?\d)(?:\.|\b)){4}
      condition: selection_img and 1 of selection_ip_* and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: reconnaissance followed by exploitation, or tampering followed by execution.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
