name: PUA - System Informer Execution
id: 4fa29e7c-acbb-418c-b595-0c0090d3a799
description: |
  Detects the execution of System Informer (the maintained successor of Process
  Hacker), a portable process, service, handle, and network introspection utility.
  The rule fires when a process matches any of the tool's identifying attributes -
  an Image ending in SystemInformer.exe, an OriginalFileName, Description, or
  Product of System Informer, or one of the tool's known file hashes - so a renamed
  or relocated copy still matches on metadata. System administrators and developers
  run System Informer legitimately for troubleshooting, but the same primitives -
  closing file handles held by security products, stopping kernel driver services,
  reusing tokens to inherit SYSTEM, and dropping a signed kernel driver - are reused
  to disable defenses, escalate, and inspect a host. The investigation should
  determine which copy of the tool ran, how it was launched, whether its kernel
  driver service was installed, what it acted on, and whether the same pattern
  appears elsewhere.
type: detection
detection_id: 5722dff1-4bdd-4949-86ab-fbaf707e767a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this process match System Informer by image name, file metadata, or
    hash, as this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule matches when any one identifying attribute is present - an image ending
    in SystemInformer.exe, an OriginalFileName, Description, or Product of System
    Informer, or one of the tool's known MD5/SHA1/SHA256/IMPHASH values. Note which
    attribute matched. A hash or OriginalFileName match on an image that is not named
    SystemInformer.exe means the tool was renamed or rebuilt, which is more notable
    than a default install running under its own name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
      - Hashes
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run a low-level process and service
    introspection tool?
  context: System Informer is a legitimate utility for a narrow set of administrators
    and developers who troubleshoot processes, handles, drivers, and services. Most
    users and most endpoints never run it. Knowing whether the acting account and the
    host function involve that kind of system maintenance is often the fastest path to
    separating a sanctioned diagnostic run from operator tooling carried onto the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1543.process_identification
  question: Which copy of System Informer ran, where does it live, and is it signed
    by the expected publisher?
  context: The rule matches on tool metadata, so a renamed or locally rebuilt copy
    still fires. Identify the image path and signing status. A signed build from a
    standard install or program-files path used by IT is a different finding than an
    unsigned or renamed copy run from a user-writable, temporary, or removable-media
    directory, which is the staging pattern seen when the tool is carried onto a host
    to disable defenses. The image path and hash together identify exactly which build
    executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did this System Informer invocation do? Review its command line and
    working directory for the action it was driven to perform.
  context: The command line and current directory reveal how the tool was started and
    against what. System Informer can be invoked to inspect or close handles held by
    security products, stop driver services, reuse tokens, or close network sockets.
    A portable launch reads a SystemInformer.exe.settings.xml beside the binary, so
    the working directory also indicates whether this was a portable copy. Decode any
    arguments or settings path to understand the intended operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned System Informer, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Interactive use
    usually shows explorer.exe or a console shell launching it from a user session.
    An unexpected parent such as a script host, mshta.exe, an Office application, or a
    remote-execution service points to automated or hands-on-keyboard delivery rather
    than an administrator opening the tool deliberately.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1543.service_driver_artifact
  question: Was the System Informer kernel driver service registered on this host
    around the time of the alert?
  context: The kernel-side actions that make this tool useful for stopping security
    drivers require its own kernel driver and matching service to be installed,
    leaving a service registration under the system services registry path and a
    driver image on disk as forensic artifacts. The presence of a KSystemInformer
    service key or driver registration around the alert indicates the tool's
    privileged mode was exercised, not just its read-only process viewer. Its absence
    suggests user-mode-only inspection.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_driver:
        TargetObject|contains:
          - '\Services\KSystemInformer'
          - '\Services\KProcessHacker'
          - 'SystemInformer'
      condition: selection and selection_driver
    fields:
      - TargetObject
      - Details
      - Image
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single introspection tool launch may be legitimate troubleshooting, but
    a System Informer run alongside several native discovery commands - whoami,
    systeminfo, ipconfig, net, tasklist, nltest - in rapid succession is the
    enumeration pattern of post-compromise activity. An operator typically maps the
    host before moving to the next stage. The triggering tool is excluded so this
    surfaces other discovery activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:universal.endpoint_protection_health
  question: Were tamper attempts against endpoint protection seen on this host in the
    hour before the alert?
  context: System Informer's privileged primitives are commonly used to stop or unload
    security products, so the relevant question is whether command-line tampering of
    other kinds accompanied it. The query surfaces attempts to disable AV/EDR services,
    flip Defender flags, add broad exclusions, clear logs, or patch AMSI and ETW. Zero
    rows means no command-line tampering of these kinds was visible - note that handle
    close and driver stop driven through the tool's own UI will not appear here.
    Populated rows show a broader effort to blind the host; review the parent process
    and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.follow_on
  question: What child processes did System Informer spawn afterward?
  context: The processes spawned by the tool reveal its actual impact. The legitimate
    viewer rarely spawns children; a command shell, script host, or other binary
    launched from it points to the tool being used as a springboard - for example its
    "run as this user" feature inheriting a SYSTEM token to start a new process. Review
    any children and the context in which they ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run System Informer or similar low-level system
    tooling?
  context: Compare the acting account against its own history. An administrator or
    developer may run process and service introspection tools routinely; an account
    that has never done so launching System Informer is more notable. The user's role
    and typical toolset should align with low-level system maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and System Informer pairing historically routine on this
    host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not
    attribute the behavior; the meaningful pivot is which parent process launched
    System Informer and whether that pairing is historically common. A new or rare
    parent for this binary on this host or environment-wide is the deviation worth
    chasing, while a parent that already accounts for many prior events is more likely
    a deployment tool or management agent.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    System Informer run was a single event or part of activity spanning multiple
    endpoints. If the same user ran similar tooling on other hosts in the same window,
    the scope of the activity is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and System Informer pairing fire on other hosts in
    the same window, indicating a coordinated rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network
    returns agent-telemetry noise, since every host runs system-owned agents
    constantly. The meaningful question is whether the same launch mechanism - a
    parent process spawning System Informer - fired on other hosts in the alert
    window. Multiple hosts in the same window points to scheduled or pushed
    deployment; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    System Informer launch reveals what led to it and what followed - the parent that
    staged it, reconnaissance, privilege escalation, or persistence the tool's actions
    were meant to support. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    defense tampering - may reveal the attack stages that preceded the tool's
    execution and help reconstruct the full timeline. A low-level system tool is often
    introduced after an initial foothold, so prior alerts give context for why it was
    run.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the System Informer pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate maintenance can run this tool. This query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here,
    not generic process activity. A new parent process, an unexpected account, or a
    first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SystemInformer.exe
      - OriginalFileName: SystemInformer.exe
      - Description: System Informer
      - Product: System Informer
      - Hashes|contains:
        - MD5=19426363A37C03C3ED6FEDF57B6696EC
        - SHA1=8B12C6DA8FAC0D5E8AB999C31E5EA04AF32D53DC
        - SHA256=8EE9D84DE50803545937A63C686822388A3338497CDDB660D5D69CF68B68F287
        - IMPHASH=B68908ADAEB5D662F87F2528AF318F12
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the System Informer pattern in the past week, and
    does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the System Informer firing pattern rather than
    generic process activity. Many hosts firing the same pattern points to a packaged
    deployment or a tool an IT team distributes by design; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SystemInformer.exe
      - OriginalFileName: SystemInformer.exe
      - Description: System Informer
      - Product: System Informer
      - Hashes|contains:
        - MD5=19426363A37C03C3ED6FEDF57B6696EC
        - SHA1=8B12C6DA8FAC0D5E8AB999C31E5EA04AF32D53DC
        - SHA256=8EE9D84DE50803545937A63C686822388A3338497CDDB660D5D69CF68B68F287
        - IMPHASH=B68908ADAEB5D662F87F2528AF318F12
      condition: selection
    fields:
    - host.name
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1543
      name: Create or Modify System Process
      role: primary
    - id: T1082
      name: System Information Discovery
      role: secondary
    - id: T1564
      name: Hide Artifacts
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: tool_invocation
      description: "A process matching System Informer (by name, metadata, or hash) is launched - the act the rule detects"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: privileged_capability
      description: "The tool's kernel driver service is installed/registered, unlocking the privileged handle-close and driver-stop primitives"
      mapped_to: Q6
      source: attack:T1543.service_driver_artifact
    - stage: 3
      label: operation_performed
      description: "Identify what the tool was driven to do via its command line, working directory, and any spawned children"
      mapped_to: Q4
      source: template:cue_process_tool.mechanism_decode
  dimension_coverage:
    - dimension: parent_process_analysis
      technique: T1543
      covered_by: Q5
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1543
      covered_by: Q6
      source: attack:T1543.service_driver_artifact
      coverage_type: direct
    - dimension: time_correlation
      technique: T1082
      covered_by: Q7
      source: template:discovery_recon.discovery_burst_detection
      coverage_type: direct
    - dimension: user_context
      technique: T1082
      covered_by: Q2
      source: template:universal.host_user_context
      coverage_type: direct
  mutable_dispositions:
    - element: ServiceNamePattern
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: query_injection
      target_question: Q6
      notes: "Analytic gives a regex-pattern rationale, not concrete values. Realized with concrete service identifiers from db_refs (KSystemInformer / KProcessHacker driver service keys) injected into the registry_set TargetObject|contains selection."
    - element: RegistryPathList
      dimension: tuning_parameter
      specific_values: "HKLM\\System\\CurrentControlSet\\Services"
      disposition: query_injection
      target_question: Q6
      notes: "Autorun/service registry path from the analytic; the service_driver_artifact question queries the Services registry path for the tool's driver service registration."
    - element: ParentProcessFilter
      dimension: parent_process_analysis
      specific_values: "rationale only"
      disposition: context
      target_question: Q5
      notes: "List of non-administrative processes launching service-management tools; no concrete values in the analytic. Realized as the parent-chain judgment in process_chain, which flags script hosts, mshta, Office, and remote-execution parents."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only"
      disposition: context
      target_question: Q7
      notes: "Rationale to detect multiple discovery commands in short succession; realized as the +/-15m burst window in discovery_burst_detection."
    - element: UserContext
      dimension: user_context
      specific_values: "rationale only"
      disposition: context
      target_question: Q2
      notes: "Scope to unusual/service accounts; realized as the host_user_context judgment and the user_actor baseline/clustering pivots."
    - element: FileExtensions
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q4
      notes: "T1564 file-hiding tuning element; no concrete values and not load-bearing for a tool-presence rule. The portable-settings file (SystemInformer.exe.settings.xml) artifact is surfaced as working-directory context in mechanism_decode instead."
    - element: ADSDetection
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q4
      notes: "T1564 Alternate-Data-Stream toggle; a business-use tuning switch with no concrete value. Not applicable to System Informer execution; covered by the operation-decode context rather than a dedicated query."
  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot and launch-mechanism-pivot)"
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot and launch-mechanism-pivot)"
      kept: both
    - dropped: cue_process_tool.baseline
      reason: "host Image|endswith baseline (-90d, grouped by User) is subsumed by the REFLECTED host-pattern question (baseline_deviation), which scopes to the rule's actual multi-attribute firing pattern instead of just the binary name"
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.clustering
      reason: "Image-only host aggregation subsumed by cue_host_context.clustering, which projects Image+ParentImage and surfaces novel parent-child pairs"
      kept: cue_host_context.clustering
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "NOT skipped — included as Q4 (analysis phase). Listed here only to note it was evaluated against the primary cue's analysis slot and retained."
    - template: organizational_context.change_ticket
      reason: "Template notes_to_llm instructs skipping change_ticket for pua/hktl/apt prefixes; this rule's filename_prefix is pua, so a change-ticket check is not the relevant triage path for a flagged dual-use tool."
    - template: organizational_context.human_recall
      reason: "Organizational-context recommended template; the user-recall judgment is already carried by host_user_context (Q2) and the user_actor baseline (Q10). Trimmed to stay within the 14-18 target without adding a near-duplicate organizational query."
    - template: organizational_context.timing_alignment
      reason: "Recommended template; off-hours timing is a generic organizational check. Trimmed to stay within the 14-18 target; timing context is partially carried by cue_host_context.clustering and precursor."
    - template: organizational_context.procedural_consistency
      reason: "Recommended template; standard-procedure framing fits change-management rules (schtasks/net/reg), not a dual-use tool whose mere presence is the signal. Trimmed to stay within the 14-18 target."
    - template: remote_access_tool.tool_authorization
      reason: "remote_access_tool set was pulled in by filename_prefix pua, but System Informer is a process/service/handle introspection utility, not a remote access or tunneling tool. The approved-tooling judgment it implies is already covered by host_user_context (Q2) and baseline (Q10) framed for low-level system tooling."
    - template: remote_access_tool.active_session_context
      reason: "Not applicable — System Informer is not a remote access tool, so there is no remote support session to correlate. The remote_access_tool set match is an artifact of the pua prefix, not the tool's function."
    - template: remote_access_tool.connection_destination
      reason: "Not applicable — System Informer does not establish a remote-access relay/tunnel. It has a network tab to close local sockets, not an outbound C2/relay channel, so an external-endpoint query would return unrelated traffic."
