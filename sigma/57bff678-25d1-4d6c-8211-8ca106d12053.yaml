name: Remote Access Tool - ScreenConnect Execution
id: 08d42b2d-1b38-4f6e-9e67-8c91c7dc1eea
description: |
  Detects execution of the ScreenConnect remote access agent, identified by the process binary's signed
  metadata (Description "ScreenConnect Service", Product "ScreenConnect", or Company "ScreenConnect Software").
  ScreenConnect is legitimate desktop-support and remote-control software, so the same binary is run by IT
  help desks and by operators who deploy it for an interactive command-and-control channel or persistent
  remote access. The investigation should establish whether the tool is approved and tied to a support
  request, where it was installed from, what external endpoint it connects to, and whether it spawned
  interactive shells or follow-on tooling consistent with hands-on-keyboard activity.
type: detection
detection_id: 57bff678-25d1-4d6c-8211-8ca106d12053
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match what this rule detects, with binary metadata identifying it as ScreenConnect?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the binary's signed metadata against the rule's criteria. The rule fires when any one of the process metadata fields identifies ScreenConnect, the Description equals "ScreenConnect Service", the Product equals "ScreenConnect", or the Company equals "ScreenConnect Software". Confirm at least one of these fields is present and that the binary is genuinely the ScreenConnect agent rather than an unrelated process with spoofed metadata.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Company
      - Description
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run remote access software such as ScreenConnect?
  context: Legitimate remote support involves help-desk staff and jump hosts running ScreenConnect routinely, while the same execution on a standard endpoint with no support relationship is far more interesting. Knowing whether the user role and host function involve sanctioned remote support is often the fastest path to distinguishing routine IT activity from operator-deployed remote access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is ScreenConnect on the organization's approved remote access software list?
  context: Organizations typically maintain a list of sanctioned remote access tools for IT support. Even if ScreenConnect is a well-known commercial product, an instance that is not part of the approved deployment may represent shadow IT or attacker-deployed persistence. Unauthorized remote access tools should be checked regardless of the product's reputation, since operators frequently abuse the same agents IT teams trust.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a current helpdesk ticket or scheduled support session explaining this remote access?
  context: Legitimate ScreenConnect usage typically correlates with an active support ticket, a scheduled maintenance window, or a user request. If no support context exists for this session, the agent may have been installed by an operator for persistent access or by a user circumventing security controls. The execution context helps match the event against support records.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the ScreenConnect agent run? Decode its full command line and working directory.
  context: The full command line distinguishes an interactive client launch from a service or unattended-access install. Decode any session identifiers, relay host or URL parameters, install or run flags, and the working directory. Operator deployments often embed a custom relay endpoint or instance code directly on the command line, which reveals where the session connects and under whose ScreenConnect tenant.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned the ScreenConnect agent, and is that parent chain expected?
  context: The parent process reveals how the agent was invoked. An IT-driven launch typically descends from explorer.exe, an installer, or services.exe for an installed service. Parents like a browser, a mail client, mshta.exe, wscript.exe, powershell.exe, or an archive tool indicate that the agent was dropped and run as part of a delivery chain rather than a sanctioned install. Walk up the tree to see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1219.install_artifact
  question: Where was the ScreenConnect agent installed from, and was the executable written to a user-writable or temporary path?
  context: Remote access agents installed by operators are commonly written to user-writable or temporary locations rather than the standard install directory under Program Files. A drop into a download folder, the user profile, ProgramData, or a temp path, especially when the writing process is a browser or a script host, points to ad hoc deployment rather than a managed install. File paths here are derived from the agent's own file activity on the host.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1219.persistence_service
  question: Was a service or autorun created for ScreenConnect to persist remote access across reboots?
  context: ScreenConnect's unattended-access mode installs a service so the agent survives reboots and logoffs, giving an operator durable remote control. Service installation and autorun creation around the alert time indicate persistence rather than a one-time interactive session. Review whether the service or autorun was registered by a sanctioned install process or by an unexpected parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_service_ops:
        CommandLine|contains:
          - 'sc create'
          - 'sc config'
          - 'New-Service'
          - 'reg add'
          - 'CurrentVersion\Run'
          - 'CurrentVersion\Services'
      condition: selection and filter_service_ops
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:remote_access_tool.connection_destination
  question: What external endpoint and port does the ScreenConnect agent connect to?
  context: ScreenConnect establishes a long-lived outbound session to a relay server. The destination reveals whether it connects to a recognized hosted ScreenConnect tenant or to a custom or attacker-controlled relay, and the port matters because operator deployments may use configurable or non-standard high ports rather than the expected web ports. A connection to unfamiliar infrastructure, or a self-hosted relay outside the organization's known tenant, shifts the disposition toward unauthorized remote access.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.follow_on
  question: What child processes did the ScreenConnect agent spawn, and do any of them launch shells or living-off-the-land binaries?
  context: An interactive remote session reveals itself through the children the agent spawns. A benign support session usually spawns little beyond the tool's own helpers; hands-on-keyboard activity commonly spawns cmd.exe, powershell.exe, reconnaissance utilities, or signed living-off-the-land binaries for follow-on actions. Review the children and their command lines for reconnaissance, credential access, or staging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run the ScreenConnect agent?
  context: An agent that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution, which on an endpoint with no support relationship raises the priority of the relay and child-process findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run the ScreenConnect agent, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even sanctioned remote support can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how ScreenConnect has historically run here. A new parent process, an unexpected user account, or an unusual launch pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: ScreenConnect Service
      - Product: ScreenConnect
      - Company: ScreenConnect Software
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: ScreenConnect Service
      - Product: ScreenConnect
      - Company: ScreenConnect Software
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: ScreenConnect Service
      - Product: ScreenConnect
      - Company: ScreenConnect Software
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or remote sessions opened on multiple endpoints. If the same user established remote access on several hosts in the window, the scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: ScreenConnect Service
      - Product: ScreenConnect
      - Company: ScreenConnect Software
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded remote access and help reconstruct the timeline. Look for patterns: tooling or tampering followed by an interactive remote session.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
