name: PUA - Radmin Viewer Utility Execution
id: c3829aa2-d138-4c1d-b4ab-de7968ddb96e
description: |
  Detects execution of the Radmin Viewer remote-control utility, identified by the process PE metadata
  (Description "Radmin Viewer", Product "Radmin Viewer", or OriginalFileName Radmin.exe) regardless of how
  the binary was renamed on disk. Radmin is legitimate remote-administration software used by IT and helpdesk
  teams, but the same capability lets an operator drive a Windows host interactively from elsewhere, so it is
  also abused for hands-on-keyboard lateral movement and persistent remote access. The investigation should
  confirm the tool is authorized and tied to a real support session, determine which host and account initiated
  the access and where the tool connected, and check whether the activity is isolated or part of a deployment
  pushed across multiple hosts.
type: detection
detection_id: 5817e76f-4804-41e6-8f1d-5fa0b3ecae2d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process carry Radmin Viewer PE metadata, matching what this rule identifies?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when any one of the process metadata fields identifies Radmin Viewer, either a Description of "Radmin Viewer", a Product of "Radmin Viewer", or an OriginalFileName of Radmin.exe. Confirm at least one of these is present in the actual event, since the on-disk file name may have been changed and the metadata is what identifies the tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Description
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run remote-administration software?
  context: Legitimate remote-control activity is normal on IT and helpdesk endpoints and on jump boxes, but uncommon on general-purpose workstations and servers. Knowing whether the user role and host function involve remote administration is often the fastest path to distinguishing sanctioned support from unauthorized or attacker-driven remote access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is Radmin on the organization's approved remote access software list?
  context: Organizations typically sanction a specific remote-access tool for IT support and treat everything else as shadow IT or attacker-deployed access. Radmin not appearing on the approved list, even though it is well-known commercial software, is reason to investigate regardless of the tool's reputation. Confirm whether Radmin is sanctioned for this host and team.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a current helpdesk ticket or support session explaining this Radmin access?
  context: Legitimate remote-access activity usually correlates with an active support ticket, a scheduled maintenance window, or a user request. If no support context exists for this session, the tool may have been installed for persistent attacker access or by a user circumventing controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What did this Radmin invocation actually do? Review the full command line and connection mode.
  context: The full command line reveals how Radmin was driven, whether it opened an interactive viewer session, connected to a specific host or port, or ran in an unattended or silent mode. Decode any host, port, or credential flags to understand what remote target this instance reached and how. The query scopes to all Radmin executions on this host in the surrounding window so sequential invocations that form one session are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned Radmin, and is that parent chain expected?
  context: The parent process reveals how Radmin was launched. Interactive support use typically descends from explorer.exe or a shell; a deployment tool or scheduled task points to a pushed install. Parents such as a deployment console, a script host, or an Office application suggest automated or staged execution rather than a user opening the viewer. Walk up the tree to see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint did Radmin connect to from this host?
  context: Remote-control tools establish connections to the host being controlled or to relay infrastructure. The destination reveals whether the session reached an internal management network and known administrative source, or an unexpected internal host or external address. An external or unfamiliar destination for what should be internal IT support is the deviation worth chasing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:lateral_movement.source_host_identification
  question: What host initiated the remote connection to this machine, and is it an expected administrative source?
  context: Remote control requires a source and a destination. Identifying the originating host reveals whether the connection came from a known admin jump box, a compromised workstation, or an unexpected source. An operator who has compromised one host uses it as a pivot point to reach others over remote-administration ports.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 4899
          - 4900
          - 3389
          - 445
          - 5985
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- source: template:lateral_movement.authentication_method
  question: What account drove this Radmin session, and is its authentication consistent with sanctioned support?
  context: The account behind the remote session reveals how access was obtained. Radmin maintains its own access controls separate from Windows logon, so correlating the process user with the surrounding logon events shows whether a valid support credential was used or whether the session ran under an unexpected or service account. Mismatches suggest the tool was driven outside normal support workflows.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- source: template:lateral_movement.target_activity_after_access
  question: What processes were spawned on this host after the remote session was established?
  context: Remote control is a means to an end. An operator connects in order to run commands, deploy tools, or access data on the target. Examining processes spawned shortly after the Radmin session reveals the objectives pursued on this host, distinguishing routine support from hands-on-keyboard activity.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- source: template:lateral_movement.lateral_movement_scope
  question: Has this user account driven remote-administration or remote-execution tools against other hosts?
  context: Operators rarely stop at one target. If the same account is using remote-control and remote-execution tooling across multiple systems, the scope of compromise is larger. Connections from a single account to many hosts within a short window indicate active lateral movement across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\radmin.exe'
          - '\rserver3.exe'
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the Radmin metadata pattern, what parents and users drove it, and does the current alert fit?
  context: Even sanctioned tools can be abused. The query mirrors the rule's metadata selection scoped to this host, so the resulting parent and user distribution reflects how Radmin has historically run here, not generic remote-tool usage. A new parent process, an unexpected user account, or an unusual launch pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Radmin Viewer
      - Product: Radmin Viewer
      - OriginalFileName: Radmin.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Radmin Viewer
      - Product: Radmin Viewer
      - OriginalFileName: Radmin.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Radmin Viewer
      - Product: Radmin Viewer
      - OriginalFileName: Radmin.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the operation may be larger than this single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Radmin Viewer
      - Product: Radmin Viewer
      - OriginalFileName: Radmin.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: attack:T1072.time_correlation
  question: Did a software-deployment or management console log a push of this tool to this host around the alert time?
  context: Software deployment platforms drive remote-control tooling onto endpoints as part of legitimate rollouts, and their own logs record what was pushed, when, and by which account. Correlating the alert time against deployment and management console events shows whether this Radmin execution was a sanctioned push, and whether it landed during or outside standard maintenance hours, which is the timing deviation worth chasing for deployment-tool abuse.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Provider_Name
      - EventID
      - Message
- source: template:cue_process_tool.scope
  question: Have other hosts fired the Radmin metadata pattern in the past week, and does the cross-host distribution look like a managed rollout or one-off activity?
  context: The query mirrors the rule's metadata selection with no host scope, so the result is a fleet-wide count of the Radmin firing pattern, not generic remote-tool usage. Many hosts firing the same pattern points to a managed deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Radmin Viewer
      - Product: Radmin Viewer
      - OriginalFileName: Radmin.exe
      condition: selection
    fields:
    - host.name
