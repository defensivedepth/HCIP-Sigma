name: Remote File Download Via Findstr.EXE
id: c01248ba-cd36-4768-817d-5badd25ee132
description: |
  Detects findstr.exe running with the -v and -l flags together with a UNC path
  (\\) on its command line. This flag combination turns the built-in string
  search utility into a file-copy primitive: -l forces literal matching and -v
  prints only non-matching lines, so searching a remote file for an
  impossible-string emits the entire file content, which output redirection can
  then write to a local path or into an NTFS Alternate Data Stream
  (file.ext:stream). The rule fires only when all of these conditions hold at
  once - a findstr invocation (by command line, image, or original filename) AND
  the -v flag AND the -l flag AND a UNC reference. This is rarely a legitimate
  search; it is a Microsoft-signed way to pull a payload from a remote share and
  optionally hide it in a stream. Investigate which remote source was read, where
  the output landed (a regular file or a colon-stream destination), whether the
  written content was later executed by a signed proxy binary, and whether the
  same pattern appears elsewhere on the host or fleet.
type: detection
detection_id: 587254ee-a24b-4335-b3cd-065c0f1f4baa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show findstr running with both the -v and -l flags
    and a UNC path, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when all four conditions hold together - a findstr invocation
    (by command line, image, or original filename) AND the -v flag AND the -l flag
    AND a UNC reference (\\). Read the exact command line and confirm all are present.
    A findstr search missing any one of these is outside the rule's pattern. The
    presence of all four, especially with a long literal token that is unlikely to
    appear in the source, is the file-copy primitive rather than an ordinary search.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to copy files from remote shares using
    command-line utilities?
  context: Using findstr to read a remote file and redirect its content locally is
    not a normal search workflow; legitimate file copies use copy, robocopy, or
    explorer. Most users and most endpoints never invoke findstr this way. Knowing
    whether the acting account and the host function involve scripted file movement
    or developer tooling is often the fastest path to separating a benign edge case
    from deliberate retrieval of a payload from a share.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: What remote source did findstr read, and where was its output redirected
    - to a regular file or into an NTFS data stream?
  context: The full command line carries the two artifacts that determine intent.
    The source operand is a UNC path (\\host\share\file) pointing at the remote
    content being pulled. The redirection target after > is the destination - a
    normal file path means a straight remote-to-local copy, while a path containing
    colon-stream syntax (file.txt:payload.exe) means the content was written into an
    Alternate Data Stream to hide it. The literal token following -l is the
    impossible-string chosen so the -v non-match emits the entire source file. Decode
    all three to establish what was retrieved and whether it was hidden.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1564.004.ads_destination
  question: Did the findstr redirection target a colon-stream Alternate Data Stream
    destination rather than a plain file?
  context: Writing the retrieved content into an ADS (host.txt:payload.exe) hides it
    from directory listings and most file scanners while keeping it executable by
    several signed binaries. The distinguishing artifact is a colon between a file
    name and a stream name in the redirection target. This query scopes to the
    alerting host and the rule's findstr download pattern, then surfaces command
    lines so the analyst can confirm whether the destination used stream syntax. A
    plain-file destination is a remote copy; a colon-stream destination is a copy
    plus a hide step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr:
        - CommandLine|contains: findstr
        - Image|endswith: findstr.exe
        - OriginalFileName: FINDSTR.EXE
      selection_cli:
        CommandLine|contains|windash:
          - ' -v '
          - ' -l '
      selection_unc:
        CommandLine|contains: \\\\
      selection_host:
        host.name|expand: '%hostname%'
      condition: selection_findstr and selection_cli and selection_unc and selection_host
    fields:
      - CommandLine
      - User
- source: template:download_tool.download_success_verification
  question: Did a file actually get created at the redirection destination on this
    host?
  context: A findstr download command does not guarantee the content was written.
    The remote share may have been unreachable, the source path wrong, or the write
    blocked. Confirming a file creation at the destination path established from the
    command line shows whether the operation actually landed content on disk. If the
    destination was an ADS, the file-create event records the base host file; the
    stream itself is confirmed by the create-stream evidence.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: If the retrieved file is still on disk, what is its hash and reputation?
  context: When the destination file (or the ADS-hosting host file) is still present,
    its hash can be submitted to threat intelligence services or the file detonated
    in an isolated environment. This reveals whether the content findstr pulled from
    the share is a known malicious tool, a legitimate binary that was relocated, or
    something novel needing deeper review. ADS-hosted content requires reading the
    stream explicitly, since standard tools list only the base file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the destination directory around the
    same time?
  context: Operators often stage multiple files into one directory, or the retrieved
    content triggers further writes such as extraction or additional pulls from the
    share. Examining directory-level file activity around the findstr invocation
    reveals whether this was a single copy or part of a broader staging operation,
    and surfaces companion files dropped alongside the retrieved payload.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      filter_self:
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection and not filter_self
    fields:
      - TargetFilename
      - Image
- source: attack:T1105.remote_share_connection
  question: Did this host open an SMB or WebDAV connection to a remote share around
    the time findstr ran?
  context: The UNC path on the findstr command line means the source content lives on
    a remote share, so the retrieval generates an outbound file-sharing connection
    from this host. Correlating a network connection on the SMB (445) or WebDAV (80,
    443) ports in the alert window confirms the transfer reached the network stage
    and identifies the remote endpoint that hosted the payload. A connection to an
    unfamiliar or external address is more concerning than one to a known internal
    file server.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 139
          - 80
          - 443
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - DestinationHostname
- source: attack:T1564.004.ads_stream_creation
  question: Was an Alternate Data Stream created on this host in the window around the
    findstr invocation?
  context: When findstr redirects its output into a colon-stream destination, the
    write produces a named stream attached to a base file rather than an ordinary
    file. Stream-creation evidence records the host file together with the stream
    name, which standard directory listings do not show. Reviewing stream creations
    on this host around the alert confirms whether content was hidden in an ADS and
    names the host file carrying it, so the stream can be read and analyzed directly.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: create_stream_hash
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - Hashes
- source: attack:T1218.ads_execution
  question: Was content executed from an Alternate Data Stream by a signed proxy
    binary after the findstr write?
  context: Hiding a payload in a stream only matters if it is run. Several
    Microsoft-signed binaries accept colon-stream paths and execute the stored
    content - wmic process call create, rundll32, regsvr32, cscript, wscript, and
    forfiles among them. A process creation on this host whose command line contains
    both one of these binaries and colon-stream syntax indicates the hidden payload
    was launched, closing the write-then-execute loop. This is the step the ADS hide
    was meant to enable.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_proxy:
        Image|endswith:
          - '\wmic.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\cscript.exe'
          - '\wscript.exe'
          - '\mshta.exe'
          - '\forfiles.exe'
      selection_stream:
        CommandLine|contains:
          - '.txt:'
          - '.log:'
          - '.doc:'
          - '.dat:'
      condition: selection_host and selection_proxy and selection_stream
    fields:
      - Image
      - CommandLine
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned findstr, and is that parent chain expected for this
    activity?
  context: The parent process reveals how the findstr download was invoked. The
    flags that turn findstr into a copy primitive are set by whatever launched it,
    so the parent is where the retrieval was decided. Interactive use usually shows
    a console shell; an unexpected parent such as a script host, mshta.exe, or an
    Office application points to automated or scripted invocation consistent with
    payload retrieval rather than a hand-typed search.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's findstr download pattern,
    what parents and users normally drive it, and does the current alert fit?
  context: Even on hosts where scripted file movement happens, the findstr -v -l UNC
    pattern is narrow. This query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this
    specific firing pattern has historically run here, not generic findstr usage. A
    new parent process, an unexpected account, or a first-ever occurrence is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr:
      - CommandLine|contains: findstr
      - Image|endswith: findstr.exe
      - OriginalFileName: FINDSTR.EXE
      selection_cli_download_1:
        CommandLine|contains|windash: ' -v '
      selection_cli_download_2:
        CommandLine|contains|windash: ' -l '
      selection_cli_download_3:
        CommandLine|contains: \\\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_findstr and all of selection_cli_download_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's findstr download pattern in the past
    week, and does the cross-host distribution look like automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the findstr download pattern rather than
    generic findstr activity. Many hosts firing the same pattern points to a script
    or deployment job that uses findstr to pull files by design; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr:
      - CommandLine|contains: findstr
      - Image|endswith: findstr.exe
      - OriginalFileName: FINDSTR.EXE
      selection_cli_download_1:
        CommandLine|contains|windash: ' -v '
      selection_cli_download_2:
        CommandLine|contains|windash: ' -l '
      selection_cli_download_3:
        CommandLine|contains: \\\\
      condition: selection_findstr and all of selection_cli_download_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run findstr against remote shares with the -v and
    -l download flags?
  context: Compare the acting account against its own history. A scripting or
    deployment account might pull files this way routinely; an account that has never
    issued the findstr download pattern is more notable. The user role and typical
    toolset should align with command-line file retrieval.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|windash:
          - ' -v '
          - ' -l '
      selection_findstr:
        CommandLine|contains: findstr
      condition: selection and selection_findstr
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent process and findstr download command-line pattern
    historically routine on this host or across the environment, or is the parent
    unusual for it?
  context: When the alert fires under a service principal, user identity does not
    attribute the behavior; the meaningful pivot is which parent process launched a
    findstr child carrying the -v -l UNC download pattern and whether that pairing is
    historically common. A new or rare parent for this pattern on this host or
    environment-wide is the deviation worth chasing, while a parent that already
    accounts for many prior events is more likely a script or deployment job.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|windash:
          - ' -v '
          - ' -l '
      selection_findstr:
        CommandLine|contains: findstr
      condition: selection and selection_findstr
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the findstr download was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope
    of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent process and findstr download command-line pattern
    fire on other hosts in the same window, indicating a coordinated rollout rather
    than isolated activity?
  context: Under a service principal, asking what else the user did across the
    network returns agent-telemetry noise, since every host runs system-owned agents
    constantly. The meaningful question is whether the same launch mechanism - a
    parent process spawning a findstr child that carries the -v -l UNC pattern -
    fired on other hosts in the alert window. Multiple hosts in the same window
    points to scheduled or pushed automation; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains|windash:
          - ' -v '
          - ' -l '
      selection_findstr:
        CommandLine|contains: findstr
      condition: selection and selection_findstr
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    or defense tampering - may reveal the attack stages that preceded the findstr
    download and help reconstruct the timeline. Pulling a payload from a remote share
    is often one step in a sequence, so prior alerts give the context for what the
    retrieved content was meant to support.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1105
      name: Ingress Tool Transfer
      role: primary
    - id: T1564.004
      name: 'Hide Artifacts: NTFS File Attributes'
      role: primary
    - id: T1218
      name: System Binary Proxy Execution
      role: secondary
    - id: T1552.001
      name: 'Unsecured Credentials: Credentials In Files'
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: findstr_invocation
      description: "findstr is launched with -v, -l and a UNC path, the file-copy primitive the rule detects"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: source_and_destination_decode
      description: "The remote UNC source operand and the redirection target (plain file vs colon-stream ADS) are decoded from the command line"
      mapped_to: Q3
      source: template:credential_access.credential_target_identification
    - stage: 3
      label: remote_transfer
      description: "The retrieval reaches the network: an SMB/WebDAV connection to the remote share hosting the source content"
      mapped_to: Q8
      source: attack:T1105.remote_share_connection
    - stage: 4
      label: content_landed
      description: "Content is written to disk at the destination - a regular file or an Alternate Data Stream"
      mapped_to: Q5
      source: template:download_tool.download_success_verification
    - stage: 5
      label: ads_hide
      description: "When the destination is a colon-stream path, the content is hidden in an ADS attached to a host file"
      mapped_to: Q9
      source: attack:T1564.004.ads_stream_creation
    - stage: 6
      label: proxy_execution
      description: "The hidden payload is executed from the stream by a Microsoft-signed proxy binary (wmic/rundll32/regsvr32/cscript/wscript)"
      mapped_to: Q10
      source: attack:T1218.ads_execution
  dimension_coverage:
    - dimension: command_analysis
      technique: T1218
      covered_by: Q3
      source: template:credential_access.credential_target_identification
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1105
      covered_by: Q11
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1105
      covered_by: Q13
      source: template:cue_process_tool.baseline_deviation
      coverage_type: direct
    - dimension: time_correlation
      technique: T1564.004
      covered_by: Q10
      source: attack:T1218.ads_execution
      coverage_type: direct
    - dimension: user_context
      technique: T1552.001
      covered_by: Q15
      source: template:cue_user_actor.baseline
      coverage_type: direct
    - dimension: file_path_analysis
      technique: T1105
      covered_by: Q7
      source: template:download_tool.directory_activity
      coverage_type: direct
    - dimension: process_identification
      technique: T1552
      covered_by: Q1
      source: template:universal.verify_trigger_match
      coverage_type: indirect
  mutable_dispositions:
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "UNC source path \\\\host\\share, redirection target, colon-stream destination (file.ext:stream), impossible-string literal after -l"
      disposition: new_question
      target_question: Q3
      notes: "Realized as the source/destination decode question (Q3) and the colon-stream destination check (Q4 attack:T1564.004.ads_destination, CommandLine|contains ':' stream extensions)."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (e.g., regsvr32.exe not launched by explorer.exe)"
      disposition: context
      target_question: Q11
      notes: "Tuning rationale; no concrete parent list in the analytic for this rule. Realized as the parent-chain question (Q11) and the parent-pivot baseline/clustering questions (Q16, Q18)."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "wmic.exe, rundll32.exe, regsvr32.exe, cscript.exe, wscript.exe, mshta.exe, forfiles.exe"
      disposition: query_injection
      target_question: Q10
      notes: "Signed proxy binaries that execute from ADS injected into Image|endswith of the ads_execution question."
    - element: FilePathRegex
      dimension: file_path_analysis
      specific_values: "rationale only (uncommon drop paths, e.g., C:\\Users\\Public)"
      disposition: context
      target_question: Q7
      notes: "No fixed path list in this rule (destination derived from CommandLine). Realized via %file_paths%/%file_dirs% scoping in Q5/Q6/Q7."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (correlate ADS/file creation with subsequent execution)"
      disposition: context
      target_question: Q10
      notes: "Realized as the write-then-execute correlation: ads_stream_creation (Q9, +/-15m) followed by ads_execution (Q10, +1h)."
    - element: ProcessScope
      dimension: tuning_parameter
      specific_values: "rationale only (powershell.exe, cmd.exe, wscript.exe)"
      disposition: context
      target_question: Q13
      notes: "Realized as the parent/user distribution surfaced by the REFLECTED baseline_deviation question (Q13)."
    - element: DestinationIPCategory
      dimension: tuning_parameter
      specific_values: "rationale only (internal vs external IP blocks)"
      disposition: context
      target_question: Q8
      notes: "Realized in the remote_share_connection question (Q8), which surfaces DestinationIp/DestinationHostname so the analyst can judge internal vs external."
  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot and launch-mechanism-pivot). Image-pivot adapted to the findstr -v -l download CommandLine pattern, since findstr is a noisy built-in and Image-only scoping would return all findstr searches."
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot and launch-mechanism-pivot)."
      kept: both
    - dropped: cue_process_tool.baseline
      reason: "generic Image|endswith findstr host baseline would return every ordinary findstr search (findstr is a high-volume built-in), not the download pattern; subsumed by the REFLECTED baseline_deviation (Q13) which scopes to the rule's actual -v -l UNC firing pattern"
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.clustering + cue_host_context.clustering
      reason: "Image-only / host-only process aggregation around the alert is subsumed by download_tool.directory_activity (Q7, destination-directory file activity) and the REFLECTED baseline_deviation (Q13, host firing pattern); dropped to stay within the 14-18 target"
      kept: download_tool.directory_activity + cue_process_tool.baseline_deviation
    - dropped: universal.evidence_preservation
      reason: "near-identical to download_tool.download_success_verification (Q5) — both ask whether the destination file is on disk via file_event %file_paths%; the download_tool version is more specific to the retrieval and is kept"
      kept: download_tool.download_success_verification
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: credential_access.credential_target_identification (hint 1). Phase 2 decode is provided by credential_target_identification (Q3), adapted to identify the remote source and the redirection destination of the findstr operation."
    - template: cue_process_tool.follow_on
      reason: "follow_on scopes children by ParentImage|endswith %Image% (findstr as parent). findstr does not spawn the executor; the ADS payload is launched by a separate signed proxy binary later. That follow-on execution is covered more directly by attack:T1218.ads_execution (Q10). Trimmed to stay within the 14-18 target."
    - template: credential_access.post_access_lateral_movement
