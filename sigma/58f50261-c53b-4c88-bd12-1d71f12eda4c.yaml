name: Windows Credential Manager Access via VaultCmd
id: 098c50a2-d560-4bde-9ffb-97b81306b67d
description: |
  Detects the native Windows utility vaultcmd.exe (identified by Image or OriginalFileName) invoked with the
  /listcreds: argument, which enumerates and lists credentials currently stored in Windows Credential Manager.
  The rule fires only when both the binary selection AND the command-line selection match. Listing stored
  credentials is a credential-access step that exposes saved web, application, and domain credentials from the
  user's Credential Locker; legitimate administrators and some support tooling occasionally enumerate stored
  credentials, so the investigation should confirm the user and host are expected to perform this, identify
  which credential vault was read, and determine whether the access was followed by use of the exposed
  credentials.
type: detection
detection_id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: 'Does the command line match what this rule detects, with vaultcmd.exe running and a /listcreds: argument present?'
  context: 'Before investing investigation time, confirm the alert is a true positive. The rule fires only when both halves hold together, a VaultCmd binary (Image ending in \VaultCmd.exe or OriginalFileName VAULTCMD.EXE) AND a command line containing /listcreds:. Confirm both are present in the actual event and note the vault name that follows /listcreds: if one was supplied.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enumerate stored credentials from Windows Credential Manager?
  context: Legitimate administrative or support activity can list stored credentials, but enumerating the Credential Locker is uncommon for ordinary users and most server roles. Knowing whether the user role and host function are consistent with reading saved credentials is often the fastest path to separating routine administration from credential theft. Low-privileged or service accounts running this are a stronger signal than an administrator on a management host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes hands-on credential access. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful protection-looks-healthy signal; kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:credential_access.credential_target_identification
  question: Which credential vault was targeted, and was a specific vault GUID named after /listcreds:?
  context: 'The /listcreds: argument selects which Credential Locker vault to enumerate. The default Web Credentials and Windows Credentials vaults hold saved browser and domain passwords; a GUID following /listcreds: targets a specific vault. Identifying the vault determines which saved credentials were exposed and which accounts need rotation. Command lines containing keywords such as dpapi or credman alongside this access point to broader credential tooling.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1555.004.file_path_analysis
  question: Were Credential Locker vault files accessed or written on this host around the alert?
  context: Listing stored credentials reads the on-disk Credential Locker. Files with .vcrd and .vpol extensions under the user profile Credentials and Vault directories hold the encrypted credential blobs and policy. File-stream activity touching these paths in the same window confirms the enumeration reached the vault store rather than failing on an empty or locked vault, and reveals whether the locker was also copied or staged for offline use.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: create_stream_hash
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_path:
        TargetFilename|contains:
          - '\AppData\Local\Microsoft\Credentials'
          - '\AppData\Local\Microsoft\Vault'
          - '\AppData\Roaming\Microsoft\Credentials'
          - '\AppData\Roaming\Microsoft\Vault'
          - '.vcrd'
          - '.vpol'
      condition: selection_host and selection_path
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1555.004.process_access
  question: Did vaultcmd.exe or a related process open a handle to other processes holding credential material around the alert?
  context: Credential Manager access can extend beyond reading the on-disk locker to opening handles against processes that hold live credential material, such as lsass.exe, the Vault service host, or vaultsvc. Cross-process handle access from the alerting binary, or to lsass.exe in the same window, indicates the operator moved from listing saved credentials to reaching live secrets. Review the granted access mask for read-memory rights.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        SourceImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetImage
      - GrantedAccess
      - SourceImage
- source: template:cue_process_tool.process_chain
  question: What process spawned vaultcmd.exe, and is that parent chain expected?
  context: The parent process reveals how the credential enumeration was invoked. Interactive administration usually descends from explorer.exe or a shell; automation from services.exe or a scheduled-task host. Parents such as mshta.exe, wscript.exe, an Office application, or a remote-execution service point to scripted or remote-operator activity rather than hands-on administration. Walk up the tree to see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did vaultcmd.exe spawn afterward?
  context: The processes spawned after credential enumeration reveal how the exposed credentials were used. A benign administrative check usually spawns nothing; credential theft is often followed by cmd.exe, powershell.exe, certutil.exe, or remote-access tooling that stages or uses the harvested secrets. Review any children and their command lines for follow-on activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run vaultcmd.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. VaultCmd is rarely invoked interactively on most endpoints and servers, so zero or very low historical counts indicate first-time or rare execution and raise the priority of the credential-access finding.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: 'Even legitimate VaultCmd usage can be abused. The query mirrors the rule''s selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific /listcreds: firing pattern has historically run here, not generic vaultcmd usage. A new parent process, an unexpected user account, or an unusual command shape is the anomaly worth chasing.'
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VaultCmd.exe
      - OriginalFileName: VAULTCMD.EXE
      selection_cli:
        CommandLine|contains: '/listcreds:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally enumerate stored credentials across the environment?
  context: Compare this user's current action against their historical behavior. A user who has never run vaultcmd.exe to list credentials is more suspicious than one who does so regularly as part of their role. User role and typical toolset should align with reading the Credential Locker.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and vaultcmd.exe combination historically routine on this host or across the environment, or is the parent unusual for the binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned vaultcmd.exe, and is that pair historically common. A new or rare parent for this binary on this host or environment-wide is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar credential or execution activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and vaultcmd.exe combination fire on other hosts in the same window, indicating a coordinated automation rollout rather than isolated activity?
  context: Under a service principal, asking what else this user did across the network returns agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism, parent process plus spawned binary, fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this credential access, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or staging of the exposed credentials.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Credential theft is typically followed by lateral movement, where the operator uses exposed credentials to access other systems. Detecting new logon events or outbound remote connections shortly after the Credential Manager enumeration indicates active use of the exposed credentials. Look specifically for new RDP, SMB, or WinRM activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be exposed by the listed credentials, and do any have elevated privileges?
  context: The severity of this access depends on what the Credential Locker held and the privilege of the affected accounts. Saved domain-admin or service-account credentials require incident escalation and rotation; a standard user's saved web logins may only need monitoring. Cross-reference the alerting user and any vault contents against directory group memberships, and treat the running account itself as a baseline of expected versus unexpected privileged access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: 'The query mirrors the rule''s selection structure with no host scope, so the result is a fleet-wide count of this /listcreds: firing pattern, not generic vaultcmd usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.'
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VaultCmd.exe
      - OriginalFileName: VAULTCMD.EXE
      selection_cli:
        CommandLine|contains: '/listcreds:'
      condition: all of selection*
    fields:
    - host.name
