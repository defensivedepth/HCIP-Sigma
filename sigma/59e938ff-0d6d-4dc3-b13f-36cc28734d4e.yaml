name: Execute Code with Pester.bat
id: 03e0175b-c78f-4824-a0d3-0aae1ec708de
description: |
  Detects code execution proxied through Pester.bat, the batch helper shipped with the Pester PowerShell testing module,
  which can be coerced into running arbitrary commands under cover of a legitimate test-runner invocation. The rule fires
  when either powershell.exe or pwsh.exe runs with both Pester and Get-Help on the command line, OR cmd.exe runs with both
  pester and a semicolon present AND the command line also contains help or \?. The technique abuses a signed/legitimate
  script entry point to run attacker code, so the investigation should decode the full command line, confirm the user and
  host are expected to run PowerShell test tooling, and determine whether the invocation drives a legitimate test run or
  proxies follow-on execution.
type: detection
detection_id: 59e938ff-0d6d-4dc3-b13f-36cc28734d4e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event match the rule's pattern — either powershell.exe/pwsh.exe with both Pester and Get-Help, or cmd.exe with pester and a semicolon plus help or \?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process image. The rule fires on either of two branches, so note which one matched. The PowerShell branch requires powershell.exe or pwsh.exe with both Pester and Get-Help present; the cmd branch requires cmd.exe with both pester and a semicolon, plus help or \? in the command line. The branch that fired patterns which downstream questions carry weight — the cmd branch in particular implies a chained command sequence after the semicolon.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run the Pester testing module or its batch helper?
  context: Pester is a legitimate PowerShell testing framework used by developers and CI/build automation, but it is uncommon on general-purpose endpoints and non-developer servers. Knowing whether the user role and host function involve PowerShell module development or test execution is often the fastest path to separating a routine test run from proxied code execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: Decode the full command line. What is the Pester/Get-Help invocation actually doing, and is there a chained command after a semicolon?
  context: The full command line reveals the specific operation. Reconstruct the arguments passed to the interpreter, identify whether the Pester and Get-Help tokens form a genuine help/test invocation or a pretext wrapping other code, and decode any chained statements following a semicolon. The cmd branch in particular fires only when a semicolon is present, so a follow-on command after the separator is the load-bearing artifact to read.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - Pester
          - pester
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does it decode to?
  context: Code proxied through a test-runner entry point is frequently wrapped in PowerShell's -EncodedCommand (-enc) parameter, string concatenation, backtick escaping, or variable substitution to hide intent. Base64-encoded commands are the most common form. Decoding reveals the actual payload — download cradles, reverse shells, or in-memory loading of .NET assemblies. If the command line is already readable plain text, focus on what the readable cradle fetches and executes instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging records the deobfuscated script content that PowerShell actually executes, even when the command line is encoded or obfuscated. This provides ground truth about what ran, bypassing any wrapping applied at the test-runner entry point. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell security controls before running a payload. Common techniques include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), constrained language mode escape, and version downgrade attacks (powershell.exe v2, which lacks logging). Finding these precursor events on the host strengthens the case that the test-runner invocation is a cover for malicious execution.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this interpreter, and is that parent chain expected?
  context: The parent process reveals how the interpreter was invoked. Legitimate Pester usage typically descends from explorer.exe, a shell, or a CI/build agent. Parents like winword.exe, mshta.exe, wscript.exe, cscript.exe, or an archive tool indicate macro-driven or staged execution rather than interactive testing. Walk up the tree to see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1216.signed_to_unsigned_child
  question: What child processes did this interpreter spawn afterward, and do any of them launch shells or living-off-the-land binaries?
  context: Proxying execution through a signed or legitimate script entry point typically shows up in the children it spawns rather than in the interpreter itself. A genuine Pester test run usually spawns little; a proxy invocation commonly spawns cmd.exe, powershell.exe, certutil.exe, rundll32.exe, or a side-loaded signed binary to carry the actual payload. Review the children and their command lines for follow-on staging, especially an unsigned or unexpected binary launched from the signed parent.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run this interpreter?
  context: An interpreter that has rarely or never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution, which on a non-developer endpoint raises the priority of the decode result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even legitimate Pester usage can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here, not generic PowerShell usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      powershell_module:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - Pester
        - Get-Help
      cmd_execution:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - pester
        - ;
      get_help:
        CommandLine|contains:
        - help
        - \?
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (powershell_module or (cmd_execution and get_help)) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern, not generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or CI/build automation that legitimately runs Pester; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      powershell_module:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - Pester
        - Get-Help
      cmd_execution:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - pester
        - ;
      get_help:
        CommandLine|contains:
        - help
        - \?
      condition: powershell_module or (cmd_execution and get_help)
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      powershell_module:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - Pester
        - Get-Help
      cmd_execution:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - pester
        - ;
      get_help:
        CommandLine|contains:
        - help
        - \?
      _pb_scope:
        User|expand: '%User%'
      condition: (powershell_module or (cmd_execution and get_help)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      powershell_module:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - Pester
        - Get-Help
      cmd_execution:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - pester
        - ;
      get_help:
        CommandLine|contains:
        - help
        - \?
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (powershell_module or (cmd_execution and get_help)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      powershell_module:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - Pester
        - Get-Help
      cmd_execution:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - pester
        - ;
      get_help:
        CommandLine|contains:
        - help
        - \?
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (powershell_module or (cmd_execution and get_help)) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by exploitation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
