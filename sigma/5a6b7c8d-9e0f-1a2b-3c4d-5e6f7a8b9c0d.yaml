name: Cmd Launched with Hidden Start Flags to Suspicious Targets
id: 3500cfe0-c4fe-4170-ae46-0a45bdb5d954
description: |
  Detects cmd.exe (by Image or OriginalFileName) launching a command through the start utility with a hidden-window flag
  (start /b for no window, or /min for minimized) where the command line also references EITHER a suspicious file extension
  (.bat, .cmd, .cpl, .hta, .js, .ps1, .scr, .vbe, .vbs), OR an uncommon execution location (Temp, Public, Downloads, AppData
  Roaming, Perflogs, inetpub, and similar user-writable or staging directories), OR a known download/evasion pattern
  (-nop, -sta, -noni, -w hidden, .downloadfile(, .downloadstring(). The start-and-hide combination is used to run a payload
  without a visible console window. Legitimate updaters and admin scripts occasionally run hidden batch files from temporary
  folders, so the investigation should decode the full command line, identify the hidden target and which suspicious branch
  matched, confirm the parent and user are expected, and determine whether the target is benign automation or a staged payload.
type: detection
detection_id: 5a6b7c8d-9e0f-1a2b-3c4d-5e6f7a8b9c0d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects, with cmd.exe running start using a hidden-window flag against a suspicious target?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when cmd.exe (by Image or OriginalFileName) uses the start utility with a hidden-window flag (/b or /min) AND the command line references EITHER a suspicious extension, OR an uncommon location, OR a known download/evasion pattern. Confirm the start and hide flags are present, then note WHICH of the three suspicious branches matched, because that branch determines which downstream questions carry the most weight, an uncommon-location or download-pattern fire points hardest at a staged payload, while a bare suspicious-extension fire may be ordinary scripting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to launch hidden background commands through cmd.exe?
  context: Legitimate administrative scripts and software updaters do occasionally run hidden batch files from temporary folders, which is the documented false-positive pattern for this rule. Knowing whether the user role and host function involve scripted background tasks is often the fastest path to distinguishing routine automation from a deliberately concealed payload launch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.evidence_preservation
  question: Are the files referenced on this command line still on disk for analysis?
  context: When the rule matches on a suspicious extension or an uncommon location, the command line names a concrete target, a script or payload the hidden command was meant to run. Checking whether that file still exists on disk enables deeper analysis, hash lookups, sandbox submission, or content review. File paths here are derived from the cmd.exe command line itself.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: Decode the full cmd.exe command line. What is the hidden target, and what does the start command actually run?
  context: The full command line reveals the specific action the hidden-window start was meant to conceal. Identify the target named after the start verb, resolve any environment variables (%TEMP%, %AppData%, %COMSPEC%), and read what it executes, a batch or script file, a download cradle such as .downloadfile( or .downloadstring(, or a chained interpreter invocation carrying -nop, -w hidden, or -enc. Because cmd.exe is high-volume, this query is scoped to the alerting event so the decode targets the exact concealed command rather than every cmd.exe instance on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_artifact.mechanism_decode
  question: If a script or payload file is named on the command line, what is its content, and does it contain obfuscation, encoded strings, or known malware indicators?
  context: 'When the hidden command targets a file (a .bat, .cmd, .ps1, .vbs, .hta, or a payload in a staging directory), read and analyze the file''s actual content. For scripts and text: check for base64 encoding, obfuscated strings, embedded URLs, IP addresses, download cradles, or known malware string patterns. For binaries: check imports, embedded strings, packer signatures, and signing status. Content analysis requires manual retrieval from the endpoint or an EDR console, the query locates the file write to identify what to pull.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_artifact.artifact_verification
  question: What did the hidden start command launch, and what is its hash?
  context: A file's hash is recorded when it runs, so this returns the processes cmd.exe spawned with start (and their siblings) and reads their hashes. When the hidden target is itself an executable -- an .exe, .scr, or .cpl -- that payload is the spawned process and its hash appears here; submit it to VirusTotal, Hybrid Analysis, or internal threat intel. When the target is a script (.bat, .ps1, .vbs, .hta, .js), the process that runs is the interpreter, whose hash is unremarkable -- the script itself is data with no process hash, so retrieve it from the path on the command line (see the evidence-preservation step) and hash it by hand.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- source: template:cue_process_tool.process_chain
  question: What process spawned this cmd.exe, and is that parent chain expected?
  context: The parent process reveals how the hidden command was invoked. Legitimate background tasks often descend from explorer.exe for user actions or services.exe for scheduled automation. Parents such as winword.exe, excel.exe, mshta.exe, wscript.exe, or an archive or browser process indicate macro-driven or download-delivered execution rather than routine administration. Walk up the tree to see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1564.003.tuning_parameter
  question: What child processes did this cmd.exe spawn, and do any of them launch interpreters or download tooling?
  context: The processes spawned after the hidden start reveal its actual impact. The concealed command frequently chains into powershell.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, or certutil.exe to stage or download the next payload, the hidden window is what keeps that follow-on activity off the screen. A benign background updater usually spawns nothing or a single known helper. Review the children and their command lines for download cradles or further hidden execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1564.003.user_context
  question: Did any hidden-window execution via scripting hosts or off-screen window placement occur on this host in the surrounding window, beyond the cmd.exe that fired?
  context: Hidden-window evasion is not limited to cmd.exe start, the same intent shows up as powershell.exe -WindowStyle Hidden, wscript or cscript launched with concealment flags, or window placement pushed off screen. Surveying nearby hidden-execution invocations shows whether the alerting command is an isolated background task or one step in a broader run of concealed activity on the host. Pair this with the parent-chain and decode findings to judge whether the concealment is operational tradecraft or a benign updater convention.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_hidden:
        CommandLine|contains|windash:
          - ' -windowstyle hidden'
          - ' -w hidden'
          - 'start /b'
          - 'start /min'
          - ' -nop '
          - ' -noni '
      condition: selection_host and selection_hidden
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even common tooling can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific hidden-start firing pattern has historically run here, not generic cmd.exe usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_hidden_start_1:
        CommandLine|contains|windash:
        - 'start '
        - start/b
        - start/min
      selection_cmd_hidden_start_2:
        CommandLine|contains|windash:
        - '/b '
        - /b"
        - '/min '
        - /min"
      selection_cli_uncommon_location:
        CommandLine|contains:
        - :\Perflogs\
        - :\Temp\
        - :\Users\Default\
        - :\Windows\Temp\
        - \AppData\Roaming\
        - \Contacts\
        - \Documents\
        - \Downloads\
        - \Favorites\
        - \Favourites\
        - \inetpub\
        - \Music\
        - \Photos\
        - \Temporary Internet\
        - \Users\Public\
        - \Videos\
      selection_cli_susp_extension:
        CommandLine|contains:
        - .bat
        - .cmd
        - .cpl
        - .hta
        - .js
        - .ps1
        - .scr
        - .vbe
        - .vbs
      selection_cli_susp_pattern:
        CommandLine|contains:
        - ' -nop '
        - ' -sta '
        - .downloadfile(
        - .downloadstring(
        - '-noni '
        - '-w hidden '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_cmd_* and 1 of selection_cli_*) and _pb_scope
    fields:
    - ParentImage
    - User
