        - .cmd
        - .cpl
        - .hta
        - .js
        - .ps1
        - .scr
        - .vbe
        - .vbs
      selection_cli_susp_pattern:
        CommandLine|contains:
        - ' -nop '
        - ' -sta '
        - .downloadfile(
        - .downloadstring(
        - '-noni '
        - '-w hidden '
