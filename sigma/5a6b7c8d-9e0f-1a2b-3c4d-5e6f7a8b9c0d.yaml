      target_question: Q1
      notes: "Suspicious-extension list is part of the rule selection embedded verbatim in the reflected baseline_deviation (Q10) and scope (Q16) queries, and surfaced in Q1's verify query via ProcessGuid (entity-scoped, returns the matching event)."
    - element: ADSDetection
      dimension: tuning_parameter
      specific_values: "rationale only (Alternate Data Streams toggle)"
      disposition: context
      target_question: Q5
      notes: "Rule's process_creation detection does not surface ADS; folded into the file content-analysis question, which checks for stream-hidden content during manual review."
