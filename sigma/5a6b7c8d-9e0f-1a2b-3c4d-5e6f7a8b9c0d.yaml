      name: Hidden Window
      role: primary
    - id: T1564
      name: Hide Artifacts
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: hidden_start_invocation
      description: cmd.exe invokes the start utility with a hidden-window flag (/b or /min) to launch a command without a visible console.
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: concealed_target_decode
      description: The hidden command targets a suspicious extension, uncommon location, or download/evasion pattern; the concealed target is decoded.
      mapped_to: Q4
      source: template:cue_process_tool.mechanism_decode
    - stage: 3
      label: payload_content_analysis
      description: The targeted script/payload file is retrieved and its content analyzed for obfuscation and indicators.
      mapped_to: Q5
      source: template:cue_artifact.mechanism_decode
    - stage: 4
      label: follow_on_execution
      description: The hidden command chains into interpreters or download tooling for follow-on staging, kept off-screen by the hidden window.
      mapped_to: Q8
      source: attack:T1564.003.tuning_parameter
  dimension_coverage:
    - dimension: tuning_parameter
      technique: T1564.003
      covered_by: Q8
      source: attack:T1564.003.tuning_parameter
      coverage_type: direct
    - dimension: user_context
      technique: T1564.003
      covered_by: Q2
      source: template:universal.host_user_context
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1564
      covered_by: Q5
      source: template:cue_artifact.mechanism_decode
      coverage_type: direct
  mutable_dispositions:
    - element: HiddenProcessScope
      dimension: tuning_parameter
      specific_values: "PowerShell, cmd, wscript (scope to processes where hidden execution is unexpected)"
      disposition: new_question
      target_question: Q9
      notes: "Drove attack:T1564.003.user_context — a host-window sweep for hidden-window execution across cmd start, powershell -WindowStyle Hidden, and wscript/cscript concealment, the exact binaries the element names."
    - element: ParentProcessCorrelation
      dimension: tuning_parameter
      specific_values: "rationale only (correlate hidden execution with suspicious parents)"
      disposition: context
      target_question: Q7
      notes: "No fixed parent list; process_chain question names example suspicious parents (winword, excel, mshta, wscript, archive/browser) in prose and walks the parent tree."
