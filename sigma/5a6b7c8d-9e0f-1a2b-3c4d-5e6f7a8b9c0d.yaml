    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable (subject vs. launch-mechanism pivot); both emitted"
      kept: both
    - dropped: cue_process_tool.follow_on
      reason: "follow-on child-process angle reauthored as attack:T1564.003.tuning_parameter (HiddenProcessScope/ChildProcess); ParentProcessGuid-scoped for precision, technique-sourced"
      kept: attack:T1564.003.tuning_parameter
    - dropped: cue_process_tool.clustering
      reason: "host-clustering coverage provided by cue_host_context.clustering (same +/-15m host-scoped Image aggregation); process_tool variant redundant"
      kept: cue_host_context.clustering
    - dropped: cue_artifact.baseline
      reason: "file-baseline over %file_paths% redundant with evidence_preservation (Q3 same file-event scope) plus the host/fleet rule-pattern baselines (Q10, Q16); a 90d file-recurrence count adds little for a transient dropped payload"
      kept: template:universal.evidence_preservation
    - dropped: cue_process_tool.baseline
      reason: "generic cmd.exe host-baseline (Image|endswith only) is uninformative — cmd.exe runs constantly; the reflected baseline_deviation (Q10) gives the rule-pattern-specific host baseline instead"
