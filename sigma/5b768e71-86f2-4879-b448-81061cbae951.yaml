    - dropped: cue_process_tool.follow_on
      reason: "follow_on scopes children by ParentImage|endswith %Image% where %Image% is net.exe - net.exe rarely spawns meaningful children (it forwards to net1.exe), so the query returns the net1.exe relay or nothing. Post-event host activity is covered more usefully by cue_host_context.clustering (Q15) and the lateral/remote-access sweep (Q10)."
      kept: cue_host_context.clustering
