  mutable_dispositions:
    - element: SuspiciousCliSwitches
      dimension: tuning_parameter
      specific_values: "/transfer, /addfile, /SetNotifyCmdLine, /resume, /setcustomheaders, /setminretrydelay"
      disposition: query_injection
      target_question: Q5
      notes: "/transfer, /create, /addfile are already enforced by the rule's selection_flags and are mirrored in the baseline/baseline_svc/clustering_svc/historical queries. The execute/persist switches (/SetNotifyCmdLine, /resume, /complete, /setcustomheaders, /setminretrydelay) are injected into the attack:T1197.notify_command selection_notify CommandLine|contains block."
    - element: NotifyCmdBlockList
      dimension: tuning_parameter
      specific_values: "%TEMP%\\*.exe, powershell.exe, cmd.exe"
      disposition: context
      target_question: Q5
      notes: "Risky notify-command targets are described in the notify_command context (powershell.exe, cmd.exe, or an executable under a user-writable path as the high-risk case). Not injected as a query filter because the notify target is a free-form path argument inside the bitsadmin command line; the question surfaces /SetNotifyCmdLine usage and directs the analyst to read the callback target."
    - element: ExpectedUpdateHosts
      dimension: tuning_parameter
      specific_values: "rationale only (WSUS, MEMCM, vendor updaters)"
      disposition: context
      target_question: Q9
      notes: "Allow-list of corporate update/CDN endpoints; no concrete values in the analytic. Realized as the network_transfer context, which directs the analyst to correlate the destination against known corporate update/CDN endpoints vs external unrecognized hosts."
    - element: ExternalNetCIDRs
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q9
      notes: "Definition of external/non-corp destinations; environment-specific, no concrete values. The network_transfer question projects DestinationIp/DestinationHostname/DestinationPort so the analyst applies the local external/internal boundary."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (30m-24h depending on BITS retry behavior)"
      disposition: context
      target_question: Q8
      notes: "Correlation window for job creation/transfer/notify; realized as the +1h range on directory_activity and the +/-15m range on network_transfer, with the chain timing described in context."
    - element: JobLifetimeThreshold
      dimension: tuning_parameter
      specific_values: "rationale only (>3 days or retry>20)"
      disposition: context
      target_question: Q5
      notes: "Persistence threshold for long-lived BITS jobs; no directly queryable command-line value. The notify_command context notes long-lived jobs (/resume, /setminretrydelay) as the persistence angle so the analyst enumerates jobs manually (bitsadmin /list /allusers /verbose)."
    - element: UserContext
