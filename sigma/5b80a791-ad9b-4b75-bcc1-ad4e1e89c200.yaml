      reason: "user_actor pair - non-deduplicable; both emitted (subject-pivot and launch-mechanism-pivot). Image-pivot tightened to the rule's bitsadmin + job-flag selection per the Q-vs-query alignment rule."
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair - non-deduplicable; both emitted (subject-pivot and launch-mechanism-pivot). clustering_svc Image-pivot tightened to the rule's bitsadmin + job-flag selection."
      kept: both
    - dropped: lolbin.renamed_binary_check
      reason: "Its OriginalFileName/Image projection over ProcessGuid duplicates masquerading.true_identity, which additionally projects Hashes for reputation lookup. Path-anomaly judgment folded into true_identity context."
      kept: masquerading.true_identity
    - dropped: cue_process_tool.baseline_deviation
      reason: "REFLECTED host_pattern host baseline of the rule's firing pattern is provided by lolbin.historical_lolbin_baseline (also REFLECTED host_pattern, same embedded detection block); keeping both would duplicate the host-scoped rule-pattern count."
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.scope
      reason: "REFLECTED fleet_pattern cross-host count of the rule's pattern; trimmed to stay within the 14-18 target. Cross-host coordination is partially covered by cue_user_actor.clustering_svc (same window) and lateral LOLBin context; the host-scoped rule-pattern baseline (historical_lolbin_baseline) was prioritized as the more actionable per-host anomaly signal."
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.clustering
      reason: "Image-only host aggregation subsumed by cue_host_context.clustering, which projects Image+ParentImage and surfaces novel parent-child pairs."
      kept: cue_host_context.clustering
    - dropped: cue_process_tool.baseline
      reason: "generic Image|endswith \\bitsadmin.exe host baseline counts all bitsadmin usage; subsumed by lolbin.historical_lolbin_baseline which scopes to the rule's actual transfer + suspicious-extension firing pattern."
      kept: lolbin.historical_lolbin_baseline
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: defense_tampering.what_was_disabled (hint 1). Phase-2 mechanism decode is instead provided by attack:T1197.command_decode, since the rule detects a download, not a control being disabled - see hint_dispositions."
    - template: cue_process_tool.follow_on
      reason: "follow_on scopes children by ParentImage|endswith %Image%; bitsadmin downloads are normally finalized by the BITS service (svchost) rather than spawning children directly, and post-transfer activity is covered by download_tool.directory_activity (+1h file events) and cue_host_context.clustering. Trimmed to stay within the 14-18 target."
    - template: masquerading.binary_origin
      reason: "must_include; binary-arrival tracing over -30d (file_event by %file_name%) is lower-value here because bitsadmin.exe is a built-in system binary present by default, so the meaningful identity question is the metadata/hash check (true_identity), not how it arrived. Trimmed to stay within the 14-18 target."
    - template: masquerading.renamed_binary_activity
      reason: "must_include; its child-process / cross-host-scope angle for a renamed binary overlaps cue_host_context.clustering (host activity) and cue_user_actor.clustering_svc (cross-host same-window). bitsadmin rarely spawns the payload directly (BITS notify handles execution, covered by attack:T1197.notify_command). Trimmed to stay within the 14-18 target."
    - template: lolbin.renamed_binary_check
      reason: "deduped into masquerading.true_identity (see dedup_decisions)."
    - template: persistence_scope.process_based_persistence
      reason: "recommended priority. This rule detects file ingress via BITS, not installation of process-based persistence tooling. The BITS-job persistence angle (long-lived jobs / notify callbacks) is covered by attack:T1197.notify_command. Trimmed to stay within the 14-18 target."
    - template: persistence_scope.file_based_persistence
      reason: "recommended priority. Startup-folder / Run-key file drops are orthogonal to a bitsadmin transfer; the downloaded file's landing path and directory activity are covered by download_success_verification and directory_activity. Trimmed to stay within the 14-18 target."
    - template: organizational_context.change_ticket
      reason: "recommended priority. Approval/maintenance-window context is captured by universal.host_user_context (is this user/host expected to transfer files) and the user baseline; the four organizational_context templates would crowd out load-bearing download-chain coverage. Trimmed to stay within the 14-18 target."
    - template: organizational_context.human_recall
      reason: "recommended priority. Trimmed to stay within the 14-18 target; legitimacy-via-human-recall overlaps host_user_context and the user baseline question."
    - template: organizational_context.timing_alignment
      reason: "recommended priority. Trimmed to stay within the 14-18 target; off-hours judgment overlaps cue_host_context.clustering timeline review."
    - template: organizational_context.procedural_consistency
      reason: "recommended priority. Trimmed to stay within the 14-18 target; whether file transfer normally goes through a deployment tool is covered by host_user_context and the user baseline."
    - template: universal.evidence_preservation
      reason: "applicability has_file_reference; its file-on-disk check is fully covered by download_tool.download_success_verification (same TargetFilename|endswith %file_paths% query) and download_tool.payload_analysis (adds Hashes). Avoids a near-identical query."
    - template: universal.endpoint_protection_health
      reason: "recommended, not must_include. This rule fires on ingress tool transfer, not payload execution or credential access, and the defense_tampering technique set is not load-bearing here; prior-tamper context, if any, surfaces via cue_host_context.precursor. The generic host-tamper sweep would not earn its slot over the download-chain questions."
  reflection_overrides: []
  hint_dispositions:
    - hint: "defense_tampering.what_was_disabled replaces cue_process_tool.mechanism_decode"
      disposition: declined
      reason: >-
        T1197 carries a defense-evasion tactic tag, which is why the defense_tampering
        set was confirmed, but this rule detects a bitsadmin file download - nothing is
        being disabled. The what_was_disabled question ("which security control or
        logging mechanism was targeted") has no referent for a download command. Phase-2
        mechanism decode is instead provided by attack:T1197.command_decode, which
        directs the analyst to decode the bitsadmin flags, source URL, and destination
        path - the actual operational content of this command. The mechanism_decode
        template is recorded in skipped_templates; its replacement target is honored in
        spirit (a Phase-2 decode exists) but reframed to the download semantics.
    - hint: "LOLBin rule - check for renamed binary and other LOLBins achieving same objective"
      disposition: declined
      reason: >-
        Acted on, recorded here only to close the audit loop (no declined content).
        Renamed-binary coverage is masquerading.true_identity (Image vs OriginalFileName
        mismatch + hash). Other LOLBins for the same download objective is
        lolbin.technique_class_lateral, with the Image list narrowed to download/transfer
        LOLBins (certutil, curl, esentutl, expand, extrac32, makecab, replace, hh) and
        bitsadmin excluded as redundant.
    - hint: "File paths derived from CommandLine - use %file_paths% placeholder"
      disposition: declined
      reason: >-
        Acted on, recorded here only to close the audit loop. The destination path is
        parsed from the bitsadmin command line and verified on disk via
        download_success_verification and analyzed via payload_analysis, both using
        TargetFilename|endswith|expand %file_paths%; directory_activity uses
        %file_dirs% with a %file_paths% self-filter.
    - hint: "logsource 'network_connection' (recommended by techniques: T1197,T1105) is not covered - pull in cue_network_endpoint.* or author a custom question with category: network_connection"
      disposition: declined
      reason: >-
        Acted on (logsource-coverage hint defaults to act-on), recorded here only to
        close the audit loop. The boundary is crossed by attack:T1105.network_transfer,
        a custom question with category: network_connection scoped to host.name +
        Image|endswith \bitsadmin.exe, projecting DestinationIp / DestinationHostname /
        DestinationPort. This surfaces the remote source BITS transferred from, which is
        the network half of the T1197/T1105 chain (job creation -> network transfer ->
        file landing).
