        - .7z
        - .asax
        - .ashx
        - .asmx
        - .asp
        - .aspx
        - .bat
        - .cfm
        - .cgi
        - .chm
        - .cmd
        - .dll
        - .gif
        - .jpeg
        - .jpg
        - .jsp
        - .jspx
        - .log
        - .png
        - .ps1
        - .psm1
        - .rar
        - .scf
        - .sct
        - .txt
        - .vbe
        - .vbs
        - .war
        - .wsf
        - .wsh
