name: File With Suspicious Extension Downloaded Via Bitsadmin
id: c48cba09-7e6e-4c63-b1a6-8f24ee7b6610
description: |
  Detects bitsadmin.exe being used to stage a file transfer whose command line
  references a file with a suspicious extension. The rule fires only when all of
  three conditions hold: the image ends in bitsadmin.exe or carries the
  OriginalFileName bitsadmin.exe (catching a renamed copy), the command line
  contains a job flag (/transfer, /create, or /addfile), and the command line
  contains one of a list of script, archive, executable, or web-shell extensions
  (.ps1, .dll, .bat, .vbs, .7z, .zip, .aspx, and others). bitsadmin uses the
  Background Intelligent Transfer Service to download attacker-hosted files under
  the calling user's profile with only user-level privileges, and is a common
  ingress-tool-transfer primitive; the same workflow can chain a /SetNotifyCmdLine
  callback to execute the downloaded file on job completion. Some software
  deployment and update workflows use BITS legitimately, so the investigation
  should determine the source URL and destination path, whether the file landed
  on disk, what it is, whether a notify command was set, and whether the same
  pattern appears elsewhere on the host or fleet.
type: detection
detection_id: 5b80a791-ad9b-4b75-bcc1-ad4e1e89c200
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line invoke bitsadmin with a job flag and reference a
    file with a suspicious extension, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when all three conditions hold together - the image is
    bitsadmin.exe (or a binary whose OriginalFileName is bitsadmin.exe), the command
    line contains /transfer, /create, or /addfile, and the command line contains one
    of a list of suspicious extensions such as .ps1, .dll, .bat, .vbs, .7z, .zip, or
    .aspx. Read the exact command line and note the job flag, the source URL, and the
    destination path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to download files via bitsadmin or other
    command-line transfer tools?
  context: Legitimate use of bitsadmin for file transfer is narrow - software
    deployment, update agents, and a small set of administrators. Most users and most
    endpoints never run it interactively. Knowing whether the acting account and the
    host function involve software distribution or administrative file movement is
    often the fastest path to separating an approved transfer from attacker ingress.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1197.command_decode
  question: What URL was the source, what was the destination path, and which BITS
    job flags were used in this bitsadmin command?
  context: The full command line reveals the transfer the rule detected. Decode the
    bitsadmin invocation - the /create job name, the /addfile or /transfer source URL,
    and the local destination path - to establish where the file came from and where
    it was written. The destination path is the file to look for on disk; the source
    URL is the indicator to check against threat intelligence. A renamed bitsadmin
    copy means the on-disk image name will not be bitsadmin.exe even though the
    behavior is the same.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
      - OriginalFileName
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash,
    and does the on-disk name match bitsadmin.exe?
  context: The rule's image selection matches either an image ending in bitsadmin.exe
    or any binary whose embedded OriginalFileName is bitsadmin.exe, so a copy renamed
    to evade name-based allowlists still fires. Compare the Image path against the
    OriginalFileName metadata - a mismatch means the BITS utility was renamed before
    use. The file hash enables a reputation lookup to confirm whether this is the
    Microsoft-signed system binary, a copied legitimate utility, or a tampered build.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: attack:T1197.notify_command
  question: Did this bitsadmin job also set a notify command to execute the downloaded
    file on completion?
  context: bitsadmin can chain a download into execution by attaching a /SetNotifyCmdLine
    callback that BITS launches when the job completes, turning a transfer into a
    download-then-execute primitive. The callback can also point at a payload hidden
    in an NTFS alternate data stream. Check the host's bitsadmin activity in this
    window for /SetNotifyCmdLine, /resume, /complete, or /setcustomheaders flags that
    indicate the job was configured to run the retrieved file or to persist as a
    long-lived job. A notify command pointing at powershell.exe, cmd.exe, or an
    executable under a user-writable path is the high-risk case.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bitsadmin.exe
      - OriginalFileName: bitsadmin.exe
      selection_notify:
        CommandLine|contains:
        - ' /SetNotifyCmdLine '
        - ' /resume '
        - ' /complete '
        - ' /setcustomheaders '
        - ' /setminretrydelay '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: selection_img and selection_notify and _pb_scope
    fields:
      - CommandLine
      - User
- source: template:download_tool.download_success_verification
  question: Was the download successful? Check for file creation at the destination
    path from the bitsadmin command line.
  context: A bitsadmin transfer command does not guarantee the file was retrieved -
    a blocked URL, a network error, or a security control may have stopped the
    transfer. Confirming a file-creation event at the destination path parsed from the
    command line establishes whether the attack progressed past delivery. If no file
    appears at the path, the transfer may have failed or been blocked.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: What file did bitsadmin transfer, and can you retrieve and analyze its content?
  context: The rule keys on script, DLL, and web-shell extensions (.ps1, .dll, .bat, .vbs, .aspx) —
    these are interpreted, loaded, or served, not run as their own process, so there is no execution
    hash to read and file-creation events carry no hash either. The file content is the decisive
    evidence — retrieve it from the path below, inspect it, and hash it manually for reputation. For a
    .dll, also check its load event (dll.hash); a .aspx web shell is served by the web process, so
    review the web root and IIS logs rather than expecting a process execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the destination directory after the
    transfer?
  context: Attackers often stage multiple files in the same directory, or the
    downloaded file triggers further writes - archive extraction, additional
    downloads, or a dropped executable. Examining directory-level file activity in the
    hour after the transfer reveals the broader scope of the delivery and whether the
    retrieved file was unpacked or launched. The query excludes the known downloaded
    file so only additional activity is surfaced.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: attack:T1105.network_transfer
  question: What external network connections did bitsadmin initiate on this host
    around the transfer?
  context: BITS performs the actual HTTP(S) or SMB transfer on behalf of the calling
    process, so the network connection attributable to bitsadmin reveals the remote
    source the file came from. Correlate the connection's destination address against
    the source URL parsed from the command line and against known corporate update or
    CDN endpoints - a transfer from an external, unrecognized host is a different
    finding than one from an internal deployment server. An external destination that
    is not a known updater endpoint is the case to escalate.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \bitsadmin.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.process_chain
  question: What process spawned bitsadmin, and is that parent chain expected for a
    file transfer?
  context: The parent process reveals how the transfer was invoked. Interactive
    administration usually shows a console shell or a deployment agent as the parent;
    an unexpected parent such as a script host, mshta.exe, an Office application, or a
    web server worker process points to automated or exploited invocation. bitsadmin
    launched by a web-facing service process, for example, is consistent with
    post-exploitation ingress rather than routine administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bitsadmin.exe
      - OriginalFileName: bitsadmin.exe
      selection_flags:
        CommandLine|contains:
        - ' /transfer '
        - ' /create '
        - ' /addfile '
      selection_extension:
        CommandLine|contains:
        - .7z
        - .asax
        - .ashx
        - .asmx
        - .asp
        - .aspx
        - .bat
        - .cfm
        - .cgi
        - .chm
        - .cmd
        - .dll
        - .gif
        - .jpeg
        - .jpg
        - .jsp
        - .jspx
        - .log
        - .png
        - .ps1
        - .psm1
        - .rar
        - .scf
        - .sct
        - .txt
        - .vbe
        - .vbs
        - .war
        - .wsf
        - .wsh
        - .xll
        - .zip
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bitsadmin.exe
      - OriginalFileName: bitsadmin.exe
      selection_flags:
        CommandLine|contains:
        - ' /transfer '
        - ' /create '
        - ' /addfile '
      selection_extension:
        CommandLine|contains:
        - .7z
        - .asax
        - .ashx
        - .asmx
        - .asp
        - .aspx
        - .bat
        - .cfm
        - .cgi
        - .chm
        - .cmd
        - .dll
        - .gif
        - .jpeg
        - .jpg
        - .jsp
        - .jspx
        - .log
        - .png
        - .ps1
        - .psm1
        - .rar
        - .scf
        - .sct
        - .txt
        - .vbe
        - .vbs
        - .war
        - .wsf
        - .wsh
        - .xll
        - .zip
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    transfer was a single event or part of activity spanning multiple endpoints. If
    the same user triggered similar activity on other hosts, the scope of the incident
    is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bitsadmin.exe
      - OriginalFileName: bitsadmin.exe
      selection_flags:
        CommandLine|contains:
        - ' /transfer '
        - ' /create '
        - ' /addfile '
      selection_extension:
        CommandLine|contains:
        - .7z
        - .asax
        - .ashx
        - .asmx
        - .asp
        - .aspx
        - .bat
        - .cfm
        - .cgi
        - .chm
        - .cmd
        - .dll
        - .gif
        - .jpeg
        - .jpg
        - .jsp
        - .jspx
        - .log
        - .png
        - .ps1
        - .psm1
        - .rar
        - .scf
        - .sct
        - .txt
        - .vbe
        - .vbs
        - .war
        - .wsf
        - .wsh
        - .xll
        - .zip
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    bitsadmin transfer reveals what led to it and what followed - the parent that
    staged the process, reconnaissance, or follow-on execution of the retrieved file.
    Novel parent-child pairs at low counts are what to scan for against the high-count
    noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, exploitation of a
    public-facing service, or credential access - may reveal the attack stages that
    preceded the file transfer and help reconstruct the full timeline. Ingress tool
    transfer is often one step in a sequence, so prior alerts give the context for why
    a file was pulled onto the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other download or transfer LOLBins used on this host recently?
  context: Operators who use one living-off-the-land download tool often use several -
    if bitsadmin was used to pull a file, certutil, curl, esentutl, or expand may have
    been used as well, on the same host or as a fallback when one is blocked. Finding
    multiple transfer LOLBins performing the same objective in a short window
    strengthens the case for deliberate ingress activity over a single benign
    invocation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's bitsadmin transfer pattern over
    the past 90 days, and what command-line structures are typical?
  context: A bitsadmin transfer pattern with no prior history on a host is more
    suspicious than one used regularly under a stable parent. The query mirrors the
    rule's selection structure scoped to this host, so the resulting count reflects
    the rule's specific firing pattern - bitsadmin with a job flag and a suspicious
    extension - rather than generic bitsadmin usage. The command-line projection lets
    the analyst compare typical invocation patterns and destination paths against the
    alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bitsadmin.exe
      - OriginalFileName: bitsadmin.exe
      selection_flags:
