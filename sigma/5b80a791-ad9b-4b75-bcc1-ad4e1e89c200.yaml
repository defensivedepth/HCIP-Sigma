      disposition: context
      target_question: Q4
      notes: "T1036.003 suspicious-path filtering; the true_identity question surfaces the Image path so the analyst judges whether bitsadmin ran from System32/SysWOW64 or a non-standard directory."
    - element: ParentProcessName
