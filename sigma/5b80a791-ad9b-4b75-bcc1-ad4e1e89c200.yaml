      target_question: Q11
      notes: "Scope by interactive users vs service accounts; realized as the cue_user_actor.baseline / baseline_svc pair which pivots on the acting user and on the launch mechanism for service-principal fires."
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "rationale only"
      disposition: context
      target_question: Q3
      notes: "T1036.003 rare-argument flagging; realized as the command_decode question, which decodes the bitsadmin flags, source URL, and destination path."
    - element: PEInternalNameMismatch
