        confidence: low
        reason: "Keyword match on 'ransomware' is incidental — it comes from the Ryuk/LockBit references that happen to run nltest during their discovery phase, not from anything this rule detects. The rule fires on nltest domain-recon command lines (a discovery signal); it does not detect encryption, shadow-copy deletion, or any impact action. Ransomware-impact questions would not align with the rule's selection."
