      disposition: context
      target_question: Q4
      notes: "Tuning rationale for T1482. Same parent-legitimacy angle as Q4 (discovery_parent_chain); historical parent baseline covered by Q9 (baseline_deviation) and Q12 (baseline_svc)."
    - element: API_Name
      dimension: tuning_parameter
      specific_values: "DSEnumerateDomainTrusts, GetAllTrustRelationships"
      disposition: new_question
      target_question: Q6
