      kept: discovery_recon.discovery_user_context
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot Q11 and launch-mechanism-pivot Q12)."
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (subject-pivot Q13 and launch-mechanism-pivot Q14)."
      kept: both
  skipped_templates:
    - template: universal.endpoint_protection_health
      reason: "recommended priority, not must_include. This is a discovery rule (T1016/T1482), not an execution, credential-access, privilege-escalation, or impact rule, so the generic AV/EDR-tamper command sweep is not the live disposition question here. Prior tamper activity on the host is already surfaced by cue_host_context.precursor (Q16), which returns sigma alerts including defense-tampering detections in the 6h before the alert. Trimmed to stay within the 14-18 target."
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'process_access' (recommended by techniques: T1482) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        T1482's process_access analytic targets in-process handle access during
        API-based trust enumeration (EventCode 10), which is the same in-process
        method as the image_load analytic. This rule fires on nltest.exe
        command-line recon, where the queryable in-process signal is the DLL load
        footprint, not a cross-process handle open against a specific target. A
        bare process_access question scoped to this host would return generic
        handle-access noise with no target to anchor it (nltest does not open a
        well-known sensitive target like lsass). The alternate-method enumeration
        angle is covered by Q6 (attack:T1482.api_trust_enumeration, category:
        image_load), which is the precise queryable proxy for the same API calls.
        No compensating process_access question authored.
  contextual_sets:
    included: []
