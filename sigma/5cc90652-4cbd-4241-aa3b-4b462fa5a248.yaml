      reason: "discovery_recon.discovery_parent_chain (Q4) is the more specific technique-set version of the same parent-of-discovery-command question (same ProcessGuid scope, projects ParentImage + ParentCommandLine). Technique set preferred over cue per within-phase dedup."
      kept: discovery_recon.discovery_parent_chain
