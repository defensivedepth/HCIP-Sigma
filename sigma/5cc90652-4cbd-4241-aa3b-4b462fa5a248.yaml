      reason: "Image-only host aggregation is subsumed by cue_host_context.clustering (Q15), which projects Image + ParentImage and surfaces novel parent-child pairs. The recon-specific burst view is also covered by discovery_burst_detection (Q5)."
      kept: cue_host_context.clustering
