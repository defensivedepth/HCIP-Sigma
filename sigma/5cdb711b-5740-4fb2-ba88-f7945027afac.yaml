name: Rundll32 UNC Path Execution
id: 7262387e-a62b-4e47-84b0-f9b91d6f5b1a
description: |
  Detects rundll32.exe (identified by Image, OriginalFileName, or the literal "rundll32" in the command line) executing with a UNC path (a command line containing ' \\') AND the UNC reference together. Loading a DLL from a remote share lets a signed Microsoft binary proxy-execute attacker code that never touches local disk, and the share reference points at lateral movement or remote staging. Legitimate uses exist (software deployment tools, login scripts on a file server), so the investigation should confirm the DLL source, the entry point invoked, the parent that launched rundll32, and any child processes or follow-on activity the proxy execution produced.
type: detection
detection_id: 5cdb711b-5740-4fb2-ba88-f7945027afac
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this rundll32 invocation reference a DLL on a remote UNC path, matching what the rule detects?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when the process is rundll32.exe (by Image, OriginalFileName, or the "rundll32" token) AND the command line contains a UNC path (' \\'). Verify both conditions are present and read the DLL path and entry-point argument from the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to load DLLs from remote shares via rundll32?
  context: Legitimate administrative activity and software deployment can invoke rundll32 against network paths. Knowing whether the user role and host function are consistent with loading DLLs from a remote share is often the fastest way to separate routine operations from proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What DLL path and entry point did this rundll32 invocation load, and what does the command line do?
  context: The full command line reveals the remote DLL path and the named export rundll32 was told to call. DllMain runs at DLL_PROCESS_ATTACH on any rundll32 invocation even when the named entry point does not exist, so the payload can execute regardless of the export argument. Note the UNC host in the path, the export name, and any javascript or vbscript scheme or mshtml,RunHTMLApplication script-proxy syntax.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli:
        CommandLine|contains: ' \\\\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:lolbin.renamed_binary_check
  question: Was rundll32 executed from its expected System32 or SysWOW64 path?
  context: rundll32.exe running from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists. Compare the Image path against the expected location and confirm OriginalFileName still reads RUNDLL32.EXE.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.process_chain
  question: What process spawned rundll32, and is that parent chain expected?
  context: The parent process reveals how rundll32 was invoked. Legitimate usage often has predictable parents (explorer.exe for user actions, a deployment agent or services.exe for managed software). Unusual parents like office applications, wscript.exe, mshta.exe, or a remote-execution service indicate exploitation or operator-driven proxy execution.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this rundll32 instance spawn afterward?
  context: rundll32 proxy execution loads a DLL whose code commonly launches follow-on processes such as cmd.exe, powershell.exe, or runonce.exe for post-exploitation. Because rundll32 terminates quickly after spawning a child, the child can appear with an unmapped parent in some tooling; process-creation telemetry still retains the parent linkage. Unexpected children point to the actual payload behavior.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.011.file_event
  question: Was a DLL or script file written to or accessed from the referenced share path on this host around the alert time?
  context: Proxy execution of a remote DLL implies the payload was staged on a share before rundll32 loaded it. Looking at file activity around the alert can surface the .dll, .sct, .hta, or .cpl artifact and where it came from. Scope to the file paths and directories tied to the alert rather than all file events on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        file.path|contains|expand: '%file_dirs%'
      condition: selection
    fields:
      - file.path
      - Image
      - User
- source: attack:T1218.011.image_load
  question: What modules did rundll32 load into memory on this host around the alert time, and are any loaded from a remote or user-writable path?
  context: rundll32 maps the target DLL into its own address space; a reflective or remotely sourced DLL surfaces as a module load from a path outside System32. Reviewing image loads for rundll32 distinguishes a normal local DLL from one fetched off a share or injected in memory ("floating modules"). Loads from UNC, temp, or profile directories are the anomaly worth chasing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \rundll32.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:lateral_movement.source_host_identification
  question: What inbound connections to remote-execution and SMB ports did this host receive around the alert time?
  context: A DLL referenced over a UNC path implies an SMB share access, and lateral movement requires a source. Inbound connections to admin-share and remote-execution ports (445, 135, 3389, 5985, 5986) reveal whether the rundll32 invocation followed remote access from a jump box, a peer workstation, or an unexpected source. The admin shares carrying DLL payloads are typically C$, ADMIN$, or IPC$.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- source: attack:T1021.002.user_context
  question: What network logon events on this host precede the alert, and which account and source host authenticated to the admin share?
  context: A remote DLL load over a UNC path normally follows an SMB session establishment, recorded as a network logon. Reviewing logon events ties the proxy execution back to an account and an originating host, and shows whether this is an expected remote administrator or a rare or first-time access. Correlate the logon time and account with the rundll32 invocation within a few minutes.
  range: -15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
      - WorkstationName
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rundll32-UNC pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even signed system binaries get reused legitimately. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how the rundll32 remote-DLL pattern has historically run here, not generic rundll32 usage. A new parent, an unexpected account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli:
        CommandLine|contains: ' \\\\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rundll32-UNC pattern over the past 90 days, and what command-line shapes are typical?
  context: A remote-DLL load pattern with no prior history on a host is more suspicious than one used daily under stable parents. The query mirrors the rule's selection scoped to this host, so the count reflects the rule's specific firing pattern rather than generic rundll32 usage. The command-line projection lets the analyst compare typical invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli:
        CommandLine|contains: ' \\\\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who use one signed-binary proxy often reach for several. If rundll32 loaded a remote DLL, check whether regsvr32, mshta, msiexec, installutil, or similar proxy-execution binaries ran on the same host. Multiple proxy-execution LOLBins performing the same objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run rundll32 against remote DLL paths?
  context: Compare this user's current action against their historical behavior. A user who has never loaded DLLs from a share via rundll32 is more suspicious than one who does so regularly as part of a deployment or administrative role. User role and typical toolset should align.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+rundll32 combination historically routine on this host or across the environment, or is the parent unusual for rundll32?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is the launch mechanism. A new or rare parent for rundll32 on this host or environment-wide is the deviation worth chasing, while a pair that already accounts for thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the rundll32 invocation, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, credential access, or persistence installation surrounding the event.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access, or remote access -- may reveal the attack stages that preceded the remote-DLL load and help reconstruct the timeline leading to lateral movement.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
