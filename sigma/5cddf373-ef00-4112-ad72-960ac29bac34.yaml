name: HackTool - Koadic Execution
id: 102a5b34-9ddb-4b2a-b0f5-7d7d2f4ebbb4
description: |
  Detects cmd.exe (matched by Image name or OriginalFileName) invoked with a command line that contains all of /q, /c, and chcp, the
  argument shape the Koadic post-exploitation framework uses when its JScript/VBScript stager shells out to the command interpreter.
  Legitimate scripts and installers occasionally combine /q (quiet), /c (run-and-exit), and a chcp code-page change, so confirm the full
  command line and the parent chain before escalating. Malicious context is a script host or document-spawned process driving cmd.exe to
  set a code page and run a single chained command; investigation should establish what the command did, what spawned cmd.exe, and whether
  the surrounding host and user activity fits the operator-tooling pattern.
type: detection
detection_id: 5cddf373-ef00-4112-ad72-960ac29bac34
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — cmd.exe carrying all of /q, /c, and chcp?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process is cmd.exe (by
    Image name or OriginalFileName) AND its command line contains all three of /q, /c, and chcp together. Verify all three tokens are present
    in the alerting command line and that the process is genuinely cmd.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run cmd.exe with a quiet, code-page-setting chained command?
  context: Legitimate administrative scripts, build tooling, and some installers run cmd.exe with /q /c and a chcp code-page change. Knowing
    whether the user role and host function are consistent with that kind of scripted invocation is often the fastest way to separate routine
    automation from operator tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this cmd.exe execution part of an authorized penetration test or red team engagement?
  context: Post-exploitation frameworks that drive cmd.exe this way are also used in authorized security assessments. Before deeper analysis,
    check whether a pentest or red team exercise is active on this host or network segment. An authorized engagement with matching tool
    usage and timing resolves the alert without further work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: What command did the /c argument actually run after the code-page change?
  context: The /q /c chcp prefix is a wrapper; the operational payload is the command that follows /c. Read the full command line and identify
    the trailing command — a discovery utility, a downloader, a script-host invocation, or a chained sequence joined with && or ^. That
    trailing command is what determines the scope of activity, not the chcp wrapper itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: Across the same host, what is the full set of /q /c chcp command lines run in this window, and do they form one logical operation?
  context: cmd.exe runs constantly, so this is scoped to the rule's specific argument shape rather than every cmd.exe on the host. Quiet,
    code-page-setting invocations frequently arrive in sequence — a stager often issues several chained commands that together accomplish
    one task. Reviewing them as a group reveals the operation rather than a single isolated line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - /q
          - /c
          - chcp
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:obfuscation.encoded_payload_decode
  question: Is the command that follows /c encoded or obfuscated, and what does it decode to?
  context: 'This framework''s stagers are JScript/VBScript and frequently hand cmd.exe an obfuscated payload. Common encodings: base64 (certutil
    -decode, encoded script arguments), hex, character concatenation (VBScript Chr() chains, JavaScript String.fromCharCode), and environment-variable
    substitution. Decode the trailing command to reveal the actual intent — a download cradle, a script-host launch, in-memory loading, or
    a reverse shell. Iterate decoding for multi-layer encoding until the payload is readable.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this cmd.exe, and is that parent chain expected?
  context: The parent reveals how cmd.exe was invoked. Legitimate usage has predictable parents (explorer.exe for user actions, services.exe
    for services). Script hosts (wscript.exe, cscript.exe), mshta.exe, or Office applications spawning a quiet code-page-setting cmd.exe
    is the launch pattern this framework's stagers produce and is the parent shape worth chasing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this cmd.exe spawn afterward?
  context: The processes cmd.exe launches reveal the actual impact of the trailing command. A quiet shell that goes on to spawn script hosts,
    certutil.exe, powershell.exe, or network utilities points to a download-and-execute or post-exploitation sequence rather than a benign
    one-off command.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: What files did this cmd.exe process write to the host?
  context: Operator tooling leaves artifacts even after the original process exits — dropped scripts, downloaded payloads, or staging files
    in user-writable locations. Batch payloads and stager output often land in %TEMP%, C:\Users\Public, the user download folder, or other
    user-writable directories; reviewing what this process wrote confirms execution and reveals the scope of activity.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1059.005.tuning_parameter
  question: Did script-engine modules load on this host around the alert time, and from what processes?
  context: This framework runs JScript/VBScript through Windows script hosts and HTA, so its activity often crosses into scripting-engine
    module loads. Loading of vbscript.dll, jscript.dll, jscript9.dll, scrobj.dll, or scrrun.dll by mshta.exe, wscript.exe, cscript.exe, or
    an unexpected host process corroborates script execution that the command-line alert alone may not show. If image-load events are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - \vbscript.dll
          - \jscript.dll
          - \jscript9.dll
          - \scrobj.dll
          - \scrrun.dll
      condition: selection
    fields:
      - Image
      - ImageLoaded
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this /q /c chcp pattern, what parents and users normally drive it, and does this alert fit?
  context: Even routine tooling can be abused. The query mirrors the rule's selection scoped to this host, so the parent/user distribution
    reflects how this specific firing pattern — not generic cmd.exe usage — has historically run here. A new parent process, an unexpected
    user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cli:
        CommandLine|contains|all:
        - /q
        - /c
        - chcp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run cmd.exe across the environment, and on which hosts?
  context: Compare this user's current action against their historical pattern. The result counts this user's cmd.exe executions by host
    over 90 days, so a user who rarely drives cmd.exe at all is more notable than one who does so routinely. User role and typical toolset
    should align with the detected behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+cmd.exe combination historically routine on this host or across the environment, or is the parent unusual?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch
    mechanism: which parent process spawned cmd.exe, and whether that pair is historically common. A new or rare parent for cmd.exe on this
    host or environment-wide is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user
    triggered similar activity on several hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+cmd.exe combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise because every host runs
    service-owned processes constantly. The meaningful question is whether the same launch mechanism — parent process plus spawned cmd.exe
    — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event,
    what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation,
    or data staging in the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access
    — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this /q /c chcp pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific firing pattern
    rather than generic cmd.exe usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or
    a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cli:
        CommandLine|contains|all:
        - /q
        - /c
        - chcp
      condition: all of selection_*
    fields:
    - host.name
