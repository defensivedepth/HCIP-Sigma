name: Suspicious Process Execution From Fake Recycle.Bin Folder
id: 2c7def4d-1178-4b15-814f-e1106e2b9315
description: |
  Detects a process whose image path contains a fake recycle-bin folder — a directory
  named RECYCLER.BIN or RECYCLERS.BIN crafted to resemble the real, system-managed
  $Recycle.Bin so it blends into casual filesystem inspection. The rule fires when an
  executing process's Image path contains the literal substring 'RECYCLER.BIN\' or
  'RECYCLERS.BIN\'. The genuine Recycle Bin holds deleted files and never spawns child
  processes, so an executable running from such a path is almost always a staged payload,
  commonly a signed legitimate binary paired with a malicious DLL for side-loading. The
  investigation should confirm the exact image path and binary, determine what it executed
  and what spawned it, and look for the surrounding staging, persistence, and follow-on
  activity that typically accompany this drop location.
type: detection
detection_id: 5ce0f04e-3efc-42af-839d-5b3a543b76c0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process actually run from a fake recycle-bin folder (a path containing RECYCLER.BIN or RECYCLERS.BIN)?
  context: Before investing investigation time, confirm the true positive by reviewing the
    full Image path against the detection. The rule keys on the path substring 'RECYCLER.BIN\'
    or 'RECYCLERS.BIN\' — note that this is a crafted folder name, distinct from the genuine
    system-managed '$Recycle.Bin' directory. Confirm the binary name and that it is executing
    rather than merely present on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run any process from a recycle-bin-named directory?
  context: There is no routine administrative reason to execute a program from a folder named
    RECYCLER.BIN or RECYCLERS.BIN. Confirming the account and the host's function rarely
    excuses this pattern, but it establishes who the activity is attributed to and whether
    the endpoint is one where removable media or unusual staging directories would be
    plausible at all.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the binary running from the fake recycle-bin folder, and what did it execute? Decode its command line and working directory.
  context: Identify the exact binary and its full image path, then decode any command-line
    arguments and the working directory. Payloads staged in these folders are frequently a
    legitimately signed executable paired with a malicious DLL alongside it, so note the
    binary's name and apparent vendor; a familiar product name running from a recycle-bin
    path is the masquerade, not reassurance. The working directory often reveals the full
    staging folder and any sibling files.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned the binary in the fake recycle-bin folder, and is that parent chain expected?
  context: The parent reveals how the staged binary was launched. A parent such as
    explorer.exe points to a user double-clicking the file, often after mounting an ISO or
    archive; cmd.exe, powershell.exe, wscript.exe, or an Office application as parent points
    to scripted or document-driven execution. Tracing what started the parent helps
    reconstruct the delivery path that placed and ran the payload.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did the binary in the fake recycle-bin folder spawn afterward?
  context: The processes spawned by the staged binary reveal its actual purpose. Loaders
    commonly launch cmd.exe, powershell.exe, or built-in reconnaissance utilities, or
    side-load a DLL that decrypts and runs an in-memory payload. Unexpected children, or
    reconnaissance commands such as tasklist, ipconfig, netstat, arp, or systeminfo
    following this execution, indicate hands-on or automated post-exploitation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this binary ever run on this host before?
  context: A binary that has never executed on a host is more suspicious than one that runs
    regularly — and a binary running from a recycle-bin-named path should never have a
    legitimate history at all. Zero or very low historical counts confirm first-time or rare
    execution, consistent with a freshly staged payload.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the fake-recycle-bin pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern — execution from a
    recycle-bin-named path — has historically run here, if at all. For this pattern any prior
    history is itself unusual; a new parent process, an unexpected account, or a first-ever
    occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the fake-recycle-bin pattern in the past week, and does the cross-host distribution look like a spreading payload or an isolated drop?
  context: The query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of execution from recycle-bin-named paths. Multiple hosts firing the
    same pattern points to a payload propagating across endpoints, such as through removable
    media or a shared staging mechanism; a single host or a small unrelated set points to an
    isolated drop. Use the host distribution and binary consistency to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run unusual or freshly staged binaries?
  context: Compare the account's current action against its history. A user who has never run
    a binary from an unusual staging directory is more suspicious than one whose role
    routinely involves installers or portable tools. Align the result with what is known
    about the account, and treat any history of execution from recycle-bin-named paths as
    abnormal regardless of role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK
    SERVICE, or a computer account), user identity does not attribute the behavior. The
    meaningful pivot is the launch mechanism — which parent spawned this binary and whether
    that pair is historically common. A new or rare parent for this binary is the deviation
    worth chasing; a pair that already accounts for thousands of events is OS or vendor
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user
    triggered similar staged-execution activity elsewhere, the scope of the intrusion is
    larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-binary combination fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, "what else did this user do" returns agent-telemetry
    noise because every host runs SYSTEM-owned agents constantly. The meaningful question is
    whether the same launch mechanism — parent process plus spawned binary — fired on other
    hosts in the alert window. Multiple hosts point to a propagating or pushed payload; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the execution and what followed — archive or ISO mounting, file staging,
    reconnaissance, or persistence installation. Aggregating by process and parent collapses
    repetitive agent telemetry into high-count rows while novel parent-child pairs stand out
    at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — removable-media activity, defense tampering,
    reconnaissance, or other execution alerts — may reveal the stages that preceded this drop
    and help reconstruct the delivery and execution timeline. The alert sequence on a host
    often tells the fuller story of how the payload arrived and ran.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Operators frequently weaken protection before running a staged payload. This
    surfaces direct attempts to stop AV/EDR services, flip Defender flags, add broad
    exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks
    healthy" signal — kernel-level driver tampering and in-memory patches will not appear
    here. Populated rows shift the disposition toward deliberate operator preparation; review
    the writer's parent process and signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around the time of the alert?
  context: A staged payload that runs successfully commonly establishes persistence so it
    survives reboot. After the initial foothold, operators frequently create scheduled tasks,
    services, or registry Run keys using built-in tooling. Persistence-tool executions in the
    same timeframe indicate the drop was more than a one-off execution.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:persistence_scope.file_based_persistence
  question: Were files dropped to persistence locations (Startup folder, Run key paths) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an
    executable or script into a Startup folder or a path referenced by a registry Run key
    achieves persistence without running schtasks, sc, or reg. File event monitoring captures
    these drops even when the operator avoids standard persistence tools, and a staged loader
    will often place a copy of itself in one of these locations.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
