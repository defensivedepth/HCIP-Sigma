      target_question: Q3
      notes: "Which services count as security-critical is enumerated in Q3 context; the rule already pins the exact set."
    - element: ProcessNameExclusions
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q2
      notes: "Expected-administrator framing handled in host_user_context (Q2)."
    - element: ProcessWhitelist
      dimension: process_identification
      specific_values: "rationale only"
      disposition: context
      target_question: Q2
      notes: "Authorized-admin-tool rationale carried in Q2 context."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only"
      disposition: context
      target_question: Q7
      notes: "Correlation window between the change and subsequent activity is the +1h scope of Q7 and the +/-1h scope of Q8."
  dedup_decisions:
    - dropped: cue_process_tool.baseline
      reason: "Image-based host baseline of generic reg.exe usage; superseded by the reflected host-pattern query (Q15) which counts only this rule's service-disable pattern, per hint 'CommandLine-only detection — use CommandLine pattern matching not Image-based queries'."
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.baseline_deviation
      reason: "Reflected host-pattern query overlapping lolbin.historical_lolbin_baseline (both AND the rule's detection block into a host scope). Kept the lolbin variant (CommandLine shapes, -90d) over the -14d ParentImage/User variant; parent is covered by process_chain (Q5) and user by user_actor.baseline (Q10)."
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.follow_on
      reason: "Image-based child-process query; reg.exe does not spawn meaningful children, and post-change activity is covered by defense_tampering.activity_after_tampering (Q7). Avoids Image-based scoping per the CommandLine-only-detection hint."
      kept: defense_tampering.activity_after_tampering
    - dropped: cue_process_tool.clustering
