      kept: defense_tampering.activity_after_tampering
    - dropped: cue_host_context.clustering
      reason: "Generic host-window aggregation duplicated by defense_tampering.activity_after_tampering (Q7), other_tampering_activity (Q8), and registry_related_modifications (Q9). always_include is false; precursor (Q14) retained for the supporting cue."
      kept: defense_tampering.activity_after_tampering
    - dropped: cue_user_actor pair
      reason: "user_actor pair — non-deduplicable. baseline (Q10) + baseline_svc (Q11) and clustering (Q12) + clustering_svc (Q13) emitted as separate questions per AGENTS.md."
      kept: cue_user_actor.baseline / cue_user_actor.baseline_svc / cue_user_actor.clustering / cue_user_actor.clustering_svc
  skipped_templates:
