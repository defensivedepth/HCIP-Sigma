  mutable_dispositions:
    - element: ServiceNames
      dimension: tuning_parameter
      specific_values: "\\WinDefend, \\WdFilter, \\WdBoot, \\WdNisSvc, \\WdNisDrv, \\Sense, \\SecurityHealthService, \\wscsvc, \\MsMpSvc, \\NisSrv, \\AppIDSvc, \\UsoSvc, \\wuauserv"
      disposition: query_injection
      target_question: Q16
      notes: "Service-name list is the rule's own selection_cli_reg_start CommandLine|contains list; preserved verbatim in the reflected host (Q15) and fleet (Q16) queries, and named in Q1/Q3 context."
    - element: ServiceNamePatterns
      dimension: tuning_parameter
      specific_values: "rationale only"
