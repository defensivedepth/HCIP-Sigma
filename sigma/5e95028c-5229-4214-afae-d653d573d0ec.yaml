    - template: universal.endpoint_protection_health
      reason: "RECOMMENDED, droppable when the defense_tampering technique set is confirmed: its what_was_disabled (Q3), protection_status (Q6), activity_after_tampering (Q7) and other_tampering_activity (Q8) are more specific than this generic host-tamper sweep, and the rule itself is the tamper event."
    - template: persistence_scope.process_based_persistence
      reason: "RECOMMENDED; reg.exe-based persistence and service tampering are already surfaced by registry_related_modifications (Q9) and other_tampering_activity (Q8). Dropped to keep within the 18-question cap in favor of the must_include lolbin and reflected questions."
    - template: persistence_scope.file_based_persistence
      reason: "RECOMMENDED; this rule is registry-service tampering, not file-drop persistence, and file_event coverage adds an angle orthogonal to the detected behavior. Dropped to stay within the 18-question cap."
  reflection_overrides: []
