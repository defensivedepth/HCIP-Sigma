name: Response File Execution Via Odbcconf.EXE
id: ddf8bb1d-eed6-451a-b540-ecec713f4a2e
description: |
  Detects odbcconf.exe invoked with the -f flag to load a response (.rsp) file. odbcconf.exe is a Microsoft-signed
  ODBC configuration utility; the -f switch reads directives from a response file, which can carry a REGSVR action
  that loads and registers an arbitrary DLL (equivalent to regsvr32.exe) without the DLL path appearing on the command
  line. The rule fires only when the image is odbcconf.exe AND the command line contains -f AND the command line
  references a .rsp file. Legitimate ODBC administration can use response files, so the investigation hinges on the
  contents of the .rsp file, what DLL odbcconf.exe loaded, the parent that launched it, and any follow-on process or
  network activity.
type: detection
detection_id: 5f03babb-12db-4eec-8c82-7b4cb5580868
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this odbcconf.exe command line include the -f flag and reference a .rsp response file?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the
    process image (or original file name) is odbcconf.exe AND the command line contains the -f flag AND the command
    line references a .rsp file. Review the exact command line and process details against all three criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to configure ODBC drivers or data sources with odbcconf.exe and a response file?
  context: Legitimate ODBC administration and application installers can use odbcconf.exe with response files. Knowing
    whether the user role and host function involve database connectivity configuration is often the fastest path to
    distinguishing routine administration from proxy execution of a DLL.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full odbcconf.exe command line, and which .rsp response file does it load?
  context: The -f flag tells odbcconf.exe to read directives from the named response file. The response file typically
    holds a REGSVR action pointing at a DLL, hiding the DLL path from the command line. Identify the .rsp path, then
    read the file's contents to determine which DLL is registered and whether that DLL and its location are expected.
    Combined silent mode and REGSVR is the abuse pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: ' -f '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned odbcconf.exe, and is that parent chain expected?
  context: The parent process reveals how odbcconf.exe was invoked. Legitimate use is usually launched by an installer,
    a management console, or an interactive shell driven by an administrator. A parent such as a script host, a mounted
    archive helper, an Office application, or a shortcut handler points to user-execution-driven proxy execution rather
    than administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.008.image_load
  question: What DLLs or modules did odbcconf.exe load on this host around the time of the alert, and are any unsigned or in user-writable paths?
  context: The core of this technique is odbcconf.exe registering an attacker-supplied DLL through the response file's
    REGSVR directive, which calls DllRegisterServer in that DLL. The loaded module is the payload. Modules loaded from
    user-writable locations (TEMP, APPDATA, ProgramData, the public profile) or modules that are unsigned or not part
    of the standard ODBC stack are the artifact to flag. If image-load telemetry is not collected in this environment,
    treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.008.network_connection
  question: Did odbcconf.exe make any outbound network connections on this host around the time of the alert?
  context: A DLL loaded by odbcconf.exe through a response file may retrieve a second-stage payload or establish command
    and control. odbcconf.exe itself has no legitimate reason to initiate outbound network connections, so any
    destination it contacts is worth resolving and attributing. If network telemetry for this binary is not collected,
    treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.follow_on
  question: What child processes did odbcconf.exe spawn afterward?
  context: A DLL executed through odbcconf.exe often launches follow-on activity. Unexpected children such as cmd.exe,
    powershell.exe, rundll32.exe, wmic.exe, or wmiprvse.exe spawning from odbcconf.exe indicate post-exploitation
    rather than driver configuration, which spawns no child processes.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run odbcconf.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. odbcconf.exe is
    a deprecated utility; on most endpoints it runs rarely or never. Zero or very low historical counts indicate
    first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the response-file pattern, what parents and users drove it, and does the current alert fit?
  context: Even a deprecated tool can have routine local use. This query mirrors the rule's selection (odbcconf.exe with
    -f and a .rsp reference) scoped to this host, so the resulting parent and user distribution reflects how this
    specific firing pattern has run here, not generic odbcconf.exe usage. A new parent process, an unexpected user
    account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|windash: ' -f '
      selection_rsp_ext:
        CommandLine|contains: .rsp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the odbcconf.exe execution?
  context: Proxy execution of a DLL is usually one step in a larger sequence. Activity surrounding the odbcconf.exe
    execution may reveal reconnaissance, credential access, privilege escalation, or staging that provides broader
    context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired the response-file pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the
    response-file firing pattern rather than generic odbcconf.exe usage. Many hosts firing the same pattern points to
    a scripted deployment or installer; one host or a small unrelated set points to manual operator activity. Use the
    host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|windash: ' -f '
      selection_rsp_ext:
        CommandLine|contains: .rsp
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run odbcconf.exe?
  context: Compare this user's current action against their historical behavior. A user who has never run odbcconf.exe
    is more suspicious than one who configures ODBC drivers regularly. The user's role and typical toolset should align
    with database connectivity administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and odbcconf.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The meaningful
    pivot is the launch mechanism — which parent process spawned odbcconf.exe, and whether that pair is historically
    common. A new or rare parent for odbcconf.exe is the deviation worth chasing; a pair that already accounts for many
    prior events is installer or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on multiple hosts, the scope of the activity may be larger
    than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and odbcconf.exe combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise.
    The meaningful question is whether the same launch mechanism — parent process plus odbcconf.exe — fired on other
    hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, defense tampering,
    credential access, or user-execution of a downloaded file — may reveal the attack stages that preceded this proxy
    execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
