name: Suspicious SysAidServer Child
id: 8aeb7f5b-6c92-4d07-ac38-433b622f26f0
description: |
  Detects a Java process (java.exe or javaw.exe) whose command line contains
  SysAidServer spawning a child process. SysAid Server is a Java-based IT
  service-management application; its JVM has no legitimate reason to launch
  command interpreters, scripting hosts, or system utilities, so any child
  process of the SysAid JVM is anomalous. The pattern is consistent with
  post-exploitation of a public-facing Java server (for example via a Log4j /
  JNDI injection vulnerability) where injected code executes as the service
  account and spawns operator tooling for reconnaissance, credential access,
  and lateral movement. Investigation should determine what the child process
  did, whether the server is patched, and whether the activity has spread to
  other hosts.
type: detection
detection_id: 60bfeac3-0d35-4302-8efb-1dd16f715bc6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Is the parent process java.exe or javaw.exe with SysAidServer in its command line, and what child did it spawn?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when the parent process Image ends in java.exe or javaw.exe AND the parent command line contains SysAidServer. Review the parent command line and the spawned child Image — the SysAid JVM should not be launching command interpreters or system utilities.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:universal.host_user_context
  question: Is this host expected to run a SysAid Server instance, and is the spawning of this child process consistent with its function?
  context: Legitimate administrative activity can trigger detections. Knowing whether this host is a sanctioned SysAid application server, and whether the service account legitimately spawns the observed child, is often the fastest path to distinguishing a true positive from routine operations. A SysAid JVM spawning a shell or utility is rarely legitimate.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:initial_access.delivery_vector
  question: What web request triggered this execution on the SysAid server?
  context: When a public-facing Java application spawns operator tooling, the initiating event is typically an inbound web request that exploited a server-side vulnerability. Identify the originating request and source IP from the web server / application access logs so the perimeter can be blocked and other targeted servers identified. The parent command line shows the SysAid context the request landed in.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:initial_access.application_patch_status
  question: Is this SysAid Server installation patched against known remote code execution vulnerabilities, including Log4j (CVE-2021-44228, CVE-2021-45046)?
  context: Java application servers that bundle Log4j are exploitable via JNDI injection on unpatched builds, allowing arbitrary code execution as the service account. An unpatched SysAid build confirms exploitation was possible and indicates other similarly unpatched servers are at risk. Patch status distinguishes exploitation of a known CVE from a zero-day.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- source: template:initial_access.campaign_scope
  question: Did this same detection fire on other servers in the environment?
  context: Server-exploitation activity rarely targets a single host. If one SysAid or other Java server was exploited, others running the same unpatched application may have been hit by the same exploit. Correlating this rule across hosts reveals the breadth of the activity and identifies additional servers that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_parent_process.mechanism_decode
  question: What is the SysAid Java parent process, and what was its full command line and parentage?
  context: Retrieve the parent JVM's own process_creation event to understand how the SysAid server was launched and under which account it runs. The parent command line carries the SysAidServer invocation and class path; confirming the JVM is the service process (rather than an interactive Java launch) frames whether a server-side exploit, not a user action, drove the child spawn. The -7d range is intentional — the JVM is a long-running service that started well before the alert.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:cue_parent_process.follow_on
  question: What other child processes did the SysAid Java parent spawn around this time?
  context: After exploiting a server, operators commonly use the foothold process to spawn multiple tools in sequence — reconnaissance (whoami, nltest, net), credential access, and lateral-movement utilities. Listing every child of the SysAid JVM in the hours after the alert reveals the full scope of activity initiated through the exploited service.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:lateral_movement.source_host_identification
  question: What inbound connections to remote-service and database ports did this host receive around the time of the alert?
  context: Exploitation of a public-facing service correlates inbound network access to service ports with near-time anomalous behavior on the host. Reviewing inbound connections to SMB/RPC (445/135), RDP (3389), WinRM (5985/5986), and database ports (1433/3306) helps identify the source of access and whether it came from a known administrative network or an unexpected origin.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 1433
          - 3306
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- source: template:lateral_movement.authentication_method
  question: Under what account did the child process run, and how was that account authenticated?
  context: The account and authentication method reveal whether the activity rode an existing service-account context or a separately authenticated session. Code executed via a server-side exploit runs as the SysAid service account with no interactive logon; a network or interactive logon shortly before the spawn instead points to credential use. Security logon events (4624/4648) carry the logon type and may require separate review.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- source: template:lateral_movement.target_activity_after_access
  question: What processes were spawned on this host in the period after the alert?
  context: A foothold on an exploited server is a means to an end — operators move on to execute commands, deploy tools, dump credentials, or access data. Examining processes spawned in the window after the alert reveals the objectives pursued on the compromised host.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- source: template:lateral_movement.lateral_movement_scope
  question: Has the account on this host used remote-execution tooling to reach other systems?
  context: Operators rarely stop at one server. If the account is moving laterally with PsExec, WMIC, RDP, SSH, or Plink to additional systems, the scope of compromise is larger. Finding lateral-movement tool usage by the same account across many hosts within a short window indicates active spread.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- source: attack:T1210.file_event
  question: What files did the SysAid Java process or its children write, especially under the web application directory or ProgramData?
  context: Post-exploitation of a Java web server commonly involves writing a web shell into the application's auto-deployed web directory (for example a JSP under the server's webapps path) and staging tools or output in ProgramData subdirectories that mimic legitimate component names. Files written by the JVM or its children in the alert window can reveal the persistence foothold and staging locations.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains:
          - '\java.exe'
          - '\javaw.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1210.process_access
  question: Was lsass.exe opened for memory access by any process on this host around the time of the alert?
  context: Credential access frequently follows code execution on a compromised server. Opening lsass.exe with memory-read access (for example to extract logon secrets) is a high-value step in the post-exploitation chain. Process-access events targeting lsass.exe, particularly with granted access that permits reading process memory, identify credential-dumping attempts.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\lsass.exe'
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: attack:T1210.image_load
  question: Were credential-dumping or LSASS-related libraries loaded by unexpected processes on this host around the alert?
  context: Operators dump credentials by loading specific libraries — for example comsvcs.dll via rundll32 to invoke MiniDump against lsass.exe, or modules associated with offensive tooling. Image-load events for these libraries by processes that do not normally use them point to in-progress credential access on the exploited host.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\comsvcs.dll'
          - '\dbghelp.dll'
          - '\dbgcore.dll'
          - '\vaultcli.dll'
          - '\samlib.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        ParentCommandLine|contains: SysAidServer
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        ParentCommandLine|contains: SysAidServer
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this account do across the network around the time of the alert?
  context: Tracking the account's activity across all hosts reveals whether the behavior is isolated or spans multiple endpoints. If the same account triggered similar activity on other hosts in the same window, the scope of compromise may be larger than the single alerting server.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        ParentCommandLine|contains: SysAidServer
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
