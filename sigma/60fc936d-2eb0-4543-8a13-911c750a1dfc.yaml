name: Interactive AT Job
id: 91555a8a-92cd-416a-b86f-6bab00c61444
description: |
  Detects at.exe invoked with an interactive command line, the legacy Windows mechanism for registering a
  scheduled job. The rule fires when the process image ends in at.exe and the command line contains the word
  interactive. at.exe was deprecated as of Windows 8 in favor of schtasks.exe, so its use on modern systems is
  unusual and can indicate an operator establishing scheduled-task persistence or arranging a job to run in a
  more privileged context. Legitimate activity is rare; the investigation should decode the full at.exe command
  to identify the scheduled command and run time, confirm whether the corresponding task was registered and has
  executed, and determine whether the user, host, and parent process are consistent with sanctioned
  administration.
type: detection
detection_id: 60fc936d-2eb0-4543-8a13-911c750a1dfc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects, with at.exe run interactively?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when both conditions hold together, a process image ending in at.exe AND a command line containing the word interactive. Confirm both halves are present in the actual event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to create scheduled jobs with the legacy at.exe utility?
  context: at.exe is deprecated and rarely used on modern systems, where schtasks.exe is the standard tool. An administrator scripting against very old hosts may still invoke it, but routine task creation through at.exe on current Windows is uncommon. Knowing whether the user role and host function involve legacy task administration is often the fastest path to distinguishing sanctioned work from operator-established persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:scheduled_task.task_configuration
  question: What job did this at.exe command configure, and what command and run time does it specify?
  context: The at.exe command line carries the scheduled run time and the command or program to execute, and the interactive flag requests that the job run in a session that can interact with the desktop. Decode the arguments to identify the exact command being scheduled, the time it is set to run, and whether the requested run context grants elevated or interactive privileges. The scheduled command reveals the persistence or escalation payload, often a script, shell, or download cradle.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1053.002.execution_context
  question: Does the Security log show a corresponding scheduled-task registration event, and which account and run context were recorded?
  context: Scheduled-job creation is also recorded in the Windows Security log as a task-registration event (4698), which captures the registering account, the task content, and the run-as context independently of the process-creation evidence. Correlating the at.exe invocation with the registration record confirms a task was actually created and reveals whether it was registered to run under SYSTEM or another privileged account. If Security task-audit events are not collected in this environment, treat zero results as a visibility gap rather than evidence no task was created.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: security
      product: windows
    detection:
      selection:
        EventID: 4698
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TaskName
      - SubjectUserName
      - ProcessId
- source: template:scheduled_task.task_trigger_and_timing
  question: When is the job scheduled to run, and has it already executed?
  context: The run time in the at.exe command determines when the job activates. Jobs set for a near-term time fire soon; jobs registered for a recurring or later time may not have run yet. Checking process creation around the scheduled time reveals whether the payload has already executed. Jobs created through at.exe run as children of the Task Scheduler service, so the scheduler process is where the launched command appears.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:scheduled_task.task_still_present
  question: Is the scheduled job still registered on the system?
  context: Persistence is only effective if the job still exists. Some operators delete jobs after execution to reduce forensic artifacts. Confirming the job is still present, by querying the task store on the host or through the endpoint console, determines whether the mechanism is active and requires remediation. The redisplayed command line provides the job details needed to locate it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned at.exe, and is that parent chain expected?
  context: The parent process reveals how at.exe was invoked. Legitimate administrative use typically descends from an interactive shell or a management console launched by explorer.exe; service-driven automation descends from services.exe. Parents like mshta.exe, wscript.exe, an Office application, or a remote-execution service indicate macro-driven or hands-on-keyboard activity rather than routine administration. Walk up the tree to see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did at.exe spawn afterward?
  context: The processes spawned around the at.exe invocation reveal the operator's broader activity. at.exe itself mainly registers the job, but a hands-on session often runs reconnaissance, additional persistence, or staging commands in the same window. Unexpected children such as cmd.exe, powershell.exe, or certutil.exe point to follow-on execution rather than a one-off task registration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even on hosts where legacy task tooling appears, the firing pattern usually has a stable signature. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how interactive at.exe invocations have historically run here, not generic binary usage. A new parent process, an unexpected user account, or an unusual command shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \at.exe
        CommandLine|contains: interactive
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run at.exe or create scheduled jobs across the environment?
  context: Compare this user's current action against their historical behavior. A user who has never created scheduled jobs with at.exe is more suspicious than one who does so as part of a defined administrative role. User role and typical toolset should align with running a deprecated task-scheduling utility.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and at.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned at.exe, and is that pair historically common. A new or rare parent for at.exe on this host or environment-wide is the deviation worth chasing; a pair that already accounts for many prior events is vendor or scheduled automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user established scheduled jobs or ran related tooling on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and at.exe combination fire on other hosts in the same window, indicating a coordinated automation rollout rather than isolated activity?
  context: Under a service principal, asking what else this user did across the network returns agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism, parent process plus at.exe, fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, additional persistence installation, or data staging that surrounds the job registration.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by persistence establishment.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.renamed_binary_check
  question: Was at.exe executed from its expected system path?
  context: at.exe executed from a path outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists or to ship a legacy utility onto a host that no longer includes it. The original file name embedded in the binary, compared against the on-disk image path, shows whether this is the genuine system at.exe running from its normal location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's at.exe pattern over the past 90 days, and what command-line shapes are typical?
  context: An interactive at.exe pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the resulting count reflects the rule's specific firing pattern, not generic use of the binary. The command-line projection lets the analyst compare typical invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \at.exe
        CommandLine|contains: interactive
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Operators rarely rely on a single persistence mechanism. After registering one scheduled job, they commonly install backup mechanisms using different techniques, such as schtasks.exe, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
