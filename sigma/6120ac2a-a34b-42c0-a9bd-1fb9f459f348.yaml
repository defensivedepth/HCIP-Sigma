name: AddinUtil.EXE Execution From Uncommon Directory
id: 4fa8b248-9559-43a6-ad57-8004127930ba
description: |
  Detects execution of the Microsoft .NET Add-In deployment cache updating utility (addinutil.exe) from a
  directory outside its legitimate install paths. The rule fires when a process named addinutil.exe (or carrying
  the OriginalFileName AddInUtil.exe) runs AND its Image path is not under the normal .NET Framework or WinSxS
  locations. addinutil.exe is on Microsoft's recommended block list and can be abused to proxy-execute attacker
  code: a crafted AddIns.store file in an attacker-controlled folder is deserialized via BinaryFormatter when the
  utility is pointed at that folder with -AddInRoot: or -PipelineRoot:. Legitimate copies live under
  C:\Windows\Microsoft.NET\Framework(64/Arm/Arm64)\ and C:\Windows\WinSxS\; execution from Temp, Desktop,
  Downloads, Public, or other user-writable directories is the signal. Investigation should confirm the binary's
  true identity and origin, decode its command-line parameters and working directory, and determine whether it
  loaded unusual modules, made network connections, or spawned children beyond the expected conhost.exe / werfault.exe.
type: detection
detection_id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Is the alerting binary really addinutil.exe, and is it running from outside the legitimate .NET / WinSxS directories?
  context: Confirm the alert is a true positive before investing time. The rule fires when the process name ends
    in addinutil.exe OR its OriginalFileName is AddInUtil.exe, AND the Image path is not under
    C:\Windows\Microsoft.NET\Framework(64/Arm/Arm64)\ or C:\Windows\WinSxS\. Both the name/metadata match and the
    non-standard path must hold together, so check the Image path against those legitimate locations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run the .NET Add-In deployment utility from this directory?
  context: Legitimate addinutil.exe runs are driven by Office/.NET tooling from system install paths. A user or
    host with no Office Add-In development or deployment role running the utility from a user-writable directory is
    far more likely operator activity than routine maintenance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: The Image path shows the name on disk while OriginalFileName carries the embedded PE metadata
    (AddInUtil.exe). A genuine Microsoft-signed addinutil.exe relocated to a user-writable folder still loses the
    location-based trust the rule keys on; an unsigned or non-Microsoft binary carrying that OriginalFileName is a
    stronger signal of staging. The signing party, signature status, and file hash let you separate a relocated
    system binary from a planted one and feed reputation lookups.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did addinutil.exe arrive in this non-standard directory on the host?
  context: A copy of addinutil.exe in a user-writable folder did not appear spontaneously -- it was copied,
    downloaded, extracted, or dropped by a parent process. Tracing the file-creation event for the basename over a
    long window reveals the delivery mechanism and which process wrote it. A drop into Temp, Desktop, Downloads, or
    Public alongside a crafted AddIns.store file is consistent with deliberate staging for proxy execution.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did addinutil.exe do after execution, and is the same relocated binary present on other hosts?
  context: The point of running addinutil.exe from a non-standard directory is to proxy-execute deserialized
    payload while appearing to be a trusted .NET utility. Its child processes reveal the actual objective.
    Legitimate children are limited to conhost.exe and werfault.exe; anything else (cmd.exe, powershell.exe, a
    spawned payload such as calc.exe in proof-of-concept reproductions) indicates the deserialization gadget
    executed. The same relocated binary on multiple hosts suggests deliberate distribution rather than an isolated drop.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What was the full command line and working directory of this addinutil.exe execution?
  context: The command line and working directory reveal what the utility was pointed at. Look for the -AddInRoot
    or -PipelineRoot arguments (including the dot forms such as -AddInRoot followed by a dot) and a CurrentDirectory
    or root path under Temp, Desktop, Downloads, Public, or Windows\Temp. Those parameters point the deserialization
    routine at an attacker-controlled folder containing a crafted AddIns.store file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.command_analysis
  question: Did any addinutil.exe execution on this host point the utility at a user-controlled folder via the -AddInRoot or -PipelineRoot switches?
  context: Proxy execution through this utility depends on directing it at an attacker-supplied AddIns.store file.
    The -AddInRoot and -PipelineRoot parameters (including their dot forms) are the switches that trigger
    BinaryFormatter deserialization of that file. Their presence -- especially combined with a root path in a
    user-writable directory -- separates abuse from benign cache updates, which do not require pointing the utility
    at a non-standard folder.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \addinutil.exe
        CommandLine|contains:
          - '-AddInRoot:'
          - '-PipelineRoot:'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned addinutil.exe, and is that parent chain expected for a .NET deployment utility?
  context: The parent process reveals how the utility was invoked. Legitimate runs are typically driven by Office
    or .NET tooling and administrative sessions. An unusual parent -- a shell, a script host (wscript.exe,
    cscript.exe, mshta.exe), an Office application, or an unsigned process -- points to operator-driven or
    macro-driven invocation rather than routine cache maintenance.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.image_load
  question: What modules did addinutil.exe load, and do any indicate deserialization gadget or non-.NET-framework assemblies?
  context: Pointing the utility at a crafted AddIns.store file causes BinaryFormatter to deserialize and execute
    embedded payload, which loads assemblies into the process. Modules loaded from the same user-writable directory
    as the binary, or unexpected non-system assemblies, are evidence the deserialization path executed rather than
    a benign cache read. If image-load telemetry is not collected in this environment, treat zero results as a
    visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.network_connection
  question: Did addinutil.exe make any network connections after execution?
  context: The legitimate Add-In cache utility does not initiate network traffic. A network connection originating
    from addinutil.exe -- particularly to an external or non-enterprise destination -- indicates the proxied
    payload reached out, for example to retrieve a follow-on stage or beacon. Compare any destination against known
    enterprise services before treating it as benign. If network telemetry from this host is not collected, treat
    zero results as a visibility gap.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even a block-listed LOLBIN can run benignly. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent/user distribution reflects how this specific firing pattern (addinutil.exe
    outside the legitimate paths) has historically run here -- not generic binary usage. A new parent, an
    unexpected user account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      filter_main_legit_location:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        - :\Windows\WinSxS\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of this firing pattern (addinutil.exe outside its legitimate paths), not generic usage of the binary. Many
    hosts firing the same pattern points to scripted deployment or vendor automation that relocates the utility; a
    single host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      filter_main_legit_location:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        - :\Windows\WinSxS\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run addinutil.exe?
  context: Compare this user's current action against their historical behavior. A user who has never run the .NET
    Add-In utility, or who has no Office/.NET deployment role, is more suspicious than one who runs it regularly.
    User role and typical toolset should align with running a block-listed deployment utility from a non-standard path.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+addinutil.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism: which parent process spawned addinutil.exe, and whether that pair is
    historically common. A new or rare parent for this binary is the deviation worth chasing; a pair that already
    accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user drove similar activity on more than one host, the scope of the operation may be
    larger than a single drop.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+addinutil.exe combination fire on other hosts in the same window, indicating a coordinated rollout versus isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise
    because every host runs system-owned agents constantly. The meaningful question is whether the same launch
    mechanism -- parent process plus spawned binary -- fired on other hosts in the alert window. Multiple hosts in
    the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context:
    what led to this event, what happened after, and whether it is part of a larger sequence. Look for staging of
    the AddIns.store file, reconnaissance, privilege escalation, or persistence around the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, credential access, or file staging -- may reveal the stages that preceded this event and help
    reconstruct the timeline that led to the proxy-execution attempt.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
