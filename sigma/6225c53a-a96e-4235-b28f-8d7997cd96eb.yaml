name: Hypervisor-protected Code Integrity (HVCI) Related Registry Tampering Via CommandLine
id: f5ebbcba-bcc0-4835-8514-01929425be23
description: |
  Detects a command-line tool (reg.exe, powershell.exe, or pwsh.exe, identified by Image or OriginalFileName) writing to
  the Hypervisor-protected Code Integrity (HVCI) registry values under the DeviceGuard path. The rule fires only when all
  four conditions hold together: the interpreter or reg.exe selection, a write verb (add, New-ItemProperty, Set-ItemProperty,
  si), the DeviceGuard path fragment, and one of the HVCI value names (EnableVirtualizationBasedSecurity or
  HypervisorEnforcedCodeIntegrity). HVCI uses virtualization-based security to ensure only trusted code runs in kernel mode;
  setting its Enabled value to 0 disables that protection and allows unsigned or vulnerable drivers to load, a step that can
  precede privilege escalation, persistence, or further defense evasion. Legitimate administrators occasionally disable HVCI
  to troubleshoot driver or hardware incompatibility, so the investigation should confirm the exact value written, identify
  who and what drove the change, and determine whether the host is left unprotected.
type: detection
detection_id: 6225c53a-a96e-4235-b28f-8d7997cd96eb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects, with reg.exe or PowerShell writing an HVCI value under the DeviceGuard registry path?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when all four conditions hold together. The binary must be reg.exe, powershell.exe, or pwsh.exe (by Image or OriginalFileName); a write verb must be present (add, New-ItemProperty, Set-ItemProperty, or si); the command line must reference the \DeviceGuard path; and it must name EnableVirtualizationBasedSecurity or HypervisorEnforcedCodeIntegrity. Confirm all four are present and read the value being written, since Enabled set to 0 disables the protection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to modify HVCI or virtualization-based security registry settings?
  context: Disabling HVCI is a legitimate troubleshooting step when a driver or hardware component is incompatible with virtualization-based security, but it is uncommon on general-purpose endpoints and is normally performed by a known administrator during a maintenance window. Knowing whether the user role and host function involve security-baseline changes is often the fastest path to distinguishing routine administration from operator preparation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:registry.registry_key_context
  question: What exact HVCI value was written, and was the protection set to disabled?
  context: The DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity and EnableVirtualizationBasedSecurity values under HKLM control whether HVCI and VBS run. An Enabled DWORD of 0 disables the protection and permits unsigned or vulnerable kernel-mode drivers to load; a value of 1 enables it. Read the value name and data written to determine whether this alert weakened protection or restored it, since the same path is touched in both directions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:defense_tampering.what_was_disabled
  question: Which security control was targeted, and does the command write a value that disables HVCI?
  context: Different tampering targets carry different impact. The target here is kernel-mode code integrity, and disabling HVCI removes the guarantee that only signed, trusted drivers load, opening the door to bring-your-own-vulnerable-driver attacks and rootkits. Parse the command line to confirm whether it sets EnableVirtualizationBasedSecurity or HypervisorEnforcedCodeIntegrity to 0 (disable) versus 1 (enable), which determines investigation priority and remediation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: When the registry change is driven through PowerShell, attackers often loosen PowerShell controls first so the change runs unimpeded. Common precursors include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), constrained language mode escape, and downgrade to PowerShell v2 to evade logging. Finding these in the hour before the HVCI write strengthens the case that the tampering was deliberate rather than routine.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this reg.exe or PowerShell invocation, and is that parent chain expected?
  context: The parent process reveals how the registry write was invoked. Routine administration usually descends from explorer.exe, a management console, or a deployment agent; parents like mshta.exe, wscript.exe, an Office application, or an unexpected shell point to macro-driven or staged execution. Walk up the tree to see what spawned the parent and whether the chain fits known administrative tooling.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is HVCI currently enabled on this host, or does it remain disabled after this change?
  context: Tampering may be momentary (toggled for a single action) or persistent. Checking the current HVCI and VBS state determines whether the host is still running without kernel-mode code-integrity protection. HVCI state can be read from the registry value written or validated out of band; if it remains disabled, the protection should be restored before continuing the investigation, since unsigned drivers could be loaded in the interim.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the HVCI value was modified?
  context: Defenses are disabled for a reason, whether to load a driver, run a tool, or perform an action that protection would otherwise block. Examining process creation immediately after the HVCI change reveals what the tampering was meant to enable. Look in particular for driver installation, service creation, or signed binaries loading unexpected modules in the minutes and hours following the write.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host around the same time?
  context: Operators who disable one control often disable several, stacking HVCI tampering with stopping Defender, clearing logs, deleting shadow copies, or changing firewall rules to maximize coverage. Finding multiple tampering events from the same user or parent process within a short window indicates a coordinated effort to weaken host defenses rather than an isolated administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session via reg.exe or PowerShell?
  context: Attackers who modify one registry key often modify several, for example disabling HVCI alongside setting a Run key for persistence or weakening Defender policy. Finding clusters of registry write operations from the same host within a short window reveals the full scope of the configuration changes and whether multiple objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - 'New-ItemProperty'
          - 'Set-ItemProperty'
          - 'Remove-ItemProperty'
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even legitimate HVCI changes can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific HVCI-tampering firing pattern has historically run here, not generic reg.exe or PowerShell usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
      selection_cli_base:
        CommandLine|contains: \DeviceGuard
      selection_cli_key:
        CommandLine|contains:
        - EnableVirtualizationBasedSecurity
        - HypervisorEnforcedCodeIntegrity
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this HVCI-tampering firing pattern, not generic use of reg.exe or PowerShell. Many hosts firing the same pattern points to scripted deployment or a configuration-management rollout; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
      selection_cli_base:
        CommandLine|contains: \DeviceGuard
      selection_cli_key:
        CommandLine|contains:
        - EnableVirtualizationBasedSecurity
        - HypervisorEnforcedCodeIntegrity
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
      selection_cli_base:
        CommandLine|contains: \DeviceGuard
      selection_cli_key:
        CommandLine|contains:
        - EnableVirtualizationBasedSecurity
        - HypervisorEnforcedCodeIntegrity
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
      selection_cli_base:
        CommandLine|contains: \DeviceGuard
      selection_cli_key:
        CommandLine|contains:
        - EnableVirtualizationBasedSecurity
        - HypervisorEnforcedCodeIntegrity
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar tampering or registry changes on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
      selection_cli_base:
        CommandLine|contains: \DeviceGuard
      selection_cli_key:
        CommandLine|contains:
        - EnableVirtualizationBasedSecurity
        - HypervisorEnforcedCodeIntegrity
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or privilege escalation, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by driver loading, or reconnaissance followed by configuration changes.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
