- source: attack:T1620.dotnet_runtime_image_load
  question: Around the alert time, did this host load the .NET runtime and automation assemblies that in-memory Assembly.Load requires?
  context: Reflective .NET loading from PowerShell needs the CLR and the automation engine
    resident in the process — clr.dll, clrjit.dll, mscoree.dll, and
    System.Management.Automation. Their appearance in image-load events on this host around
    the alert corroborates that managed code was actually staged in memory, and the loading
    process identifies which host process hosted the assembly. Absence may simply mean
    image-load logging is not collected, so treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\clr.dll'
          - '\clrjit.dll'
          - '\mscoree.dll'
          - '\System.Management.Automation.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- source: attack:T1620.in_process_memory_access
  question: Did any process open a handle to itself with execute/write access rights around the alert time?
  context: Unlike cross-process injection, reflective code loading stages and runs managed
    code entirely inside the loading process's own PID — the suspicious memory operations
    do not cross a process boundary. A process opening a handle to itself with rights
    permitting memory write and execute is consistent with in-memory staging. If process-access
    events are not collected in this environment, treat zero results as a visibility gap
    rather than evidence the staging did not occur.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        GrantedAccess|contains:
          - '0x1F0FFF'
          - '0x1FFFFF'
      condition: selection
    fields:
      - SourceImage
      - TargetImage
      - GrantedAccess
