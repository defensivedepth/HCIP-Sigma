name: Tor Client/Browser Execution
id: cc7abf53-7da1-4598-b7ee-c32a3a800eb1
description: |
  Detects execution of the Tor client (tor.exe) or the Tor Browser (the bundled
  firefox.exe under a Tor Browser path), identified either by the process Image
  path or by a Description/Product of "Tor Browser". Tor routes outbound traffic
  through volunteer relays so the true destination is hidden behind an exit node,
  which makes it useful for anonymized browsing and equally useful for command-and-control
  obfuscation, data exfiltration, and reaching .onion hidden services. Investigation
  should confirm the binary identity, decode how it was launched and configured,
  determine the outbound destinations and whether the connection persisted, and
  establish whether this host or user has any business reason to run an onion-routing
  client.
type: detection
detection_id: 62f7c9bf-9135-49b2-8aeb-1e54a6ecc13c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match tor.exe, the Tor Browser firefox.exe path, or a "Tor Browser" Description/Product?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule
    fires when a process either runs from a path ending in \tor.exe or \Tor Browser\Browser\firefox.exe,
    or carries a binary Description or Product of "Tor Browser". Review the Image, Description,
    and Product fields of the triggering event and note which branch matched, because a renamed
    or repackaged Tor binary that matches only on Description/Product is handled differently from
    a standard install at a known path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Description
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run an onion-routing client or the Tor Browser?
  context: >-
    Tor has occasional legitimate uses (privacy research, journalism, security testing, sanctioned
    red-team work) but is rarely sanctioned on corporate endpoints and is frequently blocked by
    policy. Knowing whether the user role and host function are consistent with anonymized routing
    is often the fastest path to distinguishing approved use from policy violation or attacker tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is Tor on the organization's approved software list for this host?
  context: >-
    Organizations typically sanction a narrow set of anonymization or tunneling tools, if any.
    A Tor client or Tor Browser that is not on the approved list -- regardless of how the binary
    was packaged or named -- may represent shadow IT, a policy violation, or attacker-deployed
    infrastructure for anonymized command-and-control. Unauthorized onion-routing tooling should
    be checked regardless of where the binary came from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a documented business reason or support session explaining this Tor usage?
  context: >-
    Sanctioned anonymized routing usually correlates with a documented use case -- a privacy or
    research task, an approved testing engagement, or a specific user request. If no such record
    exists for this host and timeframe, the client may have been installed by an attacker for
    anonymized persistence or by a user circumventing egress controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What were the full command-line arguments to the Tor process, and do they configure a client, a relay, or a hidden service?
  context: >-
    The command line reveals how Tor was invoked and what it was configured to do. Decode any
    flags and paths -- a custom torrc or DataDirectory, a SOCKS port (the client default is 9050),
    or hidden-service arguments such as -HiddenServiceDir and -HiddenServicePort that turn the host
    into a reachable onion service. The presence of relay or hidden-service configuration is a far
    stronger signal than a default Tor Browser launch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned the Tor binary, and is that parent chain expected?
  context: >-
    The parent process reveals how Tor was launched. A user double-clicking the Tor Browser from
    explorer.exe is a different story from tor.exe being spawned by mshta.exe, wscript.exe, a script
    interpreter, an Office application, or an unsigned dropper, any of which points to launch via
    a malicious script or as a staged payload rather than deliberate user action.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoints and ports did the Tor process connect to?
  context: >-
    Tor clients establish outbound connections to guard/entry relays, commonly over 443 or 8443
    to defeat egress filtering, and the client also listens on a local SOCKS port (default 9050).
    Outbound monitoring sees only the relay, not the true destination, so the relevant signal is
    whether the connections are sustained, which ports they use, and whether the destinations match
    known Tor relay infrastructure. Persistent encrypted sessions to relay nodes distinguish active
    routing from a process that merely launched.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1090.003.tuning_parameter
  question: Did this host resolve any .onion hidden-service domains around the time of the alert?
  context: >-
    Reaching a Tor hidden service produces DNS or name-resolution activity for .onion domains, and
    Tor2web-style gateways surface .onion as a substring of an otherwise normal hostname. Resolutions
    of onion domains corroborate that the client actually routed to hidden-service infrastructure
    rather than launching idle. Absence of .onion resolutions does not clear the host, since standard
    Tor circuits resolve names inside the network rather than via local DNS.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: dns
      product: windows
    detection:
      selection:
        QueryName|contains: '.onion'
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - QueryName
      - QueryResults
- source: template:cue_process_tool.follow_on
  question: What child processes did the Tor binary spawn afterward?
  context: >-
    Processes spawned by the Tor binary reveal its actual impact. A default Tor Browser launch has
    a predictable helper-process tree; a Tor client that spawns command interpreters, certutil,
    or other tooling points to the routing channel being used to stage or execute follow-on activity
    rather than for browsing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host run a Tor binary before?
  context: >-
    A Tor client or browser that has never been seen on a host is more suspicious than one that
    runs regularly. Zero or very low historical counts indicate first-time or rare execution, which
    on most corporate endpoints is itself a meaningful deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously matched the Tor rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even sanctioned tools get abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent/user distribution reflects how this specific Tor-matching
    pattern has historically run here, not generic process activity. A new parent process, an
    unexpected user account, or an unusual launch pattern relative to that history is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Tor Browser
      - Product: Tor Browser
      - Image|endswith:
        - \tor.exe
        - \Tor Browser\Browser\firefox.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Tor Browser
      - Product: Tor Browser
      - Image|endswith:
        - \tor.exe
        - \Tor Browser\Browser\firefox.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Tor Browser
      - Product: Tor Browser
      - Image|endswith:
        - \tor.exe
        - \Tor Browser\Browser\firefox.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the Tor launch is an isolated act
    or part of broader movement. If the same user triggered similar tooling or anonymized routing
    on multiple endpoints, the scope of the activity -- and any potential compromise -- may be larger
    than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Tor Browser
      - Product: Tor Browser
      - Image|endswith:
        - \tor.exe
        - \Tor Browser\Browser\firefox.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts matched the Tor rule's pattern in the past week, and does the distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the Tor-matching pattern rather than generic binary usage. Many hosts firing the same
    pattern points to a packaged deployment or sanctioned rollout; one host or a small unrelated set
    points to manual or operator-driven activity. Use the host distribution to calibrate how exceptional
    this alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: Tor Browser
      - Product: Tor Browser
      - Image|endswith:
        - \tor.exe
        - \Tor Browser\Browser\firefox.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Anonymized routing rarely happens in isolation. Earlier detections on the same host -- defense
    tampering, reconnaissance, credential access, or staging -- may reveal the stages that preceded
    a Tor channel being established and help reconstruct whether this is the egress step of a longer
    sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
