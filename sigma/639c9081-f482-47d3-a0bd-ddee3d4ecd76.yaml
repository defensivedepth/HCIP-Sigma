name: All Backups Deleted Via Wbadmin.EXE
id: fc99c870-82a0-4ac2-ba0b-a6749e107178
description: |
  Detects wbadmin.exe being run to delete all backups, where the command line contains both "delete" and "backup" together with the "keepVersions:0" selector that removes every retained backup version. Legitimate administrators occasionally prune backups, but the "keep zero versions" form removes all recovery points at once and is the canonical wbadmin invocation used to inhibit recovery before file encryption or other destructive impact. Determine whether the deletion was authorized backup maintenance or part of a recovery-inhibition sequence by examining the surrounding destructive commands, the launching process, and whether the same activity is spreading across hosts.
type: detection
detection_id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the wbadmin command line delete all backups with the keepVersions:0 selector?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires when wbadmin.exe (by image name or original filename) runs a command line containing both "delete" and "backup" along with "keepVersions:0", the selector that removes every retained backup version rather than pruning a specific count.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to delete all Windows Server backups?
  context: Legitimate backup maintenance is performed by backup operators or administrators on server platforms that run Windows Backup. Knowing whether the user role and host function are consistent with deleting every backup version is often the fastest path to distinguishing authorized maintenance from a recovery-inhibition action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: What backup target and selectors were specified in the wbadmin command, and did the deletion target system state or all backups?
  context: The full command line reveals exactly what recovery capability was destroyed. Decode whether the deletion targeted "systemstatebackup" or general backups, whether keepVersions:0 removed all versions, and whether a -backupTarget, -machine, or -quiet flag was present. The -quiet flag suppresses prompts and is required for unattended use; its presence points to scripted rather than interactive operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:ransomware_impact.recovery_options_assessment
  question: What recovery-inhibiting commands were executed on this host?
  context: Recovery inhibition is usually chained across several utilities, such as deleting shadow copies (vssadmin, wmic), disabling boot recovery (bcdedit), deleting backups (wbadmin), and disabling the Windows Recovery Environment (reagentc). This query surfaces all recovery-inhibiting commands on the host, revealing the full scope of recovery destruction. Verify whether each action succeeded by checking system state directly (wbadmin get versions, vssadmin list shadows, bcdedit /enum, reagentc /info) and confirm whether offline or off-host backups remain.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- source: template:ransomware_impact.destruction_scope_on_host
  question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: Recovery inhibition rarely happens alone. Deleting backups is frequently chained with stopping security services, clearing event logs, changing file permissions, and deleting volume shadow copies. Finding the complete set of destructive commands in a tight window reveals whether this is an automated destruction sequence rather than an isolated maintenance action.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned wbadmin.exe and is that parent chain expected?
  context: The parent process reveals how wbadmin was invoked. Authorized backup maintenance typically runs from an interactive shell launched by an administrator or from a known backup-automation parent. A parent such as cmd.exe or powershell.exe executing a script, or an unexpected application, points to scripted destruction rather than a deliberate administrative action.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the backups were deleted?
  context: Backups are deleted to remove recovery options before an action that would otherwise be reversible. Examining process activity immediately after the deletion reveals what the destruction was meant to enable, such as file encryption, additional service stops, or data staging. Correlate this window with file events and network connections on the host.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: Operators who delete backups often disable several controls in the same operation. Stopping Defender, clearing event logs, and deleting shadow copies alongside the backup deletion creates maximum coverage. Multiple tampering events from the same user or parent process indicate several controls were targeted together rather than an isolated maintenance command.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: attack:T1490.registry_set
  question: Was the Windows Recovery Environment disabled through a recovery-related registry change on this host?
  context: Backup deletion is one of several recovery-inhibition vectors; another is disabling the Windows Recovery Environment, which records its enabled state in registry values. A registry write that flips the recovery environment to disabled around the time of the backup deletion indicates the operator is closing multiple recovery paths rather than performing routine backup maintenance. If recovery-related registry events are not collected in this environment, treat zero results as a visibility gap rather than evidence nothing changed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\WindowsRE'
          - '\ReAgent'
          - '\SystemRestore\DisableSR'
          - '\BCD'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:ransomware_impact.encryption_or_ransom_indicators
  question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the deletion?
  context: Recovery-inhibiting actions such as backup destruction typically precede file encryption by minutes. Checking process activity after the deletion, filtered to surface non-system binaries, helps determine whether an encryption phase has started. Also check for ransom notes and mass file renames through file event data or the endpoint console.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: template:ransomware_impact.network_wide_impact
  question: Is this same backup-deletion alert firing on other hosts in the environment?
  context: Recovery-inhibition sequences often execute across many hosts simultaneously or in rapid succession. Finding the same alert on multiple hosts indicates network-wide execution and determines the scope for containment and incident response. A spread across several hosts in a short window points to coordinated, pushed activity rather than a single administrator pruning backups.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously deleted backups with this pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even legitimate backup pruning leaves a baseline. The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how this specific deletion pattern has historically run here rather than generic wbadmin usage. A new parent process, an unexpected user account, or a first-time appearance of this pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_cli:
        CommandLine|contains|all:
        - delete
        - backup
        CommandLine|contains: keepVersions:0
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this backup-deletion pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific deletion pattern rather than generic wbadmin usage. Many hosts firing the same pattern points to scripted deployment or backup-rotation automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_cli:
        CommandLine|contains|all:
        - delete
        - backup
        CommandLine|contains: keepVersions:0
      condition: all of selection_*
    fields:
    - host.name
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around the deletion?
  context: Destructive impact is frequently preceded or followed by persistence so the operator retains access. Scheduled tasks, services, registry Run key writes, BITS jobs, or WMI subscriptions installed in the same timeframe as the backup deletion indicate intentional foothold stacking rather than an isolated maintenance command.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run wbadmin on hosts across the environment?
  context: Compare this user's current action against their historical behavior. A user who has never run wbadmin, or never deleted backups, is more notable than a backup operator who does so on a schedule. The user's role and typical toolset should align with deleting all backup versions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and wbadmin combination historically routine on this host or environment-wide, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute the behavior; the meaningful pivot is the launch mechanism. A parent process that has spawned wbadmin many times before reflects established automation, while a new or rare parent for wbadmin is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or destruction spanning multiple endpoints. If the same user triggered similar activity on several hosts in this window, the scope of the impact may be larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and wbadmin combination fire on other hosts in the same window, indicating a coordinated rollout?
  context: Under a service principal, tracking activity by user returns agent-telemetry noise because every host runs service-owned processes constantly. The meaningful question is whether the same launch mechanism (parent process plus spawned binary) fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
