name: Wab/Wabmig Unusual Parent Or Child Processes
id: e6eb4973-3070-4caa-afef-e08e20bc3933
description: |
  Detects the Windows Contacts (wab.exe) and Microsoft Address Book Import Tool (wabmig.exe)
  binaries appearing in an anomalous process lineage. The rule fires when EITHER one of these
  binaries is spawned by WmiPrvSE.exe, svchost.exe, or dllhost.exe, OR one of these binaries
  itself spawns a child process. Legitimately these binaries run as short-lived, user-launched
  contact and address-book utilities with no children and a predictable interactive parent;
  a WMI/service/COM-surrogate parent or any spawned child is the off-pattern signal. These
  binaries are also targeted for injection because their filenames blend into a normal Windows
  Mail install, so the matched event may represent a hollowed or injected host process rather
  than genuine contact-manager activity. Determine which branch fired, confirm whether the
  lineage is expected on this host and user, and trace the surrounding process and alert
  activity for follow-on tooling.
type: detection
detection_id: 63d1ccc0-2a43-4f4b-9289-361b308991ff
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this event match the rule — is wab.exe or wabmig.exe spawned by WmiPrvSE/svchost/dllhost,
    or is it itself the parent of a child process?
  context: Confirm which branch fired before investing analysis time. The rule matches on EITHER a
    parent-side pattern (wab.exe or wabmig.exe spawned by WmiPrvSE.exe, svchost.exe, or dllhost.exe)
    OR a child-side pattern (wab.exe or wabmig.exe spawning any child process). Note which branch
    fired from the ParentImage/Image pair, because it changes which downstream questions carry weight.
    A parent-side fire points at injection into the contact-manager binary via a service or COM
    surrogate, while a child-side fire points at the binary being used to launch follow-on tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- source: template:universal.host_user_context
  question: Is this host and user expected to run the Windows Contacts or Address Book Import binaries
    in this lineage?
  context: Genuine wab.exe and wabmig.exe use is interactive and rare on servers and most workstations.
    Knowing whether this host's role and this user routinely touch contact-management or address-book
    import functions is often the fastest way to separate a real operator action from a benign
    one-off.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- source: template:parent_child.parent_process_legitimacy
  question: Is this parent expected to spawn this child, and what started the parent?
  context: The parent-child relationship is the core signal. For a parent-side fire, trace the origin
    of WmiPrvSE.exe, svchost.exe, or dllhost.exe — a COM- or WMI-driven spawn of wab.exe/wabmig.exe
    is a known way to make an injected process a child of a service host rather than of the launching
    tool, defeating simple parent heuristics. For a child-side fire, the grandparent of wab.exe/wabmig.exe
    shows how the binary was launched in the first place.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: If the matched parent spawned the detected process, it may have spawned others. For a
    service-host parent that produced wab.exe/wabmig.exe, sibling processes can reveal additional
    injected or staged binaries from the same orchestration. For wab.exe/wabmig.exe acting as the
    parent, this widens the view to every child it launched.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_parent_process.mechanism_decode
  question: What is the parent process instance, and what command line did it run?
  context: Retrieving the parent's own process_creation event shows how the parent itself was invoked
    and what it was doing when it produced this child. A service-host parent spawning a contact-manager
    binary out of nowhere, or a wab.exe/wabmig.exe parent running with an unexpected command line,
    sharpens whether this lineage is a host process being abused as an injection container.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- source: template:cue_process_tool.mechanism_decode
  question: What command line did wab.exe or wabmig.exe run, and what did it do beyond the triggering
    event?
  context: Scoping to all wab.exe/wabmig.exe executions on this host within a short window shows the
    full operation rather than just the matched event. Decode any arguments, file paths, or DLL
    references. These binaries take few legitimate arguments, so an unusual or injected command line,
    or a burst of executions, points away from genuine contact-manager use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- source: template:cue_parent_process.baseline
  question: Does this parent normally spawn wab.exe or wabmig.exe on this host?
  context: Some parent-child pairings are routine; a service host or COM surrogate launching a
    contact-management binary generally is not. Zero or very low historical counts for this specific
    parent-child pairing mark it as a novel spawning relationship worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_process_tool.baseline
  question: Has this host run wab.exe or wabmig.exe before?
  context: A contact-manager binary that has never executed on a host is more notable than one that
    runs regularly. Zero or very low counts over the historical window indicate first-time or rare
    execution, which on a server or non-interactive host is itself suspicious.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- source: template:cue_parent_process.follow_on
  question: What other child processes did this parent launch in the hours after the alert?
  context: A parent used to stage tooling often spawns several processes in sequence — reconnaissance,
    credential access, lateral movement. Listing the parent's children over a forward window reveals
    the full scope of activity initiated through this lineage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_parent_process.clustering
  question: What other activity is associated with this parent process around the same time?
  context: Beyond child processes, the parent may have generated additional process activity in the
    minutes surrounding the alert. Clustering on the parent narrows the immediate context and helps
    reconstruct what the lineage was doing when the detection fired.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
  - network_connection
- source: template:cue_user_actor.baseline
  question: Does this user normally run wab.exe or wabmig.exe?
  context: Compare this user's current action against their historical pattern. A user who has never
    run the contact-manager binaries is more notable than one who does so regularly. User role and
    typical toolset should align with interactive contact-management use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the
    environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior;
    the meaningful pivot is the launch mechanism. A new or rare parent for wab.exe/wabmig.exe on this
    host or environment-wide is the deviation worth chasing, while a pair already accounting for many
    prior events is OS or vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
  always_include: true
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on several hosts, the scope of
    compromise may be larger than this single event.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window — is
    this a coordinated automation rollout, or is it isolated to this host?
  context: Under a service principal, a user-pivot returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism — parent process plus spawned binary — fired on
    other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
  always_include: true
- source: template:cue_parent_process.scope
  question: Is this parent-child spawning pattern occurring on other hosts?
  context: The same parent-child relationship appearing on multiple hosts may indicate a campaign or
    lateral movement pattern, while a single occurrence is more likely targeted. An environment-wide
    comparison helps calibrate severity and identify the scope of activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, credential access, or persistence mechanisms in the surrounding window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access
    — may reveal the attack stages that preceded this event and help reconstruct the timeline.
    Injection into a masquerading host process is often a mid-chain action with earlier loader or
    delivery activity ahead of it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
