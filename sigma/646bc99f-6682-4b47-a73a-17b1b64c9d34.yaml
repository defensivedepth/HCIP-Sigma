name: Execute Files with Msdeploy.exe
id: 70f394d9-b0dc-4442-9667-4fa3cb95f7bc
description: |
  Detects the Microsoft-signed deployment utility msdeploy.exe invoked with verb:sync, -source:RunCommand, and
  -dest:runCommand together, the LOLBAS pattern that runs an arbitrary local batch file under a trusted signed binary.
  Because msdeploy.exe is signed by Microsoft, this invocation proxies execution past application allowlisting and signature-
  based controls. The rule fires only when all three command-line tokens appear alongside an Image ending in msdeploy.exe.
  Legitimate web-deployment workflows on IIS or build servers can use msdeploy, so the investigation should recover the batch
  file or command passed to runCommand, confirm the parent and user are expected to deploy with this tool, and determine
  whether the executed content performs routine deployment or stages further execution.
type: detection
detection_id: 646bc99f-6682-4b47-a73a-17b1b64c9d34
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects, with msdeploy.exe run using verb:sync, -source:RunCommand, and -dest:runCommand together?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when all three tokens appear together on an Image ending in msdeploy.exe. Confirm all three are present and read the value assigned to -dest:runCommand, which names the batch file or command being executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to deploy applications or run batch files via msdeploy.exe?
  context: Web-deployment activity with msdeploy is routine on IIS web servers and build or release hosts, but unusual on general-purpose workstations. Knowing whether the user role and host function involve web deployment is often the fastest path to distinguishing a release pipeline from a signed-binary proxy-execution bypass.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful protection-looks-healthy signal; kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did msdeploy.exe run? Recover the batch file or command passed to -dest:runCommand and read its contents.
  context: 'The value assigned to -dest:runCommand is the operator''s payload proxied through a signed binary. Extract the path or command from the runCommand argument, then open the referenced batch file (or read the inline command) to determine what executed. The decoded content reveals the actual intent: routine deployment scripting, a download cradle, an in-memory loader, or follow-on tooling. Note any embedded paths, URLs, IP addresses, or child binary names.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - 'verb:sync'
          - '-source:RunCommand'
          - '-dest:runCommand'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.command_analysis
  question: Does the runCommand target point to a batch file or command in a user-writable or temporary directory rather than a deployment workspace?
  context: 'Legitimate deployments reference scripts inside a controlled release or web-content path; signed-binary proxy execution typically points runCommand at a batch file dropped in a user-writable location such as a download, profile, public, or temp directory. Compare the path in the command line against expected deployment paths for this host, and check whether the referenced file is still on disk for hash lookup or content review.'
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - 'verb:sync'
          - '-dest:runCommand'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned msdeploy.exe, and is that parent chain expected?
  context: The parent process reveals how msdeploy was invoked. Release pipelines and deployment automation typically descend from a service, agent, or scheduled-task host; an interactive shell, an Office application, a script host, or a freshly written binary as parent points to hands-on-keyboard or staged execution rather than a managed deployment. Walk up the tree to see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did msdeploy.exe spawn afterward?
  context: The runCommand batch file executes through msdeploy, so the proxied payload surfaces as child processes. Legitimate deployment scripts spawn predictable build or configuration tooling; proxy-execution abuse commonly spawns cmd.exe, powershell.exe, certutil.exe, or other living-off-the-land binaries for post-exploitation. Review the children and their command lines for follow-on staging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.image_load
  question: What modules did msdeploy.exe load on this host, and do any of them resolve to a user-writable or unsigned path rather than the Web Deploy install directory?
  context: Proxy-execution abuse of signed binaries sometimes pairs command-line execution with side-loading of an attacker-supplied module from a writable directory. The legitimate msdeploy.exe loads its dependencies from the IIS Microsoft Web Deploy install path under Program Files; a module loaded from a profile, temp, or public directory, or an unsigned module, is the deviation worth chasing. If image-load events are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.network_connection
  question: Did msdeploy.exe make any network connections around the time of the alert, and do the destinations match expected deployment endpoints?
  context: The runCommand batch pattern executes locally, so msdeploy itself reaching out to a remote host is unexpected for this firing pattern and may indicate the proxied payload retrieving a second stage or beaconing. Compare any destinations against known deployment or update endpoints for this environment. If network events for this binary are not ingested, treat zero results as a visibility gap rather than confirmation of no network activity.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: true
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.baseline
  question: Does this host normally run msdeploy.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution, which on a non-deployment host raises the priority of recovering and reviewing the runCommand payload.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even on a host where msdeploy is routine, the RunCommand execution pattern may be rare. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here, not generic msdeploy usage. A new parent process, an unexpected user account, or an unusual command shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - verb:sync
        - -source:RunCommand
        - -dest:runCommand
        Image|endswith: \msdeploy.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run msdeploy.exe across the environment?
  context: Compare this user's current action against their historical behavior. A user who has never run msdeploy is more suspicious than one who deploys with it regularly as part of a release or web-administration role. User role and typical toolset should align with running a deployment utility that can proxy batch execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and msdeploy.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned msdeploy, and is that pair historically common. A new or rare parent for msdeploy on this host or environment-wide is the deviation worth chasing; a pair that already accounts for thousands of prior events is a deployment pipeline or scheduled automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and msdeploy.exe combination fire on other hosts in the same window, indicating a coordinated automation rollout rather than isolated activity?
  context: Under a service principal, asking what else this user did across the network returns agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism, parent process plus spawned binary, fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed deployment automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this RunCommand firing pattern, not generic msdeploy usage. Many hosts firing the same pattern points to a scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - verb:sync
        - -source:RunCommand
        - -dest:runCommand
        Image|endswith: \msdeploy.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by exploitation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
