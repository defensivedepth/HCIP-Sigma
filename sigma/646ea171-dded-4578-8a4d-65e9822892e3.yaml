    typical?
  context: >-
    A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query
    mirrors the rule's selection structure scoped to this host, so the resulting count reflects this specific firing pattern
    rather than generic rundll32 usage. The CommandLine projection lets the analyst compare typical invocation patterns against
    the alerting one and spot whether the ordinal or obfuscation form has changed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_1:
        CommandLine|contains|all:
        - comsvcs
        - full
        CommandLine|contains:
        - '#-'
        - '#+'
        - '#24'
        - '24 '
        - MiniDump
        - '#65560'
      selection_generic:
        CommandLine|contains|all:
