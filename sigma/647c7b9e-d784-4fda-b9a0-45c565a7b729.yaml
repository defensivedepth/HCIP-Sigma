name: Operator Bloopers Cobalt Strike Commands
id: 5c5f3e50-eaeb-45dd-98b3-431012016868
description: |
  Detects Cobalt Strike Beacon aggressor-script command names entered directly into the Windows command shell, where they
  show up as cmd.exe invocations whose command line both starts with a cmd token and contains a Beacon keyword (psinject,
  spawnas, make_token, remote-exec, rev2self, dcsync, logonpasswords, execute-assembly, or getsystem). This pattern arises
  when an operator pastes or types Beacon console syntax into the target host's OS shell instead of into the Beacon console,
  leaving telltale strings the shell does not understand. These tokens are not valid Windows commands, so a genuine match
  is a strong sign of hands-on-keyboard post-exploitation; the investigation should confirm which Beacon command was typed,
  identify the operator's parent process and account, and look for the surrounding credential-access, lateral-movement, and
  impact activity that accompanies interactive Beacon use.
type: detection
detection_id: 647c7b9e-d784-4fda-b9a0-45c565a7b729
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match this rule's pattern — a cmd.exe invocation that both starts with a cmd token and contains
    a Cobalt Strike Beacon command keyword?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both conditions
    hold together — the process is cmd.exe (by Image or OriginalFileName) AND its command line starts with a cmd token (cmd,
    cmd.exe, or the full system32 path) AND contains one of the Beacon keywords (psinject, spawnas, make_token, remote-exec,
    rev2self, dcsync, logonpasswords, execute-assembly, getsystem). Confirm which keyword is present, since these strings are
    not valid Windows commands and the specific one indicates which Beacon capability the operator intended.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run command-shell tooling that resembles offensive Beacon syntax?
  context: Legitimate administrative or automation activity rarely types Beacon command names into a shell, and these tokens
    are not valid Windows commands. Knowing whether the account and host are consistent with hands-on shell use, or whether
    a security assessment is underway, is often the fastest path to distinguishing a real operator blooper from an odd but
    benign string match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this Cobalt Strike command execution part of an authorized penetration test or red team engagement?
  context: Cobalt Strike is used in authorized security assessments. Before investing investigation time, check whether a pentest
    or red team exercise is currently active on this host or network segment. An authorized engagement whose timing, operator,
    and scope match resolves the alert without further analysis; absence of a matching engagement raises the priority of the
    remaining questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Interactive Beacon use is hands-on-keyboard activity that operators frequently precede by weakening protection. The
    query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch
    AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches
    will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: Which Cobalt Strike Beacon keyword was typed, and what does the full command line reveal about the intended action?
  context: The Beacon keyword identifies the operator's intent — make_token, spawnas, and rev2self manipulate access tokens;
    dcsync and logonpasswords are credential access; remote-exec is lateral movement; execute-assembly and psinject run code
    in memory; getsystem escalates to SYSTEM. Read the full command line for the keyword and any arguments that leaked alongside
    it (target hosts, usernames, listener names). cmd.exe is too common for host-and-binary scoping, so this lookup is pinned
    to the alerting event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:hacking_tool.tool_capability_used
  question: What specific Beacon capability does the matched keyword represent, and what scope of compromise does it imply?
  context: Cobalt Strike Beacon is multi-purpose. The matched keyword maps to a distinct capability and a distinct response
    scope — token manipulation (make_token, spawnas, rev2self) implies impersonation of another identity; dcsync and logonpasswords
    imply domain or local credential theft; execute-assembly and psinject imply in-memory code execution; remote-exec implies
    movement to another host; getsystem implies local privilege escalation. Identify which capability was invoked so the response
    matches the operator's actual intent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this cmd.exe, and is that parent chain expected?
  context: The parent process reveals how the shell was launched. An operator working through a Beacon often spawns cmd.exe
    from an injected or unusual parent rather than from explorer.exe. Parents such as rundll32.exe, an unexpected svchost.exe,
    an Office application, or a script host point to an injected Beacon driving the shell; walk up the tree to see what spawned
    the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this cmd.exe spawn afterward?
  context: The processes spawned after the alerting shell reveal the operator's next actions. Discovery binaries (whoami, net,
    nltest, systeminfo), credential tooling, or additional script hosts launched from this cmd.exe indicate the interactive
    session continued past the mistyped command. Predictable, empty, or no follow-on activity is the benign case.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current
    alert fit that history?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how this specific firing pattern has run here before — not generic cmd.exe usage. For a genuine operator-blooper
    pattern the expected history is empty or near-empty; any prior firings, and the parents and accounts behind them, calibrate
    whether the current alert is a first-time event or a recurring one worth comparing against.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: Cmd.Exe
      - Image|endswith: \cmd.exe
      selection_cli:
        CommandLine|startswith:
        - 'cmd '
        - cmd.exe
        - c:\windows\system32\cmd.exe
        CommandLine|contains:
        - psinject
        - spawnas
        - make_token
        - remote-exec
        - rev2self
        - dcsync
        - logonpasswords
        - execute-assembly
        - getsystem
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like coordinated
    activity or an isolated event?
  context: The query mirrors the rule's selection structure with no host scope, returning a fleet-wide count of this firing
    pattern rather than generic cmd.exe usage. Multiple hosts firing the same Beacon-keyword pattern points to an operator
    moving across the environment; a single host or a small unrelated set points to an isolated interactive session. Use the
    host distribution to gauge the breadth of the activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: Cmd.Exe
      - Image|endswith: \cmd.exe
      selection_cli:
        CommandLine|startswith:
        - 'cmd '
        - cmd.exe
        - c:\windows\system32\cmd.exe
        CommandLine|contains:
        - psinject
        - spawnas
        - make_token
        - remote-exec
        - rev2self
        - dcsync
        - logonpasswords
        - execute-assembly
        - getsystem
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: How often has this user run cmd.exe across the environment historically?
  context: Compare this account's current action against its historical behavior. An account that has never driven interactive
    cmd.exe sessions resembling Beacon syntax is more suspicious than one whose role routinely involves shell work. User role
    and typical toolset should align with what fired.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and cmd.exe combination historically routine on this host or across the environment, or is the parent
    unusual for cmd.exe?
  context: When the alert fires under a service principal, the user identity does not attribute behavior, so the meaningful
    pivot is the launch mechanism — which parent process spawned cmd.exe, and whether that pair is historically common. A new
    or rare parent for cmd.exe on this host or environment-wide is the deviation worth chasing; a pair that already accounts
    for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints.
    If the same account drove similar shell activity elsewhere in the same window, the scope of the interactive session is
    larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and cmd.exe combination fire on other hosts in the same window — is this coordinated automation
    or isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since
    every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process
    plus spawned cmd.exe — fired on other hosts in the alert window. Multiple hosts in the same window points to pushed or scheduled
    activity; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to this event and
    what followed — reconnaissance, credential access, privilege escalation, or staging that an interactive Beacon session
    typically generates. Novel parent-child pairs at low counts are what stand out against the aggregated background noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential
    access — may reveal the attack stages that preceded the interactive shell activity and help reconstruct the full timeline
    of the operator's session.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:hacking_tool.tool_specific_artifacts
  question: Are characteristic Cobalt Strike artifacts present on this host?
  context: Cobalt Strike Beacon leaves characteristic artifacts even when the original process has exited — named pipes with
    default prefixes (msagent_, postex_, status_, MSSE-, *-server), injection into surrogate processes, and service binaries
    with random short names dropped to admin shares during lateral movement. Checking for these confirms live Beacon activity
    on the host beyond the single mistyped command and reveals the scope of the operator's session.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1059.003.time_correlation
  question: Did this shell activity occur outside the host's normal working or maintenance window?
  context: Interactive command-shell execution during off-hours, weekends, or outside known administrative maintenance windows
    is more consistent with hands-on operator activity than with routine administration. Compare the alert timestamp against
    the host's expected activity pattern and any scheduled maintenance windows; off-hours timing combined with a Beacon keyword
    raises the priority of the surrounding context questions.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - User
