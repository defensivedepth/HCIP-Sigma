  skipped_templates:
    - template: cue_process_tool.baseline
      reason: "host+binary cmd.exe baseline is dominated by routine shell usage and returns volume without precision; the rule-pattern-scoped baseline_deviation (Q9) supersedes it for this rule."
    - template: cue_process_tool.clustering
      reason: "host-scoped process clustering is covered by cue_host_context.clustering (Q15) with the same aggregation shape; avoids a near-identical query."
    - template: cue_artifact.mechanism_decode
      reason: "cue_artifact is a derived cue from the [A-Za-z]:\\ match, which here is only the cmd.exe path itself (c:\\windows\\system32\\cmd.exe) — there is no dropped payload file to read. Content analysis of cmd.exe is not meaningful."
    - template: cue_artifact.artifact_verification
      reason: "No dropped/created file artifact in this rule's detection; the derived path is cmd.exe itself. Hash/reputation of cmd.exe carries no investigative value here."
    - template: cue_artifact.baseline
      reason: "No file artifact to baseline; the derived path is the cmd.exe binary path, not a created file."
    - template: universal.evidence_preservation
      reason: "applicability has_file_reference fired off the c:\\ literal in the rule's CommandLine|startswith list, but that literal is the cmd.exe path, not a referenced payload file. The rule detects in-shell command tokens, not file drops, so there is no payload on disk to preserve. Operator-dropped artifacts are covered by tool_specific_artifacts (Q17)."
  reflection_overrides: []
  hint_dispositions:
    - hint: "cmd.exe: too common for Image-based scoping — use CommandLine patterns for mechanism_decode"
      disposition: acted-on
      reason: >-
        mechanism_decode (Q5) is scoped to the alerting event via ProcessGuid rather than host+Image,
        avoiding the noise of all cmd.exe executions on the host. The reflected baseline_deviation (Q9)
        and scope (Q10) queries enforce the full rule pattern (the Beacon CommandLine keywords) rather
        than bare Image|endswith on cmd.exe.
    - hint: "cue_artifact: derived: [A-Za-z]:\\ in CommandLine"
      disposition: declined
      reason: >-
        The [A-Za-z]:\\ match derives solely from the rule's own CommandLine|startswith literal
        'c:\\windows\\system32\\cmd.exe' — it is the cmd.exe path, not a dropped or referenced payload
        file. There is no file artifact to decode, verify, or baseline. cue_artifact templates were
        skipped (see skipped_templates); operator-dropped artifacts are instead covered by
        tool_specific_artifacts (Q17).
    - hint: "File paths derived from CommandLine — use %file_paths% placeholder"
      disposition: declined
      reason: >-
        Same root cause as the cue_artifact decline: the only path in the command line is the cmd.exe
        binary path from the rule's startswith list, not an operator-referenced file. No %file_paths%
        question is meaningful; evidence_preservation was skipped for the same reason.
    - hint: "logsource 'image_load' (recommended by techniques: T1059.003) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The rule detects Beacon command keywords typed into cmd.exe, an operator-error pattern fully
        evidenced in process_creation CommandLine. The T1059.003 image_load analytic targets .NET/script
        hosting DLLs loaded by an interpreter; that signal does not apply to a mistyped shell token that
        the OS shell never executes. The in-memory capability angle (execute-assembly, psinject) is
        instead surfaced behaviorally via tool_capability_used (Q6) and tool_specific_artifacts (Q17).
        No compensating attack:T1059.003.image_load question authored.
