name: Potentially Suspicious Child Process Of ClickOnce Application
id: 97c1ec7f-0579-4899-9568-d68f18f1de4c
description: |
  Detects a process whose parent runs from the ClickOnce deployment cache (a path
  under \AppData\Local\Apps\2.0\) spawning one of a set of living-off-the-land binaries
  (calc.exe, cmd.exe, cscript.exe, explorer.exe, mshta.exe, net.exe, net1.exe, nltest.exe,
  notepad.exe, powershell.exe, pwsh.exe, reg.exe, regsvr32.exe, rundll32.exe, schtasks.exe,
  werfault.exe, wscript.exe). ClickOnce is a .NET application deployment mechanism: the
  deployment service downloads dependencies into the cache directory and runs the host
  assembly, which inherits the reputation and signature of the deployed application. A
  signed ClickOnce host that spawns a command interpreter, script host, reconnaissance,
  registry, or scheduling binary is the behavior this rule flags, because it can indicate
  a backdoored dependency DLL or a wrapped arbitrary assembly executing under borrowed
  trust. Determine whether the deployment is a known internal or vendor application and
  whether the spawned child is consistent with that application's normal function.
type: detection
detection_id: 67bc0e75-c0a9-4cfc-8754-84a505b63c04
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the parent path and spawned child binary match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the triggering event. The
    rule fires when the parent image path contains \AppData\Local\Apps\2.0\ (the ClickOnce
    deployment cache) AND the child image ends in one of the watched binary names
    (command interpreters, script hosts, reconnaissance, registry, and scheduling tools).
    Note which child binary fired, because it determines which downstream questions
    carry investigative weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run ClickOnce-deployed applications that
    spawn this kind of child process?
  context: ClickOnce deployments are commonly used to distribute internal line-of-business
    .NET applications, so some users legitimately run them. Whether the user role and
    host function are consistent with launching a ClickOnce app that spawns a command
    interpreter or system tool is often the fastest way to separate routine use from abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: What is the ClickOnce application that spawned this child, and what started it?
  context: The parent-child relationship is the core signal. The parent runs from the
    ClickOnce cache and inherits the deployed application's identity. Tracing the parent's
    own origin shows whether it was launched through a normal deployment flow (a user
    opening a deployment link or a cached shortcut, typically via the deployment service
    dfsvc.exe) or through an unexpected chain. Identify the parent image name and whether
    it corresponds to a known internal or vendor application.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_parent_process.mechanism_decode
  question: Why did the ClickOnce application spawn this particular child, and is that
    behavior part of its normal function?
  context: A ClickOnce-deployed application that spawns a command interpreter, script host,
    or system tool may be doing so as a documented feature (an installer or helper invoking
    a utility) or may be running attacker code introduced through a backdoored dependency
    DLL or a wrapped arbitrary assembly. The parent's own command line and the spawned
    child together indicate whether the launch is functional or injected.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What did the spawned child process actually do? Decode its command-line
    arguments.
  context: The full command line of the child reveals the action taken under the deployed
    application's trust. Decode any flags, encoded content, file paths, or URLs. For a
    command interpreter or script host, identify the script or one-liner; for a registry
    or scheduling tool, identify the key or task being configured; for a reconnaissance
    binary, identify what is being enumerated. The query returns every execution of the
    same binary on this host within the window, so multi-step operations split across
    invocations are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.sibling_processes
  question: What other child processes did this same ClickOnce parent spawn?
  context: If the deployed application is running injected code, it likely spawned more
    than the one process that triggered the alert. Examining the other children of the
    exact parent instance reveals the full scope of activity initiated through this
    deployment - reconnaissance, persistence, and follow-on tooling launched in sequence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Has a ClickOnce-cache parent spawned this child binary on this host before?
  context: Some ClickOnce applications legitimately invoke helper utilities, producing
    a recurring parent-child pairing. A pairing that has never or rarely occurred on this
    host indicates a novel spawning relationship that warrants closer inspection, while a
    pairing with substantial history is more likely an application's normal behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|contains: '\AppData\Local\Apps\2.0\'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains: \AppData\Local\Apps\2.0\
        Image|endswith:
        - \calc.exe
        - \cmd.exe
        - \cscript.exe
        - \explorer.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \nltest.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \werfault.exe
        - \wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains: \AppData\Local\Apps\2.0\
        Image|endswith:
        - \calc.exe
        - \cmd.exe
        - \cscript.exe
        - \explorer.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \nltest.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \werfault.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether the same identity
    drove similar activity on multiple endpoints, which would widen the scope. This view
    of immediate cross-host activity is distinct from historical frequency.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains: \AppData\Local\Apps\2.0\
        Image|endswith:
        - \calc.exe
        - \cmd.exe
        - \cscript.exe
        - \explorer.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \nltest.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \werfault.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_parent_process.scope
  question: Is this ClickOnce-cache parent spawning this child binary on other hosts?
  context: The same deployment-cache parent spawning the same child across multiple hosts
    can indicate a distributed ClickOnce deployment - benign if it is a sanctioned
    application rollout, notable if it tracks a phishing wave delivering a deployment link
    to many users. Environment-wide comparison helps calibrate scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains: '\AppData\Local\Apps\2.0\'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: llm_generated
  question: Was a fresh ClickOnce deployment directory created on this host, and what
    binaries and dependency DLLs were written into it?
  context: The deployment service writes the application assembly and its dependency DLLs
    into a new random subdirectory under \AppData\Local\Apps\2.0\ before running them.
    A freshly created directory immediately preceding the alert, especially one
    containing recently written or unsigned dependency DLLs, indicates a just-installed
    or just-updated deployment - the window in which a backdoored dependency would be
    placed. Review the writer process and the file paths to identify the deployment.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_clickonce:
        TargetFilename|contains: '\AppData\Local\Apps\2.0\'
      condition: selection and selection_clickonce
    fields:
      - TargetFilename
      - Image
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: Several of the watched child binaries (net.exe, net1.exe, nltest.exe) are
    reconnaissance tools. A single discovery command may be routine, but multiple
    reconnaissance binaries running in rapid succession is a signature of post-compromise
    enumeration as an operator orients before the next stage. This surfaces discovery
    activity beyond the one binary that triggered the alert.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals
    what led to this event and what followed, and whether it is part of a larger sequence.
    Novel parent-child pairs stand out at low counts against the repetitive host telemetry
    this aggregation collapses.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, or
    credential access - may reveal the stages that preceded this event and help reconstruct
    the timeline. The order of alerts often tells the sequence of the activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
_generation_meta:
  has_attack_brief: false
  techniques: []
  attack_chain_coverage: []
