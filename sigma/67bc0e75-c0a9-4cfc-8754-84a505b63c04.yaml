  mutable_dispositions: []
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: "parent_process is primary cue (hint) and parent_child.parent_process_legitimacy is active — both subsume the parent-chain lookup; keeping process_chain would duplicate the ParentProcessGuid lookup already in parent_process_legitimacy and cue_parent_process.mechanism_decode"
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.follow_on
      reason: "parent_child.sibling_processes covers the same parent's other children with tighter ParentProcessGuid scoping; follow_on's parent-name+host scoping is the looser variant of the same question"
      kept: parent_child.sibling_processes
    - dropped: cue_parent_process.clustering
      reason: "cue_host_context.clustering covers around-the-alert host activity; the parent-name-scoped variant overlaps without adding a distinct angle for this multi-binary rule"
      kept: cue_host_context.clustering
    - dropped: cue_process_tool.baseline
      reason: "cue_parent_process.baseline and cue_user_actor.baseline_svc already cover historical frequency scoped to the ClickOnce launch mechanism, which is more specific than host+binary alone for this rule"
      kept: cue_parent_process.baseline
    - dropped: discovery_recon.discovery_user_context
      reason: "overlaps universal.host_user_context (kept); per template note, prefer one user-context question — host_user_context is adapted to the ClickOnce operation and the rule is not discovery-specific (discovery is one of several child categories)"
      kept: universal.host_user_context
  skipped_templates:
    - template: cue_process_tool.mechanism_decode (replaced_by scheduled_task.task_configuration)
      reason: "replaced_by points to scheduled_task.task_configuration, but schtasks.exe is only one of 17 possible child binaries; a schtasks-specific decode would not fit a powershell/net/regsvr32 fire. Kept the generic cue_process_tool.mechanism_decode child-command decode instead, framed conditionally on the binary that fired."
    - template: registry.registry_key_context
      reason: "registry technique set is confirmed because reg.exe is in the child list, but reg.exe is one of 17 children and the rule has no registry_set logsource. A registry_set/ProcessGuid question returns nothing unless reg.exe specifically fired; the generic child-command decode covers reg.exe CommandLine when it is the firing binary."
    - template: registry.registry_related_modifications
      reason: "same as registry_key_context — registry is binary-conditional, not core to this multi-binary parent-relationship rule; related registry writes would be surfaced by the around-the-alert host clustering question when reg.exe fired."
    - template: scheduled_task.task_configuration
      reason: "scheduled_task set confirmed via schtasks.exe (1 of 17 children); a /TN/TR/SC decode is meaningless when powershell, net, or regsvr32 fired. Generic child-command decode handles schtasks CommandLine on a schtasks fire."
    - template: scheduled_task.task_trigger_and_timing
      reason: "binary-conditional on schtasks.exe firing; not applicable to the other 16 child binaries and would add a svchost/Schedule query irrelevant to most fires."
    - template: scheduled_task.task_still_present
      reason: "binary-conditional on schtasks.exe firing; re-displays the alert with a schtasks framing that does not fit non-schtasks fires."
    - template: powershell.encoded_command_decode
      reason: "powershell set confirmed via powershell.exe/pwsh.exe (2 of 17 children); the generic child-command decode already directs the analyst to decode encoded content when powershell fired. A powershell-only encoded-command question reads as off-topic on a net/regsvr32/mshta fire."
    - template: powershell.script_block_logging
      reason: "binary-conditional on powershell/pwsh firing; a 4104 script-block query returns nothing for the 15 non-powershell children. The generic child-command decode covers the powershell case."
    - template: powershell.powershell_security_bypass
      reason: "binary-conditional on powershell/pwsh firing; the universal endpoint_protection_health question (kept) already surfaces AMSI/ETW and execution-policy tamper on the host across all child binaries."
    - template: persistence_scope.process_based_persistence
      reason: "the rule is not a persistence rule (applicability.is_persistence_rule false); persistence tooling that fired through the ClickOnce parent is already surfaced by sibling_processes and host clustering. A dedicated persistence-sweep slot is better spent on the ClickOnce deployment-directory file question, which is specific to this rule's abuse path."
    - template: persistence_scope.file_based_persistence
      reason: "Startup/Run-key drop sweep is generic persistence coverage not central to this parent-relationship rule; the ClickOnce deployment-directory file question (attack:T1574.002.dll_sideload_artifact) covers the file-side artifact that is actually specific to this abuse path."
  reflection_overrides: []
  hint_dispositions:
    - hint: "registry.registry_key_context replaces cue_process_tool.mechanism_decode"
