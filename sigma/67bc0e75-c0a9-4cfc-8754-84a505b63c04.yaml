      reason: >-
        The replaced_by chaining assumes reg.exe is the firing binary, but reg.exe is
        1 of 17 watched children. Substituting a registry_set/ProcessGuid decode for the
        generic child-command decode would return nothing when powershell, net, regsvr32,
        mshta, etc. fired. Kept cue_process_tool.mechanism_decode (the child-command
        decode) and framed it conditionally on the firing binary so it covers reg.exe's
        CommandLine along with the other 16.
    - hint: "scheduled_task.task_configuration replaces cue_process_tool.mechanism_decode"
      disposition: declined
      reason: >-
        Same binary-conditional reason as the registry hint: schtasks.exe is 1 of 17
        children. A /TN/TR/SC decode does not fit a powershell/net/regsvr32 fire. The
        generic child-command decode (kept) handles schtasks CommandLine when schtasks
        is the binary that fired.
    - hint: "powershell.encoded_command_decode replaces obfuscation.encoded_payload_decode"
