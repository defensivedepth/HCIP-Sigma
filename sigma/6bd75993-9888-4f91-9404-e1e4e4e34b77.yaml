      disposition: declined
      reason: >-
        Acted-on, not declined in substance - recorded here only to close the audit loop.
        The derived file-artifact cue drove the artifact mechanism_decode, artifact
        verification, and evidence_preservation questions; the file path derived from the
        command line is queried via the %file_paths% placeholder in evidence_preservation.
    - hint: "File paths derived from CommandLine — use %file_paths% placeholder"
      disposition: declined
      reason: >-
        Acted-on, not declined in substance. The evidence_preservation question's
        file_event query uses TargetFilename|endswith|expand '%file_paths%' to locate the
        file written from the LocalPotato -o argument; no separate declined action needed.
