name: Invoke-Obfuscation STDIN+ Launcher
id: a229b74f-f4e0-43f6-aacb-8d2ae6e45fea
description: |
  Detects a cmd.exe launcher that pipes an obfuscated PowerShell one-liner through standard input,
  a pattern produced by the Invoke-Obfuscation framework's STDIN+ launcher transform. The rule fires
  on a single command-line regex: a cmd /c or /r invocation that calls powershell and references the
  $input automatic variable (or -noexit) followed by a quote. Legitimate batch wrappers rarely feed
  PowerShell through $input in this pattern, so the alert usually means an obfuscated or staged payload;
  the investigation should decode the launched PowerShell, confirm what it executed, and establish
  whether the user, host, and parent process are expected to run this kind of command.
type: detection
detection_id: 6c96fc76-0eb1-11eb-adc1-0242ac120002
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the cmd-to-PowerShell STDIN launcher pattern this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when
    a cmd /c or /r invocation calls powershell and references the $input automatic variable (or -noexit)
    followed by a quote. Verify those elements are present in the triggering command before investing
    further analysis time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to launch PowerShell through cmd.exe with piped input?
  context: Legitimate administrative scripting rarely wraps PowerShell inside cmd and feeds it through
    standard input. Knowing whether the user role and host function involve developer tooling, build
    automation, or admin scripting is often the fastest way to separate a routine wrapper from staged
    payload execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this launcher execution part of an authorized penetration test or red team engagement?
  context: The STDIN+ launcher pattern is generated by an offensive PowerShell-obfuscation framework used
    in authorized security assessments. Before deeper analysis, check whether a pentest or red team
    exercise is active on this host or network segment. Matching tooling and timing within a scoped
    engagement can resolve the alert without further work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: What does the launched PowerShell command actually do once the cmd wrapper is stripped?
  context: The obfuscation framework that produces this launcher emits many transforms, but they all
    front a real PowerShell payload. Read past the cmd /c or /r wrapper and the $input plumbing to
    identify the operational PowerShell command, which determines the scope of potential compromise
    and the required response.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: Reconstruct the obfuscated PowerShell from this command line. What does it decode to?
  context: This launcher feeds PowerShell through $input precisely so the real payload is hidden from
    casual inspection. The framework's transforms use backtick escaping, string concatenation, type-cast
    splatting, and ASCII-int or base64 encoding to disguise an Invoke-Expression call. Reconstruct the
    string the pipeline rebuilds and identify the resulting operation -- a download cradle, reverse
    shell, or in-memory .NET load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1027.obfuscation_check
  question: Which obfuscation transforms are present in the command, and how heavily layered are they?
  context: Obfuscation depth is itself a signal. A single backtick-escaped token reads differently from
    a multi-layer ASCII-int array fed through -join and -split before Invoke-Expression. Identify the
    transform families present -- token backticks, splatting and concatenation, type-cast reordering,
    or encoded arrays -- to gauge how deliberately the payload was hidden and to anchor any pattern
    matching against related events.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script PowerShell actually
    executed, even when the launching command line is obfuscated through cmd and $input. This is the
    ground-truth view of what ran. If PowerShell operational logs are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:cue_process_tool.process_chain
  question: What process spawned this cmd launcher, and is that parent chain expected?
  context: The parent process reveals how the launcher was invoked. A user-driven launch from explorer.exe
    or a console reads differently from a launch under Office applications, mshta.exe, wscript.exe, or a
    document handler, which point to macro or staged delivery. Walk up the chain to establish whether the
    parent is a routine scripting context.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Operators frequently disable or bypass PowerShell protections before running an obfuscated
    payload. Common precursors include AMSI bypass (patching amsi.dll in memory), execution-policy
    changes (-ExecutionPolicy Bypass or -ep bypass), and PowerShell version 2 downgrade attacks that
    evade script block logging. Finding these in the hour before the launcher strengthens the malicious
    reading.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: attack:T1059.001.follow_on
  question: What did the launched PowerShell spawn or connect to afterward on this host?
  context: An obfuscated launcher's real impact shows in what follows it. PowerShell that drops or runs
    cmd.exe, certutil.exe, rundll32.exe, or a fresh powershell.exe, or that reaches out over the network,
    indicates post-exploitation rather than a self-contained script. Scope to processes that follow the
    alert on this host to reconstruct the next stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\powershell.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.evidence_preservation
  question: Did the launched PowerShell write any file to disk that is still available for analysis?
  context: If the decoded PowerShell dropped a payload, decoded output, or staged script, checking
    whether the file still exists enables hash lookups, sandbox submission, or content review. File
    paths referenced by the command line are the place to start.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this launcher pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's command-line regex scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern has historically run here,
    not generic PowerShell usage. A new parent process, an unexpected user account, or a one-off
    appearance against an otherwise empty history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: cmd.{0,5}(?:/c|/r).+powershell.+(?:\$\{?input\}?|noexit).+\"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: cmd.{0,5}(?:/c|/r).+powershell.+(?:\$\{?input\}?|noexit).+\"
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: cmd.{0,5}(?:/c|/r).+powershell.+(?:\$\{?input\}?|noexit).+\"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of this alert?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or
    parallel activity on multiple endpoints. If the same user triggered related execution elsewhere, the
    scope of the operation may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: cmd.{0,5}(?:/c|/r).+powershell.+(?:\$\{?input\}?|noexit).+\"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, or credential access -- may reveal the stages that preceded this launcher and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this launcher pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's command-line regex with no host scope, giving a fleet-wide count
    of this specific firing pattern rather than generic PowerShell usage. Many hosts firing the same
    pattern points to scripted deployment or vendor automation; one host or a small unrelated set points
    to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: cmd.{0,5}(?:/c|/r).+powershell.+(?:\$\{?input\}?|noexit).+\"
      condition: selection
    fields:
    - host.name
