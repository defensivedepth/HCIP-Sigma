name: Potentially Suspicious JWT Token Search Via CLI
id: 5b4d8739-3631-4080-b692-17a1750a2510
description: |
  Detects command-line searches for JSON Web Token (JWT) strings, identified when a search utility (find, find.exe,
  findstr, select-string, strings) runs AND its command line contains a JWT prefix such as eyJ0eX or eyJhbG. Both
  conditions must be present for the rule to fire. JWTs are bearer access tokens for cloud and SaaS platforms; an
  operator who can dump a process or read a token file often greps for these prefixes to harvest live tokens for
  reuse from another device. Legitimate triggers include developers or support staff inspecting their own tokens and
  scripted token-validation tooling. The investigation should confirm what the command actually searched, where the
  token material came from, who ran it, and whether stolen tokens were subsequently used.
type: detection
detection_id: 6d3a3952-6530-44a3-8554-cf17c116c615
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line both run a search utility and contain a JWT prefix?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when a search
    tool (find, find.exe, findstr, select-string, strings) is invoked AND the command line contains a JWT prefix
    (eyJ0eXAiOi, eyJhbGciOi, eyJ0eX, or eyJhbG). Verify both elements are present and read the full argument string to
    see what file or stream was searched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to search for JWT or access-token strings on the command line?
  context: Legitimate inspection of one's own access tokens by developers, support staff, or automation can trigger this
    pattern. Knowing whether the user's role and the host's function involve cloud-token handling is often the fastest
    way to separate routine work from token harvesting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: What token material did this command search, and where did it come from?
  context: Decode the full command line to identify the search target. JWT prefixes are commonly grepped out of process
    memory dumps of authenticated desktop applications, token cache files, or saved credential files. Identify whether
    the search ran against a memory dump, a file path, piped output, or a directory, since the source determines which
    accounts and which token audiences may be exposed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.evidence_preservation
  question: Are any files referenced by the command (memory dumps, token caches, output files) still on disk?
  context: The search frequently targets a file the operator created or read — a process memory dump, a token cache, or
    an output file capturing matched tokens. If such a file still exists on disk, it enables hash lookup, content review,
    and a determination of which tokens were exposed. File paths are derived from the alerting command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Credential and token harvesting is often preceded by weakening endpoint protection. The query surfaces direct
    attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero
    rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not
    appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.process_chain
  question: What process spawned this search command, and is that parent chain expected?
  context: The parent process reveals how the search was invoked. Interactive use typically descends from a shell or
    terminal launched by explorer.exe. Parents such as Office applications, script hosts (wscript.exe, mshta.exe), or a
    remote-execution service suggest the search was driven by a payload or hands-on-keyboard operator rather than the
    console user.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this JWT-search pattern, what parents and users normally drive it, and
    does the current alert fit that pattern?
  context: Even routine token validation can match this rule. The query mirrors the rule's full selection — a search
    tool combined with a JWT prefix — scoped to this host, so the resulting parent and user distribution reflects how
    this specific pattern has historically run here. A new parent process, an unexpected user account, or an unusual
    command shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
        CommandLine|contains:
        - 'find '
        - find.exe
        - findstr
        - 'select-string '
        - strings
      selection_jwt_string:
        CommandLine|contains:
        - eyJ0eXAiOi
        - eyJhbGciOi
        - ' eyJ0eX'
        - ' "eyJ0eX"'
        - ' ''eyJ0eX'''
        - ' eyJhbG'
        - ' "eyJhbG"'
        - ' ''eyJhbG'''
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did the search command spawn afterward?
  context: A token search that is part of a larger operation may launch follow-on processes — a tool to decode or replay
    the harvested token, an archiver to stage it, or a network client to send it outbound. The children of the alerting
    process show whether the search led directly to exfiltration or token reuse.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this JWT-search pattern in the past week, and does the cross-host distribution look
    like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    this firing pattern rather than generic search-tool usage. Many hosts running the same pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
        CommandLine|contains:
        - 'find '
        - find.exe
        - findstr
        - 'select-string '
        - strings
      selection_jwt_string:
        CommandLine|contains:
        - eyJ0eXAiOi
        - eyJhbGciOi
        - ' eyJ0eX'
        - ' "eyJ0eX"'
        - ' ''eyJ0eX'''
        - ' eyJhbG'
        - ' "eyJhbG"'
        - ' ''eyJhbG'''
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user searched for JWT or access-token strings on the command line before?
  context: Compare this user's current action against their history. A user who has never run a JWT-string search is more
    suspicious than one who does so as part of a known role. The query scopes to this user running the same search-plus-JWT
    pattern across all hosts, so a zero or very low count indicates first-time or rare activity for them.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_user:
        User|expand: '%User%'
      selection_tools:
        CommandLine|contains:
        - 'find '
        - find.exe
        - findstr
        - 'select-string '
        - strings
      selection_jwt_string:
        CommandLine|contains:
        - eyJ0eXAiOi
        - eyJhbGciOi
        - ' eyJ0eX'
        - ' "eyJ0eX"'
        - ' ''eyJ0eX'''
        - ' eyJhbG'
        - ' "eyJhbG"'
        - ' ''eyJhbG'''
      condition: selection_user and selection_tools and selection_jwt_string
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent process and search binary that fired here historically routine on this host, or is the launch
    mechanism unusual?
  context: When the alert fires under a service principal, the user identity does not attribute behavior, so the
    meaningful pivot is the launch mechanism — which parent process spawned which search binary, and whether that pair
    is historically common here. A new or rare parent for this binary is the deviation worth chasing; a pair that
    already accounts for many prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether the token search was isolated or part of a
    broader sequence — credential access on one host followed by reuse on another. If the same user triggered related
    activity on multiple endpoints, the scope of exposure may be larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent process and search binary fire on other hosts in the same window, indicating a coordinated
    rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did returns agent-telemetry noise because every host runs
    service-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus
    spawned binary — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context — what led
    to the search, what happened after, and whether it is part of a larger sequence. Look for process-dumping utilities,
    reconnaissance, or staging that surrounds the token search.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, process memory dumping, or reconnaissance — may reveal
    the attack stages that preceded the token search and help reconstruct the timeline that led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Token and credential theft is typically followed by reuse — a stolen access token is replayed against cloud or
    SaaS endpoints, or stolen credentials are used to reach other systems. Follow-on alerts on this host shortly after the
    search may indicate active exploitation of the harvested material.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts and token audiences may be exposed, and do any carry elevated privileges?
  context: The severity depends on what the harvested tokens grant. A JWT carries an audience and scope that determine
    which resources it can reach; a token for a high-privilege identity or a broadly scoped application requires
    escalation, while a low-privilege user token may only need monitoring. Cross-reference the running user and any
    decoded token claims with directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1552.001.security_authentication
  question: Were new authentication or logon events recorded on this host shortly after the search?
  context: If the harvested token or credential was used locally, it can surface as a new logon in Windows Security
    authentication events. Correlating logon activity on this host immediately after the search helps confirm whether the
    captured material was actually exercised on the endpoint, distinguishing reconnaissance from active reuse. If Security
    authentication events are not collected in this environment, treat zero results as a visibility gap rather than
    evidence nothing happened.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - LogonType
      - IpAddress
