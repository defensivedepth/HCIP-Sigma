      reason: "Recommended, not must_include. This rule fires on a discovery/delay utility, not on payload execution or credential access where tamper-as-precursor is the live question. The cue_host_context.precursor question already surfaces prior tamper alerts on the host, and the host is not the locus of a hands-on payload action that an operator would precede by disabling AV/EDR. Dropped to keep the discovery-specific chain within the 18-question cap."
  reflection_overrides: []
