      disposition: declined
      reason: >-
        The rule fires on w32tm used as an in-process delay loop, not on a
        file-dropping artifact; w32tm /stripchart writes no payload to disk.
        T1124 file_event coverage exists for techniques that drop a timing
        script or marker file, which this rule's detection logic does not
        implicate. The follow-on scheduling question (Q5) and the
        scheduled-task registration question (Q6) carry the load-bearing
        follow-on coverage for this delay-as-timer rule. No compensating
        attack:T1124.file_event question authored.
    - hint: "logsource 'image_load' (recommended by techniques: T1124) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        image_load on w32tm.exe (or w32time.dll) returns module-load volume
        without precision for the stripchart-loop behavior this rule detects;
        the rule already constrains Image and the full CommandLine argument
        set, so the triggering event is fully characterized at
        process_creation. The OriginalFileName w32time.dll branch is already
        verified in Q1's projection. No compensating attack:T1124.image_load
        question authored.
    - hint: "logsource 'process_access' (recommended by techniques: T1124) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        process_access covers cross-process time-API handle access (e.g.
        QueryPerformanceCounter/GetTickCount probing via a remote handle),
        which is a different T1124 sub-pattern than the self-contained w32tm
        stripchart delay this rule fires on. The rule's binary runs its own
        timing loop with no inter-process access component, so a
        process_access question would not align with the detection. No
        compensating question authored.
    - hint: "logsource 'taskscheduler' (recommended by techniques: T1124) is not covered and no template family exists — author a custom question with `category: taskscheduler`"
