name: Use of W32tm as Timer
id: 12802fcd-2a18-444a-bc36-d61f7f2bf504
description: |
  Detects w32tm.exe (or a renamed binary with OriginalFileName w32time.dll) invoked with the
  /stripchart, /computer:, /period:, /dataonly, and /samples: arguments all present. While w32tm
  is a legitimate Windows time service utility, this specific argument combination produces a
  fixed-duration measurement loop that can be used as a delay or sleep mechanism rather than for
  genuine time synchronization. The rule fires only when both the binary/OriginalFileName check
  AND the full stripchart argument set match. Investigation should confirm the exact command line,
  identify what process launched it, and determine whether the surrounding activity points to a
  benign timing task or to a process using the loop to pace or gate follow-on execution.
type: detection
detection_id: 6da2c9f5-7c53-401b-aacb-92c040ce1215
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects, with w32tm running /stripchart together with /computer:, /period:, /dataonly, and /samples:?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when the binary resolves to w32tm.exe or carries OriginalFileName w32time.dll AND the command line contains all five stripchart arguments. Confirm every argument is present and note the period and samples values, since their product sets the loop duration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run w32tm with stripchart timing arguments?
  context: Legitimate time-service troubleshooting can use w32tm, but the full stripchart measurement loop is uncommon in routine operations. Knowing whether the user role and host function include time-synchronization diagnostics is often the fastest path to distinguishing a true positive from an administrator measuring clock offset.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: 'What were the exact /period: and /samples: values, and what loop duration do they produce?'
  context: 'The stripchart loop runs one iteration per sample, spaced by the period in seconds, so the sample count times the period approximates the wall-clock delay the command imposes. Decode the full argument set to determine how long the process pauses and whether the /computer: target is localhost (self-timing) or a remote host. A round delay value reached through this loop suggests the command is being used to pace execution rather than to measure a real time source.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '/stripchart'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this w32tm invocation and is that parent chain expected?
  context: The parent process reveals how the timer was invoked. Interactive troubleshooting typically shows explorer.exe or a console shell as the lineage, while a scripting host, an Office application, or an unfamiliar binary in the parent chain points to automated execution that is gating its own activity behind the delay loop.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1124.follow_on_scheduling
  question: Did scheduled-task creation or other timing or conditional-execution commands run on this host shortly after the timer fired?
  context: Time discovery and delay loops are often a prelude to scheduling or conditional execution. A w32tm stripchart delay followed closely by schtasks or at.exe task registration, or by additional sleep loops, suggests the actor is pacing or gating later stages. This query surfaces scheduling and timing binaries on the host in the window after the alert.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_timing:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\timeout.exe'
          - '\ping.exe'
          - '\w32tm.exe'
      condition: selection and selection_timing
    fields:
      - Image
      - CommandLine
      - User
- source: attack:T1124.scheduled_task_registration
  question: Were any scheduled tasks registered on this host in the window after the timer ran?
  context: A delay loop that immediately precedes task registration points to an actor establishing timed or conditional execution rather than performing one-off time troubleshooting. Task-scheduler operational events record task creation independently of the process_creation view and confirm whether a persistent timing trigger was installed.
  range: +30m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: taskscheduler
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TaskName
      - EventID
- source: template:cue_process_tool.follow_on
  question: What child processes did this w32tm invocation spawn afterward?
  context: w32tm itself does not normally launch other processes. Any child of this invocation -- a command interpreter, a script host, or a downloaded binary -- would indicate the timer is embedded in a larger automation sequence rather than running as a standalone diagnostic.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single timing command may be benign, but several discovery commands in rapid succession -- whoami, ipconfig, net user, systeminfo -- is a signature of post-compromise enumeration. An actor pacing execution with a delay loop while also profiling the host points to hands-on activity rather than a maintenance task.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned the timing command, and is this a normal pattern for this host?
  context: Legitimate timing or discovery commands are typically run from a console spawned by explorer.exe or from a known automation script. The same command spawned by an Office application, a script interpreter, wmiprvse.exe, or wsmprovhost.exe indicates automated or remotely driven execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run system time-service diagnostics?
  context: Network administrators and IT staff legitimately run time-synchronization diagnostics during clock-skew troubleshooting. Standard users rarely run w32tm stripchart loops. The user's role and typical behavior baseline determine whether this timing activity is routine or anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline
  question: Does this host normally run w32tm?
  context: A binary that has rarely or never run on a host is more suspicious than one that runs regularly. Low historical counts for w32tm indicate first-time or unusual execution and weigh against routine time-service maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even legitimate utilities can be abused. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how the stripchart timing pattern -- not generic w32tm usage -- has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_w32tm:
      - Image|endswith: \w32tm.exe
      - OriginalFileName: w32time.dll
      selection_cmd:
        CommandLine|contains|all:
        - /stripchart
        - '/computer:'
        - '/period:'
        - /dataonly
        - '/samples:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_w32tm:
      - Image|endswith: \w32tm.exe
      - OriginalFileName: w32time.dll
      selection_cmd:
        CommandLine|contains|all:
        - /stripchart
        - '/computer:'
        - '/period:'
        - /dataonly
        - '/samples:'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_w32tm:
      - Image|endswith: \w32tm.exe
      - OriginalFileName: w32time.dll
      selection_cmd:
        CommandLine|contains|all:
        - /stripchart
        - '/computer:'
        - '/period:'
        - /dataonly
        - '/samples:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar timing or discovery activity on several hosts, the scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_w32tm:
      - Image|endswith: \w32tm.exe
      - OriginalFileName: w32time.dll
      selection_cmd:
        CommandLine|contains|all:
        - /stripchart
        - '/computer:'
        - '/period:'
        - /dataonly
        - '/samples:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the stages that preceded this timing activity and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
