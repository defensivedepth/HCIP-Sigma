      reason: "host-clustering coverage is the same +/-15m host-scoped process_creation aggregation as cue_host_context.clustering; rather than emit two near-identical clustering views, the slot was given to higher-value exfil-specific questions (repository_destination, outbound_volume)"
      kept: cue_host_context.precursor
  skipped_templates:
    - template: data_staging_exfil.data_scope
      reason: "data_scope is KEEP_EXACT (file_event / TargetFilename). This rule is CommandLine-only with no Image in the detection and restic's backup paths live in the command line, not in file_event write records (restic reads source data via a volume snapshot rather than writing local archive files). The 'what was selected for backup' question was reauthored as llm_generated (Q7) reading the backup paths from the alert event's CommandLine, which is where the data scope actually appears for this rule."
    - template: cue_process_tool.scope
      reason: "REFLECTED fleet_pattern cross-host view of the rule's firing; dropped to keep the playbook at 18 questions. The user-actor clustering_svc question already supplies a cross-host 'same parent+binary in window' fleet pivot, and outbound_volume/repository_destination carry the higher-value exfil-specific scope. The fleet-pattern count is the lowest-marginal-value template given the cap."
    - template: cue_process_tool.follow_on
      reason: "restic's exfil impact is the outbound network transfer (covered by connection_destination and outbound_volume), not child-process spawning; a follow-on child-process question adds little for a backup-and-stream tool that does not proxy execution through children."
    - template: cue_host_context.clustering
      reason: "near-identical +/-15m host-scoped process_creation aggregation to the dropped cue_process_tool.clustering; the surrounding-host-activity intent is carried by cue_host_context.precursor (sigma-alert timeline) and the baseline_deviation parent/user view. Dropped to stay at the 18-question cap."
    - template: data_staging_exfil.archive_destination
      reason: "restic streams snapshot data directly to the remote repository rather than writing a local archive file that is later moved, so the file_event 'where was the archive moved' framing does not fit. The destination is the repository backend, covered by repository_destination (the configured target) and connection_destination (the actual outbound channel)."
    - template: universal.endpoint_protection_health
      reason: "RECOMMENDED, not must_include. This is an exfiltration rule, not an execution or credential-access rule whose disposition turns on whether protection was weakened first; tamper-as-precursor is not the live question here. Prior host-stage context is carried by cue_host_context.precursor, which surfaces any defense-tampering alerts that fired before this event. Dropped to stay at the 18-question cap."
  reflection_overrides: []
  hint_dispositions:
    - hint: "CommandLine-only detection — no Image field in rule. Use CommandLine pattern matching for scoping, not Image-based queries"
