      reason: >-
        Host and user baseline/decode queries (mechanism_decode Q5, host baseline Q12,
        user baseline Q14) scope by CommandLine|contains: restic instead of
        Image|endswith: '%Image%'. The repository_destination question (Q9) scopes
        by the rule's remote-backend CommandLine tokens. The user-actor service
        substitute pair (Q15/Q17) and the network questions (Q10/Q11) retain
        Image|endswith: '%Image%' because there the placeholder hydrates from the
        alert event's restic.exe Image (which IS present on the process_creation /
        network_connection event even though it is absent from the rule's detection)
