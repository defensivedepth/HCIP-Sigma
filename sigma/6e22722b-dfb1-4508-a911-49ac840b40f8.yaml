name: Suspicious Mstsc.EXE Execution With Local RDP File
id: c88122db-8502-4486-a912-3d6b903c6a93
description: |
  Detects mstsc.exe launched with a local ".rdp" connection file whose path sits in a user-writable
  or staging location (Downloads, %TEMP%, AppData\Local\Temp, Users\Public, and several Windows
  service-writable directories). A weaponized .rdp file delivered by phishing or web drive-by causes
  mstsc.exe to connect to an attacker-controlled RDP endpoint, where device redirection can expose the
  victim's drives, clipboard, printers, and smartcards over \\tsclient paths and the relay can push
  payloads back onto the local host. Legitimate RDP connections almost always use saved profiles from a
  user's Documents or a managed share, not interpreter- or browser-dropped files in temp paths, so the
  investigation should establish how the .rdp file arrived, which parent launched mstsc.exe, where the
  outbound connection went, and whether mstsc.exe wrote executable artifacts afterward.
type: detection
detection_id: 6e22722b-dfb1-4508-a911-49ac840b40f8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show mstsc.exe launched with a local .rdp file in a user-writable or staging path?
  context: Confirm the alert is a true positive before investing time. The rule fires only when all three
    conditions hold together - the image is mstsc.exe (or its original filename), the command line ends in
    .rdp, and the .rdp path contains one of the staging directories (Users\Public, Windows service-writable
    paths, AppData\Local\Temp, or Downloads). Read the full command line and confirm all three are present
    rather than a saved profile opened from a user's Documents or a managed share.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to open .rdp connection files with mstsc.exe?
  context: Legitimate RDP use is common for administrators and some users, but opening a .rdp file dropped
    into a temp or download location is unusual outside of help-desk-supplied profiles. Knowing whether this
    user routinely connects to remote desktops, and whether this host is an admin workstation or jump box,
    is often the fastest way to separate routine activity from a delivered attachment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What .rdp file did mstsc.exe open, and what does its path and any inline connection options reveal?
  context: The full command line names the .rdp file and the directory it was opened from. Decode the path -
    a file under Downloads, AppData\Local\Temp, or Users\Public points to a delivered or staged file rather
    than a managed profile. Weaponized .rdp files set device-redirection options (drivestoredirect, redirectclipboard,
    redirectprinters, full address pointing at an external host) that push victim peripherals to the remote
    session; if the command line or the referenced file exposes these, the connection is configured to bridge
    local resources to the remote endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned mstsc.exe, and is that parent consistent with a user opening a saved profile?
  context: The parent process reveals how mstsc.exe was invoked. A user double-clicking a saved profile in
    explorer.exe is routine. A browser (chrome.exe, msedge.exe, firefox.exe), an email or chat client
    (outlook.exe, thunderbird.exe, teams.exe), or explorer.exe opening a file carrying an internet-zone
    mark-of-the-web indicates the .rdp arrived as an attachment or download and was opened directly from the
    delivery application - the delivery signature of this technique.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:remote_access_tool.tool_authorization
  question: Is connecting to this remote desktop destination an approved, expected operation for this host?
  context: Organizations typically sanction RDP only to specific internal jump hosts or managed servers.
    A connection driven by a .rdp file from a staging path - especially one pointing at an external or
    unfamiliar address - may represent a delivered attack rather than sanctioned remote support. Check the
    target named in the .rdp file or command line against the set of destinations this host is expected to reach.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a helpdesk ticket, maintenance window, or user request explaining this RDP connection?
  context: Legitimate remote desktop sessions usually correlate with an open support ticket, a scheduled
    change, or a documented administrative procedure. If no support context exists for a session launched from
    a .rdp file in a temp or download path, the file may have been delivered to the user rather than provided
    by IT.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint and port did mstsc.exe connect to after the .rdp file was opened?
  context: The outbound connection reveals where this RDP session went. A connection to an internal managed
    server on 3389 is routine; a connection to an external or non-RFC1918 address, or to a non-standard high
    port (operators commonly move the listener off 3389 - for example to ports such as 21390, 7070, or 5650 -
    to evade scanning and outbound 3389 blocks), is consistent with a rogue-RDP relay or attacker-controlled
    server. If endpoint network telemetry is not collected, the destination may instead be readable from the
    full address option inside the .rdp file or command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1219.002.file_event
  question: Did mstsc.exe write executable or script artifacts to disk after opening the .rdp file?
  context: A legitimate mstsc.exe session almost never writes executable content to the local filesystem.
    In the rogue-RDP payload-delivery pattern, the remote relay pushes files - .lnk, .exe, .dll (for sideloading),
    .config, .ps1, .vbs, or .bat - onto the connecting host, often into startup or AppData locations for
    persistence. File writes by mstsc.exe of these types are a strong indication the session was used to stage
    follow-on tooling rather than for interactive remote work.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \mstsc.exe
      filter_ext:
        TargetFilename|endswith:
          - .lnk
          - .exe
          - .dll
          - .config
          - .ps1
          - .vbs
          - .bat
      condition: selection and filter_ext
    fields:
      - TargetFilename
      - User
- source: template:cue_process_tool.follow_on
  question: What child processes did mstsc.exe spawn afterward?
  context: mstsc.exe normally does not spawn child processes. Interactive control via a rogue-RDP session, or
    execution of a pushed payload, can surface as unexpected children such as cmd.exe, powershell.exe, wscript.exe,
    or rundll32.exe parented to mstsc.exe. Any such child is post-access activity worth tracing to its full
    command line and downstream effect.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:lateral_movement.lateral_movement_scope
  question: Has this user account opened RDP or other remote-access tools to other hosts recently?
  context: A delivered .rdp file may be one of several remote-access attempts tied to the same account. If the
    user has driven mstsc.exe or related remote-access binaries against multiple hosts in a short window, the
    activity may be broader than a single connection. Aggregating remote-access tool use by this user across
    hosts shows whether the connection is isolated or part of a wider pattern.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\mstsc.exe'
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mstsc.exe
      - OriginalFileName: mstsc.exe
      selection_extension:
        CommandLine|endswith:
        - .rdp
        - .rdp"
      selection_paths:
        CommandLine|contains:
        - :\Users\Public\
        - :\Windows\System32\spool\drivers\color
        - ':\Windows\System32\Tasks_Migrated '
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - :\Windows\Tracing\
        - \AppData\Local\Temp\
        - \Downloads\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mstsc.exe
      - OriginalFileName: mstsc.exe
      selection_extension:
        CommandLine|endswith:
        - .rdp
        - .rdp"
      selection_paths:
        CommandLine|contains:
        - :\Users\Public\
        - :\Windows\System32\spool\drivers\color
        - ':\Windows\System32\Tasks_Migrated '
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - :\Windows\Tracing\
        - \AppData\Local\Temp\
        - \Downloads\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline
  question: Does this host normally run mstsc.exe?
  context: A host that has never run mstsc.exe, or runs it rarely, is more notable than one where remote-desktop
    use is routine. Zero or very low historical counts indicate first-time or rare execution and raise the
    weight of a connection driven by a staged .rdp file.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users drove it, and does this alert fit?
  context: Even routine tools can be abused. This query mirrors the rule's full selection - mstsc.exe with a
    .rdp command line in a staging path - scoped to this host, so the resulting parent and user distribution
    reflects how the rule's specific firing pattern has historically run here rather than generic mstsc.exe use.
    A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mstsc.exe
      - OriginalFileName: mstsc.exe
      selection_extension:
        CommandLine|endswith:
        - .rdp
        - .rdp"
      selection_paths:
        CommandLine|contains:
        - :\Users\Public\
        - :\Windows\System32\spool\drivers\color
        - ':\Windows\System32\Tasks_Migrated '
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - :\Windows\Tracing\
        - \AppData\Local\Temp\
        - \Downloads\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This query mirrors the rule's full selection with no host scope, giving a fleet-wide count of the
    rule's firing pattern rather than generic mstsc.exe use. Many hosts firing the same pattern can point to a
    deployment or managed process that places .rdp files in staging paths; one host or a small unrelated set
    points to targeted or manual activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mstsc.exe
      - OriginalFileName: mstsc.exe
      selection_extension:
        CommandLine|endswith:
        - .rdp
        - .rdp"
      selection_paths:
        CommandLine|contains:
        - :\Users\Public\
        - :\Windows\System32\spool\drivers\color
        - ':\Windows\System32\Tasks_Migrated '
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - :\Windows\Tracing\
        - \AppData\Local\Temp\
        - \Downloads\
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining what ran on the host just before and after the connection
    reveals how the .rdp file arrived (a browser or mail client writing to Downloads), what the user did next,
    and whether reconnaissance, payload execution, or persistence followed. Aggregating by process and parent
    collapses repetitive agent noise while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or prior delivery attempts -
    may reveal the stages that preceded this connection and help reconstruct the timeline. The sequence of
    alerts on a host often tells the story of how an attack reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
