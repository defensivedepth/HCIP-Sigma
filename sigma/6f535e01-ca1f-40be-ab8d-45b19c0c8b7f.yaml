name: Import LDAP Data Interchange Format File Via Ldifde.EXE
id: 95225e6f-cf13-4107-946d-47668b1aee25
description: |
  Detects ldifde.exe running in import mode, where the command line includes both the -i (import) flag and -f (file) flag. Ldifde.exe is a Microsoft-signed Active Directory utility that ships on systems with the AD DS or AD LDS role; in import mode it applies an LDIF file to the directory, and because LDIF files can carry HTTP-based attribute values, ldifde can be coerced into fetching arbitrary content from a remote server, acting as a signed proxy downloader. Legitimate use is bulk AD provisioning by domain administrators on a domain controller or admin workstation; malicious use plants accounts, modifies ACLs or GPOs, reanimates tombstoned objects, or retrieves a remote payload through a trusted binary. Investigation should confirm the import file path, decode the LDIF source, determine whether the executing host and user are expected to run directory-import tooling, and check for any network retrieval or file drop that followed.
type: detection
detection_id: 6f535e01-ca1f-40be-ab8d-45b19c0c8b7f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show ldifde.exe running in import mode with both the -i and -f flags?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process is ldifde.exe (by Image name or OriginalFileName) AND the command line contains both -i (import) and -f (file). Review the full command line and confirm both conditions hold, and note the file path supplied after -f.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to import LDAP directory data with ldifde.exe?
  context: Legitimate ldifde import is performed by domain administrators on a domain controller or an AD admin workstation during provisioning or bulk directory changes. A standard workstation, a server with no AD role, or a non-admin user running directory-import tooling is a stronger candidate for abuse of the signed binary. Check whether the host function and user role align with directory administration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did this ldifde import actually do? Decode the import file path and flags from the command line.
  context: The full command line reveals the operation. Identify the LDIF file path after -f and note whether it lives under a user-writable path such as a temp, profile, or public directory. Look for flags that change behavior — -k (ignore errors), -x (tombstone reanimation, a persistence primitive), -q (multi-threaded import), -c with a macro-expansion token, or credential flags -a/-b. The LDIF file itself, not the command line, holds the changetype (add, modify, delete) and any HTTP-based attribute value used to pull remote content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned ldifde.exe and is that parent chain expected?
  context: The parent process reveals how the import was invoked. Administrative use typically traces to an interactive shell launched by explorer.exe or a known management or deployment process. Parents such as wscript.exe, mshta.exe, an Office application, or a browser-derived process point to script-driven or delivered execution rather than hands-on administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1105.network_retrieval
  question: Did ldifde.exe make any outbound network connections around the time of the alert?
  context: An LDIF file can embed an HTTP-based attribute value, which causes ldifde to fetch content from a remote server during import — turning the signed binary into a downloader. Ldifde also speaks LDAP to a directory server (TCP 389, or 3268 for the global catalog, 636 for LDAPS). Connections to an external or unexpected destination, rather than to a known domain controller, indicate remote retrieval or directory access against an attacker-controlled endpoint. Connections scoped to the alerting process by its identifier.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: template:download_tool.download_success_verification
  question: Was a file created at the import path or fetched during the import? Check for file creation on the host.
  context: An import command does not guarantee that any remote content was retrieved or written. If the LDIF carried an HTTP-based attribute value, the fetched content may land on disk; the import file referenced after -f is itself a file artifact to confirm. Confirming file creation establishes whether the operation progressed past invocation, and surfaces where retrieved content was staged.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: Can you retrieve and analyze the import file or any fetched payload from a safe environment?
  context: If the LDIF import file or any content ldifde fetched is still on disk, submitting its hash to threat intelligence or detonating it in a sandbox reveals whether it is a known-bad payload, a benign provisioning file, or something novel. The LDIF source also shows the actual directory changes — account additions, ACL or GPO modifications, tombstone reanimation — that the import would apply.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Hashes
- source: template:universal.evidence_preservation
  question: Is the LDIF import file still on disk for analysis?
  context: The file referenced after -f holds the actual directory changes the import applies and any HTTP-based attribute value used to fetch remote content. Checking whether it still exists on disk enables hash lookups, sandbox submission, or direct review of the changetype entries and attribute values it carries.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the directory holding the import file?
  context: Operators often stage multiple files in the same directory, or the import triggers further writes such as fetched payloads, logs, or extracted content. Examining directory-level file activity reveals the broader scope of the operation beyond the single import file. A user-writable staging directory holding additional dropped files raises the severity of the disposition.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: attack:T1218.image_load
  question: What modules did ldifde.exe load at runtime, and do any sit outside the expected system module set?
  context: A Microsoft-signed binary executing trusted code is the baseline expectation, but proxy-execution abuse can pair the signed launcher with side-loaded code. The expected startup module set for ldifde is limited to system libraries such as ntdll.dll and, under WOW64, wow64.dll alongside ldifde.exe itself. A module loaded from a user-writable path or an unexpected library is the deviation worth chasing. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run ldifde import in this pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even a legitimate AD utility can be abused. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific import pattern has historically run here, not generic ldifde usage. A new parent process, an unexpected user account, or a first-ever appearance of this pattern on the host is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ldifde.exe
      - OriginalFileName: ldifde.exe
      selection_cli:
        CommandLine|contains|all:
        - -i
        - -f
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ldifde.exe
      - OriginalFileName: ldifde.exe
      selection_cli:
        CommandLine|contains|all:
        - -i
        - -f
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ldifde.exe
      - OriginalFileName: ldifde.exe
      selection_cli:
        CommandLine|contains|all:
        - -i
        - -f
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user ran directory-import or other administrative tooling on several hosts in this window, the scope of the activity is broader than a single import.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ldifde.exe
      - OriginalFileName: ldifde.exe
      selection_cli:
        CommandLine|contains|all:
        - -i
        - -f
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts run this ldifde import pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this import pattern rather than generic ldifde usage. Many hosts firing the same pattern points to scripted provisioning or management automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ldifde.exe
      - OriginalFileName: ldifde.exe
      selection_cli:
        CommandLine|contains|all:
        - -i
        - -f
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, defense tampering, credential access, or directory enumeration — may reveal the stages that preceded this import and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
