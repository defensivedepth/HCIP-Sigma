name: File Recovery From Backup Via Wbadmin.EXE
id: 89978cc3-921f-4515-a6e6-464a20688865
description: |
  Detects wbadmin.exe restoring individual files or folders from a backup version, identified by a command line that
  contains a recovery action, a recoveryTarget redirect, and itemtype:File together. File-level restore is the primitive
  abused to reconstruct sensitive system files such as NTDS.DIT or the SYSTEM/SECURITY registry hives from a backup into a
  writable location for offline credential extraction, and it can also be used to revert a host to an attacker-staged or
  pre-remediation state. Legitimate use exists — backup operators recovering accidentally deleted files — so the
  investigation should establish who ran it, what items were targeted, where they were redirected, and whether the activity
  sits inside a broader recovery-destruction or credential-access sequence.
type: detection
detection_id: 6fe4aa1e-0531-4510-8be2-782154b73b48
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the wbadmin file-recovery pattern this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process
    is wbadmin.exe (by Image or original filename) AND its command line contains all of a recovery action, a recoveryTarget
    redirect, and itemtype:File together. Read the full command line and confirm each of those elements is present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to recover files from backups with wbadmin?
  context: File recovery from backup is a Backup Operators / Administrators operation that requires an elevated prompt.
    Knowing whether this account and host normally perform backup-restore work is often the fastest way to separate routine
    administration from credential-access or recovery-tampering activity. A workstation or a non-admin account running this
    is far more notable than a backup server.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which items were restored, and where was the recoveryTarget pointed?
  context: The command line reveals exactly what the restore did. Decode the -items list to see which files or folders were
    recovered (NTDS.DIT, the SYSTEM/SECURITY/SAM registry hives, or other sensitive system files are the high-priority
    targets) and the -recoveryTarget value to see where they were redirected. Note -notRestoreAcl (drops the backup's ACLs
    so the restored copy inherits the destination's permissions) and -version, which ties the restore to a specific backup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1490.command_analysis
  question: What did the full wbadmin invocation chain on this host look like around the alert?
  context: A file restore is usually preceded by enumeration commands (wbadmin get versions, wbadmin get items) that resolve
    the backup version identifier and the item list. Seeing every wbadmin execution on this host in a tight window reveals
    the full operation rather than the single recovery command, including whether the operator first listed what backups
    held NTDS or registry-hive content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_host:
        host.name|expand: '%hostname%'
      condition: selection_img and selection_host
    fields:
      - CommandLine
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned wbadmin, and is that parent chain expected?
  context: The parent process shows how the restore was launched. An interactive admin session (explorer.exe, a console
    host under a logged-on administrator) fits routine backup work. A scripting or remote-execution parent (powershell.exe,
    cmd.exe running a script, wmiprvse.exe, services.exe spawning an ad-hoc command) points to automation or hands-on-keyboard
    operator activity worth tracing further up the tree.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did wbadmin spawn afterward?
  context: After a restore completes, the next actions reveal intent. Legitimate recovery rarely chains into other tools;
    a restore of NTDS.DIT or registry hives followed by tools that read or parse those files (or by archive and exfiltration
    helpers) points to offline credential extraction rather than file recovery.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the restore ran?
  context: A restore that redirects sensitive files to a writable location is typically a means to an end. Examining process
    activity in the window after the restore shows what the recovered files were used for — credential parsing, archiving,
    staging, or further recovery-destruction. A burst of unfamiliar processes or access to the recoveryTarget path shortly
    after the restore is the lead worth following.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:ransomware_impact.recovery_options_assessment
  question: What recovery-inhibiting commands were executed on this host?
  context: 'Impact-stage operators chain recovery-affecting commands: deleting shadow copies (vssadmin, wmic), disabling boot
    recovery (bcdedit), deleting backups or catalogs (wbadmin), and disabling the Windows Recovery Environment (reagentc).
    A file restore can sit alongside these — reverting a host to a pre-remediation state or staging backup content. This query
    surfaces all recovery-affecting commands on the host so the analyst can see whether this restore is isolated or part of a
    wider recovery-manipulation sequence. Verify the resulting system state directly (vssadmin list shadows, bcdedit /enum,
    reagentc /info, wbadmin get versions).'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- source: attack:T1490.tuning_parameter
  question: Was the RecoveryEnabled or Windows Recovery Environment state changed on this host around the alert?
  context: Beyond command-line tools, recovery state changes also land as registry writes — the BCD RecoveryEnabled value
    and Windows Recovery Environment configuration. A restore paired with a registry change that disables recovery indicates
    the operator is both reverting state and removing the ability to undo it. If registry value telemetry is not collected
    in this environment, treat zero results as a visibility gap rather than evidence nothing changed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - 'RecoveryEnabled'
          - 'WinRE'
          - 'ReAgent'
          - 'BootStatusPolicy'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:ransomware_impact.destruction_scope_on_host
  question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Impact-stage activity typically chains multiple destructive actions in one operation: shadow-copy deletion,
    recovery disabling, backup manipulation, security-service stopping, and permission changes. Finding the full set of these
    commands in the same window reveals whether this restore is one step in a destructive sequence rather than an isolated
    administrative action. A shared parent across the commands points to scripted execution.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously matched this wbadmin recovery pattern, what parents and users drove it, and does
    this alert fit?
  context: Even legitimate backup utilities have a normal footprint. This query mirrors the rule's exact selection scoped to
    this host, so the parent and user distribution reflects how this specific recovery pattern has run here historically — not
    generic wbadmin usage. A new parent process, an unexpected account, or a first-ever match is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_cli:
        CommandLine|contains|all:
        - ' recovery'
        - recoveryTarget
        - itemtype:File
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run wbadmin recovery operations?
  context: Compare this user's current action against their history. A user who has never run wbadmin is more notable than
    a backup administrator who runs restores routinely. The result should align with the user's role — backup and restore
    privileges are typically held by a small set of operators.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and wbadmin combination historically routine on this host or environment-wide?
  context: 'When the alert fires under a service principal, user identity does not attribute the behavior; the meaningful
    pivot is the launch mechanism. Which parent process spawned wbadmin, and is that pair historically common here? A new or
    rare parent for wbadmin is the deviation worth chasing; a pair already responsible for thousands of prior events is
    scheduled or vendor automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether this restore is isolated or part of broader
    hands-on activity. The same account driving similar operations on multiple endpoints in the same window widens the
    potential scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and wbadmin combination fire on other hosts in the same window?
  context: Under a service principal, network-wide user activity is dominated by agent-telemetry noise. The meaningful
    question is whether the same launch mechanism — the parent process spawning wbadmin — appeared on other hosts in the
    alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:ransomware_impact.network_wide_impact
  question: Is this same wbadmin recovery activity firing on other hosts in the environment?
  context: Impact-stage and credential-access operations are often run across many hosts in rapid succession. Finding this
    same alert on multiple hosts indicates network-wide execution and determines the scope for containment and response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on this host — defense tampering, reconnaissance, or
    credential access — may reveal the stages that preceded this restore and help reconstruct the timeline. Backup restore
    of sensitive files often follows initial access and privilege escalation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
