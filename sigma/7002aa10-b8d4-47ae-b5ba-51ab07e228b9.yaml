name: Potential Mpclient.DLL Sideloading Via Defender Binaries
id: 404867c5-3def-4fea-8ddf-119fabd0b641
description: |
  Detects MpCmdRun.exe or NisSrv.exe (Windows Defender command-line utilities) executing from a directory
  other than their known install locations under Program Files, Microsoft Security Client, or the Defender
  Platform path. These signed binaries load a companion DLL (mpclient.dll) from their own directory first, so
  relocating the binary lets an actor drop a weaponized mpclient.dll alongside it and have the trusted process
  load attacker code in-process. Legitimately these binaries only run from their managed install paths; execution
  from a user-writable or otherwise unexpected directory is the anomaly. Investigation should confirm the actual
  path, identify what DLL was loaded and where it came from, and look for the dropped DLL and any in-memory payload
  the load fronts for.
type: detection
detection_id: 7002aa10-b8d4-47ae-b5ba-51ab07e228b9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did a Defender binary (MpCmdRun.exe or NisSrv.exe) run from a path outside the known Defender install locations?
  context: Confirm the alert is a true positive by reviewing the full Image path of the triggering event. The rule
    fires when the process Image ends in MpCmdRun.exe or NisSrv.exe AND the path does NOT start with one of the
    managed Defender install locations (Program Files Windows Defender, Microsoft Security Client, the Defender
    Platform directory, or WinSxS). Any other directory — especially a user-writable one — is the condition the
    rule keys on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run a Defender command-line binary from this directory?
  context: Defender's command-line utilities normally run from their managed install paths under SYSTEM or LOCAL
    SERVICE as part of scheduled scans and platform updates. A user account launching MpCmdRun.exe or NisSrv.exe
    from an arbitrary directory, or a host with no role that would explain it, points away from routine Defender
    operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What directory did this Defender binary run from and what did its command line do?
  context: The full Image path and command line reveal where the binary was relocated to and what it was asked to
    do. The running directory is the load source for the companion DLL — note whether it is user-writable (under
    Users, ProgramData outside the Defender Platform path, Temp, or a help/staging folder). Decode any flags or
    paths in the command line to understand the intended operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: attack:T1574.001.image_load
  question: Did this Defender binary load mpclient.dll, and was that DLL loaded from the same non-default directory rather than a system path?
  context: The sideloading mechanism is the DLL search order — the relocated binary loads mpclient.dll from its own
    directory before any system location. A mpclient.dll loaded from the same user-writable or staging directory
    the binary ran from is the weaponized companion DLL, not the legitimate one shipped under the Defender Platform
    path. If module-load telemetry is not collected in this environment, treat zero results as a visibility gap
    rather than evidence no DLL was loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\mpclient.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1574.001.file_path_analysis
  question: Were a DLL or supporting payload files written into the directory this binary ran from shortly before it executed?
  context: Sideloading requires the attacker to stage files first — typically the weaponized DLL plus an encrypted
    payload (often given a log-file name) and sometimes a clean copy of the signed binary, all dropped into the same
    directory. File writes into the binary's running directory in the minutes before execution show how the staging
    happened and what process performed the drop. Scope is the directory the alerting binary ran from.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this Defender binary and is that parent chain expected?
  context: Legitimate Defender command-line execution is driven by the service host or the Defender platform updater,
    not by interactive shells or scripting engines. A parent such as powershell.exe, cmd.exe, an Office application,
    or a process running from a download or staging directory points to operator-driven execution of the relocated
    binary.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this Defender binary spawn afterward?
  context: A Defender binary fronting a sideloaded DLL can launch follow-on activity once the in-process payload runs.
    Legitimate Defender utilities have predictable, narrow child activity; spawned command interpreters, scripting
    hosts, or network tools indicate the load fronted for post-exploitation rather than a scan or update.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host run this Defender binary from a non-default location before, or is this first-time activity?
  context: Across 90 days these binaries should appear only from their managed install paths. A history limited to
    Program Files or the Defender Platform path with this alert as the first execution from another directory marks
    the relocation as new. Review the User column to see which accounts have historically run the binary here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: This mirrors the rule's selection — a Defender binary running from outside the managed install paths —
    scoped to this host, so the parent and user distribution reflects how this specific firing pattern has run here
    historically rather than generic Defender usage. A new parent process or an unexpected account against this
    pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith:
        - \MpCmdRun.exe
        - \NisSrv.exe
      filter_main_known_locations:
        Image|startswith:
        - C:\Program Files (x86)\Windows Defender\
        - C:\Program Files\Microsoft Security Client\
        - C:\Program Files\Windows Defender\
        - C:\ProgramData\Microsoft\Windows Defender\Platform\
        - C:\Windows\WinSxS\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Sideloading via a trusted binary is usually one step in a larger sequence — preceded by staging downloads
    and followed by reconnaissance, credential access, or impact actions. Activity surrounding the detected execution
    provides the broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This mirrors the rule's selection with no host scope, giving a fleet-wide count of Defender binaries running
    from non-default paths rather than generic binary usage. Many hosts firing the same pattern can point to a
    misconfigured deployment that relocated the binary; one host or a small unrelated set points to targeted operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith:
        - \MpCmdRun.exe
        - \NisSrv.exe
      filter_main_known_locations:
        Image|startswith:
        - C:\Program Files (x86)\Windows Defender\
        - C:\Program Files\Microsoft Security Client\
        - C:\Program Files\Windows Defender\
        - C:\ProgramData\Microsoft\Windows Defender\Platform\
        - C:\Windows\WinSxS\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith:
        - \MpCmdRun.exe
        - \NisSrv.exe
      filter_main_known_locations:
        Image|startswith:
        - C:\Program Files (x86)\Windows Defender\
        - C:\Program Files\Microsoft Security Client\
        - C:\Program Files\Windows Defender\
        - C:\ProgramData\Microsoft\Windows Defender\Platform\
        - C:\Windows\WinSxS\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith:
        - \MpCmdRun.exe
        - \NisSrv.exe
      filter_main_known_locations:
        Image|startswith:
        - C:\Program Files (x86)\Windows Defender\
        - C:\Program Files\Microsoft Security Client\
        - C:\Program Files\Windows Defender\
        - C:\ProgramData\Microsoft\Windows Defender\Platform\
        - C:\Windows\WinSxS\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the alerting user's activity across all hosts in the surrounding window reveals lateral movement
    or parallel activity on other endpoints. The same user driving similar execution on multiple hosts widens the
    scope of the investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith:
        - \MpCmdRun.exe
        - \NisSrv.exe
      filter_main_known_locations:
        Image|startswith:
        - C:\Program Files (x86)\Windows Defender\
        - C:\Program Files\Microsoft Security Client\
        - C:\Program Files\Windows Defender\
        - C:\ProgramData\Microsoft\Windows Defender\Platform\
        - C:\Windows\WinSxS\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Abusing a Defender binary to load attacker code often accompanies efforts to weaken protection. This query
    surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or
    patch AMSI/ETW. Zero rows is a useful protection-looks-healthy signal; populated rows shift the disposition toward
    operator preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Sideloading via a trusted binary rarely occurs in isolation. Earlier detections on the same host — staging
    downloads, reconnaissance, credential access, or defense tampering — may reveal the attack stages that preceded
    this execution and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
