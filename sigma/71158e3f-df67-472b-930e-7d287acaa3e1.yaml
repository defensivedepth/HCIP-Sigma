name: Execution Of Non-Existing File
id: ead28755-5d81-4325-a24c-c02f618a003b
description: |
  Fires when a process creation event reports an Image value that is not a full, absolute
  path (it contains no backslash), which can occur when a process is started without a
  backing file on disk via process ghosting or similar image-tampering methods. The rule
  excludes known kernel-pseudo processes (System, Registry, MemCompression, vmmem) and
  null/empty Image values, so a match represents an executing process whose on-disk image
  cannot be resolved at process-creation time. Process ghosting deletes the backing file
  before the inspection callback fires, letting a payload run while real-time protection is
  active; investigation should determine what the nameless process actually is, where it
  came from, and whether the absent image path reflects tampering or a benign telemetry gap.
type: detection
detection_id: 71158e3f-df67-472b-930e-7d287acaa3e1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process have an Image value with no backslash, and is it none of the excluded kernel-pseudo processes?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the Image field contains no backslash AND the Image is not null, empty, or one of System, Registry, MemCompression, or vmmem, and the CommandLine is not one of those same kernel labels. Review the exact Image and CommandLine on the triggering event to confirm a real process is running without a resolvable absolute path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run a process whose image path cannot be resolved?
  context: Legitimate software very rarely launches a process without a full image path, so the user role and host function are usually a fast way to triage. Some packers, installers, and unusual launchers in development or test contexts can produce non-absolute image paths; confirm whether the user and host normally do work that could explain it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the process actually do once running? Decode its command line and working directory.
  context: A process with no backing image on disk still reveals intent through its command line and working directory. Decode any flags, file paths, URLs, or encoded content to understand what the running code is doing. A ghosted payload frequently shows an arbitrary or unrelated name while the command line and child activity expose the real operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this one, and is that parent chain expected?
  context: The parent process reveals how the nameless process was launched. Process ghosting typically runs the loader from a temporary file, so a parent whose own image lives in a per-user temp or AppData location, or an unexpected interactive shell or script host, is worth scrutiny. Walk the chain upward to see what started the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: llm_generated
  question: Is the parent process image located in a per-user temporary or AppData directory rather than a standard system or program-files path?
  context: A loader that creates and then deletes its own backing file commonly executes from a temporary path. A parent whose image resolves to a per-user temp or AppData location, while the spawned process itself has no resolvable path, fits the ghosting pattern; a parent in a standard system or installed-software directory points more toward a benign telemetry artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes were spawned by this process afterward?
  context: The processes a nameless process spawns reveal its actual impact. A payload running without a backing image often launches credential-access, reconnaissance, or staging tools such as cmd.exe, powershell.exe, or certutil.exe. Unexpected children sharpen the disposition even when the parent image itself cannot be resolved.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Some environments produce occasional non-absolute Image values from benign tooling. The query mirrors the rule's exact selection and exclusion structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent, an unexpected user, or a first-time occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      image_absolute_path:
        Image|contains: \
      filter_null:
        Image: null
      filter_empty:
        Image:
        - '-'
        - ''
      filter_4688:
      - Image:
        - System
        - Registry
        - MemCompression
        - vmmem
      - CommandLine:
        - Registry
        - MemCompression
        - vmmem
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (not image_absolute_path and not 1 of filter*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      image_absolute_path:
        Image|contains: \
      filter_null:
        Image: null
      filter_empty:
        Image:
        - '-'
        - ''
      filter_4688:
      - Image:
        - System
        - Registry
        - MemCompression
        - vmmem
      - CommandLine:
        - Registry
        - MemCompression
        - vmmem
      _pb_scope:
        User|expand: '%User%'
      condition: (not image_absolute_path and not 1 of filter*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      image_absolute_path:
        Image|contains: \
      filter_null:
        Image: null
      filter_empty:
        Image:
        - '-'
        - ''
      filter_4688:
      - Image:
        - System
        - Registry
        - MemCompression
        - vmmem
      - CommandLine:
        - Registry
        - MemCompression
        - vmmem
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (not image_absolute_path and not 1 of filter*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user generated similar activity on other hosts in the alert window, the scope of the event may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      image_absolute_path:
        Image|contains: \
      filter_null:
        Image: null
      filter_empty:
        Image:
        - '-'
        - ''
      filter_4688:
      - Image:
        - System
        - Registry
        - MemCompression
        - vmmem
      - CommandLine:
        - Registry
        - MemCompression
        - vmmem
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (not image_absolute_path and not 1 of filter*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection and exclusion structure with no host scope, so the result is a fleet-wide count of this firing pattern. Many hosts firing the same pattern points to a shared benign tool or scripted deployment; one host or a small unrelated set points to a host-local event worth closer review. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      image_absolute_path:
        Image|contains: \
      filter_null:
        Image: null
      filter_empty:
        Image:
        - '-'
        - ''
      filter_4688:
      - Image:
        - System
        - Registry
        - MemCompression
        - vmmem
      - CommandLine:
        - Registry
        - MemCompression
        - vmmem
      condition: not image_absolute_path and not 1 of filter*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence, or staging that surrounds the nameless process.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host such as defense tampering, reconnaissance, or credential access may reveal the stages that preceded this event and help reconstruct the timeline. Image-tampering execution is frequently bracketed by other operator actions that leave their own alerts.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
