name: Suspicious Rundll32 Activity Invoking Sys File
id: d93c1e5e-e9ba-4412-a9cd-2152d9311d2e
description: |
  Fires when a command line contains both rundll32.exe and a reference to a .sys file (with a trailing comma or space,
  indicating an export ordinal or entry point). A .sys extension names a kernel driver, which rundll32 cannot legitimately
  load, so this pattern most often means a DLL was written to disk with a .sys name to masquerade as a driver and is being
  proxy-executed through a trusted signed binary. Legitimate rundll32 usage targets .dll, .cpl, or specific control-panel
  entry points; a .sys target is the anomaly. Determine what the renamed file actually is, where it came from, what entry
  point rundll32 invoked, and whether the activity correlates with file writes to driver paths or outbound network retrieval.
type: detection
detection_id: 731231b9-0b5d-4219-94dd-abb6959aa7ea
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain rundll32.exe together with a .sys file reference?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The
    rule fires only when rundll32.exe and a .sys reference (followed by a comma or space) appear together. Confirm the .sys
    token is a real file argument to rundll32 and not an incidental substring, and read the export ordinal or entry point name
    that follows it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to load driver-named files through rundll32?
  context: Loading a .sys-named file via rundll32 is not part of normal administration, driver installation, or control-panel
    use. If the user role or host function has no reason to proxy-execute code through rundll32 against a driver-named target,
    that raises the priority of the finding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full rundll32 command, and which .sys file and entry point did it invoke?
  context: The full command line reveals the renamed file and the export or ordinal rundll32 was told to run. Note the file
    path and name of the .sys target, the entry point after the comma, and any additional arguments. The .sys file is almost
    always a DLL renamed to impersonate a kernel driver; the entry point names the exported function the actor wants executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_pattern1:
        CommandLine|contains: rundll32.exe
      selection_pattern2:
        CommandLine|contains:
          - .sys,
          - '.sys '
      condition: selection_host and selection_pattern1 and selection_pattern2
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this rundll32 invocation, and is that parent chain expected?
  context: The parent reveals how rundll32 was launched. Driver-named proxy execution is frequently kicked off by a script
    host or downloader rather than by user-driven shell activity. Parents such as wscript.exe, cscript.exe, mshta.exe, an Office
    application, or an unexpected service process are worth scrutiny; a launch from explorer.exe or services.exe is more routine.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.011.image_load
  question: Was a driver-named file mapped into the rundll32 process as a loaded module on this host?
  context: When rundll32 proxy-executes a renamed DLL, the file is mapped into memory as a loaded module even though its name
    ends in .sys. Confirming a .sys-named module loaded by a user-mode process corroborates that the file is a DLL impersonating
    a driver rather than a genuine kernel driver. If image-load telemetry is not collected in this environment, treat zero
    results as a visibility gap rather than evidence nothing loaded, and rely on the command-line evidence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains: .sys
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.011.file_event
  question: Was a .sys-named file written to a driver or system directory on this host around the alert?
  context: Driver-named DLLs are commonly dropped into paths such as the System32 drivers directory before being proxy-executed.
    A recent write of a .sys file, especially one created by a script host or downloader rather than a driver installer, places
    the load in a clearer context. Compare the writer process and the destination path against legitimate driver-installation
    activity.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: .sys
      condition: selection
    fields:
      - Image
      - TargetFilename
      - User
- source: attack:T1218.011.network_connection
  question: Did rundll32 make outbound network connections on this host around the alert?
  context: Proxy execution through rundll32 is sometimes paired with retrieval of a payload or follow-on content from an external
    host. An outbound connection from rundll32, particularly to an external address, is atypical and helps establish whether
    the activity reached the network. Review the destination address and port and whether the connection was initiated by the
    rundll32 process.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \rundll32.exe
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1218.011.parent_process_analysis
  question: Has this rundll32-plus-.sys pattern run under a parent or user that is unusual for this host?
  context: When the host has previously fired this pattern, the parent process and user account that drove it form a baseline.
    A new parent, an unexpected user, or a service account that does not normally launch rundll32 against driver-named files
    is the deviation worth chasing. A parent or user that already accounts for prior matches points toward established automation.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains: rundll32.exe
      selection2:
        CommandLine|contains:
        - .sys,
        - '.sys '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes were spawned on this host right after the rundll32 invocation?
  context: The processes launched after proxy execution reveal its actual impact. Driver-named proxy execution is often a loader
    stage; follow-on cmd.exe, powershell.exe, certutil.exe, or additional rundll32 invocations indicate post-exploitation rather
    than a single benign action. Review what executed in the minutes after the alert and whether it fits expected activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains: rundll32.exe
      selection2:
        CommandLine|contains:
        - .sys,
        - '.sys '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains: rundll32.exe
      selection2:
        CommandLine|contains:
        - .sys,
        - '.sys '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on more than one host, the scope of the activity may be larger than a single
    endpoint. Look for repeated proxy-execution patterns or staging behavior on other hosts.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains: rundll32.exe
      selection2:
        CommandLine|contains:
        - .sys,
        - '.sys '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rundll32-plus-.sys pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern rather than generic rundll32 usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains: rundll32.exe
      selection2:
        CommandLine|contains:
        - .sys,
        - '.sys '
      condition: all of selection*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context of what led
    to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation,
    or persistence mechanisms surrounding the proxy-execution event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance,
    or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. The sequence of
    alerts on a host often tells the larger story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
