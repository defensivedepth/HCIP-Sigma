name: ConvertTo-SecureString Cmdlet Usage Via CommandLine
id: 62cbc1e1-4b14-40df-984e-a72ff62b7825
description: |
  Detects PowerShell (powershell.exe or pwsh.exe) invoked with the ConvertTo-SecureString cmdlet on the command line.
  This cmdlet turns plaintext or DPAPI/key-encrypted strings into a SecureString and is commonly used to embed hardcoded
  credentials (-AsPlainText -Force), unwrap previously encrypted payloads (-Key, -SecureKey), or build a PSCredential
  object for remoting. Legitimate automation and admin scripts use it routinely to pass passwords between commands, so the
  investigation should determine whether the credential material is hardcoded or key-shipped, what the surrounding script
  does with it, and whether the user, host, and parent chain are consistent with sanctioned automation.
type: detection
detection_id: 74403157-20f5-415d-89a7-c505779585cf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — PowerShell running ConvertTo-SecureString?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires when
    the image ends in powershell.exe or pwsh.exe (or carries the matching OriginalFileName) AND the command line contains
    the literal string ConvertTo-SecureString. Note the surrounding arguments — -AsPlainText, -Key, -SecureKey — since they
    determine whether a credential is hardcoded or key-unwrapped.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run PowerShell credential-handling cmdlets?
  context: Legitimate administrative automation and deployment scripts use ConvertTo-SecureString routinely to pass passwords
    between commands. Knowing whether this user role and host function involve scripted credential handling is often the
    fastest way to separate sanctioned automation from a planted credential or staged payload unwrap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1059.001.command_analysis
  question: What credential parameter set did ConvertTo-SecureString use — was the input plaintext, key-encrypted, or DPAPI-bound?
  context: The parameters reveal how the credential is protected. -AsPlainText -Force means a plaintext password is embedded
    directly in the script and is the strongest signal of a hardcoded credential. -Key with a byte array (valid lengths 16,
    24, 32) or -SecureKey unwraps a previously encrypted blob; a trivially derivable key such as (1..16) provides no real
    protection and is observed shipping credentials alongside a loader. No key at all means DPAPI encryption bound to the
    current user and machine. Read these arguments from the alerting command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: Was the surrounding command encoded or obfuscated, and what does the full script do with the SecureString?
  context: ConvertTo-SecureString is frequently one line of a larger script. Attackers wrap the surrounding command with
    -EncodedCommand (-enc), string concatenation, backtick escaping, or case randomization (for example cOnvErTTO-SECUreStRIng)
    to hide intent. Decode any base64 and reconstruct concatenated strings to see what consumes the SecureString — a
    PSCredential built for remoting, a stored ciphertext read from a file, or a hardcoded operator password.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What was the full ConvertTo-SecureString invocation on this host, and did it read from or write to a file?
  context: The full operation reveals the credential's source and destination. A long encrypted blob read with Get-Content
    piped into ConvertTo-SecureString -Key points to a staged ciphertext file shipped with the loader; a plaintext literal
    points to a hardcoded credential. The query scopes to PowerShell command lines containing ConvertTo-SecureString on this
    host within the window so multi-line script activity around the alert is visible, not just the single triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: ConvertTo-SecureString
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Windows Event ID 4104 records the deobfuscated script that PowerShell actually executed, even when the command
    line is encoded, concatenated, or case-randomized. This is ground truth for what the script did with the SecureString —
    including the plaintext password or key bytes that the command line may hide. If PowerShell operational logs are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Operators often disable or downgrade PowerShell protections before running credential-handling payloads. Common
    precursors include AMSI bypass (patching amsi.dll in memory), execution-policy changes (-ExecutionPolicy Bypass, -ep
    bypass), Defender real-time monitoring disable, and PowerShell v2 downgrade attacks that lack script block logging.
    Finding these precursor events strengthens the case that the SecureString usage is part of an intrusion rather than
    routine automation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: attack:T1059.001.image_load
  question: Did this PowerShell process load .NET automation assemblies that indicate indirect or in-memory hosting rather than an interactive shell?
  context: PowerShell can be hosted indirectly through .NET automation (System.Management.Automation) rather than launched
    as an interactive shell, and reflective assembly loading is a common way credential-unwrapping code runs in memory. Module
    and assembly load events on this host around the alert reveal whether the SecureString work happened inside a normal
    PowerShell session or inside a custom .NET host. If image-load telemetry is not ingested in this environment, treat zero
    results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - \System.Management.Automation
          - \System.Management.Automation.ni.dll
          - \clr.dll
          - \clrjit.dll
      condition: selection
    fields:
      - Image
      - ImageLoaded
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. Interactive admin use typically descends from explorer.exe
    or a console host; scheduled automation descends from svchost.exe or taskeng.exe. Unusual parents such as mshta.exe,
    rundll32.exe, wscript.exe, or an Office application spawning PowerShell that handles credentials point to macro-driven or
    exploitation-driven execution.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.evidence_preservation
  question: Is any file referenced by the command still on disk for analysis?
  context: If the command reads an encrypted blob (for example Get-Content piped into ConvertTo-SecureString -Key) or writes
    decoded output, checking whether that file still exists enables deeper analysis — hashing, content review, or recovery of
    the staged ciphertext and the key shipped with it. File paths here are derived from the command line, so scope to those
    referenced paths.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell instance spawn afterward?
  context: The processes spawned after the credential is unwrapped reveal the operation's purpose. A SecureString built into
    a PSCredential is often followed by remoting (wsmprovhost.exe), lateral movement, or further script execution
    (cmd.exe, additional powershell.exe). Predictable children fit benign automation; unexpected post-exploitation children
    suggest the credential was used to act.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains: ConvertTo-SecureString
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains: ConvertTo-SecureString
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar credential-handling activity on several hosts in the window, the scope of the operation
    may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains: ConvertTo-SecureString
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run ConvertTo-SecureString via PowerShell, what parents and users normally drive it, and does this alert fit?
  context: Even routine credential automation has a baseline. The query mirrors the rule's selection scoped to this host, so
    the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new
    parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains: ConvertTo-SecureString
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts run ConvertTo-SecureString via PowerShell in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this firing pattern rather
    than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or vendor automation that
    embeds credentials in its setup scripts; one host or a small unrelated set points to manual operator activity. Use the
    host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains: ConvertTo-SecureString
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the stages that preceded this event and help reconstruct the timeline. A credential-unwrap
    cmdlet preceded by tampering or recon reads very differently from one that appears with no surrounding activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
