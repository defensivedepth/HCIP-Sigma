name: Remote Access Tool - MeshAgent Command Execution via MeshCentral
id: 572115a6-66bb-4ba2-935c-f2bd6aef77b5
description: |
  Detects the MeshCentral remote management agent (meshagent.exe) spawning a command interpreter
  (cmd.exe, powershell.exe, or pwsh.exe) as a direct child. The rule fires when the parent image
  ends in meshagent.exe AND the child image ends in one of those interpreters. MeshAgent is a
  legitimate cross-platform remote-management agent, so the same pattern appears during sanctioned
  IT support sessions; it also appears when an operator with access to a MeshCentral console runs
  interactive shell commands on a managed host. Determine whether the agent install and this command
  execution are authorized, what the spawned interpreter actually did, and whether the activity is
  part of a broader remote-control session.
type: detection
detection_id: 74a2b202-73e0-4693-9a3a-9d36146d0775
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did meshagent.exe spawn a cmd.exe, powershell.exe, or pwsh.exe child as detected?
  context: Confirm the alert is a true positive before investing investigation time. The rule requires
    BOTH conditions together - the parent image ends in meshagent.exe AND the child image is one of
    the command interpreters. Review the exact parent image, child image, and full command line of the
    triggering event to verify the spawn really came from the remote-management agent and not a
    similarly named binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to be administered through an interactive remote-management shell?
  context: Legitimate remote management through MeshAgent runs under whatever account the support
    operator is acting as, often a service or administrative context. Knowing whether this host is
    enrolled in a sanctioned management program and whether the acting user performs interactive
    remote administration is often the fastest way to separate routine IT support from operator abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is MeshAgent on the organization's approved remote management software list for this host?
  context: Organizations typically sanction a specific remote-management tool for IT support. MeshAgent
    paired with a MeshCentral server is a full remote-control agent; if it is not the approved tool for
    this environment, its presence may represent shadow IT or attacker-deployed persistence regardless
    of the tool's open-source reputation. Confirm the agent install itself is sanctioned for this host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a current helpdesk ticket or support session that explains this remote shell execution?
  context: Legitimate MeshAgent command execution usually correlates with an active support ticket, a
    scheduled maintenance window, or a user request. If no support context exists for an interactive
    shell launched by the management agent, the agent may have been installed by an operator for
    persistent access or repurposed to run commands without authorization.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:parent_child.parent_process_legitimacy
  question: What started meshagent.exe itself, and is that launch chain expected?
  context: The meshagent.exe parent spawning a shell is the core signal here. Tracing the agent's own
    origin (its grandparent) shows whether the agent was started as a normally installed service or was
    launched from an unusual location or parent. A management agent running as an installed service is
    routine; an agent process started from a user-writable or temporary path is the deviation worth
    chasing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_parent_process.mechanism_decode
  question: What exactly did the spawned interpreter do? Decode its full command line.
  context: The full command line of the cmd.exe, powershell.exe, or pwsh.exe child reveals the specific
    action the remote operator took. Decode every flag, parameter, encoded blob, file path, or URL.
    Interactive remote shells are frequently used to run reconnaissance, drop or fetch payloads, or
    change configuration, and the command line is the ground truth for what the session accomplished.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated? What does it decode to?
  context: When the spawned child is powershell.exe or pwsh.exe, operators frequently use the
    -EncodedCommand (-enc) parameter or string concatenation, backtick escaping, and variable
    substitution to hide intent. Base64-encoded commands are the most common form. Decoding reveals the
    actual payload - download cradles, reverse shells, or in-memory execution of .NET assemblies. If the
    child was cmd.exe with a readable command, this question does not apply.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script content?
  context: Script block logging records the deobfuscated script content that PowerShell actually
    executes, even when the command line is encoded or obfuscated. This provides ground truth about what
    ran, bypassing operator obfuscation. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell controls before running a payload. Common
    techniques include AMSI bypass (patching amsi.dll in memory), execution-policy changes
    (Set-ExecutionPolicy or -ep bypass), constrained-language-mode escape, and downgrade attacks (using
    powershell.exe v2 which lacks logging). Finding these precursor events on the host strengthens the
    case for malicious use of the remote shell.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did this same meshagent.exe instance spawn?
  context: A remote operator working through the agent rarely runs a single command. Examining the other
    children of the exact meshagent.exe parent instance reveals the full scope of the session - multiple
    interpreters, reconnaissance utilities, or file-transfer tools spawned by the same agent point to an
    interactive control session rather than a one-off automated action.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Does meshagent.exe on this host normally spawn command interpreters?
  context: A management agent that routinely launches interpreters for scripted maintenance looks
    different from one that has never done so. Zero or very low historical counts of meshagent.exe
    spawning cmd.exe, powershell.exe, or pwsh.exe on this host indicate a novel spawning relationship and
    raise the weight of this alert; a steady history points to established automation or routine support.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint is the agent connecting to around the time of this execution?
  context: MeshAgent maintains a long-lived outbound control channel to its MeshCentral server, typically
    a WSS connection on 443 to an agent endpoint. Connections to expected management infrastructure are
    routine; connections to an unfamiliar address, or remote-management traffic on configurable high
    ports such as 7070 or 5650, suggest an unsanctioned or attacker-controlled server. Correlating the
    egress channel with the shell execution ties the command activity to its control source.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1219.002.file_event
  question: What files did the agent or its spawned shell write to user-writable or temporary locations around this time?
  context: Remote-management abuse commonly stages payloads, scripts, or output files on disk, often in
    user-writable or temporary directories rather than program-install paths. File writes from the agent
    or its child interpreters in those locations around the execution window help reconstruct what was
    fetched, dropped, or exfiltrated through the remote session.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith: \meshagent.exe
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith: \meshagent.exe
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the acting user's activity across all hosts in the alert window reveals whether the
    remote session is isolated or part of broader hands-on activity. The same user triggering similar
    shell activity on multiple hosts widens the potential scope of an unauthorized remote-control session.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith: \meshagent.exe
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering,
    reconnaissance, credential access - may reveal the stages that preceded the remote-shell execution and
    help reconstruct the full timeline of the session.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
