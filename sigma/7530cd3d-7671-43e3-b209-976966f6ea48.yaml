name: Renamed CURL.EXE Execution
id: 4fc45988-fd0f-4130-a942-57860243a6e1
description: |
  Detects a process whose embedded PE metadata identifies it as curl (OriginalFileName curl.exe or the "The curl executable" description) while the on-disk image name is not curl. Renaming curl is a defense-evasion tactic that lets a known download utility run under an innocuous name, commonly to fetch a follow-on payload or script and reach out to attacker-controlled infrastructure. Legitimate causes exist (a bundled or repackaged curl shipped under a vendor-specific name), so the investigation should confirm the metadata/name mismatch, decode what the renamed binary actually did, identify what it downloaded or contacted, and determine whether the same binary appears elsewhere in the environment.
type: detection
detection_id: 7530cd3d-7671-43e3-b209-976966f6ea48
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this process carry curl PE metadata while running under a non-curl image name?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the embedded OriginalFileName is curl.exe (or the file description is "The curl executable") AND the on-disk image name does not contain "curl" — that is, a renamed curl. Review the OriginalFileName, Description, and Image path of the triggering event to confirm the metadata-versus-name mismatch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run command-line download utilities under renamed binary names?
  context: Legitimate administrative activity can trigger this detection — some software bundles or repackages curl under a vendor-specific name. Knowing whether the user role and host function are consistent with running a renamed curl is often the fastest path to distinguishing a routine repackaged tool from operator-delivered tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: The file is named something other than curl, but the embedded OriginalFileName says curl.exe. Comparing the Image path (the name on disk) against OriginalFileName confirms the true identity, and the file hash enables a reputation lookup to determine whether this is a legitimate signed curl build, a known-bad sample, or a novel binary. Submit the hash for threat-intelligence checking.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this renamed curl invocation do? Decode the full command line.
  context: The full command line reveals the specific transfer the renamed curl performed. Decode the target URL or IP and port, the output file path, any custom headers or user-agent flags, and whether the fetched content was a script or executable. A non-default user-agent and a fetch from a non-canonical host or port are notable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this renamed curl, and is that parent chain expected?
  context: The parent process reveals how the renamed curl was invoked. A user-driven launcher (explorer.exe, a shell) or an automation host has a predictable chain; parents such as a script host, an Office application, or a shortcut-launched process point to a delivered execution rather than routine tooling.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.binary_origin
  question: How did this renamed curl binary arrive on the host?
  context: 'Renamed binaries do not appear spontaneously — they were copied, downloaded, or dropped by a parent process. Tracing the file creation event for the binary by basename over a long window reveals the delivery mechanism: a download tool, a dropper, a manual copy, an archive extraction, or lateral movement from another host. The creating process shown in Image identifies what placed it.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What child processes did this renamed curl spawn, and is the same binary present on other hosts?
  context: The purpose of renaming curl is to evade detection while still performing transfers and launching follow-on stages. Examining the processes spawned by the renamed binary reveals its actual objective — a script interpreter, an installer, or a dropped executable being run. The same renamed binary appearing on multiple hosts suggests deliberate distribution rather than an isolated event; pivot on the OriginalFileName or hash to check fleet presence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1202.network_connection
  question: What outbound network connections did this renamed curl process make?
  context: A download utility's investigative center is its network activity. Pivoting on the alerting process to its network connections surfaces the destination address and port it contacted and whether that destination is a known-good update or package endpoint versus an unfamiliar host or non-standard port. A fetch to an unexpected IP and port, especially one immediately followed by execution of the fetched content, is the indirect-execution behavior this technique describes.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the renamed-curl pattern, what parents and users normally drive it, and does this alert fit?
  context: Even a renamed-curl pattern can have a benign repackaged origin. The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line shape relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: curl.exe
      - Description: The curl executable
      filter_main_img:
        Image|contains: \curl
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the renamed curl?
  context: A renamed download utility rarely acts alone. Activity surrounding the detected execution may reveal the launcher that delivered it, the script or executable it fetched and ran, or later staging and persistence steps that provide broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a malicious shortcut launch, a script host execution, or reconnaissance — may reveal the stages that preceded delivery of the renamed curl and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_user_actor.baseline
  question: Does this user normally run curl-family download utilities?
  context: Compare this user's current action against their historical behavior. A user who has never run curl (under any name) is more suspicious than one who does so regularly as part of their role. User role and typical toolset should align.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned this binary, and whether that pair is historically common. A new or rare parent for this binary is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on other hosts, the scope of the event may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since every host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus spawned binary — fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:lolbin.technique_class_lateral
  question: Were any other download or transfer utilities used on this host recently?
  context: Attackers who use one download LOLBin often use several — if a renamed curl fetched a payload, check whether certutil, bitsadmin, esentutl, expand, or similar transfer utilities were also used. Finding multiple download tools performing the same objective strengthens the case for deliberate operator activity. Renamed curl is excluded here because it is the alerting binary.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the renamed-curl pattern over the past 90 days, and what command-line shapes are typical?
  context: A renamed-curl pattern with no prior history on a host is more suspicious than one seen regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic curl usage. The CommandLine projection lets the analyst compare typical invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: curl.exe
      - Description: The curl executable
      filter_main_img:
        Image|contains: \curl
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
