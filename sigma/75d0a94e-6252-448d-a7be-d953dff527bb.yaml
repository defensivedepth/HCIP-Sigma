name: Remote XSL Execution Via Msxsl.EXE
id: 9d901273-3b52-4e57-a3e8-5005dcfad515
description: |
  Detects msxsl.exe executing with an "http" string in the command line, which fires when both the Image ends in msxsl.exe and the command line contains http. msxsl.exe is a standalone, Microsoft-signed XSLT transformation utility that is not installed by default on modern Windows; its presence is itself unusual, and an http argument points to a remote XML/XSL fetch processed in-process. Because the XSL processor runs embedded C#/JScript/VBScript and XSLT's document() function can pull additional remote content, this is a code-execution and download primitive from a signed binary, so the investigation should determine what remote content was fetched, what the transform did, and whether script-engine code ran.
type: detection
detection_id: 75d0a94e-6252-448d-a7be-d953dff527bb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show msxsl.exe running with an http argument?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires when the Image ends in msxsl.exe and the command line contains the string http. Read the full argument list to see which positional arguments are URLs, whether one or both of the XML and XSL inputs are remote, and whether an output flag is present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run msxsl.exe for XSL transformations?
  context: msxsl.exe ships separately from Windows and is rarely deployed; modern legitimate use relies on the .NET XslCompiledTransform APIs instead. A user or host with no development or build-tooling role running it against a remote URL is harder to explain as routine administration. Knowing the expected role is often the fastest way to separate a true positive from a developer or vendor workflow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What remote XML and XSL did this invocation reference, and was an output path or alternate data stream target supplied?
  context: The full command line reveals the operation. Decode the positional arguments to recover the XML and XSL URLs and any -o output path. Two remote URLs indicate fully remote transform-and-execute; an -o path indicates the transformed result is written to disk as a download primitive; an -o path containing a colon stream name (path:stream) writes into an NTFS alternate data stream to hide the result.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1220.command_analysis
  question: Does the command line reference an XSL or XML input whose extension or path is disguised to look like a non-script file?
  context: The XML and XSL inputs are passed as positional arguments and do not need .xsl or .xml extensions, so an actor may name them .jpeg, .txt, or use no extension to evade extension-based filtering. A remote argument with a benign-looking or missing extension, or an input that does not resolve to an expected document type, is a tuning-evasion signal worth decoding against the fetched content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned msxsl.exe and is that parent chain expected?
  context: The parent process shows how the binary was invoked. A parent of explorer.exe or a build or scripting host may be consistent with developer use, while parents such as mshta.exe, wscript.exe, cmd.exe under an Office application, or a remote-access tool point to delivery through a macro, script, or operator session. Identify what spawned the parent and what else that parent launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1220.parent_process_analysis
  question: Across this host's history, which parent processes have launched msxsl.exe, and is the current parent new or rare?
  context: Legitimate administrative or developer tooling may use msxsl, so validate the launch chain against history rather than judging the parent in isolation. A parent that already accounts for many prior msxsl executions on this host looks like established automation; a parent seen for the first time with this binary is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
- source: attack:T1220.time_correlation
  question: Did a scripting engine module load into this process around the time of the alert?
  context: When msxsl processes an XSL that contains an embedded msxsl:script block, the corresponding script engine module (such as jscript.dll, jscript9.dll, or vbscript.dll) is loaded into the process. A module load of a scripting engine into msxsl.exe close in time to the alert indicates code actually ran in-process rather than a benign data-only transform. If module-load telemetry is not collected in this environment, treat absent results as a visibility gap rather than evidence no script executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - \jscript.dll
          - \jscript9.dll
          - \vbscript.dll
          - \scrobj.dll
      condition: selection
    fields:
      - Image
      - ImageLoaded
- source: template:cue_process_tool.follow_on
  question: What child processes did msxsl.exe spawn afterward?
  context: Embedded script in an XSL transform can start additional processes, so children of msxsl reveal the transform's actual impact. Spawned cmd.exe, powershell.exe, certutil.exe, or other download or execution tooling points to a post-transformation stage; no children is consistent with a data-only transform or a download written straight to disk.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run msxsl.exe?
  context: msxsl.exe is not preinstalled and is rarely present in modern environments, so any execution history is notable. Zero or very low historical counts indicate first-time or rare execution and raise the weight of the alert; a steady count suggests an established build or transformation workflow on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run msxsl.exe with an http argument, what parents and users normally drive that activity, and does the current alert fit?
  context: Even rarely deployed tools can have a legitimate niche use. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msxsl.exe
        CommandLine|contains: http
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msxsl.exe
        CommandLine|contains: http
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msxsl.exe
        CommandLine|contains: http
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar transformation or remote-fetch activity on other hosts in the same window, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msxsl.exe
        CommandLine|contains: http
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what happened after, including reconnaissance, staging of the msxsl binary itself, privilege escalation, or persistence that provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or staging of tooling, may reveal the attack stages that preceded this event and help reconstruct the timeline. The sequence of alerts often tells the story of how the binary came to run.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
