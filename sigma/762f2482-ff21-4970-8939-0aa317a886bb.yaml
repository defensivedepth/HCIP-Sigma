name: HackTool - Certify Execution
id: 495b7b13-a0c7-4309-9555-934464f6365d
description: |
  Detects execution of Certify, a tool for enumerating and abusing misconfigurations in Active
  Directory Certificate Services (AD CS). The rule fires when EITHER the process image, original
  filename, or description identifies the Certify binary, OR all of a set of Certify subcommand strings appear in the command line together with all of a set of Certify option flags. Legitimate
  use is limited to authorized penetration tests or red team engagements; outside that, execution
  points to an operator enumerating vulnerable certificate templates or requesting a certificate to
  forge or steal authentication material. Investigation should confirm the trigger, identify which
  Certify capability ran, determine which certificate templates or CAs were targeted, and check for
  follow-on certificate enrollment and lateral movement.
type: detection
detection_id: 762f2482-ff21-4970-8939-0aa317a886bb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this execution match the Certify pattern the rule detects?
  context: >-
    The rule fires when EITHER the image, original filename, or description identifies Certify, OR the command line contains all of a set of Certify subcommand strings (cas, find, pkiobjects, request, download) together with all of a set of Certify option flags (/vulnerable, /template, /altname, /domain, /path, /ca). Confirm which branch fired by reviewing the image, original
    filename, description, and full command line. The image/description branch can fire on a renamed
    or recompiled binary, while the command-line branches fire on the argument pattern regardless of
    the binary name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to enumerate or request Active Directory certificates?
  context: >-
    AD CS enumeration and certificate requests are normal for a small set of PKI administrators and
    enrollment services. A standard user or a host with no certificate-management role running this
    tool is anomalous. Knowing whether the user role and host function fit AD CS administration is
    often the fastest path to distinguishing an authorized assessment from an intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this Certify execution part of an authorized penetration test or red team engagement?
  context: >-
    Certify is used in authorized security assessments of AD CS configurations. Before investing
    investigation time, check whether a penetration test or red team exercise is currently active on
    this host or network segment. An authorized engagement with matching tool usage and timing
    resolves the alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which Certify capability was invoked?
  context: >-
    Certify is multi-purpose. The find subcommand enumerates vulnerable certificate templates, cas
    enumerates certificate authorities, pkiobjects enumerates PKI objects, request submits a
    certificate request (optionally with /altname for impersonation), and download retrieves an
    issued certificate. The subcommand and flags reveal whether this was reconnaissance only or an
    active certificate request, which determines the scope of potential compromise.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: Which certificate template, certificate authority, or principal was targeted?
  context: >-
    For AD CS abuse the credential target is the certificate itself. Decode the command line for
    /template (which template was requested), /ca (which certificate authority), /altname (which
    principal was impersonated via a subject alternative name), and /domain (the target domain). A
    request that pairs a vulnerable template with an /altname for a privileged account indicates an
    attempt to obtain a certificate that authenticates as that account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1649.registry_cert_store_access
  question: Did certificate-store or PKI-related registry changes occur on this host around the alert?
  context: >-
    Certificate abuse and private-key access leave traces in the certificate-store registry paths
    (SystemCertificates, Microsoft\Cryptography, and per-user MY/CA stores). Registry writes to
    these locations near the alert time can indicate a certificate being imported, a private key
    being staged, or enrollment policy being read or altered. Correlating registry activity with the
    process execution helps establish whether a certificate was actually obtained or installed
    rather than merely enumerated.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_cert:
        TargetObject|contains:
          - 'SystemCertificates'
          - 'Microsoft\Cryptography'
          - 'Microsoft\SystemCertificates'
          - 'Certificates'
      condition: selection_host and selection_cert
    fields:
      - TargetObject
      - Image
      - User
- source: attack:T1649.enrollment_correlation
  question: Did certificate enrollment or authentication alerts fire around this execution?
  context: >-
    A Certify request submitted from this host should produce a corresponding certificate-enrollment
    or authentication event on the issuing certificate authority and domain controller. Correlated
    enrollment activity, or a Kerberos ticket request that follows shortly after, confirms a
    certificate was actually issued and used rather than the activity stopping at enumeration. If
    AD CS enrollment and authentication telemetry is not ingested in this environment, treat zero
    results as a visibility gap and pursue the issuing CA logs directly.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single enumeration command may be routine, but multiple reconnaissance commands in rapid
    succession is a signature of post-compromise enumeration. AD CS abuse is frequently preceded or
    accompanied by domain and trust discovery using tools such as nltest, net, dsquery, setspn, and
    adfind. Several distinct discovery binaries within a short window points to automated
    enumeration rather than isolated troubleshooting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this tool, and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. Certify run interactively from cmd.exe or
    powershell.exe spawned by explorer.exe fits a hands-on operator. Parents such as wmiprvse.exe
    (WMI remote execution), wsmprovhost.exe (WinRM), or a script interpreter indicate remote or
    automated invocation. The compiled assembly can also be loaded reflectively inside powershell.exe,
    in which case the parent and command line will show a PowerShell host rather than a standalone
    Certify image.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts or principals may be compromised, and do any have elevated privileges?
  context: >-
    The severity of AD CS abuse depends on which principal a forged or requested certificate
    authenticates as. A certificate issued with an /altname for a domain admin, a domain controller
    computer account, or a high-value service account requires incident escalation; a certificate
    bound to a standard user is lower impact. Cross-reference the targeted principal with directory
    group memberships to assess exposure.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    Tampering typically precedes hands-on credential-access activity. The query surfaces direct
    attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or
    patch AMSI/ETW. Zero rows is a useful signal that protection looks healthy; kernel-level driver
    tampering and in-memory patches will not appear here. Populated rows shift the disposition toward
    operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent/user distribution reflects how this specific firing pattern has historically run here, not
    generic binary usage. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing. On a host that has never legitimately run AD CS
    tooling, any history at all is itself notable.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Certify.exe
      - OriginalFileName: Certify.exe
      - Description|contains: Certify
      selection_cli_commands:
        CommandLine|contains:
        - '.exe cas '
        - '.exe find '
        - '.exe pkiobjects '
        - '.exe request '
        - '.exe download '
      selection_cli_options:
        CommandLine|contains:
        - ' /vulnerable'
        - ' /template:'
        - ' /altname:'
        - ' /domain:'
        - ' /path:'
        - ' /ca:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the spread look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firing pattern rather than generic binary usage. Many hosts firing the
    same pattern points to scripted deployment or a sanctioned assessment sweep; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent/binary
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Certify.exe
      - OriginalFileName: Certify.exe
      - Description|contains: Certify
      selection_cli_commands:
        CommandLine|contains:
        - '.exe cas '
        - '.exe find '
        - '.exe pkiobjects '
        - '.exe request '
        - '.exe download '
      selection_cli_options:
        CommandLine|contains:
        - ' /vulnerable'
        - ' /template:'
        - ' /altname:'
        - ' /domain:'
        - ' /path:'
        - ' /ca:'
      condition: selection_img or all of selection_cli_*
    fields:
    - host.name
- source: template:hacking_tool.tool_specific_artifacts
  question: Are file artifacts of this tool present on the host?
  context: >-
    Certify can redirect output to a file (for example via /outfile) and a requested certificate may
    be written to disk as a .pfx, .pem, or .crt. The compiled assembly may also be staged on disk or
    loaded from a base64 text file before execution. File creation events from this process reveal
    output files, exported certificates, or staged assemblies even after the process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Certify.exe
      - OriginalFileName: Certify.exe
      - Description|contains: Certify
      selection_cli_commands:
        CommandLine|contains:
        - '.exe cas '
        - '.exe find '
        - '.exe pkiobjects '
        - '.exe request '
        - '.exe download '
      selection_cli_options:
        CommandLine|contains:
        - ' /vulnerable'
        - ' /template:'
        - ' /altname:'
        - ' /domain:'
        - ' /path:'
        - ' /ca:'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Certify.exe
      - OriginalFileName: Certify.exe
      - Description|contains: Certify
      selection_cli_commands:
        CommandLine|contains:
        - '.exe cas '
        - '.exe find '
        - '.exe pkiobjects '
        - '.exe request '
        - '.exe download '
      selection_cli_options:
        CommandLine|contains:
        - ' /vulnerable'
        - ' /template:'
        - ' /altname:'
        - ' /domain:'
        - ' /path:'
        - ' /ca:'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host such as defense tampering,
    reconnaissance, or initial access may reveal the attack stages that preceded certificate abuse
    and help reconstruct the full timeline. Certificate-based credential theft is often a mid-chain
    objective reached after an initial foothold and discovery.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1649
      name: Steal or Forge Authentication Certificates
      role: primary
  attack_chain_coverage:
    - stage: 1
      label: cert_template_ca_enumeration
      description: Actor enumerates vulnerable certificate templates, certificate authorities, and PKI objects in AD CS
      mapped_to: Q4
      source: template:hacking_tool.tool_capability_used
    - stage: 2
      label: certificate_request_target
      description: Actor requests or downloads a certificate, optionally impersonating a principal via a subject alternative name
      mapped_to: Q5
      source: template:credential_access.credential_target_identification
    - stage: 3
      label: cert_store_registry_and_keys
      description: Registry access to certificate-store locations and staging of certificates or private keys on disk
      mapped_to: Q6
      source: attack:T1649.registry_cert_store_access
    - stage: 4
      label: enrollment_and_authentication
      description: Certificate enrollment on the issuing CA and subsequent use of the certificate to authenticate
      mapped_to: Q7
      source: attack:T1649.enrollment_correlation
  dimension_coverage:
    - dimension: time_correlation
      technique: T1649
      covered_by: Q7
      source: attack:T1649.enrollment_correlation
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1649
      covered_by: Q6
      source: attack:T1649.registry_cert_store_access
      coverage_type: partial
    - dimension: user_context
      technique: T1649
      covered_by: Q2
      source: template:universal.host_user_context
      coverage_type: direct
  mutable_dispositions:
    - element: EKU_Thresholds
      dimension: tuning_parameter
      specific_values: rationale only
      disposition: context
      target_question: Q5
      notes: >-
        No concrete EKU values in the analytic; the credential_target question's context directs the
        analyst to decode /template and /altname, which is where EKU-driven risk surfaces for this
        client-side tool. The registry cert-store question (Q6) carries the on-host certificate-store
        artifact angle.
    - element: TimeWindow
      dimension: time_correlation
      specific_values: rationale only
      disposition: context
      target_question: Q7
      notes: >-
        No concrete threshold given; enrollment_correlation uses a +/-1h window and discovery burst
        detection uses +/-15m to correlate multiple enrollments/recon from the same entity.
    - element: LogonContext
      dimension: user_context
      specific_values: rationale only
      disposition: context
      target_question: Q2
      notes: >-
        host_user_context and the user/service-principal baseline pair (Q16/Q17) distinguish
        interactive accounts from service principals, which is the LogonContext tuning intent.
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: >-
        Within-phase overlap with discovery_recon.discovery_parent_chain (must_include technique set,
        more specific to the discovery/recon context). Technique set version kept.
      kept: discovery_recon.discovery_parent_chain
    - dropped: discovery_recon.discovery_user_context
      reason: >-
        Overlaps universal.host_user_context (the template notes_to_llm calls for dropping one). Kept
        the universal version at start position; the discovery-specific user judgment is folded into
        its adapted question/context.
      kept: universal.host_user_context
    - dropped: cue_user_actor.clustering
      reason: >-
        user_actor clustering pair dropped to hold the 14-18 budget. Cross-host/same-window user
        activity is partly covered by the fleet-pattern scope question and prior-alert precursor; the
        baseline pair (subject vs. launch-mechanism identity) was prioritized as more decisive for a
        rarely-run offensive binary.
      kept: cue_user_actor.baseline
    - dropped: cue_user_actor.clustering_svc
      reason: >-
        Service-principal sibling of the dropped cue_user_actor.clustering pair; dropped together to
        keep the pair intact and hold the question budget.
      kept: cue_user_actor.baseline_svc
    - dropped: cue_process_tool.baseline
      reason: >-
        Generic Image-scoped frequency is subsumed by the reflected baseline_deviation (host, rule
        pattern) and user_actor.baseline (user, binary). The reflected forms enforce the rule's
        actual firing pattern, which is more precise.
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.clustering
      reason: >-
        Broad host-wide tool clustering subsumed by discovery_recon.discovery_burst_detection (recon
        burst on host) and cue_host_context.precursor (prior alerts on host).
      kept: discovery_recon.discovery_burst_detection
    - dropped: cue_host_context.clustering
      reason: >-
        Same-host activity clustering overlaps discovery_recon.discovery_burst_detection and
        cue_host_context.precursor; dropped to hold budget.
      kept: discovery_recon.discovery_burst_detection
