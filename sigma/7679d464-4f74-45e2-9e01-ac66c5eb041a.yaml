name: HackTool - SecurityXploded Execution
id: 452d3dc5-a7f6-4aa2-80e8-efdccb93291e
description: |
  Detects execution of credential-recovery and password-dump utilities published under the SecurityXploded name. The rule
  fires when a process is signed with the SecurityXploded company string, or when its image name or original filename ends
  in PasswordDump.exe. These freely downloadable utilities extract credentials from browsers, mail clients, the Windows
  Credential Manager, and LSA secret stores; they are commonly repurposed verbatim by intruders after initial access because
  they are off-the-shelf and require no custom tooling. Legitimate appearances are rare and usually tied to an authorized
  assessment or a deliberate administrative recovery action. Investigation should confirm which credential store the tool
  reached, which user and parent launched it, and whether credential theft was followed by reuse of the affected accounts.
type: detection
detection_id: 7679d464-4f74-45e2-9e01-ac66c5eb041a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match a SecurityXploded credential tool by signer or filename?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the process Company
    field is SecurityXploded, or when the image name or original filename ends in PasswordDump.exe — any one of these matching
    is enough. Review the exact image path, original filename, and company string against these criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Company
- source: template:universal.host_user_context
  question: Is this user and host expected to run credential-recovery or password-dump tools?
  context: Legitimate use of credential-recovery utilities is rare and usually tied to a specific recovery task on a known
    administrative workstation. Knowing whether the user role and host function are consistent with running this class of
    tool is often the fastest path to separating an authorized recovery action from credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this tool execution part of an authorized penetration test or red team engagement?
  context: Credential-recovery utilities are sometimes used in authorized security assessments. Before deeper analysis, check
    whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement with
    matching tool usage and timing resolves the alert without further work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: Which credential store did this tool target?
  context: SecurityXploded utilities are store-specific — different binaries read browser password databases, mail-client
    credentials, the Windows Credential Manager and Vault, wireless keys, or LSA secrets. Identifying the specific store the
    binary reaches determines which accounts may be exposed and what remediation is needed. Read the command line and the
    binary identity to infer the targeted store.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: What specific capability of this tool was invoked?
  context: These utilities ship in families targeting different secret stores, and the same launcher can chain several of
    them. The command-line arguments, the resolved binary name, and any output path reveal which credential class was harvested
    — browser passwords, mail credentials, vault entries, or LSA secrets — which determines the scope of potential compromise.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: What files did this tool write to the host?
  context: Credential-dump utilities write their harvested output to disk — text or CSV dumps of recovered passwords, often
    in the working directory or a temp/staging path. Locating these output files confirms execution, reveals what was collected,
    and shows the scope of activity even if the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1555.process_access
  question: Did this tool open a handle into another process's memory, and which process was targeted?
  context: Some credential-recovery tools read secrets directly from the memory of a running process rather than from on-disk
    stores. A handle opened into lsass.exe or a browser process, especially with read access to process memory, points to
    in-memory credential extraction. Cross-reference the source process with this alert to confirm the same binary performed
    the access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        SourceImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetImage
      - GrantedAccess
      - CallTrace
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Credential theft is frequently preceded by operators weakening protection so the dump tool runs unobstructed. The
    query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch
    AMSI/ETW. Zero rows is a useful protection-looks-healthy signal; kernel-level driver tampering and in-memory patches will
    not appear here. Populated rows shift the disposition toward operator preparation — review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.process_chain
  question: What process spawned this tool and is that parent chain expected?
  context: The parent process reveals how the tool was launched. A user-driven launch from explorer.exe or a terminal differs
    sharply from a launch by a script host, a remote-execution service, or an Office application — the latter parents point
    to delivery by a malicious document or a hands-on-keyboard operator. Walk up from the parent to see what spawned it and
    what else it spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host run this credential tool before?
  context: A binary that has never appeared on a host is more suspicious than one that runs regularly. Zero or very low historical
    counts over the trailing window indicate first-time or rare execution, which raises the priority of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the
    current alert fit?
  context: Even when a tool has run here before, the way it runs matters. The query mirrors the rule's selection scoped to
    this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run
    — not generic binary usage. A new parent process, an unexpected user account, or an unusual command structure is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Company: SecurityXploded
      - Image|endswith: PasswordDump.exe
      - OriginalFileName|endswith: PasswordDump.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this tool spawn afterward?
  context: The processes a credential tool launches reveal its actual impact. A launcher that chains additional dump utilities,
    spawns a shell, or invokes an archiver/exfiltration helper indicates the harvest extended beyond a single store. Unexpected
    children point to post-collection staging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of credential theft depends on the privilege level of the accounts whose secrets were stored on this
    host. Domain admin or service-account credentials require incident escalation; a standard user account may only need a
    password reset and monitoring. Cross-reference the affected user and any accounts whose credentials were cached here against
    directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Company: SecurityXploded
      - Image|endswith: PasswordDump.exe
      - OriginalFileName|endswith: PasswordDump.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Company: SecurityXploded
      - Image|endswith: PasswordDump.exe
      - OriginalFileName|endswith: PasswordDump.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or credential reuse across
    multiple endpoints. If the same user triggered similar activity on several hosts, the scope of compromise may be larger
    than this single detection.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Company: SecurityXploded
      - Image|endswith: PasswordDump.exe
      - OriginalFileName|endswith: PasswordDump.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
