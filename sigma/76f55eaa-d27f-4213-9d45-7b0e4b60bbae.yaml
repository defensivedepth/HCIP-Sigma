name: Service Reconnaissance Via Wmic.EXE
id: d4f5046f-9e52-4619-970f-bbb6ce298dfe
description: |
  Detects wmic.exe (or a renamed binary whose OriginalFileName is wmic.exe) invoked with a command line
  containing the word service, while excluding the WMI service-control methods (Change, Create, Delete,
  StartService, StopService, PauseService, ResumeService, SetSecurityDescriptor, UserControlService).
  This pattern reflects read-only enumeration of Win32_Service — querying whether a named service exists
  or is running — rather than modifying a service. Administrators and management scripts query service
  state routinely, so the goal of the investigation is to determine who ran the query, what service or
  remote host it targeted, whether the command reached out to a remote node, and whether the activity sits
  inside a larger reconnaissance or lateral-movement sequence.
type: detection
detection_id: 76f55eaa-d27f-4213-9d45-7b0e4b60bbae
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — wmic.exe querying service state, without a service-control method?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when the
    image ends in WMIC.exe (or the original file name is wmic.exe) AND the command line contains the word
    service AND the command line does not contain any service-control method (Change, Create, Delete,
    StartService, StopService, PauseService, ResumeService, SetSecurityDescriptor, UserControlService). Read
    the full command line and verify it is a read-only service query rather than a service modification.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enumerate service state through WMI?
  context: Service-state queries are common in monitoring, inventory, and troubleshooting workflows. Knowing
    whether the user's role and the host's function include WMI-based service enumeration is often the fastest
    way to separate routine administration from operator reconnaissance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this wmic invocation query — which service, which WMI namespace, and was a remote node targeted?
  context: Decode the full command line. Identify the service name or filter being queried, any namespace
    override, and whether a remote-node argument points the query at a remote host. A query naming a specific
    third-party or security service, or targeting a remote node, carries more weight than a local query for a
    generic service. The remote-node target and any remote IP or hostname are the pivot for the network and
    cross-host questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this wmic invocation and is that parent chain expected?
  context: The parent process reveals how the query was launched. Interactive use from explorer.exe or a
    console, or a scheduled monitoring agent, is expected. Parents such as wscript.exe, mshta.exe, an Office
    application, or a remote-execution service handler suggest the query was driven by something other than a
    human administrator.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how this specific firing pattern — wmic service queries excluding service-control
    methods — has historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: service
      filter_main_win32_methods:
        CommandLine|contains:
        - Change
        - Create
        - Delete
        - PauseService
        - ResumeService
        - SetSecurityDescriptor
        - StartService
        - StopService
        - UserControlService
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this wmic invocation spawn afterward?
  context: A read-only service query has no legitimate need to spawn child processes. Children such as cmd.exe,
    powershell.exe, or a remote-access tool launched immediately after the query indicate the reconnaissance was
    a precursor to execution rather than a standalone lookup.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this firing pattern rather than generic wmic usage. Many hosts firing the same pattern points to a
    monitoring agent or management script; a single host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: service
      filter_main_win32_methods:
        CommandLine|contains:
        - Change
        - Create
        - Delete
        - PauseService
        - ResumeService
        - SetSecurityDescriptor
        - StartService
        - StopService
        - UserControlService
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: service
      filter_main_win32_methods:
        CommandLine|contains:
        - Change
        - Create
        - Delete
        - PauseService
        - ResumeService
        - SetSecurityDescriptor
        - StartService
        - StopService
        - UserControlService
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: service
      filter_main_win32_methods:
        CommandLine|contains:
        - Change
        - Create
        - Delete
        - PauseService
        - ResumeService
        - SetSecurityDescriptor
        - StartService
        - StopService
        - UserControlService
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated reconnaissance.
    If the same user queried service state or ran other tools on multiple endpoints in this window, the scope of
    the activity may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: service
      filter_main_win32_methods:
        CommandLine|contains:
        - Change
        - Create
        - Delete
        - PauseService
        - ResumeService
        - SetSecurityDescriptor
        - StartService
        - StopService
        - UserControlService
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to the
    query and what followed it. Look for additional reconnaissance, credential access, or lateral-movement tooling
    that places the service query inside a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, credential access, or other reconnaissance —
    may reveal the stages that preceded this query and help reconstruct the timeline. Service enumeration often
    sits between an initial foothold and a follow-on action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.renamed_binary_check
  question: Was wmic.exe executed from its expected System32 path?
  context: wmic.exe normally lives in C:\Windows\System32\wbem. The rule also fires when the original file name
    is wmic.exe but the image name differs, which indicates a copied or renamed binary. Execution from a user
    temp directory, a download folder, or any path outside System32 or SysWOW64 suggests the binary was relocated
    to evade path-based allowlists. Compare Image against OriginalFileName.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this rule's wmic pattern over the past 90 days, and what command-line structures are typical?
  context: A wmic service-query pattern with no prior history on a host is more notable than one used daily under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects
    the rule's specific firing pattern rather than generic wmic usage. The command-line projection lets you
    compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: service
      filter_main_win32_methods:
        CommandLine|contains:
        - Change
        - Create
        - Delete
        - PauseService
        - ResumeService
        - SetSecurityDescriptor
        - StartService
        - StopService
        - UserControlService
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were other discovery or proxy-execution LOLBins used on this host recently?
  context: Operators who enumerate services through wmic often pair it with other living-off-the-land binaries for
    discovery or code execution. Finding additional LOLBins active on the host in the same window strengthens the
    case that the service query is one step in a hands-on-keyboard sequence rather than an isolated administrative
    lookup. wmic itself is excluded from the list to avoid re-displaying the triggering tool.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\schtasks.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\tasklist.exe'
          - '\systeminfo.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: attack:T1047.network_connection
  question: Did wmic open a remote connection to a service-control RPC endpoint around the time of the alert?
  context: A wmic service query that targets a remote node performs the lookup over DCOM/RPC, producing an
    outbound connection from wmic.exe to the remote host's endpoint mapper (TCP 135) and a dynamic high RPC port.
    A local-only query produces no remote connection. An outbound connection to an unexpected internal host is a
    strong sign the query was remote reconnaissance ahead of lateral movement; correlate the destination against
    the remote-node target read from the command line.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \WMIC.exe
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - User
- source: attack:T1047.wmi_provider
  question: Do the WMI activity logs on this host show the corresponding Win32_Service query, and did it run locally or against a remote node?
  context: WMI operational logging records provider operations independently of process telemetry, capturing the
    namespace and query text even when command-line visibility is limited. Confirm the root\cimv2 Win32_Service
    operation that corresponds to this alert and read whether it executed against the local host or a remote node.
    If WMI activity logs are not ingested in this environment, treat zero results as a visibility gap rather than
    evidence the query did not run, and fall back to decoding the command line read from the triggering event.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - User
      - Operation
      - Query
      - Namespace
