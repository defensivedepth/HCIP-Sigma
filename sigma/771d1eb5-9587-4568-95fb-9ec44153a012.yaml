name: PUA - NSudo Execution
id: 4f506dbb-078a-4dba-8671-d7c6107989cb
description: |
  Fires when a process whose Image or OriginalFileName is NSudo (NSudo.exe, NSudoLC.exe, or NSudoLG.exe)
  runs AND its command line carries a token, privilege, integrity, or window-mode switch (for example -U:S,
  -U:T, -P:E, -M:S, or -ShowWindowMode:Hide, including the "=" and "/" switch variants). NSudo is a portable,
  typically unsigned elevation utility that launches an arbitrary process under the SYSTEM or TrustedInstaller
  token without creating a service, so an operator who already holds local admin can use it to bypass
  ACL-protected files and registry keys far more quietly than service-creating tools. Legitimate use does
  occur (administrators or bundled installers such as Dism++ and MSMG ToolKit), so the investigation should
  establish who launched it, under which token, what the elevated process then did, and whether the activity
  is sanctioned.
type: detection
detection_id: 771d1eb5-9587-4568-95fb-9ec44153a012
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Is the NSudo binary running with a token, privilege, integrity, or window-mode switch?
  context: Confirm the alert before investing time. The rule fires only when both an NSudo binary
    (by Image or OriginalFileName) AND an elevation switch are present, so check the exact command line and
    process details against that combination. Switches accept "-", "=", or "/" forms, so -U:S, -U=S, and
    /U:S are equivalent; -ShowWindowMode:Hide indicates the elevated process was launched hidden.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a SYSTEM/TrustedInstaller elevation tool?
  context: Legitimate administrative work can trigger this detection. Knowing whether the account and the host
    role are consistent with running an elevation utility that launches processes under SYSTEM or
    TrustedInstaller is often the fastest way to separate sanctioned administration from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is NSudo on the organization's approved software list?
  context: Many organizations restrict which privilege-elevation and administration utilities are sanctioned.
    NSudo is a portable, frequently unsigned tool that needs no installation, so its presence outside an
    approved toolset may represent shadow IT or operator-staged tooling regardless of the tool's reputation.
    Confirm whether NSudo is authorized for this host and role.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a change ticket or maintenance window explaining this elevation?
  context: Sanctioned use of an elevation tool usually maps to a documented task such as a software deployment,
    a registry or file repair under a protected key, or a scheduled maintenance window. If no such context
    exists for this execution, the tool may have been staged by an operator to bypass SYSTEM-owned ACLs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What did this NSudo invocation actually do? Decode every switch and the target program.
  context: The full command line reveals the operation. Decode the token target (-U:S System, -U:T
    TrustedInstaller, -U:C current user, -U:P current process, -U:D dropped rights), the privilege flag
    (-P:E enables all privileges), the integrity level (-M:S System, -M:H High), the window mode, and the
    program and arguments that follow. The launched program is the real payload here; -U:S followed by
    cmd.exe means an interactive SYSTEM shell.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned NSudo and is that parent chain expected?
  context: The parent reveals how NSudo was invoked. Interactive administration usually descends from
    explorer.exe or a console; invocation from a script host, an Office application, or a remote-execution
    service is a stronger signal of operator or automated abuse. Walk up to the parent's own parent to see
    what set up the elevation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What processes did NSudo launch afterward, and under what token did they run?
  context: NSudo's purpose is to start another process under an elevated token, so its children are the actual
    impact. Look for cmd.exe, powershell.exe, reg.exe, or other tooling spawned just after the alert; an
    elevated shell or a process touching SYSTEM-owned files and registry keys is what the elevation enables.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- source: attack:T1569.002.service_registration
  question: Was a new Windows service installed on this host around the time of the alert?
  context: Service execution is the tagged technique, and an operator who has elevated to SYSTEM or
    TrustedInstaller can register a service that survives reboots or runs an arbitrary binary. Review service
    installation events on this host in the surrounding window; a new service whose image is a non-standard
    path or a recently dropped binary, correlated with the elevation, indicates the elevation was used to
    establish a service-based foothold.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4697
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - ServiceType
      - SubjectUserName
- source: attack:T1569.002.service_key
  question: Were service registry keys created or modified on this host around the time of the alert?
  context: Service definitions live under the service control registry hive, and a SYSTEM/TrustedInstaller
    token grants write access to keys an ordinary admin cannot reach. Look for new or changed service keys
    (ImagePath, Start, or Type values) in the alert window; changes that point a service at a non-standard
    binary or flip its start type are how service abuse and persistence are configured after elevation.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\System\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired the NSudo pattern, what parents and users drove it, and does this
    alert fit?
  context: Even sanctioned tools get abused. This query mirrors the rule's selection (NSudo binary AND an
    elevation switch) scoped to this host, so the parent/user distribution reflects how this specific firing
    pattern has run here historically. A new parent, an unexpected account, or an unusual command-line structure
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \NSudo.exe
        - \NSudoLC.exe
        - \NSudoLG.exe
      - OriginalFileName:
        - NSudo.exe
        - NSudoLC.exe
        - NSudoLG.exe
      selection_cli:
        CommandLine|contains:
        - '-U:S '
        - '-U:T '
        - '-U:E '
        - '-P:E '
        - '-M:S '
        - '-M:H '
        - '-U=S '
        - '-U=T '
        - '-U=E '
        - '-P=E '
        - '-M=S '
        - '-M=H '
        - -ShowWindowMode:Hide
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \NSudo.exe
        - \NSudoLC.exe
        - \NSudoLG.exe
      - OriginalFileName:
        - NSudo.exe
        - NSudoLC.exe
        - NSudoLG.exe
      selection_cli:
        CommandLine|contains:
        - '-U:S '
        - '-U:T '
        - '-U:E '
        - '-P:E '
        - '-M:S '
        - '-M:H '
        - '-U=S '
        - '-U=T '
        - '-U=E '
        - '-P=E '
        - '-M=S '
        - '-M=H '
        - -ShowWindowMode:Hide
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \NSudo.exe
        - \NSudoLC.exe
        - \NSudoLG.exe
      - OriginalFileName:
        - NSudo.exe
        - NSudoLC.exe
        - NSudoLG.exe
      selection_cli:
        CommandLine|contains:
        - '-U:S '
        - '-U:T '
        - '-U:E '
        - '-P:E '
        - '-M:S '
        - '-M:H '
        - '-U=S '
        - '-U=T '
        - '-U=E '
        - '-P=E '
        - '-M=S '
        - '-M=H '
        - -ShowWindowMode:Hide
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or multi-host activity.
    If the same user triggered similar elevation or administration activity on several endpoints in the
    window, the scope of the activity may be broader than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \NSudo.exe
        - \NSudoLC.exe
        - \NSudoLG.exe
      - OriginalFileName:
        - NSudo.exe
        - NSudoLC.exe
        - NSudoLG.exe
      selection_cli:
        CommandLine|contains:
        - '-U:S '
        - '-U:T '
        - '-U:E '
        - '-P:E '
        - '-M:S '
        - '-M:H '
        - '-U=S '
        - '-U=T '
        - '-U=E '
        - '-P=E '
        - '-M=S '
        - '-M=H '
        - -ShowWindowMode:Hide
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the stages that preceded the elevation and help
    reconstruct the timeline that led to NSudo being run.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Elevating to SYSTEM or TrustedInstaller is a common precursor to weakening protection, and the
    elevation makes ACL-protected security configuration reachable. This query surfaces direct attempts to
    disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero
    rows is a useful "protection looks healthy" signal; populated rows shift the disposition toward operator
    preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired the NSudo pattern in the past week, and does the distribution look like
    automation or one-off activity?
  context: This query mirrors the rule's selection (NSudo binary AND an elevation switch) with no host scope,
    so the result is a fleet-wide count of the firing pattern rather than generic NSudo usage. Many hosts
    firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated
    set points to manual operator activity. Use the host distribution and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \NSudo.exe
        - \NSudoLC.exe
        - \NSudoLG.exe
      - OriginalFileName:
        - NSudo.exe
        - NSudoLC.exe
        - NSudoLG.exe
      selection_cli:
        CommandLine|contains:
        - '-U:S '
        - '-U:T '
        - '-U:E '
        - '-P:E '
        - '-M:S '
        - '-M:H '
        - '-U=S '
        - '-U=T '
        - '-U=E '
        - '-P=E '
        - '-M=S '
        - '-M=H '
        - -ShowWindowMode:Hide
      condition: all of selection_*
    fields:
    - host.name
