name: Suspicious Registry Modification From ADS Via Regini.EXE
id: 19ca801f-6081-43f6-8037-6e07e7bc9dcb
description: |
  Detects regini.exe invoked with a command line that references an NTFS Alternate Data Stream (a non-drive-letter colon
  where a filename path is expected), which lets regini.exe apply registry changes from a script hidden inside another
  file's stream. The rule fires when the process is regini.exe (by image name or original filename) AND the command line
  contains the ADS colon pattern. Legitimately, regini.exe applies registry settings from plain text files during
  administration; pulling its input from an ADS hides the script from directory listings and most file-walking tools, a
  pattern associated with staging payloads off the visible filesystem. Determine which registry keys and values were
  written, what parent launched regini.exe, and whether the change establishes persistence or weakens defenses.
type: detection
detection_id: 77946e79-97f1-45a2-84b4-f37b5c0d8682
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show regini.exe reading from an Alternate Data Stream, with the ADS colon pattern present?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires the process to be
    regini.exe (by image name or original filename) AND a command line containing a colon used as an ADS separator (a colon
    not followed by a space or backslash, e.g. file.txt:hidden.ini). Confirm the full path argument actually references a
    stream rather than an ordinary file before proceeding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to apply registry changes with regini.exe from a stream-hosted script?
  context: Legitimate administrative use of regini.exe applies settings from plain text files, typically on servers or by
    IT staff during provisioning. Reading the script from an ADS is uncommon in routine administration. Knowing whether this
    user role and host function involve scripted registry administration is often the fastest way to separate routine
    operations from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: Registry configuration changes, especially those establishing persistence or altering security settings, are
    commonly governed by change control. A corresponding ticket suggests authorized provisioning; its absence when policy
    requires one suggests the action was unauthorized. This check can quickly close a false positive or escalate a true
    positive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:parent_child.parent_process_legitimacy
  question: Is the parent expected to spawn regini.exe, and what started that parent?
  context: The parent-child relationship is the core attribution signal — registry-modification analytics ask who modified
    the key. Legitimate regini.exe usually descends from an interactive shell, a provisioning script, or a management tool.
    Tracing the parent's own origin reveals whether the chain is legitimate (an admin ran a setup script) or suspicious
    (a script host, Office application, or LOLBin launched it). An interpreter or document-handler parent reading an ADS
    script is the deviation worth chasing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn around this time?
  context: If the parent that launched regini.exe is suspicious, it likely spawned other processes too. Sibling processes
    reveal the full scope of activity from that parent — multiple LOLBins or interpreters from the same parent in a short
    window points to orchestrated activity rather than an isolated administrative action.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:registry.registry_key_context
  question: What specific registry key and value did regini.exe write, and is it a known persistence or evasion location?
  context: The registry path reveals intent. Run/RunOnce keys indicate persistence; keys under Windows Defender policy paths
    indicate security-tool tampering; Image File Execution Options keys indicate debugger-based hijacking; Winlogon
    Userinit/Shell/Notify keys indicate logon persistence. Because the input script came from an ADS, the key paths and value
    data are not visible in a plain directory listing — the registry_set event captures what was actually written. The
    specific value name and data determine what executes or what setting changes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: An actor who modifies one registry key often modifies several — setting a Run key for persistence while also
    disabling Defender or altering firewall rules. Finding a cluster of registry writes from the same host within a short
    window reveals the full scope of configuration changes and whether multiple objectives were pursued alongside the
    stream-hosted change.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
          - '\regini.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
          - ':'
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:registry.registry_value_persistence_check
  question: Does the registry change reference an executable or script, and is that payload present on disk?
  context: Registry persistence is only effective if the referenced payload exists at the path written to the value. Examine
    the registry value data to identify any executable or script it points to, then verify whether that file exists on disk
    and analyze its hash. Note that the payload itself may also be hidden in an Alternate Data Stream, so a plain directory
    listing may not show it.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - Hashes
- source: attack:T1112.follow_on
  question: What processes did regini.exe spawn or get followed by on this host shortly after the registry change?
  context: Registry-modification chains are often followed by a service restart or a fresh process execution that activates
    the change. Surfacing what ran immediately after regini.exe — and what regini.exe itself spawned — shows whether the
    write was inert configuration or the trigger for an executing payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this regini.exe ADS pattern, what parents and users drove it, and does the
    current alert fit?
  context: Even tools with legitimate uses can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here, not
    generic regini.exe usage. A new parent process, an unexpected user account, or an unusual command-line shape is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regini.exe
      - OriginalFileName: REGINI.EXE
      selection_re:
        CommandLine|re: :[^ \\]
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run regini.exe to apply registry changes?
  context: Compare this user's current action against their historical behavior. A user who has never run regini.exe — let
    alone against a stream-hosted script — is more suspicious than one who does so as part of routine administration. The
    user's role and typical toolset should align with scripted registry modification.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and regini.exe combination historically routine on this host or across the environment, or is the
    parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute the behavior; the meaningful pivot
    is which parent process launched regini.exe and whether that pair is historically common. A new or rare parent for
    regini.exe on this host or environment-wide is the deviation worth chasing; a pair that already accounts for many prior
    events is provisioning or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar registry or LOLBin activity on other hosts, the scope of the operation may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and regini.exe combination fire on other hosts in the same window, or is the activity isolated
    to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — the parent process and spawned regini.exe — fired on other
    hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    payload staging — may reveal the stages that preceded this registry change and help reconstruct the timeline. Defense
    tampering and persistence installation often appear together in a multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.file_based_persistence
  question: Were files dropped to persistence locations such as the Startup folder or Run key paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup
    folder or a path referenced by a registry Run key achieves persistence without further tool execution. File event
    monitoring captures these drops even when the artifact is staged through an Alternate Data Stream that a directory
    listing would not show.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
