name: Portable Gpg.EXE Execution
id: dfd8e9ef-cc6f-4701-875c-e1ac7b61e918
description: |
  Detects gpg.exe or gpg2.exe (or a binary whose embedded OriginalFileName / Description identifies it as GnuPG's
  OpenPGP tool) executing from a path outside the known GnuPG / Gpg4win install directories. Portable GnuPG is a
  legitimate developer and IT tool, but loaders and ransomware copy a standalone gpg.exe into user-writable or temp
  directories to encrypt victim files or to wrap a per-victim key with the operator's public key. The rule fires when
  the GnuPG identity matches AND the image path is NOT one of the known install locations. Investigation should
  determine whether the relocated binary is being used for routine encryption work or as the file-encryption /
  key-protection primitive in a data-impact operation.
type: detection
detection_id: 77df53a5-1d78-4f32-bc5a-0e7465bd8f41
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Is this GnuPG binary running from a path outside the known GnuPG install directories?
  context: Confirm the alert is a true positive by reviewing the process details against the rule's criteria. The
    rule fires when the Image ends in gpg.exe or gpg2.exe, OR the OriginalFileName is gpg.exe, OR the Description
    is GnuPG's OpenPGP tool, AND the image path is NOT under the legitimate install folders (GNU\GnuPG\bin, GnuPG
    VS-Desktop, GnuPG\bin, or Gpg4win\bin). Note the actual on-disk path — a temp or user-writable location is the
    portable-deployment pattern this rule targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run GnuPG from a non-standard location?
  context: Developers, packaging/signing workflows, and some IT tooling legitimately ship a portable gpg.exe. Knowing
    whether this user's role and this host's function involve OpenPGP signing or encryption is often the fastest way
    to separate routine use from a relocated binary used for file encryption.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: The file is named (or identifies itself as) gpg.exe, but the on-disk path is non-standard. Comparing the
    Image path against OriginalFileName confirms it is GnuPG, and the signing details and hash reveal whether this is
    an unmodified GnuPG release, a renamed copy, or a tampered binary. Submit the hash for reputation checking to
    distinguish a known-good GnuPG build from a novel or known-malicious sample.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this gpg invocation do? Decode the full command line.
  context: The command line reveals the OpenPGP operation. Look for -e / --encrypt (encrypt to a recipient), -c /
    --symmetric (passphrase encryption), -d / --decrypt, --import (loading an attacker public key), -r / --recipient
    (the key the data is encrypted to), --passphrase, and the input/output file paths (-o). Key import followed by
    recipient-targeted encryption of local files is the file-impact and key-protection pattern. The host+binary scope
    here surfaces sequential gpg invocations that together form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:data_staging_exfil.encryption_password
  question: Was symmetric or recipient encryption applied, and what key or passphrase was used?
  context: gpg encryption flags indicate deliberate protection of data. -c / --symmetric encrypts with a passphrase;
    -e / --encrypt with -r / --recipient encrypts to a public key whose private half the operator holds; --import
    loads that public key first. Recipient-encrypting local files to an externally controlled key, or symmetric
    encryption of business documents, is a stronger indicator of data-impact than routine signing. Note that a
    passphrase passed via stdin or a config file will not appear in the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:masquerading.binary_origin
  question: How did this gpg binary arrive on the host?
  context: A portable gpg.exe outside the install directories was copied, downloaded, extracted from an archive, or
    dropped by a parent process. Tracing the file-creation event for the binary by name over a long window reveals
    the delivery mechanism and the process that wrote it — a download tool, an installer, a copy via remote access,
    or a malware dropper. A binary written into a temp or user-writable directory was most likely downloaded or
    extracted.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this gpg execution and is that parent chain expected?
  context: The parent process shows how gpg was invoked. Routine use is typically launched by an interactive shell,
    an installer, or a signing/packaging tool. A parent like cmd.exe or powershell.exe running a script, wscript.exe,
    or an Office application points to scripted or macro-driven invocation consistent with a loader staging an
    encryption toolchain.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:data_staging_exfil.data_scope
  question: What files did this gpg process read or write on the host?
  context: File events from the gpg process show which files were actually consumed and produced — the plaintext
    inputs and the encrypted outputs. Targeting of user document folders, network shares, or large file sets points
    to bulk encryption for impact rather than signing a single artifact. The output file names and locations also
    indicate whether the result was staged for exfiltration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:cue_process_tool.baseline
  question: Does this host normally run GnuPG?
  context: A gpg binary that has never run on this host is more suspicious than one that runs regularly as part of a
    build or signing workflow. Zero or very low historical counts over 90 days indicate first-time or rare execution
    and raise the priority of the relocated-binary finding.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that
    activity, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host — the resulting parent/user
    distribution reflects how this specific firing pattern (portable GnuPG outside the install paths) has
    historically run here, not generic gpg usage. A new parent process, an unexpected user account, or an unusual
    command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - OriginalFileName: gpg.exe
      - Description: "GnuPG’s OpenPGP tool"
      filter_main_legit_location:
        Image|contains:
        - :\Program Files (x86)\GNU\GnuPG\bin\
        - :\Program Files (x86)\GnuPG VS-Desktop\
        - :\Program Files (x86)\GnuPG\bin\
        - :\Program Files (x86)\Gpg4win\bin\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:ransomware_impact.recovery_options_assessment
  question: What recovery-inhibiting commands were executed on this host?
  context: 'Data-encryption operations are frequently paired with recovery destruction: deleting shadow copies
    (vssadmin, wmic), disabling boot recovery (bcdedit), deleting backups (wbadmin), and disabling the Windows
    Recovery Environment (reagentc). This query surfaces all such commands on the host so the analyst can judge
    whether the gpg execution is part of an impact sequence. Verify whether each action succeeded by checking system
    state (vssadmin list shadows, bcdedit /enum, reagentc /info).'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- source: template:ransomware_impact.encryption_or_ransom_indicators
  question: Are there signs of mass file encryption, ransom notes, or unusual binaries running on this host?
  context: Recovery-inhibiting actions and key-wrapping typically precede or accompany file encryption by minutes.
    This query surfaces non-system binaries executing around the alert — high file-I/O processes, scripts launching
    unknown executables, or binaries running from temp or user-writable paths. Pair it with a file-event review for
    mass renames, non-standard file extensions, and ransom-note files to determine whether encryption has started and
    how far it has progressed.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - OriginalFileName: gpg.exe
      - Description: "GnuPG\u2019s OpenPGP tool"
      filter_main_legit_location:
        Image|contains:
        - :\Program Files (x86)\GNU\GnuPG\bin\
        - :\Program Files (x86)\GnuPG VS-Desktop\
        - :\Program Files (x86)\GnuPG\bin\
        - :\Program Files (x86)\Gpg4win\bin\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - OriginalFileName: gpg.exe
      - Description: "GnuPG\u2019s OpenPGP tool"
      filter_main_legit_location:
        Image|contains:
        - :\Program Files (x86)\GNU\GnuPG\bin\
        - :\Program Files (x86)\GnuPG VS-Desktop\
        - :\Program Files (x86)\GnuPG\bin\
        - :\Program Files (x86)\Gpg4win\bin\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the gpg execution is isolated or part of
    broader hands-on activity — additional encryption, data staging, or lateral movement. The same user triggering
    similar activity on multiple hosts widens the potential scope of impact.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - OriginalFileName: gpg.exe
      - Description: "GnuPG\u2019s OpenPGP tool"
      filter_main_legit_location:
        Image|contains:
        - :\Program Files (x86)\GNU\GnuPG\bin\
        - :\Program Files (x86)\GnuPG VS-Desktop\
        - :\Program Files (x86)\GnuPG\bin\
        - :\Program Files (x86)\Gpg4win\bin\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:data_staging_exfil.archive_destination
  question: Where were the encrypted output files written, and were they staged for movement off the host?
  context: Encryption for impact and encryption for exfiltration leave different trails. This query finds files
    written by the gpg binary to locate the encrypted output. If outputs land in a staging directory, follow with a
    network-connection review of the same host and window to determine whether the data was uploaded to cloud
    storage, copied to removable media, or sent to an external server.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of the rule's firing pattern — portable GnuPG outside the install paths — not generic gpg usage. Many hosts
    firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - OriginalFileName: gpg.exe
      - Description: "GnuPG’s OpenPGP tool"
      filter_main_legit_location:
        Image|contains:
        - :\Program Files (x86)\GNU\GnuPG\bin\
        - :\Program Files (x86)\GnuPG VS-Desktop\
        - :\Program Files (x86)\GnuPG\bin\
        - :\Program Files (x86)\Gpg4win\bin\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
