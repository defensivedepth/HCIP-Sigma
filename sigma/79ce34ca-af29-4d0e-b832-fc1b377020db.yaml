name: Whoami.EXE Execution From Privileged Process
id: 4b6f6b95-5ca5-4805-bd6a-269eaac426a8
description: |
  Detects whoami.exe (matched by Image or OriginalFileName) running under a privileged identity whose
  User contains AUTHORI/AUTORI (the NT AUTHORITY built-in accounts: SYSTEM, LOCAL SERVICE, NETWORK SERVICE)
  or TrustedInstaller. The rule fires when both the binary match and the privileged-user match are present.
  Running whoami as SYSTEM or TrustedInstaller is the canonical "confirm my token" step after a privilege-
  escalation primitive or a token-manipulation tool has handed an operator an elevated context, since
  interactive admins normally already know their identity. Legitimate occurrences exist — service installers,
  some management agents, and OS maintenance tasks invoke whoami under a service account — so the investigation
  determines whether the launching parent and surrounding activity look like operator hands-on-keyboard
  enumeration or routine automation.
type: detection
detection_id: 79ce34ca-af29-4d0e-b832-fc1b377020db
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-05'
questions:
- source: template:universal.verify_trigger_match
  question: Did whoami.exe run under a privileged identity (NT AUTHORITY built-in or TrustedInstaller) as the rule detects?
  context: Confirm the alert is a true positive before investing investigation time. Verify the Image or
    OriginalFileName resolves to whoami.exe and that the User field contains one of AUTHORI, AUTORI, or
    TrustedInstaller — both conditions must hold for the rule to fire.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What were the full whoami arguments, and which enumeration mode did they request?
  context: whoami runs with no arguments (current user only), or with switches that broaden what it returns —
    /all, /priv, /groups, /user, /fqdn. /priv and /all enumerate the token's privilege list (SeDebugPrivilege,
    SeImpersonatePrivilege, SeTcbPrivilege), which is the detail an operator checks after a token-manipulation
    primitive. Read the CommandLine and current directory for every whoami invocation on this host in the
    window to see whether a single benign call fired or a sequence probing the elevated token.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this privileged whoami invocation, and is that parent a normal launcher for it?
  context: The immediate parent reveals how whoami was initiated under a service identity. A service host
    (services.exe, svchost.exe) or a known management agent invoking it is routine. Spawning from cmd.exe or
    powershell.exe under a SYSTEM/TrustedInstaller token, or from a token-manipulation helper that launches
    shells outside services.exe, points to operator-driven enumeration rather than automation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.process_chain
  question: What spawned the parent process, and what else did that parent launch?
  context: Looking up the parent record by its own process GUID shows what created the launcher and what
    other children it produced. A parent that itself was spawned by an unusual process, or that launched
    shells and other discovery tools alongside whoami, reframes the enumeration as one step in a larger
    on-host operation. Long-running parents (service hosts, login sessions) often start hours or days before
    the alert, so the window is intentionally wide.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is the privileged account that ran whoami here expected to do so for this host's function?
  context: whoami under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or TrustedInstaller is produced by some
    legitimate service installers and OS maintenance, but it is also exactly what an operator runs to confirm
    a stolen elevated token. Knowing whether this host's role (a build server using TrustedInstaller, an agent
    that self-checks identity) accounts for the specific account is often the fastest path to a disposition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this same privileged account run whoami before across the environment, or is this first-time activity?
  context: Compare this account's current action against its historical pattern. A service principal that has
    a long history of invoking whoami across many hosts reflects baked-in automation; an account with zero or
    very low prior counts indicates the privileged identity was just placed into an enumeration step it does
    not normally perform.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-whoami launch mechanism historically routine on this host or environment-wide?
  context: When the alert fires under a service principal, user identity does not attribute behavior, so the
    meaningful pivot is the launch mechanism — which parent spawned whoami and whether that pair is common.
    A pair already accounting for thousands of prior events is vendor or OS automation; a new or rare parent
    for whoami on this host is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline
  question: Does this host normally run whoami at all?
  context: A binary that has never executed on a host is more suspicious than one that runs regularly. Zero
    or very low historical counts for whoami on this host indicate first-time or rare execution, which raises
    the weight of the privileged-token context.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how the rule's specific firing pattern — privileged whoami — has run here, not
    generic whoami usage. A new parent process, an unexpected privileged account, or an unusual launch shape
    against that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: whoami.exe
      - Image|endswith: \whoami.exe
      selection_user:
        User|contains:
        - AUTHORI
        - AUTORI
        - TrustedInstaller
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single whoami may be benign troubleshooting, but several discovery commands in rapid succession —
    ipconfig, net user, systeminfo, nltest, tasklist — is a signature of post-compromise enumeration. An
    operator who just confirmed an elevated token typically follows with host, account, and network discovery
    to orient before the next stage. Three or more distinct recon binaries within the window points to
    scripted enumeration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.follow_on
  question: What did whoami's parent process go on to launch after the enumeration?
  context: The processes that follow a discovery call reveal its actual purpose. After confirming an elevated
    token, operators commonly proceed to credential access, lateral movement, or payload staging — cmd.exe,
    powershell.exe, certutil.exe, or remote-execution tooling spawned by the same parent in the minutes after.
    Predictable service children point back toward automation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.clustering
  question: What else did this account do across the network around this time?
  context: Tracking the account's activity across all hosts in the window reveals lateral movement or
    enumeration spanning multiple endpoints. If the same identity drove similar activity elsewhere, the scope
    is broader than a single host. When the alert fires under a built-in service account this view is
    dominated by agent telemetry, so read it alongside the parent-plus-binary spread.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent-plus-whoami launch fire on other hosts in the same window, pointing to coordinated automation?
  context: Under a service principal, asking what the account did network-wide returns agent-telemetry noise
    because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch
    mechanism — parent process plus whoami — fired on other hosts in the alert window. Multiple hosts at once
    points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating the host's process activity by parent and child
    around the alert collapses repetitive agent noise into high-count rows while novel parent-child pairs
    stand out at low counts — that is what reveals reconnaissance, privilege escalation, or persistence
    surrounding the privileged whoami call.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    the privileged-whoami pattern rather than generic whoami usage. Many hosts firing the same pattern points
    to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: whoami.exe
      - Image|endswith: \whoami.exe
      selection_user:
        User|contains:
        - AUTHORI
        - AUTORI
        - TrustedInstaller
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, exploitation attempts, credential access —
    may reveal the privilege-escalation primitive that handed an operator the elevated token now confirming
    itself with whoami. The sequence of prior alerts reconstructs the timeline leading into this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering often precedes hands-on-keyboard operator activity. This sweep surfaces attempts to
    disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW in the
    hour before a privileged whoami call. Zero rows is a useful "protection looks healthy" signal — kernel
    driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward
    operator preparation; review the parent and signing chain of the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
