name: Potential Lateral Movement via Windows Remote Shell
id: bef78dac-89aa-4574-9486-8783c2eedafb
description: |
  Detects a child process spawned by winrshost.exe, the host process for Windows Remote Shell (WinRS) sessions over WinRM. The rule fires when ParentImage ends with \winrshost.exe AND the child is not conhost.exe. Because winrshost.exe runs commands delivered through a WinRM session, any non-conhost child indicates that an operator executed a command on this host remotely. WinRM is a built-in, administrator-trusted protocol, so legitimate remote management and IT automation produce this pattern; the investigation should determine whether the remote session was expected, where it originated, what was run, and whether the same source moved to other hosts.
type: detection
detection_id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Was this child process spawned by winrshost.exe, and is the child something other than conhost.exe?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when the parent is winrshost.exe and the child is any process other than C:\Windows\System32\conhost.exe. A non-conhost child means a command was carried into this host through a WinRM remote shell session rather than typed at a local console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
    - ParentImage
- source: template:universal.host_user_context
  question: Is this user and host expected to be managed over WinRM remote shell?
  context: WinRM remote shell is normal for IT operations against servers and managed workstations but unusual on many endpoints. Knowing whether the destination host is routinely administered remotely, and whether the acting account is an admin or automation identity, is often the fastest way to separate sanctioned remote management from an operator pivoting through a compromised host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
    - host.name
    - User
- source: template:remote_access_tool.tool_authorization
  question: Is WinRM remote shell an authorized administration method for this host, and is the source within the approved admin set?
  context: Organizations typically restrict which systems may be administered over WinRM and which jump boxes or automation hosts are allowed to initiate those sessions. A remote shell into a host that is not normally managed this way, or originating from a source outside the approved administrative set, points to shadow administration or an operator using WinRM to move laterally.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
    - Image
- source: template:cue_process_tool.mechanism_decode
  question: What command did the remote operator run in this WinRM session? Decode the full child command line.
  context: The child of winrshost.exe is the command delivered over the remote shell. Decode every flag, parameter, encoded payload, file path, and URL to understand what was executed. The query returns all process_creation on this host in a tight window so multi-step operations launched through the same session appear together rather than only the single triggering child.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
    - Image
    - CommandLine
    - CurrentDirectory
- source: template:cue_parent_process.mechanism_decode
  question: What is the winrshost.exe instance that spawned this child, and what spawned winrshost.exe?
  context: winrshost.exe is launched by the WinRM service stack (svchost hosting WinRM) when a remote shell session is created. Retrieving the parent's own process_creation event confirms the session host and lets the investigation walk upward to the service that accepted the remote connection. The -7d range is intentional because the hosting service is long-running and may have started well before the alert.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
    - Image
    - CommandLine
    - ParentImage
- source: template:cue_parent_process.follow_on
  question: What other processes did winrshost.exe spawn on this host in this session?
  context: A remote operator commonly runs several commands in one session - reconnaissance, then credential access or tool staging, then lateral movement. Listing every child of winrshost.exe on this host reveals the full set of actions carried in through the remote shell, not just the one child that tripped the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
    - Image
    - CommandLine
- source: template:cue_parent_process.baseline
  question: Does this host normally see winrshost.exe spawn child processes?
  context: Hosts that are routinely administered over WinRM will show a steady history of winrshost.exe spawning children; hosts that are not will show little or none. Zero or very low historical counts mark this as a novel remote-shell pattern on this host and raise the priority of identifying the source.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
    - Image
- source: template:lateral_movement.source_host_identification
  question: What host initiated this WinRM connection, and is it an expected administrative source?
  context: Lateral movement has a source and a destination. WinRM sessions arrive over TCP 5985 (HTTP) or 5986 (HTTPS). Identifying the originating host on those ports reveals whether the session came from a known admin jump box or from an unexpected, possibly compromised, internal system being used as a pivot.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
        - 445
        - 135
        - 3389
        - 5985
        - 5986
        - 22
      condition: selection
    fields:
    - SourceIp
    - DestinationPort
- source: attack:T1021.006.user_context
  question: What remote logon authenticated this WinRM session on the destination host, and which account and source address did it use?
  context: A WinRM remote shell is preceded by a network or delegated logon (Security events 4624 type 3, or 4648 explicit credentials) close in time to winrshost.exe starting. Correlating the logon establishes who authenticated, from which address, and whether the account is an admin, a service account, or an identity that should not be reaching this host remotely. If Security logs are not ingested in this environment, treat the absence of results as a visibility gap rather than evidence no logon occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
        - 4624
        - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
    - TargetUserName
    - IpAddress
    - LogonType
    - EventID
- source: template:lateral_movement.authentication_method
  question: What authentication method backed this session -- legitimate credentials, pass-the-hash, or a Kerberos ticket?
  context: The authentication method shows how access was obtained. NTLM network logons with no preceding interactive logon for the account suggest pass-the-hash; Kerberos with anomalous ticket properties suggests pass-the-ticket. Legitimate credential use points to passwords obtained through dumping, phishing, or prior compromise. WinRM accepts both NTLM and Kerberos, so the logon detail distinguishes them.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
    - User
    - CommandLine
- source: template:lateral_movement.target_activity_after_access
  question: What processes were spawned on this host after the remote session was established?
  context: Remote access is a means to an end. Examining process activity in the window after the WinRM session opened reveals the operator's objectives on this host - command execution, tool deployment, or data access. Children launched under winrshost.exe and any descendants are the post-access activity to focus on.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
    - User
    - Image
- source: template:lateral_movement.lateral_movement_scope
  question: Has this account moved to other hosts using remote-execution tooling?
  context: Operators rarely stop at one target. If the same account is launching remote-execution and lateral-movement tooling across multiple systems in a short window, the scope of compromise is larger than this host. Connections fanning out from a single account indicate active lateral movement across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - '\psexec.exe'
        - '\psexec64.exe'
        - '\mstsc.exe'
        - '\ssh.exe'
        - '\plink.exe'
        - '\wmic.exe'
        - '\winrs.exe'
      condition: selection and selection_lateral
    fields:
    - host.name
    - Image
- source: template:cue_user_actor.baseline
  question: Does this user normally drive WinRM remote shell activity?
  context: Compare the acting account against its own history. An account that has never originated or received remote-shell sessions is more suspicious than one that does so routinely as part of an admin or automation role. Pair this with knowledge of the account's expected function.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is winrshost.exe spawning this child historically routine on this host or across the environment?
  context: When the alert fires under a service or computer account, user identity does not attribute behavior. The meaningful pivot is the launch mechanism - how often winrshost.exe has spawned this child across hosts. A pair that already accounts for many prior events is routine remote management; a new or rare pairing is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of this alert?
  context: After identifying the acting account, check its activity across all hosts in the same window. The same account triggering remote-shell or follow-on activity on several endpoints points to an active multi-host operation rather than an isolated session.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
    - host.name
    - Image
- source: template:cue_user_actor.clustering_svc
  question: Did winrshost.exe spawn this same child on other hosts in the same window -- a coordinated rollout, or isolated to this host?
  context: Under a service or computer account, asking what the user did network-wide returns agent-telemetry noise. The meaningful question is whether the same launch mechanism - winrshost.exe spawning this child - fired on other hosts in the alert window. Multiple hosts point to scripted or pushed remote execution; a single host points to a host-local session.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Remote-shell lateral movement usually sits in the middle of a chain. Earlier detections on this host - reconnaissance, credential access, or defense tampering - may reveal the stages that preceded the session and help reconstruct who reached this host and why.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
    - event.severity_label
    - rule.name
    - rule.uuid
