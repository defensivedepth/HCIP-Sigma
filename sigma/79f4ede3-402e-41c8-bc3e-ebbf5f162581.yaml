name: HackTool - Empire PowerShell Launch Parameters
id: d9a5b3ee-773b-4c74-8e6e-f7a2c8287d28
description: |
  Detects PowerShell command lines carrying the launch-parameter signatures used by the Empire
  post-exploitation framework — combinations such as -NoP -sta -NonI -W Hidden -Enc, -noP -sta -w 1 -enc,
  -nop -exec bypass -EncodedCommand, and the -enc SQB prefix that marks a base64-encoded UTF-16LE script.
  The rule fires when the command line matches any one of these flag combinations, which together disable the
  profile, run non-interactively in a hidden window, and pass an encoded payload — a launch shape that
  legitimate administration rarely produces. The investigation should decode the encoded command to recover
  the actual payload, confirm what spawned the PowerShell process, and determine whether security controls
  were weakened beforehand and what executed afterward.
type: detection
detection_id: 79f4ede3-402e-41c8-bc3e-ebbf5f162581
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match one of the Empire launch-parameter combinations this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when any
    one of the flag combinations is present — for example -NoP -sta -NonI -W Hidden -Enc, -noP -sta -w 1 -enc,
    -nop -exec bypass -EncodedCommand, or the -enc SQB prefix that marks a base64-encoded UTF-16LE script.
    These flags together disable the profile, run non-interactively in a hidden window, and pass an encoded
    payload. Verify the full command before investing further time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run PowerShell with a hidden, non-interactive, encoded-command
    launch?
  context: Legitimate administration occasionally uses -EncodedCommand for quoting safety, but the full Empire
    shape — profile disabled, single-threaded apartment, non-interactive, hidden window, and an encoded payload
    together — is rarely produced by routine tooling. Knowing whether the user role and host function include
    automation that launches PowerShell this way is often the fastest way to separate a true positive from a
    rare benign artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this Empire-style PowerShell launch part of an authorized penetration test or red team
    engagement?
  context: The launch parameters this rule matches are produced by an offensive post-exploitation framework
    used in authorized security assessments. Before investing analysis time, check whether a penetration test
    or red team exercise is currently active on this host or network segment. An authorized engagement with
    matching timing resolves the alert without further work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which Empire launch variant fired, and does the encoded payload point to an agent stager, a module,
    or persistence?
  context: The matched flag combination indicates how the framework was invoked — the -enc SQB prefix marks a
    base64-encoded UTF-16LE script, while -exec bypass -EncodedCommand and the hidden-window variants are common
    stager and module launch shapes. Identify which variant fired, then read the decoded payload to classify the
    operation as an initial agent stager, a follow-on module, or a persistence routine. The capability invoked
    determines the scope of potential compromise and the required response.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: Decode the -Enc / -EncodedCommand payload. What PowerShell does this command actually run?
  context: The encoded argument hides the real script. Base64-decode it (the payload is UTF-16LE, and an -enc
    value beginning with SQB decodes to a string starting with "I"), then read the reconstructed command. The
    decoded result is the real payload — look for a download cradle, an in-memory .NET loader, a reverse shell,
    or a keying/staging routine. Because powershell.exe is too common to scope by binary, the lookup is keyed to
    the alerting event itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: What does the base64-encoded command decode to, and does the decoded script reveal a download
    cradle, a loader, or a reverse shell?
  context: The -Enc / -EncodedCommand argument carries a base64-encoded UTF-16LE script. Decode it to read the
    actual payload. Empire stagers typically reconstruct a download cradle or load a .NET assembly directly into
    memory; iterate the decode if the inner script is itself obfuscated with concatenation or backtick escaping.
    The final layer reveals the real intent — a stager beacon, an in-memory module, or a reverse shell.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually
    executes, even when the launch line passes only an encoded blob. This is ground truth that bypasses the
    encoding. If PowerShell operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Encoded launchers are commonly paired with controls that reduce visibility or restrictions — AMSI
    bypass (patching amsi.dll in memory), execution-policy changes, a downgrade to PowerShell v2 which lacks
    modern logging, or Defender preference changes. The Empire launch parameters already carry -exec bypass in
    one variant; finding additional tamper or downgrade events in the hour before execution strengthens the case
    for malicious intent.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell, and is that parent chain expected?
  context: The parent reveals how the launcher was invoked. Interactive use under explorer.exe or a console
    differs sharply from a spawn by mshta.exe, wscript.exe, rundll32.exe, an Office application, or a web-server
    worker process — those parents point to a macro, exploit, or scripted delivery rather than an operator at the
    keyboard. Walk up to the parent's own parent if the immediate spawner is itself a generic shell.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1059.001.time_correlation
  question: Did this launch occur outside normal administrative or maintenance windows for this host?
  context: Encoded, hidden-window PowerShell launches that occur off-hours, during a lateral-movement window, or
    outside any scheduled maintenance window weigh toward operator activity rather than routine automation.
    Compare the alert timestamp against the host's known patch and automation schedule and against the user's
    typical working hours. A launch in the middle of the night on a workstation that is otherwise idle is more
    concerning than one inside a recurring job window.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell spawn afterward?
  context: The processes spawned after the encoded launch reveal its actual impact. A stager that launches
    another powershell.exe, cmd.exe, certutil.exe, rundll32.exe, or an unexpected binary indicates post-execution
    activity rather than a self-contained command. The lookup is keyed to the alerting process so the children
    are attributable to this exact execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell with these Empire launch parameters?
  context: Compare this user's current action against their historical behavior. A user who has never launched
    PowerShell with this encoded, hidden-window flag shape is more suspicious than one for whom it recurs as part
    of a known routine. The query counts how often this user has triggered the same launch pattern across all
    hosts over 90 days; user role and typical toolset should align with the result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains:
          - ' -NoP -sta -NonI -W Hidden -Enc '
          - ' -noP -sta -w 1 -enc '
          - ' -NoP -NonI -W Hidden -enc '
          - ' -noP -sta -w 1 -enc'
          - ' -enc  SQB'
          - ' -nop -exec bypass -EncodedCommand '
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent-process and launch-parameter pattern historically routine on this host or across the
    environment, or is the parent unusual for it?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the
    meaningful pivot is the launch mechanism. The query counts how often this same parent process has driven the
    Empire launch pattern over 90 days, grouped by host. A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or operating-system
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains:
          - ' -NoP -sta -NonI -W Hidden -Enc '
          - ' -noP -sta -w 1 -enc '
          - ' -NoP -NonI -W Hidden -enc '
          - ' -noP -sta -w 1 -enc'
          - ' -enc  SQB'
          - ' -nop -exec bypass -EncodedCommand '
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on
    multiple endpoints. If the same user drove similar activity elsewhere in the same window, the scope of the
    incident may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and launch-parameter pattern fire on other hosts in the same window, or is the
    activity isolated to this host?
  context: Under a service principal, asking what else the user did returns agent-telemetry noise because every
    host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism — the
    parent process driving this launch pattern — fired on other hosts in the alert window. Multiple hosts point to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains:
          - ' -NoP -sta -NonI -W Hidden -Enc '
          - ' -noP -sta -w 1 -enc '
          - ' -NoP -NonI -W Hidden -enc '
          - ' -noP -sta -w 1 -enc'
          - ' -enc  SQB'
          - ' -nop -exec bypass -EncodedCommand '
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this Empire launch pattern, what parents and users normally drive
    it, and does the current alert fit?
  context: Even rare patterns can have a benign explanation on a given host. The query mirrors the rule's
    selection scoped to this host, so the resulting parent and user distribution reflects how this specific launch
    pattern — not generic PowerShell usage — has historically run here. Deviations such as a new parent process,
    an unexpected user account, or a first-ever appearance are the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ' -NoP -sta -NonI -W Hidden -Enc '
        - ' -noP -sta -w 1 -enc '
        - ' -NoP -NonI -W Hidden -enc '
        - ' -noP -sta -w 1 -enc'
        - ' -enc  SQB'
        - ' -nop -exec bypass -EncodedCommand '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this Empire launch pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the
    Empire launch pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to
    scripted deployment or a shared offensive toolkit; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ' -NoP -sta -NonI -W Hidden -Enc '
        - ' -noP -sta -w 1 -enc '
        - ' -NoP -NonI -W Hidden -enc '
        - ' -noP -sta -w 1 -enc'
        - ' -enc  SQB'
        - ' -nop -exec bypass -EncodedCommand '
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the attack stages that preceded this encoded PowerShell
    launch and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
