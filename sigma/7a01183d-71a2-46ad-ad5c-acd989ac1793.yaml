name: UAC Bypass Abusing Winsat Path Parsing - Process
id: 88beabc6-b4e5-4704-a7ba-ce2d95f73789
description: |
  Detects the child-process signature of a UAC bypass that abuses a path-parsing flaw in winsat.exe. The rule
  fires when a process is spawned at High or System integrity by a parent winsat.exe located under
  \AppData\Local\Temp\system32\winsat.exe whose own command line references the real C:\Windows \system32\winsat.exe
  path (note the space). The technique plants a copy of winsat.exe in a user-writable directory whose layout
  mimics the trusted system path; the auto-elevated winsat then loads an attacker-controlled DLL and spawns a
  child at elevated integrity without a consent prompt. Legitimately, winsat.exe runs from System32 under SYSTEM
  during assessments and does not live under a user's Temp directory. Investigation should confirm the parent
  path and command line, identify the elevated child and what it did, find the planted winsat.exe and the DLL it
  loaded, and determine whether the elevated session was used to install persistence, dump credentials, or tamper
  with security tooling.
type: detection
detection_id: 7a01183d-71a2-46ad-ad5c-acd989ac1793
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Was this process spawned at high or system integrity by a winsat.exe running from a user Temp directory that referenced the real system path?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when ALL
    of these hold for the same event - the integrity level is High or System (or the equivalent SIDs S-1-16-16384
    / S-1-16-12288), the parent image ends in \AppData\Local\Temp\system32\winsat.exe, and the parent command
    line references C:\Windows \system32\winsat.exe (the trailing space after Windows is the path-parsing trick).
    Read the parent image and parent command line and verify all three are present rather than an unrelated winsat
    invocation from System32.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - IntegrityLevel
- source: template:universal.host_user_context
  question: Is this user and host expected to run winsat.exe from a user-writable directory and elevate from it?
  context: Legitimate winsat.exe assessments run from System32 under SYSTEM, not from a user's AppData\Local\Temp
    tree. Knowing whether this user role and host function ever legitimately stage and run binaries from a Temp
    directory is often the fastest way to separate a true positive from an unusual but benign action. A standard
    workstation account elevating through a relocated system binary is rarely expected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: A UAC bypass is a privilege-escalation step, and operators frequently weaken protection before or
    around hands-on actions. This query surfaces direct attempts to disable AV/EDR services, flip Defender flags,
    add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal -
    kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition
    toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_parent_process.mechanism_decode
  question: What is the planted winsat.exe parent, and what spawned it onto this host?
  context: The parent winsat.exe running from \AppData\Local\Temp\system32\ is the elevated proxy. Retrieving the
    parent's own process_creation event shows how it was launched, its full command line, and its grandparent -
    the process that staged and ran the relocated winsat (often a loader, script host, or interactive shell). The
    range is intentionally wide because the parent may have started well before the child fired.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: attack:T1548.002.elevated_child_action
  question: What exactly did the elevated child process do? Decode its full command line and arguments.
  context: The bypass exists to run something at high integrity. The default child for this method is
    cmd.exe, but operators substitute their own payload. Decode every argument of the elevated child - encoded
    commands, file paths, downloaded URLs, or chained subcommands - to identify the operational purpose of the
    elevation. The query returns the child binaries spawned by the planted winsat parent on this host so chained
    or repeated invocations appear together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: attack:T1548.002.planted_binary_origin
  question: Where did the relocated winsat.exe under the Temp directory come from, and was a DLL dropped alongside it?
  context: This bypass plants a copy of winsat.exe in a user-writable directory laid out to mimic the trusted
    system path, then relies on winsat loading an attacker-supplied DLL from that same directory. Look for file
    writes that created the winsat.exe copy and any DLL written next to it in the AppData\Local\Temp\system32 tree;
    the writing process identifies who staged the bypass.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \AppData\Local\Temp\system32\
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1548.002.loaded_dll
  question: What DLL did the planted winsat.exe load, and was it signed and from the expected location?
  context: The path-parsing abuse causes the auto-elevated winsat.exe to load a DLL from the user-writable
    directory rather than from System32. Reviewing image loads by the planted winsat process reveals the
    attacker-controlled module - an unsigned or unexpectedly-located DLL loaded out of the Temp tree is the
    elevation mechanism. If image_load events are not collected in this environment, treat the absence as a
    visibility gap and pivot to the file-write evidence for the dropped module.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_parent_process.baseline
  question: Has winsat.exe ever previously run from this user Temp path on this host?
  context: Winsat.exe is a legitimate system binary, but it runs from System32, not from a user's
    AppData\Local\Temp\system32 directory. A historical count of executions where the parent image matches this
    relocated path distinguishes a first-time planted-binary event from a recurring pattern. Zero or very low
    counts indicate a novel execution from a path winsat should never run from.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_parent_process.follow_on
  question: What other child processes did the planted winsat.exe spawn on this host?
  context: An elevated proxy is often used to launch several tools in sequence - reconnaissance, credential
    access, persistence. Seeing every child of the planted winsat.exe parent reveals the full scope of activity
    run at elevated integrity through this bypass, not just the single child that triggered the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.scope
  question: Is this planted-winsat spawning pattern occurring on other hosts?
  context: The same elevated winsat-from-Temp parent appearing on multiple hosts points to a scripted deployment
    or a tool being run across the fleet rather than a one-off targeted action. A single occurrence is more likely
    a focused intrusion. Enterprise-wide comparison helps calibrate severity and identify the scope of the
    activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \AppData\Local\Temp\system32\winsat.exe
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.baseline
  question: Does this user normally run binaries from a Temp directory at elevated integrity?
  context: Compare this user's current action against their history. A user who has never spawned an elevated
    process from a relocated system binary is more suspicious than one whose role involves software testing or
    administration from staging directories. Zero or very low historical counts indicate first-time activity for
    this account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        ParentImage|endswith: \AppData\Local\Temp\system32\winsat.exe
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-to-child launch combination historically routine on this host or across the environment, or is the relocated winsat parent unusual?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism - which parent spawned this child, and whether that pair is
    historically common. A planted winsat.exe under Temp spawning an elevated child is the deviation worth
    chasing; a pair that already accounts for many prior events would point to vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith|expand: '%ParentImage%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging on multiple
    endpoints. If the same user triggered similar activity on more than one host, the scope of the operation may
    be larger than a single bypass attempt.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same relocated-winsat-to-child launch fire on other hosts in the same window - a coordinated rollout, or activity isolated to this host?
  context: Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same
    launch mechanism - the planted winsat.exe parent spawning this child - fired on other hosts in the alert
    window. Multiple hosts points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith|expand: '%ParentImage%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context:
    what led to the elevation, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, persistence mechanisms, or additional elevation attempts in the surrounding window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering,
    reconnaissance, credential access - may reveal the attack stages that preceded this elevation and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:uac_bypass.elevated_action_after_bypass
  question: What action was performed with elevated privileges after the UAC bypass?
  context: 'UAC bypass is a means to an end - attackers elevate to perform actions that require high integrity:
    installing persistence, dumping credentials, tampering with security tools, or accessing protected resources.
    Examining processes spawned at high or system integrity on this host shortly after the bypass reveals the
    objective. Correlate timing tightly - elevation and the follow-on action typically occur within seconds to a
    few minutes.'
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- source: template:uac_bypass.other_escalation_attempts
  question: Were other privilege escalation techniques attempted on this host?
  context: Attackers who attempt one UAC bypass often try multiple methods until one succeeds, especially if the
    OS version or configuration blocks certain techniques. Finding multiple bypass or escalation detections from
    the same user or host confirms deliberate privilege escalation rather than a false positive.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
