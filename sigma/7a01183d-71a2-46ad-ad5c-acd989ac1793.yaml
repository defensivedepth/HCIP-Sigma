  mutable_dispositions:
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "e.g. 30 seconds between registry/elevation events"
      disposition: context
      target_question: Q17
      notes: >-
        Tunable correlation window between bypass and elevated action — a threshold, not a queryable value. The
        elevated_action_after_bypass question uses a forward +30m range and its context tells the analyst to
        correlate elevation and follow-on action within seconds to minutes.
    - element: ElevatedProcessNameList / ElevatedProcessPath
      dimension: tuning_parameter
      specific_values: "sdclt.exe, eventvwr.exe, computerdefaults.exe (auto-elevated proxy list)"
      disposition: context
      target_question: Q5
      notes: >-
        This rule's auto-elevated proxy is fixed to winsat.exe by the detection's ParentImage; the tunable list of
        other proxies does not apply. The elevated-child question instead decodes whatever child the winsat proxy
        spawned, which is the variable element for this method.
    - element: ParentProcessAnomalyThreshold / ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only — parent-child mismatch logic"
      disposition: context
      target_question: Q4
      notes: >-
        Parent-child anomaly is the core of this rule (relocated winsat parent). mechanism_decode retrieves the
        parent event and its grandparent; baseline question quantifies how rare this parent path is on the host.
  dedup_decisions:
    - dropped: cue_process_tool.mechanism_decode
      reason: >-
        cue_parent_process is the primary cue; the parent-process mechanism_decode (Q4) retrieves the elevated
        winsat parent and its grandparent, and the attack:elevated_child_action question (Q5) decodes the child's
        command line. The generic process_tool mechanism_decode would scope to %Image% of the child, which is not
        a rule-fixed binary (default cmd.exe but operator-variable) and would duplicate the elevated-child decode.
    - dropped: cue_process_tool.baseline
      reason: >-
        cue_parent_process.baseline (Q8) provides the more specific historical count scoped to the relocated winsat
        parent path. A child-binary frequency baseline has no rule-fixed child binary to scope to.
    - dropped: cue_user_actor.clustering_svc / cue_user_actor.baseline_svc pairing
      reason: >-
        user_actor pair — non-deduplicable. Both user-pivot and parent+child substitute variants emitted for
        baseline and for clustering per AGENTS.md service-principal handling.
  skipped_templates:
    - template: cue_process_tool.process_chain
      reason: >-
        Hint 'parent_process is primary — drop cue_process_tool:process_chain'. parent_process cue is primary and
        its mechanism_decode (Q4) already walks the parent chain upward via ParentProcessGuid.
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'process_access' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with category: process_access"
      disposition: declined
      reason: >-
        process_access (Sysmon EID 10) in the T1548.002 strategy targets token-manipulation / handle-duplication
        bypasses (potato-style). This rule's bypass is a path-parsing DLL-load abuse of winsat.exe with no
        cross-process handle access in its mechanism; a process_access sweep would return unrelated handle-open
        noise. The DLL-load mechanism is instead covered by the image_load question (loaded_dll) and the
        elevated-action sweep (elevated_action_after_bypass) covers post-elevation behavior.
    - hint: "logsource 'registry_set' (recommended by techniques: T1548.002) is not covered — pull in cue_registry_key.* or author a custom question with category: registry_set"
      disposition: declined
      reason: >-
        registry_set covers the HKCU shell-handler hijack family of UAC bypasses (fodhelper/sdclt/computerdefaults).
        This winsat path-parsing method does not use a registry handler hijack — its mechanism is a planted binary +
        DLL load, covered by the file_event question (planted_binary_origin, category: file_event) and the
        image_load question (loaded_dll). No registry artifact is part of this rule's detection or this method's
        documented chain.
    - hint: "logsource 'security' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with category: security"
      disposition: declined
      reason: >-
        The 'security' logsource maps to WinEventLog:Security EID 4672 (special privileges assigned), used as a
        generic elevation signal. The rule already fires on the IntegrityLevel=High/System child via
        process_creation, and elevated_action_after_bypass (Q17) sweeps High/System integrity processes on the host
        through process_creation, which is the same elevation signal with command-line context. No template family
        exists for category: security and a bare 4672 sweep would add elevation volume without the process context
        this method needs.
