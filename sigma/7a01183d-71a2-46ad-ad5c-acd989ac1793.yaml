      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1548.002
      covered_by: Q5
      source: attack:T1548.002.elevated_child_action
      coverage_type: direct
    - dimension: user_context
      technique: T1548
      covered_by: Q11
