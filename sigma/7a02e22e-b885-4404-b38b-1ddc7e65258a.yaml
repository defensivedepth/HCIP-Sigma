name: Suspicious Schtasks Schedule Type With High Privileges
id: 28b34026-9772-4d09-b5e3-68358e6d7399
description: |
  Detects scheduled task creation or modification via schtasks.exe (or a binary
  whose OriginalFileName is schtasks.exe) where the command line combines a
  trigger schedule (ONLOGON, ONSTART, ONCE, or ONIDLE) with a high-privilege
  run context (NT AUTHORITY\SYSTEM, SYSTEM, or HIGHEST run level). The rule fires
  only when all three conditions match together: the schtasks binary, a suspicious
  schedule type, and an elevated privilege flag. Legitimate installers and admin
  tooling occasionally create SYSTEM tasks this way, so the investigation should
  determine the task name, the command it executes, who created it, and whether
  the elevation and schedule align with documented administrative procedure.
type: detection
detection_id: 7a02e22e-b885-4404-b38b-1ddc7e65258a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the schtasks command line combine a suspicious schedule type with a high-privilege run context?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the schtasks invocation pairs a trigger schedule (ONLOGON, ONSTART, ONCE, or ONIDLE) with an elevated context (NT AUTHORITY\SYSTEM, SYSTEM, or HIGHEST run level). Confirm all three elements are present in the actual command line and that the binary is schtasks.exe or carries that OriginalFileName.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to create or modify SYSTEM-level scheduled tasks?
  context: Legitimate administrative activity can trigger this detection. Creating tasks that run as SYSTEM or at HIGHEST run level is normal for software deployment hosts and configuration-management endpoints, but unusual on user workstations. Knowing whether the account and host function are consistent with privileged task creation is often the fastest path to disposition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:scheduled_task.task_configuration
  question: What scheduled task was created, and what command does it execute under SYSTEM?
  context: The schtasks command line contains the task name (/TN), the program or command to run (/TR), the schedule type (/SC), and the run-as account (/RU). Identify each of these. The /TR value reveals the persistence payload -- often a script, binary, or download cradle. A /TR pointing at an attacker-controlled path in a user-writable directory, combined with /RU SYSTEM, is the high-privilege escalation pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1053.005.command_analysis
  question: Was this a task creation (/create), a privilege-elevating modification (/change), or an XML import (/xml)?
  context: The schtasks subcommand determines the action. A /change /ru SYSTEM or /change /rl HIGHEST against an existing task -- especially a built-in Microsoft\Windows task -- moves that task from user context to LocalSystem or bumps its run level, hijacking a trusted task. A /xml import can embed a SYSTEM context and full task properties without exposing them on the command line. Identify which subcommand fired and whether it targets a pre-existing task.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- source: template:obfuscation.encoded_payload_decode
  question: Is the task's command (/TR) encoded or obfuscated, and what does the decoded content do?
  context: 'The executed command in the /TR argument is the operator''s payload. Common encodings to decode: base64 (often via a powershell.exe -EncodedCommand cradle in /TR), hex, character concatenation, and environment-variable substitution. Decoding reveals the actual intent -- download cradle, reverse shell, credential theft, or in-memory loader. Reconstruct the /TR payload and iterate decoding until it is readable.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned schtasks.exe, and is that parent chain expected?
  context: The parent process reveals how the task was created. Interactive admin use typically descends from explorer.exe or a console shell; software deployment descends from a management agent or installer. Unusual parents like powershell.exe driven from a download cradle, wscript.exe, mshta.exe, or an Office application suggest the task was created as part of an exploitation chain rather than routine administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was schtasks.exe executed from its expected System32 path?
  context: schtasks.exe run from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists. The rule also fires on any binary whose OriginalFileName is schtasks.exe, so compare the Image path against the OriginalFileName to detect a renamed copy running the scheduler logic from a non-standard location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:scheduled_task.task_trigger_and_timing
  question: When is the task scheduled to run, and has it already executed?
  context: The trigger schedule determines when the persistence activates. ONLOGON and ONSTART tasks fire on the next logon or boot; ONCE runs a single time; ONIDLE runs when the machine is idle. Scheduled tasks execute as children of the Task Scheduler service (svchost.exe -k netsvcs -p -s Schedule), so process creation events under that parent reveal whether the payload has already run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:scheduled_task.task_still_present
  question: Is the scheduled task still registered on the system?
  context: Persistence is only effective if the task still exists. Some operators delete the task after it executes to reduce forensic artifacts. Confirming the task is still present (via schtasks /query /tn <taskname> /v or the Task Scheduler view) determines whether the persistence mechanism is active and requires remediation. Use the task name (/TN) from the alerting command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1053.005.user_context
  question: Did task registration events in the Security log confirm the run-as account and the creator for this task?
  context: 'Task Scheduler writes Security events when a task is registered (4698) or updated (4702), recording the task name, the account that created it, and the embedded task definition including the run-as principal. These events corroborate the process-creation view and surface tasks created through API or XML import paths that may not produce a clean schtasks command line. A creator account that differs from the run-as SYSTEM context is the elevation worth chasing.'
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      category: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
      condition: selection
    fields:
      - SubjectUserName
      - TaskName
- source: attack:T1053.005.tuning_parameter
  question: Was a registry value written under the Task Scheduler TaskCache tree for this task on this host?
  context: Registered scheduled tasks are persisted under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache (Tasks, Tree, and the per-task Actions/Triggers values). A write here corroborates that the task was actually installed and can expose hidden or randomized task names and the embedded action even when the command-line view is incomplete. Compare the task name in the registry path against the /TN value from the alert.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      category: registry_set
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentVersion\Schedule\TaskCache\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_time:
        CommandLine|contains:
        - ' ONLOGON '
        - ' ONSTART '
        - ' ONCE '
        - ' ONIDLE '
      selection_privs:
        CommandLine|contains:
        - NT AUT
        - ' SYSTEM'
        - HIGHEST
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_time:
        CommandLine|contains:
        - ' ONLOGON '
        - ' ONSTART '
        - ' ONCE '
        - ' ONIDLE '
      selection_privs:
        CommandLine|contains:
        - NT AUT
        - ' SYSTEM'
        - HIGHEST
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging across multiple endpoints. If the same account created privileged tasks or ran other tooling on multiple hosts in the same window, the scope of compromise may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_time:
        CommandLine|contains:
        - ' ONLOGON '
        - ' ONSTART '
        - ' ONCE '
        - ' ONIDLE '
      selection_privs:
        CommandLine|contains:
        - NT AUT
        - ' SYSTEM'
        - HIGHEST
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:lolbin.technique_class_lateral
  question: Were other persistence or proxy-execution LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary often use several. After establishing a scheduled-task foothold, check whether reg.exe, sc.exe, bitsadmin.exe, wmic.exe, or proxy-execution binaries (rundll32, regsvr32, mshta) were also run on the host. Multiple LOLBins working toward persistence or code execution in the same timeframe strengthen the case for hands-on-keyboard activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\reg.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\certutil.exe'
          - '\netsh.exe'
          - '\bcdedit.exe'
          - '\wevtutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the attack stages that preceded a privileged task being installed and help reconstruct the full timeline. Privilege escalation and persistence often follow an initial foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
