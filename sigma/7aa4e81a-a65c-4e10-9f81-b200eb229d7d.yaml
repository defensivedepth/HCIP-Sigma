name: Potential Persistence Via VMwareToolBoxCmd.EXE VM State Change Script
id: 7dd8470c-141b-4a61-9c22-0252c1423abf
description: |
  Detects execution of VMwareToolBoxCmd.exe with both the "script" and "set" arguments, which registers an arbitrary
  batch script to run on a VM power-state transition (power on, power off, suspend, resume). The configuration is written
  to a tools.conf file and the registered script later runs as a child of the VMware Tools daemon, often under a
  privileged context, giving signed-binary persistence triggered by routine VM lifecycle events. The rule fires when the
  image ends in VMwareToolBoxCmd.exe (or has that original file name) AND the command line contains both " script " and
  " set ". Legitimate use exists where operations teams intentionally configure power-state hooks; the investigation
  should confirm the registered script path, the user and parent that ran the configuration, and whether the change was
  authorized.
type: detection
detection_id: 7aa4e81a-a65c-4e10-9f81-b200eb229d7d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show VMwareToolBoxCmd.exe configuring a power-state script with the "script" and "set" arguments?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The
    rule fires only when both " script " and " set " appear in the arguments of VMwareToolBoxCmd.exe (or a binary with that
    original file name). Read the full argument string to identify which power state was targeted (power, shutdown, resume,
    suspend) and the script path being registered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to configure VMware Tools power-state scripts?
  context: Configuring a power-state hook is an administrative action normally performed by virtualization or operations
    staff during setup or maintenance. Knowing whether this user role and host function are consistent with managing VMware
    Tools settings is often the fastest path to distinguishing routine configuration from an operator establishing
    persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:organizational_context.timing_alignment
  question: Does the timing of this configuration change align with normal work hours and maintenance windows?
  context: Legitimate VM configuration changes typically occur during business hours or scheduled maintenance. A power-state
    script registered at an unusual hour, outside any documented window, is more suspicious than the same action during a
    planned maintenance period.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for registering this power-state script?
  context: Many organizations require change tickets for persistence-relevant configuration, including VM lifecycle hooks. A
    corresponding ticket suggests authorized activity; absence of one when policy requires it suggests the configuration was
    unauthorized. This check can quickly close false positives or escalate true positives.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:organizational_context.human_recall
  question: Does the user or administrator recall registering this power-state script?
  context: Direct confirmation from the human behind the account is often the fastest path to determining legitimacy. If the
    user does not recall configuring a VM power-state hook, their credentials may be compromised or the activity may be
    automated. If they do recall it, capture the intended script and why it was registered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:organizational_context.procedural_consistency
  question: Is configuring VM power-state scripts via this command-line utility consistent with how your organization normally manages VMware Tools?
  context: Organizations that manage virtualization at scale usually configure guest tools through a baseline image,
    deployment tooling, or a management plane rather than ad hoc command-line invocation on an individual guest. Direct
    command-line registration of a power-state hook may indicate an operator bypassing normal tooling, or an admin taking a
    shortcut. Understanding the normal procedure helps distinguish the two.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering often precedes the establishment of persistence. The query surfaces direct attempts to disable AV/EDR
    services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection
    looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift
    the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this command register? Decode the full VMwareToolBoxCmd.exe arguments, the targeted power state, and the script path.
  context: The full command line reveals which power-state hook was configured and which script will run. Parse the arguments
    to identify the state keyword (power, shutdown, resume, suspend), whether the action was set/enable, and the registered
    script path. A path outside C:\Program Files\VMware\VMware Tools\ — especially a user-writable or unusual location — is a
    strong indicator the hook points to attacker-supplied content. The configuration persists in a tools.conf file, so the
    registered path here is the artifact to track.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned VMwareToolBoxCmd.exe and is that parent chain expected?
  context: The parent process reveals how the configuration was invoked. Interactive registration normally descends from a
    shell launched by explorer.exe or a remote-management session. Unusual parents such as a script host, an Office
    application, or a freshly dropped binary point toward automated or operator-driven persistence setup rather than routine
    administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate VM hook configuration leaves a pattern. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific configuration command has historically
    run here. A new parent process, an unexpected user account, or a first-ever appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VMwareToolBoxCmd.exe
      - OriginalFileName: toolbox-cmd.exe
      selection_cli:
        CommandLine|contains|all:
        - ' script '
        - ' set '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did VMwareToolBoxCmd.exe spawn afterward on this host?
  context: The processes that follow the configuration reveal its immediate impact. The registered script itself executes
    later as a child of the VMware Tools daemon at the next power-state transition, but command-line tools spawned right
    after the configuration — cmd.exe, powershell.exe, or a dropper writing the target batch file — can indicate the operator
    staged the script content at the same time.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VMwareToolBoxCmd.exe
      - OriginalFileName: toolbox-cmd.exe
      selection_cli:
        CommandLine|contains|all:
        - ' script '
        - ' set '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VMwareToolBoxCmd.exe
      - OriginalFileName: toolbox-cmd.exe
      selection_cli:
        CommandLine|contains|all:
        - ' script '
        - ' set '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user configured persistence or ran other tooling on multiple hosts, the scope of the activity may be larger than
    this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VMwareToolBoxCmd.exe
      - OriginalFileName: toolbox-cmd.exe
      selection_cli:
        CommandLine|contains|all:
        - ' script '
        - ' set '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Persistence is rarely the first action. Earlier detections on the same host — defense tampering, reconnaissance,
    credential access, or an initial execution — may reveal the stages that preceded the configuration change and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    configuration pattern rather than generic usage of the binary. Many hosts firing the same pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VMwareToolBoxCmd.exe
      - OriginalFileName: toolbox-cmd.exe
      selection_cli:
        CommandLine|contains|all:
        - ' script '
        - ' set '
      condition: all of selection_*
    fields:
    - host.name
- source: template:persistence_scope.file_based_persistence
  question: Were the VMware Tools configuration file or power-state batch scripts written or modified on this host around the alert?
  context: This persistence anchors in a tools.conf file under the VMware Tools data directory and in the default
    power-state batch scripts (poweron-vm-default.bat, poweroff-vm-default.bat, resume-vm-default.bat,
    suspend-vm-default.bat). File-event monitoring captures writes to these paths even when the registered script lives in
    an unusual location. A modification to tools.conf or to one of the default .bat files corroborates that a power-state
    hook was actually configured, and the writer's process and signing chain identify who staged it.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\VMware\VMware Tools\tools.conf'
          - '\VMware Tools\poweron-vm-default.bat'
          - '\VMware Tools\poweroff-vm-default.bat'
          - '\VMware Tools\resume-vm-default.bat'
          - '\VMware Tools\suspend-vm-default.bat'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
