  mutable_dispositions:
    - element: AccessMask
      dimension: access_verification
      specific_values: "0x1F0FFF"
      disposition: context
      target_question: Q8
      notes: "Full-access mask cited in context; process_access query surfaces GrantedAccess for the analyst to inspect rather than hardcoding a mask that varies by tool."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "~5 minutes between access and dump"
      disposition: context
      target_question: Q13
