      disposition: context
      target_question: Q12
      notes: "Allowlisting rationale enriches process_chain and access_verification context."
    - element: DumpFilePath
      dimension: tuning_parameter
      specific_values: "%TEMP%, C:\\Windows\\Temp, C:\\Users\\Public"
      disposition: query_injection
      target_question: Q9
      notes: "Injected into file_event TargetFilename|contains selection."
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "rundll32, procdump, comsvcs.dll, Invoke-Mimikatz"
      disposition: context
      target_question: Q4
      notes: "Generic dumping-syntax examples are not WCE's own CLI; the WCE-specific flags (-l/-s/-k/-w) drive Q4 instead. Listed as ambient context for the broader T1003.001 dumping family."
    - element: AccessMask
      dimension: access_verification
      specific_values: "0x1F0FFF (T1003)"
      disposition: context
      target_question: Q8
      notes: "Secondary-technique duplicate of the T1003.001 AccessMask element; covered by the same process_access question."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (T1003)"
      disposition: context
      target_question: Q13
      notes: "Secondary-technique duplicate; covered by host clustering window."
    - element: ParentProcessFilter
      dimension: parent_process_analysis
      specific_values: "rationale only (T1003)"
      disposition: context
      target_question: Q12
      notes: "Secondary-technique duplicate of allowlist rationale; covered by process_chain."
  dedup_decisions:
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; user-pivot (subject) and parent+binary substitute (mechanism) emitted as both Q14 and Q15"
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
