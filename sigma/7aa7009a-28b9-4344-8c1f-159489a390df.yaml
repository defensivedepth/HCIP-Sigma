      reason: "replaced_by: credential_access.credential_target_identification (Q7) — more specific for credential-access rule"
    - template: cue_process_tool.scope
      reason: "Fleet-pattern REFLECTED scope dropped for the 18-question cap; cross-host distribution of the WCE firing pattern is covered by the user_actor clustering_svc parent+binary pivot (Q17) and the host baseline_deviation (Q18) within the credential-access skeleton."
    - template: cue_process_tool.baseline
      reason: "Generic host baseline dropped for the 18-question cap; the host_pattern baseline_deviation (Q18) gives a filter-correct, rule-pattern-scoped historical view that subsumes the generic Image-only count."
    - template: cue_process_tool.follow_on
      reason: "Child-process follow-on dropped for the 18-question cap; WCE's post-execution impact is captured by post_access_lateral_movement (Q11, follow-on alert correlation) and the dump-file staging question (Q9)."
    - template: cue_process_tool.baseline_deviation
      reason: "kept as Q18 (REFLECTED host_pattern) — listed for completeness, not skipped"
    - template: cue_host_context.precursor
      reason: "Prior-alert precursor dropped for the 18-question cap; endpoint_protection_health (Q6) already surfaces the most decision-relevant precursor (tamper-before-credential-access) on this host, and post_access_lateral_movement (Q11) covers the follow-on alert timeline."
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'registry_set' (recommended by techniques: T1003.001) is not covered — pull in cue_registry_key.* or author a custom question with category: registry_set"
      disposition: declined
      reason: >-
        WCE extracts credentials from live LSASS memory and from Kerberos
        ticket caches; it does not perform the SAM/SECURITY/SYSTEM hive
        registry-export path (reg save) that the registry_set analytic targets.
        The rule constrains the trigger to WCE image/IMPHASH, whose operational
        flow (-l/-s/-k/-w) writes credential output to files, not registry.
        access_verification (Q8, process_access on lsass.exe) and the dump-file
        staging question (Q9, file_event) cover the WCE-specific evidence path;
        no compensating attack:T1003.001.registry_set question authored.
    - hint: "logsource 'security' (recommended by techniques: T1003.001) is not covered and no template family exists — author a custom question with category: security"
      disposition: declined
      reason: >-
        The Security-channel analytic (EID 4663/4656/4673 SeDebugPrivilege /
        handle requests on lsass.exe) restates the same LSASS-access step that
        Q8 already captures via Sysmon process_access (EID 10). Q8's
        SourceImage/GrantedAccess fields answer "who opened lsass.exe with what
        rights" directly; adding a parallel security-channel question would
        duplicate that coverage without new investigative angle. Security-event
        auditing of LSASS handle access is also frequently not enabled, so the
        process_access pivot is the more reliable source. No separate
        category: security question authored.
  contextual_sets:
    included: []
    excluded:
      - id: lateral_movement
        confidence: medium
        reason: >-
