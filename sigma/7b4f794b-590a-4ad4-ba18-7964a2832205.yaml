  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: kept — parent_process cue is NOT active (has_parent_in_detection false, parent_binaries empty), so process_chain is the only parent-lineage question and is retained, not dropped.
      kept: cue_process_tool.process_chain
    - dropped: cue_user_actor.baseline / cue_user_actor.baseline_svc
      reason: user_actor pair — non-deduplicable; emit BOTH (subject pivot vs. launch-mechanism pivot). Both marked always_include in the brief.
      kept: both
    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc
      reason: user_actor pair — non-deduplicable; emit BOTH (network-wide user pivot vs. parent+binary rollout pivot). Both marked always_include in the brief.
      kept: both
  skipped_templates:
    - template: cue_process_tool.baseline
      reason: Superseded by cue_process_tool.baseline_deviation, which mirrors the rule's actual firing pattern (OriginalFileName mismatch) instead of generic %Image% volume. The generic binary-frequency baseline would over-count any legitimately-named vmnat.exe and add little over the rule-pattern baseline.
    - template: cue_process_tool.follow_on
      reason: Subsumed by masquerading.renamed_binary_activity, which asks the same "what did this binary spawn afterward" question with the same ParentImage|endswith|expand %Image% query shape; keeping both would be a within-phase duplicate.
    - template: cue_process_tool.clustering
      reason: Subsumed by cue_host_context.clustering (identical host-scoped aggregation of surrounding tools); the host-context version is the canonical surrounding-activity question.
    - template: universal.endpoint_protection_health
      reason: RECOMMENDED, not must_include. This rule fires on a renamed-binary masquerade (the precondition for side-loading), not on a hands-on-keyboard payload-execution or credential-access action where the disposition turns on whether AV/EDR was weakened first. cue_host_context.precursor already surfaces prior tamper alerts on the host. Dropped to keep the user_actor pair and the load-bearing image_load question within the 18-question cap.
    - template: organizational_context.change_ticket
      reason: RECOMMENDED, not must_include. A renamed VMware binary running under a non-canonical name is not the kind of routine, ticketed system change (scheduled task, account, service deployment) this question targets; a side-load precondition is unlikely to have an approval record, so the question's discriminating power is low. Dropped to stay within the question cap.
    - template: organizational_context.human_recall
      reason: RECOMMENDED, not must_include. host_user_context already captures the "is this expected for this user/host" judgment; a separate human-recall question adds little for a metadata-mismatch detection and was dropped to stay within the cap.
    - template: organizational_context.timing_alignment
      reason: RECOMMENDED, not must_include. Temporal context is covered by cue_host_context.clustering and cue_host_context.precursor; a standalone work-hours question adds marginal value for a side-loading precondition and was dropped to stay within the cap.
    - template: organizational_context.procedural_consistency
      reason: RECOMMENDED, not must_include. This rule does not detect a tool-driven change (schtasks/net/reg) where org procedure is the discriminator; the relevant "is this routine" judgment is carried by host_user_context and the baseline-deviation question. Dropped to stay within the cap.
    - template: persistence_scope.file_based_persistence
      reason: RECOMMENDED, not must_include. The side-loading mechanism here is a renamed binary plus a co-located DLL, not a Startup-folder/Run-key file drop; process_based_persistence covers the parallel persistence-stacking question, and masquerading.binary_origin already inspects file-creation events for the binary. Dropped to stay within the cap.
  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1574.001) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: acted-on
      reason: >-
        Authored a custom image_load question (Q5, source attack:T1574.001.image_load)
        querying ImageLoaded/Hashes/Signed for the renamed binary on this host. This is
        the load-bearing question for a DLL side-loading rule — the malicious behavior is
        the DLL the host process maps, which process_creation telemetry cannot see.
    - hint: "logsource 'create_stream_hash' (recommended by techniques: T1574.001) is not covered and no template family exists — author a custom question with `category: create_stream_hash`"
      disposition: declined
      reason: >-
        create_stream_hash (Sysmon EID 15 / Alternate Data Stream + zone-identifier
        evidence) characterizes how the FILE arrived (mark-of-the-web / ADS), which Q6
        (masquerading.binary_origin, file_event) already addresses by tracing the
        file-creation event and dropper for the binary. The side-load itself is a DLL
        load, covered by Q5 (image_load), not an ADS write on the renamed exe. Adding a
        create_stream_hash query would duplicate the delivery-mechanism dimension Q6
        covers without surfacing the side-loading evidence. No compensating
        attack:T1574.001.create_stream_hash question authored.
    - hint: "logsource 'registry_set' (recommended by techniques: T1574.001) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        registry_set in the T1574 analytic targets the registry-redirection variant of
        hijack execution flow (KnownDLLs, service ImagePath, AppInit_DLLs). This rule's
        detection logic is specifically the renamed-binary/co-located-DLL search-order
        variant (OriginalFileName: vmnat.exe AND NOT Image endswith vmnat.exe) — there is
        no registry artifact in the rule's firing pattern. The actual side-load evidence
        is the module load (Q5, image_load). A registry_set sweep would investigate a
        different T1574 sub-mechanism than the one this rule fires on. No compensating
        attack:T1574.001.registry_set question authored.
