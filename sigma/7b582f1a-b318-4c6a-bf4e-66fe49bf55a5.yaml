name: Remote Access Tool - ScreenConnect Potential Suspicious Remote Command Execution
id: cd797030-b7b1-4a4a-8748-cef3046dea63
description: |
  Detects a process whose parent command line runs run.cmd out of C:\Windows\TEMP\ScreenConnect\
  AND whose own image is one of a set of frequently abused command-line binaries (bitsadmin.exe,
  cmd.exe, curl.exe, dllhost.exe, net.exe, nltest.exe, powershell.exe, pwsh.exe, rundll32.exe,
  wevtutil.exe). The ScreenConnect client service legitimately runs run.cmd to deliver toolboxes and
  one-off commands during a remote support session, so this pattern also appears in sanctioned IT
  work. After exploitation or unauthorized use of the agent, an operator drives the same channel to
  run reconnaissance, download tooling, clear logs, or stage further payloads. Determine whether a
  known support session explains the activity, what the spawned binary actually did, and whether the
  same channel produced reconnaissance, defense tampering, tool transfer, or persistence around the
  same time.
type: detection
detection_id: 7b582f1a-b318-4c6a-bf4e-66fe49bf55a5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this event match the rule — a child process spawned by run.cmd under the ScreenConnect TEMP directory, where the child is one of the watched command-line binaries?
  context: Confirm the alert is a true positive before investing further. The rule fires only when the
    parent command line contains both the C:\Windows\TEMP\ScreenConnect\ path and run.cmd AND the child
    image is bitsadmin, cmd, curl, dllhost, net, nltest, powershell, pwsh, rundll32, or wevtutil. Read
    the parent command line and the child image to verify both conditions hold.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
- source: template:parent_child.parent_process_legitimacy
  question: What started the ScreenConnect client service that ran run.cmd, and is that origin expected?
  context: The parent-child relationship is the core signal. Tracing the parent's own origin shows
    whether the run.cmd execution came from a normally running, signed ScreenConnect client service or
    from an agent that was installed or restarted unexpectedly. An agent introduced through exploitation
    of a public-facing vulnerability is the suspicious case; a long-running vendor-managed service is the
    routine one.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to be in a ScreenConnect remote support session right now?
  context: Legitimate remote support runs tools through the ScreenConnect agent under whatever account
    the technician or session uses. Knowing whether this host is one that IT actually supports through
    ScreenConnect, and whether a session was expected for this user at this time, is often the fastest
    way to separate sanctioned support from unauthorized agent use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is ScreenConnect on this organization's approved remote access software list for this host?
  context: Organizations typically sanction a specific set of remote access tools for IT support. If
    ScreenConnect is not the approved tool for this host, or this host is not one IT supports remotely,
    the agent may represent shadow IT or attacker-deployed access rather than authorized support. The
    tool's reputation does not matter — only whether its presence here is authorized.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a helpdesk ticket or scheduled maintenance window explaining this remote support session?
  context: Sanctioned ScreenConnect activity normally correlates with an active support ticket, a
    maintenance window, or a user request. If no support context exists for a session that ran command-line
    tools on this host, the agent may have been driven by an operator who exploited or co-opted it rather
    than by IT staff performing approved work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.what_was_disabled
  question: What exactly did the spawned binary do? Decode its full command line and identify the operation.
  context: The child image alone does not reveal intent — net.exe could enumerate domain admins or add a
    local account, bitsadmin or curl could transfer a remote payload, wevtutil could clear an event log,
    and rundll32 could load a dropped DLL. Decode every flag, path, and URL in the command line to
    determine which of these operations ran, since the disposition and remediation differ sharply by
    operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: If the spawned binary was powershell.exe or pwsh.exe, was the command encoded or obfuscated, and what does it decode to?
  context: When the child is PowerShell, the command frequently hides its payload behind -EncodedCommand
    (-enc), string concatenation, or backtick escaping. Base64 decoding the command reveals the actual
    behavior — download cradles fetching a remote URL, reverse shells, or in-memory loading of a .NET
    assembly. If the child is not PowerShell, this query simply re-displays the alerting command for
    reference.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same ScreenConnect run.cmd parent spawn?
  context: If the operator drove tools through run.cmd, the same parent instance likely launched several
    of the watched binaries in sequence — for example reconnaissance, then tool download, then log
    clearing. Listing the siblings of the alerting process reveals the full set of commands run through
    this one session and whether they form a recognizable post-exploitation sequence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: net.exe and nltest.exe are in this rule's watched set precisely because operators use them for
    account and domain-trust discovery right after gaining a foothold. A single discovery command may be
    troubleshooting, but several distinct recon binaries within a short window — whoami, net, nltest,
    nslookup, tasklist — is a signature of automated post-compromise enumeration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script content for any PowerShell child of this session?
  context: Script block logging (Event ID 4104) records the deobfuscated script PowerShell actually
    executed, even when the command line was encoded. This is ground truth about what ran through the
    session. If PowerShell operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:remote_access_tool.connection_destination
  question: What external endpoint did the spawned binary connect to around the time of the alert?
  context: When the spawned binary is a tool-transfer mechanism (bitsadmin, curl, PowerShell), the
    destination it reaches reveals whether a remote payload was fetched and from where. The destination
    distinguishes a vendor's support cloud from an unfamiliar address or a high port outside the standard
    set — note the destination port as well as the address.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host in the hour after this command ran, especially if a log was cleared?
  context: If the spawned binary was wevtutil clearing an event log, that creates a visibility gap that
    operators use to hide subsequent actions. Examining process activity in the window immediately after
    the alert reveals what the session went on to do — payload execution, credential access, or staging
    — and whether a logging gap lines up with it.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Does the alerting user normally run this binary across the environment?
  context: Compare the alerting account's current action against its historical behavior. A user who has
    never run this binary is more notable than one who runs it routinely. Low or zero historical counts,
    combined with the user's role, indicate whether this activity fits the account's normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the ScreenConnect-parent plus this binary combination historically routine on this host or across the environment?
  context: When the alert fires under a service account or computer account, user identity does not
    attribute the behavior; the launch mechanism does. A ScreenConnect client service spawning this binary
    that already accounts for many prior events is established support automation, while a new or rare
    pairing for this binary is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did the alerting user do across the network around this time?
  context: Tracking the account's activity across all hosts in this window reveals whether the same
    identity drove activity on multiple endpoints, which points to lateral movement or a wider scope of
    access than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same ScreenConnect-parent plus binary combination fire on other hosts in the same window?
  context: Under a service or computer account, network-wide user activity is mostly agent-telemetry
    noise. The meaningful question is whether the same launch mechanism — ScreenConnect client service
    spawning this binary — fired on other hosts in the alert window. Multiple hosts point to a coordinated
    rollout across several agents; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — exploitation of a public-facing service, defense
    tampering, or reconnaissance — may reveal the stages that preceded this command and help reconstruct
    how the remote access channel was obtained. The sequence of prior alerts often tells the story leading
    up to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around the same time?
  context: After establishing one access channel, operators commonly stack backup persistence using
    scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. bitsadmin appears in
    this rule's watched set and can both transfer tooling and create persistent jobs that survive reboots.
    Multiple persistence installations in the same timeframe indicate intentional stacking rather than
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
