name: System Restore Registry Modification via CommandLine
id: 85b1413a-f6b3-4783-82af-d54e63aebf1a
description: |
  Detects command-line modification of the SystemRestore registry keys (under SOFTWARE\Policies\Microsoft\Windows NT\SystemRestore
  or SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore) to set DisableConfig or DisableSR, which turns off System
  Restore. The rule fires when all of these match together: the binary is powershell.exe, pwsh.exe, or reg.exe; the command
  line carries a write verb (reg ' add ', Set-ItemProperty, or New-ItemProperty); the SystemRestore key root appears; and the
  DisableConfig or DisableSR value name appears. Disabling System Restore removes a recovery option and commonly precedes
  data-destruction or ransomware impact, but the same registry change is also performed by some imaging, hardening, and IT
  management routines. Investigation should confirm the exact key and value written, identify who and what drove the change,
  and check whether other recovery-inhibiting or destructive actions accompanied it.
type: detection
detection_id: 7c06ab9b-b1d2-4ba9-b06e-09491ded20d9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line modify a SystemRestore registry key to set DisableConfig or DisableSR?
  context: Confirm the alert is a true positive before investing time. The rule requires reg.exe, powershell.exe, or pwsh.exe
    with a write verb (' add ', Set-ItemProperty, or New-ItemProperty) targeting a SystemRestore key root and setting the
    DisableConfig or DisableSR value. Verify all four conditions appear in the actual command line, and note the data being
    written (a value of 1 disables the feature).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to disable System Restore from the command line?
  context: Legitimate imaging, hardening baselines, and some IT management tooling disable System Restore as part of a build
    or policy push. Knowing whether the user role and host function (a managed workstation, a server, a build host) line up
    with this change is often the fastest way to separate a routine configuration step from operator-driven recovery
    inhibition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:registry.registry_key_context
  question: What exact SystemRestore key root and value name were modified, and to what data?
  context: The specific key and data determine impact. DisableConfig and DisableSR set to 1 under SOFTWARE\Policies\Microsoft\Windows
    NT\SystemRestore or SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore turn off System Restore. The Policies path
    is enforced by Group Policy and overrides the per-machine path. Reading the structured registry fields confirms which
    root was hit and the value written rather than parsing it from the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: attack:T1490.command_analysis
  question: What recovery-inhibiting commands were executed on this host?
  context: Disabling System Restore is one of several recovery-inhibition steps operators chain together. This surfaces
    shadow-copy deletion (vssadmin, wmic), boot recovery disabling (bcdedit), backup deletion (wbadmin), and Windows Recovery
    Environment disabling (reagentc) on the host. The analyst should also confirm whether each action succeeded by checking
    system state (vssadmin list shadows, bcdedit /enum, reagentc /info).
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- source: template:ransomware_impact.destruction_scope_on_host
  question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: Recovery inhibition is rarely isolated. Operators often pair it with shadow-copy deletion, stopping security
    services, permission changes, and event-log clearing. Surfacing the full set of destructive tool executions reveals
    whether this is a single configuration change or part of a coordinated impact sequence, and a shared parent across the
    commands points to a script.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- source: template:ransomware_impact.encryption_or_ransom_indicators
  question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host afterward?
  context: Recovery-inhibiting actions typically precede file encryption by minutes. Looking at process activity after the
    change, excluding known system paths, surfaces suspicious executables, processes running from temp or user-writable
    directories, and command interpreters launching unknown binaries. This determines whether an encryption phase has begun
    and how far it has progressed. Ransom notes are best confirmed via file-event evidence or the endpoint console.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: template:ransomware_impact.network_wide_impact
  question: Is this same detection firing on other hosts in the environment?
  context: Impact-stage activity often executes the same recovery-inhibition step across many hosts in rapid succession.
    Finding this same alert on multiple hosts indicates network-wide execution and sets the scope for containment and
    incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- source: template:cue_process_tool.process_chain
  question: What process spawned the binary that made this change, and is that parent chain expected?
  context: The parent process reveals how the change was invoked. A logon shell, a management agent, or a deployment tool
    spawning reg.exe or powershell.exe is consistent with administrative or automated activity; an unusual parent such as a
    script host, an Office application, or a freshly dropped binary points to operator-driven activity. Walk up the tree to
    see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - reg.exe
      selection_cli_action:
        CommandLine|contains:
        - ' add '
        - Set-ItemProperty
        - New-ItemProperty
      selection_cli_reg_root:
        CommandLine|contains:
        - \SOFTWARE\Policies\Microsoft\Windows NT\SystemRestore
        - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore
      selection_cli_reg_key:
        CommandLine|contains:
        - DisableConfig
        - DisableSR
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - reg.exe
      selection_cli_action:
        CommandLine|contains:
        - ' add '
        - Set-ItemProperty
        - New-ItemProperty
      selection_cli_reg_root:
        CommandLine|contains:
        - \SOFTWARE\Policies\Microsoft\Windows NT\SystemRestore
        - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore
      selection_cli_reg_key:
        CommandLine|contains:
        - DisableConfig
        - DisableSR
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity on multiple endpoints. If the
    same user drove similar recovery-inhibiting changes on other hosts, the scope of the activity is larger than this single
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - reg.exe
      selection_cli_action:
        CommandLine|contains:
        - ' add '
        - Set-ItemProperty
        - New-ItemProperty
      selection_cli_reg_root:
        CommandLine|contains:
        - \SOFTWARE\Policies\Microsoft\Windows NT\SystemRestore
        - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore
      selection_cli_reg_key:
        CommandLine|contains:
        - DisableConfig
        - DisableSR
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users drove it, and does this alert fit?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has historically run here, not generic
    binary usage. A new parent, an unexpected user, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - reg.exe
      selection_cli_action:
        CommandLine|contains:
        - ' add '
        - Set-ItemProperty
        - New-ItemProperty
      selection_cli_reg_root:
        CommandLine|contains:
        - \SOFTWARE\Policies\Microsoft\Windows NT\SystemRestore
        - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore
      selection_cli_reg_key:
        CommandLine|contains:
        - DisableConfig
        - DisableSR
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the distribution look like automation or
    one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment or
    hardening automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - reg.exe
      selection_cli_action:
        CommandLine|contains:
        - ' add '
        - Set-ItemProperty
        - New-ItemProperty
      selection_cli_reg_root:
        CommandLine|contains:
        - \SOFTWARE\Policies\Microsoft\Windows NT\SystemRestore
        - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore
      selection_cli_reg_key:
        CommandLine|contains:
        - DisableConfig
        - DisableSR
      condition: all of selection_*
    fields:
    - host.name
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: Operators who change one policy key often change several, for example disabling System Restore while also
    weakening security settings or adding persistence. Finding clusters of registry write operations from the same host in a
    short window reveals the full scope of the configuration changes and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Recovery inhibition is usually a late-stage action. Earlier detections on the same host, such as defense
    tampering, credential access, or reconnaissance, may reveal the stages that preceded this change and help reconstruct the
    timeline leading to impact.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
