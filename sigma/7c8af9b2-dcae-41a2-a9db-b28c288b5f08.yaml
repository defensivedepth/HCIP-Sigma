name: Suspicious IIS URL GlobalRules Rewrite Via AppCmd
id: 1f767ad6-e958-4a09-8a9d-08d6d99ebd48
description: |
  Detects appcmd.exe (or a renamed binary with that OriginalFileName) being used to set the
  system.webServer/rewrite/globalRules configuration section and commit it. URL rewrite global rules
  redirect or rewrite inbound requests at the IIS level; legitimate administrators and load-balancing
  setups configure them, but the same mechanism lets an operator route requests to a planted webshell
  or staged content while leaving normal site behavior intact. The rule fires only when both the binary
  match and all four command-line tokens (set, config, the globalRules section, and commit:) are present.
  Investigation should confirm the exact rule being added, who and what invoked appcmd, and whether
  surrounding activity points to webshell deployment or routine site maintenance.
type: detection
detection_id: 7c8af9b2-dcae-41a2-a9db-b28c288b5f08
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match an appcmd.exe global URL rewrite rule commit?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact command line and process details. The rule requires appcmd.exe (by image or OriginalFileName)
    together with set, config, the system.webServer/rewrite/globalRules section, and a commit token.
    Read the full command to see which rewrite rule is being added and where requests would be routed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to reconfigure IIS URL rewrite rules?
  context: Legitimate IIS administration and load-balancer setup can trigger this detection. Confirm
    whether the host serves IIS sites and whether the acting account is one that normally manages web
    server configuration. A non-administrative or service account modifying global rewrite rules is a
    stronger signal than a known web admin performing routine maintenance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exact rewrite rule did this appcmd invocation add, and where does it route requests?
  context: The full command line reveals the specific rule. Decode the rule name, the match/pattern
    values, the action type (Rewrite or Redirect), and the destination URL or server farm. A rule that
    forwards requests to an internal path, an unusual file, or an external host is the artifact that
    distinguishes a planted redirect from a legitimate site rule.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - 'section:system.webServer/rewrite/globalRules'
          - 'commit:'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this appcmd execution and is that parent chain expected?
  context: The parent process reveals how appcmd was invoked. Routine administration usually traces to
    an interactive shell, a management console, or a deployment task. A parent such as a web server
    worker process (w3wp.exe), mshta.exe, wscript.exe, or a remote-access tool suggests the rewrite
    rule was configured through an exploited service rather than by an administrator.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did appcmd spawn afterward?
  context: Processes spawned after the rewrite rule was committed reveal the operator's next steps.
    Legitimate configuration changes rarely spawn children; cmd.exe, powershell.exe, certutil.exe, or
    file-writing utilities appearing shortly after point to webshell staging or further hands-on
    activity on the IIS host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run appcmd.exe?
  context: A web server that has never run appcmd.exe, or runs it only rarely, makes this execution more
    notable. Zero or very low historical counts indicate first-time or infrequent use; an IIS host where
    appcmd runs regularly as part of deployments lowers the concern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive
    that activity, and does the current alert fit that pattern?
  context: Even on an IIS host where appcmd is common, the globalRules-commit pattern may be rare. The
    query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution
    reflects how this specific rewrite-commit pattern has run here before. A new parent process or an
    unexpected account is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_cli:
        CommandLine|contains|all:
        - set
        - config
        - section:system.webServer/rewrite/globalRules
        - 'commit:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally configure IIS rewrite rules across the environment?
  context: Compare this user's current action against their historical pattern. A user who has never run
    appcmd.exe, or who has no web administration role, performing a global rewrite commit is more
    suspicious than a known IIS administrator doing so. User role and typical toolset should align.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and appcmd.exe combination historically routine on this host or across the
    environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism — which parent process spawned appcmd, and whether that pair
    is historically common. A new or rare parent for appcmd is the deviation worth chasing; a pair that
    already accounts for many prior events is deployment automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user configured rewrite rules or ran other tools on several hosts,
    the scope of the activity is broader than a single IIS server.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and appcmd.exe combination fire on other hosts in the same window?
  context: Under a service principal, user-wide activity returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism — parent process plus appcmd — fired on other hosts in
    the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Webshell deployment and IIS reconfiguration usually accompany other operator activity.
    Processes running near the rewrite commit may reveal reconnaissance, file staging, credential access,
    or persistence that provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to the rewrite-rule change, what happened after, and whether it is part of a larger
    sequence. Look for file writes into web directories, reconnaissance, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count
    of the rewrite-commit pattern, not generic appcmd usage. Many hosts firing the same pattern points to
    scripted deployment or load-balancer automation; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_cli:
        CommandLine|contains|all:
        - set
        - config
        - section:system.webServer/rewrite/globalRules
        - 'commit:'
      condition: all of selection_*
    fields:
    - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the
    alert?
  context: Operators reconfiguring an IIS host for webshell access often weaken protection first. The
    query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions,
    clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal; populated rows
    shift the disposition toward operator preparation, so review the parent process and signing chain to
    identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — exploitation of the
    web service, reconnaissance, or credential access — may reveal the stages that preceded the rewrite
    change and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
