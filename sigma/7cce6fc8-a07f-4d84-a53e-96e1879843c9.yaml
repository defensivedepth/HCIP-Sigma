    - hint: "logsource 'image_load' (recommended by techniques: T1218) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The rule fires purely on a process_creation name/metadata masquerade (Image basename matches a Sysinternals tool
        while Company/Product are non-Sysinternals or empty); it carries no proxy-execution or DLL-hosting logic. T1218's
        image_load analytic profiles DLL loads of signed proxy binaries (rundll32/regsvr32 loading externally hosted
        modules), which is not what this rule detects. The investigative crux — recovering the binary's true identity — is
        covered by masquerading.true_identity (Q3) via OriginalFileName, signature, and Hashes on the process_creation
        event, which is the precise evidence for a renamed binary. An image_load query over these ~190 binary names would
        return DLL-load volume without distinguishing the masquerade. No compensating attack:T1218.image_load question
        authored.
