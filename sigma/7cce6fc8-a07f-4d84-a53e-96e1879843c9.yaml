- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what happened
    after. Aggregating process and parent pairs collapses repetitive agent noise into high-count rows while novel
    parent-child pairs stand out at low counts, which is where reconnaissance, privilege escalation, or staging would show.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack
    stages that preceded this event and help reconstruct the timeline. A renamed administrative tool is frequently a
    middle stage; prior alerts indicate what came before it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lateral_movement.lateral_movement_scope
  question: If the impersonated tool is a remote-admin utility, has this user account driven remote-execution tooling against other hosts?
  context: >-
    Several of the Sysinternals names this rule covers are remote-execution and remote-management utilities. When the
    alerting binary impersonates one of those, the relevant scope question is whether the same account has run
    remote-admin tooling across multiple hosts in the past day. Connections fanning out from one account to many hosts in a
    short window indicate active movement across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1036.005
      name: Match Legitimate Resource Name or Location
      role: primary
    - id: T1036
      name: Masquerading
      role: primary
    - id: T1218
      name: System Binary Proxy Execution
      role: secondary
    - id: T1202
      name: Indirect Command Execution
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: binary_arrival
      description: "Renamed binary is dropped, downloaded, extracted, or copied onto the host under a Sysinternals tool name"
      mapped_to: Q6
      source: template:masquerading.binary_origin
    - stage: 2
      label: execution_with_metadata_mismatch
      description: "Binary executes with a Sysinternals name but non-Sysinternals or empty Company/Product metadata"
      mapped_to: Q3
      source: template:masquerading.true_identity
    - stage: 3
      label: post_execution_activity
      description: "Renamed binary performs its real function (child processes, files, network) and may appear on other hosts"
      mapped_to: Q7
      source: template:masquerading.renamed_binary_activity
  dimension_coverage:
    - dimension: command_analysis
      technique: T1218
      covered_by: Q4
      source: template:cue_process_tool.mechanism_decode
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1218
      covered_by: Q5
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1218
      covered_by: Q3
      source: template:masquerading.true_identity
      coverage_type: direct
    - dimension: time_correlation
      technique: T1202
      covered_by: Q14
      source: template:cue_host_context.clustering
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1202
      covered_by: Q8
      source: template:cue_process_tool.baseline_deviation
      coverage_type: direct
    - dimension: user_context
      technique: T1202
      covered_by: Q2
      source: template:universal.host_user_context
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1036.005
      covered_by: Q8
      source: template:cue_process_tool.baseline_deviation
      coverage_type: direct
    - dimension: execution_context
      technique: T1036
      covered_by: Q7
      source: template:masquerading.renamed_binary_activity
      coverage_type: direct
    - dimension: time_correlation
      technique: T1036
      covered_by: Q15
      source: template:cue_host_context.precursor
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1036
      covered_by: Q3
      source: template:masquerading.true_identity
      coverage_type: direct
  mutable_dispositions:
    - element: OriginalFilenameMismatch
      dimension: tuning_parameter
      specific_values: "Image basename vs PE OriginalFilename"
      disposition: query_injection
      target_question: Q3
      notes: "true_identity projects OriginalFileName + Hashes alongside Image so the analyst reads the name-vs-metadata mismatch directly"
    - element: KnownSystemUtilityPaths
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q6
      notes: "binary_origin context covers where the binary landed (user-writable vs system path)"
    - element: trusted_directory_list
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q6
      notes: "T1036.005 trusted-directory tuning; covered as origin-path context, no specific values in brief"
    - element: process_baseline_age
      dimension: tuning_parameter
      specific_values: "30 days"
      disposition: context
      target_question: Q10
      notes: "process novelty window; user baseline runs -90d which subsumes the 30-day novelty horizon"
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "10-30 minutes (T1202) / file-to-exec window (T1036)"
      disposition: context
      target_question: Q14
      notes: "host clustering at +/-15m correlates the alert with surrounding activity within the brief's window"
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only"
      disposition: context
      target_question: Q5
      notes: "process_chain profiles parent-child legitimacy"
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "rationale only (URLs, script paths, DLL entrypoints)"
