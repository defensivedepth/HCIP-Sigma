  context: >-
    The query mirrors the rule's full selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific masquerade pattern has historically run here, not generic usage of any tool.
    A new parent process, an unexpected user account, or a first-ever appearance of the pattern is the deviation worth
    chasing.
