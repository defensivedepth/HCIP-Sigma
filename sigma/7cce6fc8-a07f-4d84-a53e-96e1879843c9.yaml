name: Potential Binary Impersonating Sysinternals Tools
id: a6564421-c931-4bf7-8004-ff760472d415
description: |
  Detects a process whose on-disk filename matches a known Sysinternals tool name (either the x86/x64 set or the ARM64
  variants) while its PE Company/Product metadata does NOT identify it as a genuine Sysinternals binary, or that metadata
  is empty. Legitimate Sysinternals tools are signed by Microsoft and carry a "Sysinternals" Company/Product string;
  a name match without that metadata is the signature of a renamed payload masquerading as a trusted administrative
  utility. The investigation should confirm the metadata mismatch, recover the binary's true identity from
  OriginalFileName and hash, trace how it arrived on the host, and determine what it did after execution and whether the
  same renamed binary appears elsewhere in the environment.
type: detection
detection_id: 7cce6fc8-a07f-4d84-a53e-96e1879843c9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match a Sysinternals tool name while lacking genuine Sysinternals Company/Product metadata?
  context: >-
    The rule fires when a process Image basename matches EITHER the standard Sysinternals tool list OR the ARM64 variant
    list, AND the Company is not a Sysinternals string and Product does not start with "Sysinternals" (or that metadata is
    empty). Note which name list matched and confirm the Company/Product fields on the event, since a genuine signed tool
    would carry the Sysinternals metadata that this alert says was absent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run a Sysinternals-named administrative tool?
  context: >-
    Sysinternals utilities are common on administrator workstations and jump hosts but unusual on standard user endpoints.
    Knowing whether the user role and host function fit administrative tooling is often the fastest way to separate a true
    masquerade from a misconfigured but legitimate copy of the tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its OriginalFileName, signature, and hash?
  context: >-
    A renamed payload keeps the filename of the tool it impersonates, but its embedded PE metadata and signing chain still
    reflect what it really is. Compare the Image basename against OriginalFileName, check whether the binary is signed and
    by whom, and submit the hash for reputation lookup. A genuine Sysinternals tool resolves to a Microsoft-signed binary
    with a matching OriginalFileName; a mismatch, missing signature, or unknown hash points to a masquerading payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: What did this Sysinternals-named binary actually do? Decode its command-line arguments.
  context: >-
    The command line shows the operation the binary performed under its assumed name. Decode any flags, target paths,
    remote host arguments, or service names. The genuine tools the impersonated names map to span privilege enumeration,
    credential-relevant operations, remote execution, and secure deletion, so the arguments indicate whether the
    masquerading binary is performing one of those high-impact actions or something inconsistent with the tool it claims
    to be.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this binary and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. A genuine administrative invocation typically traces back to
    explorer.exe, a console, or a management agent. An unusual parent such as a script host, an Office application, or an
    unsigned binary suggests the renamed tool was dropped and executed as part of an intrusion rather than run by an
    administrator.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.binary_origin
  question: How did this binary arrive on the host?
  context: >-
    A renamed tool does not appear spontaneously; it was downloaded, extracted from an archive, copied via remote admin
    tooling, or dropped by another process. Tracing the file-creation event for this basename over a long window reveals
    the delivery mechanism and the process that wrote it. Arrival in a user-writable location such as Downloads, Temp, or
    AppData favors a download or extraction; the writing process identifies the dropper or installer.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: >-
    Renaming a binary is meant to let it perform its real function unnoticed. The child processes, file operations, and
    network activity spawned by the binary reveal its actual objective. The same impersonating name carrying the same
    metadata mismatch on multiple hosts points to deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
