name: Uncommon Sigverif.EXE Child Process
id: 05d68741-e6fc-48d8-97d8-3e6076aadb49
description: |
  Detects a child process spawned by sigverif.exe (File Signature Verification), excluding WerFault.exe crash handling.
  Sigverif.exe is a signed Microsoft GUI utility whose "View Log" feature can be coerced into launching an arbitrary
  executable via ShellExecute, letting an operator proxy execution of an untrusted binary through a trusted parent.
  Investigation should identify what binary sigverif.exe launched, whether it is signed and lives in an expected
  location, and whether the sigverif.exe invocation itself was interactive and expected on this host.
type: detection
detection_id: 7d4aaec2-08ed-4430-8b96-28420e030e04
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Is the parent process of the alerting event sigverif.exe, and is the child something other than WerFault.exe?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when a process whose parent
    Image ends in sigverif.exe spawns any child except WerFault.exe crash handling. Note the child Image and its full path
    from the alert event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- source: template:universal.host_user_context
  question: Is this user and host expected to run sigverif.exe interactively?
  context: Sigverif.exe is a manual GUI utility that an ordinary user almost never launches, and which has no scripted or
    scheduled role in routine administration. An interactive launch on a server or by a non-administrative user is unusual
    and shifts the disposition toward deliberate use of the proxy-execution path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1216.signed_to_unsigned_transition
  question: Is the child binary that sigverif.exe launched signed, and where does it live on disk?
  context: The technique's value to an operator is laundering an untrusted payload through a signed Microsoft parent. A child
    that is unsigned, signed by an unexpected publisher, or running from a user-writable directory (Downloads, Temp, AppData,
    a removable drive) is the signal that sigverif.exe was used as a proxy rather than for genuine signature verification.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - edr_console
  - manual_review
- source: template:cue_parent_process.mechanism_decode
  question: What was the sigverif.exe invocation itself, and what spawned it?
  context: Retrieve the parent's own process_creation event to see how sigverif.exe was started. An interactive launch from
    explorer.exe matches manual use; a launch from a script host, Office application, or remote-execution tool indicates the
    parent was driven programmatically into the proxy-execution path.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- source: template:cue_parent_process.follow_on
  question: What other child processes did sigverif.exe spawn on this host?
  context: A proxy-execution launch may be followed by additional tools run in sequence — reconnaissance, credential access,
    or download cradles. Seeing every child of sigverif.exe reveals the full scope of activity initiated through this parent.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_parent_process.baseline
  question: Has sigverif.exe spawned this child binary on this host before?
  context: Sigverif.exe legitimately spawns almost nothing other than WerFault.exe. A child binary with zero or very low
    historical count under this parent on this host is a novel spawning relationship and the central anomaly the rule surfaces.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- source: attack:T1216.file_event_payload
  question: What recent file writes landed the child binary on disk, and what process wrote it?
  context: Proxy execution through sigverif.exe usually launches a payload that was staged shortly beforehand. Looking at
    file writes to the child binary's path identifies the writer and the staging time, distinguishing a freshly dropped
    payload from a pre-existing tool. If file events are not collected in this environment, treat zero results as a
    visibility gap rather than evidence the file was always present.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_paths%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - User
  answer_sources:
  - file_event
  - edr_console
- source: attack:T1216.time_correlation
  question: How much time elapsed between the sigverif.exe launch and the child process creation?
  context: The delta between signed-parent execution and child creation separates an interactive operator (seconds to a few
    minutes of manual GUI clicks to reach View Log) from an automated chain. A very short or scripted-looking interval, or
    a child appearing without a corresponding interactive sigverif.exe session, refines whether this was hands-on-keyboard
    abuse.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_parent_process.clustering
  question: What file or network activity is associated with sigverif.exe around the time of the alert?
  context: Beyond child processes, the proxy-execution path or its payload may have generated network connections or
    additional file activity. Correlated activity in the same window helps establish whether this was an isolated launch or
    part of a larger sequence on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
  - network_connection
- source: template:cue_user_actor.baseline
  question: Does this user normally run sigverif.exe?
  context: Compare this user's action against their historical behavior. A user who has never launched sigverif.exe is more
    notable than one who does so as part of a known troubleshooting or driver-validation workflow. User role and typical
    toolset should align with manual use of a signature-verification utility.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- source: template:cue_user_actor.baseline_svc
  question: Is the sigverif.exe parent combined with this child binary historically routine on this host or across the
    environment?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot
    is the launch mechanism — sigverif.exe spawning this specific child. A pair that already accounts for many prior events
    is likely a known workflow; a new or rare pairing is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity elsewhere in the same window, the scope of the activity may be larger than
    a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- source: template:cue_user_actor.clustering_svc
  question: Did the sigverif.exe parent combined with this child binary fire on other hosts in the same window?
  context: Under a service principal, network-wide user activity is mostly agent-telemetry noise. The meaningful question is
    whether the same launch mechanism — sigverif.exe spawning this child — appeared on other hosts in the alert window.
    Multiple hosts point to a pushed or scripted rollout; a single host points to a local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
- source: template:cue_parent_process.scope
  question: Is the sigverif.exe parent-child spawning pattern occurring on other hosts?
  context: The same uncommon parent-child relationship appearing on multiple hosts may indicate a coordinated effort or a
    pushed automation; a single occurrence is more likely targeted or one-off. Environment-wide comparison helps calibrate
    scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining surrounding activity reveals what led to this event and what followed,
    and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence around the
    alert window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
