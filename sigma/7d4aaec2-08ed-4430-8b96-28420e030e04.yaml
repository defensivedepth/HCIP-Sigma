      reason: >-
        This rule fires solely on the sigverif.exe parent-child process_creation
        relationship; sigverif.exe abuse is a ShellExecute proxy launch, not a
        DLL-side-loading or .NET-host pattern. image_load of the parent returns
        only the GUI utility's own module set and adds no precision on which
        untrusted child was proxied. The signed-to-unsigned child question
        (attack:T1216.signed_to_unsigned_transition) and the file-staging
        question (attack:T1216.file_event_payload) cover the payload dimension
        via process_creation and file_event evidence. No compensating
