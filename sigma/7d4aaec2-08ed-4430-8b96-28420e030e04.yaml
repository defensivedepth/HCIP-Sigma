    - hint: "logsource 'process_access' (recommended by techniques: T1216) is not covered and no template family exists — author a custom question with category: process_access"
      disposition: declined
      reason: >-
        process_access (Sysmon EventCode 10) detects memory access / handle
        opening between processes, which is relevant to credential-dumping or
        injection variants of script proxy execution but not to this rule, whose
        detection logic is a benign-parent-spawns-uncommon-child relationship
        with no cross-process memory access component. No template family exists
        and the rule's logic does not cross that boundary; the follow-on child
        sweep (cue_parent_process.follow_on) would surface any injection tool
        that was itself launched. No compensating attack:T1216.process_access
        question authored.
