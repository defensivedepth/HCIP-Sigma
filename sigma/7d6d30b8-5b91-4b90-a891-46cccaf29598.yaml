name: Program Executed Using Proxy/Local Command Via SSH.EXE
id: 800133bc-44b7-4406-8de6-b625bb0eb773
description: |
  Detects ssh.exe being used as a proxy to launch other programs. The rule fires when EITHER ssh.exe was spawned by
  sshd.exe, OR the process matches ssh.exe by Image/Product/import hash, OR the command line carries the ProxyCommand=
  directive or the PermitLocalCommand=yes plus LocalCommand pair. Any one branch is sufficient. ProxyCommand runs a local
  command during connection setup (it fires even if the connection ultimately fails), and LocalCommand runs a local command
  after a successful connection; both let an operator chain arbitrary execution into an otherwise innocuous ssh invocation.
  Legitimate administrators use these directives to tunnel through bastions or run pre/post-connect scripts, so the
  investigation should determine what command the directive actually executes, what spawned ssh.exe, and whether the user
  and host are expected to use OpenSSH this way.
type: detection
detection_id: 7d6d30b8-5b91-4b90-a891-46cccaf29598
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did ssh.exe fire on the sshd.exe parent branch, the ssh.exe binary branch, or the ProxyCommand/LocalCommand command-line branch?
  context: >-
    Confirm the alert by reviewing the exact event against the rule's three branches: a parent of sshd.exe, an ssh.exe
    Image/Product/import-hash match, or a command line containing ProxyCommand= (or PermitLocalCommand=yes together with
    LocalCommand). Any one branch alone fires the rule, so note which one matched — the command-line branch points directly
    at proxy-execution and makes the embedded command the load-bearing artifact, while the parent or binary-only branch may
    be a plain ssh session that still warrants checking the command line for a directive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
      - Hashes
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run OpenSSH ssh.exe with proxy or local-command directives?
  context: >-
    Legitimate administration through bastions or jump hosts uses ProxyCommand and post-connect scripts use LocalCommand,
    so a sysadmin or automation account on a host that routinely runs OpenSSH is a different disposition than a workstation
    or service account that has no reason to invoke ssh.exe this way. Knowing the user role and host function is often the
    fastest path to separating a true positive from routine SSH tunneling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is the parent of ssh.exe expected, and what started that parent?
  context: >-
    The rule's parent branch fires specifically when sshd.exe spawned ssh.exe, but ssh.exe can also be launched
    interactively or by a script. Tracing the parent's own origin reveals whether the chain is legitimate (a user shell or
    an admin tool launching ssh) or suspicious (a macro-spawned interpreter or an unexpected service launching ssh.exe to
    drive a ProxyCommand). If ParentProcessGuid resolves to NODATA, pivot on host.name plus ParentImage within the alert window.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn around the alert?
  context: >-
    A ProxyCommand or LocalCommand executes its payload as a child of ssh.exe, and the parent that launched ssh.exe may
    have launched additional tools. Examining siblings of the same parent reveals the full scope of activity from that
    parent — multiple unexpected children point to orchestration rather than a single benign ssh session.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    Proxy execution through a trusted signed binary is the kind of hands-on-keyboard action an operator may precede by
    weakening protection. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad
    exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver
    tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation;
    review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What command does the ProxyCommand or LocalCommand directive actually run? Decode the full ssh.exe command line.
  context: >-
    The directive payload is the operational core of this technique. Read the full command line and extract whatever follows
    ProxyCommand= or LocalCommand= — it may be an interpreter, a download-and-execute one-liner, netcat/socat, or a shell
    spawn. The host-plus-binary scope catches sequential ssh.exe invocations within a few minutes that together form one
    operation; a ProxyCommand fires during connection setup even when the connection fails, so the payload runs regardless
    of whether ssh actually reached a host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.command_analysis
  question: Does the ssh.exe command line carry a ProxyCommand= or PermitLocalCommand=yes/LocalCommand directive?
  context: >-
    Proxy-execution LOLBin abuse hides the real action inside the -o directives rather than in the binary name. Confirming
    whether the alerting command line contains ProxyCommand= or the PermitLocalCommand=yes plus LocalCommand pair separates
    a plain ssh session (binary or parent branch only) from one that is explicitly chaining local execution. A match here
    makes the embedded payload the artifact to decode and pivot on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith|expand: '%Image%'
      selection_proxy:
        CommandLine|contains: 'ProxyCommand='
      selection_local:
        CommandLine|contains|all:
          - 'PermitLocalCommand=yes'
          - ' LocalCommand'
      condition: selection_img and (selection_proxy or selection_local)
    fields:
      - host.name
      - CommandLine
      - User
- source: attack:T1218.parent_process_analysis
  question: What grandchild processes did ssh.exe spawn, and are they interpreters or system tools?
  context: >-
    A ProxyCommand or LocalCommand payload runs as a child of ssh.exe, so unexpected ssh.exe children — cmd.exe,
    powershell.exe, regsvr32.exe, rundll32.exe, or other non-ssh binaries — are the direct evidence of proxy execution.
    OpenSSH normally does not spawn these. Reviewing what ssh.exe launched on this host confirms whether the directive
    actually executed a payload and what that payload was.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\ssh.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- source: attack:T1218.tuning_parameter
  question: Has ssh.exe been launched by this parent before on this host, or is this parent-binary pair new?
  context: >-
    Profiling the parent-child pairing separates routine OpenSSH usage from anomalous invocation. A parent that has launched
    ssh.exe many times over the baseline window is established automation or interactive admin use; a parent that has never
    spawned ssh.exe before — or sshd.exe spawning ssh.exe where no bastion forwarding is configured — is the deviation worth
    chasing. Zero or very low counts indicate a first-time spawning relationship.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run ssh.exe at all?
  context: >-
    OpenSSH is an optional Windows feature and is absent on many endpoints. A host that has never run ssh.exe before, or
    runs it only rarely, makes this execution far more notable than one on a host where admins use SSH routinely. Zero or
    very low historical counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run ssh.exe?
  context: >-
    Compare this user's current action against their historical pattern. A user who has never run ssh.exe is more notable
    than an administrator who uses it regularly for legitimate tunneling. User role and typical toolset should align with
    OpenSSH client usage.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and ssh.exe combination historically routine on this host or across the environment, or is the parent unusual for ssh.exe?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is the
    launch mechanism. A new or rare parent for ssh.exe on this host or environment-wide is the deviation worth chasing,
    while a pair that already accounts for many prior events is vendor or OS automation. Host concentration in the result
    points to a host-local trigger versus a fleet-wide pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the
    same user triggered similar activity on other hosts, the scope is larger than a single SSH invocation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and ssh.exe combination fire on other hosts in the same window, pointing to coordinated automation rather than isolated activity?
  context: >-
    Under a service principal, asking what else the user did returns agent-telemetry noise. The meaningful question is
    whether the same launch mechanism — the parent process spawning ssh.exe — fired on other hosts in the alert window.
    Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:lateral_movement.lateral_movement_scope
  question: Has this user account driven other remote-access or proxy tooling across the environment?
  context: >-
    ssh.exe is a remote-access and tunneling tool, and an actor abusing it for proxy execution may also reach other hosts
    with related tooling. If the same user account is running ssh.exe, plink, psexec, mstsc, or wmic across multiple hosts
    in a short window, the scope of activity is broader than this single endpoint.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what happened
    after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence
    mechanisms accompanying the SSH execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack
    stages that preceded this event and help reconstruct the full timeline. Proxy execution through ssh.exe is often a
    mid-chain action rather than the entry point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
