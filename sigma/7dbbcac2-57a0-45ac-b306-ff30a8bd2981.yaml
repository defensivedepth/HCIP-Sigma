name: Windows AMSI Related Registry Tampering Via CommandLine
id: db9304c1-0c88-48a7-bd93-e1ab845f3667
description: |
  Detects command-line tampering with the AMSI (Antimalware Scan Interface) registry settings under
  HKCU\Software\Microsoft\Windows Script\Settings, where the AmsiEnable value controls whether scripting
  engines submit content for malware scanning. The rule fires when a command line references both that
  settings path and AmsiEnable, performed through EITHER reg.exe (with an add operation) OR PowerShell
  (powershell.exe/pwsh.exe using Set-ItemProperty, New-ItemProperty, or sp). Setting AmsiEnable to 0
  disables scanning for the current user without requiring elevation, so this is a common precursor to
  running script-based payloads that would otherwise be flagged. Determine which engine made the change,
  what value was written, what ran before and after, and whether the user, host, and parent chain are
  consistent with legitimate administration.
type: detection
detection_id: 7dbbcac2-57a0-45ac-b306-ff30a8bd2981
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line modify the AmsiEnable value under the Windows Script Settings key via
    either reg.exe or PowerShell?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires only
    when the command line references both the Windows Script Settings path and AmsiEnable, performed either
    through reg.exe with an add operation OR through powershell.exe/pwsh.exe with Set-ItemProperty,
    New-ItemProperty, or sp. Note which branch fired and the data written (a value of 0 disables AMSI for
    the current user); the engine and the written value steer the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to modify AMSI or scripting-engine registry settings from the
    command line?
  context: Legitimate changes to the AmsiEnable value are rare and would normally come from security
    tooling, a documented hardening or troubleshooting task, or a known administrator. A standard user
    account or a host with no scripting-administration role making this change points away from routine
    operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:registry.registry_key_context
  question: What registry key and value were written, and does the data set AmsiEnable to 0?
  context: If a registry_set event is linked to this process, it gives the registry path (TargetObject) and
    the value written (Details) as structured fields instead of having to parse them from the command line.
    Confirm the target is HKCU\Software\Microsoft\Windows Script\Settings\AmsiEnable and check the value -- a
    DWORD of 0 disables AMSI scanning for the current user, while a value of 1 restores it. The written value
    distinguishes an active bypass from a restoration or a test.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:defense_tampering.what_was_disabled
  question: Was AMSI scanning the specific control targeted, and through which scripting engine?
  context: AMSI is the interface that PowerShell, JScript, VBScript, and other engines use to submit
    executed content for malware scanning. Disabling it via the AmsiEnable value blinds signature-based
    detection for scripts run under the current user. Identify whether reg.exe or PowerShell performed the
    write, since that determines the parent chain and the surrounding session to examine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does it decode to?
  context: AMSI tampering is frequently wrapped in encoding or obfuscation so the disabling step and the
    payload that follows evade signature matching. Check the command line for -EncodedCommand/-enc base64,
    backtick escaping, string concatenation, or variable substitution, and decode it to recover the full
    script -- the AmsiEnable write is often only the opening step of a larger script that loads .NET
    assemblies or fetches a remote payload once scanning is off.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script content around this execution?
  context: Script block logging records the deobfuscated script content PowerShell actually executed, even
    when the command line is encoded -- this is ground truth for what ran alongside the AmsiEnable change,
    including any in-memory AMSI patching or payload that followed. If PowerShell operational logs are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:cue_process_tool.process_chain
  question: What process spawned the tool that modified AmsiEnable, and is that parent chain expected?
  context: The parent reveals how the registry change was invoked. An interactive administrator working
    through explorer.exe or a console is different from reg.exe or PowerShell launched by mshta.exe,
    wscript.exe, an Office application, or another script host, which points to macro- or script-driven
    execution rather than deliberate administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is AMSI scanning currently restored on this host, or is the AmsiEnable value still set to 0?
  context: The change may be temporary (disabled for one action then restored) or persistent. If AmsiEnable
    remains 0, scripting engines on this host continue to run without scanning and the value should be
    reset before further analysis. Confirm the current state through host inspection rather than assuming
    the alerting command represents the standing configuration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after AMSI scanning was disabled?
  context: Scanning is disabled so that something which would otherwise be blocked or logged can run.
    Examining process creation immediately after the AmsiEnable write reveals what the tampering was meant
    to enable -- script execution, in-memory .NET loading, credential access, or download activity. Novel
    parent-child pairs in that window are the activity to follow.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session through reg.exe or
    PowerShell?
  context: Operators who flip one evasion setting often change several -- adding Defender exclusions,
    altering policy keys, or setting Run keys for persistence in the same session. Clustering of registry
    write operations from reg.exe or PowerShell within a short window around this change reveals the full
    scope of configuration tampering beyond the AMSI value itself.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - 'Set-ItemProperty'
          - 'New-ItemProperty'
          - 'Remove-ItemProperty'
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_key:
        CommandLine|contains|all:
        - \Software\Microsoft\Windows Script\Settings
        - AmsiEnable
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_cmd:
        CommandLine|contains: add
      selection_powershell_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_powershell_cmd:
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - 'sp '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_key and (all of selection_powershell_* or all of selection_reg_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_key:
        CommandLine|contains|all:
        - \Software\Microsoft\Windows Script\Settings
        - AmsiEnable
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_cmd:
        CommandLine|contains: add
      selection_powershell_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_powershell_cmd:
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - 'sp '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_key and (all of selection_powershell_* or all of selection_reg_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or
    parallel activity on other endpoints. If the same user disabled AMSI or ran related tooling on multiple
    hosts, the scope of the operation is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_key:
        CommandLine|contains|all:
        - \Software\Microsoft\Windows Script\Settings
        - AmsiEnable
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_cmd:
        CommandLine|contains: add
      selection_powershell_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_powershell_cmd:
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - 'sp '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_key and (all of selection_powershell_* or all of selection_reg_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this AMSI-tampering pattern in the past week, and does the cross-host
    distribution look like automation or one-off activity?
  context: The query mirrors the rule's full selection structure with no host scope, so the result is a
    fleet-wide count of this specific AmsiEnable-tampering pattern rather than generic reg.exe or PowerShell
    usage. Many hosts firing the same pattern points to scripted deployment or a hardening tool; one host or
    a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_key:
        CommandLine|contains|all:
        - \Software\Microsoft\Windows Script\Settings
        - AmsiEnable
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_cmd:
        CommandLine|contains: add
      selection_powershell_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_powershell_cmd:
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - 'sp '
      condition: selection_key and (all of selection_powershell_* or all of selection_reg_*)
    fields:
    - host.name
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this AMSI-tampering pattern over the past 90 days, and what
    command-line structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one used regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects
    this specific AmsiEnable-tampering pattern rather than generic binary usage. The command-line projection
    lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_key:
        CommandLine|contains|all:
        - \Software\Microsoft\Windows Script\Settings
        - AmsiEnable
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_cmd:
        CommandLine|contains: add
      selection_powershell_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_powershell_cmd:
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - 'sp '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_key and (all of selection_powershell_* or all of selection_reg_*)) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Disabling AMSI rarely happens in isolation. Earlier detections on the same host -- other defense
    tampering, reconnaissance, or initial-access activity -- may reveal the stages that preceded this change
    and help reconstruct the timeline of the operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
