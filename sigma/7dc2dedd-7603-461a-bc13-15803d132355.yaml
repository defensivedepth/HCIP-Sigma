name: Uncommon Child Process Of Conhost.EXE
id: 27fb018e-dcb5-43ff-982f-4a2c610f3527
description: |
  Detects a process whose parent is conhost.exe, excluding the normal System32 conhost self-reference, empty/null
  child images, and the SystemTraceProvider source. conhost.exe normally hosts console windows for other processes
  and is not expected to spawn arbitrary children; on recent Windows builds, `conhost.exe <target.exe>` can launch a
  target program, making conhost a vehicle for indirect command execution that breaks classic parent-chain filters.
  Investigation should determine what child was launched, what it then did, whether the parent chain and user are
  expected, and whether the activity is isolated or repeated across the environment.
type: detection
detection_id: 7dc2dedd-7603-461a-bc13-15803d132355
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event show conhost.exe as the parent of a non-standard child process?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when ParentImage ends
    in conhost.exe and the child is not the normal System32 conhost.exe self-reference and not empty/null. Check that the
    child Image is a real executable and not a benign console-host artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- source: template:universal.host_user_context
  question: Is this user and host expected to launch programs through conhost.exe?
  context: conhost-launched children are unusual outside of specific developer or automation scenarios. Knowing whether
    the user role and host function are consistent with this behavior is often the fastest way to separate routine activity
    from abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_parent_process.mechanism_decode
  question: What child process did conhost.exe spawn, and what was its full command line?
  context: The child Image and its command line reveal what conhost.exe actually launched. Indirect execution through
    conhost is used to run a secondary program (script interpreters, signing-bypass utilities, downloaders) while evading
    parent-chain detections. Decode any flags, paths, or encoded content in the child command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: attack:T1202.high_risk_child
  question: Is the conhost child one of the high-risk indirection targets such as a script interpreter, scripting host, or
    downloader?
  context: Indirect command execution typically chains into a high-impact secondary program. Child images of powershell.exe,
    cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe, curl.exe, or bitsadmin.exe under conhost are the strongest
    indicators of abuse. A child outside this set is more often a developer or automation scenario, but still warrants
    review of its purpose.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \conhost.exe
      selection_child:
        Image|endswith:
          - \powershell.exe
          - \pwsh.exe
          - \cmd.exe
          - \rundll32.exe
          - \regsvr32.exe
          - \mshta.exe
          - \msiexec.exe
          - \curl.exe
          - \bitsadmin.exe
      selection_host:
        host.name|expand: '%hostname%'
      condition: selection_parent and selection_child and selection_host
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.mechanism_decode
  question: What launched conhost.exe itself, and is that grandparent chain expected?
  context: conhost.exe is normally started as a console host by an interactive process. When it is used as a launcher, the
    process that started conhost (the grandparent of the alerting child) shows who or what initiated the indirection. An
    unusual grandparent such as a script host, Office application, or remote-access tool reframes the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:cue_parent_process.follow_on
  question: What other child processes did this conhost.exe instance spawn around the same time?
  context: Indirect launchers are often used to run several tools in sequence — reconnaissance, credential access, lateral
    movement. Seeing all children spawned by conhost on this host reveals the full scope of activity routed through this
    execution chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1202.network_connection
  question: Did the conhost child open outbound network connections shortly after launch?
  context: A second stage of indirect execution is outbound network activity from the spawned program — downloading a
    payload, beaconing, or exfiltration. Correlate connections from the child process around the alert time, and exclude
    expected egress to known-good administrative networks when judging significance.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1202.file_event
  question: What files did the conhost child write or drop on this host around the alert time?
  context: Indirect execution frequently stages or drops files — a downloaded payload, a script, or a modified SSH config
    such as %USERPROFILE%\.ssh\config used to persist LocalCommand/ProxyCommand. File writes by the spawned program help
    determine whether this was benign tooling or a delivery step.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_parent_process.baseline
  question: Has conhost.exe historically spawned this child binary on this host?
  context: A conhost-to-child pairing that has never been seen on this host is more suspicious than one that recurs.
    conhost almost never legitimately spawns arbitrary executables, so zero or very low historical counts for this specific
    pairing point to a novel and anomalous relationship.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \conhost.exe
      filter_main_conhost:
        Image|endswith: :\Windows\System32\conhost.exe
      filter_main_null:
        Image: null
      filter_main_empty:
        Image: ''
      filter_optional_provider:
        Provider_Name: SystemTraceProvider-Process
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \conhost.exe
      filter_main_conhost:
        Image|endswith: :\Windows\System32\conhost.exe
      filter_main_null:
        Image: null
      filter_main_empty:
        Image: ''
      filter_optional_provider:
        Provider_Name: SystemTraceProvider-Process
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on other hosts, the scope of the activity may be larger than this single
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \conhost.exe
      filter_main_conhost:
        Image|endswith: :\Windows\System32\conhost.exe
      filter_main_null:
        Image: null
      filter_main_empty:
        Image: ''
      filter_optional_provider:
        Provider_Name: SystemTraceProvider-Process
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_parent_process.scope
  question: Is the conhost-to-child spawning pattern occurring on other hosts across the environment?
  context: The same parent-child relationship appearing on multiple hosts may indicate a campaign or lateral movement
    pattern, while a single occurrence is more likely targeted. Environment-wide comparison helps calibrate severity and
    identify the scope of the activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event, what
    happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or
    persistence around the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the
    attack stages that preceded this event and help reconstruct the timeline. Indirect execution is typically a step inside
    a larger operation rather than the start of one.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
