        which is covered by Q5 (attack:T1003.003.file_artifact) via file_event.
        No process_access question authored because it would return only
        unrelated LSASS-handle events for this CommandLine-only esentutl rule.
    - hint: "logsource 'security' (recommended by techniques: T1003) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The Security-channel directory-service-access (4662) and object-access
        analytics target live LSASS/SAM/AD-object access. esentutl /p operates on
        a copied or shadow-staged database file offline, not against the live
        directory service, so 4662/4663 on the directory object would not capture
