  skipped_templates:
    - template: powershell.encoded_command_decode
      reason: "Rule's detected binary is dism.exe, not powershell.exe; the DISM command line is plaintext (/featurename:WindowsPowerShellWebAccess /online /enable-feature) with no -EncodedCommand or obfuscation to decode. mechanism_decode (Q4) already parses the full DISM invocation. The hint 'powershell.encoded_command_decode replaces obfuscation.encoded_payload_decode' is satisfied at the template-selection layer — encoded_payload_decode was never emitted."
    - template: powershell.script_block_logging
      reason: "DISM enablement is a single process_creation event from dism.exe and produces no PowerShell 4104 script-block events; querying ScriptBlockText for this host's DISM activity returns nothing relevant. The downstream PSWA/Install-PswaWebApplication PowerShell activity is surfaced as process_creation in Q7 instead."
    - template: powershell.powershell_security_bypass
      reason: "Rule does not detect powershell.exe execution or any AMSI/execution-policy bypass; the operator-preparation question for this rule is whether a PSWA authorization rule and gateway were stood up, covered by Q7. Generic PS-bypass scanning around a DISM event adds no rule-specific signal."
    - template: universal.endpoint_protection_health
      reason: "RECOMMENDED, not must_include. This is a feature-enablement/persistence rule, not a payload-execution or credential-access rule whose disposition turns on prior AV/EDR tampering. cue_host_context.precursor (Q17) already surfaces prior tamper-as-precursor alerts on the host, and persistence_scope.process_based_persistence (Q18) covers the persistence-stacking angle, so the generic tamper sweep does not earn its slot."
    - template: uac_bypass.bypass_technique_registry_artifacts
      reason: "Registry-based UAC-bypass artifacts (ms-settings, mscfile, Shell\\Open\\command) are not the mechanism here — DISM enables a Windows optional feature directly in an already-elevated context; there is no auto-elevated-COM registry hijack to look for. The T1548.002 tag is loosely fitted (rule is feature enablement, not a classic UAC bypass)."
    - template: uac_bypass.other_escalation_attempts
      reason: "Looking for repeated UAC-bypass technique alerts does not fit a feature-enable rule that involves no bypass attempt. cue_host_context.precursor (Q17) already covers other sigma alerts on the host in the preceding window, which is the relevant cross-alert pivot for this rule."
    - template: persistence_scope.file_based_persistence
      reason: "Startup-folder / Run-key file drops are a different persistence family than enabling a remote-access feature; the PSWA endpoint is the persistence mechanism here and is covered by the gateway-exposure question (Q7). process_based_persistence (Q18) already covers tool-based persistence stacking; adding a file_event sweep would not address the rule's actual mechanism."
    - template: organizational_context.human_recall
      reason: "Coverage of the organizational-legitimacy angle is provided by change_ticket (Q3) and host_user_context (Q2); a third near-identical recall question would not add a distinct investigation step within the 18-question cap."
    - template: organizational_context.timing_alignment
      reason: "Timing-vs-maintenance-window legitimacy is folded into change_ticket (Q3, which asks about the maintenance window) and host_user_context (Q2); kept the slot for rule-specific gateway-exposure and elevated-follow-on questions."
    - template: organizational_context.procedural_consistency
      reason: "Whether feature enablement is normally done via deployment tooling vs. direct DISM is captured by host_user_context (Q2) and the baseline questions (Q10/Q13); a separate procedural-consistency question is redundant under the cap."
  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1548.002) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The image_load analytic for T1548.002 targets auto-elevated-binary
        DLL-load anomalies (e.g., a hijacked DLL loaded by eventvwr.exe/sdclt.exe
        during a classic UAC bypass). This rule detects dism.exe enabling an
        optional feature, which is not a DLL-hijack UAC bypass — there is no
        anomalous module-load step in the feature-enable mechanism. The
        load-bearing evidence is the DISM command line (Q4) and the downstream
        gateway-configuration processes (Q7), both process_creation. No
        compensating attack:T1548.002.image_load question authored.
    - hint: "logsource 'process_access' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        The process_access analytic (Sysmon EventCode 10) is for token/handle
        manipulation against a target process during elevation abuse. DISM
        feature enablement performs no cross-process handle access; it runs in
        its own already-elevated context and writes feature state. The relevant
        elevation question for this rule is what the elevated session did next,
        covered by attack:T1548.002.elevated_action_after_bypass (Q8) over
        process_creation. No process_access question authored.
    - hint: "logsource 'registry_set' (recommended by techniques: T1548.002) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        The registry_set analytic looks for writes to UAC-bypass keys
        (ms-settings\\Shell\\Open\\command, mscfile, DelegateExecute). This rule
        is not a registry-hijack UAC bypass — DISM enables the feature via the
        Component Based Servicing store as a side effect, not via an
        attacker-controlled auto-elevated registry key. There is no attacker
        registry write to hunt for that distinguishes true from false positive
        here; the disposition turns on the DISM switches (Q4) and gateway
        follow-on (Q7). No registry_set question authored.
    - hint: "logsource 'security' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The security-log analytic (EventCode 4672 — special privileges assigned)
        flags the elevation token grant. For this rule the elevation is expected
        and necessary — DISM legitimately requires an elevated token to enable a
        feature — so a 4672 question would fire on every invocation, true or
        false positive, and add no discriminating signal. The user/role
        legitimacy of that elevation is instead addressed by host_user_context
        (Q2) and the user-actor baseline (Q14). No security question authored.
