name: PowerShell Web Access Feature Enabled Via DISM
id: ebff9321-2eaa-4dd1-bab1-d14efef5c153
description: |
  Detects dism.exe (matched on Image or OriginalFileName DISM.EXE) invoked with a command line that contains all of
  WindowsPowerShellWebAccess, /online, and /enable-feature — the live-system primitive that turns on the Windows PowerShell
  Web Access optional feature. PowerShell Web Access exposes an interactive PowerShell session over HTTPS through IIS, so
  enabling it stands up a remote-execution surface that persists across reboots; legitimately it is an administrator standing
  up a managed-access gateway, while in an intrusion it is an operator installing a browser-reachable backdoor on an
  already-compromised server. The investigation should confirm the exact feature being enabled, establish whether the user,
  host, and timing fit a planned administrative change, and determine what the enablement led to — IIS/PSWA gateway
  configuration, high-integrity follow-on actions, and other persistence stacking.
type: detection
detection_id: 7e8f2d3b-9c1a-4f67-b9e8-8d9006e0e51f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — dism.exe enabling the WindowsPowerShellWebAccess feature online?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process is
    dism.exe (or carries OriginalFileName DISM.EXE) AND the command line contains all of WindowsPowerShellWebAccess, /online,
    and /enable-feature. Read the exact command line and confirm all three tokens are present and that the binary is genuine
    DISM, not an unrelated process renamed to dism.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enable Windows optional features such as PowerShell Web Access?
  context: Enabling PowerShell Web Access is a server-administration action. On a dedicated administrative jump host run by a
    known server-management account during a planned rollout it can be routine; on a workstation, an application server with
    no remote-management role, or under an account that does not normally administer features, it is a deviation worth pursuing.
    Knowing whether the role and host function fit the action is often the fastest path to a disposition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for enabling PowerShell Web Access on this host?
  context: Standing up a remote-access feature like PowerShell Web Access is the kind of change most organizations gate behind
    an approval. A corresponding ticket or maintenance window suggests authorized administration; absence of one, when policy
    requires it, shifts the disposition toward unauthorized feature enablement and warrants contacting the owning team.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What exactly does the DISM command line do — which feature is enabled, and are -All, -Source, -LimitAccess, or -NoRestart present?
  context: Decode the full DISM invocation. /featurename:WindowsPowerShellWebAccess with /online /enable-feature turns the
    feature on against the live OS. The /all switch additionally enables every parent feature and dependency in one call;
    /source with /limitaccess installs feature payload from a local path without contacting Windows Update, which an operator
    may use to avoid outbound fetch traffic; /norestart suppresses the reboot prompt. Note which switches are present — they
    indicate how complete and how deliberate the enablement was. Pair this with confirmation of whether IIS and the PSWA
    gateway were configured afterward, since enabling the feature alone does not yet expose a login endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith|expand: '%Image%'
      - OriginalFileName: DISM.EXE
      selection_cli:
        CommandLine|contains: 'WindowsPowerShellWebAccess'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned dism.exe, and is that parent chain expected for a feature-enablement action?
  context: The parent reveals how DISM was invoked. A planned change usually traces to an interactive admin shell launched
    from explorer.exe, a remote-management session, or a deployment tool. An unusual parent — a web server worker process,
    an Office application, mshta.exe, wscript.exe, or a freshly dropped binary — points to the feature being enabled through
    an exploited service or remote operator rather than hands-on administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did dism.exe spawn after enabling the feature?
  context: DISM itself only toggles the feature; the operationally significant follow-on is what configures and exposes
    PowerShell Web Access. Look for IIS management activity, appcmd.exe, and powershell.exe running Install-PswaWebApplication
    or Add-PswaAuthorizationRule — these are the steps that turn an enabled feature into a reachable login endpoint. Unexpected
    children such as cmd.exe, certutil.exe, or net.exe point to broader post-enablement activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: llm_generated
  question: After the feature was enabled, was the PowerShell Web Access gateway actually configured and a broad authorization rule added?
  context: Enabling the optional feature is only the first step; the backdoor becomes reachable once the gateway web application
    is installed and an authorization rule grants access. Install-PswaWebApplication (often with -UseTestCertificate) stands
    up the IIS-hosted endpoint, and Add-PswaAuthorizationRule defines who can reach which computers — a rule using wildcards
    for user, computer, and configuration name grants everyone access to everything and is a strong sign of operator setup
    rather than scoped administration. This query surfaces those follow-on commands on the same host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'Install-PswaWebApplication'
          - 'Add-PswaAuthorizationRule'
          - 'Install-WindowsFeature'
          - 'IIS-WebServerRole'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1548.002.elevated_action_after_bypass
  question: What actions ran at high or system integrity on this host shortly after the feature was enabled?
  context: Enabling an optional feature via DISM requires an elevated context, and the same elevated session is frequently
    used for follow-on objectives. Examining processes running at High or System integrity in the window after the enablement
    reveals whether the operator went on to install persistence, dump credentials, tamper with security tooling, or stage
    further access — turning a single feature-enable into a clearer picture of intent.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the feature enablement?
  context: Feature enablement rarely stands alone in an intrusion. Activity in the minutes surrounding the DISM call may reveal
    reconnaissance, account creation, remote-access tool deployment, or defense tampering that frames whether this is a single
    planned change or one step in a hands-on-keyboard sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.baseline
  question: Does this host normally run dism.exe to enable optional features?
  context: A host that routinely runs DISM (imaging servers, build hosts, deployment infrastructure) is a different proposition
    than a server that has never enabled an optional feature this way. Zero or very low historical counts of DISM usage on
    this host indicate first-time or rare execution and raise the weight of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously enabled the PowerShell Web Access feature via DISM, what parents and users drove it, and does this alert fit?
  context: The query mirrors the rule's own selection — dism.exe enabling WindowsPowerShellWebAccess — scoped to this host, so
    the resulting parent and user distribution reflects how this specific feature-enable has historically run here rather than
    generic DISM usage. A new parent process, an unexpected account, or the absence of any prior matching activity is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dism.exe
      - OriginalFileName: DISM.EXE
      selection_cli:
        CommandLine|contains|all:
        - WindowsPowerShellWebAccess
        - /online
        - /enable-feature
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts enabled PowerShell Web Access via DISM in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this exact feature-enable
    pattern rather than generic DISM usage. Many hosts firing the same pattern in a short window points to scripted or
    pushed deployment; a single host or a small unrelated set points to manual operator activity. Use the host distribution
    to calibrate whether this is a managed rollout or an isolated action.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dism.exe
      - OriginalFileName: DISM.EXE
      selection_cli:
        CommandLine|contains|all:
        - WindowsPowerShellWebAccess
        - /online
        - /enable-feature
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run DISM to enable optional features across the environment?
  context: Compare the acting account's current action against its 90-day history. A server-management or imaging account that
    regularly runs DISM is consistent with routine administration; an account that has never enabled features this way — or a
    user account with no server-administration role — is more suspicious. User role and typical toolset should align with
    feature enablement.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+dism.exe combination historically routine on this host or across the environment, or is the parent unusual for DISM?
  context: When the alert fires under a service principal, user identity does not attribute behavior, so the meaningful pivot
    is the launch mechanism — which parent process spawned dism.exe and whether that pair is historically common. A new or rare
    parent for DISM on this host or environment-wide is the deviation worth chasing; a pair that already accounts for many
    prior events is deployment or OS-servicing automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals lateral movement or coordinated changes on multiple
    endpoints. If the same account enabled features or ran administrative tooling on several hosts in the same window, the scope
    of the activity — and any potential compromise — is larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+dism.exe combination fire on other hosts in the same window — a coordinated rollout, or activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — the parent process spawning dism.exe — fired on other hosts in
    the alert window. Multiple hosts in the same window point to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Enabling a remote-access feature is often a mid-stage action. Earlier detections on the same host — exploitation of
    an exposed service, defense tampering, account creation, or reconnaissance — may reveal how the operator reached the point
    of installing a backdoor and help reconstruct the timeline leading to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Operators rarely rely on a single foothold. After enabling a remote-access feature, they commonly stack backup
    persistence using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions.
    Several persistence installations in the same timeframe indicate intentional stacking rather than an isolated administrative
    change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
