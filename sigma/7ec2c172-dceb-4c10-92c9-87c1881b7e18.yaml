name: HackTool - Rubeus Execution
id: fe8c874c-75a5-436a-9eae-f207cb656096
description: |
  Detects execution of Rubeus, a Kerberos abuse toolkit, by matching the Rubeus.exe image name,
  OriginalFileName, PE Description, or command lines containing action keywords such as asreproast,
  kerberoast, asktgt, s4u, ptt, golden, silver, dump, harvest, renew, and createnetonly. The rule
  fires when the process matches the binary signature OR carries one of these Kerberos-attack
  command-line tokens. Rubeus requests, forges, harvests, and injects Kerberos tickets directly
  against the KDC without touching LSASS via Mimikatz-style memory reads, so the immediate questions
  are which Kerberos action ran, whether it was an authorized assessment, which accounts or service
  principals were targeted, and whether ticket use or lateral movement followed.
type: detection
detection_id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-05'
questions:
- source: template:universal.verify_trigger_match
  question: Does this process match the Rubeus signature or a Kerberos-attack command line the rule
    detects?
  context: Confirm the alert is a true positive before investing time. The rule fires when the image
    name, OriginalFileName, or PE Description identifies Rubeus, OR when the command line contains a
    Kerberos action token such as asreproast, kerberoast, asktgt, s4u, ptt, golden, silver, dump, or
    harvest. Review the exact image path, OriginalFileName, Description, and full command line against
    those criteria, and note whether the match came from the binary identity or from a command-line
    token, since a renamed binary still matches on the action keywords.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
  answer_sources:
  - alert
  - process_creation
- source: template:hacking_tool.authorized_engagement
  question: Is this Rubeus execution part of an authorized penetration test or red team engagement?
  context: Rubeus is routinely used in authorized security assessments. Before deeper analysis, check
    whether a pentest or red team exercise is currently scoped to this host or network segment. An
    authorized engagement with matching tool usage and timing resolves the alert without further work;
    an unmatched execution on a production identity-tier host is a credential-access event to run down.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- source: template:hacking_tool.tool_capability_used
  question: Which Rubeus action was invoked?
  context: Rubeus is multi-purpose and the subcommand determines scope and response. asreproast and
    kerberoast harvest crackable hashes; asktgt, asktgs, and s4u request or abuse tickets; ptt injects
    a ticket into a logon session; golden and silver forge tickets from the krbtgt or a service hash;
    dump reads cached tickets from LSA; harvest and monitor poll for new TGTs as logons occur;
    createnetonly spawns a NewCredentials session. Read the first verb and its flags to identify which
    capability ran and therefore which accounts or services are at risk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- source: template:universal.host_user_context
  question: Is this user and host expected to run Kerberos ticket tooling?
  context: Rubeus has no legitimate administrative use on most hosts. Knowing whether the user role and
    host function involve identity administration, AD security testing, or service-account management is
    often the fastest way to separate a sanctioned assessment from an intrusion. Execution by a standard
    user or on a host with no identity-administration role is a strong escalation signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- source: template:credential_access.credential_target_identification
  question: What Kerberos targets were specified -- which SPNs, users, or krbtgt/service hashes?
  context: The Kerberos action's parameters name the targets. kerberoast targets SPNs (watch for
    high-privilege service accounts and mass SPN requests); asreproast targets accounts with
    DONT_REQ_PREAUTH set; asktgt and s4u name /user and /impersonateuser; golden uses the krbtgt hash
    (enabling domain-wide forgery) and silver uses a specific service hash. Extract the named principals
    and SPNs from the command line to determine which accounts may be compromised and whether krbtgt or
    a privileged service account was involved.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- source: attack:T1003.access_verification
  question: Did any process access LSASS memory with high-rights handles around the time of this alert?
  context: Ticket dumping and theft can route through LSASS memory access. Sysmon process-access events
    to lsass.exe with full-rights masks such as 0x1F0FFF or 0x1010 from a process that is not a known
    security tool indicate credential or ticket extraction. Correlate any LSASS access on this host in
    the alert window with the Rubeus execution; absence of LSASS access is consistent with Rubeus's
    direct-to-KDC actions that do not touch LSASS, while presence points to combined credential dumping.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
          - '0x1F0FFF'
          - '0x1010'
          - '0x1410'
          - '0x143A'
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - User
  answer_sources:
  - process_creation
  - edr_console
- source: attack:T1558.003.kerberos_ticket_requests
  question: Did a burst of service-ticket requests using RC4 encryption originate from this host or user
    in the alert window?
  context: Kerberoasting and ticket requests appear in domain controller security logs as 4769 events.
    RC4 encryption (ticket encryption type 0x17) on a service ticket request in a modern AES environment,
    or many 4769 requests for different SPNs from one account in a short window, is the on-the-wire
    signature of kerberoast and ticket harvesting. If domain controller security logs are not ingested
    in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and
    pivot to the command-line action instead.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4769
        TicketEncryptionType: '0x17'
      condition: selection
    fields:
      - TargetUserName
      - ServiceName
      - IpAddress
  answer_sources:
  - manual_review
  - active_directory
- source: attack:T1550.003.ticket_injection_modules
  question: What modules were loaded by the Rubeus process, and is there evidence of ticket injection
    into a logon session?
  context: Rubeus is a .NET assembly, so it loads the CLR (clr.dll, mscoree.dll) and Kerberos/LSA-related
    libraries; ptt and createnetonly inject tickets into logon sessions via LSA authentication-package
    calls. Reviewing the modules loaded by the alerting binary helps confirm a .NET hacktool and
    distinguishes ticket-injection activity (ptt) from request-only actions. Pair the module evidence
    with new logon sessions that have no corresponding interactive logon, which is the pass-the-ticket
    pattern.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
  answer_sources:
  - process_creation
  - manual_review
- source: template:hacking_tool.tool_specific_artifacts
  question: Were ticket or output files written by this process, such as .kirbi files or base64 ticket
    dumps?
  context: Rubeus emits tickets as base64-wrapped KRB-CRED blobs and operators commonly convert them to
    .kirbi files for reuse; dump and harvest write captured tickets, and outfile flags write hashcat
    input. File creation events from the Rubeus process -- .kirbi, .ccache, ticket dumps, or hash output
    files in user temp or working directories -- confirm credential material left the process and may be
    staged for offline cracking or replay even after the process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- source: template:cue_process_tool.process_chain
  question: What process spawned Rubeus, and is that parent chain expected?
  context: The parent process reveals how Rubeus was launched. A direct interactive shell (explorer.exe,
    cmd.exe, powershell.exe started by a user) suggests hands-on-keyboard operation; an unusual parent
    such as a remote-execution service, a web/application server, or a scripting host points to remote
    delivery or execution from another tool. Walking up from the immediate parent shows whether this
    fits a known administrative path or an injected execution chain.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this Rubeus pattern, what parents and users drove it, and
    does the current alert fit that history?
  context: Even where security testing occurs, the firing pattern has a pattern. The query mirrors the
    rule's selection scoped to this host, so the resulting parent/user distribution reflects how this
    specific Rubeus pattern has run here before. A new parent process, an unexpected user account, or a
    first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Rubeus.exe
      - OriginalFileName: Rubeus.exe
      - Description: Rubeus
      - CommandLine|contains:
        - 'asreproast '
        - 'dump /service:krbtgt '
        - dump /luid:0x
        - 'kerberoast '
        - 'createnetonly /program:'
        - 'ptt /ticket:'
        - '/impersonateuser:'
        - 'renew /ticket:'
        - 'asktgt /user:'
        - 'harvest /interval:'
        - 's4u /user:'
        - 's4u /ticket:'
        - 'hash /password:'
        - 'golden /aes256:'
        - 'silver /user:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- source: template:cue_process_tool.scope
  question: Have other hosts fired this Rubeus pattern in the past week, and does the cross-host spread
    look like a coordinated assessment or isolated activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count
    of this Rubeus firing pattern rather than generic binary usage. Many hosts firing the same pattern in
    a tight window points to a scoped red-team sweep or scripted deployment; a single host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Rubeus.exe
      - OriginalFileName: Rubeus.exe
      - Description: Rubeus
      - CommandLine|contains:
        - 'asreproast '
        - 'dump /service:krbtgt '
        - dump /luid:0x
        - 'kerberoast '
        - 'createnetonly /program:'
        - 'ptt /ticket:'
        - '/impersonateuser:'
        - 'renew /ticket:'
        - 'asktgt /user:'
        - 'harvest /interval:'
        - 's4u /user:'
        - 's4u /ticket:'
        - 'hash /password:'
        - 'golden /aes256:'
        - 'silver /user:'
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Rubeus.exe
      - OriginalFileName: Rubeus.exe
      - Description: Rubeus
      - CommandLine|contains:
        - 'asreproast '
        - 'dump /service:krbtgt '
        - dump /luid:0x
        - 'kerberoast '
        - 'createnetonly /program:'
        - 'ptt /ticket:'
        - '/impersonateuser:'
        - 'renew /ticket:'
        - 'asktgt /user:'
        - 'harvest /interval:'
        - 's4u /user:'
        - 's4u /ticket:'
        - 'hash /password:'
        - 'golden /aes256:'
        - 'silver /user:'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Rubeus.exe
      - OriginalFileName: Rubeus.exe
      - Description: Rubeus
      - CommandLine|contains:
        - 'asreproast '
        - 'dump /service:krbtgt '
        - dump /luid:0x
        - 'kerberoast '
        - 'createnetonly /program:'
        - 'ptt /ticket:'
        - '/impersonateuser:'
        - 'renew /ticket:'
        - 'asktgt /user:'
        - 'harvest /interval:'
        - 's4u /user:'
        - 's4u /ticket:'
        - 'hash /password:'
        - 'golden /aes256:'
        - 'silver /user:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging on other
    endpoints. If the same user ran tooling or triggered similar activity on multiple hosts in the
    window, the scope of compromise is larger than this single host. This is the standard next pivot
    after identifying the actor.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Rubeus.exe
      - OriginalFileName: Rubeus.exe
      - Description: Rubeus
      - CommandLine|contains:
        - 'asreproast '
        - 'dump /service:krbtgt '
        - dump /luid:0x
        - 'kerberoast '
        - 'createnetonly /program:'
        - 'ptt /ticket:'
        - '/impersonateuser:'
        - 'renew /ticket:'
        - 'asktgt /user:'
        - 'harvest /interval:'
        - 's4u /user:'
        - 's4u /ticket:'
        - 'hash /password:'
        - 'golden /aes256:'
        - 'silver /user:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
