name: AgentExecutor PowerShell Execution
id: a1c4c99c-cb84-4a13-bc3b-22f2b34b78f0
description: |
  Detects AgentExecutor.exe — a Microsoft-signed Intune Management Extension component — invoked with the ' -powershell' or ' -remediationScript' arguments by a parent other than the Intune agent. The rule fires when an Image or OriginalFileName of AgentExecutor.exe runs with one of those command-line flags AND the parent is not Microsoft.Management.Services.IntuneWindowsAgent.exe. AgentExecutor proxies execution: it spawns powershell.exe to run a script with ExecutionPolicy Bypass, and will also run any binary named powershell.exe placed in the folder named by its 6th positional argument. Legitimately it is driven by the Intune agent for managed script deployment; when launched by an unexpected parent it is a living-off-the-land path to run unsigned scripts or substitute a planted executable. Investigate the full command line, the substituted folder path, the parent that launched it, and what the proxied PowerShell or EXE then did.
type: detection
detection_id: 7efd2c8d-8b18-45b7-947d-adfe9ed04f61
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-05'
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event show AgentExecutor.exe running with the ' -powershell' or ' -remediationScript' argument under a non-Intune parent?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when AgentExecutor.exe (by Image or OriginalFileName) runs with ' -powershell' or ' -remediationScript' AND the parent is not the Intune agent (Microsoft.Management.Services.IntuneWindowsAgent.exe). Review the exact command line, the image/original filename, and the parent against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run Intune AgentExecutor-driven script execution outside the Intune agent?
  context: Legitimate AgentExecutor activity is driven by the IntuneManagementExtension service for managed PowerShell and Win32-app detection scripts. A managed endpoint where the parent is the Intune agent is routine; the same binary launched by a different parent, or on a host not enrolled in Intune, is the deviation. Knowing whether this host is Intune-managed and whether the user normally performs management tasks is often the fastest triage path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1218.command_analysis
  question: What does the full AgentExecutor command line reveal — which script path is being run, and what folder is named in the 6th positional argument?
  context: AgentExecutor's arguments carry the operational intent. The script path after ' -powershell' is the .ps1 it proxies to PowerShell with ExecutionPolicy Bypass; the 6th positional argument names the folder PowerShell is launched from. A planted binary named powershell.exe in that folder is executed instead of the real interpreter, so a folder path under a user-writable or unusual location is the load-bearing detail. Decode the path, the script reference, and any URLs or staging directories.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the proxied PowerShell command or script encoded or obfuscated, and what does it decode to?
  context: AgentExecutor runs the referenced script with ExecutionPolicy Bypass, so any obfuscation in that script or in a downstream powershell.exe invocation is what hides the real payload. Base64-encoded commands (-EncodedCommand / -enc), string concatenation, backtick escaping, and download cradles are common. Decoding reveals the actual action — download cradles, reverse shells, or in-memory .NET assembly loads.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full content of the script AgentExecutor proxied?
  context: Windows Event ID 4104 records the deobfuscated script content PowerShell actually executes, even when the AgentExecutor command line or the script itself is encoded. This is ground truth for what ran through the proxied interpreter. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host in the hour before this execution?
  context: AgentExecutor already runs scripts with ExecutionPolicy Bypass, but an operator staging abuse often also disables AMSI, changes execution policy globally, or downgrades to PowerShell v2 to evade logging. Finding these precursor events strengthens the case that the AgentExecutor invocation is part of hands-on activity rather than benign management.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: attack:T1218.parent_process_analysis
  question: What process spawned AgentExecutor.exe, and is that parent chain expected for this binary?
  context: The rule only fires when the parent is not the Intune agent (Microsoft.Management.Services.IntuneWindowsAgent.exe), so the actual parent is the central question. A legitimate enrolled host launches AgentExecutor from the IntuneManagementExtension service chain; a parent like cmd.exe, an Office application, a script host, or an unknown binary indicates the proxy is being driven manually. Walk up to what spawned the parent for the full invocation chain.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.image_load
  question: What modules did the AgentExecutor process load, and were any unsigned or loaded from a user-writable path?
  context: Proxy-execution abuse of a signed binary often shows up as the trusted process loading attacker-supplied or unsigned DLLs, or modules from temp/AppData/user-writable directories rather than System32. Reviewing the image loads for the AgentExecutor process distinguishes a clean Microsoft-signed module set from side-loaded or planted code riding inside the trusted process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.network_connection
  question: Did the AgentExecutor process or the PowerShell it proxied make outbound network connections, and to where?
  context: System-binary proxy execution frequently retrieves a remote payload or beacons after launch — the proxied script can fetch and run externally hosted content. Outbound connections from the AgentExecutor process or its child PowerShell, especially to non-enterprise or newly seen destinations, point to remote payload retrieval or command-and-control. Compare destinations against known management and update endpoints.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.follow_on
  question: What child processes did AgentExecutor.exe spawn afterward?
  context: AgentExecutor's purpose is to spawn an interpreter — normally the real powershell.exe, but it will run any binary named powershell.exe placed in the folder named by its 6th positional argument. The children reveal what actually executed. A powershell.exe running from an unexpected directory, or follow-on cmd.exe/certutil.exe/rundll32.exe, indicates the proxy launched substituted or post-exploitation code rather than a benign management script.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a legitimate Intune component can be abused. This query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image: \AgentExecutor.exe
      - OriginalFileName: AgentExecutor.exe
      selection_cli:
        CommandLine|contains:
        - ' -powershell'
        - ' -remediationScript'
      filter_main_intune:
        ParentImage|endswith: \Microsoft.Management.Services.IntuneWindowsAgent.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image: \AgentExecutor.exe
      - OriginalFileName: AgentExecutor.exe
      selection_cli:
        CommandLine|contains:
        - ' -powershell'
        - ' -remediationScript'
      filter_main_intune:
        ParentImage|endswith: \Microsoft.Management.Services.IntuneWindowsAgent.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image: \AgentExecutor.exe
      - OriginalFileName: AgentExecutor.exe
      selection_cli:
        CommandLine|contains:
        - ' -powershell'
        - ' -remediationScript'
      filter_main_intune:
        ParentImage|endswith: \Microsoft.Management.Services.IntuneWindowsAgent.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar activity on several hosts, the scope of the operation may be larger than this one alert. This pivot is meaningful when the alert fires under a named user rather than a service principal.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image: \AgentExecutor.exe
      - OriginalFileName: AgentExecutor.exe
      selection_cli:
        CommandLine|contains:
        - ' -powershell'
        - ' -remediationScript'
      filter_main_intune:
        ParentImage|endswith: \Microsoft.Management.Services.IntuneWindowsAgent.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic AgentExecutor usage. Many hosts firing the same pattern points to a scripted deployment or management automation that bypasses the expected Intune parent; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image: \AgentExecutor.exe
      - OriginalFileName: AgentExecutor.exe
      selection_cli:
        CommandLine|contains:
        - ' -powershell'
        - ' -remediationScript'
      filter_main_intune:
        ParentImage|endswith: \Microsoft.Management.Services.IntuneWindowsAgent.exe
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct the full timeline leading up to the proxy execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
