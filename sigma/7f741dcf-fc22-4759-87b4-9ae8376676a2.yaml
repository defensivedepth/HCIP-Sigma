  - hint: 'logsource ''image_load'' (recommended by techniques: T1548.002) is not covered — pull in cue_image_load.* or author
      a custom question with `category: image_load`'
    disposition: declined
    reason: >-
      The fodhelper bypass executes via a per-user registry redirection that fodhelper.exe reads, not via DLL/COM image
      loading into fodhelper itself; image_load on fodhelper.exe returns its normal module set without precision for the
      bypass. The bypass mechanism is instead covered at registry_set (Q5) and the staging interpreter write (Q6). No
      compensating attack:T1548.002.image_load question authored.
  - hint: 'logsource ''process_access'' (recommended by techniques: T1548.002) is not covered and no template family exists
      — author a custom question with `category: process_access`'
    disposition: declined
    reason: >-
      process_access (handle/token manipulation between processes) characterizes token-theft escalations such as potato
      exploits, not the fodhelper registry-redirection bypass which produces no cross-process access on the bypass path.
      The elevation outcome is instead confirmed via the elevated-action integrity query (Q7) and the privilege-assignment
      correlation (Q8). No process_access question authored.
  - hint: 'logsource ''registry_set'' (recommended by techniques: T1548.002) is not covered — pull in cue_registry_key.* or
      author a custom question with `category: registry_set`'
    disposition: acted-on
    reason: >-
      Authored Q5 (attack:T1548.002.bypass_registry_artifact) with category: registry_set targeting the
      ms-settings\Shell\Open\command DelegateExecute key — the exact registry artifact that drives the fodhelper bypass.
