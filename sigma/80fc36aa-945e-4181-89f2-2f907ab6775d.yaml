name: UAC Bypass Using IEInstal - Process
id: b6a0981b-b7aa-49d7-bf78-7cd373bb4720
description: |
  Detects the IEInstal.exe UAC bypass pattern (UACMe method 64): ieinstal.exe acting as parent to a
  consent.exe instance whose image path lives under \AppData\Local\Temp\, running at High or System
  integrity. The technique abuses an auto-elevated proxy to relocate or hijack the elevation consent
  flow, escalating a split-token administrator from medium to high integrity without a prompt. The rule
  fires when all conditions match together (parent ieinstal.exe AND child consent.exe AND a Temp-path
  image AND an elevated integrity level). Investigation should confirm the parent-child lineage and
  Temp-path origin, identify what registry or COM manipulation set up the bypass, and determine what
  the attacker did with the elevated privileges immediately afterward.
type: detection
detection_id: 80fc36aa-945e-4181-89f2-2f907ab6775d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event match the IEInstal UAC bypass pattern — ieinstal.exe spawning a consent.exe whose image sits under \AppData\Local\Temp\ at High or System integrity?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the parent image, the child image path, and the integrity level against the rule's detection criteria. A genuine match shows ieinstal.exe as the parent, an image ending in consent.exe located under a user Temp directory, and a High/System integrity token.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - IntegrityLevel
- source: template:parent_child.parent_process_legitimacy
  question: Is ieinstal.exe expected to spawn consent.exe here, and what started ieinstal.exe itself?
  context: The parent-child relationship is the core signal for this detection. consent.exe is normally launched by the system, not by ieinstal.exe; tracing the parent's own origin reveals whether the chain is a legitimate installer flow or an attacker-controlled process that invoked ieinstal.exe to drive the bypass.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to perform privileged installer or elevation operations?
  context: UAC bypass requires an administrator-group user with the default split-token configuration. Knowing whether the user role and host function involve legitimate elevated software installation helps distinguish a sanctioned admin action from an attacker abusing the auto-elevate path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.sibling_processes
  question: What other child processes did this same ieinstal.exe instance spawn?
  context: If ieinstal.exe was driven to perform the bypass, it likely spawned additional processes beyond the consent.exe that triggered the alert. Multiple children from the same parent instance reveals the full scope of activity orchestrated through this elevation chain.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.mechanism_decode
  question: What is ieinstal.exe doing on this host — review its own command line and working directory?
  context: ieinstal.exe is the IE Add-on Installer; its presence as an active parent driving an elevation flow is itself the anomaly. Reviewing its command line and current directory shows whether it was invoked normally or coerced into the auto-elevate path that copies consent.exe into a Temp location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1548.002.tuning_parameter
  question: What is the exact Temp-path image of the consent.exe that ran, and is the binary at that path the legitimate signed system file?
  context: The bypass relocates or substitutes consent.exe into a user-writable \AppData\Local\Temp\ directory rather than running it from System32. The exact path and the binary's signature at that path distinguish a legitimate relocated copy from a planted or modified consent.exe used to hijack the elevation flow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: attack:T1548.002.registry_set
  question: Were registry keys under the auto-elevate shell-handler or COM locations modified shortly before the bypass?
  context: Many UAC bypasses write a command into an HKCU shell-handler or COM key that an auto-elevated process reads and executes (for example HKCU\Software\Classes\ms-settings\Shell\Open\command or DelegateExecute entries). Finding such a registry write in the registry_set log before the consent.exe spawn confirms the bypass mechanism and reveals the payload that ran elevated.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - 'Shell\Open\command'
          - 'DelegateExecute'
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Software\Classes'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: attack:T1548.002.process_access
  question: Did any process open a handle to consent.exe with rights that allow memory or token manipulation around the bypass?
  context: Some elevation-consent abuses inject into or manipulate the consent.exe process rather than relying solely on registry handlers. A cross-process access to consent.exe carrying write-memory or token-related rights, especially from a non-system caller, points to direct manipulation of the elevation flow rather than a benign relocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\consent.exe'
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: template:uac_bypass.elevated_action_after_bypass
  question: What action was performed at High or System integrity on this host shortly after the bypass?
  context: 'UAC bypass is a means to an end -- attackers elevate to perform actions that require high integrity: installing persistence, dumping credentials, tampering with security tools, or accessing protected resources. Examining processes spawned at elevated integrity shortly after the consent.exe spawn reveals the attacker''s objective.'
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- source: template:uac_bypass.bypass_technique_registry_artifacts
  question: Did reg.exe, powershell.exe, or cmd.exe write to a known UAC bypass shell-handler key before the consent.exe spawn?
  context: Many UAC bypass techniques set up the elevation by writing a command to a registry key via a command-line tool. Common targets include HKCU\Software\Classes\ms-settings\Shell, mscfile\shell, and exefile handlers. A command-line registry write just before the bypass confirms the mechanism and reveals the exact payload staged for elevated execution.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- source: template:uac_bypass.other_escalation_attempts
  question: Were other privilege escalation or UAC bypass techniques attempted on this host?
  context: Attackers who attempt one UAC bypass often try multiple methods until one succeeds, especially if the OS version or configuration blocks certain techniques. Finding multiple bypass or escalation detections from the same host confirms deliberate privilege escalation activity rather than a false positive.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:cue_parent_process.baseline
  question: Has ieinstal.exe spawning consent.exe ever happened on this host before?
  context: consent.exe being launched by ieinstal.exe is not a routine relationship; the system normally launches consent.exe itself. Zero or very low historical counts of this specific parent-child pairing indicate a novel spawning relationship consistent with bypass tooling rather than legitimate software behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
        ParentImage|endswith: \ieinstal.exe
        Image|contains: \AppData\Local\Temp\
        Image|endswith: consent.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
        ParentImage|endswith: \ieinstal.exe
        Image|contains: \AppData\Local\Temp\
        Image|endswith: consent.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar elevation activity on other hosts, the scope of compromise may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
        ParentImage|endswith: \ieinstal.exe
        Image|contains: \AppData\Local\Temp\
        Image|endswith: consent.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the attack stages that preceded the bypass and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
