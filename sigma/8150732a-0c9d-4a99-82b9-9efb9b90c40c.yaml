name: Suspicious Msiexec Quiet Install From Remote Location
id: 2d1862dd-4a39-4bdc-9331-802e1834ba9b
description: |
  Detects msiexec.exe invoked to install a package quietly from a remote location: the command line carries an install
  flag (-i, -package, -a, or -j), a quiet flag (-q), and a remote source reference (an http URL or a UNC \\ path), while
  the OpenOffice temp-installer path is excluded. msiexec.exe is a trusted, signed Windows binary, so this pattern lets an
  operator fetch and run an installer package without a visible UI and proxy execution through a Microsoft-signed process.
  Legitimate software deployment and vendor automation can match this pattern; the investigation should confirm the package
  source, the parent that launched msiexec, what the install spawned afterward, and whether the host or user normally performs
  remote quiet installs.
type: detection
detection_id: 8150732a-0c9d-4a99-82b9-9efb9b90c40c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the msiexec command line carry an install flag, a quiet flag, and a remote http or UNC source together?
  context: Confirm this is a true positive before investing time. The rule fires only when an install flag (-i, -package,
    -a, or -j) AND the quiet flag (-q) AND a remote reference (http or a \\ UNC path) all appear on the same msiexec command
    line, and the OpenOffice temp-installer path is absent. Read the full command line and verify all three conditions are
    present rather than an unrelated msiexec invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to install software packages quietly from a remote location?
  context: Quiet remote installs are routine for software deployment tooling, patch management, and vendor automation on
    servers and managed endpoints, but unexpected on a typical workstation under an interactive user. Knowing whether this
    user role and host function deploy remote packages is often the fastest way to separate routine operations from operator
    activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What package did msiexec install? Decode the full command line and identify the remote source and any install
    properties.
  context: The full command line reveals exactly what was installed and from where. Decode the remote source — an http(s)
    URL or a \\ UNC path — and note any msiexec properties or transforms passed after the install flag. A package fetched
    from an external domain, a raw IP, or a network-attached storage host, rather than an internal deployment share, raises
    the concern. This scopes to all msiexec executions on this host within the window, which can surface a multi-step install
    sequence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned msiexec, and is that parent chain expected for a remote quiet install?
  context: The parent process reveals how the install was invoked. Legitimate deployment usually descends from a management
    agent, a service, or an installer wrapper. A parent such as cmd.exe launched from a shortcut, a script host, or an Office
    application is more consistent with user-initiated or scripted delivery of a remote package than with managed deployment.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.007.module_load
  question: What modules did msiexec load shortly after this execution, and were any unsigned or loaded from a user-writable
    path?
  context: After fetching a remote package, msiexec can side-load or execute a DLL delivered with the install, which is a
    core way trusted-binary proxy execution runs attacker code. Module loads from user-writable directories (AppData, Temp,
    ProgramData), or unsigned modules, alongside the msiexec execution indicate the install carried executable content rather
    than a benign data package. If image-load events are not ingested in this environment, treat zero results as a visibility
    gap rather than evidence nothing loaded.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \msiexec.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.007.network_correlation
  question: What network destinations did msiexec connect to around this execution, and were any previously unseen external
    hosts?
  context: A remote quiet install means msiexec itself reaches out to fetch the package, so the destination it contacted is
    the payload source. Connections to an external domain, a raw IP, a non-standard port, or a network-attached storage host
    not previously seen for installs identify where the package came from and are the pivot for scoping further retrieval.
    Correlate the connection time with the process execution to tie the fetch to this install. If network events are not
    ingested in this environment, treat zero results as a visibility gap.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \msiexec.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.follow_on
  question: What child processes did msiexec spawn after the install?
  context: The processes an install spawns reveal its real impact. A benign package may run a setup helper; proxy-execution
    abuse often spawns command interpreters or other signed binaries (regsvr32.exe, rundll32.exe, odbcconf.exe, control.exe,
    cmd.exe, powershell.exe) to continue execution after the package lands. Unexpected children indicate the install delivered
    more than a product.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Remote quiet installs that turn out to be malicious rarely happen alone. Activity surrounding the msiexec execution
    may reveal reconnaissance, additional proxy-execution binaries, persistence setup, or staging that provides broader context
    for the install.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the
    current alert fit?
  context: Even routine deployment tooling can match this pattern. The query mirrors the rule's selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this specific remote-quiet-install pattern has
    historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msiexec.exe
      - OriginalFileName: msiexec.exe
      selection_cli:
        CommandLine|contains|windash:
        - -i
        - -package
        - -a
        - -j
      selection_quiet:
        CommandLine|contains|windash: -q
      selection_remote:
        CommandLine|contains:
        - http
        - \\\\
      filter_optional_openoffice:
        CommandLine|contains|all:
        - \AppData\Local\Temp\OpenOffice
        - Installation Files\openoffice
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    remote-quiet-install pattern rather than generic msiexec usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msiexec.exe
      - OriginalFileName: msiexec.exe
      selection_cli:
        CommandLine|contains|windash:
        - -i
        - -package
        - -a
        - -j
      selection_quiet:
        CommandLine|contains|windash: -q
      selection_remote:
        CommandLine|contains:
        - http
        - \\\\
      filter_optional_openoffice:
        CommandLine|contains|all:
        - \AppData\Local\Temp\OpenOffice
        - Installation Files\openoffice
      condition: all of selection_* and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msiexec.exe
      - OriginalFileName: msiexec.exe
      selection_cli:
        CommandLine|contains|windash:
        - -i
        - -package
        - -a
        - -j
      selection_quiet:
        CommandLine|contains|windash: -q
      selection_remote:
        CommandLine|contains:
        - http
        - \\\\
      filter_optional_openoffice:
        CommandLine|contains|all:
        - \AppData\Local\Temp\OpenOffice
        - Installation Files\openoffice
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msiexec.exe
      - OriginalFileName: msiexec.exe
      selection_cli:
        CommandLine|contains|windash:
        - -i
        - -package
        - -a
        - -j
      selection_quiet:
        CommandLine|contains|windash: -q
      selection_remote:
        CommandLine|contains:
        - http
        - \\\\
      filter_optional_openoffice:
        CommandLine|contains|all:
        - \AppData\Local\Temp\OpenOffice
        - Installation Files\openoffice
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user drove similar remote installs or follow-on execution on other hosts, the scope of the activity may be
    larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msiexec.exe
      - OriginalFileName: msiexec.exe
      selection_cli:
        CommandLine|contains|windash:
        - -i
        - -package
        - -a
        - -j
      selection_quiet:
        CommandLine|contains|windash: -q
      selection_remote:
        CommandLine|contains:
        - http
        - \\\\
      filter_optional_openoffice:
        CommandLine|contains|all:
        - \AppData\Local\Temp\OpenOffice
        - Installation Files\openoffice
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, defense tampering, or
    delivery of a shortcut or script — may reveal the stages that preceded this install and help reconstruct how the remote
    package was fetched and launched.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who proxy execution through one signed binary often use several. After a msiexec remote install, check
    whether regsvr32, rundll32, mshta, odbcconf, control, or similar signed binaries were also used to run code. Finding
    multiple proxy-execution LOLBins in sequence strengthens the case that the install delivered an attacker tool chain
    rather than software.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
          - '\odbcconf.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was msiexec executed from its expected System32 or SysWOW64 path?
  context: msiexec.exe run from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade
    path-based allowlists. A msiexec.exe running from a user's temp directory or AppData is more notable than one in its
    standard system location. Compare the executable path and original file name against the expected install location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this rule's msiexec pattern over the past 90 days, and what command-line structures are
    typical?
  context: A remote-quiet-install pattern with no prior history on a host is more notable than one used regularly under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this
    specific firing pattern rather than generic msiexec usage. The command-line projection lets the analyst compare typical
    invocation patterns — source URLs, packages, properties — against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msiexec.exe
      - OriginalFileName: msiexec.exe
      selection_cli:
        CommandLine|contains|windash:
        - -i
        - -package
        - -a
        - -j
      selection_quiet:
        CommandLine|contains|windash: -q
      selection_remote:
        CommandLine|contains:
        - http
        - \\\\
      filter_optional_openoffice:
        CommandLine|contains|all:
        - \AppData\Local\Temp\OpenOffice
        - Installation Files\openoffice
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
