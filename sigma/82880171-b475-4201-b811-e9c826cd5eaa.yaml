name: Exports Critical Registry Keys To a File
id: d928c778-4800-4fd0-adc9-7d9e82e88859
description: |
  Detects regedit.exe exporting a registry hive to a file (the -E / -e switch) when the target is one of the
  credential-bearing system hives — SAM, SECURITY, or SYSTEM — or the broader HKLM tree. Exporting these hives writes
  their contents to disk where the password hashes and LSA secrets they hold can be carried off-host and cracked or
  replayed offline. The rule fires only when all of: the binary resolves to regedit.exe, the command line carries the
  export switch, references HKLM / HKEY_LOCAL_MACHINE, AND the path ends in \system, \sam, or \security. Legitimate
  causes exist (backup, forensic capture); the investigation should determine who exported which hive, where the output
  file went, and whether the activity sits inside a broader discovery or credential-access sequence.
type: detection
detection_id: 82880171-b475-4201-b811-e9c826cd5eaa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did regedit.exe run with the export switch against the SAM, SECURITY, or SYSTEM hive?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when regedit.exe
    (or a binary whose OriginalFileName is REGEDIT.EXE) runs with the -E export switch, references HKLM or
    HKEY_LOCAL_MACHINE, and targets a path ending in \system, \sam, or \security. Read the full command line and confirm
    all of those elements are present, and note which hive was exported and the output file path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user and host expected to export system registry hives?
  context: Backup operators, forensic responders, and some imaging workflows legitimately export registry hives. Standard
    users and most workstations have no routine need to dump SAM, SECURITY, or SYSTEM to a file. The user's role and the
    host's function determine whether this is routine maintenance or anomalous credential-access staging.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: attack:T1012.export_decode
  question: Which hive was exported and to what output file, and is that destination a normal location?
  context: The export switch is followed by the output file path and then the hive name. SAM, SECURITY, and SYSTEM carry
    password hashes and LSA secrets; exporting any of them to a file makes those secrets portable. Decode the command line
    to confirm exactly which hive was targeted and where the .reg / file output was written — a path under a user profile,
    a temp directory, an alternate data stream, or a network share shifts the disposition toward credential theft rather
    than maintenance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Dumping the SAM, SECURITY, or SYSTEM hive is a credential-access action that operators often precede by
    weakening protection. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad
    exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level
    driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator
    preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned regedit.exe, and is that parent chain normal for a hive export?
  context: An interactive export is typically launched from explorer.exe or a command prompt a user opened. regedit.exe
    spawned by a script interpreter (wscript.exe, cscript.exe, mshta.exe, powershell.exe), an Office application,
    wmiprvse.exe (WMI remote execution), or wsmprovhost.exe (WinRM) points to automated or remote credential-access
    staging rather than hands-on administration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run regedit.exe to export hives?
  context: A host that has never run regedit.exe is more suspicious than one where it appears regularly. Zero or very low
    historical counts over the baseline window indicate first-time or rare execution of the export tool on this endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even legitimate hive exports leave a footprint. This query mirrors the rule's selection structure scoped to this
    host — the resulting parent/user distribution reflects how this specific export pattern (not generic regedit usage) has
    historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli_1:
        CommandLine|contains|windash: ' -E '
      selection_cli_2:
        CommandLine|contains:
        - hklm
        - hkey_local_machine
      selection_cli_3:
        CommandLine|endswith:
        - \system
        - \sam
        - \security
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did regedit.exe spawn afterward?
  context: regedit.exe does not normally spawn child processes during an export. Children such as cmd.exe, powershell.exe,
    certutil.exe, or an archiving tool appearing immediately after the export suggest the exported hive was being moved,
    compressed, or staged for transfer.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    export pattern (not generic regedit usage). Many hosts firing the same pattern points to a scripted backup job or
    imaging automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli_1:
        CommandLine|contains|windash: ' -E '
      selection_cli_2:
        CommandLine|contains:
        - hklm
        - hkey_local_machine
      selection_cli_3:
        CommandLine|endswith:
        - \system
        - \sam
        - \security
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli_1:
        CommandLine|contains|windash: ' -E '
      selection_cli_2:
        CommandLine|contains:
        - hklm
        - hkey_local_machine
      selection_cli_3:
        CommandLine|endswith:
        - \system
        - \sam
        - \security
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli_1:
        CommandLine|contains|windash: ' -E '
      selection_cli_2:
        CommandLine|contains:
        - hklm
        - hkey_local_machine
      selection_cli_3:
        CommandLine|endswith:
        - \system
        - \sam
        - \security
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user exported hives or ran other sensitive commands on multiple hosts, the scope of the credential-access
    activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli_1:
        CommandLine|contains|windash: ' -E '
      selection_cli_2:
        CommandLine|contains:
        - hklm
        - hkey_local_machine
      selection_cli_3:
        CommandLine|endswith:
        - \system
        - \sam
        - \security
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single hive export may be legitimate maintenance, but multiple reconnaissance commands clustered around it --
    whoami, net user, nltest, tasklist -- is a signature of post-compromise enumeration. Attackers commonly profile their
    context and harvest credentials in the same short window, so co-occurring recon raises the weight of the export. This
    also reflects how closely the surrounding activity follows the export in time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:registry.registry_related_modifications
  question: Were other registry export or modification commands run on this host in the same session?
  context: An operator harvesting credentials often touches the registry more than once -- exporting several hives, or
    pairing the export with reg.exe writes. Finding clusters of reg.exe / regedit.exe invocations from the same host within
    a short window reveals the full scope of registry activity and whether multiple hives or keys were targeted.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - ' export '
          - ' -E '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or
    privilege escalation -- may reveal the attack stages that preceded the hive export and help reconstruct the full
    timeline leading up to credential access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:data_staging_exfil.archive_destination
  question: Where was the exported hive file written, and was it moved or copied off the host afterward?
  context: The export writes the hive contents to a file specified on the command line. That output file is the staged
    credential material. Checking for file events created by regedit.exe -- and subsequent moves, copies, or compression --
    reveals whether the dumped hive stayed local for legitimate backup or was relocated toward a staging area, removable
    media, or a network share for exfiltration.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
