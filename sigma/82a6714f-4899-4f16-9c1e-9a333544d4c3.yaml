name: File In Suspicious Location Encoded To Base64 Via Certutil.EXE
id: 883193d3-a3b5-4860-893b-6949fec22b0a
description: |
  Detects certutil.exe (or a binary whose OriginalFileName is CertUtil.exe) invoked with the -encode flag against a file
  that resides in a user-writable or transient location (AppData\Roaming, Desktop, Local\Temp, PerfLogs, Users\Public,
  Windows\Temp, or $Recycle.Bin). The rule fires only when the certutil/OriginalFileName condition AND the -encode flag
  AND one of those path strings are all present in the command line. Certutil -encode is a signed-binary primitive for
  rendering file content as base64 text; legitimately it is rare, while operators use it to stage recon output for
  exfiltration, to obfuscate payloads past content inspection, or as a pseudo-ransomware effect that converts user files
  into unreadable base64. Investigation should confirm the source file and encoded output path, identify the parent that
  drove the encode, and determine whether the activity is a one-off automation step or part of a multi-stage operation.
type: detection
detection_id: 82a6714f-4899-4f16-9c1e-9a333544d4c3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show certutil running -encode against a file in a user-writable or temporary location?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only
    when the image is certutil.exe (or OriginalFileName CertUtil.exe), the -encode flag is present, AND the command line
    references one of the watched locations (AppData\Roaming, Desktop, Local\Temp, PerfLogs, Users\Public, Windows\Temp,
    or $Recycle.Bin). Verify all three conditions are genuinely present and identify the source file and the output path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run certutil -encode against files in these locations?
  context: Certutil -encode is rarely part of routine administration; it appears in software packaging and a few legacy
    workflows but is uncommon on most endpoints. Knowing whether this user's role and the host's function involve encoding
    file content is often the fastest way to separate a legitimate packaging step from operator staging or obfuscation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this certutil invocation do? Identify the source file, the encoded output path, and any other flags.
  context: The full command line reveals the operation. For certutil -encode, identify the source file being read and the
    output path being written, and note whether the output extension is renamed (for example a .jpg or .acl masquerade) to
    blend the base64 result with benign content. Because some staging routines issue several sequential certutil calls,
    this scopes to all certutil executions on the host within the window rather than only the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:obfuscation.encoded_payload_decode
  question: What is the source file being encoded, and what does its content represent once decoded back from base64?
  context: The encoded output is base64 text derived from the source file named in the command line. Retrieve the source
    file (or the encoded output and reverse it with -decode) to see what was actually staged — recon command output, a
    payload being obfuscated past content inspection, or user documents being rendered unreadable. Entropy of the output is
    a tuning input, not a verdict; base64 raises apparent entropy regardless of intent, so judge by the decoded content, not
    by the encoding alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1027.time_correlation
  question: What process activity occurred on this host in the minutes immediately around the encode, and does a script or shell precede it?
  context: Encoding a file is rarely standalone — it typically follows a recon or collection step that produced the file and
    often precedes a deletion or transfer of the encoded copy. Tightening the correlation window around the encode surfaces
    the parent script or shell that drove it and any sibling commands (directory enumeration, systeminfo, file deletion) that
    place the encode inside a staging sequence. A short, tight cluster of related commands points to scripted staging.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:universal.evidence_preservation
  question: Is the encoded output file (and the source file) still on disk for analysis?
  context: If the base64 output or the source file is still present, it enables hashing, reversal with -decode, and content
    review. The output may carry a renamed extension to masquerade as benign content, so match on the path written by the
    command rather than on extension alone.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:lolbin.renamed_binary_check
  question: Was certutil.exe executed from its expected System32 or SysWOW64 path?
  context: Certutil run from outside System32 or SysWOW64 — for example from a user temp directory or a download folder — may
    have been copied or renamed to evade path-based allowlists. Compare the Image path against the standard locations and
    confirm OriginalFileName is CertUtil.exe even if the on-disk name differs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.process_chain
  question: What process spawned certutil, and is that parent chain expected for an encode operation?
  context: The parent process reveals how certutil was invoked. A direct interactive launch from explorer.exe or a packaging
    tool differs sharply from certutil spawned by cmd.exe, wscript.exe, mshta.exe, powershell.exe, or an Office application —
    parents that commonly indicate macro or script orchestration. The parent identity is the key tuning input for deciding
    whether this encode is routine; an unusual or script-driven parent for certutil is the deviation worth chasing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:download_tool.download_success_verification
  question: Was the encoded output file actually written to its destination path?
  context: An encode command does not guarantee the output was produced — a missing or unreadable source, a bad path, or a
    permission error can abort it. Confirming creation of the output file at the destination named in the command establishes
    whether the operation completed and a base64 artifact now exists on disk.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the same directory as the encoded file?
  context: A single encode can be one iteration of a loop — some routines enumerate a directory and encode every file in it,
    producing many base64 outputs side by side with the originals. Examining directory-level file activity reveals whether
    this was an isolated encode or a mass-encode sweep across the user's files.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      filter_self:
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection and not filter_self
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.follow_on
  question: What child processes did certutil spawn afterward?
  context: Certutil performing a single encode normally spawns nothing. Child processes such as cmd.exe, powershell.exe, or a
    network or deletion utility launched by this certutil instance would indicate the encode is embedded in a larger automated
    sequence rather than a standalone action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - \AppData\Roaming\
        - \Desktop\
        - \Local\Temp\
        - \PerfLogs\
        - \Users\Public\
        - \Windows\Temp\
        - $Recycle.Bin
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - \AppData\Roaming\
        - \Desktop\
        - \Local\Temp\
        - \PerfLogs\
        - \Users\Public\
        - \Windows\Temp\
        - $Recycle.Bin
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the encode is isolated or part of broader hands-on
    activity — staging, exfiltration, or repeated encoding on multiple endpoints. The same user driving similar activity on
    several hosts widens the scope of the investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - \AppData\Roaming\
        - \Desktop\
        - \Local\Temp\
        - \PerfLogs\
        - \Users\Public\
        - \Windows\Temp\
        - $Recycle.Bin
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this encode pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a signed binary like certutil can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern — certutil -encode against a
    watched location — has historically run here. A new parent process, an unexpected user account, or an unusual command-line
    pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - \AppData\Roaming\
        - \Desktop\
        - \Local\Temp\
        - \PerfLogs\
        - \Users\Public\
        - \Windows\Temp\
        - $Recycle.Bin
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this certutil -encode pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more notable than one used routinely under stable parents. The
    query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern rather
    than generic certutil usage. The command-line projection lets you compare typical invocation patterns against the alerting
    one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - \AppData\Roaming\
        - \Desktop\
        - \Local\Temp\
        - \PerfLogs\
        - \Users\Public\
        - \Windows\Temp\
        - $Recycle.Bin
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were any other encode or decode LOLBins used on this host recently?
  context: Operators who use one LOLBin for encoding or extraction often use several. If certutil -encode staged a file, check
    whether expand, extrac32, or makecab were also used for cabinet packing or extraction, or whether certutil -decode reversed
    a previously staged file. Multiple encode/decode LOLBins on the same host strengthens the case that this is deliberate
    staging rather than incidental use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\esentutl.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
