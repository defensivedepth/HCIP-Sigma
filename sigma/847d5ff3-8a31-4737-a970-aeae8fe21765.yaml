      disposition: query_injection
      target_question: Q8
      notes: "Security service Start-value keys injected into the registry_set selection_keys block; the rule's own selection_product list carries the product names for the process_creation branches."
    - element: ProcessWhitelist
      dimension: process_identification
      specific_values: "rationale only"
      disposition: context
      target_question: Q4
      notes: "Authorized-admin-tool rationale; process_chain identifies the parent so the analyst can judge whether the launcher is an expected deployment tool."
    - element: ServiceNamePatterns
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q3
      notes: "Refine which services are security-critical; the named product in the alerting command line (decoded in what_was_disabled) supplies the concrete target."
