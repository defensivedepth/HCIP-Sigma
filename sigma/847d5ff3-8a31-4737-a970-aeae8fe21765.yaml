name: Potential Tampering With Security Products Via WMIC
id: 0fcc2939-1b34-4d19-817a-00badbf223df
description: |
  Detects use of the WMIC utility to uninstall, terminate, or delete security products. The rule fires when a command line
  names a known security product AND matches at least one of three WMI action patterns: a product-uninstall call
  (product where ... call uninstall /nointeractive), a service caption call delete/terminate, or a process where ... delete.
  WMIC-driven removal of AV/EDR is a defense-evasion step that operators run to blind protection before executing a payload,
  dumping credentials, or deploying ransomware; it can also occur during legitimate software lifecycle management or
  vendor-tool migration. Investigation should confirm which product was targeted, which WMI action pattern fired, whether the
  control is still removed, and what activity followed once protection was weakened.
type: detection
detection_id: 847d5ff3-8a31-4737-a970-aeae8fe21765
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line name a security product AND match a WMIC uninstall, service-delete, or process-delete action?
  context: >-
    Confirm the alert before investing time. The rule fires only when the command line references a known security product
    and matches at least one of three action patterns — either a product-uninstall call (wmic product where ... call uninstall
    /nointeractive), or a service caption call delete/terminate, or a process where ... delete. Read the exact command line
    and note which of the three branches fired, because the branch determines what was actually removed: a product uninstall
    removes the installed AV/EDR package, a service delete/terminate stops or removes a running protection service, and a
    process delete kills a running protection process. The branch that fired drives which downstream questions carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to uninstall or remove security products via command-line WMI?
  context: >-
    Software-lifecycle management and vendor-tool migrations do legitimately remove AV/EDR via WMI, but normally only from
    administrative or deployment accounts on managed endpoints. Knowing whether this user's role and this host's function are
    consistent with security-product removal is often the fastest path to distinguishing a maintenance action from tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which specific security product was named, and which WMI action was taken against it?
  context: >-
    Different targets and actions have different impact. Read the command line to identify the named product (for example
    Carbon Black, Cylance, SentinelOne, Defender, Sophos, McAfee, ESET) and the action pattern — a product uninstall removes
    the package, a caption call delete/terminate stops or removes a service, a process where ... delete kills a running
    process. The named product and action determine remediation priority: a fully uninstalled EDR leaves the host blind,
    while a single terminated process may restart on its own.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this WMIC command, and is that parent chain expected for security-product removal?
  context: >-
    The parent process reveals how WMIC was invoked. Vendor deployment tooling and management consoles produce predictable
    parents; a batch script (cmd.exe running a .bat), a script host (wscript.exe, cscript.exe), powershell.exe, or a remote
    execution tool spawning WMIC to remove AV points to scripted defense evasion rather than routine administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is the targeted security product currently restored, or is the host still unprotected?
  context: >-
    Removal may be temporary (to enable one action) or persistent. Check the current state of the named product — is the
    service running, is the agent reporting, is the package still installed. If the product is still uninstalled or its
    service is still stopped, the control should be restored before further investigation so the host is not left blind.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the security product was removed or terminated?
  context: >-
    Defenses are removed for a reason — to execute a payload, dump credentials, or deploy ransomware that protection would
    otherwise block or log. Examining process activity in the window immediately after the WMI removal reveals what the
    tampering was meant to enable. Correlate with network connections and file events in the same window, and treat a sudden
    drop in expected telemetry as a sign the removed product was actively protecting the host.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense-tampering actions performed on this host around the same time?
  context: >-
    Operators who remove one control often remove several — stopping Defender, clearing event logs, deleting shadow copies,
    and disabling the firewall to maximize coverage. Finding multiple tampering events from the same user or parent process
    in the same window indicates a coordinated removal of protections rather than an isolated maintenance action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: attack:T1562.001.registry_set
  question: Were the registry keys that back security tooling modified on this host in the same window?
  context: >-
    Beyond uninstalling or killing a product, tampering also targets the registry keys that control protection — disabling
    real-time monitoring, flipping Defender Start values, or neutering Sysmon configuration. These edits leave registry_set
    events that command-line removal does not, so checking them surfaces parallel disabling that the WMIC command alone would
    miss. Look for changes under Windows Defender policy keys, the Sysmon driver/service keys, and AV/EDR service Start values.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Windows Defender\'
          - '\Windows Defender Security Center\'
          - '\Sysmon\'
          - '\SysmonDrv\'
          - '\Services\WinDefend\'
          - '\Services\WdNisSvc\'
          - '\Services\Sense\'
          - '\Services\SecurityHealthService\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this WMIC AV-removal pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even routine tooling can produce this pattern. The query mirrors the rule's selection structure scoped to this host, so
    the resulting parent/user distribution reflects how this specific firing pattern — not generic WMIC usage — has run here
    before. A new parent process, an unexpected user account, or an unusual command-line structure compared to the historical
    distribution is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains|all:
        - wmic
        - 'product where '
        - call
        - uninstall
        - /nointeractive
      selection_cli_2:
        CommandLine|contains|all:
        - wmic
        - 'caption like '
        CommandLine|contains:
        - call delete
        - call terminate
      selection_cli_3:
        CommandLine|contains|all:
        - 'process '
        - 'where '
        - delete
      selection_product:
        CommandLine|contains:
        - '%carbon%'
        - '%cylance%'
        - '%endpoint%'
        - '%eset%'
        - '%malware%'
        - '%Sophos%'
        - '%symantec%'
        - Antivirus
        - 'AVG '
        - Carbon Black
        - CarbonBlack
        - Cb Defense Sensor 64-bit
        - Crowdstrike Sensor
        - 'Cylance '
        - Dell Threat Defense
        - DLP Endpoint
        - Endpoint Detection
        - Endpoint Protection
        - Endpoint Security
        - Endpoint Sensor
        - ESET File Security
        - LogRhythm System Monitor Service
        - Malwarebytes
        - McAfee Agent
        - Microsoft Security Client
        - Sophos Anti-Virus
        - Sophos AutoUpdate
        - Sophos Credential Store
        - Sophos Management Console
        - Sophos Management Database
        - Sophos Management Server
        - Sophos Remote Management System
        - Sophos Update Manager
        - Threat Protection
        - VirusScan
        - Webroot SecureAnywhere
        - Windows Defender
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_cli_* and selection_product) and _pb_scope
    fields:
    - ParentImage
    - User
