- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity surrounding the alert reveals the immediate context — what led to
    the WMI removal and what happened after. Novel parent-child pairs at low counts stand out against the repetitive
    background of agent telemetry and point to reconnaissance, privilege escalation, or persistence around the tampering.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
