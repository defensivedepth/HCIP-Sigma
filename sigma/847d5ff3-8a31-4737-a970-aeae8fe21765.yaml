- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or other
    defense-tampering — may reveal the attack stages that preceded the WMI removal and help reconstruct the timeline. Defense
    tampering followed by execution or credential access is a common ordering worth confirming.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around the tampering?
  context: >-
    Removing protection is often paired with establishing or reinforcing a foothold. After weakening defenses, operators
    commonly install backup persistence using scheduled tasks, services, registry Run keys, BITS jobs, or further WMI calls.
    Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
