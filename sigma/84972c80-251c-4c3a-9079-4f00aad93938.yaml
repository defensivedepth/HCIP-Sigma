name: Sensitive File Recovery From Backup Via Wbadmin.EXE
id: 56643203-2330-4c77-8ebc-e8ab3d7e7a2f
description: |
  Detects wbadmin.exe being used to recover sensitive credential-bearing files
  from a backup version, where the command line combines a file-level recovery
  (recovery, recoveryTarget, itemtype:File) with one of the SAM, SECURITY, or
  SYSTEM registry hives or the Active Directory NTDS.dit database. Restoring
  these files to a writable location is the canonical living-off-the-land path
  to stage NTDS.dit plus the SYSTEM hive for offline credential extraction,
  and requires Backup Operators or Administrators privileges. Legitimate
  restores of these exact files are rare; the investigation should confirm the
  recovery target, identify which credential stores were pulled, and determine
  whether the recovered data was staged for exfiltration or offline cracking.
type: detection
detection_id: 84972c80-251c-4c3a-9079-4f00aad93938
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the wbadmin command line match a file-level recovery of the SAM, SECURITY, SYSTEM, or NTDS.dit files?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when wbadmin.exe (or OriginalFileName WBADMIN.EXE) runs a recovery with recoveryTarget and itemtype:File AND the command line references one of the SAM, SECURITY, or SYSTEM registry hives or Windows\NTDS\NTDS.dit. Verify all of these are present in the exact command line and note the recoveryTarget path, since that is where the credential data was written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to recover credential-store files from backup?
  context: File-level recovery of SAM, SECURITY, SYSTEM, or NTDS.dit is almost never part of routine operations. On a domain controller a restore of NTDS.dit may rarely accompany a sanctioned disaster-recovery exercise; on a member server or workstation there is no legitimate reason to recover these specific files. Knowing whether this user holds Backup Operators or Administrators rights and whether a recovery was scheduled is often the fastest way to separate a sanctioned restore from credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Which credential stores were recovered, and were all of the files needed for offline extraction pulled together?
  context: The recovered files determine which credentials are exposed. NTDS.dit holds every domain account hash and requires the SYSTEM hive for the boot key needed to decrypt it; the SAM hive plus SYSTEM yields local account hashes; the SECURITY hive holds LSA secrets and cached domain credentials. Recovery of NTDS.dit together with SYSTEM, or SAM together with SYSTEM, confirms intent to extract credentials offline rather than restore a single damaged file. Read the recoveryTarget to locate where the data now sits.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned wbadmin.exe, and is that parent chain expected for a backup recovery?
  context: The parent reveals how the recovery was launched. A sanctioned restore is typically driven interactively from an elevated console (explorer.exe to cmd.exe or powershell.exe) or by a backup product. An unusual parent — a script host, a remote-execution service, an Office application, or a process running from a user-writable path — points to hands-on-keyboard operator activity rather than administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What did wbadmin.exe spawn afterward, and was the recovered data immediately moved or processed?
  context: A recovery that is part of credential theft is usually followed by activity against the recovered files — copying the recoveryTarget directory to a share, compressing it, launching a hash-extraction tool, or invoking esentutl/ntdsutil against NTDS.dit. Children spawned by wbadmin in the hour after the alert reveal whether the recovered credential stores were staged or processed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts are exposed by the recovered stores, and do any have elevated privileges?
  context: The severity depends on what the recovered files contain. NTDS.dit on a domain controller exposes every domain account, including Domain Admins, Enterprise Admins, krbtgt, and service accounts, and warrants incident escalation and a krbtgt double-reset if confirmed. A SAM hive from a workstation exposes only local accounts. Cross-reference the affected host's role and the accounts it stores against directory group memberships to scope which credentials must be rotated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run wbadmin.exe at all?
  context: A host that has never run wbadmin is more suspicious than one where backup administration is routine. Zero or very low counts over the baseline window indicate first-time or rare execution and raise the priority. High counts on a backup server or domain controller suggest the binary is in regular use, in which case the specific recovery of credential files — not the binary itself — is the anomaly to focus on.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously matched the rule's recovery pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how this specific credential-file recovery pattern has run here before — not generic wbadmin usage. A new parent process, an unexpected user account, or a first-ever match is the deviation worth chasing. If the query returns only the current event, this firing pattern has no precedent on the host.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_backup:
        CommandLine|contains|all:
        - ' recovery'
        - recoveryTarget
        - itemtype:File
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \Windows\NTDS\NTDS.dit
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_backup:
        CommandLine|contains|all:
        - ' recovery'
        - recoveryTarget
        - itemtype:File
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \Windows\NTDS\NTDS.dit
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_backup:
        CommandLine|contains|all:
        - ' recovery'
        - recoveryTarget
        - itemtype:File
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \Windows\NTDS\NTDS.dit
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the credential recovery is one step in a broader operation — reconnaissance, additional credential access, or staging on other endpoints. If the same user triggered similar activity on multiple hosts, the scope of compromise may be larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_backup:
        CommandLine|contains|all:
        - ' recovery'
        - recoveryTarget
        - itemtype:File
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \Windows\NTDS\NTDS.dit
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity surrounding the recovery reveals the immediate context — what led to it and what followed. For a credential dump, look for prior reconnaissance or privilege escalation and for subsequent staging, archiving, or extraction tooling that operates on the recovered files.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts matched the rule's recovery pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific credential-file recovery pattern — not generic wbadmin usage. Many hosts matching the same pattern points to a scripted deployment or a misconfigured backup job; one host or a small unrelated set points to manual operator activity. Use the distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_backup:
        CommandLine|contains|all:
        - ' recovery'
        - recoveryTarget
        - itemtype:File
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \Windows\NTDS\NTDS.dit
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, privilege escalation, or other credential access — may reveal the stages that preceded the recovery and help reconstruct the full timeline. Backup-based credential theft is often a mid-chain action that follows an initial foothold and privilege gain.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:defense_tampering.other_tampering_activity
  question: Were shadow-copy deletion, recovery-disabling, or log-clearing commands also run on this host in the same window?
  context: An operator dumping credentials from backup frequently pairs it with other living-off-the-land defense actions — deleting volume shadow copies, disabling recovery, or clearing event logs to remove evidence of the recovery. Finding these alongside the wbadmin recovery, especially from the same user or parent, indicates a deliberate operation rather than an isolated administrative restore.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
