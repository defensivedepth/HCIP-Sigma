name: DllUnregisterServer Function Call Via Msiexec.EXE
id: 23f0144a-f694-4a41-b114-442aa4c661ec
description: |
  Detects msiexec.exe invoked with the ` -z ` switch and a `.dll` argument, which calls the
  target DLL's DllUnregisterServer export — a proxy-execution primitive that runs attacker code
  through a Microsoft-signed binary, bypassing many path- and signature-based allowlists. The rule
  fires only when all three conditions hold: the image is msiexec.exe (or a binary with that
  OriginalFileName), the command line contains ` -z `, and the command line references a `.dll`.
  Legitimately, msiexec installs and services .msi packages; the DllUnregisterServer switch is
  rarely used by routine software management. Investigation should confirm the exact DLL path,
  whether it lives in a user-writable location, what loaded the DLL, what process spawned msiexec,
  and whether the activity is isolated or part of a wider sequence.
type: detection
detection_id: 84f52741-8834-4a8c-a413-2eb2269aa6c8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show msiexec.exe running with the ` -z ` switch against a .dll file?
  context: Confirm the alert is a true positive before investing time. The rule fires only when all
    three criteria hold together — the image is msiexec.exe (or a binary whose OriginalFileName is
    msiexec.exe), the command line contains ` -z `, and the command line references a `.dll`. Verify
    each of these is present in the triggering event and note the full DLL path the switch points at.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to unregister DLLs through msiexec.exe?
  context: Legitimate software management uses msiexec to install and service .msi packages; calling
    a DLL's DllUnregisterServer export through the ` -z ` switch is rare in routine administration.
    Knowing whether the user role and host function involve installer maintenance or developer DLL
    registration work is often the fastest way to separate a true positive from sanctioned activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full DLL path passed to the ` -z ` switch, and where does that DLL live?
  context: The full command line reveals the specific DLL whose DllUnregisterServer export was called.
    Decode the path the ` -z ` switch points at — a DLL in System32 or a vendor install directory is
    far less concerning than one in a user-writable location such as a temp, Downloads, AppData, or
    Public directory, which is the staging pattern for proxy-executed payloads.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '.dll'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.007.module_load
  question: Which DLL did msiexec.exe load on this host around the alert, and is it signed and in an expected location?
  context: The DllUnregisterServer primitive only has effect once msiexec maps the target DLL into its
    address space, so the module-load event names the actual code that ran. Compare the loaded DLL's
    path and signature against the path passed on the command line. An unsigned module, or one loaded
    from a user-writable directory, is the load-bearing artifact for this technique.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_process_tool.process_chain
  question: What process spawned this msiexec.exe instance, and is that parent chain expected?
  context: The parent process reveals how msiexec was invoked. Interactive installs are typically
    launched from explorer.exe or a software-management agent. Parents such as mshta.exe, wscript.exe,
    cscript.exe, powershell.exe, cmd.exe under a user-writable working directory, or an Office
    application are unusual for a DllUnregisterServer call and point toward scripted or operator-driven
    proxy execution.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this msiexec.exe instance spawn afterward?
  context: A DLL loaded through msiexec can spawn follow-on processes as part of its payload. Children
    such as cmd.exe, powershell.exe, rundll32.exe, or wmic.exe spawned by msiexec are a common
    post-execution pattern and reveal the actual impact of the loaded code.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.007.network_retrieval
  question: Did this msiexec.exe instance make outbound network connections to retrieve a payload?
  context: msiexec natively supports HTTP/HTTPS and UNC paths and can fetch a remote MSI or DLL in a
    single step. Outbound connections from msiexec to an external or previously unseen destination
    around the alert suggest the loaded DLL or an associated package was staged remotely. Compare any
    destination against known software-distribution and update endpoints.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation, and correlating the proxy-execution event in time with
    surrounding activity surfaces what led to it and what followed. Look for reconnaissance, payload
    staging, privilege escalation, or persistence in the same window — the time relationship between
    msiexec and other tooling is what distinguishes a one-off install from a multi-stage operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access,
    or payload download — may reveal the stages that preceded this proxy-execution event and help
    reconstruct the timeline that led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_user_actor.baseline
  question: Does this user normally run msiexec.exe?
  context: Compare this user's current action against their historical behavior. A user who has never
    driven msiexec — let alone a DllUnregisterServer call — is more notable than one who manages
    installers routinely. The user's role and typical toolset should align with installer servicing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-msiexec combination historically routine on this host or across the environment, or is the parent unusual for msiexec?
  context: When the alert fires under a service principal, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. Check whether the parent process that
    spawned msiexec is a pair that already accounts for many prior events — a sign of vendor or OS
    automation — or a new or rare parent for msiexec, which is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement
    or coordinated action on multiple endpoints. If the same user drove similar activity elsewhere,
    the scope of the investigation may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-msiexec combination fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism — the parent
    process spawning msiexec — fired on other hosts in the alert window. Multiple hosts in the same
    window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:lolbin.renamed_binary_check
  question: Was msiexec.exe executed from its expected System32 or SysWOW64 path?
  context: msiexec.exe normally runs from C:\Windows\System32 or C:\Windows\SysWOW64. A copy executed
    from a user-writable or non-standard path, or a renamed binary whose OriginalFileName is still
    msiexec.exe, may indicate an attempt to evade path-based allowlists. Compare the Image path against
    OriginalFileName to confirm the binary's true identity and location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who proxy code through one signed binary often reach for several. If msiexec was
    used to load a DLL, check whether rundll32, regsvr32, mshta, installutil, cmstp, or similar
    proxy-execution binaries also ran on this host. Finding multiple proxy-execution LOLBins performing
    the same kind of action strengthens the case for hands-on activity rather than routine servicing.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's msiexec DllUnregisterServer pattern over the past 90 days, and what command-line shapes are typical?
  context: A proxy-execution pattern with no prior history on a host is more notable than one used
    regularly under stable parents. The query mirrors the rule's selection structure scoped to this
    host, so the count reflects the rule's specific firing pattern — msiexec with ` -z ` and a `.dll`
    — not generic msiexec usage. The command-line projection lets you compare typical invocation shapes
    against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \msiexec.exe
      - OriginalFileName: \msiexec.exe
      selection_flag:
        CommandLine|contains|windash: ' -z '
      selection_dll:
        CommandLine|contains: .dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
