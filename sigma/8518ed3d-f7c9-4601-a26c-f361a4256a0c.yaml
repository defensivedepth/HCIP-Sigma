- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's bitsadmin transfer pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's full selection with no host scope, returning a fleet-wide count of
    the firing pattern rather than generic bitsadmin usage. Many hosts firing the same pattern points to a
    scripted rollout or a vendor process that legitimately uses BITS against an external host; one host or
    a small unrelated set points to manual operator activity. Use the host spread and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bitsadmin.exe
      - OriginalFileName: bitsadmin.exe
      selection_flags:
        CommandLine|contains:
