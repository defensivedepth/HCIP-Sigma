- source: template:lolbin.technique_class_lateral
  question: Were other download LOLBins used on this host recently?
  context: Operators who reach for one download utility often try several. If bitsadmin pulled a file,
    check whether certutil, curl, expand, or similar transfer-capable binaries also ran on this host.
    Multiple download utilities exercising the same objective in a short window strengthens the case for
    deliberate ingress tooling over an isolated administrative action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Was process-based persistence installed on this host around the transfer?
  context: BITS jobs can outlive a single transfer — a long-lived job with a notify command is itself a
    persistence mechanism, and operators frequently stack a second method alongside the download. Surfacing
    persistence-tool executions (schtasks, sc, reg, additional bitsadmin, wmic) in the surrounding window
    shows whether the transfer was paired with a foothold. Enumerating BITS jobs directly on the host
    (bitsadmin /list /allusers /verbose) confirms whether a persistent job remains.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
