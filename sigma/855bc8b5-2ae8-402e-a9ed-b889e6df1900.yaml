        - \Sysvol\
      selection_other_tools:
      - Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
      - OriginalFileName:
        - robocopy.exe
        - XCOPY.EXE
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: copy
      selection_pwsh_img:
      - Image|contains:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell_ise.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - copy-item
        - 'copy '
