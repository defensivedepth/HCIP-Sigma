name: Copy From Or To Admin Share Or Sysvol Folder
id: 1370ffb7-c010-4046-b91b-bc3abf3d22f2
description: |
  Detects a copy or move operation that references a hidden administrative share (a UNC path matching \\<host>\<share>$, e.g. C$ or ADMIN$) or the domain Sysvol folder. The rule fires when the command line targets such a path AND the activity runs through one of several tools: robocopy.exe or xcopy.exe, cmd.exe with a copy verb, or a PowerShell host (powershell.exe, powershell_ise.exe, pwsh.exe) using copy/move cmdlets or aliases (copy-item, cp, mv, move-item, mi). Hidden admin shares and Sysvol are routinely used by administrators for legitimate file distribution, but the same paths are abused for lateral tool transfer, data staging, and exfiltration. The investigation should determine which tool branch fired, what file or directory was copied and in which direction, which user and host initiated it, and whether the same pattern is spreading across the environment.
type: detection
detection_id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line reference an admin share or Sysvol path, and which copy tool branch fired?
  context: >-
    Confirm the alert is a true positive by reviewing the full command line. The rule fires when the command line
    contains either a hidden admin-share path (\\<host>\<share>$) or a \Sysvol\ path, AND the activity runs through
    either robocopy.exe or xcopy.exe, OR cmd.exe with a copy verb, OR a PowerShell host with a copy/move cmdlet or
    alias. Note which branch matched and the direction of the copy (reading from the share versus writing to it) —
    that branch and direction determine which downstream questions carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to copy files to or from admin shares or Sysvol?
  context: >-
    Administrators, backup jobs, and deployment tooling routinely copy to hidden shares and Sysvol. A copy initiated
    by an account or from a host with no administrative role is the deviation worth chasing. Knowing whether the user
    role and host function fit the detected behavior is often the fastest way to separate routine operations from
    lateral movement or staging.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this copy command do? Decode the source, destination, and direction of the transfer.
  context: >-
    The full command line reveals which path is the source and which is the destination, the file or wildcard being
    copied, and the recursion/mirror flags (robocopy /MIR /E, xcopy /S /E). Determine whether data is being pulled
    off a remote share to this host (collection) or pushed to a remote share (tool transfer or staging), and whether
    the target is C$/ADMIN$ on another machine or the local Sysvol replicated content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:universal.evidence_preservation
  question: Are the files referenced in the copy command still on disk for analysis?
  context: >-
    The paths parsed from the command line point to the copied or staged files. Checking whether they still exist on
    disk enables hash lookup, content review, and sandbox submission. Staged archives or transferred tools left on
    disk are direct evidence of the operation's intent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this copy tool and is that parent chain expected?
  context: >-
    The parent process reveals how the copy was invoked. Interactive admin use typically descends from explorer.exe
    or a console launched by a logged-on user; scripted distribution descends from a scheduler or management agent.
    Parents like wmic.exe, a remote-execution service, wscript.exe, or an Office application point to remote-triggered
    or scripted execution rather than a hands-on administrator.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run this copy tool against admin shares?
  context: >-
    A copy tool that has never been seen on this host, or is rarely run by this user, is more suspicious than one that
    runs on a regular schedule. Zero or very low historical counts indicate first-time or rare execution of the
    alerting binary here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that copy activity, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects how
    this specific admin-share/Sysvol copy pattern has historically run here — not generic use of the copy tools. A new
    parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_target:
        CommandLine|contains:
        - \\\\*\\*$
        - \Sysvol\
      selection_other_tools:
      - Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
      - OriginalFileName:
        - robocopy.exe
        - XCOPY.EXE
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: copy
      selection_pwsh_img:
      - Image|contains:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell_ise.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - copy-item
        - 'copy '
        - 'cpi '
        - ' cp '
        - 'move '
        - ' move-item'
        - ' mi '
        - ' mv '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_target and (selection_other_tools or all of selection_cmd_* or all of selection_pwsh_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
