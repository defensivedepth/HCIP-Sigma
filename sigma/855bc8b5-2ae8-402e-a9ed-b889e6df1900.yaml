    - template: lateral_movement.authentication_method
      reason: "Authentication method (PtH/Kerberos vs. legitimate creds) is covered by the share-access + logon question (Q12), which surfaces the authenticating account and source on the share access; a ProcessGuid re-display of User adds nothing"
    - template: lateral_movement.lateral_movement_scope
      reason: "Lateral-tool scope (psexec/mstsc/ssh by same user) overlaps cue_user_actor.clustering (Q10) and network_scope; the rule's tools are copy utilities, not the remote-exec binaries this template's selection_lateral lists, so it would mostly return unrelated activity"
    - template: network_scope.same_action_other_hosts
      reason: "Cross-host same-action coverage is provided by cue_process_tool.scope (Q17), which enforces the rule's full admin-share/Sysvol selection pattern fleet-wide rather than the binary alone; the network_scope version filters on Image only and would over-count generic copy-tool use"
    - template: network_scope.actor_activity_network_wide
      reason: "Duplicate of cue_user_actor.clustering (Q10) — both project the user's network-wide host/Image activity over a +/-1h window"
    - template: network_scope.actor_authentication_trail
      reason: "User authentication trail (4624/4625 across hosts) overlaps the share-access + logon question (Q12); for a copy-to-admin-share rule the relevant auth is the SMB share access itself, which Q12 scopes to this host's share"
    - template: data_staging_exfil.archive_destination
      reason: "No archive is created by a raw copy command; destination of the copy is surfaced directly by mechanism_decode (Q3, source/destination decode) and data_scope (Q15, files touched). No separate archive-output question applies"
    - template: data_staging_exfil.encryption_password
      reason: "Rule detects plain copy/move utilities, not archiving tools; there are no -p/-hp/--passphrase flags to inspect on robocopy/xcopy/copy-item"
