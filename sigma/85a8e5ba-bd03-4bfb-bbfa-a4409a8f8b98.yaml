name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
id: 988acdc0-4fe4-47a9-847f-0f346af84465
description: |
  Detects PowerShell command lines that use the Compress-Archive cmdlet to write an archive into a temporary or
  staging location commonly abused for exfiltration staging -- %TEMP%, a user's AppData\Local\Temp, or a system
  Windows\Temp directory. Compressing collected data into a portable archive in a temp directory is a normal
  developer, backup, or packaging step, but it is also the local-staging step that frequently precedes
  exfiltration of sensitive files. Determine what was compressed, where the archive went, what ran before and
  after the compression, and whether this user and host routinely produce archives in these locations.
type: detection
detection_id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show Compress-Archive writing its output to a temp or staging directory?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when a
    Compress-Archive invocation routes its -DestinationPath into %TEMP%, an AppData\Local\Temp path, or a
    Windows\Temp path. Verify the destination matches one of those locations before investing investigation time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to create archives in temporary or staging directories?
  context: Legitimate backup jobs, build scripts, and IT packaging routinely call Compress-Archive into temp
    locations. Knowing whether this user role and host function normally produce archives there is often the
    fastest way to separate routine packaging from data collection staged for exfiltration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What was the full Compress-Archive command -- which source paths were collected and where was the archive written?
  context: The full command line reveals what data was targeted. Decode the -Path argument for the specific files,
    directories, or wildcards being collected, and the -DestinationPath for the exact archive output location.
    Broad wildcards or sensitive directories (document shares, profile folders, database binaries) widen the
    potential data loss; the destination tells you where the archive currently sits for follow-up.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:data_staging_exfil.data_scope
  question: What files did the PowerShell process touch on disk while building the archive?
  context: 'The command line names the -Path source set, but the file-write events show what the archiving
    process actually read and produced on disk: the resulting .zip plus any intermediate files. Specific file
    types, sensitive directories (finance shares, HR folders, source code, database binaries), or broad
    wildcards indicate bulk collection. The scope of targeted data determines the severity of potential data
    loss and which business units need to be notified.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:data_staging_exfil.archive_destination
  question: Was the archive moved, copied, or transferred off the host after it was created?
  context: Local staging into a temp directory is typically followed by movement to a staging share or
    exfiltration over the network. Look for the archive file being copied or moved, and for outbound network
    connections from this host in the window after the compression, to reconstruct whether the staged data left
    the host and by what path (cloud upload, removable media, or an external server).
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '.zip'
          - '\Temp\'
          - '\AppData\Local\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:data_staging_exfil.encryption_password
  question: Was any compression, encryption, or password protection beyond a plain Compress-Archive applied to the staged data?
  context: Compress-Archive itself produces an unencrypted .zip, but operators often chain it with a second tool
    or apply password protection to hide contents from inspection during exfiltration. Review the alerting command
    for piped or follow-on encryption calls and for any password or passphrase passed inline. Encrypted or
    password-protected staging is a stronger indicator of deliberate data theft than a plain archive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1074.001.staging_directory
  question: Were other files written into this same temp or staging directory shortly before the archive was created?
  context: Local data staging usually drops or copies collected files into a staging directory first, then
    compresses them. File writes into the same %TEMP%, AppData\Local\Temp, or Windows\Temp path in the minutes
    before the Compress-Archive call show what was assembled for collection and whether this was a one-off
    archive or the tail end of a broader gathering step.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\Temp\'
          - '\AppData\Local\Temp\'
          - ':\Windows\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how the compression was invoked. User-driven packaging usually descends
    from explorer.exe or a console; scheduled backups descend from the task scheduler service. Unusual parents
    such as mshta.exe, wscript.exe, an Office application, or a remote-execution service point toward scripted
    or operator-driven staging rather than routine packaging.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What did this host run in the hours after the archive was created?
  context: The activity following local staging reveals intent. Compression staged for exfiltration is often
    followed by network transfer tooling, cloud-sync utilities, or cleanup that deletes the staging directory.
    Reconnaissance, credential access, or scheduled-task creation around the same time broadens the picture
    beyond a single packaging step.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.baseline
  question: Does this host normally run Compress-Archive into temp or staging directories?
  context: An archive-to-temp pattern that has never been seen on a host is more suspicious than one that recurs
    on a schedule. A zero or very low historical count for this firing pattern indicates first-time or rare
    activity worth scrutiny; a steady count points to an established backup or packaging routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Compress-Archive -Path*-DestinationPath $env:TEMP
        - Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\
        - Compress-Archive -Path*-DestinationPath*:\Windows\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this archive-to-temp pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine packaging can be abused. The query mirrors the rule's selection scoped to this host, so
    the resulting parent and user distribution reflects how this specific Compress-Archive-to-temp pattern has
    historically run here -- not generic PowerShell usage. A new parent process, an unexpected user account, or
    an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Compress-Archive -Path*-DestinationPath $env:TEMP
        - Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\
        - Compress-Archive -Path*-DestinationPath*:\Windows\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this archive-to-temp pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    specific Compress-Archive-to-temp pattern. Many hosts firing the same pattern points to a scripted backup or
    vendor automation rollout; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Compress-Archive -Path*-DestinationPath $env:TEMP
        - Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\
        - Compress-Archive -Path*-DestinationPath*:\Windows\Temp\
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Compress-Archive -Path*-DestinationPath $env:TEMP
        - Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\
        - Compress-Archive -Path*-DestinationPath*:\Windows\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Compress-Archive -Path*-DestinationPath $env:TEMP
        - Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\
        - Compress-Archive -Path*-DestinationPath*:\Windows\Temp\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or collection spanning multiple
    endpoints. If the same user staged archives or ran related tooling on multiple hosts in this window, the scope
    of the activity is larger than a single packaging step.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Compress-Archive -Path*-DestinationPath $env:TEMP
        - Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\
        - Compress-Archive -Path*-DestinationPath*:\Windows\Temp\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Local staging is a late-stage collection step. Earlier detections on the same host -- reconnaissance,
    credential access, defense tampering, or discovery -- may reveal the stages that preceded the compression and
    help reconstruct the full timeline leading up to data being gathered for exfiltration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
