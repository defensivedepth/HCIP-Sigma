name: Service StartupType Change Via Sc.EXE
id: 8a7ea07d-39bb-43ad-bf54-7b71ed1c7236
description: |
  Detects sc.exe (matched by image name or original filename) run with "config" and "start" together with a value of disabled or demand, which changes a Windows service's startup type. Setting a security or backup service to disabled stops it from starting at the next boot, a persistent way to keep protection or recovery off after a reboot; setting a service to demand (manual) prevents it from auto-starting. Administrators reconfigure service startup types legitimately during maintenance and software changes, so the investigation should decode exactly which service was reconfigured and to what, confirm what process and user ran sc, check whether the service is now disabled, and look for the other tampering, persistence, and follow-on activity the change accompanies.
type: detection
detection_id: 85c312b7-f44d-4a51-a024-d671c40b49fc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- source: template:universal.verify_trigger_match
  question: Does this match the rule — sc.exe changing a service startup type to disabled or demand?
  context: Confirm the alert before investing time. The rule fires when the image (or original filename) is sc.exe and the command line contains "config" and "start" with a value of disabled or demand. Read the full command line and identify exactly which service was reconfigured and to which startup type — disabled keeps the service off across reboots, while demand prevents auto-start.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:defense_tampering.what_was_disabled
  question: Which service had its startup type changed, and to what?
  context: The impact depends on the target. Disabling an antivirus, EDR, or backup service keeps it off after the next reboot, persistently removing protection or recovery; setting it to demand prevents it from auto-starting. Read the service name and the new startup value in the command line to identify what was reconfigured and set the investigation priority and remediation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to change service startup types?
  context: Administrators and software installers legitimately reconfigure service startup during maintenance, so the question is whether this account and host have a reason to. A documented maintenance action by an admin or deployment service differs from a standard user account, or an unexpected service principal, disabling a security or backup service — the latter is the defense-weakening pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this sc command, and is that parent chain expected?
  context: A startup change from an interactive admin shell or an installer is routine; the same sc spawned by a script (cmd or powershell running a .bat), by a remote-execution tool, or by an Office application points to automated, hands-on tampering. If the sc command shares a parent with other tampering or recovery-destruction commands, that parent is the operator's script — its command line and origin are central to scoping the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:service_persistence.service_current_status
  question: Is the targeted service currently disabled or stopped, and does it still need to be restored?
  context: A startup change takes effect at the next start, but the service may also have been stopped immediately. Checking the current state of the targeted service reveals whether the host is exposed now and whether it will come back after a reboot — a security or backup service left disabled should be restored. Run sc query and sc qc against the service name from the alert command line, or confirm via the EDR console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the service startup was changed?
  context: A protective service is disabled to enable something the service would otherwise block or log. Examining what executed in the window after the change reveals what it was meant to allow. New processes, especially unknown binaries or interpreters, shortly after a security service was disabled point to the activity the tampering unlocked.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense-tampering actions performed on this host?
  context: Operators who disable one control usually disable several — setting antivirus to disabled AND clearing logs AND deleting shadow copies maximizes coverage. This surfaces other tampering tools and verbs on the host around the alert. Multiple tampering actions sharing the same user or parent process confirm a coordinated operation rather than an isolated administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: attack:T1562.001.registry_disable
  question: Was a service disabled through the registry rather than sc.exe?
  context: A service's startup type is stored in its Start value under HKLM\SYSTEM\CurrentControlSet\Services, so setting Start to 4 (disabled) in the registry achieves the same result as sc config start=disabled but bypasses the sc command this rule watches. Reviewing registry changes to the Start value of service keys on this host around the alert catches a registry-based disable of the same or additional protection services that would otherwise be missed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\'
        TargetObject|endswith: '\Start'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:lolbin.renamed_binary_check
  question: Was sc.exe executed from its expected System32 path, and is it the genuine signed binary?
  context: The genuine sc.exe is a signed Microsoft binary under System32 / SysWOW64. A copy running from a user temp directory, ProgramData, or another non-standard path — or one whose original filename is not sc.exe — suggests the binary was staged to dodge path-based allowlists, which raises the priority of an otherwise routine-looking service command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host changed service startup types to disabled or demand with sc over the past 90 days, and what command shapes are typical?
  context: A startup-type change to disabled or demand with no prior history on a host is more notable than one that recurs under a stable maintenance or deployment routine. This mirrors the rule's exact pattern scoped to this host, so the count reflects the rule's specific firing, and the command-line projection lets you compare the historical service targets and values against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_cli:
        CommandLine|contains|all:
        - ' config '
        - start
        CommandLine|contains:
        - disabled
        - demand
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were other tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: This rule already detects one defense-weakening action, so this looks for others on the host. It surfaces direct attempts to disable AV/EDR services, flip Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "the rest of protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows confirm a coordinated tampering operation; review the writing process and its signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around this time?
  context: Disabling a protective service is often paired with establishing a foothold under the lowered defenses. This surfaces persistence tool executions — schtasks, sc, reg, at, bitsadmin, wmic — clustered around the alert. Several persistence installations in the same window indicate intentional staging rather than an isolated configuration change, and identify footholds to remediate.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally reconfigure services across the environment?
  context: Compare this user's current action against their historical pattern. A user who has never managed service configuration is more notable than an administrator or service account that does so routinely. This pivot is meaningful only when a real user account fired the alert; the launch-mechanism baseline alongside it carries the answer when the actor is a service or computer account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-sc combination historically routine on this host or across the environment?
  context: When the alert fires under a service or computer account, user identity does not attribute behavior, so the meaningful baseline is the launch mechanism — which parent process spawned sc, and whether that pairing is historically common. A new or rare parent (a script interpreter or remote-execution tool where none was seen before) is the deviation worth chasing; a pairing that already accounts for many prior events points to a maintenance routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user disabled services or ran tooling on other hosts in the same window, the scope is a network-wide operation. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this parent-and-sc combination fire on other hosts in the same window?
  context: Under a service or computer account, asking what else the user did returns agent-telemetry noise. The meaningful question is whether the same launch mechanism — this parent spawning sc — fired on other hosts in the alert window. Multiple hosts at once points to a scripted change pushed across the environment; a single host points to a host-local action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts changed service startup types to disabled or demand via sc in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where these startup changes fired. Many hosts at once points to a configuration push or deployment routine; one host or a small unrelated set points to manual or targeted disabling. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_cli:
        CommandLine|contains|all:
        - ' config '
        - start
        CommandLine|contains:
        - disabled
        - demand
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — credential access, lateral movement, reconnaissance, or other defense tampering — may reveal the intrusion stage this service change belongs to and help reconstruct the timeline. Disabling a protective service usually sits late in a hands-on intrusion, just before impact, so what came before frames the urgency.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
