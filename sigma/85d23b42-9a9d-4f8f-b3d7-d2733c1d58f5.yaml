name: HackTool - HollowReaper Execution
id: 16e21b96-3455-4990-a6e5-293154557e85
description: |
  Fires when a process named HollowReaper.exe runs. HollowReaper is a process-hollowing launcher: it
  creates a legitimate-looking child process in a suspended state, unmaps the child's original image,
  writes shellcode into that memory with VirtualAllocEx/WriteProcessMemory, then redirects the thread
  and resumes it so the payload executes under the identity of a trusted binary. A filename match is a
  high-confidence signal because the tool has no legitimate use, but the binary can be renamed, so the
  investigation should confirm the hollowing behavior (a suspended child, a cross-process memory write,
  the resumed payload) and determine which process was hollowed and what the payload did.
type: detection
detection_id: 85d23b42-9a9d-4f8f-b3d7-d2733c1d58f5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Is the process that fired this alert actually named HollowReaper.exe as the rule detects?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires on a
    single condition - an Image path ending in HollowReaper.exe. Check the full image path and command
    line; a binary renamed to HollowReaper.exe (or the real tool deliberately left under its own name)
    both warrant the same hollowing-behavior follow-up.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run a process-hollowing launcher?
  context: A general-purpose hollowing tool has no routine administrative use. Knowing whether the host
    is a security-testing system and whether the user performs authorized offensive work is the fastest
    way to separate a sanctioned test from an intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this execution part of an authorized penetration test or red team engagement?
  context: Offensive tooling is run during sanctioned assessments. Before investing further analysis,
    check whether a penetration test or red team exercise is active on this host or network segment with
    matching timing. A documented engagement that accounts for the activity resolves the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What does the full command line show about which process was targeted and where the shellcode came from?
  context: HollowReaper takes operands that select the binary to hollow and the source of the payload.
    Decode the command line to identify the target image (often a benign system binary such as svchost.exe
    or notepad.exe) and any shellcode file path or inline payload reference. This establishes what was
    impersonated and where the code originated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:hacking_tool.tool_capability_used
  question: Which target process did this invocation hollow, and what payload was launched into it?
  context: The specific operands determine the scope of compromise. Identify the decoy binary that was
    hollowed and the payload that ran inside it - a benign-looking host process now executing arbitrary
    code changes which follow-on activity (network beacons, child processes) is attributable to the attacker
    rather than the genuine binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1055.012.process_access
  question: Did HollowReaper open a handle into another process with memory-write or thread access on this host?
  context: Process hollowing requires a cross-process handle that permits writing memory and redirecting
    a thread - access rights such as PROCESS_VM_OPERATION (0x0008), PROCESS_VM_WRITE (0x0020), and
    PROCESS_CREATE_THREAD (0x0002), often acquired together as a full-access mask (0x1FFFFF). A process-access
    event where HollowReaper is the source and a legitimate binary (commonly svchost.exe, explorer.exe,
    or another decoy) is the target confirms the injection step. If process-access telemetry is not collected
    in this environment, treat zero results as a visibility gap, not as evidence no injection occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        SourceImage|endswith|expand: '%Image%'
      filter_host:
        host.name|expand: '%hostname%'
      condition: selection and filter_host
    fields:
      - TargetImage
      - GrantedAccess
      - CallTrace
- source: template:cue_process_tool.follow_on
  question: What child processes did HollowReaper create, and is any of them a suspended or hollowed system binary?
  context: The hollowed process is created as a child of the launcher, typically in a suspended state before
    its memory is replaced. A child that is a normally-network-facing system binary (svchost.exe, dllhost.exe)
    spawned directly by this tool, especially one that then makes outbound connections, is the payload running
    under a borrowed identity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned HollowReaper, and is that parent chain expected?
  context: The parent reveals how the launcher was delivered and run. An interactive shell from explorer.exe
    points to hands-on-keyboard operation, while parents such as wscript.exe, mshta.exe, an Office application,
    or a download utility point to scripted or document-driven delivery. An unexpected parent for an injection
    tool is the lead worth following upstream.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: What files did HollowReaper create on this host?
  context: The launcher commonly reads a shellcode file from disk and may drop staging or output artifacts.
    Files created by this process - raw payload blobs in user-writable or temporary directories, or other
    dropped tooling - confirm execution and reveal the payload source even after the process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run this binary, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific binary has run here historically. For a tool with no legitimate
    purpose, a zero or near-zero baseline is itself the finding; any prior runs and the accounts behind them
    are worth correlating with known testing activity.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \HollowReaper.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts run this binary in the past week, and does the spread look like coordinated activity or one host?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    binary. The same launcher appearing on many hosts in a short window points to a pushed or scripted
    rollout across the estate; a single host or a small unrelated set points to isolated operator activity.
    The host distribution calibrates how broad the response needs to be.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \HollowReaper.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user run this binary before anywhere in the environment?
  context: Compare this account's current action against its history. A user who has never run this tool
    is more suspicious than one with a record of sanctioned offensive testing. Zero or very low historical
    counts indicate first-time use for this account and should be weighed against the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or environment-wide, or is the parent unusual?
  context: When the alert fires under a service or computer account, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. A parent process that already accounts for many
    prior executions of this binary is automation, while a new or rare parent for this launcher is the
    deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the account's activity on all hosts in the surrounding window reveals whether the
    hollowing was an isolated action or one step in a wider operation - reconnaissance, credential access,
    or activity on other endpoints under the same identity widens the apparent scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window?
  context: Under a service or computer account, a user-wide sweep returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism appeared on other hosts in the alert window.
    Several hosts in the same window point to pushed or scheduled automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: A hollowing launcher is usually one stage of a longer operation. Earlier detections on the same
    host - defense tampering, reconnaissance, privilege escalation, or credential access - help reconstruct
    what preceded the payload execution and whether protection was weakened first.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Defense tampering frequently precedes payload execution, and process hollowing is itself an
    evasion technique aimed at running code under a trusted identity. The query surfaces direct attempts to
    disable AV/EDR services, change Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW.
    Zero rows is a useful "protection looks healthy" signal; populated rows shift the disposition toward
    operator preparation, so review the parent process and signer to identify who made the change.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
