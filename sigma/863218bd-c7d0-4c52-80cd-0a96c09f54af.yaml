name: Arbitrary File Download Via IMEWDBLD.EXE
id: 1ebb361e-14cc-4714-aabd-a7ea816ed47f
description: |
  Detects IMEWDBLD.exe (a Microsoft IME dictionary download utility located at
  C:\Windows\System32\IME\SHARED\IMEWDBLD.exe) being invoked with an HTTP or
  HTTPS URL on its command line. Given a URL argument, the binary downloads the
  remote file and saves it to the INetCache directory, making it a signed,
  Microsoft-trusted proxy for arbitrary file retrieval. The rule fires when the
  process Image ends in \IMEWDBLD.exe (or OriginalFileName is imewdbld.exe) AND the
  command line contains a URL. Legitimate use is rare outside of IME dictionary
  updates; investigate whether the URL, the parent process, and the downloaded
  payload indicate operator-driven ingress tool transfer.
type: detection
detection_id: 863218bd-c7d0-4c52-80cd-0a96c09f54af
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event show IMEWDBLD.exe running with an HTTP or HTTPS URL on its command line?
  context: Confirm the alert is a true positive before investing time. The rule requires both that the process is IMEWDBLD.exe (Image ends in \IMEWDBLD.exe or OriginalFileName is imewdbld.exe) and that the command line contains a URL. Read the exact command line and note the full URL that was passed as the download argument.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run IMEWDBLD.exe to fetch files over HTTP(S)?
  context: IMEWDBLD.exe is an IME dictionary download helper; outside of IME dictionary updates it is rarely run interactively, and almost never with an arbitrary external URL. Knowing whether the user role and host function involve IME configuration is often the fastest way to separate a routine action from operator-driven download abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What full URL and arguments did IMEWDBLD.exe receive, and what file would it have fetched?
  context: The command line carries the operational intent. Decode the full URL, note the scheme (http vs https), the host, and any path or file extension. IMEWDBLD.exe saves whatever it retrieves to the INetCache directory under the invoking user; the URL is the only indicator of what was requested. Multiple sequential invocations on the host may represent staged retrieval of several files.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_network_endpoint.mechanism_decode
  question: What is the download destination in the URL, and what do DNS, WHOIS, and threat intel reveal about it?
  context: Investigate the host in the URL passed to IMEWDBLD.exe — DNS resolution history, registration age, TLS certificate details, and known threat intelligence hits. Recently registered domains, raw IP addresses, dynamic-DNS hosts, or known malware-staging infrastructure point to attacker-controlled endpoints; an internal or well-known vendor host points to benign activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.process_chain
  question: What process spawned IMEWDBLD.exe, and is that parent chain expected?
  context: The parent process reveals how IMEWDBLD.exe was launched. Legitimate IME dictionary updates are typically driven by the input-method framework or user shell. A parent such as cmd.exe, powershell.exe, wscript.exe, mshta.exe, or an Office application suggests scripted or operator-driven invocation of the binary as a download proxy rather than genuine IME use.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.download_success_verification
  question: Did IMEWDBLD.exe write a file to disk after the download, and where?
  context: A download command does not guarantee the file was retrieved — the URL may have been blocked, returned an error, or been a probe. IMEWDBLD.exe saves successful retrievals to the INetCache directory under the invoking user. Confirming a file write by IMEWDBLD.exe establishes whether the attack progressed past delivery; the destination path is not in the command line, so scope file events to the binary itself.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1218.payload_analysis
  question: Can you retrieve and analyze the downloaded file from a safe environment?
  context: If the retrieved file is still on disk in INetCache, submitting its hash to threat intelligence or detonating it in an isolated environment reveals whether it is a known malicious payload, a benign file, or something novel. The hash and path of the file written by IMEWDBLD.exe are the pivot for reputation lookup.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: attack:T1218.follow_on
  question: What child processes did IMEWDBLD.exe spawn afterward, and were any downloaded files executed?
  context: A signed download proxy is typically the delivery stage; the impact comes from what runs next. Look for execution of the retrieved payload or for IMEWDBLD.exe spawning cmd.exe, powershell.exe, or other interpreters. Genuine IME dictionary use spawns no follow-on processes, so any child process here is investigation-worthy.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run IMEWDBLD.exe at all?
  context: IMEWDBLD.exe is an on-demand IME helper; on most hosts it runs rarely or never. A zero or very low historical count over 90 days indicates first-time or rare execution and raises the weight of the URL-download invocation. A host that runs it routinely (e.g., one configured for an East Asian input method) sets a different baseline.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even an IME helper can be abused. The query mirrors the rule's selection (IMEWDBLD.exe with a URL on the command line) scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual URL pattern relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \IMEWDBLD.exe
      - OriginalFileName: imewdbld.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_network_endpoint.baseline
  question: Does this host normally communicate with this download destination?
  context: First-time connections to the URL's host are more suspicious than routine traffic. Establishing whether this host has reached the destination before helps distinguish new attacker infrastructure from a known internal or vendor endpoint. Zero or very low historical counts indicate a new destination for this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \IMEWDBLD.exe
      - OriginalFileName: imewdbld.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \IMEWDBLD.exe
      - OriginalFileName: imewdbld.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar download or execution activity on other hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \IMEWDBLD.exe
      - OriginalFileName: imewdbld.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection (IMEWDBLD.exe with a URL) with no host scope, giving a fleet-wide count of the firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \IMEWDBLD.exe
      - OriginalFileName: imewdbld.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded this download and help reconstruct the full timeline leading to the proxy execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
