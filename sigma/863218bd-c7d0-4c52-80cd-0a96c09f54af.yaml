      disposition: declined
      reason: >-
        The T1218 image_load analytic targets the DLL-proxy variant of system
        binary proxy execution (rundll32/regsvr32/msiexec loading an unsigned or
        externally hosted DLL via EventCode=7). This rule's specific detection is
        a network-retrieval variant: IMEWDBLD.exe takes an http/https URL as a
        command-line argument and downloads a file to INetCache — there is no
        DLL-load step in the abuse path. The network-retrieval branch of the same
        analytic is covered by the destination-reputation question
        (cue_network_endpoint.mechanism_decode) and the network baseline question
        (cue_network_endpoint.baseline). An image_load query on IMEWDBLD.exe would
        return its own benign module loads with no precision for the URL-download
        behavior the rule fires on. No compensating attack:T1218.image_load
        question authored.
