name: Potentially Suspicious Regsvr32 HTTP/FTP Pattern
id: f5a0f4a9-04bd-40c0-8f73-1b4392e22e00
description: |
  Detects regsvr32.exe executed with an install flag (/i or -i) and a command line referencing an http or ftp resource, the pattern used to fetch and proxy-execute a remotely hosted DLL or .sct scriptlet through a trusted signed binary. The rule fires only when the regsvr32 image (or its OriginalFileName) AND the install flag AND the protocol string are all present together, so a true positive is a single regsvr32 invocation that points its install argument at a network location. Legitimately, regsvr32 registers local COM DLLs and almost never reaches out over http/ftp; the investigation should confirm the actual target of the install argument, decode the fetched resource, and determine what regsvr32 loaded or spawned afterward.
type: detection
detection_id: 867356ee-9352-41c9-a8f2-1be690d78216
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-05'
questions:
- source: template:universal.verify_trigger_match
  question: Does this regsvr32 command line include an install flag and an http or ftp target?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when the regsvr32 image (or OriginalFileName REGSVR32.EXE), an install flag (/i or -i), and a protocol string (http or ftp) are all present together. Verify the install argument actually points at a remote URL rather than a local path that merely contains those substrings.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to register DLLs from a network location with regsvr32?
  context: Legitimate COM registration uses regsvr32 against local DLLs and rarely references http or ftp. Knowing whether this user role and host function ever fetch and register remote components is often the fastest way to separate a true positive from a packaging or install workflow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full regsvr32 command line, and what resource does the install argument fetch?
  context: Decode every flag and the install target. Combinations such as /s /n /u /i:{url} scrobj.dll fetch a remote .sct scriptlet and execute it in memory, while /i:{url}.dll loads a remote DLL via its DllRegisterServer export. Identify the exact protocol, host, and file extension referenced, and whether scrobj.dll is named, which indicates scriptlet execution rather than plain DLL registration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this regsvr32, and is that parent chain expected?
  context: regsvr32 launched during legitimate registration is typically spawned by explorer.exe, an installer, or a service. Parents such as winword.exe, excel.exe, mshta.exe, wscript.exe, or a shell indicate the install came from a document macro, script host, or operator session rather than a software installation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this regsvr32 spawn afterward?
  context: A remotely fetched scriptlet or DLL frequently launches follow-on tooling. Children such as cmd.exe, powershell.exe, rundll32.exe, or certutil.exe spawned by this regsvr32 reveal the actual payload behavior and post-exploitation steps that followed the proxy execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.010.network_transfer
  question: Did regsvr32 make any outbound network connections close to the alert time, and to where?
  context: The install argument referencing http or ftp implies an outbound fetch of the scriptlet or DLL. Correlating regsvr32 process creation with a subsequent network connection confirms the remote retrieval actually occurred and surfaces the destination address and port. A regsvr32 process initiating outbound traffic is itself anomalous, since registration of local components needs no network.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - host.name
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Proxy execution rarely occurs in isolation. Examining process activity surrounding the alert reveals what led to the regsvr32 invocation and what followed, including reconnaissance, credential access, or persistence that frames the broader operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host such as defense tampering, reconnaissance, or credential access may reveal the attack stages that preceded the proxy execution and help reconstruct the timeline that led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline
  question: Does this host normally run regsvr32?
  context: A binary rarely executed on a host is more suspicious than one that runs regularly. Zero or very low historical counts of regsvr32 on this host indicate first-time or rare use, which raises the weight of a network-referencing invocation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection (regsvr32 image plus install flag plus http/ftp protocol) scoped to this host, so the parent and user distribution reflects how this specific firing pattern has run here, not generic regsvr32 use. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_flag:
        CommandLine|contains:
        - ' /i'
        - ' -i'
      selection_protocol:
        CommandLine|contains:
        - ftp
        - http
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_flag:
        CommandLine|contains:
        - ' /i'
        - ' -i'
      selection_protocol:
        CommandLine|contains:
        - ftp
        - http
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_flag:
        CommandLine|contains:
        - ' /i'
        - ' -i'
      selection_protocol:
        CommandLine|contains:
        - ftp
        - http
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar activity on several hosts in this window, the scope of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_flag:
        CommandLine|contains:
        - ' /i'
        - ' -i'
      selection_protocol:
        CommandLine|contains:
        - ftp
        - http
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific regsvr32 http/ftp install pattern, not generic regsvr32 use. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_flag:
        CommandLine|contains:
        - ' /i'
        - ' -i'
      selection_protocol:
        CommandLine|contains:
        - ftp
        - http
      condition: all of selection_*
    fields:
    - host.name
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who proxy-execute through one trusted binary often reach for several. If regsvr32 fetched and ran a remote component, check whether rundll32, mshta, msbuild, installutil, or similar binaries were also used to execute code in the same window. Multiple proxy-execution LOLBins performing the same objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was regsvr32 executed from its expected System32 or SysWOW64 path?
  context: regsvr32 run from outside C:\Windows\System32 or C:\Windows\SysWOW64 may have been copied or renamed to evade path-based allowlists. Confirm the Image path and OriginalFileName align with the genuine Microsoft binary rather than a relocated or renamed copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's regsvr32 install-over-network pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection scoped to this host, so the count reflects this specific install-over-network pattern rather than generic regsvr32 use. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_flag:
        CommandLine|contains:
        - ' /i'
        - ' -i'
      selection_protocol:
        CommandLine|contains:
        - ftp
        - http
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
