        (post-access process activity); the generic Image+ParentImage host sweep would duplicate that context.
    - template: universal.endpoint_protection_health
      reason: >-
        Recommended (not must_include) generic tamper sweep. This is a lateral-movement / remote-access rule, not an
        execution or credential-access rule whose disposition turns on prior AV/EDR tampering. Prior-tamper signal,
        if present, surfaces via cue_host_context.precursor (Q15) which sweeps all prior sigma alerts on the host.
    - template: lateral_movement.source_host_identification
      reason: >-
        Targets inbound SMB/RDP/WinRM/SSH ports (445/135/3389/5985/5986/22). UltraVNC connect-back is an OUTBOUND
        viewer/relay session on VNC ports, not an inbound admin-protocol login, so the inbound-port query does not
        match this rule's mechanism. Outbound connect-back endpoint is covered by Q8 (connection_destination).
    - template: lateral_movement.authentication_method
      reason: >-
        Pass-the-hash / Kerberos-ticket framing targets credential-based admin-protocol logons (PsExec/WinRM/RDP).
        UltraVNC authenticates to its own viewer/relay via the -connect/-id mechanism, not Windows network logon, so
        the NTLM/Kerberos auth-method question does not apply. Connect/id mechanism is decoded in Q5.
    - template: lateral_movement.lateral_movement_scope
      reason: >-
        Selection_lateral filters Image|endswith on psexec/mstsc/ssh/plink/wmic — a fixed admin-tool list that does
        not include VNC clients, and the rule is CommandLine-only so the binary pivot does not apply. Cross-host
        spread of this rule's pattern is covered by the reflected fleet query Q12 (cue_process_tool.scope) and Q16
        (same_action_other_hosts).
    - template: network_scope.actor_activity_network_wide
      reason: >-
        Duplicate of cue_user_actor.clustering (Q13) — both pivot User|expand %User% network-wide aggregated by
        host+Image over a +/-1h window. Q13 is kept (it is the always_include user-actor pivot).
    - template: network_scope.actor_authentication_trail
