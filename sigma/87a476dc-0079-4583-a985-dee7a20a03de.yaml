  mutable_dispositions:
    - element: KeywordMatch
      dimension: tuning_parameter
      specific_values: "18 third-party credential registry paths (PuTTY, WinSCP, MobaXterm, CoreFTP, FFFTP, OpenVPN, OpenSSH, VNC/Radmin, Foxmail, IncrediMail, Eudora, Becky!, DownloadManager)"
      disposition: query_injection
      target_question: Q4
      notes: "Rule's full path list embedded in the credential_path_enumeration breadth query; also surfaced in Q1/Q3 context with named applications"
    - element: ParentProcessFilter
      dimension: parent_process_analysis
      specific_values: "rationale only (cmd.exe > reg.exe vs services.exe > reg.exe ancestry)"
      disposition: context
      target_question: Q5
      notes: "Parent-chain legitimacy assessed in process_chain question and baseline_deviation parent distribution"
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (chained activity between reads and credential use)"
      disposition: context
      target_question: Q15
      notes: "Time correlation between read and credential use carried by post_access_lateral_movement (+4h) and host clustering windows"
    - element: RegistryHiveScope
      dimension: tuning_parameter
      specific_values: "rationale only (HKLM vs HKCU). Rule's paths are all HKCU/HKLM Software subkeys; not separately tunable here"
      disposition: context
      target_question: Q3
      notes: "Hive scope is fixed by the rule's literal paths; target_store_identification context names the per-application HKCU stores"
    - element: SuspiciousProcessList
      dimension: tuning_parameter
      specific_values: "reg.exe, cmd.exe, powershell.exe (T1552 analytic)"
      disposition: context
      target_question: Q5
      notes: "Rule is CommandLine-only (no Image constraint), so process identity is investigated via parent chain and Image surfaced in breadth/baseline queries rather than a fixed Image filter"
  dedup_decisions:
    - dropped: cue_process_tool.baseline
      reason: "host-binary frequency subsumed by cue_user_actor.baseline (user+binary, 90d) and cue_process_tool.baseline_deviation (rule-pattern host distribution, 14d); a plain Image baseline is misleading for a CommandLine-only rule where Image is unconstrained"
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.follow_on
      reason: "child-process spawn coverage subsumed by cue_host_context.clustering (host activity +/-15m) and post_access_lateral_movement; follow_on keys on ParentImage|endswith %Image% which is meaningless when the rule does not constrain Image"
      kept: cue_host_context.clustering
    - dropped: cue_process_tool.clustering
      reason: "generic host process clustering overlaps cue_host_context.clustering which provides the same +/-15m aggregated host view with Image+ParentImage"
      kept: cue_host_context.clustering
    - dropped: cue_user_actor.clustering (user-pivot) vs clustering_svc pairing
      reason: "user_actor pair — non-deduplicable; both user-pivot and parent+binary substitute emitted"
      kept: both
    - dropped: cue_user_actor.baseline (user-pivot) vs baseline_svc pairing
      reason: "user_actor pair — non-deduplicable; both user-pivot and parent+binary substitute emitted"
      kept: both
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: credential_access.credential_target_identification (also flagged by two brief hints) — the technique-set decode question is more specific to credential targeting"
    - template: registry.registry_key_context
      reason: "query keys registry_set (write events 13/14) via ProcessGuid; this rule detects a command-line registry READ (reg query / Get-ItemProperty), which produces no registry_set write event, so the linked-event lookup returns nothing. registry_related_modifications (reg write sweep) retained instead for registry-write context"
    - template: universal.evidence_preservation
      reason: "applicability flag has_file_reference fired on the registry-path strings, but the rule references registry KEYS not on-disk files; %file_paths% would be empty and a file_event lookup is not meaningful for a registry-read detection"
  hint_dispositions:
    - hint: "File paths derived from CommandLine — use %file_paths% placeholder"
      disposition: declined
      reason: >-
        The command-line strings this rule matches are registry key paths
        (\Software\...), not filesystem paths. There is no on-disk file
