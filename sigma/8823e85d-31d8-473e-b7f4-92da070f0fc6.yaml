name: Suspicious ShellExec_RunDLL Call Via Ordinal
id: ab64e43a-7167-43a5-9c39-7f5b5ae1cd49
description: |
  Detects a process whose parent command line invokes the ShellExec_RunDLL export of SHELL32.DLL by ordinal number
  (#568, #570, #572, #576) instead of by name, which is a way to bypass detections that match on the export name in
  the command line. The rule fires when the parent command line references SHELL32.DLL AND one of those ordinals, AND
  EITHER the parent command line also contains a suspicious token (comspec, iex, Invoke-, msiexec, odbcconf, regsvr32,
  or a user-writable path such as Desktop, ProgramData, Temp, Users\Public) OR the spawned child is one of a set of
  proxy-execution and scripting binaries (bash, bitsadmin, cmd, cscript, curl, mshta, msiexec, msxsl, odbcconf,
  powershell, pwsh, regsvr32, schtasks, wmic, wscript). Legitimate software occasionally calls shell helpers via
  ordinal, so the investigation should confirm the ordinal call really launched the observed child, decode what that
  child does, and trace the parent chain that reached rundll32 to determine whether this is signed-software behavior or
  an attacker proxying execution through a trusted Microsoft binary.
type: detection
detection_id: 8823e85d-31d8-473e-b7f4-92da070f0fc6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the parent command line invoke SHELL32.DLL by ordinal, and did it launch the observed child?
  context: >-
    Confirm the alert is a true positive by reading the parent command line on the triggering event. It must reference
    SHELL32.DLL together with one of the four flagged ordinals (568, 570, 572, or 576, written as #568 and so on in the
    command line), and the rule fires when EITHER the parent command line also carries a suspicious token (comspec, iex,
    Invoke-, msiexec, odbcconf, regsvr32, or a user-writable path) OR the spawned child is one of the proxy-execution or
    scripting binaries the rule lists. Note which branch fired - if the child-binary branch matched, the identity and
    origin of that child binary carry the investigative weight; if the parent-token branch matched, the suspicious token
    or path in the parent command line is the lead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run shell helper proxy execution via rundll32 and an ordinal call?
  context: Legitimate installers, control-panel applets, and some signed software invoke shell32 helpers through
    rundll32, occasionally by ordinal. Knowing whether this host's function and this user's role make rundll32-driven
    proxy execution routine is often the fastest way to separate vendor behavior from an attacker using a trusted
    Microsoft binary to launch a payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: What spawned the rundll32 parent, and is that grandparent chain expected to reach an ordinal shell call?
  context: The parent command line ran the ordinal shell call, but what launched that parent determines whether the
    chain is legitimate. A grandparent such as explorer.exe following a user double-click differs sharply from an
    auto-elevating helper or an Office or script-host process reaching rundll32. Trace the parent's own origin to see
    where the execution chain started.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the spawned child binary do? Decode its full command line and working directory.
  context: The ordinal shell call exists to launch the child; the child's command line reveals the actual operation -
    a proxy-execution chain (odbcconf regsvr loading a DLL, regsvr32 or msiexec loading a remote payload), a download,
    or a script. Decode every flag, path, and any encoded content, and note whether the binary runs from or references a
    user-writable directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.011.command_analysis
  question: Does the child command line carry proxy-execution or download arguments rather than a benign payload?
  context: System-binary proxy execution uses trusted binaries to run externally hosted or unsigned payloads through
    command-line arguments. The child here is filtered to those launched with proxy-execution or retrieval indicators -
    odbcconf regsvr or DSN actions, regsvr32 with a scriptlet or remote object, msiexec installing from a URL, curl or
    bitsadmin fetching a file, or mshta/wscript/cscript running a script. A populated result means the child is doing
    more than a benign local action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_proxy:
        CommandLine|contains:
          - 'regsvr'
          - 'configdriver'
          - 'INSTALLDRIVER'
          - 'SETFILEDSNDIR'
          - 'scrobj'
          - '/i:'
          - 'http://'
          - 'https://'
          - '/transfer'
          - 'DownloadString'
          - 'DownloadFile'
          - 'IEX'
          - 'Invoke-'
      condition: selection and selection_proxy
    fields:
      - CommandLine
      - ParentImage
- source: attack:T1218.011.image_load
  question: What modules did the spawned child binary load after the ordinal shell call?
  context: Proxy-execution chains map an attacker DLL into a trusted process rather than running a named executable -
    odbcconf and regsvr32 load DLLs, and rundll32 maps DLLs that it does not normally load. Reviewing the modules loaded
    by the child binary around the alert surfaces unsigned or unusually located DLLs that the command line alone does
    not reveal. If module-load telemetry is not collected in this environment, treat an empty result as a visibility gap
    rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.011.network_connection
  question: Did the spawned child binary make outbound network connections after launch?
  context: Proxy-execution chains frequently reach out to retrieve a payload or to a command-and-control endpoint - the
    trusted binary fetches a remote scriptlet, DLL, or installer, or beacons after loading. Reviewing outbound
    connections from the child binary around the alert shows whether the local execution pivoted to the network. If
    network telemetry for this host is not collected, treat an empty result as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:parent_child.sibling_processes
  question: What other children did the same rundll32 parent instance spawn?
  context: If the rundll32 parent that made the ordinal call spawned the detected child, it may have spawned others in
    the same chain. Examining the siblings of the exact parent instance reveals whether one ordinal call fanned out into
    multiple proxy-execution or scripting binaries, which points to orchestration rather than an isolated benign call.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.follow_on
  question: What other processes did rundll32 spawn on this host in the hours around the alert?
  context: Beyond the immediate siblings of this one parent instance, an attacker proxying execution through rundll32
    may invoke it repeatedly for successive stages. Listing what rundll32 spawned on this host across a wider window
    reveals whether the ordinal call is part of a sequence of proxy-execution invocations.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\rundll32.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this child binary run on this host before, and how often?
  context: A proxy-execution or scripting binary that is routine on a host is far less concerning than one appearing for
    the first time. Low or zero historical counts of this child binary on this host indicate a novel execution worth
    chasing; high counts suggest established automation or administrative use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent_img:
        ParentCommandLine|contains: SHELL32.DLL
      selection_parent_ordinal:
        ParentCommandLine|contains:
        - '#568'
        - '#570'
        - '#572'
        - '#576'
      selection_susp_cli_parent:
      - ParentCommandLine|contains:
        - comspec
        - iex
        - Invoke-
        - msiexec
        - odbcconf
        - regsvr32
      - ParentCommandLine|contains:
        - \Desktop\
        - \ProgramData\
        - \Temp\
        - \Users\Public\
      selection_susp_child_img:
        Image|endswith:
        - \bash.exe
        - \bitsadmin.exe
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \msiexec.exe
        - \msxsl.exe
        - \odbcconf.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_parent_* and 1 of selection_susp_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent_img:
        ParentCommandLine|contains: SHELL32.DLL
      selection_parent_ordinal:
        ParentCommandLine|contains:
        - '#568'
        - '#570'
        - '#572'
        - '#576'
      selection_susp_cli_parent:
      - ParentCommandLine|contains:
        - comspec
        - iex
        - Invoke-
        - msiexec
        - odbcconf
        - regsvr32
      - ParentCommandLine|contains:
        - \Desktop\
        - \ProgramData\
        - \Temp\
        - \Users\Public\
      selection_susp_child_img:
        Image|endswith:
        - \bash.exe
        - \bitsadmin.exe
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \msiexec.exe
        - \msxsl.exe
        - \odbcconf.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_parent_* and 1 of selection_susp_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity
    spanning multiple endpoints. If the same user triggered similar proxy-execution activity elsewhere, the scope is
    larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent_img:
        ParentCommandLine|contains: SHELL32.DLL
      selection_parent_ordinal:
        ParentCommandLine|contains:
        - '#568'
        - '#570'
        - '#572'
        - '#576'
      selection_susp_cli_parent:
      - ParentCommandLine|contains:
        - comspec
        - iex
        - Invoke-
        - msiexec
        - odbcconf
        - regsvr32
      - ParentCommandLine|contains:
        - \Desktop\
        - \ProgramData\
        - \Temp\
        - \Users\Public\
      selection_susp_child_img:
        Image|endswith:
        - \bash.exe
        - \bitsadmin.exe
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \msiexec.exe
        - \msxsl.exe
        - \odbcconf.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_parent_* and 1 of selection_susp_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_parent_process.scope
  question: Is the same rundll32-ordinal parent launching this child binary on other hosts?
  context: The same proxy-execution chain appearing on multiple hosts may indicate a campaign or a self-propagating
    foothold; a single occurrence is more likely targeted or benign. An environment-wide comparison of this parent and
    child binary pair calibrates severity and identifies the scope of the activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering, removable-media
    execution, reconnaissance, or an auto-elevation bypass - may reveal the attack stages that preceded the ordinal shell
    call and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Examining the broader process activity around the alert reveals what led to the ordinal shell call and what
    followed it. Novel parent-child pairs stand out against the repetitive agent and operating-system telemetry that
    fills the rest of the window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1218.011
      name: Rundll32
      role: primary
    - id: T1218
      name: System Binary Proxy Execution
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: ordinal_shell_invocation
      description: "rundll32 invokes shell32 ShellExec_RunDLL by ordinal (#568/#570/#572/#576) in the parent command line"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: parent_chain_origin
      description: "What reached rundll32 - the grandparent chain (auto-elevation helper, Office/script host, explorer)"
      mapped_to: Q3
      source: template:parent_child.parent_process_legitimacy
    - stage: 3
      label: child_payload_execution
      description: "The ordinal call launches a child proxy-execution/scripting binary; decode what it does"
      mapped_to: Q4
      source: template:cue_process_tool.mechanism_decode
    - stage: 4
      label: child_module_load
      description: "Child maps DLLs not normally loaded (odbcconf/regsvr32/rundll32 DLL proxy)"
      mapped_to: Q6
      source: attack:T1218.011.image_load
    - stage: 5
      label: network_retrieval_or_c2
      description: "Child reaches external domains to fetch a payload or beacon"
      mapped_to: Q7
      source: attack:T1218.011.network_connection
  dimension_coverage:
    - dimension: parent_process_analysis
      technique: T1218.011
      covered_by: Q3
      source: template:parent_child.parent_process_legitimacy
      coverage_type: direct
    - dimension: time_correlation
      technique: T1218.011
      covered_by: Q7
      source: attack:T1218.011.network_connection
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1218.011
      covered_by: Q10
      source: template:cue_process_tool.baseline
      coverage_type: indirect
    - dimension: command_analysis
      technique: T1218
      covered_by: Q5
      source: attack:T1218.011.command_analysis
      coverage_type: direct
  mutable_dispositions:
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (correlate rundll32 with DLL load / network within X seconds)"
      disposition: context
      target_question: Q7
      notes: "Encoded as the +/-15m correlation window on the child network-connection question and +/-5m on the image-load question; no specific second threshold to inject."
    - element: ParentProcessFilter
      dimension: parent_process_analysis
      specific_values: "explorer.exe, office apps vs. trusted installers (rationale)"
      disposition: context
      target_question: Q3
      notes: "Parent-chain legitimacy question reads the grandparent and asks whether the chain that reached rundll32 is expected; no fixed parent list to inject as a query constraint."
    - element: AllowedDLLs
      dimension: tuning_parameter
      specific_values: "rationale only (baseline of DLLs legitimately run by rundll32)"
      disposition: context
      target_question: Q6
      notes: "Image-load question surfaces loaded modules with signing info so the analyst compares against the environment baseline; no concrete DLL list provided to inject."
    - element: ExternalIPRange
      dimension: tuning_parameter
      specific_values: "rationale only (anomalous external IP scope)"
      disposition: context
      target_question: Q7
      notes: "Network-connection question returns destination IP/port/hostname for the analyst to judge against known-good ranges; no concrete range provided."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "regsvr32 not launched by explorer.exe (rationale)"
      disposition: context
      target_question: Q3
      notes: "Covered by parent-chain legitimacy and baseline_svc parent+child pairing questions."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "msiexec.exe, regsvr32.exe (rationale)"
      disposition: context
      target_question: Q10
      notes: "Child-binary baseline frequency captures whether this signed binary is routine on the host; no allowlist to inject."
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "URLs, script paths, DLL entrypoints (regex rationale)"
      disposition: query_injection
      target_question: Q5
      notes: "Injected concrete proxy/retrieval tokens (regsvr, configdriver, INSTALLDRIVER, SETFILEDSNDIR, scrobj, /i:, http://, https://, /transfer, DownloadString, DownloadFile, IEX, Invoke-) into the attack:T1218.011.command_analysis selection_proxy block."
    - element: RemoteDomainAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only (suppress legitimate enterprise domains)"
      disposition: context
      target_question: Q7
      notes: "Network-connection question returns destination hostname so the analyst applies their own enterprise allowlist."
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: "parent_process is primary cue (hint) and parent_child technique set active — parent_child.parent_process_legitimacy is more specific; process_chain subsumed"
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.mechanism_decode
      reason: "parent's own command line (the ordinal call) is already read in verify_trigger_match Q1; the parent_chain origin is covered by parent_child.parent_process_legitimacy. cue_process_tool.mechanism_decode covers the child-side decode that is the actual payload"
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.baseline
      reason: "parent-child historical pairing is covered more precisely by cue_user_actor.baseline_svc (parent.name + child Image aggregation), which also serves the service-principal pivot"
      kept: cue_user_actor.baseline_svc
    - dropped: cue_parent_process.clustering
      reason: "near-identical host+parent.name process query to cue_parent_process.follow_on; follow_on retained for the rundll32 fan-out angle"
      kept: cue_parent_process.follow_on
    - dropped: cue_process_tool.baseline (user-pivot duplicate avoidance)
      reason: "not dropped — kept as Q10; recorded here only to note it is distinct from cue_user_actor.baseline (Q11), which pivots on user identity not host"
      kept: cue_process_tool.baseline
  skipped_templates:
    - template: cue_process_tool.mechanism_decode replaced_by scheduled_task.task_configuration
      reason: "replaced_by points at scheduled_task.task_configuration, but this rule is NOT a scheduled-task rule — schtasks.exe is only one of fifteen possible child binaries, not the detection focus. The mechanism_decode child-side decode is the correct Phase 2 here, so the replacement is declined and the original cue_process_tool.mechanism_decode is used."
    - template: powershell.encoded_command_decode
      reason: "powershell technique set confirmed only because powershell.exe is in the child-binary list; the rule fires on the rundll32 ordinal pattern, not on encoded PowerShell. PowerShell is one of fifteen possible children. attack:T1218.011.command_analysis (Q5) already filters the child command line for encoded/download/IEX/Invoke- tokens, covering the PowerShell case without misframing the playbook as a PowerShell rule."
    - template: powershell.script_block_logging
      reason: "same rationale — rule is not PowerShell-specific; 4104 script-block coverage would misframe the playbook. Module-load (Q6) and command_analysis (Q5) cover the child regardless of which of the fifteen binaries fired."
    - template: powershell.powershell_security_bypass
      reason: "PowerShell-security-control bypass is not what this rule detects; the precursor question (Q16) covers prior tamper/bypass alerts on the host generically."
    - template: scheduled_task.task_configuration
      reason: "scheduled_task set confirmed only because schtasks.exe is in the child list; this is not a scheduled-task rule. schtasks is one of fifteen children. Child decode (Q4) and command_analysis (Q5) handle a schtasks child generically without a task-specific question set."
    - template: scheduled_task.task_trigger_and_timing
      reason: "not a scheduled-task rule — see task_configuration rationale."
    - template: scheduled_task.task_still_present
      reason: "not a scheduled-task rule — see task_configuration rationale."
    - template: persistence_scope.process_based_persistence
      reason: "persistence_scope confirmed only because bitsadmin.exe is in the child list; the rule detects proxy execution, not persistence. is_persistence_rule is false. bitsadmin is one of fifteen children. follow_on (Q9) and host clustering (Q17) surface broader host activity if a persistence tool also ran."
    - template: persistence_scope.file_based_persistence
      reason: "same — not a persistence rule; file_event persistence-location coverage would misframe the playbook. Module-load (Q6) covers the file/DLL artifact angle relevant to proxy execution."
    - template: endpoint_protection_health
      reason: "RECOMMENDED, not must_include. The disposition for this rule turns on the proxy-execution chain itself, not on whether AV/EDR was disabled first. The cue_host_context.precursor question (Q16) already surfaces prior tamper alerts on the host, so the generic tamper sweep is redundant here."
