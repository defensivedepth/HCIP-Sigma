      reason: >-
        Not dropped — retained as the parent-chain question. Kept because no
        parent_process cue is active (parent_binaries empty); the parent chain
        is investigatively load-bearing here (interactive admin vs. IIS/WinRM
        worker vs. Office parent distinguishes administration from server
        exploitation).
      kept: cue_process_tool.process_chain
    - dropped: cue_process_tool.clustering
      reason: >-
        Generic host-clustering ("what other tools ran on this host") is
        subsumed by cue_host_context.precursor (prior sigma alerts on the host)
        and cue_user_actor.clustering (user network-wide activity), which give
        more targeted multi-stage context for an exfiltration rule.
      kept: cue_host_context.precursor
    - dropped: cue_process_tool.baseline
      reason: >-
        Generic Image-based baseline ("does this host normally run this tool")
        is uninformative on a CommandLine-only rule whose binary is powershell
        (ubiquitous). Replaced by cue_process_tool.baseline_deviation, which
        baselines the rule's actual export-to-share pattern on this host.
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_process_tool.follow_on
      reason: >-
        New-MailboxExportRequest is an in-process Exchange cmdlet that does not
        spawn child processes, so a ParentImage=powershell follow-on query
        returns generic PowerShell children unrelated to the export. The
        exfiltration-relevant follow-on (.pst creation and post-creation
        handling) is covered by data_staging_exfil.data_scope and
        archive_destination.
      kept: data_staging_exfil.archive_destination
    - dropped: cue_user_actor.baseline / cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both variants emitted per AGENTS.md"
      kept: cue_user_actor.baseline + cue_user_actor.baseline_svc
    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both variants emitted per AGENTS.md"
      kept: cue_user_actor.clustering + cue_user_actor.clustering_svc
  skipped_templates:
    - template: universal.endpoint_protection_health
      reason: >-
        Tamper-as-precursor is already surfaced by
        powershell.powershell_security_bypass (AV/AMSI/execution-policy
        weakening in the hour before, host-scoped) and by
        cue_host_context.precursor (prior tamper alerts on the host). The
        generic host-tamper sweep would duplicate that coverage; this is an
        exfiltration rule, not an execution/credential-access rule where the
        disposition turns on whether protection was weakened first.
    - template: data_staging_exfil.encryption_password
      reason: >-
        Archive password/encryption flags (-p, -hp, --passphrase) do not apply
        to New-MailboxExportRequest, which has no password parameter; the .pst
        is written unencrypted by the cmdlet. No password-flag question is
        meaningful for this rule, so the slot is left to the .pst handling
        questions (data_scope and archive_destination).
