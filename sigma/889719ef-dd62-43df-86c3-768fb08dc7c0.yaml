name: Suspicious PowerShell Mailbox Export to Share
id: 197979b3-3064-4e23-b588-d6a105e15128
description: |
  Detects a PowerShell command line that invokes the New-MailboxExportRequest cmdlet with both a -Mailbox target and a -FilePath pointing at a UNC path (\\host\share). The cmdlet dumps an entire Exchange mailbox to a .pst on the named share, which is a normal e-discovery / migration action for Exchange administrators but is also used to bulk-collect and stage mailbox contents for exfiltration, and has been observed as the file-write primitive at the end of pre-auth Exchange exploitation chains. The investigation should confirm the export parameters, establish whether the user and host are an expected Exchange-administration path, and trace what preceded the export and where the .pst landed.
type: detection
detection_id: 889719ef-dd62-43df-86c3-768fb08dc7c0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain New-MailboxExportRequest with a -Mailbox target and a -FilePath pointing at a UNC share?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The rule fires only when all three appear together — the New-MailboxExportRequest cmdlet, a -Mailbox argument naming the source mailbox, and a -FilePath argument whose value begins with a UNC prefix (\\). Read the full command and confirm those three elements are present and form one coherent export request.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host an expected place for an Exchange mailbox export to run?
  context: Mailbox exports are a routine Exchange-administration and e-discovery action, but only from accounts holding the Mailbox Import Export management role and typically only from Exchange servers or admin workstations. Confirm whether the executing account is an Exchange administrator and whether this host normally performs mailbox management. An export driven by a service account, a non-admin user, or a host with no Exchange administration role is the deviation worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What mailbox was exported, and to what UNC destination was the .pst written?
  context: The full command line names both the source mailbox (-Mailbox) and the export destination (-FilePath \\host\share\file). Decode the destination UNC path — which host and share received the export, whether the host is an internal file server or an attacker-controlled or unfamiliar endpoint, and whether the filename uses an unusual extension. A high-value or shared mailbox exported to an unfamiliar or external share is a stronger signal of collection than a single user mailbox exported to a known archive share.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the export command obfuscated, or were the mailbox or path arguments hidden behind encoding, variables, or concatenation?
  context: The cmdlet name and arguments are plaintext in the alerting command, but attackers wrap mailbox-export operations in -EncodedCommand payloads, string concatenation, backtick escaping, or variable substitution to obscure which mailbox and destination were used. Decode any encoded or obfuscated segments to recover the true -Mailbox target and -FilePath value. Obfuscation around an administrative cmdlet that normally runs in the clear weighs toward deliberate concealment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full export script content?
  context: Event ID 4104 records the deobfuscated script content PowerShell actually executed, including any New-MailboxExportRequest calls and the surrounding script that built the mailbox and path arguments. This provides ground truth even when the command line was encoded or assembled at runtime, and may reveal additional cmdlets (further exports, role assignments, mailbox searches) run in the same session. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before the export ran?
  context: Operators often disable or downgrade PowerShell and host protections before running a payload — AMSI bypass, execution-policy bypass flags, real-time-monitoring disable, or a v2 downgrade that lacks logging. Finding these precursor events in the hour before a mailbox export strengthens the case that the export is part of hands-on-keyboard activity rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned the PowerShell session that ran the export, and is that parent chain expected?
  context: The parent process reveals how the export was launched. An interactive administrator session typically descends from explorer.exe or a remote-management host, while a remote PowerShell endpoint on an Exchange server descends from the IIS or WinRM worker process. A parent such as a web worker process, a scripting host, or an Office application points toward exploitation of the mail server or a delivered script rather than deliberate administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:data_staging_exfil.data_scope
  question: What .pst export files were written on this host around the time of the alert?
  context: The export dumps the mailbox to a .pst at the UNC destination named in the command line. Surfacing .pst files written on this host shows what was actually produced — the export file itself, plus any additional mailbox dumps written in the same window. Multiple .pst files, or output written somewhere other than a recognized administrative archive location, broadens the scope of data potentially collected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '.pst'
      condition: selection
    fields:
      - TargetFilename
- source: template:data_staging_exfil.archive_destination
  question: Was the exported .pst subsequently accessed, copied, or moved after creation?
  context: Mailbox collection typically precedes exfiltration — the .pst is staged and then relocated toward removable media, an upload directory, or another host before leaving the environment. Look for file activity touching .pst files on this host in the hour after the export, noting which process touched them. A .pst created by the export and then opened or relocated by a different process is more concerning than one that stays at its administrative archive location.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '.pst'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run a New-MailboxExportRequest export to a UNC share, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even legitimate exports recur on Exchange hosts. The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how this exact export-to-share pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line shape against that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - New-MailboxExportRequest
        - ' -Mailbox '
        - ' -FilePath \\\\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run Exchange mailbox exports?
  context: Compare this user's current action against their historical behavior. An account that has never run a mailbox export to a share is more suspicious than one that does so as part of a regular administration or e-discovery routine. The user's role and typical toolset should align with Exchange management responsibilities.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|all:
        - New-MailboxExportRequest
        - ' -Mailbox '
        - ' -FilePath \\\\'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this export pattern historically routine on this host or across the environment, regardless of which user ran it?
  context: When the alert fires under a service account or computer identity, user identity does not attribute behavior. The meaningful pivot is whether mailbox exports to a share are a recurring, expected operation on this host or environment-wide. A pattern that already accounts for many prior events is administrative or migration automation; a first-time or rare occurrence is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - New-MailboxExportRequest
        - ' -Mailbox '
        - ' -FilePath \\\\'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the export was an isolated administrative action or one step in broader hands-on activity. The same account running mailbox searches, role assignments, or logons on multiple hosts in this window widens the scope of what needs review.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same export-to-share pattern fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service or computer identity, asking what else the user did across the network returns agent-telemetry noise. The meaningful question is whether the same mailbox-export-to-share pattern fired on other hosts in the alert window. Multiple hosts in the same window points to scripted or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - New-MailboxExportRequest
        - ' -Mailbox '
        - ' -FilePath \\\\'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Mailbox export rarely happens in isolation when it is malicious. Earlier detections on the same host — web-server exploitation, credential access, role or permission changes, or reconnaissance — may reveal the stages that preceded the export and help reconstruct whether the mail server itself was compromised before data was staged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts run a New-MailboxExportRequest export to a UNC share in the past week, and does the distribution look like routine administration or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this export-to-share pattern. Many hosts firing it points to scheduled migration or e-discovery automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - New-MailboxExportRequest
        - ' -Mailbox '
        - ' -FilePath \\\\'
      condition: selection
    fields:
    - host.name
