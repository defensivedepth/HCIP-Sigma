  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1548.002) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        This rule keys solely on Image=wsreset.exe and IntegrityLevel; it does not
        involve a DLL-hijack or COM-surrogate bypass family where module loads
        sharpen detection. WSReset abuse is a registry-handler hijack, so the
        load-bearing artifacts are the HKCU handler write (covered by Q5,
        attack:T1548.002.bypass_registry_setup) and the elevated process lineage
        (Q4). An image_load question on wsreset.exe would return baseline module
        loads without precision for this bypass. No compensating
        attack:T1548.002.image_load question authored.
    - hint: "logsource 'process_access' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        process_access (cross-process handle/memory access) is relevant to token-
        theft and COM-surrogate UAC bypass variants, not the WSReset registry-
        handler hijack this rule detects. The bypass leaves no inter-process access
        artifact; the elevation is achieved by the OS auto-elevating wsreset.exe.
        Post-bypass credential-access tooling that would generate process_access
        events is surfaced behaviorally by the elevated-action question (Q7) and
        the escalation-alert sweep (Q9). No compensating process_access question
        authored.
    - hint: "logsource 'security' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The security-channel analytic for this technique correlates 4688/4672
        elevated-token events, which restates the same High/System integrity
        process-creation signal this rule already fires on. Q1 verifies the
        integrity level on the triggering event and Q7 enumerates subsequent
        High/System integrity processes from process_creation, covering the
        elevated-token dimension without a separate security-channel question.
        No compensating attack:T1548.002.security question authored.
