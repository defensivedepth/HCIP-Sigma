      disposition: acted_on
      reason: >-
        Acted on. Q6 (attack:T1003.001.command_analysis) is a file_event question
        that hunts the mounted memory-dump source file (.dmp/.raw/.mem/MEMORY./memdump)
        on the host — the file-event evidence relevant to this offline-analysis tool.
    - hint: "logsource 'image_load' (recommended by techniques: T1003.004) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        image_load analytics for T1003.004 target live processes loading lsasrv.dll /
        sechost.dll during in-memory LSA-secret scraping. MemProcFS does NOT scrape a
        live LSA — it mounts an offline memory image and reads the secrets as files, so
        no LSA module is loaded into a victim process by this tool. An image_load query
        on MemProcFS would return only its own benign DLL loads. The credential-store
        exposure this technique implies is covered by Q5 (credential_target_identification)
        from the mounted-dump perspective. No compensating attack:T1003.004.image_load
        question authored.
    - hint: "logsource 'process_access' (recommended by techniques: T1003,T1003.001,T1003.004) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        process_access (Sysmon EventCode 10, full-access handle to lsass.exe) is the
        live-LSASS-dumping signal. MemProcFS with -device reads a captured memory image
        offline and never opens a handle to a running lsass.exe, so a process_access /
        GrantedAccess query keyed on this tool returns nothing by construction. The
        credential-target dimension is instead answered from the mounted dump contents
        in Q5. No process_access question authored.
    - hint: "logsource 'registry_set' (recommended by techniques: T1003.001,T1003.002) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        registry_set analytics target live reg-hive export (reg save HKLM\SAM, etc.).
        MemProcFS reads the SAM/SECURITY/SYSTEM hives out of the mounted memory image as
        files, producing no live registry-modification events. Q5
        (credential_target_identification) lists these hives as exposed stores from the
        dump. No registry_set question authored.
    - hint: "logsource 'security' (recommended by techniques: T1003,T1003.001) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        Windows Security-channel analytics (4663/4656/4662 object-access, 4673 privilege
        use) fire on live access to LSASS or hive objects. Offline parsing of a captured
        dump by MemProcFS generates none of these on the analysis host. The follow-on
        and precursor questions (Q8, Q16) already correlate sigma alerts on the host for
        any live credential-access activity. No standalone security-channel question
        authored.
