name: Renamed BrowserCore.EXE Execution
id: d26dc54c-84ff-4637-9712-3cc099d6adeb
description: |
  Detects a process whose embedded PE metadata reports an OriginalFileName of BrowserCore.exe while the on-disk image is named something other than BrowserCore.exe. BrowserCore.exe is a legitimate Windows component that participates in retrieving the Azure AD Primary Refresh Token (PRT); copying it to an arbitrary path and renaming it is a known way to extract PRTs while evading name-based detection. Investigation should confirm the on-disk-name vs. metadata mismatch, determine how the renamed binary arrived, decode what it did, and assess whether Azure tokens or credentials were exposed.
type: detection
detection_id: 8a4519e8-e64a-40b6-ae85-ba8ad2177559
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does this process carry the OriginalFileName BrowserCore.exe while running under a different on-disk name?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the PE metadata OriginalFileName equals BrowserCore.exe and the process image is NOT named BrowserCore.exe. Verify both halves of that mismatch in the triggering event — the metadata says BrowserCore.exe, but the executable on disk is named something else.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run a process carrying BrowserCore.exe metadata from a non-standard path?
  context: The legitimate BrowserCore.exe lives in a Windows system path and is invoked by the browser/identity stack, not copied elsewhere and renamed. Knowing whether this user role and host function would ever legitimately invoke this component from an arbitrary location is often the fastest way to separate a true positive from an unusual but benign deployment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: The on-disk Image name is arbitrary, but the embedded OriginalFileName (BrowserCore.exe) and the code-signing chain still reflect the original Windows component. Compare the Image path against OriginalFileName to confirm the rename, and check the signature status — a Microsoft signature on a renamed copy is consistent with a lifted-and-relocated system binary, while an unsigned or broken signature points to a tampered or rebuilt tool. Submit the hash for reputation lookup to determine whether this is the stock component, a known offensive build, or a novel binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did this renamed BrowserCore.exe arrive on the host?
  context: A renamed copy of BrowserCore.exe does not appear spontaneously — it was copied from the system path, downloaded, extracted from an archive, or dropped by another process. The file_event for this basename shows the creating process (Image), which reveals the delivery mechanism. A user-writable landing spot (Temp, Downloads, AppData) points to download or extraction; the writing process identifies the dropper, copy tool, or remote-admin channel.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:credential_access.credential_target_identification
  question: What did this renamed binary do at the command line, and does it indicate Azure PRT or token extraction?
  context: BrowserCore.exe participates in retrieving the Azure AD Primary Refresh Token. Decode the full command line of the triggering process to determine what it requested — PRT extraction, token retrieval, or another operation. The arguments and any output paths identify which token or credential store was the target and what the extracted material could authenticate to.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this renamed binary, and is that parent chain expected?
  context: The parent process reveals how the renamed binary was invoked. The legitimate BrowserCore.exe is launched by the browser/identity stack; a renamed copy invoked from a shell (cmd.exe, powershell.exe), a script host (wscript.exe, mshta.exe), or an operator tool points to hands-on use rather than normal token retrieval. Walk up the chain by querying the parent's own parent if the immediate parent is itself unexpected.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: Renaming the component evades name-based detection while it performs its function. Examining the child processes, file writes, and network activity that followed reveals the actual objective — token staging, exfiltration of extracted material, or follow-on tooling. The same renamed binary appearing on multiple hosts points to deliberate distribution rather than an isolated test.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts and tokens may be exposed, and do any have elevated privileges?
  context: A Primary Refresh Token authenticates the signed-in user to Azure AD and the apps it federates, so the severity depends on the privilege level of the account on this host. A token tied to a privileged or admin-eligible account requires escalation; a standard user account may only need monitoring and a token reset. Cross-reference the logged-on user against directory group memberships and role assignments.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Extracted tokens and credentials are typically used quickly to access other systems or cloud resources. Follow-on alerts on this host shortly after the event — remote logons, SMB or WinRM activity, or new authentication patterns — indicate the stolen material is being exercised. An extracted PRT may also be replayed against cloud sign-in endpoints rather than on-host services.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: This technique is documented specifically as a way to defeat name-based endpoint detection, so an operator running it may also have weakened protection first. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal; populated rows shift the disposition toward operator preparation — review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this renamed-BrowserCore pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects how this specific renamed-metadata pattern has historically run here — not generic process activity. A new parent process, an unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: BrowserCore.exe
      filter_realbrowsercore:
        Image|endswith: \BrowserCore.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run processes carrying BrowserCore.exe metadata?
  context: Compare this user's current action against their historical behavior. A user who has never invoked this component is more suspicious than one who does so as part of a documented role. Token-retrieval components are exercised by the identity stack under the hood, not run directly by users, so direct invocation by an interactive account is itself unusual.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior — the meaningful pivot is the launch mechanism. Which parent process spawned this renamed binary, and is that pair historically common here or env-wide? A new or rare parent for this image is the deviation worth chasing; a pair that already accounts for many prior events is more likely OS or vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or repeated use of the same technique on multiple endpoints. If the same user triggered similar activity elsewhere in the window, the scope of credential exposure is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+binary combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, a user-wide pivot returns agent-telemetry noise because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus this renamed binary — fired on other hosts in the alert window. Multiple hosts in the same window points to pushed or scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or other credential access — may reveal the stages that preceded this event and help reconstruct the timeline that led to the renamed-binary execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
