name: Suspicious WmiPrvSE Child Process
id: 16099359-0050-4aa4-a515-394454018a6c
description: |
  Detects the WMI provider host (WmiPrvSE.exe) spawning a child process that is either one of a set of
  living-off-the-land binaries (certutil, cscript, mshta, msiexec, regsvr32, rundll32, verclsid, wscript)
  OR cmd.exe whose command line invokes a script host or proxy-execution binary (cscript, mshta, powershell,
  pwsh, regsvr32, rundll32, wscript) -- excluding benign WerFault, nested WmiPrvSE, and msiexec installer
  invocations. WmiPrvSE is the host process that executes WMI method calls such as Win32_Process Create, so
  these children indicate that a local or remote WMI request launched a code-execution utility. Legitimate
  management tooling and software deployment occasionally drive WMI execution, but operators frequently use the
  same path to launch downloaders, script hosts, and proxy-execution LOLBins from a parent that hides the true
  initiator. Determine which child branch fired, decode what the child actually did, trace what issued the WMI
  call, and confirm whether this parent-child pairing is routine for this host and user.
type: detection
detection_id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did WmiPrvSE.exe spawn a child that either is a listed LOLBin or is cmd.exe carrying a script-host or proxy-execution keyword?
  context: >-
    Confirm the alert is a true positive by reviewing the exact parent, child Image, and command line. The rule
    fires on EITHER branch: the child Image ends in one of certutil, cscript, mshta, msiexec, regsvr32, rundll32,
    verclsid, or wscript; OR the child is cmd.exe and its command line contains cscript, mshta, powershell, pwsh,
    regsvr32, rundll32, or wscript. Note which branch fired -- the direct-LOLBin branch makes the child binary
    itself the focus, while the cmd.exe branch makes the keyword inside the command line the thing to decode.
    Benign WerFault, nested WmiPrvSE, and msiexec /i installer children are filtered out.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to drive WMI-launched execution of script hosts or proxy-execution binaries?
  context: >-
    Legitimate software deployment, inventory, and remote management can launch utilities through WMI. Knowing
    whether this host's role and the acting user routinely produce WMI-spawned execution of these binaries is
    often the fastest way to separate sanctioned automation from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the child process do? Decode its full command line.
  context: >-
    The child's command line reveals the operation the WMI call launched. Decode any flags, file paths, URLs, or
    encoded content. For certutil look for -decode/-urlcache fetch behavior; for regsvr32/rundll32 look for the
    DLL or scriptlet and entrypoint; for mshta/wscript/cscript look for the script or remote resource; for the
    cmd.exe branch read past the wrapper to the script-host or proxy binary it actually invokes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: Is WmiPrvSE expected to spawn this child, and what issued the WMI call that started it?
  context: >-
    WmiPrvSE.exe executes WMI method calls on behalf of a local or remote requester, so it appears as the parent
    when something runs Win32_Process Create. Tracing the parent's own origin shows whether the chain is routine
    management tooling or a request from an unexpected source. Because the true initiator is the WMI caller rather
    than WmiPrvSE itself, correlate against WMI-Activity operational events and any preceding wmic.exe or
    Invoke-WmiMethod/Invoke-CimMethod activity to identify who issued the call.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did this WmiPrvSE instance spawn around the same time?
  context: >-
    A single WMI request often launches several utilities in sequence -- a downloader, a script host, then a
    proxy-execution binary. Examining the other children of the same WmiPrvSE instance reveals the full scope of
    what this WMI session executed. host.name is included as a fallback because ParentProcessGuid may be
    unavailable.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1047.wmi_activity
  question: What WMI operational activity occurred on this host around the alert, and was it local or remote?
  context: >-
    WMI execution leaves a trail in the WMI-Activity operational channel separate from process creation. Operation
    events record the namespace, the executing method, and whether the request originated locally or from a remote
    host. A remote WMI Win32_Process Create immediately before this child points to remote execution rather than a
    local management task. If WMI-Activity logs are not collected in this environment, treat zero results as a
    visibility gap rather than evidence the call was local.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: wmi
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Operation
- source: attack:T1218.010.image_load
  question: What modules did the proxy-execution child load, and were any loaded from a user-writable or unusual path?
  context: >-
    regsvr32.exe and rundll32.exe execute code by loading a DLL or scriptlet; the loaded module is what actually
    runs. A module loaded from a temp directory, a user profile path, or another non-system location -- or an
    unsigned module -- is the payload, whereas System32/SysWOW64 loads are typically benign registration. If module
    load events are not collected in this environment, treat zero results as a visibility gap rather than evidence
    no module was loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
- source: attack:T1047.network_connection
  question: Did the spawned child make any outbound network connections, and to where?
  context: >-
    Several of these binaries (certutil, mshta, regsvr32, rundll32, the script hosts) can pull a remote payload or
    establish command-and-control. An outbound connection from the child shortly after it started indicates the WMI
    call drove a download or remote interaction rather than a purely local action. Compare any destination against
    known-good update and management endpoints.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith: \wbem\WmiPrvSE.exe
      selection_children_1:
        Image|endswith:
        - \certutil.exe
        - \cscript.exe
        - \mshta.exe
        - \msiexec.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \verclsid.exe
        - \wscript.exe
      selection_children_2:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - cscript
        - mshta
        - powershell
        - pwsh
        - regsvr32
        - rundll32
        - wscript
      filter_main_werfault:
        Image|endswith: \WerFault.exe
      filter_main_wmiprvse:
        Image|endswith: \WmiPrvSE.exe
      filter_main_msiexec:
        Image|endswith: \msiexec.exe
        CommandLine|contains: '/i '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent and 1 of selection_children_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith: \wbem\WmiPrvSE.exe
      selection_children_1:
        Image|endswith:
        - \certutil.exe
        - \cscript.exe
        - \mshta.exe
        - \msiexec.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \verclsid.exe
        - \wscript.exe
      selection_children_2:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - cscript
        - mshta
        - powershell
        - pwsh
        - regsvr32
        - rundll32
        - wscript
      filter_main_werfault:
        Image|endswith: \WerFault.exe
      filter_main_wmiprvse:
        Image|endswith: \WmiPrvSE.exe
      filter_main_msiexec:
        Image|endswith: \msiexec.exe
        CommandLine|contains: '/i '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_children_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals whether this is isolated or part of
    broader hands-on activity. The same user driving similar WMI-launched execution on multiple hosts widens the
    scope of what needs review.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith: \wbem\WmiPrvSE.exe
      selection_children_1:
        Image|endswith:
        - \certutil.exe
        - \cscript.exe
        - \mshta.exe
        - \msiexec.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \verclsid.exe
        - \wscript.exe
      selection_children_2:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - cscript
        - mshta
        - powershell
        - pwsh
        - regsvr32
        - rundll32
        - wscript
      filter_main_werfault:
        Image|endswith: \WerFault.exe
      filter_main_wmiprvse:
        Image|endswith: \WmiPrvSE.exe
      filter_main_msiexec:
        Image|endswith: \msiexec.exe
        CommandLine|contains: '/i '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_children_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:obfuscation.encoded_payload_decode
  question: Is the child command line encoded or obfuscated, and what does it decode to?
  context: >-
    Encoded content hides the operator's actual payload. Common patterns here: certutil -decode/-decodehex with named
    source and output files, base64 passed to powershell/pwsh through the cmd.exe branch, character concatenation
    in wscript/cscript scripts, and scriptlet references handed to regsvr32/mshta. Decode iteratively until the
    content is readable; it typically resolves to a download cradle, an in-memory loader, or a reverse shell.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was this binary executed from its expected system path?
  context: >-
    These binaries normally live in System32 or SysWOW64. Execution from a user temp directory, profile path, or
    other non-standard location may indicate the binary was copied or renamed to dodge path-based allowlists.
    Compare the Image path against the expected location and check OriginalFileName for a mismatch that signals a
    renamed binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this WmiPrvSE-child pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A WMI-launched LOLBin pattern with no prior history on a host is more notable than one seen regularly under
    stable management tooling. This query mirrors the rule's full selection structure scoped to this host, so the
    count reflects the rule's specific firing pattern rather than generic use of these binaries. The command-line
    projection lets you compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith: \wbem\WmiPrvSE.exe
      selection_children_1:
        Image|endswith:
        - \certutil.exe
        - \cscript.exe
        - \mshta.exe
        - \msiexec.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \verclsid.exe
        - \wscript.exe
      selection_children_2:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - cscript
        - mshta
        - powershell
        - pwsh
        - regsvr32
        - rundll32
        - wscript
      filter_main_werfault:
        Image|endswith: \WerFault.exe
      filter_main_wmiprvse:
        Image|endswith: \WmiPrvSE.exe
      filter_main_msiexec:
        Image|endswith: \msiexec.exe
        CommandLine|contains: '/i '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_parent and 1 of selection_children_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution or download LOLBins used on this host recently?
  context: >-
    Operators who use one LOLBin frequently chain several -- a download utility to stage a payload, then a
    proxy-execution binary to run it. Finding additional LOLBins performing related actions on this host in the same
    timeframe strengthens the case that the WMI-launched child is part of an operation rather than an isolated event.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, credential access,
    defense tampering -- may reveal the stages that preceded WMI-launched execution and help reconstruct the
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
