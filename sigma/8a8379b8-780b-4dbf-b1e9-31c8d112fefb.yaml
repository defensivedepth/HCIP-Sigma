name: Schtasks From Suspicious Folders
id: ad0eab4d-8b87-4280-82ef-ec2bb89e62e8
description: |
  Detects schtasks.exe creating a scheduled task (a /create invocation, identified by the schtasks.exe
  image or original file name) where the task command references a command interpreter or script host
  (powershell, pwsh, or cmd /c, /k, /r) AND a path under C:\ProgramData\ or %ProgramData%. All four
  conditions must hold for the rule to fire. Scheduled tasks are a common persistence mechanism: a task
  that launches a script or interpreter from a writable system-wide data directory survives reboots and
  runs on the schedule the task defines. Legitimate installers and management tooling occasionally stage
  helper scripts in ProgramData, so the investigation should confirm the exact task command, what it
  executes, the schedule and run-as account, and whether the activity was expected for this user and host.
type: detection
detection_id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show schtasks creating a task that runs an interpreter from a ProgramData
    path?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires only
    when all four conditions hold together. The process must be schtasks.exe (by image or original file
    name), the command line must contain ' /create ', it must reference powershell, pwsh, or cmd with /c,
    /k, or /r, and it must reference a path under C:\ProgramData\ or %ProgramData%. Read the full command
    line and confirm each element is present rather than a partial or coincidental match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to create scheduled tasks that run scripts from ProgramData?
  context: Legitimate administrative activity and software installers can create scheduled tasks, but a
    task that launches an interpreter from a writable data directory is less routine. Knowing whether the
    user role and host function normally involve scheduled-task creation of this shape is often the fastest
    way to separate authorized maintenance from unauthorized persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:scheduled_task.task_configuration
  question: What scheduled task was created, and what command does it execute?
  context: The schtasks command line carries the task name (/TN), the command or program to run (/TR),
    the schedule type (/SC, such as ONLOGON, DAILY, or MINUTE), and the run-as account (/RU, where SYSTEM
    is high-risk). Identify each of these from the alerting command line. The /TR value is the persistence
    payload here -- a script, binary, or download cradle staged under ProgramData.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:obfuscation.encoded_payload_decode
  question: Is the task command encoded or obfuscated, and what does the decoded content do?
  context: The interpreter token the rule matched (powershell, pwsh, cmd) is frequently used to run encoded
    or obfuscated payloads. Decode any base64 (for example a powershell -EncodedCommand argument), hex,
    character-concatenation, or environment-variable substitution in the /TR value. Decoding reveals the
    real intent -- a download cradle, reverse shell, in-memory loader, or credential theft. For multi-layer
    encoding, iterate until the payload is readable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:scheduled_task.task_trigger_and_timing
  question: When is the task scheduled to run, and has it already executed?
  context: The trigger schedule determines when the persistence activates. Tasks set to run at boot or
    logon fire on the next restart or login; recurring tasks (every minute, daily) may have already executed
    multiple times. Scheduled tasks run as children of the Task Scheduler service, so process creations
    parented by svchost.exe running the Schedule service after task creation reveal whether the payload
    has fired.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:scheduled_task.task_still_present
  question: Is the scheduled task still registered on the system?
  context: Persistence is only effective if the task still exists, and some operators delete tasks after
    execution to reduce forensic artifacts. Confirm whether the task identified by the /TN value is still
    present by querying the host (schtasks /query /tn <taskname> /v) or via endpoint management. A task
    that is still registered is an active persistence mechanism requiring remediation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.evidence_preservation
  question: Is the file referenced by the task command still on disk under ProgramData?
  context: The /TR value points to a script or binary, typically under C:\ProgramData\. Checking whether
    that file still exists enables deeper analysis -- hash lookups, content review, or sandbox submission.
    If the file is gone, the task may have already run and cleaned up, or the drop may predate file-event
    visibility.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_artifact.mechanism_decode
  question: What is in the file the task runs? Check for obfuscation, encoded strings, and malicious indicators.
  context: Read and analyze the actual content of the script or binary the task command references. For
    scripts, check for base64, obfuscated strings, embedded URLs or IP addresses, and download or loader
    patterns. For binaries, check imports, embedded strings, packer signatures, and signing status. This
    content analysis is distinct from a hash reputation lookup -- it answers what is in the file, not whether
    the file is already known.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_artifact.artifact_verification
  question: What is the hash of the file the task runs, and does it have known threat intel detections?
  context: A file hash uniquely identifies the staged payload for reputation lookup. Submit the hash of
    the file referenced by the /TR value to threat intel platforms to determine whether it is known malicious,
    known benign, or previously unseen. This is distinct from reading the file content -- it answers whether
    the file is already known, not what it does.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: attack:T1053.005.task_creation_event
  question: Was a task-creation event recorded in the Security log for this activity?
  context: Scheduled-task creation is recorded in the Security log independently of the process-creation
    evidence the rule fired on (task registered, Event 4698; task updated, Event 4702). The Security-log
    record carries the full task definition including the author account and the registered action, which
    confirms the task was actually installed rather than a schtasks invocation that failed or was blocked.
    If Security-log task auditing is not enabled in this environment, treat the absence of a record as a
    visibility gap rather than evidence nothing was registered.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
      condition: selection
    fields:
      - TaskName
      - SubjectUserName
- source: attack:T1053.005.task_registry_registration
  question: Was a task registered under the Task Scheduler registry path on this host?
  context: Task Scheduler stores each registered task under the TaskCache registry tree, and writes to
    that path are a registration artifact that survives even if the schtasks command line is not captured.
    Registry writes to a TaskCache\Tree or TaskCache\Tasks path around the alert time corroborate that a
    task was actually created and can surface tasks registered through APIs or COM rather than schtasks.exe.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\'
      condition: selection
    fields:
      - TargetObject
      - Image
- source: template:lolbin.renamed_binary_check
  question: Was schtasks.exe executed from its expected System32 path?
  context: schtasks.exe run from outside System32 or SysWOW64 may indicate a copied or renamed binary used
    to evade path-based allowlists. The rule also matches on OriginalFileName, so a renamed copy can still
    trigger it -- compare the Image path against the OriginalFileName to confirm whether the real schtasks
    binary ran from its standard location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.technique_class_lateral
  question: Were other persistence or proxy-execution LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary for persistence often use several. Finding
    other persistence or proxy-execution LOLBins (reg, sc, at, rundll32, regsvr32, mshta, and similar)
    running on this host in the same timeframe strengthens the case that the scheduled task is part of
    hands-on activity rather than an isolated administrative action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\reg.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\wmic.exe'
          - '\bitsadmin.exe'
          - '\certutil.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's schtasks pattern over the past 90 days, and what command
    shapes are typical?
  context: A scheduled-task pattern of this shape with no prior history on a host is more suspicious than
    one used regularly under stable conditions. The query mirrors the rule's selection structure scoped
    to this host, so the count reflects the rule's specific firing pattern rather than generic schtasks
    usage. The command-line projection lets you compare typical invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_create:
        CommandLine|contains: ' /create '
      selection_command:
        CommandLine|contains:
        - powershell
        - pwsh
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
      selection_all_folders:
        CommandLine|contains:
        - C:\ProgramData\
        - '%ProgramData%'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run schtasks.exe across the environment?
  context: Compare the acting user's current action against their historical behavior. A user who has never
    run schtasks.exe is more suspicious than one who does so routinely. User role and typical toolset should
    align with command-line scheduled-task creation. The count here is the user's overall schtasks.exe usage,
    not just the rule's specific pattern, so a high count still warrants checking whether this particular
    invocation fits their norm.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-schtasks combination historically routine on this host or environment-wide,
    or is the parent unusual for schtasks?
  context: When the task is created under a service principal, the user identity does not attribute the
    behavior, so the meaningful pivot is the launch mechanism -- which parent process spawned schtasks.exe,
    and whether that pairing is historically common. A new or rare parent for schtasks here (or environment-wide)
    is the deviation worth chasing; a pairing already accounting for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the acting user's activity across all hosts reveals lateral movement or activity on
    multiple endpoints. If the same user created similar tasks or ran related tooling on other hosts in
    the same window, the scope of the activity may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent-plus-schtasks combination fire on other hosts in the same window, or is
    it isolated to this host?
  context: Under a service principal, asking what else the user did network-wide returns service-telemetry
    noise. The meaningful question is whether the same launch mechanism -- parent process spawning schtasks.exe
    -- fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
