name: LSA PPL Protection Setting Modification via CommandLine
id: ab8d1c73-cc93-40e6-9126-6d2b0bf86407
description: |
  Detects reg.exe or PowerShell modifying the LSA protection (PPL) settings under
  HKLM\SYSTEM\CurrentControlSet\Control\Lsa — specifically the RunAsPPL, RunAsPPLBoot,
  or IsPplAutoEnabled values. The rule fires when the Image is reg.exe / powershell.exe /
  pwsh.exe AND the command line references ControlSet and \Control\Lsa with a write verb
  (reg add, Set-ItemProperty, or New-ItemProperty) AND names one of the PPL value keys.
  LSA Protection runs lsass.exe as a protected process so that non-protected processes cannot
  read its memory; turning it off removes the barrier that blocks credential-dumping tools from
  reading LSASS. Legitimately, this setting is sometimes toggled during imaging, compatibility
  troubleshooting, or driver work, so the investigation must establish whether the change was
  authorized and whether credential access followed.
type: detection
detection_id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match a write to an LSA PPL value under Control\Lsa?
  context: Before investing investigation time, confirm the alert is a true positive. The rule
    fires only when all three conditions hold together — the process is reg.exe, powershell.exe,
    or pwsh.exe; the command line references ControlSet and \Control\Lsa with a write verb (reg
    add, Set-ItemProperty, or New-ItemProperty); and it names RunAsPPL, RunAsPPLBoot, or
    IsPplAutoEnabled. Confirm the value being written, and note whether the data sets protection
    on (1) or off (0).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to change LSA protection settings?
  context: Modifying LSA PPL values is a privileged, infrequent operation. A build/imaging host
    or an administrator performing documented compatibility work is a different disposition than
    a workstation or a server with no change record. Knowing whether the user role and host
    function fit registry-level security changes is often the fastest path to separating
    authorized maintenance from tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which LSA PPL value was written, and does the data turn protection on or off?
  context: The exact value and data decide impact. RunAsPPL or RunAsPPLBoot set to 0 disables
    LSA Protection at next boot, removing the protected-process barrier that prevents
    credential-dumping tools from reading lsass.exe memory; setting them to 1 enables it.
    IsPplAutoEnabled relates to automatic PPL enablement. Parse the command line for the value
    name and the data written so the disposition reflects an actual disable rather than an
    enable or query.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:registry.registry_key_context
  question: What registry key path and value data were written by this process?
  context: The triggering command line carries the registry write, but the linked registry-set
    event exposes the resolved key path and the written data as structured fields rather than
    text parsed out of the command line. Confirm the full path resolves under
    HKLM\SYSTEM\CurrentControlSet\Control\Lsa and read the data value to see whether protection
    was set off. If no registry-set event is recorded, fall back to the command-line value from
    the trigger-match evidence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:cue_process_tool.process_chain
  question: What process spawned this tool and is that parent chain expected?
  context: The parent process reveals how the registry change was invoked. Interactive
    administration typically descends from explorer.exe or a console shell; configuration
    management descends from a known agent or service. Unusual parents such as web server
    worker processes, Office applications, mshta.exe, or wscript.exe point to exploitation or a
    scripted intrusion rather than hands-on maintenance.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: Disabling LSA protection is often one step in a sequence of configuration changes —
    for example, also enabling WDigest plaintext credential caching, weakening Defender, or
    adding firewall exceptions. Finding clusters of reg.exe write operations from the same host
    within a short window reveals the full scope of the changes and whether multiple objectives
    were pursued in one operation.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: attack:T1562.010.credential_access_followup
  question: Did credential-access activity targeting LSASS occur on this host after the protection change?
  context: Disabling LSA Protection has a single common purpose — to let a tool read lsass.exe
    memory for credentials. Look for processes that open or read LSASS, dump tools, or known
    process names and command lines associated with memory dumping in the window after the
    setting was changed. Activity here turns the registry change from a configuration anomaly
    into an active credential-access attempt.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cred:
        CommandLine|contains:
          - 'lsass'
          - 'sekurlsa'
          - 'MiniDump'
          - 'comsvcs.dll'
          - 'procdump'
          - 'rundll32'
      condition: selection and selection_cred
    fields:
      - Image
      - CommandLine
      - User
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the LSA protection setting was changed?
  context: Defenses are weakened for a reason — to execute a payload, dump credentials, or take
    an action that protection would otherwise block or log. Examining process activity
    immediately after the registry change reveals what the change was meant to enable. New
    binaries, credential tooling, or download cradles in that window point to the operator's
    next step.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: An operator who disables one protection often disables several — stopping Defender,
    clearing event logs, deleting shadow copies, or relaxing firewall rules to maximize
    coverage. Finding multiple tampering events from the same user or parent process within the
    surrounding window indicates several controls were targeted as part of one operation rather
    than an isolated registry edit.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'WDigest'
          - 'UseLogonCredential'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering with one control commonly precedes weakening others. This query surfaces
    direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear
    logs, or patch AMSI/ETW in the hour before the LSA change. Zero rows is a useful "protection
    looks healthy" signal; kernel-level driver tampering and in-memory patches will not appear
    here. Populated rows shift the disposition toward operator preparation — review the parent
    process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Does this user normally modify registry security settings with these tools?
  context: Compare this user's current action against their historical behavior. A user who has
    never run reg.exe or PowerShell to change protected-process settings is more suspicious than
    one who does so regularly as part of a documented role. The user's typical toolset and
    function should align with editing LSA configuration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment?
  context: When the alert fires under a service principal, user identity does not attribute the
    behavior — the meaningful pivot is the launch mechanism. A parent process plus this binary
    that already accounts for many prior events is configuration management or OS automation; a
    new or rare parent for this binary is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    coordinated action on multiple endpoints. If the same user changed LSA settings or ran
    related tooling on several hosts in the same window, the scope of the operation is broader
    than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window?
  context: Under a service principal, network-wide user activity returns agent-telemetry noise.
    The meaningful question is whether the same launch mechanism — parent process plus spawned
    binary — fired on other hosts in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this LSA-modification pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent and user distribution reflects how this
    specific LSA-modification pattern has historically run here — not generic reg.exe or
    PowerShell usage. A new parent process, an unexpected user account, or an unusual
    command-line shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \reg.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - reg.exe
        - powershell.exe
        - pwsh.dll
      selection_cli_action:
        CommandLine|contains|all:
        - ControlSet
        - \Control\Lsa
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - ' add '
      selection_key:
        CommandLine|contains:
        - IsPplAutoEnabled
        - RunAsPPL
        - RunAsPPLBoot
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.renamed_binary_check
  question: Was this binary executed from an expected path?
  context: reg.exe and PowerShell run from System32 or SysWOW64 by default. A binary with these
    original file names executing from a user-writable or temporary directory may have been
    copied or renamed to evade path-based allowlists, which raises suspicion beyond the registry
    action itself. Compare the Image path against the expected system location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this LSA-modification pattern over the past 90 days, and what command-line shapes are typical?
  context: An LSA-modification pattern with no prior history on a host is more suspicious than
    one seen periodically under stable parents. The query mirrors the rule's selection structure
    scoped to this host, so the count reflects this specific firing pattern rather than generic
    use of reg.exe or PowerShell. The command-line projection lets you compare typical
    invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \reg.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - reg.exe
        - powershell.exe
        - pwsh.dll
      selection_cli_action:
        CommandLine|contains|all:
        - ControlSet
        - \Control\Lsa
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - ' add '
      selection_key:
        CommandLine|contains:
        - IsPplAutoEnabled
        - RunAsPPL
        - RunAsPPLBoot
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — exploitation
    of an internet-facing service, reconnaissance, or other defense tampering — may reveal the
    stages that preceded this registry change and help reconstruct the timeline. Disabling LSA
    protection is typically a mid-chain step, so prior alerts often explain how the operator
    reached this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1562.010
      name: Downgrade Attack
      role: primary
    - id: T1562
      name: Impair Defenses
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: protection_setting_write
      description: "Process launches reg.exe or PowerShell to write an LSA PPL value under Control\\Lsa"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: which_control_targeted
      description: "Identify which PPL value was written and whether the data disables or enables protection"
      mapped_to: Q3
      source: template:defense_tampering.what_was_disabled
    - stage: 3
      label: enabled_objective
      description: "Credential access / further activity that the weakened protection enables"
      mapped_to: Q7
      source: attack:T1562.010.credential_access_followup
  dimension_coverage:
    - dimension: tuning_parameter
      technique: T1562.010
      covered_by: Q3
      source: template:defense_tampering.what_was_disabled
      coverage_type: direct
    - dimension: process_identification
      technique: T1562
      covered_by: Q5
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: time_correlation
      technique: T1562
      covered_by: Q8
      source: template:defense_tampering.activity_after_tampering
      coverage_type: direct
  mutable_dispositions:
    - element: AllowedInterpreterVersions
      dimension: tuning_parameter
      specific_values: rationale only
      disposition: context
      target_question: Q3
      notes: "T1562.010 tuning rationale about permitted interpreter versions; no concrete values to inject. The rule's actual PPL value names (RunAsPPL, RunAsPPLBoot, IsPplAutoEnabled) are the queryable tuning parameters and are surfaced in Q1/Q3 and the reflected host/fleet queries."
    - element: RegistryDefenderKeys
      dimension: tuning_parameter
      specific_values: rationale only
      disposition: context
      target_question: Q3
      notes: "Generic note that Defender/HVCI registry paths vary by Windows version; no concrete values. The rule's concrete registry target (Control\\Lsa PPL values) is surfaced in Q1, Q3, and Q4."
    - element: ProcessWhitelist
      dimension: process_identification
      specific_values: rationale only
      disposition: context
      target_question: Q5
      notes: "Exclude-authorized-admin-tools rationale; no concrete values. Parent-chain and baseline questions (Q5, Q11, Q12, Q15) let the analyst judge whether the launch mechanism is authorized."
    - element: ServiceNamePatterns
      dimension: tuning_parameter
      specific_values: rationale only
      disposition: context
      target_question: Q9
      notes: "T1562 service-name tuning rationale; the endpoint-protection-health sweep (Q9) carries a concrete security-service name list covering this dimension."
  dedup_decisions:
    - dropped: cue_process_tool.clustering
      reason: "host-context clustering / activity-after-tampering already provide same-window host activity; cue_user_actor.clustering covers cross-host. Dropped to stay within 18-question cap without losing coverage."
      kept: template:defense_tampering.activity_after_tampering
    - dropped: cue_host_context.clustering
      reason: "same-window host activity covered by defense_tampering.activity_after_tampering (+1h aggregated Image/User) and registry_related_modifications; avoids a near-duplicate broad host-aggregate query."
      kept: template:defense_tampering.activity_after_tampering
    - dropped: cue_process_tool.baseline
      reason: "generic per-binary host baseline subsumed by the reflected lolbin.historical_lolbin_baseline, which counts the rule's specific LSA pattern on this host rather than all reg.exe/powershell usage."
      kept: template:lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.follow_on
      reason: "child-process-of-this-binary covered more usefully by the post-tampering activity question (host-scoped +1h) and the credential-access follow-up; reg.exe rarely spawns children, so a ParentImage=reg.exe query returns little."
      kept: template:defense_tampering.activity_after_tampering
    - dropped: cue_user_actor.baseline / cue_user_actor.baseline_svc pair
      reason: "user_actor pair — non-deduplicable; both emitted (Q11 user-pivot + Q12 parent+binary substitute)."
      kept: both
    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc pair
      reason: "user_actor pair — non-deduplicable; both emitted (Q13 user-pivot + Q14 parent+binary substitute)."
      kept: both
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: registry.registry_key_context (also flagged by hints); Phase 2 mechanism-decode role filled by defense_tampering.what_was_disabled and registry.registry_key_context."
    - template: powershell.encoded_command_decode
      reason: "Rule fires on plain-text reg add / Set-ItemProperty / New-ItemProperty command lines that name the Control\\Lsa PPL values directly; there is no -EncodedCommand or obfuscation to decode. Per the template's own notes_to_llm, plain-text commands skip the encoding question. The decode/what-was-written task is covered by what_was_disabled (Q3) and registry_key_context (Q4)."
    - template: powershell.script_block_logging
      reason: "The detected commands are single short registry writes; script-block (4104) content adds nothing the command line and registry-set fields (Q1, Q3, Q4) do not already show. Skipped to stay within the 18-question cap."
    - template: powershell.powershell_security_bypass
      reason: "Pre-execution PowerShell control bypasses (AMSI patch, -ep bypass, downgrade) overlap with the endpoint-protection-health sweep (Q9) and the defense-tampering precursor questions; the rule is a registry write, not script execution, so a dedicated bypass-precursor question adds little unique coverage."
    - template: defense_tampering.protection_status
      reason: "current-restored-vs-still-unprotected is a manual EDR/host-inspection check that re-displays the same trigger command as what_was_disabled (Q3); the analyst determines current PPL status from the host directly. Dropped to stay within the 18-question cap; what_was_disabled already directs identifying the targeted control."
    - template: persistence_scope.process_based_persistence
      reason: "Rule is defense-evasion (disable LSA protection to enable credential access), not persistence; applicability.is_persistence_rule is false. Post-change activity and other-tampering questions (Q8, Q9) carry the relevant follow-on coverage. recommended priority, dropped."
    - template: persistence_scope.file_based_persistence
      reason: "Startup-folder / Run-key file drops are not part of this rule's behavior (LSA PPL registry write); applicability.is_persistence_rule is false. recommended priority, dropped."
