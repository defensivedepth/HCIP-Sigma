name: Potentially Suspicious Desktop Background Change Using Reg.EXE
id: 0ed00ed6-0abe-4e67-b84c-46731b696d67
description: |
  Detects reg.exe being used to add registry values that replace or lock the
  user's desktop background. The rule fires when reg.exe (or a binary whose
  OriginalFileName is reg.exe) runs an "add" against a desktop or policy key
  (Control Panel\Desktop, CurrentVersion\Policies\ActiveDesktop, or
  CurrentVersion\Policies\System) AND the command line carries EITHER the
  wallpaper-lock pair (NoChangingWallpaper with /d 1), OR the wallpaper-path
  pair (Wallpaper with /t REG_SZ), OR the wallpaper-style pair (WallpaperStyle
  with /d 2). Administrative scripts that set a corporate logo background are a
  benign source of this pattern; the same registry writes are also used to
  display a ransom note and prevent the user from restoring their own wallpaper.
  Investigation should confirm which value was written, who launched reg.exe and
  from what parent, and whether surrounding activity (other registry changes,
  recovery inhibition, encryption) suggests impact rather than routine
  configuration.
type: detection
detection_id: 8cbc9475-8d05-4e27-9c32-df960716c701
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the reg.exe command line match what this rule detects — an add against a desktop or policy key, plus one of the wallpaper value pairs?
  context: Confirm the alert is a true positive before investing time. The rule fires when reg.exe (or a binary whose OriginalFileName is reg.exe) runs an add against Control Panel\Desktop, CurrentVersion\Policies\ActiveDesktop, or CurrentVersion\Policies\System, AND the command line carries EITHER NoChangingWallpaper with /d 1, OR Wallpaper with /t REG_SZ, OR WallpaperStyle with /d 2. Note which of the three value pairs fired, because that determines what the change does — NoChangingWallpaper /d 1 locks the wallpaper so the user cannot restore it, Wallpaper /t REG_SZ sets the image path, and WallpaperStyle /d 2 stretches it. The locking branch is the more impact-relevant one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to script desktop background or policy registry changes?
  context: Legitimate administrative tooling can set a corporate logo wallpaper through the same keys. Whether the user role and host function are consistent with someone deploying a managed background — versus an account that would never push policy-key wallpaper changes — is often the fastest way to separate routine configuration from impact activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, GPO rollout, or documented approval for a desktop background or wallpaper-lock change?
  context: Many organizations deploy managed wallpapers through group policy or a documented software push, which is the benign source of this pattern. A corresponding change record suggests authorized configuration; the absence of one — especially for the NoChangingWallpaper lock, which prevents the user from changing their own background — moves the disposition toward unauthorized activity and is a quick way to close or escalate the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:registry.registry_key_context
  question: What exact registry key, value name, and data did this write set — and which wallpaper value was changed?
  context: The reg.exe command line carries the target key, value name, and data; the linked registry write event surfaces them as structured fields. Identify whether the change set the wallpaper image path, applied a stretch style, or set NoChangingWallpaper to 1 to lock the background. A value that points a wallpaper to a user-writable path such as a Public or Temp directory, or that locks the wallpaper, is more consistent with impact than a managed corporate-logo deployment. If the registry write event is not collected in this environment, read the same fields directly from the alerting reg.exe command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:parent_child.parent_process_legitimacy
  question: What process spawned this reg.exe, and what started that parent?
  context: The parent process reveals how reg.exe was invoked. A management agent, deployment tool, or interactive admin shell is a routine launcher for a configuration script. A reg.exe spawned by a cmd.exe chain that itself descends from an unexpected executable, a script host, or a binary in a user-writable directory points to operator-driven activity. Tracing the parent's own origin shows whether the chain is legitimate or part of a larger operation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn around this time?
  context: If a suspicious parent spawned this reg.exe, it likely spawned other processes too. Wallpaper replacement by malware is typically one step in a nested cmd.exe chain that also issues additional reg writes, a rundll32 call to apply the change live, and recovery-inhibition or self-deletion steps. Multiple related children from the same parent in a short window indicates orchestration rather than a one-off configuration command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What did reg.exe spawn afterward on this host?
  context: reg.exe normally exits without spawning children. A process launched by reg.exe, or activity immediately following it such as a rundll32 call to UpdatePerUserSystemParameters to push the wallpaper change live, or a hidden PowerShell self-delete, indicates the registry write was part of an automated sequence rather than a standalone administrative action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: A wallpaper change driven by malware rarely stands alone — the same operator commonly issues several reg writes together, locking the wallpaper, disabling security tooling, and altering firewall or RDP configuration. Finding a cluster of reg.exe write operations from the same host within a short window reveals the full scope of the configuration changes and whether multiple objectives were pursued, versus a single benign wallpaper deployment.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this wallpaper-registry pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how this specific wallpaper-registry pattern — not generic reg.exe usage — has historically run here. A new parent process, an unexpected user account, or an unusual command structure relative to past firings is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flag:
        CommandLine|contains: add
      selection_keys:
        CommandLine|contains:
        - Control Panel\Desktop
        - CurrentVersion\Policies\ActiveDesktop
        - CurrentVersion\Policies\System
      selection_cli_reg_1:
        CommandLine|contains|all:
        - /v NoChangingWallpaper
        - /d 1
      selection_cli_reg_2:
        CommandLine|contains|all:
        - /v Wallpaper
        - /t REG_SZ
      selection_cli_reg_3:
        CommandLine|contains|all:
        - /v WallpaperStyle
        - /d 2
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_reg_* and selection_keys and 1 of selection_cli_reg_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flag:
        CommandLine|contains: add
      selection_keys:
        CommandLine|contains:
        - Control Panel\Desktop
        - CurrentVersion\Policies\ActiveDesktop
        - CurrentVersion\Policies\System
      selection_cli_reg_1:
        CommandLine|contains|all:
        - /v NoChangingWallpaper
        - /d 1
      selection_cli_reg_2:
        CommandLine|contains|all:
        - /v Wallpaper
        - /t REG_SZ
      selection_cli_reg_3:
        CommandLine|contains|all:
        - /v WallpaperStyle
        - /d 2
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_reg_* and selection_keys and 1 of selection_cli_reg_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flag:
        CommandLine|contains: add
      selection_keys:
        CommandLine|contains:
        - Control Panel\Desktop
        - CurrentVersion\Policies\ActiveDesktop
        - CurrentVersion\Policies\System
      selection_cli_reg_1:
        CommandLine|contains|all:
        - /v NoChangingWallpaper
        - /d 1
      selection_cli_reg_2:
        CommandLine|contains|all:
        - /v Wallpaper
        - /t REG_SZ
      selection_cli_reg_3:
        CommandLine|contains|all:
        - /v WallpaperStyle
        - /d 2
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_reg_* and selection_keys and 1 of selection_cli_reg_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether this is isolated or spans multiple endpoints. If the same user drove similar registry or wallpaper changes on several hosts in the same window, the scope of the activity — and any containment — is broader than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flag:
        CommandLine|contains: add
      selection_keys:
        CommandLine|contains:
        - Control Panel\Desktop
        - CurrentVersion\Policies\ActiveDesktop
        - CurrentVersion\Policies\System
      selection_cli_reg_1:
        CommandLine|contains|all:
        - /v NoChangingWallpaper
        - /d 1
      selection_cli_reg_2:
        CommandLine|contains|all:
        - /v Wallpaper
        - /t REG_SZ
      selection_cli_reg_3:
        CommandLine|contains|all:
        - /v WallpaperStyle
        - /d 2
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_reg_* and selection_keys and 1 of selection_cli_reg_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining what ran on the host immediately before and after the wallpaper write reveals whether it is part of a larger sequence — reconnaissance, security-tool tampering, shadow-copy deletion, or file encryption — versus a standalone configuration change. Novel parent-child pairs at low counts are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, recovery inhibition, credential access, or recovery-inhibiting commands — may reveal the stages that preceded a wallpaper change. When a wallpaper-lock write is the visible step of an impact sequence, the preceding alerts often tell the rest of the story and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.renamed_binary_check
  question: Was reg.exe executed from its expected System32 or SysWOW64 path?
  context: reg.exe run from a non-standard path — outside System32 or SysWOW64 — can indicate the binary was copied or renamed to evade path-based allowlists. The OriginalFileName field confirms identity even when the on-disk name differs; the rule itself matches either the reg.exe image name or an OriginalFileName of reg.exe, so a relocated copy still fires. A reg.exe running from a user or temp directory is more notable than one in System32.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this wallpaper-registry pattern over the past 90 days, and what command-line structures are typical?
  context: A pattern with no prior history on a host is more notable than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific wallpaper-registry firing pattern rather than generic reg.exe usage. The command-line projection lets the alerting invocation be compared against historically typical patterns — for example, a recurring managed-wallpaper push versus a one-off write targeting a user-writable image path.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flag:
        CommandLine|contains: add
      selection_keys:
        CommandLine|contains:
        - Control Panel\Desktop
        - CurrentVersion\Policies\ActiveDesktop
        - CurrentVersion\Policies\System
      selection_cli_reg_1:
        CommandLine|contains|all:
        - /v NoChangingWallpaper
        - /d 1
      selection_cli_reg_2:
        CommandLine|contains|all:
        - /v Wallpaper
        - /t REG_SZ
      selection_cli_reg_3:
        CommandLine|contains|all:
        - /v WallpaperStyle
        - /d 2
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_reg_* and selection_keys and 1 of selection_cli_reg_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this wallpaper-registry pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this wallpaper-registry pattern rather than generic reg.exe usage. Many hosts firing the same pattern points to a scripted or managed wallpaper deployment; one host or a small unrelated set points to operator-driven activity. Use the host distribution to calibrate whether this looks like routine configuration or coordinated impact.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flag:
        CommandLine|contains: add
      selection_keys:
        CommandLine|contains:
        - Control Panel\Desktop
        - CurrentVersion\Policies\ActiveDesktop
        - CurrentVersion\Policies\System
      selection_cli_reg_1:
        CommandLine|contains|all:
        - /v NoChangingWallpaper
        - /d 1
      selection_cli_reg_2:
        CommandLine|contains|all:
        - /v Wallpaper
        - /t REG_SZ
      selection_cli_reg_3:
        CommandLine|contains|all:
        - /v WallpaperStyle
        - /d 2
      condition: all of selection_reg_* and selection_keys and 1 of selection_cli_reg_*
    fields:
    - host.name
