    - template: registry.registry_value_persistence_check
      reason: "rule writes wallpaper image-path / policy values (NoChangingWallpaper=1, WallpaperStyle=2), not a registry value pointing at an executable; there is no referenced payload on disk to verify, so the on-disk-executable check has no target here"
    - template: persistence_scope.process_based_persistence
      reason: "rule's persistence tactic is wallpaper-lock (NoChangingWallpaper prevents the user restoring their background), not an autostart foothold; a schtasks/sc/reg/bitsadmin/wmic persistence-tool sweep is off-target. Related reg.exe writes are covered by registry_related_modifications"
