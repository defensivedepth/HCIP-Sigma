name: Potential Remote SquiblyTwo Technique Execution
id: ae581b84-78aa-453a-a58e-cfe22c45ff9b
description: |
  Detects wmic.exe invoked with a /format switch whose value contains a remote reference (an HTTP/HTTPS URL via '://' or a UNC path via '\\') — the SquiblyTwo technique, which abuses the trusted, Microsoft-signed wmic.exe to fetch and execute a remote XSL stylesheet containing embedded JScript or VBScript. The XSL transform runs arbitrary unsigned code in memory under the signed binary, bypassing application allowlisting and disk-based detection, and the technique is not gated by Windows Script Host controls. Legitimate WMIC formatting uses the local stock XSL files under System32\wbem (TABLE, LIST, CSV); a remote /format value pointing at a URL or remote share is the operative anomaly. Investigation should confirm the remote XSL reference, identify the remote source, decode any embedded script, and determine what the transform executed and what it spawned.
type: detection
detection_id: 8d63dadf-b91b-4187-87b6-34a1114577ea
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did wmic.exe run with a /format switch pointing at a remote URL or UNC path?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details against the detection criteria. The rule fires only when both conditions hold together — the process is wmic.exe (by image name, original filename, or known import hash) AND the command line carries the '/format:' switch together with a remote reference ('://' for an HTTP/HTTPS URL or '\\' for a UNC share). A local /format value such as TABLE, LIST, CSV, or a path under System32\wbem is the benign baseline and does not match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Hashes
- source: template:universal.host_user_context
  question: Is this user and host expected to run wmic.exe with a remote /format stylesheet?
  context: Legitimate administrative WMIC usage queries inventory and process data with local output formats; pulling an XSL stylesheet from a URL or remote share is rare in normal operations. Knowing whether the user role and host function involve scripted WMI administration or developer XSL work is often the fastest way to separate a true positive from a sanctioned task.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What remote source does the /format value reference, and what does the XSL stylesheet it pulls contain?
  context: The full command line reveals the operation. Extract the /format argument and identify the remote target — the HTTP/HTTPS URL or the UNC share and file. The referenced stylesheet is the payload; XSL files used for SquiblyTwo embed executable script inside <ms:script> or <msxsl:script> blocks (JScript or VBScript) that run with full trust during the transform. Retrieve and decode the stylesheet content where available to determine what code it executes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '/format:'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1220.command_analysis
  question: Does the /format value use a non-.xsl extension or encoded characters to disguise the remote stylesheet?
  context: The /format target need not end in .xsl — the transform processes whatever it retrieves, so operators substitute arbitrary extensions (.jpeg, .txt, .log) or URL-encode characters to evade extension- and keyword-based filters. Inspect the literal characters of the referenced path for encoding or an unexpected extension; a disguised target alongside a remote reference strengthens the case that the file is a script-bearing stylesheet rather than benign data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:obfuscation.encoded_payload_decode
  question: Is the embedded XSL script encoded or obfuscated, and what operation does the decoded JScript or VBScript perform?
  context: 'The script inside the remote XSL is the operator''s payload, frequently obfuscated to hide intent. Common patterns: VBScript Chr() chains and string concatenation, JavaScript String.fromCharCode reconstruction, base64 blobs decoded at runtime, and DotNetToJScript-style loaders. Decoding reveals the actual behavior — download cradles, in-memory loaders, reverse shells, credential theft, or data exfiltration. Reconstruct any Chr() or fromCharCode chains in the stylesheet, then follow each layer until the payload is readable.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1220.image_load
  question: Did scripting-engine or XML transform libraries load into wmic.exe on this host?
  context: When wmic.exe processes a script-bearing XSL it must load the scripting engine and XML transform components — jscript.dll, vbscript.dll, msxml*.dll, and the .NET CLR (clr.dll, mscoree.dll). These modules loading into wmic.exe are abnormal for routine WMI queries and are a strong confirmation that the /format transform actually executed embedded code rather than producing benign formatted output. If module-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence the transform did not run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\wmic.exe'
      selection_modules:
        ImageLoaded|contains:
          - '\jscript.dll'
          - '\jscript9.dll'
          - '\vbscript.dll'
          - '\msxml'
          - '\clr.dll'
          - '\mscoree.dll'
          - '\scrobj.dll'
      condition: selection and selection_modules
    fields:
      - ImageLoaded
      - CommandLine
- source: attack:T1047.network_connection
  question: Did wmic.exe make an outbound network connection to fetch the remote stylesheet, and to what destination?
  context: A remote /format reference means wmic.exe reaches out over HTTP/HTTPS or SMB to retrieve the XSL before executing it. The outbound connection from wmic.exe identifies the remote source — its address and port — which is the controlling infrastructure for the payload. Correlate the connection destination with the URL or UNC host parsed from the command line; an external or unfamiliar destination is the remote-fetch confirmation and a pivot for scoping other affected hosts.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\wmic.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.process_chain
  question: What process spawned this wmic.exe instance, and is that parent chain expected?
  context: The parent process reveals how the transform was invoked. Routine WMIC runs descend from explorer.exe (interactive admin), a management console, or a scripted scheduler. Parents like mshta.exe, wscript.exe, cscript.exe, powershell.exe, or an Office application point to a macro- or script-driven launch consistent with a delivered payload. Walk up the chain to see what spawned the parent and what else it launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this wmic.exe instance spawn afterward?
  context: The XSL transform's embedded script commonly launches follow-on tooling — cmd.exe, powershell.exe, certutil.exe, rundll32.exe — to carry out the actual objective once code execution is achieved. Children spawned by this wmic.exe instance reveal the post-execution behavior; unexpected interpreters or download utilities indicate the transform delivered an active payload rather than formatting output.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was wmic.exe executed from its expected System32\wbem or SysWOW64\wbem path?
  context: The signed WMI command-line binary lives at C:\Windows\System32\wbem\wmic.exe and C:\Windows\SysWOW64\wbem\wmic.exe. A wmic.exe running from a user directory, temp folder, or other non-standard location may have been copied or renamed to evade path-based allowlists, and an original filename of wmic.exe under a mismatched image path is a further sign of relocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this remote-XSL wmic.exe pattern, what parents and users drove it, and does the current alert fit?
  context: Even signed system tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific remote-/format pattern (not generic wmic.exe usage) has historically run here. A new parent process, an unexpected user account, or an unusual command-line shape relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      - Hashes|contains:
        - IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E
        - IMPHASH=37777A96245A3C74EB217308F3546F4C
        - IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206
        - IMPHASH=B12619881D79C3ACADF45E752A58554A
        - IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00
      selection_cli:
        CommandLine|contains|windash: '/format:'
        CommandLine|contains:
        - ://
        - \\\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the remote-XSL wmic.exe pattern over the past 90 days, and what command-line shapes are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used routinely under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific remote-/format firing pattern rather than generic wmic.exe usage. The command-line projection lets the analyst compare typical invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      - Hashes|contains:
        - IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E
        - IMPHASH=37777A96245A3C74EB217308F3546F4C
        - IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206
        - IMPHASH=B12619881D79C3ACADF45E752A58554A
        - IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00
      selection_cli:
        CommandLine|contains|windash: '/format:'
        CommandLine|contains:
        - ://
        - \\\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run wmic.exe?
  context: Compare the alerting user's current action against their historical behavior. A user who has never run wmic.exe — let alone with a remote stylesheet — is more suspicious than one who administers WMI regularly. The user's role and typical toolset should align with command-line WMI usage.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and wmic.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned wmic.exe, and whether that pair is historically common. A new or rare parent for wmic.exe on this host or environment-wide is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on several hosts, the scope may be larger than a single detection. WMI is itself a lateral-movement vector, so concurrent activity elsewhere is directly relevant.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and wmic.exe combination fire on other hosts in the same window, indicating a coordinated automation rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus wmic.exe — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution or download LOLBins used on this host recently?
  context: Operators who reach for one signed-binary proxy-execution technique often use several. If wmic.exe ran a remote XSL, check whether mshta, rundll32, regsvr32, msbuild, installutil, or download utilities like certutil, bitsadmin, and curl were also used on this host. Multiple living-off-the-land binaries pursuing the same objective strengthen the case for hands-on-keyboard activity over an isolated event.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\mshta.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\cmstp.exe'
          - '\forfiles.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\control.exe'
          - '\mavinject.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or delivery via a script host or Office application — may reveal the stages that preceded this execution and help reconstruct the timeline that led to the remote XSL transform.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
