name: Whoami.EXE Execution Anomaly
id: c3b6cac4-65c3-4782-9ba4-f3ae80a4f5a3
description: |
  Detects execution of whoami.exe (matched by Image name or OriginalFileName) when the parent process is not one of the expected interactive shells or known monitoring agents. whoami.exe reports the current user, groups, and privileges; administrators and scripts run it routinely for troubleshooting, but the same command is a common first step in post-compromise enumeration so an actor can confirm what context and privileges they have landed in. The rule suppresses the routine cases (cmd.exe, powershell.exe, powershell_ise.exe, pwsh.exe, the Microsoft Monitoring Agent, and empty/null parents) and surfaces only invocations from an unusual parent, which is the anomaly worth investigating.
type: detection
detection_id: 8de1cbe8-d6f5-496d-8237-5f44a721c7a0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Is the alerting process actually whoami.exe, and was it launched by a parent outside the expected shell and monitoring-agent set?
  context: Confirm the alert is a true positive by checking that the process is whoami.exe (by Image name or OriginalFileName) and that the parent process is not cmd.exe, powershell.exe, powershell_ise.exe, pwsh.exe, or the Microsoft Monitoring Agent. The whole point of the rule is the unusual parent, so identify exactly what spawned this execution before going further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run user-discovery commands like whoami on this host?
  context: Administrators and IT staff legitimately run whoami for troubleshooting and scripting. Standard users and service accounts rarely need it. The user's role and typical behavior baseline determine whether this execution is routine or anomalous; a discovery command issued by an account that never performs administrative tasks is the deviation worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What were the full command-line arguments passed to whoami, and what information was it asked to enumerate?
  context: whoami can report different things depending on its switches — /all, /groups, /priv, /user, and /upn each expand the scope of what the actor learns about the account, its privileges, and group memberships. Decode the arguments to understand exactly what user context was enumerated; broad /all or /priv usage from an unusual parent is more interesting than a bare whoami.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned whoami, and is that parent a normal way to run discovery commands?
  context: Discovery commands are normally launched from cmd.exe or a script host under explorer.exe, or from automation. whoami spawned by Office applications, script interpreters (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe (WMI remote execution), or wsmprovhost.exe (WinRM remote execution) points to automated post-exploitation enumeration. Examine the parent command line to understand how the parent itself was invoked.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.process_chain
  question: What is the wider ancestry of the parent that spawned whoami, and what else did that parent launch?
  context: The immediate parent is visible in the alert, but the chain above it tells the fuller story. Look up the parent process by its own identity to see what spawned it and what other children it created. A short-lived parent created by a download cradle or a remote-execution service, rather than a long-running interactive shell, reframes the enumeration as part of a hands-on intrusion.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single whoami may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession — whoami, ipconfig, net user, systeminfo — is a signature pattern of post-compromise enumeration. Three or more distinct recon binaries within fifteen minutes typically indicates automated reconnaissance as an actor maps the host before the next attack stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.follow_on
  question: What processes did this parent go on to spawn after the whoami execution?
  context: Enumeration is usually a precursor to action. After confirming user context, an actor often moves to privilege escalation, credential access, lateral movement, or staging. Reviewing what the same launching binary spawned afterward on this host reveals whether the whoami was an isolated check or the opening move of a longer sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run whoami.exe, and at what frequency?
  context: A binary that is rarely or never seen on a host is more notable than one that runs regularly as part of routine administration or automation. Zero or very low historical counts indicate first-time or rare execution, which raises the weight of the unusual-parent anomaly.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection and filters scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern — whoami from an unexpected parent — has historically run here, not generic whoami usage. A new parent process, an unexpected user account, or an unusual pattern compared to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      filter_main_known_parents:
        ParentImage|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      filter_optional_ms_monitoring_agent:
        ParentImage|endswith: :\Program Files\Microsoft Monitoring Agent\Agent\MonitoringHost.exe
      filter_main_parent_null:
        ParentImage: null
      filter_main_parent_empty:
        ParentImage:
        - ''
        - '-'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      filter_main_known_parents:
        ParentImage|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      filter_optional_ms_monitoring_agent:
        ParentImage|endswith: :\Program Files\Microsoft Monitoring Agent\Agent\MonitoringHost.exe
      filter_main_parent_null:
        ParentImage: null
      filter_main_parent_empty:
        ParentImage:
        - ''
        - '-'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      filter_main_known_parents:
        ParentImage|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      filter_optional_ms_monitoring_agent:
        ParentImage|endswith: :\Program Files\Microsoft Monitoring Agent\Agent\MonitoringHost.exe
      filter_main_parent_null:
        ParentImage: null
      filter_main_parent_empty:
        ParentImage:
        - ''
        - '-'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration spread across multiple endpoints. If the same user triggered similar discovery or other activity on multiple hosts in this window, the scope of the activity may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      filter_main_known_parents:
        ParentImage|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      filter_optional_ms_monitoring_agent:
        ParentImage|endswith: :\Program Files\Microsoft Monitoring Agent\Agent\MonitoringHost.exe
      filter_main_parent_null:
        ParentImage: null
      filter_main_parent_empty:
        ParentImage:
        - ''
        - '-'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context — what led to the event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms surfacing as novel parent-child pairs against the host's routine baseline.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this enumeration and help reconstruct the timeline. A discovery command that follows an exploitation or initial-access alert carries more weight than one that stands alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
