        author a custom question with `category: network_connection`
      disposition: declined
      reason: >-
        The cmd process writes its output to a local file and initiates no network
        connection, so a connection scoped to this process returns nothing. The
        rule explicitly stages data for FUTURE exfiltration by a separate process;
        that exfiltration is surfaced by the follow_on (Q7) and precursor (Q15)
        questions, not by a cmd-scoped network query. No compensating
        network_connection question was authored because cmd has no egress to scope it to.
    - hint: >-
        Condition uses OR among selection groups: (selection_cli_1 OR selection_cli_2). Q1 (verify_trigger_match) and the playbook
