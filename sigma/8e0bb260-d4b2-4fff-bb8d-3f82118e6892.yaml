      reason: >-
        cmd.exe redirecting command output to a file does not load a payload
        module — there is no proxied DLL here. The artifact is the written file,
        covered by Q5 (file_event) and Q6, and the captured command is decoded in
        Q3. An image_load question of cmd would surface only the standard shell
        DLLs and add no precision.
    - hint: >-
