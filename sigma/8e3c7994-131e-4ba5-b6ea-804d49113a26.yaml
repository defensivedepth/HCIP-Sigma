name: Uncommon Child Process Spawned By Odbcconf.EXE
id: d25c9dc7-926e-4882-9fff-2284acbdcee1
description: |
  Detects a child process spawned by odbcconf.exe, which under normal operation rarely spawns any child process.
  odbcconf.exe is a Microsoft-signed ODBC configuration utility that can be abused to proxy-execute arbitrary DLLs:
  its REGSVR action calls DllRegisterServer on an attacker-supplied module (equivalent to regsvr32.exe), and a
  loaded DLL can in turn spawn a follow-on process or open a network connection. The investigation should determine
  what arguments odbcconf.exe ran with, which DLL it loaded, what the spawned child did, and whether the parent chain
  and host are consistent with legitimate ODBC driver maintenance.
type: detection
detection_id: 8e3c7994-131e-4ba5-b6ea-804d49113a26
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Is the parent of the alerting process odbcconf.exe, and what child did it spawn?
  context: Confirm the alert is a true positive by checking that the parent process is odbcconf.exe and reviewing what
    child process it spawned. odbcconf.exe normally completes its work in-process and spawns no children, so any child
    is worth attention. Note the child image, command line, and signing state before proceeding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- source: template:universal.host_user_context
  question: Is this user and host expected to run or configure ODBC drivers via odbcconf.exe?
  context: Legitimate ODBC driver installation and DSN configuration is normally performed by administrators or
    installer packages on specific hosts. Knowing whether this user role and host function involve ODBC maintenance is
    often the fastest way to separate routine driver registration from proxy-execution abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_parent_process.mechanism_decode
  question: What command line did odbcconf.exe itself run with, and does it use the REGSVR or driver-install actions?
  context: The parent's own command line reveals how the DLL execution was set up. Look for the REGSVR action (registers
    a DLL by calling DllRegisterServer, equivalent to regsvr32.exe), INSTALLDRIVER, or a response file loaded with -f or
    /f that hides the DLL path. Silent mode (/S) combined with REGSVR is the core abuse pattern. The DLL path named here is
    the artifact to triage next.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the child process spawned by odbcconf.exe do? Decode its command-line arguments.
  context: The spawned child is the follow-on action of the loaded DLL. Decode its full command line, flags, encoded
    content, file paths, and any URLs. A child such as a command interpreter, script host, or network tool indicates the
    DLL executed operator-controlled code rather than performing ODBC configuration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- source: attack:T1218.008.command_analysis
  question: Did odbcconf.exe run with DLL-execution arguments such as REGSVR, INSTALLDRIVER, or a response file?
  context: The abuse of odbcconf.exe is driven by specific action verbs that load a DLL. REGSVR calls DllRegisterServer
    on the named module; INSTALLDRIVER installs a driver whose Driver=/Setup= paths point at a DLL; a response file (-f or
    /f) carries the same directives off the command line. This query surfaces odbcconf.exe invocations on the host that
    carry these patterns so the analyst can confirm the proxy-execution intent and extract the DLL path.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_odbcconf:
        Image|endswith: \odbcconf.exe
      selection_action:
        CommandLine|contains:
          - 'REGSVR'
          - 'INSTALLDRIVER'
          - 'CONFIGSYSDSN'
          - ' -f '
          - ' /f '
          - ' -F '
          - ' /F '
      condition: selection_host and selection_odbcconf and selection_action
    fields:
      - CommandLine
      - Image
      - User
- source: attack:T1218.008.dll_load
  question: What DLLs did odbcconf.exe load, and are any unsigned or in user-writable locations?
  context: After odbcconf.exe parses a REGSVR or driver-install action it loads the named DLL into its own process,
    which is where DllRegisterServer or DllMain executes. A DLL loaded from a user-writable directory, a temporary path,
    or one that is unsigned or has no enterprise provenance is the payload. If image-load telemetry is not collected in
    this environment, treat zero results as a visibility gap and identify the DLL from the odbcconf.exe command line
    instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \odbcconf.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.008.follow_on_network
  question: Did odbcconf.exe or the child it spawned open any outbound network connections?
  context: A DLL loaded through odbcconf.exe can retrieve a second-stage payload or beacon to operator infrastructure,
    and the spawned child may do the same. Outbound connections from odbcconf.exe or its child to external addresses are
    not expected for local ODBC driver configuration. If network telemetry is not collected here, treat zero results as a
    visibility gap rather than confirmation that no connection occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \odbcconf.exe
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Image
- source: template:cue_parent_process.baseline
  question: Has odbcconf.exe spawned this child process on this host before?
  context: odbcconf.exe rarely spawns any child under normal operation, so a parent-child pairing that has never or
    seldom occurred here is the anomaly. Zero or very low historical counts indicate a novel spawning relationship;
    a recurring pairing may reflect a packaged installer or routine driver maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_parent_process.follow_on
  question: What other child processes did this odbcconf.exe instance spawn?
  context: A DLL loaded through odbcconf.exe may launch more than one follow-on process — reconnaissance, credential
    access, or staging tools in sequence. Listing every child of the same odbcconf.exe parent reveals the full scope of
    activity initiated through this proxy-execution chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.scope
  question: Is the same odbcconf.exe parent-child spawning pattern occurring on other hosts?
  context: The same odbcconf.exe spawning the same child across multiple hosts points to a pushed or scripted rollout
    rather than a one-off, and helps calibrate scope. A single occurrence is more likely targeted or a host-local
    misconfiguration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run odbcconf.exe at all?
  context: On most endpoints odbcconf.exe runs rarely or never outside of driver installation events. A host with zero
    or very low historical odbcconf.exe execution makes this invocation first-of-kind and raises the priority of the DLL
    and child-process review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run odbcconf.exe or perform ODBC driver configuration?
  context: Compare this user's current action against their historical behavior. A user who has never run odbcconf.exe
    or configured ODBC drivers is more suspicious than one who does so as part of their role. User role and typical
    toolset should align with database or driver administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith: \odbcconf.exe
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this odbcconf.exe parent-and-child combination historically routine on this host or environment-wide, or
    is the launch mechanism unusual?
  context: When the alert fires under a service principal, user identity does not attribute the behavior. The meaningful
    pivot is the launch mechanism — which parent spawned odbcconf.exe and whether that pairing is historically common. A
    new or rare parent for odbcconf.exe is the deviation worth chasing; a pairing that already accounts for thousands of
    prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of this alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or hands-on-keyboard activity spanning
    multiple endpoints. If the same user triggered similar proxy-execution or follow-on activity elsewhere, the scope of
    compromise may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same odbcconf.exe parent-and-child combination fire on other hosts in the same window, or is the
    activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — parent process plus odbcconf.exe and its child — fired on
    other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to the
    odbcconf.exe execution and what followed it. Look for reconnaissance, the staging of the loaded DLL, privilege
    escalation, or persistence mechanisms in the surrounding window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Proxy execution through a signed binary is often paired with an attempt to weaken protection first. This query
    surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch
    AMSI/ETW. Zero rows is a useful signal that protection looks healthy; kernel-level driver tampering and in-memory
    patches will not appear here. Populated rows shift the disposition toward operator preparation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    attack stages that preceded this proxy execution and help reconstruct the timeline. The sequence of alerts on a host
    often tells the larger story behind a single LOLBin invocation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
