name: Suspicious Shells Spawn by Java Utility Keytool
id: 9938ee11-a7fc-4edb-b31e-a88725533afe
description: |
  Detects the Java key-and-certificate management utility keytool.exe spawning a command interpreter,
  script host, or living-off-the-land binary (cmd.exe, powershell.exe, schtasks.exe, certutil.exe, whoami.exe,
  reg.exe, wmic.exe, mshta.exe, rundll32.exe, and similar). keytool is normally invoked by a Java application
  to manage keystores and should never spawn a shell or system tool. This parent-child pairing is a known
  outcome of argument injection against a Java web application (for example the CVE-2021-40539 ManageEngine
  ADSelfService Plus chain), where unsanitized parameters are concatenated into a keytool command line and a
  loaded class executes operator-controlled commands. The investigation should confirm which child binary fired,
  decode what it did, trace what started keytool (the exploited application), and determine whether the host
  shows follow-on persistence or recon. Because the exploited application is often run with elevated directory
  permissions, treat a confirmed match as a potential high-privilege foothold.
type: detection
detection_id: 90fb5e62-ca1f-4e22-b42e-cc521874c938
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does keytool.exe appear as the parent, and which command interpreter or system binary did it spawn?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when a process
    whose parent path ends in keytool.exe starts one of a list of interpreters and tool binaries (cmd.exe, powershell.exe,
    schtasks.exe, certutil.exe, whoami.exe, reg.exe, wmic.exe, mshta.exe, rundll32.exe, wscript.exe, cscript.exe,
    and similar). Note which specific child binary fired, because it determines which downstream questions about
    payload decoding, recon, persistence, or registry changes carry the most weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this host expected to run a Java application that invokes keytool, and is this user expected to drive it?
  context: keytool is bundled with the Java runtime and is normally invoked by a Java application managing its own
    keystore. A host running a Java-based web application (self-service password reset, SSO, app server) may invoke
    keytool routinely, but it should never spawn a shell. Knowing the host function and whether the running account
    is a service identity or an interactive user is often the fastest way to separate routine keystore management
    from exploitation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:initial_access.delivery_vector
  question: What started keytool.exe, and was it driven by a web request to a Java application?
  context: Argument injection into keytool is reached through a public-facing Java application that concatenates
    unsanitized request parameters into the keytool command line. Identifying what spawned keytool (the application
    server process and its command line) points to the delivery vector. If the grandparent is a Java or web-server
    process, the originating HTTP request and source address should be recovered from the application's access
    logs to enable perimeter blocking and to find other targeted requests.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:initial_access.application_patch_status
  question: Is the Java application that hosts keytool up to date with security patches?
  context: keytool argument injection is reached by exploiting the hosting Java application; CVE-2021-40539 in a
    self-service password-reset product is one documented path. An unpatched application version confirms exploitation
    was possible and indicates whether other similarly unpatched systems are at risk. Patch status also distinguishes
    exploitation of a known vulnerability from a previously unseen one. Identify the application and its version,
    then check it against current advisories.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- source: template:cue_parent_process.mechanism_decode
  question: What was the full keytool command line, and does it carry injected provider or class-loading arguments?
  context: The keytool invocation itself often reveals the injection. A normal keytool command manages a keystore
    (-genkey, -keystore, -alias). An exploited one carries extra arguments such as -providerclass and -providerpath
    pointing at an operator-supplied directory, which causes keytool to load and execute an arbitrary Java class.
    Recovering keytool's own command line shows whether unexpected provider or class-loading flags were appended.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the spawned child binary do? Decode its full command line.
  context: The child process is where the operator's action runs. Decode every flag, parameter, encoded blob, file
    path, and URL in its command line to determine the operation - a download cradle, a recon command, a persistence
    write, or relocation of a dropped web shell into a web-accessible directory. Because cmd.exe and powershell.exe
    are high-volume, the query is scoped to the exact triggering process so the result reflects only the alerting
    invocation rather than every execution of that interpreter on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: What started keytool, and is that grandparent chain consistent with normal Java keystore management?
  context: The parent-child relationship is the core signal. Tracing keytool's own origin reveals whether the chain
    is legitimate (a Java application performing scheduled keystore maintenance) or driven by exploitation (an
    internet-facing application server invoking keytool with operator-controlled arguments in response to a crafted
    request). A grandparent that is a web or application server process reaching shell execution through keytool
    is the pattern of interest.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did this same keytool instance spawn?
  context: If exploitation reached command execution through keytool once, the same keytool instance may have spawned
    additional children in sequence - recon, download, persistence. Examining the siblings of the alerting process,
    scoped to the exact parent instance, reveals the full set of actions launched through this execution chain rather
    than only the one that triggered the alert.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Has keytool.exe ever spawned this child binary on this host before?
  context: keytool managing a keystore does not start shells or system tools, so a historical baseline of this
    specific parent-child pairing distinguishes a novel exploitation event from any routine pattern. Zero or very
    low historical counts for keytool spawning this interpreter or tool indicate a first-time spawning relationship
    worth treating as anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does the account that owns this process normally run this child binary anywhere in the environment?
  context: Compare the running account's current action against its historical behavior. An account that has never
    launched this interpreter or tool is more suspicious than one that does so routinely. When the alert fires under
    a Java application's service account, this baseline shows whether that identity has any history of spawning the
    binary - useful but weaker when the identity is a non-interactive service principal.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the keytool-to-child-binary pairing historically routine on this host or environment-wide, or is keytool a new parent for it?
  context: When the alert fires under a service account, user identity does not attribute behavior; the meaningful
    pivot is the launch mechanism. This checks how often keytool has been the parent of this child binary across
    history. A pairing that already accounts for many prior events is automation; keytool appearing as a new or
    rare parent for this binary is the deviation worth chasing. Host concentration in the result points to a host-local
    trigger rather than fleet-wide automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this account do across the environment around the time of the alert?
  context: Tracking the account's activity across all hosts in a tight window around the alert reveals lateral
    movement or activity spanning multiple endpoints. If the same account drove similar activity elsewhere at the
    same time, the scope of the compromise may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same keytool-to-child-binary pairing fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service account, asking what else the identity did across the network returns service-telemetry
    noise. The meaningful question is whether the same launch mechanism - keytool spawning this binary - appeared
    on other hosts in the alert window. Multiple hosts in the same window point to a coordinated or pushed action;
    a single host points to a host-local trigger such as exploitation of one application instance.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:initial_access.campaign_scope
  question: Did this same detection fire on other hosts, indicating multiple exploited application instances?
  context: Exploitation of a public-facing application rarely affects a single host. Correlating this same detection
    across the environment reveals how many systems showed keytool spawning a shell and identifies additional
    application instances that may have been exploited and need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_host_context.clustering
  question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event
    and what followed - reconnaissance, credential access, or persistence installation that accompanies hands-on
    activity following initial access. Aggregating by binary and parent collapses repetitive service noise while
    novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - exploitation attempts, reconnaissance, or defense tampering - may
    reveal the attack stages that preceded keytool reaching command execution and help reconstruct the timeline.
    A sequence of alerts on this host tells the broader story of how the foothold was established.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host after the alert?
  context: After reaching command execution through an exploited application, operators commonly establish persistence
    so the foothold survives a service restart or patch. This surfaces executions of scheduled-task, service,
    registry, BITS, and WMI tooling on the host within a few hours of the alert. Multiple persistence installations
    in the same window indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
