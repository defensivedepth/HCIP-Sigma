      reason: "user_actor pair — non-deduplicable; both emitted (subject-identity pivot and launch-mechanism substitute)"
      kept: cue_user_actor.baseline and cue_user_actor.baseline_svc
    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc pair
      reason: "user_actor pair — non-deduplicable; both emitted (subject-identity pivot and launch-mechanism substitute)"
      kept: cue_user_actor.clustering and cue_user_actor.clustering_svc
  skipped_templates:
    - template: universal.endpoint_protection_health
      reason: "recommended-only generic host-tamper sweep; this rule fires on a parent-child exploitation signal, not on payload execution or credential access where tamper-as-precursor is the live question. Prior-alert context is already carried by cue_host_context.precursor, and the slot is better spent on the keytool/exploitation-specific and persistence questions central to this rule."
    - template: powershell.* (powershell technique set)
      reason: "powershell.exe is one of 24 possible child binaries in the OR detection; the specific child that fired is unknown at generation time. Applying the full powershell set (encoded_command_decode, script_block_logging, security_bypass) would assume powershell.exe fired. The child decode question covers powershell payloads when that branch fires; encoded-command decoding is directed in the child-decode context."
    - template: discovery_recon.* (discovery_recon technique set)
      reason: "whoami.exe/query.exe are among 24 possible children; recon-specific questions assume a recon binary fired. cue_host_context.clustering surfaces co-occurring recon when present, without assuming the recon branch fired."
    - template: registry.* (registry technique set)
      reason: "reg.exe is one of 24 possible children; registry_key_context/related_modifications/persistence_check assume reg.exe fired. The child decode question covers registry operations when the reg.exe branch fires."
    - template: scheduled_task.* (scheduled_task technique set)
      reason: "schtasks.exe is one of 24 possible children; task_configuration/trigger/still_present assume schtasks.exe fired. The child decode question covers task creation when that branch fires; persistence_scope.process_based_persistence already surfaces schtasks usage on the host generically."
    - template: download_tool.* / obfuscation.* technique sets
      reason: "certutil.exe is one of 24 possible children; download/decode-specific questions assume certutil.exe fired. The child decode question already directs decoding of certutil -decode and download cradles when that branch fires."
    - template: organizational_context.* (change_ticket, human_recall, timing_alignment, procedural_consistency)
      reason: "recommended-only; this is a server-side exploitation signal where the disposition turns on the exploitation chain and patch status, not on change-management approval. host_user_context and initial_access questions cover the legitimacy judgment."
    - template: persistence_scope.file_based_persistence
      reason: "recommended-only; process-based persistence sweep retained as the primary follow-on persistence check. File-drop persistence overlaps and would add a slot without proportionate value for a parent-child exploitation rule whose primary follow-on is command execution."
  reflection_overrides: []
