      kept: cue_host_context.clustering
    - dropped: cue_parent_process.scope
      reason: "enterprise-wide spread of the keytool parent-child pair is covered by cue_user_actor.clustering_svc and initial_access.campaign_scope"
      kept: cue_user_actor.clustering_svc
    - dropped: cue_process_tool.baseline
      reason: "host-level baseline of the child binary overlaps cue_parent_process.baseline (keytool-to-child pairing), which is the more specific discriminator for this rule"
      kept: cue_parent_process.baseline
