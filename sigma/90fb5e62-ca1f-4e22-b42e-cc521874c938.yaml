      reason: "parent_process is primary cue (ParentImage in detection) — parent_child.parent_process_legitimacy and cue_parent_process.mechanism_decode cover the parent chain more specifically; per hint, process_tool process_chain dropped"
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.follow_on
      reason: "subsumed by parent_child.sibling_processes, which scopes to the exact ParentProcessGuid instance rather than the parent binary name — more precise for the same investigative intent"
