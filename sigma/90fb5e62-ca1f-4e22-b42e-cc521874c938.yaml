      notes: >-
        Hint 'cmd.exe too common for Image-based scoping — use CommandLine
        patterns for mechanism_decode' acted on. The default
        cue_process_tool.mechanism_decode query scopes host.name + Image|endswith,
        which is noisy for cmd.exe/powershell.exe (both in the child OR-list).
