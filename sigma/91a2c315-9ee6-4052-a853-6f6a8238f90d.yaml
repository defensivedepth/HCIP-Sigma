name: Findstr GPP Passwords
id: 8fe1452c-4165-4c2c-bddf-af51ac285280
description: |
  Detects find.exe or findstr.exe (by image name or original file name) run with a command line that contains all of cpassword, \sysvol\, and .xml. This pattern reflects searching Group Policy Preference XML files staged in the domain SYSVOL share for the cpassword attribute, an encrypted local-account password whose AES key is publicly known and trivially reversible with offline tooling. Legitimate hits are rare and usually tied to deliberate hardening reviews; in an intrusion this is credential access against any account managed through Group Policy Preferences. Determine who ran the search, whether the cpassword value was actually read and decrypted, and which accounts that password protects.
type: detection
detection_id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did find.exe or findstr.exe run with a command line containing cpassword, \sysvol\, and .xml together?
  context: Confirm the alert is a true positive by reviewing the exact command line and the image / original file name against the rule's criteria. The rule fires only when the binary resolves to find.exe or findstr.exe (by Image or OriginalFileName) AND the command line contains all three substrings. Verify all three are present and that the path points at a real SYSVOL Group Policy Preferences file rather than an unrelated string match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to search SYSVOL Group Policy Preference files for credentials?
  context: Legitimate use is almost always a deliberate hardening review run by an administrator or auditor from an admin workstation or domain controller. A standard user, a service account, or a host with no GPP-audit role searching SYSVOL for cpassword is the deviation worth chasing. Knowing whether the role and host function fit the behavior is often the fastest true-positive / routine split.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Which Group Policy Preference file and credential field did the search target?
  context: Group Policy Preferences can embed an encrypted cpassword in several XML files (Groups.xml for local accounts, Services.xml, ScheduledTasks.xml, DataSources.xml, Printers.xml, Drives.xml). Read the full command line to identify which file path and policy GUID under \sysvol\ was searched. The targeted file determines what the recovered password protects -- a local administrator account, a service logon, or a scheduled-task run-as identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1552.006.sysvol_share_access
  question: Did this host access the domain SYSVOL file share around the time of the alert?
  context: A command-line grep for cpassword presumes the GPP XML is reachable, usually over the SYSVOL network share on a domain controller. Detailed file-share auditing records remote access to the SYSVOL share and the relative path requested. Correlating share access to the policy XML with the process that searched it confirms the file was actually read rather than only referenced on a local copy. If file-share auditing is not collected in this environment, treat zero results as a visibility gap rather than evidence the file was not opened.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: security
      product: windows
    detection:
      selection:
        EventID: 5145
        host.name|expand: '%hostname%'
        ShareName|contains: SYSVOL
      filter_ext:
        RelativeTargetName|contains: .xml
      condition: selection and filter_ext
    fields:
      - SubjectUserName
      - RelativeTargetName
      - AccessMask
      - IpAddress
- source: template:universal.evidence_preservation
  question: Is the targeted Group Policy Preference XML still on disk for analysis?
  context: The GPP XML referenced in the command line holds the cpassword value and the userName attribute it protects. If the file is still present, preserve it so the cpassword can be confirmed and the affected account identified. The file path is derived from the alerting command line; scope the lookup to that path.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this find/findstr search, and is that parent chain expected?
  context: The parent reveals how the search was launched. An interactive console (cmd.exe, powershell.exe, explorer.exe) under an administrator points toward hands-on activity; a script host, remote-execution service, or office application as parent points toward automated or delivered tooling. Walk up the chain to see what spawned the parent and what else it launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1552.006.decryption_followon
  question: Did a decryption or scripting tool run on this host shortly after the search?
  context: Finding the cpassword is only the first step; the value is AES-encrypted and must be decoded to be usable. Reading or piping the XML through powershell, python, or a purpose-built GPP decryptor turns the recovered string into a plaintext password. Look for powershell.exe, python, certutil, or other interpreters running close to the search, ideally referencing the same XML path, base64, or AES decryption.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      decode:
        CommandLine|contains:
          - cpassword
          - gpp
          - sysvol
          - FromBase64String
          - AesCryptoServiceProvider
      condition: selection and decode
    fields:
      - Image
      - CommandLine
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which account does the recovered GPP password protect, and does it have elevated privileges?
  context: A GPP cpassword maps to the userName attribute in the same XML -- often a local administrator pushed to many machines, a service account, or a scheduled-task identity. Because the same policy applies fleet-wide, one decrypted cpassword can grant access to every host the GPP targets. Cross-reference that account against directory group memberships; broad local-admin or service reuse requires escalation and a credential rotation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this cpassword/SYSVOL search pattern, what parents and users drove it, and does the current alert fit?
  context: Even legitimate hardening reviews leave a footprint. The query mirrors the rule's selection scoped to this host, so the parent/user distribution reflects how this specific cpassword-search pattern has run here before -- not generic find/findstr usage. A new parent, an unexpected user, or a first-ever appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|contains|all:
        - cpassword
        - \sysvol\
        - .xml
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|contains|all:
        - cpassword
        - \sysvol\
        - .xml
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|contains|all:
        - cpassword
        - \sysvol\
        - .xml
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the SYSVOL search was an isolated lookup or part of broader credential gathering. If the same user triggered similar activity on multiple endpoints, the scope of compromise may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|contains|all:
        - cpassword
        - \sysvol\
        - .xml
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining surrounding activity reveals what led to the search and what followed -- reconnaissance, share enumeration, decryption tooling, or staging. Novel parent-child pairs at low counts are what to scan for against the high-count background of routine processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- reconnaissance, share enumeration, defense tampering, or other credential access -- may reveal the attack stages that preceded the SYSVOL search and help reconstruct the timeline that led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
