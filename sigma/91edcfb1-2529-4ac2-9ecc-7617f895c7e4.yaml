name: Weak or Abused Passwords In CLI
id: cefdba19-05ab-4b37-854f-b00f0f6542ee
description: |
  Detects weak or commonly abused passwords passed inline on the command line, where the password string itself is the
  detection criteria. This pattern most often appears when an account is created or its password is set non-interactively
  (for example, net user / net1 user with a password argument), and the same weak strings recur across hands-on-keyboard
  intrusions because operators reuse throwaway credentials. Legitimate but discouraged uses include scripted account setup
  and lab automation; the investigation should determine which process supplied the password, whether an account was created
  or modified, who ran it, and whether the surrounding activity looks like routine administration or operator tradecraft.
type: detection
detection_id: 91edcfb1-2529-4ac2-9ecc-7617f895c7e4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain one of the weak or abused password strings this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the full command line and
    identifying which of the watched password strings appears in it. Note the surrounding command — whether the password was
    an argument to an account-creation or password-set command versus an unrelated string that happened to match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to set credentials or create accounts from the command line?
  context: Legitimate administrative activity and provisioning scripts can pass passwords inline. Knowing whether the user
    role and host function are consistent with command-line account management is often the fastest way to separate routine
    automation from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What was the full command, and what operation supplied this password inline?
  context: The full command line reveals what the password was used for. Determine the executing binary and subcommand —
    whether this is account creation or modification (for example net user, net1 user, or a localgroup add), a service or
    scheduled-task install carrying a credential, or a tool authenticating to a remote resource. Inline passwords on account
    commands are a common way operators stand up a foothold account quickly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the command was invoked. Interactive administration typically descends from
    explorer.exe or a console launched by a logged-on admin. A parent such as a script host, a remote-execution service, or
    an unexpected application can indicate scripted deployment or operator activity rather than a person at the keyboard.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What other processes did this same parent spawn around the alert?
  context: Sibling processes launched by the same parent reveal the broader operation. Inline weak-password use often sits
    next to account-manipulation, discovery, or persistence commands; finding those alongside this event helps distinguish a
    one-off provisioning step from a multi-stage operator sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this weak-password command-line pattern been seen on this host before?
  context: A host that has never produced one of these password strings on the command line is more notable than one where
    scripted provisioning routinely does so. Zero or very low historical counts point to first-time or rare use; recurring
    counts suggest an established (if discouraged) automation pattern worth confirming with the host owner.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even discouraged automation has a normal shape. The query mirrors the rule's selection scoped to this host, so the
    resulting parent and user distribution reflects how this weak-password pattern has historically run here. A new parent
    process, an unexpected account, or an unusual command shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run command-line account or credential operations?
  context: Compare this user's current action against their historical behavior. A user who has never passed credentials on
    the command line is more notable than one who does so as part of a known administrative or provisioning role. User role
    and typical toolset should align with command-line account management.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-pattern combination historically routine on this host, or is the launching process unusual
    for this kind of command?
  context: When the alert fires under a service or computer account, user identity does not attribute behavior, so the
    meaningful pivot is the launch mechanism — which parent process produced a command line carrying one of these password
    strings, and whether that pairing is historically common. A new or rare parent for this pattern is the deviation worth
    chasing; a parent that already accounts for many prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
      - ParentImage
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or repeated provisioning across multiple
    endpoints. If the same user supplied weak credentials or ran related commands on several hosts in a short window, the
    scope of the activity may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same weak-password pattern fire on other hosts in the same window — a coordinated rollout, or activity
    isolated to this host?
  context: Under a service or computer account, asking what else the user did network-wide returns agent-telemetry noise. The
    meaningful question is whether the same command-line pattern appeared on other hosts in the alert window. Multiple hosts
    in the same window points to scripted or pushed deployment; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Operations rarely involve a single command. Activity surrounding the inline-password event may reveal
    reconnaissance, account enumeration, privilege changes, persistence installation, or data staging that frames whether
    this is routine provisioning or part of a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages
    that preceded the inline-password use and help reconstruct the timeline. Account creation with a weak credential is often
    a mid-operation foothold step rather than the first action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this weak-password pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this weak-password
    pattern. Many hosts firing the same pattern points to scripted deployment or a shared provisioning template; one host or a
    small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      condition: selection
    fields:
    - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes hands-on-keyboard actions like foothold-account creation. The query surfaces direct
    attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows
    is a useful health signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift
    the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
