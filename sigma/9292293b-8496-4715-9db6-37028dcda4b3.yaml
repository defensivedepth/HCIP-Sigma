name: Replace.exe Usage
id: 9a0f8e7e-ae8a-48ca-8162-5ed43d616c5c
description: |
  Detects execution of the signed Windows binary replace.exe with the -a (add) switch, which copies
  same-named or new files from a source location into a destination directory. The rule fires when the
  process Image ends in replace.exe AND the command line contains the -a flag. replace.exe is a legacy
  living-off-the-land utility that can substitute for copy/xcopy/robocopy to seed or overwrite files in
  protected directories, and with /a it can pull files from a remote or user-writable source as a file
  transfer alternative when conventional copy tooling is restricted. Investigate the source and
  destination paths in the command line, whether the file was actually written, what spawned replace.exe,
  and whether this user, host, and parent are expected to run it.
type: detection
detection_id: 9292293b-8496-4715-9db6-37028dcda4b3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — replace.exe run with the -a switch?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact command line and process details. The rule fires only when the binary ends in replace.exe AND
    the command line contains -a (the add switch). Confirm both the binary and the flag are present, and
    read the source and destination paths in the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run replace.exe to copy or stage files?
  context: Legitimate administrative activity can trigger this detection. replace.exe is a legacy utility
    that modern workflows rarely use, since copy, xcopy, and robocopy cover the same ground. Knowing
    whether the user role and host function involve hands-on file staging or scripted deployment is often
    the fastest path to distinguishing routine operations from operator-controlled file transfer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did replace.exe do? Decode the source and destination paths and the switches in
    the command line.
  context: The full command line reveals the file-staging operation. Identify the source argument (a local
    path, a user-writable directory, or a remote share such as \\host\share) and the destination directory,
    which has no rename capability. Note the switches present alongside -a, and whether the destination
    points at a protected tree like System32 or Program Files versus an ordinary user directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:lolbin.renamed_binary_check
  question: Was replace.exe executed from an expected System32 or SysWOW64 path?
  context: replace.exe ships only at %SystemRoot%\System32\replace.exe and %SystemRoot%\SysWOW64\replace.exe.
    A copy running from a user temp directory, Downloads, or another non-standard path may have been relocated
    or renamed to evade path-based allowlists. Compare the Image path and OriginalFileName against the
    expected system locations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.process_chain
  question: What process spawned replace.exe and is that parent chain expected?
  context: The parent process reveals how replace.exe was invoked. Interactive use under explorer.exe or a
    deployment script under a known automation parent differs from invocation by mshta.exe, wscript.exe,
    cmd.exe spawned from an Office application, or another unusual parent that can indicate scripted abuse.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1105.parent_process_analysis
  question: Is the parent that launched replace.exe a known software updater or deployment agent on this host?
  context: Ingress-tool-transfer tuning treats known good updaters and deployment agents as expected parents
    for file-copy utilities. A parent such as a packaging or update service that historically drives this
    activity points toward routine automation, while a parent that has never launched this binary is the
    deviation worth chasing. This view counts how often each parent has spawned replace.exe on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
- source: template:universal.evidence_preservation
  question: Were the files written by replace.exe created on disk, and are they still present for analysis?
  context: replace.exe with -a writes new files into the destination directory. If the file paths from the
    command line still exist on disk, that enables hash lookups, sandbox submission, or content review. The
    destination directory has no rename, so the written file names match the source names.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1105.file_path_analysis
  question: Did replace.exe write into an uncommon or protected destination directory?
  context: File-path tuning for ingress tool transfer focuses on uncommon drop locations such as
    C:\Users\Public, %TEMP%, %ProgramData%, and writes into protected trees like System32 or Program Files.
    A write by replace.exe into one of these directories is a stronger signal than a write into an ordinary
    working directory. This view shows every file replace.exe created on the host so the destination paths
    can be assessed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the destination directory around the time of the alert?
  context: A file-staging operation often involves multiple files written to the same directory, or the
    copied file triggers further writes such as extraction or additional drops. Examining directory-level
    file activity, excluding the known written file, reveals the broader scope of the staging operation.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      filter_self:
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection and not filter_self
    fields:
      - TargetFilename
      - Image
- source: attack:T1105.network_connection
  question: Did replace.exe open a network connection to a remote source around the time of the alert?
  context: When the source argument is a remote share or UNC path, replace.exe pulls the file across the
    network, which makes it a file-transfer alternative when conventional download tooling is restricted.
    A network connection from replace.exe to an external or unfamiliar internal destination indicates the
    source was remote rather than a local copy. Note the destination and whether it is internal or external.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:download_tool.payload_analysis
  question: Can you retrieve and analyze the files replace.exe staged from a safe environment?
  context: If the staged file is still on disk, submitting its hash to threat intelligence services or
    detonating it in a sandbox reveals whether it is a known malicious payload, a legitimate tool, or
    something novel that requires deeper analysis. The destination file names match the source names because
    replace cannot rename.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: template:cue_process_tool.follow_on
  question: What child processes did replace.exe spawn afterward?
  context: replace.exe is a file-copy utility and does not normally spawn children. Any process spawned by
    it, particularly cmd.exe, powershell.exe, or another interpreter, points to a staged payload being
    executed or to scripted post-staging activity worth tracing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were any other download or file-transfer LOLBins used on this host recently?
  context: Operators who reach for one living-off-the-land transfer utility often use several. If replace.exe
    staged a file, check whether certutil, bitsadmin, curl, esentutl, expand, extrac32, or makecab were also
    used to download or unpack files. Multiple transfer LOLBins performing the same objective strengthens the
    case for malicious file delivery.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the replace.exe -a pattern over the past 90 days, and what
    command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the resulting
    count reflects the rule's specific firing pattern rather than generic use of the binary. The command-line
    projection lets the typical invocation patterns be compared against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \replace.exe
      argument:
        CommandLine|contains|windash: -a
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and argument) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \replace.exe
      argument:
        CommandLine|contains|windash: -a
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and argument) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \replace.exe
      argument:
        CommandLine|contains|windash: -a
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and argument) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the stages that preceded this file-staging event and
    help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
