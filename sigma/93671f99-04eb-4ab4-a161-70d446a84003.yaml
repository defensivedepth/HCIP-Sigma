name: Capture Credentials with Rpcping.exe
id: 095645d8-230f-4ae3-b1b9-e7f9c42aeb6e
description: |
  Detects rpcping.exe, a built-in RPC connectivity diagnostic, invoked in a way that coerces NTLM authentication
  from the local security context out to an operator-chosen server. The rule fires when rpcping runs with a target
  server flag (-s) AND EITHER an explicit NTLM security-package selection (-u with NTLM) OR a named-pipe transport
  (-t with ncacn_np). The legitimate use is verifying RPC reachability for Exchange and similar services; the
  abusive use points rpcping at an attacker-controlled listener so the captured challenge/response can be relayed
  or cracked offline. Investigation should confirm the target server, the security package and transport used, who
  and what launched the binary, and whether follow-on authentication or lateral movement occurred.
type: detection
detection_id: 93671f99-04eb-4ab4-a161-70d446a84003
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this rpcping.exe command line match what this rule detects — a target server (-s) flag together with
    either an NTLM security package (-u NTLM) or a named-pipe transport (-t ncacn_np)?
  context: Confirm the alert is a true positive before investing time. The rule requires rpcping.exe (by image name or
    original file name) with a -s target-server flag, and then EITHER -u plus NTLM OR -t plus ncacn_np. Note which of
    the two branches fired — an explicit NTLM package selection and a named-pipe transport coerce authentication by
    different means, and that distinction shapes which downstream evidence matters. Check the server passed to -s — a
    target outside the known RPC and Exchange endpoint inventory points to credential coercion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run rpcping.exe against this target server?
  context: Rpcping is a diagnostic tool legitimately run by administrators and by Exchange-related tooling to verify RPC
    reachability. Knowing whether this user role and host function routinely test RPC connectivity — and whether the
    target server is a sanctioned internal endpoint — is often the fastest way to separate maintenance from credential
    coercion. A workstation user or service account pointing rpcping at an unfamiliar host rarely has a benign explanation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: What authentication did this rpcping invocation coerce — which target server, security package, transport,
    and identity were specified on the command line?
  context: Rpcping authenticates with the current security context unless an alternate identity (/I) is supplied, so the
    captured credential is whatever account ran the process or the computer account. Decode the full command line. The
    server passed to -s is the listener that receives the challenge/response; -u selects the security package (NTLM
    coerces the NTLM challenge outbound); -t ncacn_np forces named-pipe transport, which leaks the hash over a pipe
    rather than TCP 445; -a sets the authentication level. The target and package together determine which account is
    exposed and whether the
    captured material can be relayed to a privileged resource.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.network_authentication_egress
  question: Did this host make an outbound RPC or named-pipe authentication connection to the target server around the
    time rpcping ran?
  context: The credential leak is realized over the network — rpcping drives an authenticated RPC call to the -s target,
    sending the NTLM challenge/response to whatever listens there. Correlate the process event with an outbound connection
    from this host to the target address. A connection to an internal Exchange or RPC endpoint is consistent with
    diagnostics; a connection to a workstation, an unmanaged host, or an external address points to a credential-capture
    listener. If the transport was named-pipe (ncacn_np), expect SMB or pipe traffic rather than a custom RPC port.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.process_chain
  question: What process spawned rpcping.exe and is that parent chain expected?
  context: The parent process reveals how rpcping was invoked. A diagnostic run typically descends from an interactive
    shell, a management console, or scheduled Exchange tooling. Parents such as script hosts, Office applications, or a
    remote-execution service suggest the invocation was driven by an operator or payload rather than routine
    administration, which raises the weight of the credential-coercion interpretation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run rpcping.exe?
  context: Rpcping is present on Windows but is rarely executed on most endpoints. Zero or very low historical counts
    indicate first-time or rare use, which strengthens the case that this is operator-driven rather than routine
    diagnostics. A host that runs it regularly (an Exchange server or an administrator's workstation) lowers the concern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's rpcping pattern, what parents and users normally drove that
    activity, and does the current alert fit that pattern?
  context: Even a diagnostic tool can be abused. The query mirrors the rule's selection structure scoped to this host, so
    the resulting parent/user distribution reflects how this specific coercion pattern (not generic rpcping usage) has run
    here before. A new parent process, an unexpected user account, or an unusual command-line shape is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main_img:
      - Image|endswith: \RpcPing.exe
      - OriginalFileName: \RpcPing.exe
      selection_main_flag:
        CommandLine|contains|windash: -s
      selection_cli_ntlm:
        CommandLine|contains|windash: -u
        CommandLine|contains: NTLM
      selection_cli_ncacn:
        CommandLine|contains|windash: -t
        CommandLine|contains: ncacn_np
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_main_* and 1 of selection_cli_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did rpcping.exe spawn afterward?
  context: A diagnostic run normally spawns nothing. Children of rpcping — command shells, script hosts, or other tooling —
    suggest the invocation was a stage in a larger operation rather than a standalone connectivity test, and reveal what
    the operator did with any captured material.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's rpcping pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    coercion pattern rather than generic rpcping usage. Many hosts firing the same pattern points to scripted deployment or
    sanctioned automation; one host or a small unrelated set points to manual operator activity. Use the host distribution
    and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main_img:
      - Image|endswith: \RpcPing.exe
      - OriginalFileName: \RpcPing.exe
      selection_main_flag:
        CommandLine|contains|windash: -s
      selection_cli_ntlm:
        CommandLine|contains|windash: -u
        CommandLine|contains: NTLM
      selection_cli_ncacn:
        CommandLine|contains|windash: -t
        CommandLine|contains: ncacn_np
      condition: all of selection_main_* and 1 of selection_cli_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run rpcping.exe or perform RPC connectivity testing?
  context: Compare this user's current action against their historical behavior. A user who has never run rpcping is more
    suspicious than one who tests RPC reachability regularly, and the user's role should align with diagnostic work. An
    account with no administrative or Exchange-related responsibilities running this binary is a meaningful deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and rpcping.exe combination historically routine on this host or across the environment, or is
    the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot
    is the launch mechanism. A parent process that has spawned rpcping thousands of times before is vendor or OS automation,
    while a new or rare parent for this binary is the deviation worth chasing. This reframes the baseline around how the
    process was launched rather than who owns the session.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the rpcping invocation was an isolated test or
    part of broader hands-on activity. If the same user triggered similar coercion or follow-on tooling on multiple
    endpoints, the scope of the credential-access attempt may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and rpcping.exe combination fire on other hosts in the same window — is this a coordinated
    automation rollout or activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — parent process plus rpcping — fired on other hosts in the
    alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the rpcping event reveals what led to it and what
    followed — reconnaissance, privilege escalation, persistence, or the use of any captured credentials. Aggregating by
    image and parent collapses repetitive agent noise while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or other credential-access activity —
    may reveal the stages that preceded the rpcping invocation and help reconstruct the timeline. Coercing NTLM is often a
    mid-operation step that follows initial access and precedes relay or lateral movement.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering frequently precedes hands-on credential access. The query surfaces direct attempts to disable AV/EDR
    services, flip protection flags, add broad exclusions, clear logs, or patch in-process scanning interfaces. Zero rows
    is a useful sign that protection looks healthy, though kernel-level driver tampering and in-memory patches will not
    appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Coerced NTLM authentication is typically captured to be relayed or cracked, then reused to access other systems.
    New logon events or outbound remote connections shortly after the rpcping invocation indicate active exploitation of
    the exposed credential. Look specifically for relay-style activity reaching privileged services and for new sessions on
    hosts the source account does not normally touch.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:credential_access.credential_exposure_assessment
  question: Which account is exposed by this coercion, and does it have elevated privileges?
  context: Rpcping authenticates with the running process's security context, so the exposed credential is the user or
    computer account that launched it. The severity depends on that account's privilege — a domain admin or a service
    account with broad access requires escalation, while a standard user may only need monitoring and a password reset.
    Cross-reference the account with directory group memberships to gauge what the captured material could unlock.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
