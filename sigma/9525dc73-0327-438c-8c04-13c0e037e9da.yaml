name: Regsvr32 Execution From Potential Suspicious Location
id: 72c8ea83-c21a-42e0-b37d-ac98b1b4702e
description: |
  Detects regsvr32.exe executing with a command line that references a DLL or scriptlet
  located in a user-writable or temporary directory (ProgramData, Temp, Users\Public,
  Windows\Temp, AppData\Local\Temp, AppData\Roaming). The rule fires when both the
  regsvr32 image/original-filename match AND the command line contains one of those path
  tokens. regsvr32.exe is a Microsoft-signed binary that can register/unregister DLLs and,
  via the /i and /u switches, execute scriptlet code (including from remote URLs), which
  makes it a signed-binary proxy-execution and application-control bypass primitive.
  Installers occasionally stage DLLs in TEMP or PROGRAMDATA, so the investigation should
  determine whether the loaded module and command line correspond to legitimate software
  setup or to attacker-staged code running through a trusted binary.
type: detection
detection_id: 9525dc73-0327-438c-8c04-13c0e037e9da
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show regsvr32 loading a DLL or scriptlet from a temporary or user-writable path?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process is regsvr32.exe (by image or original filename) AND the command line contains a path token under ProgramData, Temp, Users\Public, Windows\Temp, AppData\Local\Temp, or AppData\Roaming. Read the full command line and confirm which path token matched and what file is being referenced.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to register DLLs from temporary or user-writable directories?
  context: Legitimate software installation occasionally runs regsvr32 against DLLs staged in TEMP or PROGRAMDATA, but routine end-user activity rarely registers components out of AppData or Users\Public. Knowing whether the user role and host function involve software setup or developer workflows is often the fastest way to separate an installer from staged proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this regsvr32 invocation do? Decode the switches and the referenced file or URL.
  context: The full command line reveals the operation. Decode the switches present, especially /i (pass an installer argument, which can be a local path or an http/https URL) and /u (unregister, which still executes scriptlet registration code), and identify the referenced DLL, .sct/.ocx scriptlet, or URL. /s runs silent and /n suppresses DllRegisterServer. Note whether scrobj.dll or a remote reference appears, since that combination turns regsvr32 into a download-and-execute primitive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:lolbin.renamed_binary_check
  question: Was regsvr32.exe executed from its expected System32 or SysWOW64 path?
  context: regsvr32 normally lives in System32 or SysWOW64. A regsvr32.exe running from a user directory, or an OriginalFileName of REGSVR32.EXE on an image with a different name, indicates the binary was copied or renamed to evade path-based allowlists or to disguise the proxy-execution. Compare the on-disk Image path against OriginalFileName.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.process_chain
  question: What process spawned this regsvr32 instance and is that parent chain expected?
  context: The parent process reveals how regsvr32 was invoked. Legitimate registration is usually launched by explorer.exe, an installer, or services.exe. Parents such as mshta.exe, wscript.exe, cscript.exe, winword.exe, or a browser point toward script-driven or macro-driven invocation rather than software setup.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.010.module_load
  question: What DLL or scriptlet did regsvr32 load on this host, and was it signed and from a trusted path?
  context: Proxy execution through regsvr32 completes when it loads the referenced module or scriptlet. A module load from a temporary or user-writable directory, or an unsigned or untrusted DLL loaded shortly after the regsvr32 invocation, is the payload side of the technique. Compare the loaded module path against expected directories such as System32 and check its signing status.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \regsvr32.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- source: attack:T1218.010.network_connection
  question: Did regsvr32 make any outbound network connections around the time of the alert?
  context: regsvr32 is proxy-aware, TLS-aware, and follows redirects, so /i with an http/https argument turns it into an HTTP downloader that retrieves remote scriptlet code. An outbound connection from regsvr32.exe is unusual for legitimate local DLL registration and indicates the referenced payload may have been fetched from a remote host. Pivot any destination to the file or scriptlet that was loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \regsvr32.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.follow_on
  question: What child processes did this regsvr32 instance spawn afterward?
  context: Scriptlet code executed through regsvr32 frequently spawns follow-on processes. Children such as powershell.exe, cmd.exe, wscript.exe, cscript.exe, mshta.exe, or conhost.exe under regsvr32 indicate the proxy-executed code ran additional commands and mark the start of hands-on activity worth tracing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this regsvr32 pattern, what parents and users normally drive it, and does this alert fit?
  context: Even a signed binary used routinely can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here rather than generic regsvr32 usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|contains:
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this regsvr32 suspicious-path pattern over the past 90 days, and what command-line structures are typical?
  context: A regsvr32 suspicious-path pattern with no prior history on a host is more notable than one seen regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern rather than generic regsvr32 usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|contains:
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|contains:
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|contains:
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same account triggered related activity on multiple endpoints. If the same user drove similar proxy-execution activity elsewhere in the same window, the scope of the activity may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|contains:
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one signed-binary proxy often use several. If regsvr32 was used to run scriptlet code, check whether rundll32, mshta, msiexec, installutil, cmstp, or similar proxy-execution binaries also ran on the host. Finding multiple proxy-execution LOLBins performing the same objective strengthens the case for deliberate application-control bypass.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
