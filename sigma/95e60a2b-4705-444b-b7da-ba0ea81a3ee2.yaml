name: Remote Access Tool - Simple Help Execution
id: 1f3354bd-b2c0-48bd-b30b-8ab1abcf625b
description: |
  Detects execution of the SimpleHelp remote access agent, identified by a process whose Image path
  contains \JWrapper-Remote Access\ or \JWrapper-Remote Support\ and ends in \SimpleService.exe.
  SimpleHelp is legitimate remote-support software, so sanctioned IT use is the benign explanation;
  the same agent is also deployed by operators to maintain interactive remote control and persistence
  after an initial intrusion, frequently dropped to user-writable or ProgramData paths alongside other
  remote access tooling. Investigation should confirm the agent identity, establish whether the tool is
  approved and tied to a support session, trace how it arrived and what it persists as, identify the
  external endpoint it reaches, and determine what it spawned and how widely the same pattern is present.
type: detection
detection_id: 95e60a2b-4705-444b-b7da-ba0ea81a3ee2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this process match the SimpleHelp agent pattern this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when
    a process Image path contains \JWrapper-Remote Access\ or \JWrapper-Remote Support\ and the filename
    ends in SimpleService.exe. Review the alerting event and confirm the Image path matches both the
    JWrapper directory marker and the SimpleService.exe filename.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run SimpleHelp remote-support software?
  context: Legitimate remote-support activity can trigger this detection. Knowing whether the user role
    and host function are consistent with sanctioned remote access is often the fastest path to
    distinguishing approved IT use from an unauthorized or operator-deployed remote access agent. A
    service desk or jump host running the agent is routine; a standard user endpoint is less expected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did this SimpleHelp agent do at launch? Decode the full command line and working directory.
  context: The full command line reveals the specific action taken at launch — configuration files loaded,
    service mode flags, or connection parameters. Decode any flags, file paths, or arguments to understand
    what behavior they represent. This scopes to every execution of the agent on the host in the
    surrounding window, which surfaces the operation as a whole rather than only the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this agent and is that parent chain expected?
  context: The parent process reveals how the agent was invoked and under which user context. A managed
    installer, services.exe, or an interactive explorer.exe launch points to a deployment or a user
    starting the tool; script hosts, archive utilities, or another remote access session as the parent
    point to delivery by a loader or staging from a prior foothold rather than a sanctioned install.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:remote_access_tool.tool_authorization
  question: Is SimpleHelp on the organization's approved remote access software list?
  context: Organizations typically maintain a list of sanctioned remote-support tools for IT use. A remote
    access tool that is not on that list — even well-known commercial software — may represent shadow IT
    or operator-deployed persistence. SimpleHelp installs to JWrapper directories under ProgramData by
    default, so an install path alone does not confirm authorization; check it against the approved list
    regardless of the tool's reputation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a current helpdesk ticket or support session explaining this remote access?
  context: Legitimate remote access usage typically correlates with an active support ticket, a scheduled
    maintenance window, or a user request. If no support context exists for this session, the agent may
    have been installed for persistent access after an intrusion or by a user circumventing security
    controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint is this agent connecting to, and on what port?
  context: Remote access agents establish long-lived outbound connections to relay servers, vendor cloud
    infrastructure, or operator-controlled endpoints. The destination reveals whether the agent is
    reaching its vendor gateway or a custom and unusual endpoint, and the port matters because these tools
    can be configured to use non-standard high ports. An endpoint that is not vendor infrastructure is a
    strong pivot toward an unauthorized or operator-controlled deployment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1219.002.install_path
  question: How and when did the SimpleHelp agent files arrive on this host, and what wrote them?
  context: Remote access agents do not appear spontaneously — they are installed, downloaded, or copied by
    a parent process into a fixed directory tree. Tracing file-creation events under the JWrapper agent
    directories reveals the delivery mechanism and timing. A writer such as a download utility, an archive
    tool, or another remote access session points to operator staging rather than a managed deployment;
    the time gap between file drop and first execution helps bound when the agent was introduced.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
        - \JWrapper-Remote Access\
        - \JWrapper-Remote Support\
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1219.persistence
  question: Was a service or autorun created on this host that launches the SimpleHelp agent?
  context: Remote access tooling commonly persists by installing a Windows service or autorun entry so the
    agent survives reboots and logoffs. A service-install event referencing the JWrapper agent path or
    SimpleService binary confirms the agent is configured for persistent unattended access rather than a
    one-off interactive session. Review the install timing and the account that registered it against the
    support context for this host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        EventID: 7045
        ImagePath|contains:
        - JWrapper
        - SimpleService.exe
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - AccountName
- source: template:cue_process_tool.follow_on
  question: What child processes did this agent spawn afterward?
  context: An interactive remote session is visible in the children the agent parents. A remote-support
    agent that spawns command interpreters, script hosts, reconnaissance utilities, or download tools
    indicates hands-on-keyboard control or follow-on actions rather than passive availability for support.
    Examine the spawned processes and their command lines to determine whether the session is doing
    routine support work or staging further activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this pattern, what parents and users normally drive it,
    and does the current alert fit?
  context: Even sanctioned tools can be abused. This query mirrors the rule's selection structure scoped
    to this host, so the resulting parent/user distribution reflects how the rule's specific firing
    pattern — not generic agent usage — has historically run here. A new parent process, an unexpected
    user account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - \JWrapper-Remote Access\
        - \JWrapper-Remote Support\
        Image|endswith: \SimpleService.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic usage of the binary. Many hosts
    firing the same pattern points to scripted or vendor-managed deployment; a single host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - \JWrapper-Remote Access\
        - \JWrapper-Remote Support\
        Image|endswith: \SimpleService.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - \JWrapper-Remote Access\
        - \JWrapper-Remote Support\
        Image|endswith: \SimpleService.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - \JWrapper-Remote Access\
        - \JWrapper-Remote Support\
        Image|endswith: \SimpleService.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user drove similar activity on several hosts, the scope of the
    operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - \JWrapper-Remote Access\
        - \JWrapper-Remote Support\
        Image|endswith: \SimpleService.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context — what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, persistence, or additional tooling installed near the
    alert time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — exploitation of a
    public-facing service, defense tampering, reconnaissance, or credential access — may reveal the attack
    stages that preceded an unauthorized remote access deployment and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
