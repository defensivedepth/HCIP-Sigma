name: Potential Configuration And Service Reconnaissance Via Reg.EXE
id: baa9d458-5eea-49c9-99de-8b1662741ac0
description: |
  Detects reg.exe (matched by image name or original filename) run with the query verb against registry keys that hold autostart and service configuration — CurrentVersion\Windows, Winlogon, ShellServiceObjectDelayLoad, the CurrentVersion\Run and Policies\Explorer\Run autorun keys, and CurrentControlSet\Services. Reading these keys enumerates how the host starts programs and which services are configured, which is reconnaissance an operator performs to understand the environment, find existing persistence, or plan where to install their own. The same queries are run by legitimate troubleshooting and inventory tooling, so the investigation should decode exactly which keys were read, confirm what process and user ran reg, check whether the queries sit inside a burst of other discovery, and watch for follow-on modification of those same keys that would turn reconnaissance into persistence.
type: detection
detection_id: 970007b7-ce32-49d0-a4a4-fbef016950bd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- source: template:universal.verify_trigger_match
  question: Does this match the rule — reg.exe querying an autostart or service configuration key?
  context: Confirm the alert before investing time. The rule fires when the image (or original filename) is reg.exe and the command line contains "query" together with one of the autostart/service key paths (CurrentVersion\Windows, Winlogon, ShellServiceObjectDelayLoad, CurrentVersion\Run, Policies\Explorer\Run, or CurrentControlSet\Services). Read the full command line and identify exactly which key was queried — that determines whether the operator was enumerating autoruns, Winlogon hooks, or services.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: llm_generated
  question: Which registry key was queried, and what does reading it reveal?
  context: Decode the reg command line to identify the exact key and any value name. Querying CurrentVersion\Run or Policies\Explorer\Run enumerates autostart entries; Winlogon and ShellServiceObjectDelayLoad enumerate logon and shell hooks; CurrentControlSet\Services enumerates installed services and their configuration. The specific key tells you what the operator was looking for — existing persistence and autoruns to inventory, or a spot to plant their own — and whether the query was narrow (one value) or broad (the whole key).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run registry discovery commands?
  context: Administrators, help desk, and inventory tooling legitimately query autostart and service keys for troubleshooting. Standard users rarely run reg query against Run keys or the services hive by hand. Whether the account is interactive or a service principal also matters — a SYSTEM or computer-account context suddenly enumerating autoruns is more interesting than a known admin doing inventory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this reg query, and is that a normal pattern?
  context: A reg query launched from cmd.exe under an interactive shell or from an inventory script is routine. The same query spawned by wmiprvse.exe or wsmprovhost.exe points to remote execution, and a parent of winword.exe, mshta.exe, a script host, or a PowerShell cradle points to automated post-exploitation enumeration. The parent's command line tells you which case you are in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A lone reg query may be routine troubleshooting, but several discovery commands in quick succession — whoami, net user, nltest, systeminfo, tasklist, plus other reg queries — is the signature of post-compromise orientation. A surrounding burst raises the likelihood that this registry enumeration is one step in an intrusion rather than a one-off lookup.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\sc.exe'
          - '\wmic.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:registry.registry_related_modifications
  question: Were these autostart or service keys subsequently modified on this host?
  context: Reconnaissance of autorun and service keys often precedes installing persistence in the same keys. This surfaces reg add, delete, or import operations on the host that would write to or remove entries from these locations. A query of the Run key followed shortly by a reg add to it, or a services-hive query followed by a service modification, turns reading into action and is the strongest sign the enumeration was preparatory rather than diagnostic.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around this time?
  context: Enumerating autoruns and services is often a step toward establishing persistence. This surfaces persistence tool executions — schtasks, sc, reg, at, bitsadmin, wmic — clustered around the alert. Several persistence installations in the same window indicate the recon was preparatory and intentional rather than isolated troubleshooting, and identify footholds to remediate.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were other proxy-execution or download LOLBins used on this host recently?
  context: Operators who orient with one living-off-the-land binary usually use several. Beyond the recon set, look for the proxy-execution and download LOLBins — rundll32, regsvr32, mshta, certutil, bitsadmin — that move from enumeration to fetching and running a payload. Several of these in the same day on the same host strengthen the case that the registry recon was an early step rather than isolated administration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\cmstp.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was reg.exe executed from its expected System32 path, and is it the genuine signed binary?
  context: The genuine reg.exe is a signed Microsoft binary under System32 / SysWOW64. A copy running from a user temp directory, ProgramData, or another non-standard path — or one whose original filename is not reg.exe — suggests the binary was staged to dodge path-based allowlists, which raises the priority of an otherwise routine-looking query.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host queried these autostart and service keys with reg over the past 90 days, and what command structures are typical?
  context: A query of these autostart and service keys with no prior history on a host is more notable than one that recurs under a stable inventory or troubleshooting routine. This mirrors the rule's exact pattern scoped to this host, so the count reflects the rule's specific firing, and the command-line projection lets you compare the historical key targets against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_flag:
        CommandLine|contains: query
      selection_key:
        CommandLine|contains:
        - currentVersion\windows
        - winlogon\
        - currentVersion\shellServiceObjectDelayLoad
        - currentVersion\run
        - currentVersion\policies\explorer\run
        - currentcontrolset\services
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Registry reconnaissance early in an intrusion is sometimes preceded or followed by disabling protection. This surfaces direct attempts to disable AV/EDR services, flip Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the writing process and its signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_flag:
        CommandLine|contains: query
      selection_key:
        CommandLine|contains:
        - currentVersion\windows
        - winlogon\
        - currentVersion\shellServiceObjectDelayLoad
        - currentVersion\run
        - currentVersion\policies\explorer\run
        - currentcontrolset\services
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_flag:
        CommandLine|contains: query
      selection_key:
        CommandLine|contains:
        - currentVersion\windows
        - winlogon\
        - currentVersion\shellServiceObjectDelayLoad
        - currentVersion\run
        - currentVersion\policies\explorer\run
        - currentcontrolset\services
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user ran discovery or other tooling on other hosts in the same window, the scope is larger than a single machine. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_flag:
        CommandLine|contains: query
      selection_key:
        CommandLine|contains:
        - currentVersion\windows
        - winlogon\
        - currentVersion\shellServiceObjectDelayLoad
        - currentVersion\run
        - currentVersion\policies\explorer\run
        - currentcontrolset\services
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts queried these autostart and service keys with reg in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where these registry queries fired. Many hosts at once points to scripted inventory or vendor automation; one host or a small unrelated set points to manual operator activity. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_flag:
        CommandLine|contains: query
      selection_key:
        CommandLine|contains:
        - currentVersion\windows
        - winlogon\
        - currentVersion\shellServiceObjectDelayLoad
        - currentVersion\run
        - currentVersion\policies\explorer\run
        - currentcontrolset\services
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — initial access, credential access, or other reconnaissance — may reveal the intrusion stage this registry enumeration belongs to and help reconstruct the timeline. Discovery commands early in a timeline often mark the transition from initial access to hands-on activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
