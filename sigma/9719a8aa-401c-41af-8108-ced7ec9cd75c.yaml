name: Windows Defender Definition Files Removed
id: c9fac271-d735-44a1-95de-5f673ce2403d
description: |
  Detects the built-in Defender command-line tool MpCmdRun.exe (or a renamed copy with that OriginalFileName) running
  with both ' -RemoveDefinitions' and ' -All', which wipes the host's antivirus signature definitions and leaves
  real-time protection running blind until definitions are re-downloaded. Administrators and Defender's own update
  flow occasionally reset definitions, so the action is not malicious on its own, but adversaries strip definitions to
  blind the scanner immediately before dropping or executing a payload. Determine whether the invocation came from a
  routine update path or an operator, what ran on the host afterward, and whether other defense-tampering or persistence
  actions accompanied it.
type: detection
detection_id: 9719a8aa-401c-41af-8108-ced7ec9cd75c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — MpCmdRun.exe run with -RemoveDefinitions and -All?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the image
    ends in MpCmdRun.exe (or carries that OriginalFileName) AND the command line contains both ' -RemoveDefinitions' and
    ' -All'. Confirm both arguments are present on the same invocation rather than inferred from separate events.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to reset or remove Defender antivirus definitions from the command line?
  context: Legitimate definition resets are usually driven by the Defender update service or a documented maintenance
    routine, not by an interactive operator. Knowing whether this account and host function normally perform Defender
    maintenance is often the fastest way to separate a routine reset from deliberate tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: What exactly did this MpCmdRun.exe invocation remove, and did it target all definitions or a scoped subset?
  context: Re-read the full command line of the triggering event. ' -RemoveDefinitions -All' removes the complete signature
    set, leaving the scanner unable to match known malware until definitions are restored. Note any additional switches
    (for example a dynamic-signature scope) that change how much protection was actually stripped.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Have Defender definitions been re-downloaded since this ran, or is the host still without signatures?
  context: Removing definitions can be temporary — the update flow may pull them back within minutes — or it can leave the
    host blind for an extended period. Confirm the current signature version and last-update time on the host. If definitions
    are still missing, restoring them is the immediate remediation before deeper investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this MpCmdRun.exe invocation, and is that parent chain expected?
  context: The parent reveals how the command was launched. The Defender update flow and scheduled maintenance run
    MpCmdRun.exe from predictable service parents. An interactive shell, a script host, or an Office application as the
    parent points toward an operator or a malicious launcher rather than the platform's own update path.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_registry_key.tamper_state
  question: Were Defender policy or service registry values changed on this host around the time definitions were removed?
  context: Definition removal often runs alongside registry-level tampering that disables real-time monitoring, sets
    exclusions, or turns off the Defender service entirely. Registry modifications under the Windows Defender policy and
    service keys in the same window indicate the removal was part of a broader effort to neutralize the scanner rather than
    an isolated update reset. If registry modification events are not collected in this environment, treat zero results as
    a visibility gap rather than evidence nothing changed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_defender_keys:
        TargetObject|contains:
          - '\Microsoft\Windows Defender\'
          - '\Microsoft\Windows Defender Security Center\'
          - '\Services\WinDefend\'
          - '\Services\WdNisSvc\'
          - '\Services\Sense\'
      condition: selection and selection_defender_keys
    fields:
      - TargetObject
      - Details
      - Image
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host beyond the definition removal?
  context: Operators who strip one control often disable several — stopping the Defender service, clearing event logs, or
    deleting shadow copies — to maximize the window of reduced visibility. Multiple tampering events from the same user or
    parent process in the same window indicate a coordinated effort rather than an isolated maintenance reset.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the definitions were removed?
  context: Defenses are stripped for a reason — to execute a payload, dump credentials, or take actions that signature
    matching would otherwise block. Examining process activity in the window immediately after the removal reveals what the
    tampering was meant to enable. Correlate this with network connections and file writes during the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this definition-removal pattern, what parents and users drove it, and does
    the current alert fit?
  context: The query mirrors the rule's selection — MpCmdRun.exe with ' -RemoveDefinitions' and ' -All' — scoped to this
    host. The resulting parent and user distribution reflects how this specific pattern has historically run here, not
    generic MpCmdRun.exe usage. A new parent process, an unexpected user account, or a first-ever occurrence is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MpCmdRun.exe
      - OriginalFileName: MpCmdRun.exe
      selection_cli:
        CommandLine|contains|all:
        - ' -RemoveDefinitions'
        - ' -All'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MpCmdRun.exe
      - OriginalFileName: MpCmdRun.exe
      selection_cli:
        CommandLine|contains|all:
        - ' -RemoveDefinitions'
        - ' -All'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MpCmdRun.exe
      - OriginalFileName: MpCmdRun.exe
      selection_cli:
        CommandLine|contains|all:
        - ' -RemoveDefinitions'
        - ' -All'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel actions on multiple
    endpoints. If the same user stripped definitions or performed related activity on several hosts, the scope of the
    operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MpCmdRun.exe
      - OriginalFileName: MpCmdRun.exe
      selection_cli:
        CommandLine|contains|all:
        - ' -RemoveDefinitions'
        - ' -All'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this definition-removal pattern in the past week, and does the cross-host distribution
    look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific firing
    pattern rather than generic MpCmdRun.exe usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MpCmdRun.exe
      - OriginalFileName: MpCmdRun.exe
      selection_cli:
        CommandLine|contains|all:
        - ' -RemoveDefinitions'
        - ' -All'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or
    other defense tampering — may reveal the attack stages that preceded the definition removal and help reconstruct the
    full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host after the definitions were removed?
  context: Stripping antivirus protection is frequently a precursor to establishing persistence that would otherwise be
    flagged. Scheduled tasks, services, registry Run-key writes, BITS jobs, or WMI subscriptions installed in the
    surrounding window indicate the operator moved from clearing defenses to securing a foothold.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:persistence_scope.file_based_persistence
  question: Were files dropped to persistence locations such as the Startup folder or Run-key paths on this host?
  context: File-based persistence bypasses command-line detection entirely — dropping an executable or script into the
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks, sc, or reg.
    File-write monitoring captures these drops even when the operator avoids the standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
