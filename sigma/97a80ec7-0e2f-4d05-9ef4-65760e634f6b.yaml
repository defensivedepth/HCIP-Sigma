name: Security Privileges Enumeration Via Whoami.EXE
id: 757c7e00-d175-4d38-8382-38e0e57e6b4f
description: |
  Detects whoami.exe (matched by Image name or OriginalFileName) run with the ' /priv' or ' -priv' command-line flag, which
  instructs the tool to enumerate the current user's security privileges. Listing held privileges is a quick way for an
  operator to learn what the compromised token can do (for example, whether SeDebugPrivilege or SeImpersonatePrivilege is
  present) and frequently follows a privilege-escalation attempt; it is also run legitimately by administrators and support
  staff during troubleshooting. The investigation should determine who and what launched the command, whether other
  reconnaissance ran alongside it, and whether the user, parent chain, and host are consistent with routine administration.
type: detection
detection_id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event show whoami.exe run with the /priv (or -priv) privilege-enumeration flag?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and
    process details. The rule fires only when both conditions hold together - the image (or OriginalFileName) is whoami.exe
    AND the command line contains ' /priv' or ' -priv' - so verify the flag is actually present and not a substring of an
    unrelated argument.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What was the full whoami command line, and were other enumeration switches combined with /priv?
  context: The full command line reveals the complete scope of the enumeration. Check whether /priv was the only switch or
    whether it was combined with /all, /groups, /user, or /claims, which broadens the access-token information returned. This
    query scopes to all whoami.exe executions on this host within a short window, so a multi-step enumeration run shows up
    as several rows rather than a single event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this whoami command, and is that parent normal for interactive discovery?
  context: Legitimate discovery commands are typically run from cmd.exe or powershell.exe spawned by explorer.exe (a user at
    a console). Discovery spawned by Office applications, script interpreters (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe,
    or wsmprovhost.exe indicates non-interactive or remote execution and points toward automated post-exploitation enumeration
    rather than a person troubleshooting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run privilege-enumeration commands on this host?
  context: Administrators and help-desk staff legitimately check privileges while troubleshooting. Standard users rarely have
    a reason to enumerate their own security privileges. The user's role and typical behavior baseline determine whether this
    activity is routine or anomalous; an unexpected user (or a service account) running whoami /priv is the case worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery command may be legitimate troubleshooting, but several reconnaissance commands in rapid
    succession - whoami, ipconfig, net user, systeminfo, nltest - is a signature of post-compromise enumeration as an operator
    surveys the host before the next stage. Three or more distinct recon binaries inside a tight window typically indicates
    automated reconnaissance rather than a person checking one thing.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run whoami or other privilege-enumeration tools?
  context: Compare this user's current action against their historical behavior. A user who has never run whoami is more
    notable than one who runs it regularly during administration. Low or zero historical counts, combined with the user's
    expected role, indicate first-time or out-of-pattern enumeration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-whoami launch combination historically routine on this host or environment-wide?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account),
    user identity does not attribute behavior; the meaningful pivot is the launch mechanism - which parent process spawned
    whoami.exe, and whether that pair is historically common. A new or rare parent for whoami on this host is the deviation
    worth chasing; a pair already accounting for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar enumeration on several hosts in this window, the scope of the activity is larger than
    a single host. This is distinct from the historical-baseline view - it asks what the user did right now across the network.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent-plus-whoami combination fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, asking what the user did across the network returns agent-telemetry noise, because every
    host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism - parent process
    plus spawned binary - fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline
  question: Does this host normally run whoami.exe?
  context: A binary that has never been seen on a host is more notable than one that runs regularly. Zero or very low
    historical counts over 90 days indicate first-time or rare execution of whoami on this endpoint; consistent prior counts
    suggest routine administrative or scripted use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired the whoami /priv pattern, what parents and users drove it, and does the current
    alert fit?
  context: Even common tools can be abused. This query mirrors the rule's selection - whoami.exe (by image or OriginalFileName)
    with ' /priv' or ' -priv' - scoped to this host, so the resulting parent and user distribution reflects how this specific
    firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line
    shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_cli:
        CommandLine|contains:
        - ' /priv'
        - ' -priv'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What processes ran on this host immediately after the whoami enumeration?
  context: Privilege enumeration is reconnaissance; what follows reveals intent. After learning which privileges a token
    holds, an operator may attempt token manipulation, service creation, credential access, or lateral movement. Look at what
    executed in the hours after the alert to see whether the enumeration led to an escalation or movement attempt.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the whoami /priv pattern in the past week, and does the spread look like automation or
    one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the whoami /priv firing
    pattern rather than generic whoami usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_cli:
        CommandLine|contains:
        - ' /priv'
        - ' -priv'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding activity reveals what led to this event and what
    happened after, and whether it is part of a larger sequence. Aggregating by image and parent collapses repetitive agent
    telemetry into high-count rows while novel parent-child pairs stand out at low counts - those low-count pairs are what to
    scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, prior reconnaissance, credential access, or an exploitation
    attempt - may reveal the attack stages that preceded the privilege enumeration and help reconstruct the timeline. The
    sequence of alerts on a host often tells the story of how the operator arrived at this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
