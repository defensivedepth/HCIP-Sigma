- source: template:cue_user_actor.clustering
  question: What else did the signed-in identity do across the network around this time?
  context: Tracking the identity's activity across all hosts reveals whether the same account was active on multiple endpoints in the same window, which would point to a captured credential already being reused or to a wider operation. If the identity triggered similar WebDav resolutions or ran tooling elsewhere, the scope is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
