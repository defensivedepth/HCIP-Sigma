    - template: cue_artifact.mechanism_decode
      reason: "The only file path in the command line is C:\\windows\\system32\\davclnt.dll, a legitimate signed Windows system DLL, not a dropped or downloaded artifact. Content analysis of a system DLL yields no investigative value; the analytical pivot is the remote endpoint (Q4) and the outbound connection (Q5), not the local DLL."
    - template: cue_artifact.artifact_verification
      reason: "Same as above — davclnt.dll is a signed system component; a hash/reputation lookup of it is uninformative. No malicious file artifact exists for this rule to verify."
    - template: cue_artifact.baseline
      reason: "davclnt.dll ships with Windows and is present on every host; a first-seen baseline of a built-in system DLL is meaningless. The meaningful first-seen signal is the firing pattern itself, covered by Q16."
    - template: data_staging_exfil.data_scope
      reason: "Technique-set must_include assumes an archiving/export tool (rar, 7z, rclone, bcp) collecting files. This rule fires on a WebDav client connection that leaks a NetNTLMv2 hash via forced authentication — there is no file-collection step and no Image touching files to enumerate. The exfiltration channel itself is covered by the outbound-connection question (Q5)."
    - template: data_staging_exfil.archive_destination
      reason: "Assumes a created archive moved to a staging location; no archive is produced by a WebDav forced-authentication trigger. The destination that matters is the remote endpoint the WebDav client contacted, covered by Q4 (URL decode) and Q5 (outbound connection)."
    - template: data_staging_exfil.encryption_password
      reason: "Assumes archive password/encryption flags (-p, -hp, --passphrase); rundll32 davclnt.dll,DavSetCookie has no archiving or encryption arguments to inspect. Not applicable to this connection-based exfiltration pattern."
    - template: universal.evidence_preservation
