- source: template:lolbin.renamed_binary_check
  question: Was rundll32.exe executed from its expected System32 or SysWOW64 path?
  context: rundll32.exe executed from a non-standard path (outside System32 or SysWOW64) may indicate the binary was copied or renamed to evade path-based allowlists or to masquerade as the system utility. Compare the Image path against OriginalFileName; a process whose OriginalFileName is RUNDLL32.EXE but whose on-disk path differs from the expected system location points to a relocated or renamed copy and changes the disposition from a Windows-driven WebDav resolution toward deliberate operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.technique_class_lateral
  question: Were other proxy-execution or download LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary often use several. A forced-authentication leak is frequently paired with follow-on proxy-execution or download activity once a credential is captured or a relay succeeds. Finding regsvr32, mshta, certutil, bitsadmin, or similar binaries running on the host around the same time strengthens the case that the WebDav trigger is part of an execution chain rather than an isolated event.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
