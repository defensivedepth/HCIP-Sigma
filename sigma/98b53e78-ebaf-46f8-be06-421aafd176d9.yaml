name: HackTool - winPEAS Execution
id: cea45ed0-749e-46db-9506-059c5f91f0dd
description: |
  Detects execution of winPEAS, a local privilege-escalation discovery tool that enumerates Windows misconfigurations -- weak service permissions, unquoted service paths, AlwaysInstallElevated, stored credentials, writable PATH directories, and similar escalation paths. The rule fires when EITHER the process binary or OriginalFileName matches a winPEAS filename, OR the command line carries a characteristic section flag (applicationsinfo, servicesinfo, windowscreds, and similar), OR the command line contains the PEASS-ng release download path, OR the command line ends with the -linpeas flag. Legitimate use is limited to authorized penetration tests and red-team engagements; outside that context, winPEAS execution typically marks the discovery phase of an intrusion, where an operator maps escalation opportunities before attempting to elevate. Determine which branch fired, what enumeration scope was requested, how the tool reached the host, and whether the activity fits an approved assessment.
type: detection
detection_id: 98b53e78-ebaf-46f8-be06-421aafd176d9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did this process match winPEAS by binary name, OriginalFileName, a section flag, the PEASS-ng download path, or the -linpeas flag?
  context: >-
    The rule fires when at least one of four independent branches matches -- a winPEAS filename or OriginalFileName,
    a command-line section flag such as servicesinfo or windowscreds, the PEASS-ng release download path in the
    command line, or a command line ending in -linpeas. Review the full event and note which branch fired: a filename
    match means the renamed-or-not binary is on disk, a flag-only match may mean a renamed or in-memory variant, and a
    download-path match may capture the retrieval rather than the run. The branch that fired shapes which downstream
    questions carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
      - OriginalFileName
      - CommandLine
- source: template:hacking_tool.authorized_engagement
  question: Is this winPEAS execution part of an authorized penetration test or red team engagement?
  context: >-
    winPEAS is a standard tool in authorized security assessments. Before investing investigation time, check whether a
    penetration test or red-team exercise is active on this host or network segment. An approved engagement with matching
    tooling, host scope, and timing resolves the alert without further analysis; absence of one elevates it to suspected
    unauthorized discovery.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run local privilege-escalation enumeration tooling?
  context: >-
    Privilege-escalation discovery tooling is normal only for security staff during sanctioned testing. Standard users,
    service accounts, and production servers rarely have a legitimate reason to run it. Whether the user role and host
    function are consistent with this activity is often the fastest path to distinguishing an authorized assessment from
    hands-on-keyboard intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.tool_capability_used
  question: Which enumeration scope did winPEAS run -- full audit or a specific section?
  context: >-
    winPEAS run with no arguments performs a full local-privilege-escalation audit; passing a section name limits scope.
    Flags such as windowscreds and browserinfo target stored credentials and saved browser secrets, servicesinfo and
    applicationsinfo target service and software misconfigurations, and the absence of any flag means the full checklist
    ran. Decode the command line to identify which checks were requested, since that determines what the operator was
    most interested in and what may have been exposed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What other winPEAS invocations ran on this host in the surrounding minutes?
  context: >-
    A single alert may capture one of several sequential runs -- operators commonly pull the binary, run a scoped section,
    then run the full audit. Scoping to all winPEAS executions on this host within a few minutes surfaces the complete
    operation rather than the one event that tripped the rule, including renamed copies that still match an OriginalFileName
    or section-flag branch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: What spawned winPEAS, and what started that parent?
  context: >-
    The launching chain distinguishes interactive operator use from automated post-exploitation. A command shell under
    explorer.exe suggests a hands-on session, while a script interpreter, a remote-execution service host such as
    wmiprvse.exe or wsmprovhost.exe, or an unexpected parent points to remote or scripted delivery. Tracing the parent's
    own origin reveals how the operator reached this host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other processes did the same parent spawn around this time?
  context: >-
    If the parent spawned winPEAS, it likely spawned other tools in the same session. Examining siblings of the exact
    parent instance reveals the full scope of activity launched through this chain -- additional discovery utilities,
    download cradles, or escalation attempts running alongside the enumeration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:discovery_recon.discovery_parent_chain
  question: Did the launching chain match interactive use or scripted post-exploitation?
  context: >-
    Discovery tooling launched from a command prompt under explorer.exe fits an interactive session. The same tooling
    launched from Office applications, script interpreters such as wscript.exe or mshta.exe, or remote-execution hosts
    such as wmiprvse.exe and wsmprovhost.exe indicates automated post-exploitation. The immediate parent and its command
    line classify the launch pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_network_endpoint.mechanism_decode
  question: Was winPEAS pulled from the PEASS-ng release page or another download source, and how did it reach the host?
  context: >-
    One branch of the rule matches the PEASS-ng release download path in the command line, which captures retrieval of
    the binary directly via a download utility. Identify the full source URL or host, whether a command-line download
    tool fetched it, and the staging directory it landed in. Recently registered domains, raw IP downloads, or unexpected
    staging paths point to operator-controlled retrieval rather than a sanctioned tool drop.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'https://github.com/carlospolop/PEASS-ng/releases/latest/download/'
      condition: selection
    fields:
      - CommandLine
      - Image
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    winPEAS automates much of local enumeration, but operators frequently pair it with native discovery commands -- whoami,
    systeminfo, net user, nltest -- before and after running it. Several distinct recon binaries within a short window is a
    signature of post-compromise enumeration and helps separate a one-off run from an active hands-on-keyboard session.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: attack:T1046.network_indicators
  question: Did this host probe other hosts or ports in a pattern consistent with network scanning after the enumeration?
  context: >-
    Local privilege-escalation discovery often precedes network service discovery -- once an operator maps the host, they
    probe reachable services for lateral movement. A burst of outbound connections to many distinct destinations or ports
    in a short window points to scanning. Exclude routine system processes when interpreting the volume.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- source: template:discovery_recon.discovery_user_context
  question: Does this user normally run administrative discovery tooling on this host?
  context: >-
    Network administrators and security staff legitimately run discovery and enumeration tooling for troubleshooting and
    assessments. Standard users and service accounts rarely do. The user's role and historical behavior baseline determine
    whether running a privilege-escalation enumeration tool is routine or anomalous for this identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user run winPEAS or similar enumeration binaries anywhere in the environment before?
  context: >-
    Comparing this user's current action against their historical pattern separates a routine operator from an anomalous
    one. A user who has never run this tooling is more suspicious than one who runs it as part of a documented role. Pair
    the count with knowledge of whether the account belongs to security staff.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or environment-wide, or is the parent unusual for it?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is the
    launch mechanism -- which parent spawned the binary and whether that pair is historically common. A new or rare parent
    for this binary is the deviation worth chasing, while a pair already accounting for many prior events points to existing
    automation or tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the enumeration is isolated or part of broader movement.
    If the same account triggered similar discovery or escalation activity on multiple hosts in the same window, the scope
    of the operation is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent and binary combination fire on other hosts in the same window, indicating a pushed rollout rather than isolated activity?
  context: >-
    Under a service principal, asking what the user did across the network returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism -- parent process plus spawned binary -- fired on other hosts in the alert
    window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Discovery rarely happens in isolation. Earlier detections on the same host -- initial access, defense tampering, or
    credential access -- may reveal the stages that preceded this enumeration and help reconstruct the timeline. A run that
    follows a delivery or execution alert is more concerning than an isolated one.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
