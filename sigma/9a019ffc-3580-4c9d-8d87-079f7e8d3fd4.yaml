name: Cloudflared Tunnel Execution
id: 188e2913-7ca5-4758-802e-4419c1bcb2d7
description: |
  Detects execution of the cloudflared tunnel client with a command line that combines the
  ' tunnel ' and ' run ' subcommands AND one of the credential/config arguments
  (-config, -credentials-contents, -credentials-file, -token). cloudflared establishes an
  outbound-only connection from the host to Cloudflare's edge, which legitimate operators use
  to publish internal services without inbound firewall changes — and which operators abuse as
  a covert remote-access and protocol-tunneling primitive that evades most egress controls.
  Investigate whether this tunnel is authorized, where it routes, who launched it, and whether
  the binary was renamed to masquerade as a system process.
type: detection
detection_id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line combine the tunnel and run subcommands with a config, credentials, or token argument?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line.
    The rule fires when ' tunnel ' and ' run ' both appear AND at least one of -config, -credentials-contents,
    -credentials-file, or -token is present. Confirm which credential/config argument actually drove the match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a tunnel client that establishes outbound proxy connections?
  context: Legitimate tunnel use is concentrated on developer, IT, or DevOps systems with a documented need to publish internal
    services. A tunnel client launched under a general user, a service account, or a server with no such function is a stronger
    signal of unauthorized remote access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is this tunneling tool authorized for use on this host, and what business purpose does it serve?
  context: Organizations typically sanction a limited set of remote-access and tunneling tools. cloudflared not on that list
    — even though it is a Cloudflare-signed, otherwise legitimate binary — may represent shadow IT or attacker-deployed
    persistence. Tunneling tools should be checked regardless of the binary's reputation or signature.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there an approved development, testing, or maintenance use case explaining this tunnel?
  context: Legitimate tunnel usage typically correlates with an active ticket, a scheduled maintenance window, or a documented
    development workflow. If no support context exists for this session, the tunnel may have been established by an attacker
    for persistent remote access or by a user circumventing egress controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoints did this process connect to, and do they fall in Cloudflare's edge ranges?
  context: cloudflared dials out to Cloudflare data centers, typically over QUIC on port 7844 and HTTPS on 443, and resolves
    tunnel-discovery names under argotunnel.com. Connections to those endpoints are consistent with the tunnel transport;
    connections elsewhere, or to internal hosts being bridged, change the interpretation. The destination set also reveals
    what is being exposed through the tunnel.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.mechanism_decode
  question: Decode the full command line — which credential argument was used, and what tunnel does it point to?
  context: The full command line reveals how the tunnel is configured. A -token argument carries a base64 blob that decodes
    to the Cloudflare account ID, tunnel UUID, and tunnel secret; -credentials-file and -config point to on-disk artifacts
    worth pulling. Identify the exact argument and value so the tunnel object and account can be characterized.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - ' tunnel '
          - ' run '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- source: attack:T1102.process_identification
  question: Is the executing binary the genuine cloudflared client, or has it been renamed to masquerade as another program?
  context: Because this rule matches on command-line arguments only, it fires regardless of the binary's name. Operators
    routinely rename cloudflared to blend in — for example to paths under C:\ProgramData with system-sounding names — while
    the tunnel/run/token argument pattern stays the same. Check the Image path, file name, signature, and original-filename
    metadata to confirm whether the on-disk binary is the genuine signed client and whether its location is expected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: attack:T1572.obfuscation_check
  question: If a -token argument was passed, decode its base64 payload to recover the Cloudflare account ID, tunnel UUID, and secret.
  context: The -token value is a base64-encoded JSON object of the form {"a":account_id,"t":tunnel_uuid,"s":secret}. Decoding
    it yields the attacker- or operator-controlled Cloudflare account and the specific tunnel object, which are the pivots
    for scoping the tunnel's reach and requesting takedown. Treat a token passed inline on the command line rather than via
    a config file as a notable pattern on its own.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '-token '
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this tunnel client, and is that parent chain expected?
  context: The parent process reveals how the tunnel was launched. A user shell, a scheduling service, or a deployment agent
    each implies a different story. Unusual parents — script hosts, Office applications, or a recently dropped binary —
    point toward operator activity rather than sanctioned automation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What other processes ran on this host shortly after the tunnel started?
  context: A tunnel established for remote access is often followed by hands-on-keyboard activity routed through it —
    discovery, credential access, or lateral-movement tooling. Processes appearing on the host just after the tunnel comes
    up reveal what the remote operator did once connectivity was in place.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this tunnel pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects how
    this specific tunnel-execution pattern — not generic process activity — has historically run here. A new parent process,
    an unexpected user account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' tunnel '
        - ' run '
        CommandLine|contains:
        - '-config '
        - '-credentials-contents '
        - '-credentials-file '
        - '-token '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' tunnel '
        - ' run '
        CommandLine|contains:
        - '-config '
        - '-credentials-contents '
        - '-credentials-file '
        - '-token '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' tunnel '
        - ' run '
        CommandLine|contains:
        - '-config '
        - '-credentials-contents '
        - '-credentials-file '
        - '-token '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user established tunnels or ran related tooling on multiple hosts, the scope of unauthorized access may be
    larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' tunnel '
        - ' run '
        CommandLine|contains:
        - '-config '
        - '-credentials-contents '
        - '-credentials-file '
        - '-token '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this tunnel pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    tunnel-execution pattern rather than generic binary usage. Many hosts firing the same pattern suggests scripted or
    vendor deployment; one host or a small unrelated set suggests manual operator activity. Use the distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' tunnel '
        - ' run '
        CommandLine|contains:
        - '-config '
        - '-credentials-contents '
        - '-credentials-file '
        - '-token '
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    attack stages that preceded the tunnel coming up and help reconstruct the timeline. A tunnel for remote access is often
    established after an initial foothold and some hands-on activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
