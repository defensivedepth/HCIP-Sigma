name: Privilege Escalation via Named Pipe Impersonation
id: 55e8259e-f2b7-4ff7-9f59-bb35c18a93d6
description: |
  Fires when cmd.exe or powershell.exe (by image name or original filename) runs a command line that
  writes to a named pipe via the "echo > \\.\pipe\<name>" pattern. This is the coordination step used by
  named-pipe impersonation privilege escalation (the Metasploit getsystem family and similar primitives):
  a process holding SeImpersonatePrivilege creates a pipe, induces a SYSTEM-context service to connect to
  it, and calls ImpersonateNamedPipeClient to assume the SYSTEM token. Legitimate software does occasionally
  echo into named pipes, but the cmd/powershell + echo + pipe-path combination is unusual outside of
  impersonation tooling. Investigation should decode the exact pipe name, establish what parent spawned the
  shell and under which identity, and determine whether a service or token-manipulation chain followed.
type: detection
detection_id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show cmd.exe or powershell.exe writing to a named pipe with the echo-redirect pattern?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    the image (or original filename) is cmd.exe/powershell.exe AND the command line contains all of echo, the
    redirect '>', and the '\\.\pipe\' path fragment. Verify the actual command line carries all three and note
    the pipe name being written to.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to write to named pipes from a command shell?
  context: Writing to a named pipe from cmd.exe or powershell.exe is rare in normal administration. Knowing
    whether the account is a service identity holding SeImpersonatePrivilege (LOCAL SYSTEM, NETWORK SERVICE,
    a web/app service account) and whether this host runs software that legitimately coordinates over named
    pipes is often the fastest way to separate a real impersonation attempt from a benign edge case.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this shell, and is that parent chain expected?
  context: The parent reveals how the shell was launched. Named-pipe impersonation frequently relies on a
    service running as SYSTEM spawning the shell, so a parent like services.exe, svchost.exe, a freshly created
    service host, or an injected process is the signal worth chasing. A normal interactive parent (explorer.exe,
    a terminal) makes a deliberate operator action more likely.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What is the exact named pipe being written to, and what does that pipe name indicate?
  context: Decode the full command line and isolate the pipe path after '\\.\pipe\'. Default tooling pipe names
    are a strong tell -- some frameworks use predictable prefixes for post-exploitation coordination, while
    others use random names. Determine what the pipe is named, what value is echoed into it, and whether the
    name matches any known legitimate inter-process channel on this host. The query is scoped to the triggering
    command line pattern on this host so the result is the impersonation activity, not all shell usage.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - echo
          - '>'
          - \\\\.\\pipe\\
      condition: selection
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
- source: template:powershell.script_block_logging
  question: If the shell was powershell.exe, did script block logging capture the full pipe-write script content?
  context: Event ID 4104 records the deobfuscated script content PowerShell actually executed, providing ground
    truth even if the command line was wrapped or built dynamically. For a pipe-write this confirms the exact
    pipe name and any surrounding impersonation logic. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran; for cmd.exe firings
    this source will not apply.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:cue_process_tool.follow_on
  question: What child processes did this shell spawn afterward?
  context: Named-pipe impersonation is a means to run further actions under the stolen SYSTEM token. Processes
    spawned by this shell shortly after -- service creation via sc.exe, rundll32.exe, additional cmd/powershell,
    credential-access or persistence tooling -- reveal what the operator did once impersonation succeeded.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1021.security_logon_correlation
  question: What logon events occurred on this host around the time of the alert, and do they show a service or SYSTEM context?
  context: Named-pipe impersonation hinges on a privileged logon context being assumed through the pipe.
    Correlating Security logon events (4624 success, 4648 explicit-credential logon) in a tight window around
    the shell execution shows whether a new SYSTEM, service-account, or network logon coincided with the
    activity. A SeImpersonatePrivilege-bearing logon appearing alongside the pipe write supports a real
    impersonation attempt. If Security logs are not collected here, treat empty results as a visibility gap.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
      - EventID
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this echo-to-pipe pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate software can produce a pipe write. The query mirrors the rule's selection scoped to
    this host, so the parent/user distribution reflects how this specific firing pattern -- not generic shell
    usage -- has historically run here. A new parent process, an unexpected account, or a first-ever occurrence
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
      selection_args:
        CommandLine|contains|all:
        - echo
        - '>'
        - \\\\.\\pipe\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
      selection_args:
        CommandLine|contains|all:
        - echo
        - '>'
        - \\\\.\\pipe\\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
      selection_args:
        CommandLine|contains|all:
        - echo
        - '>'
        - \\\\.\\pipe\\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts in a tight window reveals whether the impersonation
    attempt is isolated or part of broader movement. The same user running similar shell or tooling activity on
    multiple hosts widens the scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
      selection_args:
        CommandLine|contains|all:
        - echo
        - '>'
        - \\\\.\\pipe\\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the surrounding process activity reveals the immediate
    context: what led to the pipe write, what happened after, and whether it is part of a privilege-escalation
    or persistence sequence. Novel parent-child pairs at low counts are what to scan for.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access, or
    service manipulation -- may reveal the stages that set up the impersonation and help reconstruct the
    timeline. SeImpersonatePrivilege abuse often follows an initial foothold on a service-running host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Operators frequently weaken AV/EDR before a hands-on privilege-escalation step. The query surfaces
    direct attempts to disable protection services, flip Defender flags, add broad exclusions, clear logs, or
    patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal -- kernel-level driver tampering and
    in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation;
    review the parent and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this echo-to-pipe pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    this specific firing pattern, not generic shell usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use
    the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
      selection_args:
        CommandLine|contains|all:
        - echo
        - '>'
        - \\\\.\\pipe\\
      condition: all of selection*
    fields:
    - host.name
- source: template:lateral_movement.lateral_movement_scope
  question: Has this user account run lateral-movement tooling against other hosts recently?
  context: Privilege escalation to SYSTEM is frequently a stepping stone to moving onto other systems. If the
    firing account has run remote-execution or remote-access tooling (psexec, wmic, mstsc, ssh, plink) across
    multiple hosts in the prior day, the scope of compromise is wider than this single host and containment
    should account for it.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
