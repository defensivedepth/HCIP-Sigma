name: Suspicious Encoded And Obfuscated Reflection Assembly Load Function Call
id: f74aa632-72d2-4969-8594-2475c7094f95
description: |
  Detects base64-encoded and string-obfuscated forms of the .NET "reflection.assembly" Load call in a process command line.
  The encoded fragments correspond to PowerShell that splits the "Load" string with concatenation (for example "L"+"oad")
  to evade plain-string matching, then reflectively loads a .NET assembly into memory from a byte array — a fileless
  execution path that avoids writing the payload to disk. Legitimate developer or automation use of in-memory assembly
  loading exists but is rare; investigation should confirm what assembly was loaded, where the byte array came from
  (base64 string, registry value, downloaded content), and what the loaded code did next.
type: detection
detection_id: 9c0295ce-d60d-40bd-bd74-84673b7592b1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain one of the encoded, concatenation-split "Load" fragments this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line.
    The rule matches base64 fragments that decode to a string-split "reflection.assembly"::("Load") call — confirm the alerting
    command line actually carries one of those obfuscated Load patterns rather than an unrelated base64 blob.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run PowerShell that loads .NET assemblies reflectively?
  context: In-memory assembly loading is a developer and automation pattern but is uncommon on general-purpose endpoints.
    Knowing whether the user role and host function involve .NET tooling or build automation is often the fastest path to
    distinguishing a routine operation from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.evidence_preservation
  question: Did the decoded command reference a file on disk, and is that file still present for analysis?
  context: Reflective loaders often pull the assembly bytes from a base64 string or registry value, but some stage a payload
    file or write decoded output to disk first. If the command references a file path, checking whether it still exists enables
    hash lookup, content review, or sandbox submission.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:powershell.encoded_command_decode
  question: What does the obfuscated command decode to, and what assembly does the reflective Load call pull into memory?
  context: The rule fires on the encoded "Load" fragment, but the full command line carries the rest of the loader — the byte
    array source and any follow-on call. Decode the base64 and reconstruct the concatenated strings to identify where the
    assembly bytes come from (a base64 literal via [Convert]::FromBase64String, a registry value, or downloaded content)
    and what method is invoked after the load. Reflective Assembly.Load executes .NET entirely in memory with no file on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script behind this encoded Load call?
  context: Script block logging records the deobfuscated script content PowerShell actually executes, even when the command
    line is encoded or string-split. This is the ground-truth view of the reflective loader — the assembled byte array, the
    Load invocation, and any method called on the loaded assembly. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell or endpoint security controls disabled or weakened on this host before the reflective load ran?
  context: In-memory assembly loading is a common AMSI evasion path, and operators frequently disable or weaken protections
    first. This surfaces execution-policy bypasses, AMSI patching, Defender preference changes, and PowerShell downgrade attempts
    on the host in the hour before the alert. Populated rows strengthen the case that the load was deliberate evasion.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned the PowerShell that ran this reflective load, and is that parent chain expected?
  context: The parent process reveals how the loader was launched. A normal interactive or automation chain (explorer.exe,
    services.exe, a scheduled-task host) is far less concerning than PowerShell spawned by Office applications, mshta.exe,
    wscript.exe, or a browser child — abnormal parents point to macro or script-delivered execution.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1059.001.image_load
  question: What .NET-related modules were loaded into the PowerShell process around the time of the alert?
  context: Reflective assembly loading is visible at the module-load layer as well as the command line. Modules such as
    clr.dll, clrjit.dll, mscoree.dll, or System.Management.Automation loading into a process, followed by a rare or
    never-before-seen managed assembly, corroborates an in-memory .NET execution that the command-line evidence only hints at.
    Scope to the alerting host and time window; a module image that has not been seen here before is the deviation worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dotnet:
        ImageLoaded|contains:
          - '\clr.dll'
          - '\clrjit.dll'
          - '\mscoree.dll'
          - '\mscorlib'
          - '\System.Management.Automation'
      condition: selection and selection_dotnet
    fields:
      - ImageLoaded
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the encoded-Load pattern, what parents and users drove it, and does this alert fit?
  context: Even rare patterns can have a benign home on a given host. The query mirrors the rule's selection scoped to this
    host — the resulting parent/user distribution reflects how this specific encoded-Load pattern has historically run here.
    A new parent process, an unexpected user account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - OgA6ACgAIgBMACIAKwAiAG8AYQBkACIAKQ
        - oAOgAoACIATAAiACsAIgBvAGEAZAAiACkA
        - 6ADoAKAAiAEwAIgArACIAbwBhAGQAIgApA
        - OgA6ACgAIgBMAG8AIgArACIAYQBkACIAKQ
        - oAOgAoACIATABvACIAKwAiAGEAZAAiACkA
        - 6ADoAKAAiAEwAbwAiACsAIgBhAGQAIgApA
        - OgA6ACgAIgBMAG8AYQAiACsAIgBkACIAKQ
        - oAOgAoACIATABvAGEAIgArACIAZAAiACkA
        - 6ADoAKAAiAEwAbwBhACIAKwAiAGQAIgApA
        - OgA6ACgAJwBMACcAKwAnAG8AYQBkACcAKQ
        - oAOgAoACcATAAnACsAJwBvAGEAZAAnACkA
        - 6ADoAKAAnAEwAJwArACcAbwBhAGQAJwApA
        - OgA6ACgAJwBMAG8AJwArACcAYQBkACcAKQ
        - oAOgAoACcATABvACcAKwAnAGEAZAAnACkA
        - 6ADoAKAAnAEwAbwAnACsAJwBhAGQAJwApA
        - OgA6ACgAJwBMAG8AYQAnACsAJwBkACcAKQ
        - oAOgAoACcATABvAGEAJwArACcAZAAnACkA
        - 6ADoAKAAnAEwAbwBhACcAKwAnAGQAJwApA
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this encoded-Load pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this exact encoded-Load
    pattern rather than generic PowerShell usage. Many hosts firing the identical encoded fragment points to a scripted or
    pushed deployment; a single host or a small unrelated set points to manual operator activity. Use the spread to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - OgA6ACgAIgBMACIAKwAiAG8AYQBkACIAKQ
        - oAOgAoACIATAAiACsAIgBvAGEAZAAiACkA
        - 6ADoAKAAiAEwAIgArACIAbwBhAGQAIgApA
        - OgA6ACgAIgBMAG8AIgArACIAYQBkACIAKQ
        - oAOgAoACIATABvACIAKwAiAGEAZAAiACkA
        - 6ADoAKAAiAEwAbwAiACsAIgBhAGQAIgApA
        - OgA6ACgAIgBMAG8AYQAiACsAIgBkACIAKQ
        - oAOgAoACIATABvAGEAIgArACIAZAAiACkA
        - 6ADoAKAAiAEwAbwBhACIAKwAiAGQAIgApA
        - OgA6ACgAJwBMACcAKwAnAG8AYQBkACcAKQ
        - oAOgAoACcATAAnACsAJwBvAGEAZAAnACkA
        - 6ADoAKAAnAEwAJwArACcAbwBhAGQAJwApA
        - OgA6ACgAJwBMAG8AJwArACcAYQBkACcAKQ
        - oAOgAoACcATABvACcAKwAnAGEAZAAnACkA
        - 6ADoAKAAnAEwAbwAnACsAJwBhAGQAJwApA
        - OgA6ACgAJwBMAG8AYQAnACsAJwBkACcAKQ
        - oAOgAoACcATABvAGEAJwArACcAZAAnACkA
        - 6ADoAKAAnAEwAbwBhACcAKwAnAGQAJwApA
      condition: selection
    fields:
    - host.name
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell instance spawn after the reflective load?
  context: A loaded assembly often drives further activity — spawning cmd.exe, additional PowerShell, rundll32.exe, or
    network-capable tools. The children of the alerting process reveal the loader's actual impact and whether post-exploitation
    followed the in-memory execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - OgA6ACgAIgBMACIAKwAiAG8AYQBkACIAKQ
        - oAOgAoACIATAAiACsAIgBvAGEAZAAiACkA
        - 6ADoAKAAiAEwAIgArACIAbwBhAGQAIgApA
