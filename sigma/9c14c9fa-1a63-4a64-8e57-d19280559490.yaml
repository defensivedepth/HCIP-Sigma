name: Invoke-Obfuscation Via Stdin
id: e4687434-bd62-4f6f-8324-2486f1481e22
description: |
  Detects the Invoke-Obfuscation stdin launcher pattern: a command shell that stages an obfuscated
  payload into environment variables with chained `set` commands and pipes it into PowerShell over
  standard input (the `cmd /c "echo/set <payload> ... | powershell -"` form). The chained set/&&
  construction and the stdin handoff are hallmarks of the Invoke-Obfuscation framework's launcher
  obfuscation, used to defeat command-line inspection and AMSI. Legitimate administration almost
  never assembles PowerShell input this way, so the investigation should decode the staged payload,
  recover the deobfuscated script content, and determine whether security controls were weakened
  before execution and what the payload did afterward.
type: detection
detection_id: 9c14c9fa-1a63-4a64-8e57-d19280559490
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show chained `set` commands feeding an obfuscated payload into PowerShell over stdin?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact command line. The rule fires on a `set ... && set ... && ...` construction that assembles an
    environment-variable payload referencing strings like environment/invoke/$input and pipes it into
    PowerShell. Confirm the chained-set and stdin-handoff pattern is actually present rather than a benign
    multi-statement command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to launch PowerShell by piping a staged payload through a command shell?
  context: Legitimate administrative activity rarely assembles PowerShell input from chained environment
    variables and feeds it over stdin. Knowing whether the user role and host function involve scripted
    automation or developer tooling that could produce this pattern is often the fastest path to separating
    a true positive from an unusual but sanctioned workflow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this obfuscated PowerShell launch part of an authorized penetration test or red team engagement?
  context: The Invoke-Obfuscation framework is an offensive tool used in authorized security assessments.
    Before deeper analysis, check whether a pentest or red team exercise is active on this host or network
    segment. An authorized engagement with matching tooling and timing resolves the alert without further
    work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: What payload did the chained `set` commands stage, and which PowerShell operation does it invoke?
  context: The Invoke-Obfuscation launcher is multi-purpose — the deobfuscated payload can be a download
    cradle, a reverse shell, an in-memory .NET loader, or credential theft. Reconstruct the value assigned
    to the staged environment variables and identify the specific operation the decoded PowerShell performs,
    which determines the scope of potential compromise and the required response.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: Reconstruct the staged payload from the environment-variable chain. What does the deobfuscated PowerShell do?
  context: This launcher hides intent by concatenating the script across `set` assignments and resolving
    them with `[Environment]::GetEnvironmentVariable(...) | iex` rather than using `-EncodedCommand`. Walk
    the chained set values, reassemble the payload, and decode any inner base64, hex, or character-array
    layers. The recovered script reveals the actual action — download cradle, in-memory loader, or
    secondary execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content this stdin payload executed?
  context: Script block logging (Event ID 4104) records the deobfuscated script PowerShell actually runs,
    bypassing the launcher's environment-variable staging and stdin handoff. This is ground truth about
    what executed even when the command line is fully obfuscated. If PowerShell operational logs are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell or endpoint security controls bypassed or weakened in the hour before this execution?
  context: Operators commonly disable or evade PowerShell protections before running an obfuscated payload —
    AMSI bypass (patching amsi.dll in memory), execution policy changes (`-ExecutionPolicy Bypass`, `-ep
    bypass`), constrained language mode escape, and version-2 downgrade attacks that defeat logging.
    Finding these precursor events on the host strengthens the case that the obfuscated launch was malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:universal.evidence_preservation
  question: Did the decoded payload reference a file on disk, and is it still present for analysis?
  context: If the deobfuscated PowerShell writes or downloads a file — a dropped payload, decoded output,
    or staged script — checking whether it still exists on disk enables hash lookups, sandbox submission,
    or content review. File paths for this rule are derived from the decoded command line, so use the paths
    recovered during decoding.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:hacking_tool.tool_specific_artifacts
  question: Did the command shell or PowerShell write characteristic artifacts to disk on this host after the launch?
  context: The stdin launcher and its decoded payload often leave file artifacts — temporary script files,
    decoded output, or downloaded tooling staged under user-writable directories. Checking for files created
    on the host in the window after the alert confirms execution and reveals follow-on staging even if the
    original process has exited. Scope to the paths and directories recovered from the decoded command line.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: (?i)(?:set).*&&\s?set.*(?:environment|invoke|\$\{?input).*&&.*"
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: (?i)(?:set).*&&\s?set.*(?:environment|invoke|\$\{?input).*&&.*"
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity on multiple
    endpoints. If the same user triggered similar activity elsewhere, the scope of compromise may be larger
    than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: (?i)(?:set).*&&\s?set.*(?:environment|invoke|\$\{?input).*&&.*"
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this stdin-obfuscation pattern, what parents and users drove it, and does the current alert fit?
  context: Even legitimate automation can produce unusual command structures. The query mirrors the rule's
    selection scoped to this host, so the resulting parent/user distribution reflects how this specific
    firing pattern has historically run here. Deviations — a new parent process, an unexpected user account,
    an unusual command-line structure — are the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: (?i)(?:set).*&&\s?set.*(?:environment|invoke|\$\{?input).*&&.*"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this stdin-obfuscation pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    this firing pattern. Many hosts firing the same pattern points to scripted deployment; one host or a
    small unrelated set points to manual operator activity. Use the host distribution and parent consistency
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: (?i)(?:set).*&&\s?set.*(?:environment|invoke|\$\{?input).*&&.*"
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence. Look
    for reconnaissance, privilege escalation, or persistence mechanisms surrounding the obfuscated launch.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the attack stages that preceded this event and help
    reconstruct the full timeline of the obfuscated execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
