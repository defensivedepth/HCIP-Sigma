name: MSDT Execution Via Answer File
id: d608426f-dfcf-48db-af4f-dde9ae702730
description: |
  Detects msdt.exe launched with the Program Compatibility troubleshooter manifest
  (\WINDOWS\diagnostics\index\PCWDiagnostic.xml) and an answer-file argument (-af) when the
  parent is NOT pcwrun.exe, the binary that drives the legitimate compatibility-tab path. The
  -af switch supplies an attacker-controlled XML answer file that can reference an external
  .msi, which msdt then auto-launches under the trust of a Microsoft-signed binary in a trusted
  location — a proxy-execution and application-allowlist-bypass pattern. Investigate to confirm
  the answer-file path and whether it points outside the legitimate troubleshooter manifest,
  identify what spawned msdt, and determine what payload (msiexec install, child shell, or
  network retrieval) followed.
type: detection
detection_id: 9c8c7000-3065-44a8-a555-79bcba5d9955
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did msdt.exe run with the PCWDiagnostic.xml manifest and an -af answer-file argument from a parent other than pcwrun.exe?
  context: Confirm the alert is a true positive before investing further. The rule fires when msdt.exe references the legitimate troubleshooter manifest at \WINDOWS\diagnostics\index\PCWDiagnostic.xml AND carries an -af (answer-file) argument AND the parent is not pcwrun.exe. Read the full command line and note the path passed after -af — a path pointing anywhere other than the legitimate manifest, or an answer file in a user-writable location, is the abuse signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run the Program Compatibility troubleshooter outside the normal pcwrun.exe path?
  context: Legitimate compatibility troubleshooting is launched by pcwrun.exe from the compatibility tab, which the rule explicitly filters out. An msdt.exe answer-file invocation from any other parent on an endpoint where no one would run that diagnostic manually points away from routine use. Knowing whether this user role and host function involve diagnostics or software packaging is often the fastest triage.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly does the msdt command line do? Decode the -af answer-file path and the troubleshooter parameters.
  context: The full command line reveals the operation. Read the path passed after -af and any /skip, /path, or /param values. The legitimate troubleshooter manifest is \WINDOWS\diagnostics\index\PCWDiagnostic.xml; the abuse comes from the -af answer file, which can reference an external .msi to be installed during the Program Compatibility Wizard runbook. Note whether the answer file lives in a user-writable or temp directory and what package it references.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned msdt.exe, and is that parent chain expected for a diagnostics launch?
  context: The legitimate compatibility-tab path launches msdt via pcwrun.exe, which the rule filters out — so by construction the parent here is something else. Document parents (explorer.exe, services.exe) launch diagnostics in routine use; parents such as Office applications, script hosts (wscript.exe, mshta.exe), or a shell point to delivery of the answer-file abuse rather than user-initiated troubleshooting.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did msdt.exe spawn afterward?
  context: The processes msdt launches reveal the actual payload. The answer-file path is designed to trigger an msiexec install of an attacker-referenced .msi; child msiexec.exe, cmd.exe, powershell.exe, or an unexpected installer running under msdt indicates the runbook executed something. Legitimate diagnostics rarely spawn installers or shells.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.image_load
  question: What modules or packages were loaded on this host right after the alert, and do any unsigned or unusual DLLs or MSI components appear?
  context: The answer-file runbook can side-load a referenced .msi, which surfaces as image loads of installer components or payload DLLs under msiexec or msdt rather than as a new process. Reviewing modules loaded in the minutes after the alert can reveal an unsigned or out-of-place DLL pulled in by the proxy execution. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_signed:
        Signed: 'true'
      condition: selection and not filter_signed
    fields:
      - Image
      - ImageLoaded
      - Signature
      - SignatureStatus
- source: attack:T1218.network_retrieval
  question: Did this host make outbound connections to non-enterprise destinations around the time of the alert that could have delivered the answer file or referenced MSI?
  context: An answer file can reference an external .msi over UNC or HTTP, and the proxy-executed payload may itself beacon out. Connections from msdt.exe, msiexec.exe, or a freshly spawned child to an unfamiliar external address near the alert time suggest the payload was retrieved or is calling home. Filter known-good internal infrastructure to isolate the destinations worth chasing.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Proxy execution rarely stands alone. Examining the processes running around the alert reveals what delivered the answer file and what ran after — staging, reconnaissance, or persistence. Novel parent-child pairs at low counts stand out against the high-count rows of routine agent and OS telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        CommandLine|contains: \WINDOWS\diagnostics\index\PCWDiagnostic.xml
        CommandLine|contains|windash: ' -af '
      filter_main_pcwrun:
        ParentImage|endswith: \pcwrun.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        CommandLine|contains: \WINDOWS\diagnostics\index\PCWDiagnostic.xml
        CommandLine|contains|windash: ' -af '
      filter_main_pcwrun:
        ParentImage|endswith: \pcwrun.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on multiple endpoints. If the same user triggered similar diagnostics-abuse or follow-on execution elsewhere, the scope is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        CommandLine|contains: \WINDOWS\diagnostics\index\PCWDiagnostic.xml
        CommandLine|contains|windash: ' -af '
      filter_main_pcwrun:
        ParentImage|endswith: \pcwrun.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or delivery of an attachment or link — may reveal the stages that preceded the proxy execution and help reconstruct how the answer file arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who reach for one signed-binary proxy often use several. If msdt was used to launch a payload via the answer-file path, check whether rundll32, regsvr32, mshta, msiexec, installutil, or similar were also used on this host for the same objective. Multiple proxy-execution LOLBins in a short window strengthens the case for hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was msdt.exe executed from its expected System32 or SysWOW64 path?
  context: The legitimate diagnostics binary lives at C:\Windows\System32\Msdt.exe and C:\Windows\SysWOW64\Msdt.exe. An msdt.exe running from a user temp directory or other non-standard location, or with an OriginalFileName that does not match, indicates the binary was copied or renamed to evade path-based allowlists.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the msdt answer-file pattern over the past 90 days, and what command-line structures are typical?
  context: An answer-file MSDT invocation with no prior history on a host is more suspicious than one seen routinely under a stable parent. The query mirrors the rule's selection scoped to this host, so the count reflects the rule's specific firing pattern rather than generic msdt usage. Compare the historical command-line structures — especially the path passed after -af — against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        CommandLine|contains: \WINDOWS\diagnostics\index\PCWDiagnostic.xml
        CommandLine|contains|windash: ' -af '
      filter_main_pcwrun:
        ParentImage|endswith: \pcwrun.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
