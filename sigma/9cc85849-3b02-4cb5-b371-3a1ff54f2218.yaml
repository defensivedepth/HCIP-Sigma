- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - an initial-access
    exploit against an internet-facing service, reconnaissance, defense tampering, or credential access -
    may reveal the attack stages that preceded this download and help reconstruct the timeline. A
    curl-from-IP download following an exploitation or tampering alert reads very differently from one with
    no prior activity on the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
