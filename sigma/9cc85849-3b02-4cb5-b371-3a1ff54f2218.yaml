  context: A download pattern with no prior history on a host is more suspicious than one used daily under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the resulting
    count reflects the rule's specific firing pattern (not generic curl usage). The CommandLine projection
    lets the analyst compare the typical invocation shapes against the alerting one - the same build agent
    fetching from the same internal IP daily reads very differently from a first-ever download from an
    external IP literal.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
        CommandLine|contains:
        - ' -O'
        - --remote-name
        - --output
      filter_main_ext:
        CommandLine|endswith:
        - .bat
        - .bat"
        - .dat
        - .dat"
        - .dll
        - .dll"
        - .exe
        - .exe"
        - .gif
        - .gif"
        - .hta
        - .hta"
        - .jpeg
        - .jpeg"
        - .log
        - .log"
        - .msi
        - .msi"
        - .png
        - .png"
        - .ps1
        - .ps1"
        - .psm1
        - .psm1"
        - .vbe
        - .vbe"
        - .vbs
        - .vbs"
        - .bat'
        - .dat'
        - .dll'
        - .exe'
        - .gif'
        - .hta'
        - .jpeg'
        - .log'
        - .msi'
        - .png'
        - .ps1'
        - .psm1'
        - .vbe'
        - .vbs'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's curl-from-IP pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern (not generic usage of curl). Many hosts firing the same
    pattern points to scripted deployment or vendor automation pulling from a known internal IP; one host
    or a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_ip:
