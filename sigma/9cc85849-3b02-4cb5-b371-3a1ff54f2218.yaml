name: File Download From IP URL Via Curl.EXE
id: 4bcbba81-a2e2-444f-996a-0a6ee8be5ddf
description: |
  Detects curl.exe downloading a file directly from a bare IP-address URL. The rule fires only when all of
  the following are present together: the curl binary (matched by image name OR PE OriginalFileName), a
  command line containing an http reference, a URL whose host is a dotted-quad IP literal rather than a
  hostname, AND an output flag (-O, --remote-name, or --output) that writes the response to disk. The rule
  also excludes command lines ending in a long list of common, benign file extensions, so it keys on
  downloads to unusual or extensionless output names. curl.exe is a Microsoft-signed utility shipped with
  Windows and is widely used for legitimate transfers, but downloading from a raw IP (bypassing DNS and
  reputation that rely on hostnames) and saving the result is a living-off-the-land ingress-transfer
  primitive used to stage loaders, scripts, and second-stage payloads. The investigation should confirm
  exactly what was fetched and from where, whether the binary is the genuine signed curl, what spawned it,
  what ran next, and whether this fits the host's normal behavior.
type: detection
detection_id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show curl downloading from a bare IP-address URL with an output flag?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only
    when all conditions hold together - the binary is curl (by image name or PE OriginalFileName), the
    command line contains http, the URL host is a dotted-quad IP literal rather than a hostname, AND an
    output flag (-O, --remote-name, or --output) writes the response to a file. The rule also excludes
    output names ending in common benign extensions, so the saved name is typically unusual or
    extensionless. Read the full command line and confirm all of these are present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to download files from raw IP addresses with command-line tools?
  context: Legitimate administrative work, CI/CD agents, and software updaters can invoke curl. Knowing
    whether the user role and host function are consistent with command-line downloads - and specifically
    with fetching from a bare IP rather than a named host - is often the fastest path to separating a true
    positive from routine operations. A developer workstation or a build server pulling from an internal IP
    reads very differently from an ordinary user account saving a file from an external IP literal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: Decode the full curl command - what IP and URL was fetched, what output path, and were any extra transfer options set?
  context: The full command line reveals the operation. Parse the source IP and URL path, the output file
    name and where it lands, and any additional flags. Pay attention to options that change how or what is
    fetched - a custom User-Agent (-A), extra headers (-H), insecure-TLS (-k), follow-redirects (-L),
    proxy settings, or a credential in the URL. An output path in a user-writable or staging directory
    (Temp, ProgramData, AppData, Public) combined with an IP-literal source is the shape worth chasing.
    This query returns all curl executions on this host within a few minutes of the alert, so a multi-step
    fetch-then-run sequence shows as adjacent rows.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned curl and is that parent chain expected?
  context: The parent process reveals how curl was invoked. Legitimate use often comes from an interactive
    shell an admin opened, a build agent, or a script. Unusual parents - mshta.exe, wscript.exe, an Office
    application, a database server process, or an exploited internet-facing service - point to delivery
    through a macro, an exploit, or a remote-access tool rather than deliberate administration. The
    immediate parent is visible in the alert; walk up to see what spawned the parent and what else it
    spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did curl spawn afterward?
  context: Curl itself only transfers data, but a download is frequently the first step of a
    fetch-then-execute chain - the retrieved file is run immediately by a sibling or following process.
    Examining what curl spawned, and what ran on the host right after, reveals whether the downloaded
    content was executed. Common next steps are cmd.exe or powershell.exe running a dropped script, or
    rundll32.exe / regsvr32.exe loading a downloaded module.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run curl to download files?
  context: Compare this user's current action against their historical behavior. A user who has never run
    curl to fetch files is more suspicious than one who does so regularly as part of a known workflow.
    User role and typical toolset should align - developers, administrators, and automation accounts may
    use curl routinely; an ordinary user account downloading from an IP literal rarely does.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+binary combination historically routine on this host or across the environment, or is the parent unusual for curl?
  context: When the alert fires under a service principal, user identity does not attribute the behavior.
    The meaningful pivot is the launch mechanism - which parent process spawned curl, and whether that
    pair is historically common. A new or rare parent for curl on this host or environment-wide is the
    deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or OS
    automation such as an updater or a build agent.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or
    activity spanning multiple endpoints. If the same user triggered similar downloads or follow-on
    activity on other hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+binary combination fire on other hosts in the same window - is this a coordinated rollout, or isolated to this host?
  context: Under a service principal, "what else did this user do across the network" returns
    agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful question
    is whether the same launch mechanism - parent process plus curl - fired on other hosts in the alert
    window. Multiple hosts in the same window points to scheduled or pushed automation; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's curl-from-IP download pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this
    host - the resulting parent and user distribution reflects how the rule's specific firing pattern (not
    generic curl usage) has historically run here. Deviations - a new parent process, an unexpected user
    account, an unusual command-line shape - are the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
        CommandLine|contains:
        - ' -O'
        - --remote-name
        - --output
      filter_main_ext:
        CommandLine|endswith:
        - .bat
        - .bat"
        - .dat
        - .dat"
        - .dll
        - .dll"
        - .exe
        - .exe"
        - .gif
        - .gif"
        - .hta
        - .hta"
        - .jpeg
        - .jpeg"
        - .log
        - .log"
        - .msi
        - .msi"
        - .png
        - .png"
        - .ps1
        - .ps1"
        - .psm1
        - .psm1"
        - .vbe
        - .vbe"
        - .vbs
        - .vbs"
        - .bat'
        - .dat'
        - .dll'
        - .exe'
        - .gif'
        - .hta'
        - .jpeg'
        - .log'
        - .msi'
        - .png'
        - .ps1'
        - .psm1'
        - .vbe'
        - .vbs'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.renamed_binary_check
  question: Was curl executed from its expected System32 or SysWOW64 path?
  context: curl executed from a non-standard path (outside System32 or SysWOW64) may indicate the binary
    was copied or renamed to evade path-based allowlists. The genuine utility ships at
    C:\Windows\System32\curl.exe and C:\Windows\SysWOW64\curl.exe; a copy running from a user's temp
    directory, Downloads, or AppData is more suspicious than one in System32. Because the rule also matches
    on PE OriginalFileName, a renamed copy of curl still triggers - compare the Image path on disk against
    the embedded OriginalFileName to confirm whether this is the genuine signed curl or a relocated or
    renamed copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.technique_class_lateral
  question: Were any other download or transfer LOLBins used on this host recently?
  context: Attackers who use one download LOLBin often use several - if curl pulled a file from an IP, check
    whether certutil, bitsadmin, expand, extrac32, or makecab were also used to fetch or stage content.
    Finding multiple download utilities performing the same action in the same timeframe strengthens the
    case for deliberate tool transfer rather than a one-off administrative download.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
