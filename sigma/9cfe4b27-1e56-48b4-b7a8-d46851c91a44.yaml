        image_load coverage targets the malicious-COM .msc variant where
        mmc.exe loads non-baseline / unsigned DLLs. This rule's detection
        constrains to the RTLO reversed-extension CommandLine pattern, where the
        observed objective is the spawned process chain and its egress (per the
        behavioral chain), not in-process DLL loading. Under the 18-question cap
        the higher-value cross-logsource pivot for this delivery-to-egress chain
        is network_connection (authored as attack:T1218.014.network_connection),
        and post-execution mmc behavior is covered by cue_process_tool.follow_on
        and masquerading.renamed_binary_activity. No image_load question authored.
