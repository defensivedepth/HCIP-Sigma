        registration / activation that some .msc abuse uses. This rule fires on
        RTLO-disguised .msc filenames executed by mmc.exe via the command line,
        not on COM hijack or CLSID registration, so registry writes are not part
        of this detection's pattern. The behavioral objective is captured by the
