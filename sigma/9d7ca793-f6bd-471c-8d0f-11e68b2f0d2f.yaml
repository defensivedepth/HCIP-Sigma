name: Computer System Reconnaissance Via Wmic.EXE
id: 82c5956b-74b8-48a4-ba0e-57eaa9b9a803
description: |
  Detects wmic.exe (matched by image name or original filename) run with the "computersystem" alias, which returns host facts such as the joined domain, logged-on username, manufacturer, and model. This is a quick, native way to profile a machine and is run both by legitimate inventory and support tooling and by operators orienting themselves immediately after gaining access, before moving to credential access or lateral movement. The investigation should decode exactly what the wmic invocation asked for, confirm what spawned it (an interactive shell and a routine admin look very different from wmiprvse.exe driving a remote query), and determine whether this user and host normally run this kind of discovery or whether it sits inside a burst of other reconnaissance.
type: detection
detection_id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- source: template:universal.verify_trigger_match
  question: Does this match the rule — wmic.exe run with the "computersystem" argument?
  context: Confirm the alert before investing time. The rule fires when the image name ends in wmic.exe (or its original filename is wmic.exe, catching a renamed copy) and the command line contains "computersystem". Read the full command line and confirm the computersystem query, and note whether the operator went further (for example computersystem get domain, or chaining into other classes).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run administrative discovery commands?
  context: Network administrators, help desk, and inventory tooling legitimately query computer system facts. Standard users rarely run wmic computersystem by hand. Whether the account is interactive or a service principal also matters — a SYSTEM or computer-account context that suddenly runs ad-hoc discovery is more interesting than a known admin doing inventory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes hands-on activity. This surfaces direct attempts to disable AV/EDR services, flip Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the writing process and its signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What did this wmic invocation actually query, and did it go beyond reading computersystem facts?
  context: Decode the full command line. computersystem get domain / username / model is straightforward host profiling, but the same wmic process can be pointed at other classes or used to execute (wmic process call create) or to reach a remote host (the /node switch). Look for those extensions and for an output redirection to a file or share, which would suggest results were being staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this wmic command, and is that a normal pattern?
  context: A wmic computersystem query launched from cmd.exe under explorer.exe (an admin at a console) or from an inventory script is routine. The same query spawned by wmiprvse.exe points to remote WMI execution against this host, and a parent of winword.exe, mshta.exe, wscript.exe, or a PowerShell cradle points to automated post-exploitation enumeration. The parent's own command line tells you which case you are in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this wmic invocation spawn afterward?
  context: A plain computersystem query rarely spawns children. If wmic was used to execute (process call create) or kicked off follow-on tooling, the children reveal the real intent — a new cmd.exe or powershell.exe, a dropped binary, or further discovery utilities turn a benign-looking inventory query into a step in hands-on activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1047.wmi_activity
  question: Do the WMI activity logs show other WMI operations on this host around the alert, especially event subscriptions or remote queries?
  context: WMIC is one face of WMI; the WMI activity log records the broader picture. Look for permanent event subscriptions (filter-to-consumer bindings), which are a WMI persistence mechanism, and for provider activity tied to a remote caller, which indicates the query came in over the network rather than from a local console. If WMI activity logging is not collected in this environment, treat the absence as a visibility gap rather than evidence that only the single computersystem query ran.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Operation
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A lone computersystem query may be routine inventory, but several discovery commands in quick succession — whoami, net user, nltest, systeminfo, ipconfig — is the signature of post-compromise orientation. The reference behavior pairs wmic computersystem with whoami and net user as a first-look enumeration set, so a surrounding burst raises the likelihood this query is one step in an intrusion rather than a one-off lookup.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:lolbin.technique_class_lateral
  question: Were other proxy-execution or download LOLBins used on this host recently?
  context: Operators who lean on one living-off-the-land binary usually use several. Beyond the recon set, look for the proxy-execution and download LOLBins — certutil, rundll32, regsvr32, mshta, bitsadmin, msbuild — that move from orientation to fetching and running a payload. Several of these in the same day on the same host strengthens the case that the computersystem query was an early step rather than isolated administration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around this time?
  context: Orientation is often followed by establishing a foothold. After running discovery, operators commonly install persistence with schtasks, sc, reg, at, or bitsadmin — and wmic itself can register an event subscription. Several persistence tool executions clustered around the recon query indicate intentional staging rather than isolated administrative work.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was wmic.exe executed from its expected System32 / SysWOW64 path?
  context: The rule matches on original filename as well as image name, so a copied or renamed wmic will still fire. A wmic running from a user temp directory, ProgramData, or another non-standard path — rather than System32 or SysWOW64 — suggests the binary was staged to dodge path-based allowlists, which raises the priority of an otherwise routine-looking query.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host run the wmic computersystem pattern over the past 90 days, and what command structures are typical?
  context: A computersystem query with no prior history on a host is more notable than one that runs daily under a stable inventory routine. This mirrors the rule's exact pattern scoped to this host, so the count reflects the rule's specific firing (not all wmic usage), and the command-line projection lets you compare the historical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: computersystem
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: computersystem
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: computersystem
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user ran discovery or other tooling on other hosts in the same window, the scope is larger than a single machine. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: computersystem
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts run the wmic computersystem pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where the computersystem query fired. Many hosts running it points to scripted inventory or vendor automation; one host or a small unrelated set points to manual operator activity. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: computersystem
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, credential access, exploitation of a public-facing service — may reveal the stages that preceded this discovery and help reconstruct the timeline. Discovery commands early in a timeline often mark the transition from initial access to hands-on activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1047
      name: Windows Management Instrumentation
      role: primary
  attack_chain_coverage:
    - stage: 1
      label: process_creation
      description: "wmic.exe is launched (the rule trigger)"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: command_execution
      description: "The WMI query executes — recover what was queried and whether it extended beyond computersystem"
      mapped_to: Q4
      source: template:cue_process_tool.mechanism_decode
    - stage: 3
      label: remote_connection
      description: "T1047 analytic correlates a network connection when WMI is remote. Not applicable to a local computersystem query; remote WMI (the /node: path) is surfaced via the parent chain (wmiprvse.exe) and the WMI activity log instead."
      mapped_to: Q5
      source: template:discovery_recon.discovery_parent_chain
  dimension_coverage:
    - dimension: time_correlation
      technique: T1047
      covered_by: Q18
      source: template:cue_host_context.precursor
      coverage_type: indirect
    - dimension: tuning_parameter
      technique: T1047
      covered_by: Q4
      source: template:cue_process_tool.mechanism_decode
      coverage_type: direct
    - dimension: user_context
      technique: T1047
      covered_by: Q2
      source: template:discovery_recon.discovery_user_context
      coverage_type: direct
  mutable_dispositions:
    - element: WMIQueryScope
      dimension: tuning_parameter
      specific_values: "\\root\\cimv2, \\root\\subscription"
      disposition: context
      target_question: Q7
      notes: "WMI namespaces are not in the process_creation event; the WMI-activity question (Q7) directs the analyst to event subscriptions in \\root\\subscription as the persistence-relevant scope."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only"
      disposition: context
      target_question: Q18
      notes: "No discrete value; correlation framing carried by the precursor timeline and the +/-15m recon-burst window."
    - element: UserContext
      dimension: user_context
      specific_values: "interactive vs SYSTEM / low-privileged"
      disposition: context
      target_question: Q2
      notes: "discovery_user_context (Q2) names the interactive-vs-service-principal distinction; the user_actor pair (Q13/Q14) carries the baseline under each case."
    - element: RemoteDestinationThreshold
      dimension: tuning_parameter
      specific_values: "unique remote hosts contacted via WMI in a window"
      disposition: context
      target_question: Q4
      notes: "Not applicable to a local computersystem query. mechanism_decode (Q4) notes the /node: switch as the remote-WMI tell; cross-host operator sweep is reachable via Q16 (clustering_svc)."
    - element: SuspiciousCommandPatterns
      dimension: tuning_parameter
      specific_values: "wmic process call, powershell Invoke-WmiMethod"
      disposition: context
      target_question: Q4
      notes: "mechanism_decode (Q4) explicitly tells the analyst to check whether the wmic process went beyond computersystem into process call create (execution)."
  dedup_decisions:
    - dropped: universal.host_user_context
      reason: "discovery_recon.discovery_user_context (Q2) is the more specific user-expectation question for a discovery rule; the template's own note says to prefer it and drop universal.host_user_context when both apply."
      kept: discovery_recon.discovery_user_context
    - dropped: cue_process_tool.process_chain
      reason: "discovery_recon.discovery_parent_chain (Q5) covers the parent question and is the load-bearing signal here — wmiprvse.exe as parent means remote WMI. Walking to the grandparent adds little for a single recon command."
      kept: discovery_recon.discovery_parent_chain
    - dropped: cue_process_tool.baseline
      reason: "Generic host+Image frequency of wmic is subsumed by the rule-specific host-pattern baseline (Q12), which counts only the computersystem pattern and projects command shapes."
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.baseline_deviation
      reason: "Both this and lolbin.historical_lolbin_baseline are REFLECTED host-pattern baselines of the same rule selection. Kept the lolbin version (must_include, 90d, projects CommandLine); the parent/user angle it omits is covered by Q5 (current parent) and Q14 (parent+binary baseline)."
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.clustering
      reason: "Host-wide tool clustering overlaps the recon-burst (Q8) and precursor alert timeline (Q18); a flat Image-only host listing would add noise without a new angle."
      kept: cue_host_context.precursor
    - dropped: cue_host_context.clustering
      reason: "Surrounding host activity is reached via the recon burst (Q8), persistence sweep (Q10), and precursor alerts (Q18); avoided a near-duplicate broad host-scope aggregation."
      kept: cue_host_context.precursor
  skipped_templates:
    - template: persistence_scope.file_based_persistence
      reason: "Recommended (not must_include). For a system-information discovery rule, file-based persistence drops are tangential; persistence_scope.process_based_persistence (Q10) covers the more relevant persistence-tool angle within the same window."
  reflection_overrides: []
  hint_dispositions:
    - hint: "LOLBin rule — check for renamed binary and other LOLBins achieving same objective"
      disposition: acted_on
      reason: >-
        lolbin.renamed_binary_check (Q11) checks whether wmic ran from its
        expected System32/SysWOW64 path, and lolbin.technique_class_lateral (Q9),
        adapted to proxy-execution/download LOLBins, surfaces the broader
        living-off-the-land toolkit beyond the recon set covered by Q8.
    - hint: >-
        logsource 'network_connection' (recommended by techniques: T1047) is not covered — pull in cue_network_endpoint.* or
        author a custom question with `category: network_connection`
      disposition: declined
      reason: >-
        The rule constrains the command line to "computersystem", a local
        system-information query that does not initiate a network connection.
        The T1047 network_connection analytic targets remote WMI execution
        (wmic /node: ... process call create), a syntax this rule does not match.
        Remote-origin and lateral pivots are still reachable: the parent chain
        (Q5) surfaces a wmiprvse.exe parent, the WMI activity question (Q7) flags
        remote-caller provider activity, and follow_on (Q6) catches any spawned
        network tooling. No compensating network_connection question was authored
        because there is no egress to scope it to.
    - hint: >-
        logsource 'wmi' (recommended by techniques: T1047) is not covered and no template family exists — author a custom question
        with `category: wmi`
      disposition: acted_on
      reason: >-
        Authored Q7 (attack:T1047.wmi_activity) with category: wmi, directing the
        analyst to the WMI activity log for event subscriptions (persistence) and
        remote-caller provider activity around the alert window.
  contextual_sets:
    included: []
    excluded:
      - id: ransomware_impact
