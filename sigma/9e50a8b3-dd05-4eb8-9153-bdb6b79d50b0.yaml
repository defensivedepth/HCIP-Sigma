name: Msxsl.EXE Execution
id: ee8289c6-9637-41ea-9889-2a93b9d2cb02
description: |
  Detects any execution of msxsl.exe, Microsoft's standalone command-line XSLT
  transformation utility. Because the XSL processor honors msxsl:script blocks
  containing inline C#/JScript/VBScript and XSLT's document() function can fetch
  remote content, msxsl.exe is a complete code-execution and download primitive
  that runs from a Microsoft-signed binary, which lets it proxy script execution
  past application-allowlisting controls. msxsl.exe is not installed by default
  and is deprecated, so its mere presence and execution are anomalous on modern
  systems; the investigation should determine what XML/XSL inputs were supplied,
  whether they reference local files or remote URLs, what the transform did, and
  whether the activity fits any expected administrative or developer use.
type: detection
detection_id: 9e50a8b3-dd05-4eb8-9153-bdb6b79d50b0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match what this rule detects — an execution of msxsl.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the triggering event. This
    rule fires on any process whose image path ends in msxsl.exe, regardless of arguments. Read the full image path and command
    line to see what XML and XSL inputs were passed and whether the binary is the genuine Microsoft utility.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run msxsl.exe at all?
  context: msxsl.exe ships separately from Windows and is deprecated in favor of the .NET XslTransform/XslCompiledTransform
    APIs, so legitimate use is rare and usually tied to a specific developer or build process. Knowing whether this user role
    and host function plausibly involve XSLT command-line tooling is often the fastest way to separate a true positive from
    a known, sanctioned workflow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What XML and XSL inputs did msxsl.exe process, and did the command line reference local files or remote URLs?
  context: The full command line reveals the operation. msxsl.exe takes XML and XSL paths as positional arguments; values beginning
    with http:// or https:// indicate the input was fetched remotely and processed in-process. An -o argument writes the transform
    output to disk (a download primitive), and an -o path containing a colon after the file name writes into an NTFS alternate
    data stream. Decode each argument to determine whether the inputs are local, remote, or a staged download.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned msxsl.exe, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Legitimate XSLT work is usually launched interactively or by
    a build/automation process. Unusual parents such as office applications, mshta.exe, wscript.exe, or a script interpreter
    suggest the execution was driven by a macro, loader, or hands-on operator rather than routine tooling.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1220.image_load
  question: Did msxsl.exe load a script engine module such as jscript.dll or vbscript.dll around the time of the alert?
  context: XSL abuse runs inline C#/JScript/VBScript through msxsl:script blocks, which causes the host process to load the
    corresponding scripting engine module. A module load of jscript.dll, jscript9.dll, or vbscript.dll by msxsl.exe is direct
    evidence that the transform carried executable script rather than a plain data transformation. If image-load telemetry
    is not ingested in this environment, treat zero results as a visibility gap and fall back to inspecting the XSL content
    itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        ImageLoaded|endswith:
          - \jscript.dll
          - \jscript9.dll
          - \vbscript.dll
      condition: selection
    fields:
      - ImageLoaded
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did msxsl.exe spawn afterward?
  context: The processes spawned by the transform reveal its actual impact. A legitimate XSLT run typically spawns nothing.
    Children such as cmd.exe, powershell.exe, certutil.exe, or a newly written executable indicate the embedded script reached
    code execution and moved into a follow-on stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host run msxsl.exe before, and how often?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Because msxsl.exe is
    not installed by default, zero or very low historical counts are expected and reinforce that this execution is anomalous;
    a steady prior history points to an established local workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run msxsl.exe, what parents and users normally drive that activity, and does the current
    alert fit that pattern?
  context: Even a rarely seen tool can have a routine local owner. This query mirrors the rule's selection scoped to this host,
    so the resulting parent/user distribution reflects how msxsl.exe has historically run here. A new parent process, an unexpected
    user account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msxsl.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the msxsl.exe execution?
  context: Script-proxy execution rarely stands alone. Activity surrounding the transform may reveal the download that staged
    the XML/XSL inputs, reconnaissance, privilege escalation, or persistence that provides broader context. The temporal correlation
    window around the alert is where the rest of the operation, if any, will show up.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: attack:T1220.tuning_parameter
  question: Did msxsl.exe fetch remote XML/XSL over the network or write transform output to disk via an -o argument?
  context: Remote XSL execution and the -o download variant turn msxsl.exe into an ingress and staging primitive. Command lines
    that reference http:// or https:// inputs, or that include -o to write the transformed result to a file path, are the high-risk
    invocations; an environment that uses msxsl.exe for sanctioned enterprise XSL transformations should reference a known
    small set of internal sources, so a remote URL or download-to-disk outside that set is the anomaly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_remote_or_output:
        CommandLine|contains:
          - 'http://'
          - 'https://'
          - ' -o '
      condition: selection and selection_remote_or_output
    fields:
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts run msxsl.exe in the past week, and does the cross-host distribution look like consistent automation
    or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of msxsl.exe executions. Many
    hosts running it points to a scripted deployment or vendor automation that staged the deprecated binary; a single host
    or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msxsl.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msxsl.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msxsl.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity on multiple endpoints. If the
    same user drove similar script-proxy execution on other hosts in this window, the scope of the activity is larger than
    a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msxsl.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential
    access, or a prior download — may reveal the stages that preceded this transform and help reconstruct the full timeline
    of how the msxsl.exe inputs were staged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering often precedes payload execution. This query surfaces direct attempts to disable AV/EDR services, flip
    Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful signal that protection looks
    healthy, though kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition
    toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
