        initiate its own outbound connections; a network_connection query scoped
        to expand's ProcessGuid would return nothing by construction. The cabinet's
        arrival over the network is a separate upstream process (a download cradle
        or share copy) surfaced by the parent chain (Q5) and the precursor alert
        timeline (Q17). No compensating network_connection question was authored
        because expand has no egress to scope it to.
