name: Potentially Suspicious Cabinet File Expansion
id: 75ca44d8-1ad3-4170-86ff-f8b4bbf2fad8
description: |
  Detects expand.exe run with the file-filter switch (-F:) where the command line references a path that is EITHER one of a set of suspicious or user-writable locations (Perflogs, ProgramData, Users\Public, Windows\Temp, AppData\Local\Temp, AppData\Roaming, Temporary Internet, or the \Admin$ and \C$ administrative shares) OR a user profile Favorites, Favourites, or Contacts folder; the known-good Dell UpdateService temp path is excluded. expand.exe is a signed Microsoft utility for decompressing cabinet (.cab) files, and administrators use it routinely, but it is also abused to unpack a downloaded or share-delivered cabinet containing batch scripts, loaders, and payloads into a staging directory before they are executed. The investigation should decode what cabinet was expanded and where its contents were written, confirm what process launched expand and whether that chain is expected, and look at the files dropped and what ran next.
type: detection
detection_id: 9f107a84-532c-41af-b005-8d12a607639f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- source: template:universal.verify_trigger_match
  question: Does this match the rule — expand.exe run with the (-F:) switch against a path in a suspicious or user-writable location?
  context: Confirm the alert before investing time. The rule fires when the image is expand.exe AND the command line carries the (-F:) file-filter switch AND the path references EITHER one of the listed suspicious or user-writable folders (Perflogs, ProgramData, Users\Public, Windows\Temp, AppData\Local\Temp, AppData\Roaming, Temporary Internet, or the \Admin$ / \C$ shares) OR a user profile Favorites / Favourites / Contacts folder — and the Dell UpdateService temp path is not present. Note which branch matched, because a cabinet read from or written to an admin share points to remote staging, while a user-profile Favorites path points to a different masquerade.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to expand cabinet files from these locations?
  context: Administrators and software-deployment tooling do legitimately expand cabinets, but usually into program or update directories, not into Perflogs, Users\Public, Temp, or a profile Favorites folder, and rarely by hand on an end-user workstation. Knowing whether this account and host have a reason to unpack cabinets to a user-writable or admin-share path is often the fastest way to separate routine maintenance from staging.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution, and the reference behavior for this technique pairs cabinet expansion with Defender exclusions added for the staged components. This surfaces direct attempts to disable AV/EDR services, flip Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the writing process and its signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What did this expand invocation extract, and from where to where?
  context: Decode the full command line. The (-F:) filter names which members to pull from the cabinet, the source argument is the .cab being expanded, and the destination argument is where the contents land. A cabinet read from an admin share or a downloaded path and expanded into Temp, ProgramData, or a profile folder is the staging pattern; note the destination directory because that is where the files written by the expansion should appear.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned expand.exe, and is that parent chain expected?
  context: A cabinet expansion launched from a setup or deployment script is routine; the same expand spawned by a cmd.exe one-liner from an Office macro, a wscript/cscript JavaScript loader, or a PowerShell download cradle is the delivery pattern seen with cabinet-borne loaders. The parent's own command line shows whether a script chain or downloader handed off to expand, and walking up from there reconstructs how the cabinet arrived.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.extracted_payload
  question: What files did expand.exe write to disk, and where did they land?
  context: The output of the expansion is the real artifact. Cabinet-borne loaders unpack batch scripts, encrypted configs, loader DLLs, and the next-stage executable into the destination directory. Reviewing what expand wrote shows whether the contents look like a legitimate driver/update package or like staged tooling (multiple .bat files, a renamed executable, a .dll plus an .ini config), and gives concrete file paths to pivot on for execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:cue_process_tool.follow_on
  question: What did expand.exe spawn afterward, and what executed the files it dropped?
  context: expand itself only decompresses, so the impact comes from what runs the unpacked contents. Children of the expand process, or a closely following cmd.exe, rundll32.exe, regsvr32.exe, or schtasks registering the staged binary, turn a file drop into execution. A burst of activity referencing the same destination directory immediately after the expansion is the strongest sign the cabinet was a delivery vehicle.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were other decompression or proxy-execution LOLBins used on this host recently?
  context: Operators who stage with one living-off-the-land binary usually use several. Alongside expand, look for the other decode/decompress tools (certutil, extrac32, makecab, esentutl, replace) and the proxy-execution binaries (rundll32, regsvr32, mshta, msbuild, installutil, msiexec) that would run an unpacked payload. Several of these in the same day on the same host strengthens the case that the cabinet expansion was one step in a delivery chain rather than routine maintenance.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\esentutl.exe'
          - '\replace.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\cmstp.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was expand.exe executed from its expected System32 / SysWOW64 path, and is it the genuine signed binary?
  context: The genuine expand.exe is a signed Microsoft utility under System32 / SysWOW64. A copy running from a user temp directory, ProgramData, or a profile folder — or one whose original filename is not EXPAND.EXE — suggests the binary was staged alongside the payload to dodge path-based allowlists, which raises the priority of the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the suspicious expand pattern over the past 90 days, and what command structures are typical?
  context: A suspicious-location cabinet expansion with no prior history on a host is more notable than one that recurs under a stable deployment routine. This mirrors the rule's exact pattern scoped to this host, so the count reflects the rule's specific firing (not all expand usage), and the command-line projection lets you compare the historical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        Image|endswith: \expand.exe
        CommandLine|contains|windash: '-F:'
      selection_folders_1:
        CommandLine|contains:
        - :\Perflogs\
        - :\ProgramData
        - :\Users\Public\
        - :\Windows\Temp\
        - \Admin$\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
        - \C$\
        - \Temporary Internet
      selection_folders_2:
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      filter_optional_dell:
        ParentImage: C:\Program Files (x86)\Dell\UpdateService\ServiceShell.exe
        CommandLine|contains: C:\ProgramData\Dell\UpdateService\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_cmd and 1 of selection_folders_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        Image|endswith: \expand.exe
        CommandLine|contains|windash: '-F:'
      selection_folders_1:
        CommandLine|contains:
        - :\Perflogs\
        - :\ProgramData
        - :\Users\Public\
        - :\Windows\Temp\
        - \Admin$\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
        - \C$\
        - \Temporary Internet
      selection_folders_2:
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      filter_optional_dell:
        ParentImage: C:\Program Files (x86)\Dell\UpdateService\ServiceShell.exe
        CommandLine|contains: C:\ProgramData\Dell\UpdateService\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_cmd and 1 of selection_folders_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        Image|endswith: \expand.exe
        CommandLine|contains|windash: '-F:'
      selection_folders_1:
        CommandLine|contains:
        - :\Perflogs\
        - :\ProgramData
        - :\Users\Public\
        - :\Windows\Temp\
        - \Admin$\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
        - \C$\
        - \Temporary Internet
      selection_folders_2:
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      filter_optional_dell:
        ParentImage: C:\Program Files (x86)\Dell\UpdateService\ServiceShell.exe
        CommandLine|contains: C:\ProgramData\Dell\UpdateService\Temp\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_cmd and 1 of selection_folders_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user staged or expanded content on other hosts in the same window, the scope is larger than a single machine. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        Image|endswith: \expand.exe
        CommandLine|contains|windash: '-F:'
      selection_folders_1:
        CommandLine|contains:
        - :\Perflogs\
        - :\ProgramData
        - :\Users\Public\
        - :\Windows\Temp\
        - \Admin$\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
        - \C$\
        - \Temporary Internet
      selection_folders_2:
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      filter_optional_dell:
        ParentImage: C:\Program Files (x86)\Dell\UpdateService\ServiceShell.exe
        CommandLine|contains: C:\ProgramData\Dell\UpdateService\Temp\
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_cmd and 1 of selection_folders_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the suspicious expand pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where the suspicious cabinet expansion fired. Many hosts running it at once points to a pushed package or Group-Policy-delivered cabinet; one host or a small unrelated set points to manual operator activity. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        Image|endswith: \expand.exe
        CommandLine|contains|windash: '-F:'
      selection_folders_1:
        CommandLine|contains:
        - :\Perflogs\
        - :\ProgramData
        - :\Users\Public\
        - :\Windows\Temp\
        - \Admin$\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
        - \C$\
        - \Temporary Internet
      selection_folders_2:
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      filter_optional_dell:
        ParentImage: C:\Program Files (x86)\Dell\UpdateService\ServiceShell.exe
        CommandLine|contains: C:\ProgramData\Dell\UpdateService\Temp\
      condition: selection_cmd and 1 of selection_folders_* and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a download cradle, a macro-spawned shell, defense tampering, or Group Policy modification — may reveal how the cabinet arrived and help reconstruct the timeline that led to the expansion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1218
      name: System Binary Proxy Execution
      role: primary
  attack_chain_coverage:
    - stage: 1
      label: signed_binary_invocation
      description: "expand.exe (a trusted signed binary) is run with the -F: switch against a suspicious path (the rule trigger)"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 1
      label: command_decode
      description: "Recover the source cabinet, the member filter, and the destination directory"
      mapped_to: Q4
      source: template:cue_process_tool.mechanism_decode
    - stage: 2
      label: payload_staging
      description: "The cabinet contents are written to disk — the staged payload"
      mapped_to: Q6
      source: attack:T1218.extracted_payload
    - stage: 3
      label: payload_execution
      description: "The unpacked files are executed by a following process"
      mapped_to: Q7
      source: template:cue_process_tool.follow_on
  dimension_coverage:
    - dimension: command_analysis
      technique: T1218
      covered_by: Q4
      source: template:cue_process_tool.mechanism_decode
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1218
      covered_by: Q5
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1218
      covered_by: Q9
      source: template:lolbin.renamed_binary_check
      coverage_type: direct
  mutable_dispositions:
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "explorer.exe / deployment scripts (benign) vs cmd from Office macro, wscript/cscript, powershell cradle (suspicious)"
      disposition: context
      target_question: Q5
      notes: "process_chain is parent-entity scoped; the abnormal-parent profile is named in context rather than filtered, since the question must surface whatever the parent actually is."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "expand.exe is the trusted signed binary; a renamed/relocated copy is not"
      disposition: query_injection
      target_question: Q9
      notes: "renamed_binary_check (Q9) projects Image + OriginalFileName so the analyst can confirm the genuine signed expand vs a staged copy."
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "source cabinet path, member filter, destination directory"
      disposition: context
      target_question: Q4
      notes: "mechanism_decode (Q4) directs the analyst to recover the cabinet source, the -F: member filter, and the destination; the destination ties to the dropped-files question (Q6)."
    - element: RemoteDomainAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only (network suppression)"
      disposition: context
      target_question: Q5
      notes: "Not applicable — expand operates on a local or SMB-redirected cabinet and makes no outbound connection (see the declined network_connection hint). Upstream download is reached via the parent chain (Q5) and precursor (Q17)."
  dedup_decisions:
    - dropped: cue_process_tool.baseline
      reason: "Generic host+Image frequency of expand is subsumed by the rule-specific host-pattern baseline (Q10), which counts only the suspicious-expand pattern and projects command shapes."
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.baseline_deviation
      reason: "Both this and lolbin.historical_lolbin_baseline are REFLECTED host-pattern baselines of the same rule selection. Kept the lolbin version (must_include, 90d, projects CommandLine); the current parent is covered by Q5 and the historical parent+binary by Q12."
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.clustering
      reason: "Host-wide tool clustering overlaps the LOLBin sweep (Q8) and precursor alert timeline (Q17); a flat Image-only host listing would add noise without a new angle."
      kept: cue_host_context.precursor
    - dropped: cue_host_context.clustering
      reason: "Surrounding host activity is reached via the LOLBin sweep (Q8), dropped-files (Q6), follow_on (Q7), and precursor alerts (Q17); avoided a near-duplicate broad host-scope aggregation."
      kept: cue_host_context.precursor
  skipped_templates: []
  reflection_overrides: []
  hint_dispositions:
    - hint: "LOLBin rule — check for renamed binary and other LOLBins achieving same objective"
      disposition: acted_on
      reason: >-
        lolbin.renamed_binary_check (Q9) confirms expand ran from its expected
        signed path, and lolbin.technique_class_lateral (Q8), adapted to the
        decompression and proxy-execution classes, surfaces the broader staging
        toolkit (certutil, extrac32, makecab, rundll32, regsvr32, mshta, etc.).
    - hint: >-
        logsource 'image_load' (recommended by techniques: T1218) is not covered — pull in cue_image_load.* or author a custom
        question with `category: image_load`
      disposition: declined
      reason: >-
        expand.exe's role in this rule is cabinet decompression to disk, not
        in-memory module loading; its own loaded modules are not the signal.
        The meaningful proxy-execution artifact is the file expand writes — the
        staged payload — which Q6 (attack:T1218.extracted_payload, category:
        file_event) covers directly, and the subsequent loader (rundll32/regsvr32
        of an unpacked DLL) is reachable via follow_on (Q7) and the LOLBin sweep
        (Q8). No image_load question on expand would add precision.
