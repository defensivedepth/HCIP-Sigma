    - template: powershell.encoded_command_decode
      reason: "powershell_ise.exe/powershell.exe are 2 of 11 children with no CommandLine constraint in the rule. attack:T1218.command_analysis already directs encoded-payload decode for the powershell case; a dedicated encoded-command question would idle on the other 9 fires."
    - template: powershell.script_block_logging
      reason: "powershell is only 2 of 11 possible children; script-block coverage would idle on the non-powershell fires. Child decode covers the powershell case."
    - template: powershell.powershell_security_bypass
