      reason: "replaced_by: scheduled_task.task_configuration (per template). Phase-2 decode authored as attack:T1218.command_analysis covering all 11 child binaries, not only schtasks."
    - template: scheduled_task.task_configuration
      reason: "schtasks.exe is only 1 of 11 possible children; the rule is a parent-child proxy/lateral-movement detection, not a scheduled-task rule. A schtasks-specific decode would not fit the 10 non-schtasks fires. attack:T1218.command_analysis decodes whichever child ran."
    - template: scheduled_task.task_trigger_and_timing
