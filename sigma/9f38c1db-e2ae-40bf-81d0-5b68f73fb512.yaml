      kept: template:parent_child.parent_process_legitimacy
    - dropped: cue_user_actor.clustering / clustering_svc
      reason: "user_actor is a secondary cue; baseline pair (user-pivot + service-principal substitute) carries the user dimension. Network-wide right-now clustering would duplicate lateral_movement.target_activity_after_access and cue_parent_process.scope for this parent-child rule."
      kept: template:cue_user_actor.baseline + cue_user_actor.baseline_svc
    - dropped: cue_user_actor.baseline pair note
