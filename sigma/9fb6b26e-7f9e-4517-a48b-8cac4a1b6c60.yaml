name: Uncommon FileSystem Load Attempt By Format.com
id: 39a4dfb7-0426-4426-86c2-b4b16700d4c9
description: |
  Detects format.com run with a /fs: filesystem argument that is not one of the standard filesystems
  (exFAT, FAT, NTFS, ReFS, UDF). When format.com receives a /fs:FILESYSTEM value, it attempts to load a
  DLL named "U" + FILESYSTEM (for example /fs:foo loads Ufoo.dll) using the default search path, so an
  attacker-supplied filesystem name becomes a way to load an arbitrary DLL through a signed system binary.
  Legitimate disk formatting always uses a known filesystem name, so a non-standard value points to either
  a typo, an unusual third-party filesystem, or deliberate proxy DLL loading; the investigation should
  determine which DLL the value resolves to, whether that DLL exists on disk, and what spawned format.com.
type: detection
detection_id: 9fb6b26e-7f9e-4517-a48b-8cac4a1b6c60
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: 'Does the command line show format.com with a /fs: value that is not one of the standard filesystems?'
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reading the exact
    command line. The rule fires when the Image ends in \format.com AND the command line contains the
    /fs: prefix AND the value after that prefix is none of exFAT, FAT, NTFS, ReFS, or UDF. Note the exact
    filesystem string, because that value (prefixed with "U" and suffixed with .dll) is the DLL format.com
    will attempt to load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to format disks or run format.com at all?
  context: Legitimate disk formatting is an administrative action tied to provisioning, removable media,
    or storage maintenance. Knowing whether the user role and host function involve disk formatting is
    often the fastest way to separate a routine operation from misuse of the binary as a DLL loader.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: 'What DLL name does the /fs: value resolve to, and what else did format.com do?'
  context: >-
    The filesystem string after the /fs: prefix is transformed into a DLL name by prepending "U" and
    appending ".dll" (for example /fs:abc resolves to Uabc.dll), which format.com loads from the default
    search path. Read the full command line to extract the non-standard value, derive the resulting DLL
    name, and check whether the same host ran format.com with other arguments around this time as part of
    one operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned format.com and is that parent chain expected?
  context: The parent process reveals how format.com was invoked. Interactive disk maintenance is usually
    launched from explorer.exe or a console, while parents such as script hosts, office applications, or
    other interpreters point to scripted or exploited invocation rather than an administrator formatting
    a disk.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did format.com spawn afterward?
  context: >-
    A DLL loaded through the /fs: value can execute code in the context of format.com, so processes spawned
    shortly after the alert reveal the actual impact. Children such as cmd.exe, powershell.exe, or
    certutil.exe suggest post-load activity rather than a routine format that simply exits.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run format.com?
  context: >-
    A binary that has never been seen on a host is more notable than one that runs regularly. Zero or very
    low historical counts of format.com on this host indicate first-time or rare execution, which raises
    the weight of the non-standard /fs: value.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive
    it, and does the current alert fit?
  context: >-
    Even a signed system binary can be abused. This query mirrors the rule's selection and filter structure
    scoped to this host, so the resulting parent and user distribution reflects how this specific
    non-standard /fs: pattern (not generic format.com use) has run here. A new parent process or an
    unexpected user account is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \format.com
        CommandLine|contains: '/fs:'
      filter_main_known_fs:
        CommandLine|contains:
        - /fs:exFAT
        - /fs:FAT
        - /fs:NTFS
        - /fs:ReFS
        - /fs:UDF
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run format.com across the environment?
  context: Compare this user's current action against their historical pattern. A user who has never run
    format.com is more notable than one who formats disks routinely, and the user's role should align with
    storage or provisioning duties for this to be expected behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and format.com combination historically routine on this host or across the
    environment, or is the parent unusual for this binary?
  context: When the alert fires under a service or computer account, user identity does not attribute the
    behavior, so the meaningful pivot is the launch mechanism. A new or rare parent for format.com on this
    host or environment-wide is the deviation worth chasing; a pair that already accounts for many prior
    events is likely OS or vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity elsewhere in this window, the scope of
    the operation may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and format.com combination fire on other hosts in the same window, or is
    the activity isolated to this host?
  context: Under a service or computer account, the user pivot returns agent-telemetry noise that every
    host generates constantly. The meaningful question is whether the same launch mechanism — the parent
    process spawning format.com — fired on other hosts in the alert window. Multiple hosts point to pushed
    or scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Defense-evasion DLL loading rarely occurs in isolation. Activity surrounding the format.com
    execution may reveal reconnaissance, privilege escalation, persistence installation, or staging that
    provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, or persistence mechanisms appearing as novel parent-child
    pairs.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the stages that preceded this event and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: >-
    This query mirrors the rule's selection and filter structure with no host scope, so the result is a
    fleet-wide count of the non-standard /fs: pattern rather than generic format.com usage. Many hosts
    firing the same pattern points to scripted deployment or an unusual third-party filesystem driver in
    use; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \format.com
        CommandLine|contains: '/fs:'
      filter_main_known_fs:
        CommandLine|contains:
        - /fs:exFAT
        - /fs:FAT
        - /fs:NTFS
        - /fs:ReFS
        - /fs:UDF
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
