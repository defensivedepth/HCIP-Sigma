name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
id: 8fb4a4f4-02fb-436d-ba23-b909abd5cddb
description: |
  Detects execution of the 7-Zip utility (7z.exe, 7zr.exe, 7za.exe, identified by Image name, OriginalFileName, or a 7-Zip
  product description) with a command line that both adds or updates an archive (' a ' or ' u ') and applies a password (' -p').
  Compressing collected data into a password-protected archive is a common precursor to exfiltration: the password prevents
  inspection of the contents in transit, and the archive consolidates data for a single transfer. The same command line is
  routine for backups, software packaging, and log bundling, so the investigation should determine what was archived, where
  the output went, whether the activity fits the user and host, and whether any outbound transfer followed.
type: detection
detection_id: 9fbf5927-5261-4284-a71d-f681029ea574
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the rule's pattern — a 7-Zip binary adding or updating an archive with a password set?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when all three conditions
    hold together — the binary is 7-Zip (by Image, OriginalFileName, or product description), the command line contains an add
    (' a ') or update (' u ') action, and a password flag (' -p') is present. Review the exact command line and binary identity
    against these criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
  answer_sources:
  - alert
  - process_creation
- source: template:universal.host_user_context
  question: Is this user and host expected to create password-protected archives with 7-Zip?
  context: Legitimate administrative activity, backups, and software packaging routinely produce password-protected archives.
    Knowing whether the user role and host function are consistent with archiving collected data is often the fastest path
    to distinguishing routine operations from staging for exfiltration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the 7-Zip command do? Decode the archive name, action, password flag, and any included paths.
  context: The full command line reveals the specific archive operation. Decode the action (' a ' add, ' u ' update), the output
    archive name and path, the ' -p' password flag (and whether the password follows the flag inline or is supplied separately),
    and the source files or wildcards passed for inclusion. Multiple sequential 7-Zip invocations on this host may together
    form a single staging operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- source: template:data_staging_exfil.encryption_password
  question: Was password protection or header encryption applied, and how was the password supplied?
  context: Attackers apply passwords to archives to prevent security tooling from inspecting contents during exfiltration.
    The rule already requires the ' -p' flag; determine whether header encryption (-mhe=on, which also hides the filenames
    inside the archive) was set, and whether the password is visible inline after ' -p' or was passed via stdin or a config
    file where it will not appear in the command line. Header encryption combined with a planned transfer is a stronger indicator
    of deliberate data theft than a plain password.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- source: template:data_staging_exfil.data_scope
  question: What files or directories were selected for archiving?
  context: 'The targeted data determines severity. The command line and the files the tool actually touched reveal the scope:
    specific file types (documents, spreadsheets, source code), sensitive directories (finance, HR, or file-share paths), or
    broad wildcards indicating bulk collection. The CurrentDirectory often reveals the data source location. The breadth of
    targeted data determines potential data loss and which business units need notification.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - process_creation
  - file_event
- source: attack:T1560.001.tuning_parameter
  question: What is the resulting archive — its extension and size — and was it written to a temporary or staging directory?
  context: The analytic flags high-risk archive extensions (.7z, .zip, .cab, .rar) and uses an archive-size threshold to separate
    bulk collection from benign small compressions. A large archive written to a temporary, public, or user-profile staging
    path is more consistent with collection-for-exfiltration than a small archive written next to the source data. Note the
    output size and location to calibrate severity.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      filter_ext:
        TargetFilename|endswith:
          - '.7z'
          - '.zip'
          - '.rar'
          - '.cab'
      condition: selection and filter_ext
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- source: attack:T1560.001.obfuscation_check
  question: Did this host load the encryption library crypt32.dll into the 7-Zip process around the time of the alert?
  context: Encryption of archived data is performed through the Windows cryptographic library crypt32.dll; anomalous loading
    of that library by an archiving utility is one of the analytic's signals for encryption-for-exfiltration. A module-load
    record for crypt32.dll in the 7-Zip process around the alert corroborates that contents were encrypted rather than merely
    compressed. If image-load events are not collected in this environment, treat zero results as a visibility gap rather than
    evidence no encryption occurred.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        ImageLoaded|endswith: '\crypt32.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
  answer_sources:
  - manual_review
- source: attack:T1560.001.process_identification
  question: Is the 7-Zip binary a genuine, signed 7-Zip executable, or a renamed or relocated copy running from an unusual path?
  context: 'The rule matches on binary name, OriginalFileName, or a 7-Zip product description, any of which a renamed binary
    can carry. Confirm the alerting executable: its on-disk path (a packaged install under Program Files versus a copy dropped
    into a temporary, public, or user-writable directory), its signing status and signer, and whether its OriginalFileName
    matches its current name. A 7-Zip-identified binary running from an unexpected location or unsigned is the process-identity
    deviation worth chasing.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- source: template:data_staging_exfil.archive_destination
  question: Where was the archive moved after creation, and was any outbound transfer seen from this host?
  context: Data staging typically creates an archive locally, then moves it to a staging location or transfers it off the host.
    Check for subsequent file moves or copies of the archive and for outbound network connections from the same host in the
    window after creation, which reveal whether data was uploaded, copied to removable media, or sent to an external host.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - network_connection
- source: template:cue_process_tool.process_chain
  question: What process spawned 7-Zip, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. User-driven archiving typically descends from explorer.exe
    or a console shell launched interactively; scripted staging often descends from script hosts (wscript.exe, cscript.exe,
    powershell.exe), Office applications, or a remote-execution service. An unexpected parent for a password-protected archive
    operation reframes the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_process_tool.baseline
  question: Does this host normally run 7-Zip?
  context: A binary that has never run on a host is more suspicious than one that runs regularly. Zero or very low historical
    counts over 90 days indicate first-time or rare execution of 7-Zip here, which raises the weight of the other findings;
    high counts suggest 7-Zip is an established tool on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this archive-with-password pattern, what parents and users drove it, and does the
    current alert fit that history?
  context: Even common tools can be abused. This query mirrors the rule's full selection (7-Zip identity, add/update action,
    password flag) scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern
    — not generic 7-Zip usage — has historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Description|contains: 7-Zip
      - Image|endswith:
        - \7z.exe
        - \7zr.exe
        - \7za.exe
      - OriginalFileName:
        - 7z.exe
        - 7za.exe
      selection_password:
        CommandLine|contains: ' -p'
      selection_action:
        CommandLine|contains:
        - ' a '
        - ' u '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Description|contains: 7-Zip
      - Image|endswith:
        - \7z.exe
        - \7zr.exe
        - \7za.exe
      - OriginalFileName:
        - 7z.exe
        - 7za.exe
      selection_password:
        CommandLine|contains: ' -p'
      selection_action:
        CommandLine|contains:
        - ' a '
        - ' u '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Description|contains: 7-Zip
      - Image|endswith:
        - \7z.exe
        - \7zr.exe
        - \7za.exe
      - OriginalFileName:
        - 7z.exe
        - 7za.exe
      selection_password:
        CommandLine|contains: ' -p'
      selection_action:
        CommandLine|contains:
        - ' a '
        - ' u '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or collection spanning multiple endpoints.
    If the same user staged archives on several hosts in this window, the scope of potential data loss is larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Description|contains: 7-Zip
      - Image|endswith:
        - \7z.exe
        - \7zr.exe
        - \7za.exe
      - OriginalFileName:
        - 7z.exe
        - 7za.exe
      selection_password:
        CommandLine|contains: ' -p'
      selection_action:
        CommandLine|contains:
        - ' a '
        - ' u '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Archiving rarely occurs in isolation when it is part of an operation. Examining activity around the alert reveals
    the immediate context: what data was gathered before the archive was built, what happened after, and whether reconnaissance,
    credential access, or staging surrounds the event.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, credential access, defense tampering, or collection from network
    shares — may reveal the attack stages that preceded the archiving and help reconstruct the timeline leading to staging
    for exfiltration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
