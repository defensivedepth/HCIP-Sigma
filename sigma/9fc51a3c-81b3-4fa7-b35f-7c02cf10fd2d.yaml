name: Usage Of Web Request Commands And Cmdlets
id: 558668fc-59eb-433a-bcf9-f016bf6a9bc1
description: |
  Detects a process command line that contains one of the built-in Windows and PowerShell ways to fetch remote content: Invoke-WebRequest and Invoke-RestMethod (and their iwr / irm / wget / curl aliases), Start-BitsTransfer and Resume-BitsTransfer, the [System.Net.WebRequest]::Create .NET call, and the WinHttp.WinHttpRequest COM object. These commands are routine for administrators pulling files from intranet mirrors or scripted installers, but they are also the core of PowerShell download cradles that pull a second-stage payload from an external host into a user-writable path and then execute it. The investigation should decode the command line to recover the source URL and the destination, confirm what process spawned the interpreter, and determine whether this user and host routinely run web-request commands or whether this is first-time activity tied to follow-on execution.
type: detection
detection_id: 9fc51a3c-81b3-4fa7-b35f-7c02cf10fd2d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain one of the web-request commands or cmdlets this rule detects?
  context: Confirm the alert before investing time. The rule fires when a process command line contains any of Invoke-WebRequest, Invoke-RestMethod, the iwr / irm / wget / curl aliases, Start-BitsTransfer, Resume-BitsTransfer, [System.Net.WebRequest]::create, or WinHttp.WinHttpRequest. Read the full command line and identify which command fired and which interpreter ran it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to download files with command-line tools?
  context: Legitimate administrative scripts, installers, and update routines fetch files with these same commands. Knowing whether this user's role and this host's function include scripted downloads is often the fastest way to separate routine activity from a download cradle. A developer workstation or a build server pulling files is different from a finance laptop running Invoke-WebRequest for the first time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did the web-request command actually do? Decode its full command line.
  context: The full command line reveals the operation. Recover the source URL (the -Uri or first positional argument) and the destination path (-OutFile or equivalent), the cmdlet or tool used, and note whether the download is piped straight into execution (for example Invoke-Expression of the response body). Scoping to all web-request commands on this host in the surrounding window captures multi-step sequences where one command fetches a file and a later one runs it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - '[System.Net.WebRequest]::create'
          - 'curl '
          - 'Invoke-RestMethod'
          - 'Invoke-WebRequest'
          - ' irm '
          - 'iwr '
          - 'Resume-BitsTransfer'
          - 'Start-BitsTransfer'
          - 'wget '
          - 'WinHttp.WinHttpRequest'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- source: template:powershell.encoded_command_decode
  question: Is the web-request command encoded or obfuscated, and what download cradle does it resolve to?
  context: These commands are often plain text and readable, in which case the analytical task is to identify the fetch-and-run pattern rather than to base64-decode. Look for the source URL behind Invoke-WebRequest / iwr / wget / curl or Start-BitsTransfer, whether the response is piped into Invoke-Expression for in-memory execution, and what local path a downloaded file lands in. When the command is wrapped in -EncodedCommand, string concatenation, or backtick escaping, decode it first to recover the same details, then check the source URL's reputation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. This surfaces direct attempts to disable AV/EDR services, flip Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the writing process and its signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.process_chain
  question: What process spawned this interpreter, and is that parent chain expected?
  context: The parent process shows how the web-request command was launched. Interactive admin sessions (explorer.exe) and scheduling services are routine parents; Office applications (winword.exe, excel.exe, outlook.exe), mshta.exe, wscript.exe, or cscript.exe spawning an interpreter that immediately fetches remote content is the macro-to-cradle pattern and is far more suspicious.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1059.001.network_egress
  question: Did this process make outbound network connections, and to what host or IP?
  context: A download cradle is only meaningful if it actually reaches out. Correlating the alerting process to its network connections recovers the real destination host, IP, and port, which matters when the URL in the command line is built from variables or otherwise obscured. Compare the destination against known-good update and mirror endpoints; an external or newly seen address that the command line did not plainly show is the signal to chase.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: attack:T1059.001.image_load
  question: Did the alerting process load the .NET HTTP or BITS assemblies that back these web-request commands?
  context: When the command line is obfuscated, the loaded modules are a corroborating signal that the cradle actually ran. PowerShell that performs a BITS transfer loads Microsoft.BackgroundIntelligentTransfer.Management.Interop.dll, and HTTP-based fetches pull in the System.Net.Http / System.Net assemblies. Matching one of these loads to the alerting process by image and time confirms execution beyond the command-line string; absence is not exoneration, since some fetch paths use already-loaded modules.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\Microsoft.BackgroundIntelligentTransfer.Management.Interop.dll'
          - '\System.Net.Http.dll'
          - '\System.Net.dll'
          - '\System.Net.Requests.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- source: template:cue_process_tool.follow_on
  question: What child processes did this process spawn afterward?
  context: The processes spawned after the fetch reveal what the downloaded content did. A web-request command followed by execution of a freshly written file, a new powershell.exe or cmd.exe, rundll32, regsvr32, or an installer is the fetch-then-run chain that separates a payload delivery from a benign file copy.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Windows Event ID 4104 records the deobfuscated script PowerShell actually executed, even when the command line is encoded or built from concatenated strings, giving ground truth about the download logic and any in-memory execution that followed. If PowerShell operational logging is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host shortly before this execution?
  context: Attackers commonly weaken PowerShell protections before pulling a payload — patching AMSI, setting an execution-policy bypass, or downgrading to v2 which lacks script block logging. Finding these precursor events in the hour before the web-request command strengthens the case that the download is part of an intrusion rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run these web-request commands, what parents and users normally drive that activity, and does the current alert fit?
  context: Even common download commands have a normal shape on a given host. This mirrors the rule's command pattern scoped to this host, so the resulting parent and user distribution reflects how web-request activity has historically run here — a scheduled task under a service account, an admin in an interactive session, a software-deployment agent. A new parent process, an unexpected user, or an unusual command shape against that baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[System.Net.WebRequest]::create'
        - 'curl '
        - Invoke-RestMethod
        - Invoke-WebRequest
        - ' irm '
        - 'iwr '
        - Resume-BitsTransfer
        - Start-BitsTransfer
        - 'wget '
        - WinHttp.WinHttpRequest
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run web-request commands across the environment?
  context: Compare this user's current action against their historical pattern. A user who has never run Invoke-WebRequest, BITS transfers, or curl is more suspicious than one whose role (developer, IT, build automation) routinely fetches files. This pivot is meaningful only when a real user account fired the alert; the launch-mechanism baseline alongside it carries the answer when the actor is a service or computer account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains:
          - '[System.Net.WebRequest]::create'
          - 'curl '
          - 'Invoke-RestMethod'
          - 'Invoke-WebRequest'
          - ' irm '
          - 'iwr '
          - 'Resume-BitsTransfer'
          - 'Start-BitsTransfer'
          - 'wget '
          - 'WinHttp.WinHttpRequest'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-interpreter combination historically routine on this host or across the environment?
  context: When the alert fires under a service or computer account, user identity does not attribute behavior, so the meaningful baseline is the launch mechanism — which parent process spawned this interpreter, and whether that pairing is historically common. A new or rare parent for this interpreter is the deviation worth chasing; a pairing that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user fetched content or ran tools on other hosts in the same window, the scope is larger than a single download. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-interpreter combination fire on other hosts in the same window?
  context: Under a service or computer account, asking what else the user did returns agent-telemetry noise. The meaningful question is whether the same launch mechanism — this parent process spawning this interpreter — fired on other hosts in the alert window. Multiple hosts at once points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts run these web-request commands in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This mirrors the rule's command pattern with no host scope, giving a fleet-wide count of where these web-request commands fired. Many hosts running the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[System.Net.WebRequest]::create'
        - 'curl '
        - Invoke-RestMethod
        - Invoke-WebRequest
        - ' irm '
        - 'iwr '
        - Resume-BitsTransfer
        - Start-BitsTransfer
        - 'wget '
        - WinHttp.WinHttpRequest
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the timeline that led to the web-request command.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
