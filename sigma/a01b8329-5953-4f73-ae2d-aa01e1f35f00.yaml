name: AspNetCompiler Execution
id: 76333dcd-8925-4da3-8eca-9be174167ca9
description: |
  Detects execution of aspnet_compiler.exe from the .NET Framework directories. This Microsoft-signed
  ASP.NET compilation utility can be abused to compile and run attacker-supplied C# code: when pointed
  with -p at a directory containing a crafted web.config that registers a custom buildProvider, the
  compiler loads and executes a local DLL under its own process, bypassing application-control policies.
  Legitimate use is rare outside build/developer systems, so the investigation should determine whether
  this host is a build host, what directory the compiler was pointed at, whether attacker-supplied
  web.config/DLL/App_Code artifacts are present, and whether the process spawned children or made
  outbound connections consistent with proxied code execution.
type: detection
detection_id: a01b8329-5953-4f73-ae2d-aa01e1f35f00
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match this rule — aspnet_compiler.exe running from a .NET Framework directory?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the full Image path and command line against the rule's criteria — the binary name ends in aspnet_compiler.exe and the Image path is under one of the Microsoft.NET\Framework directories. Note the -p target directory and -f output path in the command line, since they point at the content the compiler was asked to build.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to compile .NET applications?
  context: aspnet_compiler.exe is a developer/build utility that is rarely run on standard endpoints. If this is a build server or a developer workstation and the user is a developer or a CI/CD service account, the execution may be routine; on a general-purpose endpoint or under an unexpected user, it is far more likely to be proxy execution. Confirm the host's role and the user's function before proceeding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What directory was aspnet_compiler.exe pointed at, and what do its full arguments reveal?
  context: The full command line reveals the operation. Decode the -p (physical/source directory), -f (target output directory), -v (virtual path), and -u flags. A -p path under a user-writable location such as Desktop, Temp, AppData, or the public profile, rather than an IIS site root, is the abuse pattern — the compiler is being asked to build content the operator dropped, which can register a custom buildProvider and execute a local DLL.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned aspnet_compiler.exe, and is that parent chain expected?
  context: The parent process shows how the compiler was launched. A build pipeline, an IDE, or a service-control parent fits legitimate use; a parent such as an Office application, a script host, mshta.exe, an unexpected shell, or a freshly written binary points toward operator-driven proxy execution. Walk the chain up to see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did aspnet_compiler.exe spawn afterward?
  context: A trusted developer utility used for proxy execution frequently spawns follow-on processes that carry out the actual payload. Children such as powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, wscript.exe, or mshta.exe spawned by the compiler are a strong sign the build step was a delivery vehicle rather than a real compilation. Routine compilation typically spawns no such children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1127.image_load
  question: Did aspnet_compiler.exe load an unsigned or user-writable DLL?
  context: The proxy-execution technique works by registering a custom buildProvider in web.config that points at an attacker-supplied DLL (for example dropped in a bin\ subfolder); the compiler then loads that DLL and runs its GenerateCode override under its own process. A module loaded by aspnet_compiler.exe from a user-writable path, or that is unsigned or has an invalid signature, is the loaded payload. Legitimate compilation loads framework assemblies from system locations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- source: attack:T1127.payload_drop
  question: Were web.config, a bin\ DLL, or App_Code files written into the directory the compiler was pointed at?
  context: The abuse pattern requires a specific on-disk layout under the target directory — a web.config that registers the custom buildProvider, an App_Code file with the registered extension, and a bin\ DLL implementing the build provider. Files written into the compiler's -p directory shortly before or during execution, especially a web.config plus a bin\*.dll, are the staged payload. Scope the file query to the directories surfaced by the command-line decode.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        file.directory|contains|expand: '%file_dirs%'
      filter_config:
        file.name|endswith:
          - \web.config
          - .dll
          - .wtf
      condition: selection and filter_config
    fields:
      - file.path
      - Image
      - User
- source: attack:T1127.network_connection
  question: Did aspnet_compiler.exe make any outbound network connections?
  context: A compilation utility has no legitimate reason to initiate outbound network traffic. Proxied code running under aspnet_compiler.exe commonly reaches out to retrieve a second stage or to call back to operator infrastructure. Any outbound connection attributed to this binary is anomalous; review the destination address, port, and reputation, and treat rare or newly seen destinations as higher risk.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: Even on hosts where aspnet_compiler.exe runs occasionally, the parent/user distribution of prior firings shows the normal launch profile. The query mirrors the rule's selection scoped to this host, so the result reflects how this specific pattern has historically run here. A new parent process, an unexpected user account, or a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        Image|endswith: \aspnet_compiler.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment or build automation; a single host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        Image|endswith: \aspnet_compiler.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Proxy execution via a developer utility is usually one step in a larger sequence. Activity surrounding the alert may reveal reconnaissance, credential access, persistence, or staging that provides broader context for the disposition.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        Image|endswith: \aspnet_compiler.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        Image|endswith: \aspnet_compiler.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity elsewhere, the scope may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        Image|endswith: \aspnet_compiler.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded this event and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering often precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
