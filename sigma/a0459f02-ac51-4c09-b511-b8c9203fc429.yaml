name: Potential Process Execution Proxy Via CL_Invocation.ps1
id: d5cee792-dd39-408a-974d-9f38ad9bbe17
description: |
  Detects command lines containing "SyncInvoke ", a function exported by the Microsoft-signed
  diagnostic script CL_Invocation.ps1. That script is imported into a PowerShell session and its
  SyncInvoke function launches an arbitrary executable through System.Diagnostics.Process, letting
  an operator proxy execution of an untrusted binary behind a trusted, signed script (T1216, System
  Script Proxy Execution). Legitimate use is rare outside Windows diagnostics; investigation should
  determine what executable and arguments SyncInvoke launched, what spawned the PowerShell session,
  and whether the resulting child process is signed and expected.
type: detection
detection_id: a0459f02-ac51-4c09-b511-b8c9203fc429
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain the SyncInvoke call this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact command line against the rule's criterion. The rule fires when a command line contains the
    literal token "SyncInvoke " followed by a target. Read the full command line and identify the
    executable and arguments passed to SyncInvoke.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run Windows diagnostic scripts that proxy execution?
  context: Legitimate administrative or diagnostic activity can trigger this detection. CL_Invocation.ps1
    ships with Windows diagnostics, but interactive use of its SyncInvoke proxy function is uncommon.
    Knowing whether the user role and host function are consistent with diagnostic-script execution is
    often the fastest path to distinguishing a true positive from routine operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What executable and arguments did SyncInvoke launch? Decode the full command line.
  context: SyncInvoke takes a target executable and its arguments and runs them through
    System.Diagnostics.Process. The full command line reveals what was proxied. Decode any flags,
    encoded content, file paths, or URLs that follow the SyncInvoke token, and identify whether the
    target is a download cradle, a script interpreter, or an unsigned binary from a user-writable
    path. This query returns SyncInvoke command lines on this host within the window so multi-step
    operations are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'SyncInvoke '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1216.parent_process_analysis
  question: What process spawned the PowerShell session that ran SyncInvoke, and is that parent chain expected?
  context: The parent process reveals how the diagnostic script was imported and invoked. Interactive
    administrative use typically descends from explorer.exe or a console host. Parents such as
    mshta.exe, wscript.exe, cscript.exe, an Office application, or a service binary point to scripted
    or exploitation-driven invocation rather than a human running diagnostics.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1216.signed_to_unsigned_transition
  question: What child processes did the SyncInvoke session spawn, and are they signed and expected?
  context: SyncInvoke launches its target through System.Diagnostics.Process, so the proxied executable
    appears as a child of the alerting PowerShell process. The signed-script-to-unsigned-child
    transition is the core of this technique. Review what the session spawned and whether each child is
    a known signed binary or an unsigned payload from a user-writable directory.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1216.tuning_parameter
  question: Did the proxied child command line carry a download cradle or decode pattern?
  context: The payload SyncInvoke runs often pulls or decodes a second stage. This query surfaces
    child command lines on this host that match common download-cradle or decode markers so the
    analyst can judge whether the proxied execution led to network retrieval or in-memory decoding.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_payload:
        CommandLine|contains:
          - 'DownloadString'
          - 'DownloadFile'
          - 'DownloadData'
          - 'Invoke-WebRequest'
          - 'Invoke-RestMethod'
          - 'Net.WebClient'
          - 'BitsTransfer'
          - 'FromBase64String'
          - '-EncodedCommand'
          - '-enc '
          - 'frombase64'
      condition: selection_host and selection_payload
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has the SyncInvoke pattern run on this host before?
  context: A pattern that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts for SyncInvoke command lines indicate first-time or
    rare execution; recurring counts suggest a local diagnostic or automation that the analyst can
    characterize.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'SyncInvoke '
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the SyncInvoke pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine tooling can be abused. The query mirrors the rule's selection scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern has
    historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: 'SyncInvoke '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: 'SyncInvoke '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: 'SyncInvoke '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across
    multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of
    the event may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: 'SyncInvoke '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the SyncInvoke pattern in the past week, and does the distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide
    count of the SyncInvoke firing pattern rather than generic PowerShell usage. Many hosts firing the
    same pattern points to scripted deployment or vendor diagnostics; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: 'SyncInvoke '
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the stages that preceded this event and help
    reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
