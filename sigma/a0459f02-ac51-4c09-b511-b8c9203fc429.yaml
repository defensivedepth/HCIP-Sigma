  reflection_overrides: []
  hint_dispositions:
    - hint: "CommandLine-only detection — no Image field in rule. Use CommandLine pattern matching for scoping, not Image-based queries"
      disposition: acted_on
      reason: >-
        Acted on across all scoping queries. primary_binary is null, so every
        template that defaulted to Image|endswith|expand '%Image%' or
        ParentImage|endswith|expand '%Image%' was rewritten to scope on
        CommandLine|contains 'SyncInvoke ' (mechanism_decode Q3, baseline Q7,
        user baseline Q9, scope Q13) or on ParentProcessGuid for child discovery
        (Q5). Recorded here for the audit trail; outcome is a query rewrite, not
        a declined hint.
    - hint: "logsource 'file_event' (recommended by techniques: T1216) is not covered — pull in cue_artifact.* or author a custom question with category: file_event"
      disposition: declined
      reason: >-
        Rule's detection is CommandLine|contains 'SyncInvoke ' on
        process_creation with no file reference (has_file_reference false). The
        proxied payload SyncInvoke launches is observable as a child process via
        ParentProcessGuid (Q5, signed_to_unsigned_transition) and its
        cradle/decode behavior via Q6, both on process_creation. No dropped-file
        artifact is part of this technique's invocation, so a file_event query
        keyed on %file_paths% would have no scoping anchor and return host-wide
        file noise. No compensating attack:T1216.file_event question authored.
    - hint: "logsource 'image_load' (recommended by techniques: T1216) is not covered — pull in cue_image_load.* or author a custom question with category: image_load"
      disposition: declined
      reason: >-
        image_load would surface the .NET assemblies loaded by the PowerShell
        host, but the rule fires on the SyncInvoke command-line token, not on a
        module load, and the .NET hosting modules (System.Management.Automation,
        clr.dll) load on every PowerShell session — image_load on this binary
        returns volume without precision for the proxy behavior. The proxied
        execution is captured with precision via the child process Q5 and its
        payload markers Q6. No compensating attack:T1216.image_load question
        authored.
    - hint: "logsource 'process_access' (recommended by techniques: T1216) is not covered and no template family exists — author a custom question with category: process_access"
      disposition: declined
      reason: >-
        process_access (handle/memory access) is relevant to T1216 variants that
        inject into a target, but CL_Invocation.ps1's SyncInvoke launches a new
        child process via System.Diagnostics.Process rather than accessing an
        existing process's memory. The investigative signal is the spawned child
        (Q5) and its command line (Q6), not a cross-process access mask. A
        process_access query would have no target-process anchor for this rule.
        No compensating attack:T1216.process_access question authored.
