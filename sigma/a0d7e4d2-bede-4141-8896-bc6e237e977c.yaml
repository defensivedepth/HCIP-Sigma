- source: template:cue_user_actor.baseline
  question: Does this user normally download files with command-line tools like wget.exe?
  context: Compare this user's current action against their historical behavior. A user who has never
    run a command-line downloader is more suspicious than one who does so regularly as part of their
    role. User role and typical toolset should align with command-line retrieval of scripts and
    binaries.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+wget.exe combination historically routine on this host or across the
    environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism — which parent process spawned wget.exe, and whether
    that pair is historically common. A new or rare parent for this binary is the deviation worth
    chasing; a pair that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar download or execution activity on several
    hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+wget.exe combination fire on other hosts in the same window — a
    coordinated automation rollout, or activity isolated to this host?
  context: Under a service principal, "what else did this user do across the network" returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism — parent
    process plus spawned binary — fired on other hosts in the alert window. Multiple hosts in the same
    window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this download, what happened after, and whether it is part of a larger
    sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms appearing as
    novel parent-child pairs at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access, or an initial-access event — may reveal the attack stages that
    preceded this download and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
