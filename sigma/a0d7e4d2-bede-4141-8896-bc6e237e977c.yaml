    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's full selection structure with no host scope, so the result is a
    fleet-wide count of this specific download pattern, not generic wget usage. Many hosts firing the
    same pattern points to scripted deployment or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_websites:
        CommandLine|contains:
        - .githubusercontent.com
        - anonfiles.com
        - cdn.discordapp.com
        - ddns.net
        - dl.dropboxusercontent.com
        - ghostbin.co
        - github.com
        - glitch.me
        - gofile.io
        - hastebin.com
        - mediafire.com
        - mega.nz
        - onrender.com
        - pages.dev
        - paste.ee
        - pastebin.com
        - pastebin.pl
        - pastetext.net
        - pixeldrain.com
        - privatlab.com
        - privatlab.net
        - send.exploit.in
        - sendspace.com
        - storage.googleapis.com
        - storjshare.io
        - supabase.co
        - temp.sh
        - transfer.sh
        - trycloudflare.com
        - ufile.io
        - w3spaces.com
        - workers.dev
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_ext:
        CommandLine|endswith:
        - .ps1
        - .ps1'
        - .ps1"
        - .dat
        - .dat'
        - .dat"
        - .msi
        - .msi'
        - .msi"
        - .bat
        - .bat'
        - .bat"
        - .exe
        - .exe'
        - .exe"
        - .vbs
        - .vbs'
        - .vbs"
        - .vbe
        - .vbe'
        - .vbe"
        - .hta
        - .hta'
        - .hta"
        - .dll
        - .dll'
        - .dll"
        - .psm1
        - .psm1'
