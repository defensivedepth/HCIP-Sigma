name: Suspicious File Download From File Sharing Domain Via Wget.EXE
id: 6309213c-daec-442a-a322-7413a60705e6
description: |
  Detects wget.exe (by Image name or original filename) invoked with an http URL pointing at a
  public file-sharing, paste, or developer-hosting domain, an output flag (-O or --output-document),
  and a target filename ending in an executable or script extension (.ps1, .dat, .msi, .bat, .exe,
  .vbs, .vbe, .hta, .dll, .psm1). The rule fires only when ALL of these conditions hold together,
  which is the shape of staged ingress tool transfer: an operator pulls a follow-on payload from a
  free hosting service straight to a named file on disk. Legitimate use exists (developers and
  automation occasionally fetch artifacts from GitHub or cloud storage with wget), so the
  investigation should establish what was downloaded, where it landed, whether it executed, and
  whether the user, host, and parent chain are consistent with sanctioned tooling.
type: detection
detection_id: a0d7e4d2-bede-4141-8896-bc6e237e977c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show wget.exe fetching an http URL from a file-sharing domain to a
    script or executable output file?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires
    only when all conditions hold together — the binary is wget.exe (or its original filename),
    the command line contains http and one of the listed hosting/paste domains, an output flag (-O
    or --output-document) is present, and the target filename ends in an executable or script
    extension. Verify every part is present rather than a coincidental substring match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to download executable or script payloads with command-line
    tools?
  context: Legitimate administrative or development activity can trigger this detection — build
    automation, IT helpers, or a developer pulling artifacts from a code-hosting service. Knowing
    whether this user's role and this host's function involve command-line downloads of scripts and
    binaries is often the fastest way to separate sanctioned tooling from operator-staged delivery.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before
    the alert?
  context: Operators frequently weaken AV/EDR before staging and running a downloaded payload. This
    query surfaces direct attempts to disable Defender, add broad exclusions, stop security services,
    clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel
    driver tampering and in-memory patches will not appear here. Populated rows shift the disposition
    toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this wget.exe invocation download? Decode the full command line — the
    source URL, the output path, and the file type.
  context: The full command line reveals the specific transfer. Decode the URL to identify the hosting
    domain and the remote resource, read the output flag to find where the file was written, and note
    the target extension to understand what kind of payload was staged (script, installer, DLL, or
    executable). This is the operation itself, not just the triggering match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned wget.exe, and is that parent chain expected for a download?
  context: The parent process reveals how the download was launched. A script host (wscript.exe,
    cscript.exe, mshta.exe), an Office application, an unexpected shell, or a remote-execution service
    as the parent points toward operator or malware-driven invocation; explorer.exe or a known
    automation parent points toward routine use.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did wget.exe spawn afterward, and did anything execute the downloaded
    file?
  context: The processes spawned around the download reveal its actual impact. A download alone is
    delivery; the follow-on matters. Watch for an interpreter or installer running the just-written
    file (powershell.exe, wscript.exe, cscript.exe, mshta.exe, msiexec.exe, rundll32.exe, or the
    downloaded executable itself), which moves the activity from staging to execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally
    drive it, and does the current alert fit that pattern?
  context: Even sanctioned tooling can be abused. The query mirrors the rule's full selection structure
    scoped to this host, so the resulting parent/user distribution reflects how this specific
    download pattern has historically run here — not generic wget usage. A new parent process, an
    unexpected user account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_websites:
        CommandLine|contains:
        - .githubusercontent.com
        - anonfiles.com
        - cdn.discordapp.com
        - ddns.net
        - dl.dropboxusercontent.com
        - ghostbin.co
        - github.com
        - glitch.me
        - gofile.io
        - hastebin.com
        - mediafire.com
        - mega.nz
        - onrender.com
        - pages.dev
        - paste.ee
        - pastebin.com
        - pastebin.pl
        - pastetext.net
        - pixeldrain.com
        - privatlab.com
        - privatlab.net
        - send.exploit.in
        - sendspace.com
        - storage.googleapis.com
        - storjshare.io
        - supabase.co
        - temp.sh
        - transfer.sh
        - trycloudflare.com
        - ufile.io
        - w3spaces.com
        - workers.dev
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_ext:
        CommandLine|endswith:
        - .ps1
        - .ps1'
        - .ps1"
        - .dat
        - .dat'
        - .dat"
        - .msi
        - .msi'
        - .msi"
        - .bat
        - .bat'
        - .bat"
        - .exe
        - .exe'
        - .exe"
        - .vbs
        - .vbs'
        - .vbs"
        - .vbe
        - .vbe'
        - .vbe"
        - .hta
        - .hta'
        - .hta"
        - .dll
        - .dll'
        - .dll"
        - .psm1
        - .psm1'
        - .psm1"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.baseline
  question: Does this host normally run wget.exe at all?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly.
    wget.exe is not a default Windows component, so zero or very low historical counts indicate a
    first-time or rare execution and raise the priority of confirming who placed it and why.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Staged downloads rarely occur alone. Activity surrounding the wget.exe invocation may reveal
    reconnaissance, credential access, persistence installation, or additional payload retrieval that
    provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
