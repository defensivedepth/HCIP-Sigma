- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this
    event and what followed: reconnaissance, privilege escalation, or persistence. Aggregating by
    Image and ParentImage collapses repetitive agent telemetry into high-count rows while novel
    parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
