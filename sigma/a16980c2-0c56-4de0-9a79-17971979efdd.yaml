- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - cmd.exe/c
        - \cmd/c
        - '"cmd/c'
        - cmd.exe/k
        - \cmd/k
        - '"cmd/k'
        - cmd.exe/r
        - \cmd/r
        - '"cmd/r'
      selection2:
        CommandLine|contains:
        - /cwhoami
        - /cpowershell
        - /cschtasks
        - /cbitsadmin
        - /ccertutil
        - /kwhoami
        - /kpowershell
        - /kschtasks
        - /kbitsadmin
        - /kcertutil
      selection3:
        CommandLine|contains:
        - cmd.exe /c
        - cmd /c
        - cmd.exe /k
        - cmd /k
        - cmd.exe /r
        - cmd /r
      filter_generic:
        CommandLine|contains:
        - 'cmd.exe /c '
        - 'cmd /c '
        - 'cmd.exe /k '
        - 'cmd /k '
        - 'cmd.exe /r '
        - 'cmd /r '
      filter_fp:
      - CommandLine|contains: AppData\Local\Programs\Microsoft VS Code\resources\app\node_modules
      - CommandLine|endswith: cmd.exe/c .
      - CommandLine: cmd.exe /c
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar command-shell activity on several
    hosts in this window, the scope of the activity may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
