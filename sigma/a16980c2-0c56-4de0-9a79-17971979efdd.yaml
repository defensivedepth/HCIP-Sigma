        - /cschtasks
        - /cbitsadmin
        - /ccertutil
        - /kwhoami
        - /kpowershell
        - /kschtasks
        - /kbitsadmin
        - /kcertutil
      selection3:
        CommandLine|contains:
        - cmd.exe /c
        - cmd /c
        - cmd.exe /k
        - cmd /k
        - cmd.exe /r
        - cmd /r
      filter_generic:
        CommandLine|contains:
        - 'cmd.exe /c '
        - 'cmd /c '
        - 'cmd.exe /k '
        - 'cmd /k '
        - 'cmd.exe /r '
        - 'cmd /r '
      filter_fp:
      - CommandLine|contains: AppData\Local\Programs\Microsoft VS Code\resources\app\node_modules
      - CommandLine|endswith: cmd.exe/c .
      - CommandLine: cmd.exe /c
