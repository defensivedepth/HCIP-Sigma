    kept: cue_process_tool.baseline_deviation
  - dropped: cue_process_tool.clustering
    reason: "Host-wide what-else-ran clustering overlaps the network-wide user clustering (Q16) and the post-access target-activity sweep (Q10); dropped to stay within the 18-question cap."
