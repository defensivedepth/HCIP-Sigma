    reason: "user_actor pair — non-deduplicable"
    kept: both emitted (Q14 user-pivot, Q15 parent+binary substitute)
  - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
    reason: "user_actor pair — non-deduplicable"
    kept: both emitted (Q16 user-pivot, Q17 parent+binary substitute)
