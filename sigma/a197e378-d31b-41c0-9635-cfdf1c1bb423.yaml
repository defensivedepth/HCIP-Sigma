  - template: cue_process_tool.follow_on
    reason: "At the 18-question cap. On the alerting (source) host the tool's children are the operator's local console, not the impact; the load-bearing follow-on activity is on the TARGET host and is covered by target_activity_after_access (Q10)."
  - template: cue_host_context.clustering
