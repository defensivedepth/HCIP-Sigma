  - element: LogonUser
    dimension: tuning_parameter
    specific_values: "rationale only — limit to service accounts or privileged users (T1021)"
    disposition: context
    target_question: Q7
    notes: "Folded into the remote-logon question's account-scoping context; no fixed list to inject."
  - element: RemoteHostList
    dimension: tuning_parameter
    specific_values: "rationale only — allowlist known admin jumpboxes / deployment tools (T1021)"
    disposition: context
    target_question: Q8
    notes: "Same allowlist intent as KnownAdminHosts; covered by the source-host identification question."
  dedup_decisions:
