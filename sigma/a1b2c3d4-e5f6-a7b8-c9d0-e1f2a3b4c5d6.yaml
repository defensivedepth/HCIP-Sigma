name: Disabling Windows Defender WMI Autologger Session via Reg.exe
id: e086a2df-6d2e-4d9c-8d7a-5c41510fd3aa
description: |
  Detects reg.exe adding a 'Start' value of 0 to the DefenderApiLogger or DefenderAuditLogger
  Autologger session under HKLM\System\CurrentControlSet\Control\WMI\Autologger. The rule fires when
  the process is reg.exe (by Image or OriginalFileName) AND the command line targets one of those two
  Defender Start values AND performs an 'add' of '0', and does not set the value back to 0x00000001.
  Setting Start=0 prevents the named ETW session from starting at boot, blinding the Defender API and
  audit telemetry that AV/EDR pipelines depend on. This is a defense-evasion preparatory step that
  commonly precedes payload execution, credential access, or ransomware deployment; legitimate use is
  rare and usually tied to deliberate, documented policy changes. The investigation should confirm the
  exact value written, determine whether the logger is still disabled, and reconstruct what activity
  the tampering was meant to hide.
type: detection
detection_id: a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did reg.exe add a Start value of 0 to a Defender Autologger session, and not reset it to 0x00000001?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only
    when reg.exe (by Image or OriginalFileName) targets DefenderApiLogger\Start or DefenderAuditLogger\Start
    AND performs an add of 0, AND the value is not 0x00000001. Verify the command line writes Start=0 to
    one of those two paths rather than re-enabling the logger.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to modify Defender ETW Autologger registry settings?
  context: Disabling the Defender API or audit logger session is rarely a routine administrative action.
    Knowing whether the user role and host function include deliberate, documented Defender or ETW
    configuration changes is often the fastest way to separate a sanctioned policy change from operator
    tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:registry.registry_key_context
  question: Which Autologger session was targeted and what value data was written to its Start value?
  context: The registry path and value data reveal intent. A Start value of 0 under DefenderApiLogger or
    DefenderAuditLogger disables the corresponding ETW session at next boot, cutting off Defender API or
    audit telemetry. This query returns the registry_set event linked to the same process so the analyst
    sees the exact TargetObject path and Details value as structured fields rather than parsing reg.exe's
    command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:defense_tampering.what_was_disabled
  question: Which Defender ETW logger session was disabled, and which telemetry stream does it feed?
  context: DefenderApiLogger and DefenderAuditLogger carry different Defender telemetry. Identify from the
    command line which session's Start value was set to 0 — the API logger feeds the real-time API event
    stream, the audit logger feeds audit events — because that determines which detections go blind and
    what evidence may be missing for the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is the Defender Autologger session currently restored, or is it still set to not start at boot?
  context: A Start value of 0 takes effect at the next boot and persists until restored. Check the current
    value of the targeted session via host inspection or the endpoint console. If Start is still 0, the
    Defender telemetry stream will not resume on reboot and the value should be restored to 1 before further
    investigation continues.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the Defender logger was disabled?
  context: Defenders are disabled to enable actions that would otherwise be blocked or logged. Examine
    process activity in the window after the registry write — execution, credential access, or staging in
    that gap points to what the tampering was meant to hide. Because the disabled logger reduces Defender
    visibility, correlate with network connections and file events for the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host around the same time?
  context: Operators who disable one control often disable several — stopping Defender services, clearing
    event logs, deleting shadow copies, or changing firewall rules in the same operation. Finding additional
    tampering events from the same user or parent process indicates multiple controls were targeted together
    rather than a single isolated change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made with reg.exe on this host in the same session?
  context: Operators who modify one registry key often modify several — for example disabling the Defender
    logger AND setting Defender policy keys AND adding a persistence Run key. Finding clusters of reg.exe
    add/delete/import operations from the same user within a short window reveals the full scope of the
    configuration changes and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned reg.exe, and is that parent chain expected for a registry write?
  context: The parent process reveals how reg.exe was invoked. Interactive administration typically shows
    explorer.exe or a console shell; scripted tampering often shows cmd.exe or powershell.exe driven by a
    batch file, or an unusual parent such as a script host or Office application. An unexpected parent
    chain for a Defender-logger registry write is the anomaly worth chasing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run reg.exe to change Defender or ETW configuration?
  context: Compare this user's current action against their historical behavior. A user who has never run
    reg.exe against Defender Autologger paths is more suspicious than one who does so as part of a documented
    role. The query counts this user's reg.exe executions across all hosts over 90 days; align the result
    with what the user's role would justify.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent process that launched reg.exe historically routine on this host or across the environment?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the
    meaningful pivot is the launch mechanism. Check whether the parent-process and reg.exe pair is historically
    common here. A new or rare parent for reg.exe is the deviation worth chasing, while a pair that already
    accounts for thousands of prior events points to vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated tampering
    across multiple endpoints. If the same user triggered similar Defender-logger changes or other notable
    activity on several hosts, the scope of the operation is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent and reg.exe combination fire on other hosts in the same window?
  context: Under a service principal, asking what the user did network-wide returns agent-telemetry noise.
    The meaningful question is whether the same launch mechanism — parent process plus reg.exe — fired on
    other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Tampering rarely happens in isolation. Earlier detections on the same host — reconnaissance,
    credential access, or other defense-evasion actions — may reveal the stages that preceded the Defender
    logger change and help reconstruct the timeline of the operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this same Defender-logger reg.exe pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the rule's firing pattern rather than generic reg.exe usage. Many hosts firing the same pattern
    points to scripted deployment or a tampering rollout; a single host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_path:
        CommandLine|contains:
        - \Control\WMI\Autologger\DefenderApiLogger\Start
        - \Control\WMI\Autologger\DefenderAuditLogger\Start
      selection_reg_add:
        CommandLine|contains|all:
        - add
        - '0'
      filter_main_enable:
        CommandLine|contains: '0x00000001'
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- source: template:lolbin.renamed_binary_check
  question: Was reg.exe executed from its expected System32 or SysWOW64 path?
  context: reg.exe executed from outside System32 or SysWOW64 may have been copied or renamed to evade
    path-based allowlists. Compare the Image path against the OriginalFileName — a reg.exe running from a
    user-writable or temp directory is more suspicious than one in the standard system path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this Defender-logger reg.exe pattern over the past 90 days, and what command-line shapes are typical?
  context: A pattern with no prior history on a host is more suspicious than one used regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the
    rule's specific firing pattern rather than generic reg.exe usage. The CommandLine projection lets the
    analyst compare typical invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_path:
        CommandLine|contains:
        - \Control\WMI\Autologger\DefenderApiLogger\Start
        - \Control\WMI\Autologger\DefenderAuditLogger\Start
      selection_reg_add:
        CommandLine|contains|all:
        - add
        - '0'
      filter_main_enable:
        CommandLine|contains: '0x00000001'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were any other tamper or persistence LOLBins used on this host recently?
  context: Operators who use one LOLBin for defense evasion often use several — alongside reg.exe they may
    use wevtutil to clear logs, vssadmin or wbadmin to remove recovery options, bcdedit to disable recovery,
    sc or netsh to stop services or change firewall rules, or schtasks for persistence. Finding multiple
    such binaries performing related actions strengthens the case for a deliberate tampering operation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\schtasks.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\at.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
