name: DLL Execution Via Register-cimprovider.exe
id: 7ce93303-91b6-460c-a341-bf96ef9714a5
description: |
  Detects register-cimprovider.exe running with a command line that contains both -path and dll, the
  invocation pattern that loads and executes code from an arbitrary DLL. register-cimprovider.exe is a
  signed Windows binary normally used to register WMI providers, so an operator can use it as a
  living-off-the-land loader to run a planted DLL under the cover of a trusted executable, hijacking the
  execution flow into attacker code. Investigation should confirm the exact -path DLL argument, identify
  where that DLL lives and whether it is signed or recently written, determine what spawned
  register-cimprovider.exe and what it spawned in turn, and judge whether this matches any expected
  administrative or vendor automation on the host and user.
type: detection
detection_id: a2910908-e86f-4687-aeba-76a5f996e652
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show register-cimprovider.exe with a -path argument pointing at a DLL?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the triggering event against the rule's criteria. The rule fires on a single condition, an Image ending in \register-cimprovider.exe whose command line contains both -path and dll. Confirm the exact -path value and note the DLL it references, since that DLL is the payload the rest of the investigation pivots on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to register WMI providers from the command line?
  context: register-cimprovider.exe legitimately registers WMI providers, an action normally performed by installers or administrators, not by everyday user activity. Knowing whether the logged-on user's role and this host's function involve provider registration or DLL deployment is often the fastest way to separate routine setup work from a binary being used as a loader for attacker code.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What DLL did register-cimprovider.exe load? Decode the full command line and identify the -path target.
  context: The full command line reveals which DLL was loaded and from where. Extract the absolute path that follows -path, note whether it sits in a system directory or a user-writable or temporary location, and decode any additional flags or arguments. A DLL under a user profile, ProgramData, or a temp path is a stronger signal of operator-supplied code than one under the Windows directory. Scoping to all register-cimprovider.exe executions on this host within the window captures any repeated or sequential invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1574.dll_load_verification
  question: Did register-cimprovider.exe actually load the referenced DLL, and is that module signed or from an abnormal path?
  context: The command line states which DLL was requested, but the module-load record confirms what was actually mapped into register-cimprovider.exe and reports its signing status and on-disk path. A module loaded from a user-writable or temporary directory, or an unsigned or recently created DLL, is the hijacked execution-flow step this technique relies on. If image-load events are not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded, and fall back to the -path value from the alerting command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \register-cimprovider.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1574.dll_provenance
  question: When and by what process was the referenced DLL written to disk on this host?
  context: How and when the DLL arrived determines whether this is a planted payload or an existing legitimate component. A DLL written shortly before register-cimprovider.exe ran, especially by a browser, archive utility, script host, or download tool, points to attacker-supplied code; a DLL placed long ago by an installer points to legitimate provider registration. Correlating the file-write time with the execution time establishes whether the load followed a fresh drop.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: .dll
      condition: selection
    fields:
      - TargetFilename
      - Image
      - Hashes
- source: template:cue_process_tool.process_chain
  question: What process spawned register-cimprovider.exe, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Legitimate provider registration is usually launched by an installer, msiexec.exe, or an administrative shell. Unusual parents such as a browser, mshta.exe, wscript.exe, an Office application, or a download tool point to the binary being driven as a loader rather than running as part of normal software setup.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did register-cimprovider.exe spawn afterward?
  context: The DLL executed through register-cimprovider.exe may carry out its actions in-process or spawn further programs. Child processes such as cmd.exe, powershell.exe, rundll32.exe, regsvr32.exe, or network tools indicate the loaded code moved on to post-exploitation; an absence of children does not clear the alert, since the DLL can act entirely within the host process.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run register-cimprovider.exe?
  context: register-cimprovider.exe is an uncommon binary on most endpoints outside of software installation events. A host that has never or rarely run it is more suspicious than one where provider registration is a recurring part of deployment. Zero or very low historical counts indicate first-time or rare execution worth closer scrutiny.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this register-cimprovider.exe DLL-load pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even an occasionally legitimate loader has a normal profile. The query mirrors the rule's selection, register-cimprovider.exe with -path and dll, scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here rather than generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure against that baseline is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \register-cimprovider.exe
        CommandLine|contains|all:
        - -path
        - dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \register-cimprovider.exe
        CommandLine|contains|all:
        - -path
        - dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \register-cimprovider.exe
        CommandLine|contains|all:
        - -path
        - dll
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar DLL-loading or follow-on activity on other hosts in the window, the scope of the operation may be larger than this single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \register-cimprovider.exe
        CommandLine|contains|all:
        - -path
        - dll
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this register-cimprovider.exe DLL-load pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific firing pattern rather than generic use of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \register-cimprovider.exe
        CommandLine|contains|all:
        - -path
        - dll
      condition: selection
    fields:
    - host.name
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: A DLL loaded through a living-off-the-land binary can serve as a foothold, and operators rarely rely on a single mechanism. After one foothold they commonly add backups using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations clustered in the same window indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or further execution close in time to the register-cimprovider.exe DLL load.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, a file drop, or credential access, may reveal the attack stages that preceded the DLL load and help reconstruct the timeline. Look for patterns: a download or file write followed by this execution.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
