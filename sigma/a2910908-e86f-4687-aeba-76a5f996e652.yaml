  skipped_templates:
    - template: registry.registry_key_context
      reason: "registry technique set was confirmed solely by filename_prefix 'registry', but register-cimprovider.exe loads a DLL via -path and does not write a registry key or value. A registry_set query scoped to this ProcessGuid returns nothing meaningful. The Phase-2 decode role is filled by cue_process_tool.mechanism_decode (Q3, the -path DLL decode) and attack:T1574.dll_load_verification (Q4, the actual module load) instead."
    - template: registry.registry_related_modifications
      reason: "same misfire: the registry technique set matched on filename_prefix only. This rule's mechanism is DLL execution, not registry modification, so a reg.exe/regedit.exe write sweep does not correspond to anything the rule detects. Host-wide co-activity is covered by cue_host_context.clustering (Q16)."
    - template: registry.registry_value_persistence_check
      reason: "applicability is_persistence_rule passed via tactic tag, but this rule writes no registry value pointing at an executable path; there is no Run-key payload to verify on disk. The DLL-on-disk verification this rule actually needs is covered by attack:T1574.dll_provenance (Q5, file_event) and attack:T1574.dll_load_verification (Q4, image_load)."
    - template: universal.endpoint_protection_health
      reason: "recommended-only generic tamper sweep. This is a LOLBin DLL-execution rule whose disposition turns on the DLL's origin and load path, not on whether AV/EDR was disabled first. cue_host_context.precursor (Q17) already surfaces any prior tamper alerts on the host, and the slots are spent on image_load, file_event, and the user-actor service-principal pairs that are specific to this chain."
    - template: persistence_scope.file_based_persistence
      reason: "Startup-folder / Run-key file-drop sweep. The persistence question worth the slot for a DLL-loader is whether OTHER process-based persistence mechanisms were installed (Q15, process_based_persistence); a dropped-DLL-to-disk check is already covered more precisely by attack:T1574.dll_provenance (Q5), which looks at the actual DLL written, not generic Startup-folder writes."
    - template: organizational_context.change_ticket
      reason: "recommended-only. DLL execution via a LOLBin is not a routine change-ticketed action the way scheduled-task or account changes are; host_user_context (Q2) and the user/host baselines (Q8, Q10, Q11) carry the authorized-vs-unauthorized judgment without spending a slot on a ticket lookup that rarely exists for this behavior."
    - template: organizational_context.human_recall
      reason: "recommended-only and redundant with host_user_context (Q2), which already asks whether this user/host is expected to register WMI providers or deploy DLLs; the human-recall variant adds no distinct query (ProcessGuid boilerplate) and would push the count past the useful range."
    - template: organizational_context.timing_alignment
      reason: "recommended-only. Timing-versus-work-hours judgment is subsumed by cue_host_context.clustering (Q16) and the precursor timeline (Q17), which give the analyst the surrounding-activity context needed to assess whether the timing is anomalous, without a separate ProcessGuid-boilerplate question."
    - template: organizational_context.procedural_consistency
      reason: "recommended-only. Whether DLL/provider deployment follows standard tooling is captured by host_user_context (Q2) and the user-actor baseline questions (Q10, Q11); a separate procedural-consistency question would duplicate that judgment with boilerplate query and exceed the question budget."
