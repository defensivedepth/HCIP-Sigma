name: HackTool - Pypykatz Credentials Dumping Activity
id: f8d9b58d-71ea-48f9-b3e0-f00cd63b4810
description: |
  Detects pypykatz running its registry credential-parsing mode, identified by a process whose image ends in pypykatz.exe or python.exe with a command line containing both "live" and "registry". Pypykatz is a Python re-implementation of Mimikatz primitives; the "registry live" subcommand reads NT/LM hashes, Domain Cached Credentials, and LSA secrets directly from the in-memory SAM and SYSTEM hives without writing dump files to disk. Legitimate use is essentially limited to authorized security testing, so the investigation should confirm the command actually performs SAM/registry credential parsing, establish whether the activity is sanctioned, identify which credential stores were reached, and check for follow-on use of any recovered credentials.
type: detection
detection_id: a29808fd-ef50-49ff-9c7a-59a9b040b404
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show pypykatz parsing the registry for credentials, with both "live" and "registry" present?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The rule fires when the image ends in pypykatz.exe or python.exe AND the command line contains both "live" and "registry", the pypykatz subcommand that parses NT/LM hashes, cached domain credentials, and LSA secrets from the in-memory SAM and SYSTEM hives.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run credential-parsing tooling?
  context: Legitimate credential extraction is essentially limited to security staff performing authorized testing. Knowing whether the user role and host function are consistent with running pypykatz against the registry is often the fastest path to distinguishing a true positive from sanctioned work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this pypykatz execution part of an authorized penetration test or red team engagement?
  context: Offensive credential-dumping tools are routinely used in authorized security assessments. Before investing investigation time, check whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement with matching tool usage and timing resolves the alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which pypykatz capability was invoked, and does it target the registry credential stores?
  context: Pypykatz is multi-purpose — it can parse live LSASS, process minidumps, parse registry hives, decrypt DPAPI material, or impersonate user tokens. The subcommand and arguments reveal which capability ran. The alerting "registry live" path recovers NT/LM hashes, Domain Cached Credentials (DCC/DCC2), and LSA secrets from the in-memory SAM and SYSTEM hives, which determines the scope of potential compromise.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: Which credential stores were reached — SAM, SYSTEM, SECURITY hives, or LSA secrets?
  context: The "registry live" mode reads from the SAM and SYSTEM hives in memory and can also recover LSA secrets and cached domain credentials. Identifying exactly which stores were parsed determines which accounts may be compromised — local account NT/LM hashes from SAM, machine secrets and service-account passwords from LSA secrets, and DCC/DCC2 for previously logged-on domain users.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.002.command_analysis
  question: Were the SAM and SYSTEM registry hives accessed or modified on this host around the time of the alert?
  context: The technique's underlying artifact is access to the HKLM\SAM and HKLM\SYSTEM hives, which together are required to extract local credentials offline. While pypykatz "registry live" parses the hives in memory, related dumping methods (reg save, direct \Device\HarddiskVolume access, or .save/.dmp file creation) leave registry and file artifacts. Correlating hive access close in time to this process confirms the credential-parsing intent beyond the command line alone.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\SAM\SAM'
          - '\System\CurrentControlSet\Control\Lsa'
          - '\SECURITY\Policy\Secrets'
      condition: selection
    fields:
      - TargetObject
      - Image
      - Details
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of credential theft depends on the privilege level of the exposed accounts. Local SAM hashes expose the built-in Administrator and any local accounts; LSA secrets can expose service-account and machine passwords. Domain admin or broadly-privileged credentials require incident escalation, while a standalone workstation's local accounts may only need rotation and monitoring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:hacking_tool.tool_specific_artifacts
  question: Did this process create credential-dump or output artifacts on the host?
  context: Pypykatz can write parsed credentials to output files even when reading hives in memory, and related dumping flows leave .save hive copies or .dmp files. Checking for files created by this process confirms execution and reveals where recovered credential material may have been staged, even if the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned pypykatz and is that parent chain expected?
  context: The parent process reveals how the tool was launched. Pypykatz running under python.exe is itself expected; the load-bearing question is what spawned that interpreter. A user shell or scripting host launched interactively differs from an unexpected parent like a service, a remote-execution stub, or an Office application, which points to operator activity rather than sanctioned testing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously ran pypykatz against the registry, what parents and users drove it, and does this alert fit that pattern?
  context: Even sanctioned tooling leaves a baseline. The query mirrors the rule's selection — image pypykatz.exe or python.exe with a command line containing both "live" and "registry" — scoped to this host, so the parent/user distribution reflects how this specific firing pattern has run here before. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \pypykatz.exe
        - \python.exe
        CommandLine|contains|all:
        - live
        - registry
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \pypykatz.exe
        - \python.exe
        CommandLine|contains|all:
        - live
        - registry
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \pypykatz.exe
        - \python.exe
        CommandLine|contains|all:
        - live
        - registry
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered credential access or other suspicious activity on multiple hosts, the scope of compromise may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \pypykatz.exe
        - \python.exe
        CommandLine|contains|all:
        - live
        - registry
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or privilege escalation — may reveal the attack stages that preceded credential access and help reconstruct the full timeline leading up to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts run pypykatz against the registry in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic python usage. Many hosts firing the same pattern points to scripted deployment or sanctioned assessment tooling; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \pypykatz.exe
        - \python.exe
        CommandLine|contains|all:
        - live
        - registry
      condition: selection
    fields:
    - host.name
