name: HackTool - PowerTool Execution
id: 32d1c691-524b-43cc-a98e-91ca6764edbe
description: |
  Detects execution of PowerTool (PowerTool.exe / PowerTool64.exe), a kernel-level
  Windows utility that can terminate protected processes, unload drivers, and delete
  driver files. The rule fires when a process image ends in \PowerTool.exe or
  \PowerTool64.exe, or carries the OriginalFileName PowerTool.exe. While marketed as a
  rootkit-removal tool, PowerTool is routinely dropped by operators to disable AV/EDR
  before deploying further payloads, so the investigation should determine who launched
  it, what security control it acted against, whether protection is still impaired, and
  what activity followed once defenses were weakened.
type: detection
detection_id: a34f79a3-8e5f-4cc3-b765-de00695452c2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match the PowerTool image name or OriginalFileName the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by checking that the process image ends in \PowerTool.exe or \PowerTool64.exe, or that its OriginalFileName is PowerTool.exe. A renamed copy still trips the OriginalFileName branch, so note which attribute matched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run a kernel-level process/driver management tool?
  context: PowerTool reaches into kernel structures to kill processes and unload drivers, which is rarely part of normal user or routine administrative activity. Knowing whether the user role and host function involve security tooling or driver maintenance is often the fastest path to separating a sanctioned use from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this PowerTool execution part of an authorized penetration test or red team engagement?
  context: Kernel utilities like PowerTool are occasionally used in sanctioned security assessments or driver troubleshooting. Before deeper analysis, check whether a pentest, red team exercise, or planned maintenance is active on this host or network segment. A matching engagement with consistent timing resolves the alert without further work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which PowerTool capability was invoked, and from what path was the binary run?
  context: PowerTool is multi-purpose — it can terminate protected processes, unload and delete drivers, lock privileges, or repair registry/task-manager state. The triggering command line and the binary's directory help establish intent; execution from %temp%, %public%, C:\PerfLogs\, or %appdata% rather than a managed install location points toward operator staging rather than legitimate use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: Did PowerTool drop or load a kernel driver, or write files to the host?
  context: PowerTool's process-kill and driver-unload features require loading a kernel driver, and the driver file plus any dumped output are characteristic artifacts. Files created by the PowerTool process — especially a driver written to a user-writable or temp path — confirm execution and reveal scope even after the original process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:defense_tampering.what_was_disabled
  question: Which security control or process did PowerTool target?
  context: PowerTool's impact depends on what it acted against — terminating an AV/EDR process leaves the host unprotected, while unloading a monitoring driver blinds telemetry. Identify the targeted process, service, or driver from the surrounding activity, since PowerTool's GUI-driven actions often leave little on the command line itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is endpoint protection currently restored on this host, or is it still impaired?
  context: PowerTool may stop a security process or unload a driver for a single action or leave it down. Check the current state of AV/EDR services and drivers — if real-time protection or a monitoring agent is still disabled, the control should be restored before further investigation continues.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after PowerTool ran?
  context: Defenses are disabled for a reason — to execute payloads, dump credentials, or take actions that would otherwise be blocked or logged. Activity in the window after PowerTool ran reveals what the tampering was meant to enable. A gap in telemetry followed by new process creation points to actions taken while protection was down.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense-tampering actions performed on this host around the same time?
  context: Operators who disable one control often disable several — stopping AV services AND clearing logs AND deleting shadow copies for maximum coverage. Other tampering events from the same user or parent process in the same window indicate multiple controls were targeted in one coordinated operation alongside the PowerTool execution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: attack:T1562.001.registry_set
  question: Were security-tool registry keys (Sysmon, Defender, or service start values) modified on this host around the alert?
  context: Beyond killing processes, impair-defenses activity often edits registry keys — altering Sysmon configuration, flipping Defender flags, or setting a security service's start type to disabled. These edits are a distinct logsource from process execution and can blind telemetry without spawning an obvious tool. Reg-edit activity from cmd.exe, reg.exe, or PowerShell in the same window corroborates a deliberate tamper.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Services\Sysmon'
          - '\SysmonDrv'
          - '\Windows Defender\'
          - '\Windows Advanced Threat Protection\'
          - '\Sense\Start'
          - '\WinDefend\Start'
          - '\SecurityHealthService\Start'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned PowerTool, and is that parent chain expected?
  context: The parent process shows how PowerTool was invoked. A launch from explorer.exe suggests interactive operator use; a launch from a script host, a remote-execution tool, or an unexpected parent points to scripted or pushed deployment. Walk up the parent chain to see what spawned the parent and what else it launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerTool?
  context: Compare this user's current action against their historical behavior. A user who has never run PowerTool is more suspicious than one who does so as part of a known role. Driver/kernel tooling should align with the user's job function.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+binary combination historically routine on this host or across the environment?
  context: When the alert fires under a service principal, user identity does not attribute the action. The meaningful pivot is the launch mechanism — which parent process spawned PowerTool, and whether that pair is historically common here or env-wide. A new or rare parent for PowerTool is the deviation worth chasing; a pair already accounting for many prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action on multiple endpoints. If the same user drove similar tooling on several hosts in this window, the scope of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+binary combination fire on other hosts in the same window — a coordinated rollout, or isolated to this host?
  context: Under a service principal, asking what the user did network-wide returns agent-telemetry noise. The meaningful question is whether the same launch mechanism — parent process plus PowerTool — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline
  question: Has this host run PowerTool before?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the trailing window indicate first-time or rare execution, which raises the priority of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's PowerTool pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, producing a fleet-wide count of the rule's firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment; a single host or small unrelated set points to manual operator activity. PowerTool appearing across many hosts in a short window is a pattern seen in pre-ransomware defense-disabling sweeps — use the host and parent distribution to calibrate.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith:
        - \PowerTool.exe
        - \PowerTool64.exe
      - OriginalFileName: PowerTool.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or other defense tampering — may reveal the attack stages that preceded this execution and help reconstruct the timeline leading to the defense-disabling step.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
