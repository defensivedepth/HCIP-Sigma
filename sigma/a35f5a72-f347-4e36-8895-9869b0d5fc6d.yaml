name: Suspicious Program Location Whitelisted In Firewall Via Netsh.EXE
id: c092f6a8-e874-454c-a720-2a65e6bb4f30
description: |
  Detects netsh.exe invoked to whitelist a program in the Windows Firewall when the program path
  points at a suspicious or user-writable location (Recycle Bin, Temp, Public, Downloads, Internet
  cache, or assorted Windows subfolders attackers use for staging). The rule fires only when the
  netsh image/OriginalFileName, a firewall-allow command structure, AND a suspicious program path are all
  present. Legitimately, administrators and installers add firewall exemptions, but they normally point
  at programs installed under Program Files or System32 — an allow rule for a binary living in a
  staging directory is a common way malware grants its own dropper inbound network access. Determine
  whether the whitelisted program path and the user/host context are consistent with sanctioned
  software, and whether the firewall change accompanies other defense-evasion or persistence activity.
type: detection
detection_id: a35f5a72-f347-4e36-8895-9869b0d5fc6d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the netsh command line whitelist a program located in a suspicious path, and do the image and arguments match what this rule detects?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires only when the process is netsh (by Image or OriginalFileName) AND the command line is a firewall-allow pattern (either `firewall add allowedprogram` or `advfirewall firewall add rule action=allow program=`) AND the program path falls inside a suspicious or user-writable location. Read the full command line and confirm all three conditions hold, and note the exact program path being exempted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to add Windows Firewall program exemptions via netsh?
  context: Legitimate firewall changes are usually made by administrators, installers, or management tooling, and they normally exempt programs installed under Program Files or System32 — not binaries in Temp, Public, or the Recycle Bin. Knowing whether this user role and host function routinely modify firewall rules is often the fastest way to separate sanctioned administration from an adversary granting its own payload network access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: What firewall exemption was created — which program path was allowed, and for which direction and profile?
  context: The command line reveals the precise control change. Identify the program path being exempted, whether the rule allows inbound or outbound traffic, and which firewall profile it targets. An allow rule pointing at a binary in a staging directory grants that binary network access it would not otherwise have — frequently inbound access for a remote-access payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1562.004.tuning_parameter
  question: Was the Windows Firewall configuration also changed directly in the registry on this host around the alert?
  context: Firewall state can be altered through the registry as well as through netsh. Changes under the SharedAccess FirewallPolicy keys — disabling a profile, adding an authorized-application entry, or relaxing default actions — achieve a similar effect without a netsh command line. Correlating registry writes to these keys with the netsh execution shows whether this was a single exemption or part of a broader firewall reconfiguration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\SharedAccess\Parameters\FirewallPolicy'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:defense_tampering.protection_status
  question: Is the firewall exemption still in place, or has the allow rule since been removed?
  context: A firewall exemption may be temporary (created for one action) or persistent. Check whether the allow rule for the suspicious program path is still active. If the exemption remains, the host continues to grant that binary network access and the rule should be removed as part of remediation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the firewall exemption was created?
  context: Defenses are weakened to enable something. After a binary is granted firewall access, watch for that binary establishing inbound or outbound connections, spawning child processes, or staging additional tools. A burst of new process activity in the window immediately following the exemption points to what the firewall change was meant to enable.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: An actor who relaxes the firewall often disables several controls — stopping Defender, clearing event logs, or deleting shadow copies — to maximize coverage. Finding multiple tampering events from the same user or parent process around the same time indicates a deliberate defense-evasion sequence rather than an isolated firewall change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned netsh, and is that parent chain expected for a firewall change?
  context: The parent process reveals how netsh was invoked. Administrator-driven firewall changes typically descend from an interactive shell, a management agent, or an installer. A parent like a binary in a user-writable directory, a scripting host (wscript.exe, mshta.exe), or an Office application suggests the firewall exemption was issued by malware or a malicious script rather than an operator.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to the firewall change and what followed it. Aggregating parent-child pairs collapses repetitive agent telemetry into high-count rows while novel pairs stand out at low counts — those are what to scan for as signs of reconnaissance, staging, or persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, credential access, or other defense tampering — may reveal the attack stages that preceded the firewall change. A firewall exemption issued after a dropper executes or after other controls are weakened tells a different story than one that appears on its own.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
      - CommandLine|contains|all:
        - firewall
        - add
        - allowedprogram
      - CommandLine|contains|all:
        - advfirewall
        - firewall
        - add
        - rule
        - action=allow
        - program=
      selection_paths:
        CommandLine|contains:
        - :\$Recycle.bin\
        - :\RECYCLER.BIN\
        - :\RECYCLERS.BIN\
        - :\SystemVolumeInformation\
        - :\Temp\
        - :\Users\Default\
        - :\Users\Desktop\
        - :\Users\Public\
        - :\Windows\addins\
        - :\Windows\cursors\
        - :\Windows\debug\
        - :\Windows\drivers\
        - :\Windows\fonts\
        - :\Windows\help\
        - :\Windows\system32\tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \Downloads\
        - \Local Settings\Temporary Internet Files\
        - \Temporary Internet Files\Content.Outlook\
        - '%Public%\'
        - '%TEMP%'
        - '%TMP%'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
      - CommandLine|contains|all:
        - firewall
        - add
        - allowedprogram
      - CommandLine|contains|all:
        - advfirewall
        - firewall
        - add
        - rule
        - action=allow
        - program=
      selection_paths:
        CommandLine|contains:
        - :\$Recycle.bin\
        - :\RECYCLER.BIN\
        - :\RECYCLERS.BIN\
        - :\SystemVolumeInformation\
        - :\Temp\
        - :\Users\Default\
        - :\Users\Desktop\
        - :\Users\Public\
        - :\Windows\addins\
        - :\Windows\cursors\
        - :\Windows\debug\
        - :\Windows\drivers\
        - :\Windows\fonts\
        - :\Windows\help\
        - :\Windows\system32\tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \Downloads\
        - \Local Settings\Temporary Internet Files\
        - \Temporary Internet Files\Content.Outlook\
        - '%Public%\'
        - '%TEMP%'
        - '%TMP%'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user issued similar firewall changes or ran other tooling on multiple hosts in this window, the scope of the activity is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
      - CommandLine|contains|all:
        - firewall
        - add
        - allowedprogram
      - CommandLine|contains|all:
        - advfirewall
        - firewall
        - add
        - rule
        - action=allow
        - program=
      selection_paths:
        CommandLine|contains:
        - :\$Recycle.bin\
        - :\RECYCLER.BIN\
        - :\RECYCLERS.BIN\
        - :\SystemVolumeInformation\
        - :\Temp\
        - :\Users\Default\
        - :\Users\Desktop\
        - :\Users\Public\
        - :\Windows\addins\
        - :\Windows\cursors\
        - :\Windows\debug\
        - :\Windows\drivers\
        - :\Windows\fonts\
        - :\Windows\help\
        - :\Windows\system32\tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \Downloads\
        - \Local Settings\Temporary Internet Files\
        - \Temporary Internet Files\Content.Outlook\
        - '%Public%\'
        - '%TEMP%'
        - '%TMP%'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:lolbin.technique_class_lateral
  question: Were other defense-evasion or persistence LOLBins used on this host recently?
  context: Actors who use one built-in tool to weaken defenses often use several. If netsh relaxed the firewall, check whether sc, reg, wevtutil, bcdedit, vssadmin, or schtasks were also used to disable services, clear logs, or install persistence. Finding multiple built-in tools advancing the same objective strengthens the case for deliberate malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\sc.exe'
          - '\reg.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\schtasks.exe'
          - '\at.exe'
          - '\dnscmd.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was netsh executed from its expected System32 path, or from an unexpected location?
  context: netsh executed from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists. The rule matches netsh by Image suffix or OriginalFileName, so a renamed or relocated copy would still fire — confirm the actual on-disk path to rule out a planted binary masquerading as the system tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this netsh firewall-allow pattern over the past 90 days, and what command-line structures are typical?
  context: A firewall-allow pattern with no prior history on a host is more notable than one used routinely under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern rather than generic netsh usage. The command-line projection lets you compare typical invocation patterns — which programs and paths are normally exempted — against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
      - CommandLine|contains|all:
        - firewall
        - add
        - allowedprogram
      - CommandLine|contains|all:
        - advfirewall
        - firewall
        - add
        - rule
        - action=allow
        - program=
      selection_paths:
        CommandLine|contains:
        - :\$Recycle.bin\
        - :\RECYCLER.BIN\
        - :\RECYCLERS.BIN\
        - :\SystemVolumeInformation\
        - :\Temp\
        - :\Users\Default\
        - :\Users\Desktop\
        - :\Users\Public\
        - :\Windows\addins\
        - :\Windows\cursors\
        - :\Windows\debug\
        - :\Windows\drivers\
        - :\Windows\fonts\
        - :\Windows\help\
        - :\Windows\system32\tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \Downloads\
        - \Local Settings\Temporary Internet Files\
        - \Temporary Internet Files\Content.Outlook\
        - '%Public%\'
        - '%TEMP%'
        - '%TMP%'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this netsh firewall-allow pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific firing pattern rather than generic netsh usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity or a localized infection. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
      - CommandLine|contains|all:
        - firewall
        - add
        - allowedprogram
      - CommandLine|contains|all:
        - advfirewall
        - firewall
        - add
        - rule
        - action=allow
        - program=
      selection_paths:
        CommandLine|contains:
        - :\$Recycle.bin\
        - :\RECYCLER.BIN\
        - :\RECYCLERS.BIN\
        - :\SystemVolumeInformation\
        - :\Temp\
        - :\Users\Default\
        - :\Users\Desktop\
        - :\Users\Public\
        - :\Windows\addins\
        - :\Windows\cursors\
        - :\Windows\debug\
        - :\Windows\drivers\
        - :\Windows\fonts\
        - :\Windows\help\
        - :\Windows\system32\tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \Downloads\
        - \Local Settings\Temporary Internet Files\
        - \Temporary Internet Files\Content.Outlook\
        - '%Public%\'
        - '%TEMP%'
        - '%TMP%'
      condition: all of selection_*
    fields:
    - host.name
