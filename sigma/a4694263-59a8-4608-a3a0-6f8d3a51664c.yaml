name: Suspicious Key Manager Access
id: a357b734-d274-4033-b430-65d9537fa067
description: |
  Detects rundll32.exe (by image name or OriginalFileName RUNDLL32.EXE) invoking the Stored
  User Names and Passwords dialog via the keymgr.dll KRShowKeyMgr entry point. The rule fires
  only when both the rundll32 image/OriginalFileName condition AND the keymgr + KRShowKeyMgr
  command-line tokens are present. That dialog exposes saved Windows Credential Manager secrets
  (web, RDP, file-share, and application credentials) and is rarely launched this way during
  normal use, so the invocation is most often a hands-on attempt to read stored credentials.
  Legitimate triggers are limited to administrative or help-desk credential maintenance.
  Investigation should confirm the exact command, identify who and what launched it, determine
  whether the Credential Locker files were subsequently read, and assess which accounts the
  exposed credentials protect.
type: detection
detection_id: a4694263-59a8-4608-a3a0-6f8d3a51664c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-08'
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event show rundll32 launching keymgr.dll with the KRShowKeyMgr argument?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact command line and process details against the rule's criteria. The rule fires only
    when the image is rundll32.exe (or OriginalFileName is RUNDLL32.EXE) AND the command line
    contains both keymgr and KRShowKeyMgr. Confirm both tokens are present and the binary identity
    matches before proceeding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to open the Stored User Names and Passwords dialog?
  context: Legitimate administrative or help-desk credential maintenance can trigger this detection.
    Knowing whether the user role and host function are consistent with manually opening the Windows
    Credential Manager dialog is often the fastest path to distinguishing routine maintenance from
    credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: What credential store did this invocation target, and what does the full command line reveal?
  context: The KRShowKeyMgr entry point opens the Windows Credential Manager (Credential Locker),
    which holds saved web, RDP, file-share, and application credentials rather than LSASS memory or
    the SAM database. Parse the full command line for any additional arguments, alternate DLL paths,
    or non-standard rundll32 location that would change what was accessed or how.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1555.004.file_path_analysis
  question: Were Credential Locker files read or written on this host around the time of the alert?
  context: After the Credential Manager dialog opens, credential extraction shows up as file access
    under the user Credential Locker directories. Look for .vcrd and .vpol files beneath
    AppData\Local\Microsoft\Credentials and AppData\Local\Microsoft\Vault. File activity on these
    paths shortly after the process executed corroborates that stored secrets were actually enumerated,
    not just that a dialog was opened.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_path:
        TargetFilename|contains:
          - '\AppData\Local\Microsoft\Credentials\'
          - '\AppData\Local\Microsoft\Vault\'
          - '\AppData\Roaming\Microsoft\Credentials\'
          - '\AppData\Roaming\Microsoft\Vault\'
      condition: selection_host and selection_path
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this rundll32 invocation, and is that parent chain expected?
  context: The parent process reveals how the credential dialog was launched. Interactive
    administrative use typically descends from explorer.exe or a console started by a logged-on
    user. Parents such as wscript.exe, mshta.exe, powershell.exe, an Office application, or a
    remote-execution service point to scripted or remote invocation rather than a person opening
    a dialog at the console.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts could the exposed credentials reach, and do any have elevated privileges?
  context: The severity of Credential Manager access depends on what the saved secrets protect.
    Stored RDP, file-share, or domain credentials for privileged accounts require incident
    escalation; a standard user's saved web logins may only need a password reset. Cross-reference
    the logged-on user and any saved-credential targets against directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated on this host after the event?
  context: Credential theft is typically followed by use of the stolen secrets to reach other
    systems. Look specifically for follow-on alerts indicating RDP, SMB, or remote-management
    sessions, or new authentication events, in the hours after the Credential Manager was opened.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Defense tampering frequently precedes hands-on-keyboard credential access. The query
    surfaces direct attempts to disable AV/EDR services, flip protection flags, add broad exclusions,
    clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal; populated
    rows shift the disposition toward operator preparation, so review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even built-in tools can be abused. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent/user distribution reflects how this specific
    keymgr/KRShowKeyMgr pattern has historically run here rather than generic rundll32 usage. A new
    parent process, an unexpected user account, or an unusual command-line shape is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - keymgr
        - KRShowKeyMgr
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run rundll32 against the Credential Manager dialog?
  context: Compare this user's current action against their historical behavior. A user who has
    never opened the Stored User Names and Passwords dialog is more notable than one who does so as
    part of a documented support role. The user's role and typical toolset should align with manual
    credential maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+rundll32 combination historically routine on this host or across the environment, or is the parent unusual?
  context: When the alert fires under a service principal, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. A new or rare parent for rundll32 on this
    host (or environment-wide) is the deviation worth chasing, while a parent that already accounts
    for many prior events is more consistent with vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity
    spanning multiple endpoints. If the same user triggered similar activity on other hosts, the
    scope of credential exposure may be larger than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+rundll32 combination fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did network-wide returns
    agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful
    question is whether the same launch mechanism — parent process plus rundll32 — fired on other
    hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context: what led to this event, what happened after, and whether it is part of a
    larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms
    near the credential-access event.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or other
    credential access — may reveal the attack stages that preceded the Credential Manager access and
    help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this keymgr/KRShowKeyMgr pattern rather than generic rundll32 usage. Many
    hosts firing the same pattern points to scripted deployment or vendor automation; one host or a
    small unrelated set points to manual operator activity. Use the host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - keymgr
        - KRShowKeyMgr
      condition: all of selection_*
    fields:
    - host.name
- source: template:lolbin.renamed_binary_check
  question: Was rundll32.exe executed from its expected System32 or SysWOW64 path?
  context: rundll32.exe executed from outside System32 or SysWOW64 may indicate the binary was copied
    or renamed to evade path-based allowlists. A rundll32.exe running from a user's temp or profile
    directory is more notable than one in System32, and the OriginalFileName field confirms whether a
    relocated or renamed copy is in use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this rule's rundll32/keymgr pattern over the past 90 days, and what command-line shapes are typical?
  context: A pattern with no prior history on a host is more notable than one used regularly under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the
    count reflects this specific keymgr/KRShowKeyMgr pattern rather than generic rundll32 usage. The
    command-line projection lets the analyst compare typical invocation shapes against the alerting
    one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - keymgr
        - KRShowKeyMgr
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
