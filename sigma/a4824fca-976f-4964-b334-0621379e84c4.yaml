name: Potential File Overwrite Via Sysinternals SDelete
id: 7db20a11-ad28-4960-95c1-d43a2e908ae9
description: |
  Detects execution of the Sysinternals SDelete utility (identified by its OriginalFileName,
  regardless of how the on-disk file was renamed) in a mode that securely overwrites and deletes
  one or more target files, rather than wiping free space or printing help. SDelete overwrites
  file contents in place before unlinking, making the data unrecoverable; legitimate uses include
  administrators sanitizing decommissioned media or scrubbing sensitive files, while malicious use
  appears as anti-forensic evidence destruction or as part of data-destruction (T1485) impact.
  The investigation should confirm which files were targeted, who and what invoked the tool, and
  whether the deletion was an isolated administrative action or part of a broader destructive sequence.
type: detection
detection_id: a4824fca-976f-4964-b334-0621379e84c4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does this execution match a real SDelete file-overwrite invocation rather than a help, free-space, or recursion-control run?
  context: >-
    The rule fires when a process whose OriginalFileName is sdelete.exe runs WITHOUT the help (-h, /?),
    no-confirm-clean (-c), or zero-free-space (-z) switches — that is, when SDelete is overwriting and
    deleting named targets rather than printing usage or sanitizing free space. Confirm the alert is a
    true positive by reviewing the exact command line and the file or directory arguments passed to it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to securely erase files with SDelete?
  context: >-
    Legitimate secure-deletion activity is common on administrator workstations, decommissioning hosts,
    and systems handling regulated data. Knowing whether the user role and host function involve media
    sanitization or sensitive-file scrubbing is often the fastest path to separating routine wiping from
    anti-forensic evidence destruction.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did SDelete overwrite? Decode the command line and identify the target files or directories.
  context: >-
    The full command line names the files, directories, or wildcards SDelete acted on and any pass-count,
    recursion (-s), or quiet (-q) flags. Decode every argument to determine the exact scope of what was
    overwritten and unlinked, since the destroyed data is unrecoverable once the operation completes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1485.file_deletion_evidence
  question: Which files were actually deleted by this process, and do they sit in sensitive or system locations?
  context: >-
    The command line states intended targets; the file-delete telemetry confirms what was actually unlinked.
    Pivot on the process to enumerate deletions and check whether they fall in sensitive locations such as
    user document trees, database or backup paths, or system directories — deletion concentrated in these
    areas points to data destruction rather than routine cleanup.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - User
      - ProcessGuid
- source: attack:T1485.overwrite_volume
  question: How many distinct files did SDelete touch on this host in the surrounding window, and is the volume consistent with targeted erasure or mass destruction?
  context: >-
    A single-file scrub differs sharply from a recursive sweep across hundreds of files. Counting the distinct
    file-event targets attributed to the tool in the surrounding window shows whether this was a contained
    administrative deletion or a high-volume overwrite consistent with destructive impact. A high unique-file
    count in a short window is the threshold signal worth escalating.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:cue_process_tool.process_chain
  question: What process spawned SDelete, and is that parent chain expected for secure-deletion activity?
  context: >-
    The parent process reveals how the tool was invoked. Interactive administrative use typically descends
    from explorer.exe or a console shell launched by a logged-on admin. A parent such as a script host
    (wscript.exe, cscript.exe), an Office application, a scheduling or remote-execution service, or an
    unknown binary suggests automated or operator-driven destruction rather than hands-on maintenance.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did SDelete spawn afterward?
  context: >-
    The processes spawned after the tool runs reveal its place in a sequence. Secure deletion is usually a
    leaf action with no children; follow-on cmd.exe, powershell.exe, or other tooling may indicate the
    deletion was one step in a scripted destruction or anti-forensic cleanup chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run SDelete?
  context: >-
    A secure-deletion utility that has never been seen on a host is more notable than one that runs on a
    regular maintenance cadence. Zero or very low historical counts over the trailing period indicate
    first-time or rare execution and raise the priority of the surrounding context.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this SDelete-overwrite pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even routine tools get abused. This query mirrors the rule's selection and filter scoped to this host,
    so the resulting parent and user distribution reflects how this specific firing pattern has historically
    run here — not generic SDelete usage. A new parent process, an unexpected account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: sdelete.exe
      filter:
        CommandLine|contains:
        - ' -h'
        - ' -c'
        - ' -z'
        - ' /\?'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: sdelete.exe
      filter:
        CommandLine|contains:
        - ' -h'
        - ' -c'
        - ' -z'
        - ' /\?'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: sdelete.exe
      filter:
        CommandLine|contains:
        - ' -h'
        - ' -c'
        - ' -z'
        - ' /\?'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether secure deletion here was isolated or part
    of broader hands-on activity. The same user driving destructive or anti-forensic actions on multiple
    endpoints widens the likely scope of the incident.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: sdelete.exe
      filter:
        CommandLine|contains:
        - ' -h'
        - ' -c'
        - ' -z'
        - ' /\?'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:ransomware_impact.destruction_scope_on_host
  question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: >-
    Destructive impact often chains multiple actions: overwriting files alongside deleting shadow copies,
    disabling recovery, stopping security services, and clearing event logs. Finding the complete set of
    destructive commands distinguishes ransomware or wiper activity from an isolated administrative deletion.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Destruction rarely happens in isolation. Earlier detections on the same host — defense tampering,
    credential access, or reconnaissance — may reveal the stages that preceded the deletion and help
    reconstruct the timeline of how the operator reached the point of erasing files.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:ransomware_impact.network_wide_impact
  question: Is this same destructive activity occurring on other hosts in the environment?
  context: >-
    Coordinated destruction frequently executes the same action across many hosts in rapid succession.
    Finding this same alert firing on multiple hosts indicates network-wide execution and determines the
    scope for containment and incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
