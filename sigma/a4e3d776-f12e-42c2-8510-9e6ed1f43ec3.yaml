  skipped_templates: []
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'application' (recommended by techniques: T1133) is not covered and no template family exists — author a custom question with `category: application`"
      disposition: declined
      reason: >-
        The T1133 'application' analytic targets VPN / Citrix / remote-access gateway
        logs showing external logons — the External-Remote-Services interactive-access
        pattern. This rule's detection is purely process_creation: dns.exe spawning an
        unexpected child via memory-corruption RCE (the SIGRed pattern), not an
        interactive remote logon. There are no gateway-application events corresponding to
        this trigger, so an application-logsource query would return activity unrelated to
        what fired the alert. The relevant external-reachability check (the inbound DNS
        request that reached the service) is covered by the delivery_vector question.
    - hint: "logsource 'security' (recommended by techniques: T1133) is not covered — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The T1133 'security' analytic keys on Windows Security EventCodes 4625/4776
        (failed and successful network logons) to spot repeated-failure-then-success
        remote access. This rule does not fire on a logon — it fires on dns.exe spawning a
        child process through service exploitation, which produces no preceding 4625/4776
        chain. A failed-logon query would surface noise unrelated to the DNS RCE trigger.
        The campaign_scope question correlates the actual detection across DNS servers, and
        the precursor question surfaces any prior alerts on the host, which together carry
        the cross-host and timeline signal the security analytic was meant to provide.
