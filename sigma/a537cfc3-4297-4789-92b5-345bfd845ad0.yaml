name: Service DACL Abuse To Hide Services Via Sc.EXE
id: e6a30145-8533-4668-94f1-22cf73efd7b6
description: |
  Detects sc.exe applying a service security descriptor (sdset) whose SDDL denies List Children and related
  rights to Interactive Users, Service logons, and Built-in Administrators (the DCLCWPDTSD deny pattern).
  The result is a running, autostarting service that is invisible to Get-Service, WMI Win32_Service, and
  sc query, and cannot be deleted through normal tooling — a persistence and defense-evasion mechanism.
  Legitimately, administrators rarely tighten a service DACL to this exact deny shape; the investigation
  should identify which service was hidden, what binary it runs, how it was created, and whether the
  hiding was authorized.
type: detection
detection_id: a537cfc3-4297-4789-92b5-345bfd845ad0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-05'
questions:
- source: template:universal.verify_trigger_match
  question: Does the sc.exe command line contain sdset with an SDDL that denies enumeration rights (the DCLCWPDTSD deny pattern)?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when sc.exe runs with
    both 'sdset' and the 'DCLCWPDTSD' rights string present, which is the deny-ACE shape that strips List Children and Delete
    rights from Interactive Users, Service logons, and Built-in Administrators. Verify the SDDL contains Deny ACEs (D;;...)
    against IU/SU/BA principals rather than a benign descriptor edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to modify service security descriptors with sc.exe sdset?
  context: Tightening a service DACL to hide it from enumeration is a rare operation. Knowing whether the acting account
    and the host's function are consistent with deliberate service-permission management is often the fastest way to separate
    a sanctioned hardening change from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for modifying this service's permissions?
  context: Service-permission changes that intentionally remove enumeration rights are unusual enough that an authorized
    one should normally be backed by a change record. A corresponding ticket suggests sanctioned hardening; its absence when
    policy requires one points toward unauthorized persistence and warrants escalation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:service_persistence.service_configuration
  question: What service was created or modified, and what binary does it execute?
  context: The hidden service points at a binary that is the persistence payload. Service-installation records expose the
    structured service name, executable path, start type, and account. Attackers commonly place the binary in world-writable
    directories (C:\Users\Public, C:\Windows\Temp, C:\ProgramData) or name it to masquerade as a legitimate service; the
    binary path is the artifact to analyze for signing, reputation, and location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- source: template:service_persistence.service_current_status
  question: Is the hidden service currently running, and what account is it using?
  context: A service whose DACL was tampered may still be running and autostarting even though enumeration tools return
    nothing. Because Get-Service and sc query are blinded, the diagnostic on the host is Set-Service or sc against the
    candidate service name returning "Access is denied" rather than "not found". Services running as LocalSystem hold full
    system privileges; a specific account indicates the access level the operator had.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1574.011.registry_set
  question: Were the service's registry keys (ImagePath, ServiceDll, FailureCommand, or Security) modified around this time?
  context: Service configuration and its security descriptor are ultimately stored under HKLM\SYSTEM\CurrentControlSet\Services.
    The same campaign that hides a service often also rewrites ImagePath or ServiceDll to point at the payload, or edits the
    service's Security subkey directly. Correlating registry modifications to the service's keys with this sc.exe activity
    confirms what configuration actually changed beyond the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned sc.exe and is that parent chain expected?
  context: The parent reveals how sc.exe was invoked. Interactive administration usually descends from explorer.exe or a
    console shell; service-hiding seen in intrusions often descends from a web-server worker, a script host, or a freshly
    dropped binary. An unusual parent such as w3wp.exe, wscript.exe, mshta.exe, or an Office application points toward
    exploitation rather than routine administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run sc.exe to manage service permissions?
  context: Compare the acting account's current action against its 90-day history. A user who has never run sc.exe (or never
    used it to set service descriptors) is more suspicious than one who manages services routinely. The user's role and
    typical toolset should align with deliberate service-permission changes.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-sc.exe combination historically routine on this host or across the environment, or is the
    parent unusual for sc.exe?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot
    is the launch mechanism. A new or rare parent process spawning sc.exe on this host or env-wide is the deviation worth
    chasing, while a pair that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or parallel actions on multiple
    endpoints. If the same user drove similar service-hiding or persistence activity elsewhere, the scope of the operation
    is larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-sc.exe combination fire on other hosts in the same window — is this a coordinated
    automation rollout, or isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — the parent process spawning sc.exe — fired on other hosts in
    the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Service hiding rarely occurs in isolation. Examining surrounding activity reveals what led to this event and what
    followed — reconnaissance, the dropping of the service binary, privilege escalation, or log clearing — and whether the
    hiding is one step of a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — web-shell activity, credential access, defense tampering, or log clearing —
    may reveal the stages that preceded the service hiding and help reconstruct the timeline. Hiding a service typically
    comes after a foothold is already established and a payload staged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.renamed_binary_check
  question: Was sc.exe executed from its expected System32 path, or from a copied or renamed location?
  context: sc.exe run from outside System32 or SysWOW64 may have been copied or renamed to evade path-based allowlists.
    Comparing the executed Image path against the OriginalFileName confirms whether this is the genuine system utility in
    its expected location or a relocated copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.technique_class_lateral
  question: Were any other persistence or tampering LOLBins used on this host recently?
  context: Operators who hide a service often pair it with other persistence or evasion LOLBins. Finding schtasks, reg, at,
    netsh, wevtutil, bcdedit, vssadmin, diskshadow, or dnscmd performing related persistence or defense-evasion actions in
    the same window strengthens the case for an intentional, stacked operation rather than an isolated administrative change.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\schtasks.exe'
          - '\reg.exe'
          - '\at.exe'
          - '\netsh.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the sc.exe sdset deny-ACE pattern over the past 90 days, and what command-line
    shapes are typical?
  context: A service-hiding pattern with no prior history on a host is more suspicious than one seen before under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific
    firing pattern rather than generic sc.exe usage. The CommandLine projection lets the analyst compare typical invocation
    shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_cli:
        CommandLine|contains|all:
        - sdset
        - DCLCWPDTSD
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the sc.exe sdset deny-ACE pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the hiding
    pattern rather than generic sc.exe usage. Many hosts firing the same pattern suggests scripted deployment or vendor
    automation; one host or a small unrelated set suggests manual operator activity. Use the host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_cli:
        CommandLine|contains|all:
        - sdset
        - DCLCWPDTSD
      condition: all of selection_*
    fields:
    - host.name
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. Alongside a hidden service, they commonly install
    backups through different techniques — scheduled tasks, additional services, registry Run keys, BITS jobs, or WMI
    subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than an
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
