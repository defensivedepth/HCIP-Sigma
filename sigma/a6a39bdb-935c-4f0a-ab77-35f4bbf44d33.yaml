- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - \Windows\Temp
        - \Temporary Internet
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - '%TEMP%'
        - '%TMP%'
        - '%LocalAppData%\Temp'
      filter_optional_vscode:
        CommandLine|contains: -WindowStyle hidden -Verb runAs
      filter_optional_amazon_ec2:
        CommandLine|contains: \Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\
      filter_optional_generic:
        CommandLine|contains:
        - ' >'
        - Out-File
        - ConvertTo-Json
      filter_optional_chocolatey_installer:
        ParentImage:
        - C:\Windows\System32\Msiexec.exe
        - C:\Windows\SysWOW64\Msiexec.exe
        Image|endswith: \powershell.exe
        CommandLine|contains|all:
        - -NoProfile -ExecutionPolicy Bypass -Command
        - AppData\Local\Temp\
        - Install-Chocolatey.ps1
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated
    activity across multiple endpoints. If the same user triggered similar PowerShell or
    temp-staging activity on other hosts in the same window, the scope of compromise may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - \Windows\Temp
        - \Temporary Internet
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - '%TEMP%'
        - '%TMP%'
        - '%LocalAppData%\Temp'
      filter_optional_vscode:
        CommandLine|contains: -WindowStyle hidden -Verb runAs
      filter_optional_amazon_ec2:
        CommandLine|contains: \Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\
      filter_optional_generic:
        CommandLine|contains:
        - ' >'
        - Out-File
        - ConvertTo-Json
      filter_optional_chocolatey_installer:
        ParentImage:
        - C:\Windows\System32\Msiexec.exe
        - C:\Windows\SysWOW64\Msiexec.exe
        Image|endswith: \powershell.exe
        CommandLine|contains|all:
        - -NoProfile -ExecutionPolicy Bypass -Command
        - AppData\Local\Temp\
        - Install-Chocolatey.ps1
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firing pattern, not generic PowerShell usage. Many hosts firing the
    same temp-folder pattern points to scripted deployment or vendor automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent/binary
    consistency to calibrate severity.
  range: -7d
