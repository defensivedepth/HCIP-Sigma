name: UAC Bypass Using PkgMgr and DISM
id: 0bb79a66-703f-43cd-aed8-7bdfa6c494ff
description: |
  Detects pkgmgr.exe spawning dism.exe at High or System integrity, a pattern used to bypass User Account Control and run
  code at elevated integrity without a consent prompt. pkgmgr.exe is an auto-elevating Windows servicing binary; when it is
  driven to launch dism.exe under a split-token administrator the child inherits elevated integrity, letting an actor move
  from Medium to High integrity silently. Legitimate servicing rarely produces this exact parent-child pairing interactively,
  so the investigation should confirm the integrity level and lineage, decode what dism.exe was directed to do, and determine
  what elevated action followed the bypass.
type: detection
detection_id: a743ceba-c771-4d75-97eb-8a90f7f4844c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did pkgmgr.exe spawn dism.exe at High or System integrity on this host?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the parent
    image ends in pkgmgr.exe, the child image ends in dism.exe, and the integrity level is High or System (including the
    equivalent SIDs S-1-16-16384 and S-1-16-12288). Verify all three conditions held in the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - IntegrityLevel
- source: template:universal.host_user_context
  question: Is this user and host expected to run Windows servicing tools at elevated integrity?
  context: Legitimate servicing and imaging workflows can drive pkgmgr.exe and dism.exe, but usually from automation or an
    administrator performing a known task. Knowing whether this user role and host function involve package servicing is
    often the fastest way to separate a routine maintenance action from a deliberate UAC bypass.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is pkgmgr.exe expected to spawn dism.exe here, and what started pkgmgr.exe itself?
  context: The parent-child relationship is the core signal. pkgmgr.exe is auto-elevating, so what drove it to run matters
    a normal servicing task started by an installer or scheduled job looks very different from pkgmgr.exe launched by an
    interactive shell, a script host, or an Office application. Tracing the grandparent reveals whether the chain is a routine
    elevation path or an injected one.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_parent_process.mechanism_decode
  question: What was pkgmgr.exe's own command line, and what drove it to launch dism.exe?
  context: pkgmgr.exe's command line and originating process reveal how the elevation path was set up. A package or update
    name passed to pkgmgr.exe points to genuine servicing; an empty or crafted invocation launched from a user shell points
    to the binary being used purely as an auto-elevate proxy. If the parent command line is visible in the alert, extend the
    investigation upward to what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What exactly was dism.exe directed to do? Decode its full command line.
  context: The dism.exe command line reveals the operational purpose of the elevated child. Decode any image, package, driver,
    or feature arguments, and any path or online/offline target. dism.exe can add packages, install drivers, or apply images
    with elevated rights, so the specific arguments distinguish benign servicing from an action the actor wanted to run at
    high integrity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.sibling_processes
  question: What other child processes did this pkgmgr.exe instance spawn?
  context: If pkgmgr.exe was used as an elevation proxy, dism.exe may not be the only child it launched. Examining all
    children of the same parent instance reveals whether the elevation produced a single servicing action or a cluster of
    elevated tools, which would point to deliberate orchestration rather than a benign task.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:uac_bypass.bypass_technique_registry_artifacts
  question: Were registry modifications made to set up this UAC bypass?
  context: Many UAC bypass techniques write a command into a registry key that an auto-elevated process reads and executes.
    Common targets include HKCU\Software\Classes\ms-settings\Shell, HKCU\Software\Classes\mscfile\shell, and HKCU\Environment
    keys, often via reg.exe, powershell.exe, or cmd.exe. Finding such a write near the alert confirms the bypass mechanism
    and reveals the payload that ran with elevated privileges.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- source: attack:T1548.002.registry_set
  question: Were UAC-related registry keys modified on this host shortly before the elevation?
  context: Registry-set telemetry shows the actual key writes that several UAC bypass families depend on, independent of
    which process performed them. Modifications to HKCU shell-handler keys such as ms-settings, mscfile, Folder, or exefile
    Shell\Open\command, or to Environment keys, set up an auto-elevated binary to execute attacker-controlled commands. A
    write to one of these keys within a short window before the elevation ties the bypass setup to this event.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\ms-settings\'
          - '\mscfile\'
          - '\Classes\exefile\'
          - '\Classes\Folder\'
          - '\Environment\'
          - '\Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: attack:T1548.002.image_load
  question: Did an auto-elevating system binary load an unexpected or unsigned DLL around this time?
  context: A second UAC bypass family relies on DLL search-order hijacking planting a malicious DLL next to an auto-elevated
    binary so it loads at high integrity. Image-load telemetry for elevated binaries reveals DLLs loaded from user-writable
    or non-standard directories, or unsigned modules, that would not normally back a servicing tool. If image-load events
    are not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1548.002.process_access
  question: Did any process open a handle into the elevated dism.exe or its parent with injection-capable access?
  context: Some elevation and bypass paths manipulate an auto-elevated process directly token theft or COM/in-memory
    injection requires opening a handle to the target. Process-access telemetry showing a cross-process open into dism.exe
    or pkgmgr.exe with broad access rights points to manipulation rather than ordinary servicing. If process-access events
    are not collected in this environment, treat zero results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith:
          - '\dism.exe'
          - '\pkgmgr.exe'
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: attack:T1548.002.elevated_token
  question: Which account was granted special elevated privileges on this host around the time of the alert?
  context: When a process obtains a privileged token, the security log records the account and the sensitive privileges
    assigned. Correlating the elevation event with the account that triggered the bypass confirms which identity gained
    high-integrity rights and whether that identity is an interactive user, a service account, or a computer account. If
    security privilege-assignment events are not collected in this environment, treat zero results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4672
      condition: selection
    fields:
      - SubjectUserName
      - PrivilegeList
- source: template:uac_bypass.elevated_action_after_bypass
  question: What action was performed with elevated privileges after the UAC bypass?
  context: UAC bypass is a means to an end. After elevating, actors commonly install persistence, dump credentials, tamper
    with security tools, or access protected resources. Examining processes that ran at High or System integrity on this
    host shortly after the bypass reveals the objective behind the elevation.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- source: template:uac_bypass.other_escalation_attempts
  question: Were other privilege escalation or UAC bypass techniques attempted on this host?
  context: Actors who attempt one UAC bypass often try several methods until one succeeds, especially when the OS version or
    configuration blocks certain techniques. Multiple bypass or escalation detections from the same host or user confirms
    deliberate privilege escalation rather than an isolated false positive.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \pkgmgr.exe
        Image|endswith: \dism.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \pkgmgr.exe
        Image|endswith: \dism.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar elevation or servicing activity on other hosts in this window, the scope of the
    activity may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \pkgmgr.exe
        Image|endswith: \dism.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Elevation rarely happens in isolation. Earlier detections on the same host defense tampering, reconnaissance,
    or initial execution may reveal the attack stages that preceded the bypass and help reconstruct the timeline leading
    up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
