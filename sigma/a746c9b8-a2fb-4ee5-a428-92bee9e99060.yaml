      notes: "Rule has no commandline_values; encoded_command_decode (KEEP_EXACT, ProcessGuid-scoped) covers -enc decoding. Values described in Q5 context; not injected because the rule scopes by binary role, not flags."
    - element: ParentProcessName
      dimension: parent_process_analysis
