name: SQL Client Tools PowerShell Session Detection
id: 3368202d-4000-4a7b-81d9-5722f8b2109d
description: |
  Detects use of sqltoolsps.exe, a signed Microsoft utility bundled with SQL Server Management
  tooling that hosts a PowerShell session. The rule fires when sqltoolsps.exe appears as the
  running executable, as a process's OriginalFileName, or as the parent of another process,
  while excluding the legitimate case where its parent is smss.exe. Because sqltoolsps.exe runs
  PowerShell through a .NET host rather than powershell.exe, classic PowerShell script block
  logging is frequently absent, which makes this binary attractive for proxying arbitrary
  PowerShell execution past log-based controls. Investigation should determine what PowerShell
  ran, who and what launched the utility, and whether the activity fits legitimate SQL
  administration on this host.
type: detection
detection_id: a746c9b8-a2fb-4ee5-a428-92bee9e99060
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event match this rule — sqltoolsps.exe running, named as the OriginalFileName, or acting as a parent, with a parent other than smss.exe?
  context: Confirm the alert is a true positive before investing time. The rule matches when sqltoolsps.exe is the executable, when a process's OriginalFileName is sqltoolsps.exe (covers renamed copies), or when sqltoolsps.exe spawned the process — and the parent is not smss.exe. Note which of these roles fired, because the OriginalFileName branch points to a renamed binary and the parent branch points to a child the utility launched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
  answer_sources:
  - alert
  - process_creation
- source: template:universal.host_user_context
  question: Is this user and host expected to run SQL Server management tooling?
  context: sqltoolsps.exe legitimately appears on database servers and on administrator workstations with SQL Server Management tools installed. A database administrator running it on a SQL host is routine; the same binary executing on a general-purpose workstation, a kiosk, or under an unexpected user is the deviation worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- source: template:parent_child.parent_process_legitimacy
  question: What process spawned sqltoolsps.exe, and what started that parent?
  context: The parent-child relationship is the core signal. Legitimate use is typically launched interactively or by SQL management tooling; an unusual grandparent such as an Office application, a script host, or a remote-access tool points to proxy execution. Tracing the parent's own origin reveals whether the chain is operator-driven or attacker-driven.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- source: template:cue_process_tool.mechanism_decode
  question: What PowerShell did sqltoolsps.exe run? Decode every command-line argument.
  context: sqltoolsps.exe hosts a PowerShell session, so its command line carries the operation — cmdlets, downloaded content, and inline scripts. Parse each argument and decode any encoded, concatenated, or escaped content to identify the full operational purpose. The host+binary scope within a few minutes captures sequential invocations that together form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- source: template:powershell.encoded_command_decode
  question: Was the PowerShell command encoded or obfuscated, and what does it decode to?
  context: PowerShell run through sqltoolsps.exe can carry -EncodedCommand (-enc) base64 payloads, string concatenation, backtick escaping, or variable substitution to hide intent. Decoding reveals the actual payload — download cradles, reverse shells, or in-memory loading of .NET assemblies. Loading an assembly reflectively indicates fileless execution and warrants tracing the source of the loaded code.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the script content executed through this host?
  context: Script block logging (Event ID 4104) records the deobfuscated script PowerShell actually executed, even when the command line is encoded. Because sqltoolsps.exe runs PowerShell through a .NET host rather than powershell.exe, this logging is often absent for this execution path, which is precisely why the binary is abused. If these events are not present, treat the gap as a visibility limitation rather than evidence nothing ran, and rely on command-line decoding instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before the alert?
  context: Operators often disable or downgrade PowerShell protections before running a payload — AMSI patching, execution policy bypass, constrained language mode escape, or invoking the version 2 engine that lacks logging. Finding these precursor events on the host shortly before sqltoolsps.exe ran strengthens the case for deliberate evasion.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn around the time of the alert?
  context: If a suspicious parent launched sqltoolsps.exe, it likely launched other processes too. Examining siblings of the alerting process reveals the full scope of activity initiated by that parent — multiple tools spawned in sequence points to orchestrated rather than ad-hoc activity.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: attack:T1127.child_process_spawning
  question: Did sqltoolsps.exe spawn any child processes, and are those children expected?
  context: As a proxy-execution utility, sqltoolsps.exe can launch further tooling — command interpreters, script hosts, or downloaders. The parent branch of this rule fires precisely on this case. Children such as cmd.exe, powershell.exe, rundll32.exe, regsvr32.exe, wscript.exe, or mshta.exe spawned by this binary indicate it was used to stage additional execution rather than to administer a database.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: attack:T1127.payload_write
  question: Did sqltoolsps.exe or its children write new executable content to user-writable paths on this host?
  context: Proxy execution frequently writes and then runs a new binary or script from a user-writable location such as the temp, AppData, public profile, or recycle-bin paths. A file write in a user-writable directory closely correlated with this execution, especially of an executable or script, points to payload staging rather than database tooling.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_paths:
        TargetFilename|contains:
          - '\AppData\'
          - '\Temp\'
          - '\Users\Public\'
          - '\$Recycle.Bin\'
      condition: selection and filter_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- source: attack:T1127.network_egress
  question: Did sqltoolsps.exe make outbound network connections shortly after it ran?
  context: PowerShell hosted through this utility can fetch remote content or establish command-and-control channels. An outbound connection from sqltoolsps.exe — particularly to a rare or external destination — combined with download-cradle command-line content indicates the utility was used to pull or exfiltrate, not to manage a local database.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
  answer_sources:
  - network_connection
- source: template:cue_process_tool.baseline
  question: Does this host normally run sqltoolsps.exe?
  context: A binary that has never executed on a host is more suspicious than one that runs regularly. On a database server sqltoolsps.exe may be routine; on a host with no SQL Server management role, zero or very low historical counts indicate first-time or rare execution worth scrutinizing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \sqltoolsps.exe
      - ParentImage|endswith: \sqltoolsps.exe
      - OriginalFileName: \sqltoolsps.exe
      filter:
        ParentImage|endswith: \smss.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \sqltoolsps.exe
      - ParentImage|endswith: \sqltoolsps.exe
      - OriginalFileName: \sqltoolsps.exe
      filter:
        ParentImage|endswith: \smss.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar execution on several hosts in a short window, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \sqltoolsps.exe
      - ParentImage|endswith: \sqltoolsps.exe
      - OriginalFileName: \sqltoolsps.exe
      filter:
        ParentImage|endswith: \smss.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct the timeline leading up to the proxy execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
