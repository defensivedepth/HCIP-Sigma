name: HackTool - RemoteKrbRelay Execution
id: 068c5c24-c0f9-4887-af38-b1be114b4176
description: |
  Detects execution of RemoteKrbRelay, a remote Kerberos relaying framework, by matching either the binary name/OriginalFileName
  or one of several command-line attack-mode signatures. The rule fires when EITHER the image/OriginalFileName matches the
  tool OR any one of its attack-mode flag combinations is present (the required relay trigger flags, an RBCD write, a
  computer/user-object addition, a credential change, group-membership manipulation, or an SMB relay). Legitimate occurrences
  are essentially limited to authorized penetration tests and red-team engagements; outside that context, execution points to
  an attempt to coerce and relay machine-account Kerberos authentication to a domain controller or AD CS for privilege
  escalation. Investigation should confirm which attack mode fired, identify the relay target and victim, and determine whether
  any account manipulation or lateral movement followed.
type: detection
detection_id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match RemoteKrbRelay either by binary name/OriginalFileName or by one of its attack-mode
    command-line signatures?
  context: The rule fires when at least one of several independent conditions matches — the image ends in RemoteKrbRelay.exe
    or its OriginalFileName is RemoteKrbRelay.exe, OR the required relay flags (-clsid, -target, -victim) are present, OR an
    RBCD signature (-rbcd with -cn/--computername), OR a credential change (-chp with -chpPass/-chpUser), OR group-membership
    manipulation (-addgroupmember with -group/-groupuser), OR an SMB relay (-smb/--smbkeyword with interactive/secrets/service-add).
    Read the full command line and note which branch fired, because that determines which downstream questions carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a Kerberos relaying tool?
  context: RemoteKrbRelay is an offensive AD-attack utility with no routine administrative use. Knowing whether the user role
    and host function (for example, a security tester's workstation or a sanctioned testing segment) are consistent with running
    relay tooling is often the fastest way to separate authorized testing from an intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this RemoteKrbRelay execution part of an authorized penetration test or red team engagement?
  context: RemoteKrbRelay, like Rubeus or Mimikatz, is used in authorized security assessments. Check whether a pentest or red
    team exercise is currently active on this host or network segment. An authorized engagement with matching tool usage and
    timing resolves the alert without further analysis; the absence of one shifts the disposition toward a live intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which attack mode of RemoteKrbRelay was invoked?
  context: The framework is multi-purpose. The command-line flags reveal which capability ran — -rbcd sets Resource-Based
    Constrained Delegation for an attacker-controlled machine account, -adcs enrolls a machine certificate, -shadowcred writes
    a KeyCredentialLink, -AddComputer/-AddUser create AD objects, -addgroupmember manipulates group membership, -chp changes
    a credential, and -smb relays to SMB. Each mode determines the scope of potential compromise and the required response.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: Which relay target and victim were specified, and what SPN or service was the relayed authentication aimed at?
  context: The -target value names the system the coerced Kerberos authentication is relayed to (typically a domain controller),
    and -victim names the machine whose authentication is coerced (often an AD CS server). The -clsid flag selects the DCOM
    trigger used to force authentication. Identifying target and victim determines which machine accounts and services may be
    compromised and what remediation is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1558.003.security_tgs_anomaly
  question: Did anomalous Kerberos service-ticket requests appear around this event — bursts of TGS requests, RC4 (etype 0x17)
    tickets, or requests targeting high-privilege service accounts?
  context: Relay and ticket-theft activity correlates with anomalous TGS request patterns in domain authentication logs (Event
    ID 4769). A short burst of service-ticket requests from one account, downgraded RC4 encryption where the environment normally
    uses AES, or requests for SPNs that the account never normally touches are the ticket-side anomalies that confirm the
    Kerberos abuse. If Security channel events are not ingested in this environment, treat zero results as a visibility gap
    rather than evidence nothing happened.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4769
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - ServiceName
      - TicketEncryptionType
- source: attack:T1558.process_access_lsass
  question: Did any process access LSASS memory around the time of this event?
  context: Ticket theft and relay tooling frequently read Kerberos material from LSASS. A process opening a handle to lsass.exe
    with memory-read access — especially a non-system, recently launched, or unsigned process — is the host-side artifact of
    ticket extraction. Compare the accessing process against the set normally expected to touch LSASS on this host. If process-access
    telemetry is not collected in this environment, this query returns nothing by construction.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        TargetImage|endswith: \lsass.exe
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - SourceProcessGuid
- source: template:credential_access.credential_exposure_assessment
  question: Which machine or user accounts may be compromised, and do any have elevated or delegation-relevant privileges?
  context: The severity depends on the privilege level of the affected accounts. A relayed machine-account authentication against
    a domain controller, an RBCD write, or a created computer object can yield domain-level impact and requires escalation;
    review the relay target, victim, and any -cn computer name against Active Directory group memberships and delegation
    settings. Service accounts and machine accounts with broad access are frequent targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Relay-obtained credentials or certificates are typically used immediately for lateral movement or domain escalation.
    Detecting new logon events, certificate-enrollment-driven authentication, or outbound remote connections shortly after this
    event indicates active exploitation of the compromised identity. Look specifically for RDP, SMB, WinRM, or new authentication
    activity following the relay.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:hacking_tool.tool_specific_artifacts
  question: Did the RemoteKrbRelay process write any files to the host during or after execution?
  context: Relay tooling can drop output such as obtained certificates, ticket files, or logs. File creation events from the
    tool's process confirm execution and reveal the scope of activity even after the process has exited. Examine any files
    written under user-writable or temp directories for certificate, ticket, or credential output.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user run RemoteKrbRelay anywhere in the environment before?
  context: Compare this user's current action against their historical behavior. A user who has never run this relay tool is
    more suspicious than one who runs it regularly as part of a sanctioned testing role. Zero or very low historical counts
    indicate first-time or rare execution for this account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+binary launch combination historically routine on this host or across the environment, or is the
    parent unusual for this binary?
  context: When the alert fires under a service or machine account, user identity does not attribute behavior; the meaningful
    pivot is the launch mechanism. Which parent process spawned RemoteKrbRelay, and is that pair historically common? A new or
    rare parent for this binary is the deviation worth chasing; a pair that already accounts for many prior events points to
    existing testing tooling or automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staged activity across multiple endpoints.
    If the same user triggered relay or other AD-attack activity on multiple hosts, the scope of the operation may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+binary combination fire on other hosts in the same window — is this a coordinated rollout or
    isolated to this host?
  context: Under a service or machine account, user-pivoted activity returns mostly agent-telemetry noise. The meaningful question
    is whether the same launch mechanism — parent process plus spawned binary — fired on other hosts in the alert window. Multiple
    hosts in the same window points to scripted or pushed activity; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even tooling used for sanctioned testing has a baseline. The query mirrors the rule's selection structure scoped to
    this host — the resulting parent/user distribution reflects how the rule's specific firing pattern has historically run
    here. A new parent process, an unexpected user account, or an unusual command-line shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \RemoteKrbRelay.exe
      - OriginalFileName: RemoteKrbRelay.exe
      selection_cli_required:
        CommandLine|contains|all:
        - ' -clsid '
        - ' -target '
        - ' -victim '
      selection_cli_attack_smb:
        CommandLine|contains|all:
        - '-smb '
        - '--smbkeyword '
        CommandLine|contains:
        - interactive
        - secrets
        - service-add
      selection_cli_attack_rbcd_main:
        CommandLine|contains: '-rbcd '
      selection_cli_attack_rbcd_options:
        CommandLine|contains:
        - '-cn '
        - '--computername '
      selection_cli_attack_changepass:
        CommandLine|contains: '-chp '
        CommandLine|contains|all:
        - '-chpPass '
        - '-chpUser '
      selection_cli_attack_addgrpname:
        CommandLine|contains|all:
        - '-addgroupmember '
        - '-group '
        - '-groupuser '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img or selection_cli_required or all of selection_cli_attack_rbcd_* or selection_cli_attack_changepass or selection_cli_attack_addgrpname or selection_cli_attack_smb) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern rather than generic binary usage. Many hosts firing the same pattern points to a sanctioned testing rollout
    or automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \RemoteKrbRelay.exe
      - OriginalFileName: RemoteKrbRelay.exe
      selection_cli_required:
        CommandLine|contains|all:
        - ' -clsid '
        - ' -target '
        - ' -victim '
      selection_cli_attack_smb:
        CommandLine|contains|all:
        - '-smb '
        - '--smbkeyword '
        CommandLine|contains:
        - interactive
        - secrets
        - service-add
      selection_cli_attack_rbcd_main:
        CommandLine|contains: '-rbcd '
      selection_cli_attack_rbcd_options:
        CommandLine|contains:
        - '-cn '
        - '--computername '
      selection_cli_attack_changepass:
        CommandLine|contains: '-chp '
        CommandLine|contains|all:
        - '-chpPass '
        - '-chpUser '
      selection_cli_attack_addgrpname:
        CommandLine|contains|all:
        - '-addgroupmember '
        - '-group '
        - '-groupuser '
      condition: selection_img or selection_cli_required or all of selection_cli_attack_rbcd_* or selection_cli_attack_changepass or selection_cli_attack_addgrpname or selection_cli_attack_smb
    fields:
    - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering often precedes hands-on-keyboard credential-access activity. The query surfaces direct attempts to disable
    AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection
    looks healthy" signal; populated rows shift the disposition toward operator preparation, so review the parent process and
    signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, coercion attempts, defense
    tampering, or other credential access — may reveal the attack stages that preceded the relay and help reconstruct the full
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
