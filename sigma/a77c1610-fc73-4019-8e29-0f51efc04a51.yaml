name: Potential Dosfuscation Activity
id: e234d5f1-d4be-4acb-a1c6-e7c0cae93402
description: |
  Detects cmd.exe command-line obfuscation (DOSfuscation) in which native shell
  syntax — caret escape characters, repeated comma/semicolon delimiters, parenthesis
  insertion, environment-variable string substitution (%COMSPEC:~...%), and split
  keywords like c^m^d or s^e^t — is used to hide the true command from naive string
  matching while still executing normally. Legitimately this pattern is rare; it most
  often appears in penetration-testing harnesses, obfuscated batch scripts, or as a
  defense-evasion layer wrapping a downloader or post-exploitation command. The
  investigation should reconstruct the de-obfuscated command, identify what spawned
  the obfuscated shell, and determine whether the same firing pattern is isolated to
  this host or distributed across the fleet.
type: detection
detection_id: a77c1610-fc73-4019-8e29-0f51efc04a51
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain the DOSfuscation patterns this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive
    by reviewing the exact command line against the rule's obfuscation markers —
    caret escapes (^^, ^|^, ^c^m^d), repeated delimiters (;;;;, ',;,', (,(,),
    environment-variable substitution (%COMSPEC:~...%), or split keywords
    (c^m^d, s^e^t). Note which marker is present; it indicates which obfuscation
    function generated the command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run obfuscated cmd.exe command lines?
  context: Legitimate administrative activity rarely uses caret escaping or environment-variable
    string substitution. Knowing whether the user role and host function involve scripted
    automation, software packaging, or penetration testing is often the fastest path to
    distinguishing a true positive from a routine operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the command actually do once the obfuscation is removed?
  context: The full command line reveals the real action behind the obfuscation. Strip
    the caret escapes, collapse repeated delimiters, and resolve any %COMSPEC:~...%
    environment-variable substitution to recover the underlying command, then decode any
    flags, encoded content, file paths, or URLs it carries. Obfuscation is a wrapper; the
    payload it conceals — a downloader, a credential dump, a persistence write — is what
    determines severity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - ^^
        - ^|^
        - ',;,'
        - ;;;;
        - ;; ;;
        - (,(,
        - '%COMSPEC:~'
        - ' c^m^d'
        - ^c^m^d
        - ' c^md'
        - ' cm^d'
        - ^cm^d
        - ' s^et '
        - ' s^e^t '
        - ' se^t '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this obfuscated shell and is that parent chain expected?
  context: The parent process reveals how the obfuscated command was invoked. Legitimate
    usage often has predictable parents (explorer.exe for interactive use, a build or
    packaging tool for automation). Unusual parents such as mshta.exe, wscript.exe,
    winword.exe, or excel.exe point toward exploitation, malicious macros, or a script-host
    delivery chain.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired the obfuscation pattern, what parents and users
    drove it, and does the current alert fit that pattern?
  context: Even cmd.exe obfuscation can recur from a benign source such as a packaging
    script or a recurring automation job. The query mirrors the rule's selection scoped
    to this host, so the resulting parent/user distribution reflects how this specific
    firing pattern has historically run here. A new parent process, an unexpected user
    account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ^^
        - ^|^
        - ',;,'
        - ;;;;
        - ;; ;;
        - (,(,
        - '%COMSPEC:~'
        - ' c^m^d'
        - ^c^m^d
        - ' c^md'
        - ' cm^d'
        - ^cm^d
        - ' s^et '
        - ' s^e^t '
        - ' se^t '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this obfuscated shell spawn afterward?
  context: The processes spawned by the de-obfuscated command reveal its actual impact.
    Obfuscation usually wraps a launcher; watch for cmd.exe, powershell.exe, certutil.exe,
    mshta.exe, rundll32.exe, or unfamiliar binaries started shortly afterward, which mark
    the transition from evasion wrapper to payload execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Obfuscated execution rarely stands alone. Activity surrounding the detected
    command may reveal reconnaissance, privilege escalation, persistence installation, or
    data staging that provides broader context. Aggregating collapses repetitive agent
    telemetry into high-count rows so novel low-count process activity stands out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this obfuscation pattern in the past week, and does the
    cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of this firing pattern rather than generic cmd.exe usage. Many hosts
    firing the same pattern points to a scripted deployment or vendor automation that
    happens to use shell escaping; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ^^
        - ^|^
        - ',;,'
        - ;;;;
        - ;; ;;
        - (,(,
        - '%COMSPEC:~'
        - ' c^m^d'
        - ^c^m^d
        - ' c^md'
        - ' cm^d'
        - ^cm^d
        - ' s^et '
        - ' s^e^t '
        - ' se^t '
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ^^
        - ^|^
        - ',;,'
        - ;;;;
        - ;; ;;
        - (,(,
        - '%COMSPEC:~'
        - ' c^m^d'
        - ^c^m^d
        - ' c^md'
        - ' cm^d'
        - ^cm^d
        - ' s^et '
        - ' s^e^t '
        - ' se^t '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ^^
        - ^|^
        - ',;,'
        - ;;;;
        - ;; ;;
        - (,(,
        - '%COMSPEC:~'
        - ' c^m^d'
        - ^c^m^d
        - ' c^md'
        - ' cm^d'
        - ^cm^d
        - ' s^et '
        - ' s^e^t '
        - ' se^t '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity across multiple endpoints. If the same user triggered similar activity on
    multiple hosts, the scope of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ^^
        - ^|^
        - ',;,'
        - ;;;;
        - ;; ;;
        - (,(,
        - '%COMSPEC:~'
        - ' c^m^d'
        - ^c^m^d
        - ' c^md'
        - ' cm^d'
        - ^cm^d
        - ' s^et '
        - ' s^e^t '
        - ' se^t '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals
    the immediate context: what led to this event, what happened after, and whether it is
    part of a larger sequence. Look for reconnaissance, privilege escalation, or
    persistence mechanisms running close in time.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host —
    defense tampering, reconnaissance, credential access — may reveal the stages that
    preceded this obfuscated execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the
    hour before the alert?
  context: Tampering typically precedes payload execution, and obfuscation is itself a
    defense-evasion layer, so prior tamper activity raises the likelihood that this is
    hands-on-keyboard preparation. The query surfaces direct attempts to disable AV/EDR
    services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW.
    Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering
    and in-memory patches will not appear here. Populated rows shift the disposition toward
    operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
