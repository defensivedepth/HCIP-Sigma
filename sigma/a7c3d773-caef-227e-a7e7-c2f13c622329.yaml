- source: template:cue_process_tool.follow_on
  question: What child processes did this binary spawn afterward?
  context: The processes spawned by the binary reveal its actual impact. A genuine argument-free invocation of these binaries spawns nothing meaningful, so child processes — especially cmd.exe, powershell.exe, or other tooling — point to an injected capability executing post-exploitation actions rather than the binary doing its named job.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.011.network_connection
  question: Did this binary make any external network connections shortly after it launched?
  context: A sacrificial process holding an injected capability frequently reaches out to external command-and-control. WerFault, rundll32, regasm, regsvcs, and regsvr32 have no reason to make outbound connections when run argument-free, so an external connection from this process — correlated by ProcessGuid within a few minutes of launch — is a high-value signal that the bare invocation is hosting injected code. Filter out known-good internal infrastructure to surface genuinely external destinations.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1218.011.image_load
  question: What DLLs or modules did this binary load after it started, and are any unsigned or loaded from a user-writable path?
  context: When these binaries run argument-free as injection targets, the loaded module set is what matters — rundll32 and regsvr32 normally map a specified DLL, regasm and regsvcs load a named assembly, and none of that happens without arguments. An unsigned module, a module loaded from a user-writable directory such as a user profile or temp path, or an unexpected .NET runtime load points to code mapped into the process rather than normal operation.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.011.file_event
  question: Did this binary or its parent write any files to disk around the time of the alert, such as a DLL or assembly in a user-writable directory?
  context: Argument-free abuse of these binaries often pairs with a payload staged on disk — a DLL, a .NET assembly, or a script dropped into a user-writable directory such as a user profile, temp, or public path before being loaded or injected. File writes scoped to this host's relevant directories around the alert time help locate the staged payload and tie it to the process.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      condition: selection
    fields:
      - Image
      - TargetFilename
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this event and what happened after — reconnaissance, privilege escalation, persistence installation, or data staging that provides broader context. Novel parent-child pairs at low counts are what to scan for against the routine high-count agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic usage of the binaries. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_werfault:
        Image|endswith: \WerFault.exe
        CommandLine|endswith: WerFault.exe
      selection_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      selection_regsvcs:
        Image|endswith: \regsvcs.exe
        CommandLine|endswith: regsvcs.exe
      selection_regasm:
        Image|endswith: \regasm.exe
        CommandLine|endswith: regasm.exe
      selection_regsvr32:
        Image|endswith: \regsvr32.exe
        CommandLine|endswith: regsvr32.exe
      filter_optional_edge_update:
        ParentImage|contains: \AppData\Local\Microsoft\EdgeUpdate\Install\{
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      filter_optional_chromium_installer:
        ParentImage|contains:
        - \AppData\Local\BraveSoftware\Brave-Browser\Application\
        - \AppData\Local\Google\Chrome\Application\
        ParentImage|endswith: \Installer\setup.exe
        ParentCommandLine|contains: '--uninstall '
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      condition: 1 of selection_* and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded an injection host and help reconstruct the timeline. Argument-free sacrificial-process execution is typically a mid-chain action, so prior alerts often carry the story of how the operator got here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
