name: Potential Memory Dumping Activity Via LiveKD
id: afc4c17e-13d6-4f14-994f-eb45dc536b3a
description: |
  Fires when a process named livekd.exe or livekd64.exe runs, or when a process carries the
  OriginalFileName livekd.exe in its PE metadata. LiveKD is a signed Sysinternals utility that
  wraps the Microsoft kernel debuggers and can write a full kernel-memory dump to disk with -o,
  without crashing the system; the resulting dump can contain credential-bearing kernel structures
  and cached secrets. Legitimate use is admin and debugging work, which must still be verified.
  Malicious use harvests memory for offline credential extraction, so the investigation should
  establish who ran it, under what parent, whether a dump file was produced, and whether the
  activity fits normal administration of this host and user.
type: detection
detection_id: a85f7765-698a-4088-afa0-ecfbf8d01fa4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this process match what this rule detects — an image named livekd.exe or livekd64.exe, or one carrying the OriginalFileName livekd.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    image name and the PE OriginalFileName against the rule's detection criteria. A renamed copy of
    LiveKD is caught by the OriginalFileName branch even when the on-disk name differs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run a kernel-debugging and memory-dump utility?
  context: Legitimate LiveKD use is normally limited to administrators and engineers doing kernel
    debugging or crash analysis on specific machines. Knowing whether the user role and host function
    are consistent with running a kernel debugger is often the fastest way to separate routine
    debugging from credential-dumping activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Memory dumping for credential theft is frequently preceded by operators weakening
    protection. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags,
    add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks
    healthy" signal — kernel-level driver tampering and in-memory patches will not appear here.
    Populated rows shift the disposition toward operator preparation; review the parent process and
    signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did LiveKD do? Decode the full command line, especially the dump flags and the output path.
  context: The command line reveals whether this was a debugging session or a memory harvest. Look for
    -o (saves a dump file to disk instead of launching the debugger), -m / -ml (mirror or native live
    kernel dump), -mp <pid> (includes user-mode memory of a process), the region flag mask after -m
    (default 0x18F8 selects mostly kernel pool, PTEs, and stacks), -hv (Hyper-V guest dump), and -w / -k
    (launch windbg or a specified debugger). An -o path with a .dmp target is the common
    credential-theft variant; note the output file so it can be located and reviewed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned LiveKD and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Interactive debugging is usually
    launched from explorer.exe or a console the admin opened; invocation from mshta.exe, wscript.exe,
    an Office application, or a remote-execution service points to scripted or hands-off operation.
    The immediate parent is visible in the alert, so extend the investigation to what spawned that
    parent and what else it launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did LiveKD spawn afterward?
  context: LiveKD wraps the kernel debuggers, so a legitimate live session typically spawns kd.exe or
    windbg.exe. Watch for child kd.exe or windbg.exe invoked with -z to open a dump, or follow-on
    cmd.exe, powershell.exe, certutil.exe, or compression/copy utilities that would stage or exfiltrate
    a produced dump file.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, driver installation, or data staging surrounding the
    dump activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Memory dumping is usually one step in a sequence. Activity surrounding LiveKD may reveal
    reconnaissance, privilege escalation, driver loading, or staging of the dump file that provides
    broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across
    multiple endpoints. If the same user ran similar tooling on multiple hosts, the scope of the
    memory-dumping activity may be larger than this one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \livekd.exe
        - \livekd64.exe
      - OriginalFileName: livekd.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, privilege escalation, or credential access — may reveal the attack stages that
    preceded the memory dump and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline
  question: Does this host normally run LiveKD?
  context: A kernel debugger that has never been seen on a host is more suspicious than one that runs
    regularly as part of debugging or support work. Zero or very low historical counts indicate
    first-time or rare execution on this machine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \livekd.exe
        - \livekd64.exe
      - OriginalFileName: livekd.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \livekd.exe
        - \livekd64.exe
      - OriginalFileName: livekd.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even legitimate tools can be abused. The query mirrors the rule's selection structure scoped
    to this host, so the resulting parent/user distribution reflects how this rule's specific firing
    pattern has historically run here, not generic binary usage. A new parent process, an unexpected
    user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \livekd.exe
        - \livekd64.exe
      - OriginalFileName: livekd.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic usage of the binary. Many hosts
    firing the same pattern points to scripted deployment or vendor automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent consistency
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \livekd.exe
        - \livekd64.exe
      - OriginalFileName: livekd.exe
      condition: selection
    fields:
    - host.name
