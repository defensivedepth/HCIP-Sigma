        ' -D C:\'), so the proxy-execution payload is read from disk, not
        retrieved over the network at sftp.exe invocation. Q4
        (command_analysis) directs the analyst to inspect the argument for a
        URL should one appear, and Q10 (follow_on) surfaces any network-capable
