      reason: >-
        T1218's image_load analytic targets DLL-loading proxy binaries
        (rundll32.exe, regsvr32.exe loading a module). This rule's specific
        mechanism is sftp.exe launching a standalone executable via -D, which
        manifests as a process_creation child, not a DLL load into sftp.exe.
        The payload-execution stage is covered by Q10 (follow_on) and Q4
        (command_analysis) via process_creation evidence. No compensating
        attack:T1218.image_load question authored because the launched payload
        is a process, not a loaded module.
    - hint: "logsource 'network_connection' (recommended by techniques: T1218) is not covered -- pull in cue_network_endpoint.* or author a custom question with category: network_connection"
