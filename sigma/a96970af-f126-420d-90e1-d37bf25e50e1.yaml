name: Use Short Name Path in Image
id: e9d7dab8-ea35-4a69-86cb-7f1212cc9e54
description: |
  Detects a process whose Image path uses an NTFS 8.3 short name component (a path
  segment ending in '~1\' or '~2\', such as PROGRA~1 for "Program Files"), while none
  of the rule's installer, system-maintenance, or known-tool exclusions apply. Short-name
  paths resolve to the same binary as their long-name form but evade detections and
  allow-lists that string-match on canonical long paths, so legitimate installers and
  archive utilities use them occasionally while operators use them to mask the real
  location of an executable. Determine whether the short-name path points at a normal
  binary launched by an expected parent, or whether it is being used to obscure where
  an executable actually lives and what it is doing.
type: detection
detection_id: a96970af-f126-420d-90e1-d37bf25e50e1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the Image path contain an 8.3 short-name segment ending in ~1\ or ~2\, and is this a real trigger rather than an excluded installer or maintenance tool?
  context: Confirm the alert is a true positive by reviewing the triggering process. The rule fires when the Image path contains a short-name component AND the event is not one of the excluded cases (a child of Dism.exe or cleanmgr.exe, an unzip.exe/7zG.exe archive helper under AppData and Temp, or a WebEx, Thor, or InstallShield invocation). Read the full Image path and parent process to verify the short-name segment is present and the exclusions genuinely do not apply.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to launch executables via short-name paths?
  context: Legitimate administrative tooling, installers, and archive utilities occasionally invoke binaries through 8.3 short-name paths. Knowing whether the user role and host function routinely produce such invocations is often the fastest way to separate routine activity from an attempt to obscure a binary's location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full Image path and command line, and what long-name path does the short-name segment resolve to?
  context: The short-name path hides the canonical location of the executable. Read the full Image path and resolve each '~1' or '~2' segment to its long-name equivalent (for example PROGRA~1 maps to "Program Files", USER~1 to a user profile directory) to learn where the binary actually lives. Decode the command line for flags, encoded content, file paths, or URLs that reveal what the process was doing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- source: attack:T1564.004.path_resolution
  question: Was the binary at this short-name path written to disk recently, and where did the file come from?
  context: A short-name path resolves to a real file on disk. If that executable was dropped or modified shortly before it ran, the write event reveals the long-name location, the writing process, and whether the file landed in a user-writable or staging directory. Correlating the file creation with the execution strengthens or weakens the case that the short-name path was used to obscure a freshly staged binary rather than a long-installed application.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this binary, and is that parent chain expected for a short-name path invocation?
  context: The parent process reveals how the binary was launched. Legitimate short-name usage typically has predictable parents such as explorer.exe, services.exe, or an installer. Unusual parents like mshta.exe, wscript.exe, cmd.exe, powershell.exe, or an Office application can indicate that the short-name path was chosen to slip past path-based detections during exploitation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host launched a binary from this short-name path before?
  context: A short-name path invocation that has never been seen on a host is more suspicious than one that recurs. Zero or very low historical counts indicate first-time or rare execution from this path on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the short-name-path rule, what parents and users normally drove that activity, and does the current alert fit that pattern?
  context: Even routine tooling occasionally invokes short-name paths. The query mirrors the rule's selection and exclusion structure scoped to this host, so the resulting parent and user distribution reflects how this rule's specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual path pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - ~1\
        - ~2\
      filter_main_system_process:
        ParentImage:
        - C:\Windows\System32\Dism.exe
        - C:\Windows\System32\cleanmgr.exe
      filter_main_installers:
      - Image|contains|all:
        - \AppData\
        - \Temp\
      - Image|endswith:
        - ~1\unzip.exe
        - ~1\7zG.exe
      filter_optional_webex:
        ParentImage|endswith: \WebEx\WebexHost.exe
      filter_optional_thor:
        ParentImage|endswith: \thor\thor64.exe
      filter_optional_installshield:
      - Product: InstallShield (R)
      - Description: InstallShield (R) Setup Engine
      - Company: InstallShield Software Corporation
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this binary spawn afterward?
  context: The processes spawned by the binary reveal its actual impact. A binary launched through a short-name path that then spawns command interpreters, script hosts, or download utilities (cmd.exe, powershell.exe, certutil.exe) points toward post-exploitation rather than a benign installer or archive operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|contains|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Defense-evasion steps such as masking a binary's path rarely occur alone. Activity surrounding the short-name-path execution may reveal reconnaissance, privilege escalation, persistence installation, or data staging that provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired the short-name-path rule in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection and exclusion structure with no host scope, so the result is a fleet-wide count of this rule's firing pattern rather than generic short-name usage. Many hosts firing the same pattern points to scripted deployment or vendor automation that emits short-name paths; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - ~1\
        - ~2\
      filter_main_system_process:
        ParentImage:
        - C:\Windows\System32\Dism.exe
        - C:\Windows\System32\cleanmgr.exe
      filter_main_installers:
      - Image|contains|all:
        - \AppData\
        - \Temp\
      - Image|endswith:
        - ~1\unzip.exe
        - ~1\7zG.exe
      filter_optional_webex:
        ParentImage|endswith: \WebEx\WebexHost.exe
      filter_optional_thor:
        ParentImage|endswith: \thor\thor64.exe
      filter_optional_installshield:
      - Product: InstallShield (R)
      - Description: InstallShield (R) Setup Engine
      - Company: InstallShield Software Corporation
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - ~1\
        - ~2\
      filter_main_system_process:
        ParentImage:
        - C:\Windows\System32\Dism.exe
        - C:\Windows\System32\cleanmgr.exe
      filter_main_installers:
      - Image|contains|all:
        - \AppData\
        - \Temp\
      - Image|endswith:
        - ~1\unzip.exe
        - ~1\7zG.exe
      filter_optional_webex:
        ParentImage|endswith: \WebEx\WebexHost.exe
      filter_optional_thor:
        ParentImage|endswith: \thor\thor64.exe
      filter_optional_installshield:
      - Product: InstallShield (R)
      - Description: InstallShield (R) Setup Engine
      - Company: InstallShield Software Corporation
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - ~1\
        - ~2\
      filter_main_system_process:
        ParentImage:
        - C:\Windows\System32\Dism.exe
        - C:\Windows\System32\cleanmgr.exe
      filter_main_installers:
      - Image|contains|all:
        - \AppData\
        - \Temp\
      - Image|endswith:
        - ~1\unzip.exe
        - ~1\7zG.exe
      filter_optional_webex:
        ParentImage|endswith: \WebEx\WebexHost.exe
      filter_optional_thor:
        ParentImage|endswith: \thor\thor64.exe
      filter_optional_installshield:
      - Product: InstallShield (R)
      - Description: InstallShield (R) Setup Engine
      - Company: InstallShield Software Corporation
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on multiple endpoints. If the same user produced similar short-name-path executions on other hosts, the scope of the activity may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - ~1\
        - ~2\
      filter_main_system_process:
        ParentImage:
        - C:\Windows\System32\Dism.exe
        - C:\Windows\System32\cleanmgr.exe
      filter_main_installers:
      - Image|contains|all:
        - \AppData\
        - \Temp\
      - Image|endswith:
        - ~1\unzip.exe
        - ~1\7zG.exe
      filter_optional_webex:
        ParentImage|endswith: \WebEx\WebexHost.exe
      filter_optional_thor:
        ParentImage|endswith: \thor\thor64.exe
      filter_optional_installshield:
      - Product: InstallShield (R)
      - Description: InstallShield (R) Setup Engine
      - Company: InstallShield Software Corporation
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms alongside the short-name-path execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the full timeline. Path-obfuscation steps often accompany other evasion activity in the same operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
