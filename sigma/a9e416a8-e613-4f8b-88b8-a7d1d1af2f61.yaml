      coverage_type: direct
  mutable_dispositions:
    - element: TimeWindow
      dimension: time_correlation
      specific_values: '0-30 minutes between utility execution, payload write, and network egress'
      disposition: context
      target_question: Q6
      notes: Payload-write question uses +/-15m and network-egress question uses +30m to bound the correlation
        window between csi.exe execution, file drop, and outbound connection.
    - element: SuspiciousChildList
      dimension: tuning_parameter
      specific_values: 'powershell.exe, rundll32.exe, regsvr32.exe, cmd.exe, wscript.exe, mshta.exe'
      disposition: context
      target_question: Q11
      notes: Rule inverts the brief framing — here csi.exe is the child and a PowerShell host is the parent. Sibling
        question surfaces any additional children of the same parent without hardcoding the list, since the
        suspicious child here is csi.exe itself.
    - element: RarePathRegex
      dimension: tuning_parameter
      specific_values: '%TEMP%, %APPDATA%, recycle bin, public profile'
      disposition: context
      target_question: Q6
      notes: User-writable drop paths described in payload-write context; image-location question (Q8) checks
        whether csi.exe itself runs outside the Visual Studio install path.
    - element: UnsignedOrInvalidSignatureOnly
      dimension: tuning_parameter
      specific_values: 'unsigned or invalid-signature child/payload'
      disposition: query_injection
      target_question: Q5
      notes: image_load question projects Signed and Signature fields so the analyst can spot unsigned or
        invalid-signature modules loaded by csi.exe.
    - element: ParentProcessAllowList
      dimension: parent_process_analysis
      specific_values: rationale only
      disposition: context
      target_question: Q10
      notes: Parent baseline question lets the analyst judge whether the PowerShell-host parent is a known
        legitimate orchestrator for csi.exe on this host.
    - element: AllowedUtilitiesList
      dimension: tuning_parameter
      specific_values: rationale only
      disposition: context
      target_question: Q9
      notes: Host baseline distinguishes developer/build hosts where csi.exe is expected from general endpoints.
    - element: DeveloperHosts
      dimension: tuning_parameter
      specific_values: rationale only
      disposition: context
      target_question: Q2
      notes: host_user_context asks whether this host/user is a development context where csi.exe is expected.
    - element: NetworkReputationThreshold
      dimension: tuning_parameter
      specific_values: rationale only
      disposition: context
      target_question: Q7
