name: Suspicious Use of CSharp Interactive Console
id: f3eabbfe-9328-4ea6-9a19-fede3de95345
description: |
  Detects csi.exe, the Microsoft-signed C# interactive console shipped with Visual Studio, being spawned by a
  PowerShell host (powershell.exe, pwsh.exe, or powershell_ise.exe) while its embedded OriginalFileName metadata
  is csi.exe. The rule fires when all of these match together. csi.exe is a fully scripting-capable REPL that can
  run inline C#, execute a .csx script file, and reflectively load .NET assemblies into its own process to reach
  Windows API surface without dropping additional tooling. Because it is signed and portable, it can be relocated
  onto hosts without Visual Studio and used as a "bring your own land" execution proxy. Legitimate use exists on
  developer and build systems; investigation should determine whether this host and user are a development context,
  what the console actually executed, and whether csi.exe subsequently loaded unusual modules, wrote files, or
  made outbound connections.
type: detection
detection_id: a9e416a8-e613-4f8b-88b8-a7d1d1af2f61
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Was csi.exe spawned by a PowerShell host with OriginalFileName csi.exe?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule requires the child image
    to end in csi.exe, its embedded OriginalFileName to be csi.exe, and the parent image to be powershell.exe,
    pwsh.exe, or powershell_ise.exe. Note which PowerShell host is the parent, since that frames whether this looks
    like an interactive developer session or a scripted launch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run a C# interactive console?
  context: csi.exe is a developer tool. Legitimate use concentrates on developer and build systems and on users
    who write or debug .NET code. A general-purpose workstation or a user with no development role running the C#
    interactive console is a meaningful deviation worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is this PowerShell host expected to spawn csi.exe, and what started the PowerShell host itself?
  context: The PowerShell-to-csi.exe parent-child relationship is the core signal. Tracing the PowerShell host's
    own origin reveals whether the chain is a developer launching the console interactively or a scripted launch
    initiated by a macro, scheduled task, or remote tooling. If ParentProcessGuid resolves to NODATA, pivot on the
    host plus the parent image name within a short window around the alert.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What did csi.exe execute? Decode its command line to determine interactive REPL versus a script file.
  context: An empty command line (no arguments) is a strong indication of an interactive REPL session, where the
    operator types statements directly into the console. A .cs, .csx, .fs, or .fsx file passed as an argument
    indicates a script was run; record the script path and review its contents. Either form can reflectively load
    .NET assemblies and reach Windows API surface from inside the process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1127.image_load
  question: What modules did csi.exe load, and were any unsigned or loaded from user-writable paths?
  context: The console can reflectively load .NET assemblies into its own process to call Windows APIs without
    dropping additional binaries on disk. Module loads from user-writable directories, or unsigned and
    invalid-signature modules, point to operator-supplied tooling rather than the standard managed runtime an
    interactive developer session would load. If module-load telemetry is not collected in this environment, treat
    zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1127.payload_write
  question: Did csi.exe write any files to user-writable paths around the time of the alert?
  context: A console that drops a new executable or script to a user-writable location such as a temp, appdata,
    public-profile, or recycle-bin path is consistent with staging a payload to run, rather than an interactive
    developer session. Review any files written by the console for executable content and reputation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - CommandLine
- source: attack:T1127.network_egress
  question: Did csi.exe make any outbound network connections after launch?
  context: Outbound connections originating from the C# interactive console are atypical for a development tool and
    are a documented detection lever for this binary being abused. A connection to a rare or unknown destination,
    shortly after the console started, points to command-and-control or staging rather than legitimate use. Review
    the destination address and reputation.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: llm_generated
  question: Is csi.exe running from the canonical Visual Studio install path or from an atypical location?
  context: Legitimate csi.exe lives under the Microsoft Visual Studio program-files install path. A copy running
    from a user-writable or otherwise atypical directory suggests the signed binary was relocated and brought to a
    host that may not have Visual Studio installed, which is the "bring your own land" pattern. The full image path
    distinguishes a routine developer install from a transported LOLBin.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CurrentDirectory
- source: template:cue_process_tool.baseline
  question: Does this host normally run csi.exe?
  context: A binary that has never run on a host is more suspicious than one that runs regularly. On a developer or
    build system, csi.exe may appear routinely; on a general-purpose endpoint, zero or very low historical counts
    indicate first-time or rare execution and raise the priority of this alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_parent_process.baseline
  question: Does this PowerShell host normally spawn csi.exe on this host?
  context: A PowerShell host launching the C# interactive console is an unusual pairing outside of developer
    tooling. Historical frequency of this specific parent-child combination on this host distinguishes a routine
    development workflow from a novel spawning relationship worth investigating.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same PowerShell host spawn?
  context: If the PowerShell host that launched csi.exe also spawned other processes, examining its siblings reveals
    the full scope of activity from that parent instance. Multiple tools launched from the same parent in a short
    window suggests orchestrated execution rather than a single interactive console launch.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run the C# interactive console?
  context: Compare this user's current action against their historical behavior. A user who routinely runs csi.exe
    is likely a developer; a user who has never run it before, across any host, is a stronger deviation. User role
    and typical toolset should align with running a developer scripting console.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this PowerShell-host-plus-csi.exe combination historically routine on this host or across the
    environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The meaningful
    pivot is the launch mechanism, namely which parent spawned csi.exe and whether that pair is historically common.
    A new or rare PowerShell-host parent for csi.exe is the deviation worth chasing; a pair that already accounts for
    many prior events is more likely build or developer automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar developer-tool execution on several hosts in the same window, the
    scope of activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same PowerShell-host-plus-csi.exe combination fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry
    noise. The meaningful question is whether the same launch mechanism, the PowerShell host spawning csi.exe, fired
    on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation;
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering,
    reconnaissance, or credential access, may reveal the attack stages that preceded this execution and help
    reconstruct the timeline leading to the console launch.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. This query surfaces direct attempts to disable AV/EDR
    services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful signal
    that protection looks healthy; kernel-level driver tampering and in-memory patches will not appear here.
    Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to
    identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
