    - stage: 2
      label: parent_origin
      description: The PowerShell-host parent and its own origin determine whether the launch is interactive dev use
        or a scripted/proxy launch
      mapped_to: Q3
      source: template:parent_child.parent_process_legitimacy
    - stage: 3
      label: execution_mechanism
      description: csi.exe runs as an interactive REPL or executes a script file
      mapped_to: Q4
