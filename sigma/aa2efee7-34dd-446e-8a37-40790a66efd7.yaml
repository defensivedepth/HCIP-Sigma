name: Recon Information for Export with Command Prompt
id: abea4639-5f68-4396-896d-915c7885780e
description: |
  Detects a built-in enumeration utility (tree.com, wmic.exe, doskey.exe, or sc.exe) being run with its
  output redirected to the TEMP or TMP directory through the parent command line, a pattern consistent with
  staging discovery output to a file for later collection or export. Legitimate administrators occasionally
  capture command output to a temp file during troubleshooting, but redirecting the output of native recon
  tools to a temp path is also a common automated-collection step where an operator dumps host, service, or
  filesystem inventory to disk before exfiltration. Investigation should determine what the tool enumerated,
  what file the output was written to, and whether the same host shows other discovery or staging activity
  around the same time.
type: detection
detection_id: aa2efee7-34dd-446e-8a37-40790a66efd7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event match the rule — a recon utility whose output was redirected to TEMP or TMP?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when both conditions hold:
    the child binary is tree.com, wmic.exe, doskey.exe, or sc.exe (by Image name or OriginalFileName), AND the
    parent command line redirects output to a TEMP or TMP path with ' > %TEMP%\' or ' > %TMP%\'. Read the
    ParentCommandLine to confirm the redirection target and the Image/OriginalFileName to confirm the tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to capture native recon-tool output to a temp file?
  context: >-
    Legitimate administrative troubleshooting sometimes redirects command output to a temp file, but routine
    user or server workloads rarely run tree.com, wmic.exe, doskey.exe, or sc.exe with output piped to TEMP or
    TMP. Knowing whether the user role and host function involve scripted inventory or diagnostics is often the
    fastest way to separate routine operations from staged discovery.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is this parent expected to spawn this recon utility, and what started the parent?
  context: >-
    The redirection lives in the parent command line, so the parent is the process that orchestrated the
    enumeration-to-file step. Tracing the parent's own origin shows whether the chain is interactive
    administration (a user-launched shell) or an automated or unexpected source such as a script interpreter or
    an Office application spawning a command shell. A parent that itself was spawned by an unusual grandparent
    raises the weight of the finding.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: >-
    Automated collection rarely runs a single tool. If the parent spawned this recon utility, it likely spawned
    others — additional discovery commands, archive tools, or copy operations. Examining sibling processes of
    the same parent reveals whether this is one step in a sequence of enumeration commands feeding the same temp
    staging location.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the recon utility enumerate, and what temp file received the output?
  context: >-
    Decode the full command line of the alerting tool and its parent to identify what was enumerated and the
    exact output path. tree.com lists directory structure, wmic.exe queries host/service/process/account
    inventory via WMI, doskey.exe dumps command history or macros, and sc.exe enumerates service configuration.
    The redirection target in the parent command line is the staged file an operator would later collect; note
    its path for follow-on file and exfiltration checks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1119.tuning_parameter
  question: What other native discovery or inventory utilities ran on this host in the surrounding window?
  context: >-
    Automated collection chains discovery utilities together — directory listing, WMI inventory, service and
    account enumeration, network configuration dumps — often within a short burst. Surfacing the common native
    recon binaries on this host around the alert shows whether the redirected tool was an isolated command or
    part of a broader enumeration pass feeding a staging file.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\tree.com'
          - '\wmic.exe'
          - '\doskey.exe'
          - '\sc.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\whoami.exe'
          - '\tasklist.exe'
          - '\reg.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - CommandLine
- source: attack:T1119.time_correlation
  question: How many recon-tool executions occurred on this host in the alert window, and were they clustered in a burst?
  context: >-
    Collection scripts produce repeated process executions in a tight time window rather than spread evenly
    across the day. Counting how many of the rule's recon binaries fired and how closely they cluster helps
    distinguish a single interactive command from automated enumeration. A burst of executions within minutes
    is more consistent with a script than with manual administration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\tree.com'
          - '\wmic.exe'
          - '\doskey.exe'
          - '\sc.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:data_staging_exfil.data_scope
  question: What files were written into the TEMP or TMP directory on this host around the alert?
  context: >-
    The rule fires on output redirected to a temp path, so the staged file should appear as a file event in TEMP
    or TMP. Identifying files created there around the alert time reveals the actual discovery output on disk and
    whether multiple enumeration commands wrote to the same staging location, which indicates deliberate
    collection rather than incidental troubleshooting.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_temp:
        TargetFilename|contains:
          - '\Temp\'
          - '\TMP\'
      condition: selection and selection_temp
    fields:
      - TargetFilename
- source: template:data_staging_exfil.archive_destination
  question: Was the staged temp output subsequently archived, copied, or moved off the host?
  context: >-
    After discovery output is written to a temp file, the next collection step is often compression, copying to
    removable media or a network share, or upload over the network. Looking for archive creation, file moves, or
    new files derived from the staged output shows whether enumeration progressed toward exfiltration or stopped
    at local capture.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_archive:
        TargetFilename|endswith:
          - '.zip'
          - '.rar'
          - '.7z'
          - '.cab'
          - '.gz'
          - '.tar'
      condition: selection and selection_archive
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline
  question: Does this host normally run these recon utilities with output redirected to a temp path?
  context: >-
    A utility that has never been seen on a host, or never seen redirecting output to a temp directory, is more
    notable than one that runs as part of routine maintenance. Low or zero historical counts for these recon
    binaries on this host indicate a first-time or rare execution worth closer review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\tree.com'
          - '\wmic.exe'
          - '\doskey.exe'
          - '\sc.exe'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run native recon utilities like these?
  context: >-
    Compare this user's current action against their historical pattern. A user whose role does not involve
    scripted host inventory or diagnostics, and who has never run these enumeration tools before, is more notable
    than an administrator who runs them regularly. User role and typical toolset should align with the detected
    behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith:
          - '\tree.com'
          - '\wmic.exe'
          - '\doskey.exe'
          - '\sc.exe'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-recon-tool combination historically routine on this host or across the environment?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior; the
    meaningful pivot is the launch mechanism. A parent process that has spawned these recon utilities thousands
    of times before is likely vendor or OS automation, while a new or rare parent for these tools is the
    deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith:
          - '\tree.com'
          - '\wmic.exe'
          - '\doskey.exe'
          - '\sc.exe'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals whether the enumeration was
    confined to one endpoint or part of activity spanning multiple hosts. The same user driving similar discovery
    or staging on several systems widens the potential scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-recon-tool combination fire on other hosts in the same window?
  context: >-
    Under a service or machine account, asking what else the user did returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — parent process plus recon binary — fired on other
    hosts in the alert window. Multiple hosts in the same window point to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith:
          - '\tree.com'
          - '\wmic.exe'
          - '\doskey.exe'
          - '\sc.exe'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Discovery activity rarely occurs in isolation. Examining process activity around the alert shows what led to
    this event and what followed — additional reconnaissance, privilege escalation, or staging — and whether the
    redirected enumeration is one step in a larger sequence on this host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, prior reconnaissance, credential access — may reveal
    the attack stages that preceded this enumeration step and help reconstruct the timeline. The sequence of
    alerts on a host often tells the larger story behind a single discovery event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
