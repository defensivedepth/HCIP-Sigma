      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1119
      covered_by: Q6
      source: attack:T1119.tuning_parameter
      coverage_type: direct
  mutable_dispositions:
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (lookback for burst activity)"
      disposition: new_question
      target_question: Q7
      notes: "Burst/clustering of recon executions in +/-1h window addressed by time_correlation question"
    - element: SuspiciousFileExtensions
      dimension: tuning_parameter
      specific_values: ".pdf, .docx (example collection extensions)"
      disposition: context
      target_question: Q9
      notes: >-
        Brief lists .pdf/.docx as examples of collection-target extensions. This rule detects redirected
        recon-tool output (text dumps to TEMP), not document harvesting, so the document-extension list is not a
        meaningful query filter here. Archive-destination question instead checks archive extensions, which match
        the staging-then-exfil step this rule sits in.
    - element: ProcessCountThreshold
      dimension: tuning_parameter
      specific_values: "rationale only (count before anomalous)"
      disposition: new_question
      target_question: Q6
      notes: >-
        Count-of-recon-utilities angle covered by the discovery-utility aggregation question; exact threshold is
        an analyst judgment call, not a queryable constant.
  dedup_decisions:
    - dropped: none
      reason: "user_actor pair — non-deduplicable (baseline + baseline_svc both kept; clustering + clustering_svc both kept)"
      kept: cue_user_actor.baseline/baseline_svc/clustering/clustering_svc
    - dropped: cue_process_tool.process_chain
      reason: "parent_process is primary cue and parent_child technique set active — parent_process_legitimacy subsumes process_chain"
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.mechanism_decode
      reason: "duplicates parent_child.parent_process_legitimacy (both look up the parent via ParentProcessGuid) — kept the more specific technique-set version"
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.follow_on
      reason: "duplicates parent_child.sibling_processes (both enumerate children of the same parent) — kept the technique-set version"
      kept: parent_child.sibling_processes
    - dropped: cue_parent_process.clustering
      reason: "host-around-alert process activity covered by cue_host_context.clustering; parent-scoped same-time activity covered by sibling_processes"
      kept: cue_host_context.clustering
    - dropped: cue_parent_process.baseline
      reason: "parent-child historical frequency covered by cue_user_actor.baseline_svc (parent+binary baseline over 90d)"
      kept: cue_user_actor.baseline_svc
    - dropped: cue_parent_process.scope
      reason: "cross-host occurrence of the parent+binary pattern covered by cue_user_actor.clustering_svc"
      kept: cue_user_actor.clustering_svc
  skipped_templates:
    - template: service_persistence.service_configuration
      reason: >-
        Template is the EventID-7045 service-installation lookup and its KEEP_EXACT fields
        (ServiceName/ImagePath/StartType/AccountName) only fit a service-creation rule. This rule fires on
        recon-tool output redirection where sc.exe enumerates service config (sc query/qc), not on service
        installation, so the 7045 query has nothing to return. The decode/enumeration slot it would replace is
        instead filled by cue_process_tool.mechanism_decode adapted to the recon binaries. See hint_dispositions.
    - template: service_persistence.service_current_status
      reason: >-
        Rule does not detect service creation; sc.exe here is run for service enumeration with output redirection,
        not to install or start a service. Service-running-status question is not applicable to this recon pattern.
    - template: data_staging_exfil.encryption_password
      reason: >-
        Detected tools (tree/wmic/doskey/sc) do not take encryption/password flags; redirected text output is not
        a password-protected archive. Encryption-flag question not applicable. Archive follow-on covered by archive_destination.
    - template: persistence_scope.process_based_persistence
      reason: >-
        Rule detects collection/discovery, not persistence installation. wmic.exe/sc.exe match on binary name but
        are used here for enumeration with output redirection, not to create persistence. Recommended template, no coverage loss.
    - template: persistence_scope.file_based_persistence
      reason: >-
        Startup-folder/Run-key file drops are unrelated to redirected recon output. Staged-file follow-on is covered
        by data_staging_exfil.data_scope (TEMP/TMP writes). Recommended template, no coverage loss.
    - template: universal.endpoint_protection_health
      reason: >-
        Recommended generic tamper sweep. This rule detects discovery/collection, not payload execution or
        credential access, so tamper-as-precursor is not the live disposition question; prior-alert context is
        already carried by cue_host_context.precursor.
  reflection_overrides: []
  hint_dispositions:
    - hint: "service_persistence.service_configuration replaces cue_process_tool.mechanism_decode"
      disposition: declined
      reason: >-
        The replacement assumes a service-creation rule. service_configuration is a KEEP_EXACT EventID-7045
        service-installation lookup, but this rule fires on recon-tool output redirected to TEMP/TMP, where sc.exe
        is one of several enumeration utilities (sc query/qc) and no service is installed — the 7045 query would
        return nothing. The decode/analysis slot is instead filled by cue_process_tool.mechanism_decode adapted to
        the recon binaries (Q5, "What exactly did the recon utility enumerate, and what temp file received the
        output?"), which is the correct Phase-2 decode for this collection pattern.
