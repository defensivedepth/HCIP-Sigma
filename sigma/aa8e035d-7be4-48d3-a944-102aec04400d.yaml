name: Suspicious Extrac32 Execution
id: a4c1c90f-f9fa-4d34-b192-a1bbf3c83ffc
description: |
  Detects extrac32.exe, the signed Microsoft CAB-extraction utility, invoked with a command line that references a .cab archive together with copy/overwrite or UNC switches (/C, /Y, or a UNC path). This shape repurposes extrac32 as a signed proxy to fetch or copy a payload over SMB or WebDAV, an alternative to certutil or bitsadmin download cradles. Modern administration uses expand or Add-AppxPackage instead, so an extrac32 invocation matching this pattern is worth confirming and tracing to the file it pulled or copied. The rule fires when all of the lolbin, archive, and option selections match together.
type: detection
detection_id: aa8e035d-7be4-48d3-a944-102aec04400d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line invoke extrac32.exe with a .cab reference and the /C, /Y, or UNC switches the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the full command line against the rule's criteria, which require all three to be present together — the extrac32 identity, a .cab reference, and a copy/overwrite switch (/C or /Y) or a UNC path. Note the source and destination operands; a colon in the destination indicates extraction into an NTFS alternate data stream rather than a plain copy or download.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run extrac32.exe to copy or fetch files?
  context: Legitimate administrative activity can trigger this detection, but extrac32 is rarely used in modern administration for downloads or copies. Knowing whether the user role and host function involve CAB handling, driver installation, or packaging is often the fastest path to distinguishing a routine operation from a signed-binary proxy abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this extrac32 invocation do? Decode the source and destination operands and the switches.
  context: The full command line reveals whether extrac32 copied from a local path, fetched from a UNC or WebDAV location, or wrote into an NTFS alternate data stream. Resolve the source operand (local path versus \\server\share UNC), the destination operand (a plain path, or a path with a colon designating a stream name such as host.txt:hidden.exe), and the switches (/C copy-only, /Y overwrite without prompt). The destination operand is the path the analyst pivots on to confirm the transfer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned extrac32.exe and is that parent chain expected?
  context: The parent process reveals how extrac32 was invoked. Driver-install and packaging contexts (printer-driver installers, Windows Update components) are the usual legitimate parents. A parent such as cmd.exe, powershell.exe, mshta.exe, wscript.exe, or an Office application outside a CAB-handling context points toward operator-driven or scripted abuse.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.evidence_preservation
  question: Is the file extrac32 copied or fetched still on disk for analysis?
  context: If the command references a destination file (a downloaded or copied payload, or content written into an alternate data stream), checking whether it still exists on disk enables deeper analysis — hash lookups, sandbox submission, or content review. Resolve the destination operand from the command line, including any stream name after a colon.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:lolbin.renamed_binary_check
  question: Was extrac32.exe executed from its expected System32 or SysWOW64 path?
  context: extrac32.exe normally lives at C:\Windows\System32\extrac32.exe or C:\Windows\SysWOW64\extrac32.exe. Execution from a user-writable or non-standard path may indicate the binary was copied or renamed to evade path-based allowlists. Compare the Image path against the OriginalFileName to spot a relocated or renamed copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: attack:T1105.network_connection
  question: Did extrac32.exe open a network connection to an external or remote destination around the time of the alert?
  context: When the command line carries a UNC path or WebDAV target, extrac32 reaches across the network to fetch the source file. A process-initiated connection to an external address or an internal file server confirms the transfer left the host's local disk and identifies the remote endpoint to scope and block. If network telemetry is not collected for this host, treat zero results as a visibility gap rather than evidence no connection occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:download_tool.download_success_verification
  question: Did a file actually appear at the destination path after the extrac32 command ran?
  context: An extrac32 copy or fetch command does not guarantee the file arrived. Network errors, a missing WebClient service for WebDAV, blocked shares, or security controls may have stopped the transfer. Confirming file creation at the destination path establishes whether the activity progressed past the delivery stage.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: Can you retrieve and analyze the file extrac32 produced from a safe environment?
  context: If the destination file is still on disk, submitting its hash to threat intelligence services or detonating it in a sandbox reveals whether it is a known malicious payload, a legitimate tool, or something novel that requires deeper analysis. Files written into an alternate data stream are not visible in a normal directory listing and must be enumerated explicitly before hashing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the destination directory?
  context: A fetch or copy operation often lands multiple files in the same staging directory, or the retrieved file triggers further writes such as extraction or additional downloads. Examining directory-level file activity reveals the broader scope of the delivery and any follow-on payloads written alongside the alerting file.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      filter_self:
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection and not filter_self
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.follow_on
  question: What child processes did extrac32.exe spawn afterward?
  context: A plain copy or extraction leaves no children. Processes spawned by extrac32 — or by the file it just delivered — would indicate the transfer fed directly into execution. Watch for cmd.exe, powershell.exe, rundll32.exe, or the fetched binary itself running shortly after.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run extrac32.exe to copy or fetch files?
  context: Compare this user's current action against their historical behavior. A user who has never driven this CAB-handling or copy pattern is more suspicious than one who does so regularly as part of a packaging or driver-deployment role. User role and typical toolset should align with extrac32 usage.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-extrac32 combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute the behavior. The meaningful pivot is the launch mechanism — which parent process spawned extrac32, and whether that pair is historically common. A new or rare parent for extrac32 on this host or environment-wide is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar transfer or tooling activity on other hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-extrac32 combination fire on other hosts in the same window, indicating a coordinated automation rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — the parent process spawning extrac32 — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the extrac32 copy-or-fetch pattern over the past 90 days, and what command-line shapes are typical?
  context: An extrac32 abuse pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic extrac32 usage. The command-line projection lets the analyst compare typical invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_lolbas:
      - CommandLine|contains: extrac32.exe
      - Image|endswith: \extrac32.exe
      - OriginalFileName: extrac32.exe
      selection_archive:
        CommandLine|contains: .cab
      selection_options:
        CommandLine|contains:
        - /C
        - /Y
        - ' \\\\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were any other download or transfer LOLBins used on this host recently?
  context: Operators who use one signed download proxy often use several. If extrac32 was used to fetch or copy a payload, check whether certutil, bitsadmin, curl, esentutl, expand, makecab, or replace were also used for the same objective. Finding multiple transfer LOLBins in the same window strengthens the case for deliberate tooling rather than incidental use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded a signed-binary transfer and help reconstruct the full timeline leading to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
