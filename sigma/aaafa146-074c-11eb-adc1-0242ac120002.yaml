name: HackTool - Hydra Password Bruteforce Execution
id: 8bcd503e-729c-46f8-b4f3-070a9168ce0c
description: |
  Detects command-line invocation of the Hydra network login brute-forcer by its characteristic
  credential-feeding flags: the rule fires when a command line contains both -u and -p together with
  the http-form placeholder tokens ^USER^ and ^PASS^. Hydra drives parallel authentication attempts
  against a protocol endpoint (SSH, RDP, SMB, FTP, HTTP form logins, and many others), so a true
  positive means an operator is guessing credentials, often as a single password against many accounts
  or many passwords against one account. Legitimate context is narrow and usually limited to an
  authorized assessment; investigate which target and protocol were specified, whether the run produced
  authentication failures and any successful logon, and whether the activity was sanctioned.
type: detection
detection_id: aaafa146-074c-11eb-adc1-0242ac120002
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain the -u and -p credential flags together with the ^USER^ and ^PASS^ form placeholders?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact command line. The rule fires only when -u and -p both appear alongside the literal ^USER^
    and ^PASS^ tokens, which are the http-form module placeholders this tool substitutes credentials
    into. Read the full command to see the target, protocol, and credential source.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run credential brute-forcing tools?
  context: Legitimate use of a network login brute-forcer is rare outside of authorized assessment work.
    Knowing whether the user role and host function are consistent with running offensive credential
    tooling is often the fastest path to distinguishing a sanctioned test from unauthorized activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this tool execution part of an authorized penetration test or red team engagement?
  context: Network login brute-forcers are used in authorized security assessments. Before investing
    investigation time, check whether a pentest or red team exercise is currently active on this host
    or network segment. An authorized engagement with matching tool usage, target, and timing resolves
    the alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: What target, protocol, and credential source did this invocation specify?
  context: The command line reveals which mode was driven. Look at the target host or CIDR, the protocol
    module (ssh, rdp, smb, ftp, http-post-form, and others), and the credential flags. A single login
    with a password list points to password guessing against one account, a login list with a single
    password points to spraying across many accounts, and a combo file points to credential stuffing.
    The presence of ^USER^ and ^PASS^ indicates an http form login is being attacked.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: Which accounts and credential source were fed into this run?
  context: Brute-forcing targets a specific account or set of accounts using a supplied credential
    source. Decode the command line to identify the login or login file, the password or password file,
    and any combo file, so you can determine which accounts may be at risk and whether high-value
    identities such as administrators or service accounts were among the targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: Did this tool leave its characteristic restore or output files on the host?
  context: A network login brute-forcer writes a restore file roughly every five minutes during a run
    so the session can resume after interruption, and it writes result output when an output flag is
    set. Finding these artifacts confirms a run actually executed even if the originating process has
    exited, and the file timestamps bound the duration of the attempt.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - 'hydra.restore'
          - 'hydra'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this tool and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. A brute-forcer launched from an
    interactive shell or a remote-access session looks different from one launched by a script host
    or an Office application. Unusual parents such as wscript.exe, mshta.exe, or a browser may indicate
    the tool arrived through a delivery mechanism rather than deliberate operator use.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes hands-on-keyboard activity. The query surfaces direct attempts
    to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW.
    Zero rows is a useful indication that protection looks healthy; kernel-level driver tampering and
    in-memory patches will not appear here. Populated rows shift the disposition toward operator
    preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: attack:T1110.001.authentication_failures
  question: Did a burst of failed logon attempts targeting the same or similar accounts appear in the security log around this time?
  context: Password guessing produces a series of authentication failures against one account or a small
    set of similar accounts. Correlate the run with failed logon events to confirm the tool actually
    reached an authentication endpoint and to see which accounts and source addresses were involved.
    A 5 to 10 minute correlation window around the process is a reasonable starting point, and a tight
    cluster of failures against few accounts fits guessing rather than broad spraying.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4625
          - 4776
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
- source: attack:T1110.successful_logon
  question: Was there a successful logon shortly after the failed-attempt burst on this host?
  context: A brute-force run that ends in a successful authentication is the outcome that turns guessing
    into account compromise. A successful logon immediately following a high volume of failures, from
    the same source or against the same account, indicates a credential was found. Match the successful
    logon account and source address against the failed-attempt cluster to determine whether the guess
    succeeded and which account is now at risk.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4624
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts were targeted, and do any have elevated privileges?
  context: The severity of a brute-force run depends on the privilege level of the targeted accounts.
    A domain administrator or broadly privileged service account being guessed requires incident
    escalation; a single standard user account may only need a password reset and monitoring. Cross-
    reference the targeted logins against directory group memberships to gauge exposure.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously ran the same brute-force flag pattern, what parents and users drove it, and does the current alert fit?
  context: Even uncommon tools can have a sanctioned history on a host. The query mirrors the rule's
    selection scoped to this host, so the resulting parent and user distribution reflects how this
    specific flag pattern has run here before. A new parent process, an unexpected user account, or a
    first-time appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '-u '
        - '-p '
        CommandLine|contains:
        - ^USER^
        - ^PASS^
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts run the same brute-force flag pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide
    count of this specific flag pattern rather than generic tool usage. Many hosts firing the same
    pattern points to scripted deployment or a shared assessment harness; one host or a small unrelated
    set points to manual operator activity. Use the host distribution and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '-u '
        - '-p '
        CommandLine|contains:
        - ^USER^
        - ^PASS^
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '-u '
        - '-p '
        CommandLine|contains:
        - ^USER^
        - ^PASS^
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '-u '
        - '-p '
        CommandLine|contains:
        - ^USER^
        - ^PASS^
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the brute-force run was an
    isolated action or part of broader hands-on activity. If the same user triggered similar activity
    on multiple hosts, the scope of the operation may be larger than this single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '-u '
        - '-p '
        CommandLine|contains:
        - ^USER^
        - ^PASS^
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
