name: Scripting/CommandLine Process Spawned Regsvr32
id: bf84a03b-f289-4181-8bf3-f68d56db85f7
description: |
  Detects a command interpreter or scripting host (cmd.exe, cscript.exe, mshta.exe, powershell_ise.exe,
  powershell.exe, pwsh.exe, or wscript.exe) spawning regsvr32.exe. regsvr32.exe is a Microsoft-signed,
  proxy-aware, TLS-aware binary that can be driven with /i and /u arguments to fetch and execute a remote
  or local script component (.sct) through scrobj.dll, running attacker-controlled JScript or VBScript
  without writing registry entries and bypassing application-allowlisting in baseline configurations.
  A script-engine parent launching regsvr32 is the parent-child pattern this proxy-execution pattern leaves;
  legitimate COM-object registration normally runs regsvr32 under explorer.exe or an installer, not under
  a scripting host. The investigation should confirm the parent-child pair, decode the regsvr32 command
  line for /i, /u, scrobj.dll, and remote or .sct references, and check for module loads and outbound
  connections that indicate proxy execution rather than routine registration. The rule excludes the known
  RpcProxy.dll registration that cmd.exe performs during legitimate Exchange servicing.
type: detection
detection_id: ab37a6ec-6068-432b-a64e-2c7bf95b1d22
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did a scripting or command-line host spawn regsvr32.exe, and is this the RpcProxy registration the rule excludes?
  context: Confirm the alert is a true positive by reviewing the parent and child against the rule's criteria.
    The rule fires when ParentImage ends in cmd.exe, cscript.exe, mshta.exe, powershell_ise.exe, powershell.exe,
    pwsh.exe, or wscript.exe AND Image ends in regsvr32.exe. The rule suppresses one known-good case, cmd.exe
    running regsvr32 with " /s C:\Windows\System32\RpcProxy\RpcProxy.dll"; if the alerting command line resembles
    that but differs, note how it differs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to register COM components or run regsvr32 from a scripting host?
  context: Legitimate regsvr32 use is normally driven by installers or interactive COM registration, not by a
    script interpreter. Knowing whether this user role and host function routinely register components, or run
    automation that does, is often the fastest way to separate routine activity from proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is this scripting host expected to spawn regsvr32, and what started the parent?
  context: The parent-child pair is the core signal for this detection. Tracing the parent's own origin reveals
    whether the chain is legitimate, such as a user launching a maintenance script, or suspicious, such as a
    document macro or downloaded script driving mshta.exe or wscript.exe to launch regsvr32.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: attack:T1218.010.command_analysis
  question: What were the full regsvr32 arguments, and do they include /i, /u, scrobj.dll, or a remote or .sct reference?
  context: The command line distinguishes proxy execution from registration. The script-component bypass uses
    /i with a URL or .sct path together with scrobj.dll, often with /s, /n, and /u, so that regsvr32 fetches and
    runs embedded JScript or VBScript without registering anything. A command line with /i pointing at an http or
    https URL or a path ending in .sct, paired with scrobj.dll, is the proxy-download-and-execute pattern. The query
    re-displays the alerting event so the analyst can read and decode the arguments.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.sibling_processes
  question: What other child processes did the same scripting-host parent spawn?
  context: If the parent that launched regsvr32 is part of an operation, it likely spawned other processes too.
    Sibling processes reveal the full scope of activity from that parent; multiple unexpected children from one
    script-engine parent points to orchestration rather than a single registration call.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.010.image_load
  question: What modules did regsvr32 load shortly after launch, and was scrobj.dll or an untrusted DLL among them?
  context: Proxy execution shows up at the module-load layer as regsvr32 loading scrobj.dll (the script-component
    runtime) or a DLL from a temporary or user-writable directory rather than only System32 modules. A scrobj.dll
    load or an unsigned DLL loaded from an unusual path shortly after regsvr32 launch confirms the .sct or DLL
    proxy-execution path. If module-load telemetry is not collected in this environment, treat zero results as a
    visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \regsvr32.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.010.network_connection
  question: Did regsvr32 make any outbound network connections around the time of the alert?
  context: regsvr32 is proxy-aware and TLS-aware and can act as an http or https downloader when /i points at a
    remote URL, so an outbound connection from regsvr32 is a strong sign it fetched a remote script component
    rather than registering a local DLL. Review the destination address and port; connections to external or
    uncategorized hosts warrant retrieving the fetched content. If network telemetry for this host is not
    collected, treat zero results as a visibility gap rather than evidence nothing was fetched.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \regsvr32.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:lolbin.renamed_binary_check
  question: Was regsvr32.exe executed from its expected System32 or SysWOW64 path?
  context: regsvr32 run from a path outside System32 or SysWOW64 may be a copied or renamed binary placed to
    evade path-based allowlists. Compare the executable path and OriginalFileName; a regsvr32 running from a
    user temp or AppData directory is more suspicious than one in System32.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.follow_on
  question: What child processes did regsvr32 spawn afterward?
  context: The processes regsvr32 spawns reveal the actual impact of the proxy execution. A script component
    commonly launches cmd.exe, powershell.exe, wscript.exe, or conhost.exe for post-exploitation; routine
    COM registration spawns nothing. Unexpected children point to executed payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Does this parent scripting host normally spawn regsvr32 on this host?
  context: Some parent-child pairings are routine while a script interpreter spawning regsvr32 is inherently
    unusual outside specific automation. Historical frequency of this specific parent-to-regsvr32 pairing on
    this host distinguishes an established automation pattern from a novel spawning relationship.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \regsvr32.exe
      filter_main_rpcproxy:
        ParentImage: C:\Windows\System32\cmd.exe
        CommandLine|endswith: ' /s C:\Windows\System32\RpcProxy\RpcProxy.dll'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \regsvr32.exe
      filter_main_rpcproxy:
        ParentImage: C:\Windows\System32\cmd.exe
        CommandLine|endswith: ' /s C:\Windows\System32\RpcProxy\RpcProxy.dll'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user drove similar activity on several hosts, the scope of the operation may be
    larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \regsvr32.exe
      filter_main_rpcproxy:
        ParentImage: C:\Windows\System32\cmd.exe
        CommandLine|endswith: ' /s C:\Windows\System32\RpcProxy\RpcProxy.dll'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the scripting-host-spawns-regsvr32 pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more notable than one used regularly under stable
    parents. The query mirrors the rule's selection scoped to this host, so the count reflects the rule's specific
    firing pattern rather than generic regsvr32 usage. The command-line projection lets the analyst compare
    typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \regsvr32.exe
      filter_main_rpcproxy:
        ParentImage: C:\Windows\System32\cmd.exe
        CommandLine|endswith: ' /s C:\Windows\System32\RpcProxy\RpcProxy.dll'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If regsvr32 was driven to run a script
    component, check whether rundll32, mshta, msiexec, installutil, or similar binaries were also used to run
    arbitrary code. Multiple proxy-execution LOLBins on one host strengthens the case for hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering,
    reconnaissance, or initial-access activity, may reveal the stages that preceded a proxy-execution attempt
    and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
