name: PowerShell Script Run in AppData
id: 800c385a-d92f-46a9-b730-672ff482a4fb
description: |
  Detects a command line that references a PowerShell or pwsh interpreter together with a cmd-style /c switch and a path under a user's AppData directory (Local or Roaming). This pattern is common when a dropped or staged script in a per-user writable location is launched indirectly through cmd.exe, which can be legitimate installer or developer tooling but also matches how loaders and document-spawned macros stage and run PowerShell from AppData. The investigation should decode the full command, determine the parent that launched it, and confirm whether the user, host, and AppData path are expected for this activity.
type: detection
detection_id: ac175779-025a-4f12-98b0-acdaeb77ea85
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line reference a PowerShell/pwsh interpreter plus a /c switch and an AppData path?
  context: Confirm the alert is a true match before investing time. The rule fires only when the command line references a PowerShell interpreter (powershell.exe, \powershell, \pwsh, or pwsh.exe) AND contains both '/c ' and '\AppData\' AND references either a Local\ or Roaming\ subpath. Read the exact command line and verify all three conditions are present rather than an incidental substring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to launch PowerShell scripts from an AppData directory?
  context: Legitimate installers, updaters, and developer tooling sometimes stage helper scripts under a per-user AppData path and invoke them through cmd. Knowing whether this user role and host function normally run such scripts is often the fastest way to separate routine tooling from staged execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly does this command do? Decode the full command line, including the AppData script path it references.
  context: The full command line reveals the action taken. Resolve the exact AppData script or file path referenced, decode any encoded or obfuscated arguments, and identify what the launched PowerShell is instructed to do. Scoped to the triggering event so the analyst reads the precise command that fired.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated? What does it decode to?
  context: Attackers frequently use PowerShell's -EncodedCommand (-enc) parameter or string concatenation, backtick escaping, and variable substitution to hide intent. Base64-encoded commands are the most common form. Decoding reveals the actual payload -- download cradles, reverse shells, or in-memory execution of .NET assemblies. Pay particular attention to whether the referenced AppData path is a script to dot-source or a payload to load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually executes, even when the launching command line is encoded or obfuscated. This provides ground truth about what ran from the AppData path, bypassing command-line obfuscation. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell controls before running a payload. Common forms include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), constrained language mode escape, and downgrade to PowerShell v2 which lacks logging. Finding these precursor events on the host strengthens the case that the AppData script execution is malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this command, and is that parent chain expected?
  context: The parent reveals how the command was invoked. A cmd /c launch of PowerShell from AppData driven by explorer.exe or a script host differs sharply from one driven by an Office application, mshta.exe, wscript.exe, or a browser-derived process, which point to document-spawned or download-driven execution. The immediate parent is visible in the alert; identify what spawned that parent and what else it launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1059.001.time_correlation
  question: Did this execution occur outside this host's normal administrative or maintenance window?
  context: Scripted execution from AppData that runs off-hours, outside change windows, or at a time inconsistent with the user's normal activity is more likely to be operator-driven than routine tooling. Compare the alert timestamp against when AppData-staged PowerShell activity normally runs on this host.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - powershell.exe
        - \powershell
        - \pwsh
        - pwsh.exe
      selection2:
        CommandLine|contains|all:
        - '/c '
        - \AppData\
        CommandLine|contains:
        - Local\
        - Roaming\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this AppData-PowerShell pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine tooling can stage scripts in AppData. This query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern -- not generic PowerShell usage -- has historically run here. A new parent process, an unexpected user, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - powershell.exe
        - \powershell
        - \pwsh
        - pwsh.exe
      selection2:
        CommandLine|contains|all:
        - '/c '
        - \AppData\
        CommandLine|contains:
        - Local\
        - Roaming\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this AppData-PowerShell pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of this firing pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or vendor tooling; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - powershell.exe
        - \powershell
        - \pwsh
        - pwsh.exe
      selection2:
        CommandLine|contains|all:
        - '/c '
        - \AppData\
        CommandLine|contains:
        - Local\
        - Roaming\
      condition: all of selection*
    fields:
    - host.name
- source: template:cue_process_tool.follow_on
  question: What child processes did this command spawn afterward?
  context: The processes spawned after the launch reveal its actual impact. A staged script that drops and runs further interpreters, certutil.exe, rundll32.exe, or network utilities indicates post-execution activity rather than a benign one-shot script. Scoped to the parent instance via its process identifier.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Staged execution rarely occurs alone. Activity surrounding the AppData script launch may reveal reconnaissance, privilege escalation, persistence installation, or data staging that provides broader context. Aggregating collapses repetitive agent telemetry while novel processes stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - powershell.exe
        - \powershell
        - \pwsh
        - pwsh.exe
      selection2:
        CommandLine|contains|all:
        - '/c '
        - \AppData\
        CommandLine|contains:
        - Local\
        - Roaming\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - powershell.exe
        - \powershell
        - \pwsh
        - pwsh.exe
      selection2:
        CommandLine|contains|all:
        - '/c '
        - \AppData\
        CommandLine|contains:
        - Local\
        - Roaming\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on multiple endpoints. If the same user triggered similar AppData script execution elsewhere, the scope may be larger than this single host. This degenerates to agent-telemetry noise under a service account, which the launch-mechanism clustering question handles instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - powershell.exe
        - \powershell
        - \pwsh
        - pwsh.exe
      selection2:
        CommandLine|contains|all:
        - '/c '
        - \AppData\
        CommandLine|contains:
        - Local\
        - Roaming\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the stages that preceded this execution and help reconstruct the timeline. Look for sequences such as tampering or reconnaissance followed by execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
