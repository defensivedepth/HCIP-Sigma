name: Potential Binary Proxy Execution Via VSDiagnostics.EXE
id: 07928136-ff54-4e62-b355-0dac8c180f81
description: |
  Detects execution of VSDiagnostics.exe with the "start" command and a "/launch:" or "-launch:" argument, which causes this Microsoft-signed diagnostics binary to launch and proxy an arbitrary executable. The rule fires only when the Image (or OriginalFileName) is VSDiagnostics.exe AND the command line contains "start" AND a launch argument are all present together. Because the launched process inherits the trust and parent lineage of a signed binary, this pattern is used to run an attacker-chosen executable while evading controls keyed on the immediate parent. Legitimate tracing and diagnostics workflows can use the same syntax, so the investigation should establish what binary was launched, where it came from, and whether the activity fits expected use on this host and user.
type: detection
detection_id: ac1c92b4-ac81-405a-9978-4604d78cc47e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show VSDiagnostics.exe run with "start" and a "/launch:" or "-launch:" argument?
  context: Confirm the alert is a true positive by reviewing the exact command line and process identity against the rule's criteria. All three elements must be present together. The binary resolves to VSDiagnostics.exe by Image or OriginalFileName, the command line contains "start", and it contains a launch argument that names a target executable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run application tracing or diagnostics tooling?
  context: Legitimate performance tracing and diagnostics activity can trigger this detection. Knowing whether the user role and host function involve software development, profiling, or support work is often the fastest way to separate routine diagnostics from proxy-execution abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What executable does the "/launch:" or "-launch:" argument name, and what does the rest of the command line do?
  context: The launch argument names the binary that VSDiagnostics.exe will start as a proxied child. Read the full path or name after "/launch:" or "-launch:", note any additional arguments passed to that target, and identify whether the launched file is a known application, a script host, an interpreter, or an unfamiliar executable in a user-writable location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.image_load
  question: What modules did the launched process load after VSDiagnostics.exe started it?
  context: Proxy execution via a signed binary hands control to a launched target whose loaded modules reveal its real behavior. Unsigned DLLs, modules loaded from user-writable or temporary directories, or scripting and .NET runtime components loaded by an otherwise unexpected process point to a payload rather than ordinary diagnostics. Pivot from the launched child process to its image-load events. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.network_retrieval
  question: Did the launched process or VSDiagnostics.exe make outbound network connections after the proxy execution?
  context: One variant of proxy execution uses the trusted binary, or the executable it launches, to retrieve a remote payload or establish command and control. Outbound connections to external addresses shortly after the launch, especially to raw IP addresses or uncommon ports, shift the disposition toward malicious use. Scope to the launched process where possible and exclude known-good internal destinations when reviewing results.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.process_chain
  question: What process spawned VSDiagnostics.exe, and is that parent chain expected for diagnostics activity?
  context: The parent process shows how the proxy execution was invoked. Legitimate tracing is usually launched from a development environment, an installer, or an interactive shell driven by a user. A parent such as a script host, an Office application, or a remote-access tool indicates the launch was driven by something other than ordinary diagnostics use.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did VSDiagnostics.exe spawn afterward?
  context: The processes spawned through the proxy reveal the actual impact of the launch. The directly launched target appears here, and any further processes it spawns, such as command interpreters, script hosts, or reconnaissance utilities, indicate post-execution activity beyond benign profiling.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run VSDiagnostics.exe?
  context: A diagnostics binary that has never been seen on a host is more notable than one that runs regularly as part of a development or support workflow. Zero or very low historical counts indicate first-time or rare execution and raise the priority of confirming what was launched.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's VSDiagnostics launch pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate diagnostics can use this syntax. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual launch target compared with that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VSDiagnostics.exe
      - OriginalFileName: VSDiagnostics.exe
      selection_cli_start:
        CommandLine|contains: start
      selection_cli_launch:
        CommandLine|contains:
        - ' /launch:'
        - ' -launch:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's VSDiagnostics launch pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific launch pattern rather than generic use of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VSDiagnostics.exe
      - OriginalFileName: VSDiagnostics.exe
      selection_cli_start:
        CommandLine|contains: start
      selection_cli_launch:
        CommandLine|contains:
        - ' /launch:'
        - ' -launch:'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run application diagnostics or tracing tools?
  context: Compare this user's current action against their historical behavior. A user who has never run VSDiagnostics.exe is more notable than one who profiles applications regularly. User role and typical toolset should align with diagnostics activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and VSDiagnostics.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior, so the meaningful pivot is the launch mechanism. A new or rare parent for VSDiagnostics.exe on this host or environment-wide is the deviation worth chasing; a pair that already accounts for many prior events is more consistent with vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the activity may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and VSDiagnostics.exe combination fire on other hosts in the same window, indicating coordinated automation rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The meaningful question is whether the same launch mechanism, parent process plus spawned binary, fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence activity near the launch.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the full timeline leading to the proxy execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
