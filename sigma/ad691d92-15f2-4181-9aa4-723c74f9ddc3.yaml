name: Potential Defense Evasion Via Right-to-Left Override
id: 4d73f7e0-9f54-41ee-b0c6-221af7b94886
description: |
  Detects a command line containing the right-to-left override character (U+202E) or its escaped/bracketed forms. This Unicode control character reverses the display order of the characters that follow it, and is commonly used to disguise an executable extension so a file looks like a benign document or media file while Windows still executes the true extension. Legitimate use is largely limited to filenames or command lines that contain genuine right-to-left script such as Arabic or Hebrew. The investigation should confirm the character is present, decode what the real file name and extension are, determine how the file arrived and was launched, and establish whether the user, host, and parent chain are consistent with that activity.
type: detection
detection_id: ad691d92-15f2-4181-9aa4-723c74f9ddc3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain a right-to-left override character or one of its escaped forms?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line for the right-to-left override character. The rule fires when the command line contains the raw U+202E character or one of its escaped or bracketed representations. Because the override reverses display order, the character is often invisible in a console and shows up only as a gap or as a reversed file extension; copy the raw command line into a hex or byte view to confirm the U+202E byte sequence is actually present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a command line that contains right-to-left script characters?
  context: Command lines containing the right-to-left override character can be legitimate when the user or host routinely works with Arabic, Hebrew, or other right-to-left language content in file names or arguments. Knowing whether the user role and host function involve right-to-left language data is often the fastest path to distinguishing a localized false positive from extension-spoofing masquerade.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the true file name and extension once the right-to-left override is resolved, and what does the command actually launch?
  context: The override reverses the display of every character that follows it, so the visible extension is not the real one. Resolve the override to recover the actual byte order and identify the true trailing extension, then read the full command line to determine which binary is being executed and with what arguments. A name that displays as a document or media file but resolves to an executable extension is the masquerade this rule targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
- source: template:masquerading.true_identity
  question: What is the actual identity of the executed binary based on its metadata and hash?
  context: When a file uses the override to disguise its extension, the binary still carries its real PE metadata and code-signing details. Compare the Image path against the embedded OriginalFileName and check the signing party and signature status to determine whether this is a signed system binary, a third-party signed tool, or an unsigned or tampered file. The file hash enables a reputation lookup to determine whether the binary is a known legitimate tool, a known malicious sample, or a novel file requiring deeper analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did the file referenced in this command line arrive on the host?
  context: Files that use the override to spoof their extension do not appear spontaneously; they are typically downloaded, extracted from an archive, or dropped by another process. Tracing the file creation event for this binary reveals the delivery mechanism, and an untrusted source such as a browser download, an email attachment path, or an archive extraction is a strong indicator that the visual extension was meant to deceive a user into launching it.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1036.002.execution_context
  question: Was the file launched from a download, temporary, or other user-writable location rather than a trusted install path?
  context: The override is most often used against files delivered through untrusted channels, where the spoofed extension tricks a user into opening what looks like a document. A launch path under a Downloads, Temp, AppData, Desktop, or removable-media directory points toward user-initiated execution of a delivered payload, whereas a managed install or system path is more consistent with localized or scripted activity. Read the working directory and the resolved file path to place where the file lived when it ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this execution and is that parent chain expected?
  context: The parent process reveals how the file was launched. A launch from explorer.exe is consistent with a user double-clicking a disguised file, which is the intended outcome of extension spoofing. A launch from a browser, mail client, archive utility, script host such as wscript.exe or mshta.exe, or an Office application can indicate delivery through phishing or a malicious document.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution?
  context: The point of disguising a file with the override is to evade a user's scrutiny while the binary performs its intended function. Examining the child processes, command lines, and follow-on activity launched by this binary reveals its actual objective, such as additional download, persistence installation, reconnaissance, or further execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1036.002.time_correlation
  question: Was the file created on this host shortly before it was executed?
  context: A short interval between the creation of a file and its execution is consistent with a delivered payload that was opened soon after it landed, which is the typical pattern for extension-spoofed files arriving through download or attachment. Compare the file creation time for this binary against the execution time; a recently created file that runs almost immediately strengthens the case for malicious delivery, while a file that has existed for a long time before running is more consistent with established or localized activity.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a localized environment that legitimately uses right-to-left characters will show a recurring parent and user distribution for command lines that contain the override. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - \u202e
        - '[U+202E]'
        - "‮"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - \u202e
        - '[U+202E]'
        - "\u202E"
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - \u202e
        - '[U+202E]'
        - "\u202E"
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same identity drove activity on multiple endpoints. If the same user triggered similar activity elsewhere in the same window, the scope of the incident may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - \u202e
        - '[U+202E]'
        - "\u202E"
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of command lines containing the override character. Many hosts firing the same pattern can point to a shared localized workflow or scripted deployment, while one host or a small unrelated set points to manual or targeted activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - \u202e
        - '[U+202E]'
        - "‮"
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as reconnaissance, delivery of additional files, or defense tampering, may reveal the attack stages that preceded this event and help reconstruct the full timeline of how a disguised file was delivered and launched.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
