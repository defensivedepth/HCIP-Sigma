name: UAC Bypass Using MSConfig Token Modification - Process
id: 161f6748-3ab6-4498-9097-8743c2020571
description: |
  Detects a known User Account Control bypass in which a helper binary named pkgmgr.exe, running from a
  user-writable AppData\Local\Temp directory, launches msconfig.exe with the "-5" switch and the resulting
  process runs at High or System integrity. This is the exact signature of a published UAC-bypass method that
  abuses msconfig token handling to elevate a split-token administrator from Medium to High integrity without a
  consent prompt. The pattern has no legitimate use: msconfig is not normally spawned from a Temp-resident
  pkgmgr.exe, and the "-5" argument corresponds to the bypass tooling rather than ordinary system configuration.
  The investigation should confirm the parent, command, and integrity level all match, identify what dropped and
  launched the Temp pkgmgr.exe, and determine what was done with the elevated token immediately afterward.
type: detection
detection_id: ad92e3f9-7eb6-460e-96b1-582b0ccbb980
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the parent, command line, and integrity level all match this UAC-bypass pattern?
  context: >-
    Confirm the alert is a true positive by reviewing the triggering event. The rule fires only when all three
    conditions hold together: the parent process is a pkgmgr.exe located under AppData\Local\Temp, the command
    line is exactly msconfig.exe launched with the "-5" switch, and the process runs at High or System integrity.
    Read the full event to verify each element is present, since any one of them alone is far less specific than
    the combination.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
      - IntegrityLevel
- source: template:universal.host_user_context
  question: Is this user and host expected to run msconfig from a Temp-resident helper at elevated integrity?
  context: >-
    Legitimate use of msconfig is launched interactively by an administrator from the standard system path, not
    spawned by a binary sitting in a user Temp directory. Knowing whether the acting user holds an administrative
    role on this host, and whether any sanctioned tooling on this host behaves this way, helps separate a genuine
    bypass attempt from an unusual but authorized workflow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: What dropped and launched the Temp pkgmgr.exe, and what started that process?
  context: >-
    The parent in this detection is a pkgmgr.exe running from AppData\Local\Temp, which is itself a planted
    component rather than the genuine system package manager. Tracing the parent's own origin reveals how the
    bypass tooling arrived and ran: a download utility, an email or browser child, a script host, or a freshly
    extracted archive in the parent chain points to operator activity, while a benign installer chain is less
    consistent with this pattern. A non-elevated process spawning an auto-elevated child is the parent-child
    anomaly the technique relies on.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What does the msconfig "-5" invocation do, and what is the full command and working directory?
  context: >-
    Read the full command and the launching context to understand the mechanism. The "-5" switch corresponds to a
    specific numbered UAC-bypass method that abuses msconfig token handling; msconfig run this way is a proxy for
    the bypass, not a configuration task. Note the working directory and any additional arguments, and confirm the
    binary path resolves to the genuine system msconfig rather than a relocated or renamed copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_cmd:
        CommandLine|contains: 'msconfig.exe'
      condition: selection_host and selection_cmd
    fields:
      - CommandLine
      - CurrentDirectory
      - ParentImage
- source: template:parent_child.sibling_processes
  question: What other child processes did the same Temp pkgmgr.exe spawn?
  context: >-
    If the planted pkgmgr.exe spawned msconfig to elevate, it may have spawned other processes in the same window
    to carry out the operator's objective once elevated. Multiple children from the same parent instance reveal
    the full scope of activity orchestrated through this helper rather than a single isolated launch.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1548.002.token_manipulation
  question: Did another process open a handle to the elevated msconfig process to manipulate its token?
  context: >-
    This method works by manipulating the token of the elevated msconfig process. Process-access events show which
    processes opened handles to msconfig and with what rights; access masks that grant token or full process
    rights from a non-system parent are consistent with token theft or impersonation. If process-access telemetry
    is not collected in this environment, treat the absence of these events as a visibility gap rather than
    evidence nothing occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\msconfig.exe'
      condition: selection
    fields:
      - SourceImage
      - TargetImage
      - GrantedAccess
- source: attack:T1548.002.image_load
  question: What modules were loaded into the elevated msconfig or the Temp pkgmgr.exe, and were any unsigned or Temp-resident?
  context: >-
    Several UAC-bypass families plant a malicious module that an auto-elevated binary loads from a writable
    location. Examining the modules loaded into msconfig and the Temp pkgmgr.exe surfaces any DLL loaded from a
    user-writable path or any unsigned module, which would indicate a search-order or planted-module component
    alongside the token manipulation. If module-load telemetry is not collected in this environment, treat zero
    results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\msconfig.exe'
          - '\pkgmgr.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1548.002.elevated_token_assignment
  question: Did the Security log record sensitive-privilege or special-logon assignment for the elevated process?
  context: >-
    A successful bypass results in a process running with a high-integrity token holding sensitive privileges. The
    Windows Security log records special privileges assigned to a new logon or process, which is authoritative for
    whether elevation actually took effect rather than merely being attempted. Correlate the assignment time with
    the alerting process. If Security audit events for privilege assignment are not collected in this environment,
    treat their absence as a visibility gap rather than proof elevation failed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4672
          - 4673
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - ProcessName
      - PrivilegeList
- source: attack:T1548.002.registry_uac_keys
  question: Were UAC-related registry handler keys written on this host around the time of the alert?
  context: >-
    Some UAC-bypass methods stage a command in a per-user registry handler key that an auto-elevated process reads
    and executes. While the msconfig token-modification method is not primarily registry-based, an operator who
    tried this method may have attempted handler-hijack methods in the same window. Writes to per-user
    shell-handler keys such as ms-settings, mscfile, exefile, or Shell\Open\command around the alert indicate a
    parallel or fallback bypass attempt. If registry-set telemetry is not collected in this environment, treat
    zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - 'ms-settings\Shell\Open\command'
          - 'mscfile\shell\open\command'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:uac_bypass.elevated_action_after_bypass
  question: What action was performed with elevated privileges after the bypass?
  context: >-
    UAC bypass is a means to an end: the operator elevates in order to act at high integrity. Examine processes
    that ran at High or System integrity on this host in the window after the bypass for the objective. Common
    follow-on actions include credential dumping (procdump, comsvcs.dll MiniDump), persistence installation
    (schtasks, sc.exe, reg.exe writing HKLM keys), security tampering, or staging of additional elevated tools
    such as sdclt.exe, eventvwr.exe, or computerdefaults.exe.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- source: template:uac_bypass.other_escalation_attempts
  question: Were other privilege escalation or UAC-bypass detections seen on this host?
  context: >-
    Operators who attempt one UAC bypass often try several methods until one succeeds, particularly when the
    operating system version blocks specific techniques. Multiple bypass or privilege-escalation detections on the
    same host in a tight window confirm deliberate escalation activity rather than an isolated false positive.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the acting user's activity across all hosts reveals whether the escalation is isolated or part of
    movement across multiple endpoints. If the same user triggered comparable activity on several hosts in the same
    window, the scope of compromise may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
        ParentImage|endswith: \AppData\Local\Temp\pkgmgr.exe
        CommandLine: '"C:\Windows\system32\msconfig.exe" -5'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_parent_process.scope
  question: Is this Temp pkgmgr.exe spawning msconfig pattern occurring on other hosts?
  context: >-
    The same planted-parent-to-msconfig relationship appearing on multiple hosts points to a tool being deployed
    across the environment rather than a single targeted action. An enterprise-wide comparison calibrates scope and
    helps identify every host where the bypass tooling ran.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: '\Temp\pkgmgr.exe'
        CommandLine|contains: 'msconfig.exe'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Privilege escalation is rarely the first action in an intrusion. Earlier detections on the same host such as
    initial execution, defense tampering, or reconnaissance may reveal the stages that preceded the bypass and help
    reconstruct the timeline that led to the planted pkgmgr.exe.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
