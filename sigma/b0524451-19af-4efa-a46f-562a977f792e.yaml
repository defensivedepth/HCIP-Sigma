name: ShimCache Flush
id: 523542e5-a0ff-4290-9a0f-14ef3ecd0e01
description: |
  Detects command-line invocations that flush the local ShimCache (AppCompatCache), an artifact that records evidence
  of program execution and existence. The rule fires when a process command line contains either rundll32 with apphelp.dll
  and ShimFlushCache (or its ordinal #250), or rundll32 with kernel32.dll and BaseFlushAppcompatCache (or its ordinal #46).
  Flushing this cache is a forensic anti-analysis step that removes execution traces; it is rare in routine operations,
  with the kernel32.dll form occasionally seen during troubleshooting. The investigation should confirm the exact branch
  that fired, determine who and what launched it, and reconstruct surrounding activity to establish whether evidence
  removal accompanied other operator actions.
type: detection
detection_id: b0524451-19af-4efa-a46f-562a977f792e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match either ShimCache-flush pattern this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line. The rule fires on either of two branches:
    rundll32 calling apphelp.dll with ShimFlushCache (or the ordinal #250), or rundll32 calling kernel32.dll with
    BaseFlushAppcompatCache (or the ordinal #46). Note which branch fired — the apphelp.dll/ShimFlushCache form applies
    to newer Windows versions, the kernel32.dll/BaseFlushAppcompatCache form to older ones and is the one occasionally
    seen during legitimate troubleshooting. The branch that fired determines how much weight the legitimacy questions carry.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to flush the ShimCache?
  context: >-
    Legitimate administrative activity can trigger this detection, but flushing the compatibility cache is not a routine
    task. Knowing whether the user role and host function include forensic-tooling, imaging, or low-level troubleshooting
    work is often the fastest path to distinguishing an authorized action from evidence removal. A general user account
    on a standard workstation running this command is harder to explain than an engineer on a build or imaging host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: What process launched this rundll32 invocation, and what started that parent?
  context: >-
    The parent process is the core attribution signal for this command-line detection. Tracing the parent's own origin
    reveals whether the chain is interactive administration (a console or remote-management session) or something
    suspicious such as a script host, an office application, or an unsigned binary spawning the flush command. A parent
    that itself was launched by a macro, a downloaded file, or an unusual service is the lineage worth chasing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: >-
    If a parent spawned the ShimCache-flush command, it likely spawned other processes too. Examining siblings reveals
    the full scope of activity from that parent — evidence-removal commands rarely run alone, and a parent that also
    spawned reconnaissance, credential-access, or payload binaries points to a hands-on operator rather than a one-off
    maintenance step.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1112.registry_modification_via_cli
  question: Which ShimCache-flush mechanism was invoked, and what does that specific call do to the compatibility cache?
  context: >-
    Decode the rundll32 arguments to identify the exact mechanism. apphelp.dll,ShimFlushCache and its ordinal #250
    invoke the documented cache-flush entry point on newer systems; kernel32.dll,BaseFlushAppcompatCache and its ordinal
    #46 invoke the equivalent on older systems. Both signal the in-memory AppCompatCache to clear, which removes records
    of prior program execution and existence. Note that the on-disk cache is only rewritten at reboot or shutdown, so
    the artifact may still be recoverable from memory until then.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this ShimCache-flush pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even legitimate troubleshooting use of the kernel32.dll form leaves a baseline. The query mirrors the rule's selection
    structure scoped to this host, so the resulting parent and user distribution reflects how this specific flush pattern
    has historically run here rather than generic process activity. A new parent process, an unexpected user account, or
    a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1a:
        CommandLine|contains|all:
        - rundll32
        - apphelp.dll
      selection1b:
        CommandLine|contains:
        - ShimFlushCache
        - '#250'
      selection2a:
        CommandLine|contains|all:
        - rundll32
        - kernel32.dll
      selection2b:
        CommandLine|contains:
        - BaseFlushAppcompatCache
        - '#46'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (( selection1a and selection1b ) or ( selection2a and selection2b )) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: >-
    Evidence removal typically sits inside a larger sequence. Activity surrounding the flush command may reveal
    reconnaissance, privilege escalation, persistence installation, or data staging that frames the investigation.
    Aggregating the surrounding process activity collapses repetitive agent noise into high-count rows while novel
    binaries stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.follow_on
  question: What did rundll32 do immediately after the flush, and were other processes launched on this host in the same window?
  context: >-
    The cache flush is often one step in a sequence; what runs immediately afterward indicates intent. Look for
    additional evidence-removal commands (log clearing, file deletion, timestomping), persistence installation, or
    payload execution started right after the flush. Because the rule has no parent binary to pivot on, this scopes to
    process activity on the host in the minutes following the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or repeated evidence-removal actions on
    multiple endpoints. If the same user triggered similar activity elsewhere, the scope of the operation may be larger
    than a single host. This pivot is meaningful when the alert fires under a named user; under a service or computer
    account it returns broad telemetry and the parent-mechanism pivot is the better answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1a:
        CommandLine|contains|all:
        - rundll32
        - apphelp.dll
      selection1b:
        CommandLine|contains:
        - ShimFlushCache
        - '#250'
      selection2a:
        CommandLine|contains|all:
        - rundll32
        - kernel32.dll
      selection2b:
        CommandLine|contains:
        - BaseFlushAppcompatCache
        - '#46'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (( selection1a and selection1b ) or ( selection2a and selection2b )) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this flush pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, returning a fleet-wide count of the flush
    pattern rather than generic rundll32 usage. Many hosts firing the same pattern points to scripted deployment or an
    imaging or troubleshooting workflow; one host or a small unrelated set points to manual operator activity. Use the
    host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1a:
        CommandLine|contains|all:
        - rundll32
        - apphelp.dll
      selection1b:
        CommandLine|contains:
        - ShimFlushCache
        - '#250'
      selection2a:
        CommandLine|contains|all:
        - rundll32
        - kernel32.dll
      selection2b:
        CommandLine|contains:
        - BaseFlushAppcompatCache
        - '#46'
      condition: ( selection1a and selection1b ) or ( selection2a and selection2b )
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Evidence removal rarely happens in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access, or execution of unsigned payloads — may reveal the attack stages that preceded
    the flush and help reconstruct the timeline. The sequence of alerts on the host tells the story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Operators who remove forensic evidence often also establish footholds. After the detected activity, scheduled tasks,
    services, registry Run keys, BITS jobs, or WMI subscriptions installed in the same timeframe indicate intentional
    persistence stacking rather than an isolated maintenance step. The flush of execution records can be an attempt to
    hide the binaries those mechanisms reference.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for this action?
  context: >-
    Flushing the compatibility cache is a low-level action that, when legitimate, is usually tied to imaging,
    troubleshooting, or compatibility engineering work that would be ticketed. A corresponding change record suggests
    authorized activity; absence of one when policy requires it suggests the action was unauthorized and can quickly
    escalate the disposition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:organizational_context.timing_alignment
  question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: >-
    Legitimate low-level maintenance typically occurs during business hours or scheduled windows. A cache flush at an
    odd hour, outside any maintenance window, or on a host that is not normally administered interactively is more
    suspicious than the same action during documented compatibility or imaging work. Consider the host's timezone and
    whether automated jobs run at this time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
