      reason: >-
        The T1210 image_load analytic targets a remotely exploited service loading an attacker DLL during memory-corruption
        exploitation. This rule detects the SharpWSUS/WSUSpendu command line — abuse of a trusted update-distribution
        channel, which does not involve service-side DLL loads during exploitation. The load-bearing downstream evidence
        is the targeted client executing a signed payload binary under an update-service parent, covered by the
        attack:T1210.target_client_payload_execution question via process_creation. No image_load question would add
        precision for this WSUS-abuse pattern.
    - hint: >-
