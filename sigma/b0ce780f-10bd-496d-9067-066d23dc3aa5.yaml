      notes: >-
        The rule detects tool execution on the command line, not the network exploitation chain the T1210 analytic
        models. The service-port set governs the analytic's inbound-access correlation, which does not apply to a
        command-line detection. The downstream-effect angle was retained instead via the update-service parent
        (wuauclt/usoclient/svchost) + signed-payload child query.
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "10 minutes (analytic default)"
      disposition: context
      target_question: Q15
      notes: >-
        WSUS delivery is asynchronous — a malicious update lands on the next client sync cycle (lab: first update fast,
        subsequent ~2h; default sync interval ~22h). The analytic's 10-minute correlation window does not fit; the
        target-client execution question uses a +7d forward range to span the sync cycle instead.
    - element: AllowedAdminCIDRs
      dimension: tuning_parameter
      specific_values: "rationale only (management-network suppression)"
      disposition: context
      target_question: Q2
      notes: >-
        Management-network suppression is a network-analytic tuning concept; for a command-line detection the equivalent
        is the user/host-role triage in the host_user_context question.
    - element: MinConnErrorRate
      dimension: tuning_parameter
      specific_values: "30% (analytic default)"
      disposition: context
      target_question: Q15
      notes: >-
