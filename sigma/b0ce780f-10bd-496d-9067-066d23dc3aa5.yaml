name: HackTool - SharpWSUS/WSUSpendu Execution
id: e463e015-fd78-40ea-960d-bc23e2911516
description: |
  Detects command lines belonging to SharpWSUS or WSUSpendu, utilities that abuse Windows Server Update Services (WSUS)
  to push a malicious "update" — any Windows-signed binary with attacker-supplied arguments — that targeted clients pull
  and execute as SYSTEM through the trusted update channel. The rule fires when a command line contains EITHER the WSUSpendu
  inject/payload arguments OR the SharpWSUS subcommands (approve, create, check, delete) and update-targeting flags
  (/payload:, /updateid:). Legitimate WSUS administration uses the WSUS console and standard update tooling, not these
  command-line verbs, so the investigation should confirm which tool/branch fired, decode the exact subcommand and payload,
  and determine whether the operator already had administrative control of WSUS infrastructure.
type: detection
detection_id: b0ce780f-10bd-496d-9067-066d23dc3aa5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the WSUSpendu inject/payload arguments or the SharpWSUS subcommands and update flags?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when a command line matches
    EITHER the WSUSpendu branch ('-Inject', '-PayloadArgs', '-PayloadFile') OR the SharpWSUS branch (the 'approve', 'create',
    'check', or 'delete' subcommands together with '/payload:' or '/updateid:' flags). Note which branch fired — the WSUSpendu
    branch points to the PowerShell ancestor, the SharpWSUS branch to the compiled tool — because that determines which
    downstream artifacts and parent processes are load-bearing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to administer WSUS or run update-deployment tooling from the command line?
  context: Legitimate WSUS administration is performed from the WSUS console by a small set of update administrators and rarely
    involves these command-line verbs. Knowing whether the user role and host function are consistent with WSUS management is
    often the fastest path to distinguishing an authorized change from operator abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this SharpWSUS or WSUSpendu execution part of an authorized penetration test or red team engagement?
  context: WSUS-abuse tooling is used in authorized security assessments to demonstrate lateral movement through update
    infrastructure. Before investing investigation time, check whether a penetration test or red team exercise is currently
    active on this host or network segment. An authorized engagement with matching tool usage and timing resolves the alert
    without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which subcommand was invoked, and what payload and target did it specify?
  context: These tools are multi-stage — locate and inspect enumerate the WSUS server and its clients, create builds a
    malicious update from a signed payload binary plus attacker arguments, approve assigns it to a target machine or group,
    check polls install status, and delete cleans up. The subcommand together with the payload-file flag, the args value, and
    the computername target reveals which stage of the WSUS-abuse pipeline this is and what binary the target would execute as
    SYSTEM.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: Decode the full command line — what signed payload binary, arguments, and target machine does it reference?
  context: The full command line reveals the operation. Decode the payload-file argument (the /payload flag, or -PayloadFile)
    to identify the signed binary chosen to proxy execution (commonly PsExec, msiexec, msbuild, certutil, regsvr32), the args
    argument (the /args flag, or -PayloadArgs) for the actual command the target will run as SYSTEM (often a 'net user /add'
    plus 'net localgroup administrators /add' pair), and the computername or groupname argument to identify which client is
    being targeted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this tool and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Hands-on-keyboard operator use is typically parented by a
    shell (cmd.exe, powershell.exe) or a remote-execution service; an unexpected parent such as a script host, an Office
    application, or a remote-access service may indicate the operator reached this host through an earlier compromise.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes were spawned on this host after the tool ran?
  context: The processes spawned around and after the tool reveal its actual impact. WSUS-abuse operators frequently chain
    reconnaissance and the payload-staging steps; child processes such as cmd.exe, powershell.exe, certutil.exe, or the signed
    payload binary itself indicate post-exploitation rather than a benign one-off invocation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current
    alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how the rule's specific firing pattern — not generic tool usage — has run here. A new parent process, an
    unexpected user account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_wsuspendu_inject:
        CommandLine|contains: ' -Inject '
      selection_wsuspendu_payload:
        CommandLine|contains:
        - ' -PayloadArgs '
        - ' -PayloadFile '
      selection_sharpwsus_commands:
        CommandLine|contains:
        - ' approve '
        - ' create '
        - ' check '
        - ' delete '
      selection_sharpwsus_flags:
        CommandLine|contains:
        - ' /payload:'
        - ' /payload='
        - ' /updateid:'
        - ' /updateid='
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_wsuspendu_* or all of selection_sharpwsus_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_wsuspendu_inject:
        CommandLine|contains: ' -Inject '
      selection_wsuspendu_payload:
        CommandLine|contains:
        - ' -PayloadArgs '
        - ' -PayloadFile '
      selection_sharpwsus_commands:
        CommandLine|contains:
        - ' approve '
        - ' create '
        - ' check '
        - ' delete '
      selection_sharpwsus_flags:
        CommandLine|contains:
        - ' /payload:'
        - ' /payload='
        - ' /updateid:'
        - ' /updateid='
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_wsuspendu_* or all of selection_sharpwsus_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_wsuspendu_inject:
        CommandLine|contains: ' -Inject '
      selection_wsuspendu_payload:
        CommandLine|contains:
        - ' -PayloadArgs '
        - ' -PayloadFile '
      selection_sharpwsus_commands:
        CommandLine|contains:
        - ' approve '
        - ' create '
        - ' check '
        - ' delete '
      selection_sharpwsus_flags:
        CommandLine|contains:
        - ' /payload:'
        - ' /payload='
        - ' /updateid:'
        - ' /updateid='
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_wsuspendu_* or all of selection_sharpwsus_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the WSUS abuse is one step in broader hands-on-keyboard
    activity. If the same user triggered reconnaissance, credential access, or execution on multiple hosts in the same window,
    the scope of compromise is larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_wsuspendu_inject:
        CommandLine|contains: ' -Inject '
      selection_wsuspendu_payload:
        CommandLine|contains:
        - ' -PayloadArgs '
        - ' -PayloadFile '
      selection_sharpwsus_commands:
        CommandLine|contains:
        - ' approve '
        - ' create '
        - ' check '
        - ' delete '
      selection_sharpwsus_flags:
        CommandLine|contains:
        - ' /payload:'
        - ' /payload='
        - ' /updateid:'
        - ' /updateid='
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_wsuspendu_* or all of selection_sharpwsus_*) and _pb_scope
    fields:
    - host.name
- source: template:lateral_movement.target_activity_after_access
  question: What processes ran on this host shortly after the tool, and do any match the payload it staged?
  context: WSUS abuse is a means to an end — the operator stages a signed binary to run as SYSTEM on a target. On the WSUS
    server itself, post-execution activity reveals the operator's hands-on objectives; on a targeted client, watch for the
    staged payload binary (PsExec, msiexec, certutil, regsvr32) launching under an update-service parent with attacker-formatted
    arguments.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- source: template:lateral_movement.lateral_movement_scope
  question: Has this user account run other lateral-movement tooling across the environment?
  context: WSUS abuse is one of several lateral-movement paths an operator with WSUS-server administrative control may use.
    If the same account is also running remote-execution tooling against multiple systems, the scope of compromise is larger
    and active lateral movement is likely in progress.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- source: attack:T1210.target_client_payload_execution
  question: Did any client pull and execute a signed binary under an update-service parent in the days after this alert?
  context: A malicious update lands on a targeted client at its next sync cycle and executes as SYSTEM, parented by the update
    pipeline (wuauclt.exe, UsoClient.exe, or the update service host). A signed LOLBIN such as PsExec, msiexec, certutil, or
    regsvr32 launching under one of those parents with attacker-formatted arguments is the downstream effect of a successful
    approval, and confirms the abuse reached delivery rather than stopping at staging.
  range: +7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
          - '\wuauclt.exe'
          - '\usoclient.exe'
          - '\svchost.exe'
      selection_payload:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\msiexec.exe'
          - '\msbuild.exe'
          - '\certutil.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
      condition: selection_parent and selection_payload
    fields:
      - host.name
      - Image
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: WSUS abuse requires the operator to already hold administrative control of the WSUS server, so earlier detections —
    credential access, privilege escalation, or defense tampering on this host — may reveal how that control was obtained and
    help reconstruct the timeline leading to this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:network_scope.same_action_other_hosts
  question: Is this same WSUS-abuse command pattern occurring on other hosts?
  context: Finding the same command pattern on multiple hosts shows the activity is not isolated and helps determine scope for
    containment. The query mirrors the rule's selection structure and excludes the alerting host, so the result is a count of
    OTHER hosts firing the same WSUS-abuse pattern rather than generic command-line activity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wsuspendu_inject:
        CommandLine|contains: ' -Inject '
      selection_wsuspendu_payload:
        CommandLine|contains:
        - ' -PayloadArgs '
        - ' -PayloadFile '
      selection_sharpwsus_commands:
        CommandLine|contains:
        - ' approve '
        - ' create '
        - ' check '
        - ' delete '
      selection_sharpwsus_flags:
        CommandLine|contains:
        - ' /payload:'
        - ' /payload='
        - ' /updateid:'
        - ' /updateid='
      filter_self:
        host.name|expand: '%hostname%'
      condition: (all of selection_wsuspendu_* or all of selection_sharpwsus_*) and not filter_self
    fields:
      - host.name
