    - template: ransomware_impact.encryption_or_ransom_indicators
      reason: 'No encryption/impact behavior in this rule; shadow-copy creation is credential-access prep. Encryption-indicator question does not apply.'
    - template: persistence_scope.process_based_persistence
      reason: 'persistence_scope set matched on the wmic binary, but this rule''s wmic usage is shadowcopy create (credential access), not a persistence mechanism. Recommended-priority and not load-bearing for a credential-dumping investigation.'
    - template: persistence_scope.file_based_persistence
      reason: 'Same incidental wmic match; file-based persistence is unrelated to shadow-copy credential dumping. Recommended-priority, dropped to keep the playbook within the 18-question cap.'
    - template: powershell.encoded_command_decode
      reason: 'Rule requires literal "shadow" and "create" tokens in the command line, so the firing command is plaintext-readable; an encoding-decode question adds no value. Plaintext command analysis is carried by credential_target_identification (Q3) and script_block_logging (Q15).'
    - template: powershell.powershell_security_bypass
      reason: 'PowerShell security-bypass precursors are not specific to this VSS credential-access chain; the generic tamper/AMSI precursor signal is already covered by endpoint_protection_health (Q16), which includes AMSI/ETW and Set-MpPreference indicators.'
  reflection_overrides: []
  hint_dispositions:
    - hint: 'logsource ''process_access'' (recommended by techniques: T1003) is not covered and no template family exists — author a custom question with `category: process_access`'
      disposition: declined
      reason: >-
        T1003''s process_access analytic targets LSASS memory handle access
        (EventCode 10, AccessMask 0x1F0FFF). This rule''s detection and chain are
        the VSS/shadow-copy path to NTDS.dit and the registry hives — offline file
        and registry credential dumping, not live LSASS memory access. A
