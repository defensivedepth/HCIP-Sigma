    - template: ransomware_impact.recovery_options_assessment
      reason: 'ransomware_impact set matched on the title token "shadow cop", but the rule detects shadow-copy CREATION, which is the opposite of the recovery-inhibiting DELETION ransomware performs. Recovery-destruction questions would be actively misleading here.'
    - template: ransomware_impact.destruction_scope_on_host
      reason: 'Creation, not destruction — no recovery-inhibiting action occurred. Incidental title match.'
    - template: ransomware_impact.network_wide_impact
