    - element: AccessMask
      dimension: access_verification
      specific_values: '0x1F0FFF (full access)'
      disposition: context
      target_question: Q3
      notes: AccessMask applies to the LSASS process_access analytic, which is not this rule's chain (VSS/NTDS path, not memory access). Exposure framed in credential_target_identification context instead.
    - element: RegistryPath
      dimension: tuning_parameter
      specific_values: 'HKLM\SAM, HKLM\SYSTEM'
