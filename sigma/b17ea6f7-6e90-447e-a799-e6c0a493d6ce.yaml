  mutable_dispositions:
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: 'reg save, reg.exe save, PowerShell hive-dump equivalents'
      disposition: new_question
      target_question: Q5
      notes: Authored attack:T1003.003.command_analysis with CommandLine|contains|all [save, hklm\] to surface hive-save activity.
    - element: TargetFilePath
      dimension: tuning_parameter
      specific_values: 'NTDS\ntds.dit, config\SAM, config\SYSTEM, config\SECURITY, HarddiskVolumeShadowCopy'
      disposition: new_question
      target_question: Q6
      notes: Authored attack:T1003.003.tuning_parameter as a file_event query over NTDS.dit and config-hive paths plus shadow-copy device path.
    - element: TimeWindow
      dimension: time_correlation
      specific_values: 'rationale only (e.g. 5 min window between shadow create and NTDS access)'
      disposition: query_injection
      target_question: Q6
      notes: Threshold is a rationale not a queryable value; expressed as the +1h forward range on the NTDS/hive file-access question.
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: rationale only
      disposition: context
      target_question: Q4
      notes: Parent-chain analysis carried by process_chain (Q4) and the parent-pivot baseline_svc (Q10).
    - element: UserContext
      dimension: user_context
      specific_values: rationale only
      disposition: context
      target_question: Q9
