    - hint: "logsource 'process_access' (recommended by techniques: T1003.001) is not covered and no template family exists - author a custom question with category: process_access"
      disposition: acted-on
      reason: >-
        Authored Q6 (attack:T1003.001.access_verification) with category: process_access,
        SourceImage scoped to the alerting binary and TargetImage \lsass.exe with the
        full-access GrantedAccess mask - the load-bearing evidence that the LSASS memory
        read behind the minidump occurred.
    - hint: "logsource 'registry_set' (recommended by techniques: T1003.001) is not covered - pull in cue_registry_key.* or author a custom question with category: registry_set"
      disposition: declined
      reason: >-
        SafetyKatz dumps LSASS memory via MiniDumpWriteDump to a disk minidump; it does
        not save SAM/LSA registry hives. The registry_set analytic for T1003.001 targets
        registry-based credential staging (hive saves / LSA secret keys), which this tool
        does not perform and the minidump does not imply. LSASS access is verified directly
        via process_access in Q6. No compensating registry_set question authored.
    - hint: "logsource 'security' (recommended by techniques: T1003.001) is not covered and no template family exists - author a custom question with category: security"
      disposition: declined
      reason: >-
        The T1003.001 security-channel analytic keys on handle-access events (4656/4663/4673)
        as a proxy for LSASS access. The same access is captured with more precision by the
        Sysmon process_access full-handle (0x1F0FFF) query in Q6, making a parallel
        security-log question redundant. No security question authored.
