name: HackTool - SafetyKatz Execution
id: 445b5534-3b98-4865-a3e4-4269f119301e
description: |
  Fires when SafetyKatz runs, identified by its default image name, PE OriginalFileName, or Description.
  SafetyKatz writes a full-memory minidump of lsass.exe to disk (by default C:\Windows\Temp\debug.bin),
  then loads a stripped Mimikatz build that reads logon passwords and Kerberos keys from the minidump and
  deletes the dump file afterward. The tool has no legitimate use, so a name/metadata match is high-confidence,
  but the binary can be renamed; the investigation should confirm the LSASS access and dump, identify which
  credentials were exposed, and determine whether the stolen material was used to move laterally.
type: detection
detection_id: b1876533-4ed5-4a83-90f3-b8645840a413
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Is the alerting process actually SafetyKatz, by image name, PE OriginalFileName, or Description?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when any
    one of three identifiers matches - an image path ending in SafetyKatz.exe, a PE OriginalFileName of
    SafetyKatz.exe, or a Description of SafetyKatz. A binary renamed on disk still matches on the metadata
    branches, so note which identifier fired and treat a renamed match the same as a name match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run a credential-dumping tool?
  context: A general-purpose LSASS dumper has no routine administrative use. Knowing whether the host is a
    security-testing system and whether the user performs authorized offensive work is the fastest way to
    separate a sanctioned test from an intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this execution part of an authorized penetration test or red team engagement?
  context: Offensive tooling is run during sanctioned assessments. Before investing further analysis, check
    whether a penetration test or red team exercise is active on this host or network segment with matching
    timing. A documented engagement that accounts for the activity resolves the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: What does the command line show about the dump target and method, and was LSASS the source?
  context: Decode the command line to identify the credential source and method. By default SafetyKatz dumps
    lsass.exe memory to a minidump and runs sekurlsa modules against it, but operands may redirect the dump
    path or select different modules. The method and target confirm that in-memory credentials were captured
    rather than an unrelated diagnostic dump.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which capability of the tool was invoked - default LSASS dump, or a different module or output path?
  context: The specific operands determine the scope of compromise. The default run dumps LSASS and extracts
    logon passwords and Kerberos keys, but flags can change the dump location or the modules executed. Identify
    what was actually requested so the credential-exposure assessment matches what the tool did.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.001.access_verification
  question: Did this process open a full-access handle to lsass.exe on this host around the time of the alert?
  context: Dumping LSASS memory requires opening a handle with full access rights (0x1F0FFF) to lsass.exe.
    A process-access event where the alerting binary is the source, lsass.exe is the target, and the granted
    mask is the full-access value confirms the memory read that produces the minidump. If process-access
    telemetry is not collected in this environment, treat the absence of results as a visibility gap, not as
    evidence no dump occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        SourceImage|endswith|expand: '%Image%'
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess: '0x1F0FFF'
      filter_host:
        host.name|expand: '%hostname%'
      condition: selection and filter_host
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: attack:T1003.001.dump_file_path
  question: Was an LSASS minidump written to disk on this host, and is the dump file still present?
  context: SafetyKatz writes a minidump of LSASS to disk (by default C:\Windows\Temp\debug.bin) and deletes
    it after extraction, so recovering the file or its creation event confirms genuine credential material was
    captured and indicates whether it is still recoverable. Dumps are commonly written to %TEMP% or
    C:\Windows\Temp; a surviving file there means the exposure is live and the dump can be hashed and reviewed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - debug.bin
          - \Windows\Temp\
          - .dmp
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:hacking_tool.tool_specific_artifacts
  question: What other files did the alerting process create on this host?
  context: Beyond the minidump, the tool may drop its loader payload, output files, or other staged tooling.
    Files created by this process reveal the scope of activity and the payload source even after the process
    exits and the minidump is deleted.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned the alerting binary, and is that parent chain expected?
  context: The parent reveals how the tool was delivered and launched. An interactive shell from explorer.exe
    points to hands-on-keyboard operation, while parents such as wscript.exe, mshta.exe, an Office application,
    or a remote-execution service point to scripted or remote delivery. An unexpected parent for a credential
    dumper is the lead worth following upstream.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be exposed by this dump, and do any have elevated privileges?
  context: An LSASS dump exposes every credential cached in memory on the host - interactive logons, service
    accounts, and any cached domain credentials. Cross-reference the accounts that logged on to this host with
    directory group memberships; domain-admin or broad service-account exposure requires escalation, while a
    single standard-user session may only need a password reset.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run this binary, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific binary has run here historically. For a tool with no legitimate
    purpose a zero or near-zero baseline is itself the finding; any prior runs and the accounts behind them
    are worth correlating with known testing activity.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SafetyKatz.exe
      - OriginalFileName: SafetyKatz.exe
      - Description: SafetyKatz
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts run this binary in the past week, and does the spread look like coordinated activity or one host?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this binary.
    The same tool appearing on many hosts in a short window points to a pushed or scripted rollout across the
    estate; a single host or a small unrelated set points to isolated operator activity. The host distribution
    calibrates how broad the credential-reset response needs to be.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SafetyKatz.exe
      - OriginalFileName: SafetyKatz.exe
      - Description: SafetyKatz
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SafetyKatz.exe
      - OriginalFileName: SafetyKatz.exe
      - Description: SafetyKatz
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SafetyKatz.exe
      - OriginalFileName: SafetyKatz.exe
      - Description: SafetyKatz
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: A credential dump is usually one stage of a longer operation. Earlier detections on the same host -
    defense tampering, reconnaissance, privilege escalation - help reconstruct what preceded the dump and
    whether protection was weakened first.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
