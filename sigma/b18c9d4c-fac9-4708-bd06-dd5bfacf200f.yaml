name: HackTool - F-Secure C3 Load by Rundll32
id: 1699e223-9e47-4562-a665-b1a39855821f
description: |
  Fires when rundll32.exe is run against a .dll exporting a function named StartNodeRelay - the default
  export of relay DLLs produced by the F-Secure C3 command-and-control framework. C3 builds custom relay
  nodes that proxy operator traffic over flexible channels; loading one with rundll32 maps the relay DLL
  into a trusted, signed host process and starts the relay. The rule keys on the command-line tokens
  (rundll32.exe AND .dll AND StartNodeRelay all present), so the investigation should confirm the
  invocation, identify the loaded DLL, and determine what channels and destinations the relay reached.
type: detection
detection_id: b18c9d4c-fac9-4708-bd06-dd5bfacf200f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show rundll32.exe loading a .dll and calling the StartNodeRelay export, all three present?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule requires all
    three tokens together - rundll32.exe, a .dll reference, and the StartNodeRelay export name. Read the full
    command line and note the DLL path passed to rundll32, since that file is the relay node.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run rundll32 against a non-standard DLL export?
  context: Loading an arbitrary DLL's named export through rundll32 is not routine user or admin activity.
    Knowing whether the host is a security-testing system and whether the user performs authorized offensive
    work is the fastest way to separate a sanctioned test from an intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this execution part of an authorized penetration test or red team engagement?
  context: Command-and-control frameworks are run during sanctioned assessments. Before investing further
    analysis, check whether a penetration test or red team exercise is active on this host or network segment
    with matching timing. A documented engagement that accounts for the activity resolves the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What does the full command line reveal about the relay DLL path and the export being invoked?
  context: Decode the command line to identify the DLL file rundll32 was pointed at and confirm the
    StartNodeRelay entry point. The DLL path - especially a user-writable or temporary location - is the
    relay node on disk and the artifact to recover for analysis. Query scoped to the StartNodeRelay pattern
    on this host so the result is the relay invocation, not generic rundll32 usage.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: StartNodeRelay
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:hacking_tool.tool_capability_used
  question: Which relay configuration was launched - what channel or node parameters were passed?
  context: A C3 relay node is configured through its command-line arguments, which select the channel type
    and connection parameters that determine how operator traffic is proxied. Identify the parameters passed
    so the network-connection findings can be matched to the configured channel.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1218.011.image_load
  question: Which DLL did rundll32 map into memory for this event, and is it signed and from a normal location?
  context: The relay node is the DLL rundll32 loads. An image-load event for this process shows the DLL path,
    signing status, and hash - an unsigned DLL, or one in a user-writable or temporary directory, is the
    relay payload rather than a legitimate system library. If image-load telemetry is not collected in this
    environment, treat the absence of results as a visibility gap, not as evidence no DLL was loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Hashes
- source: attack:T1218.011.network_connection
  question: What outbound connections did this rundll32 process make, and where did they go?
  context: A running C3 relay proxies operator traffic over its configured channel, so the loaded process
    reaches out to a controller or peer. Network connections initiated by this process - their destination
    addresses, ports, and hostnames - identify the command-and-control endpoint and distinguish an external
    beacon from internal peer relaying. Internal-only destinations may indicate a relay chain rather than a
    direct egress point.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: template:hacking_tool.tool_specific_artifacts
  question: What files did this rundll32 process create on the host?
  context: Beyond the loaded relay DLL, the node may write configuration, staging, or output files. Files
    created by this process reveal the scope of activity and help recover the relay payload and its
    configuration even after the process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this rundll32 instance, and is that parent chain expected?
  context: rundll32 launched directly by an interactive shell, an Office application, a script host, or a
    remote-execution service is the anomaly - normal rundll32 invocations come from system components with
    standard library arguments. The parent reveals how the relay was launched and whether it was hands-on or
    scripted.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this rundll32 instance spawn afterward?
  context: A relay node may launch follow-on tooling once operator traffic flows - command interpreters,
    reconnaissance binaries, or further payloads. Processes spawned by this rundll32 instance reveal
    post-load activity that the relay channel enabled.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rundll32 relay pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's command-line selection scoped to this host, so the resulting parent
    and user distribution reflects how this specific relay pattern has run here historically. For a tool with
    no legitimate purpose, a zero or near-zero baseline is itself the finding; any prior runs and the accounts
    behind them are worth correlating with known testing activity.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - rundll32.exe
        - .dll
        - StartNodeRelay
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rundll32 relay pattern in the past week, and does the spread look like coordinated activity or one host?
  context: The query mirrors the rule's command-line selection with no host scope, giving a fleet-wide count
    of this relay pattern. The same loader appearing on many hosts in a short window points to a pushed relay
    deployment across the estate; a single host or a small unrelated set points to isolated operator activity.
    The host distribution calibrates how broad the response needs to be.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - rundll32.exe
        - .dll
        - StartNodeRelay
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user run the relay-loader command pattern before anywhere in the environment?
  context: Compare this account's current action against its history. Because the rule fires on a distinctive
    command-line pattern rather than a binary, the baseline is scoped to that pattern - a user who has never
    run the StartNodeRelay loader is more suspicious than one with a record of sanctioned testing. Zero or
    very low counts indicate first-time use for this account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains: StartNodeRelay
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and relay-pattern combination historically routine on this host or environment-wide, or is the parent unusual?
  context: When the alert fires under a service or computer account, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. A parent process that already accounts for many
    prior firings of this relay pattern is automation, while a new or rare parent is the deviation worth
    chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains: StartNodeRelay
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: A relay-node load is usually one stage of a longer operation. Earlier detections on the same host -
    initial access, defense tampering, reconnaissance, or credential access - help reconstruct what preceded
    the relay and whether protection was weakened first.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering frequently precedes payload execution, and loading a relay through a signed host process
    is itself an evasion choice. The query surfaces direct attempts to disable AV/EDR services, change
    Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection
    looks healthy" signal; populated rows shift the disposition toward operator preparation, so review the
    parent process and signer to identify who made the change.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
