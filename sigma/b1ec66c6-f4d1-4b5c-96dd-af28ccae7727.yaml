name: New Generic Credentials Added Via Cmdkey.EXE
id: 2829bb08-a6f5-42c3-88a8-cf1fa6484762
description: |
  Detects use of cmdkey.exe to store a generic credential, identified when the command line carries all of the generic
  (-g), user (-u), and password (-p) switches together. cmdkey.exe writes credentials into the Windows Credential Manager
  vault, and a common legitimate use is staging credentials ahead of a command-line remote desktop or other authenticated
  connection. The same behavior lets an operator plant attacker-controlled credentials, or read back stored secrets, so the
  investigation should determine who ran it, what target the credential was scoped to, and whether the activity fits the
  user and host baseline.
type: detection
detection_id: b1ec66c6-f4d1-4b5c-96dd-af28ccae7727
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — cmdkey.exe invoked with the generic, user, and password switches together?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and
    process identity against the rule's criteria. The rule fires only when the process is cmdkey.exe (by image name or original
    file name) AND the command line carries all three switches -g, -u, and -p, so confirm every element is present and read
    the supplied target name and account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to store credentials with cmdkey.exe?
  context: Legitimate administrative activity can trigger this detection — administrators and automation sometimes pre-stage
    credentials in the vault before a scripted remote connection. Knowing whether this user's role and this host's function
    are consistent with command-line credential storage is often the fastest path to separating routine operations from an
    operator planting or replaying credentials.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Which target and account did the stored credential apply to?
  context: cmdkey.exe scopes a stored credential to a named target via -g (the generic target string, often a hostname or
    service), -u (the account), and -p (the password). Read these values from the full command line to determine which system
    or service the credential will authenticate to and which account it impersonates. A target naming a domain controller,
    file server, or privileged service, or an account with broad rights, raises the severity and narrows what may be exposed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be exposed, and do any have elevated privileges?
  context: The severity of credential storage depends on the privilege of the account being stored and the account that ran
    cmdkey.exe. A domain admin or service account credential placed in the vault warrants escalation; a standard user storing
    their own credential for a routine connection may only need monitoring. Cross-reference both the running user and the
    stored account against directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned cmdkey.exe and is that parent chain expected?
  context: The parent process reveals how cmdkey.exe was invoked. Interactive administrative use typically descends from
    explorer.exe or a console shell a user opened. Unusual parents such as wscript.exe, mshta.exe, an Office application, or
    a remote-execution service often indicate scripted or remote operator activity rather than a person at the keyboard.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did cmdkey.exe spawn afterward?
  context: cmdkey.exe is a single-purpose vault utility and does not normally spawn children. A stored credential is more
    often consumed by a following connection, so look for command-line remote-desktop clients, remote-shell tools, or file-share
    access launched on this host shortly after the credential was stored.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: A stored credential is typically used to authenticate to another system. Detecting new logon events or outbound
    remote connections shortly after the credential was placed in the vault indicates the credential is being exercised.
    Look specifically for command-line remote-desktop sessions, remote-shell usage, and file-share connections from this host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering with protection often precedes hands-on-keyboard credential activity. The query surfaces direct attempts
    to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch in-memory scanning hooks.
    Zero rows is a useful signal that protection looks healthy; kernel-level driver tampering and in-memory patches will not
    appear here. Populated rows shift the disposition toward operator preparation — review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline
  question: Does this host normally run cmdkey.exe?
  context: A vault utility that has never run on a host is more notable than one used routinely. Zero or very low historical
    counts over the trailing window indicate first-time or rare execution and raise the weight of the other questions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific credential-storage pattern has historically run here,
    not generic cmdkey.exe usage. A new parent process, an unexpected account, or an unusual command-line shape is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdkey.exe
      - OriginalFileName: cmdkey.exe
      selection_cli_generic:
        CommandLine|contains|windash: ' -g'
      selection_cli_user:
        CommandLine|contains|windash: ' -u'
      selection_cli_password:
        CommandLine|contains|windash: ' -p'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    credential-storage pattern rather than generic cmdkey.exe usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation that pre-stages connection credentials; one host or a small unrelated set points to
    manual operator activity. Use the host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdkey.exe
      - OriginalFileName: cmdkey.exe
      selection_cli_generic:
        CommandLine|contains|windash: ' -g'
      selection_cli_user:
        CommandLine|contains|windash: ' -u'
      selection_cli_password:
        CommandLine|contains|windash: ' -p'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally store credentials with cmdkey.exe?
  context: Compare this user's current action against their historical behavior. A user who has never run this vault utility
    is more notable than one who stages credentials regularly as part of their role. The user's role and typical toolset
    should align with command-line credential storage.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and cmdkey.exe combination historically routine on this host or environment-wide, or is the parent unusual?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot
    is the launch mechanism — which parent process spawned cmdkey.exe, and whether that pair is historically common. A new
    or rare parent for this binary on this host or environment-wide is the deviation worth chasing; a pair that already
    accounts for thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the credential storage is isolated or part of broader
    movement. If the same user performed similar activity on multiple hosts in the same window, the scope of the operation
    may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and cmdkey.exe combination fire on other hosts in the same window — a coordinated rollout, or isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since
    every host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism — parent
    process plus spawned binary — fired on other hosts in the alert window. Multiple hosts in the same window points to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the credential storage
    and what followed. Aggregating by image and parent collapses repetitive agent telemetry into high-count rows while novel
    parent-child pairs stand out at low counts — those low-count pairs are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or
    defense tampering — may reveal the attack stages that preceded the credential storage and help reconstruct the timeline
    leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
