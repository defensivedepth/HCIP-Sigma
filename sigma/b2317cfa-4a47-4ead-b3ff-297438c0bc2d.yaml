    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run SharpView or other AD enumeration tooling?
  context: Compare this user's current action against their historical behavior. A user who has never run this tool is more suspicious than one who does so regularly, and the user's role should align with offensive AD reconnaissance. Pair the historical count with organizational knowledge of whether the account belongs to a security tester.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent unusual for SharpView?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is the launch mechanism - which parent process spawned the binary and whether that pair is historically common. A new or rare parent for SharpView on this host or env-wide is the deviation worth chasing, while a pair that already accounts for many prior events points to test automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staged enumeration spanning multiple endpoints. If the same user ran further tooling or touched additional hosts in this window, the scope of the activity is larger than a single execution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, a user pivot returns agent-telemetry noise because every host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism - parent process and spawned binary - fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery action may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession are a signature of post-compromise enumeration. SharpView consolidates much of this into one binary, so native recon utilities running alongside it - net.exe, nltest.exe, nslookup.exe, whoami.exe, dsquery.exe - strengthen the case that an operator is mapping the environment before the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: attack:T1135.network_share_fanout
  question: Did this host generate a burst of outbound SMB or RPC connections to many internal hosts in the minutes after the alert?
  context: SharpView's share, session, and logged-on enumeration methods (Get-NetShare, Find-DomainShare, Get-NetSession, Get-NetLoggedOn) resolve over SMB and RPC to remote hosts, producing outbound connections to ports 445 and 139. A fan-out to many distinct internal destinations in a short window distinguishes scanning from a single targeted lookup. Calibrate against the host's normal SMB footprint - a workstation reaching five or more file servers and domain controllers in minutes is the pattern to chase.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 139
      filter_local:
        DestinationIp|startswith:
          - '127.'
          - '::1'
      condition: selection and not filter_local
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- source: attack:T1482.dotnet_assembly_load
  question: What .NET runtime and assembly loads accompanied this execution on the host?
  context: SharpView is a managed .NET assembly whose discovery methods are resolved at runtime, so its execution loads the common language runtime and supporting assemblies (clr.dll, clrjit.dll, mscoree.dll, System.DirectoryServices). When the binary is loaded in-memory through an execute-assembly loader, the spawning process shows these managed-runtime loads even though no SharpView.exe touched disk. Correlate the loading process against the alerting process tree to confirm where the assembly executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\clr.dll'
          - '\clrjit.dll'
          - '\mscoree.dll'
          - '\mscoreei.dll'
          - '\System.DirectoryServices.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- source: attack:T1482.directory_service_access
  question: Did directory service access events spike on a domain controller for this user or host around the alert?
  context: SharpView's domain and trust enumeration issues LDAP and directory-replication queries that a domain controller records as directory service access. A burst of these events attributed to the alerting account or originating host - especially reads of trust, group-policy, and ACL objects - confirms the enumeration reached the directory and shows which objects were touched. If directory service access auditing is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing happened.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4662
        SubjectUserName|expand: '%User%'
      condition: selection
    fields:
      - SubjectUserName
      - ObjectName
      - AccessMask
- source: template:hacking_tool.tool_specific_artifacts
  question: Did SharpView write enumeration output or other files to disk on this host?
  context: Enumeration tools often redirect their output to files for later exfiltration or offline analysis - CSV exports from Export-PowerViewCSV, ticket files from Kerberoasting, or redirected console output in user-writable directories. Files created by the SharpView process confirm what was collected and reveal the scope of activity even after the process has exited. Absence of artifacts is consistent with in-memory-only operation, not with the activity being benign.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Reconnaissance rarely happens in isolation. Earlier detections on the same host - initial access, defense tampering, or credential access - may reveal the attack stages that preceded this enumeration and help reconstruct the timeline. The order of alerts on the host tells the story of how the operator reached the point of mapping the domain.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
