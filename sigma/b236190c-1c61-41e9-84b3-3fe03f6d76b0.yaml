name: Potential Regsvr32 Commandline Flag Anomaly
id: 08ad5d69-7493-4c02-8eba-d352371d3b1b
description: |
  Detects regsvr32.exe invoked with the ' -i:' (DllInstall) flag while the ' -n '
  flag is absent. The /n flag suppresses the call to DllRegisterServer; when /i is
  used without /n, regsvr32 invokes the DLL's DllInstall entry point, which can run
  arbitrary code in a trusted, signed process. Legitimate COM object registration
  generally pairs /i with /n, so the unpaired form is uncommon and is a known
  proxy-execution pattern. Investigation should confirm the exact command line, the
  referenced DLL or scriptlet, the parent chain, any modules loaded and outbound
  connections from regsvr32.exe, and whether this user, host, and parent normally
  drive this pattern.
type: detection
detection_id: b236190c-1c61-41e9-84b3-3fe03f6d76b0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-08'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show regsvr32.exe run with the /i flag and no /n flag?
  context: Before investing investigation time, confirm the alert is a true positive
    by reviewing the exact command line against the rule's criteria. The rule fires when
    Image ends in regsvr32.exe AND the command line contains ' -i:' AND it does not
    contain ' -n '. Confirm the /i argument and its DLL or scriptlet reference, and
    that /n is genuinely absent rather than a parsing artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to register COM objects with regsvr32.exe?
  context: Legitimate COM registration is usually performed by installers or
    administrative tooling, and the unpaired /i form is uncommon even then. Knowing
    whether the user role and host function involve software installation or COM
    registration is often the fastest path to distinguishing routine activity from
    proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did regsvr32.exe do? Decode the /i argument and identify the referenced DLL or scriptlet.
  context: The full command line reveals the specific action. The /i (DllInstall) flag
    takes a file or path argument; decode it to identify the DLL or scriptlet being
    installed and its location. Loading from a temporary directory, a user-writable
    path, or a remote location is more concerning than a System32 path. The /s flag,
    if present, suppresses message boxes for silent execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned regsvr32.exe and is that parent chain expected?
  context: The parent process reveals how regsvr32.exe was invoked. Legitimate COM
    registration is typically launched by installers or by explorer.exe during user
    actions. Parents such as mshta.exe, wscript.exe, cmd.exe, powershell.exe, or an
    Office application may indicate execution of a downloaded payload or a malicious
    document. A parent outside the expected set is the deviation worth chasing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this regsvr32 /i pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even common binaries can be abused. The query mirrors the rule's selection
    scoped to this host, so the resulting parent and user distribution reflects how
    the rule's specific firing pattern has historically run here, not generic
    regsvr32 usage. A new parent process, an unexpected user account, or an unusual
    command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -i:'
      filter_main_flag:
        CommandLine|contains|windash: ' -n '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did regsvr32.exe spawn afterward?
  context: The processes spawned after regsvr32.exe reveal its actual impact.
    Legitimate COM registration rarely spawns children; proxy execution often launches
    cmd.exe, powershell.exe, certutil.exe, or other tooling for follow-on actions. Any
    child process here shifts the disposition toward hands-on activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this regsvr32 /i pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is
    a fleet-wide count of the rule's firing pattern, not generic regsvr32 usage. Many
    hosts firing the same pattern points to scripted deployment or vendor automation;
    one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -i:'
      filter_main_flag:
        CommandLine|contains|windash: ' -n '
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -i:'
      filter_main_flag:
        CommandLine|contains|windash: ' -n '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -i:'
      filter_main_flag:
        CommandLine|contains|windash: ' -n '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user triggered similar activity
    on multiple hosts, the scope of the activity may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -i:'
      filter_main_flag:
        CommandLine|contains|windash: ' -n '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert
    reveals the immediate context, namely what led to this event, what happened after, and
    whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms near the regsvr32.exe execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance,
    credential access — may reveal the stages that preceded this event and help
    reconstruct the timeline. Proxy execution through a signed binary is often one
    step in a multi-stage sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If
    regsvr32.exe was used to run a payload, check whether rundll32, mshta, msbuild,
    cmstp, installutil, msiexec, or similar binaries were also invoked. Multiple
    signed binaries performing arbitrary-code execution in the same window
    strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was regsvr32.exe executed from an expected path?
  context: regsvr32.exe executed from outside System32 or SysWOW64 may indicate the
    binary was copied or renamed to evade path-based allowlists, or that a renamed
    binary is masquerading as regsvr32.exe. Compare the Image path and
    OriginalFileName; a regsvr32.exe running from a user's temp directory is more
    suspicious than one in System32.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this regsvr32 /i pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one
    used regularly under stable parents. The query mirrors the rule's selection scoped
    to this host, so the count reflects the rule's specific firing pattern, not generic
    regsvr32 usage. The command-line projection lets the analyst compare typical
    invocation patterns against the alerting one, including which DLL or scriptlet paths
    appear normally.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -i:'
      filter_main_flag:
        CommandLine|contains|windash: ' -n '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
- source: attack:T1218.010.module_load
  question: What modules did regsvr32.exe load on this host, and were any loaded from a temporary or user-writable path?
  context: DllInstall via /i causes regsvr32.exe to load and execute a DLL or
    scriptlet. Module loads from System32 or SysWOW64 are expected; loads from
    temporary directories, user profile paths, or other writable locations, and loads
    of unsigned or untrusted modules, point to proxy execution of an attacker-supplied
    payload. Scriptlet extensions such as .sct or .ocx loaded by regsvr32.exe are
    worth scrutiny. If image-load telemetry is not ingested in this environment, treat
    zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.network_connection
  question: Did regsvr32.exe make any outbound network connections close to the alert time?
  context: regsvr32.exe registering a local COM component does not normally initiate
    network traffic. An outbound connection from regsvr32.exe close to the execution
    time suggests retrieval of a remote scriptlet or payload, or command-and-control
    activity, consistent with proxy execution of externally hosted content. Review the
    destination address and port against known enterprise endpoints. If network
    telemetry from endpoints is not ingested in this environment, treat zero results as
    a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
