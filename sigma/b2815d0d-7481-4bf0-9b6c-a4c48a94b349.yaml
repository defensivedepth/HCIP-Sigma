name: PowerShell Get-Process LSASS
id: 9dd536ce-c24b-4449-8f1d-47f45919682e
description: |
  Detects PowerShell commands that resolve the lsass process via the Get-Process cmdlet or its aliases (ps, gps), matching the command-line substrings 'Get-Process lsas', 'ps lsas', or 'gps lsas'. Resolving lsass with Get-Process is a common first step in credential-theft workflows: the returned process object's .id is fed to a memory-dumping routine (for example, comsvcs.dll MiniDump invoked through rundll32.exe) to write LSASS memory to disk or a remote share for offline credential extraction. Legitimate administrative or monitoring scripts rarely target lsass by name, so the investigation should confirm what the full command did, whether a dump file or remote share was produced, and what ran before and after the alert.
type: detection
detection_id: b2815d0d-7481-4bf0-9b6c-a4c48a94b349
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — does it reference the lsass process via Get-Process, ps, or gps?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line against the rule's detection criteria. The rule fires when the command line contains 'Get-Process lsas', 'ps lsas', or 'gps lsas'. Confirm the full token targets lsass (not, for example, a host or variable that merely starts with those characters).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enumerate or query the lsass process from PowerShell?
  context: Legitimate administrative activity can trigger many detections, but resolving lsass by name from PowerShell is uncommon outside security tooling and incident response. Knowing whether the user role and host function are consistent with the detected behavior is often the fastest path to distinguishing a true positive from routine operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1552.004.process_identification
  question: What is the full identity of the process that ran this command — its image path, signing status, and parent?
  context: The rule matches only the command-line substring and carries no Image field, so the executing process must be identified explicitly. Confirm whether the command ran under a genuine, signed powershell.exe in System32 or under a renamed or relocated copy in a user-writable directory, and capture the parent so the launch mechanism is established. A renamed or out-of-path interpreter is itself a strong deviation worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - ParentImage
      - User
- source: template:credential_access.credential_target_identification
  question: Was lsass memory actually accessed or dumped, and by what method?
  context: Resolving lsass with Get-Process commonly precedes a memory dump. Decode the full command to determine whether the returned process .id was passed to a dumping routine — comsvcs.dll MiniDump through rundll32.exe, procdump, direct memory reads, or a custom dumper — and whether the output was written to a local path or a mapped remote share. The method indicates attacker sophistication and what credentials may be exposed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does it decode to?
  context: PowerShell commands are frequently hidden with the -EncodedCommand (-enc) parameter, string concatenation, backtick escaping, or variable substitution. The lsass lookup may be one stage of a larger encoded script. Decode any base64 or obfuscated content to reveal the actual payload — what dumping routine is invoked, what file path or remote share receives the output, and whether the command pipes the resolved process id into a memory read.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script content?
  context: Script block logging records the deobfuscated script content that PowerShell actually executes, even when the command line is encoded or obfuscated. This provides ground truth about what ran, including any dumping logic that follows the lsass lookup. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell security controls before running a credential-access payload. Common precursors include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or the -ep bypass flag), and PowerShell downgrade attacks (version 2, which lacks logging). Finding these precursor events strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: attack:T1552.004.file_path_analysis
  question: Was a dump file or other credential artifact written to disk on this host around the time of the alert?
  context: A successful lsass dump writes the captured memory to a file — frequently in a user-writable or temporary location, or to a mapped network drive for offline extraction. Look for newly created files with dump-like extensions or names. If the alerting command referenced a specific output path, focus there; otherwise a dump artifact appearing within the alert window corroborates an actual credential-theft attempt rather than a benign process query.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1552.004.security
  question: Did a Windows Security log handle-access event record a process opening the lsass process around the time of the alert?
  context: When a process obtains a handle to lsass, the Windows Security log can record the access (handle-to-object events such as event ID 4656/4663 against the lsass process and the requested access mask). This is independent evidence of whether the resolved lsass process was actually opened for memory read, separate from the process_creation command line. If Security object-access auditing is not enabled in this environment, treat zero results as a visibility gap rather than evidence the access did not occur.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ObjectName|contains: 'lsass'
      condition: selection
    fields:
      - ProcessName
      - ObjectName
      - AccessMask
      - SubjectUserName
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how the command was invoked. Interactive administrative use typically descends from explorer.exe or a console host; unusual parents such as mshta.exe, wscript.exe, an Office application, or a remote-execution service point toward exploitation, a malicious macro, or hands-on-keyboard activity. Walk the parent chain to establish how the lsass lookup was launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even routine tooling can resolve lsass occasionally. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here — not generic PowerShell usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Get-Process lsas
        - ps lsas
        - gps lsas
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic PowerShell usage. Many hosts resolving lsass the same way points to scripted deployment or a security-tool sweep; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Get-Process lsas
        - ps lsas
        - gps lsas
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Get-Process lsas
        - ps lsas
        - gps lsas
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Get-Process lsas
        - ps lsas
        - gps lsas
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered credential-access or remote-execution activity on other hosts in the same window, the scope of compromise may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Get-Process lsas
        - ps lsas
        - gps lsas
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised if lsass was dumped, and do any have elevated privileges?
  context: The severity of LSASS credential theft depends on which accounts had logon sessions on this host. Any cached domain credentials, service account tokens, or interactive admin sessions present in lsass memory may be exposed. Cross-reference the active sessions and the host's role against Active Directory group memberships; domain admin or service-account exposure requires incident escalation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
