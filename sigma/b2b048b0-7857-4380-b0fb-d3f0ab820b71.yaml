name: Self Extracting Package Creation Via Iexpress.EXE From Potentially Suspicious Location
id: 833321e4-bf2f-4797-a145-d60174b92a28
description: |
  Detects iexpress.exe, a signed Microsoft self-extracting package wizard, invoked with the non-interactive build flag while referencing a Self Extraction Directive path under a user-writable or staging location such as ProgramData, a Temp directory, AppData Local Temp, or the Windows Tasks folders. The rule fires only when all three conditions hold together: the image is iexpress.exe, the command line carries the ` /n ` no-progress switch, and the command line references one of the suspicious path tokens. Legitimate administrators occasionally drive iexpress non-interactively to build packages, but the same chain is abused as a signed-binary proxy that wraps a payload into a self-extracting CAB, evading signature and path allow-listing. Determine whether a person built a package deliberately or whether iexpress was driven from a script launched out of a temporary directory, and follow the child packaging activity to see what was wrapped.
type: detection
detection_id: b2b048b0-7857-4380-b0fb-d3f0ab820b71
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Did iexpress.exe run with the /n build flag while referencing a Self Extraction Directive path under a staging or user-writable location?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires only when the image is iexpress.exe AND the command line carries the ` /n ` no-progress switch AND the command line references one of the suspicious path tokens (ProgramData, a Temp directory, AppData Local Temp, or a Windows Tasks folder). Read the full command line and note which path token matched and which directive file was referenced.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to build self-extracting packages with iexpress.exe?
  context: Legitimate package authoring with iexpress is typically done by developers or administrators on build or admin workstations, not by ordinary user accounts or servers. If the user role and host function do not involve packaging work, the non-interactive build is harder to explain as routine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What directive path and flags did iexpress.exe run with, and what package was it building?
  context: The full command line reveals the exact operation. Decode the Self Extraction Directive path referenced after the path token, note whether the quiet and use-predefined-directive flags accompany the no-progress switch, and identify where the directive file lives. A directive file under a Temp or AppData Local Temp directory rather than a documents or source folder points to scripted abuse rather than interactive authoring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned iexpress.exe and is that parent chain expected?
  context: Interactive package authoring is launched from explorer.exe. A parent of cmd.exe, a script host, or any process whose working directory sits under a Temp or user-writable path indicates iexpress was driven by a script rather than a person. Identify the immediate parent and, where possible, what spawned that parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did iexpress.exe spawn, and was makecab.exe invoked to compress a directive into a package?
  context: When iexpress builds a package it invokes makecab.exe to compress the payload, typically with a directive file argument. A makecab child writing a CAB from a user-writable directory confirms a package was actually assembled and indicates what was wrapped. Other unexpected children, or a payload being run after extraction, raise the severity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.image_load
  question: What modules did iexpress.exe load at runtime, and are any outside the expected signed Microsoft set?
  context: A signed proxy binary can be coerced into running attacker code through search-order or side-loading of a planted module. The expected baseline for the wizard is a small set of system libraries (ntdll, the WOW64 libraries, the cabinet view library). A module loaded from a user-writable directory, or an unsigned library, indicates the signed binary was hijacked to execute payload code rather than simply driven to build a package.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.network_connection
  question: Did iexpress.exe or its child packaging processes make any outbound network connections?
  context: Signed-binary proxy chains are sometimes used to retrieve or stage an externally hosted payload. The wizard and its makecab child have no legitimate reason to reach the network. Any outbound connection from this chain points to remote retrieval or staging and should be pivoted on the destination address.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.baseline
  question: Does this host normally run iexpress.exe?
  context: A signed packaging utility that has never or rarely run on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the baseline window indicate first-time or rare use of iexpress here, which weighs against routine package authoring.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a signed utility can be abused. This query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how this specific firing pattern has run here, not generic iexpress usage. A new parent process, an unexpected account, or an unusual command structure against that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \iexpress.exe
      - OriginalFileName: IEXPRESS.exe
      selection_cli:
        CommandLine|contains|windash: ' /n '
      selection_paths:
        CommandLine|contains:
        - :\ProgramData\
        - :\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the firing pattern rather than generic iexpress usage. Many hosts firing the same pattern points to scripted deployment or a packaging pipeline; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \iexpress.exe
      - OriginalFileName: IEXPRESS.exe
      selection_cli:
        CommandLine|contains|windash: ' /n '
      selection_paths:
        CommandLine|contains:
        - :\ProgramData\
        - :\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the iexpress invocation?
  context: Signed-binary proxy abuse is rarely a single step. Activity surrounding the iexpress build may reveal the script or downloader that launched it, the payload being staged, or follow-on execution. Scan the surrounding process activity for the broader sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \iexpress.exe
      - OriginalFileName: IEXPRESS.exe
      selection_cli:
        CommandLine|contains|windash: ' /n '
      selection_paths:
        CommandLine|contains:
        - :\ProgramData\
        - :\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \iexpress.exe
      - OriginalFileName: IEXPRESS.exe
      selection_cli:
        CommandLine|contains|windash: ' /n '
      selection_paths:
        CommandLine|contains:
        - :\ProgramData\
        - :\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals whether the same actor drove similar activity elsewhere. If the same user triggered related builds or staging on multiple endpoints, the scope of the activity may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \iexpress.exe
      - OriginalFileName: IEXPRESS.exe
      selection_cli:
        CommandLine|contains|windash: ' /n '
      selection_paths:
        CommandLine|contains:
        - :\ProgramData\
        - :\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as initial execution, downloads, or defense tampering, may reveal the stages that preceded the packaging activity and help reconstruct the timeline that led to the signed-binary proxy chain.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
