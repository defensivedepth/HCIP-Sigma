name: Use of VisualUiaVerifyNative.exe
id: 5616c2f2-7656-49a7-a402-6977c4cfa1fb
description: |
  Detects execution of VisualUiaVerifyNative.exe, a Microsoft-signed Windows SDK UI Automation verification tool. The
  rule fires when a process image ends in VisualUiaVerifyNative.exe OR its OriginalFileName is VisualUiaVerifyNative.exe.
  This binary appears on the Microsoft-recommended application-control block list because, as a signed .NET application,
  it can be co-opted to load attacker-controlled .NET assemblies and bypass code-integrity policies; one documented
  abuse deserializes a config file from the user's profile to execute arbitrary code inside the trusted process. The
  binary has near-zero legitimate footprint on production endpoints — it ships only with the Windows SDK and is normally
  seen only on developer or test systems — so any execution warrants triage. Investigation should confirm the exact
  process and its origin path, identify what spawned it, determine what assemblies or config it loaded, and check whether
  the host and user have any legitimate SDK testing role.
type: detection
detection_id: b30a8bc5-e21b-4ca2-9420-0a94019ac56a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event show VisualUiaVerifyNative.exe executing?
  context: Confirm the alert is a true positive by reviewing the exact process details against the rule's criteria. The
    rule fires when the image path ends in VisualUiaVerifyNative.exe OR the OriginalFileName field is
    VisualUiaVerifyNative.exe — the latter catches a copy that was renamed on disk but still carries the SDK file
    metadata. Note the full image path and the OriginalFileName so later questions can tell an in-place SDK binary apart
    from a relocated or renamed copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run Windows SDK UI Automation testing tools?
  context: VisualUiaVerifyNative.exe ships only with the Windows SDK and is normally present on developer or QA
    workstations, not production endpoints. Knowing whether the host has an SDK installed and whether the user role
    involves UI automation testing or software development is often the fastest path to separating a legitimate test run
    from proxy-execution abuse on a system that has no reason to carry this tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did VisualUiaVerifyNative.exe do? Decode the full command line and identify the image path it ran from.
  context: The full command line and origin path reveal how the binary was used. A legitimate SDK run executes from a
    Windows Kits or Microsoft SDKs install directory with no unusual arguments; a relocated copy in a user-writable,
    temporary, or download path is a stronger abuse signal. This tool loads .NET assemblies and can deserialize a config
    file from the user profile, so the on-disk location and any arguments matter more than for an ordinary utility.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned VisualUiaVerifyNative.exe and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. A legitimate test run is typically launched
    interactively from explorer.exe or a developer shell. Parents such as office applications, script hosts, a command
    shell driven by automation, or a remote-access tool suggest the invocation came from a document, macro, or operator
    activity rather than hands-on SDK testing, and point to who placed and ran the binary.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.image_load
  question: What .NET assemblies or other modules did VisualUiaVerifyNative.exe load after it started?
  context: The proxy-execution payload arrives as a managed assembly or module loaded into the trusted, signed process
    shortly after it starts. Correlating the load events surfaces what was actually executed, its on-disk location, and
    whether it is signed. An unsigned assembly, or one loaded from a temporary, user-writable, or profile path, is the
    artifact that distinguishes abuse from a normal SDK test run. If image-load telemetry is not collected in this
    environment, treat the absence of results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.network_connection
  question: Did VisualUiaVerifyNative.exe make any outbound network connections around the time of the alert?
  context: A signed proxy-execution binary may reach across the network to retrieve a payload or, after loading an
    attacker assembly, to contact a remote address. An outbound connection from this process to an internal host or an
    external address gives a destination to scope and corroborates that the run did more than local UI testing. This SDK
    tool does not normally initiate network traffic, so any connection here is worth examining.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: attack:T1218.config_artifact
  question: Was a uiverify.config deserialization file written under this user's AppData around the time of the alert?
  context: One documented abuse of this binary places a serialized payload file in the user profile that the application
    deserializes on launch to run code inside the signed process. A config file appearing under the user's AppData
    directory shortly before or at the time of execution corroborates that path and identifies what was dropped and by
    which process. Scope file-event results to the relevant profile and config paths rather than returning all file
    activity on the host.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: 'uiverify.config'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_process_tool.follow_on
  question: What child processes did VisualUiaVerifyNative.exe spawn afterward?
  context: The processes spawned after this binary loads its payload reveal the actual impact. A legitimate SDK test run
    spawns nothing of note; proxy execution frequently leads to a command shell, a script host, or additional binaries
    that carry out discovery, persistence, or further download activity from inside the trusted process.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this pattern, what parents and users normally drive it, and does the
    current alert fit?
  context: Even rare tools can have a legitimate footprint on a given host. The query mirrors the rule's selection
    structure scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing
    pattern has historically run here rather than generic activity. A new parent process or an unexpected user account is
    the deviation worth chasing; a stable, recurring parent and user point to an established SDK or test workflow.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \VisualUiaVerifyNative.exe
      - OriginalFileName: VisualUiaVerifyNative.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern. Many hosts firing the same pattern points to a software deployment or an imaging task that
    placed the SDK broadly; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \VisualUiaVerifyNative.exe
      - OriginalFileName: VisualUiaVerifyNative.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \VisualUiaVerifyNative.exe
      - OriginalFileName: VisualUiaVerifyNative.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \VisualUiaVerifyNative.exe
      - OriginalFileName: VisualUiaVerifyNative.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on more than one host, the scope may be larger than a single
    endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \VisualUiaVerifyNative.exe
      - OriginalFileName: VisualUiaVerifyNative.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity surrounding the alert reveals the immediate context —
    what led to this execution and what happened after. Look for reconnaissance, privilege escalation, persistence, or
    additional proxy-execution binaries that provide broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, exploitation of a
    document or browser, defense tampering, or credential access — may reveal the stages that preceded this event and
    help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: This binary is on the application-control block list precisely because it bypasses code-integrity enforcement,
    so an operator may pair it with attempts to weaken other protections. The query surfaces direct attempts to disable
    AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful
    signal that protection looks healthy; populated rows shift the disposition toward operator preparation, so review the
    parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
