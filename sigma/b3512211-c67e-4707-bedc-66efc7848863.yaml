name: Potential PowerShell Downgrade Attack
id: 46d7400c-5119-425f-8492-f7004c8a86b1
description: |
  Detects powershell.exe launched with a "-version 2" switch (and its abbreviated forms such as -ver 2 or -v 2),
  which forces the host to load the PowerShell v2 engine assemblies. The v2 engine predates AMSI, script block
  logging, and Constrained Language Mode, so running under it sidesteps those protections while still using the
  signed, trusted PowerShell binary. Legitimate use is rare on modern systems because .NET Framework 2.0 is not
  installed by default on Windows 10 and later; the investigation should determine what the downgraded session
  executed, what spawned it, and whether the v2 engine assemblies were actually loaded.
type: detection
detection_id: b3512211-c67e-4707-bedc-66efc7848863
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show powershell.exe launched with a -version 2 switch or one of its abbreviations?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command
    line. The rule fires when an image ending in powershell.exe carries a version-2 switch in any of its accepted
    forms (-version 2 down to -v 2). Confirm the switch is present and that it requests the v2 engine, not a different
    numeric argument that happens to contain a 2.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run PowerShell pinned to the version 2 engine?
  context: Legitimate administrative activity can trigger this detection, but deliberately requesting the v2 engine
    on a modern system is uncommon outside specific legacy-compatibility scenarios. Knowing whether the user role and
    host function involve maintaining or testing software that requires PowerShell v2 helps distinguish a routine
    operation from an attempt to evade the v5 security controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did this downgraded PowerShell session actually run? Decode the full command line.
  context: The version-2 switch only sets the engine; the rest of the command line carries the payload. Decode any
    -EncodedCommand or -enc base64, deobfuscate concatenation or backtick escaping, and identify download cradles,
    reflective assembly loads, or file paths. Because powershell.exe is extremely common, this query is scoped to the
    specific alerting process so the result is the exact downgraded invocation rather than every PowerShell launch on
    the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does it decode to?
  context: Pinning the engine to v2 is frequently paired with an encoded or obfuscated body so that neither the engine
    nor the command line reveals intent. Base64 via -EncodedCommand is the most common form, but concatenation, backtick
    escaping, and variable substitution also appear. Decoding reveals the actual payload -- download cradles, reverse
    shells, or in-memory execution of .NET assemblies that the downgraded engine will run without AMSI inspection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1059.001.image_load
  question: Did this PowerShell process load the version 2 engine assemblies rather than the current ones?
  context: The version switch is only a request; the engine that actually loads is the ground truth. The v2 engine lives
    in the older System.Management.Automation assembly and its v2 native image, distinct from the v4 path used by v5.
    Confirming a load of the v2 assembly or NativeImages_v2.0.50727 native image on this host within the alert window
    establishes that the downgrade succeeded; absence may mean .NET 2.0 was unavailable and the request silently fell
    back to the current engine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_module:
        ImageLoaded|contains:
          - '\System.Management.Automation'
      selection_v2:
        ImageLoaded|contains:
          - '\GAC_MSIL\System.Management.Automation\1.0.0.0__'
          - '\NativeImages_v2.0.50727'
      condition: selection and selection_module and selection_v2
    fields:
      - Image
      - ImageLoaded
- source: template:cue_process_tool.process_chain
  question: What process spawned this downgraded PowerShell, and is that parent chain expected?
  context: The parent reveals how the downgraded session was invoked. Interactive use typically traces back to explorer.exe
    or a console, while office applications, mshta.exe, wscript.exe, or a scripting host spawning a version-pinned
    PowerShell points to macro or loader-driven execution. Walk up from the immediate parent to see what launched it and
    what else that parent spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this downgraded PowerShell spawn afterward?
  context: The processes spawned after the downgraded session reveal its actual impact. A v2 session that immediately
    launches cmd.exe, another powershell.exe, certutil.exe, or a network utility suggests staging or post-exploitation,
    whereas a session that exits without children may be a one-off compatibility test.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture what the downgraded session ran?
  context: Script block logging records the deobfuscated content PowerShell actually executes, even when the command line
    is encoded. This matters especially for a downgrade because the v2 engine itself does not emit this logging -- so any
    4104 events for this host in the window would come from a separate v5 session, and their absence around the downgraded
    process is expected. If these logs are not collected in this environment, treat zero results as a visibility gap rather
    than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were other PowerShell or endpoint security controls weakened in the hour before this downgrade?
  context: The downgrade itself sidesteps AMSI and logging, but operators frequently stack additional evasions. Look for
    execution-policy bypass flags, AMSI patching strings, real-time protection changes, or obfuscation tooling in the hour
    preceding this event. Finding precursor tampering alongside the version downgrade strengthens the case that the session
    was preparing to run something the v5 controls would otherwise have caught.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services,
    flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks
    healthy" signal -- kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the
    disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the version-downgrade pattern, what parents and users drove it, and does
    this alert fit?
  context: Even when a host has run downgraded PowerShell before, the parent and user distribution shows how it normally
    happens here. The query mirrors the rule's selection scoped to this host, so the result reflects the rule's specific
    firing pattern rather than generic PowerShell usage. A new parent process, an unexpected user account, or an unusual
    command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \powershell.exe
        CommandLine|contains:
        - ' -version 2 '
        - ' -versio 2 '
        - ' -versi 2 '
        - ' -vers 2 '
        - ' -ver 2 '
        - ' -ve 2 '
        - ' -v 2 '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the version-downgrade pattern in the past week, and does the spread look like automation
    or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the downgrade
    pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or a
    legacy-compatibility shim pushed widely; one host or a small unrelated set points to manual operator activity. Use the
    host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \powershell.exe
        CommandLine|contains:
        - ' -version 2 '
        - ' -versio 2 '
        - ' -versi 2 '
        - ' -vers 2 '
        - ' -ver 2 '
        - ' -ve 2 '
        - ' -v 2 '
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell at all, let alone pinned to the version 2 engine?
  context: Compare this user's current action against their historical behavior. A user who rarely or never runs PowerShell
    is more notable here than a daily PowerShell user, and a deliberate v2 pin is uncommon for ordinary administrative work.
    User role and typical toolset should align with running a legacy engine version.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and powershell.exe combination historically routine on this host or across the environment, or
    is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot
    is which parent process spawned powershell.exe and whether that pair is historically common. A new or rare parent for
    this binary is the deviation worth chasing, while a pair that already accounts for thousands of prior events is vendor
    or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on other hosts, the scope of the investigation may be larger than the single
    alerting endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and powershell.exe combination fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise because
    every host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism -- parent
    process plus spawned binary -- fired on other hosts in the alert window. Multiple hosts in the same window points to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity around the alert reveals what led to this event
    and what followed, and whether the downgrade is part of a larger sequence. Look for reconnaissance, privilege escalation,
    or persistence mechanisms in the surrounding window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance,
    credential access -- may reveal the attack stages that preceded the downgrade and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
