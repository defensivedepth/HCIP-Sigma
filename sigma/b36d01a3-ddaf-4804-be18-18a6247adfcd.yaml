name: Add Windows Capability Via PowerShell Cmdlet
id: cbaaa450-1d78-41d5-96b9-0953a1fcf335
description: |
  Detects PowerShell (powershell.exe or pwsh.exe) invoking the Add-WindowsCapability cmdlet with a command line referencing an OpenSSH capability. The rule fires only when the process is PowerShell AND the command line contains Add-WindowsCapability AND it references OpenSSH. Adding the native Windows OpenSSH optional feature is a legitimate administrative path for enabling remote shell access, but the same primitive lets an operator enable a built-in SSH server for ingress, lateral movement, or persistence without dropping new tooling. The investigation should determine whether the install was performed by an expected administrator on an expected host, what was started or configured afterward (the sshd service, firewall rules, key material), and whether surrounding activity points to interactive operator behavior rather than routine provisioning.
type: detection
detection_id: b36d01a3-ddaf-4804-be18-18a6247adfcd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show Add-WindowsCapability adding an OpenSSH capability under powershell.exe or pwsh.exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when all three conditions hold together — the process is powershell.exe or pwsh.exe, the command line contains Add-WindowsCapability, and it references an OpenSSH capability. Read the exact command line and process details and confirm the full capability name (for example OpenSSH.Server or OpenSSH.Client) and whether the -Online switch is present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to install Windows optional features and enable native OpenSSH?
  context: Enabling the built-in OpenSSH server changes the host's remote-access posture. Installing optional features is typically performed by administrators or provisioning automation. Knowing whether the acting user role and host function are consistent with feature installation is often the fastest path to distinguishing routine provisioning from operator activity. A workstation that has never needed an SSH server, or a non-administrative user, is the higher-interest case.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this PowerShell command do, including the full capability name and any switches?
  context: The full command line reveals the specific action taken. Identify which OpenSSH capability was added (Server versus Client), whether -Online targets the running OS, and whether the same invocation chained additional actions such as starting a service or modifying a firewall rule. Because powershell.exe and pwsh.exe are common, this view is scoped to PowerShell invocations on this host that carry the Add-WindowsCapability pattern, so the result reflects the rule's behavior rather than all PowerShell usage.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: 'Add-WindowsCapability'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and if it is plain text, does it match a legitimate capability-install pattern?
  context: The detected cmdlet is human-readable, so the immediate task is to confirm whether the surrounding command line is also plain text or whether it is wrapped in encoding, string concatenation, backtick escaping, or variable substitution that hides additional intent. A clean Add-WindowsCapability -Online -Name OpenSSH.Server invocation looks different from one that pulls or executes additional content; if the command line is encoded, decode it before judging the install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script that performed the capability install?
  context: Script block logging (Windows Event ID 4104) records the deobfuscated script content PowerShell actually executes, giving ground truth about what ran even when the command line is wrapped or only part of a larger script. Look for whether Add-WindowsCapability was a standalone administrative line or one step in a longer script that also started sshd, configured firewall rules, or staged key material. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened in the hour before this execution?
  context: Operators often weaken PowerShell defenses before running their actions. Common precursors include execution policy bypass, AMSI bypass via in-memory patching, real-time protection changes, and downgrade to PowerShell version 2 to evade logging. Finding these before a capability install shifts the disposition away from routine administration and toward deliberate preparation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance, and is that parent chain expected for an administrative install?
  context: The parent process reveals how the install was invoked. Routine provisioning usually has predictable parents such as explorer.exe for interactive admin work, a deployment or configuration management agent, or services.exe. Parents like mshta.exe, wscript.exe, a browser, or an Office application point to script-driven or exploitation-driven invocation rather than a deliberate administrative action.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What did this PowerShell instance and the host do next, such as starting sshd or opening the SSH port?
  context: Enabling the OpenSSH capability is only the first step toward a working remote-access channel. The expected follow-on for a deliberate install is starting and auto-configuring the sshd service and the inbound firewall rule for the SSH port. Other children such as cmd.exe, additional powershell.exe, or key-permission tools acting on user key files indicate the operator is building a usable access path rather than just installing a feature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users drove it, and does the current alert fit?
  context: Even legitimate provisioning leaves a footprint. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific capability-install pattern has run here historically. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing; a match to prior provisioning runs supports a benign disposition.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cmdlet:
        CommandLine|contains: Add-WindowsCapability
      selection_capa:
        CommandLine|contains: OpenSSH.
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cmdlet:
        CommandLine|contains: Add-WindowsCapability
      selection_capa:
        CommandLine|contains: OpenSSH.
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cmdlet:
        CommandLine|contains: Add-WindowsCapability
      selection_capa:
        CommandLine|contains: OpenSSH.
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether this capability install is isolated or part of broader hands-on activity. If the same user enabled remote access or ran related administrative tooling on several hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cmdlet:
        CommandLine|contains: Add-WindowsCapability
      selection_capa:
        CommandLine|contains: OpenSSH.
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining surrounding activity reveals the immediate context: what led to the capability install and what followed it. Look for reconnaissance, account or firewall changes, key-material handling, or persistence mechanisms that together suggest the install is part of building a remote-access foothold.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this capability-install pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or provisioning automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cmdlet:
        CommandLine|contains: Add-WindowsCapability
      selection_capa:
        CommandLine|contains: OpenSSH.
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or other execution — may reveal the attack stages that preceded enabling remote access and help reconstruct the timeline. A capability install that follows suspicious prior alerts reads very differently from one with a clean preceding history.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
