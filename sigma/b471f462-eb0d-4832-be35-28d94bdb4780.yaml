name: Remote Access Tool - Renamed MeshAgent Execution - Windows
id: 6b23a8ce-5b52-4933-92c4-dc8aec952566
description: |
  Detects execution of a renamed instance of the MeshAgent remote monitoring and management (RMM) agent. The rule fires when a
  process either carries the `--meshServiceName` service-install argument on its command line or exposes `meshagent` in its PE
  OriginalFileName metadata, while its on-disk image name is anything other than meshagent.exe. RMM agents like MeshAgent are
  routinely used by IT for legitimate remote support, so the question is whether this instance is sanctioned automation or an
  operator-deployed backdoor. Renaming the agent to a benign-looking binary is a defense-evasion step that lets it blend in while
  it establishes long-lived outbound control, runs under high-integrity contexts, and accepts shell-command and file-transfer
  tasking. Determine the binary's true identity, how it arrived, what external endpoint it reaches, whether the user/host and
  parent chain are expected, and whether the same pattern fired on other hosts.
type: detection
detection_id: b471f462-eb0d-4832-be35-28d94bdb4780
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does this process carry the `--meshServiceName` argument or `meshagent` OriginalFileName while running under a non-meshagent.exe image name?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when the command line contains
    `--meshServiceName` OR the PE OriginalFileName contains `meshagent`, and the on-disk image name is NOT meshagent.exe. Review
    the exact command line and OriginalFileName against the image path to verify the rename, not just a stock MeshAgent install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a remote monitoring and management agent?
  context: Legitimate RMM activity is usually confined to IT support staff, jump hosts, or hosts under a managed-services
    contract. An RMM agent launching on a standard endpoint under a non-IT user, or under a service principal on a host that
    has no support relationship, is a faster route to triage than reverse-engineering the binary. Confirm the user role and
    host function against the detected behavior.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: The image is renamed away from meshagent.exe, but the PE OriginalFileName and code-signing details still reflect
    the original MeshAgent agent. Compare the on-disk Image name against OriginalFileName to confirm the rename, and check the
    signing party and signature status. MeshAgent builds produce per-deployment unique hashes, so a hash with no reputation
    is expected for this tool and does not by itself clear the binary; submit it for reputation lookup and correlate with the
    OriginalFileName mismatch instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: Decode the full command line — what service name, install flags, and configuration was this agent given?
  context: The full command line reveals how the agent was configured. Decode `--meshServiceName` (the service name the agent
    registers under — often chosen to mimic a legitimate Windows service), any install flags such as `-fullinstall`, and any
    embedded MeshCentral server address or configuration. The service name chosen for the masquerade and the install path are
    the operator's choices and frequently the most telling part of the invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:remote_access_tool.tool_authorization
  question: Is MeshAgent on the organization's approved remote access software list?
  context: Organizations typically sanction a specific set of remote support tools. MeshAgent (the MeshCentral agent) not being
    on that list — or being present but renamed away from its canonical name and path — points to shadow IT or attacker-deployed
    persistence rather than managed support. An unauthorized RMM agent should be checked regardless of the tool's general
    reputation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a current helpdesk ticket or support session explaining this remote access agent?
  context: Legitimate RMM usage usually correlates with an active support ticket, a scheduled maintenance window, or a managed-services
    engagement. If no support context exists for this install or session, the agent may have been deployed by an operator for
    persistent access or by a user circumventing controls. A renamed agent with no matching support record is a strong reason
    to treat the install as unsanctioned.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint and port is this agent connecting to?
  context: MeshAgent establishes a long-lived outbound channel to a MeshCentral server, commonly over 80/443 (and WebRTC/WSS)
    to stay firewall-friendly. The destination tells you whether the agent reaches recognized vendor or in-house management
    infrastructure or a custom operator-controlled endpoint. A non-standard or high port and an unfamiliar destination are the
    deviations worth chasing; resolve the destination and compare it to known management infrastructure.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:masquerading.binary_origin
  question: How did this renamed agent arrive on the host, and what process created it?
  context: A renamed agent does not appear spontaneously — it was downloaded, extracted, copied, or dropped by another process.
    Tracing the file-creation event for this binary by basename over a long window reveals the delivery mechanism and the writing
    process — a download tool, an installer, a remote-admin push, or a dropper. A binary written into a user-writable or temp directory
    points to download or extraction; one written under a system directory may indicate a privileged process was abused, or a
    routine deployment, depending on the creating process.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this agent, and is that parent chain expected for an RMM install?
  context: The parent process reveals how the agent was launched. A sanctioned install typically traces to an installer
    (msiexec.exe), a deployment tool, or an interactive admin session. Launch from a remote-execution path (a service host
    invoked over the network, a script interpreter, or a lateral-movement utility like PsExec) points to operator deployment.
    Walk the parent chain to see what spawned the parent and what else it spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did this agent spawn after execution, and is the same renamed agent present on other hosts?
  context: The purpose of renaming the agent is to evade detection while it performs its RMM function — accepting shell commands
    and file transfers. Child processes (cmd.exe, powershell.exe, file-manager helpers) spawned by the agent reveal interactive
    tasking. The same renamed binary appearing on multiple hosts suggests deliberate distribution rather than an isolated install;
    confirm cross-host scope by matching OriginalFileName or hash without a host filter.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_meshagent:
      - CommandLine|contains: --meshServiceName
      - OriginalFileName|contains: meshagent
      filter_main_legitimate:
        Image|endswith: \meshagent.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_meshagent and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_meshagent:
      - CommandLine|contains: --meshServiceName
      - OriginalFileName|contains: meshagent
      filter_main_legitimate:
        Image|endswith: \meshagent.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_meshagent and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar RMM-install or remote-access activity on several hosts, the scope of the operation may be
    larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_meshagent:
      - CommandLine|contains: --meshServiceName
      - OriginalFileName|contains: meshagent
      filter_main_legitimate:
        Image|endswith: \meshagent.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_meshagent and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    the install, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, credential access,
    privilege escalation, or persistence mechanisms surrounding the RMM agent.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or lateral movement —
    may reveal the stages that preceded the RMM install and help reconstruct the timeline. RMM deployment for persistence
    commonly follows initial access and privilege escalation, so prior alerts often frame how the operator reached this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned RMM deployments leave a footprint. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here — not
    generic binary usage. A new parent process, an unexpected user account, or a first-time appearance of the pattern is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_meshagent:
      - CommandLine|contains: --meshServiceName
      - OriginalFileName|contains: meshagent
      filter_main_legitimate:
        Image|endswith: \meshagent.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_meshagent and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
