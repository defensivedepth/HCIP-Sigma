name: Application Removed Via Wmic.EXE
id: db9b85da-ade2-417b-9983-4171496304b0
description: |
  Detects use of wmic.exe to remove or uninstall an installed application, identified by a
  command line that contains both 'call' and 'uninstall' running under the WMIC binary (Image
  ending in WMIC.exe or OriginalFileName wmic.exe). WMIC can invoke the Win32_Product class
  Uninstall method to remove software locally or against a remote host, which is legitimate
  for software lifecycle management but is also used by operators to remove security tooling
  or to exercise WMI for arbitrary local and remote command execution. Investigation should
  confirm what application was targeted, whether the invocation was local or remote, who and
  what drove it, and whether it sits alongside other WMI, LOLBin, or persistence activity.
type: detection
detection_id: b53317a0-8acf-4fd1-8de8-a5401e776b96
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — wmic.exe with both 'call' and 'uninstall'?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact command line and process identity against the rule's criteria. The rule fires
    when the binary is WMIC (Image ends in WMIC.exe or OriginalFileName is wmic.exe) AND the
    command line contains both 'call' and 'uninstall'. Confirm which application class or product
    was targeted and whether a remote node (/node:) was specified.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to uninstall applications via command-line WMI?
  context: Legitimate software lifecycle work — packaging, mass uninstall scripts, helpdesk
    remediation — can trigger this detection. Knowing whether the user role and host function
    are consistent with command-line uninstall activity is often the fastest way to separate
    routine administration from an operator removing software.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What application did this wmic.exe invocation target, and did it run locally or against a remote node?
  context: The full command line reveals the operation. Identify the product or Win32_Product
    filter being uninstalled, whether a node argument (/node) points the call at a remote host,
    and any credential or output-format flags. A remote node argument turns a local uninstall
    into remote WMI command execution. This query scopes to all wmic.exe runs on the host within
    +/-5m, so sequential WMIC invocations that form one logical operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this wmic.exe and is that parent chain expected?
  context: The parent process reveals how WMIC was invoked. Interactive administration usually
    descends from explorer.exe or a console shell; scripted lifecycle work descends from a
    deployment agent or task host. Unusual parents such as a script host, an Office application,
    or a freshly written binary point toward operator or macro-driven execution rather than routine management.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1047.user_context
  question: Under what account and privilege level did this wmic.exe run — interactive user, service account, or SYSTEM?
  context: WMI abuse is tuned heavily on the account context — interactive uninstall by a named
    user reads differently from a SYSTEM- or service-driven invocation. A privileged or service
    account invoking a remote uninstall is a higher-weight pivot than a desktop user removing a
    locally installed application. Capture the User and integrity context from the alerting event
    to anchor downstream baseline questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - Image
      - CommandLine
- source: attack:T1047.network_connection
  question: Did wmic.exe open a network connection around the alert, indicating a remote (/node:) WMI operation rather than a local uninstall?
  context: WMIC can target a remote host with /node:, which produces outbound connectivity over
    DCOM/RPC (TCP 135 then a dynamic high port) from the wmic.exe process. A network connection
    from this binary corroborates a remote command-execution chain — process creation, command
    execution, and a corresponding remote connection — whereas its absence is consistent with a
    purely local uninstall. Pivot on the destination to identify the remote node.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- source: attack:T1047.wmi_activity
  question: What WMI operational activity fired on this host around the alert, and does it reference the same product or namespace?
  context: WMI provider and method invocations are recorded as WMI operational events (such as
    5857, 5858, 5860, 5861) and correlate process-level WMIC execution with the underlying WMI
    operation. Matching the timing and target of these events to the alerting command line
    confirms the uninstall ran through WMI and surfaces additional WMI calls — event subscriptions
    or queries against namespaces like root\cimv2 or root\subscription — that the process-creation
    view alone would miss. If WMI operational logs are not ingested in this environment, treat zero
    results as a visibility gap rather than evidence nothing ran.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - EventID
      - User
      - Operation
- source: template:cue_process_tool.follow_on
  question: What child processes did this wmic.exe spawn afterward?
  context: The processes spawned by WMIC reveal its actual impact. A local uninstall typically
    invokes msiexec.exe or a vendor uninstaller; unexpected children such as cmd.exe,
    powershell.exe, or certutil.exe point to WMIC being used as a launch vector for follow-on
    execution rather than software removal.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this WMIC uninstall pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine tools get abused. This query mirrors the rule's selection structure scoped
    to this host, so the parent and user distribution reflects how the rule's specific firing
    pattern — not generic WMIC usage — has historically run here. A new parent process, an
    unexpected account, or an unfamiliar command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - uninstall
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - uninstall
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - uninstall
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity
    spanning multiple endpoints. If the same user drove similar activity on several hosts in the
    window, the scope of the operation may be larger than a single uninstall.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - uninstall
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, or credential access — may reveal the stages that preceded this
    event and help reconstruct the timeline. Removal of a security agent via WMI is often preceded
    by such activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.renamed_binary_check
  question: Was wmic.exe executed from its expected System32 or SysWOW64 path?
  context: WMIC executed from a non-standard path — outside System32 or SysWOW64 — may indicate
    the binary was copied or renamed to evade path-based allowlists. Compare the Image path against
    the expected location and the OriginalFileName to confirm the on-disk binary is the genuine
    WMIC and was run from where it normally lives.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this WMIC uninstall pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more notable than one used daily
    under stable parents. This query mirrors the rule's selection structure scoped to this host,
    so the count reflects the rule's specific firing pattern rather than generic WMIC usage. The
    command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - uninstall
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one LOLBin often use several. WMIC is a proxy-execution LOLBin;
    finding rundll32, regsvr32, mshta, msbuild, or similar binaries performing arbitrary execution
    on the same host in the same timeframe strengthens the case that WMIC was part of hands-on
    activity rather than routine software management.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host?
  context: Operators rarely rely on a single mechanism. Around the time WMI is used to remove
    software — often a security agent — backup footholds are commonly installed using other
    techniques such as scheduled tasks, services, registry Run keys, BITS jobs, or WMI event
    subscriptions. Multiple persistence installations in the same window indicate intentional
    stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
