name: VeeamBackup Database Credentials Dump Via Sqlcmd.EXE
id: 4b20307a-c5c3-4b1f-bfae-ddc549f36fe4
description: |
  Detects sqlcmd.exe running a SELECT TOP query against the [VeeamBackup].[dbo].[Credentials]
  table. The rule fires only when all of the selection groups match: the image ends in sqlcmd.exe
  AND the command line contains SELECT, TOP, and the [VeeamBackup].[dbo].[Credentials] reference.
  Veeam Backup & Replication stores hypervisor, domain, cloud, and repository credentials in that
  table; reading it from an interactive or scripted SQL client is the canonical recipe for bulk
  credential extraction during the collection stage of an intrusion. Legitimate password-recovery
  by an administrator on the Veeam server itself is possible, so the investigation should establish
  who ran the query, from what parent, whether the host and account are expected to touch the Veeam
  database, and what the operator did with the recovered credentials.
type: detection
detection_id: b57ba453-b384-4ab9-9f40-1038086b4e53
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the sqlcmd.exe command line actually SELECT TOP from the [VeeamBackup].[dbo].[Credentials] table?
  context: Confirm the alert is a true positive before investing time. The rule requires sqlcmd.exe AND a
    command line containing SELECT, TOP, and the [VeeamBackup].[dbo].[Credentials] reference together, so
    review the full command line and image against those criteria. Note which columns the query targets —
    user_name, password, and description point at credential extraction rather than an inventory count.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to query the Veeam backup database for stored credentials?
  context: Legitimate Veeam password recovery is performed by a backup administrator on the Veeam server
    itself. Knowing whether this account administers Veeam and whether this host runs the Veeam SQL instance
    is often the fastest way to separate routine recovery from credential theft. A non-Veeam host or an
    account with no backup-administration role is a strong reason to escalate.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What was the full sqlcmd.exe command — which server, instance, database, and columns did it target,
    and was output redirected to a file?
  context: The full command line reveals the operational intent. Decode the -S server\instance target, the
    -d database, the -Q query body, and any -o output redirection. Columns such as user_name, password, and
    description being selected from the Credentials table confirm credential extraction; an -o redirect to a
    text file means the encrypted blobs were staged on disk for later decryption.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Credential extraction is a hands-on-keyboard action an operator often precedes by weakening protection.
    The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions,
    clear logs, or patch AMSI/ETW. Zero rows is a useful protection-looks-healthy signal — kernel-level driver
    tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator
    preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.process_chain
  question: What process spawned sqlcmd.exe and is that parent chain expected?
  context: The parent process reveals how the query was launched. Legitimate recovery is typically driven by an
    interactive admin shell or a Veeam-related management process. Parents such as cmd.exe spawned from a remote
    execution service, wscript.exe, powershell.exe carrying a one-liner, or a process-injection host point at
    scripted credential extraction. Scoping monitoring to the parent/child tree is how this collection behavior
    is distinguished from a routine database operation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:data_staging_exfil.data_scope
  question: What files did sqlcmd.exe write to disk on this host?
  context: 'A SELECT against the Credentials table returns encrypted password blobs for stored accounts —
    commonly hypervisor root, vCenter administrator, domain administrator, cloud storage keys, and SMB
    repository credentials. When the query is redirected with -o, those blobs land in a file on disk; this
    query surfaces what sqlcmd.exe wrote so the staged credential dump can be located, scoped, and tied to
    which systems need rotation.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:data_staging_exfil.archive_destination
  question: Where was the query output written, and was it moved or sent off the host afterward?
  context: Credential extraction via sqlcmd often redirects results to a text file with -o, which is then read,
    decrypted, or copied off the host. Checking for files written by sqlcmd.exe and subsequent moves or outbound
    connections from the same host reveals the staging and exfiltration path — whether the blobs were left on
    disk for local decryption or carried to another system.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:data_staging_exfil.encryption_password
  question: Did the query use authentication or output flags that change how the recovered data was handled?
  context: Re-read the triggering command line for flags that affect handling of the credential blobs — -E for
    trusted Windows authentication, -U/-P for explicit SQL credentials, and -o for file redirection. Trusted
    authentication means the operator already held local rights on the Veeam SQL instance; explicit credentials
    mean a captured SQL account was reused. The combination indicates how the operator gained access and where
    the encrypted output went.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that
    activity, and does the current alert fit that pattern?
  context: Even on a Veeam server, querying the Credentials table is a rare event. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific
    pattern has historically run here. A new parent process, an unexpected account, or a first-ever occurrence is
    the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
        Image|endswith: \sqlcmd.exe
      selection_query:
        CommandLine|contains|all:
        - SELECT
        - TOP
        - '[VeeamBackup].[dbo].[Credentials]'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did sqlcmd.exe spawn afterward?
  context: After extracting the encrypted blobs, an operator typically decrypts them or stages them for movement.
    Children of sqlcmd.exe such as powershell.exe (often invoking the Veeam ProtectedStorage decryption helper),
    cmd.exe, certutil.exe, or archive tools indicate post-collection processing. Legitimate recovery rarely
    chains additional tooling directly off the query.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
        Image|endswith: \sqlcmd.exe
      selection_query:
        CommandLine|contains|all:
        - SELECT
        - TOP
        - '[VeeamBackup].[dbo].[Credentials]'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
        Image|endswith: \sqlcmd.exe
      selection_query:
        CommandLine|contains|all:
        - SELECT
        - TOP
        - '[VeeamBackup].[dbo].[Credentials]'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or staging on multiple
    endpoints. Credential extraction from a backup database is usually one step in a larger operation, so the
    same user driving reconnaissance, lateral movement, or further credential access on other hosts widens the
    likely scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
        Image|endswith: \sqlcmd.exe
      selection_query:
        CommandLine|contains|all:
        - SELECT
        - TOP
        - '[VeeamBackup].[dbo].[Credentials]'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Credential collection rarely occurs in isolation. Examining activity around the alert reveals the
    immediate context: what led to the query, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, lateral-movement tooling, or staging of the recovered credentials around the same
    window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the rule's firing pattern. Many hosts firing the same query points to a scripted recovery routine
    or vendor automation; a single host or a small unrelated set points to manual operator activity. Use the
    host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
        Image|endswith: \sqlcmd.exe
      selection_query:
        CommandLine|contains|all:
        - SELECT
        - TOP
        - '[VeeamBackup].[dbo].[Credentials]'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or initial-access tooling —
    may reveal the stages that preceded credential collection and help reconstruct the timeline. Credential
    access from a backup database is typically reached after an operator has already established a foothold and
    enumerated the environment.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
