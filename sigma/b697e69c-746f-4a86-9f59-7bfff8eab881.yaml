    - dropped: cue_process_tool.baseline
      reason: "host-level binary baseline overlaps cue_parent_process.baseline, which is more specific (parent+cleanmgr pairing) for this parent-driven detection"
      kept: cue_parent_process.baseline
    - dropped: cue_parent_process.clustering
      reason: "same-time parent activity overlaps cue_host_context.clustering and cue_parent_process.follow_on; dropped to stay under the 18-question cap"
      kept: cue_host_context.clustering
    - dropped: cue_parent_process.scope
      reason: "cross-host scope of the parent-child pair overlaps cue_user_actor.clustering_svc (Schedule service host + cleanmgr across hosts in window); dropped to stay under the cap"
      kept: cue_user_actor.clustering_svc
  skipped_templates:
    - template: universal.endpoint_protection_health
      reason: "RECOMMENDED, not must_include. Tamper-as-precursor is covered for this rule by cue_host_context.precursor and uac_bypass.other_escalation_attempts (prior-alert sweep on the host); rule is privilege-escalation, not a hands-on payload/credential-access rule whose disposition turns on AV/EDR being disabled first. Dropped to stay under the 18-question cap."
  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1548.002) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        image_load coverage targets the DLL-hijack family of UAC bypasses
        (sysprep.exe + cryptbase.dll and friends). This rule detects the
        DiskCleanup scheduled-task variable-expansion method (UACMe 34), which
        carries no malicious DLL load into an auto-elevated binary — the
        elevation comes from the scheduled task, not a planted DLL. No
        compensating attack:T1548.002.image_load question authored because the
        method does not produce a discriminating image_load artifact.
    - hint: "logsource 'process_access' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        process_access (Sysmon EventCode 10) coverage targets token-theft and
        elevated-COM UAC bypasses that open handles into other processes. The
        DiskCleanup scheduled-task method does not perform cross-process token
        manipulation; elevation is obtained via the Task Scheduler service host,
        not OpenProcess against an auto-elevated target. The elevated-action
        sweep (uac_bypass.elevated_action_after_bypass) captures what ran at
        High/System integrity, which is the analyst-relevant outcome here.
    - hint: "logsource 'security' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The security logsource recommendation maps to EventCode 4672 (special
        privileges assigned to a new logon) as the elevation signal. The
        elevation is already evidenced by the rule's IntegrityLevel High/System
        match and by uac_bypass.elevated_action_after_bypass, which enumerates
        every High/System integrity process spawned after the bypass via
        process_creation. A separate 4672 query would re-surface the same
        elevation event without adding an investigation step.
