name: Potential PowerShell Obfuscation Via Reversed Commands
id: fa85eb4d-688b-4013-bc8c-947c7fac1af2
description: |
  Detects PowerShell (powershell.exe or pwsh.exe) invoked with character-reversed
  fragments of common PowerShell keywords on the command line (for example "llehsrewop",
  "daolnwod", "tneilCbeW", "46esab", "ekovn"), while the standard -EncodedCommand / -enc
  flags are absent. Reversing a string and rebuilding it at runtime (such as via a
  -join with array reversal) is a way to keep recognizable cmdlet and download-cradle
  keywords out of the literal command line so signature and casual review miss them.
  The rule fires when both the binary/OriginalFileName match AND at least one reversed
  token is present AND no -EncodedCommand/-enc keyword is present. Determine what the
  reconstructed command actually does (download cradle, in-memory loader, reverse shell),
  how PowerShell was launched, and whether this user and host legitimately run obfuscated
  PowerShell.
type: detection
detection_id: b6b49cd1-34d6-4ead-b1bf-176e9edba9a4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain reversed PowerShell keywords and match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    when the process is powershell.exe or pwsh.exe AND the command line contains at least one reversed
    keyword fragment (such as llehsrewop, daolnwod, tneilCbeW, 46esab, ekovn, tcejbO) AND neither
    -EncodedCommand nor -enc is present. Read the exact command line and confirm a reversed token is
    really there rather than an incidental substring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run PowerShell with obfuscated or string-reversed commands?
  context: Legitimate administrative and automation scripts almost never reverse cmdlet names to hide
    them. Knowing whether the user role and host function involve hand-written obfuscated PowerShell, or
    whether this is a workstation that should never see it, is often the fastest path to separating a
    true positive from a rare but benign developer or tooling artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.evidence_preservation
  question: Did this PowerShell write any files to disk, and are they still present for analysis?
  context: Reversed download-cradle keywords (daolnwod, tneilCbeW, elifotevas, htaPpmeTteG) suggest the
    reconstructed script may fetch a payload and save it, often into a temp or user-writable path. If a
    file was written, capturing it on disk enables hashing, reputation lookup, and content review. File
    paths here are derived from the command line, so scope to the paths the command references.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: Reconstruct the reversed fragments — what is the full PowerShell command actually doing?
  context: The reversed tokens are pieces of cmdlet and method names (llehsrewop=powershell, daolnwod=download,
    tneilCbeW=WebClient, 46esab=base64, ekovn=nvoke, maerts=stream). Read the whole command line, reverse the
    obfuscated substrings, and identify the operation it rebuilds at runtime — a download cradle, an in-memory
    .NET load, or a reverse shell. The query is scoped to the triggering event so only this command's
    arguments are returned.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Beyond the reversed tokens, is any part of the payload base64-encoded or otherwise wrapped, and what does it decode to?
  context: Reversal is often layered with other obfuscation. The reversed fragment 46esab (base64) and tneilc/ptth
    (client/http) suggest the reconstructed script may itself contain a base64 blob fed to FromBase64String or a
    download cradle, even though the standard -EncodedCommand/-enc flags are deliberately avoided here. Decode any
    inner encoded content to reveal the actual payload — download URLs, in-memory loaders, or reverse shells.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Windows Event ID 4104 records the script content PowerShell actually executes after it reverses and
    reassembles the obfuscated tokens, giving ground truth that bypasses the command-line obfuscation entirely.
    If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap
    rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Obfuscated PowerShell is frequently preceded by AMSI bypass (patching amsi.dll in memory), execution
    policy changes (Set-ExecutionPolicy or -ep bypass), or a downgrade to PowerShell v2 which lacks script block
    logging. Finding these precursor events on this host strengthens the case that the reversed command is
    operator activity rather than a benign artifact.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell and is that parent chain expected?
  context: The parent process reveals how PowerShell was launched. Interactive use typically descends from
    explorer.exe or a console host; obfuscated PowerShell launched from Office applications (winword.exe,
    excel.exe), mshta.exe, wscript.exe, rundll32.exe, or a web/database service process is a strong indicator
    of macro-driven or exploitation-driven execution.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1059.001.image_load
  question: What .NET and scripting assemblies did this PowerShell load, and do any indicate reflective or in-memory execution?
  context: Reversed download-cradle and base64 keywords often precede loading .NET assemblies straight into
    memory rather than executing an on-disk script. Image-load (Sysmon Event ID 7) events for this PowerShell
    process show which modules were brought in — rare or never-before-seen assemblies, or System.Management.Automation
    loaded by a non-PowerShell host, point to reflective code loading that leaves no script file behind. If
    image-load events are not collected in this environment, treat zero results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_process_tool.baseline
  question: Does this host normally run PowerShell at all, and how often?
  context: A host that rarely or never runs powershell.exe or pwsh.exe is more suspicious when it suddenly
    runs an obfuscated command. The 90-day aggregation shows historical frequency by user; zero or very low
    counts indicate first-time or rare PowerShell use on this endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the alert?
  context: Obfuscated PowerShell rarely runs alone. Activity in the surrounding window may reveal the parent
    delivery (a macro, a script host) or follow-on stages — reconnaissance, credential access, persistence
    installation, or staging — that establish the broader timeline and intent for this event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access, or a suspicious parent execution — may reveal the attack stages that
    preceded this obfuscated PowerShell and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell, including obfuscated or reversed commands?
  context: Compare this user's current action against their historical pattern across the environment. A user
    who has never run PowerShell, or whose role does not involve scripting, is more suspicious than an
    administrator or developer who runs it routinely. User role and typical toolset should align with the
    detected behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+PowerShell combination historically routine on this host or across the environment, or is the parent unusual for PowerShell?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer
    account), user identity does not attribute the behavior. The meaningful pivot is the launch mechanism — which
    parent process spawned PowerShell, and whether that pair is historically common. A new or rare parent for
    PowerShell here is the deviation worth chasing; a pair already accounting for thousands of prior events is
    vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar PowerShell activity on other hosts in this window, the scope of
    the compromise may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+PowerShell combination fire on other hosts in the same window — a coordinated automation rollout, or isolated to this host?
  context: Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same
    launch mechanism — parent process plus PowerShell — fired on other hosts in the alert window. Multiple hosts
    point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this reversed-command pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the rule's specific firing pattern rather than generic PowerShell usage. Many hosts firing the same
    reversed-token pattern points to scripted deployment or a shared obfuscated tool; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - hctac
        - kaerb
        - dnammoc
        - ekovn
        - eliFd
        - rahc
        - etirw
        - golon
        - tninon
        - eddih
        - tpircS
        - ssecorp
        - llehsrewop
        - esnopser
        - daolnwod
        - tneilCbeW
        - tneilc
        - ptth
        - elifotevas
        - 46esab
        - htaPpmeTteG
        - tcejbO
        - maerts
        - hcaerof
        - retupmoc
      filter_main_encoded_keyword:
        CommandLine|contains:
        - ' -EncodedCommand '
        - ' -enc '
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
