    - hint: "logsource 'image_load' (recommended by techniques: T1059.005,T1059.007) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The rule's detection is the csc.exe compile spawned by a suspicious
        parent (T1027.004), expressed entirely in process_creation. T1059.005
        and T1059.007 are tagged only because cscript/wscript/mshta appear in
        the parent list; the rule does not fire on script-engine module loads.
        Confirmation that the parent script host actually executed VB/JS is
        reached through Q4 (parent mechanism_decode, which reads the parent's
        script/command line) and Q6 (decode of encoded parent payloads). An
        image_load query of vbscript.dll/scrrun.dll on the parent would return
        volume without precision for the parent-of-csc compile pattern the rule
        detects. No compensating attack:T1059.005.image_load question authored.
