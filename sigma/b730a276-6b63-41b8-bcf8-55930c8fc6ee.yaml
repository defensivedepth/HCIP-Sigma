  mutable_dispositions:
    - element: ParentProcess
      dimension: parent_process_analysis
      specific_values: "Office apps (winword/excel/outlook/powerpnt/onenote), script hosts (cscript/wscript/mshta), powershell/pwsh"
      disposition: query_injection
      target_question: Q14
      notes: "Parent list is the rule's selection_parent_* blocks, embedded verbatim in the reflected historical baseline query"
    - element: OutputDirectoryPath
      dimension: tuning_parameter
      specific_values: "C:\\Users\\Public, %TEMP%, AppData, ProgramData (user-writable output zones)"
      disposition: context
      target_question: Q10
      notes: "Surfaced in evidence_preservation context and via %file_paths% scoping; csc output/source paths come from the command line"
    - element: ScriptPath
      dimension: tuning_parameter
      specific_values: "%TEMP%, user download folder, UNC/web path"
      disposition: context
      target_question: Q4
      notes: "Parent script/source path read from ParentCommandLine in mechanism_decode"
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "-Encoded , FromBase64String (PowerShell parent branch)"
      disposition: query_injection
      target_question: Q14
      notes: "Encoded-PowerShell parent values embedded in reflected baseline query; decoded in Q6"
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only"
      disposition: context
      target_question: Q11
      notes: "Compile-then-C2 correlation window expressed as +1h network query range"
    - element: PayloadEntropyThreshold
      dimension: obfuscation_check
      specific_values: "rationale only"
      disposition: context
      target_question: Q6
      notes: "High-entropy/encoded-content rationale informs the decode question; no queryable threshold"
    - element: ModuleName
      dimension: tuning_parameter
      specific_values: "vbscript.dll, scrrun.dll, jscript modules"
      disposition: context
      target_question: Q4
      notes: "Script-engine module context folded into parent mechanism_decode; image_load logsource declined (see hint_dispositions)"
    - element: AllowedHTASources
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q8
      notes: "Allowlist tuning rationale for mshta parents; informs delivery_vector context"
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "ilasm, msbuild, installutil, regasm, rundll32, regsvr32, mshta, cmstp, msiexec"
      disposition: query_injection
      target_question: Q13
      notes: "Compiler/proxy-execute LOLBin list injected into technique_class_lateral selection_img"
