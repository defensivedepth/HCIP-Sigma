name: Reg Add Suspicious Paths
id: dc0aa10b-ba29-4968-a2f3-b1de405f4c80
description: |
  Detects reg.exe adding or modifying keys under sensitive registry locations -- AppDataLow software keys, OOBE and Winlogon policy paths, the Winlogon key itself, the WDigest SecurityProviders key, and Windows Defender keys. The rule fires when the process is reg.exe (by image name or original filename) AND the command line references one of these paths. Legitimate administrators and deployment tooling occasionally touch these keys, but the same paths are used to plant logon persistence, enable cleartext credential caching via WDigest, or weaken Windows Defender, so the investigation should determine which key was written, what value was set, who launched reg.exe, and whether other configuration or tampering activity accompanied it.
type: detection
detection_id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show reg.exe writing to one of the sensitive registry paths this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when reg.exe (by image name or OriginalFileName) writes to a sensitive path -- AppDataLow software keys, OOBE or Winlogon policy paths, the Winlogon key, the WDigest SecurityProviders key, or a Windows Defender key. Confirm the command line contains an add or modify operation against one of these locations and note which path it targeted, because the path determines whether this is logon persistence, credential-caching, or defense weakening.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to edit sensitive registry keys directly with reg.exe?
  context: Legitimate administrative activity can trigger this detection. Direct command-line edits to Winlogon, WDigest, OOBE policy, or Defender keys are normally made by deployment tooling or group policy, not interactively. Knowing whether this user role and host function routinely make such changes is often the fastest path to distinguishing a true positive from routine operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:organizational_context.procedural_consistency
  question: Is editing these registry keys directly with reg.exe consistent with how your organization normally makes such changes?
  context: Organizations usually push registry changes via group policy or a deployment tool rather than interactive reg.exe. Direct command-line edits to Winlogon, WDigest, or Defender keys may indicate an operator bypassing normal tooling, or simply an admin taking a shortcut. Understanding the normal procedure for these specific keys helps distinguish the two.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:registry.registry_key_context
  question: What specific registry key and value did reg.exe write, and is this a known persistence or evasion location?
  context: The registry path reveals intent. Winlogon keys (Userinit, Shell, Notify) and OOBE policy paths establish logon persistence; the WDigest UseLogonCredential value re-enables cleartext credential caching; Windows Defender keys disable protection. If a correlated registry write event exists for this process, it shows the target key (TargetObject) and value written (Details) as structured fields; otherwise read the path and data directly from the alerting reg.exe command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:defense_tampering.what_was_disabled
  question: If the write targeted a Windows Defender or WDigest key, what protection or credential-handling setting was changed?
  context: Several of the detected paths weaken security posture rather than establish persistence. A write under the Windows Defender keys can disable real-time monitoring or add exclusions; a write to the WDigest SecurityProviders key (UseLogonCredential=1) forces Windows to cache plaintext credentials in memory for later theft. Identify the specific value and data set to determine whether protection was degraded or credential exposure was enabled.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:parent_child.parent_process_legitimacy
  question: What process spawned reg.exe, and what started that parent?
  context: The parent process reveals how reg.exe was invoked. Interactive administration typically shows cmd.exe or powershell.exe under explorer.exe; script hosts (wscript.exe, mshta.exe), Office applications, or unexpected service parents point to scripted or malicious invocation. Tracing the parent's own origin (grandparent) shows whether the chain is a legitimate user action or an automated foothold writing these keys.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn around this time?
  context: If a suspicious parent spawned reg.exe, it likely spawned other processes too. Sibling processes reveal the full scope of activity from that parent -- additional LOLBins, credential-access tools, or further registry edits from the same parent point to orchestrated activity rather than a one-off administrative command. host.name is included as a fallback because the parent identifier may be unavailable.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run reg.exe to edit registry keys?
  context: Compare this user's current action against their historical pattern. A user who has never run reg.exe, or never edited keys like these, is more suspicious than one who does so routinely as part of their role. User role and typical toolset should align with editing Winlogon, WDigest, or Defender configuration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and reg.exe combination historically routine on this host or across the environment, or is the parent unusual for reg.exe?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account), user identity does not attribute behavior. The meaningful pivot is the launch mechanism -- which parent process spawned reg.exe, and whether that pair is historically common. A new or rare parent for reg.exe is the deviation worth chasing; a pair that already accounts for thousands of prior events is deployment or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered registry edits or other notable activity on multiple hosts in the same window, the scope of the operation may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and reg.exe combination fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism -- parent process plus reg.exe -- fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: Operators who modify one sensitive key often modify several -- for example setting a Winlogon persistence value AND disabling Defender AND enabling WDigest credential caching. Clusters of reg.exe write operations from the same user within a short window reveal the full scope of configuration changes and whether multiple objectives were pursued in one operation.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: Operators who weaken one control often weaken several -- stopping Defender services AND clearing event logs AND deleting shadow copies maximizes coverage. Finding additional tampering events from the same user or parent process around this time indicates multiple controls were targeted in one operation rather than an isolated registry edit.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:lolbin.renamed_binary_check
  question: Was reg.exe executed from its expected System32 or SysWOW64 path?
  context: reg.exe running from outside System32 or SysWOW64 may indicate it was copied or renamed to evade path-based allowlists, or that an unrelated binary presented reg.exe as its original filename. Compare the Image path against OriginalFileName -- a reg.exe in a user temp or AppData directory is more suspicious than one in System32.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's reg.exe pattern over the past 90 days, and what command-line shapes are typical?
  context: A registry-edit pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern -- reg.exe writing these sensitive paths -- not generic reg.exe usage. The command-line projection lets the analyst compare typical invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_path:
        CommandLine|contains:
        - \AppDataLow\Software\Microsoft\
        - \Policies\Microsoft\Windows\OOBE
        - \Policies\Microsoft\Windows NT\CurrentVersion\Winlogon
        - \SOFTWARE\Microsoft\Windows NT\Currentversion\Winlogon
        - \CurrentControlSet\Control\SecurityProviders\WDigest
        - \Microsoft\Windows Defender\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, credential access, or other defense tampering -- may reveal the attack stages that preceded these registry edits and help reconstruct the full timeline. Reconnaissance followed by configuration changes, or credential access following a WDigest edit, tells the attack story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
