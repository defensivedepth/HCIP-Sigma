name: Use of FSharp Interpreters
id: 7a3d30b8-c487-48f1-be02-77f474679482
description: |
  Detects execution of the F# interactive interpreters fsi.exe and fsianycpu.exe, identified by Image name
  or OriginalFileName. Both are Microsoft-signed binaries bundled with Visual Studio and the .NET SDK and can
  execute arbitrary .NET code from an .fsx/.fsscript file or interactively, which makes them an application
  allowlist (WDAC) bypass: a signed interpreter runs attacker F# even when unsigned code is denied. On a
  developer workstation this is routine; on a non-developer host it is an unusual execution path. Investigate
  what code the interpreter ran, what parent launched it, what it spawned afterward, and whether the host and
  user have any legitimate F# development context.
type: detection
detection_id: b96b2031-7c17-4473-afe7-a30ce714db29
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Is the alerting process fsi.exe or fsianycpu.exe by image name or original file name?
  context: Confirm the alert is a true positive before investing time. The rule fires when the Image ends in \fsi.exe or \fsianycpu.exe, or the OriginalFileName is fsi.exe or fsianycpu.exe. The OriginalFileName check catches a renamed interpreter, so verify both the on-disk name and the original file name to confirm an F# interpreter actually executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run F# interpreters?
  context: F# interpreters are developer tooling. On a workstation belonging to a software engineer who works in .NET, fsi.exe is routine; on a server, a non-developer endpoint, or a kiosk it is unusual and worth scrutiny. Knowing the host function and whether the account is a developer identity is often the fastest way to separate legitimate development from allowlist-bypass abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What code did the interpreter run? Decode the command line and identify any script path or inline F#.
  context: The full command line reveals what the interpreter executed. fsi.exe and fsianycpu.exe accept an .fsx or .fsscript path to run, can take inline F# via --exec or --use, and run an interactive session when given no script. Identify the script file path (then examine its contents and origin), any inline code, and any flags. F# can call into unmanaged code and invoke PowerShell, so the script is where the real action lives, not the interpreter invocation itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned the interpreter and is that parent chain expected?
  context: The parent process reveals how the interpreter was launched. A developer session typically shows explorer.exe, a Visual Studio process, a terminal, or a build tool as the parent. Parents such as a browser, an email client, an Office application, mshta.exe, wscript.exe, or a script downloaded to a temp directory point to delivery of the interpreter as an allowlist-bypass payload rather than development.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did the interpreter spawn afterward?
  context: The processes spawned by the interpreter reveal its actual impact. Legitimate F# development rarely shells out; an interpreter spawning cmd.exe, powershell.exe, certutil.exe, rundll32.exe, or network-capable binaries suggests the F# script is a launcher or download cradle for post-exploitation rather than ordinary code execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: A signed-interpreter allowlist bypass is an execution path operators often pair with weakening defenses first. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal; kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline
  question: Does this host normally run F# interpreters?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. On a developer workstation fsi.exe may show a steady history; on a host with zero or very low prior counts, this execution is first-time or rare and the interpreter has no obvious development reason to be present.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run the F# interpreters, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even legitimate development tooling can be abused. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how the interpreters have actually run here, not generic binary usage. A new parent process, an unexpected account, or a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \fsi.exe
        - \fsianycpu.exe
      - OriginalFileName:
        - fsi.exe
        - fsianycpu.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts run the F# interpreters in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the same firing pattern rather than generic usage. Many hosts running the interpreters points to a development team or a build/CI fleet where F# tooling is expected; a single host or a small unrelated set points to manual operator activity that does not fit a development footprint. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \fsi.exe
        - \fsianycpu.exe
      - OriginalFileName:
        - fsi.exe
        - fsianycpu.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user account normally run F# interpreters across the environment?
  context: Compare this account's current activity against its history. A developer who routinely runs fsi.exe is expected; an account that has never launched an F# interpreter, or a non-developer or service identity doing so, is more suspicious. Pair this with the launch-mechanism baseline, because under a service or SYSTEM identity the user pivot loses meaning.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-to-interpreter launch mechanism historically routine on this host or environment-wide, or is the parent unusual for this binary?
  context: When the alert fires under a service or SYSTEM identity, user identity does not attribute behavior, so the meaningful pivot is the launch mechanism. Which parent process spawned the interpreter, and is that pair historically common. A pair that already accounts for many prior events is established development or build automation; a new or rare parent for the F# interpreters on this host or environment-wide is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user account do across the network around this time?
  context: Tracking the account's activity across all hosts can reveal lateral movement or a wider footprint. If the same account triggered similar interpreter or other tool activity on multiple endpoints in the alert window, the scope of compromise may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-to-interpreter launch fire on other hosts in the same window, indicating a pushed or scheduled rollout?
  context: Under a service or SYSTEM identity, asking what else the account did across the network returns agent-telemetry noise. The meaningful question is whether the same launch mechanism, the same parent spawning an F# interpreter, fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation such as a build pipeline; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Execution via a signed interpreter rarely appears in isolation. Earlier detections on the same host, such as initial access, defense tampering, or reconnaissance, may reveal the stages that preceded this interpreter run and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur alone. Examining surrounding activity reveals what led to the interpreter running and what followed it, including file drops, follow-on execution, or reconnaissance. Novel parent-child pairs stand out at low counts against routine high-count agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
