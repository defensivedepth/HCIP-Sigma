name: Remotely Hosted HTA File Executed Via Mshta.EXE
id: 79a25559-0f3e-49de-8c1e-cd00674f75d3
description: |
  Detects mshta.exe (or a binary whose original filename is MSHTA.EXE) running with a command line that contains a remote URL scheme (http://, https://, or ftp://), which indicates a remotely hosted HTA or script payload is being fetched and executed through this Microsoft-signed binary. mshta.exe is a trusted system binary; attackers use it to proxy-execute VBScript/JScript or HTA content from an external endpoint, bypassing application-control policies that allowlist the binary itself. The rule fires when the binary criterion AND the remote-URL criterion both match; investigation should confirm the URL, identify what the HTA did once executed, and determine whether the parent process and destination are expected for this host and user.
type: detection
detection_id: b98d0db6-511d-45de-ad02-e82a98729620
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match this rule — mshta.exe (or a binary with original filename MSHTA.EXE) launched with an http://, https://, or ftp:// URL on the command line?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and binary identity against the rule's criteria. Both conditions must hold together — the binary is mshta.exe (or renamed to it) and the command line carries a remote URL scheme.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to fetch and run HTA or script content from a remote URL via mshta.exe?
  context: Legitimate administrative or application activity can invoke mshta.exe, but remotely hosted HTA execution is unusual on most endpoints. Knowing whether the user role and host function involve HTA-based tooling is often the fastest path to distinguishing a true positive from routine operations. The set of parent processes and source domains that are legitimate for this environment is the tuning surface for this technique.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What remote payload did mshta.exe fetch and run? Decode the full command line and the URL.
  context: The full command line reveals the remote source and any inline script. Decode the URL scheme and host, note whether the target is an .hta, a script, or an arbitrary file extension serving HTA content, and capture any additional flags. The command-line pattern referencing remote HTA/script content is the primary investigative signal for this technique. This scopes to all mshta.exe executions on this host within the window, so sequential invocations that form one operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_network_endpoint.mechanism_decode
  question: What is the remote destination in the command line, and what do DNS, WHOIS, and threat intel reveal about it?
  context: 'Investigate the endpoint named in the URL: DNS resolution history, registration age, TLS certificate details, and known threat-intel hits. Recently registered domains, raw IP literals, non-standard ports, or known attacker infrastructure point to an attacker-controlled source. This query surfaces the outbound connection mshta.exe made on this host so you can correlate the destination against the URL on the command line.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationIp
      - DestinationPort
- source: template:cue_process_tool.process_chain
  question: What process spawned mshta.exe, and is that parent chain expected?
  context: The parent process reveals how mshta.exe was invoked. User-driven HTA execution typically descends from explorer.exe or a browser; spawning from Office applications, script interpreters (wscript.exe, cscript.exe), or another LOLBin is a stronger indicator of macro-driven or chained execution. Profiling the parent-child relationship is the core tuning surface for unexpected proxy-execution lineage.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.005.file_event
  question: Did mshta.exe write any files to disk on this host shortly after it ran?
  context: Remotely hosted HTA execution frequently stages a second-stage payload — a script, executable, or archive — into a user-writable location such as a temp directory, the public profile, or ProgramData. Files written by mshta.exe in the minutes after execution indicate the HTA did more than display content and identify the next artifact to triage.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did mshta.exe spawn afterward?
  context: The processes spawned by mshta.exe reveal the actual impact of the executed HTA. Legitimate HTA content rarely launches new processes; malicious usage commonly spawns cmd.exe, powershell.exe, or additional LOLBins (certutil, rundll32, regsvr32) for download and post-exploitation. Unexpected children are the strongest evidence that the proxy execution carried an active payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mshta.exe
      - OriginalFileName: MSHTA.EXE
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
        - ftp://
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mshta.exe
      - OriginalFileName: MSHTA.EXE
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
        - ftp://
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mshta.exe
      - OriginalFileName: MSHTA.EXE
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
        - ftp://
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms in the surrounding window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who use one proxy-execution LOLBin often use several. If mshta.exe was used to run remote content, check whether rundll32, regsvr32, msbuild, cmstp, installutil, or msiexec were also used to execute code on the same host. Finding multiple proxy-execution LOLBins performing the same objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
          - '\installutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was mshta.exe executed from its expected System32 or SysWOW64 path?
  context: mshta.exe executed from a non-standard path (outside System32 or SysWOW64) may indicate the binary was copied or renamed to evade path-based allowlists. The rule also matches on OriginalFileName MSHTA.EXE, so a renamed copy still fires — confirm both the on-disk Image path and the original filename to spot relocation or renaming.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's mshta.exe remote-URL pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents. The query mirrors the rule's selection structure scoped to this host, so the resulting count reflects the rule's specific firing pattern — mshta.exe with a remote URL — not generic usage of the binary. The CommandLine projection lets you compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mshta.exe
      - OriginalFileName: MSHTA.EXE
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
        - ftp://
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's mshta.exe remote-URL pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern — not generic usage of mshta.exe. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mshta.exe
      - OriginalFileName: MSHTA.EXE
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
        - ftp://
      condition: all of selection_*
    fields:
    - host.name
