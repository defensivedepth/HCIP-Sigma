      coverage_type: direct
    - dimension: time_correlation
      technique: T1003
      covered_by: Q9
      source: template:credential_access.post_access_lateral_movement
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1003
      covered_by: Q4
      source: template:hacking_tool.tool_capability_used
      coverage_type: direct
  mutable_dispositions:
    - element: AccessMask
      dimension: access_verification
      specific_values: "0x1F0FFF (full LSASS handle)"
      disposition: context
      target_question: Q5
      notes: "Inveigh captures NetNTLM off the wire via name-resolution poisoning; it does not open an LSASS handle, so the 0x1F0FFF access-mask criterion does not apply. Coverage reframed to which protocols/credentials were targeted."
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "rundll32, procdump, comsvcs.dll, Invoke-Mimikatz (generic LSASS-dump syntax)"
      disposition: context
      target_question: Q4
      notes: "Those are LSASS-dump syntaxes; Inveigh's command-analysis signal is its own spoofer/sniffer/reply switches. Tool_capability_used inspects the actual Inveigh flags."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (allowlist AV/EDR parents)"
      disposition: context
      target_question: Q7
      notes: "Parent legitimacy investigated via process_chain rather than an allowlist injection."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "~5 minutes between access and dump"
      disposition: context
      target_question: Q9
      notes: "Time correlation expressed via follow-on lateral-movement window (+4h) appropriate to credential reuse rather than a fixed dump-correlation window."
    - element: DumpFilePath
      dimension: tuning_parameter
      specific_values: "%TEMP%, C:\\Windows\\Temp"
      disposition: context
      target_question: Q6
      notes: "Inveigh writes capture output to its working directory (configurable prefix/dir), not LSASS dump paths; artifact question searches the tool's file-creation events instead."
  dedup_decisions:
    - dropped: cue_process_tool.baseline
      reason: "cue_process_tool.baseline_deviation (rule-pattern host baseline) is more specific — counts the rule's firing pattern on this host, not generic Inveigh.exe usage."
      kept: cue_process_tool.baseline_deviation
    - dropped: cue_host_context.clustering
      reason: "host-level 'other activity' is subsumed by cue_user_actor.clustering (network-wide actor activity) plus cue_host_context.precursor (prior alerts on host)."
      kept: cue_user_actor.clustering
    - dropped: cue_user_actor.baseline
      reason: "user_actor pair — non-deduplicable"
      kept: cue_user_actor.baseline_svc
    - dropped: cue_user_actor.clustering
      reason: "user_actor pair — non-deduplicable"
      kept: cue_user_actor.clustering_svc
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: credential_access.credential_target_identification (per brief hint)"
    - template: cue_process_tool.follow_on
      reason: "Inveigh is a long-running network listener; spawned-child analysis is low-value and child credential-use is already covered by post_access_lateral_movement."
    - template: cue_process_tool.clustering
      reason: "around-the-same-time process clustering subsumed by cue_user_actor.clustering (actor network-wide) and cue_host_context.precursor (prior alerts on host)."
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'process_access' (recommended by techniques: T1003.001) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        T1003.001's process_access analytic detects a process opening a full-access handle
        (0x1F0FFF) to lsass.exe. Inveigh is a network machine-in-the-middle tool that captures
