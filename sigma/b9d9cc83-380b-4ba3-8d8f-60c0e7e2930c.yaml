name: Suspicious PowerShell Encoded Command Patterns
id: 497a6f36-2bea-4068-85a7-bb6f0f23fc5f
description: |
  Detects powershell.exe or pwsh.exe launched with an encoded-command flag (-e, -en, -enc, -enco)
  together with a command line containing a base64 token whose leading bytes match common encoded
  PowerShell payloads (JAB..., IAB..., aWV4I..., PAA..., and similar), excluding the known
  Guest Configuration agent parent. Encoded commands are a routine packaging mechanism for
  administrative scripts, but the specific combination of an encoded flag and a recognizable
  base64 prefix is a frequent feature of malware infection chains, where the encoding hides a
  download cradle, an in-memory loader, or a reverse shell. Investigation should decode the actual
  payload, establish how PowerShell was invoked, and determine whether the user, host, and parent
  chain are consistent with legitimate scripted activity.
type: detection
detection_id: b9d9cc83-380b-4ba3-8d8f-60c0e7e2930c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match the rule — an encoded-command flag and a recognized base64 payload prefix on powershell.exe or pwsh.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when an encoded flag (-e, -en, -enc, -enco) AND a base64 token with a known leading sequence both appear on a PowerShell binary. Confirm both elements are present in the alerting event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run encoded PowerShell commands?
  context: Legitimate administrative tooling, software deployment, and configuration frameworks sometimes pass encoded commands to PowerShell. Knowing whether the user role and host function routinely involve scripted PowerShell is often the fastest way to separate a true positive from an expected operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did the encoded PowerShell command actually do? Decode every -enc payload run on this host in the surrounding window.
  context: The full command line reveals the specific action taken. This query scopes to PowerShell executions on this host carrying the same encoded-flag and base64-prefix pattern the rule fires on, within a few minutes, so a multi-stage operation that spans several invocations is captured together. Base64-decode each payload and identify what it does — a download cradle, an in-memory .NET load, a reverse shell, or credential access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_flags:
        CommandLine|contains:
          - ' -e '
          - ' -en '
          - ' -enc '
          - ' -enco'
      selection_encoded:
        CommandLine|contains:
          - ' JAB'
          - ' SUVYI'
          - ' SQBFAFgA'
          - ' aWV4I'
          - ' IAB'
          - ' PAA'
          - ' aQBlAHgA'
      condition: selection and selection_flags and selection_encoded
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated? What does it decode to?
  context: The rule fires on the -EncodedCommand (-enc) parameter carrying a base64 token. Base64-decode the argument to recover the underlying script. The recognized leading sequences map to common payload patterns — JAB and IAB decode to UTF-16LE variable assignments and IEX cradles, aWV4I and SQBFAFgA to invoke-expression strings, PAA and SUVYI to script fragments. Decoding reveals the actual payload, often a download cradle, reverse shell, or in-memory execution of a .NET assembly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Script block logging records the deobfuscated script content that PowerShell actually executes, even when the command line is encoded. This provides ground truth about what ran, bypassing the base64 layer the rule fired on. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Attackers often disable or bypass PowerShell security controls before running an encoded payload. Common techniques include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), constrained language mode escape, and downgrade attacks invoking powershell.exe v2 which lacks logging. Bypass activity preceding the encoded command strengthens the case for malicious intent.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: attack:T1059.001.image_load
  question: Did the alerting PowerShell process load .NET runtime or automation assemblies consistent with in-memory execution?
  context: Encoded PowerShell payloads frequently host .NET execution in memory rather than writing a file to disk. The CLR and PowerShell automation assemblies (clr.dll, mscoree.dll, System.Management.Automation) loaded into the process indicate the .NET-hosted execution path that an encoded loader uses. Reviewing module loads on this host confirms whether the encoded command reached an in-memory loading stage and which binary hosted it. If image_load events are not collected in this environment, treat zero results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_modules:
        ImageLoaded|contains:
          - '\clr.dll'
          - '\mscoree.dll'
          - '\System.Management.Automation'
          - '\amsi.dll'
      condition: selection and selection_modules
    fields:
      - Image
      - ImageLoaded
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. Legitimate usage often has predictable parents (explorer.exe for user actions, services.exe or a deployment agent for automation). Unusual parents like winword.exe, excel.exe, mshta.exe, or wscript.exe spawning an encoded PowerShell command point to document-borne execution or a malicious script host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell instance spawn afterward?
  context: The processes spawned after the encoded command runs reveal its actual impact. An encoded download cradle often spawns follow-on execution — cmd.exe, additional powershell.exe instances, certutil.exe, rundll32.exe, or a freshly written binary. Unexpected children indicate the decoded payload reached a post-execution stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's encoded-PowerShell pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine automation can pass encoded commands. The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern (not generic PowerShell usage) has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_flags:
        CommandLine|contains:
        - ' -e '
        - ' -en '
        - ' -enc '
        - ' -enco'
      selection_encoded:
        CommandLine|contains:
        - ' JAB'
        - ' SUVYI'
        - ' SQBFAFgA'
        - ' aWV4I'
        - ' IAB'
        - ' PAA'
        - ' aQBlAHgA'
      filter_gcworker:
        ParentImage|contains:
        - C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\
        - \gc_worker.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_flags:
        CommandLine|contains:
        - ' -e '
        - ' -en '
        - ' -enc '
        - ' -enco'
      selection_encoded:
        CommandLine|contains:
        - ' JAB'
        - ' SUVYI'
        - ' SQBFAFgA'
        - ' aWV4I'
        - ' IAB'
        - ' PAA'
        - ' aQBlAHgA'
      filter_gcworker:
        ParentImage|contains:
        - C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\
        - \gc_worker.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_flags:
        CommandLine|contains:
        - ' -e '
        - ' -en '
        - ' -enc '
        - ' -enco'
      selection_encoded:
        CommandLine|contains:
        - ' JAB'
        - ' SUVYI'
        - ' SQBFAFgA'
        - ' aWV4I'
        - ' IAB'
        - ' PAA'
        - ' aQBlAHgA'
      filter_gcworker:
        ParentImage|contains:
        - C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\
        - \gc_worker.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_flags:
        CommandLine|contains:
        - ' -e '
        - ' -en '
        - ' -enc '
        - ' -enco'
      selection_encoded:
        CommandLine|contains:
        - ' JAB'
        - ' SUVYI'
        - ' SQBFAFgA'
        - ' aWV4I'
        - ' IAB'
        - ' PAA'
        - ' aQBlAHgA'
      filter_gcworker:
        ParentImage|contains:
        - C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\
        - \gc_worker.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this encoded command and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
