name: Windows Defender Context Menu Removed
id: 31acff30-177f-4f20-b5b3-6a1f2ec506db
description: |
  Detects reg.exe or PowerShell (powershell.exe, powershell_ise.exe, pwsh.exe) deleting the Windows Defender shell
  context-menu handler registry key — the rule fires when the command-line image (or OriginalFileName) is one of those
  binaries AND the command line contains a delete verb (del, Remove-Item, ri) AND the command line references
  \shellex\ContextMenuHandlers\EPP. Removing the EPP COM handler strips the "Scan with Microsoft Defender" right-click
  option for files, folders, and drives; it is a low-noise way to suppress one user-facing Defender capability without
  touching the AV service itself, and the same registry paths appear in legitimate debloating tweaks and in attacker
  tampering scripts. Determine who ran the command and from what parent, whether the host or user normally performs this
  action, and whether other defense-tampering or registry changes accompanied it.
type: detection
detection_id: b9e8c7d6-a5f4-4e3d-8b1a-9f0c8d7e6a5b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match this rule — a reg.exe or PowerShell process deleting the \shellex\ContextMenuHandlers\EPP key?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when all three
    conditions hold together — the image (or OriginalFileName) is reg.exe / powershell.exe / powershell_ise.exe / pwsh.exe,
    the command line carries a delete verb (del, Remove-Item, or ri), and the command line references
    \shellex\ContextMenuHandlers\EPP. Confirm all three are present in the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to delete the Defender context-menu handler?
  context: Legitimate removal of this key happens through system-customization or debloating scripts and through alternate-AV
    deployment policies, but it is highly unusual on a managed corporate endpoint. Knowing whether this user's role and the
    host's function include shell-integration tuning is often the fastest way to separate a true positive from a sanctioned
    customization. Note any expected administrative tools or maintenance accounts so they can be ruled in or out.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: What exactly did the command delete — which Defender shell-integration key, and was the deletion forced or recursive?
  context: The command line reveals the precise tampering target. Confirm the deletion hits the EPP handler under a shell root
    (for example HKCR\*, Directory, Drive, Folder, or Directory\Background) and note whether reg delete used /f or PowerShell
    Remove-Item used -Recurse. Removing this COM handler only suppresses the right-click "Scan with Microsoft Defender" verb;
    the Defender service, real-time protection, and full-scan capability are unchanged, so this is a visibility-reduction
    action rather than a disable of the engine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:registry.registry_key_context
  question: What registry key and value were actually removed, and is this a known Defender shell-integration location?
  context: When reg.exe or PowerShell emits a corresponding registry event, the structured key path and value confirm the
    target without parsing the command line. The expected target is the EPP subkey (default value {09A47860-11B0-4DA5-AFA5-26D86198A780})
    under a *\shellex\ContextMenuHandlers\EPP path. A deletion reaching beyond the EPP handler — into Defender policy keys
    or service configuration — would indicate broader tampering than the rule's pattern alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:powershell.script_block_logging
  question: If PowerShell ran the deletion, did script block logging capture the full Remove-Item content?
  context: When the alerting binary is powershell.exe, powershell_ise.exe, or pwsh.exe, Event ID 4104 records the deobfuscated
    script content PowerShell actually executed — ground truth for the exact Remove-Item path and any surrounding commands,
    even if the visible command line was wrapped or split. If PowerShell operational logs are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence nothing ran, and fall back to the command line from the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:cue_process_tool.process_chain
  question: What process spawned this reg.exe or PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how the deletion was invoked. A predictable parent (explorer.exe for an interactive
    user action, a known management or deployment agent) fits sanctioned customization; an unusual parent such as a script
    host (wscript.exe, mshta.exe), an Office application, or a freshly written binary points to scripted tampering. Walk up
    the tree to see what spawned the parent and what else it launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the
    current alert fit?
  context: Even common binaries can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent/user distribution reflects how this specific EPP-deletion pattern (not generic reg.exe or PowerShell
    usage) has historically run here. A new parent process, an unexpected user account, or a one-off appearance against a
    history of zero is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell_ise.EXE
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_action:
        CommandLine|contains:
        - del
        - Remove-Item
        - 'ri '
      selection_reg_path:
        CommandLine|contains: \shellex\ContextMenuHandlers\EPP
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell_ise.EXE
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_action:
        CommandLine|contains:
        - del
        - Remove-Item
        - 'ri '
      selection_reg_path:
        CommandLine|contains: \shellex\ContextMenuHandlers\EPP
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell_ise.EXE
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_action:
        CommandLine|contains:
        - del
        - Remove-Item
        - 'ri '
      selection_reg_path:
        CommandLine|contains: \shellex\ContextMenuHandlers\EPP
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the EPP-deletion was an isolated action or part of
    broader hands-on activity. If the same user triggered similar tampering or reconnaissance on multiple endpoints in the
    same window, the scope of the operation is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell_ise.EXE
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_action:
        CommandLine|contains:
        - del
        - Remove-Item
        - 'ri '
      selection_reg_path:
        CommandLine|contains: \shellex\ContextMenuHandlers\EPP
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:defense_tampering.protection_status
  question: Is the Defender context-menu handler currently restored, or is the EPP key still missing?
  context: The deletion may be temporary or persistent. Checking the current state of the *\shellex\ContextMenuHandlers\EPP
    handler reveals whether the right-click scan option remains suppressed. Restoring it requires recreating the EPP subkey
    with the default handler value; if the key is still absent, that surface remains unavailable until it is rebuilt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the context-menu handler was removed?
  context: Shell-integration tampering is often a precursor to actions the operator wants to run with less Defender visibility.
    Examining process activity in the window immediately after the deletion reveals what the tampering may have been meant to
    enable — payload execution, credential access, or further configuration changes. Correlate with file and network events
    in the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense-tampering actions performed on this host around the same time?
  context: Operators who remove one Defender surface often disable several — stopping the AV service, flipping real-time
    protection policy keys, clearing logs, or deleting shadow copies — to maximize coverage. Finding multiple tampering events
    from the same user or parent process in a tight window indicates that several controls were targeted in one operation
    rather than an isolated customization.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session, beyond the EPP key?
  context: Operators who delete one registry key often modify several — for example removing the Defender shell handler AND
    flipping Defender policy keys AND adjusting service configuration. Finding a cluster of reg.exe or regedit write operations
    (add, delete, import) from the same user within a short window reveals the full scope of the configuration changes and
    whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    EPP-deletion pattern rather than generic reg.exe or PowerShell usage. Many hosts firing the same pattern points to a
    scripted debloating or AV-replacement rollout; one host or a small unrelated set points to manual operator activity. Use
    the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell_ise.EXE
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_action:
        CommandLine|contains:
        - del
        - Remove-Item
        - 'ri '
      selection_reg_path:
        CommandLine|contains: \shellex\ContextMenuHandlers\EPP
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or
    other defense tampering — may reveal the attack stages that preceded the context-menu removal and help reconstruct the
    timeline. A pattern of tampering followed by execution is more concerning than a lone customization event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
