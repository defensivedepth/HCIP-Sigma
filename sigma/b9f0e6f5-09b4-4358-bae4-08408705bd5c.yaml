name: New User Created Via Net.EXE With Never Expire Option
id: f4b790a0-4a0f-44f0-af60-5faee7c3d923
description: |
  Detects creation of a local user account via net.exe (or net1.exe) where the command line carries the
  "user", "add", and "expires:never" tokens together. Legitimate administrators occasionally create
  service or break-glass accounts this way, but the explicit never-expire flag is uncommon in routine
  provisioning and is a recurring marker of an operator standing up a durable foothold that outlives
  password-aging policy. Investigation should confirm the exact command, correlate it with the matching
  account-creation event, establish whether the user/host and parent process are expected to provision
  accounts, and check for surrounding persistence, privilege escalation, and reconnaissance.
type: detection
detection_id: b9f0e6f5-09b4-4358-bae4-08408705bd5c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the net.exe user-add pattern with the never-expire flag?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    full command line and image against the rule's criteria. The rule fires when net.exe or net1.exe runs
    with "user", "add", and "expires:never" all present. Confirm all three tokens are there and read the
    account name and password arguments; a trailing dollar-sign on the account name hides it from the
    default net user listing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to provision local accounts with a never-expire setting?
  context: Account provisioning is a privileged administrative action. Knowing whether the acting account
    is an administrator or a low-privilege/service context, and whether this host is one where account
    creation is normal, is often the fastest way to separate routine provisioning from an operator
    establishing access. A standard user or SYSTEM/service context creating a never-expire account is more
    suspicious than a known IT admin doing so on a management host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What was the full net.exe operation on this host, and were companion commands run alongside the user-add?
  context: net is a multi-command tool. Scoping to all net.exe and net1.exe executions on this host within
    a few minutes reveals whether the account-add was followed by group changes such as net localgroup
    Administrators add, which would elevate the new account. Read each command line for the account name,
    group membership, and any locale-specific group names.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1136.001.account_creation_correlation
  question: Was a matching local account-creation event recorded on this host within minutes of this process?
  context: The technique completes only when the OS actually creates the account; the net.exe process and
    the account-creation security event should appear within a short window (seconds to a couple of
    minutes) of each other. A process with no corresponding account-creation event may have failed or been
    blocked, while a tightly correlated pair confirms a new local account now exists. If account auditing
    is not collected in this environment, treat zero results as a visibility gap rather than evidence
    nothing was created, and confirm the account directly on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4720
      condition: selection
    fields:
      - TargetUserName
      - SubjectUserName
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned net.exe, and is that parent expected to provision accounts?
  context: The parent process reveals how the account-add was initiated. Provisioning launched from
    cmd.exe under an interactive admin session or from a known deployment agent is routine; net.exe spawned
    by a database service, a script interpreter (wscript.exe, cscript.exe, mshta.exe), or a remote-execution
    host (wmiprvse.exe, wsmprovhost.exe) points to automated post-exploitation rather than an administrator
    at a keyboard.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single net command may be legitimate, but account creation bundled with rapid reconnaissance
    -- whoami, net user/net group enumeration, nltest, systeminfo -- is a signature of hands-on enumeration
    before or after establishing access. Several distinct discovery binaries within a short window points
    to an operator mapping the environment rather than routine administration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run net.exe to create or modify accounts?
  context: Compare the acting user's current action against their historical behavior. A user who has never
    run net.exe is more suspicious than one who runs it regularly. Zero or very low counts over the window
    indicate the user does not normally use this tool; combine with knowledge of the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent process that launched net.exe historically routine for this binary on this host or environment-wide?
  context: 'When the alert fires under a service or computer account, user identity does not attribute the
    behavior. The meaningful pivot is the launch mechanism: which parent process spawned net.exe, and is
    that pair historically common. A new or rare parent for net.exe is the deviation worth chasing; a pair
    that already accounts for many prior events is likely vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or concurrent activity on
    multiple endpoints. If the same user triggered similar activity elsewhere in the same window, the scope
    of the activity may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window?
  context: Under a service or computer account, "what else did this user do" returns agent-telemetry noise
    because every host runs system-owned processes constantly. The meaningful question is whether the same
    launch mechanism -- parent process plus net.exe -- fired on other hosts in the alert window. Multiple
    hosts in the same window points to scheduled or pushed automation; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Account creation rarely happens in isolation. Earlier detections on the same host -- defense
    tampering, reconnaissance, credential access, or initial-access activity -- may reveal the attack
    stages that preceded the account-add and help reconstruct the timeline leading to the foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval to create this account?
  context: Many organizations require change tickets for account creation, especially persistent or
    privileged accounts. A corresponding ticket suggests authorized provisioning; absence of one when
    policy requires it suggests the action was unauthorized. This check can quickly close a false positive
    or escalate a true positive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: A persistent account is rarely the only foothold. Operators commonly stack backup mechanisms
    using different techniques -- scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking
    rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were other built-in account or persistence tools used on this host recently?
  context: Operators who use one living-off-the-land binary often use several toward the same goal. After
    creating an account they frequently follow with registry edits to enable RDP or weaken credential
    protection, service changes, or scheduled-task creation. Finding multiple such tools acting on
    accounts, security configuration, or persistence in the same window strengthens the case for malicious
    activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\reg.exe'
          - '\sc.exe'
          - '\schtasks.exe'
          - '\at.exe'
          - '\netsh.exe'
          - '\wmic.exe'
          - '\mofcomp.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was net.exe executed from its expected System32 path?
  context: net.exe and net1.exe running from outside System32 or SysWOW64 may indicate the binary was
    copied or renamed to evade path-based allowlists. Compare the Image path against the OriginalFileName
    so a net.exe running from a user temp or profile directory stands out as more suspicious than one in
    System32.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the net.exe never-expire user-add pattern over the past 90 days, and what command shapes are typical?
  context: A user-add-with-never-expire pattern with no prior history on a host is more suspicious than one
    seen regularly under a stable parent. The query mirrors the rule's selection structure scoped to this
    host, so the count reflects the rule's specific firing pattern rather than generic net.exe usage. The
    command-line projection lets you compare typical invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - user
        - add
        - expires:never
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
