name: Uncommon Child Processes Of SndVol.exe
id: c5f74c64-764f-4e69-ad5a-ce19b15ee2cf
description: |
  Detects when sndvol.exe (the Windows volume mixer) spawns a child process that is not the
  expected shell32.dll,Control_RunDLL invocation of rundll32.exe. SndVol.exe is an interactive
  user-facing utility that normally launches only the volume control dialog; an arbitrary child
  process under it suggests the parent has been used as a host for injected code or is being
  abused as a living-off-the-land launch point. Investigation should identify the child binary,
  confirm whether the parent is the genuine signed sndvol.exe, and determine whether the spawned
  process represents reconnaissance, discovery, or follow-on execution.
type: detection
detection_id: ba42babc-0666-4393-a4f7-ceaf5a69191e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-08'
questions:
- source: template:universal.verify_trigger_match
  question: Is the parent process sndvol.exe, and is the child something other than the benign rundll32 volume-control launch?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires
    when a process whose parent image ends in sndvol.exe spawns any child, except the known-benign
    rundll32.exe invoking shell32.dll,Control_RunDLL. Note the child Image and CommandLine, and
    verify the parent is the genuine signed volume mixer rather than a renamed binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- source: template:universal.host_user_context
  question: Is this user and host expected to have the volume mixer open and spawning child processes?
  context: SndVol.exe is an interactive utility a user opens to adjust per-application audio levels.
    On a server or an unattended kiosk it is unusual for the mixer to run at all, and it normally
    only launches the volume control dialog. Knowing whether an interactive user was present and
    whether this host is a workstation helps separate routine use from abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the child process do? Decode its full command line and arguments.
  context: The child's command line reveals the specific action taken under the volume mixer parent.
    Decode any flags, encoded content, file paths, or URLs. Discovery and reconnaissance tooling,
    script interpreters, or download utilities spawned here are far more concerning than a benign
    helper. This view covers all executions of the same child binary on the host within the window,
    which may surface sequential invocations that together form one operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_parent_process.mechanism_decode
  question: What is the sndvol.exe parent instance, and what spawned the mixer itself?
  context: Retrieve the parent's own process_creation event to see how the volume mixer was launched
    and by what. A genuine sndvol.exe is normally started by explorer.exe or the audio service in
    response to user interaction. A mixer launched by a script interpreter, an Office application,
    or an unexpected process points to the parent being abused as an injection host rather than
    used interactively.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: llm_generated
  question: Is the child binary signed, and where on disk does it live?
  context: A child of the volume mixer that is unsigned, signed by an unexpected vendor, or located
    in a user-writable directory such as a temp, downloads, or per-user AppData path is a stronger
    signal of abuse than a signed binary in a system directory. Pull the signing chain and full
    path to characterize what was launched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: template:cue_parent_process.baseline
  question: How often has sndvol.exe spawned this specific child binary on this host historically?
  context: Some parent-child pairings are routine while others are inherently unexpected. The volume
    mixer spawning anything other than the benign rundll32 control-panel launch is unusual by
    design. Zero or very low historical counts for this exact pairing indicate a novel spawning
    relationship worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_parent_process.follow_on
  question: What other child processes did this sndvol.exe instance spawn?
  context: If the mixer has been turned into a launch point, it may have spawned multiple tools in
    sequence — discovery, credential access, or follow-on execution. Listing all children of the
    same parent binary on this host reveals the full scope of activity initiated through the parent.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.clustering
  question: What other process activity surrounded this sndvol.exe instance around the same time?
  context: Beyond direct children, the parent and its host may show a cluster of related process
    activity in the same window. Reconnaissance, discovery, or staging often appear alongside the
    spawning event and help establish whether this is part of a larger sequence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run the child binary at all?
  context: A child process that has never been seen on this host is more suspicious than one that
    runs regularly. Zero or very low historical counts indicate first-time or rare execution of
    the binary, independent of which parent launched it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith: \SndVol.exe
      filter_main_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|contains: ' shell32.dll,Control_RunDLL '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith: \SndVol.exe
      filter_main_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|contains: ' shell32.dll,Control_RunDLL '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the same window can reveal lateral
    movement or activity spanning multiple endpoints. If the same user triggered similar activity
    elsewhere, the scope may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith: \SndVol.exe
      filter_main_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|contains: ' shell32.dll,Control_RunDLL '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_parent_process.scope
  question: Is the sndvol.exe-to-child spawning pattern occurring on other hosts in the environment?
  context: The same parent-child relationship appearing on multiple hosts may indicate a broader
    operation or a shared trigger such as a deployed component. A single occurrence is more likely
    targeted or host-local. An environment-wide comparison helps calibrate scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining host activity around the event reveals what
    led to it and what followed, and whether it is part of a larger sequence. Aggregating process
    activity collapses repetitive agent noise into high-count rows while novel parent-child pairs
    stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential
    access — may reveal the stages that preceded this event and help reconstruct the timeline. The
    sequence of alerts often tells the broader story of activity on the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
