name: Abusing Print Executable
id: 256eaa48-b5aa-477c-a477-baecfddb0133
description: |
  Detects use of the built-in print.exe as a proxy for copying or downloading files, a living-off-the-land technique
  that abuses a trusted signed Windows binary to move an executable while bypassing controls that watch named copy tools.
  The rule fires when print.exe runs with a command line that starts with "print", includes the /D switch, and references
  a .exe target, while excluding command lines that contain the literal string "print.exe". print.exe can copy a local
  file to another path, copy from a network or WebDAV share to a local path, or write an executable into the alternate
  data stream of another file. Investigation should determine the source and destination of the copy, whether the source
  is a remote or network location, and whether the copied executable subsequently ran.
type: detection
detection_id: bafac3d6-7de9-4dd9-8874-4a1194b493ed
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the print.exe command line start with "print", include the /D switch, and reference a .exe target?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line.
    The rule fires on print.exe whose command line starts with "print", contains both /D and .exe, and does not contain
    the literal "print.exe". Read the full command line to identify the source path and the /D destination path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to copy or transfer executables using built-in command-line utilities?
  context: Legitimate administrative activity can trigger this detection, but print.exe is rarely a deliberate file-copy
    tool for users or scripts. Knowing whether the user role and host function involve scripted file movement or printing
    workflows is often the fastest path to distinguishing routine operations from proxy-copy abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What source and destination did print.exe operate on, and is the source a local path, a network share, or a WebDAV location?
  context: The full command line reveals the operation. The /D switch names the destination; the trailing argument names the
    source. A source beginning with a UNC path or an HTTP/HTTPS URL means the executable was pulled from a remote or network
    location, which is the strongest indication of remote file copy. A destination embedding a colon inside another file name
    indicates a write into that file's alternate data stream. Scope is host plus binary over a short window so multiple sequential
    invocations are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.command_analysis
  question: Does the print.exe command line reference a UNC path, a drive letter outside the system volume, or an HTTP/HTTPS URL as the copy source?
  context: print.exe can read its source from a local file, a mapped or UNC network share, or a WebDAV endpoint reachable over
    an HTTP/HTTPS URL. A remote or network source distinguishes remote file copy from a benign local copy. This query scopes
    to print.exe executions on this host whose command line contains the network and URL markers, so the result is narrowed
    to the remote-source pattern rather than all print.exe usage.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_remote:
        CommandLine|contains:
          - '\\'
          - 'http://'
          - 'https://'
          - 'webdav'
          - '@SSL'
      condition: selection and selection_remote
    fields:
      - CommandLine
      - User
- source: attack:T1218.parent_process_analysis
  question: What process spawned print.exe, and is that parent expected to launch a printing or file-copy utility?
  context: The parent process reveals how print.exe was invoked. Interactive use is typically launched from a shell or
    explorer.exe; invocation from a script host such as wscript.exe, cscript.exe, mshta.exe, or powershell.exe, or from an
    Office application, points to scripted or macro-driven proxy execution rather than a deliberate print operation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.network_connection
  question: Did print.exe make any outbound network connections around the time of the alert?
  context: When print.exe copies from a network share or a WebDAV endpoint it opens an outbound connection to retrieve the
    source file. An outbound connection from print.exe to a remote address confirms the source was fetched over the network
    rather than copied locally. Review the destination address and port and whether the destination is an internal file
    server or an external host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: template:cue_process_tool.follow_on
  question: What child processes did print.exe spawn afterward, and did the copied executable run?
  context: The processes spawned after the copy reveal its actual impact. A copied or downloaded executable that subsequently
    executes turns a file-staging event into active code execution. Look for a new process whose image matches the destination
    path written by the /D switch, or post-copy use of cmd.exe, powershell.exe, or other staging tools.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run print.exe?
  context: print.exe is a built-in utility but is seldom executed in practice, and the proxy-copy command structure is rarer
    still. Zero or very low historical counts indicate first-time or rare execution on this host and raise the weight of the
    current alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously ran print.exe with this copy pattern, what parents and users drove it, and does the current alert fit?
  context: Even built-in tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has historically run here rather than
    generic print.exe usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \print.exe
        CommandLine|startswith: print
        CommandLine|contains|all:
        - /D
        - .exe
      filter_print:
        CommandLine|contains: print.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter_print) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \print.exe
        CommandLine|startswith: print
        CommandLine|contains|all:
        - /D
        - .exe
      filter_print:
        CommandLine|contains: print.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter_print) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \print.exe
        CommandLine|startswith: print
        CommandLine|contains|all:
        - /D
        - .exe
      filter_print:
        CommandLine|contains: print.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter_print) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on several hosts, the scope of the operation may be larger than this single
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \print.exe
        CommandLine|startswith: print
        CommandLine|contains|all:
        - /D
        - .exe
      filter_print:
        CommandLine|contains: print.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter_print) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts run this print.exe copy pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic print.exe usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \print.exe
        CommandLine|startswith: print
        CommandLine|contains|all:
        - /D
        - .exe
      filter_print:
        CommandLine|contains: print.exe
      condition: selection and not filter_print
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led
    to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, file staging,
    or follow-on execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    initial access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
