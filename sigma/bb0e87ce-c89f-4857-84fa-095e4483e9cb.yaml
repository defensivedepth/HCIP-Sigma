name: Suspicious Child Process of Notepad++ Updater - GUP.Exe
id: f7d2f4eb-2173-4e58-82c6-2c2085e24182
description: |
  Detects the Notepad++ updater process (gup.exe) spawning a child that is EITHER a command interpreter or script host
  (cmd.exe, powershell.exe, pwsh.exe, cscript.exe, wscript.exe, mshta.exe) OR any process whose command line references a
  download/transfer utility (bitsadmin, certutil, curl, finger, forfiles, regsvr32, rundll32, wget). The updater normally
  spawns only explorer.exe and signed Notepad++ installer binaries, so a shell, script host, or download-tool child indicates
  the updater fetched and executed an unexpected binary — the pattern seen when an updater's integrity/signature check is
  bypassed and a tampered update is delivered. Investigation should confirm which branch fired, decode what the child did,
  identify the binary the updater actually wrote and ran, and determine whether the host reached out to a non-approved update
  host afterward.
type: detection
detection_id: bb0e87ce-c89f-4857-84fa-095e4483e9cb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did gup.exe spawn a child matching either the interpreter list or the download-tool command line?
  context: >-
    Confirm the alert before investing time. The rule fires when the parent is gup.exe AND the child is EITHER a listed
    interpreter/script host (cmd.exe, powershell.exe, pwsh.exe, cscript.exe, wscript.exe, mshta.exe) OR a process whose
    command line contains a transfer utility name (bitsadmin, certutil, curl, finger, forfiles, regsvr32, rundll32, wget).
    Note which branch fired: the interpreter branch points to script/shell execution, the command-line branch points to a
    download or staging utility. The branch determines which downstream questions carry the most weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this host expected to run Notepad++, and is an update cycle plausible right now?
  context: >-
    The updater only runs on hosts where Notepad++ is installed, and only when it checks for or applies an update. Confirm
    Notepad++ is legitimately present on this host and that an update window is plausible (recent launch, scheduled check).
    A gup.exe child on a host that does not run Notepad++, or far outside any update activity, is harder to explain as routine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: What started gup.exe itself, and is that launch chain expected for an update check?
  context: >-
    The updater is normally launched by the Notepad++ application or by a user-initiated update check, so its grandparent
    should be notepad++.exe or an interactive shell/explorer session. A gup.exe started by an unexpected parent, or running
    detached from any Notepad++ session, suggests the update path itself was hijacked or invoked by something other than the
    application.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_parent_process.mechanism_decode
  question: What is the full command line of the child gup.exe spawned, and what does it do?
  context: >-
    The child's command line is the operational core. Decode every flag, path, URL, and encoded segment. For the interpreter
    branch, identify the script or inline command. For the download-tool branch, identify the source location and the local
    path the fetched content was written to. Expected updater children (explorer.exe, a signed npp* installer) have benign,
    recognizable command lines; a shell or transfer utility here is the anomaly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1195.002.encoded_command_decode
  question: Was the spawned command encoded or obfuscated, and what does it decode to?
  context: >-
    Download-and-execute children frequently hide intent with base64 (-EncodedCommand / -enc), string concatenation, backtick
    escaping, or variable substitution. Decoding reveals the actual payload — download cradles, reverse shells, or in-memory
    execution of .NET assemblies. A tampered updater commonly delivers a small first-stage that pulls a larger payload from a
    non-approved host, so the decoded content often names that source location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1195.002.file_write
  question: What binaries or scripts did gup.exe write to disk shortly before this child ran?
  context: >-
    In the supply-chain pattern the updater writes a fetched binary to disk and then executes it. Expected writes are signed
    npp* installer files; unexpected writes include binaries named like update.exe or AutoUpdater.exe in the user TEMP
    directory, or files dropped under per-user application-data paths. Correlating gup.exe file writes with the child process
    timestamp identifies the binary the updater actually delivered.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \gup.exe
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1195.002.module_signature
  question: What modules did the spawned child load, and were any unsigned or abnormally signed?
  context: >-
    A delivered first-stage often sideloads a malicious DLL from a renamed legitimate host binary, so the loading process may
    pull in modules from user-writable or application-data paths rather than from system directories. Unsigned or abnormally
    signed modules loaded by the child, or modules loaded from the same directory the updater just wrote to, point to
    DLL sideloading of a tampered component. If image-load events are not collected in this environment, treat zero results
    as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
- source: attack:T1195.002.egress
  question: Did this host make outbound connections to update or download hosts in the window around the child process?
  context: >-
    The updater normally retrieves updates only from its vendor's approved endpoints. First-time egress to a host outside that
    approved set, right after the updater spawned a shell or transfer utility, is the network half of the supply-chain pattern.
    Excluding known-good system processes, look for connections from gup.exe, the spawned child, or any binary the updater
    wrote, and compare the destination against the environment's allow-list of approved update endpoints.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_system:
        Image|endswith:
          - \svchost.exe
          - \System
      condition: selection and not filter_system
    fields:
      - Image
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_parent_process.follow_on
  question: What other child processes did gup.exe spawn on this host around the same time?
  context: >-
    A hijacked updater may launch several stages in sequence — a downloader, then the payload it fetched, then a
    reconnaissance command. Seeing every child of gup.exe in the surrounding window reveals whether the alerting child was
    isolated or one step of a multi-stage chain initiated through the updater.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Has gup.exe spawned this child binary on this host before?
  context: >-
    The updater's expected children are explorer.exe and signed Notepad++ installer binaries. A historical count of how often
    gup.exe has spawned this specific child binary on this host separates a routine pairing from a first-time spawn. Zero or
    very low counts for an interpreter or transfer-utility child indicate a novel and suspicious relationship.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \gup.exe
      selection_child_img:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \cscript.exe
        - \wscript.exe
        - \mshta.exe
      selection_child_cli:
        CommandLine|contains:
        - bitsadmin
        - certutil
        - curl
        - finger
        - forfiles
        - regsvr32
        - rundll32
        - wget
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \gup.exe
      selection_child_img:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \cscript.exe
        - \wscript.exe
        - \mshta.exe
      selection_child_cli:
        CommandLine|contains:
        - bitsadmin
        - certutil
        - curl
        - finger
        - forfiles
        - regsvr32
        - rundll32
        - wget
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
- source: template:initial_access.campaign_scope
  question: Did the same updater-child detection fire on other hosts?
  context: >-
    A compromised update channel delivers the tampered binary to many clients, not one. The same rule firing across multiple
    hosts indicates the update path was hijacked broadly rather than a single isolated event, and identifies the additional
    systems that received a child spawned by the updater and need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1557.network_config_change
  question: Were the host's DNS or network configuration settings altered before this alert?
  context: >-
    The supply-chain delivery in this pattern depends on intercepting and redirecting the updater's traffic to an
    attacker-controlled server. Local changes to DNS server settings, hosts-file entries, proxy configuration, or static
    routes can be how that redirection is achieved on an endpoint. Command lines that reference netsh, route, the hosts file,
    or DNS-client cmdlets in the window before the alert point to a host-side traffic-redirection step.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_netcfg:
        CommandLine|contains:
          - 'netsh interface'
          - 'netsh winhttp'
          - 'route add'
          - 'route -p add'
          - '\drivers\etc\hosts'
          - 'Set-DnsClientServerAddress'
          - 'Add-DnsClientNrptRule'
      condition: selection and selection_netcfg
    fields:
      - Image
      - CommandLine
      - User
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, defense tampering, or other
    execution alerts — may reveal the stages that preceded the updater spawning a suspicious child and help reconstruct the
    timeline of how the host was reached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
