      notes: "Correlation window expressed via the egress question's +/-30m range and the file-write +/-15m window; the chain is correlated by host + time across Q4/Q6/Q7/Q8."
    - element: ApprovedUpdateHosts
      dimension: tuning_parameter
      specific_values: "vendor update endpoints / enterprise proxy allow-list"
      disposition: context
      target_question: Q8
      notes: "Egress question directs the analyst to compare destinations against the environment's approved-update-endpoint allow-list; values are environment-specific, not hardcoded."
    - element: ApprovedSigners
      dimension: tuning_parameter
      specific_values: "code-signing publishers allowed for programs/services"
      disposition: context
      target_question: Q7
      notes: "Module-signature question asks the analyst to flag unsigned/abnormally signed modules; expected signer (Notepad++ installer signed by its vendor) described in description and Q6 context."
    - element: ProgramPaths
      dimension: tuning_parameter
      specific_values: "C:\\Program Files, C:\\ProgramData, %LOCALAPPDATA%, user TEMP"
      disposition: context
      target_question: Q6
      notes: "File-write question names user TEMP and application-data paths as the locations a tampered updater drops binaries to."
    - element: MonitoredRegistryPaths
      dimension: tuning_parameter
      specific_values: "DNS/network-stack registry keys"
      disposition: new_question
      target_question: Q14
      notes: "T1557 host-side redirection covered via a process_creation question on DNS/route/hosts-file/proxy command lines rather than registry_set; see hint_dispositions for the registry_set logsource decline."
    - element: DowngradeCipherList
      dimension: tuning_parameter
      specific_values: "weak/legacy ciphers (TLS downgrade)"
      disposition: context
      target_question: Q8
      notes: "TLS-downgrade detection is network-flow specific and out of scope for a process_creation-anchored rule; egress question covers the network-anomaly angle at the connection level."
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: "parent_process is primary cue — parent_process_legitimacy (Q3) subsumes process_chain"
      kept: template:parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.clustering
      reason: "host-time clustering subsumed by cue_parent_process.follow_on (Q9, same-parent children) and cue_host_context.precursor (Q15, host activity); avoids near-duplicate parent-scoped host query"
      kept: template:cue_parent_process.follow_on
    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc
      reason: "fleet/user clustering at alert time is covered by initial_access.campaign_scope (Q13, same-rule fleet spread) and cue_user_actor.baseline_svc (Q12, launch-mechanism env-wide); the gup pair is the meaningful pivot, not generic user network activity"
      kept: template:initial_access.campaign_scope
  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: credential_access.credential_target_identification per brief; mechanism-decode role filled by cue_parent_process.mechanism_decode (Q4) which targets the child more precisely. The credential_target_identification replacement itself is not credential-relevant to this download/staging rule — see contextual note below."
    - template: cue_process_tool.process_chain
      reason: "replaced by parent_child.parent_process_legitimacy and dropped per parent_process-primary hint"
    - template: universal.endpoint_protection_health
      reason: "RECOMMENDED generic host-tamper sweep; this rule fires on a supply-chain delivery via updater, not operator-driven payload/credential execution where AV/EDR is disabled first. cue_host_context.precursor (Q15) already surfaces any prior tamper alerts on the host."
    - template: powershell.script_block_logging
      reason: "child binary varies across the interpreter/command-line branches (cmd, cscript, wscript, mshta, curl, certutil, etc.); script-block logging only helps the powershell branch. Decode coverage is provided generically by attack:T1195.002.encoded_command_decode (Q5) across all branches."
    - template: powershell.powershell_security_bypass
      reason: "PowerShell-specific bypass sweep; the rule's OR branches are mostly non-PowerShell tools, so a powershell-only precursor question would miss most fires. Generic precursor coverage provided by cue_host_context.precursor (Q15)."
    - template: credential_access.credential_target_identification
      reason: "must_include for the credential_access set, but the rule detects updater-spawned download/staging tools, not credential-store access (LSASS/SAM/NTDS). No credential store is targeted by the detection logic; decode of the child is covered by Q4/Q5. Forcing a credential-store question would misdescribe what fired."
    - template: credential_access.credential_exposure_assessment
      reason: "depends on a credential-theft event that this rule does not detect; would prompt an AD privilege lookup with no credential-access artifact to anchor it."
    - template: data_staging_exfil.data_scope
      reason: "no archiving/collection tool (rar/7z/rclone/bcp) is in the detection; data_scope's file-event-by-archiver query has no archiver Image to scope to for this rule."
    - template: data_staging_exfil.archive_destination
      reason: "same — no archive is created by the detected children; archive-destination has nothing to follow."
    - template: data_staging_exfil.encryption_password
      reason: "same — no archiving tool or encryption flag is in scope for this rule's children."
    - template: cue_process_tool.baseline
      reason: "binary-on-host baseline subsumed by cue_parent_process.baseline (Q10), which is more specific to this rule because the parent (gup.exe) is the discriminating signal, not the child binary alone."
