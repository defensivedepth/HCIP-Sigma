name: Suspicious NTLM Authentication on the Printer Spooler Service
id: eb2b8dfb-9ec8-4ae6-b3a5-a6f5b6a4ac97
description: |
  Detects rundll32.exe (by Image or OriginalFileName RUNDLL32.EXE) invoking davclnt.dll's DavSetCookie
  export against an HTTP/HTTPS URL while referencing the spoolss or srvsvc named pipes or the /print/pipe/
  path. This pattern coerces a host into authenticating outbound over WebDAV, which an operator can relay to
  another service (commonly LDAP) to escalate toward SYSTEM or domain privileges. Legitimate use of this exact
  davclnt.dll,DavSetCookie invocation with these pipe references is rare, so the investigation should confirm
  the full command line, identify the coercion target and relay destination, establish the user and parent
  context, and check for follow-on authentication or lateral movement that would indicate a successful relay.
type: detection
detection_id: bb76d96b-821c-47cf-944b-7ce377864492
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — rundll32.exe calling davclnt.dll,DavSetCookie
    against an HTTP/HTTPS URL with a spoolss, srvsvc, or /print/pipe/ reference?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires the
    process to be rundll32.exe (by Image or OriginalFileName) AND a command line that contains both the
    davclnt.dll,DavSetCookie export and http, together with at least one of spoolss, srvsvc, or /print/pipe/.
    Read the exact command line and verify all of those elements are present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to coerce WebDAV authentication via rundll32.exe and davclnt.dll?
  context: This invocation is an offensive-tooling primitive, not a routine administrative action. Knowing
    whether the user role and host function plausibly include penetration testing, red-team operations, or
    sanctioned security tooling is often the fastest path to distinguishing an authorized test from an
    intrusion. On a standard workstation or server with no security-testing role, this pattern has no benign
    explanation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: attack:T1212.coercion_target_identification
  question: What HTTP/HTTPS URL and pipe target did the DavSetCookie call point at?
  context: The command line carries the coercion parameters. The URL following http is the WebDAV listener the
    victim will authenticate to — frequently an operator-controlled relay host or a port on the local machine.
    The spoolss, srvsvc, or /print/pipe/ reference identifies which named-pipe interface was used to trigger
    the outbound authentication. Decode the full URL and pipe path to identify the relay destination and the
    coercion vector.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: What authentication identity was coerced, and is the alerting host a domain controller or other
    high-value target?
  context: The host that runs this coercion authenticates outbound using its own machine account or the logged-on
    user's credentials. When the alerting host is a domain controller or a privileged server, the coerced
    identity can be relayed to grant domain-level access. Determine which account this host would authenticate
    as and whether that identity has elevated rights, because that defines the blast radius of a successful relay.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was rundll32.exe executed from its expected System32 or SysWOW64 path?
  context: rundll32.exe executed from outside System32 or SysWOW64 may indicate the binary was copied or
    renamed to evade path-based allowlists. The rule also matches on OriginalFileName RUNDLL32.EXE, so a
    binary renamed away from rundll32.exe can still trigger — compare Image against OriginalFileName to see
    whether the on-disk name was altered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.process_chain
  question: What process spawned this rundll32.exe and is that parent chain expected?
  context: The parent process reveals how the coercion was launched. A rundll32.exe spawned by explorer.exe or
    a shell driven by an interactive operator differs from one spawned by a scripting host, a remote-execution
    service, or a relay framework. Walk the parent chain to determine whether this was hands-on-keyboard
    activity or part of an automated tool run.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1212.replayed_authentication
  question: Did sigma alerts for abnormal authentication, ticket issuance, or service instability fire on this
    host around the same time?
  context: Exploitation for credential access is rarely visible in a single process event. Correlating
    authentication-service alerts on this host — anomalous ticket activity, replayed authentication, or
    unexpected authentication-service crashes — around the coercion event helps confirm whether the relay
    actually obtained or replayed credentials. Authentication and credential-validation telemetry lives in
    security event logs; if those logs are not ingested in this environment, treat the absence as a visibility
    gap rather than evidence nothing happened.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of a coerced-authentication relay depends on the privilege level of the identity that
    was relayed. A relayed domain controller machine account or a privileged service account enables
    domain-wide impact and requires incident escalation; a low-privilege standard account is lower severity.
    Cross-reference the host's machine account and the logged-on user against directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this coercion pattern, what parents and users normally drove it,
    and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host — the resulting parent/user
    distribution reflects how this specific firing pattern has historically run here, not generic rundll32.exe
    usage. A new parent process, an unexpected user account, or zero prior history is the anomaly worth chasing;
    a stable parent/user that already accounts for prior firings points to a recurring sanctioned test.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - C:\windows\system32\davclnt.dll,DavSetCookie
        - http
        CommandLine|contains:
        - spoolss
        - srvsvc
        - /print/pipe/
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the davclnt.dll,DavSetCookie coercion pattern over the past 90 days,
    and what command-line structures are typical?
  context: This coercion pattern with no prior history on a host is more suspicious than one that recurs under a
    stable parent — for example a recurring authorized security test. The query mirrors the rule's selection
    structure scoped to this host, so the count reflects this specific firing pattern rather than generic
    rundll32.exe usage. The CommandLine projection lets you compare prior invocation patterns against the
    alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - C:\windows\system32\davclnt.dll,DavSetCookie
        - http
        CommandLine|contains:
        - spoolss
        - srvsvc
        - /print/pipe/
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this coercion pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this specific coercion pattern, not generic rundll32.exe usage. Many hosts firing the same pattern
    points to a scripted or pushed operation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity and scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - C:\windows\system32\davclnt.dll,DavSetCookie
        - http
        CommandLine|contains:
        - spoolss
        - srvsvc
        - /print/pipe/
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - C:\windows\system32\davclnt.dll,DavSetCookie
        - http
        CommandLine|contains:
        - spoolss
        - srvsvc
        - /print/pipe/
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - C:\windows\system32\davclnt.dll,DavSetCookie
        - http
        CommandLine|contains:
        - spoolss
        - srvsvc
        - /print/pipe/
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, service
    enumeration, or other credential-access attempts — may reveal the stages that preceded this coercion and
    help reconstruct the full timeline leading up to the relay attempt.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
