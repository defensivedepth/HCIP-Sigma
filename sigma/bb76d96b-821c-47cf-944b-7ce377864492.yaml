    - template: cue_artifact.artifact_verification
      reason: "No dropped/created file artifact to hash; davclnt.dll is a signed in-box system DLL. Renamed-binary integrity of rundll32.exe itself is covered by lolbin.renamed_binary_check (Q5)."
    - template: cue_artifact.baseline
      reason: "No artifact file to baseline; davclnt.dll is a permanent system DLL present on every host. Host/fleet baselining of the firing pattern is covered by the reflected baseline_deviation / historical_lolbin_baseline / scope questions."
    - template: universal.evidence_preservation
      reason: "applicability has_file_reference is satisfied only by the system DLL path; there is no downloaded payload or decoded output file on disk to preserve. In-memory coercion leaves no file artifact."
    - template: cue_process_tool.baseline
      reason: "Generic Image-only host baseline of rundll32.exe is superseded by the reflected historical_lolbin_baseline (Q12), which counts the rule's specific coercion pattern rather than all rundll32.exe usage."
    - template: cue_process_tool.follow_on
      reason: "Children of rundll32.exe are not the relay's payoff; the meaningful follow-on is new authentication/lateral movement, covered by credential_access.post_access_lateral_movement (Q8)."
    - template: cue_process_tool.clustering
      reason: "Generic 'other tools around this time' is covered by cue_host_context.precursor (Q16) prior-alert correlation; a flat process clustering query adds noise without a distinct angle for this in-memory coercion."
    - template: cue_user_actor.clustering_svc
      reason: "Service-principal clustering substitute dropped alongside its user-pivot clustering pair to stay within the 18-question cap; cross-host scope is covered by cue_process_tool.scope (Q13) which counts the rule's specific pattern fleet-wide."
