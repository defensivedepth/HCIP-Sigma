name: Suspicious XOR Encoded PowerShell Command
id: 128a1d75-a95a-454e-912a-de3dd1d07cb4
description: |
  Detects PowerShell (powershell.exe or pwsh.exe) launched with a command line that contains the -bxor operator together with character-array, join, or loop constructs ([char], -join, ForEach, for(, ::Join). This combination is the in-memory XOR-decode pattern used to reconstruct an obfuscated payload at runtime so the readable script never appears on the command line. Legitimate scripting almost never combines a raw -bxor with character reassembly; when it fires, decode the reconstructed payload, identify what it executes (download cradle, reflective .NET assembly load, or follow-on process), and determine whether the user, host, and parent process are expected to run obfuscated PowerShell.
type: detection
detection_id: bb780e0c-16cf-4383-8383-1e5471db6cf9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — PowerShell run with -bxor plus a char/join reassembly construct?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when all three conditions hold together: the image is powershell.exe or pwsh.exe (or the PowerShell OriginalFileName/Description/Product), the command line contains bxor, AND it contains at least one of [char], -join, ForEach, for(, or ::Join. Review the exact command line and process metadata to confirm the XOR-decode pattern is present rather than an incidental substring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run obfuscated, XOR-decoded PowerShell?
  context: >-
    Legitimate administrative scripting rarely reconstructs a payload from a -bxor character loop. Knowing whether the user role and host function involve developer tooling, security testing, or known automation that emits obfuscated PowerShell is often the fastest path to separating a true positive from a sanctioned activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:powershell.encoded_command_decode
  question: What does the XOR-decoded command reconstruct to, and what operation does the decoded script perform?
  context: >-
    The -bxor loop combined with [char]/-join reassembles a hidden payload at runtime so the readable script never appears in plaintext. Manually reproduce the XOR (the byte array and key are both in the command line) to recover the actual script. Decoded content commonly resolves to a download cradle, a reverse shell, in-memory execution of a .NET assembly, or a second-stage loader. Identify the payload source and what ultimately gets executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: Across nearby PowerShell invocations on this host, what is the full XOR-decode operation — does the decode chain across more than one command?
  context: >-
    The triggering event shows one command, but a XOR loader is sometimes split across sequential PowerShell invocations (read encoded file, decode, then invoke). Scoping to PowerShell runs on this host that carry the bxor operator within a few minutes surfaces whether the decode is a single self-contained command or one step in a multi-invocation chain. The bxor and char/join filters keep this from returning every PowerShell process on a busy host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_cli_xor:
        CommandLine|contains: bxor
      selection_cli_other:
        CommandLine|contains:
          - ForEach
          - for(
          - 'for '
          - '-join '
          - -join'
          - -join"
          - -join`
          - ::Join
          - '[char]'
      condition: all of selection_*
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content?
  context: >-
    Script block logging (Event ID 4104) records the script PowerShell actually executes after deobfuscation, so it reveals the post-XOR payload even when the command line is unreadable. This is the ground-truth source for what ran. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence that nothing executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: >-
    Operators frequently disable protections before running an obfuscated payload. Common precursors include AMSI bypass (patching amsi.dll in memory), execution-policy changes (-ExecutionPolicy Bypass or -ep bypass), and PowerShell downgrade to v2 which lacks logging. Finding these in the hour before the XOR-decode execution strengthens the case for malicious activity and explains gaps in script block logging.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: >-
    The parent process reveals how PowerShell was invoked. Interactive use spawns from explorer.exe or a terminal; scheduled automation spawns from services.exe or taskeng.exe. Office applications (winword.exe, excel.exe), mshta.exe, wscript.exe, rundll32.exe, or a browser spawning PowerShell that immediately runs a XOR-decode loop points to macro-borne or download-delivered execution rather than a console session.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1059.001.image_load
  question: Did this PowerShell process load unusual or rarely seen .NET assemblies consistent with in-memory code loading?
  context: >-
    XOR-decoded PowerShell loaders often end in reflective .NET assembly loading ([Reflection.Assembly]::Load against a decoded byte array) so the payload runs from memory with no file on disk. Image-load events for this process surface the managed and native modules pulled in. A never-before-seen or oddly named assembly, or .NET runtime modules loaded into a PowerShell process that otherwise does only simple work, is the artifact that confirms in-memory execution. Compare loaded modules against what routine PowerShell on this host loads.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell instance spawn afterward?
  context: >-
    The processes a decoded payload launches reveal its real impact. A XOR loader that resolves to a download cradle or reverse shell typically spawns cmd.exe, additional powershell.exe, certutil.exe, or an unfamiliar binary dropped to a user-writable path. Benign obfuscated scripts usually terminate without spawning post-exploitation children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.evidence_preservation
  question: Are any files the decoded command references still on disk for analysis?
  context: >-
    A XOR loader frequently reads an encoded payload from a file or writes a decoded artifact (a .txt, .dat, .ps1, or .dll under a user profile or temp path) before executing it. If the referenced files are still present, they enable hash lookups, content review, and sandbox submission. Pull the file paths from the decoded command line into the scope of this query.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this XOR-decode pattern, what parents and users drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's full selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific XOR-decode pattern has run here historically — not generic PowerShell usage. A new parent process, an unexpected user account, or a first-ever appearance of the pattern on this host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Description: Windows PowerShell
      - Product: PowerShell Core 6
      selection_cli_xor:
        CommandLine|contains: bxor
      selection_cli_other:
        CommandLine|contains:
        - ForEach
        - for(
        - 'for '
        - '-join '
        - -join'
        - -join"
        - -join`
        - ::Join
        - '[char]'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Description: Windows PowerShell
      - Product: PowerShell Core 6
      selection_cli_xor:
        CommandLine|contains: bxor
      selection_cli_other:
        CommandLine|contains:
        - ForEach
        - for(
        - 'for '
        - '-join '
        - -join'
        - -join"
        - -join`
        - ::Join
        - '[char]'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Description: Windows PowerShell
      - Product: PowerShell Core 6
      selection_cli_xor:
        CommandLine|contains: bxor
      selection_cli_other:
        CommandLine|contains:
        - ForEach
        - for(
        - 'for '
        - '-join '
        - -join'
        - -join"
        - -join`
        - ::Join
        - '[char]'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar obfuscated-PowerShell activity on other hosts in the same window, the scope of the incident may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Description: Windows PowerShell
      - Product: PowerShell Core 6
      selection_cli_xor:
        CommandLine|contains: bxor
      selection_cli_other:
        CommandLine|contains:
        - ForEach
        - for(
        - 'for '
        - '-join '
        - -join'
        - -join"
        - -join`
        - ::Join
        - '[char]'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this XOR-decode pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's full selection structure with no host scope, so the result is a fleet-wide count of this XOR-decode pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or a sanctioned tool that emits obfuscated PowerShell; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Description: Windows PowerShell
      - Product: PowerShell Core 6
      selection_cli_xor:
        CommandLine|contains: bxor
      selection_cli_other:
        CommandLine|contains:
        - ForEach
        - for(
        - 'for '
        - '-join '
        - -join'
        - -join"
        - -join`
        - ::Join
        - '[char]'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the surrounding activity reveals what led to this event and what followed — reconnaissance, privilege escalation, persistence installation, or data staging. Novel parent-child pairs at low counts stand out against high-count agent-telemetry noise and are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded the XOR-decode execution and help reconstruct the timeline. Defense tampering followed by execution, or reconnaissance followed by exploitation, are the sequences to look for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
