      reason: "The 'file' the cue derived from the [A-Za-z]:\\ pattern is ntdll.dll, a known Microsoft-signed system DLL — hash/reputation lookup of the source DLL is not meaningful. Hash comparison of the OUTPUT copy is folded into cue_artifact.mechanism_decode instead."
    - template: cue_artifact.baseline
      reason: "Baselining first-appearance of ntdll.dll is meaningless — it is a permanent system file present on every Windows host. The meaningful first-appearance signal is the output copy, covered by evidence_preservation and cue_artifact.mechanism_decode."
