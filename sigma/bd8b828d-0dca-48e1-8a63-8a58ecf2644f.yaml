name: Group Membership Reconnaissance Via Whoami.EXE
id: dcc873d9-8a40-48dc-b76e-ab6388ae9560
description: |
  Detects execution of whoami.exe (matched on Image name or OriginalFileName) with a
  command line containing the /groups or -groups flag, which lists the security groups,
  account type, security identifiers (SID), and attributes for the current user. The rule
  fires when both the binary identity and the group-enumeration flag are present. This is
  a read-only discovery action (T1033): administrators and login scripts run it legitimately,
  but it is also a common early post-compromise step used to learn which privileged groups
  an account belongs to before lateral movement or privilege escalation. Investigation should
  determine who ran it, what spawned it, and whether it appears alongside other enumeration.
type: detection
detection_id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did whoami.exe run with the /groups or -groups flag, and is the binary identity genuine?
  context: Confirm the alert is a true positive before investing time. The rule fires when the
    process is whoami.exe (by Image name or OriginalFileName) AND the command line contains
    ' /groups' or ' -groups'. Review the exact command line and the OriginalFileName to confirm
    the binary is the real whoami and the group-enumeration flag is present rather than an
    unrelated substring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enumerate group membership from the command line?
  context: Network administrators, help-desk staff, and login/inventory scripts legitimately run
    whoami /groups for troubleshooting and access checks. A standard user, a service account, or
    a host with no administrative function running it is more notable. Knowing whether the user
    role and host function fit the action is often the fastest way to separate routine operations
    from post-compromise enumeration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What was the full whoami command line, and what exactly was being enumerated?
  context: The full command line reveals the precise enumeration scope. Read every flag - /groups
    or -groups lists group SIDs and attributes; combined flags like /all, /priv, or /user broaden
    the disclosure to privileges and the full access token. A formatted output flag (/fo csv,
    /fo list) or output redirection suggests the result was captured for later use. Reviewing all
    whoami invocations on this host in the window shows whether this was a one-off check or part
    of a sequence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this whoami command, and is that parent normal for it?
  context: Legitimate group-membership checks are typically run from cmd.exe or powershell.exe
    spawned by explorer.exe (a user opening a shell) or from an automation/login script. Discovery
    commands spawned by unusual parents - Office applications, wscript.exe, cscript.exe, mshta.exe,
    wmiprvse.exe (WMI remote execution), or wsmprovhost.exe (remote management) - indicate
    automated post-exploitation enumeration rather than an interactive admin action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run whoami.exe?
  context: A binary that has never been seen on a host is more notable than one that runs regularly.
    Zero or very low historical counts over the lookback window indicate first-time or rare
    execution of whoami on this host, which raises the weight of the alert; a steady prior count
    suggests routine administrative or scripted use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even common tools get abused. This query mirrors the rule's selection (whoami by Image
    or OriginalFileName AND a /groups or -groups command line) scoped to this host, so the
    parent/user distribution reflects how this specific firing pattern - not generic whoami usage -
    has historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_cli:
        CommandLine|contains:
        - ' /groups'
        - ' -groups'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this whoami invocation spawn afterward?
  context: whoami is a leaf utility - it normally spawns nothing. Children appearing under it, or
    processes the same parent launched immediately after, can reveal the next stage of an
    operation (a shell, a download utility like certutil.exe, or further enumeration). Unexpected
    descendants shift the read from a benign one-off check toward scripted activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single group-membership check may be legitimate troubleshooting, but multiple
    reconnaissance commands in rapid succession - whoami, systeminfo, net user, nltest, ipconfig -
    is a signature pattern of post-compromise enumeration. Three or more different recon binaries
    within fifteen minutes typically indicates an actor mapping their context before the next
    attack stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_cli:
        CommandLine|contains:
        - ' /groups'
        - ' -groups'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_cli:
        CommandLine|contains:
        - ' /groups'
        - ' -groups'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the surrounding window reveals lateral
    movement or activity spanning multiple endpoints. If the same user triggered similar
    enumeration on several hosts, the scope of the activity - and any potential compromise - may
    be larger than this single alert suggests.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_cli:
        CommandLine|contains:
        - ' /groups'
        - ' -groups'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection (whoami by Image or OriginalFileName AND a
    /groups or -groups command line) with no host scope, giving a fleet-wide count of this firing
    pattern rather than generic whoami usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_cli:
        CommandLine|contains:
        - ' /groups'
        - ' -groups'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding this event reveals
    what led to it and what followed, and whether the enumeration is part of a larger sequence.
    Look for privilege escalation, persistence installation, or credential access that frames the
    group-membership check.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense
    tampering, initial access, or other reconnaissance - may reveal the attack stages that
    preceded this enumeration and help reconstruct the timeline. A discovery command following an
    earlier execution or access alert reads very differently from one with no preceding activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
