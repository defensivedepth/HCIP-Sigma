name: PowerShell Script Change Permission Via Set-Acl
id: 6d074da1-4c7e-43e2-aa39-97f0c3bb37d2
description: |
  Detects PowerShell invoking the Set-Acl cmdlet with an -AclObject and a -Path argument, which rewrites the
  security descriptor (owner, DACL, SACL) of a file, folder, registry key, or other provider item. The rule fires
  when the process is powershell.exe or pwsh.exe AND the command line contains "Set-Acl", "-AclObject", and "-Path".
  Legitimate administration copies an ACL from one item to another or tightens permissions; the same cmdlet is the
  canonical primitive for granting broad SIDs (Everyone, Authenticated Users, BUILTIN\Users) full control over a
  write-anywhere location, or rewriting the DACL of a Run key or service directory for persistence. Determine which
  path was retargeted, what access was granted to whom, and whether the user, host, and launch chain make this a
  routine administrative change or an attacker loosening permissions on a sensitive object.
type: detection
detection_id: bdeb2cff-af74-4094-8426-724dc937f20a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the Set-Acl pattern this rule detects?
  context: >-
    Confirm the alert is a true positive before investing investigation time. The rule fires only when the process
    is powershell.exe or pwsh.exe AND the command line contains Set-Acl, -AclObject, and -Path together. Review the
    full command line and verify all three tokens are present and that this is an actual permission change rather
    than a benign string match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to change file, folder, or registry permissions with PowerShell?
  context: >-
    Legitimate administration sometimes uses Set-Acl to copy or tighten permissions, but most users and most hosts
    never run it. Knowing whether the account is an administrator or automation identity, and whether the host is a
    server where permission changes are routine, is often the fastest way to separate sanctioned maintenance from an
    operator loosening access on a sensitive object.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did this Set-Acl call actually change? Identify the target path and the access being granted.
  context: >-
    The full command line reveals which item was retargeted and what permission was applied. Identify the -Path or
    -LiteralPath value and the contents of the -AclObject. High-signal patterns include granting Everyone,
    Authenticated Users, or BUILTIN\Users FullControl, and rewriting the DACL of a Run key, a service binary
    directory, or a registry hive. The AclObject is usually built or copied just before the call, so review the
    surrounding Set-Acl invocations on this host, not only the alerting line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - 'Set-Acl '
          - '-AclObject '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does it decode to?
  context: >-
    Set-Acl arguments are sometimes hidden behind PowerShell's -EncodedCommand (-enc) parameter, string
    concatenation, backtick escaping, or variable substitution so the target path and granted access are not visible
    in plain text. Decode any base64 payload and resolve concatenated strings to recover the literal path and the
    AclObject being applied, which is what determines whether this is a benign change or a write-anywhere grant.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full Set-Acl script content?
  context: >-
    Script block logging records the deobfuscated script content PowerShell actually executed, including how the
    AclObject was constructed and which AccessRule was added, even when the command line is encoded. This is ground
    truth for what permission change ran. If PowerShell operational logs are not ingested in this environment, treat
    zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this permission change?
  context: >-
    Operators frequently disable or bypass PowerShell and endpoint controls before a hands-on action such as
    rewriting an ACL. Common precursors include AMSI bypass, execution-policy changes, Defender real-time monitoring
    being turned off, and PowerShell version 2 downgrade to evade logging. Finding these events in the hour before
    the Set-Acl call strengthens the case that the permission change is part of an intrusion.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: >-
    The parent process shows how PowerShell was invoked. Interactive administration is typically launched from
    explorer.exe or a console host, and automation from services.exe or a task scheduler. Parents such as
    mshta.exe, wscript.exe, an Office application, or a web server worker indicate the permission change may have
    originated from exploitation or a malicious script rather than a sanctioned admin session.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell permission-change activity?
  context: >-
    Compare this account's current action against its historical behavior across the environment. A user who has
    never run powershell.exe, or never used it to change ACLs, is more suspicious than one who does so regularly as
    part of an administrative role. Low or zero historical counts indicate first-time or rare use that should align
    with the user's expected duties.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent unusual for PowerShell?
  context: >-
    When the alert fires under a service principal such as SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer
    account, user identity does not attribute the behavior. The meaningful pivot is the launch mechanism, which
    parent process spawned PowerShell and whether that pair is historically common. A new or rare parent for this
    binary is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or
    operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the surrounding window reveals whether the permission change
    is isolated or part of broader hands-on activity. The same user touching multiple endpoints, or running
    reconnaissance and credential-access tooling alongside the ACL change, widens the likely scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did network-wide returns agent-telemetry noise because every
    host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism, parent
    process plus spawned PowerShell, fired on other hosts in the alert window. Multiple hosts in the same window
    points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Permission changes rarely occur in isolation. Examining the surrounding process activity on this host reveals
    what led to the Set-Acl call and what followed it, and whether reconnaissance, privilege escalation, or
    persistence installation accompanied the ACL change. Novel parent-child pairs at low counts stand out against
    high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.baseline
  question: Does this host normally run powershell.exe?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    counts over the trailing window indicate first-time or rare execution of PowerShell on this host, which raises
    the priority of the permission change. PowerShell is common on workstations, so calibrate this against the host
    role rather than treating any presence as benign.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the Set-Acl pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even routine tooling can be abused. The query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how the Set-Acl firing pattern, not generic PowerShell usage, has
    historically run here. A new parent process, an unexpected user account, or an unusual command-line shape is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      selection_cmdlet:
        CommandLine|contains|all:
        - 'Set-Acl '
        - '-AclObject '
        - '-Path '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell instance spawn afterward?
  context: >-
    The processes spawned by PowerShell after the permission change reveal its actual impact. A benign ACL copy
    typically spawns nothing; follow-on cmd.exe, powershell.exe, certutil.exe, or service-control activity suggests
    the loosened permissions were immediately used to write, persist, or execute from the retargeted location.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the Set-Acl pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the Set-Acl
    firing pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation that changes permissions as part of setup; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      selection_cmdlet:
        CommandLine|contains|all:
        - 'Set-Acl '
        - '-AclObject '
        - '-Path '
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Permission changes rarely happen in isolation. Earlier detections on the same host, such as defense tampering,
    reconnaissance, or credential access, may reveal the attack stages that preceded the ACL change and help
    reconstruct the timeline. The sequence of alerts on a host often tells the story of how the operator reached the
    point of rewriting permissions.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
