name: PUA - Wsudo Suspicious Execution
id: 9e01ba39-81d3-4a11-a41a-abd56f82df44
description: |
  Detects execution of wsudo, the console component of the Privexec utility suite that launches a target program at a chosen Windows permission level (System, TrustedInstaller, Administrator, and others). The rule fires when EITHER the process metadata matches wsudo (image name, OriginalFileName, Description, or a wsudo-bridge.exe parent) OR the command line requests an elevated identity (-u System, -u TrustedInstaller, or --ti). Legitimate use is rare and tied to local administration or development; the same SYSTEM/TrustedInstaller spawn primitive is routinely abused to run payloads with maximum privilege, so determine what identity was requested, what child program was launched, and whether the user, host, and parent chain account for the elevation.
type: detection
detection_id: bdeeabc9-ff2a-4a51-be59-bb253aac7891
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Did this event match wsudo metadata, an elevated-identity command-line flag, or both?
  context: >-
    The rule fires when EITHER the process metadata identifies wsudo (Image ending in wsudo.exe, OriginalFileName wsudo.exe,
    Description "Windows sudo utility", or a wsudo-bridge.exe parent) OR the command line requests an elevated target
    identity (-u System, -uSystem, -u TrustedInstaller, -uTrustedInstaller, or --ti). Note which branch fired, because it
    changes what the rest of the investigation weighs. A metadata-only match means wsudo ran without one of the listed
    elevation flags (the identity may still be set via the short flags -S/-T/-A); a command-line match means an elevated
    identity was explicitly requested even if the binary was renamed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run a privilege-elevation tool like wsudo?
  context: >-
    Legitimate wsudo use is narrow and usually belongs to a developer or administrator doing local elevation. If the user
    role or host function does not involve launching programs as System or TrustedInstaller, the execution is harder to
    explain as routine and shifts the disposition toward unauthorized elevation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What identity and child program did wsudo request? Decode the full command line.
  context: >-
    The full command line reveals which privilege level was requested and what program was launched at that level. The
    identity may be set with -u System or -u TrustedInstaller, with the short flags -S (System), -T (TrustedInstaller),
    or -A (Administrator), or hidden behind --ti. Auxiliary flags change the operation as well, "--disable-alias" bypasses
    the Privexec.json alias table and "-e KEY=VALUE" sets environment variables that Windows expands at launch. A renamed
    alias target can disguise the actual launched program, so resolve the target rather than trusting the alias name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: Is wsudo-bridge.exe expected to spawn this process, and what started the bridge itself?
  context: >-
    The parent-child relationship is a core signal here. wsudo-bridge.exe is the helper that brokers the elevated launch,
    so trace the bridge's own origin (the grandparent process) to see whether the chain began with a deliberate user
    action or with an unexpected parent such as a script host, an Office application, or a service. An elevation broker
    started by an automated or scripted parent is more concerning than one launched from an interactive shell.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn around this time?
  context: >-
    If the parent that launched wsudo also spawned other processes, those siblings reveal the broader scope of activity
    from that parent. Multiple elevated launches or a sequence of tooling from the same parent points toward orchestrated
    activity rather than a one-off elevation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Does wsudo-bridge.exe normally spawn this binary on this host?
  context: >-
    Some parent-child pairings are routine and some are novel. Historical frequency of this specific bridge-to-child
    pairing on this host separates an established workflow from a first-time spawning relationship. Zero or very low counts
    indicate the pairing is new and worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has wsudo run on this host before, and how often?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low counts
    over the baseline window indicate first-time or rare execution of this elevation tool on this host, which raises the
    priority of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith: \wsudo.exe
      - OriginalFileName: wsudo.exe
      - Description: Windows sudo utility
      - ParentImage|endswith: \wsudo-bridge.exe
      selection_cli:
        CommandLine|contains:
        - -u System
        - -uSystem
        - -u TrustedInstaller
        - -uTrustedInstaller
        - ' --ti '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith: \wsudo.exe
      - OriginalFileName: wsudo.exe
      - Description: Windows sudo utility
      - ParentImage|endswith: \wsudo-bridge.exe
      selection_cli:
        CommandLine|contains:
        - -u System
        - -uSystem
        - -u TrustedInstaller
        - -uTrustedInstaller
        - ' --ti '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar elevation activity on more than one host, the scope of the
    activity is larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith: \wsudo.exe
      - OriginalFileName: wsudo.exe
      - Description: Windows sudo utility
      - ParentImage|endswith: \wsudo-bridge.exe
      selection_cli:
        CommandLine|contains:
        - -u System
        - -uSystem
        - -u TrustedInstaller
        - -uTrustedInstaller
        - ' --ti '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:remote_access_tool.tool_authorization
  question: Is wsudo approved for use in this environment?
  context: >-
    Organizations typically maintain a list of sanctioned administrative and elevation tools. wsudo is part of the
    Privexec suite and is not commonly an approved IT tool; its presence may represent shadow IT or attacker-staged
    tooling regardless of the binary's reputation. Check whether it is authorized on this host independent of how the
    execution looks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a change ticket, maintenance window, or support session explaining this elevation?
  context: >-
    Legitimate use of an elevation tool usually correlates with an active support ticket, a scheduled maintenance window,
    or a documented administrative task. If no such context exists for this execution, the tool may have been staged for
    privileged access rather than sanctioned administration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: Did wsudo or its elevated child make outbound network connections, and to where?
  context: >-
    wsudo launches a target program at an elevated identity, and that elevated child can reach out to external
    infrastructure. Outbound connections tied to this execution reveal whether the elevated program is pulling additional
    tooling or communicating with a remote endpoint. Destinations outside expected internal or vendor infrastructure
    raise the priority of the alert.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_host_context.clustering
  question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to the elevation and
    what followed it, and whether it is part of a larger sequence. Aggregating by image and parent collapses repetitive
    agent telemetry into single rows so that novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the
    stages that preceded this elevation and help reconstruct the timeline. Privilege escalation often follows initial
    access and precedes hands-on-keyboard activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    Tampering often precedes privileged execution. This query surfaces direct attempts to disable AV/EDR services, flip
    Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy"
    signal; populated rows shift the disposition toward operator preparation, so review the parent process and signing
    chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
