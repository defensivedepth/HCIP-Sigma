      disposition: context
      target_question: Q6
      notes: "Correlate registry set-value and elevated execution within a short window; Q6 (registry_set, -15m) and Q7 (elevated action, +30m) bracket the alert. Threshold is a tuning rationale, not directly queryable."
    - element: ElevatedProcessNameList
      dimension: tuning_parameter
      specific_values: "eventvwr.exe, sdclt.exe, computerdefaults.exe"
      disposition: context
      target_question: Q5
      notes: "Rule already constrains the auto-elevated binary to eventvwr.exe; the bypass-setup registry filters in Q5 carry the mscfile/ms-settings key list for the eventvwr path. Sibling auto-elevate binaries are out of this rule's scope."
    - element: ParentProcessAnomalyThreshold
      dimension: parent_process_analysis
      specific_values: "rationale only (non-elevated process spawning auto-elevated one)"
      disposition: context
