      notes: "Q4 surfaces what launched eventvwr.exe so the analyst can judge whether the parent-child elevation path is anomalous."
    - element: ElevatedProcessPath
      dimension: tuning_parameter
      specific_values: "rationale only (paths of unsigned/unexpected elevated binaries)"
      disposition: context
      target_question: Q7
      notes: "Q7 lists High/System integrity processes with Image so unexpected elevated binary paths surface."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (suspicious parent-child chains)"
      disposition: context
      target_question: Q9
      notes: "Q9 baselines the eventvwr.exe to child pairing historically on this host."
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: "parent_process is primary cue and ParentImage is the rule's detection field; the parent chain is covered by Q4 (cue_parent_process.mechanism_decode). Per hint, drop process_tool:process_chain."
      kept: cue_parent_process.mechanism_decode
    - dropped: cue_user_actor.baseline / cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable"
      kept: both (Q12, Q13)
    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable"
      kept: both (Q14, Q15)
  skipped_templates:
    - template: cue_parent_process.clustering
      reason: "Other-activity-from-this-parent angle is already covered by Q10 (cue_parent_process.follow_on, all children of eventvwr.exe) and Q17 (cue_host_context.clustering, host-wide activity around the alert). Adding it would duplicate that coverage."
    - template: universal.endpoint_protection_health
      reason: "Recommended, not must_include. Prior-tamper-as-precursor context is already carried by Q18 (cue_host_context.precursor) and Q8 (uac_bypass.other_escalation_attempts, prior sigma alerts on the host). This rule fires on a privilege-escalation parent-child pattern, not on payload execution or credential access, so the dedicated tamper sweep is not load-bearing here."
  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1548.002) is not covered — pull in cue_image_load.* or author a custom question with category: image_load"
      disposition: declined
      reason: >-
        This rule detects the eventvwr.exe mscfile registry-hijack bypass, which is fileless by construction — it requires no
        DLL drop and no module-load side effect (the reference describes execution without dropping any file to disk and with
        no DLL hijack). image_load coverage targets DLL-search-order and side-loading bypass families, which are a different
        T1548.002 sub-pattern not in scope for this parent-child rule. No compensating attack:T1548.002.image_load question authored.
    - hint: "logsource 'process_access' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with category: process_access"
      disposition: declined
      reason: >-
        process_access (handle-access events) is the evidence for token-theft and potato-style UAC bypasses, where one process
        opens a handle into another to steal an elevated token. The eventvwr.exe registry-hijack path this rule detects gains
        integrity through the auto-elevate manifest, not through cross-process handle access, so process_access returns no
        bypass-relevant signal here. No compensating attack:T1548.002.process_access question authored.
    - hint: "logsource 'security' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with category: security"
      disposition: declined
      reason: >-
        The security-channel evidence for this bypass is privilege assignment at the elevated child (4672/4688), which is the
        same elevation signal already surfaced by Q7 (uac_bypass.elevated_action_after_bypass) via the IntegrityLevel High/System
        filter on process_creation. A separate security-logsource question would re-ask the same elevation question against a
        log channel this environment may not collect, adding no distinct investigative step.
