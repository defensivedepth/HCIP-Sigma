- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Log reconnaissance often follows earlier stages. Detections on this host in the prior hours — initial
    execution, defense tampering, or credential access — may reveal how the operator arrived and help place
    the log query in the broader timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
