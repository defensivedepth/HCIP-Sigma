name: Potentially Suspicious EventLog Recon Activity Using Log Query Utilities
id: 0a3c5a1a-c3d6-4c25-81fa-f92ff5696f33
description: |
  Detects log query utilities (wevtutil, wmic, PowerShell Get-WinEvent / Get-EventLog, or a WMI
  Win32_NTLogEvent query) being run with a command line that targets a specific event-log channel or a
  specific security/RDP event ID. The rule fires when a log-query mechanism is present AND the command line
  references either a named log channel (Security, PowerShell, Windows Defender, TerminalServices) or a
  watched event ID (the 4624/4625 logon family, 4778, RDP 21/22/25, 1149). Administrators legitimately query
  event logs for troubleshooting and auditing; the same utilities are also used to mine logs for logon
  history, account names, source addresses, and RDP session data that inform credential access and account
  discovery. Determine which channel/event was queried, what account and session intelligence it would
  expose, and whether the user and parent chain make this an expected administrative action.
type: detection
detection_id: beaa66d6-aa1b-4e3c-80f5-e0145369bfaf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — a log-query utility targeting a named log channel or a specific event ID?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when EITHER a named log
    channel (Security, Microsoft-Windows-PowerShell, Windows Defender, TerminalServices) OR a watched event
    ID is referenced, AND that reference is paired with a query mechanism (wevtutil qe/query-events, wmic
    ntevent, a Win32_NTLogEvent WMI Select, or PowerShell Get-WinEvent/Get-EventLog). Read the command line
    and note which utility ran and which channel or event ID it asked for — the watched IDs map to logon and
    session activity (the 4624/4625 logon family, 4778 session reconnect, RDP 21/22/25 and 1149), so the
    branch that fired tells you what the operator was after.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to query event logs this way?
  context: >-
    Legitimate troubleshooting and auditing produce the same command lines. Knowing whether the account is an
    administrator or service that routinely inspects logs on this host — versus a standard user or an
    unexpected account — is often the fastest way to separate routine operations from reconnaissance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Which log channel and event IDs were queried, and what account or session intelligence would they expose?
  context: >-
    Parse the full command line and identify the exact channel and event IDs requested. The watched IDs are
    high-value for an operator mapping the environment: 4624 (successful logon) and 4625 (failed logon) reveal
    valid account names and source addresses; 4778 (session reconnected) and the TerminalServices IDs 21/22/25
    and 1149 reveal RDP sessions, originating hosts, and which accounts log in interactively. Determine what
    an attacker would learn about credentials, privileged accounts, and remote-access patterns from the
    specific events that were pulled.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1552.process_identification
  question: Is the log-query binary the genuine signed Windows utility, or a renamed copy?
  context: >-
    Operators rename system binaries (for example a copy of wevtutil.exe or wmic.exe under another name) to
    evade command-line and image-name detection. Compare the Image name against OriginalFileName, check the
    on-disk path and signature, and confirm the binary is the legitimate Microsoft-signed utility in
    System32. A mismatch between the running name and the original filename, or an unsigned copy in a
    user-writable directory, changes the disposition from routine administration toward deliberate evasion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this log-query command, and is that parent chain expected?
  context: >-
    The parent process shows how the query was launched. Interactive administration typically descends from
    explorer.exe or a console the admin opened; log queries spawned by a script host, an Office application, a
    remote-execution service, or an unexpected automation chain point to operator-driven activity rather than
    a human troubleshooting. Examine the parent image and its command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    Log enumeration rarely stands alone. A short window containing host, network, and account discovery
    utilities — whoami, net, nltest, systeminfo, ipconfig, tasklist, query/quser, dsquery, adfind — alongside
    the log query indicates a deliberate enumeration burst rather than a one-off administrative lookup. A tight
    cluster of these from the same user or parent is a strong shift toward operator-driven discovery.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts and sessions could be exposed by the queried events, and do any have elevated privileges?
  context: >-
    From the channel and event IDs that were pulled, enumerate the accounts, source hosts, and RDP sessions
    that the returned records would expose, then assess privilege. Logon-event mining surfaces which accounts
    authenticate to this host and from where; if any are domain admins, service accounts, or accounts with
    broad access, treat those identities as candidates for follow-on use and prioritize them for monitoring or
    rotation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:universal.evidence_preservation
  question: Was the query output redirected to a file that is still on disk for analysis?
  context: >-
    Log-query output is often redirected to a text or archive file for staging and later exfiltration. If the
    command line references an output path, checking whether that file still exists enables content review,
    hashing, and recovery of exactly what the operator collected.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this log-query pattern, what parents and users normally drive it, and does this alert fit?
  context: >-
    Even routine tools have a normal footprint. This query mirrors the rule's selection scoped to this host,
    so the resulting parent and user distribution reflects how this specific log-recon pattern has historically
    run here — not generic wevtutil/wmic usage. A new parent process, an unexpected account, or a command-line
    pattern that does not match the established pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wmi:
        CommandLine|contains|all:
        - Select
        - Win32_NTLogEvent
      selection_wevtutil_img:
      - Image|endswith: \wevtutil.exe
      - OriginalFileName: wevtutil.exe
      selection_wevtutil_cli:
        CommandLine|contains:
        - ' qe '
        - ' query-events '
      selection_wmic_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_wmic_cli:
        CommandLine|contains: ' ntevent'
      selection_cmdlet:
        CommandLine|contains:
        - 'Get-WinEvent '
        - 'get-eventlog '
      selection_logs_name:
        CommandLine|contains:
        - Microsoft-Windows-PowerShell
        - Microsoft-Windows-Security-Auditing
        - Microsoft-Windows-TerminalServices-LocalSessionManager
        - Microsoft-Windows-TerminalServices-RemoteConnectionManager
        - Microsoft-Windows-Windows Defender
        - PowerShellCore
        - Security
        - Windows PowerShell
      selection_logs_eid:
        CommandLine|contains:
        - -InstanceId 462?
        - .eventid -eq 462?
        - .ID -eq 462?
        - EventCode=?462?
        - EventIdentifier=?462?
        - System[EventID=462?]
        - -InstanceId 4778
        - .eventid -eq 4778
        - .ID -eq 4778
        - EventCode=?4778?
        - EventIdentifier=?4778?
        - System[EventID=4778]
        - -InstanceId 25
        - .eventid -eq 25
        - .ID -eq 25
        - EventCode=?25?
        - EventIdentifier=?25?
        - System[EventID=25]
        - -InstanceId 1149
        - .eventid -eq 1149
        - .ID -eq 1149
        - EventCode=?1149?
        - EventIdentifier=?1149?
        - System[EventID=1149]
        - -InstanceId 21
        - .eventid -eq 21
        - .ID -eq 21
        - EventCode=?21?
        - EventIdentifier=?21?
        - System[EventID=21]
        - -InstanceId 22
        - .eventid -eq 22
        - .ID -eq 22
        - EventCode=?22?
        - EventIdentifier=?22?
        - System[EventID=22]
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_logs_* and (selection_wmi or all of selection_wevtutil_* or all of selection_wmic_* or selection_cmdlet)) and _pb_scope
    fields:
    - ParentImage
    - User
