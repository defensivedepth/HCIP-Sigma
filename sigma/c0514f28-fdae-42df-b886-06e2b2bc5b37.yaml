name: Service Startup Type Change Via Wmic.EXE
id: 6140ca8b-b933-4e10-a4c4-e00f1364c3bd
description: |
  Detects use of the WMIC command-line utility to change a service's startup type to 'Manual' or 'Disabled' (a wmic service ... call ChangeStartMode invocation). The rule fires only when both the WMIC binary (by Image name or OriginalFileName) and a command line containing ' service ', ChangeStartMode, and one of Manual/Disabled are present. Changing a service start mode is a routine administrative action, but disabling or de-automating recovery and backup services (for example the Volume Shadow Copy service) is a common precursor to ransomware impact, where attackers inhibit recovery before mass encryption. Determine which service was reconfigured, whether the operator is authorized to make that change, and whether the action sits alongside other defense-tampering or impact activity on the host.
type: detection
detection_id: c0514f28-fdae-42df-b886-06e2b2bc5b37
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show wmic changing a service start mode to Manual or Disabled?
  context: Confirm the alert is a true match before investing further time. The triggering process should be WMIC (by Image name or OriginalFileName) and its command line should contain ' service ', ChangeStartMode, and either Manual or Disabled. Read the full command line to identify the exact service name targeted (often supplied via a where name='...' clause).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to reconfigure service startup types with wmic?
  context: Service start-mode changes are legitimate administrative actions on servers and managed endpoints, but they are unusual coming from a standard user workstation or an account with no operations role. Knowing whether the account and host normally perform service management is often the fastest way to separate a true positive from routine maintenance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which specific service was reconfigured, and to what start mode?
  context: Different targets carry very different impact. Setting the Volume Shadow Copy service (VSS) to Manual or Disabled inhibits ransomware recovery; disabling an AV/EDR or logging service removes protection or evidence; de-automating an application service may simply be maintenance. Parse the where clause and the ChangeStartMode argument to identify the exact service name and the new start mode, then judge investigation priority from there.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this wmic invocation, and is that parent chain expected?
  context: The parent process shows how wmic was launched. A service reconfiguration driven by an interactive admin shell or a management agent is routine; one spawned by cmd.exe running a one-off batch, by a script host, or by an unfamiliar binary is more consistent with hands-on-keyboard operator activity. Walk up to the parent's own parent if the immediate parent is itself a generic shell.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is the reconfigured service currently running, or does it remain disabled or set to manual start?
  context: The start-mode change may have been temporary or may still be in effect. If a recovery, backup, or security service remains Disabled or Manual, the host is still in the weakened state the change created and the service should be restored before further investigation. Verify the current start mode and running state directly on the host or via endpoint management.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the service start mode was changed?
  context: De-automating recovery or security services is usually done to enable a follow-on action that would otherwise be blocked or recoverable. Examine process activity in the hour after the change for shadow-copy deletion, backup tampering, mass file modification, or payload execution. A burst of activity immediately after the reconfiguration points to what the change was meant to enable.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense-tampering or recovery-inhibition actions performed on this host?
  context: Operators who disable one control often disable several in the same operation - stopping or deleting services, clearing event logs, deleting shadow copies, and disabling recovery. Finding multiple tampering events from the same account or parent process in a tight window indicates a coordinated effort to weaken the host rather than an isolated maintenance change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run the wmic service start-mode change pattern, what parents and users drove it, and does this alert fit?
  context: Even legitimate tools get abused. The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how this specific firing pattern has historically run here rather than generic wmic usage. A new parent process, an unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service '
        - ChangeStartMode
        CommandLine|contains:
        - Manual
        - Disabled
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.renamed_binary_check
  question: Was wmic executed from its expected System32 or SysWOW64 path?
  context: WMIC running from outside System32 or SysWOW64 - for example from a user temp directory, a download folder, or another user-writable location - suggests the binary was copied or renamed to evade path-based allowlists. A wmic.exe in its standard system path is ordinary; one elsewhere is more suspicious. Compare the Image path against OriginalFileName, since a renamed copy still reports wmic.exe as its original name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host run the wmic service start-mode change pattern over the past 90 days, and what command-line structures are typical?
  context: A start-mode change pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern rather than generic wmic usage. The command-line projection lets the analyst compare typical service targets and invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service '
        - ChangeStartMode
        CommandLine|contains:
        - Manual
        - Disabled
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.technique_class_lateral
  question: Were other proxy-execution or recovery-tampering LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary usually use several. Alongside a wmic service change, look for vssadmin or diskshadow deleting shadow copies, bcdedit disabling recovery, sc reconfiguring services, or other proxy-execution binaries. Finding multiple such tools performing complementary actions strengthens the case for a coordinated operation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\sc.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reg.exe'
          - '\netsh.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: attack:T1047.remote_wmi_connection
  question: Did this host make or receive WMI-related network connections around the time of the alert?
  context: WMIC can act locally or against a remote host. Remote WMI execution rides DCOM/RPC on TCP 135 followed by a dynamically negotiated high port, and inbound activity of that pattern near the alert time suggests the start-mode change was driven remotely rather than from the console. Correlate the connection timing and remote address with the wmic invocation to determine whether this was local administration or remote-operator activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\WmiPrvSE.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service '
        - ChangeStartMode
        CommandLine|contains:
        - Manual
        - Disabled
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service '
        - ChangeStartMode
        CommandLine|contains:
        - Manual
        - Disabled
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts in the alert window reveals whether the service change is isolated or part of broader movement. The same user reconfiguring services or running tools on multiple endpoints points to a wider scope than a single-host maintenance action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service '
        - ChangeStartMode
        CommandLine|contains:
        - Manual
        - Disabled
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - credential access, reconnaissance, or other defense tampering - may reveal the attack stages that preceded this service change and help reconstruct the timeline, especially the pattern where defenses are weakened before impact.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
