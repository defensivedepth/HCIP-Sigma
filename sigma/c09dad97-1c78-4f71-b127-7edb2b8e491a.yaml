name: Execution of Suspicious File Type Extension
id: d2e6b8ec-5457-4c62-973f-27a91008bcfd
description: |
  Detects a process whose Image path does not end in a recognized executable
  extension (.bin, .cgi, .com, .exe, .scr, .tmp) and does not match a known
  benign exception (installer, driver store, WSL, vendor paths, etc.). A
  process with no backing executable file or an unusual image extension can
  result from process ghosting or other image-tampering methods that create a
  process from a file deleted or disguised before inspection occurs, but it can
  also reflect legitimate third-party tooling that has not yet been baselined.
  The investigation should confirm what image launched, whether a real file
  backs it on disk, how it was spawned, and whether the host or environment has
  seen this pattern before.
type: detection
detection_id: c09dad97-1c78-4f71-b127-7edb2b8e491a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process image have an extension or path that matches what this rule flags?
  context: >-
    Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the Image path does not end in a known executable
    extension and is not on the benign-exception list. Review the exact Image
    value and process details to confirm the image extension or path is genuinely
    anomalous rather than a known third-party tool that needs baselining.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run a process with this image path or extension?
  context: >-
    Legitimate administrative activity and unbaselined third-party tooling can
    trigger this detection. Knowing whether the user role and host function are
    consistent with running a process from this image path is often the fastest
    way to separate routine operations from image tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    Image tampering and process ghosting are evasion techniques an operator may
    pair with attempts to weaken AV or EDR before running a payload. This query
    surfaces direct attempts to disable protection services, flip Defender flags,
    add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful
    "protection looks healthy" signal; kernel-level driver tampering and
    in-memory patches will not appear here. Populated rows shift the disposition
    toward operator preparation, so review the parent process and signing chain
    to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What is the full image path and command line of the flagged process, and what does it indicate?
  context: >-
    The full command line and image path reveal the specific action taken.
    Decode any flags, parameters, encoded content, file paths, or URLs. A
    nameless or null image, a .tmp path under a user temp directory, or an
    image that no longer exists on disk are consistent with process ghosting,
    where the backing file is deleted before inspection occurs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this image, and is that parent chain expected?
  context: >-
    The parent process reveals how the flagged image was invoked. Legitimate
    usage often has predictable parent chains. For ghosted or masqueraded
    processes the parent frequently shows a .tmp path under a user temp
    directory or an otherwise unexpected launcher; walking up the tree clarifies
    whether the spawn was operator-driven.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this image spawn afterward?
  context: >-
    The processes spawned by the flagged image reveal its actual impact. Image
    tampering is often a launcher for post-exploitation tooling; unexpected
    children such as cmd.exe, powershell.exe, or certutil.exe point to
    hands-on-keyboard follow-up rather than a benign unbaselined tool.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run a process from this image path?
  context: >-
    A process image that has never been seen on a host is more suspicious than
    one that runs regularly. Zero or very low historical counts indicate
    first-time or rare execution from this path, which raises the likelihood of
    tampering over routine unbaselined tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this rule's specific
    firing pattern has historically run here, not generic binary usage. A new
    parent process, an unexpected user account, or an unusual image shape is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      known_image_extension:
        Image|endswith:
        - .bin
        - .cgi
        - .com
        - .exe
        - .scr
        - .tmp
      filter_main_image:
        Image:
        - System
        - Registry
        - MemCompression
        - vmmem
      filter_main_msi_installers:
        Image|contains: :\Windows\Installer\MSI
      filter_main_driver_store:
        Image|contains: :\Windows\System32\DriverStore\FileRepository\
      filter_main_msi_rollbackfiles:
        Image|contains: :\Config.Msi\
        Image|endswith:
        - .rbf
        - .rbs
      filter_main_windows_temp:
      - ParentImage|contains: :\Windows\Temp\
      - Image|contains: :\Windows\Temp\
      filter_main_deleted:
        Image|contains: :\$Extend\$Deleted\
      filter_main_empty:
        Image:
        - '-'
        - ''
      filter_main_null:
        Image: null
      filter_optional_avira:
        ParentImage|contains: :\ProgramData\Avira\
      filter_optional_nvidia:
        Image|contains: NVIDIA\NvBackend\
        Image|endswith: .dat
      filter_optional_winpakpro:
        Image|contains:
        - :\Program Files (x86)\WINPAKPRO\
        - :\Program Files\WINPAKPRO\
        Image|endswith: .ngn
      filter_optional_myq_server:
        Image|endswith:
        - :\Program Files (x86)\MyQ\Server\pcltool.dll
        - :\Program Files\MyQ\Server\pcltool.dll
      filter_optional_wsl:
        Image|contains|all:
        - \AppData\Local\Packages\
        - \LocalState\rootfs\
      filter_optional_lzma_exe:
        Image|endswith: \LZMA_EXE
      filter_optional_firefox:
        Image|contains: :\Program Files\Mozilla Firefox\
      filter_optional_docker:
        ParentImage: C:\Windows\System32\services.exe
        Image|endswith: com.docker.service
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (not known_image_extension and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run processes from images that lack a standard executable extension?
  context: >-
    Compare this user's current action against their historical behavior pattern.
    A user who has never run a process from an anomalous image path is more
    suspicious than one who does so regularly. User role and typical toolset
    should align with the flagged image.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and image combination historically routine on this host or across the environment, or is the parent unusual for this image?
  context: >-
    When the alert fires under a service principal, user identity does not
    attribute behavior. The meaningful pivot is the launch mechanism: which
    parent process spawned this image, and is that pair historically common. A
    new or rare parent for this image is the deviation worth chasing; a pair
    that already accounts for thousands of prior events is vendor or OS
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or
    activity across multiple endpoints. If the same user triggered similar
    activity on multiple hosts, the scope of compromise may be larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and image combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else this user did across the network
    returns agent-telemetry noise. The meaningful question is whether the same
    launch mechanism — parent process plus spawned image — fired on other hosts
    in the alert window. Multiple hosts in the same window points to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals
    the immediate context: what led to this event, what happened after, and
    whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms surrounding the flagged process.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host —
    defense tampering, reconnaissance, credential access — may reveal the attack
    stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the rule's firing pattern rather than generic
    binary usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation that needs baselining; one host or a small
    unrelated set points to manual operator activity. Use the host distribution
    and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      known_image_extension:
        Image|endswith:
        - .bin
        - .cgi
        - .com
        - .exe
        - .scr
        - .tmp
      filter_main_image:
        Image:
        - System
        - Registry
        - MemCompression
        - vmmem
      filter_main_msi_installers:
        Image|contains: :\Windows\Installer\MSI
      filter_main_driver_store:
        Image|contains: :\Windows\System32\DriverStore\FileRepository\
      filter_main_msi_rollbackfiles:
        Image|contains: :\Config.Msi\
        Image|endswith:
        - .rbf
        - .rbs
      filter_main_windows_temp:
      - ParentImage|contains: :\Windows\Temp\
      - Image|contains: :\Windows\Temp\
      filter_main_deleted:
        Image|contains: :\$Extend\$Deleted\
      filter_main_empty:
        Image:
        - '-'
        - ''
      filter_main_null:
        Image: null
      filter_optional_avira:
        ParentImage|contains: :\ProgramData\Avira\
      filter_optional_nvidia:
        Image|contains: NVIDIA\NvBackend\
        Image|endswith: .dat
      filter_optional_winpakpro:
        Image|contains:
        - :\Program Files (x86)\WINPAKPRO\
        - :\Program Files\WINPAKPRO\
        Image|endswith: .ngn
      filter_optional_myq_server:
        Image|endswith:
        - :\Program Files (x86)\MyQ\Server\pcltool.dll
        - :\Program Files\MyQ\Server\pcltool.dll
      filter_optional_wsl:
        Image|contains|all:
        - \AppData\Local\Packages\
        - \LocalState\rootfs\
      filter_optional_lzma_exe:
        Image|endswith: \LZMA_EXE
      filter_optional_firefox:
        Image|contains: :\Program Files\Mozilla Firefox\
      filter_optional_docker:
        ParentImage: C:\Windows\System32\services.exe
        Image|endswith: com.docker.service
      condition: not known_image_extension and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
