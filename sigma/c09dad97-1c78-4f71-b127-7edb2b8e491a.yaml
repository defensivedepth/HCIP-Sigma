name: Execution of Suspicious File Type Extension
id: d2e6b8ec-5457-4c62-973f-27a91008bcfd
description: |
  Detects a process whose Image path does not end in a recognized executable
  extension (.bin, .cgi, .com, .exe, .scr, .tmp) and does not match a known
  benign exception (installer, driver store, WSL, vendor paths, etc.). A
  process with no backing executable file or an unusual image extension can
  result from process ghosting or other image-tampering methods that create a
  process from a file deleted or disguised before inspection occurs, but it can
  also reflect legitimate third-party tooling that has not yet been baselined.
  The investigation should confirm what image launched, whether a real file
  backs it on disk, how it was spawned, and whether the host or environment has
  seen this pattern before.
type: detection
detection_id: c09dad97-1c78-4f71-b127-7edb2b8e491a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process image have an extension or path that matches what this rule flags?
  context: >-
    Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the Image path does not end in a known executable
    extension and is not on the benign-exception list. Review the exact Image
    value and process details to confirm the image extension or path is genuinely
    anomalous rather than a known third-party tool that needs baselining.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run a process with this image path or extension?
  context: >-
    Legitimate administrative activity and unbaselined third-party tooling can
    trigger this detection. Knowing whether the user role and host function are
    consistent with running a process from this image path is often the fastest
    way to separate routine operations from image tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full image path and command line of the flagged process, and what does it indicate?
  context: >-
    The full command line and image path reveal the specific action taken.
    Decode any flags, parameters, encoded content, file paths, or URLs. A
    nameless or null image, a .tmp path under a user temp directory, or an
    image that no longer exists on disk are consistent with process ghosting,
    where the backing file is deleted before inspection occurs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this image, and is that parent chain expected?
  context: >-
    The parent process reveals how the flagged image was invoked. Legitimate
    usage often has predictable parent chains. For ghosted or masqueraded
    processes the parent frequently shows a .tmp path under a user temp
    directory or an otherwise unexpected launcher; walking up the tree clarifies
    whether the spawn was operator-driven.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this image spawn afterward?
  context: >-
    The processes spawned by the flagged image reveal its actual impact. Image
    tampering is often a launcher for post-exploitation tooling; unexpected
    children such as cmd.exe, powershell.exe, or certutil.exe point to
    hands-on-keyboard follow-up rather than a benign unbaselined tool.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run a process from this image path?
  context: >-
    A process image that has never been seen on a host is more suspicious than
    one that runs regularly. Zero or very low historical counts indicate
    first-time or rare execution from this path, which raises the likelihood of
    tampering over routine unbaselined tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this rule's specific
    firing pattern has historically run here, not generic binary usage. A new
    parent process, an unexpected user account, or an unusual image pattern is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      known_image_extension:
        Image|endswith:
        - .bin
        - .cgi
        - .com
        - .exe
        - .scr
        - .tmp
      filter_main_image:
        Image:
        - System
        - Registry
        - MemCompression
        - vmmem
      filter_main_msi_installers:
        Image|contains: :\Windows\Installer\MSI
      filter_main_driver_store:
        Image|contains: :\Windows\System32\DriverStore\FileRepository\
      filter_main_msi_rollbackfiles:
        Image|contains: :\Config.Msi\
        Image|endswith:
        - .rbf
        - .rbs
      filter_main_windows_temp:
      - ParentImage|contains: :\Windows\Temp\
      - Image|contains: :\Windows\Temp\
      filter_main_deleted:
        Image|contains: :\$Extend\$Deleted\
      filter_main_empty:
        Image:
        - '-'
        - ''
      filter_main_null:
        Image: null
      filter_optional_avira:
        ParentImage|contains: :\ProgramData\Avira\
      filter_optional_nvidia:
        Image|contains: NVIDIA\NvBackend\
        Image|endswith: .dat
      filter_optional_winpakpro:
        Image|contains:
        - :\Program Files (x86)\WINPAKPRO\
        - :\Program Files\WINPAKPRO\
        Image|endswith: .ngn
      filter_optional_myq_server:
        Image|endswith:
        - :\Program Files (x86)\MyQ\Server\pcltool.dll
        - :\Program Files\MyQ\Server\pcltool.dll
      filter_optional_wsl:
        Image|contains|all:
        - \AppData\Local\Packages\
        - \LocalState\rootfs\
      filter_optional_lzma_exe:
        Image|endswith: \LZMA_EXE
      filter_optional_firefox:
        Image|contains: :\Program Files\Mozilla Firefox\
      filter_optional_docker:
        ParentImage: C:\Windows\System32\services.exe
        Image|endswith: com.docker.service
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (not known_image_extension and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
