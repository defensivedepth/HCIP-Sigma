name: RunMRU Registry Key Deletion
id: ad8ac4a4-88a4-485e-8451-88f2b77ce8dc
description: |
  Detects reg.exe deleting the RunMRU registry key
  (HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU), which stores
  the history of commands typed into the Run dialog. The rule fires when reg.exe
  (by image name or original file name) runs with a command line that contains both
  a delete operation and the RunMRU key path. Legitimately this key is rarely
  cleared by command line; deleting it is a common anti-forensic step that removes
  the record of a command an operator or user was instructed to paste and run via
  the Run dialog. Investigation should confirm the exact command, recover what the
  Run dialog history may have held, and look for the activity the deletion was
  meant to hide.
type: detection
detection_id: c11aecef-9c37-45a6-9c07-bc0782f963fd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Did reg.exe run a delete operation against the RunMRU registry key?
  context: Confirm the alert is a true positive by reviewing the exact command line
    and process details. The rule fires only when reg.exe (or a binary whose original
    file name is reg.exe) runs with a command line containing both a delete operation
    and the path \Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU. Verify
    both elements are present and note the exact deletion flag used.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to clear Run dialog history from the command line?
  context: Legitimate clearing of the RunMRU key from the command line is unusual.
    Knowing whether the user role and host function make scripted registry cleanup
    plausible (for example, a privacy-cleanup tool or an administrative profile-reset
    script) is often the fastest way to separate routine activity from an anti-forensic
    step taken after a user pasted a command into the Run dialog.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:registry.registry_key_context
  question: What specific registry key and value did the deletion target, and is the RunMRU key a known evasion location?
  context: The RunMRU key under
    HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU records each
    command typed into the Run dialog as ordered values. The registry_set event
    linked to this process exposes the key path (TargetObject) and value data
    (Details) as structured fields. Confirm whether the whole key or a specific
    value was the target. If the deletion is captured only in reg.exe's command
    line rather than a registry_set event, the deletion flag in the command line
    is the source of truth instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:defense_tampering.what_was_disabled
  question: Was the entire RunMRU key removed, or only specific run-history values?
  context: The deletion target determines how much history was destroyed. Removing
    the whole RunMRU key wipes all recorded Run dialog commands; deleting a single
    value name removes only that one entry. The specific delete syntax in the
    command line reveals which occurred and therefore how much evidence of prior
    Run-dialog activity is still recoverable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was reg.exe executed from its expected System32 or SysWOW64 path?
  context: reg.exe executed from outside System32 or SysWOW64, or a binary whose
    original file name is reg.exe running under a different file name, can indicate
    the binary was copied or renamed to evade path-based or name-based controls.
    Compare the Image path against the OriginalFileName to confirm this is the
    genuine system reg.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.process_chain
  question: What process spawned reg.exe and is that parent chain expected for a registry deletion?
  context: The parent process reveals how the deletion was invoked. A reg.exe launched
    by explorer.exe or a user shell points to interactive or pasted command entry,
    while reg.exe launched by a script host, rundll32.exe, or an Office application
    points to automated or scripted removal. Identify the parent and what else it
    spawned to reconstruct how the command reached the host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1070.003.command_analysis
  question: What Run dialog commands ran on this host shortly before the RunMRU key was deleted?
  context: The RunMRU deletion is an anti-forensic step that typically follows
    execution of a command pasted into the Run dialog. Commands launched from the
    Run dialog appear as process_creation events with explorer.exe as the parent.
    Examining the children of explorer.exe in the window before the deletion can
    recover the command the deletion was meant to hide, including downloader or
    script-host invocations.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\explorer.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the RunMRU key was deleted?
  context: Indicator removal is performed to obscure activity that came before or to
    clear the way for activity that follows. Examining process creation in the hour
    after the deletion can surface persistence installation, payload execution, or
    additional registry changes that the cleared Run-dialog history would otherwise
    have pointed to.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: attack:T1070.003.file_path_analysis
  question: Were PowerShell history or other command-history artifacts also deleted or written on this host?
  context: Run dialog history is one of several command-history stores an operator
    may clear in the same operation. Deletion or modification of the PSReadLine
    history file (ConsoleHost_history.txt, typically under the user AppData path)
    or other history files points to broader history-clearing. File events touching
    these paths in the same window indicate the RunMRU deletion was part of a wider
    anti-forensic sweep.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_history:
        TargetFilename|contains:
          - '\ConsoleHost_history.txt'
          - '\PSReadLine\'
          - '\RunMRU'
      condition: selection and selection_history
    fields:
      - TargetFilename
      - Image
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense-evasion or indicator-removal actions performed on this host?
  context: An operator who clears Run dialog history often clears or disables other
    evidence sources in the same operation -- clearing event logs, deleting shadow
    copies, disabling protection, or removing additional registry keys. Finding
    multiple removal actions from the same user or parent process in a short window
    indicates a deliberate anti-forensic effort rather than isolated administrative
    cleanup.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: The RunMRU deletion may accompany registry changes that establish
    persistence or store a payload. Operators have been observed writing logon-script
    or environment persistence and storing encoded scripts in registry value data,
    then deleting the Run-dialog history to hide the originating command. Finding
    other reg.exe add or delete operations from the same user in a short window
    reveals whether configuration changes accompanied the cleanup.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains|all:
        - ' del'
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains|all:
        - ' del'
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether the same
    account performed similar removal or execution on multiple endpoints. If the
    user triggered comparable activity elsewhere, the scope of the operation may be
    larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains|all:
        - ' del'
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this RunMRU-deletion pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the RunMRU-deletion pattern, not generic
    reg.exe usage. Many hosts firing the same pattern points to scripted deployment
    or a privacy-cleanup tool; one host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains|all:
        - ' del'
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU
      condition: all of selection_*
    fields:
    - host.name
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the RunMRU-deletion pattern over the past 90 days?
  context: A RunMRU-deletion pattern with no prior history on a host is more
    suspicious than one seen regularly under stable parents. The query mirrors the
    rule's selection structure scoped to this host, so the count reflects the rule's
    specific firing pattern, not generic reg.exe usage. The command-line projection
    lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains|all:
        - ' del'
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Indicator removal rarely happens in isolation. Earlier detections on the
    same host -- execution from the Run dialog, script-host activity, or persistence
    installation -- may reveal the stages that preceded the deletion and help
    reconstruct the full timeline the cleared history would otherwise have shown.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
