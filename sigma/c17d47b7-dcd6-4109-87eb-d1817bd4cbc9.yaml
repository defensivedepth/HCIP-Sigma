  skipped_templates:
    - template: cue_process_tool.mechanism_decode
      reason: "replaced_by: registry.registry_key_context"
    - template: cue_artifact.mechanism_decode
      reason: "cue_artifact is derived from the 'del'/'delete' registry-value verb, not an actual file. The rule writes/deletes a registry value, not a file on disk; no file content exists to analyze."
    - template: cue_artifact.artifact_verification
      reason: "No file artifact — 'del'/'delete' is a registry value-delete verb, not a file deletion. No hash/reputation lookup applies."
