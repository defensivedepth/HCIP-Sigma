name: Enumerate All Information With Whoami.EXE
id: 33faa2ff-b874-486c-afd8-d10f74734a38
description: |
  Detects execution of whoami.exe with the -all (or /all) flag, which dumps the
  current security context in full: user SID, group memberships, and the complete
  privilege list. The rule fires when the process image ends in whoami.exe (or its
  OriginalFileName is whoami.exe) AND the command line contains the -all switch.
  Administrators and helpdesk staff legitimately run this during troubleshooting,
  but the same one-shot context dump is a common first move after a foothold is
  gained, where an operator confirms what account they landed on and what
  privileges it holds before deciding the next stage. Determine who and what
  spawned the command, whether the user and host routinely run it, and whether
  other reconnaissance ran in the same window.
type: detection
detection_id: c248c896-e412-4279-8c15-1c558067b6fa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — whoami.exe run with the -all flag?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule requires the image to be whoami.exe (or OriginalFileName whoami.exe) and the command line to contain the -all switch (dash or slash form). Confirm both the binary identity and the -all argument are present in the alerting event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run administrative discovery commands like whoami /all?
  context: Network administrators and IT staff legitimately run discovery commands for troubleshooting. Standard users rarely need a full security-context dump of their account. The user's role and typical behavior baseline determine whether running whoami with -all is routine or anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did whoami.exe enumerate? Read the full command line and any sibling whoami invocations on this host.
  context: The -all flag returns the user SID, every group membership, and the complete privilege list in one call. Decode the full command line to confirm which switches were passed, and check whether other whoami invocations (for example /user, /groups, /priv individually) ran nearby — sequential narrow queries can together amount to the same full enumeration. This query scopes to all whoami.exe runs on this host within the window, not just the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned the whoami command, and is this a normal pattern?
  context: Legitimate discovery is typically run from cmd.exe or powershell.exe spawned by explorer.exe (a user opened a shell) or from automation scripts. A whoami enumeration spawned by an unusual parent — an Office application, a script interpreter such as wscript.exe, cscript.exe, or mshta.exe, or wmiprvse.exe and wsmprovhost.exe for remote execution — points to automated post-exploitation enumeration rather than hands-on troubleshooting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery command may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession — whoami, systeminfo, ipconfig, net user, nltest — is a signature pattern of post-compromise enumeration. Three or more distinct recon binaries within fifteen minutes typically indicates an operator or script profiling the environment before the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- source: template:cue_process_tool.baseline
  question: Does this host normally run whoami.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. The aggregation over ninety days shows historical frequency grouped by user. Zero or very low counts indicate first-time or rare execution of whoami on this host, which raises the weight of the surrounding context.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the whoami /all pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even common tools get abused. The query mirrors the rule's selection — whoami.exe (or OriginalFileName whoami.exe) with the -all switch — scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here, not generic whoami usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_main_cli:
        CommandLine|contains|windash: ' -all'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- source: template:cue_process_tool.follow_on
  question: What child processes did whoami.exe spawn afterward?
  context: whoami.exe is a leaf utility — it normally spawns nothing. Any child process attributed to it is unusual and suggests the alerting event is part of a larger scripted sequence or that the parent chain is being misattributed. Review any children for follow-on execution such as cmd.exe, powershell.exe, or download utilities.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_process_tool.scope
  question: Have other hosts fired the whoami /all pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific firing pattern, not generic whoami usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; a single host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_main_cli:
        CommandLine|contains|windash: ' -all'
      condition: all of selection_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_main_cli:
        CommandLine|contains|windash: ' -all'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_main_cli:
        CommandLine|contains|windash: ' -all'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar discovery or execution on several hosts in the alert window, the scope of the activity is larger than a single host. This asks what they did right now across the network, distinct from their ninety-day baseline.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_main_cli:
        CommandLine|contains|windash: ' -all'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context — what led to this event, what happened after, and whether it is part of a larger sequence. Aggregating by image and parent collapses repetitive agent telemetry into high-count rows while novel parent-child pairs stand out at low counts, which is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this enumeration and help reconstruct the timeline. Reconnaissance followed by credential access or lateral movement is a common progression; the alert timeline tells the story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
