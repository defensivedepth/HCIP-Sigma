- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Embedded-object execution rarely occurs in isolation. Examining activity in the minutes around the
    alert reveals what led to the document opening, what the child staged afterward, and the timing
    between document open, file creation, and process execution that characterizes a delivery chain.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, defense tampering, or other execution alerts -
    may reveal the stages that preceded this event and help reconstruct the delivery timeline. The alert
    sequence on a host often tells the order of the operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- source: template:initial_access.campaign_scope
  question: Were other users or systems hit by the same OneNote child-process delivery?
  context: >-
    Phishing campaigns rarely target a single user. If one recipient opened a malicious .one file and it
    spawned a suspicious child, others likely received the same attachment. Correlating this detection
    across hosts reveals campaign breadth and identifies additional systems that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1566.001
      name: Spearphishing Attachment
      role: primary
    - id: T1566
      name: Phishing
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: attachment_delivery
      description: "Inbound .one attachment delivered and opened in OneNote.exe"
      mapped_to: Q3
      source: template:initial_access.delivery_vector
    - stage: 2
      label: embedded_object_execution
      description: "Victim double-clicks embedded object; OneNote spawns a script host / interpreter / LOLBin child"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 3
      label: payload_decode
      description: "Child interpreter decodes / executes the embedded or fetched payload"
      mapped_to: Q6
      source: template:cue_process_tool.mechanism_decode
    - stage: 4
      label: outbound_network
      description: "Child reaches a transfer service or compromised host to fetch the follow-on payload"
      mapped_to: Q8
      source: attack:T1566.001.outbound_network
  dimension_coverage:
    - dimension: tuning_parameter
      technique: T1566
      covered_by: Q1
      source: template:universal.verify_trigger_match
      coverage_type: direct
    - dimension: time_correlation
      technique: T1566.001
      covered_by: Q15
      source: template:cue_host_context.clustering
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1566.001
      covered_by: Q4
      source: template:parent_child.parent_process_legitimacy
      coverage_type: direct
  mutable_dispositions:
    - element: SuspiciousFileTypes
      dimension: tuning_parameter
      specific_values: "rationale only (.exe, .js, .vbs, .scr, macro-enabled docs)"
      disposition: context
      target_question: Q1
      notes: "Rule already enumerates the scriptable extensions (.hta/.vb/.wsh/.js/.ps/.scr/.pif/.bat/.cmd) and the LOLBin list in its own detection; verify_trigger_match context surfaces them. No query injection needed - the rule's own selection is the filter."
    - element: AllowedSenders
      dimension: tuning_parameter
      specific_values: "rationale only"
      disposition: context
      target_question: Q3
      notes: "Sender allow-listing is mail-side tuning; surfaced as delivery-vector context (who sent the .one). Not queryable from process_creation."
    - element: AttachmentExtensions
      dimension: tuning_parameter
      specific_values: "rationale only (.exe, .js, .vbs, .docm, .xlsm)"
      disposition: context
      target_question: Q1
      notes: "Covered by the rule's own extension/binary list; verify_trigger_match context names the scriptable extensions."
