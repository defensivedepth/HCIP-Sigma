      reason: "Applies only to the powershell-child branch (1 of ~40 possible children). For mshta/wscript/regasm/curl fires it returns nothing relevant. One PowerShell decode question (Q7) is retained for the common PS payload branch; a second PS-only question over-fits a multi-binary rule."
