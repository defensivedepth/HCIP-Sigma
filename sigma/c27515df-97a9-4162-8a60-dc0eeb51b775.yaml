      reason: "Same - persistence is not the detected behavior. The file_event slot is better spent on the network/delivery axis (Q8) that matches the spearphishing chain."
    - template: initial_access.application_patch_status
      reason: "OneNote child-process execution is social-engineering driven (victim double-clicks an embedded object), not exploitation of an unpatched CVE. Patch status of OneNote is not the disposition lever here; slot reserved for delivery/scope questions that match the technique."
    - template: masquerading.binary_origin
      reason: "true_identity (Q5) already establishes the OriginalFileName/Image mismatch and hash. binary_origin (-30d file_event by basename) targets a renamed-tool-staged-long-ago scenario; for OneNote delivery the binary arrives at execution time, covered by delivery_vector (Q3) and the around-alert host context."
    - template: masquerading.renamed_binary_activity
      reason: "Local post-execution activity is covered by sibling_processes (Q9) and mechanism_decode (Q6); cross-host scope is covered by campaign_scope (Q17). The dedicated renamed-binary scope question would duplicate those."
    - template: universal.endpoint_protection_health
      reason: "RECOMMENDED, not must_include. This rule fires at initial-access/execution from a document open, not on a hands-on-keyboard payload that an operator would precede by disabling AV/EDR. cue_host_context.precursor (Q16) already surfaces any prior tamper alerts on the host, so the generic tamper sweep adds no disposition value here."
