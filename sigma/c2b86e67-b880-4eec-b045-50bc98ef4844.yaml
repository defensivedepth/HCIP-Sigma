name: HackTool - LaZagne Execution
id: 5a22a8bc-f423-4601-a3db-4a010a79ac3d
description: |
  Detects execution of LaZagne, an open-source credential-recovery tool that sweeps locally stored passwords from
  browsers, mail clients, FTP/SSH/RDP managers, wifi profiles, databases, and Windows secret stores. The rule fires when
  EITHER the image name ends in lazagne.exe, OR the image runs from a user-writable or staging directory, OR the command line carries one of LaZagne's module keywords (browsers, mails, wifi, all) together with one of its per-application option flags. Legitimate use is essentially limited to authorized security assessments; outside that context, LaZagne
  execution typically marks the credential-access stage of a hands-on intrusion, where an operator harvests stored
  secrets to enable lateral movement. Determine which credential stores were targeted, whether the activity is sanctioned,
  and what followed it on the host and across the environment.
type: detection
detection_id: c2b86e67-b880-4eec-b045-50bc98ef4844
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Did this execution match the rule — either a lazagne.exe image name, a staging-directory path, or LaZagne module keywords together with option flags on the command line?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires on any one of several
    branches, so note which one matched: the binary literally named lazagne.exe, an image running from a user-writable or
    staging directory, or a module keyword such as browsers, mails, wifi, or all together with a per-application option flag such as -keepass or -filezilla. The branch that fired determines the rest of the investigation — a name or keyword match points
    to an unrenamed tool, while a path-only match points to a renamed binary staged in a temp or profile directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a local credential-recovery tool?
  context: >-
    Legitimate administrative activity can trigger many detections, but broad credential harvesting from local password
    stores is rarely part of routine operations. Knowing whether this user role and host function ever involve security
    tooling is often the fastest path to separating a sanctioned assessment from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this LaZagne execution part of an authorized penetration test or red team engagement?
  context: >-
    Credential-recovery tools are used in sanctioned security assessments. Before investing investigation time, check
    whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement
    with matching tool usage and timing resolves the alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: Which credential stores did this run target — and was a single store selected or a full sweep?
  context: >-
    LaZagne aggregates per-application extraction logic, so the command line names what it went after. The module
    keyword "all" runs every extractor; specific keywords such as browsers, mails, chats, wifi, databases, sysadmin,
    or memory scope it to one category; option flags such as -keepass, -filezilla, -outlook, -lsa_secrets, or -hashdump
    target individual applications or Windows secret stores. Wifi, hashdump, and LSA-secret extraction additionally
    require Administrator rights, so their presence implies the process was already elevated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which LaZagne module or option flag was invoked, and what does that imply was harvested?
  context: >-
    The specific module or flag determines the scope of potential compromise. Browser and mail modules expose saved
    web and email credentials; sysadmin modules expose FTP, SSH, RDP, and VPN client secrets; the memory and hashdump
    options reach into LSASS-adjacent and SAM-derived secrets; -password supplied alongside a module indicates the
    operator was decrypting DPAPI-protected domain credentials with a known password. Read the exact arguments to scope
    which secret types may now be in the operator's hands.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be exposed by what this host stored, and do any have elevated privileges?
  context: >-
    The severity of a credential sweep depends on what was actually stored on this host and the privilege level of those
    accounts. Saved domain-admin or service-account credentials require incident escalation; a standalone workstation
    with only a local user's browser passwords may need only a reset and monitoring. Cross-reference the user and any
    accounts whose secrets are cached here against directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: Did this process write credential-output files to the host?
  context: >-
    LaZagne can write its results to disk as text or JSON with the -oN, -oJ, or -oA flags, optionally to a directory set
    by -output. Output files created by this process confirm that harvested credentials were materialized on disk and
    indicate where the operator may have staged them for exfiltration, even if the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this tool, and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. Interactive use via explorer.exe or a console shell looks
    different from execution under wscript.exe, mshta.exe, an Office application, or a remote-execution service, any of
    which points to scripted delivery or hands-on-keyboard operation through a foothold.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Credential access rarely occurs in isolation. The activity immediately surrounding the sweep often reveals the
    preceding stages — initial access, reconnaissance, privilege escalation — and what the operator did next. Novel
    parent-child pairs stand out at low counts against the routine high-count background of agent and OS telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img_metadata:
        Image|endswith: \lazagne.exe
      selection_img_cli:
        Image|contains:
        - :\PerfLogs\
        - :\ProgramData\
        - :\Temp\
        - :\Tmp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \$Recycle.bin
        - \AppData\
        - \Desktop\
        - \Downloads\
        - \Favorites\
        - \Links\
        - \Music\
        - \Photos\
        - \Pictures\
        - \Saved Games\
        - \Searches\
        - \Users\Contacts\
        - \Users\Default\
        - \Users\Searches\
        - \Videos\
        - \Windows\addins\
        - \Windows\Fonts\
        - \Windows\IME\
        CommandLine|endswith:
        - .exe all
        - .exe browsers
        - .exe chats
        - .exe databases
        - .exe games
        - .exe git
        - .exe mails
        - .exe maven
        - .exe memory
        - .exe multimedia
        - .exe sysadmin
        - .exe unused
        - .exe wifi
        - .exe windows
      selection_cli_modules:
        CommandLine|contains:
        - ' all '
        - ' browsers '
        - ' chats '
        - ' databases '
        - ' games '
        - ' mails '
        - ' maven '
        - ' memory '
        - ' multimedia '
        - ' php '
        - ' svn '
        - ' sysadmin '
        - ' unused '
        - ' wifi '
      selection_cli_options:
        CommandLine|contains:
        - -1Password
        - -apachedirectorystudio
        - -autologon
        - -ChromiumBased
        - -coreftp
        - -credfiles
        - -credman
        - -cyberduck
        - -dbvis
        - -EyeCon
        - -filezilla
        - -filezillaserver
        - -ftpnavigator
        - -galconfusion
        - -gitforwindows
        - -hashdump
        - -iisapppool
        - -IISCentralCertP
        - -kalypsomedia
        - -keepass
        - -keepassconfig
        - -lsa_secrets
        - -mavenrepositories
        - -memory_dump
        - -Mozilla
        - -mRemoteNG
        - -mscache
        - -opensshforwindows
        - -openvpn
        - -outlook
        - -pidgin
        - -postgresql
        - -psi-im
        - -puttycm
        - -pypykatz
        - -Rclone
        - -rdpmanager
        - -robomongo
        - -roguestale
        - -skype
        - -SQLDeveloper
        - -squirrel
        - -tortoise
        - -turba
        - -UCBrowser
        - -unattended
        - -vault
        - -vaultfiles
        - -vnc
        - -winscp
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_img_* or all of selection_cli_*) and _pb_scope
    fields:
    - host.name
