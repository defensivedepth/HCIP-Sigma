name: Potential Suspicious Activity Using SeCEdit
id: 6001cbfd-0d71-44e6-8108-96cf0f497a31
description: |
  Detects secedit.exe (or a binary with the original filename SeCEdit) running with command-line flags that either export the
  local security policy (/export with /cfg) or apply a security template to the system (/configure with /db). The export branch
  is commonly used for reconnaissance of the current password, lockout, audit, and user-rights policy; the configure branch can
  apply an attacker-crafted template that disables event-log auditing, weakens lockout, grants user rights, or alters log
  retention. secedit is a legitimate administrative tool, so the investigation determines whether the invocation was authorized
  maintenance or an operator preparing the host by reading or rewriting its security configuration.
type: detection
detection_id: c2c76b77-32be-4d1f-82c9-7e544bdfe0eb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the secedit pattern this rule detects — either an /export with /cfg, or a /configure
    with /db?
  context: This rule fires when the process is secedit.exe (or carries the original filename SeCEdit) AND the command line
    contains either /export plus /cfg (a policy export) OR /configure plus /db (a policy apply). Confirm which branch fired
    before continuing — an export reads the current policy, while a configure rewrites it, and the two branches drive different
    follow-on questions. Review the exact command line and the process Image and OriginalFileName against these criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to read or rewrite the local security policy with secedit?
  context: secedit is a built-in administrative tool, but routine security-policy export or configuration is usually limited
    to specific administrators, configuration-management workflows, or hardening scripts. Knowing whether the user role and
    host function fit secedit use is often the fastest way to separate authorized maintenance from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: What process spawned secedit, and what started that parent?
  context: secedit launched by an interactive administrative shell or a configuration-management agent looks different from
    secedit spawned by a script interpreter, an Office application, or a remote-execution service. Tracing the parent's own
    origin reveals whether the chain is a deliberate human action or an automated post-compromise step.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for this security-policy export or change?
  context: Many organizations require change records for security-configuration work. A corresponding ticket or maintenance
    window suggests authorized hardening or auditing; the absence of one when policy requires it points toward unauthorized
    activity. This check can quickly close a false positive or escalate a true positive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.what_was_disabled
  question: What did this secedit invocation actually do — which template, database, and areas were referenced, and was the
    security policy exported or rewritten?
  context: The command line reveals the operation. For the export branch, the /cfg file is the destination the current policy
    was written to and the /areas list (USER_RIGHTS, SECURITYPOLICY, AUDIT, etc.) narrows what was read. For the configure
    branch, the /cfg .inf is the template being applied, /db is the security database, and flags like /overwrite or /quiet
    indicate a silent apply. A configure that points /cfg at a template in a user-writable path such as TEMP or APPDATA is
    the higher-risk case, since the template can disable auditing, weaken lockout, or grant user rights.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1562.process_identification
  question: Is the process genuinely the system secedit.exe, or a renamed binary matching the SeCEdit original filename from
    an unexpected path?
  context: The rule matches on either the image name secedit.exe or the original filename SeCEdit, so a renamed copy run from
    a non-system directory still fires. The legitimate tool lives in the System32 directory and is Microsoft-signed; a binary
    that reports the SeCEdit original filename but runs from a user-writable or temporary path is the masquerading case worth
    chasing. Compare the Image path against the expected system location and confirm the signing identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CurrentDirectory
- source: attack:T1562.002.audit_policy_change
  question: Did an audit-policy-change or security-log event follow this secedit invocation on the same host?
  context: The configure branch of secedit can apply a template that turns off audit categories or alters log retention; such
    a change is recorded as a system-audit-policy-change event, and a cleared security log produces its own event. Correlating
    these events in the window after the secedit run confirms whether the policy apply actually weakened logging on this host.
    If Windows Security event logs are not ingested in this environment, treat zero results as a visibility gap rather than
    evidence nothing changed, and verify the current audit policy directly on the host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \secedit.exe
      - OriginalFileName: SeCEdit
      selection_flags_discovery:
        CommandLine|contains|all:
        - /export
        - /cfg
      selection_flags_configure:
        CommandLine|contains|all:
        - /configure
        - /db
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img and (1 of selection_flags_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \secedit.exe
      - OriginalFileName: SeCEdit
      selection_flags_discovery:
        CommandLine|contains|all:
        - /export
        - /cfg
      selection_flags_configure:
        CommandLine|contains|all:
        - /configure
        - /db
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and (1 of selection_flags_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline
  question: Does this host normally run secedit?
  context: secedit that has never run on a host is more notable than one that runs on a regular maintenance cadence. The 90-day
    history, grouped by user, shows whether this is first-time or recurring use on this endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the secedit export/configure pattern, what parents and users normally drove
    it, and does the current alert fit that pattern?
  context: Even a built-in tool can be abused. This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here — not
    generic secedit usage. A new parent process, an unexpected account, or an unusual command-line structure is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \secedit.exe
      - OriginalFileName: SeCEdit
      selection_flags_discovery:
        CommandLine|contains|all:
        - /export
        - /cfg
      selection_flags_configure:
        CommandLine|contains|all:
        - /configure
        - /db
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and (1 of selection_flags_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the secedit export/configure pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern rather than generic secedit usage. Many hosts firing the same pattern points to scripted hardening
    or configuration-management automation; a single host or a small unrelated set points to manual operator activity. Use
    the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \secedit.exe
      - OriginalFileName: SeCEdit
      selection_flags_discovery:
        CommandLine|contains|all:
        - /export
        - /cfg
      selection_flags_configure:
        CommandLine|contains|all:
        - /configure
        - /db
      condition: selection_img and (1 of selection_flags_*)
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the secedit run was an isolated
    action or part of broader hands-on activity spanning multiple endpoints. The same user touching several hosts in a short
    window widens the potential scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \secedit.exe
      - OriginalFileName: SeCEdit
      selection_flags_discovery:
        CommandLine|contains|all:
        - /export
        - /cfg
      selection_flags_configure:
        CommandLine|contains|all:
        - /configure
        - /db
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and (1 of selection_flags_*)) and _pb_scope
    fields:
    - host.name
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single policy export may be routine, but secedit export alongside several reconnaissance commands in rapid succession
    — whoami, net user, systeminfo, nltest — is a signature of post-compromise enumeration. The export of the security policy
    is itself a discovery action, so clustering with other recon binaries strengthens that reading.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after secedit ran?
  context: If secedit applied a template that weakened auditing or other controls, the actions it enabled appear in the window
    immediately after. Examining process activity in that window reveals what the policy change was meant to permit — payload
    execution, credential access, or further configuration changes. A gap in logging followed by new process creation points
    to activity the change was meant to hide.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential
    access — may reveal the attack stages that preceded the secedit run and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: If a suspicious parent spawned secedit, it likely spawned other processes too. Examining sibling processes from
    the same parent in the alert window reveals the full scope of activity from that parent — multiple related children point
    to scripted orchestration rather than a single administrative action.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
