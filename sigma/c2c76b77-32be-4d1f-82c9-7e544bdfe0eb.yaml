  hint_dispositions:
    - hint: "registry.registry_key_context replaces cue_process_tool.mechanism_decode"
      disposition: declined
      reason: >-
        Declined as the mechanism-decode replacement. secedit applies security policy via a
        template file, not via reg.exe/regedit, and produces no registry_set event linked to
        its ProcessGuid, so a registry-decode question would return nothing. defense_tampering.what_was_disabled
        (Q5) is the chosen Phase 2 decode for this policy tool.
    - hint: "credential_access.credential_target_identification replaces cue_process_tool.mechanism_decode"
      disposition: declined
      reason: >-
        Declined as the mechanism-decode replacement. secedit does not access credential stores
        (LSASS/SAM/NTDS/LSA secrets); the credential-target question does not describe what secedit
        does. defense_tampering.what_was_disabled (Q5) is the chosen Phase 2 decode.
    - hint: "logsource 'application' (recommended by techniques: T1547.010) is not covered and no template family exists — author a custom question with `category: application`"
      disposition: declined
      reason: >-
        T1547.010 (Port Monitor DLL persistence via spoolsv.exe AddMonitor) is tagged speculatively
        for the policy-apply path; the rule detects the secedit command pattern, not AddMonitor API
        calls or spoolsv DLL loads. The application logsource is genuinely out of scope for a
        process_creation secedit detection.
    - hint: "logsource 'create_stream_hash' (recommended by techniques: T1546.008) is not covered and no template family exists — author a custom question with `category: create_stream_hash`"
      disposition: declined
      reason: >-
        T1546.008 (accessibility-feature binary replacement / ADS) is tagged speculatively. secedit
        does not create alternate data streams; create_stream_hash is out of scope for this rule's
        policy export/apply behavior.
    - hint: "logsource 'image_load' (recommended by techniques: T1505.005,T1556.002,T1546.007,T1547.002) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The image_load-driven techniques (termsrv.dll, password-filter DLL, netsh helper DLL, LSA
        auth-package DLL) are tagged because secedit could in principle enable such persistence, not
        because the rule detects DLL loads. The rule's detection is the secedit command line; image_load
        of svchost/lsass DLLs is a separate detection surface and is genuinely out of scope here.
    - hint: "logsource 'network_connection' (recommended by techniques: T1557) is not covered — pull in cue_network_endpoint.* or author a custom question with `category: network_connection`"
      disposition: declined
      reason: >-
        T1557 (Adversary-in-the-Middle) is tagged speculatively. A secedit policy export or apply
        produces no network flows; the network_connection logsource does not surface evidence for
        this rule's behavior and is out of scope.
