name: Whoami.EXE Execution With Output Option
id: a8d33ff1-f7ca-4188-8b55-928b09f2d912
description: |
  Detects whoami.exe running with output-formatting or redirection that captures the result for later use:
  either the '/FO CSV' or '-FO CSV' formatting flag, or a redirection of whoami output to a file
  (a command line containing 'whoami' followed by '>'). The rule fires when at least one of those
  patterns matches. whoami is a routine identity-check tool, but capturing its output to structured
  CSV or a file is more consistent with staging discovery results for collection or later exfiltration
  than with an interactive admin glancing at the current account. Determine which pattern fired, what
  the full command did with the output, and whether the surrounding host and user activity looks like
  routine administration or post-compromise enumeration.
type: detection
detection_id: c30fb093-1109-4dc8-88a8-b30d11c95a5d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting command line match one of this rule's patterns — '/FO CSV', '-FO CSV', or whoami output redirected to a file?
  context: >-
    The rule fires when at least one of three patterns matches: the '/FO CSV' or '-FO CSV' output-format
    flag, or a command line where whoami output is redirected to a file (whoami followed by '>'). Confirm
    which branch fired by reviewing the exact command line, because the branch shapes the rest of the
    investigation — a CSV format flag points to structured capture for parsing, while a file redirection
    points to staging the result on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What did the full whoami command do with its output — where was the result written or formatted, and what scope was requested?
  context: >-
    The full command line reveals what the captured identity data was meant for. Note the output target
    (a file path after the redirection, or stdout for the CSV flag), and any scope switches such as /all,
    /groups, /priv, or /user that broaden what gets enumerated. A redirection to a user-writable or staging
    directory, or a request for the full /all output, is more consistent with collecting discovery results
    than a quick interactive check.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this whoami command, and is that parent expected to launch identity-discovery tools?
  context: >-
    Identity-discovery commands run interactively are typically spawned from cmd.exe or powershell.exe under
    explorer.exe. The same command spawned by Office applications, script interpreters (wscript.exe, cscript.exe,
    mshta.exe), wmiprvse.exe (WMI remote execution), or wsmprovhost.exe (remote shell) is more consistent with
    automated post-compromise enumeration than with an admin checking their account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run identity-discovery commands and capture the output?
  context: >-
    Administrators and IT staff legitimately run whoami for troubleshooting, but rarely format it to CSV or
    redirect it to a file. Standard users and service accounts almost never do. The user's role and typical
    behavior determine whether capturing identity data to a structured output is routine or anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single whoami may be legitimate troubleshooting, but several reconnaissance commands in rapid succession
    — whoami, ipconfig, net user, systeminfo, nltest — is a signature pattern of post-compromise enumeration.
    Three or more different recon binaries within fifteen minutes typically indicates automated discovery
    rather than ad hoc administration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline
  question: Does this host normally run whoami.exe?
  context: >-
    A binary that has never been seen on a host is more notable than one that runs regularly. Zero or very
    low historical counts over ninety days indicate first-time or rare execution of whoami here, which raises
    the weight of the output-capture behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific output-capture pattern has historically run here — not generic
    whoami usage. A new parent process, an unexpected user account, or an unusual command-line shape is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_main_cli:
        CommandLine|contains:
        - ' /FO CSV'
        - ' -FO CSV'
      selection_special:
        CommandLine|contains: whoami*>
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_main_* or selection_special) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this whoami invocation spawn afterward?
  context: >-
    whoami itself does not spawn children in normal use. Processes spawned by the same binary on this host
    shortly after — cmd.exe, powershell.exe, certutil.exe, or archive/upload tools — would point to the
    captured discovery results feeding a later stage such as staging or exfiltration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: >-
    Discovery rarely happens alone. Activity surrounding this whoami invocation may reveal additional
    reconnaissance, credential access, privilege escalation, or data staging that provides broader context
    for whether this is routine administration or one stage of a multi-step operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this
    output-capture pattern rather than generic whoami usage. Many hosts firing the same pattern points to
    scripted deployment or vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main_img:
      - Image|endswith: \whoami.exe
      - OriginalFileName: whoami.exe
      selection_main_cli:
        CommandLine|contains:
        - ' /FO CSV'
        - ' -FO CSV'
      selection_special:
        CommandLine|contains: whoami*>
      condition: all of selection_main_* or selection_special
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run whoami.exe across the environment?
  context: >-
    Compare this user's current action against their historical behavior. A user who has never run whoami,
    or who has never captured its output, is more notable than one who does so regularly. The user's role
    and typical toolset should align with capturing identity data to a structured file.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+whoami combination historically routine on this host or environment-wide, or is the parent unusual for whoami?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior. The meaningful
    pivot is the launch mechanism — which parent process spawned whoami, and whether that pair is historically
    common. A new or rare parent for whoami is the deviation worth chasing; a pair that already accounts for
    thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on
    multiple endpoints. If the same user triggered similar discovery on several hosts in a short window,
    the scope of the activity may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+whoami combination fire on other hosts in the same window — a coordinated rollout, or isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent-telemetry noise,
    since every host runs system-owned agents constantly. The meaningful question is whether the same launch
    mechanism — parent process plus whoami — fired on other hosts in the alert window. Multiple hosts points
    to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Discovery rarely happens in isolation. Earlier detections on the same host — defense tampering,
    initial-access execution, or credential access — may reveal the attack stages that preceded this
    enumeration and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
