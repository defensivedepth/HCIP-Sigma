name: Import PowerShell Modules From Suspicious Directories - ProcCreation
id: 169e83b2-1fe8-43c1-a8d7-2c30fe0059a3
description: |
  Detects PowerShell command lines that import a module (Import-Module or its ipmo alias)
  from a user-writable directory: the user's TEMP or APPDATA folder, or the public profile
  (C:\Users\Public). Legitimate modules are normally installed under Program Files or the
  per-user Documents\WindowsPowerShell\Modules path and loaded by name, so an explicit
  import from a dropped path is unusual. The technique lets an operator load attacker-staged
  PowerShell or .NET code into a session from a location any user can write to, often as the
  execution stage after a download or unpacking step. Investigation should confirm the exact
  module path that was imported, retrieve and analyze the module file itself, establish what
  launched PowerShell, and determine whether the host and user have any history of importing
  modules from these locations.
type: detection
detection_id: c31364f7-8be6-4b77-8483-dd2b5a7b69a3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line import a PowerShell module from a user-writable directory (TEMP, APPDATA, or C:\Users\Public)?
  context: Before investing investigation time, confirm the alert is a true positive. Read
    the full command line and verify it contains an Import-Module or ipmo call whose path
    begins under $Env:Temp, $Env:Appdata, or C:\Users\Public. Note the exact module path
    that was imported — it is the artifact the rest of the investigation pivots on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to import PowerShell modules from temporary or public directories?
  context: Module imports from a user-writable path are routine for some developers and for
    automation that unpacks tooling into TEMP or APPDATA before running it. On a general
    workstation, or under an account with no scripting or development role, the same pattern
    is hard to explain. Aligning the user role and host function with this behavior is often
    the fastest path to separating a true positive from routine operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does the full module-import command decode to?
  context: The import path is only part of the command line. Look for -EncodedCommand / -enc
    base64 blobs, string concatenation, backtick escaping, and variable substitution that
    hide what is actually being loaded and run. Decode the command to recover the exact
    module file path and any code that runs immediately after the import — a download cradle,
    in-memory .NET load, or reverse shell. The imported module name and its on-disk path are
    the key fields to extract here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1059.001.image_load
  question: Did PowerShell load the .NET engine assembly or the imported module from the user-writable path?
  context: Importing a module loads its code into the PowerShell session. Confirming that
    System.Management.Automation.dll loaded establishes that PowerShell actually executed,
    and a module assembly loaded from TEMP, APPDATA, or the public profile is the load event
    that corresponds to the import. A rarely seen or never-before-seen assembly loaded from a
    user-writable directory is the tuneable signal worth chasing; a well-known signed module
    loaded from a standard path is less notable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_path:
        ImageLoaded|contains:
          - '\Temp\'
          - '\AppData\'
          - '\Users\Public\'
      condition: selection and selection_path
    fields:
      - ImageLoaded
      - Image
      - Signed
- source: template:cue_artifact.mechanism_decode
  question: What is the content of the imported module file? Check for obfuscation, encoded strings, and known malware indicators.
  context: The module loaded from the user-writable path is the payload. Retrieve the file
    and read its actual content. For PowerShell or text modules, check for base64 encoding,
    obfuscated strings, embedded URLs or IP addresses, and known malicious string patterns.
    For compiled module assemblies, check imports, embedded strings, packer signatures, and
    signing status. Content analysis requires manual retrieval from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_artifact.artifact_verification
  question: What is the hash of the imported module file, and does it have known threat-intel detections?
  context: A file hash is a unique identifier for reputation lookup. Submit the hash of the
    imported module to a threat-intelligence service or internal reputation platform to
    determine whether the file is known malicious, known benign, or previously unseen. This
    is distinct from reading the file's content — it answers whether the file is already
    known, not what is inside it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: template:universal.evidence_preservation
  question: Is the imported module file still on disk for analysis?
  context: The command references a module file under a user-writable path. Checking whether
    that file still exists enables deeper analysis — hash lookups, sandbox submission, or
    content review. Files staged in TEMP or APPDATA are frequently deleted after use, so
    preserve a copy promptly if it is still present.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell session, and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. Legitimate use often has
    predictable parents (explorer.exe for interactive sessions, services.exe or a scheduler
    for automation). Unusual parents such as mshta.exe, wscript.exe, winword.exe, or
    excel.exe point toward exploitation or a malicious document delivering the import as an
    execution stage. Walk up the tree to see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened shortly before this execution?
  context: Operators frequently weaken controls just before loading and running attacker
    code — AMSI bypass (patching amsi.dll in memory), an execution-policy change
    (-ExecutionPolicy Bypass or -ep bypass), constrained-language-mode escape, or a downgrade
    to PowerShell v2 which lacks logging. A bypass in the preceding window strengthens the
    case that the module import was a deliberate malicious execution stage rather than
    routine activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the imported module's script content?
  context: Event ID 4104 (script block logging) records the deobfuscated script that
    PowerShell actually executes, including the contents of a module loaded via Import-Module,
    even when the command line is encoded. This provides ground truth about what ran, bypassing
    attacker obfuscation. If PowerShell operational logs are not ingested in this environment,
    treat an empty result as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Loading attacker code into a PowerShell session is often paired with attempts to
    weaken protection first. This surfaces direct attempts to disable AV/EDR services, flip
    Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful
    "protection looks healthy" signal — kernel-level driver tampering and in-memory patches
    will not appear here. Populated rows shift the disposition toward deliberate operator
    preparation; review the writer's parent process and signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell session spawn afterward?
  context: The processes spawned after the module is imported reveal its actual impact.
    Imported attacker code commonly spawns cmd.exe, additional powershell.exe instances,
    rundll32.exe, regsvr32.exe, or living-off-the-land download tools such as certutil.exe
    and bitsadmin.exe for post-exploitation. A module that imports cleanly and spawns nothing
    is closer to benign tooling than one that launches a chain of secondary processes.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously imported modules from these directories, what parents and users drove that activity, and does this alert fit?
  context: Even on hosts where this happens, the historical parent/user distribution shows
    how the pattern normally runs here. The query mirrors the rule's import-from-suspicious-path
    selection scoped to this host, so the result reflects the rule's specific firing pattern
    rather than generic PowerShell usage. A new parent process, an unexpected user account,
    or an unusual command-line shape against that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Import-Module "$Env:Temp\
        - Import-Module '$Env:Temp\
        - Import-Module $Env:Temp\
        - Import-Module "$Env:Appdata\
        - Import-Module '$Env:Appdata\
        - Import-Module $Env:Appdata\
        - Import-Module C:\Users\Public\
        - ipmo "$Env:Temp\
        - ipmo '$Env:Temp\
        - ipmo $Env:Temp\
        - ipmo "$Env:Appdata\
        - ipmo '$Env:Appdata\
        - ipmo $Env:Appdata\
        - ipmo C:\Users\Public\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts imported modules from these directories in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's import-from-suspicious-path selection with no host
    scope, so the result is a fleet-wide count of the rule's firing pattern rather than
    generic PowerShell usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation that drops and imports a module; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and
    parent/path consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Import-Module "$Env:Temp\
        - Import-Module '$Env:Temp\
        - Import-Module $Env:Temp\
        - Import-Module "$Env:Appdata\
        - Import-Module '$Env:Appdata\
        - Import-Module $Env:Appdata\
        - Import-Module C:\Users\Public\
        - ipmo "$Env:Temp\
        - ipmo '$Env:Temp\
        - ipmo $Env:Temp\
        - ipmo "$Env:Appdata\
        - ipmo '$Env:Appdata\
        - ipmo $Env:Appdata\
        - ipmo C:\Users\Public\
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally import PowerShell modules from temporary or public directories?
  context: Compare the account's current action against its history. A developer or
    automation account that routinely imports modules from working directories is a different
    picture from an account that has never done so. Zero or very low counts, combined with
    what is known about the user's role, indicate the activity is out of pattern for this
    account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains:
        - Import-Module "$Env:Temp\
        - Import-Module '$Env:Temp\
        - Import-Module $Env:Temp\
        - Import-Module "$Env:Appdata\
        - Import-Module '$Env:Appdata\
        - Import-Module $Env:Appdata\
        - Import-Module C:\Users\Public\
        - ipmo "$Env:Temp\
        - ipmo '$Env:Temp\
        - ipmo $Env:Temp\
        - ipmo "$Env:Appdata\
        - ipmo '$Env:Appdata\
        - ipmo $Env:Appdata\
        - ipmo C:\Users\Public\
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK
    SERVICE, or a computer account), user identity does not attribute the behavior. The
    meaningful pivot is the launch mechanism — which parent process spawned this PowerShell
    session, and whether that pair is historically common. A new or rare parent is the
    deviation worth chasing; a pair that already accounts for thousands of events is
    established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user
    triggered similar tooling elsewhere in the same window, the scope is larger than this one
    host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-binary combination fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, "what else did this user do across the network" returns
    agent-telemetry noise because every host runs SYSTEM-owned agents constantly. The
    meaningful question is whether the same launch mechanism — parent process plus spawned
    binary — fired on other hosts in the alert window. Multiple hosts point to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
