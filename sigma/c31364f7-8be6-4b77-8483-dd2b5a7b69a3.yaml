        Budget reconciliation against the 18-question cap. Two mandatory non-dedup
        cue_user_actor pairs (4 questions), the three powershell must_includes, the three
        universal must_includes, both REFLECTED rule-pattern questions, and the acted-on
        image_load question fill the budget. Host situational awareness is carried by the
        follow_on question (child processes spawned by this session) and the +/-1h user
        clustering question (surrounding activity), so a generic host-wide process roll-up
        adds no new disposition signal.
    - hint: "cue_host_context.precursor (did other detections fire on this host before this alert)"
      disposition: declined
      reason: >-
        Dropped for the same 18-question budget. Prior-tamper / preparation signal is
