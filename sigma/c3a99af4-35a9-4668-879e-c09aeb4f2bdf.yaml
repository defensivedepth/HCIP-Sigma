name: Rundll32 Execution With Uncommon DLL Extension
id: 5bb85fa4-ebb7-4b7c-9122-b52355b68fd7
description: |
  Detects rundll32.exe executed with a command line that does not reference a module through one of the common, expected extension forms (.dll, .cpl, or .inf followed by a separator, quote, or end of line). The rule fires when the process is rundll32 (by image path or original file name) AND the command line is non-empty AND it does not match the known-good extension, -localserver, MSI custom-action, or Edge updater patterns. rundll32 is a trusted, signed Windows binary, so an invocation that maps an uncommonly named module — a file with a .log, .tmp, or no extension, or a script/URL argument — is a proxy-execution attempt to run attacker code under a trusted process and evade extension- or static-based controls. Determine what module or script rundll32 loaded, where it came from, what spawned rundll32, and whether the activity is routine automation or hands-on operator behavior.
type: detection
detection_id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process resolve to rundll32 with a command line that references a module through an uncommon extension?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the image path ends in rundll32.exe or the original file name is RUNDLL32.EXE, the command line is non-empty, and the argument does not end in or contain a common module extension form (.dll, .cpl, .inf with a trailing space, comma, quote, or end of line) and is not a recognized -localserver, MSI custom-action, or Edge updater invocation. Confirm the exact command line that fired references a module with an unusual or missing extension.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run rundll32 against unusually named modules?
  context: Legitimate software occasionally invokes rundll32 with non-standard arguments, but most routine rundll32 use references well-known control-panel applets or system DLLs through their normal extensions. Knowing whether this user role and host function have a reason to load an uncommonly named module is often the fastest way to separate a vendor installer or in-house tool from operator proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did rundll32 load and execute? Decode the full command line, the module path, and any export or script argument.
  context: The full command line reveals the module rundll32 was told to load (its path and extension), the exported entry point invoked, and any script handler such as RunHTMLApplication or Control_RunDLL or a javascript or mshtml protocol argument. Identify the on-disk file referenced so it can be located, and note whether the argument is a local path, a UNC path, or a URL — each points to a different stage to investigate next.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned rundll32, and is that parent chain expected?
  context: The parent process reveals how rundll32 was invoked. Legitimate use typically descends from explorer.exe, a trusted installer, or services.exe. Parents such as winword.exe, excel.exe, mshta.exe, wscript.exe, cscript.exe, or a shell launched from a document suggest a malicious document or macro reached for trusted-binary proxy execution. Walk up the tree to see what spawned the parent and what else that parent launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.011.image_load
  question: What modules did rundll32 map into memory shortly after this execution, and are they normally loaded by rundll32?
  context: rundll32 abuse maps a module into memory that rundll32 does not normally load. Correlating the image-load events on this host immediately around the alert against the rundll32 process surfaces the actual DLL or module that was mapped, including ones referenced through an uncommon extension or copied to a user-writable path. A module that appears only on this host, is unsigned, or loads from outside System32 is the anomaly worth chasing; modules that already account for a stable baseline of prior loads are routine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \rundll32.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1218.011.module_origin
  question: Where on disk did the loaded module or script come from, and when and by what process was it written?
  context: A module loaded by rundll32 through an uncommon extension is often staged just before execution. Pivoting to file-write events for the referenced path shows when the file landed, which process created it, and whether it sits in a user-writable staging directory such as a user profile, Temp, Public, or ProgramData. A file written minutes before the rundll32 invocation by an unrelated process points to a delivery-then-proxy-execute sequence rather than a pre-existing system component.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1218.011.external_retrieval
  question: Did rundll32 make any outbound network connections around the time of the alert?
  context: rundll32 can be directed to fetch and execute externally hosted content (for example a remote scriptlet or HTML application). rundll32 making an outbound connection is unusual for normal control-panel or system-DLL use, so any external destination it contacted in the alert window is worth resolving and reputation-checking. Pair the destination with the decoded command line to confirm whether the argument was a URL or a remote module path.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \rundll32.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.follow_on
  question: What child processes did rundll32 spawn afterward?
  context: The processes spawned after rundll32 reveal the actual impact of the loaded module. Legitimate control-panel or system-DLL invocations rarely spawn children; proxy execution that hands off to cmd.exe, powershell.exe, certutil.exe, or another interpreter indicates post-exploitation follow-on rather than a benign module load. Correlate the timing of any children against the rundll32 invocation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run rundll32 with non-standard module arguments?
  context: Compare this user's current action against their historical pattern. A user who has never invoked rundll32, or only ever does so against well-known control-panel applets, is more suspicious than one whose role routinely involves administrative tooling. User role and typical toolset should align with loading an uncommonly named module.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and rundll32 combination historically routine on this host or across the environment, or is the parent unusual for rundll32?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is which parent process spawned rundll32 and whether that pair is historically common. A new or rare parent for rundll32 on this host, or env-wide, is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar rundll32 activity on several hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and rundll32 combination fire on other hosts in the same window, indicating coordinated automation rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise because every host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus rundll32 — fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, a malicious document opening, or credential access — may reveal the attack stages that preceded the proxy-execution attempt and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If rundll32 was used to run code through a trusted binary, check whether regsvr32, mshta, msbuild, installutil, msiexec, or similar binaries were also used on this host. Multiple proxy-execution utilities performing the same objective strengthens the case for trusted-binary abuse rather than incidental use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was rundll32 executed from its expected system path?
  context: rundll32 executed from outside System32 or SysWOW64 may have been copied or renamed to evade path-based allowlists, or a different binary may have been renamed to rundll32.exe. A rundll32.exe running from a user profile, Temp, or Downloads directory is more suspicious than one in System32. Compare the Image path against OriginalFileName to spot a relocated or renamed copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's rundll32 pattern over the past 90 days, and what command-line shapes are typical?
  context: A rundll32 invocation matching this uncommon-extension pattern with no prior history on a host is more suspicious than one seen regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic use of rundll32. The command-line projection lets the typical invocation shapes be compared against the alerting one — a baseline DLL list emerges from the recurring shapes.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      filter_main_null:
        CommandLine: null
      filter_main_empty:
        CommandLine: ''
      filter_main_known_extension:
      - CommandLine|contains:
        - '.cpl '
        - .cpl,
        - .cpl"
        - .cpl'
        - '.dll '
        - .dll,
        - .dll"
        - .dll'
        - '.inf '
        - .inf,
        - .inf"
        - .inf'
      - CommandLine|endswith:
        - .cpl
        - .dll
        - '.inf'
      filter_main_localserver:
        CommandLine|contains: ' -localserver '
      filter_main_zzzzInvokeManagedCustomActionOutOfProc:
        ParentImage|endswith: \msiexec.exe
        CommandLine|contains|all:
        - :\Windows\Installer\
        - .tmp
        - zzzzInvokeManagedCustomActionOutOfProc
      filter_optional_EdgeUpdate:
        ParentCommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Microsoft\EdgeUpdate\Install\{
        - \EDGEMITMP_
        - .tmp\setup.exe
        - --install-archive=
        - --previous-version=
        - --msedgewebview --verbose-logging --do-not-launch-msedge --user-level
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
