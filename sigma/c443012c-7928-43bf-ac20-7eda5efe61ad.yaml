name: Suspicious Uninstall of Windows Defender Feature via PowerShell
id: 1c15eaa7-0ce8-40fd-ac9a-0d24fd9f72cb
description: |
  Detects PowerShell (powershell.exe, pwsh.exe, or powershell_ise.exe) invoking Uninstall-WindowsFeature or Remove-WindowsFeature with a feature name containing Windows-Defender. The rule fires only when all three conditions match together: a PowerShell image or OriginalFileName, an uninstall/remove cmdlet, and the Windows-Defender feature target. On Server SKUs this removes the Defender component (and, with -Remove, deletes its payload from disk), leaving the host unprotected; it is a defense-evasion step that frequently precedes payload execution, credential access, or ransomware deployment. Legitimate use exists during planned server role changes or maintenance, so the investigation should determine who ran it, under what parent and account, whether it fits prior activity on the host, and what happened on the host afterward.
type: detection
detection_id: c443012c-7928-43bf-ac20-7eda5efe61ad
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show PowerShell removing the Windows-Defender feature?
  context: Confirm the alert is a true positive before investing investigation time. Verify the triggering event shows a PowerShell image (or PowerShell OriginalFileName) running Uninstall-WindowsFeature or Remove-WindowsFeature against a Windows-Defender feature name, since the rule requires all three of those conditions together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to remove the Windows Defender feature?
  context: Removing a server role or feature is legitimate administrative activity during planned maintenance, but Windows-Defender removal specifically warrants confirmation. Knowing whether the account and the host's function are consistent with a planned Defender removal is often the fastest path to distinguishing a true positive from routine operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which Defender feature was targeted, and was the -Remove flag used to delete the payload from disk?
  context: Read the full command line to identify exactly which feature was named (Windows-Defender or Windows-Defender-Features) and whether -Remove was present. -Remove deletes the feature payload from C:\Windows\WinSxS rather than only unselecting it, which prevents reinstallation without source media. -IncludeManagementTools and -ComputerName also change the impact and target scope. The exact target determines remediation priority.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does it decode to?
  context: The cmdlet may be hidden inside an -EncodedCommand (-enc) base64 blob or obfuscated with backticks, string concatenation, or variable substitution so the Uninstall-WindowsFeature call is not visible in plain text. Decode the command line to confirm the actual operation and reveal any additional cmdlets bundled in the same invocation, such as a download cradle or in-memory .NET load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script content?
  context: Event ID 4104 records the deobfuscated script content PowerShell actually executed, even when the command line is encoded or obfuscated. This is ground truth for what ran and may show predecessor cmdlets such as Get-WindowsFeature Windows-Defender that commonly precede the removal. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: attack:T1562.001.registry_tamper
  question: Were Defender-disabling registry changes made on this host around the same time?
  context: Removing the Defender feature is one of several parallel ways to disable protection. Operators frequently also flip Defender policy registry values such as DisableAntiSpyware, DisableRealtimeMonitoring, or TamperProtection. Registry edits to these keys, correlated with the feature removal, indicate a deliberate effort to fully disable protection rather than a single maintenance action.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_keys:
        TargetObject|contains:
          - '\Windows Defender\DisableAntiSpyware'
          - '\Windows Defender\DisableAntiVirus'
          - '\Real-Time Protection\DisableRealtimeMonitoring'
          - '\Real-Time Protection\DisableBehaviorMonitoring'
          - '\Real-Time Protection\DisableOnAccessProtection'
          - '\Features\TamperProtection'
          - '\Windows Defender Security Center'
      condition: selection_host and selection_defender_keys
    fields:
      - TargetObject
      - Details
      - Image
- source: template:defense_tampering.protection_status
  question: Is the Defender feature currently restored, or is the host still unprotected?
  context: The removal may be temporary or persistent. Check the current status of the Defender feature on the host to determine whether it remains absent. If the feature was removed with -Remove, reinstallation requires source media, so the host can stay unprotected long after the alert. A still-unprotected host should be restored before further investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the Defender feature was removed?
  context: Defenses are removed to enable actions that would otherwise be blocked or logged, such as malware execution, credential dumping, or staging for impact. Examining what ran in the window after the removal reveals what the tampering was meant to enable. A burst of process creation immediately after the removal points to the activity it was clearing the way for.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: Operators who disable one control often disable several in the same operation -- stopping AV/EDR services, clearing event logs, deleting shadow copies, or changing firewall configuration alongside removing Defender. Finding multiple tampering events from the same user or parent process indicates a coordinated effort to remove protection broadly rather than an isolated maintenance change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often weaken PowerShell controls before running a payload. Common precursors include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), and PowerShell downgrade to v2 which lacks logging. Finding these in the hour before the Defender removal strengthens the case that the activity was deliberate evasion rather than maintenance.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. A planned removal usually descends from an interactive admin session (explorer.exe, a console host, or a management tool). Unusual parents such as mshta.exe, wscript.exe, a remote-execution service, or an Office application suggest the removal was driven by a script or operator rather than routine administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate feature changes recur on the same host. This query mirrors the rule's exact selection scoped to this host, so the parent/user distribution reflects how this specific firing pattern -- not generic PowerShell use -- has historically run here. A new parent, an unexpected account, or an unusual command shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell_ISE.EXE
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_uninstall:
        CommandLine|contains:
        - Uninstall-WindowsFeature
        - Remove-WindowsFeature
      selection_cli_defender_feature:
        CommandLine|contains: Windows-Defender
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally remove Windows features with PowerShell?
  context: Compare this user's current action against their historical behavior. An account that has never run PowerShell feature-management cmdlets is more suspicious than one that does so regularly. The user's role should align with server feature administration. Zero or very low counts indicate first-time or rare use of this tool by this account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and PowerShell combination historically routine on this host or across the environment, or is the parent unusual?
  context: When the alert fires under a service principal such as SYSTEM or a computer account, user identity does not attribute the behavior. The meaningful pivot is the launch mechanism -- which parent spawned PowerShell, and whether that pair is historically common. A new or rare parent for PowerShell is the deviation worth chasing; a pair already accounting for thousands of prior events is OS or vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or repeated action across endpoints. If the same account drove Defender removal or other tampering on multiple hosts in this window, the scope of the operation is larger than a single server.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and PowerShell combination fire on other hosts in the same window -- a coordinated rollout, or isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism -- parent process plus PowerShell -- fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the Defender-removal pattern rather than generic PowerShell use. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell_ISE.EXE
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_uninstall:
        CommandLine|contains:
        - Uninstall-WindowsFeature
        - Remove-WindowsFeature
      selection_cli_defender_feature:
        CommandLine|contains: Windows-Defender
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, credential access, or other defense tampering -- may reveal the attack stages that preceded the Defender removal and help reconstruct the full timeline. Defense tampering commonly sits in the middle of a chain that ends in impact.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
