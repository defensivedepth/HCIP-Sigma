name: Registry Manipulation via WMI Stdregprov
id: 4a3945e6-722c-4ceb-a69a-94db654d63e1
description: |
  Detects wmic.exe invoked with a command line containing both 'call' and 'stdregprov', which uses the WMI StdRegProv class to read or write the Windows registry instead of reg.exe or regedit.exe. The rule fires when the process image (or OriginalFileName) is wmic.exe AND the command line contains both tokens. StdRegProv can create, enumerate, read, and modify keys and values, so the same pattern covers registry persistence, security-setting tampering, and environmental discovery. Operators choose this path to bypass monitoring focused on traditional registry tools and to retain a working registry interface where reg.exe and regedit are blocked. Investigation should confirm the exact StdRegProv method and target hive/key, attribute the parent and user, and determine whether the change establishes persistence, weakens defenses, or merely queries configuration.
type: detection
detection_id: c453ab7a-1f5c-4716-a3b4-dea8135fb43a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show wmic.exe calling the StdRegProv class with both 'call' and 'stdregprov' present?
  context: Confirm the alert is a true positive by reviewing the full command line and process image against the rule's criteria. The rule fires only when the image (or OriginalFileName) is wmic.exe AND the command line contains both 'call' and 'stdregprov'. Read the StdRegProv method (CreateKey, SetStringValue, SetDWORDValue, DeleteKey, EnumKey, EnumValues, GetStringValue) to tell a write/persistence action apart from a read/discovery one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:parent_child.parent_process_legitimacy
  question: What spawned this wmic.exe process, and what started that parent?
  context: The parent of wmic.exe is the core attribution signal. A user-driven console (explorer.exe to cmd.exe) or a known management agent is routine; script hosts (wscript.exe, cscript.exe, mshta.exe), Office applications, or wmiprvse.exe driving wmic indicate macro or remote-execution origin. Tracing the parent's own origin shows whether the chain is interactive or automated.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn around this time?
  context: If the parent that launched wmic.exe is suspicious, it likely launched other processes too. Multiple children from the same parent in a tight window points to scripted orchestration rather than a one-off administrative command. Host scope is included as a fallback because the parent identifier can resolve to NODATA.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:organizational_context.change_ticket
  question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: Many organizations require change records for registry and configuration changes, especially those affecting persistence or security settings. A corresponding ticket suggests authorized maintenance; absence of one where policy requires it shifts the disposition toward unauthorized activity and can quickly close or escalate the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:organizational_context.timing_alignment
  question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate registry changes usually occur during business hours or scheduled maintenance. A StdRegProv write at an unusual hour, on a host whose local time makes the activity implausible, or outside any documented window is more suspicious than the same action during a planned change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:registry.registry_key_context
  question: Which StdRegProv method and target hive and key were used, and is that location a known persistence or evasion spot?
  context: The hDefKey code and subkey path reveal intent. HKLM or HKCU Run/RunOnce keys indicate persistence; keys under Windows Defender or Terminal Server policy (for example fDenyTSConnections, scforceoption) indicate security-setting tampering; reads via GetStringValue or EnumValues indicate environmental discovery. Because the write is performed by the WMI provider host rather than wmic itself, a registry_set event keyed to this process may not exist; if it is absent, parse the hDefKey, sSubKeyName, sValueName, and value arguments directly from the alerting command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the surrounding window?
  context: Operators who change one key often change several -- setting a Run key for persistence while also disabling a security control. This surfaces nearby registry writes through the traditional tools (reg.exe, regedit.exe) so the analyst can see whether the StdRegProv change was part of a broader cluster of configuration changes pursuing multiple objectives.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery action may be troubleshooting, but several reconnaissance commands in rapid succession -- whoami, ipconfig, net user, systeminfo -- is a signature of post-compromise enumeration. StdRegProv reads are themselves a discovery method, so co-occurring native recon binaries strengthen the case that an operator is profiling the host before the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to administer the registry or run WMI management commands?
  context: Administrators and IT staff legitimately read and write registry settings and use WMI for management. Standard users rarely invoke wmic StdRegProv. The user's role and typical toolset determine whether driving registry changes through WMI is routine or anomalous; a non-admin account using this path is a strong escalation signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - stdregprov
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - stdregprov
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: After identifying the actor, check their activity across all hosts in the window. The same user driving similar activity on multiple endpoints points to lateral movement and a larger scope of compromise. This is distinct from the historical baseline -- it asks what the actor did right now, network-wide.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - stdregprov
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the attack stages that preceded this registry activity and help correlate the WMI registry change with nearby execution within the same timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.renamed_binary_check
  question: Was wmic.exe executed from its expected System32 path?
  context: wmic.exe normally runs from C:\Windows\System32\wbem\wmic.exe. A copy running from a user-writable or temp directory may indicate the binary was relocated or renamed to evade path-based allowlists. Comparing the Image path against OriginalFileName confirms whether this is the genuine in-place binary or a relocated copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the wmic StdRegProv pattern over the past 90 days, and what command-line structures are typical?
  context: A WMIC StdRegProv pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection scoped to this host, so the count reflects the rule's specific firing pattern rather than generic wmic.exe usage. The command-line projection lets the analyst compare typical invocation patterns -- which hives and keys are normally touched -- against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - call
        - stdregprov
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
