  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'create_stream_hash' (recommended by techniques: T1574.005) is not covered and no template family exists — author a custom question with `category: create_stream_hash`"
      disposition: declined
      reason: >-
        SharpUp is a read-only enumeration tool that reports findings without writing files or alternate data streams, so create_stream_hash (Sysmon EID 15) produces nothing for the tool's own behavior. Any payload the operator subsequently drops into a flagged writable directory is captured by the file_event query in hacking_tool.tool_specific_artifacts (Q15). No compensating create_stream_hash question authored.
    - hint: "logsource 'network_connection' (recommended by techniques: T1569.002) is not covered — pull in cue_network_endpoint.* or author a custom question with `category: network_connection`"
      disposition: declined
      reason: >-
        SharpUp performs purely local enumeration of services, scheduled tasks, registry, and files; it makes no network connections, so a network_connection query for the alerting process returns nothing meaningful. T1569.002's network analytic concerns service-execution-driven C2, which this read-only tool does not exhibit. cue_process_tool.follow_on (Q9) surfaces any network-capable child process if the operator pivots. No compensating network_connection question authored.
    - hint: "logsource 'registry_set' (recommended by techniques: T1569.002) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        SharpUp reads service and autorun registry keys to find weaknesses; it does not modify them, so registry_set (Sysmon EID 13/14) captures no activity from the tool itself. The detection fires on the enumeration tool, not on service-key modification. cue_process_tool.follow_on (Q9) and cue_host_context.clustering (Q16) surface any subsequent service-config change tool the operator runs. No compensating registry_set question authored.
    - hint: "logsource 'security' (recommended by techniques: T1615,T1569.002) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The recommended Security-channel events are 4661 (GPO object access) and 4697 (service installation). SharpUp enumerates locally and creates no service (no 4697), and its GPP-password checks read SYSVOL/local cache rather than generating reliable 4661 object-access audit events. No template family exists for this category. cue_host_context.precursor (Q17) covers prior alert context on the host. No compensating security-log question authored.
