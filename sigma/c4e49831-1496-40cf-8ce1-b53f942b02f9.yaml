name: Renamed PAExec Execution
id: bc5a90ec-d908-42e1-b622-d1129ea1c296
description: |
  Detects a process that carries PAExec's PE metadata (OriginalFileName, Description, Product) or one of its known import hashes while running from a filename or path other than the canonical PAExec install location. PAExec is a redistributable PsExec equivalent that installs a temporary remote service over SMB and runs commands on remote hosts, often as SYSTEM; renaming or relocating it is common tradecraft to evade name-based blocking while keeping the remote-execution capability. Investigation should confirm the metadata/hash match, identify what the tool was directed to do, and determine whether this is sanctioned administration or hands-on-keyboard lateral movement.
type: detection
detection_id: c4e49831-1496-40cf-8ce1-b53f942b02f9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does this process carry PAExec PE metadata or a known PAExec import hash while running from a non-canonical PAExec path?
  context: >-
    The rule fires when a process matches PAExec by OriginalFileName, Description, Product, or import hash AND is not running from a canonical PAExec location (filename ending in paexec.exe, or a path under the auto-copied C:\Windows\PAExec- prefix). Confirm the metadata and hash on the triggering event and note the actual Image path; a match outside the canonical location is the renamed/relocated condition the rule targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Description
      - Hashes
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run a remote-execution administration tool like PAExec?
  context: PAExec is legitimately used by administrators and is sometimes bundled and renamed by software vendors. Knowing whether this user role and host function normally perform remote command execution is often the fastest way to separate sanctioned administration from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: When PAExec is renamed, the on-disk Image name differs but the embedded PE metadata (OriginalFileName PAExec.exe, Product PAExec) and import hash still reveal the original tool. Compare the Image path against OriginalFileName to confirm the rename, and submit the hash for reputation lookup to distinguish a redistributed vendor copy from a known-abused or novel sample.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: What did this PAExec invocation do? Decode the command line, including any remote target, credential, and run-as flags.
  context: >-
    The command line reveals the operation. Look for a remote target (\\host or \\* wildcard for all domain computers), the -s flag (run as SYSTEM), -u/-p (alternate credentials), -c (copy program to remote), -i (interactive), and the spawned command. PAExec-only flags (-cnodel, -clist, -csrc, -p@, -p@d, -rlo, -lo, -dfr) do not exist in PsExec and are a strong signal when seen. The host+binary scope over a short window captures sequential invocations that form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this renamed PAExec, and is that parent chain expected?
  context: The parent process shows how the tool was launched. Interactive launches from explorer.exe or a shell suggest hands-on use; a service, scripting host, or remote-access parent points to automation or remote operation. Walk up the parent chain if the immediate parent is itself unexpected.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What child processes did this renamed PAExec spawn after execution?
  context: >-
    The point of renaming the tool is to keep its capability while evading name-based blocking. Child processes spawned by the renamed binary reveal the actual objective. High-risk children such as cmd.exe, powershell.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe, curl.exe, or bitsadmin.exe indicate the tool was used to launch a payload or follow-on command rather than a benign administrative task.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1202.network_transfer
  question: Did this renamed PAExec open outbound connections, and where to?
  context: >-
    PAExec reaches remote hosts over SMB to the ADMIN$ and IPC$ shares to install a temporary service and run the command, leaving an outbound connection footprint from the tool. Egress to internal hosts on SMB (445) is consistent with remote administration or lateral movement; egress outside known-good administration networks, or to external addresses, raises severity. Compare the destinations against expected administration egress ranges for this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- source: template:masquerading.binary_origin
  question: How did this renamed PAExec binary arrive on the host?
  context: >-
    A renamed binary was copied, downloaded, or dropped by some process. Matching the file creation event by basename over a long window reveals the delivery mechanism: a download tool, an archive extraction, a manual copy, or a push from another host. The creating process (Image on the file event) identifies the dropper, installer, or copy operation. A user-writable landing location (Downloads, Temp, AppData) points to download or extraction.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline
  question: Does this host normally run a binary with PAExec's metadata?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the baseline window indicate first-time or rare execution of this tool on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern (renamed PAExec, not generic binary usage) has historically run here. A new parent process, an unexpected user account, or an unusual launch shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PAExec Application
      - OriginalFileName: PAExec.exe
      - Product|contains: PAExec
      - Hashes|contains:
        - IMPHASH=11D40A7B7876288F919AB819CC2D9802
        - IMPHASH=6444f8a34e99b8f7d9647de66aabe516
        - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f
        - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c
      filter_main_known_location:
      - Image|endswith: \paexec.exe
      - Image|startswith: C:\Windows\PAExec-
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the renamed-PAExec firing pattern rather than generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PAExec Application
      - OriginalFileName: PAExec.exe
      - Product|contains: PAExec
      - Hashes|contains:
        - IMPHASH=11D40A7B7876288F919AB819CC2D9802
        - IMPHASH=6444f8a34e99b8f7d9647de66aabe516
        - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f
        - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c
      filter_main_known_location:
      - Image|endswith: \paexec.exe
      - Image|startswith: C:\Windows\PAExec-
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run remote-execution tools like PAExec?
  context: Compare this user's current action against their historical behavior. A user who has never run this tool is more suspicious than one who does so regularly, and the user's role should align with performing remote administration. This user-identity pivot degenerates when the alert fires under a service or computer account, so it is paired with a launch-mechanism view.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: 'When the alert fires under a service or computer account, user identity does not attribute behavior; the meaningful pivot is the launch mechanism. A new or rare parent for this binary is the deviation worth chasing, while a parent that already accounts for many prior events is vendor or operating-system automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity spanning multiple endpoints. The same user driving similar activity on several hosts widens the potential scope. This pivot returns agent-telemetry noise under a service account, so it is paired with a launch-mechanism view.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window — a coordinated automation rollout, or isolated to this host?
  context: Under a service account the user-pivot returns constant agent telemetry, so the meaningful question is whether the same launch mechanism — parent process plus spawned binary — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Novel parent-child pairs at low counts are what to scan for; high-count rows are usually routine agent and operating-system activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: 'Earlier detections on the same host may reveal the stages that preceded this event. Look for patterns: reconnaissance followed by execution, defense tampering followed by lateral movement, or credential access followed by remote command execution. The alert timeline helps reconstruct the operation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Operators often weaken AV/EDR before running a remote-execution tool that drops a SYSTEM-context shell. The query surfaces attempts to disable protection services, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful healthy signal; kernel-driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation — review the parent process and signing chain of the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
