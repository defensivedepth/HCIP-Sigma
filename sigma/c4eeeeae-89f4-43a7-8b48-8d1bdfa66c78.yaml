  - hint: "registry.registry_key_context replaces cue_process_tool.mechanism_decode"
    disposition: declined
    reason: >-
      Two templates were offered to replace mechanism_decode; scheduled_task.task_configuration
      (Q4) was selected as the Phase 2 decode because the rule fires on schtasks /Create. registry_key_context
      targets a registry_set event, but this rule reads the registry value via PowerShell Get-ItemProperty
      inside the task action and never writes a registry_set event, so that lookup would return nothing.
      The registry value being read is analyzed in powershell.encoded_command_decode (Q5).
  - hint: "logsource 'image_load' (recommended by techniques: T1059.001) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
    disposition: declined
    reason: >-
      The rule fires at task-creation time on the schtasks /Create command line, before the PowerShell
      payload executes. image_load (Sysmon EID 7, .NET assembly loads) describes the eventual in-memory
      execution that happens only when the task later triggers; that downstream execution is captured by
      scheduled_task.task_trigger_and_timing (Q8) which scopes to Task Scheduler children, and the decoded
      payload itself is analyzed in Q5/Q6. No compensating attack:T1059.001.image_load question authored
      because no .NET load occurs at the moment this rule fires.
