name: Data Export From MSSQL Table Via BCP.EXE
id: 0c722379-e393-4200-b85e-7a02cb23597b
description: |
  Detects the SQL Server bulk-copy utility (bcp.exe, by Image name or OriginalFileName) running with an "out" or "queryout" argument, which exports table contents or arbitrary query results from a database to a file on disk. Both conditions must match. Legitimately this performs large-scale data export and migration; abusively, operators stage attacker-supplied binaries that were stored as rows in a SQL table and materialize them to disk with queryout, or bulk-export sensitive table data for theft. Investigation should confirm the export direction and output path, identify the parent chain that invoked bcp, determine what data or file was written and where it went next, and judge whether the user, host, and SQL service context make this a routine export or operator activity.
type: detection
detection_id: c615d676-f655-46b9-b913-78729021e5d7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does this bcp command line export data with an "out" or "queryout" argument, and is the binary bcp.exe?
  context: >-
    The rule fires when the process is bcp.exe (by Image name or OriginalFileName) AND the command line contains " out " or " queryout ". Confirm both on the triggering event: read the full command line, note whether the direction is out (table to file) or queryout (arbitrary query result to file), and capture the output file path. queryout against an attacker-populated table is the direction most associated with staging dropped payloads.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user, host, and service account expected to run bulk data exports with bcp?
  context: Routine bcp use is concentrated on database hosts and runs under DBA accounts or the SQL Server service account during migrations, reporting, or backups. When the export runs under the SQL Server service context, it is frequently invoked through a command shell launched by the SQL engine rather than by an interactive DBA, which is the pattern operators reach through after enabling command execution on a compromised server. Knowing whether this user role and host function normally perform bulk exports is often the fastest way to separate a sanctioned export from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this bcp invocation export? Decode the table or query, the output path, and the connection and format flags.
  context: >-
    The full command line reveals the operation. Identify the source — a table or view name, or a quoted SELECT statement for queryout — and the output file path and extension; an .exe, .bat, .ps1, or .dll written to a user-writable location such as C:\Users\Public or C:\ProgramData points to payload staging rather than data export. Note the connection and format flags: -T uses the calling token (the SQL service account under xp_cmdshell), -S selects the server, -f references a pre-staged format file, and -c or -n set character or native mode. The host-and-binary scope over a short window captures sequential bcp calls that together form one export operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:data_staging_exfil.data_scope
  question: What database table, query, or output file did this bcp command target?
  context: >-
    The command-line arguments reveal what data was exported and where it landed. For out, the source is a table or view; for queryout, it is a quoted SELECT that can pull binary columns. The output path and extension determine the nature of the activity — a sensitive table exported to a share is potential data theft, while a binary written to C:\Users\Public or C:\ProgramData is consistent with materializing an attacker-staged file from a SQL row. The scope of targeted data and the destination directory determine severity and which business units may need notification.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:data_staging_exfil.archive_destination
  question: What file did bcp write, and where was it moved or executed after creation?
  context: An export creates a file locally; the next step reveals intent. Check file events for the bcp output file and any subsequent move or copy, and check whether a file written to a user-writable directory was later executed. A bulk-exported data file copied to a staging share or uploaded over the network points to data theft, while a dropped executable or script that is run shortly after points to payload staging. Pair this with the host-activity and child-process views to see whether the written file was launched.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1048.network_transfer
  question: Did this host open unusual outbound connections around the export, and do the volume, protocol, or destination look like exfiltration?
  context: Bulk export is often a precursor to moving data off the host over an alternative protocol — FTP, SMB, SMTP, or DNS — or to an external address, frequently in a single high-volume connection or during off-hours. Compare destinations against expected egress ranges for this host and allow-listed transfer protocols (for example FTP permitted only for backups); a large outbound transfer to an unfamiliar destination shortly after the export raises severity. Exclude known-good system and update processes when reviewing the results.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known_good:
        Image|endswith:
          - \svchost.exe
          - \MsMpEng.exe
      condition: selection and not filter_known_good
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- source: template:cue_process_tool.process_chain
  question: What process spawned bcp, and is that parent chain expected?
  context: The parent process shows how bcp was invoked and is the deviation worth chasing for this technique. A DBA tool, a scheduled migration job, or an ETL service is consistent with routine export. A command shell that was itself spawned by the SQL Server engine (sqlservr.exe to cmd.exe to bcp.exe) is the pattern operators reach through after enabling command execution on a compromised server, and an anomalous parent such as a script host or office application points to exploitation. Walk up the parent chain if the immediate parent is itself unexpected.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did bcp spawn afterward?
  context: bcp performing a legitimate export normally spawns no children. Children spawned in the same window — cmd.exe, powershell.exe, or a freshly written executable from a user-writable path — indicate that the exported file was launched or that the same operator continued into post-exploitation. An executed drop is a stronger signal than an export alone.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run bcp?
  context: A binary that has never run on a host is more suspicious than one that runs regularly. Zero or very low counts over the baseline window indicate first-time or rare bcp use here; database hosts that perform scheduled exports will show steady prior activity, while bcp appearing for the first time on a server points to operator-introduced execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run bcp exports, what parents and users normally drive them, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific export pattern (bcp with out/queryout, not generic bcp usage) has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcp.exe
      - OriginalFileName: BCP.exe
      selection_cli:
        CommandLine|contains:
        - ' out '
        - ' queryout '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts run bcp exports in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the export pattern (bcp with out/queryout) rather than generic usage of the binary. Many hosts firing the same pattern points to scheduled migration or reporting automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcp.exe
      - OriginalFileName: BCP.exe
      selection_cli:
        CommandLine|contains:
        - ' out '
        - ' queryout '
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcp.exe
      - OriginalFileName: BCP.exe
      selection_cli:
        CommandLine|contains:
        - ' out '
        - ' queryout '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcp.exe
      - OriginalFileName: BCP.exe
      selection_cli:
        CommandLine|contains:
        - ' out '
        - ' queryout '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity spanning multiple endpoints. The same user driving similar activity on several hosts widens the potential scope. This pivot returns agent-telemetry noise under the SQL service account or another service principal, so it is paired with a launch-mechanism view.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcp.exe
      - OriginalFileName: BCP.exe
      selection_cli:
        CommandLine|contains:
        - ' out '
        - ' queryout '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the export reveals the immediate context: reconnaissance, account creation, or service installation that often surrounds payload staging, and what happened before and after. Novel parent-child pairs at low counts are what to scan for; high-count rows are usually routine agent and operating-system activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: 'Earlier detections on the same host may reveal the stages that preceded this export. Look for patterns: command-execution enablement on a database server followed by file staging, reconnaissance followed by data collection, or defense tampering followed by payload execution. The alert timeline helps reconstruct the operation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Operators staging payloads from a SQL table frequently weaken protection first so the dropped executable runs and the export is not inspected. The query surfaces attempts to disable AV/EDR services, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful healthy signal; kernel-driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation — review the parent process and signing chain of the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
