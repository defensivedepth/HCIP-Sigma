name: Permission Check Via Accesschk.EXE
id: d953282e-e9bc-4eb2-b2ad-442a9f807300
description: |
  Detects use of the Sysinternals AccessChk utility with command-line switch combinations that report effective permissions on objects (the rule fires when the binary is identified as accesschk AND the command line contains one of the audit switch bundles uwcqv, kwsu, qwsu, or uwdqs). AccessChk is a legitimate administration and audit tool, but the same switches enumerate writable service registry keys, weak service DACLs, and modifiable service binaries that lead directly into privilege escalation. Determine whether the run is an administrator or audit-tool baseline activity, or an operator enumerating permission weaknesses ahead of escalation or lateral movement.
type: detection
detection_id: c625d754-6a3d-4f65-9c9a-536aea960d37
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match accesschk run with one of the effective-permissions audit switches?
  context: Confirm the alert is a true positive before investing time. The rule requires both that the binary be identified as accesschk (by Image name, OriginalFileName, Product, or Description) and that the command line contain one of the permission-audit switch bundles. Review the exact command line and verify the switches present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
      - Product
- source: template:cue_process_tool.mechanism_decode
  question: What did this accesschk run enumerate? Decode the switch bundle and the target object.
  context: The switch bundles the rule fires on each request effective-permissions output for specific access classes. Decode the full command line to identify what object was queried (a service, registry key, file, or directory) and which rights were checked. The same switches are used to find writable service registry keys, weak service DACLs, and modifiable service binaries, so the target argument tells you whether the run targeted a service-escalation path or a benign audit scope.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1069.001.process_identification
  question: Is the alerting binary genuinely AccessChk, or a renamed or masqueraded copy?
  context: The rule confirms accesschk through several independent fields (Image name ending in accesschk.exe or accesschk64.exe, OriginalFileName, Product ending in AccessChk, Description containing "Reports effective permissions"). Compare those fields against each other and against the on-disk path and signature. A file renamed to accesschk.exe but with a mismatched OriginalFileName or unsigned Authenticode chain, or a genuine accesschk dropped into a user-writable directory, points to deliberate tool staging rather than installed administrative tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Product
      - Description
      - Hashes
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned accesschk, and is that parent chain expected?
  context: Legitimate audit runs are typically launched from an interactive shell (cmd.exe or powershell.exe spawned by explorer.exe) or from a known management or audit script. A parent such as an Office application, a script interpreter (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe, or wsmprovhost.exe indicates the permission check was driven by macro or remote execution rather than an administrator at the keyboard.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run permission-audit tooling on this host?
  context: Administrators and audit staff legitimately run AccessChk to review effective permissions. Standard users and service accounts rarely have a reason to enumerate object permissions. The user's role and typical toolset determine whether this run is routine audit work or anomalous enumeration; a non-admin or unexpected service principal running the permission-audit switches is the deviation worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single permission check may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession is a signature of post-compromise enumeration. Permission enumeration commonly runs alongside service, group, and account discovery as an operator maps escalation paths before the next stage. Three or more distinct recon binaries within the window typically indicates automated reconnaissance.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline
  question: Does this host normally run accesschk?
  context: A binary that has never run on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the baseline window indicate first-time or rare execution; a steady prior count points to installed audit tooling or a recurring administrative job.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate audit tools get abused. This query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how the rule's specific firing pattern (not generic accesschk usage) has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Product|endswith: AccessChk
      - Description|contains: Reports effective permissions
      - Image|endswith:
        - \accesschk.exe
        - \accesschk64.exe
      - OriginalFileName: accesschk.exe
      selection_cli:
        CommandLine|contains:
        - 'uwcqv '
        - 'kwsu '
        - 'qwsu '
        - 'uwdqs '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did accesschk spawn afterward?
  context: AccessChk itself reports permissions and does not normally spawn children. Processes launched by the same binary after the alert can reveal the next escalation stage, such as sc.exe or reg.exe reconfiguring a weak service, or a shell or script interpreter acting on the enumerated permission weakness.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic accesschk usage. Many hosts firing the same pattern points to scripted audit deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Product|endswith: AccessChk
      - Description|contains: Reports effective permissions
      - Image|endswith:
        - \accesschk.exe
        - \accesschk64.exe
      - OriginalFileName: accesschk.exe
      selection_cli:
        CommandLine|contains:
        - 'uwcqv '
        - 'kwsu '
        - 'qwsu '
        - 'uwdqs '
      condition: all of selection*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Product|endswith: AccessChk
      - Description|contains: Reports effective permissions
      - Image|endswith:
        - \accesschk.exe
        - \accesschk64.exe
      - OriginalFileName: accesschk.exe
      selection_cli:
        CommandLine|contains:
        - 'uwcqv '
        - 'kwsu '
        - 'qwsu '
        - 'uwdqs '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Product|endswith: AccessChk
      - Description|contains: Reports effective permissions
      - Image|endswith:
        - \accesschk.exe
        - \accesschk64.exe
      - OriginalFileName: accesschk.exe
      selection_cli:
        CommandLine|contains:
        - 'uwcqv '
        - 'kwsu '
        - 'qwsu '
        - 'uwdqs '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration spread across multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Product|endswith: AccessChk
      - Description|contains: Reports effective permissions
      - Image|endswith:
        - \accesschk.exe
        - \accesschk64.exe
      - OriginalFileName: accesschk.exe
      selection_cli:
        CommandLine|contains:
        - 'uwcqv '
        - 'kwsu '
        - 'qwsu '
        - 'uwdqs '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for additional reconnaissance, service reconfiguration, or persistence mechanisms surrounding the permission check.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host (defense tampering, reconnaissance, credential access) may reveal the attack stages that preceded the permission check and help reconstruct the full timeline. Permission enumeration ahead of privilege escalation often follows earlier discovery or access activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
