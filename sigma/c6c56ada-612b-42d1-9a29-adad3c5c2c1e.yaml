name: Audit Policy Tampering Via NT Resource Kit Auditpol
id: 475929da-850a-4abb-963d-a6693c37d3a3
description: |
  Detects use of the legacy NT Resource Kit auditpol utility to selectively turn off audit policy categories
  (logon, system, sam, privilege, object, process, policy) by setting them to none, which suppresses the
  generation of corresponding Security events and blinds downstream detection. The rule fires when a command
  line contains one of the category-disabling switches. Legitimate use is rare on modern Windows because the
  built-in auditpol replaced this older binary; the most common benign cause is a tool that happens to use a
  similar flag structure. The investigation should confirm which audit categories were disabled, whether the
  change is still in effect, and what activity followed once auditing was suppressed.
type: detection
detection_id: c6c56ada-612b-42d1-9a29-adad3c5c2c1e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line set one or more audit policy categories to none, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command
    line. The rule fires on category-disabling switches such as /logon:none, /system:none, /sam:none, /privilege:none,
    /object:none, /process:none, and /policy:none. Confirm at least one of these is present and read which categories
    are being turned off.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to change audit policy configuration?
  context: Legitimate audit policy changes are normally made by administrators or configuration-management tooling,
    not by ordinary user accounts or unexpected hosts. Knowing whether the acting user's role and the host's function
    are consistent with audit policy administration is often the fastest path to separating a true positive from a
    sanctioned configuration change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which specific audit policy categories were turned off by this command?
  context: Each category-disabling switch suppresses a different class of Security events. /logon:none stops logon
    auditing, /privilege:none stops privilege-use auditing, /object:none stops object-access auditing, and so on.
    Read the full command line and enumerate every category set to none, because the set of disabled categories
    determines which evidence will be missing for the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1562.002.audit_policy_change_events
  question: Does the Security log show an audit policy change or audit log clear on this host around the alert time?
  context: Audit policy modifications are recorded in the Security channel under event 4719 (system audit policy
    changed), and a deliberate clearing of the Security log is recorded under event 1102. A corroborating 4719 in
    the same window confirms the policy change actually took effect, and an accompanying 1102 indicates the operator
    also destroyed existing evidence. If Security audit logging is not collected in this environment, treat zero
    results as a visibility gap rather than evidence nothing changed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4719
          - 1102
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - AuditPolicyChanges
- source: attack:T1562.002.eventlog_service_registry
  question: Were EventLog or Autologger registry keys modified on this host around the alert time?
  context: Suppressing audit data can be reinforced at the registry level. Edits under the EventLog service keys or
    the Autologger trace-session keys disable channels, shrink retention, or stop event collection so that even
    categories still set to audit produce no usable record. Value changes on these keys in the same window indicate
    the audit suppression went beyond the policy switch and altered logging infrastructure directly.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_eventlog_keys:
        TargetObject|contains:
          - '\Services\EventLog\'
          - '\Control\WMI\Autologger\'
          - '\Microsoft\Windows\EventLog\'
      condition: selection and selection_eventlog_keys
    fields:
      - TargetObject
      - Details
      - Image
- source: template:defense_tampering.protection_status
  question: Is auditing for the disabled categories currently restored, or are those categories still set to none?
  context: The tampering may have been temporary, scoped to a specific action, or left in place persistently. Checking
    the current effective audit configuration reveals whether the host is still blind for the disabled categories. If
    logon, privilege, or object auditing is still off, that auditing should be restored before further investigation
    so subsequent activity is captured.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after auditing was disabled?
  context: Auditing is typically disabled to make a subsequent action invisible. Examining process activity in the
    window immediately after the policy change reveals what the suppression was meant to hide, such as credential
    access, lateral movement, or payload execution. A gap in expected audit events followed by process creation in
    that window points to the activity the tampering enabled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: An operator who disables audit categories often disables several controls in the same operation, for
    example stopping the EventLog service, clearing logs, or turning off Defender. Finding additional tampering events
    from the same user or parent process indicates multiple controls were targeted together rather than an isolated
    configuration change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the audit-disable pattern, what parents and users drove it, and does
    this alert fit that pattern?
  context: Even legitimate audit policy management leaves a baseline. The query mirrors the rule's category-disabling
    switches scoped to this host, so the resulting parent and user distribution reflects how this specific firing
    pattern has historically run here. A new parent process, an unexpected user account, or a first-time appearance
    of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - /logon:none
        - /system:none
        - /sam:none
        - /privilege:none
        - /object:none
        - /process:none
        - /policy:none
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - /logon:none
        - /system:none
        - /sam:none
        - /privilege:none
        - /object:none
        - /process:none
        - /policy:none
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - /logon:none
        - /system:none
        - /sam:none
        - /privilege:none
        - /object:none
        - /process:none
        - /policy:none
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across
    multiple endpoints. If the same user disabled auditing or ran related tooling on multiple hosts, the scope of the
    operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - /logon:none
        - /system:none
        - /sam:none
        - /privilege:none
        - /object:none
        - /process:none
        - /policy:none
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the alert reveals what led to the
    event and what happened afterward, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as reconnaissance, credential access, or other defense tampering,
    may reveal the attack stages that preceded the audit policy change and help reconstruct the timeline. Audit
    suppression late in a chain often follows the activity the operator wanted to hide.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired the audit-disable pattern in the past week, and does the cross-host distribution
    look like automation or one-off activity?
  context: The query mirrors the rule's category-disabling switches with no host scope, so the result is a fleet-wide
    count of this firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted
    deployment or configuration-management automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - /logon:none
        - /system:none
        - /sam:none
        - /privilege:none
        - /object:none
        - /process:none
        - /policy:none
      condition: selection
    fields:
    - host.name
- source: template:persistence_scope.process_based_persistence
  question: Were other process-based persistence mechanisms installed on this host?
  context: Operators rarely rely on a single foothold. After suppressing auditing, they commonly install persistence
    using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence
    installations in the same timeframe indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
