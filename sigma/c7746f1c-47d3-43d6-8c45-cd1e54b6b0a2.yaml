name: Kernel Memory Dump Via LiveKD
id: 53e80d46-16ce-44e1-95ab-688c1393004c
description: |
  Detects execution of LiveKD (livekd.exe / livekd64.exe, or a renamed binary whose OriginalFileName is livekd.exe)
  with the "-m" mirror-dump flag, which writes a consistent snapshot of kernel-mode memory to disk without crashing
  the host. The rule fires when the LiveKD image (or its original filename) AND the "-m" command-line flag both match.
  Legitimately, support and IR engineers use LiveKD with the Microsoft kernel debuggers to capture a live memory dump
  for troubleshooting; the same workflow lets an operator harvest a full kernel image — which contains credential
  structures and cached secrets — silently and without touching LSASS directly. Determine whether the invocation is
  expected administrative or debugging activity, what was dumped and where it was written, and whether surrounding
  activity points to credential access or collection.
type: detection
detection_id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — a LiveKD invocation carrying the "-m" mirror-dump flag?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both the
    image (or original filename) resolves to LiveKD and the command line carries the "-m" flag (windash-normalized, so
    "/m" and "-m" both match). Read the full command line and process details against those two criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run kernel memory-dumping or live-debugging tools?
  context: Legitimate administrative or support activity can trigger this detection. LiveKD requires kernel/admin rights
    and the Microsoft Debugging Tools; routine use is limited to a small set of support, IR, or debugging staff on
    specific hosts. Knowing whether this user role and host function are consistent with live kernel debugging is often
    the fastest path to distinguishing a sanctioned dump from an operator harvesting memory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this LiveKD invocation do — decode the full command line, including the dump flag mask and
    any output-file path?
  context: The full command line reveals what was actually dumped. The "-m" flag takes an optional region mask (default
    0x18F8 — paged/non-paged pool, system PTEs, session/driver pages, kernel stacks); "-mp <pid>" also includes one
    process's user-mode memory; "-o <file>" writes memory.dmp to disk instead of launching the debugger. Identify the
    mask, whether "-o" was present, and the destination path — an output file means a dump now exists on disk and is the
    artifact to locate and preserve.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned LiveKD and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Legitimate use is typically driven from an elevated,
    interactive shell (cmd.exe or powershell.exe launched by a console host or explorer.exe). Parents such as a remote
    shell, a service, a scripting host (wscript.exe, mshta.exe), or an Office application point to scripted or remote
    operator activity rather than hands-on troubleshooting.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did LiveKD spawn afterward?
  context: LiveKD wraps the Microsoft kernel debuggers, so a legitimate live-debug session normally spawns kd.exe or
    windbg.exe. A child kd.exe/windbg.exe opening a dump with "-z", or compression/archival and copy/exfil tooling
    spawned shortly after, indicates the dump is being processed or moved. Unexpected children point to post-dump
    handling of the captured memory image.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run LiveKD?
  context: A kernel-dumping tool that has never been seen on a host is more suspicious than one that runs on a routine
    debugging cadence. Zero or very low historical counts indicate first-time or rare execution; a steady prior count
    suggests this host is a known debugging or support endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity,
    and does the current alert fit that pattern?
  context: Even sanctioned tools get abused. This query mirrors the rule's selection (LiveKD image or original filename
    AND the "-m" flag) scoped to this host, so the resulting parent/user distribution reflects how the rule's specific
    firing pattern — not generic LiveKD usage — has historically run here. A new parent process, an unexpected user
    account, or an unusual command-line shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \livekd.exe
        - \livekd64.exe
      - OriginalFileName: livekd.exe
      selection_cli:
        CommandLine|contains|windash: ' -m'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run kernel memory-dumping tools across the environment?
  context: Compare this user's current action against their historical behavior. A user who has never run LiveKD is more
    suspicious than one who does so regularly as part of a support or debugging role. The query counts this user's LiveKD
    executions across all hosts over 90 days; combine the result with what the user's role is expected to cover.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+binary combination historically routine on this host or across the environment, or is the
    parent unusual for LiveKD?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The meaningful
    pivot is the launch mechanism — which parent process spawned LiveKD, and whether that pair is historically common. A
    new or rare parent for LiveKD on this host or environment-wide is the deviation worth chasing; a pair that already
    accounts for many prior events is more likely scheduled support or vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging on multiple endpoints. If the
    same user ran similar tooling on other hosts in this window, the scope of the memory-collection activity may be larger
    than this single dump.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+binary combination fire on other hosts in the same window — a coordinated rollout, or
    activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since
    every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent
    process plus LiveKD — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled
    or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the dump reveals the immediate context: what led
    to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, archival of the dump, or staging for exfiltration.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: This query mirrors the rule's selection (LiveKD image or original filename AND the "-m" flag) with no host
    scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic LiveKD usage. Many hosts
    firing the same pattern points to scripted deployment or sanctioned debugging automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \livekd.exe
        - \livekd64.exe
      - OriginalFileName: livekd.exe
      selection_cli:
        CommandLine|contains|windash: ' -m'
      condition: all of selection_*
    fields:
    - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Operators often weaken AV/EDR before harvesting credential material. The query surfaces direct attempts to
    disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a
    useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here.
    Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to
    identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, privilege escalation, or credential
    access — may reveal the stages that preceded the memory dump and help reconstruct the timeline. A kernel dump is
    frequently a collection step that follows privilege escalation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
