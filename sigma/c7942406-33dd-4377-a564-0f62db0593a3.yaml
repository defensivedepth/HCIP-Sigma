name: Suspicious CodePage Switch Via CHCP
id: 8b9f0201-bfaa-429d-b825-1bffa44938bc
description: |
  Detects chcp.com switching the console code page to a value associated with a
  specific non-default language region — 936 (GB2312 / Simplified Chinese) or 1258
  (Vietnamese). Some malware families run a code-page check or switch as locale
  discovery or as an execution guardrail, fingerprinting the victim's language to
  decide whether to proceed or to bail on out-of-region hosts. The same switch is
  also routine when users or administrators legitimately work in those languages or
  set the console encoding for installers and scripts, so the investigation should
  determine who invoked chcp.com, how it was launched, what ran around it, and
  whether the host's expected locale matches the code page that was set.
type: detection
detection_id: c7942406-33dd-4377-a564-0f62db0593a3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the chcp.com command line end in code page 936 or 1258 as the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive
    by reviewing the exact command line and process details. The rule fires when the
    Image ends in chcp.com and the command line ends in either ' 936' (Simplified
    Chinese) or ' 1258' (Vietnamese); note which code page was set, because the
    target locale determines the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to switch the console code page to a Simplified Chinese or Vietnamese locale?
  context: Legitimate administrative activity can trigger this detection — users who
    work in those languages, regional installers, or localization scripts all set
    code pages routinely. Knowing whether the user's role and the host's expected
    region are consistent with switching to code page 936 or 1258 is often the
    fastest way to separate routine locale handling from locale fingerprinting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: Is the binary that ran genuinely chcp.com, or a renamed binary masquerading under that name?
  context: The rule matches on the Image name ending in chcp.com, but a renamed
    binary can carry that name on disk. Comparing the Image path against
    OriginalFileName in the PE metadata, plus the signing details and hash, confirms
    whether this is the genuine Microsoft-signed chcp.com or something masquerading
    as it. A hash that does not match the known system binary, or an unsigned file,
    redirects the investigation toward the impostor rather than the code-page switch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: If the chcp.com on disk is not the genuine system binary, how and when did it arrive on the host?
  context: The genuine chcp.com ships with Windows in the system directory. A copy
    that lives in a user-writable or non-canonical path was placed there — copied,
    downloaded, extracted, or dropped by another process. Tracing the file creation
    event for the binary by name reveals the delivery mechanism and the process that
    wrote it. If the binary is the genuine system file in its normal location, this
    question is informational.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: What was the full chcp.com command line and which code page identifier was set?
  context: The full command line confirms the exact code page value (936 GB2312
    Simplified Chinese, or 1258 Vietnamese) and how the switch was invoked. A bare
    chcp.com with no argument prints the current code page and is a common
    locale-discovery pattern, whereas an explicit numeric argument actively changes
    the console encoding. Scoping to all chcp.com executions on this host in the
    surrounding window surfaces a discovery-then-switch sequence if one occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned chcp.com and is that parent chain expected for a code-page switch?
  context: The parent process reveals how the switch was invoked. Routine locale
    handling is usually driven by cmd.exe, an installer, or a localization script
    launched interactively. Parents such as wscript.exe, mshta.exe, an Office
    application, or a freshly dropped binary suggest the code-page check is part of a
    scripted guardrail rather than user activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this tool spawn afterward?
  context: A code-page switch used as an execution guardrail is typically followed by
    the payload it was gating — script hosts, downloaders, or command interpreters
    that proceed only on an in-region host. Examining what ran from the same binary
    afterward reveals whether the switch was a precursor to further activity or an
    isolated locale change.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1036.execution_context
  question: Does the host's configured system locale match the code page that was set, or is this a switch to a foreign region?
  context: A switch to code page 936 or 1258 on a host whose installed language and
    regional settings already match that locale is expected. A switch to a foreign
    code page on a host configured for a different region is the discrepancy worth
    chasing, since locale fingerprinting and environmental keying compare the
    victim's actual language against a target value. Compare the code page set
    against the host's installed locale from asset inventory or the endpoint itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: attack:T1036.time_correlation
  question: Was chcp.com written or replaced on this host shortly before it executed, suggesting a freshly staged binary?
  context: A short interval between a chcp.com file being created on disk and that
    same binary executing points to a staged or replaced binary rather than the
    resident system file, which is created at OS install time. A long-resident system
    binary will show no recent creation event in this window. Correlate the file
    creation time of the binary with its execution time to judge whether it was
    staged for this run.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this code-page switch pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine locale handling has a stable pattern on a given host. The query
    mirrors the rule's selection — chcp.com switching to 936 or 1258 — scoped to this
    host, so the resulting parent and user distribution reflects how this specific
    pattern has run here before. A new parent process, an unexpected user account, or
    a first-time appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \chcp.com
        CommandLine|endswith:
        - ' 936'
        - ' 1258'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \chcp.com
        CommandLine|endswith:
        - ' 936'
        - ' 1258'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \chcp.com
        CommandLine|endswith:
        - ' 936'
        - ' 1258'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user triggered similar activity
    on several hosts, the scope of the activity may be larger than a single
    code-page switch.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \chcp.com
        CommandLine|endswith:
        - ' 936'
        - ' 1258'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the code-page
    switch reveals the immediate context — what led to it, what happened after, and
    whether it is part of a larger sequence. Look for reconnaissance, downloaders, or
    persistence mechanisms that ran alongside the switch.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this code-page switch pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result
    is a fleet-wide count of the chcp.com 936/1258 pattern rather than generic use of
    the binary. Many hosts firing the same pattern points to scripted deployment or
    a regional configuration baseline; one host or a small unrelated set points to
    manual or targeted activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \chcp.com
        CommandLine|endswith:
        - ' 936'
        - ' 1258'
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host —
    defense tampering, reconnaissance, or credential access — may reveal the stages
    that preceded a locale check used as an execution guardrail and help reconstruct
    the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
