- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this encoded Net.WebClient pattern (not generic PowerShell use). Many hosts
    firing the same pattern points to scripted deployment or red-team tooling; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
