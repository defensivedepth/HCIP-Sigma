name: AADInternals PowerShell Cmdlets Execution - ProccessCreation
id: 923a98f7-5350-4296-8dbb-4e3d473b09a0
description: |
  Detects execution of AADInternals cmdlets via a PowerShell host (powershell.exe, powershell_ise.exe,
  or pwsh.exe). AADInternals is a PowerShell module for administering Azure AD and Office 365; the same
  cmdlets that support legitimate administration also expose token extraction, directory reconnaissance,
  federation manipulation, and account changes that are useful in an attack against an Azure AD or
  Office 365 tenant. The rule fires when a PowerShell host process runs AND its command line contains
  one of the AADInternals verb-noun cmdlets (Add-AADInt, Get-AADInt, Export-AADInt, Invoke-AADInt, and
  the rest of the *-AADInt family). The investigation should determine which cmdlets ran, what tenant
  data or credentials they targeted, whether the acting user and host normally perform Azure AD
  administration, and what activity preceded and followed the execution.
type: detection
detection_id: c86500e9-a645-4680-98d7-f882c70c1ea3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does a PowerShell host process run with an AADInternals cmdlet on its command line, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both
    conditions hold together — the image is a PowerShell host (powershell.exe, powershell_ise.exe, or pwsh.exe, or the
    original file name resolves to PowerShell) AND the command line contains an AADInternals cmdlet such as Get-AADInt,
    Export-AADInt, or Invoke-AADInt. Read the exact command line and confirm both the host and the cmdlet are present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to administer Azure AD or Office 365?
  context: AADInternals is an administration module, so legitimate use is plausible for identity administrators or
    automation that manages a tenant. Knowing whether the acting user's role and the host's function are consistent with
    Azure AD / Office 365 administration is often the fastest path to separating a sanctioned admin task from an operator
    abusing the same tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Which AADInternals cmdlets ran, and what tenant data, tokens, or credentials did they target?
  context: AADInternals cmdlets map to distinct objectives. Export-AADInt and Read-AADInt commonly extract tokens, AD
    Connect credentials, or directory objects; Get-AADInt enumerates tenant configuration and identities; Set-AADInt,
    New-AADInt, and Grant-AADInt modify federation, accounts, or permissions. Read the full command line, enumerate every
    cmdlet invoked, and identify what each one targets, because that determines which accounts, tokens, or federation trust
    may be compromised and what remediation is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does it decode to?
  context: PowerShell command lines can be hidden with the -EncodedCommand (-enc) parameter, string concatenation, backtick
    escaping, or variable substitution, and the AADInternals module itself may be loaded in memory before the cmdlet is
    invoked. If the command line is encoded, decode the base64 payload and confirm which AADInternals cmdlets and arguments
    actually executed; if it is already readable, identify the module import and the specific cmdlet so the operation can be
    reconstructed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full AADInternals script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually executed, even
    when the command line is encoded or the module is loaded in memory. This provides ground truth about which AADInternals
    cmdlets and parameters ran, bypassing command-line obfuscation. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators frequently disable or bypass PowerShell security controls before running a payload. Common precursors
    include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or the -ep bypass flag),
    constrained language mode escape, and downgrade to PowerShell v2 which lacks logging. Finding these events in the hour
    before the AADInternals execution strengthens the case that the activity is not routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts or tenant identities may be compromised, and do any have elevated privileges?
  context: The severity of this activity depends on what the cmdlets targeted and the privilege of the affected identities.
    Extraction of Global Administrator, AD Connect (sync), or federation-signing credentials requires incident escalation;
    enumeration of a standard user may only need monitoring. Cross-reference the targeted accounts and the acting user with
    directory group memberships to scope exposure.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Token or credential extraction is typically followed by use of those credentials against the tenant or other
    systems. Detecting follow-on alerts on this host shortly after the AADInternals execution — new authentication events,
    remote sessions, or further identity tooling — indicates active exploitation of whatever the cmdlets obtained.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single administrative command may be legitimate, but multiple reconnaissance commands in rapid succession —
    whoami, net user, nltest, dsquery, setspn — is a signature of post-compromise enumeration. Directory and identity
    discovery running alongside AADInternals cmdlets suggests an operator mapping the environment before the next stage
    rather than a one-off administrative task.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the AADInternals pattern, what parents and users drove it, and does this alert fit that pattern?
  context: Even routine Azure AD administration leaves a baseline. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run
    here, not generic PowerShell usage. A new parent process, an unexpected user account, or a first-time appearance of the
    AADInternals pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - Add-AADInt
        - ConvertTo-AADInt
        - Disable-AADInt
        - Enable-AADInt
        - Export-AADInt
        - Find-AADInt
        - Get-AADInt
        - Grant-AADInt
        - Initialize-AADInt
        - Install-AADInt
        - Invoke-AADInt
        - Join-AADInt
        - New-AADInt
        - Open-AADInt
        - Read-AADInt
        - Register-AADInt
        - Remove-AADInt
        - Reset-AADInt
        - Resolve-AADInt
        - Restore-AADInt
        - Save-AADInt
        - Search-AADInt
        - Send-AADInt
        - Set-AADInt
        - Start-AADInt
        - Unprotect-AADInt
        - Update-AADInt
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run AADInternals or other Azure AD administration tooling?
  context: Compare the acting user's current action against their historical behavior. A user who has never run a PowerShell
    host on this baseline is more suspicious than an identity administrator who does so regularly. The user's role and typical
    toolset should align with Azure AD / Office 365 administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is
    the launch mechanism — which parent process spawned the PowerShell host, and whether that pair is historically common. A
    new or rare parent for this binary on this host or environment-wide is the deviation worth chasing; a pair that already
    accounts for many prior events is automation or operating-system activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple
    endpoints. If the same user ran AADInternals or related tooling on multiple hosts, the scope of the operation may be
    larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window, indicating coordinated automation rather than isolated activity?
  context: Under a service principal, surveying everything the user did across the network returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — the parent process and the spawned PowerShell host — fired on
    other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the alert reveals what led to the event and
    what happened afterward, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or
    persistence mechanisms in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    attack stages that preceded the AADInternals execution and help reconstruct the timeline. Identity tooling run late in a
    chain often follows the activity that established the foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired the AADInternals pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or
    administration automation; one host or a small unrelated set points to manual operator activity. Use the host distribution
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - Add-AADInt
        - ConvertTo-AADInt
        - Disable-AADInt
        - Enable-AADInt
        - Export-AADInt
        - Find-AADInt
        - Get-AADInt
        - Grant-AADInt
        - Initialize-AADInt
        - Install-AADInt
        - Invoke-AADInt
        - Join-AADInt
        - New-AADInt
        - Open-AADInt
        - Read-AADInt
        - Register-AADInt
        - Remove-AADInt
        - Reset-AADInt
        - Resolve-AADInt
        - Restore-AADInt
        - Save-AADInt
        - Search-AADInt
        - Send-AADInt
        - Set-AADInt
        - Start-AADInt
        - Unprotect-AADInt
        - Update-AADInt
      condition: all of selection_*
    fields:
    - host.name
