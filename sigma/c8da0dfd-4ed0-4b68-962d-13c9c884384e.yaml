name: Potential Credential Dumping Via LSASS Process Clone
id: 5d3f1a8c-9b2e-4c6a-bf17-2e4d8a91c0b3
description: |
  Detects a process whose Image and ParentImage both resolve to \Windows\System32\lsass.exe, which occurs when lsass.exe spawns a clone of itself. A copy-on-write clone of LSASS is the legitimate primitive behind Windows Error Reporting snapshots, but it is also used to dump credential material from the clone rather than the original LSASS handle, evading volume-based read detectors. Determine whether the clone was produced by a known system or security tool, whether a memory dump was written and read afterward, and whether the same host shows credential-access follow-on such as new logon sessions or lateral movement.
type: detection
detection_id: c8da0dfd-4ed0-4b68-962d-13c9c884384e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Do both the Image and ParentImage of this event resolve to \Windows\System32\lsass.exe?
  context: Confirm the alert is real by checking that both the spawned process and its parent are lsass.exe in System32 — the
    signature of an LSASS self-clone. A clone produced from a path other than \Windows\System32\lsass.exe, or a parent that is
    not lsass.exe, indicates a masquerade or a different condition that changes the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this host expected to produce LSASS clones as part of routine software?
  context: A small set of legitimate components clone LSASS — Windows Error Reporting snapshots, some EDR/AV self-protection
    checks, crash-reporting agents, and memory-acquisition tools used by administrators. Knowing whether this host runs such
    software, and whether the timing lines up with maintenance or an incident, is often the fastest way to separate routine
    snapshots from credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is lsass.exe expected to spawn a child here, and what started the lsass.exe instance that did the cloning?
  context: The parent-child relationship is the core signal for this detection. lsass.exe almost never spawns child processes
    in normal operation, so tracing the cloning lsass.exe back to its own origin (the grandparent, typically wininit.exe at boot)
    confirms whether this is the genuine boot-time LSASS or an imposter, and reveals what triggered the snapshot.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: attack:T1003.001.access_verification
  question: What process opened a handle to lsass.exe with full-access rights (mask 0x1F0FFF) around the time of the clone?
  context: Cloning LSASS for a dump requires a process to first open lsass.exe with snapshot-capable rights — a computed mask
    that includes PROCESS_VM_READ, PROCESS_QUERY_INFORMATION, and PROCESS_CREATE_PROCESS, commonly surfacing as the full-access
    mask 0x1F0FFF. Identifying the source process and confirming it is not a known security tool establishes whether the access
    was authorized. If process_access (handle-open) telemetry is not collected in this environment, treat an empty result as a
    visibility gap rather than evidence no access occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        TargetImage|endswith: \lsass.exe
        GrantedAccess: '0x1F0FFF'
      condition: selection
    fields:
      - SourceImage
      - SourceProcessGuid
      - GrantedAccess
      - CallTrace
- source: template:credential_access.credential_target_identification
  question: Was LSASS memory actually read or dumped from the clone, and by what method?
  context: A clone alone does not prove theft; credential extraction requires reading the cloned memory, typically via a
    MiniDump write against the clone handle. Identify the dumping method — comsvcs.dll MiniDump, procdump, a custom dumper, or a
    snapshot-then-dump harness — because the method indicates operator sophistication and which tooling to hunt for elsewhere.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.001.command_analysis
  question: Did any process on this host run a known LSASS-dumping command pattern around the time of the clone?
  context: Dump operations frequently leave a recognizable command line even when the clone primitive itself does not — for
    example rundll32 invoking comsvcs.dll MiniDump against the LSASS PID, procdump with the -ma flag against lsass, or
    PowerShell credential-dumping cradles. Matching these patterns near the clone time corroborates intent and points to the
    operator's tooling.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_pattern:
        CommandLine|contains:
          - 'comsvcs.dll'
          - 'MiniDump'
          - 'procdump'
          - '-ma '
          - 'lsass'
          - 'Invoke-Mimikatz'
          - 'sekurlsa'
          - 'rundll32'
      condition: selection_host and selection_pattern
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
- source: attack:T1003.001.tuning_parameter
  question: Were any memory-dump files written to common dump locations on this host shortly after the clone?
  context: A successful dump leaves a file on disk before it is read offline by a credential parser. Dumpers commonly write to
    user-writable or temp paths such as %TEMP%, C:\Windows\Temp, C:\Users\Public, or the user profile, often with a .dmp
    extension. A dump file appearing within minutes of the clone is strong corroboration of credential extraction. Scope the
    result to the relevant directories rather than enumerating every file event on the host.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\Temp\'
          - '\Users\Public\'
          - '\AppData\'
          - '.dmp'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- source: attack:T1003.001.time_correlation
  question: What other activity occurred on this host within a few minutes of the clone, in time order?
  context: Staged credential theft follows a sequence — handle open, clone, memory dump, file write, then offline parsing or
    movement — usually inside a short window of a few minutes. Laying out host activity in time order around the clone reveals
    whether the surrounding events form that chain or whether the clone stands alone as a benign snapshot.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: attack:T1003.001.parent_process_analysis
  question: Across the environment, which processes are seen opening lsass.exe, and is the source of this access one of them?
  context: Tuning LSASS-access detection depends on knowing which processes legitimately touch LSASS in this environment — AV/EDR
    engines, the OS itself, and a few admin tools. Comparing the source of this access against that baseline distinguishes a
    sanctioned tool from an unexpected process. A source process that appears nowhere else in the fleet's LSASS-access history is
    the deviation worth chasing. If handle-open telemetry is not collected, this comparison cannot be made from logs alone.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        TargetImage|endswith: \lsass.exe
      condition: selection
    fields:
      - SourceImage
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts had active logon sessions on this host, and do any have elevated privileges?
  context: An LSASS dump exposes the credentials of every account with cached or active material on the host at dump time.
    Enumerate who was logged on — interactive users, service accounts, and any cached domain admin — because domain or
    enterprise admin exposure requires incident escalation and credential resets, while a single standard user is a narrower blast
    radius.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Did any new logon sessions or remote connections originate from this host after the clone?
  context: Credential theft is typically followed by use of the stolen material — the operator authenticates to other systems
    with harvested hashes or passwords. New logon events, RDP, SMB, WinRM, or remote-execution alerts from this host after the
    clone indicate the credentials are already being exercised and widen the scope of compromise.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:cue_user_actor.baseline
  question: Does the account associated with this event normally perform LSASS access or memory-acquisition activity?
  context: Compare the acting account against its own history. Most accounts never touch LSASS memory; an account with no prior
    LSASS-access or dumping activity that suddenly does so is more suspicious than one whose role (incident response, forensics)
    routinely involves it. Pair this with the launch-mechanism baseline, since the alert may fire under a service principal where
    user identity does not attribute behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is an lsass.exe parent spawning an lsass.exe child historically routine on this host or across the environment?
  context: When the alert fires under SYSTEM or a service principal, user identity does not attribute behavior, so the meaningful
    pivot is the launch mechanism — how often lsass.exe has spawned an lsass.exe child before. A clone pairing that already
    accounts for many prior events is OS or vendor snapshot automation; a first-time or rare occurrence is the deviation worth
    chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did the acting account do across the environment around the time of the clone?
  context: After identifying the actor, check their activity across all hosts in the same window. The same account triggering
    LSASS access or other credential-theft activity on multiple endpoints points to a broader, multi-host operation rather than
    an isolated event.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did an lsass.exe-to-lsass.exe clone fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, asking what the account did across the network returns agent-telemetry noise. The meaningful
    question is whether the same clone mechanism appeared on other hosts in the alert window. Multiple hosts cloning LSASS in the
    same window points to a coordinated or pushed operation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before the clone?
  context: Credential dumping is usually one stage of a longer intrusion. Earlier detections on the same host — defense
    tampering, reconnaissance, privilege escalation, or initial execution — help reconstruct how the operator reached LSASS and
    what stages preceded the dump.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
