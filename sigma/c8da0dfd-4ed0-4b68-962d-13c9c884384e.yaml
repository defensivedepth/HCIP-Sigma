  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'registry_set' (recommended by techniques: T1003.001) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        The registry_set leg of the T1003.001 analytic targets SAM/SECURITY hive
        access (reg save) and Defender RunAsPPL flips, which are SAM-dumping and
        defense-evasion variants distinct from the LSASS clone-and-dump primitive
        this rule fires on. The clone path reads memory, not registry hives, so a
        registry_set question would not corroborate this specific detection. The
        in-memory dump chain is covered by the process_access (Q4), MiniDump
        command (Q6), and dump-file (Q7) questions.
    - hint: "logsource 'security' (recommended by techniques: T1003,T1003.001) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The security-channel analytic (4663/4656/4673 object-access and privilege
        events on lsass.exe) is the Windows-Security-log equivalent of the
        process_access handle-open evidence already captured by the access_verification
        question (Q4) via Sysmon process_access. Authoring a parallel security-channel
        question would duplicate that same handle-open signal in a log source many
        environments do not audit for LSASS object access; Q4 carries the access leg.
