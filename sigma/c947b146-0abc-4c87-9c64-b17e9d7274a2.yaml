  hint_dispositions:
    - hint: "logsource 'file_delete' (recommended by techniques: T1070) is not covered — pull in cue_artifact.* or author a custom question with `category: file_delete`"
      disposition: declined
      reason: >-
        This rule detects the recovery-inhibiting command execution (process_creation),
        not file-deletion events. Shadow copies are block-level snapshots removed via the
        VSS provider API by vssadmin/wmic/diskshadow; they do not generate Sysmon
        EventCode 23 file_delete records for the snapshots, so a file_delete query would
        not corroborate the alert. The filesystem-level recovery-destruction angle that
        IS observable (backup image and restore-directory writes/removals) is covered by
        the T1070 file_path_analysis question (Q10) via the file_event logsource.
    - hint: "logsource 'registry_set' (recommended by techniques: T1070,T1490) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        The rule's detection is strictly command-line driven over six recovery utilities;
        none of its three branches involves a registry write. T1490/T1070 registry_set
        analytics target recovery-flag registry changes that this rule does not detect, and
        adding a registry_set sweep would not corroborate the specific shadow-copy/backup
        deletion that fired. Recovery-flag state is instead verified via direct system
        checks called out in recovery_options_assessment (Q7).
    - hint: "logsource 'security' (recommended by techniques: T1070) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The T1070 security analytic targets EventCode 1102 (audit log cleared); this rule
        does not detect log clearing — it detects shadow-copy/backup-catalog deletion. Any
        log-clearing that accompanied the operation is surfaced topically by the
        host-context precursor question (Q17, prior sigma alerts on the host, which would
        include a log-clear detection) and by destruction_scope_on_host (Q8), so a bespoke
        4624/1102 security query is not warranted for this rule's pattern.
