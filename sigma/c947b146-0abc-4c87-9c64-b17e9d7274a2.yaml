    - template: powershell.powershell_security_bypass
      reason: "PowerShell security-bypass precursors are not part of this rule's recovery-destruction pattern; tamper/precursor coverage is provided by destruction_scope_on_host and cue_host_context.precursor."
    - template: defense_tampering.protection_status
