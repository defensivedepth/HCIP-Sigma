name: Shadow Copies Deletion Using Operating Systems Utilities
id: 7672cb9b-13f0-43b8-948d-4345178e6f1b
description: |
  Detects native Windows utilities being used to delete or shrink Volume Shadow Copies, delete backup catalogs, or otherwise
  inhibit system recovery. The rule fires when EITHER a shadow-copy-capable binary (powershell.exe, pwsh.exe, wmic.exe,
  vssadmin.exe, diskshadow.exe) runs with "shadow" and "delete" on its command line, OR wbadmin.exe runs with "delete",
  "catalog", and "quiet", OR vssadmin.exe runs with "resize" and "shadowstorage" together with "unbounded" or "/MaxSize=".
  Legitimate administrators and backup software occasionally run these commands, but the same actions are a standard
  pre-encryption step for ransomware: removing recovery points so encrypted data cannot be restored. The investigation
  should confirm which branch fired, decode the exact command, identify who and what launched it, and determine whether
  other destructive or recovery-inhibiting actions occurred on this host or across the environment.
type: detection
detection_id: c947b146-0abc-4c87-9c64-b17e9d7274a2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match one of this rule's shadow-copy or backup-deletion patterns?
  context: >-
    Confirm the alert before investing time. The rule fires on any one of three independent patterns: a shadow-copy-capable
    binary (powershell.exe, pwsh.exe, wmic.exe, vssadmin.exe, diskshadow.exe) with both "shadow" and "delete"; wbadmin.exe
    with "delete", "catalog", and "quiet"; or vssadmin.exe with "resize" and "shadowstorage" plus "unbounded" or "/MaxSize=".
    Note which branch fired — the deletion branches indicate recovery points are being removed outright, while the resize
    branch shrinks shadow storage to force existing copies out, and that distinction determines the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to delete shadow copies or backup catalogs?
  context: >-
    Backup software, imaging workflows, and administrators occasionally clear shadow copies or backup catalogs as part of
    routine maintenance. Knowing whether the user role and host function involve backup or recovery administration is often
    the fastest way to separate sanctioned maintenance from destructive activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which recovery mechanism did this command target, and what exactly did it do?
  context: >-
    Different recovery-inhibiting actions have different impacts: deleting shadow copies removes file-level restore points,
    resizing shadow storage to a small or unbounded value forces existing copies out, and deleting the backup catalog
    breaks wbadmin restores. Read the full command line to identify the specific target, the affected volume, and whether
    the action was scoped to one volume or all of them.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: If the PowerShell branch fired, was the command encoded or obfuscated, and what does it decode to?
  context: >-
    When the alerting binary is powershell.exe or pwsh.exe, the shadow-copy deletion can be wrapped in an -EncodedCommand
    (-enc) base64 payload, string concatenation, or backtick escaping to hide the win32_shadowcopy / Remove-WmiObject call.
    Decoding reveals whether the deletion was a single hidden cmdlet or part of a larger script that also stages encryption.
    A known benign pattern here is management software issuing a PowerShell EncodedCommand; decode it to confirm the source.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this utility, and is that parent chain expected for recovery administration?
  context: >-
    The parent process reveals how the utility was invoked. Legitimate backup and maintenance runs are typically launched
    by services.exe, a backup agent, or an interactive administrator shell. A parent such as cmd.exe or powershell.exe
    running a script, or an Office application, mshta.exe, or wscript.exe, points to scripted or operator-driven destruction
    rather than scheduled maintenance.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this shadow-copy-deletion pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: >-
    Even native utilities have a routine footprint. This query mirrors the rule's selection structure scoped to this host,
    so the parent/user distribution reflects how this specific deletion pattern (not generic vssadmin or powershell usage)
    has historically run here. A new parent process, an unexpected user account, or a first-ever appearance of the pattern
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \wmic.exe
        - \vssadmin.exe
        - \diskshadow.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - wmic.exe
        - VSSADMIN.EXE
        - diskshadow.exe
      selection1_cli:
        CommandLine|contains|all:
        - shadow
        - delete
      selection2_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection2_cli:
        CommandLine|contains|all:
        - delete
        - catalog
        - quiet
      selection3_img:
      - Image|endswith: \vssadmin.exe
      - OriginalFileName: VSSADMIN.EXE
      selection3_cli:
        CommandLine|contains|all:
        - resize
        - shadowstorage
        CommandLine|contains:
        - unbounded
        - /MaxSize=
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: ((all of selection1*) or (all of selection2*) or (all of selection3*)) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:ransomware_impact.recovery_options_assessment
  question: What recovery-inhibiting commands were executed on this host?
  context: >-
    Operators chain recovery destruction: deleting shadow copies (vssadmin, wmic), disabling boot recovery (bcdedit),
    deleting backups (wbadmin), and disabling the Windows Recovery Environment (reagentc). This surfaces all such commands
    on the host so the full scope of recovery destruction is visible. Verify whether each action succeeded by checking
    system state directly (vssadmin list shadows, bcdedit /enum, reagentc /info, wbadmin get versions).
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- source: template:ransomware_impact.destruction_scope_on_host
  question: What other destructive or recovery-inhibiting actions occurred on this host around the same time?
  context: >-
    Recovery destruction rarely stands alone. The same operation often stops security services, clears event logs, changes
    file permissions, and disables recovery. Finding the complete set of destructive commands in a tight window around the
    alert helps confirm whether this is part of an impact sequence rather than an isolated administrative action, and shows
    whether they share a common parent process indicating scripted execution.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- source: template:ransomware_impact.encryption_or_ransom_indicators
  question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the deletion?
  context: >-
    Recovery-inhibiting actions typically precede file encryption by minutes. Checking for execution of unknown or
    user-writable-path binaries after the deletion, and for file activity consistent with mass renames or ransom-note
    creation, determines whether encryption has already begun and how far it has progressed. Also check directly for ransom
    notes via file activity.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: attack:T1070.file_path_analysis
  question: Were files written to or deleted from backup, restore, or recovery directories on this host around the alert?
  context: >-
    Beyond the shadow-copy API, recovery destruction can extend to the filesystem: removing System Volume Information
    contents, deleting backup image files (.bkf, .vhd, .wim), or wiping restore-point data. File activity in recovery and
    backup paths, correlated with the alert time, shows whether the operator reinforced the deletion at the file level and
    which volumes were affected.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - '\System Volume Information\'
          - '\WindowsImageBackup\'
          - '\Recovery\'
          - '.bkf'
          - '.vhd'
          - '.wim'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
- source: attack:T1490.network_indicators
  question: Did this host make outbound network connections around the deletion that are not from known system processes?
  context: >-
    Recovery destruction is frequently bracketed by network activity: the payload that issued the commands often arrived
    over the network, and encryption is commonly preceded by command-and-control check-ins or data staging. Outbound
    connections from unexpected processes in the same window help place the deletion within a larger operation and may
    surface the source of the activity.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_known:
        Image|startswith:
          - 'C:\Windows\System32\svchost'
          - 'C:\Program Files'
      condition: selection and not filter_known
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \wmic.exe
        - \vssadmin.exe
        - \diskshadow.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - wmic.exe
        - VSSADMIN.EXE
        - diskshadow.exe
      selection1_cli:
        CommandLine|contains|all:
        - shadow
        - delete
      selection2_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection2_cli:
        CommandLine|contains|all:
        - delete
        - catalog
        - quiet
      selection3_img:
      - Image|endswith: \vssadmin.exe
      - OriginalFileName: VSSADMIN.EXE
      selection3_cli:
        CommandLine|contains|all:
        - resize
        - shadowstorage
        CommandLine|contains:
        - unbounded
        - /MaxSize=
      _pb_scope:
        User|expand: '%User%'
      condition: ((all of selection1*) or (all of selection2*) or (all of selection3*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \wmic.exe
        - \vssadmin.exe
        - \diskshadow.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - wmic.exe
        - VSSADMIN.EXE
        - diskshadow.exe
      selection1_cli:
        CommandLine|contains|all:
        - shadow
        - delete
      selection2_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection2_cli:
        CommandLine|contains|all:
        - delete
        - catalog
        - quiet
      selection3_img:
      - Image|endswith: \vssadmin.exe
      - OriginalFileName: VSSADMIN.EXE
      selection3_cli:
        CommandLine|contains|all:
        - resize
        - shadowstorage
        CommandLine|contains:
        - unbounded
        - /MaxSize=
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: ((all of selection1*) or (all of selection2*) or (all of selection3*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the deletion is isolated or part of multi-host activity.
    If the same user triggered similar destructive or recovery-inhibiting commands on other endpoints, the scope of the
    operation is larger and patterns containment.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \wmic.exe
        - \vssadmin.exe
        - \diskshadow.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - wmic.exe
        - VSSADMIN.EXE
        - diskshadow.exe
      selection1_cli:
        CommandLine|contains|all:
        - shadow
        - delete
      selection2_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection2_cli:
        CommandLine|contains|all:
        - delete
        - catalog
        - quiet
      selection3_img:
      - Image|endswith: \vssadmin.exe
      - OriginalFileName: VSSADMIN.EXE
      selection3_cli:
        CommandLine|contains|all:
        - resize
        - shadowstorage
        CommandLine|contains:
        - unbounded
        - /MaxSize=
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: ((all of selection1*) or (all of selection2*) or (all of selection3*)) and _pb_scope
    fields:
    - host.name
- source: template:ransomware_impact.network_wide_impact
  question: Is this same shadow-copy-deletion alert firing on other hosts in the environment?
  context: >-
    Impact operations often execute the same recovery-destruction sequence across many hosts at once or in rapid
    succession. Finding this alert on multiple hosts indicates environment-wide execution and determines the scope for
    containment and incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Recovery destruction is usually a late-stage action. Earlier detections on the same host — defense tampering, security
    service stops, credential access, or lateral movement — may reveal the stages that preceded the deletion and help
    reconstruct the timeline leading up to impact.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
