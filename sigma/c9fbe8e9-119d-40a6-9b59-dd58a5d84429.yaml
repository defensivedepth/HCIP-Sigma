name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
id: 3f4e44fc-f94e-4af1-bb59-424ec89e2bee
description: |
  Detects bcdedit.exe executions that modify or remove Boot Configuration Data (BCD) entries, firing when the binary
  (by Image name or OriginalFileName) runs with a command line containing delete, deletevalue, import, safeboot, or
  network. Both conditions must match. Legitimate uses exist — administrators reconfiguring boot entries, dual-boot
  setup, or recovery work — but the same options are abused to boot into Safe Mode where security products do not load,
  to suppress boot-failure recovery after disk corruption, and to remove recovery options before file encryption.
  Investigation should confirm the exact subcommand, establish whether the change was authorized, and check for the
  surrounding recovery-inhibition and impact activity that distinguishes operator abuse from routine boot maintenance.
type: detection
detection_id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — bcdedit.exe run with delete, deletevalue, import, safeboot, or network?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and
    process details. The rule fires only when both the binary is bcdedit.exe (by Image name or OriginalFileName) and the
    command line contains one of delete, deletevalue, import, safeboot, or network. Note which keyword appears, as it
    determines the boot-config change made.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to reconfigure boot entries with bcdedit.exe?
  context: Legitimate boot-configuration changes are usually made by administrators or imaging/deployment tooling on servers
    and managed endpoints. A standard user workstation or an account with no administrative role modifying BCD entries is a
    stronger deviation than the same activity on a host where boot maintenance is routine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: What specific boot configuration change did this bcdedit command make?
  context: Different bcdedit options have very different impact. `safeboot`/`safebootalternateshell` boot Windows into Safe
    Mode where many security products do not load. `bootstatuspolicy ignoreallfailures` and `recoveryenabled No` suppress
    the recovery environment after boot or disk corruption. `deletevalue`/`delete` remove an entry or option, and `import`
    replaces the entire BCD store from a file. Decode the full command line to identify the exact datatype and value set.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:ransomware_impact.recovery_options_assessment
  question: What recovery-inhibiting commands were executed on this host?
  context: Operators preparing for impact frequently chain boot-recovery disabling (bcdedit) with shadow-copy deletion
    (vssadmin, wmic), backup deletion (wbadmin), and recovery-environment disabling (reagentc). This query surfaces the full
    set of recovery-inhibiting commands on the host. The analyst should then verify whether each action succeeded by
    inspecting system state directly (vssadmin list shadows, bcdedit /enum, reagentc /info).
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- source: template:ransomware_impact.destruction_scope_on_host
  question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Operators preparing for impact typically chain multiple destructive actions: deleting shadow copies AND disabling
    recovery AND stopping security services AND clearing event logs. Finding the complete set of destructive tool executions
    reveals whether the boot-config change was part of a broader destruction sequence rather than an isolated administrative
    action.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- source: template:ransomware_impact.encryption_or_ransom_indicators
  question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the boot-config change?
  context: Recovery-inhibiting actions typically precede file encryption by minutes. Checking for execution of unknown
    binaries from user-writable or temporary paths after the boot-config change determines whether an encryption phase has
    started. The analyst should also check for ransom notes and mass file renames via file-creation evidence or endpoint
    inspection.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: template:ransomware_impact.network_wide_impact
  question: Is this same boot-config tampering firing on other hosts in the environment?
  context: This destruction sequence is often executed across many hosts simultaneously or in rapid succession. Finding the
    same alert on multiple hosts indicates network-wide execution and determines the scope for containment and incident
    response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- source: attack:T1542.003.boot_file_modification
  question: Were boot-related files created or modified on this host around the time of the alert?
  context: Boot-record and EFI System Partition tampering is the file-side counterpart to a BCD command-line change. Creation
    or modification of files under the boot/EFI directories or of a BCD store file (as targeted by bcdedit import) close to
    the alert indicates low-level boot manipulation beyond a single configuration option. The query scopes to boot-relevant
    paths so it does not return every file event on the host.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_boot_paths:
        TargetFilename|contains:
          - '\Boot\BCD'
          - '\EFI\Microsoft\Boot\'
          - '\System Volume Information\'
          - '\bootmgr'
          - '\Boot\bootstat.dat'
      condition: selection and selection_boot_paths
    fields:
      - TargetFilename
      - Image
- source: attack:T1542.obfuscation_check
  question: Did this host load unsigned or test-signed drivers, or set integrity-check bypass options, after the boot-config change?
  context: Boot-config tampering is a common precursor to loading unauthorized kernel code. Options such as `testsigning on`,
    `nointegritychecks on`, and `disableelamdrivers yes` relax driver-signing enforcement so unsigned or packed boot/kernel
    code can load on the next boot. Executions setting these options, or driver-installation tooling running shortly after,
    point to a bootkit or rootkit objective rather than a benign recovery change.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'testsigning'
          - 'nointegritychecks'
          - 'disableelamdrivers'
          - 'loadoptions'
          - 'DDISABLE_INTEGRITY_CHECKS'
      condition: selection and selection_bypass
    fields:
      - Image
      - CommandLine
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned bcdedit.exe and is that parent chain expected?
  context: The parent process reveals how bcdedit was invoked. A parent of explorer.exe or an administrative console fits
    interactive maintenance; cmd.exe or powershell.exe running a script, or an unexpected parent such as a browser child or
    Office application, points to scripted or operator-driven execution. Walking up to the parent's own parent shows whether
    the invocation traces back to a legitimate session.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this bcdedit pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate boot maintenance leaves a pattern. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here.
    Deviations — a new parent process, an unexpected user account, an unusual command-line structure — are the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcdedit.exe
      - OriginalFileName: bcdedit.exe
      selection_cli:
        CommandLine|contains:
        - delete
        - deletevalue
        - import
        - safeboot
        - network
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this bcdedit pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic bcdedit usage. Many hosts firing the same pattern points to scripted deployment or
    imaging automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcdedit.exe
      - OriginalFileName: bcdedit.exe
      selection_cli:
        CommandLine|contains:
        - delete
        - deletevalue
        - import
        - safeboot
        - network
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcdedit.exe
      - OriginalFileName: bcdedit.exe
      selection_cli:
        CommandLine|contains:
        - delete
        - deletevalue
        - import
        - safeboot
        - network
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bcdedit.exe
      - OriginalFileName: bcdedit.exe
      selection_cli:
        CommandLine|contains:
        - delete
        - deletevalue
        - import
        - safeboot
        - network
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the boot-config change?
  context: Boot-config changes are often staged ahead of an action that the recovery or boot options would otherwise hinder
    — Safe Mode execution to evade security products, or impact after recovery is disabled. Examining process activity in the
    window after the bcdedit call reveals what the change was meant to enable. A reboot followed by execution under Safe Mode
    is a particularly load-bearing sequence here.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Boot-config tampering rarely happens in isolation. Earlier detections on the same host — defense tampering,
    credential access, or hands-on-keyboard execution — may reveal the stages that preceded this event and help reconstruct
    the timeline leading to boot or recovery manipulation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
