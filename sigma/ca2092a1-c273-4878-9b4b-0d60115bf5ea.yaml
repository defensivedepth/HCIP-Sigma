    coverage_type: direct
  mutable_dispositions:
  - element: CommandLinePattern
    dimension: command_analysis
    specific_values: "-enc, -nop, encoded/obfuscated argument patterns"
    disposition: context
    target_question: Q3
    notes: "Rule already enforces the encoded-command pattern in its selection; decode question surfaces the -enc/-EncodedCommand payload. Q1 is ProcessGuid-scoped so it auto-satisfies the pattern claim"
  - element: ParentProcessName
    dimension: parent_process_analysis
    specific_values: "Excel, WinWord, mshta spawning PowerShell"
    disposition: context
    target_question: Q7
    notes: "Abnormal-parent values named in process_chain context (winword.exe, excel.exe, mshta.exe, wscript.exe); query is ParentProcessGuid-scoped to the alert event"
  - element: TimeWindow
    dimension: time_correlation
    specific_values: "rationale only (off-hours / non-maintenance scoping)"
    disposition: context
    target_question: Q16
    notes: "No fixed values; host clustering at +/-15m and precursor at -6h address temporal scope"
  - element: LoadedModuleList
    dimension: tuning_parameter
    specific_values: "rare / never-before-seen .NET assemblies"
    disposition: new_question
    target_question: Q6
    notes: "Drove the image_load question; filters known OS DLLs and projects Signed/Signature for assembly review"
  - element: ScriptBlockLengthThreshold
    dimension: tuning_parameter
    specific_values: "rationale only (4104 script-block length filtering)"
    disposition: context
    target_question: Q4
    notes: "Threshold is a tuning knob without a fixed value; script_block_logging question retrieves 4104 ScriptBlockText for manual review"
