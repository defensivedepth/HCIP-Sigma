name: Suspicious Encoded PowerShell Command Line
id: 0550c9a0-b5a1-4616-bfd4-25d6d91a9364
description: |
  Detects powershell.exe or pwsh.exe launched with a command line that carries an encoded-command flag or base64-looking content. The rule fires when the process is PowerShell AND the command line matches EITHER an encoded-command flag (a contains-match on ' -e', covering -e/-en/-enc/-EncodedCommand) together with one of several base64 prefixes that commonly begin an encoded PowerShell payload, OR a standalone marker such as '.exe -ENCOD ' — and the command line does NOT carry the ' -ExecutionPolicy remotesigned ' benign filter. Encoded PowerShell is a routine way to pass complex scripts and is used by management tooling, but it is also the most common form of payload concealment for download cradles, in-memory .NET loaders, and reverse shells. Decode the command line, recover what actually ran, and determine whether the encoding hid a legitimate script or a malicious payload.
type: detection
detection_id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Is this powershell.exe or pwsh.exe, and does the command line carry an encoded-command flag together with base64 content, or a standalone encode marker?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when the process is PowerShell AND the command line matches at least one of two branches — an encoded-command flag (' -e') together with a base64 prefix (such as ' JAB', ' IEX'-style tokens, ' UwB', ' cwB'), or a standalone marker ('.exe -ENCOD '). Note which branch fired, because it determines the rest of the investigation; the ' -ExecutionPolicy remotesigned ' filter cancels the rule, so its absence is also part of the match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run encoded PowerShell?
  context: Encoded PowerShell is normal for some configuration management, deployment, and build tooling, but unusual for most interactive users. Knowing whether this account and host role routinely launch PowerShell with encoded commands is often the fastest way to separate sanctioned automation from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:powershell.encoded_command_decode
  question: What does the encoded command decode to?
  context: Base64-encoded commands are the most common form of PowerShell concealment. Decode the -EncodedCommand/-enc payload (and unwind any backtick escaping, string concatenation, or variable substitution layered on top) and read what the script actually does. Look for download cradles (Net.WebClient, Invoke-WebRequest, Invoke-RestMethod), in-memory .NET assembly loads ([Reflection.Assembly]::Load), reverse shells, or credential access. The decoded content is the ground truth for disposition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Event ID 4104 records the deobfuscated script PowerShell actually executed, even when the command line is encoded. This is the most reliable way to recover what ran, bypassing the attacker's encoding. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and decode the command line directly instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Encoded payloads are frequently preceded by control-weakening — AMSI bypass (patching amsi.dll in memory), execution-policy changes (-ExecutionPolicy Bypass or -ep bypass), or a downgrade to the version 2 engine that lacks script block logging. Finding these precursor actions on the same host strengthens the case that the encoded command was preparation for a payload rather than benign automation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: attack:T1059.001.image_load
  question: Did this PowerShell process load .NET assemblies or automation DLLs consistent with in-memory or reflective execution?
  context: PowerShell can be hosted indirectly through the .NET automation engine (System.Management.Automation.dll), and reflective loaders bring rare or never-before-seen assemblies into the process. Encoded download-and-load cradles often surface here even when the command line only shows the base64 blob. Review which modules the alerting process loaded and flag assemblies that are unsigned, newly written, or loaded from user-writable paths. If image_load events are not collected in this environment, treat zero results as a visibility gap and rely on the decoded command line and script block content instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      filter_known:
        ImageLoaded|endswith:
          - '\kernel32.dll'
          - '\ntdll.dll'
          - '\KernelBase.dll'
      condition: selection and not filter_known
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell, and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. A launch from explorer.exe, a console session, or a deployment agent is consistent with administration; parents such as winword.exe, excel.exe, mshta.exe, wscript.exe, or a browser child point to macro-driven or script-driven execution and raise the weight of an encoded command line.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell spawn afterward?
  context: The processes spawned after an encoded command reveal its actual impact. Encoded download cradles commonly drop and launch further executables, script hosts, or living-off-the-land binaries; a PowerShell that spawns cmd.exe, certutil.exe, rundll32.exe, or an executable from a user-writable path suggests the decoded payload reached a post-exploitation stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: How often has this host run powershell.exe or pwsh.exe before?
  context: A host that regularly runs PowerShell as part of administration or automation is less concerning than one where it is rare. Zero or very low historical counts indicate first-time or unusual use of the interpreter on this host. The count is over the binary generally, since encoded command lines are too variable to aggregate over 90 days.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously matched the rule's pattern, what parents and users drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects how this exact encoded-PowerShell pattern has historically run here — not generic PowerShell usage. A new parent process, an unexpected account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_enc:
        CommandLine|contains: ' -e'
      selection_cli_content:
        CommandLine|contains:
        - ' JAB'
        - ' SUVYI'
        - ' SQBFAFgA'
        - ' aQBlAHgA'
        - ' aWV4I'
        - ' IAA'
        - ' IAB'
        - ' UwB'
        - ' cwB'
      selection_standalone:
        CommandLine|contains:
        - '.exe -ENCOD '
        - ' BA^J e-'
      filter_optional_remote_signed:
        CommandLine|contains: ' -ExecutionPolicy remotesigned '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and (all of selection_cli_* or selection_standalone) and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_enc:
        CommandLine|contains: ' -e'
      selection_cli_content:
        CommandLine|contains:
        - ' JAB'
        - ' SUVYI'
        - ' SQBFAFgA'
        - ' aQBlAHgA'
        - ' aWV4I'
        - ' IAA'
        - ' IAB'
        - ' UwB'
        - ' cwB'
      selection_standalone:
        CommandLine|contains:
        - '.exe -ENCOD '
        - ' BA^J e-'
      filter_optional_remote_signed:
        CommandLine|contains: ' -ExecutionPolicy remotesigned '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img and (all of selection_cli_* or selection_standalone) and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_enc:
        CommandLine|contains: ' -e'
      selection_cli_content:
        CommandLine|contains:
        - ' JAB'
        - ' SUVYI'
        - ' SQBFAFgA'
        - ' aQBlAHgA'
        - ' aWV4I'
        - ' IAA'
        - ' IAB'
        - ' UwB'
        - ' cwB'
      selection_standalone:
        CommandLine|contains:
        - '.exe -ENCOD '
        - ' BA^J e-'
      filter_optional_remote_signed:
        CommandLine|contains: ' -ExecutionPolicy remotesigned '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_img and (all of selection_cli_* or selection_standalone) and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the account's activity across all hosts reveals lateral movement or coordinated activity on multiple endpoints. If the same user triggered similar activity elsewhere, the scope may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_enc:
        CommandLine|contains: ' -e'
      selection_cli_content:
        CommandLine|contains:
        - ' JAB'
        - ' SUVYI'
        - ' SQBFAFgA'
        - ' aQBlAHgA'
        - ' aWV4I'
        - ' IAA'
        - ' IAB'
        - ' UwB'
        - ' cwB'
      selection_standalone:
        CommandLine|contains:
        - '.exe -ENCOD '
        - ' BA^J e-'
      filter_optional_remote_signed:
        CommandLine|contains: ' -ExecutionPolicy remotesigned '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_img and (all of selection_cli_* or selection_standalone) and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering with protection often precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful signal that protection looks healthy, though kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining surrounding activity reveals what led to the encoded PowerShell execution and what followed it. Aggregating by parent and child collapses repetitive agent telemetry into high-count rows while novel parent-child pairs stand out at low counts — that is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts matched the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this encoded-PowerShell pattern rather than generic PowerShell usage. Many hosts matching the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_enc:
        CommandLine|contains: ' -e'
      selection_cli_content:
        CommandLine|contains:
        - ' JAB'
        - ' SUVYI'
        - ' SQBFAFgA'
        - ' aQBlAHgA'
        - ' aWV4I'
        - ' IAA'
        - ' IAB'
        - ' UwB'
        - ' cwB'
      selection_standalone:
        CommandLine|contains:
        - '.exe -ENCOD '
        - ' BA^J e-'
      filter_optional_remote_signed:
        CommandLine|contains: ' -ExecutionPolicy remotesigned '
      condition: selection_img and (all of selection_cli_* or selection_standalone) and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded an encoded PowerShell launch. The alert timeline helps reconstruct whether this execution is isolated or one step in a sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
