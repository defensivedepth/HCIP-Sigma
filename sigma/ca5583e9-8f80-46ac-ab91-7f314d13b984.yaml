name: Potentially Suspicious Child Process of KeyScrambler.exe
id: 9d2f7c4a-1b6e-4f53-9a8c-3e7d5b021f88
description: |
  Detects KeyScrambler.exe, an anti-keylogging utility, spawning a command interpreter
  or script host (cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe, regsvr32.exe,
  rundll32.exe, or wscript.exe). The rule fires only when the parent Image ends in
  KeyScrambler.exe AND the child resolves to one of those binaries by Image name or
  OriginalFileName. A signed third-party security tool has no routine reason to launch
  these interpreters; the pattern is consistent with hijacking the application's execution
  flow — a DLL search-order hijack against KeyScrambler.exe (T1574.001) or exploitation of
  the running application (T1203) — to obtain execution under a trusted process. The
  investigation should confirm the parent-child pair, decode what the child ran, and
  determine whether a planted module or dropped file set up the abuse.
type: detection
detection_id: ca5583e9-8f80-46ac-ab91-7f314d13b984
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the alert match the rule — KeyScrambler.exe as the parent spawning cmd, cscript, mshta, powershell, pwsh, regsvr32, rundll32, or wscript as the child?
  context: Before investing investigation time, confirm both halves of the detection. The
    ParentImage must end in KeyScrambler.exe and the child must resolve to one of the listed
    interpreters by Image name or OriginalFileName. Confirming the OriginalFileName matters
    because a renamed binary still trips the rule on its embedded original name; check that
    field against the on-disk Image to spot a masqueraded interpreter.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to run KeyScrambler, and would it ever launch a command interpreter?
  context: KeyScrambler is an endpoint anti-keylogging tool, so its presence on a host is
    not itself unusual; what is unusual is the tool spawning an interpreter. Knowing whether
    the user routinely runs scripting tools and whether the host's function involves
    administrative automation helps separate a misconfiguration or installer behavior from
    hijacked execution flow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is KeyScrambler.exe expected to spawn this child, and what started KeyScrambler.exe itself?
  context: The parent-child relationship is the core signal for this detection. KeyScrambler
    normally runs as a tray utility and does not launch interpreters. Tracing what started
    KeyScrambler.exe — a logon-time autostart, an installer, or another process — shows
    whether the execution chain reflects normal tool startup or an external process driving
    the trusted binary to spawn the detected child.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did this same KeyScrambler.exe instance spawn?
  context: If this KeyScrambler.exe instance launched the detected interpreter, it may have
    launched others. Several interpreters or tools spawned from the same parent instance in
    a short window points to deliberate orchestration — staged reconnaissance, download, or
    persistence — rather than a single isolated event.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the spawned interpreter do? Decode its full command line and working directory.
  context: The child's command line reveals the operational intent. Decode any flags, encoded
    blocks, file paths, or URLs. cmd.exe and powershell.exe are common enough that a
    host-and-binary view can be noisy; narrow on the command-line pattern of interest when
    the result is broad. For regsvr32, rundll32, mshta, and the script hosts, the argument
    is usually the script, DLL, scriptlet, or COM object being executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: If the child was powershell.exe or pwsh.exe, was the command encoded or obfuscated, and what does it decode to?
  context: When the spawned interpreter is PowerShell, attackers frequently use -EncodedCommand
    (-enc), string concatenation, backtick escaping, or variable substitution to hide intent.
    Base64-encoded commands are the most common form; decoding reveals download cradles,
    reverse shells, or in-memory .NET assembly loads. For a non-PowerShell child this question
    does not apply.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1574.001.image_load
  question: What DLLs did KeyScrambler.exe load, and were any unsigned or loaded from a user-writable or non-standard path?
  context: A common way a signed tool ends up spawning interpreters is a DLL search-order
    hijack — a planted DLL placed beside or ahead of the legitimate one runs the operator's
    code inside the trusted process. Reviewing the modules KeyScrambler.exe loaded
    distinguishes a clean install directory from a side-loaded attacker DLL. A module under a
    user-writable path, or an unsigned module loaded by KeyScrambler.exe, is the artifact of
    the hijack that explains the suspicious child.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \KeyScrambler.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: attack:T1203.application_crash
  question: Did KeyScrambler.exe crash or exit abnormally on this host shortly before the child was spawned?
  context: Exploitation of a client application often shows as an application-error or
    abnormal-exit event for the targeted process immediately before unexpected child
    execution. An application crash logged for KeyScrambler.exe in the minutes around the
    alert supports memory-corruption exploitation of the running tool rather than a benign
    configuration that launched the interpreter. Absence of a crash points toward
    execution-flow hijack (a planted module or redirected path) instead.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        source.name: Application Error
      filter:
        Data|contains: KeyScrambler
      condition: selection and filter
    fields:
      - source.name
      - Data
- source: attack:T1203.file_drop
  question: Were files written to user-writable paths around the time of the alert that the spawned interpreter then used?
  context: Client-execution exploitation commonly drops or stages a payload in a user-writable
    location — Downloads, %TEMP%, %APPDATA%, OneDrive, or an application startup folder —
    before the interpreter runs it. Correlating file writes in those paths with the alert
    window reveals the staged script, DLL, or scriptlet behind a regsvr32, rundll32, mshta, or
    script-host invocation, and gives a concrete artifact to hash and hunt for elsewhere.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \Downloads\
          - \AppData\Local\Temp\
          - \AppData\Roaming\
          - \OneDrive\
          - \Start Menu\Programs\Startup\
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1203.network_egress
  question: Did the spawned interpreter or KeyScrambler.exe establish outbound network connections shortly after the alert?
  context: Exploitation and hijacked execution are frequently followed by outbound
    command-and-control or payload-retrieval traffic from the interpreter the tool spawned.
    Connections initiated by the child binary in the window after the alert, especially to
    external addresses outside known update or CDN ranges, indicate the execution reached a
    network stage. Use the connecting process and destination to pivot to perimeter logs and
    block the endpoint.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        Image|endswith:
          - \cmd.exe
          - \cscript.exe
          - \mshta.exe
          - \powershell.exe
          - \pwsh.exe
          - \regsvr32.exe
          - \rundll32.exe
          - \wscript.exe
          - \KeyScrambler.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Execution inside a trusted security tool is itself a defense-evasion move, and
    operators frequently disable or weaken other protection around it. This surfaces direct
    attempts to stop AV/EDR services, flip Defender flags, add exclusions, clear logs, or
    patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal; populated rows
    shift the disposition toward deliberate operator preparation — review the writer's parent
    process and signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_parent_process.scope
  question: Is the same KeyScrambler.exe-to-interpreter spawning pattern occurring on other hosts?
  context: The same trusted-tool-to-interpreter pair appearing on multiple hosts may indicate
    a shared planted DLL distributed with a software package or a coordinated push, while a
    single occurrence is more likely targeted or a one-off misconfiguration. Enterprise-wide
    comparison helps calibrate scope and identify other affected endpoints.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run this interpreter or scripting tool?
  context: Compare the account's current action against its history. A user who has never run
    this interpreter is more suspicious than one who does so as part of their role. Align the
    result with what is known about the account — administrator, developer, standard user, or
    service principal — since the same activity carries different weight depending on who is
    behind it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the KeyScrambler.exe-and-interpreter combination historically routine on this host or across the environment, or is this parent unusual for this binary?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK
    SERVICE, or a computer account), user identity does not attribute the behavior. The
    meaningful pivot is the launch mechanism — whether KeyScrambler.exe spawning this
    interpreter is historically common. A new or rare parent for this binary is the deviation
    worth chasing; a pair that already accounts for many prior events points to packaged or
    expected behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user triggered
    similar interpreter activity elsewhere, the scope is larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same KeyScrambler.exe-and-interpreter combination fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, "what else did this user do" returns agent-telemetry
    noise because every host runs SYSTEM-owned agents constantly. The meaningful question is
    whether the same launch mechanism — KeyScrambler.exe plus the spawned interpreter — fired
    on other hosts in the alert window. Multiple hosts point to a pushed package or scheduled
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline
  question: Does this host normally run this interpreter?
  context: An interpreter that has rarely or never executed on a host is more suspicious than
    one that runs regularly. cmd.exe and powershell.exe are common on most hosts, but the
    historical count still helps; for the rarer children — mshta.exe, cscript.exe, wscript.exe
    — zero or very low counts indicate first-time or unusual execution worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the execution and what followed — reconnaissance, persistence, or further tool use.
    Aggregating by process and parent collapses repetitive agent telemetry into high-count
    rows while novel parent-child pairs stand out at low counts, which is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1203
      name: Exploitation for Client Execution
      role: primary
    - id: T1574.001
      name: Hijack Execution Flow - DLL
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: client_app_compromise
      description: "A client application (here KeyScrambler.exe) crashes/exits abnormally or has its execution flow hijacked via a planted module"
      mapped_to: Q8
      source: attack:T1203.application_crash
    - stage: 2
      label: payload_staging
      description: "A file is dropped or modified in a user-writable path for the interpreter to run"
      mapped_to: Q9
      source: attack:T1203.file_drop
    - stage: 3
      label: unexpected_child_spawn
      description: "The application spawns an unexpected interpreter/script host (the detection point)"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 4
      label: c2_egress
      description: "The spawned process establishes outbound C2-like connections shortly after"
      mapped_to: Q10
      source: attack:T1203.network_egress
  dimension_coverage:
    - dimension: file_path_analysis
      technique: T1203
      covered_by: Q9
      source: attack:T1203.file_drop
      coverage_type: direct
    - dimension: time_correlation
      technique: T1203
      covered_by: Q10
      source: attack:T1203.network_egress
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1203
      covered_by: Q5
      source: template:cue_process_tool.mechanism_decode
      coverage_type: partial
  mutable_dispositions:
    - element: HighRiskChildren
      dimension: tuning_parameter
      specific_values: "powershell.exe, cmd.exe, wscript.exe, mshta.exe, rundll32.exe, regsvr32.exe, msiexec.exe, curl.exe"
      disposition: context
      target_question: Q1
      notes: "The rule's own selection_binaries already enumerates the high-risk children (cmd, cscript, mshta, powershell, pwsh, regsvr32, rundll32, wscript); verify_trigger_match names them and the network_egress query (Q10) filters on the same list. The element's extra names (msiexec, curl) are outside this rule's scope and not added."
    - element: UserPaths
      dimension: file_path_analysis
      specific_values: "Downloads, %TEMP%, %APPDATA%, OneDrive, Office startup folders"
      disposition: query_injection
      target_question: Q9
      notes: "Injected the writable-path list directly into the file_drop TargetFilename|contains selection (Downloads, AppData\\Local\\Temp, AppData\\Roaming, OneDrive, Startup)."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "~15m correlation window between crash/write/child/network"
      disposition: context
      target_question: Q10
      notes: "Correlation guidance reflected in the ranges of the chain questions: application_crash -15m, file_drop +/-15m, network_egress +30m, image_load +/-15m all sit inside the short window the analytic calls for."
    - element: AllowedPlugins
      dimension: tuning_parameter
      specific_values: "rationale only (known add-ins/updater binaries to suppress)"
      disposition: context
      target_question: Q14
      notes: "Suppression rationale, no queryable values; baseline questions (cue_user_actor.baseline_svc, cue_process_tool.baseline) let the analyst spot whether the parent+binary pair is established automation."
    - element: EgressAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only (known update/CDN domains and proxy CIDRs)"
      disposition: context
      target_question: Q10
      notes: "No fixed values to inject (environment-specific); network_egress context directs the analyst to exclude known update/CDN ranges when reading the result."
    - element: AllowedDllPaths
      dimension: tuning_parameter
      specific_values: "rationale only (e.g., C:\\Windows\\System32 as a safe DLL directory)"
      disposition: context
      target_question: Q7
      notes: "T1574.001 suppression rationale; image_load (Q7) frames the analyst to treat modules under user-writable / non-standard paths as the anomaly, which is the inverse of this allowlist."
    - element: ProcessAllowList
      dimension: tuning_parameter
      specific_values: "rationale only (apps expected to load DLLs from non-standard locations)"
      disposition: context
      target_question: Q7
      notes: "KeyScrambler.exe is not a development tool expected to side-load; image_load (Q7) is scoped to it specifically so any non-standard-path module stands out."
    - element: HashBaseline
      dimension: tuning_parameter
      specific_values: "rationale only (baseline hashes for legitimate DLLs to detect substitution)"
      disposition: context
      target_question: Q7
      notes: "No per-rule hash values available; image_load (Q7) returns ImageLoaded/Signed/Signature so the analyst can compare module signing against the expected KeyScrambler install."
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: "parent_process is the primary cue and parent_child technique set is active — parent_process_legitimacy (Q3) is the more specific parent lookup. Acts on brief hint 'parent_process is primary — drop cue_process_tool:process_chain'."
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.mechanism_decode
      reason: "parent_child technique set active — parent_process_legitimacy (Q3) supersedes the generic parent mechanism_decode (per AGENTS.md dedup rule)."
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.follow_on
      reason: "near-duplicate of parent_child.sibling_processes (Q4), which scopes to the exact ParentProcessGuid instance rather than all KeyScrambler.exe instances on the host."
      kept: parent_child.sibling_processes
    - dropped: cue_parent_process.clustering
      reason: "near-duplicate of cue_host_context.clustering (Q18) for around-the-alert host activity; clustering scoped to the parent binary adds little over the host-wide aggregated view."
      kept: cue_host_context.clustering
    - dropped: cue_parent_process.baseline
      reason: "near-duplicate of cue_user_actor.baseline_svc (Q14): both aggregate the parent.name + Image|endswith pair. baseline_svc is a mandatory service-principal pair member."
      kept: cue_user_actor.baseline_svc
    - dropped: cue_user_actor pair (baseline+baseline_svc, clustering+clustering_svc)
      reason: "user_actor pairs (Q13/Q14, Q15/Q16) emitted as paired-and-distinct, non-deduplicable — user-pivot degenerates under service principals; the parent+binary substitute is the meaningful answer."
      kept: cue_user_actor.baseline + baseline_svc + clustering + clustering_svc
  skipped_templates:
    - template: powershell.script_block_logging
    - template: powershell.powershell_security_bypass
    - template: initial_access.delivery_vector
    - template: initial_access.campaign_scope
    - template: initial_access.application_patch_status
    - template: organizational_context.change_ticket
    - template: organizational_context.human_recall
    - template: organizational_context.timing_alignment
    - template: organizational_context.procedural_consistency
    - template: persistence_scope.process_based_persistence
    - template: persistence_scope.file_based_persistence
  reflection_overrides: []
  hint_dispositions:
    - hint: "cmd.exe: too common for Image-based scoping — use CommandLine patterns for mechanism_decode"
      disposition: declined
      reason: >-
        Acted on, not declined in spirit, but recorded here for the audit trail: the
        mechanism_decode question (Q5) keeps host+Image scope and its context directs the
        analyst to narrow on the command-line pattern when cmd.exe / powershell.exe return
        broad results. The triggering event is also pinned by ProcessGuid in
        verify_trigger_match (Q1). Listed as declined only because no standing
