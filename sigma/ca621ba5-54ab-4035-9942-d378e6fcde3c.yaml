name: HackTool - HandleKatz LSASS Dumper Execution
id: 098e6fb3-8418-4ed6-8084-031542e8228d
description: |
  Detects execution of the HandleKatz LSASS dumper, a tool that duplicates an existing handle to lsass.exe and
  uses that cloned handle to write an obfuscated memory dump of the process — harvesting credential material
  without opening a new, signature-prone handle of its own. The rule fires when EITHER the loader binary
  (loader.exe with a --pid: argument) is seen, OR a known HandleKatz import hash matches, OR a command line
  carries the tool's dumping flags together (--pid: and --outfile: alongside a dump/lsass/.dmp/.obf token).
  Legitimate memory acquisition by administrators or vetted forensic tooling can resemble this, so confirm which
  branch fired, whether LSASS memory was actually accessed and written to disk, and whether the resulting
  credentials were used for lateral movement.
type: detection
detection_id: ca621ba5-54ab-4035-9942-d378e6fcde3c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does this execution match HandleKatz — either the loader.exe with a --pid argument, a known HandleKatz import hash, or the combined dump flags?
  context: Confirm the alert is a true positive before investing time. The rule fires when ANY ONE of three branches matches — the image ends in loader.exe with a `--pid:` argument, the import hash matches a known HandleKatz build, OR the command line carries `--pid:` and `--outfile:` together with a dump/lsass/.dmp/.obf token. Note which branch fired — an import-hash-only match on a renamed binary is a stronger evasion signal than a plain loader.exe name, and the command-line branch tells you the target PID and output path directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- source: template:universal.host_user_context
  question: Is this user and host expected to run memory-acquisition or credential-dumping tooling?
  context: Legitimate memory acquisition is performed by a small set of administrators and forensic/IR tools on specific hosts. Knowing whether this account and endpoint have a documented reason to dump process memory is often the fastest way to separate an authorized capture from credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this HandleKatz execution part of an authorized penetration test or red team engagement?
  context: Offensive credential-dumping tools are routinely used in sanctioned security assessments. Before deeper analysis, check whether a pentest or red team exercise is active on this host or network segment. An authorized engagement with matching tooling and timing resolves the alert without further work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: What specific capability was invoked — which PID was targeted, and where was the dump written?
  context: HandleKatz is a single-purpose LSASS dumper, but its arguments reveal the operation's specifics. Read the `--pid:` value to confirm the target was lsass.exe, the `--outfile:` value for the dump path, and any `.obf` token indicating the output was obfuscated to evade dump-file scanning. Generic LSASS-dumping syntaxes to recognize alongside this tool include comsvcs.dll MiniDump, procdump, rundll32, and Invoke-Mimikatz.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: Was LSASS memory actually accessed and dumped, and by what method?
  context: HandleKatz targets LSASS memory (T1003.001) by duplicating an existing handle rather than opening a new full-access handle, then writing an obfuscated dump. Confirm from the command line and surrounding activity that lsass.exe was the target and that a dump was produced. The cloned-handle method is what lets it avoid the more obvious direct-access patterns, so absence of a classic 0x1F0FFF open does not mean no dump occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this dumper and is that parent chain expected?
  context: The parent reveals how the tool was launched. An interactive shell, a remote-execution service, or an Office/script host as parent points to hands-on-keyboard operation or a delivery chain, whereas a known IR/forensic launcher may indicate authorized use. Walk up from the immediate parent to see what staged the tool onto the host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1003.001.lsass_handle_access
  question: Did any process open or duplicate a high-access handle to lsass.exe around this time?
  context: The credential-dumping chain hinges on access to LSASS memory. A full-access open (GrantedAccess 0x1F0FFF) to lsass.exe from a non-security process is the classic signal; HandleKatz instead clones an existing handle, so also look for handle-duplication access from the dumper process. Correlating the access event with the dump-file write confirms the staged theft sequence and identifies which process did the reading.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\lsass.exe'
      selection_access:
        GrantedAccess:
          - '0x1F0FFF'
          - '0x1010'
          - '0x1410'
      condition: selection and selection_access
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: template:hacking_tool.tool_specific_artifacts
  question: Was an LSASS dump file written to disk by this tool?
  context: HandleKatz writes its output to the path given in `--outfile:`, frequently an obfuscated `.obf` blob or a `.dmp` file in a user-writable or temp directory such as %TEMP% or C:\Windows\Temp. A dump artifact on disk confirms credential material was extracted even if the dumper process has already exited; recovering it also tells you exactly which credentials were exposed.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_artifact:
        TargetFilename|contains:
          - '.dmp'
          - '.obf'
          - '\Temp\'
          - '\Users\Public\'
          - '\AppData\'
      condition: selection and selection_artifact
    fields:
      - TargetFilename
      - Image
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be exposed, and do any have elevated privileges?
  context: A LSASS dump exposes the credentials of every principal with cached material in memory at capture time — interactive users, service accounts, and any cached domain credentials. The severity turns on privilege — domain admin, service accounts with broad rights, or cached privileged sessions require escalation and credential rotation. Cross-reference the accounts active on this host with directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this dumper pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific dumping pattern — not generic binary usage — has historically run here. A new parent process, an unexpected account, or a first-time appearance is the deviation worth chasing; an established forensic-tool pattern is reassuring.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loader_img:
        Image|endswith: \loader.exe
        CommandLine|contains: '--pid:'
      selection_loader_imphash:
        Hashes|contains:
        - IMPHASH=38D9E015591BBFD4929E0D0F47FA0055
        - IMPHASH=0E2216679CA6E1094D63322E3412D650
      selection_flags:
        CommandLine|contains|all:
        - '--pid:'
        - '--outfile:'
        CommandLine|contains:
        - .dmp
        - lsass
        - .obf
        - dump
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loader_img:
        Image|endswith: \loader.exe
        CommandLine|contains: '--pid:'
      selection_loader_imphash:
        Hashes|contains:
        - IMPHASH=38D9E015591BBFD4929E0D0F47FA0055
        - IMPHASH=0E2216679CA6E1094D63322E3412D650
      selection_flags:
        CommandLine|contains|all:
        - '--pid:'
        - '--outfile:'
        CommandLine|contains:
        - .dmp
        - lsass
        - .obf
        - dump
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loader_img:
        Image|endswith: \loader.exe
        CommandLine|contains: '--pid:'
      selection_loader_imphash:
        Hashes|contains:
        - IMPHASH=38D9E015591BBFD4929E0D0F47FA0055
        - IMPHASH=0E2216679CA6E1094D63322E3412D650
      selection_flags:
        CommandLine|contains|all:
        - '--pid:'
        - '--outfile:'
        CommandLine|contains:
        - .dmp
        - lsass
        - .obf
        - dump
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user account do across the network around this time?
  context: Tracking the account's activity across all hosts can reveal lateral movement or a wider footprint. If the same account triggered similar dumping or remote-execution activity on multiple endpoints in the alert window, the scope of compromise may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loader_img:
        Image|endswith: \loader.exe
        CommandLine|contains: '--pid:'
      selection_loader_imphash:
        Hashes|contains:
        - IMPHASH=38D9E015591BBFD4929E0D0F47FA0055
        - IMPHASH=0E2216679CA6E1094D63322E3412D650
      selection_flags:
        CommandLine|contains|all:
        - '--pid:'
        - '--outfile:'
        CommandLine|contains:
        - .dmp
        - lsass
        - .obf
        - dump
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Credential dumping rarely happens in isolation. Earlier detections on the same host — defense tampering, privilege escalation, reconnaissance, or initial execution — may reveal the stages that led to this dump and help reconstruct the timeline. Defense tampering immediately before the dump is especially relevant.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this dumper pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this dumping pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment or a sanctioned sweep; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loader_img:
        Image|endswith: \loader.exe
        CommandLine|contains: '--pid:'
      selection_loader_imphash:
        Hashes|contains:
        - IMPHASH=38D9E015591BBFD4929E0D0F47FA0055
        - IMPHASH=0E2216679CA6E1094D63322E3412D650
      selection_flags:
        CommandLine|contains|all:
        - '--pid:'
        - '--outfile:'
        CommandLine|contains:
        - .dmp
        - lsass
        - .obf
        - dump
      condition: 1 of selection_*
    fields:
    - host.name
