name: Suspicious Kerberos Ticket Request via CLI
id: 25f918c0-cd8c-42f6-8409-1696d59f0dc3
description: |
  Detects powershell.exe or pwsh.exe invocations whose command line contains both the
  System.IdentityModel.Tokens.KerberosRequestorSecurityToken class reference and a .GetRequest() call.
  Requesting a Kerberos service ticket through this .NET class from the command line is the native,
  tool-free form of Kerberoasting: the returned TGS service ticket carries an RC4-encrypted blob derived
  from the service account password, which can be cracked offline, and the same primitive supports silver-ticket
  abuse. The rule fires only when the binary/OriginalFileName selection AND the command-line selection both match.
  Legitimate use is rare and usually limited to identity developers or security tooling; determine whether the
  user and host are expected to request service tickets this way, what SPN was targeted, and whether ticket
  requests, encryption downgrade, or lateral movement followed.
type: detection
detection_id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — a PowerShell process referencing KerberosRequestorSecurityToken and calling .GetRequest()?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process is powershell.exe or pwsh.exe AND the command line contains both System.IdentityModel.Tokens.KerberosRequestorSecurityToken and .GetRequest(). Read the full command line and process details and confirm both conditions are present, and note the targeted service principal name (SPN) passed as the ArgumentList.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to request Kerberos service tickets from the command line?
  context: Requesting a service ticket through the KerberosRequestorSecurityToken class is rarely part of routine administration. Identity or application developers and some security tooling do it deliberately; a general workstation or server account doing it is unusual. Knowing whether the user role and host function fit this behavior is often the fastest way to separate a true positive from sanctioned activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Which service principal name (SPN) was targeted by the ticket request?
  context: The SPN passed to the KerberosRequestorSecurityToken constructor (the ArgumentList value, e.g. HTTP/host.fqdn or MSSQLSvc/...) identifies the service account whose password hash is exposed by the returned ticket. Requests targeting high-privilege service accounts, or many SPNs requested in quick succession, indicate automated Kerberoasting rather than a single legitimate token request. Read the full command line and extract the SPN string.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: Was the command encoded or obfuscated, and what does it decode to?
  context: The KerberosRequestorSecurityToken request is often delivered inside a larger script that may be base64-encoded (-EncodedCommand / -enc) or obfuscated with backticks, concatenation, or variable substitution to hide the SPN and surrounding logic. Decode the command line to recover the actual SPN, any loop that enumerates multiple SPNs, and whether the script also exports or formats the resulting tickets for offline cracking.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full script content of this ticket request?
  context: Script block logging (Event ID 4104) records the deobfuscated script PowerShell actually executed, even when the command line is encoded. This is ground truth for what ran — the full Add-Type / New-Object KerberosRequestorSecurityToken sequence, any SPN enumeration loop, and whether output was piped to a file. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators frequently weaken PowerShell defenses before running credential-access tooling. Common precursors include AMSI bypass (patching amsi.dll in memory), execution-policy changes (-ExecutionPolicy Bypass / -ep bypass), and a version-2 downgrade that lacks logging. Finding these in the hour before the ticket request strengthens the case that the activity is operator-driven rather than a sanctioned identity test.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how the ticket request was launched. Interactive use under explorer.exe or a console host differs from invocation by wscript.exe, mshta.exe, an Office application, or a remote-execution service, which point to a scripted or remotely driven Kerberoasting run. Examine the parent and, where possible, what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell that requests Kerberos service tickets?
  context: Compare this user's current action against their 90-day history of running this binary. A user who has never requested service tickets this way is more suspicious than one who does so regularly as part of an identity or security role. Pair the count with knowledge of the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and PowerShell combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account) the user identity does not attribute behavior. The meaningful pivot is the launch mechanism — which parent spawned PowerShell, and whether that pair is historically common. A new or rare parent for this binary is the deviation worth chasing; a pair already accounting for thousands of prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the surrounding window reveals whether the ticket request is isolated or part of broader hands-on-keyboard activity such as reconnaissance, additional credential access, or lateral movement onto other endpoints.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and PowerShell combination fire on other hosts in the same window — a coordinated rollout, or activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus spawned binary — fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: attack:T1558.003.security
  question: Did Kerberos service-ticket requests (Event ID 4769) spike for this account, and were any returned with RC4 (etype 0x17) encryption?
  context: The command-line request culminates in a TGS request the domain controller logs as Event ID 4769. A burst of 4769 events for one account in a short window, or requests answered with RC4 (ticket encryption type 0x17) in an environment that otherwise uses AES, is the server-side signature of Kerberoasting. Compare the count against the account's normal ticket-request rate; correlate the 4769 timing to this process event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4769
      condition: selection
    fields:
      - TargetUserName
      - ServiceName
      - TicketEncryptionType
      - IpAddress
- source: attack:T1558.process_identification
  question: Did any process access LSASS memory on this host around the alert, and is that process on the expected allowlist?
  context: Kerberos ticket theft and forgery frequently pair command-line ticket requests with extraction of tickets or key material from LSASS memory. A process opening LSASS with handle access for read or inject around the alert time — particularly one not on the expected list of security and system processes — points to ticket extraction rather than a benign token request. Identify the accessing process and confirm whether it is sanctioned.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\lsass.exe'
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
      - User
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: A cracked service-account hash or a forged ticket is used to move laterally. New authentication events or outbound remote connections (RDP, SMB, WinRM, PsExec) shortly after the ticket request indicate the requested or stolen credential is being exercised. Because offline cracking takes time, also watch for delayed reuse, not just immediate follow-on.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:credential_access.credential_exposure_assessment
  question: Which service account was targeted, and does it hold elevated privileges?
  context: The severity depends on the privilege of the targeted service account. An SPN tied to a domain-admin-equivalent or broadly delegated service account requires escalation; a low-privilege application service account may only need a password rotation and monitoring. Cross-reference the SPN's underlying account against directory group memberships and delegation settings.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Credential access rarely happens in isolation. Earlier detections on the same host — reconnaissance, SPN enumeration, defense tampering, or other credential-access activity — may reveal the stages that preceded the ticket request and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering often precedes hands-on credential access. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
