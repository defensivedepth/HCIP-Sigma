name: Potentially Suspicious Call To Win32_NTEventlogFile Class
id: 23c64261-6241-48a3-aa20-fb4e453c8515
description: |
  Detects command lines that reference the WMI class Win32_NTEventlogFile together with one of its
  event-log methods (BackupEventlog, ClearEventLog, Delete/DeleteEx, ChangeSecurityPermissions(Ex),
  Rename, or TakeOwnerShip(Ex)). The rule fires only when both the class reference and a method call
  are present in the same command line. This WMI class is a programmatic alternative to wevtutil and
  Clear-EventLog for backing up, clearing, deleting, or re-permissioning event log files, and is
  commonly used to clear evidence — often the Security log — after hands-on-keyboard activity.
  Legitimate use exists (backup or log-management scripting), so the investigation should determine
  which method ran against which log, who and what invoked it, and whether the action lines up with
  expected administration on this host.
type: detection
detection_id: caf201a9-c2ce-4a26-9c3a-2b9525413711
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line reference Win32_NTEventlogFile together with an event-log method call?
  context: Confirm this is a true positive before investing time. The rule fires only when the command
    line both names the Win32_NTEventlogFile class AND invokes one of its methods (.BackupEventlog(,
    .ClearEventLog(, .Delete(/.DeleteEx(, .ChangeSecurityPermissions(/Ex, .Rename(, or .TakeOwnerShip(/Ex).
    Read the full command line and verify both halves are present rather than a benign read-only query.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to back up, clear, or re-permission event logs via WMI?
  context: Legitimate log-management or backup scripting can use this class, but for most users and
    endpoints programmatic event-log clearing or ACL changes is not routine. Knowing whether the user
    role and host function include event-log administration is often the fastest way to separate a true
    positive from sanctioned maintenance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: Which event-log method was called and against which log, and was it a backup, a clear, a
    delete, or a permission/ownership change?
  context: The exact method and target log reveal intent. .ClearEventLog( and .Delete(/.DeleteEx(
    destroy records; .BackupEventlog( may precede a clear to selectively keep evidence;
    .ChangeSecurityPermissions(Ex) and .TakeOwnerShip(Ex) re-permission the log so it can be modified.
    A LogFileName or path filter for Security in the command line is more concerning than Application
    or System. Decode the full command line to identify the method, the log targeted, and any backup
    destination path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_class:
        CommandLine|contains: Win32_NTEventlogFile
      condition: selection_host and selection_class
    fields:
      - CommandLine
      - CurrentDirectory
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned the script host that issued this WMI call, and is that parent chain expected?
  context: The parent reveals how the call was invoked. Interactive administration typically descends
    from explorer.exe or a console, and automation from a scheduler or service. Parents such as
    mshta.exe, wscript.exe, a remote-execution service, or an Office application point toward a macro,
    a downloaded script, or remote operator activity rather than routine log management.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host previously run command lines referencing the Win32_NTEventlogFile class?
  context: A WMI call against this event-log class that has never been seen on a host is more suspicious
    than one that runs regularly as part of known log-management scripting. Scoped to command lines that
    name the class rather than the script host binary, since the rule does not constrain which interpreter
    ran. Zero or very low historical counts indicate first-time or rare use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: Win32_NTEventlogFile
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users normally drove
    it, and does the current alert fit?
  context: Even routine log maintenance can be scripted. The query mirrors the rule's selection (class
    reference plus an event-log method call) scoped to this host, so the parent and user distribution
    reflects how this specific firing pattern has historically run here. A new parent process, an
    unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_class:
        CommandLine|contains: Win32_NTEventlogFile
      selection_function:
        CommandLine|contains:
        - .BackupEventlog(
        - .ChangeSecurityPermissions(
        - .ChangeSecurityPermissionsEx(
        - .ClearEventLog(
        - .Delete(
        - .DeleteEx(
        - .Rename(
        - .TakeOwnerShip(
        - .TakeOwnerShipEx(
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did the script host spawn after issuing this WMI call?
  context: Processes spawned afterward reveal the broader operation. Event-log clearing is frequently
    one step among several — credential access, lateral movement, or impact may follow. Unexpected
    children such as cmd.exe, certutil.exe, or additional script hosts indicate continued hands-on
    activity beyond the log action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Log tampering rarely occurs alone. Activity surrounding the WMI call may reveal preceding
    reconnaissance or credential access, or follow-on persistence and data staging that gives the action
    its real meaning. Scan for novel binaries appearing alongside the alert.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host
    distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count
    of this firing pattern rather than generic WMI usage. Many hosts running the same class-plus-method
    pattern points to scripted log management or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_class:
        CommandLine|contains: Win32_NTEventlogFile
      selection_function:
        CommandLine|contains:
        - .BackupEventlog(
        - .ChangeSecurityPermissions(
        - .ChangeSecurityPermissionsEx(
        - .ClearEventLog(
        - .Delete(
        - .DeleteEx(
        - .Rename(
        - .TakeOwnerShip(
        - .TakeOwnerShipEx(
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_class:
        CommandLine|contains: Win32_NTEventlogFile
      selection_function:
        CommandLine|contains:
        - .BackupEventlog(
        - .ChangeSecurityPermissions(
        - .ChangeSecurityPermissionsEx(
        - .ClearEventLog(
        - .Delete(
        - .DeleteEx(
        - .Rename(
        - .TakeOwnerShip(
        - .TakeOwnerShipEx(
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_class:
        CommandLine|contains: Win32_NTEventlogFile
      selection_function:
        CommandLine|contains:
        - .BackupEventlog(
        - .ChangeSecurityPermissions(
        - .ChangeSecurityPermissionsEx(
        - .ClearEventLog(
        - .Delete(
        - .DeleteEx(
        - .Rename(
        - .TakeOwnerShip(
        - .TakeOwnerShipEx(
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action.
    If the same user issued event-log calls or other administrative actions on multiple endpoints in
    this window, the scope of the activity may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_class:
        CommandLine|contains: Win32_NTEventlogFile
      selection_function:
        CommandLine|contains:
        - .BackupEventlog(
        - .ChangeSecurityPermissions(
        - .ChangeSecurityPermissionsEx(
        - .ClearEventLog(
        - .Delete(
        - .DeleteEx(
        - .Rename(
        - .TakeOwnerShip(
        - .TakeOwnerShipEx(
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, or persistence mechanisms near the log action.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access
    — may reveal the stages that preceded the event-log action and help reconstruct the timeline. Log
    clearing commonly comes after operator activity it is meant to hide.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were other tamper attempts against endpoint protection or logging seen on this host in the
    hour before the alert?
  context: This rule already detects one form of log tampering; this sweep surfaces other tamper actions
    on the same host — disabling AV/EDR services, flipping Defender flags, adding exclusions, or clearing
    logs by other means. Zero rows is a useful "nothing else was touched" signal; kernel-level driver
    tampering and in-memory patches will not appear here. Populated rows shift the disposition toward
    operator preparation; review the parent and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
