name: Suspicious Driver/DLL Installation Via Odbcconf.EXE
id: 537dc5b1-771e-44df-af16-db17b1fea8f5
description: |
  Detects odbcconf.exe invoked with the INSTALLDRIVER action where the driver value does not carry a
  .dll extension. odbcconf.exe is a signed Microsoft ODBC configuration utility that can be abused to
  register and load arbitrary DLLs, providing proxy execution under a trusted binary. The rule fires
  when the Image ends in \odbcconf.exe (or OriginalFileName is odbcconf.exe) AND the command line
  contains "INSTALLDRIVER " AND the command line does NOT contain ".dll" — the missing extension is
  what separates this from routine driver setup. Investigation should confirm the driver path the
  command registered, determine which module odbcconf.exe loaded afterward, and establish whether the
  user, host, and parent chain are consistent with legitimate ODBC administration.
type: detection
detection_id: cb0fe7c5-f3a3-484d-aa25-d350a7912729
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the odbcconf.exe command line contain the INSTALLDRIVER action without a .dll extension?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when
    the process is odbcconf.exe (by Image or OriginalFileName) AND the command line contains
    "INSTALLDRIVER " AND it does not contain ".dll". A driver value pointing at a non-.dll path is the
    distinguishing signal — note the full driver string the action registered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to install or configure ODBC drivers?
  context: Legitimate ODBC driver installation is normally performed by installers, packaging systems,
    or administrators on systems that host database connectivity. A workstation or server with no ODBC
    administration role running INSTALLDRIVER interactively is harder to explain and shifts the
    disposition toward proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What driver entry and module path did this INSTALLDRIVER command register?
  context: Parse the full INSTALLDRIVER argument. The action takes a driver definition of the form
    "name|Driver=<path>|APILevel=2"; the Driver= value is the module odbcconf.exe will register and can
    later load. Identify the registered path, whether it lives in a user-writable or temporary location,
    and whether the file is signed. The absence of a .dll extension is a known evasion against extension-
    based filtering — the registered module is still a loadable library.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: 'INSTALLDRIVER '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned odbcconf.exe and is that parent chain expected?
  context: The parent process reveals how odbcconf.exe was invoked. Installer frameworks (msiexec.exe),
    interactive shells, or explorer.exe are common for legitimate ODBC setup. Script hosts (wscript.exe,
    cscript.exe, mshta.exe), Office applications, or another LOLBIN as the parent point toward scripted
    or chained proxy execution.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.008.image_load
  question: What modules did odbcconf.exe load after this execution, and were any unsigned or from non-standard paths?
  context: The point of INSTALLDRIVER abuse is to make odbcconf.exe load and execute an attacker-supplied
    library. Examining the modules loaded by odbcconf.exe shows whether the registered driver path was
    actually pulled in. Standard ODBC modules ship from System32/SysWOW64 and are Microsoft-signed; an
    unsigned module, or one loaded from a user-writable, temporary, or download directory, is the
    execution payload. If image-load events are not collected in this environment, treat zero results as
    a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \odbcconf.exe
      filter_signed_system:
        ImageLoaded|startswith:
          - 'C:\Windows\System32\'
          - 'C:\Windows\SysWOW64\'
      condition: selection and not filter_signed_system
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_process_tool.follow_on
  question: What child processes did odbcconf.exe spawn afterward?
  context: A loaded malicious driver can launch follow-on activity. Legitimate ODBC configuration spawns
    little or nothing; child processes such as cmd.exe, powershell.exe, rundll32.exe, or certutil.exe
    indicate the loaded module executed post-exploitation code through the trusted parent.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.008.network_connection
  question: Did odbcconf.exe or a process it spawned make outbound network connections after this execution?
  context: A module loaded through odbcconf.exe may retrieve a second-stage payload or establish command
    and control. odbcconf.exe making network connections is itself unusual for the legitimate utility.
    Review destinations for external addresses, uncommon ports, or connections that do not match known
    enterprise services. If network telemetry is not collected here, absence of results is a visibility
    gap, not a clean result.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \odbcconf.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.baseline
  question: Does this host normally run odbcconf.exe?
  context: A binary that has never or rarely run on a host is more suspicious than one that runs
    regularly. odbcconf.exe is a niche utility; on most endpoints it should be absent or tied to a known
    install event. Zero or very low historical counts indicate first-time or rare execution worth
    explaining.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even legitimate tools can be abused. This query mirrors the rule's selection structure scoped
    to this host, so the parent/user distribution reflects how the rule's specific firing pattern — not
    generic odbcconf.exe usage — has historically run here. A new parent process, an unexpected user
    account, or an unusual command-line shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains: 'INSTALLDRIVER '
      filter_main_dll_ext:
        CommandLine|contains: .dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run odbcconf.exe or perform ODBC driver administration?
  context: Compare this user's current action against their historical behavior. A user who has never run
    odbcconf.exe or performed driver installation is more suspicious than one who does so routinely. User
    role and typical toolset should align with managing database connectivity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+odbcconf.exe combination historically routine on this host or environment-wide, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism — which parent process spawned odbcconf.exe, and whether
    that pair is historically common. A new or rare parent for this binary is the deviation worth
    chasing; a pair that already accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity elsewhere, the scope may be larger
    than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+odbcconf.exe combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did network-wide returns agent-telemetry
    noise. The meaningful question is whether the same launch mechanism — parent process plus spawned
    binary — fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, or persistence mechanisms near the odbcconf.exe
    execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern, not generic odbcconf.exe usage. Many hosts firing the
    same pattern points to scripted deployment or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains: 'INSTALLDRIVER '
      filter_main_dll_ext:
        CommandLine|contains: .dll
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes proxy execution. The query surfaces direct attempts to disable
    AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows
    is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches
    will not appear here. Populated rows shift the disposition toward operator preparation; review the
    parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the attack stages that preceded this proxy execution
    and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
