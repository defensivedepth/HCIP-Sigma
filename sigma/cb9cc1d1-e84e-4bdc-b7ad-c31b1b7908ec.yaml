name: Insecure Transfer Via Curl.EXE
id: 4e9cd950-0eff-4223-b916-3b1764a9d7cb
description: |
  Detects execution of curl.exe with the insecure-transfer flag (-k or --insecure), which tells curl to skip TLS
  peer-certificate verification. The rule fires when the process is curl.exe (matched by Image path ending in \curl.exe
  or by OriginalFileName) AND the command line carries the -k / --insecure switch. Skipping certificate verification is
  occasionally legitimate against badly maintained internal or development hosts with self-signed certificates, but it is
  also used to fetch tooling or beacon to infrastructure with invalid or attacker-controlled certificates without the
  transfer failing. The investigation should establish what was transferred, where it went, whether the destination is
  expected, and whether curl is a normal tool for this user and host.
type: detection
detection_id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — curl.exe invoked with the -k or --insecure flag?
  context: Confirm the alert is a true positive before investing time. The rule fires when the process is curl.exe (Image
    ending in \curl.exe or OriginalFileName curl.exe) and the command line contains -k or --insecure. Read the exact command
    line and verify the insecure-transfer switch is present and that the binary is genuinely curl.exe rather than a renamed
    copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to transfer data with curl over TLS-unverified connections?
  context: Legitimate administrative or development activity can trigger this rule, particularly against internal or
    development systems with self-signed certificates. Knowing whether this user role and host function routinely use curl
    with verification disabled is often the fastest path to separating routine operations from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this curl invocation do? Decode the full command line — destination URL, protocol, output path,
    proxy, and upload flags.
  context: The full command line reveals the operation. Identify the target URL or host and protocol, whether output is
    written to disk (-o/-O/--output, --create-dirs), whether a proxy or tunnel is in use (-x/--proxy, --proxytunnel,
    --socks*), whether DNS-over-HTTPS bypasses local resolution (--doh-url, --doh-insecure), whether a file is being
    uploaded (-T/--upload-file, -d/--data, -F/--form), and whether request headers or user-agent are spoofed (-H, -A).
    These distinguish a benign fetch from tool delivery, exfiltration, or tunneled command-and-control.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: llm_generated
  question: What network connections did this curl process make, and is the destination expected?
  context: Because verification is disabled, curl will complete a transfer to a host presenting an invalid, expired, or
    attacker-controlled certificate. Pivot from the curl process to its network connections to identify the destination
    address and port, then assess whether that endpoint is an expected internal or development system versus unfamiliar
    external infrastructure. A destination on a non-standard port or to an external address that no other process contacts
    raises the priority of the transfer.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: template:cue_process_tool.process_chain
  question: What process spawned this curl execution, and is that parent chain expected?
  context: The parent process reveals how curl was invoked. Interactive use typically descends from explorer.exe or a shell
    a user opened; script or scheduled execution descends from cmd.exe, powershell.exe, or a task host. Parents such as
    wscript.exe, mshta.exe, or an Office application point to script-driven or macro-driven invocation rather than hands-on
    administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did curl spawn afterward on this host?
  context: curl itself does not normally spawn children, so processes launched by it shortly after the transfer can indicate
    that a downloaded payload was executed. Watch for cmd.exe, powershell.exe, wscript.exe, rundll32.exe, or an unfamiliar
    binary started from a staging directory, which would show the transfer progressed into execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run curl.exe?
  context: A binary that has rarely or never run on a host is more notable than one that runs regularly. Zero or very low
    counts over the trailing period indicate first-time or rare use of curl here, which makes an insecure transfer worth
    closer attention.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure (curl.exe with -k / --insecure)
    scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has
    historically run here rather than generic curl usage. A new parent process, an unexpected user account, or an unusual
    command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
      - CommandLine|re: \s-k\s
      - CommandLine|contains: --insecure
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run curl.exe?
  context: Compare this user's current action against their historical behavior. A user who has never run curl with
    verification disabled is more notable than one who does so regularly, and the result should align with the user's role
    — developers and administrators may have a legitimate baseline, general users typically do not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+curl.exe combination historically routine on this host or across the environment, or is the parent
    unusual for curl?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account),
    user identity does not attribute behavior. The meaningful pivot is the launch mechanism — which parent process spawned
    curl, and whether that pair is historically common. A new or rare parent for curl on this host or environment-wide is
    the deviation worth chasing; a pair that already accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same account triggered related activity on
    multiple endpoints. If the user drove similar transfers or tooling on other hosts in the same window, the scope of the
    activity is broader than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+curl.exe combination fire on other hosts in the same window — a coordinated automation
    rollout, or activity isolated to this host?
  context: Under a service principal, asking what else the user did network-wide returns agent-telemetry noise, since every
    host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process
    plus curl — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    the transfer, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, staging, or persistence around the curl execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages
    that preceded the transfer and help reconstruct the timeline. A tampering or reconnaissance alert shortly before an
    insecure curl transfer changes how the transfer should be read.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other download or transfer LOLBins used on this host recently?
  context: Actors who use one transfer LOLBin often use several. If curl fetched a payload, check whether certutil,
    bitsadmin, esentutl, or similar tools were also used to download or stage files. Multiple transfer LOLBins on the same
    host within a short window strengthens the case that this is tooling delivery rather than isolated administration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was curl.exe executed from an expected path?
  context: curl.exe ships in System32. Execution from a user-writable or non-standard path (a temp directory, a download
    folder, ProgramData) may indicate the binary was copied or renamed to evade path-based allowlists. Compare the Image
    path against the expected System32 location, and confirm OriginalFileName is curl.exe even when the on-disk name differs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's curl insecure-transfer pattern over the past 90 days, and what
    command-line shapes are typical?
  context: A transfer pattern with no prior history on a host is more notable than one used routinely under stable parents.
    The query mirrors the rule's selection structure (curl.exe with -k / --insecure) scoped to this host, so the count
    reflects the rule's specific firing pattern rather than generic curl usage. The command-line projection lets you compare
    typical invocation shapes — destinations, output paths, proxies — against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
      - CommandLine|re: \s-k\s
      - CommandLine|contains: --insecure
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
