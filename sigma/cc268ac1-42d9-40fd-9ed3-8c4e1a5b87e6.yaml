name: Devtoolslauncher.exe Executes Specified Binary
id: f93834b8-a449-4512-a0f1-42b9976a7f1d
description: |
  Detects the Microsoft-signed binary devtoolslauncher.exe being invoked with the LaunchForDeploy argument, which causes it to hand off execution of a specified binary to developertoolssvc.exe. The rule fires when the Image ends in devtoolslauncher.exe AND the command line contains LaunchForDeploy. Because devtoolslauncher.exe ships with Visual Studio / VS Code and is trusted, this is a proxy-execution path that lets an operator run an arbitrary binary under a signed parent rather than launching it directly; legitimately it is exercised only on developer endpoints with VS tooling installed. Investigation should determine which binary and arguments were passed to LaunchForDeploy, what that target binary then did, what process invoked devtoolslauncher.exe, and whether the same pattern is isolated to this host or seen across the fleet.
type: detection
detection_id: cc268ac1-42d9-40fd-9ed3-8c4e1a5b87e6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does this event match the rule — devtoolslauncher.exe invoked with the LaunchForDeploy argument?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details against the detection criteria. The rule requires both the binary (Image ending in devtoolslauncher.exe) and the LaunchForDeploy keyword on the command line; verify both are present and read off the target binary path and arguments that follow LaunchForDeploy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run developer tooling that proxy-executes binaries?
  context: devtoolslauncher.exe ships with Visual Studio and VS Code and is only present on endpoints with that tooling installed. A developer workstation invoking it during a build or deploy workflow is routine; the same binary on a server, kiosk, or general-purpose endpoint with no development role is unusual and points toward deliberate proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What binary and arguments were passed to LaunchForDeploy? Decode the full command line.
  context: The full command line reveals what devtoolslauncher.exe was asked to execute. The LaunchForDeploy form takes an absolute path to a target executable followed by quoted arguments, so extract the target binary path, its arguments, and any trailing token. The target binary — not devtoolslauncher.exe — is what actually runs, so its identity and location are the primary indicators of intent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.command_analysis
  question: What is the target binary referenced on the command line — where does it live, is it signed, and what does its reputation indicate?
  context: Resolve the executable path supplied after LaunchForDeploy and examine the file directly — its directory (a user-writable location such as a profile, Temp, or download folder is more suspicious than a vendor install path), its signing status and signer, and any threat-intel reputation on its hash. An unsigned binary in a user-writable path is the proxy-execution payload; a signed binary in a normal install path points to legitimate developer tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- source: template:cue_process_tool.follow_on
  question: What child processes ran from this binary, and did the specified target binary actually execute?
  context: devtoolslauncher.exe hands execution to developertoolssvc.exe, which spawns the specified target binary, so the proxy-executed payload appears as a descendant rather than a direct child of the alerting process. Look for developertoolssvc.exe and for the target executable named on the command line starting in the same window, and for any interpreters or LOLBins (cmd.exe, powershell.exe, rundll32.exe) it launches in turn.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.network_connection
  question: Did the proxy-executed binary or developertoolssvc.exe make outbound network connections in the window after the alert?
  context: Proxy execution is often a delivery or staging step; the binary run via LaunchForDeploy may retrieve a second-stage payload or establish command-and-control. Outbound connections from developertoolssvc.exe or the spawned target binary to external addresses — especially raw IP literals, non-standard ports, or low-reputation hosts — indicate the executed binary did more than run locally. No outbound activity narrows the impact to local execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \developertoolssvc.exe
          - \devtoolslauncher.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.process_chain
  question: What process spawned devtoolslauncher.exe, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. The Visual Studio IDE or a build/deploy script launching it as part of a developer workflow is routine; script hosts, shells, or remote-access tooling (wscript.exe, powershell.exe, cmd.exe, mshta.exe) spawning devtoolslauncher.exe with LaunchForDeploy point to scripted or operator-driven proxy execution.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run devtoolslauncher.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low counts over the baseline window indicate first-time or rare execution; a host with no development role that has never run this VS-bundled binary before is a strong signal that the invocation is deliberate rather than routine tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even trusted developer binaries get abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern (devtoolslauncher.exe with LaunchForDeploy) has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \devtoolslauncher.exe
        CommandLine|contains: LaunchForDeploy
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \devtoolslauncher.exe
        CommandLine|contains: LaunchForDeploy
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \devtoolslauncher.exe
        CommandLine|contains: LaunchForDeploy
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar activity on more than one host in the window, the scope of the operation may be larger than a single proxy execution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \devtoolslauncher.exe
        CommandLine|contains: LaunchForDeploy
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern (devtoolslauncher.exe with LaunchForDeploy) rather than generic use of the binary. Many hosts firing the same pattern points to scripted developer deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \devtoolslauncher.exe
        CommandLine|contains: LaunchForDeploy
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the event reveals what led to it and what followed — look for reconnaissance, additional execution, privilege escalation, or persistence that places the proxy-execution into a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this proxy execution and help reconstruct the timeline. A LOLBin proxy-execution following earlier suspicious activity reads differently than one in isolation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
