name: MSHTA Execution with Suspicious File Extensions
id: 9bb7a9eb-a42b-409f-90a6-3ac5822a334b
description: |
  Detects mshta.exe executing a command line that references a file with an extension not typically associated with HTML Applications (for example .png, .jpg, .zip, .pdf, .lnk, or the vbscript: scheme). The rule fires only when both conditions hold together: the process is mshta.exe (by Image path or OriginalFileName) AND its command line contains one of these non-HTA extensions. mshta.exe parses any file for an embedded HTA or XSL section regardless of extension, so attackers stage scripts inside polyglot or misleadingly-named files to proxy-execute VBScript/JScript through a signed Microsoft binary and evade extension-based controls. Legitimate HTA usage almost always references a .hta file from a predictable parent; determine what the referenced file actually contained, what mshta did afterward, and whether the parent and user fit normal activity for this host.
type: detection
detection_id: cc7abbd0-762b-41e3-8a26-57ad50d2eea3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show mshta.exe referencing a file with a non-HTA extension or the vbscript scheme?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule requires both that the process is mshta.exe (by Image path or OriginalFileName) and that the command line contains a suspicious extension such as .png, .jpg, .zip, .pdf, .lnk, or the literal vbscript token. Note exactly which file and extension was referenced -- that file is the payload to recover and analyze.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run mshta.exe against files of this type?
  context: Legitimate HTA execution is uncommon on most endpoints and usually references a .hta file from a known internal path. Knowing whether this user role and host function normally execute HTML Applications -- and whether they would ever point mshta at an image, archive, or document -- is often the fastest way to separate routine line-of-business tooling from proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.evidence_preservation
  question: Is the file referenced on the mshta command line still on disk for analysis?
  context: The file mshta loaded is the payload. If it still exists, recovering it enables hash lookup, content review for an embedded HTA or XSL section, and sandbox submission. Look for the path named on the command line; the file may carry a benign-looking extension while internally containing an HTA application tag or an msxsl:script block.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: What file did mshta load, and does that file contain an embedded HTA application tag or msxsl script block?
  context: mshta.exe scans whatever file it is passed for an HTA application section or an XSL stylesheet with embedded script, ignoring the extension and any leading binary bytes. Inspect the full command line to identify the loaded file and its origin (local path, UNC, or URL). Then examine the file content for an HTA:APPLICATION tag, a vbscript or javascript URI scheme, or the urn:schemas-microsoft-com:xslt namespace with an msxsl:script element -- these reveal whether the file is a script disguised under a non-HTA extension.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:obfuscation.encoded_payload_decode
  question: Is the loaded content encoded or obfuscated, and what does it decode to?
  context: HTA and XSL payloads commonly hide their real action behind VBScript Chr() chains, JScript String.fromCharCode concatenation, base64, or hex. If mshta was invoked with an inline vbscript or javascript URI scheme, the entire payload is on the command line; reconstruct any character-code chains or decode base64 to recover the actual operation, which is typically a download cradle, a WScript.Shell Run call, or a secondary process launch. If the payload lives in a file on disk rather than on the command line, decode it from the recovered file content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned mshta.exe, and is that parent chain expected?
  context: The parent reveals how mshta was invoked. User-driven HTA execution usually descends from explorer.exe or a browser. Parents such as Office applications (winword.exe, excel.exe, outlook.exe), wscript.exe, cscript.exe, cmd.exe, or powershell.exe point to macro-borne or scripted delivery rather than a user opening an application. Walk up to the parent's own parent to see what initiated the chain.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was mshta.exe executed from its expected System32 or SysWOW64 path?
  context: mshta.exe normally runs from %windir%\system32\mshta.exe or %windir%\syswow64\mshta.exe. Execution from a user-writable location such as a temp, downloads, or profile directory suggests the binary was copied or renamed to dodge path-based allowlists. Compare the Image path against OriginalFileName to detect a renamed copy of mshta.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.follow_on
  question: What child processes did mshta.exe spawn afterward?
  context: The processes mshta launches reveal its actual effect. Proxy execution through mshta frequently leads to cmd.exe, powershell.exe, wscript.exe, cscript.exe, wmic.exe, csc.exe, or installutil.exe -- the latter two indicating an in-memory .NET compile-and-run that bypasses script controls. Any child that performs download, decode, or further script execution confirms the HTA carried an active payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.005.network_retrieval
  question: Did mshta.exe or its child processes make outbound network connections shortly after execution?
  context: mshta can load an HTA or XSL directly from a remote URL or UNC path, and HTA payloads commonly fetch a second-stage download. An outbound connection from mshta.exe to an external or otherwise unexpected endpoint, or a connection from a child it spawned, indicates remote payload retrieval or command-and-control rather than execution of a purely local file. Review the destination address and port against known-good infrastructure.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \mshta.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this mshta extension pattern, what parents and users drove it, and does the current alert fit?
  context: Even a signed Microsoft binary gets abused. This query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern -- mshta against a non-HTA extension -- has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mshta.exe
      - OriginalFileName: mshta.exe
      selection_cli:
        CommandLine|contains:
        - .7z
        - .avi
        - .bat
        - .bmp
        - .conf
        - .csv
        - .dll
        - .doc
        - .gif
        - .gz
        - .ini
        - .jpe
        - .jpg
        - .json
        - .lnk
        - .log
        - .mkv
        - .mp3
        - .mp4
        - .pdf
        - .png
        - .ppt
        - .rar
        - .rtf
        - .svg
        - .tar
        - .tmp
        - .txt
        - .xls
        - .xml
        - .yaml
        - .yml
        - .zip
        - vbscript
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mshta.exe
      - OriginalFileName: mshta.exe
      selection_cli:
        CommandLine|contains:
        - .7z
        - .avi
        - .bat
        - .bmp
        - .conf
        - .csv
        - .dll
        - .doc
        - .gif
        - .gz
        - .ini
        - .jpe
        - .jpg
        - .json
        - .lnk
        - .log
        - .mkv
        - .mp3
        - .mp4
        - .pdf
        - .png
        - .ppt
        - .rar
        - .rtf
        - .svg
        - .tar
        - .tmp
        - .txt
        - .xls
        - .xml
        - .yaml
        - .yml
        - .zip
        - vbscript
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mshta.exe
      - OriginalFileName: mshta.exe
      selection_cli:
        CommandLine|contains:
        - .7z
        - .avi
        - .bat
        - .bmp
        - .conf
        - .csv
        - .dll
        - .doc
        - .gif
        - .gz
        - .ini
        - .jpe
        - .jpg
        - .json
        - .lnk
        - .log
        - .mkv
        - .mp3
        - .mp4
        - .pdf
        - .png
        - .ppt
        - .rar
        - .rtf
        - .svg
        - .tar
        - .tmp
        - .txt
        - .xls
        - .xml
        - .yaml
        - .yml
        - .zip
        - vbscript
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the same window reveals whether this is isolated or part of broader hands-on activity. The same user triggering similar execution on multiple endpoints widens the likely scope. If the alert fired under a service principal this view returns agent-telemetry noise, in which case the parent-plus-binary view is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mshta.exe
      - OriginalFileName: mshta.exe
      selection_cli:
        CommandLine|contains:
        - .7z
        - .avi
        - .bat
        - .bmp
        - .conf
        - .csv
        - .dll
        - .doc
        - .gif
        - .gz
        - .ini
        - .jpe
        - .jpg
        - .json
        - .lnk
        - .log
        - .mkv
        - .mp3
        - .mp4
        - .pdf
        - .png
        - .ppt
        - .rar
        - .rtf
        - .svg
        - .tar
        - .tmp
        - .txt
        - .xls
        - .xml
        - .yaml
        - .yml
        - .zip
        - vbscript
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Proxy execution rarely happens in isolation. Earlier detections on the same host -- phishing-related activity, reconnaissance, defense tampering, or credential access -- may reveal the stages that preceded this event and help reconstruct the timeline that led to mshta being invoked.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who reach for one signed-binary proxy often use several. If mshta loaded a script payload, check whether rundll32, regsvr32, wmic, msbuild, installutil, msiexec, or similar binaries were also used on this host to run code -- finding multiple proxy-execution LOLBins around the same time strengthens the case for hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
          - '\certutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the mshta extension pattern over the past 90 days, and what command-line structures are typical?
  context: An mshta-against-non-HTA pattern with no prior history on a host is more notable than one seen regularly under stable parents. This query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than all mshta usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mshta.exe
      - OriginalFileName: mshta.exe
      selection_cli:
        CommandLine|contains:
        - .7z
        - .avi
        - .bat
        - .bmp
        - .conf
        - .csv
        - .dll
        - .doc
        - .gif
        - .gz
        - .ini
        - .jpe
        - .jpg
        - .json
        - .lnk
        - .log
        - .mkv
        - .mp3
        - .mp4
        - .pdf
        - .png
        - .ppt
        - .rar
        - .rtf
        - .svg
        - .tar
        - .tmp
        - .txt
        - .xls
        - .xml
        - .yaml
        - .yml
        - .zip
        - vbscript
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
