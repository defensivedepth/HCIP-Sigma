name: Rebuild Performance Counter Values Via Lodctr.EXE
id: f33c17e9-7f79-4930-87ff-6faa8e38c7fa
description: |
  Detects execution of lodctr.exe with the -r (rebuild) switch, which rebuilds the
  Windows performance-counter registry values under HKLM\SOFTWARE\Microsoft\Windows NT
  \CurrentVersion\Perflib from the .ini definitions in System32. The rule fires when the
  Image ends in lodctr.exe (or OriginalFileName is LODCTR.EXE) AND the command line
  contains -r (windash-normalized). Legitimate use is an administrator or installer
  repairing corrupted counter data; the same operation can be abused to overwrite counter
  configuration with a malicious definition and confuse or blind performance-counter-based
  monitoring. Investigation should confirm the -r invocation, decode the full command line
  and any supplied config file, establish whether the user/host normally perform this
  maintenance, and look at the parent chain and surrounding host activity for signs the
  rebuild was operator-driven rather than routine servicing.
type: detection
detection_id: cc9d3712-6310-4320-b2df-7cb408274d53
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the lodctr.exe rebuild pattern this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when
    the Image ends in lodctr.exe (or OriginalFileName is LODCTR.EXE) and the command line contains the
    -r rebuild switch (matched windash-normalized, so /r, -r, and -R all qualify). Review the alerting
    event and confirm both the binary identity and the presence of the rebuild switch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to rebuild performance counters with lodctr.exe?
  context: Legitimate counter rebuilds are usually done by an administrator or an installer repairing
    corrupted Perflib data. Knowing whether the user role and host function are consistent with
    performance-counter maintenance is often the fastest path to separating routine servicing from
    operator activity intended to blind monitoring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this lodctr.exe invocation do? Decode the full command line and any config file it loaded.
  context: The full command line reveals whether the rebuild used only the -r switch or also supplied a
    file path or alternate definition source. lodctr.exe -r rewrites the Perflib counter and help values
    from .ini definitions; a supplied config file is the lever an operator would use to overwrite counter
    configuration. Decode every argument and note any file path referenced.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|windash: ' -r'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned lodctr.exe and is that parent chain expected?
  context: The parent process reveals how the rebuild was invoked. Counter maintenance launched by an
    installer, a servicing host process, or an interactive admin shell has a predictable parent chain.
    An unexpected parent such as a script host, an Office application, or an unusual interactive shell
    points to operator-driven execution rather than routine servicing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run lodctr.exe?
  context: A counter rebuild that has never been seen on a host is more notable than one that recurs with
    servicing. Zero or very low historical counts indicate first-time or rare execution and raise the bar
    for a benign explanation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the lodctr.exe rebuild pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even routine tools can be abused. This query mirrors the rule's selection (lodctr.exe with the
    -r switch) scoped to this host, so the resulting parent and user distribution reflects how this
    specific firing pattern has historically run here rather than generic binary usage. A new parent
    process, an unexpected user, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \lodctr.exe
        OriginalFileName: LODCTR.EXE
      selection_cli:
        CommandLine|contains|windash: ' -r'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did lodctr.exe spawn afterward?
  context: lodctr.exe is a single-purpose registry-writing utility and is not expected to spawn child
    processes. Any children, especially command interpreters, script hosts, or download utilities, would
    indicate the binary was used as a stepping stone rather than for counter maintenance.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the rebuild?
  context: Activity surrounding a counter rebuild can reveal whether it sits inside a larger operation.
    Reconnaissance, defense tampering, persistence installation, or data staging near the same time
    provides broader context and helps distinguish a maintenance window from operator activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired the lodctr.exe rebuild pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    rebuild pattern rather than generic lodctr.exe usage. Many hosts firing the same pattern points to
    scripted deployment or vendor servicing; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \lodctr.exe
        OriginalFileName: LODCTR.EXE
      selection_cli:
        CommandLine|contains|windash: ' -r'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally rebuild performance counters or run system-maintenance binaries?
  context: Compare this user's current action against their historical behavior. A user who has never run
    lodctr.exe is more notable than one who does so as part of routine servicing. User role and typical
    toolset should align with performance-counter maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+lodctr.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism — which parent process spawned lodctr.exe, and whether that
    pair is historically common. A new or rare parent for this binary is the deviation worth chasing; a
    pair that already accounts for many prior events is servicing or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity
    on multiple endpoints. If the same user drove similar maintenance or other notable activity elsewhere
    in the same window, the scope is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+lodctr.exe combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise, since every host runs service-owned processes constantly. The meaningful
    question is whether the same launch mechanism — parent process plus spawned binary — fired on other
    hosts in the alert window. Multiple hosts points to scheduled or pushed automation; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the rebuild reveals what led to it,
    what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms among the surrounding process activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access —
    may reveal the stages that preceded this event and help reconstruct the timeline. Counter-rebuild
    activity meant to blind monitoring is more meaningful when other suspicious detections precede it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering with monitoring often precedes or accompanies operator activity. This query surfaces
    direct attempts to disable AV/EDR services, flip protection flags, add broad exclusions, clear logs,
    or patch AMSI/ETW. Zero rows is a useful protection-looks-healthy signal — kernel-level driver
    tampering and in-memory patches will not appear here. Populated rows shift the disposition toward
    operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
