name: Recon Command Output Piped To Findstr.EXE
id: 4d1b69a0-c4e2-4267-8fc0-7fc0cc7a5161
description: |
  Detects a reconnaissance command whose output is piped to find/findstr, typically via an inline cmd.exe /c or /k
  invocation. The rule fires when a CommandLine pairs a discovery utility (ipconfig, net, netstat, ping, systeminfo,
  tasklist, whoami) with a find filter, AND the line is not the known xampp catalina_start.bat startup pattern.
  Filtering recon output for a specific string is a common way to extract a particular host, account, port, or process
  during the enumeration phase that precedes lateral movement, persistence, or impact. The investigation should determine
  whether the filtering reflects a human troubleshooting a known issue or scripted post-compromise enumeration, what was
  being looked for, and what ran around it.
type: detection
detection_id: ccb5742c-c248-4982-8c5c-5571b9275ad3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line pair a recon utility with a find/findstr filter as this rule detects?
  context: Confirm the alert is a true positive by reading the full command line and verifying it chains a discovery
    utility (ipconfig, net, netstat, ping, systeminfo, tasklist, or whoami) into a find/findstr filter, and that it is
    not the xampp catalina_start.bat startup line the rule excludes. The rule fires on the piped pattern in the command
    line itself rather than on findstr being a separate process, so the whole inline command is the evidence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: Which recon utility ran, what string was the output filtered for, and what does that target reveal?
  context: The find/findstr argument names exactly what the operator wanted to extract from the discovery output -- a
    specific account, host, listening port, running process, or IP. Read the filtered token to understand the intent
    behind the enumeration; filtering tasklist for a security-tool process name, netstat for a known C2 port, or net
    user for a specific account each point to a different next step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run administrative discovery commands on this host?
  context: Network administrators and IT staff legitimately run discovery commands and filter their output while
    troubleshooting. Standard users rarely need to enumerate accounts, listeners, or processes and filter the results
    for a specific value. The user's role and typical behavior determine whether this filtering is routine or anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this filtered recon command, and is that parent expected?
  context: Filtered discovery launched from cmd.exe under explorer.exe usually reflects a human at a console. The same
    command spawned by an Office application, a script interpreter (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe,
    or wsmprovhost.exe indicates automated or remote post-exploitation enumeration rather than interactive
    troubleshooting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single filtered discovery command may be routine troubleshooting, but several recon utilities -- whoami,
    ipconfig, net user, systeminfo, tasklist -- in rapid succession is a signature of post-compromise enumeration.
    Three or more distinct recon binaries within the window typically indicates scripted reconnaissance rather than a
    human checking one thing.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: attack:T1057.process_access
  question: Did a process open a handle to another process for enumeration around this alert on this host?
  context: Output-piped recon reads the system through command-line utilities, but the same discovery intent can also be
    pursued by opening handles to other processes to walk the process list via API calls rather than tasklist. Process
    access events with broad query rights against multiple targets in a tight window indicate API-based enumeration that
    the command-line pattern alone will not show; pair this with the command-line filtering to judge how the host was
    being surveyed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SourceImage
      - TargetImage
      - GrantedAccess
- source: template:cue_process_tool.baseline
  question: Has this recon-and-filter pattern run on this host before, and how often?
  context: A discovery command whose output is filtered has rarely or never been seen on a given host is more suspicious
    than one that recurs on a schedule. Low or zero historical counts of the piped recon pattern point to first-time or
    rare execution; steady recurring counts suggest a script or monitoring job native to this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'ipconfig'
          - 'net'
          - 'netstat'
          - 'ping'
          - 'systeminfo'
          - 'tasklist'
          - 'whoami'
      selection_filter:
        CommandLine|contains:
          - 'find'
      condition: selection and selection_filter
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this recon-pipe pattern, what parents and users normally drove it, and
    does this alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution
    reflects how the rule's specific firing pattern -- not generic findstr usage -- has historically run here. A new
    parent process, an unexpected account, or an unusual command structure against an otherwise stable history is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ipconfig*|*find
        - net*|*find
        - netstat*|*find
        - ping*|*find
        - systeminfo*|*find
        - tasklist*|*find
        - whoami*|*find
      filter_optional_xampp:
        CommandLine|contains|all:
        - cmd.exe /c TASKLIST /V |
        - FIND /I
        - \xampp\
        - \catalina_start.bat
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What did the parent process run after this filtered recon command on this host?
  context: The value of enumeration is what it enables next. After filtering discovery output for a target, operators
    commonly pivot to account manipulation, service control, file transfer, or remote execution. Reviewing what the
    same parent spawned afterward shows whether the recon fed directly into a follow-on action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ipconfig*|*find
        - net*|*find
        - netstat*|*find
        - ping*|*find
        - systeminfo*|*find
        - tasklist*|*find
        - whoami*|*find
      filter_optional_xampp:
        CommandLine|contains|all:
        - cmd.exe /c TASKLIST /V |
        - FIND /I
        - \xampp\
        - \catalina_start.bat
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ipconfig*|*find
        - net*|*find
        - netstat*|*find
        - ping*|*find
        - systeminfo*|*find
        - tasklist*|*find
        - whoami*|*find
      filter_optional_xampp:
        CommandLine|contains|all:
        - cmd.exe /c TASKLIST /V |
        - FIND /I
        - \xampp\
        - \catalina_start.bat
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the same account drove
    similar enumeration or follow-on actions on other endpoints. The same user triggering activity on multiple hosts
    widens the likely scope of the incident.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ipconfig*|*find
        - net*|*find
        - netstat*|*find
        - ping*|*find
        - systeminfo*|*find
        - tasklist*|*find
        - whoami*|*find
      filter_optional_xampp:
        CommandLine|contains|all:
        - cmd.exe /c TASKLIST /V |
        - FIND /I
        - \xampp\
        - \catalina_start.bat
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to the
    enumeration and what followed it, and whether the filtered recon is one step in a larger sequence. Aggregating by
    Image and ParentImage collapses repetitive agent noise while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this recon-pipe pattern in the past week, and does the cross-host distribution look
    like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern rather than generic findstr usage. Many hosts firing the same pattern points to scripted deployment
    or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ipconfig*|*find
        - net*|*find
        - netstat*|*find
        - ping*|*find
        - systeminfo*|*find
        - tasklist*|*find
        - whoami*|*find
      filter_optional_xampp:
        CommandLine|contains|all:
        - cmd.exe /c TASKLIST /V |
        - FIND /I
        - \xampp\
        - \catalina_start.bat
      condition: selection and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, credential access, or initial-access exploitation
    -- may reveal the attack stages that preceded the enumeration and help reconstruct the timeline. Discovery commonly
    follows initial access and precedes lateral movement, so prior alerts often frame what the recon was for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
