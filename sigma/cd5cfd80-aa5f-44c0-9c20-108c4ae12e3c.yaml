name: New Firewall Rule Added Via Netsh.EXE
id: 731bcf2d-2570-41f3-8751-068dbb0a55ed
description: |
  Detects netsh.exe (matched by image name or original filename) run with a command line containing both "firewall" and "add", which creates a new Windows Defender Firewall rule, excluding the known-good Dropbox inbound-rule case. Adding a firewall rule opens the host's network controls — an inbound allow rule for a port or program exposes a service to remote access, commonly used to enable RDP, a reverse shell listener, or command-and-control before lateral movement. Administrators and software installers also add firewall rules legitimately, so the investigation should decode exactly which rule was created and what it permits, confirm what process launched netsh, and look for the inbound access the rule enabled along with other defense tampering and persistence.
type: detection
detection_id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- source: template:universal.verify_trigger_match
  question: Does this match the rule — netsh.exe adding a firewall rule?
  context: Confirm the alert before investing time. The rule fires when the image (or original filename) is netsh.exe and the command line contains both "firewall" and "add", with the known-good Dropbox inbound rule excluded. Read the full command line and identify the exact rule that was created — its name, direction, action, and the port or program it allows are what determine the impact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:defense_tampering.what_was_disabled
  question: Which firewall rule was added, and what does it permit?
  context: The impact is in the rule. An inbound allow rule for a port or program exposes a service to remote access — a rule opening 3389 enables RDP, one allowing a custom program permits a backdoor or listener, and dir=in action=allow on a broad profile widens exposure. Read the rule name, direction, action, port, and program in the command line to determine what was opened and to whom, and set the investigation priority.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to add firewall rules?
  context: Administrators and software installers legitimately add firewall rules during configuration and setup, so the question is whether this account and host have a reason to. A documented admin change or a known installer differs from a standard user account, or an unexpected service principal, opening an inbound rule — the latter is the access-enabling pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned this netsh, and is that parent chain expected?
  context: A firewall change from an installer (msiexec, a setup executable) or an interactive admin shell is routine; the same netsh spawned by a script (cmd or powershell running a .bat), by a remote-execution tool, or by an Office application points to automated, hands-on configuration of remote access. If the netsh add shares a parent with other tampering or access-enabling commands, that parent is the operator's script — its command line and origin are central to scoping the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the firewall rule was added?
  context: A rule is opened to allow something — an inbound RDP session, a connection to a newly started listener, or a remote-management tool. Examining what executed in the window after the change reveals what it enabled. A listener process starting, a remote-access tool, or a fresh inbound connection on the opened port shortly after the rule was added points to the access the change was meant to grant.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense-tampering actions performed on this host?
  context: Operators who open the firewall for access usually pair it with other changes — disabling antivirus, stopping logging, or removing protective rules — to clear the path. This surfaces other tampering tools and verbs on the host around the alert. Multiple tampering actions sharing the same user or parent process confirm a coordinated operation rather than an isolated administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: attack:T1562.004.registry_firewall
  question: Was the firewall changed through the registry rather than netsh?
  context: Firewall rules and policy live under HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy, so a rule can be added or the firewall reconfigured by editing the registry directly, bypassing the netsh command this rule watches. Reviewing registry changes to the firewall policy on this host around the alert catches a registry-based change that would otherwise be missed and shows whether the netsh add was part of a wider firewall reconfiguration.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\SharedAccess\Parameters\FirewallPolicy'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:lolbin.renamed_binary_check
  question: Was netsh.exe executed from its expected System32 path, and is it the genuine signed binary?
  context: The genuine netsh.exe is a signed Microsoft binary under System32 / SysWOW64. A copy running from a user temp directory, ProgramData, or another non-standard path — or one whose original filename is not netsh.exe — suggests the binary was staged to dodge path-based allowlists, which raises the priority of an otherwise routine-looking firewall command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host added firewall rules with netsh over the past 90 days, and what command structures are typical?
  context: A firewall-rule addition with no prior history on a host is more notable than one that recurs under a stable configuration or deployment routine. This mirrors the rule's exact pattern scoped to this host, so the count reflects the rule's specific firing, and the command-line projection lets you compare the historical rule names, ports, and programs against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' add '
      filter_optional_dropbox:
        CommandLine|contains:
        - advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files (x86)\Dropbox\Client\Dropbox.exe" enable=yes profile=Any
        - advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files\Dropbox\Client\Dropbox.exe" enable=yes profile=Any
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around this time?
  context: Opening the firewall for inbound access is often paired with establishing a foothold to receive that access. This surfaces persistence tool executions — schtasks, sc, reg, at, bitsadmin, wmic — clustered around the alert. Multiple persistence installations in the same window indicate intentional staging rather than an isolated firewall change, and identify footholds to remediate.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' add '
      filter_optional_dropbox:
        CommandLine|contains:
        - advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files (x86)\Dropbox\Client\Dropbox.exe" enable=yes profile=Any
        - advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files\Dropbox\Client\Dropbox.exe" enable=yes profile=Any
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' add '
      filter_optional_dropbox:
        CommandLine|contains:
        - advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files (x86)\Dropbox\Client\Dropbox.exe" enable=yes profile=Any
        - advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files\Dropbox\Client\Dropbox.exe" enable=yes profile=Any
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user opened firewalls or ran tooling on other hosts in the same window, the scope is a network-wide operation. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' add '
      filter_optional_dropbox:
        CommandLine|contains:
        - advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files (x86)\Dropbox\Client\Dropbox.exe" enable=yes profile=Any
        - advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files\Dropbox\Client\Dropbox.exe" enable=yes profile=Any
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts added firewall rules via netsh in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where firewall-rule additions fired. Many hosts at once points to a configuration push or deployment routine; one host or a small unrelated set points to manual or targeted access-enabling. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' add '
      filter_optional_dropbox:
        CommandLine|contains:
        - advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files (x86)\Dropbox\Client\Dropbox.exe" enable=yes profile=Any
        - advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files\Dropbox\Client\Dropbox.exe" enable=yes profile=Any
      condition: all of selection_* and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, a download cradle, or other defense tampering — may reveal the intrusion stage this firewall change belongs to and help reconstruct the timeline. Opening an inbound rule often sits just before remote access or lateral movement, so what follows is as important as what came before.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
