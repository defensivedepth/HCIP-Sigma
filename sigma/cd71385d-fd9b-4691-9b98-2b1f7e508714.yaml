      investigated by Q3 (cue_parent_process.mechanism_decode), which walks up via ParentProcessGuid to identify
      what launched runexehelper itself."
  - template: cue_process_tool.baseline
    reason: >-
      Child-binary host baseline is subsumed by the parent-child baseline Q9 (cue_parent_process.baseline), which
      is the discriminating pivot for a parent-keyed rule. A bare child-binary baseline would return volume for the
      child without isolating the runexehelper.exe proxy-launch relationship that is the actual anomaly.
  reflection_overrides: []
  hint_dispositions:
  - hint: "logsource 'image_load' (recommended by techniques: T1218) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
    disposition: declined
    reason: >-
      The T1218 image_load analytic targets signed binaries that load a payload DLL (rundll32.exe, regsvr32.exe,
      msiexec.exe). runexehelper.exe is a process launcher — it duplicates the thread token and runs argv[1] as a
      separate executable via CreateProcessAsUser, it does not host the payload as a loaded module of itself.
      Image-load events on runexehelper.exe would return only its own normal dependency DLLs, not the proxied
      payload, so they add no precision for this rule. The proxied executable's own identity and behavior are
      covered by Q5 (attack:T1218.proxied_payload_identity, Image/OriginalFileName/Hashes) and Q4
      (cue_process_tool.mechanism_decode). No compensating attack:T1218.image_load question authored.
