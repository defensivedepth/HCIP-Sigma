name: Renamed SysInternals DebugView Execution
id: c1cb20e2-1870-47c7-a52f-bbd62c78330d
description: |
  Detects a process whose PE metadata identifies it as Sysinternals DebugView (Product field reads "Sysinternals DebugView") while the file on disk is NOT the canonical Dbgview.exe — the rule fires when the Product matches AND the legitimate combination of OriginalFileName Dbgview.exe and an Image ending in \Dbgview.exe does NOT match. This pattern surfaces a DebugView-branded binary running under a different filename, which can be a legitimate copy that was renamed for convenience or a payload wrapped in DebugView PE metadata to blend in. The investigation should establish the binary's true identity from its metadata and hash, how it arrived, what it did after execution, and whether the same artifact appears elsewhere in the environment.
type: detection
detection_id: cd764533-2e07-40d6-a718-cfeec7f2da7f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the running binary carry Sysinternals DebugView metadata while running under a non-Dbgview.exe filename?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when the process Product is Sysinternals DebugView but the file is not the canonical Dbgview.exe (OriginalFileName Dbgview.exe with an Image path ending in \Dbgview.exe). Review the Product value alongside the OriginalFileName and Image path shown on the triggering event to verify the metadata-versus-filename mismatch is real and not a truncated or misparsed field.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run Sysinternals diagnostic tooling like DebugView?
  context: Legitimate administrative and developer activity can trigger this detection — DebugView is a standard debugging utility, and renaming the executable is common for portable toolkits. Knowing whether the user role and host function involve low-level debugging or driver work is often the fastest way to separate routine use from a metadata-spoofed payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: The file is named something other than Dbgview.exe but its PE metadata reports Sysinternals DebugView. Compare the Image path (the name on disk) against OriginalFileName (embedded metadata), then check the signing party and signature status — a genuine DebugView copy is signed by Microsoft, while a payload wearing DebugView metadata is typically unsigned or carries an inconsistent or invalid signature. Submit the file hash for reputation lookup to determine whether this is a known-good tool, a known-bad sample, or a novel binary needing deeper analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did this renamed DebugView-branded binary arrive on the host?
  context: A renamed binary does not appear spontaneously — it was copied, downloaded, extracted from an archive, or dropped by a parent process. Tracing the file creation event by basename over a long window reveals the delivery mechanism and the process that wrote it. A user-writable landing spot such as Downloads, Temp, or AppData points to download or extraction; a system directory points to either an installer or compromise of a privileged process.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: What did this DebugView-branded binary do? Decode its full command line.
  context: The full command line reveals the specific action taken. Decode any flags, parameters, file paths, or URLs passed to the binary. Genuine DebugView is typically launched interactively with few or no arguments; a payload wearing its metadata may carry installation flags, output paths, or network indicators that reveal its real purpose.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this binary and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Interactive launches under explorer.exe fit normal tool use; parents such as script hosts, Office applications, archive utilities, or remote-execution tooling suggest the binary was launched as a stage in an automated or hands-on-keyboard operation rather than by an administrator opening a debugger.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: The point of renaming a binary is to perform its function while evading name-based detection. Examining the child processes spawned by this binary reveals its actual objective — credential access, reconnaissance, or lateral movement would all surface as descendant processes. The same renamed, DebugView-branded binary appearing on multiple hosts points to deliberate distribution rather than an isolated copy.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run a binary at this path with DebugView metadata?
  context: A binary path that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts at this Image path indicate first-time or rare execution and raise the priority of identifying the binary's true origin.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the renamed-DebugView pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate renamed tooling produces a stable pattern over time. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern — not generic DebugView usage — has historically run here. A new parent process, an unexpected user account, or an unusual launch shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Sysinternals DebugView
      filter:
        OriginalFileName: Dbgview.exe
        Image|endswith: \Dbgview.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run Sysinternals diagnostic tooling like DebugView?
  context: Compare this user's current action against their historical behavior. A user who has never run this tool is more suspicious than one who does so regularly, and the user's role should align with low-level debugging work. Zero or very low counts indicate the activity is out of character for this account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service or computer account, user identity does not attribute behavior — the meaningful pivot is the launch mechanism. Which parent process spawned this binary, and is that pair historically common. A new or rare parent for this binary is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the incident may be larger than the single alert suggests.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service or computer account, asking what else the user did across the network returns agent-telemetry noise, since every host runs service-owned processes constantly. The meaningful question is whether the same launch mechanism — parent process plus spawned binary — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding this event reveals what led up to it and what followed, and whether it is part of a larger sequence. Aggregating by Image and ParentImage collapses repetitive telemetry into high-count rows while novel parent-child pairs stand out at low counts — those low-count pairs are what the analyst is scanning for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the timeline. Renamed tooling is often a mid-chain artifact, so a preceding alert can pin down how the operator reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired the renamed-DebugView pattern in the past week, and does the cross-host spread look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic DebugView usage. Many hosts firing the same pattern points to scripted deployment or vendor automation that renames the binary; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Sysinternals DebugView
      filter:
        OriginalFileName: Dbgview.exe
        Image|endswith: \Dbgview.exe
      condition: selection and not filter
    fields:
    - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Hands-on-keyboard operators often weaken protection before running tooling. This query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful signal that protection looks healthy; kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation — review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
