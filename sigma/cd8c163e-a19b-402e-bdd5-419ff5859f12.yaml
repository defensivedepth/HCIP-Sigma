name: HackTool - ADCSPwn Execution
id: db08e860-a1e2-4465-add7-f3fa1d98159b
description: |
  Detects the command-line pattern of ADCSPwn, a tool that escalates privileges in Active Directory by coercing a machine account to authenticate (PetitPotam-style) and relaying that authentication to the AD Certificate Services web enrollment endpoint to obtain a certificate for the coerced account. The rule fires when a command line contains both ' --adcs ' and ' --port ' together, the address of the target CA server and the local listener port the tool uses to receive the relayed connection. Legitimate use is essentially limited to sanctioned penetration tests; outside an authorized engagement this points to an active adversary-in-the-middle credential-relay attempt, so the investigation should confirm the targeted CA, identify the coerced account and any certificate obtained, and check for follow-on authentication using the relayed identity.
type: detection
detection_id: cd8c163e-a19b-402e-bdd5-419ff5859f12
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain both the --adcs and --port arguments this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact command line against the rule's detection criteria. The rule fires when a single command line carries both ' --adcs ' (the target certificate-authority server) and ' --port ' (the local relay listener port); verify both are present and note the CA address and port for the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run an AD CS relay tool against a certificate authority?
  context: Coercing machine-account authentication and relaying it to AD Certificate Services is not routine administration. Knowing whether the user role and host function involve sanctioned security testing or certificate-services work is often the fastest way to separate an authorized assessment from an operator attack.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this ADCSPwn execution part of an authorized penetration test or red team engagement?
  context: AD CS relay tools are used in authorized security assessments of certificate-services exposure. Before investing investigation time, check whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement with matching tooling and timing resolves the alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: What target CA, relay port, coerced machine, and output path were specified on the command line?
  context: The command-line arguments define what the relay attempt does. --adcs names the certificate-authority web-enrollment target, --port sets the local listener, --remote names the machine being coerced into authenticating, --unc sets a custom PetitPotam callback path, and --output is where a base64 certificate is written. These values reveal the scope of the attack and which account's identity is being relayed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: Which identity and credential material did the relay target, and was a certificate obtained?
  context: This tool relays coerced machine-account authentication to AD Certificate Services to enroll a certificate for that account, which can then be used to obtain a TGT or otherwise impersonate the account. Identify the coerced machine (often a domain controller via --remote), the target CA, and whether an output certificate path was set, since a successfully issued certificate means the account's identity is now usable by the operator.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1557.001.security_events
  question: Did the certificate authority or coerced host log certificate enrollment, service creation, or anomalous authentication in this window?
  context: The relay leaves traces outside endpoint process logs. On the CA, look for a certificate issued to a machine account that does not normally enroll; on the coerced host or domain controller, look for the inbound authentication the tool triggered and for service-creation or name-resolution configuration changes that often accompany coercion. Correlating these with the alert time confirms whether the relay succeeded and which identity was issued a certificate. If Windows Security event logs from the CA and domain controllers are not ingested in this environment, treat absent results as a visibility gap rather than evidence the relay failed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.code
      - winlog.event_data.SubjectUserName
      - winlog.event_data.TargetUserName
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which account was coerced and relayed, and does it hold elevated privileges?
  context: The severity of this attack depends on the account whose authentication was relayed. A relayed domain-controller machine account or a privileged machine identity enables domain-wide impact and requires incident escalation; a low-value workstation account is more contained. Cross-reference the coerced machine named on the command line against Active Directory to determine its privilege level and group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously matched the --adcs/--port relay pattern, what parents and users drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects how this specific relay command pattern has historically run here — not generic tool usage. A new parent process, an unexpected user account, or a first-time appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' --adcs '
        - ' --port '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' --adcs '
        - ' --port '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' --adcs '
        - ' --port '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of this alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. A relay attack is often one step in a chain, so if the same account drove other activity on other hosts in this window, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' --adcs '
        - ' --port '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts matched the --adcs/--port relay pattern in the past week, and does the spread look like automation or operator activity?
  context: The query mirrors the rule's selection with no host scope, returning a fleet-wide count of this specific relay command pattern rather than generic tool usage. Several hosts matching the same pattern points to a sanctioned testing sweep or scripted deployment; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' --adcs '
        - ' --port '
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, name-resolution poisoning, or credential access — may reveal the attack stages that preceded the relay attempt and help reconstruct the full timeline leading to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
