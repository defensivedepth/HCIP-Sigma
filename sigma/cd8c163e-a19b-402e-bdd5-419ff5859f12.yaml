  dedup_decisions:
  - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
    reason: "user_actor pair — non-deduplicable (subject vs. mechanism pivot)"
    kept: both
  - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
    reason: "user_actor pair — non-deduplicable (subject vs. mechanism pivot)"
    kept: both
  skipped_templates:
  - template: cue_process_tool.mechanism_decode
    reason: "replaced_by credential_access.credential_target_identification (brief hint); the credential-target question is the more specific Phase 2 decode of which identity/credential the relay targeted"
  - template: cue_process_tool.baseline
    reason: >-
      Generic Image|endswith %Image% 90d baseline does not enforce the rule's
      CommandLine-only firing pattern (no Image binding in detection). The reflected
      cue_process_tool.baseline_deviation (filter-correct on --adcs/--port) supersedes
      it for host history.
  - template: cue_process_tool.process_chain
    reason: "rule has no parent in detection; the immediate parent comes from the alert and parent history is covered by cue_process_tool.baseline_deviation (ParentImage distribution scoped to the rule pattern)"
  - template: cue_process_tool.follow_on
    reason: >-
      Child-process follow-on (ParentImage %Image% on this host) overlaps the
      identity-reuse coverage in credential_access.post_access_lateral_movement, which
      is the more relevant follow-on for a relay attack whose payload is a certificate,
      not a spawned child process.
  - template: cue_process_tool.clustering
    reason: "same-host concurrent-tool clustering overlaps cue_user_actor.clustering (network-wide user activity) and cue_host_context.precursor (prior detections); dropped to keep the user_actor pairs within the 18-question cap"
  - template: cue_host_context.clustering
    reason: "same-host activity-around-alert overlaps cue_host_context.precursor (prior detections on this host) and cue_user_actor.clustering; dropped to stay within cap"
  - template: universal.endpoint_protection_health
    reason: >-
      The generic host-tamper sweep is identical on every rule and earns its slot only
      when tamper-as-precursor is a live question. This relay attack does not depend on
      first disabling AV/EDR — it abuses certificate enrollment — and cue_host_context.precursor
      already surfaces any prior tamper detections on the host. Dropped to keep the
      non-deduplicable user_actor pairs within the 18-question cap.
  - template: hacking_tool.tool_specific_artifacts
    reason: >-
      file_event scoped by Image|endswith %Image% is broken for this CommandLine-only
      rule (no Image binding to drive the historical pattern), and the tool's primary
      artifact — a base64 certificate written to the --output path — is already
      surfaced via the command line in credential_target_identification and
      tool_capability_used. The decisive artifact is the issued certificate on the CA,
      covered by attack:T1557.001.security_events.
  - template: data_staging_exfil.data_scope
    reason: >-
      data_staging_exfil is confirmed via the collection tactic, but this rule's
      collection is credential collection via authentication relay, not file archiving.
      The data_scope file_event/archive framing (rar/7z/rclone source paths) does not
      describe ADCSPwn behavior; credential_target_identification covers what was
      collected (the relayed identity/certificate).
  - template: data_staging_exfil.archive_destination
    reason: >-
      No archive is created by this relay tool; the archive-destination framing (where
      a .rar/.zip was moved) does not apply. The relevant output — the base64 certificate
      to the --output path — is covered by tool_capability_used / credential_target_identification.
  - template: data_staging_exfil.encryption_password
    reason: >-
      The rule detects no archive-password flags and the tool creates no password-protected
      archive; the -p/-hp/--passphrase framing is incidental keyword overlap from the
      collection tactic, not behavior this rule fires on.
