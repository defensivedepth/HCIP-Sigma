        - \powershell.exe
        - \PsService.exe
        - \PsService64.exe
        - \pwsh.exe
        - \sc.exe
        - \wmic.exe
      selection_tools_cli:
      - CommandLine|contains:
        - ' delete '
        - .delete()
        - ' pause '
        - ' stop '
        - 'Stop-Service '
        - 'Remove-Service '
      - CommandLine|contains|all:
        - config
        - start=disabled
