name: Suspicious Windows Service Tampering
id: 86736cf2-748c-4d01-b31e-b310c8164e46
description: |
  Detects a service-control tool (net, net1, sc, wmic, PowerShell, or PsService, matched by image name or original filename) used with a tampering verb — delete, stop, pause, Stop-Service, Remove-Service, or config start=disabled — against a service name drawn from a large list of antivirus, EDR, backup, and other important Windows services. Stopping, deleting, or disabling protection and backup services is a hallmark of the preparation phase of a hands-on ransomware intrusion: defenders are blinded and recovery is removed before files are encrypted. The same commands are also issued by legitimate administration and software maintenance, so the investigation must determine which service was targeted, whether it is still down, what spawned the command and what ran after it, whether recovery-inhibiting and encryption activity followed, and — most urgently — whether the same action is firing across other hosts.
type: detection
detection_id: ce72ef99-22f1-43d4-8695-419dcb5d9330
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- source: template:universal.verify_trigger_match
  question: Does this match the rule — a service-control tool tampering with a protected service?
  context: Confirm the alert before investing time. The rule fires when a service-control tool (net, net1, sc, wmic, PowerShell, or PsService) is run with a tampering verb (delete, stop, pause, Stop-Service, Remove-Service, or config with start=disabled) against a service name from the antivirus / EDR / backup list. Read the full command line and identify exactly which service was targeted and which verb was used — that classification sets the priority and the remediation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:defense_tampering.what_was_disabled
  question: Which security or backup service was targeted, and what was done to it?
  context: Different targets carry different impact. Disabling an antivirus or EDR service leaves the host unprotected; stopping a backup or VSS provider service removes recovery; deleting a service makes the change persistent. Read the command line to identify the exact service name and whether it was stopped, paused, deleted, or set to start=disabled, and use that to set the investigation priority and the remediation steps.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to stop or disable these services?
  context: Administrators and maintenance tooling legitimately stop or reconfigure services, so the question is whether this account and host have a reason to. A documented maintenance action by an admin or deployment service differs sharply from a standard user account, or an unexpected service principal, disabling antivirus or backup services — the latter is the ransomware-preparation pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:ransomware_impact.recovery_options_assessment
  question: What recovery-inhibiting commands were executed on this host?
  context: Stopping backup and VSS services is usually one step of a wider recovery-destruction sequence — deleting shadow copies (vssadmin, wmic shadowcopy delete), disabling boot recovery (bcdedit), deleting backups (wbadmin), or disabling the Recovery Environment (reagentc). This surfaces those commands on the host so you can see the full scope; verify whether each succeeded by checking system state (vssadmin list shadows, bcdedit /enum, reagentc /info) and confirm offline or cloud backups separately.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- source: template:ransomware_impact.encryption_or_ransom_indicators
  question: Are there signs of file encryption, ransom notes, or ransomware binary execution on this host?
  context: Recovery-inhibiting actions and service tampering typically precede file encryption by minutes. This surfaces non-standard processes executing on the host after the tampering — unknown binaries from temp or user-writable paths, a process with heavy file I/O, or interpreters launching unknown executables. Also check for ransom notes (README, HOW_TO_DECRYPT, unusual new file extensions) through file events or the EDR console to determine whether encryption has started and how far it has progressed.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: template:ransomware_impact.network_wide_impact
  question: Is this same service-tampering alert firing on other hosts in the environment?
  context: This is the most urgent triage step. Ransomware operators run the same destruction sequence across many hosts at once or in rapid succession, so the same alert firing on multiple hosts indicates network-wide execution. Many affected hosts means containment should shift to network isolation of the affected segments, and the first-to-last detection timeline reveals the spread; escalate to incident response if this returns hits across hosts.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the service was stopped or disabled?
  context: Services are stopped for a reason — to run a payload, encrypt files, or perform actions the service would have blocked or logged. Examining what executed in the window after the tampering reveals what it was meant to enable. A burst of new processes, especially unknown binaries or interpreters, immediately after the service went down points to the activity the tampering unlocked.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense-tampering actions performed on this host?
  context: Operators who disable one control usually disable several — stopping antivirus AND clearing event logs AND deleting shadow copies AND changing the firewall maximizes coverage. This surfaces other tampering tools and verbs on the host around the alert. Multiple tampering actions sharing the same user or parent process confirm a coordinated operation rather than an isolated administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:service_persistence.service_current_status
  question: Is the targeted service currently stopped or disabled, and does it still need to be restored?
  context: Tampering may be transient (for one action) or persistent. Checking the current state of the targeted service reveals whether the host is still exposed — a security or backup service left stopped or set to disabled should be restored before the investigation continues. Run sc query and sc qc against the service name from the alert command line, or confirm via the EDR console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this service-control command, and is that parent chain expected?
  context: A single admin stopping a service from an interactive shell is routine; the same command issued by a script (cmd.exe or powershell.exe running a .bat), by PsExec or a remote-execution service, or pushed via Group Policy points to automated, hands-on-keyboard tampering. If many tampering and recovery-destruction commands share one parent, that parent is the ransomware orchestrator — its command line and origin are central to scoping the intrusion.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1562.001.registry_disable
  question: Was a security service disabled through the registry rather than a service-control command?
  context: Setting a service's Start value to 4 (disabled) under HKLM\SYSTEM\CurrentControlSet\Services achieves the same result as sc config start=disabled but bypasses the service-control tools this rule watches. Reviewing registry changes to the Start value of service keys on this host around the alert catches a registry-based disable of the same or additional protection services, which would otherwise be missed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\'
        TargetObject|endswith: '\Start'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:lolbin.renamed_binary_check
  question: Was the service-control tool executed from its expected System32 path, and is it the genuine signed binary?
  context: The genuine sc.exe, net.exe, and wmic.exe live under System32 / SysWOW64; PsService is a signed Sysinternals tool. A copy running from a user temp directory, ProgramData, or another non-standard path — or one whose original filename does not match — suggests the binary was staged to dodge path-based allowlists, which raises the priority of an otherwise routine-looking service command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host run the service-tampering pattern over the past 90 days, and what command shapes are typical?
  context: Service tampering against the protected-service list with no prior history on a host is far more notable than a recurring maintenance routine. This mirrors the rule's exact pattern (tool, verb, and protected-service list) scoped to this host, so the count reflects the rule's specific firing, and the command-line projection lets you compare the historical service targets and verbs against the alerting one.
