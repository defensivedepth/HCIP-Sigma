name: Suspicious Child Process Of Manage Engine ServiceDesk
id: 52d1e6bd-de94-49fe-b747-6733a566dee5
description: |
  Detects the ManageEngine ServiceDesk Plus Java web service (java.exe under a path containing \ManageEngine\ServiceDesk\) spawning one of a set of living-off-the-land binaries (powershell.exe, certutil.exe, bitsadmin.exe, mshta.exe, schtasks.exe, reg.exe, wmic.exe, net.exe, whoami.exe, and similar), excluding the benign case of net.exe/net1.exe issuing a service stop. The web service normally serves help-desk traffic and does not spawn command interpreters or system tools, so a child of this kind is the post-exploitation signal of remote code execution against the application — historically via a pre-authentication SAML XSLT-injection flaw that runs commands as the SYSTEM-context service. The investigation should confirm the parent really is the ManageEngine service, decode what the spawned child did, and determine whether the activity is a single anomaly or part of multi-host exploitation.
type: detection
detection_id: cea2b7ea-792b-405f-95a1-b903ea06458f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alert show the ManageEngine ServiceDesk java.exe spawning one of the flagged child binaries, and is it not a net.exe service-stop?
  context: >-
    Confirm the parent is java.exe running from a path containing \ManageEngine\ServiceDesk\ and that the child Image ends in one of the flagged binaries (powershell.exe, certutil.exe, bitsadmin.exe, mshta.exe, schtasks.exe, reg.exe, wmic.exe, net.exe, whoami.exe, and similar). The rule explicitly excludes net.exe/net1.exe invocations whose command line contains a service stop, so verify the alerting command is not that benign case before investing further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this host expected to run the ManageEngine ServiceDesk application, and under what account did the child run?
  context: >-
    The ManageEngine service typically runs in a SYSTEM context, so a child it spawns inherits SYSTEM. Confirm this host is a sanctioned ServiceDesk application server rather than an endpoint that should never host the service, and note the account on the alerting event — a SYSTEM-owned interpreter from a web service is a stronger signal than an interactive admin session.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is the ManageEngine ServiceDesk Java service expected to spawn this child, and what started the Java service itself?
  context: >-
    The parent-child pairing is the core signal. The help-desk web service serving normal traffic does not launch command interpreters or system tools; a child of this kind points to command execution through the application. Trace the Java service's own origin to confirm it is the legitimate ManageEngine service launcher rather than a relocated or masqueraded java.exe.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the spawned child do? Decode its full command line and any encoded or downloaded content.
  context: >-
    Parse every argument of the child's command line to establish the operational purpose. Decode base64 or hex payloads, expand concatenation or escaping, and identify any source URLs, downloaded files, or output paths. For download tools (certutil, bitsadmin, curl) identify the remote source and local destination; for interpreters (powershell, cscript, wscript, mshta) reconstruct what script or expression ran; for system tools (reg, schtasks, wmic, net) identify the exact configuration change made.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1102.process_identification
  question: Is the spawned child a genuine system binary, or a renamed or relocated copy masquerading as one?
  context: >-
    The rule matches on the child's file name only, so a relocated or renamed binary that ends in a flagged name (for example a custom payload saved as whoami.exe) will fire just as a real system binary would. Check the child's signing status, original file name, and on-disk path against the expected system location to distinguish a genuine living-off-the-land binary from a dropped tool wearing a trusted name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: attack:T1102.web_service_c2
  question: Did the spawned child or the Java service make outbound connections to web services, especially high-volume or off-hours transfers?
  context: >-
    Command execution through this application is frequently followed by command-and-control over common web-service ports and protocols, blending with normal HTTPS. Look for outbound SSL/TLS connections from the alerting host that originate from the spawned interpreter or the Java service, and flag short-window high-volume transfers (on the order of more than 1MB in under 5 minutes) or connections that persist outside normal business hours, which suggest beaconing or exfiltration rather than routine help-desk traffic.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_parent_process.follow_on
  question: What other child processes did the same ManageEngine Java service instance spawn?
  context: >-
    Exploitation rarely stops at one command. The same service instance may have spawned a sequence of tools — reconnaissance, download, persistence, lateral movement. Enumerating every child of the same parent instance reveals the full scope of activity executed through the compromised application.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Has the ManageEngine ServiceDesk Java service spawned this kind of child on this host before?
  context: >-
    A help-desk web service has a narrow and stable set of legitimate child processes. Historical frequency of this specific parent-child pairing distinguishes routine ServiceDesk operation from a novel spawn. Zero or very low counts indicate the service has not previously launched this binary on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_parent_process.scope
  question: Is the same ManageEngine Java service spawning this child binary on other hosts?
  context: >-
    The same parent-child spawning pattern appearing on multiple ServiceDesk servers points to exploitation of a shared vulnerability across the fleet rather than an isolated event. Enterprise-wide comparison calibrates scope and identifies additional application servers that may already be compromised.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains|all:
        - \ManageEngine\ServiceDesk\
        - \java.exe
        Image|endswith:
        - \AppVLP.exe
        - \bash.exe
        - \bitsadmin.exe
        - \calc.exe
        - \certutil.exe
        - \cscript.exe
        - \curl.exe
        - \forfiles.exe
        - \mftrace.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \query.exe
        - \reg.exe
        - \schtasks.exe
        - \scrcons.exe
        - \sh.exe
        - \systeminfo.exe
        - \whoami.exe
        - \wmic.exe
        - \wscript.exe
      filter_main_net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains: ' stop'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains|all:
        - \ManageEngine\ServiceDesk\
        - \java.exe
        Image|endswith:
        - \AppVLP.exe
        - \bash.exe
        - \bitsadmin.exe
        - \calc.exe
        - \certutil.exe
        - \cscript.exe
        - \curl.exe
        - \forfiles.exe
        - \mftrace.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \query.exe
        - \reg.exe
        - \schtasks.exe
        - \scrcons.exe
        - \sh.exe
        - \systeminfo.exe
        - \whoami.exe
        - \wmic.exe
        - \wscript.exe
      filter_main_net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains: ' stop'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did the account on this event do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals lateral movement or activity spanning multiple endpoints. If the same account triggered related activity elsewhere, the scope of compromise may be larger. Under a service principal this view returns agent-telemetry noise, so the parent-binary clustering view is the meaningful answer in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains|all:
        - \ManageEngine\ServiceDesk\
        - \java.exe
        Image|endswith:
        - \AppVLP.exe
        - \bash.exe
        - \bitsadmin.exe
        - \calc.exe
        - \certutil.exe
        - \cscript.exe
        - \curl.exe
        - \forfiles.exe
        - \mftrace.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \query.exe
        - \reg.exe
        - \schtasks.exe
        - \scrcons.exe
        - \sh.exe
        - \systeminfo.exe
        - \whoami.exe
        - \wmic.exe
        - \wscript.exe
      filter_main_net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains: ' stop'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity around the alert reveals what preceded and followed it — reconnaissance, privilege escalation, or persistence — and whether the spawn is part of a larger sequence on the host. Novel parent-child pairs stand out at low counts against high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct the timeline. Exploitation of a public-facing service is often followed quickly by enumeration and persistence, so clustered alerts in the preceding hours strengthen the case.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:initial_access.application_patch_status
  question: Is this ManageEngine ServiceDesk installation patched against known remote code execution vulnerabilities?
  context: >-
    Command execution from this Java web service is a known consequence of a pre-authentication SAML XSLT-injection flaw (CVE-2022-47966) in outdated ManageEngine builds, which runs commands as the SYSTEM-context service. Confirm the installed ServiceDesk version against the vendor's patched releases; an unpatched build confirms the exploitation path was available and indicates other similarly unpatched servers are at risk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
