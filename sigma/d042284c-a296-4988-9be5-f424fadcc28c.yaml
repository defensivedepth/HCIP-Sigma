name: Suspicious Execution of InstallUtil Without Log
id: 54b0b497-4370-4801-b4ae-4ffb3ec89ea2
description: |
  Detects InstallUtil.exe (the .NET Framework Installer Tool, running from a Microsoft.NET\Framework
  path) invoked with /logfile= empty and /LogToConsole=false, a combination that suppresses every log
  artifact InstallUtil normally writes. InstallUtil is a Microsoft-signed binary that reflects against
  an arbitrary .NET assembly and runs its installer class, which makes it a generic signed-binary proxy
  for executing attacker-controlled .NET code that is often allowed through application allowlists.
  Suppressing the logs leaves only the process-creation event as a forensic artifact, so legitimate
  installer usage rarely needs this flag combination; the investigation should establish which assembly
  was run, where it lives, what spawned InstallUtil, and what executed afterward.
type: detection
detection_id: d042284c-a296-4988-9be5-f424fadcc28c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match this rule's InstallUtil log-suppression pattern?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line and image path against the
    detection criteria. The rule fires when the image ends in \InstallUtil.exe and its path contains
    Microsoft.NET\Framework and the command line contains both /logfile= (with a trailing space, meaning
    an empty log path) and /LogToConsole=false. Verify all of those tokens are present together and note
    the assembly argument and whether the /U or /uninstall flag is also set, since the uninstall path is
    frequently abused.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run InstallUtil to install or uninstall .NET assemblies?
  context: >-
    Legitimate InstallUtil usage comes from MSI installers and developer tooling. Knowing whether the
    user role and host function fit installer or build activity is often the fastest path to separating
    routine operations from signed-binary proxy execution. A workstation or a user with no development or
    packaging remit running InstallUtil with logging suppressed is far less expected than a build server
    or a packaging account, and an empty /logfile= is unusual even for legitimate installs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    Tampering typically precedes payload execution, and suppressing InstallUtil's logs is itself an
    evasion step that may travel with broader defense weakening. The query surfaces direct attempts to
    disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW.
    Zero rows is a useful protection-looks-healthy signal; kernel-level driver tampering and in-memory
    patches will not appear here. Populated rows shift the disposition toward operator preparation, so
    review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What assembly did InstallUtil run, and was the uninstall path or a strong-name reference used?
  context: >-
    The full command line reveals what InstallUtil actually executed. Read the assembly argument to find
    the file path it ran or, if /AssemblyName is present, the strong name it resolved, and confirm whether
    /U or /uninstall was set, which triggers the Uninstall() path that is frequently abused and bypasses
    some inline detection that keys on Install. An assembly path in a user-writable directory such as a
    temp, profile, ProgramData, or Public folder, combined with the empty /logfile=, points toward
    arbitrary .NET execution rather than a packaged installer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - '/logfile= '
          - '/LogToConsole=false'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this InstallUtil execution, and is that parent chain expected?
  context: >-
    The parent process reveals how InstallUtil was invoked. Legitimate use descends from MSI installation
    (msiexec.exe) or developer tooling (MSBuild.exe, devenv.exe, vstest.console.exe). A parent such as a
    script host, an Office application, a remote-execution service, an unfamiliar binary, or an
    interactive shell points toward operator-driven proxy execution rather than a packaged install. Note
    what spawned the parent and what else the parent launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did InstallUtil spawn after it ran?
  context: >-
    A .NET assembly executed through InstallUtil's installer class can run arbitrary code, and its actual
    impact often appears as the processes it spawns. Legitimate installers rarely launch interactive
    tooling, so children such as cmd.exe, powershell.exe, certutil.exe, rundll32.exe, or a network client
    point toward post-exploitation rather than a packaged install. Trace any children by parent process to
    reconstruct what the assembly actually did.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1218.004.suppressed_log_artifact
  question: Did InstallUtil write any of its default log or state files on this host around the time of the alert?
  context: >-
    InstallUtil normally writes InstallUtil.InstallLog, an assembly-named .InstallLog, and an
    .InstallState file to the assembly's directory; an empty /logfile= suppresses all of them. Checking
    file activity on this host for those default names confirms whether logging was genuinely suppressed
    or whether an earlier or concurrent InstallUtil run did create them, which helps locate the assembly
    directory. Absence of these files alongside the alerting process is consistent with deliberate log
    suppression.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '.InstallLog'
          - '.InstallState'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this InstallUtil pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even Microsoft-signed tools get abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific log-suppressed
    InstallUtil pattern has historically run here rather than generic InstallUtil usage. A new parent
    process, an unexpected user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \InstallUtil.exe
        Image|contains: Microsoft.NET\Framework
        CommandLine|contains|all:
        - '/logfile= '
        - /LogToConsole=false
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run InstallUtil or install .NET assemblies across the environment?
  context: >-
    Compare this user's current action against their historical behavior. A user who has never run
    InstallUtil is more suspicious than one who does so as part of a known packaging or development role.
    The user's typical toolset and remit should align with installing or uninstalling .NET assemblies; an
    account with no such function running it with logging suppressed is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and InstallUtil combination historically routine on this host or environment-wide, or is the parent unusual for InstallUtil?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the
    meaningful pivot is the launch mechanism. Which parent process spawned InstallUtil, and is that pair
    historically common here or across the environment. A new or rare parent for InstallUtil is the
    deviation worth chasing, while a pair that already accounts for many prior events is build or
    packaging automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across
    multiple endpoints. If the same user ran InstallUtil or staged assemblies on more than one host, the
    scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and InstallUtil combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did network-wide returns agent-telemetry noise
    because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same
    launch mechanism — parent process plus InstallUtil — fired on other hosts in the alert window.
    Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access, or download activity — may reveal the attack stages that preceded
    this event and help reconstruct the full timeline leading up to the log-suppressed InstallUtil run.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts fired this InstallUtil pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this log-suppressed InstallUtil pattern rather than generic InstallUtil usage. Many hosts
    firing the same pattern points to scripted deployment or packaging automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \InstallUtil.exe
        Image|contains: Microsoft.NET\Framework
        CommandLine|contains|all:
        - '/logfile= '
        - /LogToConsole=false
      condition: selection
    fields:
    - host.name
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: >-
    Attackers who use one signed-binary proxy often use several. If InstallUtil ran an attacker-controlled
    assembly, check whether rundll32, regsvr32, mshta, msbuild, msiexec, or similar proxy-execution
    binaries were also used on the host to run code through Microsoft-signed binaries. Finding multiple
    proxy-execution LOLBins performing the same kind of action strengthens the case for deliberate
    allowlist evasion rather than a routine install.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was InstallUtil executed from its expected Microsoft.NET\Framework path?
  context: >-
    InstallUtil ships at C:\Windows\Microsoft.NET\Framework\<version>\InstallUtil.exe and the 64-bit
    Framework64 equivalent. A copy running from a user temp, profile, or other non-standard directory may
    have been relocated or renamed to evade path-based allowlists, though the rule already constrains the
    path to a Microsoft.NET\Framework substring. Confirm the image path and original file name match the
    genuine Framework location and that the binary was not renamed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this InstallUtil pattern over the past 90 days, and what command-line shapes are typical?
  context: >-
    A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the count
    reflects this specific log-suppressed InstallUtil pattern rather than generic InstallUtil usage. The
    command-line projection lets the analyst compare typical invocation shapes and assembly arguments
    against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \InstallUtil.exe
        Image|contains: Microsoft.NET\Framework
        CommandLine|contains|all:
        - '/logfile= '
        - /LogToConsole=false
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
