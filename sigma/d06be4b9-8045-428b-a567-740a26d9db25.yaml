name: Verclsid.exe Runs COM Object
id: 6c4fba10-5cb8-4230-97d6-8eeeade2ef05
description: |
  Detects verclsid.exe invoked with both the /S and /C switches to verify a COM
  object by its CLSID, where the parent is not the expected RuntimeBroker.exe
  workflow. verclsid.exe is a signed Microsoft binary that loads and validates a
  registered CLSID before Windows Explorer instantiates it; an attacker can point
  a hijacked CLSID at a malicious InprocServer32 DLL or a scrobj.dll scriptlet so
  that the trusted binary loads attacker code with nothing dropped to disk in an
  attacker-writable form. Investigation should confirm the CLSID being verified,
  identify what parent process drove the invocation, and determine whether the
  CLSID resolves to an unexpected DLL or scriptlet load.
type: detection
detection_id: d06be4b9-8045-428b-a567-740a26d9db25
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match verclsid.exe running a COM object with the /S and /C switches?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when the image is verclsid.exe (by name or OriginalFileName) and the command line contains both /S and /C, and the parent is not the normal RuntimeBroker.exe path. Read the full command line and note the CLSID that follows /C, since that GUID drives the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to verify COM objects through verclsid.exe?
  context: Legitimate verclsid.exe activity is normally driven by Explorer shell extension handling under RuntimeBroker.exe, which the rule already filters out. Direct invocation by an interactive user, an administrator, or an automation account is uncommon; knowing whether the user role and host function involve COM development or shell-extension tooling is often the fastest way to separate routine activity from abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What CLSID and IID did verclsid.exe verify, and what does that GUID resolve to in the registry?
  context: The command line carries the CLSID after /C and, when present, an IID after /I. Resolve that CLSID under HKCU\Software\Classes\CLSID\ and HKLM\Software\Classes\CLSID\ to see what InprocServer32 or LocalServer32 path it points to. A CLSID resolving to scrobj.dll with a ScriptletURL value, to a DLL in a user-writable directory, or to a TreatAs redirection toward another attacker-controlled CLSID is the proxy-execution pattern; a CLSID resolving to a well-known signed system component is routine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- source: template:cue_process_tool.process_chain
  question: What process spawned verclsid.exe, and is that parent chain expected?
  context: The rule already excludes the RuntimeBroker.exe path, so the parent here is something else. Explorer.exe driving a shell-extension check is routine; a script host (wscript.exe, cscript.exe, mshta.exe), an Office application, a command interpreter, or an unsigned process spawning verclsid.exe points to a CLSID being verified outside the normal shell workflow. Identify the parent and what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: attack:T1218.image_load
  question: What modules did verclsid.exe load on this host, and do any indicate a scriptlet or attacker DLL load?
  context: COM proxy execution through verclsid.exe completes when the verified CLSID triggers an InprocServer32 DLL load. The signal modules are scrobj.dll (the COM scriptlet engine, which pairs with a ScriptletURL value) and any DLL loaded from a user-writable or non-system path. Loading of the .NET CLR (clr.dll, mscoree.dll) into verclsid.exe is also off-baseline and is consistent with an in-memory managed payload. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \verclsid.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
  answer_sources:
  - image_load
  - manual_review
- source: attack:T1218.network_connection
  question: Did verclsid.exe make any network connections around the time of the alert?
  context: A hijacked CLSID can point at a remotely hosted scriptlet (a ScriptletURL using http or https) or a payload fetched at load time, so verclsid.exe reaching out over the network is off-baseline for a binary whose normal job is local COM verification. Any destination outside the host points the investigation toward remote payload retrieval; review the destination address and port. If network telemetry from this binary is not collected, treat zero results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \verclsid.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
  answer_sources:
  - network_connection
  - manual_review
- source: template:cue_process_tool.follow_on
  question: What child processes did verclsid.exe spawn afterward?
  context: verclsid.exe verifying a benign COM object normally spawns nothing. Child processes such as cmd.exe, powershell.exe, rundll32.exe, or certutil.exe indicate that the loaded COM server executed code and handed off to a follow-on stage. The children reveal the actual impact of the invocation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- source: template:cue_process_tool.baseline
  question: Does this host normally run verclsid.exe with the /S and /C switches?
  context: Direct verclsid.exe COM-verification activity outside the Explorer/RuntimeBroker workflow is rare on most hosts. Zero or very low historical counts indicate first-time or rare execution and raise the priority of identifying the CLSID and parent. A host that runs this pattern routinely (for example shell-extension development tooling) establishes a known-good baseline, including the set of CLSIDs and parents that normally appear.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this verclsid.exe pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here rather than generic verclsid.exe usage. A new parent process, an unexpected user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \verclsid.exe
      - OriginalFileName: verclsid.exe
      selection_cli:
        CommandLine|contains|all:
        - /S
        - /C
      filter_main_runtimebroker:
        ParentImage|endswith: C:\Windows\System32\RuntimeBroker.exe
        CommandLine|contains|all:
        - verclsid.exe" /S /C {
        - '} /I {'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- source: template:cue_user_actor.baseline
  question: Does this user normally run verclsid.exe to verify COM objects?
  context: Compare this user's current action against their historical behavior. A user who has never invoked verclsid.exe directly is more notable than one who does so regularly, and the user's role should align with COM or shell-extension work. Zero or very low counts indicate the user does not normally use this tool.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and verclsid.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior, so the meaningful pivot is the launch mechanism. A parent and verclsid.exe pair that already accounts for many prior events is OS or vendor automation; a new or rare parent for this binary is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or related activity on multiple endpoints. If the same user drove similar activity on more than one host, the scope may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and verclsid.exe combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, a user-wide network sweep returns agent-telemetry noise because every host runs service-owned processes constantly. The meaningful question is whether the same launch mechanism (parent process plus spawned binary) fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what followed, and whether it is part of a larger sequence. Look for reconnaissance, registry modification of COM CLSID keys, privilege escalation, or persistence mechanisms among the surrounding processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- source: template:cue_process_tool.scope
  question: Have other hosts fired this verclsid.exe pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic verclsid.exe usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \verclsid.exe
      - OriginalFileName: verclsid.exe
      selection_cli:
        CommandLine|contains|all:
        - /S
        - /C
      filter_main_runtimebroker:
        ParentImage|endswith: C:\Windows\System32\RuntimeBroker.exe
        CommandLine|contains|all:
        - verclsid.exe" /S /C {
        - '} /I {'
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as registry modification, defense tampering, or reconnaissance, may reveal the stages that preceded this event and help reconstruct the timeline. COM hijacking is frequently set up by registry edits under the CLSID hive before the trusted binary is invoked to trigger the load.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
