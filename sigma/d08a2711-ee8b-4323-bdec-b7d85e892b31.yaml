name: PUA - CsExec Execution
id: c48f3da8-eafd-44fe-b194-974dd802d19f
description: |
  Detects CsExec, an open-source C# reimplementation of the SysInternals PsExec remote-execution tool. The rule fires when EITHER a process image ends in csexec.exe OR a binary's PE Description field reads "csexec", so a renamed copy still triggers on the embedded description even when the filename has been changed. CsExec performs remote command execution by copying a service binary to a target host's admin share, installing and starting it through the service control manager, and relaying commands over a named pipe; it is a common lateral-movement and hands-on-keyboard tool in intrusion and ransomware activity. Investigation should confirm which branch fired, decode what the tool was used to run, and determine whether the service-creation and remote-execution behavior maps to sanctioned administration.
type: detection
detection_id: d08a2711-ee8b-4323-bdec-b7d85e892b31
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Did this alert fire because the image name ends in csexec.exe, because the PE Description reads csexec, or both?
  context: The rule matches on either of two independent conditions, so confirm which branch triggered. A match on the image name alone means the file is named csexec.exe; a match on the PE Description alone means a renamed binary still carries the csexec description compiled into it, which is a stronger signal of the genuine tool under a disguised filename. Note which branch fired, because a description-only match makes the binary's signing and origin questions load-bearing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run a remote-execution tool that creates and starts Windows services on targets?
  context: CsExec is used to push command execution to remote hosts via service installation, which overlaps with legitimate administrative remote-management workflows. Knowing whether the acting account and host normally perform remote administration is often the fastest way to separate a sanctioned operation from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What command did CsExec carry to the target? Decode the full command line for the executed payload and any host or credential arguments.
  context: The command line carries the target host, any supplied credentials, and the command to be run remotely. Decode it to recover the operational intent — an interactive shell (cmd.exe), a script, an encoded payload, or a downloader. Obfuscated, base64-encoded, or concatenated arguments are themselves a signal that the execution is meant to evade review rather than perform routine administration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:remote_access_tool.tool_authorization
  question: Is CsExec on the organization's approved remote-administration software list?
  context: Most organizations sanction a specific set of remote-administration tools and exclude open-source PsExec reimplementations. CsExec is not commercial remote-support software; its presence is rarely authorized, and an unapproved remote-execution tool should be treated as shadow IT or operator-deployed tooling regardless of who ran it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there an active change ticket or maintenance window that explains remote execution against the target host at this time?
  context: Sanctioned remote administration normally maps to a change record, a maintenance window, or a documented script run. If no such context exists for this execution, the tool may have been introduced for lateral movement or hands-on-keyboard operation rather than routine support.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1569.002.service_installation
  question: Was a Windows service installed on this host around the time of the alert, and what binary did it point to?
  context: CsExec executes remotely by copying a service binary to the target and registering it through the service control manager, which records a service-installed event. A newly installed service that points to a binary in a temporary or user-writable path, or that exists only briefly before removal, is the on-disk footprint of this technique. Treat zero results as a visibility gap if service-installation events are not collected in this environment rather than evidence no service was created.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4697
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - ServiceType
- source: attack:T1569.002.service_registry
  question: What service registry keys were created or modified on this host in the alert window, and do any point to a transient or non-standard binary?
  context: Service installation writes the binary path and start type into the service control key hive. A service key created and then deleted within a short window, or one whose binary path resolves to a temporary or copied executable, corroborates remote service-based execution rather than a permanent, sanctioned service. Compare the referenced binaries against the set of services normally expected on this host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\System\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned CsExec, and is that parent chain expected for remote administration?
  context: The parent process shows how the tool was launched. An interactive shell or remote-management console launched by an administrator is one story; a launch from a script host, an Office application, or a downloaded loader is another. Walk the parent lineage to see what introduced the tool onto this host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did CsExec spawn on this host afterward?
  context: The processes launched after the tool ran reveal what it was actually used to do. Service-based remote execution that drops into cmd.exe, powershell.exe, reconnaissance binaries, or a downloader indicates hands-on-keyboard operation; a clean exit with no children is more consistent with a failed or test invocation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What remote hosts did CsExec connect to from this endpoint?
  context: CsExec reaches targets over SMB to the admin share and relays commands over a named pipe, so outbound connections from this binary point at the hosts it operated against. Connections to multiple internal hosts in a short span indicate fan-out lateral movement; a single internal target is more consistent with a one-off administrative action. If network telemetry is not available for this binary, recover the target from the decoded command line instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_host_context.clustering
  question: What other processes ran on this host in the minutes around the alert?
  context: Service-based remote execution is usually one step in a sequence. Correlating the surrounding process activity within a tight window reveals what immediately preceded the service creation and what followed it, which is how service installation gets tied to the execution it enabled. Reconnaissance, credential access, or staging in the same window broadens the scope of the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.baseline
  question: Has this host run csexec.exe before?
  context: A remote-execution tool that has never run on this host is more notable than one that appears regularly under a known administrative pattern. Zero or very low historical counts point to first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the CsExec pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's own selection scoped to this host, so the resulting parent and user distribution reflects how this specific pattern — not generic binary usage — has run here before. A new parent process, an unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \csexec.exe
      selection_pe:
        Description: csexec
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run csexec.exe anywhere in the environment?
  context: Compare the acting account against its own history. A user who has never run this remote-execution tool, or who has no remote-administration role, is more notable than an administrator who uses it routinely. User role and typical toolset should align with running a service-installing remote-execution utility.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent unusual for csexec.exe?
  context: When the alert fires under a service principal rather than a named user, the account does not attribute the behavior, so the meaningful pivot is the launch mechanism — which parent process spawned the binary, and whether that pair is historically common. A new or rare parent for csexec.exe is the deviation; a pair already accounting for many prior events is more likely existing automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment in the hour around the alert?
  context: Tracking the acting account's activity across all hosts reveals whether the same identity drove remote execution against several endpoints. The same user triggering similar activity on multiple hosts widens the likely scope of the operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the alert window, or is the activity isolated to this host?
  context: Under a service principal, surveying the account's environment-wide activity returns agent-telemetry noise. The meaningful question is whether the same launch mechanism — parent process plus csexec.exe — appeared on other hosts in the same window. Multiple hosts point to a coordinated push; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Service-based remote execution rarely happens in isolation. Earlier detections on the same host — reconnaissance, credential access, or defense tampering — may reveal the stages that preceded the tool's use and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
