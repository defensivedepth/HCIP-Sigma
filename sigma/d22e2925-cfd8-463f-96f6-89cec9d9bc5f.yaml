name: XBAP Execution From Uncommon Locations Via PresentationHost.EXE
id: af8fe813-3641-4d75-a395-c96dbec36f9b
description: |
  Detects PresentationHost.exe executing a XAML Browser Application (.xbap) file from a path outside C:\Windows\ and C:\Program Files. The rule fires when all of the following hold: the image ends in presentationhost.exe (or its OriginalFileName is PresentationHost.exe) AND the command line contains .xbap AND the command line does NOT reference C:\Windows\ or C:\Program Files. PresentationHost.exe is a signed Microsoft binary that hosts WPF browser applications; because it is trusted and can both run XBAP code and retrieve a remote payload into INetCache, it is abused to proxy-execute code and bypass application allowlisting. Legitimate XBAPs are uncommon on modern workstations and normally ship from system or Program Files locations. Determine what the .xbap is and where it came from, whether a remote payload was fetched, what code the host loaded, and whether the parent and user account are expected to run browser applications this way.
type: detection
detection_id: d22e2925-cfd8-463f-96f6-89cec9d9bc5f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line invoke presentationhost.exe against a .xbap file from a path outside C:\Windows\ and C:\Program Files?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the image is presentationhost.exe (or its OriginalFileName is PresentationHost.exe) AND the command line contains .xbap AND the command line does not reference C:\Windows\ or C:\Program Files. Confirm all three conditions hold in the exact command that fired, and note the actual on-disk location of the .xbap file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run XAML browser applications via presentationhost.exe?
  context: XBAPs are uncommon on modern production workstations, and PresentationHost.exe is rarely launched interactively. A user or host with no business reason to run browser applications is a stronger signal than a developer workstation or a line-of-business application that ships a legitimate .xbap. Knowing the user role and host function is often the fastest path to separating a true positive from routine use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Proxy execution through a trusted binary is frequently chained with steps that weaken endpoint protection before the payload runs. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal; kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did presentationhost.exe run? Decode the full command line and the .xbap target.
  context: The full command line reveals the .xbap argument and any additional switches. Pull the exact on-disk path or URL of the .xbap target — a local path in a user-writable directory (Temp, Downloads, AppData, Public, ProgramData) versus a remote http(s) URL distinguishes a staged local payload from a remote-hosted one. Decode any URLs, script paths, or DLL entrypoints in the arguments to understand what code the binary was directed to host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.network_connection
  question: Did this presentationhost.exe execution open a network connection, and to what destination?
  context: PresentationHost.exe can retrieve a remote XBAP payload and place it in INetCache, so a network connection from this process points to a remote-hosted payload rather than a purely local file. Confirm whether the destination is an expected internal or enterprise host, or an unknown external address. Connections to legitimate enterprise domains can be treated as routine; an unexpected external destination broadens the scope. If network telemetry for this process is not collected in this environment, treat zero results as a visibility gap rather than evidence no connection occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1218.image_load
  question: What modules did presentationhost.exe load while hosting the .xbap?
  context: Hosting a XAML browser application loads .NET and WPF assemblies into the process; an XBAP that proxies attacker code may also pull in unsigned or unexpected modules from user-writable directories. Review the loaded modules for assemblies outside the system framework paths or with absent or untrusted signatures, which indicate code being hosted beyond a benign browser application. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_process_tool.process_chain
  question: What process spawned presentationhost.exe, and is that parent chain expected?
  context: The parent process reveals how the browser application was launched. A user opening a .xbap from explorer.exe or a browser differs from one launched by mshta.exe, wscript.exe, cmd.exe, powershell.exe, or an Office application — those parents suggest a script or document drove the proxy execution. Walk up the tree to see what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did presentationhost.exe spawn afterward?
  context: The processes a hosted XBAP spawns reveal its actual impact. A benign browser application rarely launches additional binaries; proxy execution often spawns cmd.exe, powershell.exe, certutil.exe, or other tooling for follow-on actions such as download, persistence, or reconnaissance.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run presentationhost.exe?
  context: Compare this user's current action against their historical pattern. A user who has never launched PresentationHost.exe is more suspicious than one who does so regularly. XBAP execution is uncommon enough that a zero or very low historical count for the user is a meaningful signal; align the result with the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the parent unusual for presentationhost.exe?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is which parent process spawned PresentationHost.exe and whether that pair is historically common. A new or rare parent for this binary on this host or environment-wide is the deviation worth chasing; a pair already accounting for many prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar proxy-execution activity on several hosts, the scope may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window, indicating coordinated automation rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise because every host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus PresentationHost.exe — fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access, or a delivery step that staged the .xbap — may reveal the attack stages that preceded this proxy execution and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If PresentationHost.exe hosted code, check whether rundll32, regsvr32, mshta, msbuild, installutil, msiexec, or similar trusted binaries were also used to run arbitrary code on this host. Multiple proxy-execution utilities achieving the same objective strengthens the case for deliberate allowlist bypass rather than incidental use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was presentationhost.exe executed from its expected system path?
  context: PresentationHost.exe normally runs from C:\Windows\System32 or C:\Windows\SysWOW64. A copy executed from outside those paths may have been relocated or renamed to evade path-based allowlists, and the rule already flags command lines that do not reference C:\Windows\ or C:\Program Files. Compare the Image path against OriginalFileName to spot a renamed or relocated copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's PresentationHost XBAP pattern over the past 90 days, and what command-line shapes are typical?
  context: A PresentationHost XBAP pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic use of the binary. The command-line projection lets the typical invocation shapes be compared against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \presentationhost.exe
      - OriginalFileName: PresentationHost.exe
      selection_cli:
        CommandLine|contains: .xbap
      filter_main_generic:
        CommandLine|contains:
        - ' C:\Windows\'
        - ' C:\Program Files'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
