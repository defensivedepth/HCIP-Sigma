  skipped_templates: []
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1059.003) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        This rule does not fire on cmd.exe or a script host whose .NET/module
        loads carry the signal; it fires on AdvancedRun relaunching an arbitrary
        target under a token. The investigative weight is the spawned target and
        its arguments, which the follow_on question covers via process_creation
        of the child the elevated launch produced. Module-load events on
        AdvancedRun.exe itself add volume without precision for the run-as
        behavior. No compensating attack:T1059.003.image_load question authored.
    - hint: "logsource 'process_access' (recommended by techniques: T1134.002) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        AdvancedRun's /RunAs path creates a process under a chosen built-in
        token via CreateProcessWithToken-style elevation; it does not steal a
        handle by opening another running process, so a process_access
        (Sysmon EventCode 10) sweep keyed to handle access to lsass/winlogon
        would not capture this rule's mechanism. The token-context change is
        covered instead by the token_elevation question (process_creation) and
        the privileged_logon question (security log).
    - hint: "logsource 'registry_set' (recommended by techniques: T1564.003) is not covered — pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        T1564.003 has two analytic forms -- registry edits that push window
        positions off screen, and CLI window-hiding flags. This rule fires on the
        CLI form (/WindowState 0), which is covered directly by the hidden_window
        question via process_creation. The rule's detection carries no registry
        modification, so a registry_set sweep would surface unrelated key writes.
        No compensating attack:T1564.003.registry_set question authored.
