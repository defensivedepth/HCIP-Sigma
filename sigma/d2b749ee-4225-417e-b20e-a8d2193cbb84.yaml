name: PUA - AdvancedRun Execution
id: cbe6a6c5-4a4a-4a08-8fdb-d03203b15b9e
description: |
  Detects execution of the NirSoft AdvancedRun utility, which launches an
  arbitrary target binary under a chosen security context (current user,
  Administrator, SYSTEM, or TrustedInstaller) via a /RunAs token argument. The
  rule fires when the process carries the AdvancedRun OriginalFileName, or when
  the command line combines /EXEFilename with /Run, or when it combines
  /WindowState 0 with /RunAs and /CommandLine. Legitimate use is rare and
  usually tied to a documented IT or troubleshooting task; the same syntax is
  reused to elevate to SYSTEM or TrustedInstaller in order to stop endpoint
  protection services and delete protected directories before a destructive
  payload runs. Determine which target binary was launched, under what
  privilege level, with what window visibility, and whether protection on the
  host was weakened around the same time.
type: detection
detection_id: d2b749ee-4225-417e-b20e-a8d2193cbb84
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does this process match the AdvancedRun execution pattern this rule detects?
  context: >-
    Confirm the alert before investing time. The rule matches on any one of three
    conditions, so note which branch fired -- the OriginalFileName being
    AdvancedRun.exe, the command line carrying both /EXEFilename and /Run, or the
    command line carrying /WindowState 0 together with /RunAs and /CommandLine. The
    /RunAs and /CommandLine combination indicates a target binary was launched
    under a selected token; review the full command line against the branch that
    matched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a run-as elevation utility like AdvancedRun?
  context: >-
    Legitimate AdvancedRun use is rare and usually tied to a specific
    administrator performing a documented task. A standard user account or a
    host with no IT support role running a tool that relaunches binaries as
    SYSTEM or TrustedInstaller is harder to explain as routine operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is AdvancedRun on the organization's approved software list?
  context: >-
    Organizations typically maintain a list of sanctioned administrative and
    support utilities. AdvancedRun is a portable run-as tool that does not
    require installation; its presence outside an approved toolset may represent
    shadow IT or attacker-staged tooling. Check it regardless of how well known
    the utility is.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a change ticket, maintenance window, or support session that explains this AdvancedRun run?
  context: >-
    Legitimate elevation-utility use generally lines up with a documented
    troubleshooting task, an installer that needs SYSTEM context, or a scheduled
    maintenance window. If no such context exists, the run is more likely
    operator activity staging an elevated action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What target binary and arguments did AdvancedRun launch, and at what privilege level?
  context: >-
    Decode the command line argument by argument. /EXEFilename names the target
    binary; /CommandLine carries the arguments passed to it; /RunAs sets the
    security context, where 1 and 2 are the current user, 3 is Administrator, 4
    is SYSTEM, and 8 is TrustedInstaller; /StartDirectory sets the working
    directory; /Run executes immediately. A SYSTEM or TrustedInstaller target
    that invokes sc, net, taskkill, powershell, or cmd against security services
    or protected directories is the high-impact case.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        OriginalFileName: AdvancedRun.exe
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - User
- source: attack:T1134.002.token_elevation
  question: What security context did AdvancedRun request via /RunAs, and does it cross an integrity boundary?
  context: >-
    AdvancedRun spawns the target under the token named by /RunAs. Values of 4
    (SYSTEM) or 8 (TrustedInstaller) move the child above the integrity level the
    parent normally holds, which is the privilege-escalation step this technique
    describes. Compare the spawning user against the requested context; a
    medium-integrity user account requesting SYSTEM or TrustedInstaller is the
    mismatch worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: ' /RunAs '
      condition: selection
    fields:
      - CommandLine
      - User
      - IntegrityLevel
      - ParentImage
- source: attack:T1134.002.privileged_logon
  question: Did a privileged logon or special-privileges assignment occur on this host around the alert?
  context: >-
    When a target is launched under SYSTEM or TrustedInstaller, the host records
    a logon and a special-privileges assignment for the new security context.
    Correlating that event with the AdvancedRun execution window confirms the
    token change actually took effect rather than failing. Absence of a matching
    privileged logon suggests the elevation request did not succeed.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      category: security
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - winlog.event_id
      - SubjectUserName
      - TargetUserName
      - PrivilegeList
- source: attack:T1564.003.hidden_window
  question: Was the launched target hidden from the interactive desktop via /WindowState 0?
  context: >-
    /WindowState 0 starts the spawned process with its window hidden, so an
    elevated action runs without a visible window on the interactive desktop.
    Hidden execution paired with an elevated /RunAs context is consistent with an
    operator suppressing on-screen evidence of a privileged action rather than an
    administrator running an interactive tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: ' /WindowState 0'
      condition: selection
    fields:
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.process_chain
  question: What process spawned AdvancedRun, and is that parent chain expected?
  context: >-
    The parent process reveals how the utility was invoked. A launch from
    explorer.exe or a console a known administrator was using fits interactive
    work; a launch from a script host such as wscript.exe or cscript.exe, from
    an Office application, or from a binary dropped in a temporary directory is
    consistent with automated staging of an elevated action.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What processes did AdvancedRun launch, and what did those targets do next?
  context: >-
    The processes spawned through AdvancedRun reveal its actual impact. The
    target named in /EXEFilename runs under the requested token; watch for
    service-control utilities, powershell, cmd, or file-deletion commands that
    act against endpoint protection services or protected directories, which is
    the destructive-staging pattern this tooling enables.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host run AdvancedRun before, and how often?
  context: >-
    A utility that has never run on a host is more notable than one that appears
    regularly as part of a support workflow. Zero or very low historical counts
    point to first-time or rare execution and raise the weight of the other
    findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        OriginalFileName: AdvancedRun.exe
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has fired this AdvancedRun pattern before, what parents and users drove it, and does this alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent and
    user distribution reflects how this specific firing pattern -- not generic
    AdvancedRun usage -- has run here. A new parent process, an unexpected user
    account, or an unusual command-line shape relative to that history is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - OriginalFileName: AdvancedRun.exe
      - CommandLine|contains|all:
        - ' /EXEFilename '
        - ' /Run'
      - CommandLine|contains|all:
        - ' /WindowState 0'
        - ' /RunAs '
        - ' /CommandLine '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run AdvancedRun or other elevation utilities?
  context: >-
    Compare this user's current action against their history across the
    environment. A user who has never run AdvancedRun is more notable than one
    who does so regularly as part of a support role. User role and typical
    toolset should align with running a tool that relaunches binaries under
    elevated tokens.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        OriginalFileName: AdvancedRun.exe
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-AdvancedRun launch combination historically routine on this host or environment-wide?
  context: >-
    When the alert fires under a service principal, user identity does not
    attribute the behavior; the meaningful pivot is the launch mechanism. Check
    whether the parent process that spawned AdvancedRun is a historically common
    pair on this host and across the environment. A new or rare parent for this
    binary is the deviation; a pair already accounting for many prior events
    points to vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of this alert?
  context: >-
    Tracking the user's activity across all hosts reveals whether the elevated
    execution is isolated or part of activity spanning multiple endpoints. The
    same user triggering similar activity on several hosts widens the scope of
    the investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-AdvancedRun combination fire on other hosts in the alert window?
  context: >-
    Under a service principal, a user-keyed network sweep returns agent-telemetry
    noise. The meaningful question is whether the same launch mechanism -- the
    parent process spawning AdvancedRun -- fired on other hosts in the alert
    window. Several hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    Run-as utilities are frequently used to stop endpoint protection services or
    delete protected directories before a destructive payload runs, so tamper
    timing relative to this execution is central to the disposition. The query
    surfaces direct attempts to disable AV/EDR services, flip Defender flags, add
    broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful signal
    that protection looks healthy; populated rows shift the disposition toward
    operator preparation, so review the parent process and signing chain to
    identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
