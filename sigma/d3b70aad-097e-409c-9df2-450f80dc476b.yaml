name: PUA - DIT Snapshot Viewer
id: abc90928-aed6-4f5f-be66-9ea52f0e5b85
description: |
  Detects execution of ditsnap.exe (DIT Snapshot Viewer), an offline inspection
  tool for the Active Directory database ntds.dit. The rule fires when a process
  image ends in ditsnap.exe or any command line references ditsnap.exe. The tool
  uses Volume Shadow Copy to obtain a consistent copy of the lsass-locked ntds.dit
  on a live domain controller, runs esentutil /repair against the copy, and walks
  ESE tables to read directory objects including password-related attributes. On a
  domain controller this is a direct path to offline domain credential extraction;
  legitimate use is limited to deliberate administrative or forensic inspection, so
  the investigation determines whether the host is a DC, who ran it, what was copied,
  and what followed.
type: detection
detection_id: d3b70aad-097e-409c-9df2-450f80dc476b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process image or command line reference ditsnap.exe?
  context: Confirm the alert is a true positive before investing time. The rule fires
    on either branch — a process whose image ends in ditsnap.exe, or any command line
    that references ditsnap.exe. Review the exact image path and command line, and
    note which branch matched, since a renamed binary invoked by name on the command
    line behaves the same as the original executable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this host a domain controller, and is this user expected to inspect the AD database?
  context: ditsnap targets ntds.dit, which lives on domain controllers. Whether the
    host functions as a DC and whether the operating account is an administrator who
    performs deliberate directory inspection or forensic work is often the fastest
    way to separate sanctioned admin activity from credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is ditsnap.exe on the organization's approved software list?
  context: ditsnap is a publicly distributed third-party tool, not a built-in Windows
    utility. Even on systems run by administrators, an unsanctioned AD-database
    inspection tool may represent shadow IT or an operator staging for offline
    credential extraction. An unapproved tool should be reviewed regardless of who
    ran it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a documented maintenance window or forensic task explaining this AD database inspection?
  context: Deliberate use of an offline ntds.dit inspection tool normally maps to a
    scheduled forensic review, a directory-recovery task, or an explicit admin request.
    If no such record exists for this execution, the tool may have been introduced by
    an operator preparing to extract domain credentials.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes hands-on credential access. The query surfaces
    direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions,
    clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy"
    signal — kernel-level driver tampering and in-memory patches will not appear here.
    Populated rows shift the disposition toward operator preparation; review the parent
    process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:credential_access.credential_target_identification
  question: Was ntds.dit copied or accessed during this execution?
  context: ditsnap operates against the AD database — it uses Volume Shadow Copy to
    obtain ntds.dit from a domain controller while lsass holds it locked, then runs
    esentutil /repair on the copy and reads ESE tables including password-related
    attributes. Confirm from the command line and surrounding activity which database
    file and path were targeted, which determines whether domain credentials are
    exposed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1003.003.shadow_copy_and_db_access
  question: Were a shadow copy of the system volume or a copy of ntds.dit created on this host around the alert?
  context: Offline AD-database extraction leaves a file-side footprint — a Volume Shadow
    Copy of the volume hosting NTDS, a copy of ntds.dit landing in a working directory,
    or esentutil writing to a repaired copy. Correlate file activity touching ntds.dit
    or the NTDS directory within a few minutes of the alert to confirm the snapshot
    actually occurred rather than the tool merely launching.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
          - 'ntds.dit'
          - '\NTDS\'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
      - User
- source: attack:T1003.003.parent_process_analysis
  question: What process spawned ditsnap.exe, and is that parent chain expected for AD inspection?
  context: The parent process reveals how the tool was launched. Deliberate admin use
    typically descends from an interactive shell under explorer.exe on a managed
    administrative host. Launch from a remote-execution service, a scripting host
    (wscript.exe, mshta.exe), or an unexpected automation parent points toward
    operator-driven credential access rather than sanctioned inspection.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1003.003.user_context
  question: Does this user normally run ditsnap.exe anywhere in the environment?
  context: Compare this user against their own history. An account that has never run
    this AD-inspection tool is more notable than one that uses it as part of a known
    forensic or recovery role. Aggregated by host so first-time-for-this-user execution
    stands out at low or zero counts.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-ditsnap.exe launch combination historically routine on this host or across the environment?
  context: When the alert fires under a service principal, user identity does not
    attribute behavior. The meaningful pivot is the launch mechanism — which parent
    process spawned ditsnap.exe, and whether that pair is historically common. A new
    or rare parent for this binary is the deviation worth chasing; a pair already
    accounting for many prior events points to established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: If ntds.dit was extracted, every account in the domain is potentially
    exposed, including domain admins, enterprise admins, krbtgt, and service accounts.
    Replication or offline access to krbtgt enables Golden Ticket forgery. Cross-reference
    privileged group memberships to size the exposure and decide on escalation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the operating account across all hosts in the alert window reveals
    whether the same identity drove activity on additional endpoints, which would
    enlarge the scope of compromise. If the alert fires under a service principal,
    this view is dominated by agent telemetry and the parent-plus-binary rollout view
    is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-ditsnap.exe combination fire on other hosts in the same window?
  context: Under a service principal, "what else did this user do" returns agent-telemetry
    noise. The meaningful question is whether the same launch mechanism — parent process
    plus spawned binary — fired on other hosts in the alert window. Multiple hosts in
    the same window points to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired the ditsnap.exe pattern, what parents and users drove it, and does the current alert fit?
  context: Even tools with a legitimate purpose can be abused. The query mirrors the
    rule's selection scoped to this host, so the parent and user distribution reflects
    how this specific firing pattern has historically run here. A new parent, an
    unexpected account, or an unusual command-line shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \ditsnap.exe
      - CommandLine|contains: ditsnap.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the ditsnap.exe pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide
    count of this firing pattern rather than generic binary usage. Many hosts firing
    the same pattern points to scripted deployment or vendor automation; one host or a
    small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \ditsnap.exe
      - CommandLine|contains: ditsnap.exe
      condition: selection
    fields:
    - host.name
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated on this host after the event?
  context: Credential theft is typically followed by lateral movement using the stolen
    credentials. Look for follow-on alerts indicating RDP sessions, SMB connections,
    WinRM usage, or new authentication shortly after the AD-database access. With domain
    credentials in hand, lateral movement can begin almost immediately.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Reaching a domain controller's AD database usually follows earlier stages.
    Earlier detections on the same host — reconnaissance, privilege escalation, or
    defense tampering — may reveal how the operator gained the access needed to run an
    ntds.dit inspection tool and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
