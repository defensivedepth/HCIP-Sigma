name: New Network Trace Capture Started Via Netsh.EXE
id: 25469469-10e7-4f39-8795-e0a2417c5eaa
description: |
  Detects netsh.exe invoked with both 'trace' and 'start' on the command line, which begins a packet capture session that writes traffic to an ETL file. Administrators and support staff legitimately use netsh trace for connectivity troubleshooting, so the action is not inherently malicious. Captured traffic can expose credentials, tokens, and session data transiting the host, so the investigation should determine who started the capture, under what parent process, what the capture was scoped to collect, and whether the activity fits the operator's normal role.
type: detection
detection_id: d3c3861d-c504-4c77-ba55-224ba82d0118
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show netsh starting a network trace capture?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires only when the process is netsh.exe (by image name or original filename) and the command line contains both 'trace' and 'start'. Verify both terms are present and that the command begins a capture rather than querying or stopping one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to start network packet captures?
  context: Network and desktop support staff legitimately run netsh trace for connectivity troubleshooting. A standard user, a service account, or a host with no support role starting a capture is harder to explain. Knowing whether the user role and host function fit packet-capture activity is often the fastest way to separate routine troubleshooting from collection activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: What was the capture configured to collect, and where does it write output?
  context: Parse every netsh trace argument to understand the capture scope. Look for an output path (tracefile=, persistent=yes), a capture filter (capture=yes, scenario=, protocol=, IPv4.Address=, Ethernet.Type=), and report=yes. A broad capture with no filter and a persistent or user-writable output path points toward collection of credentials or session data in transit rather than scoped troubleshooting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned netsh, and is that parent chain expected for a capture?
  context: The parent reveals how the capture was started. Interactive troubleshooting usually traces back to explorer.exe to cmd.exe or powershell.exe. A parent such as wscript.exe, mshta.exe, wmiprvse.exe, wsmprovhost.exe, or an Office application points to scripted or remote invocation rather than a person at the keyboard.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: A packet capture that precedes or accompanies collection is sometimes paired with attempts to weaken monitoring. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful signal that protection looks healthy; kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single capture may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession (ipconfig, net, arp, nbtstat, netstat, nltest) alongside the capture is a signature of post-compromise enumeration. Attackers map the host and network before deciding what to collect.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned netsh, and does that launch pattern look interactive or automated?
  context: A capture launched from an interactive shell under explorer.exe reads as a person troubleshooting. A capture spawned by a script interpreter (wscript.exe, cscript.exe, mshta.exe), a remote-execution host (wmiprvse.exe, wsmprovhost.exe), or an Office application reads as automated or remote-driven collection and raises the priority of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts and credentials could be exposed by traffic on this host, and are any privileged?
  context: Packet captures expose whatever authenticates or transits the wire during the session, including service-account tokens, NTLM exchanges, and cleartext protocol credentials. The severity depends on what runs on this host and which accounts authenticate to it. A capture on a domain controller, jump host, or admin workstation can expose high-value credentials and warrants cross-referencing the host's logon population against directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after the capture started?
  context: Captured credentials are typically reused for lateral movement. Follow-on alerts on this host for remote logon, SMB, WinRM, RDP, or remote-execution activity shortly after the capture began indicate the collected data may already be in use. The capture session can run for minutes to hours, so look across the window after it started.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:lolbin.technique_class_lateral
  question: Were any other capture or transfer LOLBins used on this host recently?
  context: Operators who use netsh trace for collection often pair it with other living-off-the-land utilities to stage or move the captured file (certutil, bitsadmin, curl, makecab, expand). Finding additional LOLBins working the same objective around the capture strengthens the case that this is collection rather than troubleshooting. The ToolNames worth tracking should be tuned to the binaries actually deployed in this environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\wmic.exe'
          - '\diskshadow.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: attack:T1040.tuning_parameter
  question: Were any other network-capture or sniffing tools run on this host recently?
  context: netsh trace is one of several ways to capture traffic. Other capture tooling on the same host (pktmon, dumpcap, tshark, Wireshark, tcpdump, windump, or the rawcap-style utilities) indicates broader collection capability and that the operator may be comparing or combining capture methods. The list of known capture tools should be tuned to what is approved in this environment so that authorized monitoring software is not treated as a finding.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_capture:
        Image|endswith:
          - '\pktmon.exe'
          - '\dumpcap.exe'
          - '\tshark.exe'
          - '\wireshark.exe'
          - '\windump.exe'
          - '\tcpdump.exe'
          - '\rawcap.exe'
          - '\netmon.exe'
          - '\nmcap.exe'
          - '\microsoftmessageanalyzer.exe'
      condition: selection and selection_capture
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was netsh executed from its expected System32 path?
  context: netsh.exe normally runs from C:\Windows\System32 (or SysWOW64). A netsh running from a user-writable directory such as a temp or download folder suggests the binary was copied or renamed to evade path-based allowlists or naming detections. Compare the Image path against the expected location and confirm OriginalFileName still reads netsh.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host started a netsh trace capture over the past 90 days, and what command-line shapes are typical?
  context: A capture pattern with no prior history on a host is more notable than one that recurs under stable conditions. The query mirrors the rule's selection so the count reflects netsh trace start specifically rather than all netsh usage. Compare the typical capture command shapes against the alerting one to see whether the scope, filters, or output path differ from the host's norm.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - trace
        - start
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts started a netsh trace capture in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of netsh trace start rather than generic netsh usage. Many hosts firing the same pattern points to scripted deployment or a monitoring rollout; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - trace
        - start
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally start network captures?
  context: Compare this user's current action against their historical behavior. A user who has never run netsh trace is more notable than one who does so regularly as part of a support role. Low or zero historical counts indicate first-time or rare use of the capture capability by this account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent plus netsh combination historically routine on this host or across the environment, or is the parent unusual?
  context: When the alert fires under a service principal such as SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account, user identity does not attribute the behavior. The meaningful pivot is the launch mechanism, which parent process spawned netsh, and whether that pair is historically common. A new or rare parent for netsh is the deviation worth chasing; a pair already responsible for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the capture is isolated or part of broader hands-on activity. If the same user triggered similar actions on multiple hosts, the scope of the activity may extend past this endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent plus netsh combination fire on other hosts in the same window, indicating a coordinated rollout?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism, parent process plus netsh, fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
