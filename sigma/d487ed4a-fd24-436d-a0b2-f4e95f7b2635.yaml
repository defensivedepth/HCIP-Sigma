name: Suspicious ClickFix/FileFix Execution Pattern
id: 6db6886d-a05e-44be-a824-7f2a89f2bd6c
description: |
  Detects the ClickFix/FileFix social-engineering pattern, where a user is tricked
  into pasting an attacker-staged command into the Run dialog or File Explorer
  address bar and running it. The rule fires when explorer.exe spawns a process AND
  that child's command line contains a '#' AND one of a set of lure keywords
  (captcha, verify, human, robot, challenge, validation, and similar) — both
  conditions must hold. Legitimately, explorer.exe launches user-initiated programs
  constantly, but a command line carrying a verification-style lure marker plus a '#'
  comment separator is the hallmark of a pasted clipboard payload. Confirm the full
  pasted command, decode what it executes, and trace the follow-on file drops and
  outbound connections the one-liner sets up.
type: detection
detection_id: d487ed4a-fd24-436d-a0b2-f4e95f7b2635
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Was this process spawned by explorer.exe with a command line that contains a '#' and a verification-style lure keyword?
  context: Confirm the alert is a true positive before investing time. The rule requires
    both conditions together — explorer.exe as the parent AND a command line carrying a '#'
    plus one of the social-engineering markers (captcha, verify, human, robot, challenge,
    validation, identification, and similar). The '#' is the comment separator that hides
    the lure text from the executed portion; the keyword is the residue of the fake "prove
    you are human" prompt the victim was shown. Read the full command line and parent to
    make the call.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to paste and run commands from the Run dialog or Explorer address bar?
  context: ClickFix depends on a person manually pasting a command. Knowing whether this is
    an interactive workstation with a real user at the keyboard, and whether that user's role
    routinely involves running command-line one-liners, helps separate a genuine victim
    interaction from automation or a power user. A server or service account firing this
    pattern is harder to explain as legitimate paste-and-run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly does the pasted command do? Decode the full command line and any encoded or download content.
  context: The pasted one-liner is the payload. Decode every part — script-host or LOLBIN
    invoked (mshta.exe, powershell.exe, cmd.exe, curl.exe, finger.exe), base64 or
    -EncodedCommand blocks, IEX/Invoke-Expression, download cradles (Invoke-WebRequest,
    DownloadString), and any '#' comment carrying the lure text. The portion after the '#'
    is cosmetic; the portion before it is what ran. Identify the destination URL or host and
    the file it fetches or writes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - account
          - anti-bot
          - botcheck
          - captcha
          - challenge
          - confirmation
          - fraud
          - human
          - identification
          - identificator
          - identity
          - robot
          - validation
          - verification
          - verify
      condition: selection
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: Is explorer.exe expected to spawn this child, and what was the user doing right before?
  context: explorer.exe is the shell, so it spawns user-launched programs all the time —
    the signal here is the command-line content, not the parent identity alone. Tracing
    explorer.exe's own context and the surrounding session helps establish whether a person
    was actively browsing or opening a page just before the paste, which is consistent with
    the lure flow, versus an unattended host where a pasted interactive command makes no
    sense.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same explorer.exe instance spawn around this time?
  context: A pasted command frequently chains stages — a downloader that drops a payload,
    then the payload itself, then a persistence or recon step. Examining the other children
    of the same explorer.exe instance in the surrounding window reveals whether this was an
    isolated paste or the first link in a multi-stage execution started from one lure.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:initial_access.delivery_vector
  question: What web page, email, or message delivered the lure that prompted the paste?
  context: ClickFix lures are delivered through a fake CAPTCHA or "verify you are human" web
    page, a phishing email, or a chat message that instructs the victim to copy a command and
    paste it into Run or the address bar. Identifying the delivering page or message — from
    browser history, proxy logs, or email records around the alert time — enables blocking the
    source and finding other users who saw the same lure.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:initial_access.campaign_scope
  question: Did the same ClickFix pattern fire on other users or hosts?
  context: A ClickFix lure is typically served to many visitors of a compromised or malicious
    site, so one detection rarely stands alone. Correlating the same rule across hosts and
    users shows the breadth of the campaign and surfaces additional victims who pasted the
    command and need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.evidence_preservation
  question: Did the pasted command drop a file, and is it still on disk for analysis?
  context: ClickFix one-liners commonly download a second-stage payload into a user-writable
    location (%TEMP%, %APPDATA%, the Downloads folder) and execute it. If a file was written,
    checking whether it still exists enables hashing, reputation lookup, and content review.
    Scope to the paths the command referenced rather than every file event on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1204.004.file_drop
  question: Was a first-stage payload written into a user-writable directory shortly after the paste?
  context: The copy-and-paste chain typically writes a downloaded or unpacked file into
    %TEMP%, %APPDATA%, %PUBLIC%, or the user profile before running it. Surveying file writes
    into those directories in the minutes around the execution surfaces the dropped payload
    even when its exact path was not visible in the command line, and shows which process
    wrote it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\Temp\'
          - '\AppData\'
          - '\Users\Public\'
          - '\Downloads\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: attack:T1204.004.network_egress
  question: Did the host make an outbound connection to an external destination right after this execution?
  context: The pasted command usually reaches out to fetch a second stage or establish
    command and control immediately after it runs. Reviewing outbound connections from this
    host in the minutes after the execution, excluding known-good system processes, surfaces
    the download source or C2 endpoint. Correlate the connection timing with the execution to
    tie the egress to this paste rather than unrelated traffic.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_system:
        Image|endswith:
          - '\svchost.exe'
          - '\System'
      condition: selection and not filter_system
    fields:
      - Image
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: ClickFix payloads frequently weaken protection before fetching the next stage — a
    common pattern is adding a Defender exclusion path so the downloaded executable runs
    unscanned. This surfaces direct attempts to disable AV/EDR services, flip Defender flags,
    add exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks
    healthy" signal; populated rows shift the disposition toward deliberate operator
    preparation — review the writer's parent process and signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Does this user normally run command interpreters or LOLBINs launched from explorer.exe?
  context: Compare the account's current action against its history. A user who has never run
    a script host or LOLBIN this way is more suspicious than one who does so as part of their
    role. Align the result with what is known about the account — a developer or administrator
    versus a standard office user who should never be hand-running such commands.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this explorer.exe-and-binary combination historically routine on this host or across the environment, or is it unusual?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK
    SERVICE, or a computer account), user identity does not attribute the behavior. The
    meaningful pivot is the launch mechanism — explorer.exe spawning this binary and whether
    that pair is historically common. A new or rare pairing is the deviation worth chasing; a
    pair that already accounts for many events is established behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    whether the same person pasted commands or triggered similar activity on other endpoints.
    If the same user shows matching execution elsewhere, the scope is larger than this one
    host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same explorer.exe-and-binary combination fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, "what else did this user do" returns agent-telemetry
    noise because every host runs SYSTEM-owned agents constantly. The meaningful question is
    whether the same launch mechanism — explorer.exe plus the spawned binary — fired on other
    hosts in the alert window. Multiple hosts point to a wide lure exposure or pushed
    automation; a single host points to a host-local interaction.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the paste and what followed — additional downloads, persistence, or recon.
    Aggregating by process and parent collapses repetitive agent telemetry into high-count
    rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, defense tampering, or other
    execution — may reveal the stages that preceded this paste and help reconstruct the
    timeline. The sequence of alerts on a host often tells the fuller story of how the
    activity unfolded.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
