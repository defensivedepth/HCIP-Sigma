name: Arbitrary Binary Execution Using GUP Utility
id: 0b662f1d-6429-456a-8113-d6a5d2f63153
description: |
  Detects abuse of gup.exe, the Notepad++ updater, as a living-off-the-land binary that
  launches arbitrary executables. The rule fires when gup.exe spawns explorer.exe AND the
  invocation is not the normal Notepad++ self-update — that is, it excludes the legitimate
  case where explorer is launched with the Notepad++ executable path, where the parent runs
  from the Notepad++ updater directory, or where the command line is empty. gup.exe accepts
  an -unzipTo argument that can be pointed at an attacker payload, so a fired alert means
  the updater was driven to start something other than its bundled application. The
  investigation should confirm the spawning chain, decode what gup.exe was directed to run,
  and determine whether the activity is a sanctioned update or operator-driven execution.
type: detection
detection_id: d65aee4d-2292-4cea-b832-83accd6cfa43
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the alert match the rule — gup.exe spawning explorer.exe, and not the normal Notepad++ self-update?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires when the parent is gup.exe and the child is explorer.exe, and it explicitly
    excludes the benign update path — explorer launched with the Notepad++ executable, a
    parent running from the Notepad++ updater directory, or an empty command line. Confirm
    the parent is gup.exe, the child is explorer.exe, and none of those benign conditions
    hold.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run the Notepad++ updater this way?
  context: Notepad++ is common developer and end-user software, and its updater runs
    routinely on workstations where it is installed. Knowing whether this user installed
    Notepad++ and whether the host is a workstation where that software belongs is often the
    fastest path to separating a sanctioned update from a binary being driven to launch
    something else.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What was gup.exe directed to run? Decode the parent updater command line and working directory.
  context: The abuse parameter lives in the gup.exe command line — an -unzipTo argument can
    point the updater at an attacker-supplied payload rather than the bundled Notepad++
    application. Reviewing every gup.exe invocation on this host in the surrounding window,
    rather than only the triggering event, shows the full sequence of what the updater was
    asked to do and reveals the payload path or executable it was directed to start.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\gup.exe'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.parent_process_legitimacy
  question: Is gup.exe expected to spawn explorer.exe here, and what started gup.exe itself?
  context: The parent-child relationship is the core signal for this detection. gup.exe is
    the Notepad++ updater and normally runs unattended to update its own application;
    tracing what spawned gup.exe shows whether it was launched by an interactive Notepad++
    session, a scheduled update, or an unexpected parent such as a script host or shell that
    drove it to start arbitrary code. The parent command line shows what gup.exe was told to
    do.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same gup.exe instance spawn?
  context: If gup.exe was driven to launch more than explorer.exe, the same parent instance
    likely spawned additional processes. Examining siblings of the detected child reveals
    the full scope of what this updater invocation launched — multiple children from one
    gup.exe instance points to deliberate use of the binary as a launcher rather than a
    routine self-update.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: Does gup.exe normally spawn explorer.exe on this host?
  context: Some parent-child pairs are routine and some are inherently unusual. gup.exe
    spawning explorer.exe is the discriminator here — the updater normally launches its own
    bundled application, not the shell. A pairing with zero or very low history on this host
    indicates a novel spawning relationship worth chasing; a long history of the same pair
    points to established, if unusual, behavior to verify against the software's update flow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_parent_process.clustering
  question: What other activity is associated with this gup.exe instance around the same time?
  context: Beyond the child that triggered the alert, the gup.exe parent may have generated
    further process activity in the surrounding window. Seeing the cluster of activity tied
    to this parent on the host helps establish whether the updater was carrying out a single
    benign update or was being used to stage and launch additional tooling.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run gup.exe?
  context: A binary that has never executed on a host is more suspicious than one that runs
    regularly. gup.exe legitimately running where Notepad++ is installed is normal, but on a
    host that does not have Notepad++ deployed, gup.exe running at all is itself the
    anomaly. Zero or very low historical counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \gup.exe
        Image|endswith: \explorer.exe
      filter:
        Image|endswith: \explorer.exe
        CommandLine|contains: \Notepad++\notepad++.exe
      filter_parent:
        ParentImage|contains: \Notepad++\updater\
      filter_null:
        CommandLine: null
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \gup.exe
        Image|endswith: \explorer.exe
      filter:
        Image|endswith: \explorer.exe
        CommandLine|contains: \Notepad++\notepad++.exe
      filter_parent:
        ParentImage|contains: \Notepad++\updater\
      filter_null:
        CommandLine: null
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window
    reveals lateral movement or coordinated activity on multiple endpoints. If the same user
    triggered similar updater-driven execution elsewhere, the scope is larger than this one
    host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \gup.exe
        Image|endswith: \explorer.exe
      filter:
        Image|endswith: \explorer.exe
        CommandLine|contains: \Notepad++\notepad++.exe
      filter_parent:
        ParentImage|contains: \Notepad++\updater\
      filter_null:
        CommandLine: null
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the updater abuse and what followed — reconnaissance, persistence, or further
    execution. Aggregating by process and parent collapses repetitive agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the attack stages that preceded this execution and help
    reconstruct the timeline. A trusted-binary launcher is often the payload-delivery step
    in a longer sequence, so prior alerts give it context.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
