name: Php Inline Command Execution
id: 59dff4f9-301f-4d60-8987-81baf66d7ee6
description: |
  Detects php.exe (matched by Image name or OriginalFileName) invoked with the inline-code flag ' -r', which runs a single
  line of PHP without a script file. Legitimately this is used by developers and build tooling for quick one-liners; in
  attacker hands the same flag executes file-less reverse shells and arbitrary code (for example fsockopen-based payloads
  that pipe a shell over a TCP socket). The rule fires only when both the binary match and the ' -r' command-line pattern
  are present, so the investigation should confirm the exact inline code that ran, who and what launched it, and whether
  the activity fits normal usage on this host and across the fleet.
type: detection
detection_id: d81871ef-5738-47ab-9797-7a9c90cd4bfb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Is this php.exe execution running inline code with the ' -r' flag as the rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when the process is php.exe (by Image
    name or OriginalFileName) AND the command line contains the ' -r' inline-code flag. Review the exact command line and
    binary identity against both criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run php.exe with inline code from the command line?
  context: >-
    Developer workstations and build or CI hosts often run php inline, while a server or end-user desktop with no PHP
    development role rarely does. Knowing whether the user role and host function fit command-line PHP use is often the
    fastest way to separate routine activity from a planted one-liner.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What inline PHP code did the ' -r' invocation actually run?
  context: >-
    The full command line carries the inline payload. Decode it to identify what the code does, looking specifically for
    socket calls (fsockopen, stream_socket_client), process execution (exec, system, shell_exec, proc_open, popen),
    embedded IPs or ports, and any ini overrides set with -d. A one-liner that opens a socket and execs a shell is a
    reverse shell; one that only echoes or computes a value is likely benign.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned php.exe and is that parent chain expected?
  context: >-
    The parent process reveals how php was invoked. A developer shell or build agent (explorer.exe, a terminal,
    services.exe driving a CI runner) is a routine parent; mshta.exe, wscript.exe, an Office application, or a web server
    worker spawning php as a child points to macro-driven or web-exploitation delivery rather than interactive
    development.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run php.exe?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts for php.exe here indicate first-time or rare execution, which raises the priority of decoding the
    inline payload.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run php.exe with the ' -r' flag, what parents and users normally drive it, and does the current alert fit that pattern?
  context: >-
    Even routine tooling can be abused. This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here, not
    generic php usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \php.exe
      - OriginalFileName: php.exe
      selection_cli:
        CommandLine|contains: ' -r'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did php.exe spawn afterward?
  context: >-
    The processes spawned by the inline code reveal its actual impact. An inline reverse shell or command runner typically
    spawns cmd.exe, powershell.exe, or other LOLBins for post-exploitation, whereas a benign one-liner usually spawns
    nothing. Unexpected children shift the disposition toward execution-as-foothold.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: >-
    Inline PHP execution rarely stands alone in an intrusion. Activity in the minutes surrounding the alert may reveal
    reconnaissance, credential access, privilege escalation, or staging that frames whether this was a development task or
    a stage in a hands-on-keyboard operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts run php.exe with the ' -r' flag in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the rule's firing
    pattern rather than generic php usage. Many hosts firing the same pattern points to scripted deployment or a build
    pipeline; a single host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \php.exe
      - OriginalFileName: php.exe
      selection_cli:
        CommandLine|contains: ' -r'
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \php.exe
      - OriginalFileName: php.exe
      selection_cli:
        CommandLine|contains: ' -r'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \php.exe
      - OriginalFileName: php.exe
      selection_cli:
        CommandLine|contains: ' -r'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the
    same user triggered similar inline-execution activity on several hosts, the scope of the operation may be larger than
    one workstation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \php.exe
      - OriginalFileName: php.exe
      selection_cli:
        CommandLine|contains: ' -r'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert shows what led to this event and what followed,
    and whether it is part of a larger sequence. Novel parent-child pairs at low counts stand out against the high-count
    rows of routine agent and OS telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the
    stages that preceded this inline execution and help reconstruct the timeline. Execution often sits in the middle of a
    sequence rather than at its start.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
