name: PUA - NirCmd Execution As LOCAL SYSTEM
id: de63ed39-5de8-4fbd-b801-565160acce81
description: |
  Detects command lines containing the NirCmd ' runassystem ' verb, which spawns an arbitrary
  program under the NT AUTHORITY\SYSTEM (LocalSystem) account. Running as SYSTEM grants ownership
  of SYSTEM-protected files and registry keys and is a legitimate administrative or troubleshooting
  action, but it is also a common post-exploitation primitive used to bypass ACLs, spawn a SYSTEM
  shell, control services, or stage further actions. Investigation should confirm what program was
  elevated, who and what launched it, and whether the activity fits established administrative use.
type: detection
detection_id: d9047477-0359-48c9-b8c7-792cedcdc9c4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain the NirCmd 'runassystem' elevation verb that this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line against the rule's single criterion. The rule fires when a command line contains the
    literal ' runassystem ' token, the NirCmd verb that launches a target program under the LocalSystem
    account. Confirm the token is present as an elevation directive and note which program path follows it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to elevate programs to the SYSTEM account?
  context: >-
    Legitimate administrative activity can trigger this detection. Knowing whether the user role and
    host function are consistent with deliberate SYSTEM-context elevation is often the fastest path to
    distinguishing routine administration from operator activity. A workstation belonging to a
    non-administrative user elevating to SYSTEM is a sharper signal than an IT engineer's admin host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is NirCmd on the organization's approved software list for this host?
  context: >-
    NirCmd is a free, single-executable utility with hundreds of subcommands covering registry edits,
    service control, process termination, screenshot capture, and SYSTEM elevation. Organizations
    typically restrict such multi-purpose utilities to specific administrative hosts. Presence on a
    host where it is not sanctioned may represent shadow IT or operator-deployed tooling, regardless
    of the tool's general reputation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a change ticket, maintenance window, or support session explaining this SYSTEM elevation?
  context: >-
    Legitimate use of a SYSTEM-elevation utility usually correlates with a documented troubleshooting
    task, a scheduled maintenance window, or an explicit administrative request. If no such context
    exists for this execution, the elevation may have been performed by an operator who already holds
    local administrator rights and is escalating to SYSTEM to bypass ACLs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    Tampering typically precedes hands-on-keyboard execution. The query surfaces direct attempts to
    disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW.
    Zero rows is a useful indication that protection looks healthy; kernel-level driver tampering and
    in-memory patches will not appear here. Populated rows shift the disposition toward operator
    preparation, since a SYSTEM-context shell makes disabling protection trivial; review the parent
    process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What program was launched as SYSTEM, and what other NirCmd subcommands ran on this host in the same window?
  context: >-
    The runassystem verb takes a target program path and optional arguments; decode the full command
    line to identify exactly what was elevated to SYSTEM. NirCmd is multi-purpose, so the same operator
    may have chained registry edits, service control, process termination, screenshot capture, or
    file-time tampering in adjacent invocations. Scoping to the firing pattern on this host within
    a few minutes surfaces the broader operation rather than the single triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: ' runassystem '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1569.002.registry_set
  question: Were service registry keys created or modified on this host around the time of the alert?
  context: >-
    SYSTEM elevation is frequently a step toward installing or modifying a Windows service for
    execution or persistence. Service abuse leaves changes under the service control manager registry
    keys, often followed quickly by execution. Correlate any service-key writes in this window with
    the elevation to determine whether the SYSTEM context was used to register a new or altered service.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\System\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- source: attack:T1569.002.security
  question: Was a new Windows service installed on this host around the time of the alert?
  context: >-
    Abnormal service installation is a primary signal of service-based execution. A service-installed
    record naming a non-standard binary, an unusual path, or a temporary service created shortly after
    a SYSTEM elevation points to the elevation being used to register a service for execution. If
    service-installation auditing is not collected in this environment, treat zero results as a
    visibility gap rather than evidence nothing happened.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - ServiceType
- source: template:cue_process_tool.process_chain
  question: What process spawned the NirCmd elevation, and is that parent chain expected?
  context: >-
    The parent process reveals how the elevation was invoked. Interactive administration usually has a
    predictable parent such as explorer.exe or a console shell. Unusual parents such as a browser,
    mshta.exe, wscript.exe, an Office application, or a remote-execution service suggest the SYSTEM
    elevation was driven by an exploitation or delivery chain rather than a deliberate operator action.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host run the SYSTEM-elevation pattern before, and how often?
  context: >-
    A firing pattern that has never been seen on a host is more suspicious than one that recurs as part
    of routine administration. Aggregating prior matches of the elevation token over a long window shows
    whether SYSTEM elevation is established practice on this host or a first-time event. Grouping by user
    indicates whether the same account historically performs it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: ' runassystem '
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: >-
    Even routine administration can produce this pattern. This view mirrors the rule's selection scoped
    to this host, so the resulting parent and user distribution reflects how the SYSTEM-elevation pattern
    has actually run here rather than generic tool usage. A new parent process, an unexpected user
    account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' runassystem '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This view mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    SYSTEM-elevation pattern rather than generic tool usage. Many hosts firing the same pattern points
    to scripted deployment or vendor automation; a single host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate how broadly to scope the investigation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' runassystem '
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' runassystem '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' runassystem '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on several hosts, the scope of the operation
    may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' runassystem '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host such as defense tampering,
    reconnaissance, or credential access may reveal the attack stages that preceded the elevation and
    help reconstruct the full timeline. SYSTEM elevation often follows initial access and precedes
    impact actions.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
