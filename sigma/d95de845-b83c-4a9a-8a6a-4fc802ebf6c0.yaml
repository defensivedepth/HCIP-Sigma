name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
id: de43bb22-4a47-4d26-b668-1e7026ce48cd
description: |
  Detects net.exe or net1.exe enumerating privileged groups or account policy. The rule fires when the image is net.exe/net1.exe
  AND EITHER the command line names a privileged group (a "group"/"localgroup" query for domain admins, enterprise admins, the
  local Administrators group in several locales, Exchange Trusted Subsystem, Remote Desktop Users, or a "/do" domain query) without
  a "/add" modification, OR the command line enumerates account policy ("net accounts /do"). Group and account-policy enumeration
  is routine for administrators and inventory tools, but the same commands are a common post-compromise discovery step used to map
  privileged accounts before lateral movement. Determine which branch fired, confirm the exact command and the user and host
  behind it, and check whether the enumeration sits inside a burst of other reconnaissance.
type: detection
detection_id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Did net.exe enumerate a privileged group, or enumerate account policy, without a /add modification?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires on net.exe or net1.exe in
    one of two ways - either a "group" or "localgroup" query naming a privileged group (domain admins, enterprise admins, the
    local Administrators group, Exchange Trusted Subsystem, Remote Desktop Users, or a "/do" domain query) with no "/add", or a
    "net accounts /do" policy query. Read the full command line and note which branch fired, because the branch determines the rest
    of the investigation - a group query reveals which privileged group was of interest, while an account-policy query reveals
    password and lockout policy reconnaissance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user and host expected to run privileged-group or account-policy enumeration?
  context: Network administrators, help desk staff, and inventory tooling legitimately query group membership and account policy.
    Standard users and service accounts rarely need to enumerate domain admins or account policy. Determine whether the user's
    role and the host's function are consistent with this enumeration, and whether the host is a domain controller or admin
    workstation where such queries are expected versus an ordinary endpoint where they are not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What was the full sequence of net.exe commands on this host around the alert, and what did each enumerate?
  context: net.exe frequently runs as several sequential invocations that together form one logical enumeration step (group
    membership, then account policy, then trust or share listings). Scoping to all net.exe and net1.exe executions on this host
    within a few minutes reveals the complete operation rather than the single triggering command. Read each command line to
    identify exactly which groups, accounts, or policy settings were queried and whether the sequence reads like targeted
    privileged-account mapping or routine administration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned the net.exe enumeration, and is that parent expected?
  context: Legitimate group and account queries are typically run from cmd.exe spawned by explorer.exe (an interactive operator)
    or from an administration script. Enumeration spawned by unusual parents - Office applications, script interpreters such as
    wscript.exe, cscript.exe, or mshta.exe, a PowerShell download cradle, wmiprvse.exe (WMI remote execution), or wsmprovhost.exe
    (WinRM) - points to automated post-exploitation rather than hands-on administration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single group or account query may be legitimate troubleshooting, but multiple reconnaissance commands in rapid
    succession - nltest, whoami, ipconfig, dsquery, net user - is a signature of post-compromise enumeration. Three or more
    distinct recon binaries within fifteen minutes typically indicates automated mapping of the environment before the next
    attack stage. For domain enumeration, also look for PowerShell AD cmdlets (Get-ADUser, Get-ADGroupMember) in surrounding
    command lines.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's enumeration pattern, what parents and users drove it, and does the current
    alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern - privileged-group or account-policy
    enumeration via net.exe - has historically run here, not generic net.exe usage. A new parent process, an unexpected user
    account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_group_root:
        CommandLine|contains:
        - ' group '
        - ' localgroup '
      selection_group_flags:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
        - ' /do'
      filter_group_add:
        CommandLine|contains: ' /add'
      selection_accounts_root:
        CommandLine|contains: ' accounts '
      selection_accounts_flags:
        CommandLine|contains: ' /do'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and ((all of selection_group_* and not filter_group_add) or all of selection_accounts_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_group_root:
        CommandLine|contains:
        - ' group '
        - ' localgroup '
      selection_group_flags:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
        - ' /do'
      filter_group_add:
        CommandLine|contains: ' /add'
      selection_accounts_root:
        CommandLine|contains: ' accounts '
      selection_accounts_flags:
        CommandLine|contains: ' /do'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img and ((all of selection_group_* and not filter_group_add) or all of selection_accounts_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_group_root:
        CommandLine|contains:
        - ' group '
        - ' localgroup '
      selection_group_flags:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
        - ' /do'
      filter_group_add:
        CommandLine|contains: ' /add'
      selection_accounts_root:
        CommandLine|contains: ' accounts '
      selection_accounts_flags:
        CommandLine|contains: ' /do'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_img and ((all of selection_group_* and not filter_group_add) or all of selection_accounts_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user ran enumeration or other tooling on several hosts in this window, the scope of the activity may be larger than
    a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_group_root:
        CommandLine|contains:
        - ' group '
        - ' localgroup '
      selection_group_flags:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
        - ' /do'
      filter_group_add:
        CommandLine|contains: ' /add'
      selection_accounts_root:
        CommandLine|contains: ' accounts '
      selection_accounts_flags:
        CommandLine|contains: ' /do'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_img and ((all of selection_group_* and not filter_group_add) or all of selection_accounts_*)) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the surrounding activity reveals the immediate context: what led to this
    enumeration, what followed, and whether it is part of a larger sequence. Look for credential access, privilege escalation,
    or lateral-movement preparation appearing as novel parent-child pairs at low counts against the high-count background of
    routine processes.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, initial access, execution, or credential access - may reveal
    the attack stages that preceded this enumeration and help reconstruct the timeline. Privileged-account discovery commonly
    follows initial access and precedes lateral movement, so prior alerts here help place the enumeration within an attack
    sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other discovery or proxy-execution binaries used on this host recently?
  context: Operators who run one native discovery tool often run several, and pair enumeration with proxy-execution LOLBins for
    the next stage. Finding nltest, dsquery, PowerShell AD tooling, or proxy-execution binaries such as rundll32, regsvr32, or
    mshta active on the same host alongside this net.exe enumeration strengthens the case that this is post-compromise activity
    rather than isolated administration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\setspn.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\wmic.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\cmstp.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was net.exe executed from its expected System32 or SysWOW64 path?
  context: net.exe and net1.exe normally run from C:\Windows\System32 or C:\Windows\SysWOW64. A copy executing from a user-writable
    location such as a temp directory, a profile folder, or AppData may indicate the binary was relocated or renamed to evade
    path-based allowlists. Compare the Image path against the expected system directories and confirm the OriginalFileName still
    reads net.exe or net1.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired this rule's net.exe enumeration pattern over the past 90 days, and what command-line
    patterns are typical?
  context: An enumeration pattern with no prior history on a host is more notable than one that runs regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing
    pattern rather than generic net.exe usage. The command-line projection lets the analyst compare the typical invocation patterns
    on this host against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_group_root:
        CommandLine|contains:
        - ' group '
        - ' localgroup '
      selection_group_flags:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
        - ' /do'
      filter_group_add:
        CommandLine|contains: ' /add'
      selection_accounts_root:
        CommandLine|contains: ' accounts '
      selection_accounts_flags:
        CommandLine|contains: ' /do'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and ((all of selection_group_* and not filter_group_add) or all of selection_accounts_*)) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's enumeration pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    enumeration pattern - privileged-group or account-policy queries via net.exe - rather than generic net.exe usage. Many hosts
    firing the same pattern points to scripted inventory or vendor automation; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_group_root:
        CommandLine|contains:
        - ' group '
        - ' localgroup '
      selection_group_flags:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
        - ' /do'
      filter_group_add:
        CommandLine|contains: ' /add'
      selection_accounts_root:
        CommandLine|contains: ' accounts '
      selection_accounts_flags:
        CommandLine|contains: ' /do'
      condition: selection_img and ((all of selection_group_* and not filter_group_add) or all of selection_accounts_*)
    fields:
    - host.name
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1087.002
      name: Domain Account
      role: primary
    - id: T1087.001
      name: Local Account
      role: secondary
    - id: T1087
      name: Account Discovery
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: enumeration_command_execution
      description: net.exe/net1.exe runs a privileged-group or account-policy enumeration command
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: command_decode
      description: Decode which groups, accounts, or policy settings were queried across the full net.exe sequence
      mapped_to: Q3
      source: template:cue_process_tool.mechanism_decode
    - stage: 3
      label: enumeration_burst
      description: Enumeration sits within a burst of other reconnaissance commands on the host
      mapped_to: Q5
      source: template:discovery_recon.discovery_burst_detection
  dimension_coverage:
    - dimension: command_analysis
      technique: T1087.002
      covered_by: Q3
      source: template:cue_process_tool.mechanism_decode
      coverage_type: direct
    - dimension: time_correlation
      technique: T1087.002
      covered_by: Q5
      source: template:discovery_recon.discovery_burst_detection
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1087.002
      covered_by: Q2
      source: template:discovery_recon.discovery_user_context
      coverage_type: direct
    - dimension: user_context
      technique: T1087.002
      covered_by: Q2
      source: template:discovery_recon.discovery_user_context
      coverage_type: direct
    - dimension: process_identification
      technique: T1087.002
      covered_by: Q14
      source: template:lolbin.renamed_binary_check
      coverage_type: direct
    - dimension: execution_context
      technique: T1087
      covered_by: Q4
      source: template:discovery_recon.discovery_parent_chain
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1087
      covered_by: Q4
      source: template:discovery_recon.discovery_parent_chain
      coverage_type: direct
    - dimension: network_indicators
      technique: T1087
      covered_by: Q11
      source: template:cue_host_context.clustering
      coverage_type: indirect
  mutable_dispositions:
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "' group ', ' localgroup ', 'domain admins', ' administrator', 'enterprise admins', 'Exchange Trusted Subsystem', 'Remote Desktop Users', ' /do', ' accounts '"
      disposition: context
      target_question: Q1
      notes: "Concrete tokens are the rule's own selection. Q1 (verify_trigger_match) and Q3 (mechanism_decode) are entity/host-scoped and read the full CommandLine for the analyst to decode; the reflected baseline/scope queries (Q6, Q15, Q16) embed the rule's detection block verbatim so the tokens already constrain those results. No new query injection needed."
    - element: UserContext
      dimension: user_context
      specific_values: "rationale only - restrict to low-privileged or unexpected users / non-DC, non-admin systems"
      disposition: context
      target_question: Q2
      notes: "Q2 (discovery_user_context) asks whether the user and host are expected to run privileged-group/account-policy enumeration, including the DC vs. ordinary-endpoint distinction."
    - element: SourceHost
      dimension: tuning_parameter
      specific_values: "rationale only - restrict detection to non-DC or non-admin systems"
      disposition: context
      target_question: Q2
      notes: "Domain controllers and admin workstations are expected sources; Q2 context directs the analyst to weigh host function. No concrete host value to inject."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only - tune for bursts of enumeration commands in short succession"
      disposition: context
      target_question: Q5
      notes: "Q5 (discovery_burst_detection, +/-15m) surfaces multiple recon binaries in a tight window; the 3+ distinct binaries threshold is stated in context. No single numeric threshold supplied by the analytic."
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: "discovery_recon.discovery_parent_chain (Q4) is the more specific technique-set parent question for discovery commands and covers the same parent-process dimension; per within-phase dedup, technique set wins"
      kept: discovery_recon.discovery_parent_chain
    - dropped: universal.host_user_context
      reason: "discovery_recon.discovery_user_context (Q2) is the more specific version per its own notes_to_llm, which directs preferring it and dropping universal.host_user_context"
      kept: discovery_recon.discovery_user_context
    - dropped: cue_process_tool.clustering
      reason: "near-identical host.name +/-15m clustering query to cue_host_context.clustering (Q11); the host_context version adds ParentImage and is retained, and discovery_recon.discovery_burst_detection (Q5) carries the recon-filtered clustering"
      kept: cue_host_context.clustering
    - dropped: cue_process_tool.baseline
      reason: "generic net.exe usage baseline returns high-volume noise for an extremely common binary; the reflected rule-pattern baselines (cue_process_tool.baseline_deviation Q6 and lolbin.historical_lolbin_baseline Q15) count only the rule's specific firing pattern and supersede it"
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.follow_on
      reason: "children of net.exe (mainly net1.exe) are not an investigation driver for account/group discovery; the surrounding-activity dimension is covered by cue_host_context.clustering (Q11) and discovery_burst_detection (Q5)"
      kept: cue_host_context.clustering
    - dropped: none
      reason: "user_actor pair - non-deduplicable: cue_user_actor.baseline (Q7) + cue_user_actor.baseline_svc (Q8) and cue_user_actor.clustering (Q9) + cue_user_actor.clustering_svc (Q10) both emitted; user-pivot and service-principal substitute pivot on different identity dimensions"
      kept: cue_user_actor.baseline, cue_user_actor.baseline_svc, cue_user_actor.clustering, cue_user_actor.clustering_svc
  skipped_templates:
    - template: universal.endpoint_protection_health
      reason: "Rule is discovery/reconnaissance, not execution or credential access; per the template's notes it is safe to drop when cue_host_context.precursor is present (Q12) and the rule is not execution/credential-centric. Prior-tamper-as-precursor signal is carried by the precursor question."
  reflection_overrides: []
  hint_dispositions: []
  contextual_sets:
    included: []
    excluded:
