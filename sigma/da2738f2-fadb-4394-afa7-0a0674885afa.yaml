  skipped_templates:
    - template: universal.endpoint_protection_health
      reason: "RECOMMENDED, not must_include. This rule fires on a UAC bypass child spawn, not on payload execution or credential access; the disposition turns on the parent-child elevation path, not on whether AV/EDR was weakened first. Prior host activity and prior escalation alerts are already surfaced by cue_host_context.clustering and uac_bypass.other_escalation_attempts. Dropped to keep the non-deduplicable cue_user_actor pairs within the 14-18 budget."
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1548.002) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The sdclt bypass obtains elevation through a registry shell-handler hijack — a payload
        command written to HKCU handlers (Folder\shell\open\command, isolatedCommand/exefile)
        that auto-elevated sdclt.exe reads and executes. It is not a DLL search-order hijack, so
        there is no planted module loaded into the elevated binary for an image_load query to
        surface. The planting mechanism is covered directly by the registry_set question
        (attack:T1548.002.registry_set) and the process_creation registry-artifact question
        (uac_bypass.bypass_technique_registry_artifacts). An image_load sweep of the child would
        add volume without discriminating this rule's mechanism.
    - hint: "logsource 'process_access' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        process_access (Sysmon EID10) surfaces cross-process handle opens used for token theft.
        The sdclt technique does not steal a token from an already-elevated process; it
        auto-elevates a signed binary via a registry handler that runs the operator's payload.
        There is no inter-process handle open characteristic of this rule's mechanism, so a
        process_access query would add noise without discriminating the bypass. The elevation
        path is covered by the registry-set and registry-artifact questions and by
        verify_trigger_match.
    - hint: "logsource 'security' (recommended by techniques: T1548.002) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        The 'security' analytic keys on EID 4672 (special privileges assigned to a new logon),
        which marks the elevation event itself. That elevation IS what the rule's child spawn
        represents — the process sdclt.exe spawns runs at high integrity and corresponds to the
        same token assignment. elevated_action_after_bypass (Q5) already filters on High/System
        IntegrityLevel and projects it, so a separate 4672 query would re-surface the same
        elevation without adding investigative discrimination.
