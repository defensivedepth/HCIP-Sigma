name: Windows Recovery Environment Disabled Via Reagentc
id: 9d436316-d492-407c-9afa-65ab3b0d673e
description: |
  Detects reagentc.exe (the Windows Recovery Environment administration tool) being invoked with the /disable flag, which turns off the active WinRE boot image so users can no longer reach System Restore, Reset This PC, or Startup Repair from the recovery partition. The rule fires when the process is reagentc.exe (by Image name or OriginalFileName) AND the command line contains /disable. Disabling WinRE is a recognized pre-encryption anti-recovery step and is frequently chained with shadow-copy deletion and boot-configuration changes; on a workstation there are very few legitimate reasons to run reagentc /disable, so confirm whether the activity is operator preparation or a planned imaging/servicing task.
type: detection
detection_id: db1c21e4-cd66-4b4e-85ca-590f0780529c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Is the alerting process reagentc.exe running with the /disable flag?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the process is reagentc.exe by Image name or OriginalFileName and the command line contains /disable. Review the exact command line and process identity in the triggering event to confirm both conditions held.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to disable the Windows Recovery Environment?
  context: Legitimate reagentc /disable is rare on a workstation and is normally tied to imaging, servicing, or a documented recovery-partition change. Knowing whether the user role and host function fit such a task is often the fastest way to separate a planned administrative action from operator preparation for impact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did reagentc do? Decode the full command line and the WinRE subcommand it ran.
  context: The full command line confirms which WinRE operation ran. Beyond /disable, watch for adjacent reagentc invocations such as /setreimage, /boottore, or /setbootshelllink, which point the recovery image elsewhere or stage a custom boot-menu entry rather than simply turning recovery off. Scoping to this binary on this host within a few minutes catches sequential reagentc calls that together form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned reagentc, and is that parent chain expected?
  context: The parent process reveals how reagentc was invoked. Routine administrative or servicing use tends to descend from an interactive shell or a known management agent. A parent such as a script host, an Office application, or an unfamiliar Electron-packaged binary suggests the recovery-disable was driven by a payload rather than an operator.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously ran reagentc /disable, what parents and users drove it, and does the current alert fit that pattern?
  context: Even built-in tools can be abused. This query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how the recovery-disable pattern specifically has run here rather than generic reagentc usage. A new parent process, an unexpected account, or a first-ever appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reagentc.exe
      - OriginalFileName: reagentc.exe
      selection_cli:
        CommandLine|contains|windash: /disable
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts run reagentc /disable in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the recovery-disable pattern rather than generic reagentc usage. Many hosts firing the same pattern points to scripted deployment or imaging automation; a single host or a small unrelated set points to manual operator activity worth treating as impact preparation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reagentc.exe
      - OriginalFileName: reagentc.exe
      selection_cli:
        CommandLine|contains|windash: /disable
      condition: all of selection_*
    fields:
    - host.name
- source: template:ransomware_impact.recovery_options_assessment
  question: What recovery-inhibiting commands ran on this host around the alert?
  context: Operators preparing for impact chain multiple recovery-inhibiting commands; deleting shadow copies via vssadmin or wmic, disabling boot recovery via bcdedit, deleting backups via wbadmin, and disabling WinRE via reagentc. This query surfaces the full set of recovery-inhibiting commands on the host. The analyst should then verify whether each action succeeded by checking system state with vssadmin list shadows, bcdedit /enum, and reagentc /info.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- source: template:ransomware_impact.destruction_scope_on_host
  question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: Impact operators typically chain destructive actions together; deleting shadow copies AND disabling recovery AND stopping security services AND clearing event logs. Finding the complete set of destructive commands within a tight window reveals whether the recovery-disable was an isolated administrative action or one step in a coordinated destruction sequence.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- source: attack:T1490.command_analysis
  question: Did a recovery-disabling registry change land on this host alongside the reagentc activity?
  context: Disabling in-place recovery leaves registry artifacts in addition to process activity; bcdedit recoveryenabled and bootstatuspolicy changes, and the RecoveryDisabled flag set by reagentc, are written to the boot-configuration store. Correlating a registry recovery-disable with the reagentc process event confirms the action took effect rather than failing silently, and catches variants that flip the flag without a visible reagentc /disable command line.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - 'RecoveryDisabled'
          - 'BootStatusPolicy'
          - 'recoveryenabled'
          - 'WinRE'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- source: template:ransomware_impact.network_wide_impact
  question: Is this same recovery-disable activity firing on other hosts in the environment?
  context: Recovery destruction is often executed across many hosts in rapid succession ahead of encryption. Finding the same alert firing on multiple hosts indicates network-wide execution and sets the scope for containment and incident response rather than treating the event as a single-host issue.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- source: template:ransomware_impact.encryption_or_ransom_indicators
  question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the recovery-disable?
  context: Recovery-inhibiting actions typically precede file encryption by minutes. Checking for processes that start after the recovery-disable, especially unfamiliar binaries running from temporary or user-writable paths, determines whether an encryption stage has begun. The analyst should also check for ransom-note files via file events or the endpoint console.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reagentc.exe
      - OriginalFileName: reagentc.exe
      selection_cli:
        CommandLine|contains|windash: /disable
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reagentc.exe
      - OriginalFileName: reagentc.exe
      selection_cli:
        CommandLine|contains|windash: /disable
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action across multiple endpoints. If the same user triggered similar recovery-disable or destructive activity on multiple hosts, the scope of compromise may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reagentc.exe
      - OriginalFileName: reagentc.exe
      selection_cli:
        CommandLine|contains|windash: /disable
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded the recovery-disable and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
