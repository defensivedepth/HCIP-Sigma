name: Dynamic .NET Compilation Via Csc.EXE
id: 10e48ec3-1330-4581-a382-a3c3608d753a
description: |
  Detects csc.exe (the .NET Framework C# compiler) compiling source on the endpoint when the command line references a user-writable or temp location -- Perflogs, Users\Public, AppData\Local\Temp, Temporary Internet, Windows\Temp, a Users path under Favorites/Favourites/Contacts/Pictures, or a ProgramData/AppData path. The rule fires when csc.exe runs AND at least ONE of those location patterns matches AND the parent is not a known-good signer (Program Files, sdiagnhost, w3wp, Chocolatey, Defender ATP, or Ansible). Compile-after-delivery lets an operator ship C# source rather than a pre-built binary, evading on-disk EXE detection; legitimate triggers include developer builds, installers, and on-host code generation. Investigation should decode the full csc invocation and the referenced source/output paths, establish whether the parent and user routinely build code, and determine whether the freshly compiled binary then executed or made network connections.
type: detection
detection_id: dcaa3f04-70c3-427a-80b4-b870d73c94c4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the csc.exe command line match this rule -- does it reference a suspicious location?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires on csc.exe whose command line references
    EITHER a temp/public location (Perflogs, Users\Public, AppData\Local\Temp, Temporary Internet, Windows\Temp) OR a
    Users path under Favorites/Favourites/Contacts/Pictures OR a ProgramData/AppData path -- any one branch is enough.
    Note which branch fired: a temp-or-public path is the most common malicious shape, while a Pictures/Contacts path is
    rarer and worth closer review. The parent must also not be a known-good signer for the rule to fire.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to compile .NET code on the fly?
  context: >-
    Developer workstations, build agents, and some installers invoke csc.exe routinely; a finance or general-purpose
    endpoint compiling C# from a temp directory is far less expected. Knowing whether the user role and host function
    involve code compilation is often the fastest way to separate a routine build from operator-delivered source.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this csc.exe invocation compile? Decode the full command line, source path, and output path.
  context: >-
    The full csc.exe command line names the C# source file (often a .cs or response @file) and, via /out:, the binary it
    produces. Identify the source location and the output path -- the rule fires specifically when these sit in
    user-writable zones such as Users\Public, AppData\Local\Temp, Windows\Temp, or a ProgramData/AppData path. A source
    file dropped into temp and an output binary written nearby is the compile-after-delivery shape; a build under a project
    workspace is ordinary development.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:obfuscation.encoded_payload_decode
  question: Is the compiled source or the command line encoded or obfuscated? What does it decode to, and what does the resulting code do?
  context: >-
    Compile-after-delivery is frequently paired with obfuscation -- the C# source may be base64 or hex blobs, character
    concatenation, or response files generated by an upstream script. Decode any encoded arguments and inspect the
    referenced source: download cradles, reverse shells, in-memory loaders, and credential-theft routines are common
    payloads. High-entropy or compressed source content that does not read as normal C# is a strong cue to recover the
    cleartext before judging intent; multi-layer encoding should be peeled until the payload is readable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned csc.exe, and is that parent chain expected for compilation?
  context: >-
    The parent reveals how compilation was invoked. Build tools (msbuild.exe, devenv.exe, Program Files installers) and
    the listed known-good signers are filtered out by the rule, so a firing alert means the parent was something else --
    a script host (wscript.exe, cscript.exe), an Office application, powershell.exe, or an unsigned binary in a
    user-writable path are the parents worth chasing. Walk up to the grandparent to see what launched the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.evidence_preservation
  question: Are the source file and the compiled output binary still on disk for analysis?
  context: >-
    csc.exe reads a source file and writes a compiled binary, both typically in the same user-writable directory the
    command line references (Users\Public, AppData\Local\Temp, Windows\Temp, ProgramData). If either artifact survives,
    it enables hashing, reputation lookup, sandbox submission, and content review. Scope to the paths named in the
    decoded command line rather than every file event on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.follow_on
  question: What did csc.exe spawn afterward, and was the freshly compiled binary then executed?
  context: >-
    Compilation is rarely the objective -- the payload is what runs next. Look for csc.exe spawning a child, or for a new
    process launching from the output directory shortly after the compile. The correlation window between compilation and
    subsequent execution is the load-bearing signal: a binary built in temp and run within minutes is the compile-deliver-execute
    chain, while a compile with no follow-on execution may be a benign build step.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1027.004.time_correlation
  question: Did this host make outbound network connections shortly after the compilation?
  context: >-
    A binary compiled on the fly often reaches out -- to fetch a second stage, register with command-and-control, or
    exfiltrate. Outbound connections from the host in the window after csc.exe ran, especially from a process launched
    out of the same user-writable directory, tie the compilation to network activity. Exclude known-good system
    processes and focus on connections that begin near the compile time. Absence of connections does not clear the
    alert; some payloads stage locally before any network use.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_system:
        Image|startswith:
          - 'C:\Windows\System32\'
          - 'C:\Windows\SysWOW64\'
      condition: selection and not filter_system
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's csc.exe pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even legitimate build hosts compile code, but the rule's specific pattern -- csc.exe writing to a user-writable
    location, under a non-allowlisted parent -- should have a stable parent/user shape if it is routine here. The query
    mirrors the rule's selection scoped to this host. A new parent process, an unexpected user account, or an unusual
    command-line shape against that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \csc.exe
      selection_susp_location_1:
        CommandLine|contains:
        - :\Perflogs\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \Temporary Internet
        - \Windows\Temp\
      selection_susp_location_2:
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      - CommandLine|contains|all:
        - :\Users\
        - \Pictures\
      selection_susp_location_3:
        CommandLine|re: (?:[Pp]rogram[Dd]ata|%(?:[Ll]ocal)?[Aa]pp[Dd]ata%|\\[Aa]pp[Dd]ata\\(?:[Ll]ocal(?:[Ll]ow)?|[Rr]oaming))\\[^\\]{1,256}$
      filter_main_programfiles:
        ParentImage|startswith:
        - C:\Program Files (x86)\
        - C:\Program Files\
      filter_main_sdiagnhost:
        ParentImage: C:\Windows\System32\sdiagnhost.exe
      filter_main_w3p:
        ParentImage: C:\Windows\System32\inetsrv\w3wp.exe
      filter_optional_chocolatey:
        ParentImage:
        - C:\ProgramData\chocolatey\choco.exe
        - C:\ProgramData\chocolatey\tools\shimgen.exe
      filter_optional_defender:
        ParentCommandLine|contains: \ProgramData\Microsoft\Windows Defender Advanced Threat Protection
      filter_optional_ansible:
        ParentCommandLine|contains:
        - JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw
        - cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA
        - nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_susp_location_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's csc.exe pattern over the past 90 days, and what command-line shapes are typical?
  context: >-
    A compile-from-temp pattern with no prior history on a host is more suspicious than one seen daily under a stable
    build pipeline. The query mirrors the rule's selection scoped to this host, so the count reflects the rule's specific
    firing pattern rather than all csc.exe usage. Compare the typical invocation shapes against the alerting command line:
    a one-off invocation that breaks from history is the anomaly.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \csc.exe
      selection_susp_location_1:
        CommandLine|contains:
        - :\Perflogs\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \Temporary Internet
        - \Windows\Temp\
      selection_susp_location_2:
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      - CommandLine|contains|all:
        - :\Users\
        - \Pictures\
      selection_susp_location_3:
        CommandLine|re: (?:[Pp]rogram[Dd]ata|%(?:[Ll]ocal)?[Aa]pp[Dd]ata%|\\[Aa]pp[Dd]ata\\(?:[Ll]ocal(?:[Ll]ow)?|[Rr]oaming))\\[^\\]{1,256}$
      filter_main_programfiles:
        ParentImage|startswith:
        - C:\Program Files (x86)\
        - C:\Program Files\
      filter_main_sdiagnhost:
        ParentImage: C:\Windows\System32\sdiagnhost.exe
      filter_main_w3p:
        ParentImage: C:\Windows\System32\inetsrv\w3wp.exe
      filter_optional_chocolatey:
        ParentImage:
        - C:\ProgramData\chocolatey\choco.exe
        - C:\ProgramData\chocolatey\tools\shimgen.exe
      filter_optional_defender:
        ParentCommandLine|contains: \ProgramData\Microsoft\Windows Defender Advanced Threat Protection
      filter_optional_ansible:
        ParentCommandLine|contains:
        - JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw
        - cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA
        - nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_susp_location_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was csc.exe executed from an expected path with its original filename?
  context: >-
    csc.exe normally lives under the .NET Framework directories
    (C:\Windows\Microsoft.NET\Framework\... or Framework64). A csc.exe running from a user temp directory, or a binary
    whose OriginalFileName is csc but whose on-disk name differs, suggests the compiler was copied or renamed to evade
    path-based allowlists. Compare Image against OriginalFileName to spot a renamed or relocated copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.technique_class_lateral
  question: Were any other proxy-execution or build LOLBins used on this host recently?
  context: >-
    Operators who compile on the fly often pair it with other living-off-the-land binaries to run or stage the result.
    Look for msbuild.exe (inline-task compilation), installutil.exe, regsvr32.exe, rundll32.exe, mshta.exe, or other
    proxy-execution binaries used around the same time. Several such binaries performing related actions strengthens the
    case that the compilation was part of an operator workflow rather than a stray build.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\regsvr32.exe'
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\xwizard.exe'
          - '\wmic.exe'
          - '\certutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run csc.exe or compile code?
  context: >-
    Compare the user's current action against their 90-day history across all hosts. A user who has never compiled C#
    is more suspicious than a developer who runs csc.exe regularly. User role and typical toolset should align -- a
    non-engineering account compiling from a temp directory is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-csc.exe combination historically routine on this host or across the environment, or is the parent unusual?
  context: >-
    When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account), the
    user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent spawned
    csc.exe, and is that pair historically common. A new or rare parent for csc.exe -- here or environment-wide -- is the
    deviation; a pair already accounting for thousands of prior events is build automation or OS tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals lateral movement or parallel activity on
    other endpoints. If the same user triggered similar compilation or staging activity on multiple hosts, the scope of
    the operation is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-csc.exe combination fire on other hosts in the same window -- a coordinated rollout, or isolated to this host?
  context: >-
    Under a service principal, asking what else the user did network-wide returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism -- parent process plus csc.exe -- fired on other hosts in the alert
    window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Compilation rarely happens in isolation. Earlier detections on the same host -- script execution, defense tampering,
    reconnaissance, or credential access -- may reveal the stages that delivered the source code and help reconstruct the
    full timeline leading up to the compile.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1027.004
      name: Compile After Delivery
      role: primary
    - id: T1027
      name: Obfuscated Files or Information
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: compilation_invocation
      description: "csc.exe compiles delivered C# source from a user-writable location under a non-allowlisted parent"
      mapped_to: Q3
      source: template:cue_process_tool.mechanism_decode
    - stage: 2
      label: source_output_artifacts
      description: "Delivered source file and compiled output binary written to disk in user-writable zone"
      mapped_to: Q6
      source: template:universal.evidence_preservation
    - stage: 3
      label: payload_execution
      description: "Freshly compiled binary executes (child process / new process from output dir)"
      mapped_to: Q7
      source: template:cue_process_tool.follow_on
    - stage: 4
      label: network_activity
      description: "Compiled binary performs network transfer or C2 after build"
      mapped_to: Q8
      source: attack:T1027.004.time_correlation
  dimension_coverage:
    - dimension: parent_process_analysis
      technique: T1027.004
      covered_by: Q5
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: time_correlation
      technique: T1027.004
      covered_by: Q8
      source: attack:T1027.004.time_correlation
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1027.004
      covered_by: Q3
      source: template:cue_process_tool.mechanism_decode
      coverage_type: direct
    - dimension: obfuscation_check
      technique: T1027
      covered_by: Q4
      source: template:obfuscation.encoded_payload_decode
      coverage_type: direct
    - dimension: user_context
      technique: T1027
      covered_by: Q2
      source: template:universal.host_user_context
      coverage_type: direct
  mutable_dispositions:
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (non-dev parents launching compilers)"
      disposition: context
      target_question: Q5
      notes: "process_chain context names script-host/Office/powershell/unsigned parents as the chasing targets; rule already filters known-good signers"
    - element: OutputDirectoryPath
      dimension: tuning_parameter
      specific_values: "C:\\Users\\Public\\, %TEMP%, AppData\\Local\\Temp, Windows\\Temp, ProgramData (Desktop noted)"
      disposition: context
      target_question: Q3
      notes: "values match the rule's selection_susp_location_* clauses; mechanism_decode and evidence_preservation context direct analyst to source/output paths in these zones"
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only (compile-to-execution/C2 window)"
      disposition: context
      target_question: Q8
      notes: "follow_on (+4h) and network (+4h) ranges encode the correlation window; context describes near-compile execution/connections"
    - element: PayloadEntropyThreshold
      dimension: obfuscation_check
      specific_values: "rationale only (entropy distinguishes obfuscation from legit compression)"
      disposition: context
      target_question: Q4
      notes: "encoded_payload_decode context flags high-entropy/non-C# source as cue to recover cleartext; threshold not directly queryable"
    - element: SuspiciousParentProcessList
      dimension: tuning_parameter
      specific_values: "rationale only (LOLBins/admin tools misused)"
      disposition: context
      target_question: Q5
      notes: "process_chain enumerates suspect parents; technique_class_lateral surfaces co-occurring proxy-exec/build LOLBins"
  dedup_decisions:
    - dropped: cue_process_tool.baseline
      reason: "generic host-binary baseline subsumed by the rule-pattern reflected baselines (baseline_deviation and lolbin.historical_lolbin_baseline both scope to the rule's actual firing pattern, not all csc.exe usage)"
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.clustering
      reason: "host-wide 'other tools same time' overlaps cue_host_context.precursor (prior alerts) and follow_on (post-compile activity); single host-context view retained via precursor"
      kept: cue_host_context.precursor
    - dropped: cue_host_context.clustering
      reason: "aggregated host activity around alert overlaps precursor (prior detections) and follow_on (child activity); dropped to stay within 18-question cap while keeping the more specific views"
      kept: cue_host_context.precursor
    - dropped: cue_user_actor.baseline + cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (Q13/Q14)"
      kept: both
    - dropped: cue_user_actor.clustering + cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (Q15/Q16)"
      kept: both
  skipped_templates:
    - template: universal.endpoint_protection_health
      reason: "RECOMMENDED generic tamper sweep. Dropped per its own drop-condition (b): cue_host_context.precursor is present and surfaces prior tamper detections, and this rule fires on defense-evasion (compile-time obfuscation), not a hands-on-keyboard execution/credential-access action whose disposition turns on whether AV/EDR was disabled first. defense_tampering technique set is not confirmed for this rule."
  reflection_overrides: []
  hint_dispositions: []
