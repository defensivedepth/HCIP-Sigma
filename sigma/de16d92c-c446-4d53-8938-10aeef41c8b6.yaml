name: Computer Password Change Via Ksetup.EXE
id: b1d2a05d-aef3-4189-bfba-c1338762f032
description: |
  Detects use of the Microsoft-signed ksetup.exe with the /setcomputerpassword subcommand, which sets the local
  computer-account (host principal) password offline. The rule fires only when both the binary (Image ending in
  ksetup.exe or OriginalFileName ksetup.exe) AND the command line containing /setcomputerpassword match. Legitimate
  use is rare; the more common pattern is an operator setting the machine-account password to a known value to enable
  machine-account ticket requests or to disrupt the Active Directory secure-channel trust. Determine whether the change
  was driven by a known administrator or automation, what spawned ksetup.exe, and whether other credential-access or
  defense-tampering activity surrounds it.
type: detection
detection_id: de16d92c-c446-4d53-8938-10aeef41c8b6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show ksetup.exe run with the /setcomputerpassword subcommand?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the
    image is ksetup.exe (by name or OriginalFileName) AND the command line contains /setcomputerpassword. Read the
    exact command line and process details from the triggering event to confirm both conditions are present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to change the computer-account password via ksetup.exe?
  context: Setting the machine-account password is an unusual administrative action; legitimate domain join, rejoin,
    or secure-channel repair workflows rarely call ksetup /setcomputerpassword directly. Knowing whether the user role
    and host function fit this operation is often the fastest path to separating a sanctioned maintenance action from
    operator abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Resetting a machine-account password is a hands-on-keyboard action an operator may precede by weakening
    endpoint protection. This query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad
    exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal; kernel-level
    driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator
    preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What full ksetup.exe command line ran, and what password value or additional subcommands did it carry?
  context: The full command line reveals the operational intent. Read the argument following /setcomputerpassword to
    see whether a specific password value was set, and check for chained subcommands (for example /setrealm, /addkdc,
    or /addenctypeattr) in the same or adjacent invocations that would point to broader Kerberos realm or
    encryption-type manipulation rather than a one-off password reset.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned ksetup.exe, and is that parent chain expected?
  context: The parent process reveals how ksetup.exe was invoked. An interactive administrative shell (cmd.exe or
    powershell.exe launched by explorer.exe) fits manual maintenance, while script hosts (wscript.exe, mshta.exe),
    Office applications, or remote-execution services as the parent point toward scripted or remote abuse. Walk up the
    tree from the immediate parent to see what launched it.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did ksetup.exe spawn afterward?
  context: A machine-account password reset is usually self-contained, so child processes are notable. Subsequent
    cmd.exe, powershell.exe, or certutil.exe spawned by ksetup.exe would indicate the password change was one step in
    a larger sequence rather than an isolated configuration action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run ksetup.exe?
  context: Compare this user's current action against their historical behavior. A user account that has never run
    ksetup.exe is more suspicious than a directory or domain administrator who manages Kerberos configuration as part
    of their role. Confirm the user's role aligns with machine-account or realm administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-ksetup.exe launch mechanism historically routine on this host or across the
    environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful
    pivot is the launch mechanism. A new or rare parent process for ksetup.exe on this host or environment-wide is the
    deviation worth chasing, while a parent that already accounts for many prior events is configuration management or
    OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action across
    multiple endpoints. If the same user touched machine-account or Kerberos settings on several hosts in this window,
    the scope of the activity is broader than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-ksetup.exe combination fire on other hosts in the same window, indicating an
    automation rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise.
    The meaningful question is whether the same launch mechanism (parent process plus spawned binary) fired on other
    hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.baseline
  question: Does this host normally run ksetup.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very
    low historical counts for ksetup.exe on this host indicate first-time or rare execution, which raises the priority
    of confirming who drove the change.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the ksetup /setcomputerpassword pattern, what parents and users
    normally drive it, and does the current alert fit that pattern?
  context: Even a Microsoft-signed binary can be abused. This query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically
    run here. A new parent process, an unexpected user account, or an unusual command-line shape is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ksetup.exe
      - OriginalFileName: ksetup.exe
      selection_cli:
        CommandLine|contains: ' /setcomputerpassword '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the ksetup /setcomputerpassword pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    the firing pattern rather than generic ksetup.exe usage. Many hosts firing the same pattern points to scripted
    deployment or maintenance automation; one host or a small unrelated set points to manual operator activity. Use
    the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ksetup.exe
      - OriginalFileName: ksetup.exe
      selection_cli:
        CommandLine|contains: ' /setcomputerpassword '
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the password
    change and what followed it. Aggregating by image and parent collapses repetitive agent telemetry into high-count
    rows while novel parent-child pairs stand out at low counts, which is the signal to scan for reconnaissance,
    credential access, or persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host (defense tampering, reconnaissance, or credential access) may reveal the
    attack stages that preceded the machine-account password change and help reconstruct the full timeline. The alert
    sequence on a host often tells the broader story behind a single event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
