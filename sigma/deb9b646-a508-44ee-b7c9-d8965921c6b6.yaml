name: Powershell Token Obfuscation - Process Creation
id: dfc76e5d-cfd2-40ff-96b0-f7ad8779f0bd
description: |
  Detects PowerShell command lines carrying token-level obfuscation artifacts -- backtick-escaped tokens, format-operator string reordering ("{0}{1}" -f ...), and character-by-character env:path substitution -- the kind produced by tooling that mutates every syntactically legal PowerShell token to defeat signature detection. The rule fires when one of these obfuscation patterns is present on the command line and the literal ${env:path} string is not the only match. Legitimate scripts occasionally use backticks for line continuation or format strings for output, so the investigation must decode the obfuscation to recover the real command, confirm what the deobfuscated payload does, and determine whether the user, host, and parent chain are expected to run obfuscated PowerShell.
type: detection
detection_id: deb9b646-a508-44ee-b7c9-d8965921c6b6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line carry the token-obfuscation pattern this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reading the exact command line and checking it for the obfuscation artifacts the rule fires on -- backtick-escaped tokens, a format-operator string of the pattern "{0}{1}..." -f, or character-split env:path substitution. The rule excludes the plain literal ${env:path}, so verify the match is genuine obfuscation rather than a benign environment reference.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run obfuscated PowerShell?
  context: Legitimate administrative activity can trigger this detection -- some installers, packaging scripts, and management frameworks emit backtick or format-operator constructs. Knowing whether the user role and host function normally involve PowerShell automation, and whether obfuscated command lines are expected from this account, is often the fastest path to distinguishing a true positive from routine operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:powershell.encoded_command_decode
  question: What does the obfuscated command decode to once the token mutation is reversed?
  context: Token obfuscation hides intent behind backtick escaping, format-operator reordering, and variable/env substitution rather than base64, so the command line is technically readable but deliberately unreadable. Reverse the mutation -- strip backticks, resolve the "{n}" -f reordering, reassemble the split env:path string -- to recover the real cmdlets. Look for download cradles (Net.WebClient, Invoke-WebRequest, Start-BitsTransfer), in-memory loaders ([Reflection.Assembly]::Load), or Invoke-Expression of a reconstructed string, which indicate fileless execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Event ID 4104 (script block logging) records the script content PowerShell actually executes after its own deobfuscation, so it provides ground truth even when the command line is token-mutated. This is the most reliable way to recover what the obfuscated command really ran. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and fall back to manually reversing the obfuscation from the alerting command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host in the hour before this execution?
  context: Obfuscation is frequently paired with control evasion. Common precursors include AMSI bypass (patching amsi.dll in memory), execution-policy changes (-ExecutionPolicy Bypass or -ep bypass), and PowerShell downgrade to v2, which lacks modern logging. Finding these events shortly before the obfuscated command strengthens the case that the obfuscation was deliberate evasion rather than incidental syntax.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance and is that parent chain expected?
  context: The parent process reveals how the obfuscated command was invoked. Interactive use typically descends from explorer.exe or a console host; obfuscated PowerShell launched from Office applications, mshta.exe, wscript.exe, or a service binary points to macro execution, proxy launchers, or scripted delivery. Note the parent against the environment's normal launch mechanisms for PowerShell.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell instance spawn afterward?
  context: The processes spawned after the obfuscated command reveal its actual impact and how deep the resulting process lineage runs. Embedded or dropped payloads often surface as unexpected children -- cmd.exe, additional PowerShell, certutil.exe, rundll32.exe, or a freshly written binary. A short-lived chain that ends in a network tool or a newly created executable is the load-bearing signal here.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this obfuscation pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate tooling occasionally emits backtick or format-operator constructs. The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific obfuscation pattern -- not generic PowerShell usage -- has historically run here. A new parent process, an unexpected user account, or a first-ever appearance of the pattern on this host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: \w+`(?:\w+|-|.)`[\w+|\s]
      - CommandLine|re: '"(?:\{\d\})+"\s*-f'
      - CommandLine|re: (?i)\$\{`?e`?n`?v`?:`?p`?a`?t`?h`?\}
      filter_main_envpath:
        CommandLine|contains: ${env:path}
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this obfuscation pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this obfuscation pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or vendor automation that happens to use these constructs; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: \w+`(?:\w+|-|.)`[\w+|\s]
      - CommandLine|re: '"(?:\{\d\})+"\s*-f'
      - CommandLine|re: (?i)\$\{`?e`?n`?v`?:`?p`?a`?t`?h`?\}
      filter_main_envpath:
        CommandLine|contains: ${env:path}
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the obfuscated command?
  context: Obfuscated execution rarely occurs in isolation. Activity in the surrounding window may reveal reconnaissance, privilege escalation, persistence installation, or data staging that frames the obfuscated command within a larger sequence. The correlation window here is the time interval over which file-write and process-execution events are treated as related.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: \w+`(?:\w+|-|.)`[\w+|\s]
      - CommandLine|re: '"(?:\{\d\})+"\s*-f'
      - CommandLine|re: (?i)\$\{`?e`?n`?v`?:`?p`?a`?t`?h`?\}
      filter_main_envpath:
        CommandLine|contains: ${env:path}
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: \w+`(?:\w+|-|.)`[\w+|\s]
      - CommandLine|re: '"(?:\{\d\})+"\s*-f'
      - CommandLine|re: (?i)\$\{`?e`?n`?v`?:`?p`?a`?t`?h`?\}
      filter_main_envpath:
        CommandLine|contains: ${env:path}
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered activity on several hosts in this window, the scope of the event may be larger than a single host. When the alert fires under a service principal this view returns mostly agent-telemetry noise, so weigh it alongside the launch-mechanism view.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: \w+`(?:\w+|-|.)`[\w+|\s]
      - CommandLine|re: '"(?:\{\d\})+"\s*-f'
      - CommandLine|re: (?i)\$\{`?e`?n`?v`?:`?p`?a`?t`?h`?\}
      filter_main_envpath:
        CommandLine|contains: ${env:path}
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the attack stages that preceded the obfuscated execution and help reconstruct the timeline. The window here also bounds how far back a related file-write or staging event would be correlated with this execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.evidence_preservation
  question: Did the obfuscated command write or drop a file that is still on disk for analysis?
  context: Embedded-payload techniques drop a secondary binary or script that the deobfuscated command then writes or executes. If the decoded command references an output file, downloaded payload, or staged script, checking whether it still exists on disk enables hash lookups, sandbox submission, or content and PE-overlay review -- appended sections beyond a normal size can indicate an embedded payload. Scope to the file paths the command referenced rather than all file activity on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
