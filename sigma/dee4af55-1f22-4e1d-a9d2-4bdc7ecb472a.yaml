name: Disabled Volume Snapshots
id: 35e006d1-4e58-4446-84c1-9adf41aa537a
description: |
  Detects a command line that disables the Volume Shadow Copy Service diagnostic logging by writing the registry value
  under HKLM\SYSTEM\CurrentControlSet\Services\VSS\Diag and setting it to Disabled. The rule fires when the command line
  contains both '\Services\VSS\Diag' and '/d Disabled' on the same invocation. Turning off this logging blinds the
  VolSnap diagnostic artifacts that disk-snapshot forensics rely on, without a reboot; it is an anti-forensic move that
  can precede or accompany shadow-copy deletion and ransomware impact, though it also occurs during legitimate
  administration. Determine what wrote the value, whether the logging is still disabled, and what other tampering or
  follow-on activity occurred on the host.
type: detection
detection_id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — both '\Services\VSS\Diag' and '/d Disabled' present on the same invocation?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the command
    line contains both the '\Services\VSS\Diag' registry path and the '/d Disabled' value on the same process invocation.
    Confirm both substrings are present on one command line rather than inferred from separate events.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to modify the VSS diagnostic logging registry value?
  context: Legitimate changes to the VolSnap diagnostic logging key are rare and usually tied to a documented
    troubleshooting or build task, not to interactive operator activity. Knowing whether this account and host normally
    perform low-level VSS or registry maintenance is often the fastest way to separate routine administration from
    deliberate anti-forensic tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: What exactly did this command disable, and which VSS registry value was set to Disabled?
  context: Re-read the full command line of the triggering event. Setting the value under \Services\VSS\Diag to Disabled
    turns off VolSnap diagnostic logging, removing the disk-snapshot diagnostic artifacts that forensic timelines depend
    on. Note the full registry path, the value name written, and whether the same command also touched other VSS or
    recovery settings.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:registry.registry_key_context
  question: What specific registry key and value were written under \Services\VSS\Diag, and what data was set?
  context: The command line shows the intended write, but the registry event records what landed. The value under
    HKLM\SYSTEM\CurrentControlSet\Services\VSS\Diag controls VolSnap diagnostic logging; setting it to Disabled suppresses
    those artifacts. Reading the structured registry fields confirms the exact value name (TargetObject) and the data
    written (Details) rather than parsing them from the command line. If registry modification events are not collected in
    this environment, treat zero results as a visibility gap rather than evidence nothing changed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- source: template:defense_tampering.protection_status
  question: Is VSS diagnostic logging currently restored, or is it still disabled on this host?
  context: The change may be temporary — flipped for one action and reverted — or it may persist. Confirm the current data
    on the \Services\VSS\Diag value on the host. If it is still set to Disabled, VolSnap diagnostic artifacts continue to be
    suppressed and the value should be restored before deeper investigation relies on those artifacts.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this command, and is that parent chain expected?
  context: The parent reveals how the registry write was launched. Routine administration tends to run from predictable
    parents such as an interactive shell started by explorer.exe or a configuration-management agent. An unusual parent —
    a script host, an Office application, or a remote-execution tool — points toward an operator or a malicious launcher
    rather than a maintenance task.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host beyond disabling VSS diagnostic logging?
  context: Operators who suppress one source of evidence often disable several — stopping AV/EDR services, clearing event
    logs, or deleting shadow copies — to widen the gap in visibility. Multiple tampering events from the same user or
    parent process in the same window indicate a coordinated effort rather than an isolated registry change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after VSS diagnostic logging was disabled?
  context: Diagnostic logging is suppressed for a reason — to hide what follows, often shadow-copy deletion, payload
    execution, or other impact actions. Examining process activity in the window immediately after the change reveals what
    the suppression was meant to conceal. Correlate this with shadow-copy and recovery commands, network connections, and
    file writes in the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:registry.registry_related_modifications
  question: Were other registry modifications made on this host in the same session?
  context: A single VSS registry change rarely stands alone when it is part of tampering — operators frequently pair it
    with disabling security-tool keys, setting Run keys, or altering recovery and firewall settings. Clusters of registry
    writes from the same user within a short window reveal the full scope of configuration changes and whether multiple
    objectives were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this VSS-disable pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection — the command line containing '\Services\VSS\Diag' and '/d Disabled' —
    scoped to this host. The resulting parent and user distribution reflects how this specific firing pattern has
    historically run here, not generic registry activity. A new parent process, an unexpected user account, or a
    first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Services\VSS\Diag
        - /d Disabled
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally disable VSS diagnostic logging or perform similar low-level registry maintenance?
  context: Compare this user's current action against their historical behavior. A user who has never modified the VSS
    diagnostic logging key is more suspicious than an administrator who does so as part of documented troubleshooting. The
    user's role and typical toolset should align with editing low-level service registry values.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains|all:
        - \Services\VSS\Diag
        - /d Disabled
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent process driving this VSS-disable pattern historically routine on this host or across the environment, or is it unusual?
  context: When the alert fires under a service principal, user identity does not attribute the behavior; the meaningful
    pivot is the launch mechanism. A new or rare parent driving the VSS diagnostic-logging change on this host or
    environment-wide is the deviation worth chasing, whereas a parent that already accounts for many prior occurrences of
    this pattern reflects platform or vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith|expand: '%ParentImage%'
        CommandLine|contains|all:
        - \Services\VSS\Diag
        - /d Disabled
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel actions on multiple
    endpoints. If the same user disabled VSS diagnostic logging or performed related tampering on several hosts, the scope
    of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent process drive this VSS-disable pattern on other hosts in the same window, indicating a coordinated rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did network-wide returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — the parent process producing this VSS diagnostic-logging
    change — fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith|expand: '%ParentImage%'
        CommandLine|contains|all:
        - \Services\VSS\Diag
        - /d Disabled
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this VSS-disable pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific firing
    pattern rather than generic registry usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Services\VSS\Diag
        - /d Disabled
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or
    other defense tampering — may reveal the attack stages that preceded the VSS diagnostic-logging change and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: attack:T1562.001.shadow_copy_correlation
  question: Were shadow copies deleted or recovery options altered on this host around the time VSS diagnostic logging was disabled?
  context: Suppressing VolSnap diagnostic logging is frequently a precursor to destroying the snapshots themselves. Look
    for vssadmin or wmic shadow-copy deletion, wbadmin catalog deletion, or bcdedit recovery changes in the surrounding
    window. The diagnostic-logging change blinds the artifacts that would otherwise record that destruction, so these two
    actions commonly travel together.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_shadow:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'shadowstorage'
          - 'resize shadowstorage'
          - 'delete catalog'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
      condition: selection and selection_shadow
    fields:
      - Image
      - CommandLine
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around the time of the alert?
  context: Anti-forensic actions such as suppressing snapshot diagnostics are sometimes paired with establishing a
    foothold that would otherwise be flagged. Scheduled tasks, services, registry Run-key writes, BITS jobs, or WMI
    subscriptions installed in the surrounding window indicate the operator moved beyond clearing evidence toward securing
    persistence.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
