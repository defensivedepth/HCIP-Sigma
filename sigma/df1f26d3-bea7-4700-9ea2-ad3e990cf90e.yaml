  skipped_templates: []
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'file_event' (recommended by techniques: T1127) is not covered — pull in cue_artifact.* or author a custom question with `category: file_event`"
      disposition: declined
      reason: >-
        The rule's detection is purely a process_creation Image+CommandLine match on
        the Adobe-bundled node.exe; it carries no file artifact. The file-event angle
        of T1127 (a payload written to a user-writable path) is addressed from
        process_creation evidence in the follow_on question (Q6), which surfaces a
        freshly written binary executed from %TEMP%/%APPDATA%/public profile via its
        ParentImage-scoped child query, and in mechanism_decode (Q3), which identifies
        the target script path and origin. No standalone file_event question would add
        precision for triage of this script-execution pattern.
    - hint: "logsource 'image_load' (recommended by techniques: T1127,T1059.007) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        image_load coverage of T1127/T1059.007 targets unsigned/user-writable DLLs
        loaded by the developer utility. This rule fires on node.exe running a JavaScript
        file, not on native DLL side-loading, so the JavaScript payload itself (not a
        loaded module) is the operative artifact. The decode question (Q4) and
        mechanism_decode (Q3) cover the script payload via process_creation evidence;
        an image_load sweep on node.exe returns the runtime's own module set as volume
        without precision for the .js execution this rule detects.
    - hint: "logsource 'network_connection' (recommended by techniques: T1127) is not covered — pull in cue_network_endpoint.* or author a custom question with `category: network_connection`"
      disposition: declined
      reason: >-
        The rule has no network field and fires before any egress. The outbound-connection
        stage of the T1127 chain is reached through the follow_on question (Q6), which finds
        the child processes node spawned and flags one making an external connection as the
        canonical second-stage pattern; the analyst pivots to that child's ProcessGuid for
        connection detail. A standalone fleet-wide network_connection question without a
        destination from the alert would return unbounded host egress rather than a scoped
        answer for this alert.
