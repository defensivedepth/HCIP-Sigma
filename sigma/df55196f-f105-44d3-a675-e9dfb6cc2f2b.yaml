  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1482) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The rule fires purely on process_creation evidence (CommandLine recon syntax, import hash, OriginalFileName) for a standalone AdFind binary that performs LDAP queries over the network. image_load EID7 telemetry would catch in-process .NET/Win32 trust-API loading, but renamed AdFind is a self-contained C++ binary that does not host the trust enumeration in a victim process; loaded-module volume on it returns noise without precision. The observable cross-logsource pivot for this rule is the LDAP/DC network bind, covered by the directory-service connection question (Q9).
    - hint: "logsource 'process_access' (recommended by techniques: T1482) is not covered and no template family exists — author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        process_access EID10 telemetry targets handle/memory access (e.g., LSASS reads) by API-based trust enumeration. AdFind enumerates AD remotely over LDAP and does not open cross-process handles to perform trust discovery, so a process_access query scoped to this binary returns nothing relevant. The rule's detection is process_creation-constrained; the genuine cross-logsource observable is the network bind covered by Q9.
    - hint: "logsource 'security' (recommended by techniques: T1482) is not covered and no template family exists — author a custom question with `category: security`"
      disposition: declined
      reason: >-
        Security EID 4662 (directory-service object access) would record the LDAP reads server-side, but it requires SACL auditing on the queried AD objects that is rarely enabled, and it is collected on domain controllers, not on the alerting endpoint this playbook scopes to. The endpoint-observable equivalent — the outbound LDAP/global-catalog connection from the renamed binary — is covered by Q9.
