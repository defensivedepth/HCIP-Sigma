name: Windows Hotfix Updates Reconnaissance Via Wmic.EXE
id: fed002c2-90e8-40c2-955a-b4e4d778bae3
description: |
  Detects wmic.exe (or a renamed binary whose OriginalFileName is wmic.exe) invoked with a ' qfe' command-line argument, which enumerates installed hotfixes and patch level. The rule fires only when both the WMIC binary identity and the qfe argument are present. This is a benign administrative and inventory query in isolation, but it is also a standard early step in attacker and pentest enumeration kits, where patch-level data feeds kernel-exploit candidate selection. Determine whether the user, host, and parent chain explain the query as routine inventory, or whether it sits alongside other discovery, credential-access, or privilege-escalation activity.
type: detection
detection_id: dfd2fcb7-8bd5-4daa-b132-5adb61d6ad45
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process match WMIC running with a qfe argument?
  context: Confirm the alert is a true positive by checking that the binary identity resolves to WMIC (by Image path or OriginalFileName) and that the command line contains the qfe hotfix-enumeration argument. Both conditions must hold for the rule to fire.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to enumerate installed hotfixes via WMIC?
  context: Patch-inventory queries are routine for IT operations, vulnerability scanners, and software-deployment tooling. Knowing whether the user role and host function include inventory or patch-management duties is often the fastest way to separate routine operations from operator reconnaissance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this WMIC command request? Decode the full qfe query and its output fields.
  context: The full command line reveals what was enumerated. Read the qfe alias arguments and any get/list field selectors (for example Caption, Description, HotFixID, InstalledOn) to confirm this is patch-level enumeration, and check for chained aliases or additional WMI calls in the same window that broaden the discovery beyond hotfixes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned WMIC and is that parent chain expected?
  context: The parent process reveals how the query was invoked. Legitimate inventory runs typically have predictable parents (an inventory agent, a management console, an administrator shell). Parents such as cmd.exe or powershell.exe running a script, or office or browser children, suggest the query is one step in an automated enumeration sequence rather than a deliberate administrative action.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run WMIC for system enumeration?
  context: Compare this user's current action against their historical behavior. A user who has never run WMIC enumeration is more suspicious than one who runs it regularly as part of their role. User role and typical toolset should align with patch-inventory activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and WMIC combination historically routine on this host or across the environment, or is the parent unusual for WMIC?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned WMIC, and whether that pair is historically common. A new or rare parent for WMIC is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or OS automation such as inventory tooling.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar enumeration on multiple hosts, the scope of the activity may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and WMIC combination fire on other hosts in the same window, indicating a coordinated automation rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since every host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism (parent process plus spawned WMIC) fired on other hosts in the alert window. Multiple hosts in the same window point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.follow_on
  question: What child processes did WMIC spawn afterward?
  context: A qfe enumeration query should produce no meaningful children. Children such as cmd.exe, powershell.exe, or download or proxy-execution binaries spawned by WMIC indicate the tool was used beyond inventory, for example a remote-WMI process-call invocation that launches a payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Discovery queries rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether the hotfix query is one step in a broader enumeration sequence. Look for other discovery commands, credential access, or privilege-escalation attempts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the WMIC qfe pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even routine inventory tooling produces a stable parent and user distribution over time. The query mirrors the rule's selection structure scoped to this host, so the resulting distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains: ' qfe'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the WMIC qfe pattern over the past 90 days, and what command-line shapes are typical?
  context: A pattern with no prior history on a host is more suspicious than one seen regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern rather than generic WMIC usage. The command-line projection lets the analyst compare typical qfe invocation shapes against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains: ' qfe'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the WMIC qfe pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic WMIC usage. Many hosts firing the same pattern points to scripted deployment or vendor inventory automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains: ' qfe'
      condition: all of selection*
    fields:
    - host.name
- source: attack:T1047.time_correlation
  question: Did WMIC make any network connections within a few minutes of this execution?
  context: Local hotfix enumeration via qfe touches only the local CIM repository and should produce no outbound connections. A network connection from WMIC correlated to this execution indicates the remote-WMI variant of the technique, where WMIC is used to query or execute against another host. Correlating the connection to the process within a short window separates local inventory from remote command execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- source: template:lolbin.technique_class_lateral
  question: Were any other discovery or proxy-execution LOLBins used on this host recently?
  context: Operators who run one LOLBin for enumeration often run several. WMIC qfe is a patch-discovery step; finding certutil, rundll32, mshta, or other discovery and proxy-execution LOLBins active on the same host in the same timeframe strengthens the case that this is operator reconnaissance rather than isolated inventory.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was WMIC executed from its expected System32 path, or from an unexpected location?
  context: WMIC executed from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists. The OriginalFileName resolving to wmic.exe while the Image path is non-standard is a strong signal the binary was relocated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Discovery rarely happens in isolation. Earlier detections on the same host such as initial access, defense tampering, or other reconnaissance may reveal the attack stages that preceded the hotfix query and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
