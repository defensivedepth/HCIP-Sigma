name: Remote Access Tool - RURAT Execution From Unusual Location
id: 24154825-8988-44c7-bba8-5a3e9716f232
description: |
  Detects the Remote Utilities remote access tool (rutserv.exe or rfusclient.exe, or any binary
  whose Product is "Remote Utilities") executing from any path outside the standard
  "C:\Program Files\Remote Utilities" or "C:\Program Files (x86)\Remote Utilities" install
  directories. Legitimately installed Remote Utilities runs from its Program Files location;
  execution from AppData, ProgramData, Temp, or another user-writable path commonly indicates a
  copied or renamed binary deployed for unsanctioned remote access or persistence. Determine
  whether the tool is approved and tied to a current support session, where it ran from, what
  parent launched it, what it connected to, and whether the same activity appears across the fleet.
type: detection
detection_id: e01fa958-6893-41d4-ae03-182477c5e77d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Did rutserv.exe or rfusclient.exe (or a Remote Utilities-branded binary) run from a path outside the Remote Utilities Program Files folders?
  context: Confirm the alert is a true positive before investing time. Verify the Image and Product fields against the rule criteria, and that the executing path is NOT under "C:\Program Files\Remote Utilities" or "C:\Program Files (x86)\Remote Utilities". The rule fires when the Remote Utilities binary or product matches AND the path is outside those install directories.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Product
- source: template:universal.host_user_context
  question: Is this user and host expected to run a Remote Utilities remote access agent?
  context: Legitimate remote access is usually limited to IT support staff and specific managed endpoints. If neither the user role nor the host function involves remote support, an installed remote access agent is more likely shadow IT or attacker-deployed access than sanctioned use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is Remote Utilities on the organization's approved remote access software list?
  context: Organizations typically sanction a single remote access tool for IT support. Remote Utilities not appearing on that list -- even though it is legitimate commercial software -- may represent shadow IT or attacker-deployed persistence. An unauthorized remote access tool should be treated as suspect regardless of the tool's reputation, especially when it runs from outside its normal install path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a current helpdesk ticket or support session that explains this Remote Utilities activity?
  context: Legitimate remote access usually correlates with an active support ticket, a scheduled maintenance window, or a documented user request. If no support context exists for this session, the tool may have been planted by an operator for persistent access or run by a user circumventing controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint is this Remote Utilities binary connecting to?
  context: Remote access tools establish outbound connections to relay servers or operator-controlled infrastructure. The destination distinguishes the vendor's own infrastructure from a custom or suspicious endpoint. Connections to remoteutilities.com infrastructure fit normal use; connections to unrelated addresses, or traffic on the tool's signaling ports, point away from sanctioned support.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Operators frequently weaken AV/EDR before deploying a remote access agent for persistent access. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal -- kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.mechanism_decode
  question: What command line did this Remote Utilities binary run with, and what does it reveal about how it was configured?
  context: The full command line reveals how the agent was invoked -- silent install or service-install switches, a configuration or settings reference, or an embedded connection ID. Decode the path it ran from and any flags to understand whether this is an interactive install, an unattended deployment, or a service registering itself for persistent access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this Remote Utilities binary, and is that parent chain expected?
  context: The parent process reveals how the agent was launched. An installer, a service host, or explorer.exe driven by a user fits ordinary deployment. Launch from a script host, a browser or mail client, an Office application, or a one-off shell points to delivery through a download or social-engineering step rather than a managed install.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this Remote Utilities binary spawn afterward?
  context: The processes spawned by the agent reveal its actual impact. A legitimate remote access session has predictable children; an operator-controlled session often spawns cmd.exe, powershell.exe, or recon and persistence utilities for hands-on-keyboard activity once remote control is established.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run the Remote Utilities binary?
  context: A remote access agent that has never been seen on this host is more suspicious than one that runs regularly as part of managed support. Zero or very low historical counts indicate a first-time or rare execution consistent with a freshly dropped binary.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even a sanctioned tool can be abused. The query mirrors the rule's selection -- Remote Utilities binary or product, outside the Program Files install paths -- scoped to this host, so the parent/user distribution reflects how this specific out-of-location firing pattern has historically run here. A new parent process, an unexpected user account, or a one-off appearance against an otherwise empty history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \rutserv.exe
        - \rfusclient.exe
      - Product: Remote Utilities
      filter:
        Image|startswith:
        - C:\Program Files\Remote Utilities
        - C:\Program Files (x86)\Remote Utilities
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \rutserv.exe
        - \rfusclient.exe
      - Product: Remote Utilities
      filter:
        Image|startswith:
        - C:\Program Files\Remote Utilities
        - C:\Program Files (x86)\Remote Utilities
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \rutserv.exe
        - \rfusclient.exe
      - Product: Remote Utilities
      filter:
        Image|startswith:
        - C:\Program Files\Remote Utilities
        - C:\Program Files (x86)\Remote Utilities
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar remote access activity on several hosts in this window, the scope of the operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \rutserv.exe
        - \rfusclient.exe
      - Product: Remote Utilities
      filter:
        Image|startswith:
        - C:\Program Files\Remote Utilities
        - C:\Program Files (x86)\Remote Utilities
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms surrounding the remote access execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection -- Remote Utilities binary or product, outside the Program Files install paths -- with no host scope, giving a fleet-wide count of this specific firing pattern rather than generic use of the binary. Many hosts firing the same pattern points to scripted or vendor deployment; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \rutserv.exe
        - \rfusclient.exe
      - Product: Remote Utilities
      filter:
        Image|startswith:
        - C:\Program Files\Remote Utilities
        - C:\Program Files (x86)\Remote Utilities
      condition: selection and not filter
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the stages that preceded the remote access execution and help reconstruct the timeline. Deployment of a remote access agent often follows an initial foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
