    - hint: "logsource 'create_stream_hash' (recommended by techniques: T1204.002) is not covered and no template family exists — author a custom question with `category: create_stream_hash`"
      disposition: declined
      reason: >-
        The rule fires on the Office-to-WMIC proxy-execution chain in process_creation, not on file delivery. create_stream_hash
        surfaces mark-of-the-web / URL-zone stream evidence on the dropped document, which is upstream of this detection. The
        delivery document is investigated by delivery_vector (Q5) and any proxied file is preserved by evidence_preservation
        (Q8) via %file_paths%; adding a create_stream_hash sweep would not refine the proxy-execution disposition. No
        compensating attack:T1204.002.create_stream_hash question authored.
    - hint: "logsource 'wmi' (recommended by techniques: T1047) is not covered and no template family exists — author a custom question with `category: wmi`"
      disposition: declined
      reason: >-
        This rule detects command-line WMI via wmic.exe process call create (a process_creation event), not WMI provider
        operational events (5857-5861). The WMIC command and its proxied payload are decoded by mechanism_decode (Q4); the
        proxy binary's module load and egress are covered by Q9 and Q10. WMI provider-event logging targets WMI event-subscription
        and remote-method abuse, which is a different mechanism than the synchronous wmic.exe launch this rule fires on. No
        compensating attack:T1047.wmi question authored.
