name: LOLBAS Data Exfiltration by DataSvcUtil.exe
id: 942c33f1-fdc8-482c-bc6d-db5f0ebb1670
description: |
  Detects DataSvcUtil.exe, a signed Microsoft .NET Framework command-line tool, invoked with the /in, /out, and /uri transfer arguments. The rule fires when the command line contains those transfer flags AND the process is DataSvcUtil.exe (by Image path or OriginalFileName). The /uri flag makes the binary perform an HTTP/HTTPS request against an arbitrary URL and write the response to the /out path, giving operators a low-noise fetch-and-write or exfiltration primitive that does not trip common certutil or PowerShell download rules. Legitimate use is confined to developer workstations and CI pipelines generating OData client classes; the investigation should determine whether the user, host, parent process, and destination URI fit a developer context or point to abuse of a living-off-the-land binary.
type: detection
detection_id: e290b10b-1023-4452-a4a9-eb31a9013b3a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show DataSvcUtil.exe run with the /in, /out, and /uri transfer flags?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process identity. The rule fires only when the command line carries the transfer flags AND the process is DataSvcUtil.exe by Image path or OriginalFileName, so verify both halves matched and note the URI and output path the operator supplied.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run an OData client-generation tool that fetches from a remote URI?
  context: Legitimate DataSvcUtil.exe use is confined to developer workstations and CI pipelines generating .NET OData client classes. The same invocation on a server, production host, or a non-developer account is the fastest signal that the binary is being abused as a download or exfiltration primitive rather than used for development.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the full DataSvcUtil.exe command line do? Decode the /uri destination and the /out path.
  context: The command line reveals the operation. The /uri argument is the remote endpoint the binary performs an HTTP GET against; resolve where it points and whether it is an internal-trusted OData service or an externally resolvable, attacker-controllable host. The /out argument is the local file the fetched response is written to, and /in names a local metadata file. A URI pointing outside the environment with output landing in a user-writable directory is the abuse pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_artifact.mechanism_decode
  question: What is the content of the file written to the /out path? Check for encoded strings, embedded payloads, and obfuscation.
  context: DataSvcUtil.exe writes whatever the /uri endpoint returns to the /out file, so an operator controlling the endpoint can serve arbitrary content rather than OData metadata. Read the output file and check for base64 or otherwise encoded strings, embedded scripts, URLs, or known malware patterns. Legitimate output is an XML-like metadata or generated client-class file; arbitrary or encoded content points to the binary being used as a fetch primitive for a payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_artifact.artifact_verification
  question: What is the hash of the file written to the /out path, and does it have known threat-intel detections?
  context: A file hash is a unique identifier for reputation lookup. Submit the hash of the /out output to a threat-intel platform to determine whether the fetched content is known malicious, known benign, or previously unseen. This is distinct from reading the file content -- it answers whether the artifact is already catalogued rather than what is inside it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Hashes
- source: attack:T1567.network_transfer
  question: Did DataSvcUtil.exe make outbound network connections, and where did they go?
  context: DataSvcUtil.exe fetches the /uri target over HTTP/HTTPS, so the network connection is where the transfer actually happens and where the exfiltration-over-web-service behavior is confirmed. Check the outbound destinations and whether they resolve to internal OData services or to external hosts and common web-service endpoints such as Dropbox, OneDrive, or Google Drive. A high outbound-to-inbound data ratio toward an external destination is the signal that data left the host rather than metadata being pulled in; the meaningful volume threshold and aggregation window are environment-specific and should be baselined locally.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
      - Initiated
- source: template:cue_process_tool.process_chain
  question: What process spawned DataSvcUtil.exe, and is that parent chain expected for a developer tool?
  context: The parent process reveals how the binary was invoked. A developer context usually shows a shell, build agent, or Visual Studio lineage. Parents like Office applications, mshta.exe, wscript.exe, a browser, or a bare cmd.exe with no build context point to the binary being launched as a living-off-the-land primitive rather than for legitimate client-class generation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.evidence_preservation
  question: Is the file referenced by the /out argument still on disk for analysis?
  context: The /out path names a downloaded or fetched output file. Checking whether it still exists on disk enables deeper analysis -- hash lookups, sandbox submission, or content review. If the file was already moved, copied, or deleted, that itself is investigative context about post-fetch handling.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:data_staging_exfil.data_scope
  question: What files or directories did DataSvcUtil.exe touch on disk?
  context: 'The file events show what the binary actually read and wrote rather than just the command-line arguments: the /out output file, any local /in metadata file, and the directory it operated from. The working directory and target paths reveal the data source and where fetched content landed, which determines the severity of potential data loss.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:data_staging_exfil.archive_destination
  question: Where was the /out output moved or transferred after DataSvcUtil.exe wrote it?
  context: A fetch-and-write primitive often produces a local output file that is then moved to a staging location or sent onward. Checking file events and outbound network connections from the same host in the following window reveals the handling path -- whether the output was uploaded to cloud storage, copied elsewhere, or sent to an external server. Pair the file activity with the network destinations to see the full transfer path.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:data_staging_exfil.encryption_password
  question: Does the command line show the transferred content being staged, encoded, or directed over an encrypted channel?
  context: 'Operators obfuscate exfiltrated content to evade inspection. Review the command line for an https:// scheme on the /uri: target (encrypted transport that hides payload content from network inspection) versus plain http://, and for any output path or naming that suggests the fetched content is pre-encoded rather than plain metadata. Content directed over an encrypted channel or written in an encoded form is a stronger indicator of deliberate exfiltration than a plain metadata fetch.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this DataSvcUtil.exe transfer pattern, what parents and users drove it, and does the current alert fit?
  context: Even a legitimate developer tool leaves a historical pattern. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific transfer pattern has run here before -- not generic binary usage. A new parent process, an unexpected user account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
        CommandLine|contains:
        - '/in:'
        - '/out:'
        - '/uri:'
      selection_img:
      - Image|endswith: \DataSvcUtil.exe
      - OriginalFileName: DataSvcUtil.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
        CommandLine|contains:
        - '/in:'
        - '/out:'
        - '/uri:'
      selection_img:
      - Image|endswith: \DataSvcUtil.exe
      - OriginalFileName: DataSvcUtil.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
        CommandLine|contains:
        - '/in:'
        - '/out:'
        - '/uri:'
      selection_img:
      - Image|endswith: \DataSvcUtil.exe
      - OriginalFileName: DataSvcUtil.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging across multiple endpoints. If the same user triggered similar fetch or transfer activity on more than one host, the scope of the potential exfiltration may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
        CommandLine|contains:
        - '/in:'
        - '/out:'
        - '/uri:'
      selection_img:
      - Image|endswith: \DataSvcUtil.exe
      - OriginalFileName: DataSvcUtil.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the DataSvcUtil.exe execution and what happened after. Look for reconnaissance, data staging, credential access, or other tooling that places this fetch in a larger sequence.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access, or data collection -- may reveal the attack stages that preceded this fetch and help reconstruct the timeline. The sequence of alerts often tells the story of how the host reached the point of staging or exfiltration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
