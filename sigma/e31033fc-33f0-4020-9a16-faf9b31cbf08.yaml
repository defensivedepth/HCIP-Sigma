name: PUA - Netcat Suspicious Execution
id: 29f379af-ca81-4c2f-af6f-9014c9bdd093
description: |
  Fires when a process named nc.exe, ncat.exe, or netcat.exe runs, OR when any command line
  contains one of the listener / proxy / exec flags this rule watches for (' -lvp ', ' -lvnp',
  ' -l -v -p ', ' -lv -p ', ' -l --proxy-type http ', ' -vnl --exec ', ' -vnl -e ', ' --lua-exec ',
  ' --sh-exec '). At least one of those two selection groups satisfies the rule, so a match may come
  from the binary name alone or from the flag pattern alone. Netcat-family tools provide raw TCP/UDP
  connectivity, listeners, command execution, and HTTP/SOCKS proxying, which makes them useful for
  bind/reverse shells and for command-and-control over non-application-layer protocols. Legitimate use
  exists (network testing, administrative diagnostics), so the investigation should determine whether
  the binary and the flag pattern were expected for this user and host, what the listener or exec
  arguments actually set up, and what surrounded the execution.
type: detection
detection_id: e31033fc-33f0-4020-9a16-faf9b31cbf08
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Did this fire on the netcat-family binary name, on the listener/proxy/exec flag pattern, or both?
  context: >-
    The rule matches if EITHER the Image ends in nc.exe / ncat.exe / netcat.exe OR the command line
    contains one of the listener/proxy/exec flags (' -lvp ', ' -lvnp', ' -l -v -p ', ' -lv -p ',
    ' -l --proxy-type http ', ' -vnl --exec ', ' -vnl -e ', ' --lua-exec ', ' --sh-exec '). Note which
    branch fired: a name-only match means a renamed or repackaged tool may not carry the flag pattern,
    while a flag-only match means another binary is using netcat-style listener/exec syntax. Confirm the
    exact Image and CommandLine before investing further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a netcat-family networking tool?
  context: >-
    Legitimate administrative or testing activity can trigger this detection. Whether the user's role
    and the host's function are consistent with running raw TCP/UDP listeners, proxies, or command
    execution over the network is often the fastest way to separate routine diagnostics from operator
    activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:remote_access_tool.tool_authorization
  question: Is netcat on the organization's approved software list for this host?
  context: >-
    Organizations typically sanction a specific set of networking and remote-connectivity tools for IT
    support and engineering. A netcat-family tool that is not on the approved list -- even though it is
    a widely used utility -- may represent shadow IT or an operator-deployed connectivity tool, and
    should be checked regardless of the tool's reputation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there an approved use case or ticket explaining this netcat execution?
  context: >-
    Legitimate use of netcat usually correlates with a documented administrative procedure, a network
    testing task, or an engineering use case. If no support context exists for this execution, the tool
    may have been run to establish a listener, reverse shell, or tunnel rather than for sanctioned
    diagnostics.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint did this netcat process connect to or listen for?
  context: >-
    Netcat-family tools open outbound connections or bind listeners for inbound ones, and can proxy
    traffic over TCP/UDP and HTTP/SOCKS. The peer address and port reveal whether this is internal
    diagnostic traffic or a connection to an unfamiliar external endpoint. For listener invocations,
    the bound port and any subsequent inbound peer are the load-bearing details.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.mechanism_decode
  question: What did this netcat invocation actually set up? Decode the listener, proxy, and exec arguments.
  context: >-
    The full command line shows the operational intent. Decode the port and listen flags (-l, -p, -v),
    any proxy mode (--proxy-type http), and any command-execution flags (--exec, -e, --sh-exec,
    --lua-exec) that bind a shell or external program to the connection. Exec flags mean a remote peer
    can run commands on this host; proxy flags mean traffic is being relayed. This query scopes to all
    netcat-family executions on the host within the window, so a multi-step setup (a listener followed
    by a connect) appears together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this netcat execution and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. Interactive use typically descends from
    explorer.exe or a shell the user opened; launches from script hosts (wscript.exe, mshta.exe),
    Office applications, or web/service processes are more consistent with delivered tooling or
    post-exploitation than with hands-on diagnostics.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did this netcat execution spawn afterward?
  context: >-
    When netcat is run with command-execution flags, the children it spawns reveal the actual impact --
    a bound cmd.exe or powershell.exe is the hallmark of a reverse or bind shell, and subsequent
    reconnaissance or download tooling indicates hands-on activity following the connection.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: >-
    A listener or tunnel rarely stands alone. Activity surrounding the netcat execution may reveal
    reconnaissance, privilege escalation, persistence installation, or data staging that places this
    event in a broader sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \nc.exe
        - \ncat.exe
        - \netcat.exe
      selection_cmdline:
        CommandLine|contains:
        - ' -lvp '
        - ' -lvnp'
        - ' -l -v -p '
        - ' -lv -p '
        - ' -l --proxy-type http '
        - ' -vnl --exec '
        - ' -vnl -e '
        - ' --lua-exec '
        - ' --sh-exec '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \nc.exe
        - \ncat.exe
        - \netcat.exe
      selection_cmdline:
        CommandLine|contains:
        - ' -lvp '
        - ' -lvnp'
        - ' -l -v -p '
        - ' -lv -p '
        - ' -l --proxy-type http '
        - ' -vnl --exec '
        - ' -vnl -e '
        - ' --lua-exec '
        - ' --sh-exec '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the netcat execution is isolated or
    part of movement across multiple endpoints. The same user driving similar activity on several hosts
    widens the scope of the investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \nc.exe
        - \ncat.exe
        - \netcat.exe
      selection_cmdline:
        CommandLine|contains:
        - ' -lvp '
        - ' -lvnp'
        - ' -l -v -p '
        - ' -lv -p '
        - ' -l --proxy-type http '
        - ' -vnl --exec '
        - ' -vnl -e '
        - ' --lua-exec '
        - ' --sh-exec '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline
  question: Does this host normally run this netcat-family binary?
  context: >-
    A binary that has never been seen on a host is more notable than one that runs regularly. Zero or
    very low historical counts indicate first-time or rare execution of this tool here. This counts how
    often the binary normally runs on this host, independent of which flags were used.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: >-
    Even routinely used tools can be abused. This query mirrors the rule's selection structure scoped to
    this host, so the resulting parent/user distribution reflects how this specific firing pattern (the
    netcat-family name or the listener/exec flags), not generic binary usage, has historically run here.
    A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \nc.exe
        - \ncat.exe
        - \netcat.exe
      selection_cmdline:
        CommandLine|contains:
        - ' -lvp '
        - ' -lvnp'
        - ' -l -v -p '
        - ' -lv -p '
        - ' -l --proxy-type http '
        - ' -vnl --exec '
        - ' -vnl -e '
        - ' --lua-exec '
        - ' --sh-exec '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the rule's firing pattern rather than generic usage of the binary. Many hosts firing the
    same pattern points to scripted deployment or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution and parent/binary consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \nc.exe
        - \ncat.exe
        - \netcat.exe
      selection_cmdline:
        CommandLine|contains:
        - ' -lvp '
        - ' -lvnp'
        - ' -l -v -p '
        - ' -lv -p '
        - ' -l --proxy-type http '
        - ' -vnl --exec '
        - ' -vnl -e '
        - ' --lua-exec '
        - ' --sh-exec '
      condition: 1 of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, credential access -- may reveal the attack stages that preceded a connectivity tool
    being run and help reconstruct the full timeline leading up to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
