name: Base64 Encoded PowerShell Command Detected
id: e1bde93e-9b88-46aa-84b3-41ace32f681e
description: |
  Fires when a command line contains the .NET method call '::FromBase64String(', which decodes a base64-encoded string in
  memory. This is the standard PowerShell idiom for unpacking an embedded payload at runtime, and it appears in legitimate
  installer and admin tooling as well as in download cradles, in-memory .NET loaders, and obfuscated droppers. The decoded
  value is what matters: investigation should reconstruct the decoded content, establish how PowerShell was launched and
  what it spawned, and confirm whether this user and host routinely run base64-decoding script.
type: detection
detection_id: e32d4572-9826-4738-b651-95fa63747e8a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting command line contain a base64-decode call, and what string is being decoded?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line.
    The rule fires on the literal '::FromBase64String(' method call; verify it is present and capture the encoded string and
    surrounding cmdlets so the decode work that follows has the full context.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run base64-decoding PowerShell?
  context: Legitimate administrative scripts, installers, and packaging tools also decode base64 strings at runtime. Knowing
    whether the user role and host function are consistent with running script that unpacks embedded data is often the fastest
    path to distinguishing routine automation from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:universal.evidence_preservation
  question: Did the decoded content get written to disk, and is that file still available for analysis?
  context: Base64 decode steps frequently stage a payload to disk -- a script, a .NET assembly, or an archive -- before
    execution. If the command line references an output path, checking whether that file still exists enables hash lookups,
    sandbox submission, or content review. File paths here are derived from the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:powershell.encoded_command_decode
  question: What does the base64 string decode to, and what operation does the decoded content perform?
  context: The '::FromBase64String(' call unpacks an embedded payload at runtime. Decode the string from the alerting command
    line and read what it forms -- a download cradle, a reverse shell, a credential-theft routine, or a '[Reflection.Assembly]::Load'
    call that runs a .NET assembly entirely in memory. Leading base64 characters disclose payload class quickly (a 'TVq'
    prefix decodes to the 'MZ' PE header, 'H4sIA' is gzip magic, 'JAB' is a UTF-16 PowerShell variable). Focus on any source
    URL and what ultimately executes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Event ID 4104 records the script content PowerShell actually executes after decoding, providing ground truth even
    when the command line only shows the base64 blob. If PowerShell operational logs are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or evade PowerShell protections before running a decoded payload. Common precursors include
    AMSI bypass (patching amsi.dll in memory), execution-policy changes ('Set-ExecutionPolicy' or '-ep bypass'), and version
    downgrade ('-Version 2', which lacks modern logging). Finding these on the host shortly before the decode strengthens the
    case for deliberate evasion.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned the PowerShell that ran the decode, and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. User-driven sessions usually descend from explorer.exe or
    a console host; unusual parents like mshta.exe, wscript.exe, or an Office application point to macro or script-host
    delivery. The immediate parent is in the alert -- this walks up to what spawned it.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run the base64-decode pattern this rule fires on?
  context: A decode pattern that has never been seen on a host is more suspicious than one that runs regularly. The query
    counts how often '::FromBase64String(' has executed on this host so zero or very low historical counts flag first-time
    or rare use. Grouped by user because the command line itself is too variable to aggregate over 90 days.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '::FromBase64String('
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the base64-decode pattern, what parents and users normally drive it, and does
    the current alert fit?
  context: Even routine automation decodes base64. The query mirrors the rule's selection scoped to this host, so the parent
    and user distribution reflects how this specific firing pattern has historically run here -- not generic PowerShell use.
    A new parent process, an unexpected user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ::FromBase64String(
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell process spawn afterward?
  context: The processes spawned after the decode reveal its actual impact. A decode that quietly returns data leaves no
    children; one that drops and runs a payload often spawns cmd.exe, additional PowerShell, certutil.exe, rundll32.exe, or
    an unfamiliar binary from a user-writable path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the base64-decode pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the decode pattern rather
    than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or packaged tooling; one
    host or a small unrelated set points to manual operator activity. Use the host spread to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ::FromBase64String(
      condition: selection
    fields:
    - host.name
- source: attack:T1059.001.image_load
  question: Did a non-PowerShell process on this host load the .NET automation assemblies that indicate PowerShell hosted
    in another binary?
  context: PowerShell can be hosted indirectly inside an arbitrary executable by loading System.Management.Automation, which
    runs script without spawning powershell.exe. When the decode and execution happen through such a host, the command-line
    artifact may be thin, but the loaded-module trail still shows automation, the CLR, and the AMSI provider being pulled
    into a process that is not a normal script host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - 'System.Management.Automation'
          - 'System.Automation'
          - 'amsi.dll'
          - 'clr.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- source: template:cue_user_actor.baseline
  question: Does this user normally run base64-decoding PowerShell?
  context: Compare this user's current action against their historical pattern. A user who has never run the decode pattern
    is more suspicious than one who does so regularly as part of their role. The query counts this user's executions of
    '::FromBase64String(' across all hosts over 90 days, grouped by host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains: '::FromBase64String('
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-decode combination historically routine on this host or across the environment, or is the
    parent unusual for it?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot
    is the launch mechanism. The query counts how often this parent process has driven the base64-decode pattern over 90
    days. A new or rare parent for this decode is the deviation worth chasing; a pair that already accounts for thousands of
    prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains: '::FromBase64String('
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on more than one host, the scope of the incident may be larger than the
    single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-decode combination fire on other hosts in the same window -- a coordinated rollout, or
    isolated to this host?
  context: Under a service principal, asking what else the user did returns agent-telemetry noise because every host runs
    SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism -- this parent process
    driving the base64-decode pattern -- fired on other hosts in the alert window. Multiple hosts points to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains: '::FromBase64String('
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event, what
    happened after, and whether it is part of a larger sequence. Aggregating by Image and ParentImage collapses repetitive
    agent telemetry into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the
    stages that preceded this event and help reconstruct the timeline. Defense tampering and credential access often precede
    payload execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
