name: PUA - Rclone Execution
id: 01ba1fc3-9ba4-45c5-83bc-6fae26c72ab0
description: |
  Detects execution of the Rclone cloud-storage sync utility, a command-line tool used to copy or sync local data to remote cloud or SFTP/FTP/WebDAV destinations. The rule fires when EITHER a command line carrying the bulk-transfer option set (--config, --no-check-certificate, copy) is seen, OR an rclone.exe image / "Rsync for cloud storage" description is present together with rclone-style subcommand keywords (copy, sync, mega, pcloud, ftp, transfers, multi-thread-streams, etc.). Rclone has legitimate backup and data-migration uses, but it is also a common exfiltration tool dropped during hands-on intrusions to move collected data off-host to attacker-controlled cloud storage. Investigation should confirm the command line, identify the source data and cloud destination, establish whether the user and host normally run this tool, and look for surrounding staging or impact activity.
type: detection
detection_id: e37db05d-d1f9-49c8-b464-cee1a4b11638
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — either the bulk-transfer option set or an rclone image with rclone-style subcommand keywords?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires on EITHER a command line containing all of '--config', '--no-check-certificate', and ' copy ', OR an rclone.exe image (or a process whose Description is 'Rsync for cloud storage') combined with rclone subcommand keywords such as copy, sync, config, mega, pcloud, ftp, transfers, or multi-thread-streams. Note which branch fired - a 'Rsync for cloud storage' description on a binary not named rclone.exe indicates a renamed Rclone copy, which is a stronger signal than the bare keyword match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run a cloud-storage sync tool like Rclone?
  context: Legitimate Rclone use is usually tied to a specific backup, data-migration, or developer workflow on a known host. If the user role and host function are not consistent with bulk cloud transfers - for example, an ordinary workstation user account or a file/database server with no sanctioned cloud backup - the activity is more likely operator-driven exfiltration. Knowing which accounts are permitted to use sanctioned cloud services versus unexpected accounts is often the fastest triage signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this Rclone invocation do? Decode the full command line, including the remote name, source path, and any --config flag.
  context: The full command line reveals the transfer operation. Identify the rclone subcommand (copy, sync, lsd, ls), the source path being read, and the remote/destination name. A '--config' flag points to a custom rclone config file that defines the cloud destination and credentials; '--no-check-certificate' disables TLS validation against the destination. Resolving these together establishes what data was targeted and where it was being sent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_artifact.mechanism_decode
  question: What is in the Rclone config file or any local files the command referenced — check for obfuscation, embedded credentials, and the cloud destination?
  context: Rclone's '--config' flag points to a config file that defines the remote name, destination provider, and stored or obscured credentials; reading it reveals the actual exfiltration target even when the command line only names a remote alias. Inspect any source or output file paths in the command line as well. For text artifacts check for base64 or obfuscated strings; the config typically holds the cloud provider, bucket/path, and an obscured token that resolves to the destination.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:data_staging_exfil.data_scope
  question: What files or directories were selected for transfer?
  context: The command-line arguments and the files the tool touched reveal what data was targeted - specific file types, sensitive directories (finance shares, HR folders, source code), mapped network shares, or broad wildcards indicating bulk collection. The scope of targeted data determines the severity of potential data loss and which business units need to be notified. The CurrentDirectory and source path passed to the copy/sync subcommand show the data source location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:data_staging_exfil.archive_destination
  question: Was the targeted data staged or archived locally before transfer, and where was the output written?
  context: Exfiltration often involves collecting or archiving data locally before pushing it to a remote destination. Checking for file events written by the same tool on this host - archive files, copied collections, or temporary staging output - reveals whether data was assembled on disk first. Pairing local file activity with the tool's outbound transfer reconstructs the staging-to-exfiltration path.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:data_staging_exfil.encryption_password
  question: Did the command line apply encryption, password protection, or TLS-validation bypass to the transfer?
  context: Operators often obscure exfiltration so security tooling cannot inspect the contents. In Rclone command lines, look for '--no-check-certificate' (disables TLS validation against the destination, frequently paired with attacker-controlled endpoints), crypt remotes or '--password-command' (client-side encryption of the data in transit), and any password or credential passed inline. These obfuscation choices make the transfer a stronger indicator of deliberate data theft than a plain copy; note that credentials passed via the config file or stdin will not appear in the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoint did this tool connect to?
  context: Rclone establishes outbound connections to the configured cloud-storage or SFTP/FTP/WebDAV destination. The destination reveals whether the transfer targets a sanctioned corporate backup endpoint or an unknown external address - common consumer cloud providers (dropbox.com, drive.google.com, onedrive.live.com, mega, pcloud) or a raw IP are typical exfiltration targets. Correlate the destination with the outbound data volume; a large, sustained outbound-to-inbound ratio toward a storage API in a single session is the abnormal-transfer signal for this technique.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.process_chain
  question: What process spawned this tool and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Legitimate Rclone use usually has predictable parents (explorer.exe for an interactive run, a scheduler or backup-job service for automation). Unusual parents - cmd.exe or powershell.exe launched from a remote-execution beacon, wmic.exe, or an Office application - point to hands-on-keyboard operator activity or a malicious script driving the transfer.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run Rclone?
  context: A tool that has never been seen on a host is more suspicious than one that runs regularly as part of a sanctioned backup or migration job. Zero or very low historical counts over the baseline window indicate first-time or rare execution, which fits attacker-dropped exfiltration tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even sanctioned tools can be abused. This query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern - not generic Rclone usage - has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_specific_options:
        CommandLine|contains|all:
        - '--config '
        - '--no-check-certificate '
        - ' copy '
      selection_rclone_img:
      - Image|endswith: \rclone.exe
      - Description: Rsync for cloud storage
      selection_rclone_cli:
        CommandLine|contains:
        - pass
        - user
        - copy
        - sync
        - config
        - lsd
        - remote
        - ls
        - mega
        - pcloud
        - ftp
        - ignore-existing
        - auto-confirm
        - transfers
        - multi-thread-streams
        - 'no-check-certificate '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_specific_options or all of selection_rclone_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic use of the binary. Many hosts firing the same pattern points to a scripted backup deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_specific_options:
        CommandLine|contains|all:
        - '--config '
        - '--no-check-certificate '
        - ' copy '
      selection_rclone_img:
      - Image|endswith: \rclone.exe
      - Description: Rsync for cloud storage
      selection_rclone_cli:
        CommandLine|contains:
        - pass
        - user
        - copy
        - sync
        - config
        - lsd
        - remote
        - ls
        - mega
        - pcloud
        - ftp
        - ignore-existing
        - auto-confirm
        - transfers
        - multi-thread-streams
        - 'no-check-certificate '
      condition: selection_specific_options or all of selection_rclone_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_specific_options:
        CommandLine|contains|all:
        - '--config '
        - '--no-check-certificate '
        - ' copy '
      selection_rclone_img:
      - Image|endswith: \rclone.exe
      - Description: Rsync for cloud storage
      selection_rclone_cli:
        CommandLine|contains:
        - pass
        - user
        - copy
        - sync
        - config
        - lsd
        - remote
        - ls
        - mega
        - pcloud
        - ftp
        - ignore-existing
        - auto-confirm
        - transfers
        - multi-thread-streams
        - 'no-check-certificate '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_specific_options or all of selection_rclone_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_specific_options:
        CommandLine|contains|all:
        - '--config '
        - '--no-check-certificate '
        - ' copy '
      selection_rclone_img:
      - Image|endswith: \rclone.exe
      - Description: Rsync for cloud storage
      selection_rclone_cli:
        CommandLine|contains:
        - pass
        - user
        - copy
        - sync
        - config
        - lsd
        - remote
        - ls
        - mega
        - pcloud
        - ftp
        - ignore-existing
        - auto-confirm
        - transfers
        - multi-thread-streams
        - 'no-check-certificate '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_specific_options or all of selection_rclone_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging spread across multiple endpoints. If the same user triggered similar tool execution or data collection on multiple hosts in the alert window, the scope of the operation may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_specific_options:
        CommandLine|contains|all:
        - '--config '
        - '--no-check-certificate '
        - ' copy '
      selection_rclone_img:
      - Image|endswith: \rclone.exe
      - Description: Rsync for cloud storage
      selection_rclone_cli:
        CommandLine|contains:
        - pass
        - user
        - copy
        - sync
        - config
        - lsd
        - remote
        - ls
        - mega
        - pcloud
        - ftp
        - ignore-existing
        - auto-confirm
        - transfers
        - multi-thread-streams
        - 'no-check-certificate '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_specific_options or all of selection_rclone_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Exfiltration tooling rarely runs in isolation - it usually follows collection, defense tampering, credential access, or lateral movement. Earlier detections on the same host help reconstruct the timeline and reveal whether this transfer is one stage of a larger multi-host operation. Reviewing the prior-alert sequence over the hours before the event tells the attack story leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
