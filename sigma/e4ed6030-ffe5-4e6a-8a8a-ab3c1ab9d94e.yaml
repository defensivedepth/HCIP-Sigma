name: Disable Windows IIS HTTP Logging
id: 61282b1a-10a1-4fba-a717-a3501e1c76da
description: |
  Detects use of appcmd.exe to disable HTTP logging on a Windows IIS web server. The rule fires when appcmd.exe (by Image name or OriginalFileName) runs with a command line that contains all of set, config, section:httplogging, and dontLog:true. Disabling IIS HTTP logging removes the record of inbound web requests, which is a common step before or alongside web-shell deployment and other web-facing intrusion activity so that subsequent request traffic is not recorded. Legitimate administrators may disable logging during maintenance or troubleshooting, so the investigation should establish who ran the command, what was changed, and whether logging was restored.
type: detection
detection_id: e4ed6030-ffe5-4e6a-8a8a-ab3c1ab9d94e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the appcmd.exe command line match what this rule detects — set, config, section:httplogging, and dontLog:true?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule requires appcmd.exe (by Image name or OriginalFileName) running with all of set, config, section:httplogging, and dontLog:true present together, which sets HTTP logging to off for an IIS site or the server.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to reconfigure IIS logging via appcmd.exe?
  context: Legitimate IIS administration can trigger this detection. Knowing whether the host is a web server and whether the user account routinely administers IIS is often the fastest path to distinguishing maintenance from tampering. A non-administrator account or a host with no IIS role disabling HTTP logging is harder to explain as routine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: Which IIS site or configuration scope had HTTP logging disabled?
  context: appcmd.exe set config can target the server-wide applicationHost configuration or a specific site, application, or virtual directory. The full command line reveals whether logging was turned off globally or only for one site, which determines how much inbound web request visibility was lost and which web content to examine for tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned appcmd.exe and is that parent chain expected?
  context: The parent process reveals how appcmd.exe was invoked. Administrative use is typically launched from an interactive shell or management tooling. A web server worker process (w3wp.exe), a scripting host, or an unexpected service parent spawning appcmd.exe points to command execution through a web-facing process rather than hands-on administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is IIS HTTP logging currently restored, or is the server still not recording web requests?
  context: Tampering may be temporary (for a specific action) or persistent. Confirming the current httplogging configuration reveals whether the server is still failing to record inbound requests. If logging remains off, it should be restored before further investigation so that ongoing activity is captured.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after HTTP logging was disabled?
  context: Logging is often disabled so that subsequent activity is not recorded. Examining process activity in the window immediately after the change can reveal what the tampering was meant to hide — web-shell execution, credential access, or file staging. Note that the disabled HTTP log itself will not show inbound requests during this window, so process and file evidence carry the timeline.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host?
  context: Operators who disable one control often disable several — stopping logging alongside clearing event logs, deleting shadow copies, or disabling AV. Finding additional tampering events from the same user or parent process around this time indicates multiple controls were targeted in one operation rather than an isolated logging change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline
  question: Does this host normally run appcmd.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. On a dedicated IIS server appcmd.exe may run during routine configuration changes; on a host with no web-administration role, zero or very low historical counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously disabled IIS HTTP logging with appcmd.exe, what parents and users drove that activity, and does the current alert fit that pattern?
  context: Even routine administration leaves a pattern. This query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects how this specific logging-disable command has historically run here. A new parent process, an unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_cli:
        CommandLine|contains|all:
        - set
        - config
        - section:httplogging
        - dontLog:true
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Web-facing intrusions typically involve multiple tools in sequence. Activity surrounding the logging change may reveal web-shell drops, reconnaissance, credential access, or persistence installation that provides broader context for whether this was administration or part of an intrusion.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_user_actor.baseline
  question: Does this user normally run appcmd.exe?
  context: Compare this user's current action against their historical behavior. A user who has never run appcmd.exe is more suspicious than one who administers IIS regularly. The user's role and typical toolset should align with web-server configuration changes.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and appcmd.exe combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned appcmd.exe, and whether that pair is historically common. A new or rare parent for appcmd.exe on this host or environment-wide is the deviation worth chasing; a pair that already accounts for many prior events is configuration tooling or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user disabled logging or ran related tooling on several web servers, the scope of the activity may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and appcmd.exe combination fire on other hosts in the same window — a coordinated rollout, or activity isolated to this host?
  context: Under a service principal, tracking the user across the network returns agent-telemetry noise because every host runs service-owned processes constantly. The meaningful question is whether the same launch mechanism — parent process plus appcmd.exe — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Disabling web request logging rarely happens in isolation. Earlier detections on the same host — web-shell activity, reconnaissance, or exploitation of the web application — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts disabled IIS HTTP logging with appcmd.exe in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific logging-disable command (not generic appcmd.exe usage). Many hosts running the same command points to scripted deployment or configuration automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_cli:
        CommandLine|contains|all:
        - set
        - config
        - section:httplogging
        - dontLog:true
      condition: all of selection_*
    fields:
    - host.name
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host around the same time?
  context: Disabling web request logging is often paired with establishing footholds on a web server. After or alongside the logging change, operators commonly install persistence using scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence installations in the same timeframe indicate intentional stacking rather than an isolated configuration change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
