name: Potential Product Class Reconnaissance Via Wmic.EXE
id: 5a8d6472-9210-4f23-9415-535f686fd172
description: |
  Detects wmic.exe enumerating installed security products, where the command line references AntiVirusProduct, AntiSpywareProduct, or FirewallProduct (the rule fires when the binary is wmic.exe AND the command line contains one of those product-class strings). This query enumerates the security controls present on the host, a discovery step attackers use to choose how to evade or disable protection before the next stage. Administrators and inventory scripts occasionally enumerate the same classes, so confirm the launching parent, the user, and whether the activity sits inside a burst of other reconnaissance or is followed by tampering or persistence.
type: detection
detection_id: e568650b-5dcd-4658-8f34-ded0b1e13992
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Did wmic.exe run with a command line enumerating a security product class (AntiVirusProduct, AntiSpywareProduct, or FirewallProduct)?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process image against the rule's criteria, which require both the wmic.exe binary and one of the security-product-class strings. Confirm both halves are present rather than an incidental substring match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to enumerate installed security products on this host?
  context: Network administrators and inventory tooling legitimately query AV, antispyware, and firewall product classes for troubleshooting or compliance reporting. Standard users rarely have a reason to enumerate security controls. The user's role and typical behavior baseline determine whether this is routine or anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this WMIC command enumerate? Decode the full command line and the product classes it queried.
  context: The full command line reveals which security-product namespaces were queried and what properties were requested (for example displayName, productState). Decode every argument to determine whether this was a single targeted class lookup or a broad sweep across AntiVirusProduct, AntiSpywareProduct, and FirewallProduct. Scoping to the host and wmic.exe within a few minutes also surfaces any companion WMIC fingerprinting calls (csproduct, os, cpu) that often accompany the same enumeration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned this WMIC enumeration, and is that parent chain normal?
  context: Security-product enumeration run from cmd.exe under explorer.exe or from a known inventory agent is routine. The same enumeration spawned by wscript.exe, mshta.exe, an Office application, wmiprvse.exe, or a PowerShell download cradle points to automated post-compromise discovery rather than an administrator at a console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did wmic.exe spawn afterward?
  context: The processes spawned after this enumeration reveal its actual purpose. Reconnaissance that is immediately followed by cmd.exe, powershell.exe, or a tamper utility suggests the operator acted on the enumerated security controls; a WMIC call with no meaningful children is more consistent with isolated inventory activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even common tools get abused. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here, not generic wmic.exe usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains:
        - AntiVirusProduct
        - AntiSpywareProduct
        - FirewallProduct
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery command may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession is a signature of post-compromise enumeration. Three or more distinct recon binaries within fifteen minutes typically indicates automated discovery rather than an administrator spot-checking one thing.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the enumeration reveals the immediate context: what led up to it, what happened after, and whether it is part of a larger sequence. Novel parent-child pairs stand out at low counts against the repetitive high-count rows of normal host activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains:
        - AntiVirusProduct
        - AntiSpywareProduct
        - FirewallProduct
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains:
        - AntiVirusProduct
        - AntiSpywareProduct
        - FirewallProduct
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar enumeration on multiple hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains:
        - AntiVirusProduct
        - AntiSpywareProduct
        - FirewallProduct
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host such as defense tampering, credential access, or other reconnaissance may reveal the attack stages that preceded this enumeration and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Enumerating security products is a common precursor to disabling them. This query surfaces direct attempts to stop AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal, though kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:lolbin.technique_class_lateral
  question: Were any other discovery or proxy-execution LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary for discovery often use several. If wmic.exe enumerated security products, check whether other proxy-execution or fingerprinting LOLBins were also run on the host. Finding multiple LOLBins serving the same objective in the same window strengthens the case for hands-on-keyboard activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was wmic.exe executed from its expected System32 path?
  context: wmic.exe executed from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists. Compare the Image path against OriginalFileName; a wmic.exe running from a user temp or download directory is more suspicious than one in System32.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the rule's WMIC enumeration pattern over the past 90 days, and what command-line structures are typical?
  context: A WMIC security-product enumeration with no prior history on a host is more suspicious than one used regularly under stable parents. This query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic wmic.exe usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains:
        - AntiVirusProduct
        - AntiSpywareProduct
        - FirewallProduct
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's WMIC enumeration pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic wmic.exe usage. Many hosts firing the same enumeration points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains:
        - AntiVirusProduct
        - AntiSpywareProduct
        - FirewallProduct
      condition: all of selection_*
    fields:
    - host.name
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1082
      name: System Information Discovery
      role: primary
    - id: T1047
      name: Windows Management Instrumentation
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: discovery_command_execution
      description: "Native discovery utility (wmic.exe) executes a command-line query enumerating system/security state"
      mapped_to: Q1
      source: template:universal.verify_trigger_match
    - stage: 2
      label: command_decode
      description: "Parse the WMIC command line to determine which security-product classes and properties were enumerated"
      mapped_to: Q3
      source: template:cue_process_tool.mechanism_decode
    - stage: 3
      label: invocation_mechanism
      description: "WMI/WMIC invoked to drive the enumeration; identify the launching parent chain"
      mapped_to: Q4
      source: template:discovery_recon.discovery_parent_chain
    - stage: 4
      label: enumeration_burst
      description: "Multiple discovery commands run in short succession around the enumeration"
      mapped_to: Q7
      source: template:discovery_recon.discovery_burst_detection
  dimension_coverage:
    - dimension: parent_process_analysis
      technique: T1082
      covered_by: Q4
      source: template:discovery_recon.discovery_parent_chain
      coverage_type: direct
    - dimension: time_correlation
      technique: T1082
      covered_by: Q7
      source: template:discovery_recon.discovery_burst_detection
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1047
      covered_by: Q3
      source: template:cue_process_tool.mechanism_decode
      coverage_type: direct
    - dimension: user_context
      technique: T1082
      covered_by: Q2
      source: template:discovery_recon.discovery_user_context
      coverage_type: direct
  mutable_dispositions:
    - element: SuspiciousCommandPatterns
      dimension: tuning_parameter
      specific_values: "AntiVirusProduct, AntiSpywareProduct, FirewallProduct (rule's own CommandLine|contains values)"
      disposition: query_injection
      target_question: Q6
      notes: "Rule's product-class strings are embedded verbatim in the reflected baseline_deviation, historical_lolbin_baseline, and scope queries (Q6, Q17, Q18) and decoded in mechanism_decode context (Q3)."
    - element: WMIQueryScope
      dimension: tuning_parameter
      specific_values: "rationale only (namespaces like \\root\\cimv2)"
      disposition: context
      target_question: Q3
      notes: "No namespace values in this rule; mechanism_decode context directs the analyst to decode which classes/namespaces were queried."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "rationale only"
      disposition: context
      target_question: Q7
      notes: "Discovery burst window (+/-15m) carries the correlation; threshold of 3+ recon binaries stated in context."
    - element: UserContext
      dimension: user_context
      specific_values: "rationale only (interactive vs SYSTEM/low-priv)"
      disposition: context
      target_question: Q2
      notes: "discovery_user_context plus user_actor baseline/svc pair handle interactive-vs-service-principal attribution."
    - element: RemoteDestinationThreshold
      dimension: tuning_parameter
      specific_values: "rationale only (unique remote hosts via WMI)"
      disposition: context
      target_question: Q1
      notes: "Rule's WMIC usage is local enumeration (get/list), not remote process call; no network_connection question authored — see hint_dispositions."
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
      reason: "discovery_recon.discovery_parent_chain (technique set, more specific to discovery context) covers the same parent-chain question"
      kept: discovery_recon.discovery_parent_chain
    - dropped: cue_process_tool.baseline
      reason: "lolbin.historical_lolbin_baseline (reflected host-pattern baseline) is more specific — counts the rule's firing pattern, not generic wmic.exe usage"
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.clustering
      reason: "near-identical host +/-15m clustering; cue_host_context.clustering kept (groups by Image+ParentImage, surfaces novel parent-child pairs)"
      kept: cue_host_context.clustering
    - dropped: cue_user_actor.baseline / cue_user_actor.baseline_svc
      reason: "user_actor pair — non-deduplicable; both emitted (Q9 user-pivot, Q10 parent+binary service-principal substitute)"
      kept: both
    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable; both emitted (Q11 user-pivot, Q12 parent+binary service-principal substitute)"
      kept: both
  skipped_templates:
    - template: universal.host_user_context
      reason: "discovery_recon.discovery_user_context preferred per template notes (more specific to discovery context); host_user_context dropped to avoid within-phase duplicate"
    - template: persistence_scope.process_based_persistence
      reason: "discovery rule, not persistence; recommended-only. Persistence-tool sweep adds little for a security-product enumeration alert and budget is at the 18-question cap"
    - template: persistence_scope.file_based_persistence
      reason: "recommended-only file_event persistence sweep; not relevant to a local WMIC discovery alert and budget is at the 18-question cap"
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'network_connection' (recommended by techniques: T1047) is not covered — pull in cue_network_endpoint.* or author a custom question with `category: network_connection`"
      disposition: declined
      reason: >-
        The rule's detection constrains CommandLine to local read-only WMIC
        enumeration (AntiVirusProduct/AntiSpywareProduct/FirewallProduct get
        queries), not remote process invocation (no `/node:`, no `process
        call create`). This firing produces no outbound WMI/DCOM connection,
        so a network_connection question would return unrelated host traffic
        with no link to the alert. RemoteDestinationThreshold is documented in
        Q1's mutable disposition as not-applicable for this local-enumeration rule.
    - hint: "logsource 'wmi' (recommended by techniques: T1047) is not covered and no template family exists — author a custom question with `category: wmi`"
      disposition: declined
      reason: >-
        The rule fires on process_creation of wmic.exe, not on WMI provider
        events (EventCode 5857/5858/5860/5861 cover WMI subscription and
        provider activity). This rule's WMIC enumeration runs as a child
        process with a visible command line, fully covered by the
        process_creation questions (verify_trigger_match Q1, mechanism_decode
        Q3, parent_chain Q4). WMI event-subscription logsource would surface a
        different abuse class (event-consumer persistence) this rule does not detect.
  contextual_sets:
    included: []
    excluded:
      - id: ransomware_impact
        confidence: low
        reason: "Keyword match on 'ransomware' in references is incidental — the rule detects security-product discovery via WMIC, not impact/encryption behavior"
      - id: network_scope
        confidence: low
        reason: "Keyword match on 'ransomware' in references is incidental — the rule's WMIC usage is local enumeration with no network component"
  technique_sets_applied:
    - universal
    - discovery_recon
