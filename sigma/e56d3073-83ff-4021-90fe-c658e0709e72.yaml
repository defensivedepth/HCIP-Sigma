name: Gpresult Display Group Policy Information
id: ef89c30f-9e44-4153-9faa-03120cabf802
description: |
  Detects execution of the built-in Windows utility gpresult.exe with the /z or /v output flags, which dump the full
  Resultant Set of Policy (RSoP) for a user or computer. gpresult is a legitimate Group Policy diagnostic tool, so this
  fires on routine administrator or help-desk troubleshooting as well as on post-compromise reconnaissance, where an
  operator enumerates the merged domain-policy posture (precedence, applied GPOs, group membership) before choosing the
  next stage. Investigation should determine whether the user and host are expected to run policy diagnostics, what parent
  launched the command, and whether other discovery commands ran in the same window.
type: detection
detection_id: e56d3073-83ff-4021-90fe-c658e0709e72
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process show gpresult.exe run with the /z or /v output flag?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line
    against the rule's criteria. The rule fires when the image ends in gpresult.exe and the command line contains /z (dump
    everything, precedence-1 and higher) or /v (verbose, precedence-1 only). Note which flag and whether output was
    redirected to a file, since both are recon-relevant.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What was the full gpresult command line, and what scope and output did it request?
  context: The full command line reveals the specific recon intent. Decode the scope and output flags - /z dumps everything,
    /v is verbose, /scope user or /scope computer narrows one side, /x or /h write a report to disk, and /s with /user
    targets a remote host with alternate credentials. A redirect to a file or an HTML/XML report on disk is the canonical
    dump-for-later-review pattern. This scopes to all gpresult executions on the host within a few minutes so sequential
    invocations that form one logical operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run Group Policy diagnostic commands?
  context: Network administrators and IT staff legitimately run gpresult for troubleshooting policy application. Standard
    users rarely need to dump the full Resultant Set of Policy. The user's role and typical behavior baseline determine
    whether the activity is routine or anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned gpresult, and is this a normal launch pattern?
  context: Legitimate gpresult is typically run from cmd.exe or powershell.exe spawned by explorer.exe (an interactive
    administrator) or from a management script. gpresult spawned by Office applications, script interpreters such as
    wscript.exe, cscript.exe, or mshta.exe, or by wmiprvse.exe or wsmprovhost.exe (remote execution) indicates automated
    post-exploitation enumeration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.process_chain
  question: What spawned the parent of gpresult, and what else did that parent launch?
  context: Walking one step further up the tree shows how the gpresult invocation originated. The immediate parent is
    visible from the launch-pattern question; this retrieves the parent's own lineage and siblings so an unexpected
    grandparent (a download cradle, a macro host, a remote-execution service) or a cluster of other tools from the same
    parent stands out.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did gpresult spawn afterward?
  context: gpresult itself has predictable, limited children. Unexpected processes launched in its wake - cmd.exe,
    powershell.exe, certutil.exe, or staging utilities - suggest the recon command was one step in a larger hands-on
    sequence rather than isolated troubleshooting.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single gpresult run may be legitimate troubleshooting, but multiple reconnaissance commands in rapid
    succession - whoami, ipconfig, net user, net group, nltest, systeminfo - is a signature pattern of post-compromise
    enumeration. Three or more distinct recon binaries within fifteen minutes typically indicates automated
    reconnaissance preceding the next attack stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: attack:T1615.security
  question: Was there a burst of directory-object access to Group Policy containers on this host around the alert?
  context: gpresult on the command line is one face of Group Policy discovery; the same enumeration also leaves directory
    object-access auditing on the host or domain controller. Handle-access events (EventID 4661) against
    groupPolicyContainer objects, especially a burst from one account, corroborate that policy enumeration occurred
    beyond the single process. If object-access auditing for directory objects is not enabled in this environment, treat
    zero results as a visibility gap rather than evidence nothing happened.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4661
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ObjectType
      - ObjectName
      - SubjectUserName
      - AccessMask
- source: template:cue_process_tool.baseline
  question: Does this host normally run gpresult?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts over the past ninety days indicate first-time or rare execution of gpresult here, which weighs
    against routine administrative diagnostics.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run gpresult with /z or /v, what parents and users drove it, and does the
    current alert fit that pattern?
  context: Even common diagnostic tools can be abused. The query mirrors the rule's selection scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new
    parent process, an unexpected user account, or an unusual command-line shape is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \gpresult.exe
        CommandLine|contains:
        - /z
        - /v
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally perform Group Policy diagnostics across the environment?
  context: Compare this user's current action against their historical behavior. A user who has never run gpresult is more
    suspicious than one who runs it regularly as part of an administrative role. The user's role and typical toolset
    should align with policy enumeration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and gpresult combination historically routine on this host or across the environment, or is the
    parent unusual for gpresult?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful
    pivot is the launch mechanism: which parent process spawned gpresult, and is that pair historically common. A new or
    rare parent for gpresult on this host or environment-wide is the deviation worth chasing; a pair that already
    accounts for thousands of prior events is vendor or operating-system automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration across multiple
    endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger
    than a single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and gpresult combination fire on other hosts in the same window, indicating a coordinated
    rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise,
    because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism
    - parent process plus spawned binary - fired on other hosts in the alert window. Multiple hosts in the same window
    points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led
    to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms surfacing as novel parent-child pairs.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering, reconnaissance,
    credential access - may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:cue_process_tool.scope
  question: Have other hosts run gpresult with /z or /v in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern rather than generic gpresult usage. Many hosts firing the same pattern points to scripted deployment
    or management automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \gpresult.exe
        CommandLine|contains:
        - /z
        - /v
      condition: selection
    fields:
    - host.name
