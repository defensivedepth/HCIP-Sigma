name: Potentially Suspicious Rundll32 Activity
id: 14979751-ef73-447d-b72b-f76257fb801b
description: |
  Detects a command line that matches one of a set of known rundll32 living-off-the-land patterns — a DLL-and-export combination that proxies execution through the signed rundll32 binary. The set spans URL handlers (url.dll OpenURL, ieframe/shdocvw OpenURL), arbitrary execution (shell32 Control_RunDLL and ShellExec_RunDLL, pcwutl LaunchApplication), INF-driven install (advpack/ieadvpack LaunchINFSection, setupapi InstallHinfSection, syssetup), remote scriptlets (scrobj GenerateTypeLib over http, shimgvw ImageView_Fullscreen over http), Excel XLL registration (javascript: .RegisterXLL), and — notably — comsvcs.dll MiniDump, which dumps process memory and is the standard way to capture LSASS for credential theft. Benign screensaver and Control Panel (.cpl) invocations are excluded. Because the matched pattern determines the behavior, the investigation hinges on decoding which DLL-and-export combination fired and its target, then tracing the parent, any network fetch, files written (a memory dump or INF-dropped files), and what ran next.
type: detection
detection_id: e593cf51-88db-4ee1-b920-37e89012a3c9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match one of the rundll32 DLL-and-export abuse patterns this rule detects?
  context: Confirm the alert before investing time. The rule fires when the command line contains one of the listed DLL-and-export combinations (for example url.dll OpenURL, shell32.dll Control_RunDLL or ShellExec_RunDLL, advpack.dll LaunchINFSection, scrobj.dll GenerateTypeLib with http, or comsvcs.dll MiniDump), with the benign screensaver and Control Panel .cpl cases excluded. Read the full command line and identify which pattern fired — that classification drives the rest of the investigation, and a comsvcs.dll MiniDump match in particular is process-memory dumping consistent with LSASS credential theft and should be treated as high priority.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run rundll32 with these arguments?
  context: rundll32 runs constantly for legitimate purposes, but the specific DLL-and-export combinations this rule matches are unusual outside particular software or admin actions. Knowing whether this user's role and host function involve the matched behavior — opening URLs programmatically, installing via INF, or dumping process memory — helps separate a niche legitimate use from proxied execution or credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: Which DLL and export was invoked, and what is its target?
  context: Decode the full command line and classify the matched pattern. Identify the DLL and exported function and the argument it acts on — a URL (url.dll/ieframe OpenURL, scrobj over http), an .inf path (LaunchINFSection, InstallHinfSection), an application or command (ShellExec_RunDLL, pcwutl LaunchApplication), or a process id and output path (comsvcs MiniDump, which dumps memory — capture the target process and the dump file path). The classification tells you whether this is a proxy-execution, remote-fetch, or credential-dumping action and sets the priority.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this rundll32, and is that parent chain expected?
  context: rundll32 launched by an installer, Control Panel, or an interactive admin session can be routine; the same invocation spawned by winword.exe or excel.exe (a macro), mshta.exe, a script host, or a download cradle points to a delivery chain proxying execution through rundll32. The parent's command line shows whether a document or loader drove it, and walking up reconstructs how the activity began.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1218.011.network_egress
  question: Did this process make outbound network connections, and to what host or IP?
  context: Several of the matched patterns fetch remote content — scrobj.dll GenerateTypeLib and shimgvw ImageView_Fullscreen pull a scriptlet or image over http, and the URL-handler exports open arbitrary addresses. Correlating the process to its network connections recovers the destination host, IP, and port. Compare them against known-good endpoints; an external or newly seen address confirms the rundll32 invocation reached out, while no connection points to a local action such as an INF install or a memory dump.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: attack:T1218.011.dropped_files
  question: What files did this process write to disk?
  context: The matched pattern often leaves a file artifact. A comsvcs.dll MiniDump writes a memory dump (frequently a .dmp under a temp or public path, sometimes renamed) that is the captured LSASS data; an INF-driven install drops and stages payload files; a remote scriptlet may write a downloaded component. Reviewing what this process wrote confirms the action and gives concrete paths to pivot on — a dump file is direct evidence of credential theft.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- source: template:cue_process_tool.follow_on
  question: What child processes did this rundll32 spawn afterward?
  context: Some matched patterns hand off to another process — ShellExec_RunDLL and pcwutl LaunchApplication launch an application, an INF install can run an embedded command, and a remote scriptlet can spawn an interpreter. The children reveal what the proxied execution actually ran. A pattern such as comsvcs MiniDump typically spawns nothing, so the absence of children is itself informative about which behavior fired.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Proxied execution and credential dumping are often preceded by disabling protection. This surfaces direct attempts to disable AV/EDR services, flip Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the writing process and its signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously matched a rundll32 abuse pattern, what parents and users drove it, and does the current alert fit?
  context: Even rundll32 LOLBin patterns can have a normal shape on a given host driven by specific software. This mirrors the rule's pattern set scoped to this host, so the parent/user distribution reflects how these invocations have historically run here. A new parent process, an unexpected user, or a pattern never seen before on this host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - 'javascript:'
        - .RegisterXLL
      - CommandLine|contains|all:
        - url.dll
        - OpenURL
      - CommandLine|contains|all:
        - url.dll
        - OpenURLA
      - CommandLine|contains|all:
        - url.dll
        - FileProtocolHandler
      - CommandLine|contains|all:
        - zipfldr.dll
        - RouteTheCall
      - CommandLine|contains|all:
        - shell32.dll
        - Control_RunDLL
      - CommandLine|contains|all:
        - shell32.dll
        - ShellExec_RunDLL
      - CommandLine|contains|all:
        - mshtml.dll
        - PrintHTML
      - CommandLine|contains|all:
        - advpack.dll
        - LaunchINFSection
      - CommandLine|contains|all:
        - advpack.dll
        - RegisterOCX
      - CommandLine|contains|all:
        - ieadvpack.dll
        - LaunchINFSection
      - CommandLine|contains|all:
        - ieadvpack.dll
        - RegisterOCX
      - CommandLine|contains|all:
        - ieframe.dll
        - OpenURL
      - CommandLine|contains|all:
        - shdocvw.dll
        - OpenURL
      - CommandLine|contains|all:
        - syssetup.dll
        - SetupInfObjectInstallAction
      - CommandLine|contains|all:
        - setupapi.dll
        - InstallHinfSection
      - CommandLine|contains|all:
        - pcwutl.dll
        - LaunchApplication
      - CommandLine|contains|all:
        - dfshim.dll
        - ShOpenVerbApplication
      - CommandLine|contains|all:
        - dfshim.dll
        - ShOpenVerbShortcut
      - CommandLine|contains|all:
        - scrobj.dll
        - GenerateTypeLib
        - http
      - CommandLine|contains|all:
        - shimgvw.dll
        - ImageView_Fullscreen
        - http
      - CommandLine|contains|all:
        - comsvcs.dll
        - MiniDump
      filter_main_screensaver:
        CommandLine|contains: shell32.dll,Control_RunDLL desk.cpl,screensaver,@screensaver
      filter_main_parent_cpl:
        ParentImage: C:\Windows\System32\control.exe
        ParentCommandLine|contains: .cpl
        CommandLine|contains|all:
        - Shell32.dll
        - Control_RunDLL
        - .cpl
      filter_main_startmenu:
        ParentImage: C:\Windows\System32\control.exe
        CommandLine|startswith: '"C:\Windows\system32\rundll32.exe" Shell32.dll,Control_RunDLL "C:\Windows\System32\'
        CommandLine|endswith: .cpl",
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run rundll32 across the environment?
  context: Compare this user's current action against their historical pattern. This counts the user's rundll32 executions broadly rather than the specific matched pattern, so read it as a coarse baseline — a user with little or no rundll32 history is more notable than an admin or a host running software that drives it. This pivot is meaningful only when a real user account fired the alert; the launch-mechanism baseline alongside it carries the answer when the actor is a service or computer account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-rundll32 combination historically routine on this host or across the environment?
  context: When the alert fires under a service or computer account, user identity does not attribute behavior, so the meaningful baseline is the launch mechanism — which parent process spawned rundll32, and whether that pairing is historically common. A new or rare parent is the deviation worth chasing; a pairing that already accounts for many prior events points to software that legitimately drives these invocations.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user drove proxied execution or other tooling on other hosts in the same window, the scope is larger than a single machine. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this parent-and-rundll32 combination fire on other hosts in the same window?
  context: Under a service or computer account, asking what else the user did returns agent-telemetry noise. The meaningful question is whether the same launch mechanism — this parent spawning rundll32 — fired on other hosts in the alert window. Multiple hosts at once points to a pushed package or an operator working across the environment; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts matched a rundll32 abuse pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern set with no host scope, giving a fleet-wide count of where these rundll32 invocations fired. Many hosts at once points to software or a pushed routine that uses these exports; one host or a small unrelated set points to manual or targeted activity. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - 'javascript:'
        - .RegisterXLL
      - CommandLine|contains|all:
        - url.dll
        - OpenURL
      - CommandLine|contains|all:
        - url.dll
        - OpenURLA
      - CommandLine|contains|all:
        - url.dll
        - FileProtocolHandler
      - CommandLine|contains|all:
        - zipfldr.dll
        - RouteTheCall
      - CommandLine|contains|all:
        - shell32.dll
        - Control_RunDLL
      - CommandLine|contains|all:
        - shell32.dll
        - ShellExec_RunDLL
      - CommandLine|contains|all:
        - mshtml.dll
        - PrintHTML
      - CommandLine|contains|all:
        - advpack.dll
        - LaunchINFSection
      - CommandLine|contains|all:
        - advpack.dll
        - RegisterOCX
      - CommandLine|contains|all:
        - ieadvpack.dll
        - LaunchINFSection
      - CommandLine|contains|all:
        - ieadvpack.dll
        - RegisterOCX
      - CommandLine|contains|all:
        - ieframe.dll
        - OpenURL
      - CommandLine|contains|all:
        - shdocvw.dll
        - OpenURL
      - CommandLine|contains|all:
        - syssetup.dll
        - SetupInfObjectInstallAction
      - CommandLine|contains|all:
        - setupapi.dll
        - InstallHinfSection
      - CommandLine|contains|all:
        - pcwutl.dll
        - LaunchApplication
      - CommandLine|contains|all:
        - dfshim.dll
        - ShOpenVerbApplication
      - CommandLine|contains|all:
        - dfshim.dll
        - ShOpenVerbShortcut
      - CommandLine|contains|all:
        - scrobj.dll
        - GenerateTypeLib
        - http
      - CommandLine|contains|all:
        - shimgvw.dll
        - ImageView_Fullscreen
        - http
      - CommandLine|contains|all:
        - comsvcs.dll
        - MiniDump
      filter_main_screensaver:
        CommandLine|contains: shell32.dll,Control_RunDLL desk.cpl,screensaver,@screensaver
      filter_main_parent_cpl:
        ParentImage: C:\Windows\System32\control.exe
        ParentCommandLine|contains: .cpl
        CommandLine|contains|all:
        - Shell32.dll
        - Control_RunDLL
        - .cpl
      filter_main_startmenu:
        ParentImage: C:\Windows\System32\control.exe
        CommandLine|startswith: '"C:\Windows\system32\rundll32.exe" Shell32.dll,Control_RunDLL "C:\Windows\System32\'
        CommandLine|endswith: .cpl",
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a download cradle, a macro-spawned shell, defense tampering, or reconnaissance — may reveal how this rundll32 invocation came about and help reconstruct the timeline. If the matched pattern was comsvcs MiniDump, look especially for the access and lateral-movement activity that typically surrounds credential dumping.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
