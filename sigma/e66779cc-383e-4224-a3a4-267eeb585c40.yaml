    - hint: "logsource 'network_connection' (recommended by techniques: T1218.003) is not covered -- pull in cue_network_endpoint.* or author a custom question with `category: network_connection`"
      disposition: declined
      reason: >-
        The remote-.INF-fetch network angle is real, but cmstp.exe is not a
        reliable network-connection emitter and the fetch is short-lived and
        URL-driven; the executed-content evidence is more precisely captured by
        the file-artifact staging question (TargetFilename .inf/.sct/.dll) and
        by decoding the URL argument in mechanism_decode. No compensating
        attack:T1218.003.network_connection question authored to stay within the
        18-question cap.
    - hint: "logsource 'process_access' (recommended by techniques: T1548.002,T1218.003) is not covered and no template family exists -- author a custom question with `category: process_access`"
      disposition: declined
      reason: >-
        process_access (Sysmon EID 10) for CMSTPLUA/CMLUAUTIL COM injection is
        rarely instrumented and high-noise. The COM auto-elevation mechanism is
        described in the clr_image_load question context, and the elevated-action
        question captures the high-integrity outcome the injection produces, so
        the analyst gets the behavior without a low-yield process_access sweep.
    - hint: "logsource 'registry_set' (recommended by techniques: T1548.002,T1218.003) is not covered -- pull in cue_registry_key.* or author a custom question with `category: registry_set`"
      disposition: declined
      reason: >-
        CMSTP's bypass path uses an .INF file and the CMSTPLUA COM interface, not
        a registry key, so the rule's specific detection logic does not stage in
        the registry. Co-occurring registry-based bypass methods (ms-settings,
        mscfile, DelegateExecute) are surfaced via the process_creation query in
        the registry-artifacts question, which is the analyst-relevant pivot for
        this rule.
    - hint: "logsource 'security' (recommended by techniques: T1548.002) is not covered and no template family exists -- author a custom question with `category: security`"
