name: Suspicious PowerShell Download and Execute Pattern
id: 57c70572-0b92-48be-8e82-ba851f326ce5
description: |
  Detects PowerShell command lines containing in-memory download-and-execute cradles -- IEX of a Net.WebClient DownloadString, or a DownloadFile call -- that pull remote script or payload content and run it without first writing a self-contained file to disk. Legitimately, some software installers and packaging tools fetch packages from remote systems and execute them this way. Maliciously, the same one-liner is the canonical loader for offensive PowerShell toolkits and second-stage payloads, often run directly in memory to limit on-disk evidence. The investigation should confirm the exact cradle that fired, identify the remote source and any payload written to disk, establish the launch context (parent process and user), and look for surrounding tampering, bypass, or follow-on activity.
type: detection
detection_id: e6c54d94-498c-4562-a37c-b469d8e9a275
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain the PowerShell download-and-execute cradle this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line against the rule's criteria -- an IEX of a Net.WebClient DownloadString, or a System.Net.WebClient DownloadFile call. Note which form fired, because an IEX cradle runs the fetched content in memory while DownloadFile writes a payload to disk first, and that distinction drives whether on-disk follow-up questions apply.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run command-line PowerShell downloaders that fetch and execute remote content?
  context: Legitimate administrative activity, software installers, and packaging tools can trigger this detection. Knowing whether the user role and host function are consistent with running PowerShell download cradles is often the fastest path to separating routine operations from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:powershell.encoded_command_decode
  question: What remote source does the cradle fetch, and what does the fetched content do once executed?
  context: This cradle is a plain-text download pattern, so the command line is already readable -- the analytical task is to identify the URL being fetched and what runs after it loads. For an IEX of a Net.WebClient DownloadString, the fetched script executes directly in memory; for a DownloadFile call, note both the source URL and the local destination path. Check the reputation of the source URL and determine what cmdlet or payload the cradle invokes after the download.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_artifact.mechanism_decode
  question: If a payload was written to disk, what is in it -- is it obfuscated, encoded, or a known offensive script?
  context: When the cradle uses DownloadFile or the in-memory script drops a secondary file, read and analyze that file's actual content. Check for base64 encoding, obfuscated strings, embedded URLs or IP addresses, PowerShell commands, and known offensive-tool string patterns. Content analysis answers what is in the file, which is distinct from a hash reputation lookup that only answers whether the file is already known.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how the cradle was invoked. Legitimate usage often has predictable parents -- explorer.exe for interactive use, an installer or packaging tool for software deployment. Unusual parents such as office applications, mshta.exe, wscript.exe, or a web-server process point to macro execution, script-host abuse, or post-exploitation rather than routine administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually executed, including the content pulled by an in-memory download cradle that never touched disk. It also exposes very long script blocks that a tuned length threshold might otherwise suppress, so it is the ground-truth source for what ran. If PowerShell operational logs are not ingested in this environment, treat the absence of results as a visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators frequently disable or bypass PowerShell controls before running a download cradle. Common precursors include AMSI bypass via in-memory patching, execution-policy changes such as an ExecutionPolicy Bypass or -ep bypass flag, and PowerShell version-2 downgrade to evade logging. Finding these events shortly before the cradle strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:download_tool.download_success_verification
  question: Was a payload actually written to disk, or did the download fail or stay in memory?
  context: A download command does not guarantee the file was retrieved -- network errors, blocked URLs, or security controls may have stopped the transfer, and an IEX cradle may execute entirely in memory with no file written. Confirming whether a file was created at the destination path establishes whether the activity progressed past delivery.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: What is the hash of any downloaded payload, and does threat intelligence already know it?
  context: If a downloaded file is still on disk, submitting its hash to threat intelligence services or detonating it in a sandbox reveals whether it is a known malicious payload, a legitimate tool, or something novel that needs deeper analysis. This reputation check answers whether the file is already known, which complements reading the file's content directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: template:download_tool.directory_activity
  question: What other file activity occurred in the download target directory?
  context: Download cradles often stage multiple files in the same directory, or the first file triggers further writes through extraction, decompression, or additional downloads. Examining directory-level file activity reveals the broader scope of the delivery operation beyond the single payload named on the command line.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      filter_self:
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection and not filter_self
    fields:
      - TargetFilename
      - Image
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell download cradles like this?
  context: Compare this user's current action against their historical behavior. A user who has never run command-line PowerShell downloaders is more suspicious than one who does so regularly as part of a known role such as packaging or deployment. User role and typical toolset should align with running remote-fetch cradles.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal such as SYSTEM or a computer account, user identity does not attribute the behavior, so the meaningful pivot is the launch mechanism -- which parent process spawned PowerShell and whether that pair is historically common. A new or rare parent for this binary is the deviation worth chasing; a pair that already accounts for thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar download or execution activity on other hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-binary combination fire on other hosts in the same window -- a coordinated automation rollout, or isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since every host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism -- parent process plus spawned binary -- fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the attack stages that preceded the download cradle and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: attack:T1059.001.time_correlation
  question: Did this cradle run inside a normal working or maintenance window for this host?
  context: Legitimate installer and packaging activity tends to cluster in business hours or scheduled maintenance windows, while hands-on-keyboard operator activity often lands off-hours. Comparing when the cradle fired against the host's normal PowerShell activity pattern helps calibrate suspicion -- an off-hours fetch-and-execute on a host that is otherwise quiet at that time is harder to explain as routine.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - IEX ((New-Object Net.WebClient).DownloadString
          - IEX (New-Object Net.WebClient).DownloadString
          - IEX((New-Object Net.WebClient).DownloadString
          - IEX(New-Object Net.WebClient).DownloadString
          - ' -command (New-Object System.Net.WebClient).DownloadFile('
          - ' -c (New-Object System.Net.WebClient).DownloadFile('
      condition: selection
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful signal that protection looks healthy, though kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
