name: PUA - Kernel Driver Utility (KDU) Execution
id: 856f3c7f-b414-4f5f-bc50-05fbaa694762
description: |
  Fires when a process named kdu.exe or hamakaze.exe (or carrying the
  hamakaze.exe original filename) runs with a KDU operation flag (-map, -prv,
  -dse, or -ps) on its command line. KDU is a bring-your-own-vulnerable-driver
  utility: it loads a known-vulnerable signed driver to gain arbitrary kernel
  read/write, then disables Driver Signature Enforcement (-dse), maps an
  unsigned "driverless" payload into the kernel (-map), selects a vulnerable
  provider (-prv), or tampers with a protected process object (-ps). Legitimate
  use is largely limited to driver development, hardware troubleshooting, or
  security research; in an unsanctioned context the same flags grant kernel-level
  code execution that can disable security controls, escalate privilege, and
  establish kernel persistence. Determine which operation ran, what driver or
  payload it touched, who launched it and from where, and whether security
  controls were weakened around the same time.
type: detection
detection_id: e76ca062-4de0-4d79-8d90-160a0d335eca
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Did the alerting process run KDU (kdu.exe / hamakaze.exe) with a -map, -prv, -dse, or -ps operation flag?
  context: Confirm the alert is a true positive. The rule fires only when both conditions hold together — the image is kdu.exe or hamakaze.exe (or the original filename is hamakaze.exe) AND the command line carries one of the KDU operation flags. Read the exact Image, OriginalFileName, and CommandLine and note which flag fired, since the flag determines what the tool actually did and which downstream questions carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a kernel driver utility?
  context: Driver development, hardware troubleshooting, and security research are the legitimate reasons to run KDU, and they are confined to a small set of engineering or lab hosts and operators. A standard workstation or server account running it is rarely consistent with role and is the fastest signal to separate sanctioned testing from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:service_persistence.service_configuration
  question: Did a driver or service get installed on this host around the alert, and what binary path does it execute?
  context: KDU loads its vulnerable provider driver and can register mapped payloads as kernel-mode services, so the service-install record is the structured evidence of what was placed on the host. The image path is the payload; paths in world-writable directories (C:\Users\Public, C:\Windows\Temp) or unsigned binaries registered as a service are the high-concern outcomes. The account the service runs under indicates the privilege level obtained.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- source: attack:T1543.003.driver_payload
  question: Which KDU operation ran and which driver or payload did it act on — was a .sys file mapped or was DSE disabled?
  context: The operation flag and its argument define the impact. -map loads an unsigned "driverless" payload (often a .sys path passed on the command line) into the kernel by overwriting an already-loaded victim module; -dse disables Driver Signature Enforcement so unsigned drivers can load; -prv selects which vulnerable provider driver to abuse (KDU ships providers such as RTCore64, DBUtil_2_3, Mimidrv, Dbk64); -ps tampers with a protected process object. Pull the full command line on this host and read the flag argument to identify the payload path, target process, or DSE value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - '-map '
          - '-prv '
          - '-dse '
          - '-ps '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1543.003.registry_service_path
  question: Was a driver service registered or modified under the Services registry hive on this host around the alert?
  context: Loading a kernel driver leaves a service definition under HKLM\System\CurrentControlSet\Services even when the install is driven by an API rather than sc.exe. New or modified driver-service keys — particularly ones pointing ImagePath at a .sys file in a user-writable directory or flipping a Start value to load at boot — are the registry-side artifact of the mapped or provider driver and reveal kernel persistence that the command line alone may not show.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\System\CurrentControlSet\Services\'
      selection_driver:
        - TargetObject|endswith: '\ImagePath'
        - TargetObject|endswith: '\Start'
        - TargetObject|endswith: '\Type'
      condition: selection and selection_driver
    fields:
      - TargetObject
      - Details
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned KDU, and is that parent chain expected?
  context: The parent reveals how KDU was invoked. A launch from an interactive shell, a remote-access or deployment tool, an Office application, or a script host (mshta.exe, wscript.exe, powershell.exe) points toward hands-on-keyboard or scripted abuse, whereas a developer or IT engineer launching it from explorer.exe or a build environment fits sanctioned testing. Walk up to the parent's own parent if the immediate parent is itself a generic shell.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this host run KDU before?
  context: A kernel driver utility that has never run on a host is far more concerning than one that appears regularly on a known engineering or lab system. Zero or very low historical counts over the window indicate first-time or rare execution and raise the priority of the operation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the KDU pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even on a host where KDU appears, the launch mechanism matters. This query mirrors the rule's exact selection — image plus operation flag — scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected account, or an unfamiliar command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \kdu.exe
        - \hamakaze.exe
      - OriginalFileName: hamakaze.exe
      selection_cli_suspicious:
        CommandLine|contains:
        - '-map '
        - '-prv '
        - '-dse '
        - '-ps '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did KDU spawn afterward?
  context: The processes KDU launches after gaining kernel access reveal its actual purpose. Spawning of cmd.exe, powershell.exe, certutil.exe, or other tooling points to post-exploitation chaining once driver signature enforcement is down or a payload is mapped; a clean tool that exits without spawning children fits a one-off troubleshooting run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Kernel-level tampering rarely stands alone. Activity surrounding the KDU execution may surface reconnaissance, credential access, additional driver drops, or persistence installation that frames the broader operation and tells the analyst whether this was an isolated test or one step in a multi-stage sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired the KDU pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's exact selection with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted or pushed deployment; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \kdu.exe
        - \hamakaze.exe
      - OriginalFileName: hamakaze.exe
      selection_cli_suspicious:
        CommandLine|contains:
        - '-map '
        - '-prv '
        - '-dse '
        - '-ps '
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \kdu.exe
        - \hamakaze.exe
      - OriginalFileName: hamakaze.exe
      selection_cli_suspicious:
        CommandLine|contains:
        - '-map '
        - '-prv '
        - '-dse '
        - '-ps '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \kdu.exe
        - \hamakaze.exe
      - OriginalFileName: hamakaze.exe
      selection_cli_suspicious:
        CommandLine|contains:
        - '-map '
        - '-prv '
        - '-dse '
        - '-ps '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints. If the same user drove KDU or related tooling on more than one host, the scope of the operation is larger than the single alerting machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \kdu.exe
        - \hamakaze.exe
      - OriginalFileName: hamakaze.exe
      selection_cli_suspicious:
        CommandLine|contains:
        - '-map '
        - '-prv '
        - '-dse '
        - '-ps '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding activity reveals what led to the KDU execution and what followed it, and whether it sits inside a larger sequence. Novel parent-child pairs stand out against the repetitive agent and OS telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded the KDU execution and help reconstruct the timeline. Driver-loading utilities are often run after an operator has already gained a foothold and is preparing to weaken kernel-level defenses.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
