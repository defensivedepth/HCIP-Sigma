name: Dllhost.EXE Execution Anomaly
id: 76fc36d0-e719-450b-8332-64a729f7d343
description: |
  Detects a dllhost.exe process that started with no command-line arguments. A legitimate
  COM Surrogate is launched by the DCOM service control manager with a 'dllhost.exe /Processid:{GUID}'
  argument that names the AppID/CLSID it hosts; a dllhost.exe with a bare command line and no
  /Processid GUID is atypical and is consistent with manually spawned COM-surrogate-style process
  injection or process hollowing into the signed dllhost.exe image. Investigation should confirm the
  missing /Processid argument, identify the parent that launched it, and check whether the process
  acquired handles to or loaded credential-access modules consistent with injection rather than normal
  COM hosting.
type: detection
detection_id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Did dllhost.exe start with no /Processid argument, exactly as this rule detects?
  context: Confirm the alert is a true positive by reviewing the triggering event. A legitimate COM
    Surrogate runs as 'dllhost.exe /Processid:{GUID}'; this rule fires only when the command line is a
    bare dllhost reference with no /Processid GUID. Verify the recorded CommandLine has no /Processid
    clause before investing further time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a COM Surrogate launched without a /Processid argument?
  context: A normal COM Surrogate is always started by the DCOM launcher with a /Processid GUID, so an
    argument-free dllhost.exe is not something a user or routine workload produces on purpose. Knowing
    the host role and the account the process ran under helps separate an unusual but explainable
    condition from operator-driven injection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the full dllhost.exe command line show, and is the /Processid GUID genuinely absent?
  context: The COM Surrogate's command line is the primary tell. A legitimate instance reads
    'dllhost.exe /Processid:{AppID-or-CLSID-GUID}'; the absence of that clause is the anomaly this rule
    keys on. Confirm no /Processid GUID is present and note any other tokens, since a hollowed or
    manually spawned dllhost typically carries only the bare image name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this dllhost.exe, and is that parent expected for a COM Surrogate?
  context: A legitimate COM Surrogate's parent is 'svchost.exe -k DcomLaunch -p', because COM activation
    runs over DCOM. Any other parent is the strongest single deviation here. Parents such as scrcons.exe,
    Office applications, script hosts, or an application updater point toward WMI-event-driven execution,
    side-loading, or injection rather than normal surrogate hosting.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1055.access_verification
  question: Did this dllhost.exe open a handle to lsass.exe or another sensitive process?
  context: Process injection and credential-access tradecraft built on a hollowed or injected dllhost.exe
    frequently acquire a handle into a target process. A read handle to lsass.exe is a classic
    credential-dumping indicator; handles into explorer.exe or other long-running hosts are typical
    injection targets. Review the granted access rights — read or VM-write masks on lsass.exe far exceed
    anything a real COM Surrogate would request.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        SourceImage|endswith: \dllhost.exe
      condition: selection
    fields:
      - TargetImage
      - GrantedAccess
      - CallTrace
      - SourceProcessGUID
- source: attack:T1055.tuning_parameter
  question: Did this dllhost.exe load credential-access or injection-related modules such as samlib.dll or vaultcli.dll?
  context: A genuine COM Surrogate loads the InProcServer32 DLL for the AppID it hosts and little else.
    Concurrent loads of samlib.dll and vaultcli.dll are a frequent credential-access fingerprint, and
    loads of unsigned or unexpected modules from user-writable paths point to injection into the signed
    dllhost.exe image. Review which modules were mapped and their signing status.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \dllhost.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- source: template:cue_process_tool.follow_on
  question: What child processes did this dllhost.exe spawn afterward?
  context: A normal COM Surrogate rarely spawns children. Subsequent processes such as cmd.exe,
    powershell.exe, certutil.exe, or rundll32.exe launched by this dllhost.exe reveal the operational
    impact of the injected code and point toward reconnaissance, download, or further execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run dllhost.exe, and how often?
  context: dllhost.exe runs routinely on most Windows hosts as the COM Surrogate, so raw frequency alone
    is not decisive — but a sharp change or a host that rarely sees it adds weight. Pair the count with
    the command-line and parent findings, since the anomaly is the missing /Processid argument, not the
    binary itself.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this argument-free dllhost.exe pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here rather than generic
    dllhost.exe usage. A new parent process or an unexpected account compared with that history is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dllhost.exe
        CommandLine:
        - dllhost.exe
        - dllhost
      filter_main_null:
        CommandLine: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does the account that owns this dllhost.exe normally run it across the environment?
  context: Compare the owning account's current activity against its historical pattern. dllhost.exe most
    often runs as SYSTEM via the DCOM launcher, so an interactive or service account suddenly owning an
    argument-free instance is a meaningful deviation. The user role and typical toolset should align with
    the activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-dllhost.exe combination historically routine on this host or across the environment, or is the parent unusual for it?
  context: When the alert fires under a service principal such as SYSTEM, user identity does not attribute
    behavior, so the meaningful pivot is the launch mechanism. A parent that already accounts for many
    prior dllhost.exe launches is OS or vendor automation; a new or rare parent for this binary is the
    deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this account do across the network around this time?
  context: Tracking the owning account's activity across all hosts reveals lateral movement or parallel
    activity on multiple endpoints. If the same account drove similar dllhost.exe activity elsewhere in
    the window, the scope of the activity may be broader than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-dllhost.exe combination fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, pivoting on user identity returns agent-telemetry noise because every
    host runs SYSTEM-owned processes constantly. The meaningful question is whether the same launch
    mechanism — the parent process spawning dllhost.exe — appeared on other hosts in the alert window.
    Multiple hosts point to scheduled or pushed automation, or to a multi-host operation; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the processes that ran just before and after the
    dllhost.exe anomaly reveals what triggered it and what followed, and whether it sits inside a larger
    sequence such as reconnaissance, privilege escalation, or persistence. Novel parent-child pairs at
    low counts are what to scan for against the high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this argument-free dllhost.exe pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count
    of this specific firing pattern rather than generic dllhost.exe usage. Many hosts firing the same
    pattern points to a scripted deployment or a broadly distributed trigger; one host or a small unrelated
    set points to manual operator activity. Use the host spread to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dllhost.exe
        CommandLine:
        - dllhost.exe
        - dllhost
      filter_main_null:
        CommandLine: null
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access —
    may reveal the stages that preceded this event and help reconstruct the timeline. Correlating the
    timing of those alerts with this dllhost.exe anomaly shows whether it is the next step in an ongoing
    sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes injection and credential access. The query surfaces direct attempts
    to disable AV/EDR services, flip protection flags, add broad exclusions, clear logs, or patch
    AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and
    in-memory patches will not appear here. Populated rows shift the disposition toward operator
    preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
