name: Arbitrary File Download Via MSEDGE_PROXY.EXE
id: 70c94889-985e-4013-80b3-5fc2f6aaed81
description: |
  Detects msedge_proxy.exe, a Microsoft-signed Edge helper, invoked with an http:// or https:// URL on its command line.
  The rule fires when both the binary (Image ending in msedge_proxy.exe or OriginalFileName msedge_proxy.exe) and a URL
  argument are present. This trusted binary can be used to retrieve arbitrary files from a remote URL, letting a download
  ride under a signed Microsoft process; the same binary can also launch a child process via its gpu-launcher argument.
  Legitimate use is essentially limited to browser-internal launches, so the investigation should confirm the command,
  identify the remote destination, establish whether a file landed, and determine what spawned the binary.
type: detection
detection_id: e84d89c4-f544-41ca-a6af-4b92fd38b023
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show msedge_proxy.exe invoked with an http:// or https:// URL?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process
    is msedge_proxy.exe (by Image or OriginalFileName) and its command line contains http:// or https://. Verify both the
    binary identity and the URL argument in the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to fetch remote URLs through msedge_proxy.exe?
  context: Legitimate msedge_proxy.exe activity is normally launched internally by the Edge browser, not by a user or script
    passing a raw URL. Knowing whether the user role and host function involve browser-helper automation is often the fastest
    path to separating routine activity from operator-driven download abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did msedge_proxy.exe do? Decode the full command line, the URL, and any launcher arguments.
  context: The full command line reveals the operation. Pull out the http/https URL being fetched and note any execution
    flags such as --gpu-launcher, which msedge_proxy.exe can use to run a child command under the signed binary. Suspicious
    argument structures include direct file URLs (archives, executables) and a gpu-launcher value wrapping a shell command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_network_endpoint.mechanism_decode
  question: What is the URL destination on the command line, and what do DNS, WHOIS, and threat intel reveal about it?
  context: Investigate the host in the http/https URL passed to msedge_proxy.exe. Check DNS resolution history,
    registration age, TLS certificate details, and known threat intelligence. Recently registered domains, raw IP
    destinations, or known malicious infrastructure point to attacker-controlled endpoints rather than a legitimate fetch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1218.image_load
  question: What modules did msedge_proxy.exe load, and do any look injected or unrelated to the Edge browser stack?
  context: Proxy execution through a trusted binary can be paired with loading attacker-supplied or unexpected modules.
    Reviewing the DLLs loaded by this msedge_proxy.exe instance distinguishes a normal Edge module set from sideloaded or
    unsigned modules. If image_load events are not collected in this environment, treat zero results as a visibility gap
    rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- source: template:cue_process_tool.process_chain
  question: What process spawned msedge_proxy.exe, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Browser-internal launches descend from msedge.exe or
    explorer.exe. Parents such as cmd.exe, powershell.exe, wscript.exe, mshta.exe, or an Office application indicate the
    binary was driven by a script or operator rather than normal browser activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:download_tool.download_success_verification
  question: Did a file land on disk that msedge_proxy.exe wrote shortly after the alert?
  context: A download command does not guarantee a file was retrieved. The rule captures the URL but not a destination path,
    so look for file-creation events authored by msedge_proxy.exe on this host just after the alert. A new file confirms the
    transfer progressed past delivery; no file may mean the fetch failed, was blocked, or fed an in-memory execution path.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.follow_on
  question: What child processes did msedge_proxy.exe spawn afterward?
  context: msedge_proxy.exe can launch a child command through its --gpu-launcher argument, executing it under the signed
    binary. Children such as cmd.exe, powershell.exe, or a freshly downloaded executable indicate the binary was used as an
    execution proxy rather than a simple fetch. Legitimate browser-helper activity does not spawn shells.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run msedge_proxy.exe with a URL on the command line?
  context: A binary invocation pattern that has never been seen on a host is more suspicious than one that recurs. Zero or
    very low historical counts for msedge_proxy.exe executions on this host indicate first-time or rare use of this binary.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert
    fit that pattern?
  context: Even signed binaries can be abused. The query mirrors the rule's selection (msedge_proxy.exe with an http/https
    URL) scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has run
    here before. A new parent, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msedge_proxy.exe
      - OriginalFileName: msedge_proxy.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's selection (msedge_proxy.exe with an http/https URL) with no host scope, giving a
    fleet-wide count of this firing pattern. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msedge_proxy.exe
      - OriginalFileName: msedge_proxy.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_network_endpoint.baseline
  question: Does this host normally communicate with this URL destination?
  context: First-time connections to a destination are more suspicious than routine traffic. Establishing whether this host
    has reached the URL's endpoint before helps separate new attacker infrastructure from an already-trusted enterprise
    domain. Destinations that resolve to known-good corporate services are candidates for an allowlist.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msedge_proxy.exe
      - OriginalFileName: msedge_proxy.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msedge_proxy.exe
      - OriginalFileName: msedge_proxy.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than this single
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msedge_proxy.exe
      - OriginalFileName: msedge_proxy.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, additional
    downloads, or staging that accompanied the msedge_proxy.exe invocation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
