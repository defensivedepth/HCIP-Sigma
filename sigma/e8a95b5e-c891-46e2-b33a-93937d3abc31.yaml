  skipped_templates:
    - template: obfuscation.encoded_payload_decode
      reason: "replaced_by: powershell.encoded_command_decode (Q9) — the PowerShell-specific decode is more precise for the script engine this CHM chain reaches"
    - template: cue_process_tool.scope
      reason: "fleet-wide rule-pattern count is delivered by initial_access.campaign_scope (Q18), which correlates this detection across hosts/users; the reflected fleet scope would duplicate that cross-host view without adding a distinct angle"
    - template: cue_process_tool.clustering
      reason: "host-wide concurrent-tool view is covered by lolbin.technique_class_lateral (Q15) which targets the proxy-execution/download binaries relevant to a CHM chain, more specific than an undifferentiated host tool list"
    - template: cue_host_context.clustering
      reason: "concurrent host activity overlaps lolbin.technique_class_lateral (Q15) and the file/network follow-on questions (Q7/Q8); slot reallocated to file_event and network_connection coverage the logsource hints call for"
    - template: cue_host_context.precursor
      reason: "prior-alert timeline is partly covered by campaign_scope (Q18); the CHM-proxy chain is an initial-access primitive where the delivery vector (Q5) and dropped-file/network follow-on are higher-value than a generic prior-alert sweep within the 18-question cap"
    - template: powershell.script_block_logging
      reason: "the rule fires on hh.exe, not powershell.exe; script-block (4104) coverage is only useful if a PowerShell child actually ran, which the follow_on (Q6) and encoded_command_decode (Q9) questions establish first — pulling the 4104 logsource unconditionally adds a question that returns nothing on the common cmd/mshta/wscript child paths"
    - template: powershell.powershell_security_bypass
      reason: "AMSI/execution-policy bypass precursor is a PowerShell-specific angle; this rule's payload may reach mshta, wscript, or cmd rather than PowerShell, and the bypass sweep would return nothing on those paths. Encoding/obfuscation of any PowerShell child is covered by encoded_command_decode (Q9)"
    - template: initial_access.application_patch_status
      reason: "no exploited application — hh.exe is a trusted help viewer being abused as a proxy-execution primitive, not a vulnerable app whose patch level confirms exploitability; CHM proxy execution does not depend on an unpatched CVE"
    - template: universal.endpoint_protection_health
      reason: "recommended (not must_include); this is an initial-access/proxy-execution rule, not a credential-access or impact action an operator would typically precede by disabling AV/EDR. Tamper-as-precursor is not a live triage question for a CHM-open event, and the delivery/payload follow-on questions carry the disposition"
  reflection_overrides: []
  hint_dispositions:
    - hint: "logsource 'image_load' (recommended by techniques: T1059.001,T1059.003,T1059.005,T1059.007,T1218,T1218.001,T1218.010,T1218.011) is not covered — pull in cue_image_load.* or author a custom question with `category: image_load`"
      disposition: declined
      reason: >-
        The rule fires on hh.exe's CommandLine path tokens, i.e. proxy execution
        of a CHM container. The investigative signal for that behavior is the
        child process hh.exe spawns (Q6 follow_on), the files it stages (Q7
