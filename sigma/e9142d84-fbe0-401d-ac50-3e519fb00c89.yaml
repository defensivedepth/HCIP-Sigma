name: WhoAmI as Parameter
id: 5d6f0b3e-7c4a-4f2a-9c1e-3a8e2b7d4f10
description: |
  Detects a process command line that contains the substring ".exe whoami" -- that is, an executable invoked with whoami passed directly as a parameter rather than whoami.exe being launched on its own. This shape appears in token-impersonation exploit tooling, where an exploit binary runs whoami immediately after impersonating a privileged token to confirm the new identity, and in wrapper or launcher commands that chain user-discovery into a single line. Legitimate scripts and management tools occasionally embed whoami this way, so the investigation should determine which executable ran the command, what identity it resolved, what spawned it, and whether the activity sits inside a broader burst of enumeration on the host.
type: detection
detection_id: e9142d84-fbe0-401d-ac50-3e519fb00c89
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain an executable followed directly by the whoami parameter, as this rule detects?
  context: >-
    Confirm the alert is a true positive before investing investigation time. The rule fires when a command line contains
    the substring ".exe whoami" -- an executable invoked with whoami passed as a parameter, rather than whoami.exe running
    standalone. Read the full command line and identify which executable carried the whoami argument and how the rest of
    the line is structured.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What was the full command, which executable carried the whoami argument, and what else did the line do?
  context: >-
    The full command line reveals the operation. Identify the executable that ran whoami as a parameter, any flags or
    chained subcommands on the same line (output redirection, additional enumeration, a follow-on command), and whether
    the executable is a known tool or an unfamiliar binary. Token-impersonation tooling typically runs whoami right after
    impersonating a privileged identity to confirm the switch succeeded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
- source: template:discovery_recon.discovery_user_context
  question: Is this user and host expected to run user-identity discovery commands?
  context: >-
    Administrators and IT staff legitimately check identity during troubleshooting, and some management scripts embed
    whoami. Standard users and most servers rarely need to resolve their own token this way, and an executable passing
    whoami as a parameter is more unusual than an interactive whoami. The user's role and the host's function determine
    whether this is routine or anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned the command that ran whoami as a parameter, and is that parent chain expected?
  context: >-
    The parent process shows how the command was initiated and is the key signal for whether enumeration originated from
    an interactive shell, a service, or a non-interactive launcher. Discovery commands spawned by script interpreters
    (wscript.exe, cscript.exe, mshta.exe), Office applications, wmiprvse.exe, or wsmprovhost.exe point to automated or
    remote post-exploitation; a parent that is itself an unfamiliar executable matching the alerting command is the case
    that warrants the most weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single identity check may be benign, but multiple enumeration commands in rapid succession -- whoami, ipconfig,
    net user, systeminfo, nltest -- is a signature of post-compromise enumeration. An executable invoking whoami alongside
    a burst of native recon binaries strengthens the case that an operator is surveying the host before the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even routine tooling can embed whoami. The query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how the ".exe whoami" pattern has historically run here -- not generic whoami
    usage. A new parent process, an unexpected user account, or an unfamiliar executable carrying the argument is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: .exe whoami
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the ".exe whoami"
    pattern. Many hosts firing the same pattern points to a script or management tool that embeds whoami; one host or a
    small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: .exe whoami
      condition: selection
    fields:
    - host.name
- source: template:cue_process_tool.follow_on
  question: What child processes did the command that ran whoami spawn afterward?
  context: >-
    The processes spawned by the alerting command reveal its actual impact. A line that resolves identity and then chains
    into credential access, lateral movement, or further enumeration is far more concerning than an isolated identity
    check. Walk the children of the alerting process to see whether discovery led directly to a follow-on action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run identity-discovery commands of this shape across the environment?
  context: >-
    Compare this user's current action against their historical behavior across all hosts. A user who has never run an
    executable that passes whoami as a parameter is more suspicious than an administrator who does so routinely. The
    user's role and typical toolset should align with this kind of identity check.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains: .exe whoami
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-command combination historically routine on this host or environment-wide, or is the parent unusual for this pattern?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is the
    launch mechanism. A new or rare parent process for the ".exe whoami" pattern on this host or environment-wide is the
    deviation worth chasing, while a parent that already accounts for many prior events is vendor or management automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains: .exe whoami
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the identity-discovery activity is isolated or part of
    movement across multiple endpoints. The same user driving similar activity on several hosts widens the potential
    scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent-and-command combination fire on other hosts in this window, indicating a coordinated rollout?
  context: >-
    Under a service principal, asking what the user did network-wide returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism -- parent process plus the ".exe whoami" pattern -- fired on other hosts
    in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        CommandLine|contains: .exe whoami
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the activity surrounding the alert reveals what led to this event and what
    followed, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence
    mechanisms appearing in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- defense tampering, exploitation, credential access -- may reveal the attack
    stages that preceded this identity check and help reconstruct the timeline. Token-impersonation tooling that runs
    whoami to confirm a privilege switch is frequently preceded by an exploitation or service-abuse alert.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
