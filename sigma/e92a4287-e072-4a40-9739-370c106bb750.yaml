name: HackTool - SOAPHound Execution
id: 95e0ad05-5659-4058-a9f2-af6af2975222
description: |
  Detects execution of SOAPHound, a .NET Active Directory data collector that enumerates domain
  objects over the ADWS protocol (TCP 9389) instead of LDAP, producing BloodHound-compatible output
  while avoiding LDAP-volume detections. The rule fires when a command line contains both a collection
  mode flag (--buildcache, --bhdump, --certdump, or --dnsdump) AND an output/cache flag (-c,
  --cachefilename, -o, or --outputdirectory). Legitimate hits are almost always authorized penetration
  tests or red-team engagements; otherwise this is bulk domain reconnaissance staged before lateral
  movement or privilege escalation, so the investigation should establish which collection mode ran,
  who ran it, and what data was written.
type: detection
detection_id: e92a4287-e072-4a40-9739-370c106bb750
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain both a SOAPHound collection-mode flag and an output or cache flag?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only
    when the command line carries both a collection mode (--buildcache, --bhdump, --certdump, or --dnsdump)
    and an output or cache argument (-c, --cachefilename, -o, or --outputdirectory). Verify both elements
    are present in the alerting event before investing further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.authorized_engagement
  question: Is this SOAPHound execution part of an authorized penetration test or red team engagement?
  context: SOAPHound is an offensive AD-collection tool used in authorized security assessments. Before
    investing investigation time, check whether a pentest or red-team exercise is currently active on this
    host or network segment. An authorized engagement with matching tool usage and timing resolves the
    alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run domain-wide Active Directory enumeration?
  context: Domain administrators and identity-team staff may legitimately enumerate AD for audits or
    migrations. Standard users and most service accounts have no reason to perform a full domain object
    dump. The user's role and typical behavior baseline determine whether this collection is routine or
    anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did this invocation do? Decode the full SOAPHound command line.
  context: The full command line reveals the specific collection performed. Decode the mode flag, the cache
    and output paths, and any authentication or scoping overrides (--user, --password, --domain, --dc,
    --autosplit, --threshold, --nolaps). The output and cache paths point to the JSON files written to disk;
    --autosplit with --threshold indicates the operator expected a large domain. This query returns every
    SOAPHound-pattern command line on this host in the window, since the three-step workflow (buildcache,
    then bhdump, then certdump or dnsdump) often spans multiple sequential invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains:
        - ' --buildcache '
        - ' --bhdump '
        - ' --certdump '
        - ' --dnsdump '
      selection_2:
        CommandLine|contains:
        - ' -c '
        - ' --cachefilename '
        - ' -o '
        - ' --outputdirectory'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:hacking_tool.tool_capability_used
  question: Which SOAPHound collection mode was invoked?
  context: SOAPHound has four collection modes that determine the scope of data exposed. --buildcache maps
    every domain object's SID, DN, and ObjectClass and is a prerequisite for the others. --bhdump collects
    Users, Groups, Computers, Domains, GPOs, and Containers with their ACL and membership relationships.
    --certdump collects AD CS CAs and certificate templates, enabling certificate-abuse path analysis.
    --dnsdump exports AD-integrated DNS records. The mode present in the alerting command line tells you
    which data set was targeted and the response scope required.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned SOAPHound, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. SOAPHound is designed for in-memory
    execute-assembly use from C2 frameworks, so unusual parents such as script interpreters
    (wscript.exe, cscript.exe, mshta.exe), Office applications, wmiprvse.exe, or wsmprovhost.exe point to
    automated post-exploitation rather than an operator running it from an interactive shell.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: attack:T1087.network_indicators
  question: Did this host make outbound connections to a domain controller on the ADWS port around the alert time?
  context: SOAPHound collects over Active Directory Web Services, which runs on TCP 9389 on every domain
    controller, rather than LDAP on 389/636. Confirming an outbound 9389 connection from this host to a DC
    in the alert window corroborates that collection actually executed and identifies which DC was queried.
    Absence of network telemetry on 9389 does not clear the alert; it may indicate the connection was not
    captured.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort: 9389
        Initiated: true
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - Image
- source: template:cue_process_tool.baseline
  question: Has this host run SOAPHound's command-line pattern before?
  context: A pattern that has never been seen on a host is more notable than one that recurs. Because the
    rule matches a flag pattern rather than a fixed binary name, this query counts prior firings of the
    same collection-and-output flag combination on this host. Zero or very low historical counts indicate
    first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains:
        - ' --buildcache '
        - ' --bhdump '
        - ' --certdump '
        - ' --dnsdump '
      selection_2:
        CommandLine|contains:
        - ' -c '
        - ' --cachefilename '
        - ' -o '
        - ' --outputdirectory'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the SOAPHound pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even legitimate AD-audit tooling leaves a baseline. The query mirrors the rule's selection scoped
    to this host, so the resulting parent and user distribution reflects how this specific firing pattern
    has historically run here. A new parent process, an unexpected user account, or an unusual command structure
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains:
        - ' --buildcache '
        - ' --bhdump '
        - ' --certdump '
        - ' --dnsdump '
      selection_2:
        CommandLine|contains:
        - ' -c '
        - ' --cachefilename '
        - ' -o '
        - ' --outputdirectory'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery action may be legitimate troubleshooting, but several reconnaissance commands
    in rapid succession is a signature of post-compromise enumeration. AD-focused tooling such as adfind,
    csvde, ldifde, dsquery, nltest, and setspn alongside the SOAPHound collection points to a broader
    discovery stage rather than an isolated event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context — what led to this collection and what happened after — and whether it is part of a larger
    sequence such as credential access, persistence, or staging of the collected output for exfiltration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains:
        - ' --buildcache '
        - ' --bhdump '
        - ' --certdump '
        - ' --dnsdump '
      selection_2:
        CommandLine|contains:
        - ' -c '
        - ' --cachefilename '
        - ' -o '
        - ' --outputdirectory'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains:
        - ' --buildcache '
        - ' --bhdump '
        - ' --certdump '
        - ' --dnsdump '
      selection_2:
        CommandLine|contains:
        - ' -c '
        - ' --cachefilename '
        - ' -o '
        - ' --outputdirectory'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered related activity on multiple hosts, the scope of
    compromise may be larger than a single collection event.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains:
        - ' --buildcache '
        - ' --bhdump '
        - ' --certdump '
        - ' --dnsdump '
      selection_2:
        CommandLine|contains:
        - ' -c '
        - ' --cachefilename '
        - ' -o '
        - ' --outputdirectory'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the SOAPHound pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    the SOAPHound firing pattern. Many hosts firing the same pattern points to scripted deployment or a
    sanctioned audit; one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains:
        - ' --buildcache '
        - ' --bhdump '
        - ' --certdump '
        - ' --dnsdump '
      selection_2:
        CommandLine|contains:
        - ' -c '
        - ' --cachefilename '
        - ' -o '
        - ' --outputdirectory'
      condition: all of selection_*
    fields:
    - host.name
- source: template:hacking_tool.tool_specific_artifacts
  question: Were SOAPHound output files written to disk on this host after execution?
  context: SOAPHound writes its results as BloodHound-compatible JSON — typically Users.json, Groups.json,
    Computers.json, Domains.json, GPOs.json, and Containers.json for a BloodHound dump, plus a cache file
    and DNS.txt for the other modes. Locating these files at the cache and output paths from the command
    line confirms collection completed and shows what data was staged, even if the process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.json'
          - 'cache.txt'
          - 'DNS.txt'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, credential access, or initial execution —
    may reveal the attack stages that preceded this collection and help reconstruct the timeline. Bulk AD
    enumeration is usually a mid-operation step, so prior alerts often mark how the operator gained their
    foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
