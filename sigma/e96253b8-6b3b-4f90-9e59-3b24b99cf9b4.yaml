name: HackTool - KrbRelay Execution
id: 9069932a-7438-4cb0-b0e4-1ddb6ffff336
description: |
  Detects execution of KrbRelay, a Kerberos relaying framework that triggers a
  SYSTEM-context COM marshalling round-trip to coerce local Kerberos authentication,
  captures the resulting AP-REQ ticket, and replays it against LDAP, SMB, or HTTP/EWS
  to perform privilege escalation, resource-based constrained delegation, shadow
  credential writes, password resets, secret dumping, or service installation. The
  rule fires when EITHER the process image or original filename matches KrbRelay
  OR any one of three command-line argument combinations (an -spn/-clsid/-rbcd set,
  a shadowcred/clsid/spn set, or an spn/session/clsid set) is present, so the
  investigation should first note which branch matched. From there, decode which
  relay action was requested, identify the targeted service and credential store,
  and trace any follow-on lateral movement or directory-object changes that the
  relayed authentication may have produced.
type: detection
detection_id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Did this process match on the KrbRelay image or original filename, or on one of the command-line argument sets, and which branch fired?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    triggering event. The rule fires on EITHER an Image or OriginalFileName of KrbRelay.exe OR any one
    of three CommandLine sets — an -spn/-clsid/-rbcd combination, a shadowcred/clsid/spn combination,
    or an spn/session/clsid combination. Note which branch matched, since a filename match alone is a
    weaker signal than a relay-argument match and the branch determines which downstream questions carry
    weight (relay-target and credential-store questions are load-bearing when an argument set fired).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a Kerberos relaying tool?
  context: KrbRelay is an offensive credential-access framework with no legitimate administrative use,
    so the relevant judgment is whether an authorized security assessment or sanctioned test range
    explains why this user and host would run it. A pentest host or lab segment may explain it; a
    production workstation or member server generally does not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this KrbRelay execution part of an authorized penetration test or red team engagement?
  context: Offensive tools like KrbRelay are used in authorized security assessments. Before investing
    investigation time, check whether a pentest or red team exercise is currently active on this host
    or network segment. An authorized engagement with matching tool usage and timing resolves the alert
    without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which KrbRelay relay action was invoked, and what target service and CLSID were specified?
  context: KrbRelay is multi-purpose — the same binary can write msDS-AllowedToActOnBehalfOfOtherIdentity
    for RBCD (-rbcd), write msDS-KeyCredentialLink for shadow credentials (-shadowcred), reset a
    password (-reset-password), add a group member (-add-groupmember), read LAPS or gMSA secrets
    (-laps / -gmsa), or open an interactive SMB console and dump secrets (-console / -secrets). Identify
    the -spn target service, the -clsid used for the COM coercion, and any -session argument that
    indicates a cross-session token was stolen, since these determine the scope of potential compromise.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.credential_target_identification
  question: What credential store or directory object did the relayed authentication target?
  context: Different KrbRelay actions target different stores — LDAP modifies directory objects
    (msDS-AllowedToActOnBehalfOfOtherIdentity for RBCD, msDS-KeyCredentialLink for shadow credentials,
    ms-Mcs-AdmPwd for LAPS, msDS-ManagedPassword for gMSA), while SMB relay can dump SAM/SYSTEM/SECURITY
    hive secrets via MS-RRP or install a service to run commands. Identifying the targeted store and the
    -spn service determines which accounts may be compromised and what remediation is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned KrbRelay and is that parent chain expected?
  context: The parent process reveals how the tool was launched. KrbRelay runs from a low-privileged
    user context, so a launch from an interactive shell, a script host, or a recently dropped binary
    points to hands-on operator activity. Walk up the tree to see what spawned the parent and what else
    the parent launched around the same time.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1558.003.tgs_request
  question: Were anomalous Kerberos service-ticket requests recorded on the domain controller around this time, especially RC4-encrypted ones?
  context: Kerberos relaying and ticket abuse surface in directory-service ticketing as service-ticket
    (TGS) requests, and RC4 encryption (ticket encryption type 0x17) in a modern AES environment is a
    common downgrade indicator. A burst of service-ticket requests from one account in a short window,
    or requests targeting high-privilege service accounts outside their normal pattern, corroborates the
    relay activity. If domain-controller Kerberos ticket events are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence nothing occurred.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4769
        TicketEncryptionType: '0x17'
      condition: selection
    fields:
      - TargetUserName
      - ServiceName
      - IpAddress
- source: attack:T1558.lsass_access
  question: Did any process open a handle to LSASS on this host around the time of the alert, and was that process expected?
  context: Kerberos ticket theft and forgery frequently involve a process reading LSASS memory to
    extract tickets or keys, so a handle opened to lsass.exe by anything other than known security
    tooling is worth scrutiny. Compare the accessing process and its granted-access rights against the
    set of processes that normally touch LSASS on this host. If process-access (handle) events are not
    collected in this environment, this query returns nothing by construction.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: \lsass.exe
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of a successful relay depends on the privilege of the targeted account and the
    relayed identity. KrbRelay coerces SYSTEM or a chosen logged-on user, so the relayed identity is
    often a computer account or a privileged session — cross-reference the -spn target, any -session
    user, and the targeted directory object against directory group memberships. Domain admin or
    computer-account compromise requires incident escalation; a standard user may only need monitoring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did KrbRelay spawn afterward?
  context: The processes spawned by the tool reveal its actual impact. SMB-relay modes can install a
    service that executes cmd.exe to add accounts or run arbitrary commands, so spawned command
    interpreters, account-management utilities, or service-related binaries shortly after KrbRelay runs
    point to a successful relay with hands-on follow-up.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has this KrbRelay binary run on this host before?
  context: A process executable that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts for this binary indicate first-time execution, which
    is the expected profile for a freshly dropped offensive tool.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the KrbRelay pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent
    and user distribution reflects how this specific firing pattern has historically run here rather
    than generic binary usage. A new parent process, an unexpected user account, or a first-ever
    appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \KrbRelay.exe
      - OriginalFileName: KrbRelay.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' -spn '
        - ' -clsid '
        - ' -rbcd '
      selection_cli_2:
        CommandLine|contains|all:
        - shadowcred
        - clsid
        - spn
      selection_cli_3:
        CommandLine|contains|all:
        - 'spn '
        - 'session '
        - 'clsid '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \KrbRelay.exe
      - OriginalFileName: KrbRelay.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' -spn '
        - ' -clsid '
        - ' -rbcd '
      selection_cli_2:
        CommandLine|contains|all:
        - shadowcred
        - clsid
        - spn
      selection_cli_3:
        CommandLine|contains|all:
        - 'spn '
        - 'session '
        - 'clsid '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \KrbRelay.exe
      - OriginalFileName: KrbRelay.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' -spn '
        - ' -clsid '
        - ' -rbcd '
      selection_cli_2:
        CommandLine|contains|all:
        - shadowcred
        - clsid
        - spn
      selection_cli_3:
        CommandLine|contains|all:
        - 'spn '
        - 'session '
        - 'clsid '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across
    multiple endpoints. If the same user drove similar activity on multiple hosts, the scope of the
    intrusion may be larger than this single relay attempt.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \KrbRelay.exe
      - OriginalFileName: KrbRelay.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' -spn '
        - ' -clsid '
        - ' -rbcd '
      selection_cli_2:
        CommandLine|contains|all:
        - shadowcred
        - clsid
        - spn
      selection_cli_3:
        CommandLine|contains|all:
        - 'spn '
        - 'session '
        - 'clsid '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the KrbRelay pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic binary usage. Many hosts firing
    the same pattern points to a scripted deployment or sanctioned assessment sweep; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \KrbRelay.exe
      - OriginalFileName: KrbRelay.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' -spn '
        - ' -clsid '
        - ' -rbcd '
      selection_cli_2:
        CommandLine|contains|all:
        - shadowcred
        - clsid
        - spn
      selection_cli_3:
        CommandLine|contains|all:
        - 'spn '
        - 'session '
        - 'clsid '
      condition: 1 of selection_*
    fields:
    - host.name
