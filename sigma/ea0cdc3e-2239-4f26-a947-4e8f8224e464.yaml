name: Suspicious File Encoded To Base64 Via Certutil.EXE
id: b4056095-a687-4c78-b192-8f44ca1a2074
description: |
  Detects certutil.exe (or a binary whose OriginalFileName is CertUtil.exe) invoked with the -encode flag against a file whose extension is one of a suspicious set (.acl, .bat, .doc, .gif, .jpeg, .jpg, .mp3, .pdf, .png, .ppt, .tmp, .xls, .xml). The rule fires only when the certutil identity, the -encode flag, and a suspicious extension all appear in the same command line. certutil -encode turns arbitrary file content into Base64 text using a Microsoft-signed system binary with no encryption keys, no network calls, and no extra tooling; the same primitive is used legitimately for certificate handling but is abused to stage recon output for exfiltration, to obfuscate payloads on disk, and as a pseudo-ransomware effect that renders user files unreadable. Determine what file was encoded, where the Base64 output went, what process drove the invocation, and whether the encode was a one-off or part of a loop or staging sequence.
type: detection
detection_id: ea0cdc3e-2239-4f26-a947-4e8f8224e464
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show certutil run with the -encode flag against a file with one of the suspicious extensions?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule requires the certutil identity (Image ending in certutil.exe or OriginalFileName CertUtil.exe), the -encode flag, and one of the suspicious extensions (.acl, .bat, .doc, .gif, .jpeg, .jpg, .mp3, .pdf, .png, .ppt, .tmp, .xls, .xml) all in the same command. Note the source file being encoded and the output path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to Base64-encode files with certutil?
  context: certutil -encode has legitimate uses around certificate and data handling, but most users and endpoints never run it. Knowing whether the account role and host function are consistent with command-line Base64 encoding is often the fastest way to separate sanctioned activity from operator staging or obfuscation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:obfuscation.encoded_payload_decode
  question: What is the source file certutil encoded, what is the Base64 output path, and what does the source content turn out to be?
  context: certutil -encode takes a source file and writes a Base64 copy to an output path; both appear in the command line as the first and second positional arguments. Identify the source file (its location and likely contents) and the output path. Staging recon output for exfiltration writes from temp or AppData paths; an obfuscated payload encodes an executable or script; a pseudo-ransomware effect encodes user documents in place and leaves Base64 copies alongside the originals. Read the source file if it is still on disk to confirm what was encoded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: How many certutil -encode invocations ran on this host in the same window, and do they form a single operation or a loop over many files?
  context: A single certutil -encode is one event; a recon-staging or pseudo-ransomware pattern drives certutil -encode repeatedly, once per enumerated file, often with output names sharing a fixed suffix. Listing every certutil execution on the host in a tight window around the alert shows whether this is an isolated encode or one iteration of a loop, and reveals the full set of source and output paths touched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned certutil, and is that parent chain expected?
  context: The parent process reveals how the encode was invoked. A user-driven action typically has explorer.exe or a console session as the parent, while cmd.exe or a script host (wscript.exe, mshta.exe) running a batch or macro points to scripted orchestration. Office applications, script hosts, or unsigned parents driving certutil are consistent with recon staging or payload obfuscation rather than administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:universal.evidence_preservation
  question: Is the Base64 output file still on disk for analysis?
  context: The encode writes a Base64 copy to the output path named in the command line. If that file still exists, it can be decoded back to the original content for review, hashed, or submitted for analysis. The presence of the output alongside an untouched original is the side-by-side artifact left by the pseudo-ransomware effect; its absence may mean a follow-on step deleted staged files after exfiltration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.follow_on
  question: What child processes did certutil spawn afterward?
  context: certutil performing a single encode normally spawns no children. Processes spawned by the same binary on this host after the alert can reveal follow-on staging — a shell deleting the cleartext source, a transfer utility moving the Base64 output, or further encoding iterations — that places the encode inside a larger operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was certutil executed from its expected System32 or SysWOW64 path?
  context: certutil running from outside System32 or SysWOW64 — a user temp directory, AppData, or a download folder — may indicate the binary was copied or renamed to evade path-based allowlists. The OriginalFileName field still reads CertUtil.exe even when the on-disk name was changed, so compare Image against OriginalFileName to spot a renamed copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.technique_class_lateral
  question: Were other encode or decode LOLBins used on this host recently?
  context: An operator who uses certutil to encode files often pairs it with the reverse direction or with adjacent cabinet and archive primitives. Finding certutil -decode, or expand, extrac32, or makecab being used to pack or unpack content on the same host strengthens the case that the encode is part of a staging or obfuscation workflow rather than an isolated event.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\esentutl.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously matched the rule's pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how this exact certutil -encode pattern has run here before — not generic certutil usage. A new parent process, an unexpected account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - .acl
        - .bat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .mp3
        - .pdf
        - .png
        - .ppt
        - .tmp
        - .xls
        - .xml
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - .acl
        - .bat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .mp3
        - .pdf
        - .png
        - .ppt
        - .tmp
        - .xls
        - .xml
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - .acl
        - .bat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .mp3
        - .pdf
        - .png
        - .ppt
        - .tmp
        - .xls
        - .xml
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the account's activity across all hosts reveals lateral movement or coordinated activity on multiple endpoints. If the same user triggered similar encoding or staging actions elsewhere, the scope of the activity may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - .acl
        - .bat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .mp3
        - .pdf
        - .png
        - .ppt
        - .tmp
        - .xls
        - .xml
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining surrounding activity reveals what led to the encode and what followed it — file enumeration, recon commands, or transfer utilities. Aggregating by parent and child collapses repetitive agent telemetry into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host matched the rule's certutil -encode pattern over the past 90 days, and what command-line structures are typical?
  context: A certutil -encode pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this exact pattern rather than generic certutil usage. The command-line projection lets typical source and output path patterns be compared against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - .acl
        - .bat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .mp3
        - .pdf
        - .png
        - .ppt
        - .tmp
        - .xls
        - .xml
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts matched the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this certutil -encode pattern rather than generic certutil usage. Many hosts matching the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      selection_extension:
        CommandLine|contains:
        - .acl
        - .bat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .mp3
        - .pdf
        - .png
        - .ppt
        - .tmp
        - .xls
        - .xml
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, defense tampering, or credential access — may reveal the stages that preceded the encode and help reconstruct the timeline. Recon staging often follows file and directory enumeration; the alert timeline helps distinguish an isolated action from one step in a sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
