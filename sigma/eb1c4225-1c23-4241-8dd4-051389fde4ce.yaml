      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1003.001
      covered_by: Q6
      source: attack:T1003.001.dump_artifact
      coverage_type: direct
    - dimension: access_verification
      technique: T1003.001
      covered_by: Q5
      source: attack:T1003.001.access_verification
      coverage_type: direct
    - dimension: command_analysis
      technique: T1003.001
      covered_by: Q4
      source: template:credential_access.credential_target_identification
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1003.001
      covered_by: Q7
