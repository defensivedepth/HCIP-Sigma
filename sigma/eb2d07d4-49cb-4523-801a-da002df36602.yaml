name: HackTool - EDRSilencer Execution
id: 5b2b2310-316c-41c6-8ac6-99671b810666
description: |
  Detects execution of EDRSilencer, a tool that abuses the Windows Filtering Platform (WFP) to install
  filters blocking the outbound network traffic of running EDR agent processes, so those agents keep running
  locally but cannot deliver alerts to their management servers. The rule fires when the process image ends
  in EDRSilencer.exe, the PE OriginalFileName is EDRSilencer.exe, or the PE Description contains EDRSilencer
  — any one of these PE-metadata markers matches, so a renamed binary still trips on its embedded metadata.
  Execution requires administrative privileges, so the investigation should determine which EDR products were
  targeted, whether the silencing was applied broadly (blockedr) or to a single binary path (block), and what
  activity followed once telemetry was suppressed.
type: detection
detection_id: eb2d07d4-49cb-4523-801a-da002df36602
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does this process match EDRSilencer by image name, PE OriginalFileName, or PE Description?
  context: Confirm the alert is a true positive before investing time. The rule matches on any one of three
    PE-metadata markers — an image path ending in EDRSilencer.exe, an OriginalFileName of EDRSilencer.exe, or
    a Description containing EDRSilencer. Note which marker matched; an image name that does not end in
    EDRSilencer.exe while OriginalFileName or Description still match means the binary was renamed on disk but
    carries its original PE metadata, which is itself an evasion attempt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run EDR-management or WFP-filter tooling with administrative rights?
  context: EDRSilencer requires an administrative token to create WFP filters. Legitimate administrative work
    rarely involves a tool whose only purpose is to block EDR outbound traffic, so a user or host with no EDR
    or firewall-administration role makes a routine explanation unlikely. Knowing whether the account and host
    function fit the action is often the fastest way to separate a real intrusion from sanctioned testing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this EDRSilencer execution part of an authorized penetration test or red team engagement?
  context: EDRSilencer is an offensive tool used in adversary-emulation exercises. Before deeper analysis,
    check whether a sanctioned assessment is active on this host or network segment. An authorized engagement
    whose scope, host, and timing match resolves the alert without further work; absence of any such engagement
    keeps the disposition open.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.what_was_disabled
  question: What EDR products and silencing mode did this execution target?
  context: The command line reveals the operating mode. The blockedr argument enumerates running processes and
    installs WFP filters against every EDR agent it recognizes, while block followed by an absolute path silences
    a single named binary. unblockall or unblock with a filter ID reverses filters instead. Parse the arguments
    to determine whether telemetry was suppressed broadly or for one target, since that scopes which agents lost
    their reporting path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which EDRSilencer subcommand was invoked, and against what target?
  context: EDRSilencer is multi-mode. blockedr applies filters against a hardcoded list of known EDR agent
    process names; block "C:\path\to\binary.exe" silences a single arbitrary binary, which lets an operator
    suppress a telemetry-emitting LOLBin rather than an EDR agent; unblockall and unblock <filter id> remove
    filters. The specific subcommand and any path argument determine which processes lost outbound network
    reporting and therefore the visibility gap to expect.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1562.process_identification
  question: Does the on-disk image name match the PE OriginalFileName and Description, or was the binary renamed?
  context: The rule matches on PE metadata as well as the image name, so a binary renamed on disk still trips the
    OriginalFileName and Description markers. A mismatch — an image whose filename is not EDRSilencer.exe while
    OriginalFileName is EDRSilencer.exe or Description contains EDRSilencer — indicates the operator renamed the
    file to blend in. This distinguishes the tool's true identity from its on-disk presentation and confirms
    whether a rename-based evasion is in play.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
- source: template:defense_tampering.protection_status
  question: Are the targeted EDR agents reporting again, or are WFP filters still blocking their outbound traffic?
  context: WFP filters created by this tool are persistent and survive reboots until explicitly removed, so the
    affected agents may still be unable to deliver alerts even though they appear to be running locally. Verify
    current status by enumerating WFP state on the host (administrators can list filters and dump state), and
    confirm the agents are delivering telemetry again before treating protection as restored.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned EDRSilencer, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. A user shell or interactive session points to
    hands-on-keyboard operation; an unusual parent such as a script host, an Office application, or a remote
    execution service points to delivery through another stage. This tool is also designed for in-memory PE
    execution from a C2 framework, in which case the parent may be a generic host process rather than the tool
    on disk. Walking up from the parent shows what else that ancestor launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after EDR telemetry was suppressed?
  context: Telemetry is silenced to enable actions that would otherwise be reported — credential access, payload
    execution, lateral movement, or staging. Examine process activity in the window after the filters were
    installed, keeping in mind that activity against the silenced agents may itself be missing from EDR-sourced
    telemetry. A burst of new processes following the silencing points to the operation the suppression was meant
    to hide.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \EDRSilencer.exe
      - OriginalFileName: EDRSilencer.exe
      - Description|contains: EDRSilencer
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \EDRSilencer.exe
      - OriginalFileName: EDRSilencer.exe
      - Description|contains: EDRSilencer
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the acting account across all hosts in the alert window reveals whether the silencing was an
    isolated act or one step in broader activity. The same user driving similar actions on multiple endpoints
    widens the likely scope of the operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \EDRSilencer.exe
      - OriginalFileName: EDRSilencer.exe
      - Description|contains: EDRSilencer
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users drove it, and does this alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has run here historically rather than generic binary
    usage. A new parent process, an unexpected account, or a first-ever appearance of the pattern is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \EDRSilencer.exe
      - OriginalFileName: EDRSilencer.exe
      - Description|contains: EDRSilencer
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted
    deployment; one host or a small unrelated set points to manual operator activity. Use the host distribution
    and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \EDRSilencer.exe
      - OriginalFileName: EDRSilencer.exe
      - Description|contains: EDRSilencer
      condition: selection
    fields:
    - host.name
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense-tampering actions performed on this host around the same time?
  context: Operators who silence one control often weaken several — stopping or reconfiguring AV and EDR services,
    clearing event logs, deleting shadow copies, or changing firewall state — to maximize coverage. Multiple
    tampering events from the same account or parent process in the same window indicate several controls were
    targeted in one operation rather than an isolated administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Defense tampering rarely happens first. Earlier detections on the same host — reconnaissance,
    privilege escalation, credential access — may reveal the stages that preceded the silencing and help
    reconstruct the timeline. The sequence of prior alerts often shows what the operator was protecting.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
