name: Suspicious Runscripthelper.exe
id: f25796ec-967d-4fc3-a301-7b3a435f0588
description: |
  Detects execution of Runscripthelper.exe with the surfacecheck argument, the pattern used to run an arbitrary PowerShell script through this signed telemetry-client binary. The rule fires when the process image ends in \Runscripthelper.exe AND the command line contains surfacecheck. Runscripthelper.exe is a legitimate Windows component that ships with the unified telemetry client, but it can execute a target PowerShell script supplied as a .txt file, which bypasses constrained language mode and application-control policies that key on script-host or interpreter names. Confirm the full command line and the script path it loaded, identify the parent that invoked it and any child processes or network connections that followed, and determine whether the activity is isolated or part of a multi-stage operation on the host.
type: detection
detection_id: eca49c87-8a75-4f13-9c73-a5a29e845f03
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show Runscripthelper.exe running with the surfacecheck argument?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process image. The rule fires only when the image ends in \Runscripthelper.exe AND the command line contains surfacecheck. Confirm both conditions and note the script path that follows surfacecheck, since that argument identifies the PowerShell script the binary was asked to run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run Runscripthelper.exe to execute scripts?
  context: Runscripthelper.exe is a telemetry-client helper that is almost never invoked interactively, and the surfacecheck script-execution path is not part of routine end-user or administrative workflows. Knowing whether the user role and host function fit this activity is often the fastest way to separate a true positive from a rare but legitimate operation, and raises severity when the actor is a standard interactive user on a workstation rather than a server or maintenance account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did Runscripthelper.exe run? Decode the surfacecheck arguments and identify the script path.
  context: The full command line reveals the operational purpose. Parse the arguments after surfacecheck to identify the PowerShell script path Runscripthelper.exe was asked to execute, which typically points to a .txt file, and note the folder argument that follows it. Decode any encoded content, embedded URLs, or user-writable paths. This script-execution step is distinct from confirming the alert matched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned Runscripthelper.exe and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Legitimate telemetry-driven execution has predictable service-owned parents; an unusual parent such as a command interpreter, script host, Office application, or another LOLBin points to operator-driven abuse. Walk the chain upward to see what spawned the parent and what else that parent launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did Runscripthelper.exe spawn afterward?
  context: The processes spawned afterward reveal the actual impact of the script execution. Because Runscripthelper.exe runs a PowerShell script, look for follow-on powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe, curl.exe, or bitsadmin.exe, or processes that subsequently make external network connections. High-risk children indicate the script carried second-stage payload behavior rather than a benign check.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run Runscripthelper.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Runscripthelper.exe is rarely executed in normal operation, so zero or very low historical counts indicate first-time or rare execution worth scrutinizing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even signed system binaries can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern (Runscripthelper.exe with surfacecheck) has historically run here rather than generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Runscripthelper.exe
        CommandLine|contains: surfacecheck
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Runscripthelper.exe
        CommandLine|contains: surfacecheck
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Runscripthelper.exe
        CommandLine|contains: surfacecheck
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the event may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Runscripthelper.exe
        CommandLine|contains: surfacecheck
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic use of the binary. Many hosts firing the same Runscripthelper.exe surfacecheck pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity and to set the tuning baseline of utilities permitted in this environment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Runscripthelper.exe
        CommandLine|contains: surfacecheck
      condition: selection
    fields:
    - host.name
- source: attack:T1202.file_event
  question: What files did Runscripthelper.exe access or create around the time of execution?
  context: Runscripthelper.exe executes a PowerShell script supplied as a file, typically a .txt under a user-writable directory. Examine file activity tied to this execution to recover the script path the surfacecheck argument referenced, identify whether the script was newly written shortly before execution, and locate any files the script itself dropped. A script staged in a user-writable path immediately before execution is a stronger abuse signal than one in a controlled deployment location.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - CommandLine
- source: attack:T1202.network_connection
  question: Did Runscripthelper.exe or its child processes open outbound network connections after execution?
  context: Indirect command execution often chains into network activity when the executed script downloads a payload or establishes command and control. Check for outbound connections initiated by the binary or the processes it spawned, and compare any destinations against known-good egress for this host. Connections to unfamiliar external addresses shortly after the script ran shift the disposition toward second-stage activity.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the surrounding activity reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or other indirect-execution utilities running in the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
