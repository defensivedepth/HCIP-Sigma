name: Installation of WSL Kali-Linux
id: 0d0f465e-84cc-4797-9a94-79b876e40a0a
description: |
  Detects installation of the Kali Linux distribution through the Windows Subsystem for Linux. The rule fires when
  wsl.exe (by Image ending in \wsl.exe or OriginalFileName wsl) is run with an install flag (--install or -i) AND the
  command line contains kali — all three conditions must match. Kali under WSL brings a full Linux penetration-testing
  toolset onto a Windows host, so the investigation should confirm the exact command, establish who and what launched it,
  determine whether this is sanctioned security-team activity or an operator staging tooling, and look at what ran before
  and after.
type: detection
detection_id: eca8ae39-5c3c-4321-b538-9e64fe25822e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show wsl.exe run with an install flag (--install or -i) and the kali distribution named?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process
    is wsl.exe (by Image or OriginalFileName), an install flag (--install or -i) is present, AND the command line contains
    kali. Verify all three in the triggering event — the binary identity, the install flag, and the kali argument.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to install Kali Linux under WSL?
  context: Legitimate WSL Kali installs are normally limited to administrators or security teams provisioning a Linux
    testing environment. Knowing whether the user role and host function involve security tooling or developer workloads is
    often the fastest path to separating sanctioned provisioning from an operator staging an attack toolset.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did wsl.exe do? Decode the full command line and which distribution was requested.
  context: The full command line reveals the operation. Pull out the install flag (--install or -i), the named distribution
    (kali), and any version or registration switches such as --set-version, --set-default, or --web-download. Multiple
    sequential wsl.exe invocations on this host within the window often form one logical setup — feature enablement,
    distribution install, then first launch — so read them together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned wsl.exe, and is that parent chain expected?
  context: The parent process reveals how the install was invoked. A WSL install is typically driven from an elevated
    PowerShell or cmd.exe started by a user via explorer.exe. Parents such as wscript.exe, mshta.exe, an Office application,
    or a remote-management agent indicate the install was driven by a script or operator rather than an interactive
    administrator.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did wsl.exe spawn after the install?
  context: A completed Kali install lets the analyst observe what the toolset is used for. Children launched under wsl.exe —
    a Linux shell, package managers, or GUI helpers — show whether the environment was merely installed or actively used.
    Subsequent invocation of the kali command or post-install tooling shifts the disposition toward hands-on use rather than
    a one-time provisioning step.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run wsl.exe?
  context: A binary that has never been seen on a host is more suspicious than one that recurs. Zero or very low historical
    counts for wsl.exe on this host indicate first-time or rare use of the Subsystem for Linux, consistent with a fresh
    install rather than an established Linux workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert
    fit that pattern?
  context: Even sanctioned tooling can be abused. The query mirrors the rule's selection (wsl.exe with an install flag and
    kali) scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has
    run here before. A new parent, an unexpected user account, or an unusual command-line shape is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wsl_img:
      - Image|endswith: \wsl.exe
      - OriginalFileName: wsl
      selection_wsl_install:
        CommandLine|contains:
        - ' --install '
        - ' -i '
      selection_wsl_kali:
        CommandLine|contains: kali
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_wsl_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's selection (wsl.exe with an install flag and kali) with no host scope, giving a
    fleet-wide count of this firing pattern. Many hosts firing the same pattern points to scripted deployment or a
    standardized security-team image; one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wsl_img:
      - Image|endswith: \wsl.exe
      - OriginalFileName: wsl
      selection_wsl_install:
        CommandLine|contains:
        - ' --install '
        - ' -i '
      selection_wsl_kali:
        CommandLine|contains: kali
      condition: all of selection_wsl_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally install or run WSL distributions?
  context: Compare this user's current action against their historical behavior. A user who has never run wsl.exe is more
    suspicious than one who does so regularly. User role and typical toolset should align — a security engineer provisioning
    Kali is routine, a standard end user installing a penetration-testing distribution is not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+wsl.exe combination historically routine on this host or environment-wide, or is the parent
    unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot
    is the launch mechanism: which parent process spawned wsl.exe, and is that pair historically common. A new or rare
    parent for this binary is the deviation worth chasing; a pair already accounting for thousands of prior events is vendor
    or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user provisioned Kali or ran related tooling on multiple hosts, the scope of the activity may be larger than
    this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+wsl.exe combination fire on other hosts in the same window — is this a coordinated rollout
    or isolated to this host?
  context: Under a service principal, "what else did this user do across the network" returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — parent process plus spawned binary — fired on other hosts in
    the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Staging an offensive toolset is often preceded by weakening local protection. The query surfaces direct attempts
    to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a
    useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here.
    Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to
    identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, feature
    enablement, downloads, or staging that accompanied the WSL install.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the
    attack stages that preceded the WSL install and help reconstruct the timeline. Provisioning an offensive toolset late in
    an intrusion looks different from a developer installing Kali as a first action on a clean host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
