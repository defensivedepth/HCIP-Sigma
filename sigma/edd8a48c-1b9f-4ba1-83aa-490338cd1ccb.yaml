name: Renamed Jusched.EXE Execution
id: a4cba6cf-cf42-4d4b-9bb7-aa3776fbc0b0
description: |
  Detects a process whose PE Description metadata reads "Java Update Scheduler" or "Java(TM) Update Scheduler" while the on-disk
  filename is not jusched.exe. The rule fires when the Description selection matches AND the image is not named jusched.exe, which
  surfaces a copy of the Java Update Scheduler binary that has been renamed so its filename no longer matches its embedded metadata.
  The legitimate Java Update Scheduler ships as jusched.exe under C:\Program Files (x86)\Common Files\Java\Java Update\; a binary
  carrying that metadata under any other name is a masquerading artifact. Determine the binary's true identity from its metadata
  and hash, trace how it arrived on the host, and establish what it executed and whether the same renamed binary is present elsewhere.
type: detection
detection_id: edd8a48c-1b9f-4ba1-83aa-490338cd1ccb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process carry Java Update Scheduler metadata under a filename that is not jusched.exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the process Description
    is "Java Update Scheduler" or "Java(TM) Update Scheduler" and the on-disk filename is not jusched.exe. Confirm both halves
    hold for this event and note the actual filename on disk and its path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Description
- source: template:universal.host_user_context
  question: Is this user and host expected to run the Java Update Scheduler binary under a non-standard filename?
  context: Legitimate Java updating runs jusched.exe from C:\Program Files (x86)\Common Files\Java\Java Update\. A user or host
    that has no business running a renamed copy of that binary, or that is not a developer or packaging system that relocates
    vendor binaries, narrows the disposition toward a true positive quickly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: When a binary is renamed, the PE metadata (OriginalFileName) and code-signing details still reflect the original tool.
    Compare the Image path (the name on disk) against OriginalFileName and Description (which read jusched.exe / Java Update
    Scheduler) to confirm the mismatch. The signing party and signature status indicate whether this is a vendor-signed Oracle
    binary that was merely relocated, or an unsigned or differently signed file wearing Java metadata. Submit the hash for reputation
    lookup to determine whether it is the genuine Java Update Scheduler, a known malicious sample, or a novel binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did this renamed binary arrive on the host?
  context: 'Renamed binaries do not appear spontaneously -- they were copied, downloaded, or dropped by a parent process. Tracing
    the file creation event for this binary by basename over a long window reveals the delivery mechanism: a download tool,
    a dropper, manual copy via remote access, or lateral movement. A landing path outside C:\Program Files (x86)\Common Files\Java\Java
    Update\ -- especially a user-writable directory such as AppData, Temp, or a profile folder -- points to deliberate placement
    rather than a vendor install.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.mechanism_decode
  question: What were the full command line and working directory of the renamed binary at execution?
  context: The genuine Java Update Scheduler runs with characteristic update-check arguments from its install directory. Read
    the full command line and current directory to see whether the invocation matches expected Java updating behavior or whether
    the arguments and launch location are inconsistent with the metadata the binary advertises.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this binary and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. The genuine Java Update Scheduler is normally launched by
    the Windows scheduler or services infrastructure. Unusual parents such as mshta.exe, wscript.exe, an Office application,
    or an interactive shell point to scripted or operator-driven execution rather than a routine Java update.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: The purpose of renaming a binary is to evade detection while still performing its intended function. Examining the
    child processes, file operations, and network connections from this binary reveals its actual objective. The same renamed
    binary appearing on multiple hosts suggests deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run a binary with this name?
  context: A binary that has never been seen on a host is more notable than one that runs regularly. Zero or very low historical
    counts for this filename indicate first-time or rare execution, which is consistent with a one-off renamed-binary drop rather
    than a recurring legitimate tool.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's metadata-mismatch pattern, what parents and users drove it, and does
    the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host -- the resulting parent and user distribution
    reflects how this specific firing pattern (Java Update Scheduler metadata under a non-jusched.exe filename) has historically
    run here, not generic binary usage. A new parent process, an unexpected user account, or a first-ever appearance is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description:
        - Java Update Scheduler
        - Java(TM) Update Scheduler
      filter:
        Image|endswith: \jusched.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Renamed-binary execution is often one step in a longer sequence. Activity surrounding this event may reveal reconnaissance,
    credential access, lateral movement preparation, or persistence installation that provides broader context. Correlate the
    timing of those tools with this execution to reconstruct the local sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's metadata-mismatch pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the metadata-mismatch
    pattern (Java Update Scheduler metadata under a non-jusched.exe filename), not generic Java usage. Many hosts firing the
    same pattern points to a packaging or relocation step applied broadly; one host or a small unrelated set points to targeted
    placement. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description:
        - Java Update Scheduler
        - Java(TM) Update Scheduler
      filter:
        Image|endswith: \jusched.exe
      condition: selection and not filter
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description:
        - Java Update Scheduler
        - Java(TM) Update Scheduler
      filter:
        Image|endswith: \jusched.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description:
        - Java Update Scheduler
        - Java(TM) Update Scheduler
      filter:
        Image|endswith: \jusched.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on several hosts, the scope of the event may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description:
        - Java Update Scheduler
        - Java(TM) Update Scheduler
      filter:
        Image|endswith: \jusched.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the surrounding activity reveals the immediate context: what led to
    this event, what followed, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or
    persistence mechanisms appearing as novel parent-child pairs at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the attack
    stages that preceded this execution and help reconstruct the full timeline. Renamed-binary execution frequently follows
    initial access and precedes hands-on-keyboard activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
