name: PUA - Ngrok Execution
id: 5da9d7a1-58a3-4e98-943d-d2a8adb4177c
description: |
  Detects execution of ngrok, a reverse-tunneling utility that opens an outbound TLS connection to ngrok.io infrastructure
  and proxies inbound traffic back to a local port, exposing internal services such as RDP, SMB, WinRM, or HTTP to the public
  internet. The rule fires when the command line matches any one of several ngrok-usage patterns: a tcp tunnel to a
  remote-management port (139, 445, 3389, 5985, 5986), a config-driven "start --all" launch of all tunnels from a .yml file,
  ngrok.exe invoked with tcp/http/authtoken arguments, or any binary invoked with ".exe authtoken " / ".exe start --all".
  Ngrok has legitimate development and webhook-testing uses, but the same primitive is routinely used to bridge external
  operator access into a compromised host; investigation should determine whether the tunnel is authorized, what local
  service it exposes, and where it connects.
type: detection
detection_id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match one of the ngrok tunneling patterns this rule detects?
  context: >-
    The rule fires when the command line satisfies at least one of four independent patterns — a tcp tunnel to a
    remote-management port (139, 445, 3389, 5985, 5986), a config-driven start of all tunnels (start, --all, --config, .yml
    together), ngrok.exe with tcp/http/authtoken arguments, or any binary called with ".exe authtoken " or ".exe start
    --all". Confirm the alert is a true positive by reading the exact command line, and note which pattern fired, because the
    exposed port and tunnel mode determine which downstream questions carry the most weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a tunneling utility like ngrok?
  context: >-
    Legitimate ngrok use is concentrated on developer and test workstations exposing a local web app or webhook endpoint. A
    tunnel originating from a server, a domain controller, or a user with no development role is harder to explain and shifts
    the disposition toward unauthorized exposure. Confirm whether the user role and host function are consistent with running
    a reverse proxy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the full ngrok command line configure — which protocol, local port, and tunnel mode?
  context: >-
    The arguments reveal exactly what the tunnel exposes. "tcp 3389" forwards RDP, "tcp 445" forwards SMB, "tcp 5985/5986"
    forwards WinRM; "http <port>" exposes a local web service; "start --all --config <file>.yml" launches every tunnel
    defined in a config file, so the .yml is the authoritative description of what is exposed and which authtoken (and thus
    which ngrok account) is in use. Decode each argument to determine the protocol, the local port being bridged, and whether
    a config file or inline tunnel definition was used.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:remote_access_tool.tool_authorization
  question: Is this tunneling tool authorized for use on this host, and what business purpose does it serve?
  context: >-
    Organizations typically sanction a specific set of remote-access and tunneling tools. Ngrok exposes internal services to
    the public internet and is frequently introduced as shadow IT or dropped by an operator for persistent access, so an
    unsanctioned tunnel should be treated as unauthorized regardless of the tool's reputation. Determine whether ngrok is on
    the approved software list for this host and whether a documented use case exists.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there an approved development, testing, or maintenance use case explaining this tunnel?
  context: >-
    Legitimate tunnel usage usually correlates with an active support ticket, a scheduled maintenance window, or a developer
    request. If no such context exists for this session, the tunnel may have been started by an operator for external access
    or by a user circumventing perimeter controls. Check change-management and helpdesk records for a matching window.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What external endpoints did ngrok connect to from this host?
  context: >-
    The ngrok client opens an outbound TLS session to ngrok.io infrastructure (hostnames of the form <random>.ngrok.io or
    <num>.tcp.ngrok.io, or numeric backend IPs) and proxies inbound traffic back to the local port. Connections to ngrok.io
    relays confirm the tunnel established; the destination port and timing help correlate the tunnel session with any inbound
    activity that followed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1572.time_correlation
  question: Within minutes of the ngrok process starting, did this host see outbound connections with sustained or asymmetric data flow?
  context: >-
    Protocol tunneling shows up as a process that creates a tunnel and then sustains an outbound channel carrying
    encapsulated traffic, often with a large send/receive byte asymmetry as an internal service is relayed outward.
    Correlating the ngrok process-creation time with the surrounding network connections on this host confirms the tunnel was
    used, not merely launched, and surfaces the relay endpoints and any non-ngrok destinations that rode the same window.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- source: template:cue_process_tool.process_chain
  question: What process spawned ngrok, and is that parent chain expected?
  context: >-
    The parent process reveals how the tunnel was launched. A tunnel started directly by an interactive shell or a
    development tool differs sharply from one launched by a script host, an Office application, or a service — the latter
    parents point to scripted or operator-driven deployment. Walk up from the immediate parent to see what invoked it.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did ngrok spawn afterward on this host?
  context: >-
    Children of the tunneling process reveal its actual impact. A standalone tunnel typically spawns nothing of note;
    follow-on cmd.exe, powershell.exe, or other tooling alongside the tunnel suggests the host is being used interactively
    through the exposed channel rather than for a benign forwarding task.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this ngrok pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how this specific tunneling pattern has historically run here rather than generic binary usage. A new parent
    process, an unexpected account, or an unusual command shape relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - ' tcp 139'
        - ' tcp 445'
        - ' tcp 3389'
        - ' tcp 5985'
        - ' tcp 5986'
      selection2:
        CommandLine|contains|all:
        - ' start '
        - --all
        - --config
        - .yml
      selection3:
        Image|endswith: ngrok.exe
        CommandLine|contains:
        - ' tcp '
        - ' http '
        - ' authtoken '
      selection4:
        CommandLine|contains:
        - '.exe authtoken '
        - .exe start --all
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run ngrok across the environment?
  context: >-
    Compare this user's current action against their historical behavior. A user who has never launched a tunneling tool is
    harder to explain than one who does so as part of a known development workflow. Zero or very low historical counts
    indicate first-time or rare use for this account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and ngrok combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior — the meaningful pivot is
    the launch mechanism. Which parent process spawned ngrok, and is that pair historically common here. A new or rare parent
    for this binary is the deviation worth chasing; a pair that already accounts for many prior events is more likely vendor
    or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the tunnel?
  context: >-
    Tracking the user's activity across all hosts in the surrounding window reveals whether the tunnel is an isolated action
    or part of activity spanning multiple endpoints. The same account driving similar activity on several hosts widens the
    likely scope of the incident.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and ngrok combination fire on other hosts in the same window, indicating a coordinated rollout rather than isolated activity?
  context: >-
    Under a service principal, "what else did this user do" returns agent-telemetry noise because every host runs
    SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus
    spawned binary — fired on other hosts in the alert window. Multiple hosts point to scheduled or pushed automation; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this ngrok pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific
    tunneling pattern rather than generic use of the binary. Many hosts firing the same pattern points to scripted deployment
    or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - ' tcp 139'
        - ' tcp 445'
        - ' tcp 3389'
        - ' tcp 5985'
        - ' tcp 5986'
      selection2:
        CommandLine|contains|all:
        - ' start '
        - --all
        - --config
        - .yml
      selection3:
        Image|endswith: ngrok.exe
        CommandLine|contains:
        - ' tcp '
        - ' http '
        - ' authtoken '
      selection4:
        CommandLine|contains:
        - '.exe authtoken '
        - .exe start --all
      condition: 1 of selection*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the activity surrounding the tunnel shows what led up to it and what followed
    — reconnaissance, credential access, privilege escalation, or staging that provides broader context. Novel parent-child
    pairs at low counts are what to scan for against the high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A tunnel is often a mid-stage action. Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the stages that preceded external exposure and help reconstruct the timeline leading to
    the tunnel.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
