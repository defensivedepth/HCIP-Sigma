name: Suspicious File Execution From Internet Hosted WebDav Share
id: 09e11683-b887-4c4c-8fb2-c8a5c84caa4d
description: |
  Detects cmd.exe mounting a remote WebDAV share over HTTP with "net use" and, in the same command line, launching an
  executable, script, or library directly from the WebDAV UNC path via "start /b". The rule fires only when all three
  parts are present together: a cmd.exe (or Cmd.EXE OriginalFileName) process, the "net use http"/"& start /b"/DavWWWRoot
  combination, and a payload extension (.exe, .dll, .bat, .vbs, or .ps1). This pattern lets an actor execute internet-hosted
  content from a UNC path without first writing it to local disk, and is commonly seen as the action of a malicious .lnk
  shortcut. Legitimate WebDAV use exists but rarely chains a mount and an inline payload launch in one cmd line; investigate
  the parent that issued the command, the remote host being mounted, and what the launched payload did next.
type: detection
detection_id: f0507c0f-a3a2-40f5-acc6-7f543c334993
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line mount a WebDAV share with net use and launch a payload from the DavWWWRoot path in the same
    cmd.exe invocation?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires only when one cmd.exe command
    line contains all three parts together — a net use http mount, an "& start /b" launch, and the DavWWWRoot UNC marker —
    plus a payload extension (.exe, .dll, .bat, .vbs, or .ps1). Read the actual command line and confirm all parts are present
    rather than a coincidental substring match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to mount WebDAV shares and run content from remote UNC paths?
  context: Legitimate WebDAV use is uncommon on most endpoints and rarely takes the form of an inline mount-and-execute. Knowing
    whether this user role and host function ever access remote DAV shares this way is often the fastest way to separate a
    routine workflow from operator-delivered execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What is the full WebDAV command — which remote host is mounted, and which files are launched from the DavWWWRoot
    path?
  context: The command line carries the operational detail. Identify the host or IP in the net use http URL, every file launched
    by "start /b" from the DavWWWRoot path, and any arguments passed to those files. A decoy document launched alongside a
    payload binary, or a payload renamed to impersonate a known tool, is a common shape. This query scopes to other cmd.exe
    WebDAV-mount invocations on the same host in a tight window so multi-line orchestration is visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - ' net use http'
          - '& start /b '
          - \DavWWWRoot\
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this cmd.exe, and is that parent chain expected?
  context: The parent reveals how the WebDAV command was issued. A cmd.exe launched from explorer.exe shortly after a user
    opened a file, or from a script host, an Office application, or an archive utility, is consistent with a malicious .lnk
    or document delivery chain. Identify the parent and what spawned it to reconstruct the delivery path.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:powershell.encoded_command_decode
  question: For any payload launched from the WebDAV path, what is the source location and what does the launched content do?
  context: The launched files run directly from the remote UNC path rather than from local disk. If a .ps1 is launched, read
    its content or command line for download cradles, in-memory assembly loads, or reverse-shell logic. If an .exe or .dll
    is launched, note the file name and any arguments — a payload may impersonate a legitimate tool name. The remote host
    serving the content is the staging server and is a primary indicator for further scoping.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: If a PowerShell payload was launched from the WebDAV path, did script block logging capture what it executed?
  context: When the launched content is a .ps1, Windows Event ID 4104 records the deobfuscated script PowerShell actually ran,
    which is ground truth even if the command line is obfuscated. If PowerShell operational logs are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence nothing ran. Adjusting the captured script-block length threshold
    affects whether short scripts are recorded at all.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Inline execution of internet-hosted payloads is the kind of hands-on action an operator may precede by weakening
    protection. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions,
    clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering
    and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the
    parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.baseline
  question: Has this host ever run a cmd.exe WebDAV-mount-and-execute command before?
  context: A command shape that has never been seen on a host is more notable than one that recurs. This counts only cmd.exe
    invocations carrying the WebDAV mount-and-launch pattern over the past 90 days, so a zero or very low count points to first-time
    or rare use of this specific behavior rather than generic cmd.exe activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - ' net use http'
          - '& start /b '
          - \DavWWWRoot\
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this WebDAV-execution pattern, what parents and users normally drove it, and
    does the current alert fit?
  context: The query mirrors the rule's full selection structure scoped to this host, so the parent and user distribution reflects
    how this specific firing pattern — not generic cmd.exe usage — has historically run here. A new parent process, an unexpected
    user account, or an unusual command shape against that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \cmd.exe
      - OriginalFileName: Cmd.EXE
      selection_base:
        CommandLine|contains|all:
        - ' net use http'
        - '& start /b '
        - \DavWWWRoot\
      selection_ext:
        CommandLine|contains:
        - '.exe '
        - '.dll '
        - '.bat '
        - '.vbs '
        - '.ps1 '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this cmd.exe spawn after mounting the share?
  context: The processes spawned reveal the actual impact of the WebDAV launch. The payload executed from the DavWWWRoot path
    — and anything it spawns in turn — appears here. Look for an unexpected binary running from a UNC path, a download or staging
    tool, or post-exploitation interpreters. Cross-reference the time range with expected attack progression.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the WebDAV execution?
  context: Inline payload execution rarely stands alone. Activity in the surrounding window may reveal the delivery step that
    preceded it (an archive being opened, a shortcut launched) or follow-on reconnaissance, staging, or persistence that provides
    broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this WebDAV-execution pattern in the past week, and does the cross-host distribution look
    like automation or one-off activity?
  context: The query mirrors the rule's full selection structure with no host scope, giving a fleet-wide count of this specific
    firing pattern rather than generic cmd.exe usage. Many hosts firing the same pattern points to a scripted or pushed delivery
    reaching multiple endpoints; one host or a small unrelated set points to manual or targeted activity. Use the host distribution
    and parent consistency to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \cmd.exe
      - OriginalFileName: Cmd.EXE
      selection_base:
        CommandLine|contains|all:
        - ' net use http'
        - '& start /b '
        - \DavWWWRoot\
      selection_ext:
        CommandLine|contains:
        - '.exe '
        - '.dll '
        - '.bat '
        - '.vbs '
        - '.ps1 '
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally mount WebDAV shares or run command-line tools that pull content from remote UNC paths?
  context: Compare this user's current action against their historical behavior. A user who has never issued a WebDAV mount-and-execute
    command is more notable than one who does so as part of a known workflow. This counts the user running cmd.exe across all
    hosts over 90 days; combine the count with knowledge of the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-cmd.exe launch combination historically routine on this host or across the environment, or is
    the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute behavior — the meaningful pivot
    is the launch mechanism. Identify which parent process spawned this cmd.exe and whether that pair is historically common.
    A new or rare parent for cmd.exe is the deviation worth chasing; a pair already accounting for thousands of prior events
    is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of this alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints.
    If the same user triggered similar WebDAV or command-line execution on other hosts in this window, the scope of the activity
    may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-cmd.exe launch combination fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: Under a service principal, asking what else the user did network-wide returns agent-telemetry noise, since every
    host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process
    plus spawned cmd.exe — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled
    or pushed activity; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: attack:T1059.001.time_correlation
  question: Did this execution occur outside the user's normal working hours or a known maintenance window?
  context: Interpreter-driven execution that lands off-hours, outside change windows, or at a time inconsistent with the user's
    routine carries different weight than the same action during an active workday. Place the alert timestamp against the user's
    typical activity pattern and any scheduled maintenance to judge whether the timing itself is anomalous.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
      - CommandLine
