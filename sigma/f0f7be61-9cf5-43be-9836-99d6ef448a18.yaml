name: Uninstall Crowdstrike Falcon Sensor
id: e1294800-db3d-42ad-8e5e-30b630d12828
description: |
  Detects a command line that invokes the CrowdStrike Falcon sensor installer (WindowsSensor.exe) with both ' /uninstall'
  and ' /quiet', which silently removes the endpoint sensor and ends its telemetry and protection on the host. Administrators
  do uninstall the sensor for maintenance, migrations, or troubleshooting, so the action is not malicious on its own, but
  adversaries remove EDR to blind detection immediately before dropping or executing a payload. Determine whether the
  uninstall came from a documented maintenance path or an operator, what ran on the host afterward, and whether other
  defense-tampering or persistence actions accompanied it.
type: detection
detection_id: f0f7be61-9cf5-43be-9836-99d6ef448a18
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects — WindowsSensor.exe run with /uninstall and /quiet?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when a single
    command line contains all three of '\WindowsSensor.exe', ' /uninstall', and ' /quiet'. Confirm the arguments are present
    on the same invocation rather than inferred from separate events.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to uninstall the endpoint sensor from the command line?
  context: Legitimate sensor removals are usually driven by a documented maintenance window, a migration, or a help-desk
    ticket, not by an interactive operator acting ad hoc. Knowing whether this account and host normally perform sensor
    lifecycle operations is often the fastest way to separate routine maintenance from deliberate tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:defense_tampering.what_was_disabled
  question: What exactly did this WindowsSensor.exe invocation remove, and were any additional flags or maintenance tokens
    present?
  context: Re-read the full command line of the triggering event. ' /uninstall /quiet' silently removes the Falcon sensor,
    ending its real-time telemetry and protection on the host. Note any additional switches — for example a maintenance
    token or a version argument — that indicate the removal followed an authorized installer workflow rather than an
    arbitrary operator action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:defense_tampering.protection_status
  question: Is the endpoint sensor currently reinstalled and reporting, or is the host still without sensor coverage?
  context: A sensor uninstall can be temporary — part of an upgrade that immediately reinstalls — or it can leave the host
    without coverage for an extended period. Confirm the current sensor state and last check-in time on the host. If the
    sensor is still absent, restoring coverage is the immediate remediation before deeper investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this uninstall command, and is that parent chain expected?
  context: The parent reveals how the uninstall was launched. Authorized removals typically run from a deployment agent,
    an installer service, or a documented maintenance script. An interactive shell, a script host, or an Office application
    as the parent points toward an operator or a malicious launcher rather than a managed sensor-lifecycle workflow.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1562.001.registry_set
  question: Were the endpoint sensor's service or driver registry values changed on this host around the time of the
    uninstall?
  context: Sensor removal often runs alongside registry-level tampering that stops the agent service, disables its driver,
    or clears its configuration. Modifications under the CrowdStrike service and driver keys in the same window indicate a
    broader effort to neutralize the sensor rather than a clean installer-driven uninstall. If registry modification events
    are not collected in this environment, treat zero results as a visibility gap rather than evidence nothing changed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_sensor_keys:
        TargetObject|contains:
          - '\Services\CSAgent\'
          - '\Services\CSFalconService\'
          - '\Services\CSFalconContainer\'
          - '\Services\csagent\'
          - '\CrowdStrike\'
      condition: selection and selection_sensor_keys
    fields:
      - TargetObject
      - Details
      - Image
- source: template:defense_tampering.other_tampering_activity
  question: Were other defense tampering actions performed on this host beyond the sensor uninstall?
  context: Operators who remove one control often disable several — stopping security services, clearing event logs, or
    deleting shadow copies — to maximize the window of reduced visibility. Multiple tampering events from the same user or
    parent process in the same window indicate a coordinated effort rather than an isolated maintenance task.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- source: template:defense_tampering.activity_after_tampering
  question: What activity occurred on this host after the sensor was uninstalled?
  context: Defenses are removed for a reason — to execute a payload, dump credentials, or take actions that the sensor
    would otherwise block or report. Examining process activity in the window immediately after the uninstall reveals what
    the removal was meant to enable, and any visibility gap in that window is itself a signal. Correlate with network
    connections and file writes during the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this uninstall pattern, what parents and users drove it, and does the
    current alert fit?
  context: The query mirrors the rule's selection — a command line containing '\WindowsSensor.exe', ' /uninstall', and
    ' /quiet' — scoped to this host. The resulting parent and user distribution reflects how this specific pattern has
    historically run here, not generic sensor activity. A new parent process, an unexpected user account, or a first-ever
    occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \WindowsSensor.exe
        - ' /uninstall'
        - ' /quiet'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally uninstall or perform lifecycle maintenance on the endpoint sensor?
  context: Compare this user's current action against their historical behavior. A user who has never run the sensor
    installer is more suspicious than an administrator who does so as part of documented endpoint maintenance. The user's
    role and typical toolset should align with removing endpoint protection.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and WindowsSensor.exe combination historically routine on this host or across the environment,
    or is the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute the behavior; the meaningful
    pivot is the launch mechanism. A new or rare parent for WindowsSensor.exe on this host or environment-wide is the
    deviation worth chasing, whereas a pair that already accounts for many prior events reflects a managed deployment or
    installer workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel actions on multiple
    endpoints. If the same user uninstalled the sensor or performed related activity on several hosts, the scope of the
    operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and WindowsSensor.exe combination fire on other hosts in the same window, indicating a
    coordinated rollout rather than isolated activity?
  context: Under a service principal, asking what else the user did network-wide returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism — the parent process spawning WindowsSensor.exe — fired on
    other hosts in the alert window. Multiple hosts point to a scheduled or pushed deployment; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this uninstall pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific firing
    pattern rather than generic sensor usage. Many hosts firing the same pattern points to a scripted decommission or
    migration; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \WindowsSensor.exe
        - ' /uninstall'
        - ' /quiet'
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or
    other defense tampering — may reveal the attack stages that preceded the sensor uninstall and help reconstruct the full
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:persistence_scope.process_based_persistence
  question: Were process-based persistence mechanisms installed on this host after the sensor was uninstalled?
  context: Removing endpoint protection is frequently a precursor to establishing persistence that would otherwise be
    flagged. Scheduled tasks, services, registry Run-key writes, BITS jobs, or WMI subscriptions installed in the
    surrounding window indicate the operator moved from clearing defenses to securing a foothold.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- source: template:persistence_scope.file_based_persistence
  question: Were files dropped to persistence locations such as the Startup folder or Run-key paths on this host?
  context: File-based persistence bypasses command-line detection entirely — dropping an executable or script into the
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks, sc, or reg.
    File-write monitoring captures these drops even when the operator avoids the standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
