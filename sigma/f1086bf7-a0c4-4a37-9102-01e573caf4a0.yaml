name: Renamed Whoami Execution
id: 8ecc5047-f224-441c-af36-4f65b1255ed4
description: |
  Detects a process whose embedded PE metadata (OriginalFileName) is whoami.exe but whose
  on-disk name is something other than whoami.exe, indicating the whoami utility was renamed to
  evade name-based detection. The rule fires when OriginalFileName equals whoami.exe AND the
  Image path does not end in \whoami.exe. whoami enumerates the current user, groups, and
  privileges; renaming it is a deliberate step to run that discovery while bypassing simple
  filename matching. Investigation should confirm the metadata/name mismatch, decode what the
  binary did, and determine whether the renamed copy was deployed deliberately and used for
  post-compromise enumeration.
type: detection
detection_id: f1086bf7-a0c4-4a37-9102-01e573caf4a0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does this process carry whoami.exe metadata while running under a different on-disk name?
  context: Confirm the alert is a true positive before investing further effort. The rule fires
    when the process metadata (OriginalFileName) is whoami.exe AND the Image path does not end in
    \whoami.exe. Verify both halves hold for the triggering event - the embedded original name is
    whoami.exe and the file on disk is named something else.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: When a binary is renamed, the PE metadata (OriginalFileName) and code-signing details
    still reflect the original tool - here, whoami.exe. Compare the Image path (the name on disk)
    against OriginalFileName to confirm the mismatch, and use the signing party and signature
    status to judge whether this is the genuine Microsoft-signed whoami relocated under a new name
    or an unsigned/tampered copy. The file hash enables reputation lookups to determine whether the
    binary matches the known-good system whoami or a novel sample requiring deeper analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the renamed whoami binary do? Decode its command-line arguments.
  context: whoami supports flags that change what it enumerates - /user, /groups, /priv, /all,
    /fqdn, and /upn. Decode the full command line to determine whether the operator pulled only the
    current user name or dumped groups and privileges as well, which signals reconnaissance depth.
    This query scopes to all executions of the renamed binary on this host within +/-5m rather than
    the single triggering event, so sequential invocations that form one logical enumeration are
    visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned the discovery command, and is this a normal pattern?
  context: Legitimate discovery is typically run from cmd.exe spawned by explorer.exe or from
    automation scripts. A renamed whoami spawned by Office applications, script interpreters
    (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe (WMI remote execution), or wsmprovhost.exe
    (WinRM remote execution) points to automated post-exploitation rather than an administrator at a
    console. Identifying whether enumeration originates from an interactive shell or a
    non-interactive parent is the key tuning signal for this technique.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user expected to run administrative discovery commands?
  context: Administrators and IT staff legitimately run whoami for troubleshooting; standard users
    and service accounts rarely do. A service account or an unexpected user issuing the renamed
    enumeration command is anomalous and should be flagged. The user's role and behavior baseline
    determine whether this is routine or post-compromise enumeration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:masquerading.binary_origin
  question: How did this renamed binary arrive on the host?
  context: 'Renamed binaries do not appear spontaneously - they were copied, downloaded, or dropped
    by a parent process. Tracing the file creation event for the renamed binary by basename over a
    long window reveals the delivery mechanism: a download tool, a dropper, a manual copy, or
    lateral movement from another host. The Image field on the file creation event shows which
    process wrote the file. A user-writable location (Desktop, Downloads, Temp, AppData) suggests
    download or extraction.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: Renaming a binary hides it while it performs its intended function. Examining the child
    processes, file operations, and network connections spawned by the renamed binary reveals
    whether enumeration was a precursor to further action. The same renamed binary appearing on
    multiple hosts suggests deliberate distribution rather than an isolated event; pivot on the
    OriginalFileName or Hashes value to find sibling copies fleet-wide.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery command may be legitimate troubleshooting, but multiple
    reconnaissance commands in rapid succession - whoami, ipconfig, net user, systeminfo - is a
    signature pattern of post-compromise enumeration. Three or more distinct recon binaries within
    fifteen minutes typically indicates automated reconnaissance preceding the next attack stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even built-in tools can be abused. The query mirrors the rule's selection - a process
    with whoami.exe metadata running under a non-whoami name - scoped to this host, so the
    resulting parent/user distribution reflects how this specific renamed-whoami pattern has
    historically run here, not generic whoami usage. A new parent process, an unexpected user
    account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: whoami.exe
      filter:
        Image|endswith: \whoami.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally perform this type of enumeration?
  context: Compare this user's current action against their historical behavior. A user who has
    never run this binary is more suspicious than one who does so regularly, and user role should
    align with the toolset. Zero or very low historical counts indicate first-time or rare use of
    this binary by this account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or
    a computer account), user identity does not attribute behavior. The meaningful pivot is the
    launch mechanism - which parent process spawned this binary, and whether that pair is
    historically common. A new or rare parent for this binary is the deviation worth chasing; a pair
    accounting for thousands of prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration
    spanning multiple endpoints. If the same user triggered similar activity on multiple hosts, the
    scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+binary combination fire on other hosts in the same window - a coordinated automation rollout, or activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful
    question is whether the same launch mechanism - parent process plus spawned binary - fired on
    other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context: what led to this event, what happened after, and whether it is part of a
    larger sequence. Aggregating by Image and ParentImage collapses repetitive agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide
    count of the renamed-whoami pattern rather than generic whoami usage. Many hosts firing the same
    pattern points to scripted deployment or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: whoami.exe
      filter:
        Image|endswith: \whoami.exe
      condition: selection and not filter
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense
    tampering, reconnaissance, credential access - may reveal the attack stages that preceded this
    event and help reconstruct the full timeline that led to the renamed enumeration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
