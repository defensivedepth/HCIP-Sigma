name: Uncommon Svchost Command Line Parameter
id: 3e1f615f-52ae-4443-99c7-464574bf99a3
description: |
  Detects svchost.exe running with a command line that does not match the legitimate service-host pattern. The rule fires when the image ends in svchost.exe AND none of the expected forms match: the canonical -k <group> [-p|-s] launch, an empty or null command line, or the known Defender/MRT invocations. A svchost.exe instance outside these patterns can mean a binary masquerading under the svchost name, code injected into a real svchost instance, or a hollowed svchost process. The investigation should determine the binary's true identity (metadata, signature, hash), how it arrived and was launched, and whether memory-manipulation or anomalous child activity accompanied it.
type: detection
detection_id: f17211f1-1f24-4d0c-829f-31e28dc93cdd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Is the svchost.exe command line genuinely outside the legitimate service-host pattern?
  context: Confirm the alert before investing time. The rule fires only when the command line is NOT the canonical -k <group> form (optionally with -p or -s), is NOT empty or null, and is NOT one of the known Defender or MRT invocations. Review the exact command line and image path to verify the svchost instance really falls outside every excluded form rather than being a benign edge case the filters missed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this host expected to launch svchost.exe in this way, and under what account?
  context: Legitimate svchost.exe is launched by services.exe under a service principal with a -k service group. An svchost instance started another way, or under an interactive user, is unusual. Knowing the host role and the launching account is often the fastest way to separate a benign edge case from a masquerade or injection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this svchost.exe based on its metadata and hash?
  context: A file named svchost.exe at a non-system path, or with PE metadata that does not match the real service host, is a masquerade. Compare the Image path against OriginalFileName, check the signing party and signature status (the real svchost.exe is Microsoft-signed and lives in System32/SysWOW64), and submit the hash for reputation lookup to determine whether this is the genuine binary, a renamed tool, or a novel sample.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did this svchost.exe binary arrive on the host?
  context: A genuine svchost.exe ships with the OS in System32; a masquerading copy was placed there by something. Trace the file-creation event for the binary by basename over a long window to reveal the delivery mechanism — a download tool, a dropper, a manual copy, or lateral movement. If the file was created at a user-writable or non-standard path, it was likely dropped; if in a system directory, review the creating process to tell an OS update from a privileged-process compromise.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did this svchost.exe do after execution, and is the same binary present on other hosts?
  context: The purpose of masquerading as svchost.exe is to run a payload while looking legitimate. Examine the child processes and operations spawned by this instance to reveal its actual objective. The same anomalous svchost binary appearing on multiple hosts points to deliberate distribution rather than an isolated event; match on hash or OriginalFileName to scope it fleet-wide.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What does this svchost.exe command line actually specify? Decode every argument.
  context: The full command line reveals what this instance was directed to do. Decode each flag, numeric parameter, path, or token. A numeric-only parameter (for example a value passed in place of a service group) or an arbitrary string is the anomaly the rule surfaces and does not correspond to any legitimate service-host launch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this svchost.exe, and is that parent chain expected?
  context: Legitimate svchost.exe is spawned by services.exe. A different parent — explorer.exe, a script host, an Office application, a remote-access tool, or an unsigned binary — indicates the instance was not started by the Service Control Manager and points toward masquerade or injection. Walk up to the parent's own parent to reconstruct how the instance was launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1055.access_verification
  question: Did another process open a handle to this svchost.exe with memory-write or thread-injection access rights?
  context: Process injection and hollowing into svchost require a source process to acquire a handle to the target with rights such as PROCESS_VM_WRITE, PROCESS_VM_OPERATION, or PROCESS_CREATE_THREAD before writing code and creating a remote thread. Process-access events targeting svchost.exe with these granted-access masks identify the injecting process and corroborate injection over plain masquerading. The source image and granted-access value name the writer and the operation.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: \svchost.exe
      filter_self:
        GrantedAccess:
          - '0x1000'
          - '0x1400'
      condition: selection and not filter_self
    fields:
      - SourceImage
      - TargetImage
      - GrantedAccess
      - CallTrace
- source: template:cue_process_tool.baseline
  question: Does this host normally run svchost.exe with a command line outside the service-host pattern?
  context: The genuine svchost.exe runs constantly, so a raw count of the binary is uninformative; what matters is whether anomalous, non -k invocations have appeared here before. Zero or very low historical counts of svchost executions on this host indicate that an instance launched outside the normal service-host pattern is a first-time or rare event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the svchost command-line anomaly, what parents and users drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection and filters scoped to this host, so the resulting parent/user distribution reflects how this specific anomaly pattern (not generic svchost usage) has historically run here. A new parent process, an unexpected account, or a command-line structure never seen before is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_flags:
        CommandLine|re: -k\s\w{1,64}(?:\s?(?:-p|-s))?
      filter_main_empty:
        CommandLine: ''
      filter_main_null:
        CommandLine: null
      filter_optional_defender:
        ParentImage|endswith: \MsMpEng.exe
        CommandLine|contains: svchost.exe
      filter_optional_mrt:
        ParentImage|endswith: \MRT.exe
        CommandLine: svchost.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this svchost.exe spawn afterward?
  context: A masquerading or hollowed svchost commonly proceeds to hands-on-keyboard or impact actions. Child processes such as cmd.exe, powershell.exe, certutil.exe, vssadmin.exe, or netsh reveal the instance's real purpose and the timing of follow-on stages relative to the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_flags:
        CommandLine|re: -k\s\w{1,64}(?:\s?(?:-p|-s))?
      filter_main_empty:
        CommandLine: ''
      filter_main_null:
        CommandLine: null
      filter_optional_defender:
        ParentImage|endswith: \MsMpEng.exe
        CommandLine|contains: svchost.exe
      filter_optional_mrt:
        ParentImage|endswith: \MRT.exe
        CommandLine: svchost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_flags:
        CommandLine|re: -k\s\w{1,64}(?:\s?(?:-p|-s))?
      filter_main_empty:
        CommandLine: ''
      filter_main_null:
        CommandLine: null
      filter_optional_defender:
        ParentImage|endswith: \MsMpEng.exe
        CommandLine|contains: svchost.exe
      filter_optional_mrt:
        ParentImage|endswith: \MRT.exe
        CommandLine: svchost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user account do across the environment around this time?
  context: Tracking the account's activity across all hosts in the alert window reveals lateral movement or coordinated activity across endpoints. If the same account triggered similar svchost anomalies on multiple hosts, the scope may be larger than one endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_flags:
        CommandLine|re: -k\s\w{1,64}(?:\s?(?:-p|-s))?
      filter_main_empty:
        CommandLine: ''
      filter_main_null:
        CommandLine: null
      filter_optional_defender:
        ParentImage|endswith: \MsMpEng.exe
        CommandLine|contains: svchost.exe
      filter_optional_mrt:
        ParentImage|endswith: \MRT.exe
        CommandLine: svchost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this svchost command-line anomaly in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection and filters with no host scope, giving a fleet-wide count of this specific anomaly pattern rather than generic svchost usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_flags:
        CommandLine|re: -k\s\w{1,64}(?:\s?(?:-p|-s))?
      filter_main_empty:
        CommandLine: ''
      filter_main_null:
        CommandLine: null
      filter_optional_defender:
        ParentImage|endswith: \MsMpEng.exe
        CommandLine|contains: svchost.exe
      filter_optional_mrt:
        ParentImage|endswith: \MRT.exe
        CommandLine: svchost.exe
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, shadow-copy deletion, firewall changes, reconnaissance, or credential access — may reveal the attack stages that preceded an anomalous svchost instance and help reconstruct the timeline that led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
