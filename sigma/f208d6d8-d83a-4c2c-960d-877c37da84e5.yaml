name: Process Launched Without Image Name
id: 8ee02919-5b24-4e71-a769-5a1f12a2bfcd
description: |
  Detects process creation where the executable image name is empty - the Image path ends in ".exe" with no
  base file name. This is a masquerading and defense-evasion pattern: a file renamed to just ".exe" (or copied
  to a path whose final component is ".exe") evades Image-name-based detections and blends into process listings.
  Legitimate occurrences are rare. Malicious tradecraft renames otherwise-legitimate signed binaries to a
  nameless ".exe" so they are not attributable by name; the investigation should confirm the empty name,
  identify the real binary behind it, and determine how it was dropped and launched.
type: detection
detection_id: f208d6d8-d83a-4c2c-960d-877c37da84e5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting process have an empty image name - an Image path ending in ".exe" with no base file name?
  context: Confirm the alert is a true positive before investing further. Review the full Image path on the triggering
    event and verify the final path component is literally ".exe" with no name preceding the extension, rather than
    a normally-named executable. A path such as C:\Users\Public\.exe matches; C:\Windows\notepad.exe does not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:universal.host_user_context
  question: Is this user and host expected to run an executable whose file name is empty?
  context: A process with no image name has no legitimate routine that produces it under normal operation. Knowing
    whether the user role and host function involve unusual software installs, developer tooling, or third-party
    agents helps separate a rare benign artifact from operator-dropped tradecraft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What was the full command line of the nameless process, and what real binary is behind the empty name?
  context: The empty Image name hides what actually ran. Read the full command line, current directory, and any
    arguments to determine the binary's true identity and purpose - a renamed signed application repurposed as a
    backdoor still carries its original behavior in its arguments and child activity. Cross-reference the hash or
    on-disk location against the legitimate binary it impersonates.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned this nameless executable, and is that parent chain expected?
  context: The parent process reveals how the nameless binary was invoked. A scripting host (powershell.exe,
    wscript.exe, mshta.exe), a scheduled-task service host, or an Office application as parent points to scripted
    drop-and-run; a normal installer or explorer.exe is more consistent with benign software. Walk up to the
    parent's own parent if the immediate parent is itself a shell.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Has a process with an empty image name run on this host before?
  context: A nameless executable that has never been seen on a host is more concerning than a recurring one. Zero
    or very low historical counts indicate a first-time occurrence; a recurring count may point to a misbehaving
    local application or agent that consistently produces the artifact.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the nameless-process pattern, what parents and users normally drive
    it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution
    reflects how the empty-image-name pattern has historically appeared here, not generic process activity. A new
    parent process, an unexpected account, or a one-off appearance against an otherwise empty history is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did the nameless executable spawn afterward?
  context: The processes spawned by the nameless binary reveal its actual impact. A renamed backdoor commonly
    launches command shells, scripting hosts, or network tooling for follow-on actions such as discovery, scheduled-task
    persistence, or further download. A binary that spawns nothing is more consistent with a benign one-off.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the nameless-process pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the
    empty-image-name pattern. Many hosts firing the same pattern points to a shared software defect or a pushed
    deployment; one host or a small unrelated set points to host-local operator activity. Use the host distribution
    to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run software that produces a nameless executable?
  context: Compare this user's current activity against their historical behavior. A user who has never been
    associated with an empty-image-name process is more concerning than one whose role routinely involves
    third-party or developer tooling. User role and typical software footprint should align with what fired.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or
    is the parent unusual for a nameless executable?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful
    pivot is the launch mechanism. Identify which parent process spawned the nameless binary and whether that pair
    is historically common. A new or rare parent for this binary is the deviation worth chasing; a pair that already
    accounts for many prior events is more likely automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user is associated with similar drop-and-run activity on other hosts, the scope of the
    compromise may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window - is this a
    coordinated automation rollout or isolated to this host?
  context: Under a service principal, network-wide user activity returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism - parent process plus spawned nameless binary - fired on other
    hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed deployment; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining surrounding activity reveals what led to the nameless-process
    launch and what happened after - reconnaissance, scheduled-task or registry persistence, or further download.
    Novel parent-child pairs at low counts are what to scan for against the high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - drive-by download, script execution, obfuscated PowerShell, or
    defense tampering - may reveal the stages that preceded the nameless-process launch and help reconstruct the
    timeline. A renamed binary launched with no name is often a late stage of a multi-step infection.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
