- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell instance spawn afterward?
  context: The processes a payload spawns reveal its impact. A staged download or injector may launch cmd.exe, another PowerShell, certutil.exe, rundll32.exe, or a freshly written binary, or open a connection to a remote host. Unexpected children point to post-exploitation following the initial execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
