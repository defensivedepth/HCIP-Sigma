    - hint: >-
        logsource 'registry_set' (recommended by techniques: T1053.005) is not
        covered — pull in cue_registry_key.* or author a custom question with
        `category: registry_set`
      disposition: declined
      reason: >-
        This rule's detection is scoped entirely to schtasks.exe /Create
        command-line patterns; it does not fire on registry-stored task
        definitions. The registry_set recommendation in the T1053.005 analytic
        covers task definitions written under
        HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache,
        which is a parallel detection surface this rule does not target. The
        task command itself is fully visible in process_creation and is parsed
        by task_configuration (Q3); registry coverage would not add precision
        for the command-line-based firing this rule constrains analysis to.
    - hint: >-
        logsource 'security' (recommended by techniques: T1053.005) is not
        covered and no template family exists — author a custom question with
        `category: security`
      disposition: declined
      reason: >-
        Security-channel events 4698 (task created) and 4702 (task updated)
        record the same task creation this rule already captures via
        process_creation of schtasks.exe /Create. Authoring a security-category
        question would re-ask "was a task created" using a different log source
        without adding an investigative step; the schtasks command line in
        process_creation already exposes /TN, /TR, /SC, and /RU. The
        cross-log-source redundancy does not justify a separate question, and
        the playbook's persistence questions (Q7 task-still-present, Q16
        other-persistence) cover the registration-state angle that 4698/4702
        would otherwise serve.
