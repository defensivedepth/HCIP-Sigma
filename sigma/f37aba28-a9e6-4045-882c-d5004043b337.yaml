    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (profile unexpected parent-child relationships)"
      disposition: context
      target_question: Q8
      notes: "process_chain question evaluates whether the parent that spawned cmdl32.exe is expected; Connection Manager/installer parents are routine, script hosts/shells are not. Also exercised by baseline_deviation/baseline_svc parent grouping."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "e.g. msiexec.exe, regsvr32.exe (allowlist of signed binaries)"
      disposition: context
      target_question: Q1
      notes: "Rule already pins the signed binary to cmdl32.exe; the broader signed-binary allowlist is a tuning concept, not a per-alert query value. verify_trigger_match confirms the binary identity."
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "rationale only (regex to match URLs / script paths / DLL entrypoints)"
      disposition: query_injection
      target_question: Q11
      notes: "The rule's own CommandLine|contains|all (/vpn, /lan) is the argument-matching criterion; reflected baseline_deviation and scope queries embed it verbatim, and mechanism_decode decodes the matched arguments and config path."
    - element: RemoteDomainAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only (suppress legitimate enterprise domains)"
      disposition: context
      target_question: Q4
      notes: "Destination-reputation question guides the analyst to distinguish enterprise/software-distribution hosts from attacker infrastructure; allowlisting is an environment-specific tuning concern, not a query value."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "10-30 minutes between launcher and child/network activity"
      disposition: context
      target_question: Q7
      notes: "Network-correlation question uses +/-15m to bracket the launcher-to-connection window; the threshold is reflected in the range and context rather than queryable as a field value."
    - element: AllowedUtilities
      dimension: tuning_parameter
      specific_values: "forfiles, wsl, ssh (permitted on admin/jumphosts)"
      disposition: context
      target_question: Q11
      notes: "cmdl32.exe is not in the allowed-indirection-utility set; baseline_deviation surfaces whether this host has a prior history of the pattern, which is the per-environment equivalent of an allowlist check."
    - element: HighRiskChildren
      dimension: tuning_parameter
      specific_values: "powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe, curl.exe, bitsadmin.exe"
      disposition: context
      target_question: Q9
      notes: "follow_on question directs the analyst to look for these high-risk children spawned by cmdl32 or its parent; the cue query returns all children for inspection rather than hardcoding the list."
    - element: UserContext
      dimension: user_context
      specific_values: "rationale only (raise severity for standard interactive user on a workstation)"
      disposition: context
      target_question: Q12
      notes: "user_actor baseline question evaluates whether the firing user routinely performs this activity; host_user_context establishes workstation-vs-server role."
    - element: DestCIDRs
      dimension: tuning_parameter
