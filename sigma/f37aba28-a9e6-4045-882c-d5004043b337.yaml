name: Potential Arbitrary File Download Via Cmdl32.EXE
id: 3aa91d62-de25-407a-a5c5-4fb3b7a17c33
description: |
  Detects the Microsoft-signed Connection Manager binary cmdl32.exe being run with both the /vpn and /lan flags, a documented way to abuse the utility into downloading an arbitrary file described by a configuration file passed on the command line. The rule fires when the binary identity (Image ends in cmdl32.exe OR OriginalFileName is CMDL32.EXE) AND the command line contains both /vpn and /lan. Because cmdl32.exe is trusted and signed, this is a proxy / indirect-execution ingress path that retrieves a remote payload without a recognizable download tool; the fetched file lands in the temp directory (typically %TMP% as a VPNxxxx.tmp file) rather than at a path named on the command line, and cmdl32 deletes it unless it is a valid VPN profile, so the config file and the temp directory are the primary artifacts. Investigation should confirm the flags fired, read the referenced config file to recover the download URL, check whether a file landed on disk, identify the parent that invoked the binary, and determine whether the activity is isolated or part of broader host activity.
type: detection
detection_id: f37aba28-a9e6-4045-882c-d5004043b337
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does this event match the rule — cmdl32.exe run with both the /vpn and /lan flags?
  context: Confirm the alert is a true positive by reviewing the exact command line and binary identity against the detection criteria. The rule requires both the binary (Image ending in cmdl32.exe or OriginalFileName CMDL32.EXE) and a command line containing both /vpn and /lan; verify both flags are present and note the configuration-file path supplied as the final argument.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to download files via a command-line connection-management tool?
  context: Legitimate direct invocation of cmdl32.exe by users is rare; the binary is normally driven by Connection Manager workflows, not run by hand with /vpn /lan and a config path. Knowing whether the user role and host function involve VPN profile management or remote-content handling is often the fastest way to separate routine activity from operator-driven downloads.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did cmdl32.exe do? Decode the full command line and identify the configuration file it was pointed at.
  context: The full command line reveals the specific action. The final argument after /vpn /lan is a path to a configuration file; cmdl32 reads the download URL from that file rather than from the command line itself, so identify the exact config path (often an absolute path under the current directory or temp). The current directory matters because the file is fetched into the temp directory and named like VPNxxxx.tmp.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1218.command_analysis
  question: What URL does the referenced configuration file point at, and what do DNS, WHOIS, and threat intel reveal about that destination?
  context: cmdl32 reads the download address from the UpdateUrl entry in the configuration file named on the command line, so the config file content — not the command line — carries the destination. Recover the config file, extract the UpdateUrl, then investigate the host — DNS resolution history, registration age, TLS certificate details, and known threat-intel hits. Recently registered domains, raw IP literals, non-standard ports, or known C2 infrastructure point to attacker-controlled endpoints; well-known software-distribution hosts point to benign content retrieval.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:download_tool.download_success_verification
  question: Did a file actually land on disk after the fetch — did cmdl32.exe create a downloaded file in the temp directory?
  context: A download command does not guarantee retrieval; network errors, blocked URLs, or the binary's own cleanup may prevent a file from persisting. Files fetched this way are written to the temp directory (typically %TMP% as a VPNxxxx.tmp file) rather than a command-line path, and cmdl32 deletes the file unless it is a valid VPN profile — so a surviving artifact implies the attacker took steps to prevent deletion. Confirm file creation by the same process to establish whether the attack progressed past delivery.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:download_tool.payload_analysis
  question: Can the downloaded file be retrieved and analyzed from a safe environment?
  context: If the fetched file is still on disk, submitting its hash to threat intelligence or detonating it in a sandbox reveals whether it is a known malicious payload, a legitimate file, or something novel. The temp directory written by cmdl32.exe is the place to recover the artifact and its hash for lookup; because the binary tries to delete non-VPN-profile downloads, also check shadow copies or backup data if the live file is gone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Hashes
- source: attack:T1202.time_correlation
  question: Did cmdl32.exe open any outbound network connections in the window around the alert, and where did they go?
  context: The download is carried out by cmdl32.exe itself reaching the URL from the config file, so an outbound connection from the binary in the same window confirms the transfer actually executed and reveals the true destination address and port. Correlate the connection timing with the process start; a connection to an external or unfamiliar host close to the launch is the evidence that delivery occurred, while no connection suggests the command failed or was blocked.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- source: template:cue_process_tool.process_chain
  question: What process spawned cmdl32.exe, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked and is the spine of the indirect-execution chain — a user or launcher starts cmdl32, which then performs the download. Connection Manager workflows or installers launching it are routine; script hosts, shells, or remote-access tooling (cmd.exe, powershell.exe, wscript.exe, mshta.exe) spawning cmdl32 with /vpn /lan point to scripted or operator-driven proxy execution.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did cmdl32.exe or its parent spawn afterward?
  context: A download is only the delivery stage of an indirect-execution chain. Processes spawned by cmdl32, or by the same parent shortly after, reveal whether the retrieved content was run — look for interpreters or LOLBins (cmd.exe, powershell.exe, rundll32.exe, regsvr32.exe, mshta.exe, the dropped temp file itself) starting in the same window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run cmdl32.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Most endpoints never invoke cmdl32.exe directly, so zero or very low historical counts over the baseline window indicate first-time or rare execution worth scrutiny.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even trusted binaries get abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern (cmdl32.exe with /vpn /lan) has historically run here — not generic use of the binary. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdl32.exe
      - OriginalFileName: CMDL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - /vpn
        - /lan
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdl32.exe
      - OriginalFileName: CMDL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - /vpn
        - /lan
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdl32.exe
      - OriginalFileName: CMDL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - /vpn
        - /lan
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar activity on more than one host in the window, the scope of the operation may be larger than a single download.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdl32.exe
      - OriginalFileName: CMDL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - /vpn
        - /lan
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern (cmdl32.exe with /vpn /lan) rather than generic use of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdl32.exe
      - OriginalFileName: CMDL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - /vpn
        - /lan
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the event reveals what led to it and what followed — look for reconnaissance, additional downloads, privilege escalation, or persistence that places the proxy-execution download into a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this download and help reconstruct the timeline. A proxy-execution fetch following earlier suspicious activity reads differently than one in isolation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
