name: Potential RDP Tunneling Via Plink
id: 6e8d7c19-3e0c-49a8-91f1-8cd68eb32eab
description: |
  Detects plink.exe (PuTTY's command-line SSH client) invoked with port-forwarding
  arguments that encapsulate RDP traffic inside an SSH tunnel. The rule fires when
  EITHER plink runs with a local forward to :127.0.0.1:3389, OR plink runs with a
  forward to :3389 together with an outbound SSH port of -P 443 or -P 22. Protocol
  tunneling lets an operator reach internal RDP through perimeter firewalls by wrapping
  it in an outbound SSH session, often on a port allowed for normal egress. Legitimate
  use exists (administrators tunneling to managed hosts), so the investigation should
  determine whether the tunnel is sanctioned, where it terminates, and whether the
  surrounding host activity fits routine administration or hands-on-keyboard movement.
type: detection
detection_id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the plink command line match one of the tunneling patterns this rule detects, and which branch fired?
  context: >-
    Confirm the alert is a true positive before investing time. The rule matches EITHER a plink.exe command line forwarding
    to :127.0.0.1:3389, OR a plink.exe command line forwarding to :3389 combined with an SSH connection port of ' -P 443'
    or ' -P 22'. Read the full command line and note which branch fired — the explicit loopback-RDP forward is unambiguous,
    while the :3389-plus-egress-port branch depends on the SSH destination port and is worth correlating with the actual
    outbound connection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run SSH tunneling tools toward internal RDP?
  context: >-
    Legitimate administration sometimes tunnels RDP over SSH to reach hosts behind a firewall, but most users and endpoints
    never run plink with port-forwarding arguments. Knowing whether the account is an administrator and whether the host is
    an admin workstation or jump box is often the fastest way to separate sanctioned access from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What does the full plink command line do — which local port is forwarded, to what SSH host, and on which SSH port?
  context: >-
    The command line spells out the tunnel. Identify the forward specification (the -L/-R/-D flag and its host:port:host:port
    triple), the destination SSH server, the SSH port (-P), and any key, proxy, or batch flags. A forward of 127.0.0.1:3389
    or :3389 means RDP is being relayed; an SSH port of 443 or 22 shows which egress path the tunnel rides. Scoping to plink
    on this host within a few minutes captures any companion invocations that set up or tear down the session.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1572.obfuscation_check
  question: Does the tunnel encapsulate RDP inside SSH, and is the SSH egress port mismatched to its normal protocol?
  context: >-
    Protocol tunneling hides one protocol inside another to slip past perimeter controls. Here RDP (3389) is wrapped in an
    SSH session whose outbound port is frequently 443 or 22 — 443 borrows the HTTPS egress path that firewalls usually allow,
    masking interactive RDP as ordinary web traffic. Treat an SSH client speaking on 443, or a loopback RDP forward leaving
    the host, as a port-to-protocol mismatch and check whether the byte volume is large and asymmetric, which is characteristic
    of a live remote desktop session rather than a brief automated transfer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tool:
        Image|endswith: \plink.exe
      selection_tunnel:
        CommandLine|contains:
          - ':127.0.0.1:3389'
          - ':3389'
          - ' -P 443'
          - ' -P 22'
      condition: selection_tool and selection_tunnel
    fields:
      - CommandLine
      - User
- source: template:cue_network_endpoint.mechanism_decode
  question: What SSH endpoint is the tunnel terminating at, and what do DNS, registration age, and threat intel reveal about it?
  context: >-
    The SSH destination is where tunneled RDP ultimately lands. Resolve the host or IP from the connection, then check
    resolution history, registration age, hosting provider, and any threat intelligence hits. A recently registered domain,
    a VPS in unexpected hosting, or a destination with no business relationship points to attacker-controlled relay
    infrastructure; a known managed-host or vendor address supports sanctioned administration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: template:cue_process_tool.process_chain
  question: What process spawned plink, and is that parent chain expected for tunneling activity?
  context: >-
    The parent reveals how the tunnel was launched. An interactive shell, a remote-management agent, or a scheduled task
    parent each imply different stories — a hands-on operator session versus pushed automation versus a scripted job. Parents
    such as wscript.exe, mshta.exe, an Office application, or a web-server worker process suggest the tunnel was set up
    through an exploited or scripted path rather than deliberate administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:remote_access_tool.tool_authorization
  question: Is plink (or SSH tunneling generally) on the organization's approved software list for this host?
  context: >-
    Organizations typically sanction a specific set of remote-access and tunneling tools. plink may be authorized for some
    administrators and forbidden elsewhere; an allow-list of legitimate tunneling tools and the accounts permitted to run
    them is what distinguishes sanctioned use from shadow IT or operator-deployed access. A tunnel from a host or user with
    no documented need should be treated as unauthorized regardless of plink's benign reputation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a change ticket, maintenance window, or support request that explains this tunnel?
  context: >-
    Sanctioned RDP-over-SSH tunneling usually correlates with an open ticket, a scheduled maintenance window, or a
    documented administrative procedure. If no such context exists for this session, the tunnel may have been established by
    an operator for covert reach into internal RDP or by a user bypassing perimeter controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What outbound network connections did plink make, and to what address and port?
  context: >-
    The connection records confirm where the tunnel actually goes and on which port, independent of what the command line
    claims. A destination on 443 or 22, a long-lived session, or large asymmetric byte counts all corroborate an interactive
    RDP relay. Compare the observed destination against the SSH host named on the command line — a mismatch can indicate a
    proxy hop or a misread of the arguments.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1572.time_correlation
  question: Did an outbound SSH connection appear within seconds of plink starting, and how long did it stay open?
  context: >-
    A real tunnel shows plink process creation immediately followed by an outbound connection from the same host, with the
    session persisting while RDP is relayed. Correlating the process-start time against connection events within a tight
    window confirms the tunnel established rather than failing on launch; a long-lived connection with sustained, asymmetric
    traffic is consistent with an interactive desktop session rather than a brief automated transfer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \plink.exe
        DestinationPort:
          - 443
          - 22
          - 3389
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously matched the tunneling pattern, which parents and users drove it, and does this alert fit that pattern?
  context: >-
    Even an approved tunneling tool has a normal pattern on a given host. This query mirrors the rule's selection scoped to
    this host, so the parent and user distribution reflects how the rule's specific firing pattern — not generic plink usage
    — has historically run here. A new parent process, an unexpected account, or a first-ever match is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_a:
        Image|endswith: \plink.exe
        CommandLine|contains: :127.0.0.1:3389
      selection_b1:
        Image|endswith: \plink.exe
        CommandLine|contains: :3389
      selection_b2:
        CommandLine|contains:
        - ' -P 443'
        - ' -P 22'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_a or all of selection_b*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts matched the tunneling pattern in the past week, and does the spread look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the tunneling pattern rather
    than generic plink usage. Many hosts firing the same pattern points to scripted deployment or sanctioned automation; a
    single host or a small unrelated set points to manual operator activity. Use the host spread and parent consistency to
    calibrate how broadly to investigate.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_a:
        Image|endswith: \plink.exe
        CommandLine|contains: :127.0.0.1:3389
      selection_b1:
        Image|endswith: \plink.exe
        CommandLine|contains: :3389
      selection_b2:
        CommandLine|contains:
        - ' -P 443'
        - ' -P 22'
      condition: selection_a or all of selection_b*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_a:
        Image|endswith: \plink.exe
        CommandLine|contains: :127.0.0.1:3389
      selection_b1:
        Image|endswith: \plink.exe
        CommandLine|contains: :3389
      selection_b2:
        CommandLine|contains:
        - ' -P 443'
        - ' -P 22'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_a or all of selection_b*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_a:
        Image|endswith: \plink.exe
        CommandLine|contains: :127.0.0.1:3389
      selection_b1:
        Image|endswith: \plink.exe
        CommandLine|contains: :3389
      selection_b2:
        CommandLine|contains:
        - ' -P 443'
        - ' -P 22'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_a or all of selection_b*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of the tunnel?
  context: >-
    Tracking the account's activity across all hosts in the alert window can reveal lateral movement or staging that frames
    the tunnel. If the same user triggered related activity on multiple endpoints, the scope of the access is larger than a
    single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_a:
        Image|endswith: \plink.exe
        CommandLine|contains: :127.0.0.1:3389
      selection_b1:
        Image|endswith: \plink.exe
        CommandLine|contains: :3389
      selection_b2:
        CommandLine|contains:
        - ' -P 443'
        - ' -P 22'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (selection_a or all of selection_b*) and _pb_scope
    fields:
    - host.name
- source: template:lateral_movement.lateral_movement_scope
  question: Has this user account run lateral movement or tunneling tools against other hosts in the past day?
  context: >-
    A tunnel is often one step in reaching multiple systems. If the same account is running plink, ssh, psexec, mstsc, or
    wmic across several hosts in a short window, the scope of compromise is broader than this one endpoint. A spread of
    lateral movement tooling from a single account within a day is consistent with active movement across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before the tunnel was established?
  context: >-
    Tunnels rarely appear in isolation. Earlier detections on the same host — credential access, reconnaissance, defense
    tampering, or web-server exploitation — may reveal the stages that preceded the tunnel and help reconstruct how the
    operator reached the point of relaying RDP outbound.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
