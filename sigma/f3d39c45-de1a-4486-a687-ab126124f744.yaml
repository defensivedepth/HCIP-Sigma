      kept: both
  skipped_templates:
    - template: masquerading.binary_origin
      reason: "binary_origin matches the child by basename in file_event over 30d to find how a dropped/renamed file arrived. The flagged children are well-known system binaries that ship with Windows, so a basename file_event search returns OS install/update noise rather than a delivery signal. true_identity already confirms whether the running child is the genuine signed binary, which is the relevant masquerading check for this rule."
    - template: universal.endpoint_protection_health
