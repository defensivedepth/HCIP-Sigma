      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.mechanism_decode
      reason: "parent_child technique set active — parent_process_legitimacy supersedes the generic parent lookup (per AGENTS.md dedup rule)"
      kept: parent_child.parent_process_legitimacy
    - dropped: cue_parent_process.follow_on
      reason: "near-duplicate of parent_child.sibling_processes (children of the same parent); sibling_processes scopes by exact ParentProcessGuid instance"
      kept: parent_child.sibling_processes
    - dropped: cue_parent_process.clustering
      reason: "near-duplicate of cue_host_context.clustering (host-scoped surrounding activity); host_context aggregates by Image+ParentImage and is the broader of the two"
      kept: cue_host_context.clustering
    - dropped: cue_parent_process.scope
      reason: "near-identical query to cue_user_actor.clustering_svc (process.parent.name + Image|endswith, cross-host aggregation by host.name); clustering_svc is a mandatory service-principal pair"
      kept: cue_user_actor.clustering_svc
    - dropped: cue_parent_process.baseline
      reason: "near-identical query to cue_user_actor.baseline_svc (process.parent.name + Image|endswith, -90d aggregation); baseline_svc is a mandatory service-principal pair"
      kept: cue_user_actor.baseline_svc
    - dropped: cue_process_tool.baseline
