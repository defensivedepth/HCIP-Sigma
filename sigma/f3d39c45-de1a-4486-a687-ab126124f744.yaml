  mutable_dispositions:
    - element: CommandLineRegex
      dimension: command_analysis
      specific_values: "rationale only (regex matching suspicious args: URLs, script paths, DLL entry points)"
      disposition: context
      target_question: Q4
      notes: "mechanism_decode (ADAPT_STRUCTURALLY) scopes to children of sdiagnhost.exe on this host; the suspicious-argument classes (URLs, script paths, DLL entry points, /i: scriptlets) are named in context as what to decode. Not query-injected because the rule's discriminator is the parent (sdiagnhost.exe), not a child command-line token, and the child binary is variable; constraining to specific arg tokens would miss other proxy variants."
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (profile unexpected parent-child, e.g. regsvr32.exe not launched by explorer.exe)"
      disposition: context
      target_question: Q3
      notes: "parent_process_legitimacy traces what spawned sdiagnhost.exe and whether the chain is consistent with a user-launched troubleshooter — the parent-child legitimacy judgment this element encodes. Parent (sdiagnhost.exe) is already fixed by the rule."
    - element: SignedBinaryList
      dimension: tuning_parameter
      specific_values: "rationale only (allowlist of signed proxy binaries: msiexec.exe, regsvr32.exe, ...)"
      disposition: context
      target_question: Q6
      notes: "true_identity checks OriginalFileName, signer, and hash of the spawned binary against the genuine signed system binary — the signed-binary judgment this allowlist encodes. The flagged child set is fixed by the rule selection."
    - element: RemoteDomainAllowlist
      dimension: tuning_parameter
      specific_values: "rationale only (suppress legitimate enterprise domains)"
      disposition: context
      target_question: Q8
      notes: "Tuning rationale to suppress benign enterprise destinations; folded into the network_connection question's triage framing of the outbound destination. Not query-injected to avoid suppressing egress to other destinations."
    - element: OriginalFilenameMismatch
      dimension: tuning_parameter
      specific_values: "Compare Image file name with PE OriginalFilename"
      disposition: query_injection
      target_question: Q6
      notes: "Injected into true_identity as the OriginalFileName field projection alongside Image and Hashes; the mismatch is the discriminator named in context."
    - element: KnownSystemUtilityPaths
      dimension: tuning_parameter
      specific_values: "Tune on expected install directories for signed binaries"
      disposition: context
      target_question: Q6
      notes: "true_identity context calls out a non-standard install path for the named system binary as a discriminator; expected-path tuning is a judgment applied to the projected Image, not a directly queryable constraint here."
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "Correlation window between file creation and service/process execution"
      disposition: context
      target_question: Q9
      notes: "Correlation horizon folded into the +/-15m range on sibling_processes and the +/-15m / +/-1h ranges on the clustering questions; not a directly queryable field."
  dedup_decisions:
    - dropped: cue_process_tool.process_chain
