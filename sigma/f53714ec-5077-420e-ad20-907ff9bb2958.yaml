name: Forfiles.EXE Child Process Masquerading
id: c37b33ea-acef-490f-a367-95a381731a03
description: |
  Detects a cmd.exe child whose command line starts with /c echo " spawned from a parent whose command line ends in
  .exe, while excluding the legitimate case where forfiles.exe in System32/SysWOW64 spawns the System32/SysWOW64 cmd.exe.
  forfiles.exe runs a default command of cmd /c echo @file when invoked without arguments, so an actor who copies
  forfiles.exe into a directory alongside a planted cmd.exe can have that planted cmd.exe executed under the trusted
  forfiles default behavior. Legitimate forfiles use runs from System32; investigate whether the spawned cmd.exe is the
  genuine system binary or an impostor in a non-default path, how it got there, what it did, and the surrounding parent
  activity.
type: detection
detection_id: f53714ec-5077-420e-ad20-907ff9bb2958
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does a cmd.exe with a command line starting with /c echo " run from a non-system path under a parent ending in
    .exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when a process whose
    Image ends in \cmd.exe runs a command line starting with /c echo " under a parent whose command line ends in .exe, AND
    the legitimate forfiles-in-System32-spawning-System32-cmd.exe case does not apply. Review the Image path, the parent
    command line, and the cmd.exe command line against these criteria; a cmd.exe running from outside System32/SysWOW64 is
    the key signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run forfiles or a cmd.exe from a non-standard directory?
  context: Legitimate forfiles use is almost always invoked from System32 by administrators or scheduled maintenance.
    Knowing whether this user's role and the host's function include running directory-enumeration tooling, or running
    cmd.exe from a non-default path, is often the fastest way to separate a true positive from routine operations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is this parent expected to spawn this cmd.exe, and what started the parent?
  context: The parent-child relationship is the core signal. forfiles.exe spawns cmd.exe by design via its default
    cmd /c echo @file command, but a forfiles.exe (or any parent) running from a non-default directory alongside a planted
    cmd.exe is the abuse pattern. Tracing the parent's own origin (grandparent process) shows whether the chain is
    legitimate maintenance or an operator who staged forfiles.exe and cmd.exe in a working directory.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent spawn?
  context: If the parent invoked forfiles' default behavior to launch a planted cmd.exe, it may have spawned cmd.exe once
    per enumerated item or launched other tooling. Examining sibling processes from the same parent instance reveals the
    full scope of activity -- multiple children, or other suspicious binaries, point to orchestration rather than a single
    benign invocation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:masquerading.true_identity
  question: Is the spawned cmd.exe the genuine system binary or an impostor in a non-default path?
  context: The masquerade here is a cmd.exe running from outside System32/SysWOW64, relying on the trusted forfiles default
    command to execute it. Compare the Image path against the expected system locations (C:\Windows\System32 or
    C:\Windows\SysWOW64); a cmd.exe in any other directory is the deviation. OriginalFileName should still read Cmd.Exe even
    on a planted copy, so the signing party and signature status indicate whether this is the Microsoft-signed binary
    relocated or an unsigned/tampered impostor. The hash enables threat intelligence lookups to identify a known-good system
    cmd.exe versus a novel or malicious sample.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:masquerading.binary_origin
  question: How did this cmd.exe arrive in its current directory?
  context: 'A cmd.exe outside System32/SysWOW64 was placed there -- copied, downloaded, extracted, or dropped by a parent
    process. Tracing the file creation event for this filename reveals the delivery mechanism: a download tool, an archive
    extraction, a manual copy, or a dropper that staged both forfiles.exe and cmd.exe in the same working directory. A
    cmd.exe landing in a user-writable location (Desktop, Downloads, Temp, AppData) was likely planted; the process shown in
    Image is the writer.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:masquerading.renamed_binary_activity
  question: What did this cmd.exe do after execution, and does the same planted cmd.exe appear on other hosts?
  context: A planted cmd.exe invoked through forfiles still behaves like a command interpreter -- examining the child
    processes and command lines launched from it reveals its actual objective, whether reconnaissance, persistence
    registration, or follow-on tooling. The /c echo " command itself may be a probe; the children show what came next.
    The same cmd.exe path or hash appearing on multiple hosts suggests deliberate distribution rather than an isolated
    incident.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What was the full command line this cmd.exe ran with the /c echo " pattern, and what does it reveal?
  context: The command line that fired starts with /c echo " under the forfiles default-command pattern. Decode the full
    argument string, including anything chained after the echo, any quoted payload, file paths, or follow-on commands. For a
    benign forfiles enumeration the echoed value is typically a filename; an operator probe or staged payload often carries
    additional arguments beyond the echo.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|startswith: '/c echo "'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_parent_process.baseline
  question: Does this parent process normally spawn this cmd.exe on this host?
  context: A parent spawning cmd.exe from a non-default path is suspicious when it is novel. Historical frequency of this
    specific parent-to-cmd.exe pairing on this host distinguishes routine forfiles maintenance from a first-time or rare
    spawning relationship. Zero or very low counts indicate the pairing has not been seen before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_parent_process.clustering
  question: What other activity is associated with this parent process around the same time?
  context: Beyond the cmd.exe children, the parent may have generated other process executions, file events, or network
    connections close to the alert. If the parent is forfiles.exe staged in a working directory, surrounding activity may
    reveal what it was enumerating and what the operator did before and after.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.scope
  question: Is this parent-to-cmd.exe spawning pattern occurring on other hosts?
  context: The same parent launching cmd.exe from a non-default path across multiple hosts may indicate a scripted rollout or
    multi-host operation; a single occurrence is more likely targeted or a one-off. An environment-wide comparison helps
    calibrate severity and identify the scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|endswith:
        - .exe
        - .exe"
        Image|endswith: \cmd.exe
        CommandLine|startswith: /c echo "
      filter_main_parent_not_sys:
        ParentImage|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        ParentImage|endswith: \forfiles.exe
        Image|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        Image|endswith: \cmd.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|endswith:
        - .exe
        - .exe"
        Image|endswith: \cmd.exe
        CommandLine|startswith: /c echo "
      filter_main_parent_not_sys:
        ParentImage|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        ParentImage|endswith: \forfiles.exe
        Image|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        Image|endswith: \cmd.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope of compromise may be larger than a single
    endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|endswith:
        - .exe
        - .exe"
        Image|endswith: \cmd.exe
        CommandLine|startswith: /c echo "
      filter_main_parent_not_sys:
        ParentImage|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        ParentImage|endswith: \forfiles.exe
        Image|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        Image|endswith: \cmd.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms near the alert time.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the
    attack stages that preceded this event and help reconstruct the timeline. Masquerading a planted binary behind a trusted
    LOLBIN default behavior is often a defense-evasion step within a longer sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
