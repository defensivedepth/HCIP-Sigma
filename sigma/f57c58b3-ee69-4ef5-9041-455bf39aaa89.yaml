name: Remote CHM File Download/Execution Via HH.EXE
id: 2ac022a7-1e82-4102-af82-e4bd66470660
description: |
  Detects hh.exe (the Microsoft HTML Help executable) running with a command line that contains an http:// or https:// URL or a UNC path (\\), which causes it to open or fetch a remotely hosted compiled HTML help (.chm) file. The rule fires only when both conditions hold: the process is hh.exe (by OriginalFileName HH.exe or an Image ending in \hh.exe) AND the command line references a remote location. hh.exe is a Microsoft-signed binary, so this is a proxy-execution pattern — a trusted binary reaching out to an attacker-controlled location to load a CHM, which can embed script (mshta, VBScript, JScript, PowerShell) that runs on open. Determine whether the remote location is expected, what CHM was loaded, and what hh.exe spawned next.
type: detection
detection_id: f57c58b3-ee69-4ef5-9041-455bf39aaa89
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the hh.exe command line contain a remote URL or UNC path to a CHM file?
  context: Confirm the alert is a true positive by reviewing the exact command line and process identity against the rule's criteria — the process must be hh.exe (OriginalFileName HH.exe or an Image ending in \hh.exe) AND the command line must contain http://, https://, or a UNC path (\\). Note which remote-location form is present, because a UNC path points to internal/lateral staging while an http(s) URL points to external retrieval, and downstream questions weigh differently for each.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to open help content from a remote URL or UNC path via hh.exe?
  context: Legitimate hh.exe usage opens local .chm help files; opening a CHM directly from a remote URL or network share is rare in normal operation. Knowing whether the user role and host function involve remote help content, vendor support tooling, or software that legitimately stages CHM files over the network is often the fastest way to separate routine activity from proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What remote location and CHM file did hh.exe reference? Decode the full command line.
  context: The full command line reveals the exact remote location and CHM target. Extract the http(s) URL or UNC path, the .chm filename, and any additional parameters. A URL to a recently registered domain, a raw-paste or file-sharing host, or a UNC path to an unexpected share are the indicators that the loaded CHM is attacker-supplied rather than internal help content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - 'http://'
          - 'https://'
          - '\\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_network_endpoint.mechanism_decode
  question: What is the remote destination hh.exe contacted, and what do DNS, WHOIS, and threat intel reveal about it?
  context: The URL or UNC host in the command line is the source of the CHM. Investigate it — DNS resolution history, domain registration age, TLS certificate details, hosting reputation, and any known threat intelligence hits. Recently registered domains, raw file-hosting services, dynamic-DNS hosts, or self-signed certificates point to attacker-controlled infrastructure delivering the CHM.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1218.001.file_event
  question: Was a .chm file written to disk on this host shortly before or after hh.exe ran?
  context: When hh.exe fetches a remote CHM, the file is typically written to a temp, download, or user-profile directory before it is opened. A .chm appearing in a user-writable location (Downloads, %TEMP%, AppData, ProgramData, Public) close to the alert time confirms the artifact was retrieved and identifies the file to hash and submit for analysis. Trusted internal help content is usually staged under Program Files or a software install path instead.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.chm'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: attack:T1218.001.child_process_execution
  question: Did hh.exe spawn a script engine or interpreter as a direct child?
  context: A CHM can embed script that executes when the file is opened. The proxy-execution chain completes when hh.exe spawns a script host or interpreter — mshta.exe fetching a remote HTA, or powershell.exe, cmd.exe, wscript.exe, or cscript.exe running an embedded payload. Any of these as a direct child of hh.exe indicates the CHM carried executable content rather than passive help text.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
        Image|endswith:
          - '\mshta.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What other child processes did hh.exe spawn after it ran?
  context: Beyond the common script engines, any unexpected child of hh.exe reveals the actual impact of opening the CHM. Legitimate help-file viewing spawns nothing; payload execution may spawn additional binaries for download, discovery, or persistence. Review every child and its command line for follow-on actions.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned hh.exe, and is that parent chain expected for opening help content?
  context: The parent process shows how hh.exe was invoked. User-initiated help opens under explorer.exe or an application's help menu. A parent such as an Office application, an email client, an archive utility, a browser, mshta.exe, or a script host points to a lure document or downloaded archive driving the execution rather than a person clicking Help.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was hh.exe executed from its expected System32 or SysWOW64 path?
  context: hh.exe normally runs from C:\Windows or C:\Windows\SysWOW64. A copy running from a user-writable directory (Downloads, %TEMP%, AppData) — or a differently named binary whose OriginalFileName is still HH.exe — suggests the binary was relocated or renamed to evade path-based allowlisting. Compare Image against OriginalFileName to spot a rename.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously run hh.exe against a remote location, what parents and users drove it, and does the current alert fit that pattern?
  context: Even a Microsoft-signed binary can be abused. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern — hh.exe with a remote URL or UNC path — has historically run here, not generic hh.exe usage. A new parent process, an unexpected user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: HH.exe
      - Image|endswith: \hh.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
        - \\\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the hh.exe remote-CHM pattern over the past 90 days, and what command-line shapes are typical?
  context: A remote-CHM invocation with no prior history on a host is more suspicious than one seen regularly under stable parents. This query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic hh.exe usage. The command-line projection lets the analyst compare typical invocation shapes — known internal help servers, vendor support URLs — against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: HH.exe
      - Image|endswith: \hh.exe
      selection_cli:
        CommandLine|contains:
        - http://
        - https://
        - \\\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- source: template:cue_user_actor.baseline
  question: Does this user normally run hh.exe against remote help content?
  context: Compare the user's current action against their historical behavior. A user who has never opened help content from a remote URL or UNC path is more suspicious than one who does so as part of a known role or workflow. User role and typical toolset should align with loading network-hosted CHM files.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is the parent-plus-hh.exe launch combination historically routine on this host or environment-wide, or is the parent unusual for hh.exe?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account), user identity does not attribute the behavior. The meaningful pivot is the launch mechanism — which parent process spawned hh.exe, and whether that pair is historically common. A new or rare parent for hh.exe is the deviation worth chasing; a pair already responsible for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar execution on other hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did the same parent-plus-hh.exe combination fire on other hosts in the same window, indicating coordinated automation rather than isolated activity?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus hh.exe — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a lure document opening, defense tampering, reconnaissance, or credential access — may reveal the stages that preceded the CHM execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:lolbin.technique_class_lateral
  question: Were any other download or proxy-execution LOLBins used on this host recently?
  context: Actors who use one trusted-binary proxy often use several — if hh.exe fetched a remote CHM, check whether certutil, bitsadmin, curl, mshta, rundll32, or regsvr32 were also used to download or execute payloads. Finding multiple LOLBins performing download or proxy execution in the same window strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
