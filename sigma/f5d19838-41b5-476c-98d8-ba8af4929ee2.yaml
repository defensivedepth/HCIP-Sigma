name: LOL-Binary Copied From System Directory
id: 22a6224f-bc9e-4312-bd76-ce972b58cebb
description: |
  Detects a copy operation that moves a known living-off-the-land binary (bitsadmin, certutil, mshta, rundll32, wscript, cscript, calc, cmdl32, ie4uinit) out of a protected system directory (System32, SysWOW64, WinSxS) to another location on disk. Relocating a signed system binary to a user-writable or non-canonical path is a common precursor to running it from a location that path-based or directory-anchored detections do not watch, often paired with renaming it. The rule fires when a command line references a system source directory AND one of the named LOLBINs AND uses one of several copy mechanisms -- either cmd copy, a PowerShell copy cmdlet/alias (Copy-Item, cpi, cp, copy), or robocopy/xcopy (matched by image name or OriginalFileName). The investigation should determine which copy mechanism fired, what the source and destination paths are, whether the relocated binary was subsequently executed, and whether the same operation appears on other hosts.
type: detection
detection_id: f5d19838-41b5-476c-98d8-ba8af4929ee2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show a system-directory LOLBIN being copied, and which copy mechanism fired?
  context: >-
    The rule fires when ALL of these hold -- a system source path (System32, SysWOW64, or WinSxS), one of the named LOLBINs
    (bitsadmin, calc, certutil, cmdl32, cscript, mshta, rundll32, wscript, ie4uinit), AND at least one copy mechanism. Note
    which branch fired, because it steers the rest of the investigation: cmd copy (Image cmd.exe with "copy "), a PowerShell
    copy (Copy-Item, cpi, cp, or copy in powershell.exe/pwsh.exe), or robocopy/xcopy (matched by image name or by OriginalFileName,
    which catches a renamed copy of those tools). Confirm the source and destination paths in the full command line before
    investing further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to copy system binaries to other locations?
  context: >-
    Legitimate administration, deployment scripting, and backup tooling can copy system binaries, but it is uncommon for an
    ordinary workstation user. Knowing whether the user role and host function involve software packaging, imaging, or admin
    automation is often the fastest way to separate a routine operation from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: For robocopy/xcopy matches, does the on-disk image name agree with its OriginalFileName, or was the copy tool itself renamed?
  context: >-
    The robocopy/xcopy branch matches either by image name OR by OriginalFileName, which means the rule also catches a copy
    of robocopy.exe/xcopy.exe that was itself renamed to something innocuous. When the Image path basename and the embedded
    OriginalFileName (robocopy.exe / XCOPY.EXE) disagree, the copy tool was relocated and renamed before use. The signing
    chain (Microsoft-signed system binary versus unsigned or third-party) and the file hash determine whether the running
    image is the genuine utility or a tampered stand-in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.mechanism_decode
  question: Decode the full copy command -- what is the source LOLBIN, what is the destination path, and what flags were used?
  context: >-
    The full command line reveals the actual operation: which system binary was copied, the destination directory (user-writable
    paths like AppData, Temp, Public, or Desktop indicate staging for evasion; another system or program path may be benign),
    and any flags (/Y silent overwrite, /Q quiet, /C continue-on-error for xcopy; -Force for Copy-Item). Rare or unusual argument
    combinations for these tools are the tuning signal worth flagging. The query scopes to copy commands referencing a system
    source path on this host so the result reflects the rule's pattern rather than every cmd/powershell invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_copy:
        CommandLine|contains:
          - 'copy '
          - copy-item
          - 'cpi '
          - ' cp '
      selection_target:
        CommandLine|contains:
          - \System32
          - \SysWOW64
          - \WinSxS
      condition: selection_host and selection_copy and selection_target
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: For the PowerShell copy branch, what source and destination did the copy cmdlet reference, and was any obfuscation used?
  context: >-
    The PowerShell branch matches Copy-Item and its aliases (cpi, cp, copy). These are plain-text copy operations rather than
    -EncodedCommand payloads, so the readable task is to identify the exact source LOLBIN path and destination, and to check
    for obfuscation that hides them -- backtick escaping, string concatenation, variable substitution, or splatting. Resolve
    any variables to confirm the literal paths the copy actually moved.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the copy operation and any surrounding script?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually executed, which can reveal copy steps and follow-on
    actions wrapped around them even when the command line is terse or obfuscated. If PowerShell operational logs are not ingested
    in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and decode the copy command
    from the alerting command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:cue_artifact.mechanism_decode
  question: At the destination path, is the copied file byte-identical to the system LOLBIN, or has its content been modified?
  context: >-
    The copy may be a faithful relocation of the signed system binary, or the source/destination may differ -- a patched,
    trojanized, or padded variant. Compare the destination file's content and size against the genuine system binary, and
    check for appended data, modified imports, or packer signatures. This content question is distinct from a hash/reputation
    lookup; it asks what is actually in the file at the new location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- source: template:cue_artifact.artifact_verification
  question: What is the hash of the copied file at the destination, and does it have known threat intel detections?
  context: >-
    The destination file's hash provides a unique identifier for reputation lookup. A hash matching the genuine signed system
    binary supports a benign relocation; an unknown or flagged hash indicates the relocated file is not the original utility.
    Submit the hash to threat intelligence to determine whether it is known-good, known-malicious, or previously unseen.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Hashes
- source: template:cue_process_tool.process_chain
  question: What process spawned the copy tool, and is that parent chain expected?
  context: >-
    The parent process shows how the copy was invoked. An interactive shell launched from explorer.exe under an admin during
    a deployment looks different from a copy spawned by an Office application, a script host (wscript.exe, mshta.exe), or a
    remote-execution service. An unexpected parent points toward an automated or operator-driven relocation rather than routine
    administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: llm_generated
  question: Was the relocated LOLBIN executed from its new path after the copy, and what was the timing between copy and execution?
  context: >-
    Relocating a system binary is only meaningful if it is then run from the new location. Look for a later process_creation
    whose Image path matches the copy destination rather than the canonical system directory. A short interval between the
    copy and the first execution from the new path is the time-correlation signal that ties relocation to use; a long gap
    or no execution at all weakens the case for active abuse.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%file_paths%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did the relocated LOLBIN do after execution, and is the same destination file present on other hosts?
  context: >-
    The point of relocating a LOLBIN is to run it from an unwatched path while preserving its function. Child processes, file
    operations, and command-line arguments from the relocated binary reveal its objective -- download, decode, proxy execution,
    or scripting. The same relocated file appearing on multiple hosts points to deliberate distribution rather than an isolated
    action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains: 'copy '
      selection_tools_pwsh:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - copy-item
        - ' copy '
        - 'cpi '
        - ' cp '
      selection_tools_other:
      - Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
      - OriginalFileName:
        - robocopy.exe
        - XCOPY.EXE
      selection_target_path:
        CommandLine|contains:
        - \System32
        - \SysWOW64
        - \WinSxS
      selection_target_lolbin:
        CommandLine|contains:
        - \bitsadmin.exe
        - \calc.exe
        - \certutil.exe
        - \cmdl32.exe
        - \cscript.exe
        - \mshta.exe
        - \rundll32.exe
        - \wscript.exe
        - \ie4uinit.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_tools_* and all of selection_target_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains: 'copy '
      selection_tools_pwsh:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - copy-item
        - ' copy '
        - 'cpi '
        - ' cp '
      selection_tools_other:
      - Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
      - OriginalFileName:
        - robocopy.exe
        - XCOPY.EXE
      selection_target_path:
        CommandLine|contains:
        - \System32
        - \SysWOW64
        - \WinSxS
      selection_target_lolbin:
        CommandLine|contains:
        - \bitsadmin.exe
        - \calc.exe
        - \certutil.exe
        - \cmdl32.exe
        - \cscript.exe
        - \mshta.exe
        - \rundll32.exe
        - \wscript.exe
        - \ie4uinit.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_tools_* and all of selection_target_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the surrounding window reveals whether this copy is part of broader hands-on
    activity. The same user triggering similar relocations or follow-on actions on multiple endpoints widens the apparent scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains: 'copy '
      selection_tools_pwsh:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - copy-item
        - ' copy '
        - 'cpi '
        - ' cp '
      selection_tools_other:
      - Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
      - OriginalFileName:
        - robocopy.exe
        - XCOPY.EXE
      selection_target_path:
        CommandLine|contains:
        - \System32
        - \SysWOW64
        - \WinSxS
      selection_target_lolbin:
        CommandLine|contains:
        - \bitsadmin.exe
        - \calc.exe
        - \certutil.exe
        - \cmdl32.exe
        - \cscript.exe
        - \mshta.exe
        - \rundll32.exe
        - \wscript.exe
        - \ie4uinit.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (1 of selection_tools_* and all of selection_target_*) and _pb_scope
    fields:
    - host.name
