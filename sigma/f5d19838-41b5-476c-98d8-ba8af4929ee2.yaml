      reason: "KEEP_EXACT file_event query (TargetFilename|contains %file_name% over -30d, fields TargetFilename/Image) targets the file-arrival/drop event. For this rule the relocated file's arrival IS the alerting copy itself, so the drop-event angle is redundant with the copy command (Q4) and the content/hash questions (Q7/Q8). The execution-from-new-path + copy-to-exec timing angle that covers time_correlation needed a different query, so Q10 is authored as llm_generated rather than a deviation from this KEEP_EXACT template."
