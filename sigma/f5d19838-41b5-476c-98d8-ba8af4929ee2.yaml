        - XCOPY.EXE
      selection_target_path:
        CommandLine|contains:
        - \System32
        - \SysWOW64
        - \WinSxS
      selection_target_lolbin:
        CommandLine|contains:
        - \bitsadmin.exe
        - \calc.exe
        - \certutil.exe
        - \cmdl32.exe
        - \cscript.exe
        - \mshta.exe
        - \rundll32.exe
        - \wscript.exe
        - \ie4uinit.exe
