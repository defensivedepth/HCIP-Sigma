    - template: cue_host_context.precursor
      reason: "Rule is a single defense-evasion staging action, not an execution/credential outcome whose disposition turns on prior-alert chaining; the follow-on questions (Q10/Q11) already pivot forward to what the relocated binary did. Prior-alert correlation would not change the read of a copy operation."
    - template: cue_process_tool.baseline
      reason: "Generic per-binary baseline (Image|endswith %Image% over 90d) is superseded by the rule-pattern baseline_deviation (Q17), which scopes to the actual copy-from-system firing pattern rather than all cmd/powershell/robocopy usage."
    - template: cue_process_tool.follow_on
      reason: "Child-process follow-on of the copy tool is the same ParentImage|endswith %Image% query as masquerading.renamed_binary_activity (Q11); the masquerading version additionally frames the cross-host scope dimension, so it supersedes follow_on."
    - template: cue_process_tool.clustering
      reason: "Host-wide co-occurring-tool aggregation overlaps user clustering (Q15) and host baseline_deviation (Q17); dropped to keep the set focused on the relocation chain."
    - template: cue_artifact.baseline
      reason: "First-seen-on-host check for the destination file overlaps the file content/hash questions (Q7/Q8) which already establish whether the copied file is the genuine binary; the relocation timing is more directly answered by Q10."
    - template: universal.endpoint_protection_health
      reason: "Recommended-only generic tamper sweep. defense_tampering is not a confirmed technique set for this rule and the rule fires on a relocation-staging action, not payload execution or credential access; no other selected question is a tamper sweep, but the disposition of a copy operation does not turn on whether AV/EDR was weakened first."
