name: HackTool - Htran/NATBypass Execution
id: 6fe49f77-dcb4-4dc8-939b-79952f049d7a
description: |
  Detects execution of Htran, lcx, or Htran-like tunneling utilities such as NATBypass, identified either by image name (htran.exe, lcx.exe) or by the characteristic tunnel-mode flags in the command line (.exe -tran, .exe -slave). The rule fires when EITHER the binary name matches OR the command line carries one of these tunnel flags, so confirm which branch fired before proceeding. These tools establish reverse TCP tunnels that bridge an internal service (often RDP or SMB) out through an externally reachable relay, bypassing inbound firewall restrictions; the -slave mode runs on the internal host and the -tran/-listen modes run on the relay. Legitimate use is rare and usually limited to authorized penetration testing; the investigation should establish what was tunneled, to where, under which account, and whether the same pattern appears on other hosts.
type: detection
detection_id: f5e3b62f-e577-4e59-931e-0a15b2b94e1e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Did this alert fire on the binary name (htran.exe / lcx.exe) or on a tunnel-mode flag in the command line?
  context: This rule fires when EITHER the image name ends in htran.exe or lcx.exe OR the command line contains a tunnel-mode flag (.exe -tran or .exe -slave). Review the exact Image and CommandLine from the triggering event and note which branch matched. A name-branch fire identifies the tool by its on-disk name even if renamed flags differ; a flag-branch fire identifies tunnel behavior even when the binary has been renamed off the known names. Which branch fired determines whether downstream binary-name questions or command-line questions carry the weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run TCP tunneling or port-forwarding utilities?
  context: Tunneling utilities are almost never part of routine endpoint or server operation. Knowing whether the account is an administrator or pentester and whether the host has any sanctioned tunneling use case is often the fastest way to separate an authorized assessment from operator-driven pivoting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this Htran/NATBypass execution part of an authorized penetration test or red team engagement?
  context: Tunneling and pivoting tools are used in sanctioned security assessments to demonstrate lateral reach. Before deeper analysis, check whether a penetration test or red team exercise is active on this host or network segment. An authorized engagement with matching tool usage and timing resolves the alert without further work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:remote_access_tool.tool_authorization
  question: Is this tunneling tool on the organization's approved software list for this host?
  context: Organizations rarely sanction generic TCP tunneling tools like htran, lcx, or NATBypass for production endpoints. Any such tool outside an approved list represents shadow IT or attacker-deployed pivoting infrastructure and should be checked regardless of who placed it there.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- source: template:remote_access_tool.active_session_context
  question: Is there a current helpdesk ticket, maintenance window, or approved test case explaining this tunnel?
  context: Legitimate tunneling, if it occurs at all, correlates with a documented administrative or testing purpose. If no support context, change ticket, or approved use case exists for this activity, the tool was likely placed by an operator establishing a covert path into the internal network.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: Decode the full command line — which tunnel mode ran, and what source/relay addresses and ports were specified?
  context: The command line carries the operational intent. The -slave mode runs on the internal host and takes a local service address plus a relay address (for example 127.0.0.1:3389 forwarded out to a relay on a chosen port); the -tran and -listen modes run on the relay and define the two ports clients and the slave connect to. Decode the addresses and ports to learn what internal service is being exposed and where the relay sits. Watch for high or non-standard ports and well-known proxy ports such as 1080, 8080, or 4444, and for the -log flag, which writes a timestamped data-capture file in the working directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:hacking_tool.tool_capability_used
  question: Which tunnel role was invoked — internal slave, relay listener, or local forwarder?
  context: These utilities are multi-mode. The -slave role marks this host as the compromised internal endpoint connecting outbound to a relay; -listen marks this host as the public relay accepting the inbound tunnel and external clients; -tran is a local forwarder. The role determines the direction of the pivot and which other hosts to examine — a slave fire points outward to a relay, a listener fire points back toward an internal slave.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this tool, and is that parent chain expected?
  context: The parent process shows how the tunnel was launched. An interactive shell, a script host such as wscript.exe or powershell.exe, or an Office application as the parent points to hands-on-keyboard deployment or a delivered payload, whereas a legitimate parent is rare for tools like this. Walking up from the parent reveals what staged the tool onto the host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:remote_access_tool.connection_destination
  question: What outbound connections did this host make around the alert, and to which external relay addresses and ports?
  context: A tunneling tool's value is in its network legs. Look for outbound TCP connections from this host to an external relay, often on two ports of the same public address, and for connections to internal services being forwarded. Destination addresses and ports reveal where the relay sits and what is being bridged; high or non-standard ports and proxy ports such as 1080, 8080, or 4444 are worth scrutiny.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- source: attack:T1090.tuning_parameter
  question: Are there outbound connections from this host to proxy or high-numbered ports beyond the tunneling binary itself?
  context: The relay legs of a tunnel can carry traffic from processes other than the named binary, and operators frequently pick well-known proxy ports (1080, 8080, 4444) or arbitrary high ports for the relay. Looking at outbound connections to these ports across all processes on the host catches forwarded traffic, a renamed binary, or a second tunneling component that the image-name filter would miss.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 1080
          - 8080
          - 4444
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- source: template:cue_process_tool.baseline
  question: Has this tunneling binary ever run on this host before?
  context: A binary that has never appeared on a host is more concerning than one with regular history. Zero or very low counts over 90 days indicate first-time execution, consistent with a tool freshly staged for a pivot rather than a sanctioned utility in routine use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously matched the rule's pattern, what parents and users drove it, and does the current alert fit?
  context: Even rarely, a host may have a history of matching this pattern. The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how this specific tunnel pattern — not generic binary usage — has run here. A new parent process, an unexpected account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \htran.exe
        - \lcx.exe
      selection_cli:
        CommandLine|contains:
        - '.exe -tran '
        - '.exe -slave '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts matched the rule's pattern in the past week, and does the cross-host spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this tunnel pattern rather than generic binary usage. Many hosts matching the same pattern can indicate scripted deployment; a single host or a small unrelated set points to manual operator activity. Use the host spread and parent consistency to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \htran.exe
        - \lcx.exe
      selection_cli:
        CommandLine|contains:
        - '.exe -tran '
        - '.exe -slave '
      condition: 1 of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run tunneling or pivoting tools anywhere in the environment?
  context: Compare the account's current action against its history. A user who has never run this class of tool is more concerning than one who does so as part of a known role. User role and typical toolset should align with running a TCP tunnel; most accounts have no business doing so.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary pairing historically routine on this host or across the environment, or is the parent unusual for this tool?
  context: When the alert fires under a service principal such as SYSTEM, the user identity does not attribute behavior, so the meaningful pivot is the launch mechanism — which parent process spawned the tunneling binary and whether that pairing is historically common. A new or rare parent for this binary is the deviation; a pairing that already accounts for many prior events is automation rather than an operator.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around the time of this alert?
  context: Tracking the account's activity across all hosts reveals lateral movement or staging on multiple endpoints. If the same user established tunnels or ran related tooling elsewhere in the same window, the scope of the operation is larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary pairing fire on other hosts in the same window — a coordinated rollout, or isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since every host runs SYSTEM-owned processes constantly. The meaningful question is whether the same launch mechanism — parent process plus spawned binary — appeared on other hosts in the alert window. Multiple hosts point to pushed or scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
