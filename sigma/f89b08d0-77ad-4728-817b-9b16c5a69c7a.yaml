name: HackTool - SharpImpersonation Execution
id: 51c2aeb4-b371-4ba9-84c5-ac1ac652efb3
description: |
  Detects execution of SharpImpersonation, a token-impersonation utility that enumerates accessible primary/impersonation
  tokens on a host and spawns processes under another user's identity (commonly SYSTEM or a logged-on administrator) via
  CreateProcessWithTokenW / CreateProcessAsUserW or ImpersonateLoggedOnUser. The rule fires when EITHER the image/original
  filename resolves to SharpImpersonation.exe OR the command line carries one of its operating modes (user:+binary:,
  user:+shellcode:, or technique:CreateProcessAsUserW / technique:ImpersonateLoggedOnuser). Legitimate hits are limited to
  authorized red-team or penetration-test activity; otherwise the investigation should establish under which identity the
  tool ran, what it spawned, and whether a higher-privileged token was assumed.
type: detection
detection_id: f89b08d0-77ad-4728-817b-9b16c5a69c7a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does this alert match the rule, either by the SharpImpersonation.exe image/original filename OR by an impersonation
    mode in the command line?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires on EITHER branch, so note which one matched.
    The image branch is SharpImpersonation.exe by name or original filename; the command-line branch is one of the operating
    modes (user:+binary:, user:+shellcode:, or technique:CreateProcessAsUserW / technique:ImpersonateLoggedOnuser). A
    command-line-only match means the binary may have been renamed, which raises suspicion; an image-only match without a
    recognizable mode may be a copied or staged binary that has not yet run an impersonation action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run a token-impersonation tool?
  context: Token impersonation requires SeImpersonatePrivilege or SeAssignPrimaryTokenPrivilege, present on most service
    accounts but not standard users. Knowing whether the account and host function are consistent with offensive tooling is
    the fastest path to separating authorized testing from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this SharpImpersonation execution part of an authorized penetration test or red team engagement?
  context: Offensive impersonation tooling is used in authorized security assessments. Before investing investigation time,
    check whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement
    with matching tool usage and timing resolves the alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which SharpImpersonation mode was invoked, and which target user was named?
  context: >-
    SharpImpersonation has distinct modes that determine impact. The user-plus-binary mode spawns a process under the
    target user, the user-plus-shellcode mode injects shellcode into the target user's first process, and the
    technique:CreateProcessAsUserW / technique:ImpersonateLoggedOnuser selectors choose the impersonation API. The user
    value names the identity being assumed (typically SYSTEM or a logged-on administrator), which determines the scope of
    potential compromise.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What did this SharpImpersonation invocation do? Decode the full command line, including the user, binary,
    shellcode, and technique arguments.
  context: >-
    The full command line reveals the specific impersonation action. Decode the target named by the user argument, any
    path in the binary argument or base64/URL value in the shellcode argument, and the technique selector. A shellcode
    value pointing at a URL means a remote payload was fetched; a binary value spawns that program under the impersonated
    identity. This view scopes to all SharpImpersonation runs on this host within the window, which may capture a preceding
    list invocation that enumerated available tokens.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:hacking_tool.tool_specific_artifacts
  question: Did SharpImpersonation write any files on the host, such as a dropped service-binary stub or staged payload?
  context: >-
    The tool can drop a SYSTEM-context payload via a service-binary stub and may stage a binary-argument target or a
    downloaded shellcode payload on disk. Checking for files created by the tool's process confirms execution and reveals
    the scope of activity even after the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned SharpImpersonation, and is that parent chain expected?
  context: The parent process reveals how the tool was launched and what privilege context it inherited. A service-context
    parent (a process holding SeImpersonatePrivilege) is exactly the starting point this technique abuses; a parent such as
    an interactive shell, mshta.exe, wscript.exe, or an Office application points to hands-on-keyboard or macro-driven
    delivery. Note the parent's own user/SID for comparison against the spawned child's identity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1134.001.token_api_access
  question: Did SharpImpersonation open a handle into another process to duplicate its token around the time of the alert?
  context: Token impersonation works by opening a handle into a process owned by the target identity and duplicating its
    token (OpenProcess plus OpenProcessToken plus DuplicateTokenEx). Process-access events from the SharpImpersonation
    process into a higher-privileged target, especially lsass.exe or a SYSTEM/administrator-owned process, are the in-memory
    evidence of the token theft that precedes the impersonated spawn. If process-access telemetry is not collected in this
    environment, treat zero results as a visibility gap rather than evidence nothing occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        SourceImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetImage
      - GrantedAccess
      - SourceImage
- source: attack:T1134.003.new_logon_session
  question: Did a new logon session appear on this host whose identity differs from the account that ran the tool?
  context: Make-and-impersonate-token and token-theft chains surface in the security log as a new logon (Event 4624),
    frequently LogonType 9 (NewCredentials) or a network logon sourced locally, with no interactive desktop. Correlate the
    logon time and target account against the user argument and the spawning process so a freshly created or assumed
    higher-privileged session is not missed. If security audit logs are not ingested in this environment, treat zero
    results as a visibility gap.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4672
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - SubjectUserName
- source: template:cue_process_tool.follow_on
  question: What processes were spawned under the impersonated identity after SharpImpersonation ran?
  context: The processes spawned by the tool reveal its actual impact, since the whole point is to run a child (cmd.exe,
    powershell.exe, or a named binary) under a different, higher-privileged user. Compare the child's user/SID against the
    parent's to confirm an identity switch, and inspect those children for post-impersonation actions such as credential
    access or lateral movement.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does this
    alert fit?
  context: Even sanctioned tooling can be abused. The query mirrors the rule's selection structure scoped to this host, so
    the resulting parent/user distribution reflects how this specific firing pattern has historically run here, not generic
    binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpImpersonation.exe
      - OriginalFileName: SharpImpersonation.exe
      selection_cli:
      - CommandLine|contains|all:
        - ' user:'
        - ' binary:'
      - CommandLine|contains|all:
        - ' user:'
        - ' shellcode:'
      - CommandLine|contains:
        - ' technique:CreateProcessAsUserW'
        - ' technique:ImpersonateLoggedOnuser'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpImpersonation.exe
      - OriginalFileName: SharpImpersonation.exe
      selection_cli:
      - CommandLine|contains|all:
        - ' user:'
        - ' binary:'
      - CommandLine|contains|all:
        - ' user:'
        - ' shellcode:'
      - CommandLine|contains:
        - ' technique:CreateProcessAsUserW'
        - ' technique:ImpersonateLoggedOnuser'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpImpersonation.exe
      - OriginalFileName: SharpImpersonation.exe
      selection_cli:
      - CommandLine|contains|all:
        - ' user:'
        - ' binary:'
      - CommandLine|contains|all:
        - ' user:'
        - ' shellcode:'
      - CommandLine|contains:
        - ' technique:CreateProcessAsUserW'
        - ' technique:ImpersonateLoggedOnuser'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity on multiple endpoints. If the
    same user triggered similar activity on several hosts, the scope of compromise may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpImpersonation.exe
      - OriginalFileName: SharpImpersonation.exe
      selection_cli:
      - CommandLine|contains|all:
        - ' user:'
        - ' binary:'
      - CommandLine|contains|all:
        - ' user:'
        - ' shellcode:'
      - CommandLine|contains:
        - ' technique:CreateProcessAsUserW'
        - ' technique:ImpersonateLoggedOnuser'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms near the impersonation activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering,
    reconnaissance, or credential access, may reveal the attack stages that preceded the impersonation activity and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
