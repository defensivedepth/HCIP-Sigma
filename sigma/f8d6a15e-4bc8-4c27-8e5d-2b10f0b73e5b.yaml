name: Suspicious Powercfg Execution To Change Lock Screen Timeout
id: 485c65b9-6298-4cec-b396-0c7780890f9c
description: |
  Detects powercfg.exe modifying power-scheme settings that govern display and standby
  timeouts. The rule fires when powercfg.exe (or a binary whose OriginalFileName is
  PowerCfg.exe) runs AND the command line either sets the console-lock display-off value
  via '/setacvalueindex SCHEME_CURRENT SUB_VIDEO VIDEOCONLOCK' or changes a standby timeout
  via '-change -standby-timeout-'. Administrators legitimately adjust these for kiosks,
  presentations, or power policy, so the command alone is not malicious; the same calls are
  used during hands-on-keyboard intrusions to keep a session from auto-locking while the
  operator works. Determine who launched it, what value was set, and whether other
  defense-evasion or interactive activity surrounds it.
type: detection
detection_id: f8d6a15e-4bc8-4c27-8e5d-2b10f0b73e5b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match the powercfg timeout-modification pattern this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when powercfg.exe
    runs AND the command line either sets the console-lock display-off value
    ('/setacvalueindex SCHEME_CURRENT SUB_VIDEO VIDEOCONLOCK') or changes a standby timeout
    ('-change -standby-timeout-'). Review the exact command line and confirm which of the two
    timeout patterns fired, since the value being set and the affected setting differ between them.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to change power-scheme display or standby timeouts?
  context: >-
    Legitimate adjustment of display and standby timeouts is common on kiosks, lab machines,
    presentation hosts, and during imaging or power-policy rollouts. Knowing whether this user
    role and host function normally involve power configuration is often the fastest way to
    separate routine administration from an operator extending the timeout to suppress
    auto-lock during a session.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exact value did powercfg set, and which power setting did it change?
  context: >-
    The full command line reveals the operational effect. Decode the target setting and the value
    applied. A VIDEOCONLOCK or standby timeout pushed to a large number or to 0 (never) keeps the
    screen on and prevents the lock screen from engaging; small values are typically benign power
    tuning. This host-scoped view captures any sequential powercfg invocations that together form
    one logical change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned powercfg.exe, and is that parent chain expected?
  context: >-
    The parent process reveals how powercfg was invoked. Interactive administration usually
    descends from explorer.exe or a console shell launched by a logged-in admin. A parent such
    as a script host (wscript.exe, cscript.exe), a batch file driving cmd.exe, an Office
    application, or an unexpected installer points toward automated or operator-driven evasion
    rather than routine power management.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run powercfg.exe?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly.
    Many systems never invoke powercfg interactively; servers and workstations that do are often
    driven by imaging or management tooling. Zero or very low historical counts indicate
    first-time or rare execution worth scrutinizing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this powercfg pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even routine tools get abused. This query mirrors the rule's selection scoped to this host, so
    the parent and user distribution reflects how the rule's specific timeout-modification pattern
    has historically run here rather than generic powercfg usage. A new parent process, an
    unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_power:
      - Image|endswith: \powercfg.exe
      - OriginalFileName: PowerCfg.exe
      selection_standby:
      - CommandLine|contains|all:
        - '/setacvalueindex '
        - SCHEME_CURRENT
        - SUB_VIDEO
        - VIDEOCONLOCK
      - CommandLine|contains|all:
        - '-change '
        - -standby-timeout-
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did powercfg.exe spawn afterward?
  context: >-
    powercfg.exe legitimately spawns no children for a timeout change. Processes spawned by it,
    or by the same shell immediately afterward, can reveal the broader operation - additional
    defense tampering, recovery inhibition, or payload staging that accompanies an operator
    keeping a session alive.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired this powercfg pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    timeout-modification pattern rather than generic powercfg usage. Many hosts firing the same
    pattern points to scripted deployment or management automation; one host or a small unrelated
    set points to manual operator activity. Use the host distribution and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_power:
      - Image|endswith: \powercfg.exe
      - OriginalFileName: PowerCfg.exe
      selection_standby:
      - CommandLine|contains|all:
        - '/setacvalueindex '
        - SCHEME_CURRENT
        - SUB_VIDEO
        - VIDEOCONLOCK
      - CommandLine|contains|all:
        - '-change '
        - -standby-timeout-
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_power:
      - Image|endswith: \powercfg.exe
      - OriginalFileName: PowerCfg.exe
      selection_standby:
      - CommandLine|contains|all:
        - '/setacvalueindex '
        - SCHEME_CURRENT
        - SUB_VIDEO
        - VIDEOCONLOCK
      - CommandLine|contains|all:
        - '-change '
        - -standby-timeout-
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_power:
      - Image|endswith: \powercfg.exe
      - OriginalFileName: PowerCfg.exe
      selection_standby:
      - CommandLine|contains|all:
        - '/setacvalueindex '
        - SCHEME_CURRENT
        - SUB_VIDEO
        - VIDEOCONLOCK
      - CommandLine|contains|all:
        - '-change '
        - -standby-timeout-
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar power-configuration or defense-evasion
    activity on more than one host, the scope of the operation may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_power:
      - Image|endswith: \powercfg.exe
      - OriginalFileName: PowerCfg.exe
      selection_standby:
      - CommandLine|contains|all:
        - '/setacvalueindex '
        - SCHEME_CURRENT
        - SUB_VIDEO
        - VIDEOCONLOCK
      - CommandLine|contains|all:
        - '-change '
        - -standby-timeout-
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the surrounding activity reveals what led to this
    event and what followed. Aggregating by process and parent collapses repetitive agent noise
    into high-count rows while novel parent-child pairs stand out at low counts - look for
    reconnaissance, additional defense tampering, recovery inhibition, or persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - defense tampering, recovery inhibition, credential
    access, or reconnaissance - may reveal the attack stages that preceded extending the lock-screen
    timeout. Timeout extension is frequently one of several preparatory steps an operator takes
    before working interactively, so a cluster of preceding alerts reframes this one.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    Tampering typically precedes the rest of an operation. The query surfaces direct attempts to
    disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch
    AMSI/ETW. Extending the lock-screen timeout is a common companion to such preparation, so
    populated rows shift the disposition toward operator preparation; review the parent process
    and signing chain to identify the writer. Zero rows is a useful protection-looks-healthy
    signal - kernel-level driver tampering and in-memory patches will not appear here.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
