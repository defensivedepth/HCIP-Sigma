name: Renamed Schtasks Execution
id: 51fc3d23-5196-4c05-a77f-df2eab44320e
description: |
  Detects schtasks.exe being run under a different filename to evade name-based monitoring of scheduled-task
  activity. The rule fires on either of two branches: a process whose command line carries schtasks operation
  verbs (/create, /delete, /query, /change, /run, /end) together with task flags (/tn, /tr, /sc, /st, /ru, /fo)
  while the command line does NOT contain the string "schtasks", OR a process whose PE metadata OriginalFileName
  is schtasks.exe while its on-disk image does NOT end in \schtasks.exe. Either branch indicates the scheduled-task
  utility executing from a renamed binary. Legitimate scheduling is normally done through the real schtasks.exe,
  GPO, or management tooling, so the investigation should establish what task was being configured, the true
  identity and origin of the renamed binary, and whether the activity fits known automation on this host.
type: detection
detection_id: f91e51c9-f344-4b32-969b-0b6f6b8537d4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Did this fire on the renamed-binary metadata mismatch, the schtasks argument pattern, or both?
  context: >-
    Confirm the alert is a true positive by reviewing the triggering event against the rule's two branches. One
    branch matches when the command line carries schtasks operation verbs (/create, /delete, /query, /change, /run,
    /end) and task flags (/tn, /tr, /sc, /st, /ru, /fo) but the command line does not contain the literal string
    "schtasks". The other matches when the PE OriginalFileName is schtasks.exe but the image on disk does not end in
    \schtasks.exe. Note which branch fired: the metadata-mismatch branch makes the binary-identity and origin
    questions load-bearing, while the argument branch makes the decoded task configuration the priority.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to create or manage scheduled tasks from the command line?
  context: >-
    Legitimate scheduled-task administration is common on servers and admin workstations but unusual under most user
    accounts, and it is normally performed with the real schtasks.exe or through management tooling rather than a
    renamed binary. Knowing whether this user role and host function routinely involve direct command-line task
    management is often the fastest way to separate authorized administration from an evasion attempt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:masquerading.true_identity
  question: What is the actual identity of this binary based on its metadata and hash?
  context: >-
    When schtasks.exe is renamed, the PE OriginalFileName still reads schtasks.exe while the image name on disk does
    not. Comparing the Image path against OriginalFileName confirms the mismatch the rule fired on, and the signing
    status indicates whether this is the Microsoft-signed system binary relocated and renamed, or an unsigned or
    third-party file impersonating it. The file hash enables a reputation lookup to determine whether this is the
    genuine Windows utility, a known malicious sample, or a novel binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:scheduled_task.task_configuration
  question: What scheduled task was configured, and what command does it run? Decode the full command line.
  context: >-
    The command line carries the task name (/TN), the command or program to execute (/TR), the schedule type (/SC,
    such as ONLOGON, DAILY, MINUTE, ONSTART), and the run-as account (/RU, where SYSTEM is higher risk). Decode every
    argument: the /TR value reveals the persistence payload — often a script, binary, or download cradle — and the /SC
    value reveals when it activates. The operation verb (/create vs /delete vs /change) indicates whether a task was
    being installed, removed, or modified.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:masquerading.binary_origin
  question: How did this renamed binary arrive on the host?
  context: >-
    A renamed copy of schtasks.exe does not appear spontaneously — it was copied from another location, downloaded,
    or dropped by a parent process. Tracing the file-creation event for this binary by filename over a long window
    reveals the delivery mechanism: a download tool, a dropper, a manual copy via remote access, or lateral movement
    from another host. The creating process shown in the file event identifies the writer. A binary in a user-writable
    location (Downloads, Temp, AppData) was likely downloaded or extracted.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned this renamed binary, and is that parent chain expected?
  context: >-
    The parent process reveals how the renamed utility was invoked and under what execution context. Legitimate
    task scheduling is usually driven by an interactive shell an administrator opened, a management agent, or a
    deployment process. An unusual parent such as a script host, an Office application, or a freshly dropped binary
    points to automated or malicious invocation rather than hands-on administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:obfuscation.encoded_payload_decode
  question: Is the task command line or payload encoded or obfuscated, and what does it decode to?
  context: >-
    The /TR command embedded in a scheduled task is a frequent place to hide a payload. Look for base64 (a
    powershell.exe -EncodedCommand value, or a certutil -decode reference), hex, character concatenation, or
    environment-variable substitution in the command the task runs. Decoding reveals the actual intent — a download
    cradle, reverse shell, in-memory loader, or credential-theft routine. Renaming the launcher and obfuscating the
    payload together signal a deliberate effort to avoid both name-based and content-based inspection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:scheduled_task.task_trigger_and_timing
  question: When is the task scheduled to run, and has it already executed?
  context: >-
    The trigger schedule determines when the persistence activates. Tasks set to run at boot or logon fire on the
    next restart; recurring tasks (every few minutes, daily) may have already executed multiple times. Scheduled
    tasks run as children of the Task Scheduler service, so process activity spawned by that service after the task
    was configured shows whether the payload has run yet and what it did.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:scheduled_task.task_still_present
  question: Is the scheduled task still registered on the system?
  context: >-
    Persistence is only effective if the task still exists, and some operators delete a task after it runs to reduce
    forensic artifacts. Confirming whether the task is still registered — by querying the task by name on the host or
    through endpoint tooling — determines whether the persistence mechanism is active and needs remediation. Read the
    task name from the /TN argument in the triggering command line to drive the check.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What did this renamed binary spawn after execution, and is the same binary present on other hosts?
  context: >-
    A renamed utility is renamed to perform its function while evading detection. The child processes spawned by this
    binary reveal what it actually accomplished beyond registering a task — for example launching a script host, a
    downloader, or a follow-on tool. The same renamed binary appearing on multiple hosts suggests deliberate
    distribution rather than an isolated event; pivot on the OriginalFileName or hash to find it elsewhere.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even routine scheduling can resemble this pattern. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern — renamed schtasks
    invocation — has historically run here, not generic binary usage. A new parent process, an unexpected user
    account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd_operation:
        CommandLine|contains|windash:
        - ' /create '
        - ' /delete '
        - ' /query '
        - ' /change '
        - ' /run '
        - ' /end '
      selection_cmd_flags:
        CommandLine|contains|windash:
        - ' /tn '
        - ' /tr '
        - ' /sc '
        - ' /st '
        - ' /ru '
        - ' /fo '
      selection_pe:
        OriginalFileName: schtasks.exe
      filter_main_cmd:
        CommandLine|contains: schtasks
      filter_main_img:
        Image|endswith: \schtasks.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: ((all of selection_cmd_* and not filter_main_cmd) or (selection_pe and not filter_main_img)) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd_operation:
        CommandLine|contains|windash:
        - ' /create '
        - ' /delete '
        - ' /query '
        - ' /change '
        - ' /run '
        - ' /end '
      selection_cmd_flags:
        CommandLine|contains|windash:
        - ' /tn '
        - ' /tr '
        - ' /sc '
        - ' /st '
        - ' /ru '
        - ' /fo '
      selection_pe:
        OriginalFileName: schtasks.exe
      filter_main_cmd:
        CommandLine|contains: schtasks
      filter_main_img:
        Image|endswith: \schtasks.exe
      _pb_scope:
        User|expand: '%User%'
      condition: ((all of selection_cmd_* and not filter_main_cmd) or (selection_pe and not filter_main_img)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd_operation:
        CommandLine|contains|windash:
        - ' /create '
        - ' /delete '
        - ' /query '
        - ' /change '
        - ' /run '
        - ' /end '
      selection_cmd_flags:
        CommandLine|contains|windash:
        - ' /tn '
        - ' /tr '
        - ' /sc '
        - ' /st '
        - ' /ru '
        - ' /fo '
      selection_pe:
        OriginalFileName: schtasks.exe
      filter_main_cmd:
        CommandLine|contains: schtasks
      filter_main_img:
        Image|endswith: \schtasks.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: ((all of selection_cmd_* and not filter_main_cmd) or (selection_pe and not filter_main_img)) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around the time of the alert?
  context: >-
    After identifying the actor, check their activity across all hosts in the alert window. If the same user triggered
    similar activity on multiple endpoints, the scope of the incident may be larger than this single host. This pivot
    degenerates into agent-telemetry noise when the alert fired under a service account, in which case the
    launch-mechanism cross-host question is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd_operation:
        CommandLine|contains|windash:
        - ' /create '
        - ' /delete '
        - ' /query '
        - ' /change '
        - ' /run '
        - ' /end '
      selection_cmd_flags:
        CommandLine|contains|windash:
        - ' /tn '
        - ' /tr '
        - ' /sc '
        - ' /st '
        - ' /ru '
        - ' /fo '
      selection_pe:
        OriginalFileName: schtasks.exe
      filter_main_cmd:
        CommandLine|contains: schtasks
      filter_main_img:
        Image|endswith: \schtasks.exe
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: ((all of selection_cmd_* and not filter_main_cmd) or (selection_pe and not filter_main_img)) and _pb_scope
    fields:
    - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern — renamed schtasks invocation — rather than generic usage of the binary. Many hosts firing the same
    pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd_operation:
        CommandLine|contains|windash:
        - ' /create '
        - ' /delete '
        - ' /query '
        - ' /change '
        - ' /run '
        - ' /end '
      selection_cmd_flags:
        CommandLine|contains|windash:
        - ' /tn '
        - ' /tr '
        - ' /sc '
        - ' /st '
        - ' /ru '
        - ' /fo '
      selection_pe:
        OriginalFileName: schtasks.exe
      filter_main_cmd:
        CommandLine|contains: schtasks
      filter_main_img:
        Image|endswith: \schtasks.exe
      condition: (all of selection_cmd_* and not filter_main_cmd) or (selection_pe and not filter_main_img)
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to this event and
    what followed it — reconnaissance, additional execution, or further persistence installation. Aggregating by image
    and parent collapses repetitive agent telemetry so novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, defense tampering, or credential access — may reveal the
    attack stages that preceded this event and help reconstruct the timeline. The order in which alerts fired often
    tells the story of how the host was reached and what set up this scheduled-task activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
