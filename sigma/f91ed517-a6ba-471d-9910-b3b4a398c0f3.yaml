name: Potentially Suspicious Windows App Activity
id: 334477fd-f02d-45ee-8c0b-473e62070bfc
description: |
  Detects a process installed under C:\Program Files\WindowsApps\ (a Store / MSIX-packaged ".appx" application) spawning a child that is EITHER one of a set of script and command interpreters (cmd, cscript, mshta, powershell, powershell_ise, pwsh, regsvr32, rundll32, wscript) OR a process whose command line contains cmd /c, Invoke-, or Base64 — with Windows Terminal and the Sysinternals Suite packages excluded. Packaged Store apps run sandboxed and rarely shell out to interpreters, so this parent-child relationship is a clean signal that may indicate a rogue or trojanized .appx package, or a legitimate package abused to proxy command execution under its signed identity. The investigation should confirm which branch fired, decode what the child actually did, identify the package, and determine whether this app legitimately spawns this child on this host and for this user.
type: detection
detection_id: f91ed517-a6ba-471d-9910-b3b4a398c0f3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- source: template:universal.verify_trigger_match
  question: Does this match the rule — a WindowsApps-packaged parent spawning a listed interpreter or a suspicious command line?
  context: Confirm the alert before investing time. The rule fires when the parent runs from C:\Program Files\WindowsApps\ AND the child EITHER ends in one of the listed interpreters (cmd, cscript, mshta, powershell, powershell_ise, pwsh, regsvr32, rundll32, wscript) OR has a command line containing cmd /c, Invoke-, or Base64 — and the Windows Terminal and Sysinternals packages are excluded. Note which branch fired, because a known interpreter as the child versus a suspicious command string shapes what to decode next.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:parent_child.parent_process_legitimacy
  question: Which packaged app is this, is it expected to spawn this child, and what started the app?
  context: The parent-child relationship is the core signal. The parent path under WindowsApps identifies the package — read it to see whether this is a known, sanctioned Store app or something unfamiliar. Tracing the app's own origin shows whether the user launched it normally or it was started or driven in an unusual way. A trojanized or abused package still presents as the legitimate signed app, so the package identity, its command line, and its grandparent are where the abuse becomes visible.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run interpreters spawned by a packaged Store app?
  context: Some developer and IT workflows legitimately launch shells or helper scripts from packaged apps. Knowing whether this user's role and this host's function are consistent with that behavior is often the fastest way to separate a routine action from a rogue package. A developer workstation differs from a standard user endpoint where a Store app spawning powershell is anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What exactly did the child process do? Decode its full command line and arguments.
  context: The full command line reveals the specific action. Decode any flags, encoded content, file paths, or URLs the child carried — the rule's own triggers (cmd /c, Invoke-, Base64) point to a shell one-liner, a PowerShell cmdlet invocation, or an encoded payload. Identify what the packaged app actually drove the interpreter to do.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:powershell.encoded_command_decode
  question: If the child was PowerShell, was the command encoded or obfuscated, and what does it decode to?
  context: When the child is powershell.exe, pwsh.exe, or powershell_ise.exe, attackers frequently hide intent with -EncodedCommand (-enc), Base64 strings, concatenation, or backticks — and Base64 is one of this rule's own triggers. Decoding reveals the actual payload — a download cradle, a reverse shell, or in-memory execution of a .NET assembly. If the child was not PowerShell, this question does not apply.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Script block logging records the deobfuscated script PowerShell actually executed, even when the command line is encoded or obfuscated, providing ground truth about what ran. If PowerShell operational logging is not collected in this environment, that absence is itself a visibility gap worth noting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened on this host shortly before this execution?
  context: Attackers often disable or bypass PowerShell protections before running a payload — AMSI patching, execution-policy bypass, or a v2 downgrade that lacks logging. Finding these precursor events in the hour before the packaged app spawned the interpreter strengthens the case that the execution is malicious rather than incidental.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: template:parent_child.sibling_processes
  question: What other child processes did this same packaged app instance spawn?
  context: If the package was trojanized or abused to proxy execution, the same parent instance likely spawned more than one child. Listing the siblings of the detected child reveals the full scope of activity initiated through this app — multiple suspicious children from one package strongly suggests orchestration rather than a one-off.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_parent_process.baseline
  question: How often has this packaged app spawned this child binary on this host before?
  context: Packaged Store apps very rarely shell out to interpreters, so historical frequency is a strong discriminator. Zero or very low counts for this specific app-to-child pairing indicate a novel spawning relationship worth chasing; a pairing that already accounts for many prior events is more likely a built-in helper behavior of a legitimate package.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. This surfaces direct attempts to disable AV/EDR services, flip Defender settings, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the writing process and its signing chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_user_actor.baseline
  question: Does this user normally run this binary?
  context: Compare this user's current action against their historical pattern. A user who has never run this interpreter is more notable than one who does so regularly, and the user's role and typical toolset should align with the activity. This pivot is meaningful only when a real user account fired the alert; the launch-mechanism baseline alongside it carries the answer when it did not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this app-and-child binary combination historically routine on this host or across the environment?
  context: When the alert fires under a service or computer account, user identity does not attribute behavior, so the meaningful baseline is the launch mechanism — which packaged app spawned this binary, and whether that pairing is historically common. A new or rare app-to-child pairing is the deviation worth chasing; one that already accounts for many prior events points to a legitimate package helper.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity elsewhere, the scope is larger than a single host. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same app-and-child binary combination fire on other hosts in the same window?
  context: Under a service or computer account, asking what else the user did returns agent-telemetry noise. The meaningful question is whether the same launch mechanism — this packaged app spawning this binary — fired on other hosts in the alert window. Multiple hosts at once points to a pushed or trojanized package distributed across the environment; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the timeline that led to the packaged app spawning an interpreter.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
