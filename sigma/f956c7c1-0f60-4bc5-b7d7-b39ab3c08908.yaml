name: PktMon.EXE Execution
id: be10fa4d-92a0-47a3-8457-a86b40fb7e31
description: |
  Detects execution of pktmon.exe, the built-in Windows packet-capture utility, identified by image name or original filename. pktmon is a legitimate diagnostic tool for network troubleshooting, but it also provides an on-host packet sniffer that requires no additional software and can capture sensitive traffic — including plaintext credentials and session tokens — to an .etl file. Investigation should determine what the capture targeted, who ran it, whether the host and user normally perform packet capture, and what activity surrounded the execution.
type: detection
detection_id: f956c7c1-0f60-4bc5-b7d7-b39ab3c08908
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- source: template:universal.verify_trigger_match
  question: Does this process match the rule's pktmon detection — image ending in pktmon.exe or an original filename of PktMon.exe?
  context: Confirm the alert is a true positive by reviewing the process image and original filename against the rule's criteria. The original-filename match also catches a renamed pktmon binary, so verify both the on-disk name and the embedded original filename before investing further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:credential_access.credential_target_identification
  question: What did the capture target — which ports, protocols, or filters were configured on the pktmon command line?
  context: pktmon captures network traffic and can apply packet filters to focus on specific ports or protocols (for example 'pktmon filter add -p 445'). The command line reveals what traffic the operator was after; filters targeting authentication, file-sharing, or remote-access ports (such as 445, 21, 23, 389, 88) point at credential or data interception rather than routine diagnostics. A bare start with no filter captures everything on the wire.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned pktmon and is that parent chain expected?
  context: The parent process reveals how pktmon was invoked. Administrative use is typically launched from an interactive shell under explorer.exe or from a known management/automation process. Unusual parents such as mshta.exe, wscript.exe, powershell.exe download cradles, or Office applications point at scripted or hands-on-keyboard use rather than troubleshooting.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did pktmon spawn afterward?
  context: Processes spawned by pktmon after launch reveal its actual impact. Legitimate capture sessions rarely spawn children; follow-on cmd.exe, powershell.exe, or copy/move of the resulting .etl file may indicate the operator is staging or exfiltrating the capture output.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run pktmon?
  context: A packet-capture tool that has never run on this host is more suspicious than one that runs regularly as part of diagnostics. Zero or very low historical counts over the past 90 days indicate first-time or rare execution and raise the priority of the investigation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the rule's pktmon pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a legitimately used capture tool has a normal launch profile. This query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects how pktmon specifically has historically run here. A new parent process, an unexpected user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \pktmon.exe
      - OriginalFileName: PktMon.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired the rule's pktmon pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of pktmon executions matching the rule's pattern. Many hosts firing the same pattern points to scripted deployment or vendor automation; a single host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \pktmon.exe
      - OriginalFileName: PktMon.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run packet-capture tools?
  context: Compare this user's current action against their historical behavior. A user who has never run pktmon or similar capture tooling is more suspicious than one who does so regularly. Network engineers and IT support may legitimately capture traffic; a standard user or service account doing so is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+pktmon combination historically routine on this host or across the environment, or is the parent unusual for pktmon?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process spawned pktmon, and whether that pair is historically common. A new or rare parent for pktmon on this host or environment-wide is the deviation worth chasing; a pair that already accounts for many prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope may be larger than a single capture session.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+pktmon combination fire on other hosts in the same window — is this a coordinated automation rollout or isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus pktmon — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the capture, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or staging of captured data.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded the capture and help reconstruct the timeline. Packet capture is often a mid-chain action that follows initial access and enumeration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this host around the same time?
  context: A single diagnostic command may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession — whoami, ipconfig, net user, systeminfo — is a signature of post-compromise enumeration. Network capture alongside host and network discovery suggests an operator mapping the environment before moving to the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned pktmon, and is this a normal pattern?
  context: Legitimate capture is typically launched from cmd.exe or PowerShell spawned by explorer.exe (an admin opened a shell) or from a known automation script. pktmon spawned by unusual parents — Word or Excel macros, wscript.exe, mshta.exe, wmiprvse.exe, or wsmprovhost.exe — indicates remote or automated execution rather than hands-on troubleshooting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is this user and host expected to run packet-capture tooling?
  context: Network administrators and IT staff legitimately run pktmon for troubleshooting, and some hosts are dedicated to such diagnostics. Standard users and most servers rarely need on-host packet capture. The user's role and the host's function determine whether the activity is routine or anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Traffic capture can yield plaintext credentials or session tokens, which are typically followed by lateral movement. New logon events or outbound remote connections shortly after the capture — RDP, SMB, WinRM, PsExec — indicate the captured data may already be in use against other systems.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be exposed by the captured traffic, and do any have elevated privileges?
  context: The severity depends on what the capture could have exposed. Traffic to or from domain controllers, authentication services, or sessions involving administrative accounts raises the risk of high-value credential exposure and may require incident escalation; capture confined to a standard user's own traffic is lower impact. Cross-reference the host's network role and the accounts active during the capture window.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
