name: Potentially Suspicious Office Document Executed From Trusted Location
id: ad79e5f6-4541-47af-ac03-208035da81d6
description: |
  Detects an Office application (EXCEL.EXE, POWERPNT.EXE, or WINWORD.EXE) launched
  from explorer.exe or dopus.exe with a command line that opens a document located in a
  Microsoft Trusted Location, while excluding the benign template extensions (.dotx,
  .xltx, .potx). Trusted Locations exempt documents from Mark-of-the-Web and macro
  scanning, so placing a macro-enabled document there lets active content run without the
  usual prompts, a defense-evasion path used to bypass macro blocking. The investigation
  should confirm the document path and trusted-location string, identify what the Office
  process spawned or connected to next, and determine whether the user, host, and document
  placement are expected.
type: detection
detection_id: f99abdf0-6283-4e71-bd2b-b5c048a94743
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alert match the rule — an Office application launched by explorer.exe or dopus.exe opening a document from a Microsoft Trusted Location, and not a benign .dotx/.xltx/.potx template?
  context: Before investing investigation time, confirm the true positive. The Image should
    be EXCEL.EXE, POWERPNT.EXE, or WINWORD.EXE (or the matching OriginalFileName), the
    ParentImage should be explorer.exe or dopus.exe, and the command line should contain a
    trusted-location path such as \AppData\Roaming\Microsoft\Templates,
    \AppData\Roaming\Microsoft\Word\Startup\, \Microsoft Office\root\Templates\, or
    \Microsoft Office\Templates\. The rule deliberately excludes command lines ending in
    .dotx, .xltx, or .potx, so confirm the opened document is not one of those benign
    template types.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to open Office documents from a Trusted Location?
  context: Some users and roles legitimately keep working templates and add-ins in Trusted
    Locations, and developers or power users may run custom Office automation from those
    paths. Knowing whether this account and host routinely open documents from
    AppData\Roaming\Microsoft\Templates or the Office Startup folder is often the fastest
    way to separate sanctioned activity from a planted document.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:parent_child.parent_process_legitimacy
  question: Is explorer.exe or dopus.exe expected to launch this Office application this way, and what started the parent itself?
  context: The parent-child relationship is the core signal. A user double-clicking a
    document in Explorer or a file manager is routine, but the document path matters — a
    file copied into a Trusted Location and then opened is the bypass pattern. Tracing what
    started the parent shows whether this was an interactive user action or a chain driven
    by another process that staged and opened the document.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What document did the Office application open, and what is the full trusted-location path on the command line?
  context: The full command line reveals the exact document and the trusted-location string
    it was opened from. Decode the path to identify the file name and which Trusted Location
    it sits in. A macro-enabled document (.docm, .xlsm, .pptm) or a renamed file placed in
    a template or Startup folder is the active-content-bypass pattern; the working directory
    and any additional flags help establish how the document was invoked.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - \AppData\Roaming\Microsoft\Templates
          - \AppData\Roaming\Microsoft\Word\Startup\
          - \Microsoft Office\root\Templates\
          - \Microsoft Office\Templates\
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:parent_child.sibling_processes
  question: What other child processes did the same parent instance spawn?
  context: The risk of a Trusted-Location document is what its macro runs, not the Office
    process itself. Examining the processes spawned by the same parent instance reveals
    whether the Office application launched high-risk children such as powershell.exe,
    cmd.exe, regsvr32.exe, rundll32.exe, mshta.exe, msiexec.exe, curl.exe, or
    bitsadmin.exe. Multiple or unusual children from the same parent point to macro-driven
    execution rather than a benign document open.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: attack:T1202.child_execution
  question: Did the Office process spawn a high-risk interpreter or proxy binary shortly after the document opened?
  context: Indirect command execution through an Office document ends in a secondary
    program running the operator's code. Look on this host in the window after the alert for
    child execution of powershell.exe, cmd.exe, regsvr32.exe, rundll32.exe, mshta.exe,
    msiexec.exe, curl.exe, or bitsadmin.exe — the high-risk children that indicate macro
    abuse. A direct hand-off from the Office application to one of these binaries is the
    execution stage of the technique.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \powershell.exe
          - \cmd.exe
          - \regsvr32.exe
          - \rundll32.exe
          - \mshta.exe
          - \msiexec.exe
          - \curl.exe
          - \bitsadmin.exe
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- source: attack:T1202.network_connection
  question: Did the Office process or its children make outbound network connections after the document opened?
  context: Macro-driven execution frequently retrieves a second-stage payload or beacons to
    a command-and-control host. Outbound connections from the alerting Office process — or
    from a child it spawned — point to download or callback activity. Compare any
    destinations against known-good egress for this host; connections to external addresses
    immediately after a Trusted-Location document opened are worth following.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Image
- source: template:cue_parent_process.baseline
  question: Does this parent normally spawn this Office application opening documents from a Trusted Location on this host?
  context: Some parent-child pairs are routine; here the discriminator is whether the Office
    application is regularly launched from Explorer or the file manager opening documents in
    a Trusted Location. Zero or very low history for this combination indicates a novel
    spawning relationship worth chasing, while thousands of prior events point to
    established working behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.baseline
  question: How often has this host opened Office documents from these Trusted Locations before?
  context: Office applications run constantly, so raw binary frequency is uninformative; the
    meaningful baseline is how often documents are opened from these specific trusted-location
    paths on this host. Zero or very low counts indicate first-time or rare use of the
    Trusted Location, which raises the likelihood that a document was deliberately placed
    there to bypass macro scanning.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - \AppData\Roaming\Microsoft\Templates
          - \AppData\Roaming\Microsoft\Word\Startup\
          - \Microsoft Office\root\Templates\
          - \Microsoft Office\Templates\
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Does this user normally open Office documents from a Trusted Location?
  context: Compare the account's current action against its history. A user who has never
    run Office from these template or Startup paths is more notable than one who does so as
    part of their role. Align the result with what is known about the account — a developer
    maintaining macro templates differs from a standard user who has no reason to keep
    add-ins in the Office Startup folder.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK
    SERVICE, or a computer account), user identity does not attribute the behavior. The
    meaningful pivot is the launch mechanism — which parent spawned this Office binary and
    whether that pair is historically common. A new or rare parent for this binary is the
    deviation worth chasing; a pair that already accounts for thousands of events is OS or
    vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window
    reveals whether the same user opened similar documents or triggered related activity on
    other endpoints. If the same user shows comparable Office activity elsewhere, the scope
    may extend beyond this one host, as can happen when the same document is distributed to
    multiple recipients.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-binary combination fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, "what else did this user do" returns agent-telemetry
    noise because every host runs SYSTEM-owned agents constantly. The meaningful question is
    whether the same launch mechanism — parent process plus Office binary — fired on other
    hosts in the alert window. Multiple hosts point to a distributed document or a pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: attack:T1202.file_event
  question: What files did the Office process write around the time the document opened?
  context: A macro running from a Trusted Location commonly drops a second-stage payload — a
    DLL, script, or executable — before handing off to a child process such as regsvr32.exe
    or rundll32.exe. Files written by the alerting Office process, especially into
    user-writable locations like the user profile, AppData, %TEMP%, or ProgramData, are the
    artifacts of that staging. A newly written DLL or executable that a child process then
    loads or runs is the link between the document open and the payload.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_parent_process.scope
  question: Is this Office-from-Trusted-Location pattern occurring on other hosts?
  context: The same parent-and-Office-binary pattern appearing on multiple hosts may indicate
    a phishing wave or a distributed document rather than a one-off. A single occurrence is
    more likely targeted or benign user activity. Enterprise-wide comparison helps calibrate
    severity and identify how many endpoints opened a document from a Trusted Location.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the document open and what followed — reconnaissance, persistence, or payload
    execution. Aggregating by process and parent collapses repetitive agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts, which is what to
    scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, delivery, or defense
    tampering — may reveal the stages that preceded the document open and help reconstruct
    the timeline. A run of related alerts before this event points to an active sequence
    rather than an isolated document open.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
