name: Chopper Webshell Process Pattern
id: f1301ba3-5419-4a26-ba43-19e7e8ee119a
description: |
  Detects the process-execution pattern left by China Chopper-style ASPX web shells: the IIS worker process w3wp.exe (as the process or the parent) running a command line that contains the Chopper command-chaining signatures (&ipconfig&echo, &quser&echo, &whoami&echo, &c:&echo, &cd&echo, &dir&echo, &echo [E], &echo [S]). The rule fires only when BOTH the w3wp.exe origin AND one of the Chopper command signatures are present. A web server worker process spawning command interpreters that run host and account enumeration is a hands-on-keyboard post-exploitation pattern; legitimate IIS applications rarely shell out to run whoami, ipconfig, or directory listings. Investigation should confirm the command pattern, identify the web request that drove it, decode any encoded parameters, and scope concurrent reconnaissance and additional compromised servers.
type: detection
detection_id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show the w3wp.exe origin AND one of the Chopper command-chaining signatures?
  context: Confirm the alert is a true positive before investing time. The rule fires only when both conditions hold together - the process or its parent is w3wp.exe AND the command line contains a Chopper signature such as '&whoami&echo', '&ipconfig&echo', or '&echo [S]'. Review the exact command line and the Image/ParentImage to verify both halves matched rather than an incidental string.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:parent_child.parent_process_legitimacy
  question: Is the w3wp.exe worker expected to spawn this child process, and what started the worker?
  context: A web server worker shelling out to a command interpreter is the core signal for this detection. Tracing the worker's own origin and the application pool it serves reveals whether the chain is a normal IIS-hosted application launching a helper, or post-exploitation execution driven through a deployed web shell. Note the parent command line and grandparent to see how the worker was invoked.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- source: template:cue_process_tool.mechanism_decode
  question: What did the full Chopper command chain do? Parse each '&'-delimited segment and identify the enumeration performed.
  context: The Chopper command-chaining pattern strings multiple commands together with '&' and echoes delimiters such as '[S]' and '[E]' to frame the output the web shell returns to the operator. Parse every segment - whoami, ipconfig, quser, dir, cd - to enumerate exactly what host, network, and session information was collected. Scoping to all w3wp.exe executions on the host within a few minutes captures sequential commands that together form one interactive session.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:obfuscation.encoded_payload_decode
  question: Are any web shell parameters or command segments encoded or obfuscated, and what do they decode to?
  context: Chopper-style web shells frequently pass base64- or URL-encoded parameters and may layer character concatenation or environment-variable substitution to hide the operator's intent. Decode any encoded segment in the command line to reveal the actual operation - download cradle, reverse shell, credential theft, in-memory loader, or data exfiltration. For multi-layer encoding, iterate decoding until the payload is readable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:initial_access.delivery_vector
  question: What web request drove this execution through the IIS worker?
  context: Web shell execution begins with an HTTP request reaching the deployed shell or a crafted request exploiting a server vulnerability. Identifying the originating request - the URL path, source IP, and user-agent in the web server access logs around this timestamp - enables blocking at the perimeter and finding additional targeted endpoints. The query retrieves the parent context; the actual request analysis requires the web server access and proxy logs.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:initial_access.application_patch_status
  question: Is the IIS or Exchange application on this server up to date with security patches?
  context: Web shells are commonly dropped after exploitation of a known server vulnerability, including the chained Exchange SSRF and PowerShell RCE flaws (CVE-2022-41040, CVE-2022-41082) that ran code under w3wp.exe. An unpatched server confirms exploitation was possible and indicates which other similarly unpatched servers are at risk. Patch status also distinguishes exploitation of a known CVE from a zero-day.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- source: template:initial_access.campaign_scope
  question: Did the same web shell process pattern fire on other servers?
  context: Exploitation of public-facing servers rarely targets a single host. If one server shows the Chopper pattern, others reachable by the same exploit likely do too. Correlating the same rule across all hosts reveals the breadth of the intrusion and identifies additional compromised servers that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:discovery_recon.discovery_burst_detection
  question: Did other reconnaissance commands run on this server around the same time?
  context: A single discovery command may be incidental, but multiple reconnaissance commands in rapid succession - whoami, ipconfig, net user, nltest, quser - is a signature of post-compromise enumeration. Operators run these to understand their context before moving to the next stage. On a web server, native recon binaries spawned around the web shell execution strengthen the case for hands-on-keyboard activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- source: template:discovery_recon.discovery_parent_chain
  question: What process spawned the reconnaissance commands, and is that parent chain normal?
  context: Legitimate discovery commands typically run from cmd.exe spawned by explorer.exe or from automation scripts. Discovery commands spawned by a web server worker (w3wp.exe), a script interpreter, or wmiprvse.exe indicate automated post-exploitation rather than an interactive administrator. Confirm whether the enumeration descends from the IIS worker chain.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- source: template:discovery_recon.discovery_user_context
  question: Is the account running these commands expected to perform administrative discovery on this server?
  context: IIS application pools normally run under a service identity (an application pool account, NETWORK SERVICE, or similar) that has no reason to run whoami, quser, or net user interactively. Standard users rarely need these either. Identify the account behind the execution and whether its role and typical behavior make this enumeration routine or anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_origin:
      - Image|endswith: \w3wp.exe
      - ParentImage|endswith: \w3wp.exe
      selection_cmdline:
        CommandLine|contains:
        - '&ipconfig&echo'
        - '&quser&echo'
        - '&whoami&echo'
        - '&c:&echo'
        - '&cd&echo'
        - '&dir&echo'
        - '&echo [E]'
        - '&echo [S]'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_origin:
      - Image|endswith: \w3wp.exe
      - ParentImage|endswith: \w3wp.exe
      selection_cmdline:
        CommandLine|contains:
        - '&ipconfig&echo'
        - '&quser&echo'
        - '&whoami&echo'
        - '&c:&echo'
        - '&cd&echo'
        - '&dir&echo'
        - '&echo [E]'
        - '&echo [S]'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same identity drove similar activity on other servers, the scope of compromise is larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_origin:
      - Image|endswith: \w3wp.exe
      - ParentImage|endswith: \w3wp.exe
      selection_cmdline:
        CommandLine|contains:
        - '&ipconfig&echo'
        - '&quser&echo'
        - '&whoami&echo'
        - '&c:&echo'
        - '&cd&echo'
        - '&dir&echo'
        - '&echo [E]'
        - '&echo [S]'
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this server in the hours before this alert?
  context: Web shell command execution rarely happens in isolation. Earlier detections on the same host - exploitation attempts, file drops into web directories, or other reconnaissance - may reveal the stages that preceded this event and help reconstruct the intrusion timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: attack:T1018.network_indicators
  question: Did the IIS worker make outbound or remote network connections around the time of the web shell commands?
  context: Remote system discovery and exfiltration leave network artifacts. After enumerating the host, an operator commonly pivots to reach other systems or sends collected data outbound. Network connections initiated by w3wp.exe or by the spawned interpreters around the alert window distinguish local-only enumeration from active lateral movement or exfiltration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\w3wp.exe'
          - '\cmd.exe'
          - '\powershell.exe'
          - '\net.exe'
          - '\nltest.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- source: attack:T1505.003.auth_correlation
  question: What interactive or remote logons preceded this web shell activity on the server?
  context: Web shell exploitation against a server is often preceded by authentication to a public-facing service, sometimes with ordinary standard-user credentials obtained through spraying or theft. Correlating logon events on this host in the window before the execution helps identify the account and source that established access, and whether the logon source matches the web request origin.
  range: -1h
  query: |
    aggregation: true
    logsource:
      category: authentication
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - LogonType
      - SourceIp
