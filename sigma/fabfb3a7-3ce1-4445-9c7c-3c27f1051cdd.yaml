name: Potential ReflectDebugger Content Execution Via WerFault.EXE
id: 0ef5c66c-13ee-4c19-b67b-9f43eabc374b
description: |
  Detects WerFault.exe launched with the '-pr' command-line flag, which puts Windows Error Reporting into its "reflective debugger" mode and executes the path stored in the ReflectDebugger registry value. The rule fires when all of [selection_img, selection_cli] match: Image ends in WerFault.exe (or OriginalFileName is WerFault.exe) AND the command line contains ' -pr '. Legitimately this mode is rarely invoked by hand; an attacker who can write the ReflectDebugger value points it at a payload so that a signed Microsoft binary launches attacker code as its child, masking the true execution flow. The investigation should confirm the flag fired, identify the path the reflective debugger resolved to, and determine what child process WerFault.exe spawned.
type: detection
detection_id: fabfb3a7-3ce1-4445-9c7c-3c27f1051cdd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain the '-pr' reflective-debugger flag, and is the image WerFault.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule requires both that the image ends in WerFault.exe (or its OriginalFileName is WerFault.exe) and that the command line contains ' -pr '. Confirm both held and note the value passed after '-pr', since that value indexes the ReflectDebugger entry the binary will run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run WerFault.exe with the reflective-debugger flag?
  context: Legitimate administrative activity can trigger many detections, but the reflective-debugger mode is almost never invoked interactively. Knowing whether the user role and host function are consistent with this kind of low-level error-reporting invocation is often the fastest path to separating a true positive from a routine operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What value followed the '-pr' flag, and what path does the ReflectDebugger registry entry resolve to?
  context: The full command line reveals the specific action taken. The value after '-pr' indexes the reflective-debugger entry that WerFault.exe reads from the Windows Error Reporting Hangs ReflectDebugger value and then executes. Decode the argument and, on the host, read the ReflectDebugger value to see which executable path it points to - a path in a user-writable or otherwise non-standard location is the artifact that turns this from benign error handling into a launch primitive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:masquerading.true_identity
  question: Is this actually WerFault.exe based on its metadata and hash, or a renamed binary posing as it?
  context: When a binary is renamed, the PE metadata (OriginalFileName) and code-signing details still reflect the original tool, so a mismatch between the on-disk name and OriginalFileName flags a renamed file. Confirm OriginalFileName reports WerFault.exe and that the file is Microsoft-signed; a name/metadata mismatch or a broken signature means the process is not the genuine system binary. The file hash enables a reputation lookup to confirm it matches the expected Windows Error Reporting executable rather than a tampered copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- source: template:cue_process_tool.process_chain
  question: What process spawned this WerFault.exe instance, and is that parent chain expected?
  context: The parent process reveals how the reflective-debugger invocation was launched. Genuine error reporting is spawned by the OS error-handling chain; an invocation driven from a logon Run key, a script host, or an interactive shell points to a deliberate trigger rather than a crash. Identify the immediate parent and, where possible, what spawned the parent.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:masquerading.renamed_binary_activity
  question: What child processes did this WerFault.exe spawn, and did the same pattern fire on other hosts?
  context: The point of routing execution through a signed binary is to launch attacker code while the process tree shows only WerFault.exe as the parent. Examining the child processes, file operations, and network connections started by this WerFault.exe reveals the payload that the ReflectDebugger value resolved to. The same launch pattern appearing on multiple hosts suggests deliberate distribution rather than an isolated trigger.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:masquerading.binary_origin
  question: Where did this WerFault.exe copy come from, and does it live in the expected system path?
  context: |
    The genuine WerFault.exe ships under the Windows system directories; a copy created in a user-writable or otherwise non-standard location is itself the masquerade. Tracing file-creation events for the WerFault.exe basename over a long window reveals whether this is the in-box system binary or a placed copy, and which process wrote it - a download tool, a dropper, or a manual copy. Compare the resolved path against the expected system install directories for signed binaries.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.baseline
  question: Does this host normally run WerFault.exe with the reflective-debugger flag?
  context: A firing pattern that has never been seen on a host is more suspicious than one that recurs. WerFault.exe runs constantly for ordinary crash handling, so this baseline groups by user to show how often the binary itself runs here; zero or very low counts of the specific reflective-debugger invocation, read against ordinary WerFault volume, indicate a first-time or rare use of the launch primitive.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this reflective-debugger pattern, what parents and users drove it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern - WerFault.exe with the '-pr' flag - has historically run here, not generic WerFault usage. A new parent process, an unexpected user account, or an unusual command-line structure against that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \WerFault.exe
      - OriginalFileName: WerFault.exe
      selection_cli:
        CommandLine|contains: ' -pr '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time as the alert?
  context: Attacks typically involve multiple tools in sequence. Activity in the minutes surrounding the reflective-debugger invocation may reveal the registry modification that set the ReflectDebugger value, persistence installation such as a logon Run-key entry, or post-execution actions that give broader context. Look at the immediate window around the alert for the supporting steps of the launch.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_process_tool.scope
  question: Have other hosts fired this reflective-debugger pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the reflective-debugger firing pattern rather than generic WerFault usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \WerFault.exe
      - OriginalFileName: WerFault.exe
      selection_cli:
        CommandLine|contains: ' -pr '
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \WerFault.exe
      - OriginalFileName: WerFault.exe
      selection_cli:
        CommandLine|contains: ' -pr '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \WerFault.exe
      - OriginalFileName: WerFault.exe
      selection_cli:
        CommandLine|contains: ' -pr '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar activity on several hosts, the scope may be larger than this one alert. This pivots on the user identity; pair it with the launch-mechanism cross-host view because the user pivot returns agent-telemetry noise when the alert fires under a service principal.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \WerFault.exe
      - OriginalFileName: WerFault.exe
      selection_cli:
        CommandLine|contains: ' -pr '
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - registry modification, defense tampering, reconnaissance, or persistence installation - may reveal the stages that preceded this event and help reconstruct how the ReflectDebugger value was set and the trigger established.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
