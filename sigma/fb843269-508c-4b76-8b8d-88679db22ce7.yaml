name: Suspicious Execution of Powershell with Base64
id: 0069eade-de9d-46de-a95c-d66666d1bf6a
description: |
  Detects powershell.exe or pwsh.exe launched with an abbreviated -EncodedCommand flag (-e, -en, -enc, -enco, -ec), the
  parameter form used to pass a base64-encoded UTF-16LE command string. The rule fires when the encoded-command flag is
  present and excludes the unrelated -Encoding parameter and Azure Guest Configuration automation. Encoded invocations are
  used legitimately by management tooling that needs to pass complex quoting, but they are also the most common way operators
  hide download cradles, reflective loaders, and reverse shells from casual inspection. Investigation should decode the
  payload, recover the deobfuscated script content, and determine whether the parent, user, and host context fit known
  automation or point to hands-on-keyboard activity.
type: detection
detection_id: fb843269-508c-4b76-8b8d-88679db22ce7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires when
    powershell.exe or pwsh.exe runs with an abbreviated encoded-command flag (-e, -en, -enc, -enco, -ec) and the -Encoding
    parameter is absent. Verify the flag is genuinely the EncodedCommand short form followed by a base64 string, not a
    different parameter that happens to start with those letters.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run encoded PowerShell commands?
  context: Legitimate management tooling and installers sometimes pass encoded commands, but routine interactive use rarely
    does. Knowing whether the user role and host function are consistent with scripted PowerShell automation is often the
    fastest path to separating true positives from sanctioned activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:powershell.encoded_command_decode
  question: What does the base64-encoded command decode to, and what operation does the decoded script perform?
  context: The EncodedCommand argument carries a base64-encoded UTF-16LE command string. Microsoft accepts any unique partial
    match of the long-option name, so -e, -ec, -en, -enc and similar variants are all valid and case-insensitive. Decode the
    base64 to UTF-16LE and read the resulting script. Look for download cradles (Net.WebClient.DownloadString or DownloadFile,
    Invoke-WebRequest, Start-BitsTransfer), reflective loaders (Add-Type with VirtualAlloc and CreateThread, or
    Reflection.Assembly Load), and reverse shells. The decoded text is the operator's payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:powershell.script_block_logging
  question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Script block logging records the deobfuscated script that PowerShell actually executes, even when the command line
    is encoded. This is ground truth about what ran, bypassing the base64 layer. If PowerShell operational logs are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and decode the
    encoded argument from the alerting command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- source: template:powershell.powershell_security_bypass
  question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators frequently disable or evade PowerShell protections before running an encoded payload. Common precursors
    include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), and
    downgrade to PowerShell v2 which lacks modern logging. Bypass activity in the hour before the alert strengthens the case
    that the encoded command is malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- source: attack:T1059.001.tuning_parameter
  question: Did powershell.exe or pwsh.exe load rare or never-before-seen .NET assemblies on this host?
  context: Encoded PowerShell payloads commonly stage code in memory via Add-Type or Reflection.Assembly Load, pulling in
    .NET assemblies the host rarely or never loads under normal use. The image_load view surfaces the modules the process
    mapped; novel or low-frequency assemblies tied to the alerting process point toward in-memory or reflective execution
    rather than ordinary script automation.
  range: +/-5m
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV or EDR services,
    flip Defender flags, add broad exclusions, clear logs, or patch AMSI and ETW. Zero rows is a useful signal that protection
    looks healthy, though kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the
    disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.process_chain
  question: What process spawned this PowerShell instance and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. Legitimate encoded execution usually has predictable parents
    such as management agents, installers, or services.exe. Unusual parents like mshta.exe, wscript.exe, or an Office
    application point toward macro-driven or exploitation-driven launch. Walk up the tree to see what spawned the parent and
    what else the parent spawned.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run powershell.exe or pwsh.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts over the baseline window indicate first-time or rare execution and raise the weight of the encoded
    invocation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the encoded-PowerShell pattern, what parents and users normally drive it, and
    does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how this specific encoded-command pattern has historically run here rather than
    generic PowerShell usage. A new parent process, an unexpected user account, or an unusual command-line shape is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - ' -e '
        - ' -en '
        - ' -enc '
        - ' -enco'
        - ' -ec '
      filter_encoding:
        CommandLine|contains: ' -Encoding '
      filter_azure:
        ParentImage|contains:
        - C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\
        - \gc_worker.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this PowerShell instance spawn afterward?
  context: The processes spawned after the encoded command reveal its actual impact. Legitimate automation tends to have
    predictable children, while malicious payloads often spawn cmd.exe, additional powershell.exe, certutil.exe, or
    network-facing binaries for post-exploitation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the encoded-PowerShell pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this encoded-command
    pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - ' -e '
        - ' -en '
        - ' -enc '
        - ' -enco'
        - ' -ec '
      filter_encoding:
        CommandLine|contains: ' -Encoding '
      filter_azure:
        ParentImage|contains:
        - C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\
        - \gc_worker.exe
      condition: selection and not 1 of filter_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run PowerShell with encoded commands?
  context: Compare this user's current action against their historical behavior. A user who has never run PowerShell, or
    never with encoded arguments, is more suspicious than one who does so as part of a routine role. User role and typical
    toolset should align with scripted PowerShell automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and binary combination historically routine on this host or across the environment, or is the
    parent unusual for PowerShell?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is
    the launch mechanism. A new or rare parent for powershell.exe or pwsh.exe on this host or across the environment is the
    deviation worth chasing, while a pair that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or concurrent activity on multiple
    endpoints. If the same user triggered similar activity elsewhere in the alert window, the scope of the operation may be
    larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and binary combination fire on other hosts in the same window, or is the activity isolated
    to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise because
    every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism (parent
    process plus spawned binary) fired on other hosts in the alert window. Multiple hosts points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event, what
    happened after, and whether the encoded execution is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence installation in the surrounding window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal
    the attack stages that preceded the encoded PowerShell execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
