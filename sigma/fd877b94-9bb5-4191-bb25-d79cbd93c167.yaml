      reason: "user_actor pair — non-deduplicable"
      kept: both emitted (Q12, Q13)
    - dropped: cue_user_actor.clustering / cue_user_actor.clustering_svc
      reason: "user_actor pair — non-deduplicable"
      kept: both emitted (Q14, Q15)
    - dropped: cue_process_tool.baseline_deviation
      reason: "host-scoped reflected count of the rule's pattern (-14d, Parent/User projection) overlaps lolbin.historical_lolbin_baseline (-90d, CommandLine projection) which is must_include; kept the longer-window must_include version"
      kept: lolbin.historical_lolbin_baseline
    - dropped: cue_process_tool.baseline
      reason: "generic Image|endswith host frequency subsumed by the reflected host-pattern baseline"
      kept: lolbin.historical_lolbin_baseline
  skipped_templates:
