name: Dumping of Sensitive Hives Via Reg.EXE
id: 0e159179-ff04-4f40-8b13-c520aa89d98b
description: |
  Detects reg.exe (or a renamed copy identified by OriginalFileName) saving or exporting the SAM, SYSTEM, or SECURITY
  registry hives from HKLM. All four conditions must hold together: a reg.exe image, a save/export verb, an HKLM root
  reference, and a sensitive hive name — including Unicode look-alike substitutions used to evade keyword matching.
  Saving these three hives is a standard precursor to offline credential extraction: SAM holds local NTLM hashes,
  SECURITY holds LSA secrets and cached domain credentials, and SYSTEM holds the SysKey needed to decrypt the others.
  Legitimate backup or forensic workflows can produce the same command, so the investigation centers on which hives were
  taken together, who and what launched the dump, and whether the same actor pursued other credential-access paths.
type: detection
detection_id: fd877b94-9bb5-4191-bb25-d79cbd93c167
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the reg.exe command line save or export an HKLM hive (SAM, SYSTEM, or SECURITY) as the rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line and process identity against all four
    conditions the rule requires together — a reg.exe image or OriginalFileName, a save or export verb, an HKLM root
    reference, and a SAM, SYSTEM, or SECURITY hive name. Note any Unicode look-alike characters in the verb or hive
    name, since their presence is itself an evasion signal rather than benign typing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to export registry hives via reg.exe?
  context: >-
    Backup, imaging, and forensic-collection workflows legitimately save HKLM hives, and they typically run from known
    operators or service accounts on specific hosts. Knowing whether this user role and host function are consistent
    with hive export is often the fastest way to separate a sanctioned backup from credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Which hives were saved, and were SAM, SYSTEM, and SECURITY all taken together?
  context: >-
    Each hive holds a distinct credential store — SAM holds local NTLM hashes, SECURITY holds LSA secrets and cached
    domain credentials, and SYSTEM holds the SysKey needed to decrypt the other two. Saving all three together confirms
    intent to extract credentials offline, whereas a single hive may reflect a narrower task. Decode the full command
    line to identify each hive named and the output path the dump was written to.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this reg.exe, and is that parent chain expected?
  context: >-
    The parent process reveals how the hive export was driven. A backup or imaging agent, an administrative console, or
    a forensic tool implies a sanctioned task, while cmd.exe or powershell.exe under an unexpected session, a script
    host such as wscript.exe or mshta.exe, or an Office application points to operator-driven or scripted dumping. Walk
    up to the parent's own parent if the immediate parent is a generic shell.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1003.004.access_verification
  question: Did any process open a sensitive-access handle to LSASS on this host around the same time?
  context: >-
    A registry hive dump is one credential-access path; direct LSASS memory access is a parallel one that the same
    operator may pursue for live secrets and tickets. Sensitive-rights handles to lsass.exe from processes other than
    known security tools indicate memory scraping. Review the granted-access mask and the requesting process against the
    expected set of system and protection processes.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\lsass.exe'
      filter_known_good:
        SourceImage|endswith:
          - '\wininit.exe'
          - '\csrss.exe'
          - '\wmiprvse.exe'
          - '\taskmgr.exe'
          - '\procexp.exe'
          - '\procexp64.exe'
      condition: selection and not filter_known_good
    fields:
      - SourceImage
      - GrantedAccess
      - User
- source: attack:T1003.002.tuning_parameter
  question: Were hive dump files (.save, .hiv, or copies of SAM/SYSTEM/SECURITY) written on this host around the alert?
  context: >-
    reg save and reg export write the hive contents to a file that the operator then exfiltrates for offline hash
    extraction. Common output patterns include names ending in .save or .hiv and copies named sam, system, or security
    placed under a temp directory or a public/world-writable path. A matching file write confirms the dump completed and
    identifies the artifact and its location for collection or cleanup verification.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_ext:
        TargetFilename|contains:
          - '.save'
          - '.hiv'
      selection_name:
        TargetFilename|contains:
          - '\sam'
          - '\system'
          - '\security'
      condition: selection_host and (selection_ext or selection_name)
    fields:
      - TargetFilename
      - Image
- source: template:registry.registry_related_modifications
  question: Were other reg.exe write operations (add, delete, import) made on this host in the same session?
  context: >-
    Operators who dump credential hives often touch the registry for other objectives in the same window — establishing
    a Run-key foothold, disabling a protection setting, or importing a prepared key. Surfacing reg.exe write operations
    near the hive export reveals whether the activity was a single read for backup or part of broader configuration
    changes pursued together.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- source: template:credential_access.credential_exposure_assessment
  question: Which local and domain accounts may be exposed by these hives, and do any have elevated privileges?
  context: >-
    The severity of a hive dump depends on what the hives contain. Local SAM hashes expose every local account
    including the built-in administrator; SECURITY exposes LSA secrets such as service-account passwords and cached
    domain credentials for users who have logged on to this host. Cross-reference the host's local accounts and recent
    interactive logons against directory group memberships to determine whether any exposed credential carries elevated
    or domain-wide access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:credential_access.post_access_lateral_movement
  question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- source: template:cue_process_tool.scope
  question: Have other hosts fired this hive-dump pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the same
    hive-export pattern rather than generic reg.exe usage. Many hosts firing the identical pattern points to scripted
    backup or imaging automation; a single host or a small unrelated set points to manual operator activity. Use the
    host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_flag:
        CommandLine|contains:
        - ' save '
        - ' export '
        - " ˢave "
        - " eˣport "
      selection_cli_hklm:
        CommandLine|contains:
        - hklm
        - "hk˪m"
        - hkey_local_machine
        - "hkey_˪ocal_machine"
        - "hkey_loca˪_machine"
        - "hkey_˪oca˪_machine"
      selection_cli_hive:
        CommandLine|contains:
        - \system
        - \sam
        - \security
        - "\\ˢystem"
        - "\\syˢtem"
        - "\\ˢyˢtem"
        - "\\ˢam"
        - "\\ˢecurity"
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_flag:
        CommandLine|contains:
        - ' save '
        - ' export '
        - " \u02E2ave "
        - " e\u02E3port "
      selection_cli_hklm:
        CommandLine|contains:
        - hklm
        - "hk\u02EAm"
        - hkey_local_machine
        - "hkey_\u02EAocal_machine"
        - "hkey_loca\u02EA_machine"
        - "hkey_\u02EAoca\u02EA_machine"
      selection_cli_hive:
        CommandLine|contains:
        - \system
        - \sam
        - \security
        - "\\\u02E2ystem"
        - "\\sy\u02E2tem"
        - "\\\u02E2y\u02E2tem"
        - "\\\u02E2am"
        - "\\\u02E2ecurity"
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.baseline_svc
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_flag:
        CommandLine|contains:
        - ' save '
        - ' export '
        - " \u02E2ave "
        - " e\u02E3port "
      selection_cli_hklm:
        CommandLine|contains:
        - hklm
        - "hk\u02EAm"
        - hkey_local_machine
        - "hkey_\u02EAocal_machine"
        - "hkey_loca\u02EA_machine"
        - "hkey_\u02EAoca\u02EA_machine"
      selection_cli_hive:
        CommandLine|contains:
        - \system
        - \sam
        - \security
        - "\\\u02E2ystem"
        - "\\sy\u02E2tem"
        - "\\\u02E2y\u02E2tem"
        - "\\\u02E2am"
        - "\\\u02E2ecurity"
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether credential collection was followed by access to other
    endpoints. If the same user triggered similar activity on multiple hosts in the alert window, the scope of
    compromise may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_flag:
        CommandLine|contains:
        - ' save '
        - ' export '
        - " \u02E2ave "
        - " e\u02E3port "
      selection_cli_hklm:
        CommandLine|contains:
        - hklm
        - "hk\u02EAm"
        - hkey_local_machine
        - "hkey_\u02EAocal_machine"
        - "hkey_loca\u02EA_machine"
        - "hkey_\u02EAoca\u02EA_machine"
      selection_cli_hive:
        CommandLine|contains:
        - \system
        - \sam
        - \security
        - "\\\u02E2ystem"
        - "\\sy\u02E2tem"
        - "\\\u02E2y\u02E2tem"
        - "\\\u02E2am"
        - "\\\u02E2ecurity"
      _pb_scope:
        process.parent.name|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- source: template:lolbin.technique_class_lateral
  question: Were other credential-dumping LOLBins used on this host recently?
  context: >-
    Operators who export hives with reg.exe often reach for other living-off-the-land tools toward the same
    credential-access objective — esentutl or ntdsutil for NTDS.dit, vssadmin or diskshadow to snapshot locked hives,
    or wmic for shadow-copy creation. Finding several of these performing the same objective strengthens the case that
    the reg.exe dump is part of deliberate credential theft.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\esentutl.exe'
          - '\ntdsutil.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\wmic.exe'
          - '\wbadmin.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- source: template:lolbin.renamed_binary_check
  question: Was this reg.exe executed from its expected System32 or SysWOW64 path?
  context: >-
    The rule matches on OriginalFileName as well as image name, so a renamed copy of reg.exe still fires. A reg.exe
    running from a user temp directory, a download folder, or another non-standard path may have been copied to evade
    path-based allowlists, and is more suspicious than one in System32 or SysWOW64.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:lolbin.historical_lolbin_baseline
  question: How often has this host fired the hive-dump pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A hive-export pattern with no prior history on a host is more suspicious than one used regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's
    specific firing pattern rather than generic reg.exe usage. The command-line projection lets the analyst compare
    typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_flag:
        CommandLine|contains:
        - ' save '
        - ' export '
        - " ˢave "
        - " eˣport "
      selection_cli_hklm:
        CommandLine|contains:
        - hklm
        - "hk˪m"
        - hkey_local_machine
        - "hkey_˪ocal_machine"
        - "hkey_loca˪_machine"
        - "hkey_˪oca˪_machine"
      selection_cli_hive:
        CommandLine|contains:
        - \system
        - \sam
        - \security
        - "\\ˢystem"
        - "\\syˢtem"
        - "\\ˢyˢtem"
        - "\\ˢam"
        - "\\ˢecurity"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
_generation_meta:
  has_attack_brief: true
  techniques:
    - id: T1003.002
      name: Security Account Manager
      role: primary
    - id: T1003.004
      name: LSA Secrets
      role: secondary
    - id: T1003.005
      name: Cached Domain Credentials
      role: secondary
    - id: T1003
      name: OS Credential Dumping
      role: secondary
  attack_chain_coverage:
    - stage: 1
      label: hive_export_execution
      description: "reg.exe saves or exports SAM/SYSTEM/SECURITY from HKLM"
      mapped_to: Q4
      source: template:credential_access.credential_target_identification
    - stage: 2
      label: dump_file_artifact
      description: "Hive contents written to a .save/.hiv or sam/system/security file for offline extraction"
      mapped_to: Q7
      source: attack:T1003.002.tuning_parameter
    - stage: 3
      label: parallel_memory_access
      description: "Direct LSASS handle access as a parallel credential-access path (T1003.004 memory scraping)"
      mapped_to: Q6
      source: attack:T1003.004.access_verification
    - stage: 4
      label: credential_reuse
      description: "Stolen credentials used for lateral movement / new logon sessions"
      mapped_to: Q10
      source: template:credential_access.post_access_lateral_movement
  dimension_coverage:
    - dimension: command_analysis
      technique: T1003.002
      covered_by: Q4
      source: template:credential_access.credential_target_identification
      coverage_type: direct
    - dimension: parent_process_analysis
      technique: T1003.002
      covered_by: Q5
      source: template:cue_process_tool.process_chain
      coverage_type: direct
    - dimension: time_correlation
      technique: T1003.002
      covered_by: Q10
      source: template:credential_access.post_access_lateral_movement
      coverage_type: direct
    - dimension: tuning_parameter
      technique: T1003.002
      covered_by: Q7
      source: attack:T1003.002.tuning_parameter
      coverage_type: direct
    - dimension: access_verification
      technique: T1003.004
      covered_by: Q6
      source: attack:T1003.004.access_verification
      coverage_type: direct
  mutable_dispositions:
    - element: CommandLinePattern
      dimension: command_analysis
      specific_values: "reg save, reg.exe save (SAM/SYSTEM hives)"
      disposition: context
      target_question: Q4
      notes: "verify_trigger_match (Q1) is entity-scoped and credential_target_identification (Q4) decodes the verb/hive pattern from the alerting CommandLine; the rule's own selection already enforces the save/export + hive pattern"
    - element: TargetFilePath
      dimension: tuning_parameter
      specific_values: "%TEMP%\\sam.save, C:\\Users\\Public\\*.dmp, .save/.hiv"
      disposition: query_injection
      target_question: Q7
      notes: "Injected into file_event TargetFilename|contains: .save/.hiv and \\sam/\\system/\\security"
    - element: RegistryPath
      dimension: tuning_parameter
      specific_values: "HKLM\\SAM, HKLM\\SYSTEM, HKLM\\SECURITY"
      disposition: context
      target_question: Q4
      notes: "Hive roots are the rule's own selection_cli_hklm/selection_cli_hive criteria; analyst reads which hives from the decoded CommandLine"
    - element: TimeWindow
      dimension: time_correlation
      specific_values: "3-minute gap between SAM and SYSTEM dumps"
      disposition: context
      target_question: Q4
      notes: "Threshold not directly queryable; sequential-hive intent surfaced via credential_target_identification context (were all three taken together)"
    - element: ParentProcessName
      dimension: parent_process_analysis
      specific_values: "rationale only (suppress known-good backup tools)"
      disposition: context
      target_question: Q5
      notes: "process_chain question evaluates the parent against expected backup/forensic tooling"
    - element: AccessMask
      dimension: access_verification
      specific_values: "0x1F0FFF (full access to LSASS)"
      disposition: new_question
      target_question: Q6
      notes: "GrantedAccess projected in the process_access LSASS question for the analyst to evaluate the access mask"
    - element: TargetObject
      dimension: tuning_parameter
      specific_values: "HKLM\\SECURITY\\Policy\\Secrets"
      disposition: context
      target_question: Q4
      notes: "T1003.004 LSA-secrets registry path; reg.exe export of the SECURITY hive captures Policy\\Secrets, decoded from the CommandLine in credential_target_identification"
    - element: ImageLoaded
      dimension: tuning_parameter
      specific_values: "lsasrv.dll, sechost.dll"
      disposition: blocked_query
      target_question: Q6
      notes: "image_load coverage declined (see hint_dispositions); the memory-scraping path it implies is surfaced via the process_access LSASS handle question instead"
  dedup_decisions:
