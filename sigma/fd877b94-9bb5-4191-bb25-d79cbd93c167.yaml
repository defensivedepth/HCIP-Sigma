      reason: "replaced_by credential_access.credential_target_identification (and registry.registry_key_context per hints)"
    - template: registry.registry_key_context
      reason: "query logsource is registry_set scoped by ProcessGuid; reg.exe save/export READS hives and emits no registry_set write linked to this process, so the query returns nothing. credential_access.credential_target_identification (Q4) provides the analysis-phase decode instead"
    - template: cue_process_tool.follow_on
      reason: "reg.exe save/export performs a read and does not spawn meaningful children; child-process analysis adds no investigative value for this rule"
    - template: cue_process_tool.clustering
      reason: "broad host-wide tool sweep covered by lolbin.technique_class_lateral (credential-dump LOLBins) and the user-actor clustering pair"
    - template: cue_host_context.clustering
