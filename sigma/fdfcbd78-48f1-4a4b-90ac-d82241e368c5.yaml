name: PsExec Service Execution
id: 670c3682-52ec-4a4b-b4ca-78ec9ce56da7
description: |
  Detects the launch of the PSEXESVC service binary, which is dropped to C:\Windows\PSEXESVC.exe and registered as a Windows service when a system is the target of a PsExec remote execution. The rule fires when a process whose Image is C:\Windows\PSEXESVC.exe or whose OriginalFileName is psexesvc.exe starts. Legitimately this reflects an administrator running PsExec for remote management; in intrusions the same service is the canonical lateral-movement and SYSTEM-execution mechanism. Determine who initiated the remote execution, what was run under the service, and whether the activity spans multiple hosts.
type: detection
detection_id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Is the alerting process the PSEXESVC service binary the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by checking that the process Image is C:\Windows\PSEXESVC.exe or its OriginalFileName is psexesvc.exe. A renamed copy with the original PE metadata still matches on OriginalFileName, so review both fields rather than the path alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- source: template:universal.host_user_context
  question: Is this user and host expected to be the target of PsExec remote execution?
  context: Legitimate administrative tooling can install and start PSEXESVC during routine remote management. Knowing whether the host is normally administered this way, and whether the initiating account is an expected admin, is often the fastest path to separating sanctioned operations from intrusion activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What did the PSEXESVC service run, and what command line did the service binary carry?
  context: PSEXESVC relays the operator's command over named pipes and launches the requested process under its own context. Decode the service binary's command line and inspect what it executed; the SYSTEM-shell pattern (an interactive cmd.exe or powershell.exe child) and any copied payload reveal what the remote caller actually did on this host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: template:cue_process_tool.process_chain
  question: What process spawned the PSEXESVC service binary, and is that parent chain expected?
  context: A service binary started by PsExec is normally launched by services.exe after the Service Control Manager registers it. A parent other than services.exe, or a services.exe whose own ancestry is unusual, points away from a clean PsExec install and toward injection or a tampered service registration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: llm_generated
  question: What child processes did the PSEXESVC service binary spawn afterward?
  context: The processes spawned under the service reveal the actual impact of the remote execution. PsExec is frequently used to run cmd.exe or powershell.exe as SYSTEM, to drop and execute a payload, or to push ransomware; unexpected children of PSEXESVC.exe are the operator's hands-on actions on this host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: llm_generated
  question: Did a network logon from another host precede this service start, and what was the source address?
  context: PsExec reaches the target over SMB to the ADMIN$ share and authenticates before the service is installed, leaving a network (type 3) logon shortly before PSEXESVC starts. Correlating the source address identifies the originating host so the investigation can pivot to where the remote execution was launched from.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - User
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run the PSEXESVC service binary?
  context: A host that has never recorded PSEXESVC.exe is more notable than one routinely administered with PsExec. Zero or very low historical counts indicate first-time or rare remote execution against this system; a steady history suggests sanctioned administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously started PSEXESVC, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even routinely administered hosts have a stable PsExec footprint. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how PSEXESVC specifically has run here. A new parent, an unexpected account, or a first-time appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image: C:\Windows\PSEXESVC.exe
      - OriginalFileName: psexesvc.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally initiate PsExec remote execution?
  context: Compare the alerting account against its historical behavior. An account that has never been associated with PSEXESVC across the environment is more suspicious than one that performs remote administration regularly. User role and typical toolset should align with running services on remote hosts.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-and-binary combination historically routine on this host or across the environment, or is the parent unusual for the PSEXESVC binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: which parent process started PSEXESVC, and whether that pair is historically common. A new or rare parent for this binary is the deviation worth chasing; a pair already accounting for thousands of prior events is sanctioned automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or actions spanning multiple endpoints. If the same account drove PsExec or other activity on several hosts in this window, the scope of the operation may be wider than this single system.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-and-binary combination fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, asking what the user did across the network returns agent-telemetry noise because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism started PSEXESVC on other hosts in the alert window. Multiple hosts point to a scripted or pushed rollout; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts started PSEXESVC in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of PSEXESVC starts. Many hosts starting the service points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image: C:\Windows\PSEXESVC.exe
      - OriginalFileName: psexesvc.exe
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the service start reveals the immediate context: what led to the remote execution, what followed it, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host may reveal the stages that preceded the remote execution. Defense tampering, reconnaissance, or credential access ahead of a PSEXESVC start helps reconstruct how the operator reached this point and whether the activity is part of a multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering often precedes hands-on execution. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal; kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
