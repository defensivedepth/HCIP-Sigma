name: LSASS Process Reconnaissance Via Findstr.EXE
id: ae8e441c-bceb-4161-af6e-395efd7f0ab4
description: |
  Detects find.exe or findstr.exe invoked against the string "lsass", a pattern operators use to resolve the LSASS process ID
  before dumping its memory for credential theft. The rule fires when EITHER the binary is find/findstr with "lsass" on the
  command line, OR the command line matches one of the case-insensitive findstr-lsass forms directly. Legitimate use is rare:
  administrators and monitoring tools occasionally pipe tasklist output through findstr, but searching specifically for lsass
  is almost always reconnaissance preceding credential access. Investigation should confirm the exact command, identify the
  parent and operator, and determine whether LSASS access or credential dumping followed.
type: detection
detection_id: fe63010f-8823-4864-a96b-a7b4a0f7b929
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting command line match this rule's pattern -- find/findstr searching for "lsass", or a direct findstr-lsass form?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires on EITHER of two branches, so
    note which one matched: the binary resolving to find.exe/findstr.exe with "lsass" anywhere on the command line, OR a direct
    case-insensitive findstr-lsass form such as the /i variants. Which branch fired shapes the downstream weight -- a bare
    "findstr lsass" inside a tasklist pipe is the classic PID-resolution recon, while the /i quoted forms suggest a copied
    tradecraft snippet.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run findstr against process names, and is LSASS recon plausible for their role?
  context: >-
    Legitimate administrative scripting can pipe tasklist through findstr, but searching specifically for lsass is rarely a
    routine operation. Knowing whether the user role and host function (a helpdesk workstation versus a domain controller or
    a developer box) are consistent with the detected behavior is often the fastest path to distinguishing a benign script
    from operator reconnaissance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Was the LSASS process the target, and what was the full command around the findstr invocation?
  context: >-
    Findstr searching for lsass typically resolves the LSASS process ID so a follow-on tool can read or dump its memory. Decode
    the full command line to confirm the target is LSASS (not an unrelated string that contains "lsass"), and check whether
    it was piped from tasklist or another enumeration command. Identifying that LSASS memory is the intended credential store
    determines which accounts may be exposed and what remediation is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: attack:T1552.006.user_context
  question: Did any process open a handle to the LSASS process on this host around the time of the findstr recon?
  context: >-
    Findstr-on-lsass resolves a PID; the next operator step is opening a handle to LSASS to read its memory. Object-access
    auditing records handle requests against the LSASS executable, so a handle open from a non-system, non-security-tool
    process shortly after the recon is the load-bearing follow-on. If object-access auditing for process objects is not
    enabled in this environment, treat zero results as a visibility gap rather than evidence nothing accessed LSASS.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ObjectName|endswith: '\lsass.exe'
      condition: selection
    fields:
      - ProcessName
      - ObjectName
      - AccessMask
      - SubjectUserName
- source: template:cue_process_tool.process_chain
  question: What process spawned this findstr invocation, and is that parent chain expected?
  context: >-
    The parent process reveals how the search was invoked. A findstr launched by cmd.exe inside an interactive shell session
    or a tasklist pipe is the common recon shape; a parent such as a remote-execution service, a script host, or an Office
    application points toward an automated or operator-driven sequence. Walk up to what spawned the parent to reconstruct the
    invocation path.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run find.exe or findstr.exe?
  context: >-
    find and findstr are common built-ins, so raw counts will rarely be zero -- but the analyst can still gauge whether this
    host runs them at all and at what cadence. A host that almost never invokes findstr makes a sudden lsass search more notable.
    Pair the count with the parent and user distribution to judge whether this fits established usage.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired the findstr-lsass pattern, what parents and users drove it, and does this alert fit?
  context: >-
    Even common built-ins get abused. This query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how the findstr-lsass pattern specifically (not generic findstr usage) has run here.
    A new parent process, an unexpected user account, or an unusual command shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains: lsass
      selection_special:
        CommandLine|contains|windash:
        - ' /i "lsass'
        - ' /i lsass.exe'
        - findstr "lsass
        - findstr lsass
        - findstr.exe "lsass
        - findstr.exe lsass
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_findstr_* or selection_special) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this findstr invocation spawn afterward?
  context: >-
    findstr itself is a leaf process, but the surrounding shell often launches the next stage. Processes appearing on this
    host right after the recon -- procdump, rundll32 invoking comsvcs.dll, taskmgr, a custom dumper, or a script host -- reveal
    whether the PID lookup fed an actual LSASS memory dump.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.scope
  question: Have other hosts fired the findstr-lsass pattern in the past week, and does the spread look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the findstr-lsass pattern
    rather than generic findstr usage. Many hosts firing the same pattern points to a scripted or deployed tool; one host or
    a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains: lsass
      selection_special:
        CommandLine|contains|windash:
        - ' /i "lsass'
        - ' /i lsass.exe'
        - findstr "lsass
        - findstr lsass
        - findstr.exe "lsass
        - findstr.exe lsass
      condition: all of selection_findstr_* or selection_special
    fields:
    - host.name
- source: template:cue_user_actor.baseline
  question: Does this user normally run find or findstr for process enumeration?
  context: >-
    Compare this user's current action against their historical behavior across the environment. A user who has never run
    findstr against process names is more suspicious than one who scripts it regularly. The user role and typical toolset
    should align with searching for a process ID.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and findstr combination historically routine on this host or across the environment, or is the parent unusual?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the
    launch mechanism -- which parent process spawned findstr, and whether that pair is historically common. A new or rare parent
    for findstr on this host or environment-wide is the deviation worth chasing; a pair that already accounts for thousands
    of prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple endpoints.
    If the same user triggered similar recon or credential-access behavior on multiple hosts, the scope of compromise may be
    larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and findstr combination fire on other hosts in the same window -- a coordinated rollout, or isolated to this host?
  context: >-
    Under a service principal, asking what else the user did network-wide returns agent-telemetry noise, since every host runs
    system-owned agents constantly. The meaningful question is whether the same launch mechanism -- parent process plus spawned
    binary -- fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: >-
    Reconnaissance rarely occurs in isolation. Examining activity around the alert reveals the immediate context -- what led
    to the findstr recon and what happened after. Look for other enumeration commands, privilege escalation, or credential-dumping
    tooling that surrounds the PID lookup.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- defense tampering, broader reconnaissance, or initial access -- may reveal the attack
    stages that preceded the LSASS PID lookup and help reconstruct the timeline. Recon for credential access usually sits in
    the middle of an operation, so prior alerts often explain how the operator arrived here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: >-
    LSASS reconnaissance is a precursor to credential theft, which is typically followed by lateral movement using the stolen
    credentials. Detecting new logon events or outbound remote connections shortly after the recon -- RDP, SMB, WinRM, or
    PsExec activity -- indicates the operator may already be using harvested credentials.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised if LSASS was dumped, and do any have elevated privileges?
  context: >-
    The severity of LSASS credential theft depends on which sessions are live in memory. Domain admin or service-account
    credentials cached in LSASS on this host require incident escalation; a standalone workstation with only a standard user
    logged on is lower impact. Cross-reference the accounts that have logged on to this host with their group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: >-
    Operators frequently weaken AV/EDR before credential access so a memory dump or dumper tool is not blocked or alerted.
    The query surfaces direct attempts to disable protection services, add exclusions, clear logs, or patch AMSI/ETW. Zero
    rows is a useful "protection looks healthy" signal -- kernel-level driver tampering and in-memory patches will not appear
    here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to
    identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
