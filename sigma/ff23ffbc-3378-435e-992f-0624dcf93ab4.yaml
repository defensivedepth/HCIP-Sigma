name: HackTool - PurpleSharp Execution
id: 1a440885-6301-4e82-ae17-25450e983143
description: |
  Detects execution of the PurpleSharp adversary-simulation tool. The rule fires when EITHER the process Image path contains "purplesharp" or the OriginalFileName is "PurpleSharp.exe", OR the command line contains "PurpleSharp" or the marker string "xyz123456.exe" — at least one branch is enough to fire. PurpleSharp is an open-source tool that generates attacker telemetry by replaying a catalog of ATT&CK techniques, so it is frequently run intentionally during authorized purple-team and detection-engineering exercises; the investigation should first establish whether the execution was sanctioned and, if not, treat the host as having had a broad set of simulated techniques replayed against it.
type: detection
detection_id: ff23ffbc-3378-435e-992f-0624dcf93ab4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the alerting event match the rule's pattern — either a PurpleSharp Image/OriginalFileName or a PurpleSharp command-line marker?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires on either of two independent branches: the Image path contains "purplesharp" or the OriginalFileName is PurpleSharp.exe, OR the command line contains "PurpleSharp" or the marker "xyz123456.exe". Note which branch matched — a renamed binary that matched only on command line behaves differently downstream than one that matched on the original file name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to run an adversary-simulation tool?
  context: Adversary-simulation tooling is normally run by red teams, detection engineers, or security staff on designated lab or test hosts. Knowing whether this user role and host function are consistent with sanctioned simulation work is often the fastest way to separate an authorized exercise from an intrusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:hacking_tool.authorized_engagement
  question: Is this PurpleSharp execution part of an authorized penetration test, red team engagement, or purple-team exercise?
  context: PurpleSharp is a defender-facing tool used to generate attack telemetry for building and validating detections, so it commonly appears during sanctioned exercises. Check whether a pentest, red team, or detection-engineering exercise is currently active on this host or network segment. An authorized engagement with matching timing resolves the alert without further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_capability_used
  question: Which PurpleSharp playbook or technique set was invoked in this command line?
  context: PurpleSharp runs a curated set of ATT&CK techniques driven by a playbook argument, spanning execution, persistence, privilege escalation, credential access, discovery, and lateral movement. The command-line arguments and referenced playbook identify which techniques were replayed, which determines what simulated side effects (scheduled tasks, account creation, credential-dump effects, RDP/SMB traffic) the analyst should expect to see on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:hacking_tool.tool_specific_artifacts
  question: Did the PurpleSharp process write any files to disk on this host?
  context: PurpleSharp reads JSON playbook files from disk and its replayed techniques drop characteristic artifacts (scheduled-task definitions, simulated dump output, staged files). Checking files written by this process confirms what executed and reveals the scope of simulated activity even after the original process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- source: template:cue_process_tool.process_chain
  question: What process spawned PurpleSharp, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. A sanctioned exercise typically launches it from an interactive shell (explorer.exe, a console, or a remote-management session) operated by known staff. Unusual parents such as a service, a script host, or an Office application suggest the execution was driven by something other than a hands-on operator.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did PurpleSharp spawn afterward?
  context: PurpleSharp generates telemetry by launching the binaries its techniques exercise — command shells, script hosts, scheduled-task and service utilities, and credential-access simulators. The set of children it spawned reveals which techniques actually ran versus which were merely configured, and confirms the simulated side effects on the host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run PurpleSharp?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Designated detection-engineering or lab hosts may show recurring PurpleSharp executions; a first-time appearance on a production endpoint is the more notable case. Zero or very low historical counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even sanctioned tooling has a normal launch profile. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \purplesharp
      - OriginalFileName: PurpleSharp.exe
      selection_cli:
        CommandLine|contains:
        - xyz123456.exe
        - PurpleSharp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run adversary-simulation tooling?
  context: Compare this user's current action against their historical behavior. A user who has never run this tool is more suspicious than one who does so as part of their role. Detection engineers and red-team staff should show prior history; a general user or service account running it for the first time is the notable case.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent+binary combination historically routine on this host or across the environment, or is the parent unusual for this binary?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism — which parent process spawned this binary, and whether that pair is historically common. A new or rare parent for this binary on this host or environment-wide is the deviation worth chasing; a pair that already accounts for many prior events points to established automation rather than a fresh operator.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the simulation was confined to one endpoint or driven across several. If the same user triggered similar activity on multiple hosts, the scope of the exercise — or of the intrusion — is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent+binary combination fire on other hosts in the same window — a coordinated rollout, or activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — parent process plus spawned binary — fired on other hosts in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.scope
  question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this firing pattern rather than generic binary usage. Many hosts firing the same pattern points to a scripted simulation rollout across the environment; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \purplesharp
      - OriginalFileName: PurpleSharp.exe
      selection_cli:
        CommandLine|contains:
        - xyz123456.exe
        - PurpleSharp
      condition: 1 of selection_*
    fields:
    - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for the binaries the simulation exercised — command shells, scheduling and service utilities, credential-access simulators — and any parent-child pairs that stand out from routine host activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal stages that preceded this event and help reconstruct the timeline. For a tool that replays many techniques, the surrounding alert sequence also helps distinguish a controlled simulation from genuine adversary activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Tampering typically precedes payload execution. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation; review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
