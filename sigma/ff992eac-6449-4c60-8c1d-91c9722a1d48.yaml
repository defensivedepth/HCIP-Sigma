name: New Root Certificate Installed Via CertMgr.EXE
id: 2c29cbae-c1bf-4e4a-9e64-318e6200216d
description: |
  Detects execution of certmgr.exe (Image ending in CertMgr.exe or OriginalFileName CERTMGT.EXE) with a command line
  containing both '/add' and 'root', which installs a certificate into a root trust store. Help desk and IT staff occasionally
  add a corporate root CA this way, so the activity is not inherently malicious; the investigation determines whether this
  was sanctioned. Installing an attacker-controlled root certificate lets subsequently-signed payloads and adversary-controlled
  web servers appear trusted, so confirm who initiated it, what certificate was added, and whether the surrounding activity
  looks like routine administration or operator preparation.
type: detection
detection_id: ff992eac-6449-4c60-8c1d-91c9722a1d48
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line show certmgr.exe adding a certificate to a root store with both '/add' and 'root'?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line
    against the rule's criteria. The rule fires only when the process is certmgr.exe (by Image name or OriginalFileName
    CERTMGT.EXE) AND the command line contains both '/add' and 'root'. Confirm both the binary identity and the presence of
    those arguments, and note the certificate file or thumbprint referenced.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to install root certificates?
  context: Legitimate administrative activity can trigger this detection, since help desk and IT staff occasionally add a
    corporate root CA manually. Knowing whether the user role and host function include certificate administration is often
    the fastest path to distinguishing sanctioned changes from operator activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:cue_process_tool.mechanism_decode
  question: What certificate did certmgr.exe install, and what store and scope were targeted? Decode the full command line.
  context: The full command line reveals which certificate file or thumbprint was added, the target store (root), and the
    scope (current user vs. localMachine). Decode the file path or thumbprint argument to identify the certificate, and note
    whether the scope is machine-wide. The query scopes to all certmgr.exe executions on this host within the window, which
    captures any staging or follow-up certificate operations beyond the single triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- source: attack:T1553.004.cert_store_modification
  question: Did a registry modification to the machine or user root certificate store occur on this host around this time?
  context: Installing a root certificate writes a new entry under the SystemCertificates root store in the registry. Correlating
    the certmgr.exe execution with a registry change to the root store confirms the certificate landed in the trust store
    and identifies the certificate thumbprint that became trusted. A root-store write with no corresponding sanctioned change
    record is the artifact worth chasing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: SystemCertificates\Root\Certificates
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- source: template:cue_process_tool.process_chain
  question: What process spawned certmgr.exe, and is that parent chain expected for certificate installation?
  context: The parent process reveals how certmgr.exe was invoked. Legitimate usage typically has predictable parents such
    as explorer.exe for an interactive admin, a management console, or a deployment agent. Unusual parents such as script
    hosts, Office applications, or a freshly-dropped binary in a temporary directory point to automated or malicious
    invocation rather than hands-on administration.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: template:cue_process_tool.follow_on
  question: What child processes did certmgr.exe spawn afterward?
  context: The processes spawned after a root certificate is installed reveal the actual intent. A standalone administrative
    cert install usually spawns nothing of note, whereas a rogue trust anchor is often followed by execution of newly-trusted
    signed binaries, downloaders, or persistence setup. Unexpected children such as cmd.exe, powershell.exe, or an unsigned
    binary are worth tracing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline
  question: Does this host normally run certmgr.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts over 90 days indicate first-time or rare certmgr.exe execution, which on a non-administrative endpoint
    is unusual.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- source: template:cue_process_tool.baseline_deviation
  question: When this host previously installed root certificates via certmgr.exe, what parents and users drove that activity,
    and does the current alert fit?
  context: Even legitimate tools get abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent
    process, an unexpected user account, or an unusual command-line shape is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \CertMgr.exe
      - OriginalFileName: CERTMGT.EXE
      selection_cli:
        CommandLine|contains|all:
        - /add
        - root
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally install certificates or run certificate-management tools?
  context: Compare this user's current action against their historical behavior. A user who has never run certmgr.exe is
    more suspicious than one who does so regularly as part of their role. Certificate administration should align with the
    user's job function; an end user or service account installing a root certificate is the anomaly.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent and certmgr.exe combination historically routine on this host or across the environment, or is
    the parent unusual for this binary?
  context: When the alert fires under a service principal, user identity does not attribute the behavior. The meaningful pivot
    is the launch mechanism, which parent process spawned certmgr.exe and whether that pair is historically common. A new or
    rare parent for certmgr.exe is the deviation worth chasing; a pair that already accounts for many prior events is vendor
    or deployment automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user installed certificates or ran administrative tools on multiple hosts in this window, the scope of the
    change, or of a possible compromise, may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent and certmgr.exe combination fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism, parent process plus certmgr.exe, fired on other hosts in the
    alert window. Multiple hosts in the same window points to scheduled or pushed automation such as a GPO-driven CA rollout;
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- source: template:cue_process_tool.clustering
  question: What other tools ran on this host around the same time?
  context: Attacks typically involve multiple tools in sequence. Activity surrounding the certificate installation may reveal
    reconnaissance, defense tampering, payload staging, or persistence setup that provides broader context for the
    investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context, what led to
    the certificate installation, what happened after, and whether it is part of a larger sequence. Novel parent-child pairs
    stand out against the high-count repetitive rows in the aggregation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Installing a rogue root certificate is often part of preparing a host to run attacker-signed payloads, and operators
    frequently weaken protection first. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags,
    add broad exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful 'protection looks healthy' signal; kernel-level
    driver tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator
    preparation, so review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts installed root certificates via certmgr.exe in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic certmgr.exe usage. Many hosts firing the same pattern points to scripted deployment or
    a CA rollout; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \CertMgr.exe
      - OriginalFileName: CERTMGT.EXE
      selection_cli:
        CommandLine|contains|all:
        - /add
        - root
      condition: all of selection_*
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering,
    reconnaissance, or credential access, may reveal the attack stages that preceded the certificate installation and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
