name: LSASS Dump Keyword In CommandLine
id: 5be00532-1702-4836-b594-9541a2484055
description: |
  Detects command lines containing keywords associated with dumping the LSASS process to disk, such as the literal strings
  lsass.dmp / lsass.zip / lsass.rar / nanodump / SQLDmpr or the combination of "lsass" and ".dmp" in a single command.
  LSASS process memory holds plaintext credentials and NTLM hashes when Credential Guard is not enabled, so a dump file is
  typically staged for offline extraction with Mimikatz or pypykatz. Legitimate hits are rare (a crash-analysis dump of an
  unrelated process, a file named for testing); the investigation should confirm whether LSASS memory was actually accessed
  and dumped, by whom, and whether the resulting credentials were used to move laterally.
type: detection
detection_id: ffa6861c-4461-4f59-8a41-578c39f3f23e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: '2026-06-06'
questions:
- source: template:universal.verify_trigger_match
  question: Does the command line contain the LSASS dump keywords this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line against
    the rule's criteria. The rule fires on dump-file keywords (lsass.dmp, lsass.zip, lsass.rar, nanodump, SQLDmpr) or the
    pairing of "lsass" with ".dmp" in one command. Read the full command to see which keyword matched and whether it names
    a real LSASS dump or an unrelated artifact that happens to contain the string.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.host_user_context
  question: Is this user and host expected to dump process memory or run credential-access tooling?
  context: Legitimate administrative or crash-analysis activity can produce a dump file, but a routine workstation user dumping
    LSASS is rarely expected. Knowing whether the user role (admin, incident responder, developer) and host function (a debug
    or DFIR workstation versus a general endpoint) fit the detected behavior is often the fastest path to distinguishing a
    sanctioned operation from credential theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- source: template:credential_access.credential_target_identification
  question: Was LSASS memory actually accessed or dumped, and by what method?
  context: The command line reveals which LSASS dumping method was used and whether the dump targets memory or a file on disk.
    Identify the mechanism — procdump, comsvcs.dll MiniDump, nanodump, a SQLDumper variant, or a custom dumper — because the
    method indicates attacker sophistication and which evasion was attempted. A successful dump means the credentials cached
    in LSASS for every account logged on to this host should be treated as exposed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:cue_process_tool.process_chain
  question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the dump command was invoked. A dump launched from explorer.exe or an admin shell
    during sanctioned work looks different from one spawned by office applications, script hosts (wscript.exe, mshta.exe),
    or a remote-execution service (WmiPrvSE.exe, services.exe from a scheduled task) — the latter point to hands-off or remote
    operator activity. Walk up the tree to see what spawned the parent and what else it launched.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- source: attack:T1003.001.access_verification
  question: Did a process open a full-access handle to lsass.exe on this host around the alert time?
  context: The dump-file keyword in the command line is the on-disk artifact; the act of reading LSASS memory shows up
    separately as a handle open against lsass.exe. A handle requested with full access rights (GrantedAccess 0x1F0FFF) from
    a process that is not a known AV/EDR agent corroborates that credential scraping occurred rather than just a file being
    named. Note the source process and whether it matches the command identified in the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains: '0x1f0fff'
      condition: selection
    fields:
      - SourceImage
      - GrantedAccess
      - CallTrace
- source: attack:T1003.001.tuning_parameter
  question: Was a dump file written to disk on this host, and where?
  context: A memory dump typically lands as a file before it is staged for exfiltration. Dump files are commonly written to
    operator-controlled staging paths such as %TEMP% or C:\Windows\Temp under names matching the rule keywords. Locating the
    file, its directory, and its creation time confirms the dump completed and shows where the credential material now sits;
    the gap between the file write and the LSASS handle open establishes the access-to-dump timing of the chain.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - lsass
          - .dmp
          - .mdmp
          - SQLDmpr
          - nanodump
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- source: template:cue_process_tool.follow_on
  question: What child processes did this command spawn afterward?
  context: The processes spawned after the dump reveal its actual impact. A dump followed by compression (a .zip or .rar of
    the output), an upload utility, or a parser like mimikatz/pypykatz indicates the credentials are being staged or extracted,
    not just captured. Predictable, no-child behavior is more consistent with a benign or isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- source: template:cue_process_tool.baseline_deviation
  question: When this host has previously fired this LSASS-dump pattern, what parents and users drove it, and does the current
    alert fit?
  context: Even legitimate tooling can match these keywords. The query mirrors the rule's selection scoped to this host, so
    the resulting parent/user distribution reflects how this specific dump pattern (not generic process activity) has run
    here before. A new parent process, an unexpected user account, or a command shape with no precedent on this host is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains:
        - lsass.dmp
        - lsass.zip
        - lsass.rar
        - Andrew.dmp
        - Coredump.dmp
        - NotLSASS.zip
        - lsass_2
        - lsassdump
        - lsassdmp
      - CommandLine|contains|all:
        - lsass
        - .dmp
      - CommandLine|contains|all:
        - SQLDmpr
        - .mdmp
      - CommandLine|contains|all:
        - nanodump
        - .dmp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- source: template:cue_user_actor.baseline
  question: Does this user normally run LSASS-dump or memory-dumping commands?
  context: Compare this user's current action against their historical behavior. A user who has never issued a dump command
    matching this pattern is more suspicious than one who does so regularly as part of a sanctioned role (DFIR, debugging).
    The query searches for this user matching the dump pattern across all hosts over 90 days; zero or very low counts indicate
    first-time use that should align with the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_pattern:
      - CommandLine|contains:
        - lsass.dmp
        - lsass.zip
        - lsass.rar
        - Andrew.dmp
        - Coredump.dmp
        - NotLSASS.zip
        - lsass_2
        - lsassdump
        - lsassdmp
      - CommandLine|contains|all:
        - lsass
        - .dmp
      - CommandLine|contains|all:
        - SQLDmpr
        - .mdmp
      - CommandLine|contains|all:
        - nanodump
        - .dmp
      condition: selection and selection_pattern
    fields:
      - host.name
- source: template:cue_user_actor.baseline_svc
  question: Is this parent-plus-command combination historically routine on this host or across the environment, or is the
    parent unusual?
  context: When the alert fires under a service principal (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account),
    user identity does not attribute the behavior; the meaningful pivot is the launch mechanism. Which parent process spawned
    the dump command, and is that parent historically common for this kind of command? A new or rare parent for this pattern
    is the deviation worth chasing; a parent that already accounts for many prior dump-pattern events is more likely vendor
    or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
      selection_pattern:
      - CommandLine|contains:
        - lsass.dmp
        - lsass.zip
        - lsass.rar
        - Andrew.dmp
        - Coredump.dmp
        - NotLSASS.zip
        - lsass_2
        - lsassdump
        - lsassdmp
      - CommandLine|contains|all:
        - lsass
        - .dmp
      - CommandLine|contains|all:
        - SQLDmpr
        - .mdmp
      - CommandLine|contains|all:
        - nanodump
        - .dmp
      condition: selection and selection_pattern
    fields:
      - host.name
- source: template:cue_user_actor.clustering
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging on multiple endpoints. If the
    same user triggered dump activity or other hands-on-keyboard actions on several hosts in the same window, the scope of
    compromise is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- source: template:cue_user_actor.clustering_svc
  question: Did this same parent-plus-command combination fire on other hosts in the same window?
  context: Under a service principal, asking what else "this user" did returns agent-telemetry noise because every host runs
    SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism — the parent process spawning
    a dump command matching this pattern — fired on other hosts in the alert window. Multiple hosts point to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        process.parent.name|expand: '%ParentName%'
      selection_pattern:
      - CommandLine|contains:
        - lsass.dmp
        - lsass.zip
        - lsass.rar
        - Andrew.dmp
        - Coredump.dmp
        - NotLSASS.zip
        - lsass_2
        - lsassdump
        - lsassdmp
      - CommandLine|contains|all:
        - lsass
        - .dmp
      - CommandLine|contains|all:
        - SQLDmpr
        - .mdmp
      - CommandLine|contains|all:
        - nanodump
        - .dmp
      condition: selection and selection_pattern
    fields:
      - host.name
- source: template:cue_host_context.clustering
  question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led
    to the dump command, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or staging that brackets the credential-access event.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- source: template:credential_access.post_access_lateral_movement
  question: Were any new logon sessions or remote connections initiated after this event?
  context: Credential theft from LSASS is typically followed by lateral movement using the stolen accounts. Follow-on alerts
    on this host that indicate RDP sessions, SMB connections, WinRM usage, or PsExec shortly after the dump suggest the
    captured credentials are already being exercised. The timing between the dump and the first new session frames how urgent
    containment is.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- source: template:credential_access.credential_exposure_assessment
  question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of an LSASS dump depends on which accounts had sessions on this host when memory was captured. Every
    account logged on — interactive, service, or cached — may have credentials in the dump. Domain admin or service accounts
    with broad access require incident escalation; a standalone standard user may only need monitoring. Cross-reference the
    logged-on accounts with directory group memberships.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- source: template:universal.endpoint_protection_health
  question: Were any tamper attempts against endpoint protection seen on this host in the hour before the alert?
  context: Operators frequently weaken AV/EDR before dumping LSASS, since most protection products flag direct LSASS access
    and .dmp creation. The query surfaces direct attempts to disable AV/EDR services, flip Defender flags, add broad
    exclusions, clear logs, or patch AMSI/ETW. Zero rows is a useful "protection looks healthy" signal — kernel-level driver
    tampering and in-memory patches will not appear here. Populated rows shift the disposition toward operator preparation;
    review the parent process and signing chain to identify the writer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_defender_disable:
        CommandLine|contains:
          - 'Set-MpPreference -Disable'
          - 'Set-MpPreference -MAPSReporting Disabled'
          - 'Set-MpPreference -SubmitSamplesConsent NeverSend'
          - 'Set-MpPreference -PUAProtection Disabled'
          - 'Set-MpPreference -ScanScheduleDay Never'
          - 'MpCmdRun.exe -RemoveDefinitions'
          - 'MpCmdRun.exe -DisableIOAVProtection'
      selection_exclusions:
        CommandLine|contains:
          - 'Add-MpPreference -ExclusionPath'
          - 'Add-MpPreference -ExclusionProcess'
          - 'Add-MpPreference -ExclusionExtension'
          - 'Add-MpPreference -ExclusionIpAddress'
      selection_service_tamper:
        - CommandLine|contains|all:
            - 'config'
            - 'start='
            - 'disabled'
        - CommandLine|contains:
            - 'Stop-Service '
            - 'Remove-Service '
            - 'sc stop '
            - 'sc delete '
            - 'net stop '
            - 'taskkill /F /IM '
            - 'taskkill /IM '
      selection_service_names:
        CommandLine|contains:
          - 'WinDefend'
          - 'WdNisSvc'
          - 'Sense'
          - 'SecurityHealthService'
          - 'mssecflt'
          - 'mpssvc'
          - 'MsMpEng'
          - 'MsSense'
          - 'CSFalconService'
          - 'CSAgent'
          - 'SentinelAgent'
          - 'SentinelHelperService'
          - 'SentinelStaticEngine'
          - 'LogProcessorService'
          - 'elastic-endpoint'
          - 'ElasticEndpoint'
          - 'Elastic Agent'
          - 'AVP'
          - 'klnagent'
          - 'KAVFS'
          - 'CbDefense'
          - 'CarbonBlack'
          - 'McAfeeFramework'
          - 'McShield'
          - 'McTaskManager'
          - 'mfemms'
          - 'mfevtp'
          - 'mfefire'
          - 'masvc'
          - 'macmnsvc'
          - 'TmListen'
          - 'ntrtscan'
          - 'TmCCSF'
          - 'SepMasterService'
          - 'SmcService'
          - 'ccSvcHst'
          - 'SAVService'
          - 'SAVAdminService'
          - 'Sophos Endpoint Defense'
          - 'hmpalertsvc'
          - 'CylanceSvc'
          - 'CyOptics'
      selection_log_tamper:
        - CommandLine|contains:
            - 'wevtutil cl '
            - 'wevtutil clear-log'
            - 'Clear-EventLog'
            - 'Limit-EventLog'
            - 'auditpol /clear'
            - 'auditpol /remove'
        - CommandLine|contains|all:
            - 'wevtutil sl'
            - '/e:false'
        - CommandLine|contains|all:
            - 'auditpol /set'
            - ':disable'
      selection_amsi_etw:
        CommandLine|contains:
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - 'amsiContext'
          - 'EtwEventWrite'
          - 'NtTraceEvent'
          - 'EventWriteEndpoint'
      condition: selection_host and (selection_defender_disable or selection_exclusions or (selection_service_tamper and selection_service_names) or selection_log_tamper or selection_amsi_etw)
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- source: template:cue_process_tool.scope
  question: Have other hosts fired this LSASS-dump pattern in the past week, and does the distribution look like automation
    or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific
    dump pattern (not generic process activity). Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains:
        - lsass.dmp
        - lsass.zip
        - lsass.rar
        - Andrew.dmp
        - Coredump.dmp
        - NotLSASS.zip
        - lsass_2
        - lsassdump
        - lsassdmp
      - CommandLine|contains|all:
        - lsass
        - .dmp
      - CommandLine|contains|all:
        - SQLDmpr
        - .mdmp
      - CommandLine|contains|all:
        - nanodump
        - .dmp
      condition: selection
    fields:
    - host.name
- source: template:cue_host_context.precursor
  question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    privilege escalation — may reveal the stages that preceded the dump and help reconstruct the timeline. Credential access
    sitting at the end of a chain of prior alerts is a stronger signal than an isolated keyword match.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
